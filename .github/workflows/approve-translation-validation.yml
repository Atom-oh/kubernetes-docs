name: Approve translation validation

on:
  workflow_dispatch:
  # Poll because approval-required runs can omit workflow_run events.
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['PR validation']
    types: [requested, completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  approve:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'docs/translate-sync' &&
       github.event.workflow_run.actor.login == 'github-actions[bot]' &&
       (github.event.action == 'requested' ||
        github.event.workflow_run.conclusion == 'action_required'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Load only the trusted default-branch helper, never PR code or artifacts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { approveTranslationValidation } = await import(
              process.env.GITHUB_WORKSPACE + '/scripts/approve-translation-validation.mjs'
            )
            let run = context.payload.workflow_run
            if (!run) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'pr-validate.yml',
                branch: 'docs/translate-sync',
                event: 'pull_request',
                status: 'action_required',
                per_page: 20
              })
              run = data.workflow_runs.find(candidate =>
                candidate.actor?.login === 'github-actions[bot]' &&
                candidate.head_repository?.id === context.payload.repository.id
              )
            }
            if (!run) {
              core.info('No translation validation runs await approval')
              return
            }
            const result = await approveTranslationValidation({
              github,
              context: {
                ...context,
                repo: context.repo,
                payload: { ...context.payload, workflow_run: run }
              }
            })
            core.info(JSON.stringify(result))
