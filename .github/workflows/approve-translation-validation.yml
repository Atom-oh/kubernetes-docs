name: Approve translation validation

on:
  workflow_run:
    workflows: ['PR validation']
    types: [requested, completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  approve:
    if: >-
      github.event.workflow_run.head_branch == 'docs/translate-sync' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]' &&
      (github.event.action == 'requested' ||
       github.event.workflow_run.conclusion == 'action_required')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Load only the trusted default-branch helper, never PR code or artifacts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { approveTranslationValidation } = await import(
              process.env.GITHUB_WORKSPACE + '/scripts/approve-translation-validation.mjs'
            )
            const result = await approveTranslationValidation({ github, context })
            core.info(JSON.stringify(result))
