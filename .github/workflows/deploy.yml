name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: kubernetes-docs-arm
    env:
      # 2291 pages across 5 locales (ko/en/cn/es/jp) OOM'd the 26Gi pod (heap
      # capped at 26624MB = the full pod request) — V8 hit "Ineffective
      # mark-compacts near heap limit" around 24GiB, because --max-old-space-size
      # only bounds the OLD-SPACE HEAP; RSS also carries buffers/native
      # allocations/Rollup's own off-heap memory, which had zero headroom at
      # heap==pod-request. Moved to a 52Gi pod (r6g.2xlarge node, spot/on-demand)
      # and left ~10GiB of headroom above the heap cap this time instead of
      # matching it to the pod request again.
      NODE_OPTIONS: --max-old-space-size=43008
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v4
      - run: npm ci
      - run: npm run docs:build
      - run: mkdir -p .vitepress/dist/assets && cp assets/*.html .vitepress/dist/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
