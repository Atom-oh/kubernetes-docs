name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A fresh hosted ARM VM (4 CPU / 16 GB for public repositories) avoids
    # self-hosted runner shutdowns interrupting the build before upload.
    runs-on: ubuntu-24.04-arm
    env:
      # All five locales are published, built one after another so VitePress
      # never holds more than one locale graph in a process. Each locale still
      # needs more than Node's default 4GiB heap while rendering Mermaid and
      # the local search index. A single-process 5-locale build OOM'd
      # repeatedly even at 43008MB (RSS scaled with page count regardless of
      # heap cap); per-locale sequencing bounds peak RSS to one locale.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v4
      - run: npm ci
      - run: npm run docs:validate
      - name: Validate networking learning examples
        run: python3 -B -m unittest discover -s examples/networking/foundations -p 'test_*.py' -v
      - run: npm run docs:build
      - run: mkdir -p .vitepress/dist/assets && cp assets/*.html .vitepress/dist/assets/
      # docs.atomai.click gets the whole site (publish-docs-domain below).
      - if: github.ref == 'refs/heads/main'
        run: tar -cf docs-site.tar -C .vitepress/dist .
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site.tar
          retention-days: 1
      # GitHub Pages (www.atomai.click) only forwards visitors to docs.atomai.click
      # (head script in .vitepress/config.ts), so it keeps the ko/en pages and
      # stays near its old size. Its 404 page carries the same script, so
      # cn/jp/es URLs on www still end up on the right docs.atomai.click page.
      - run: rm -rf .vitepress/dist/cn .vitepress/dist/jp .vitepress/dist/es
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publishes the full site to docs.atomai.click (CloudFront + private S3, see infra/ask-docs).
  # A separate job, so a failure here never blocks the GitHub Pages deploy above. GitHub Pages
  # stays up and sends its visitors to docs.atomai.click (head script in .vitepress/config.ts).
  publish-docs-domain:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs-site
      - run: mkdir -p site && tar -xf docs-site/docs-site.tar -C site
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::180294183052:role/kubernetes-docs-github-deploy
          aws-region: us-east-1
      - name: Publish to docs.atomai.click
        env:
          SITE_BUCKET: atomai-docs-site-180294183052-us-east-1
          DISTRIBUTION_ID: EM9WBM64HICQ3
        run: |
          aws s3 sync site "s3://$SITE_BUCKET/kubernetes-docs/" --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/kubernetes-docs/*' --query 'Invalidation.Id' --output text
      - name: Publish the docs Q&A index
        env:
          INDEX_BUCKET: atomai-ask-docs-180294183052-ap-northeast-2
        run: |
          node scripts/build-ask-index.mjs
          aws s3 cp build/ask-index/chunks.json.gz "s3://$INDEX_BUCKET/index/chunks.json.gz" --sse AES256 --region ap-northeast-2 --only-show-errors
