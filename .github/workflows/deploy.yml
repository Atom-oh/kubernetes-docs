name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: kubernetes-docs-arm
    env:
      # 914 pages (ko+en) bundled in one Vite/Rollup process OOM'd at 6/8/10GB
      # heap on the shared runner. Now on a dedicated r8g.large (16GiB) node
      # with a 14Gi pod request; keep heap at the pod request so V8 doesn't
      # try to grow past what the pod is guaranteed.
      NODE_OPTIONS: --max-old-space-size=14336
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v4
      - run: npm ci
      - run: npm run docs:build
      - run: mkdir -p .vitepress/dist/assets && cp assets/*.html .vitepress/dist/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
