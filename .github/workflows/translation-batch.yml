name: GitBook Translation Batch

on:
  workflow_call:
    inputs:
      before:
        type: string
        default: ''
      section:
        type: string
        default: ''
      langs:
        type: string
        default: 'cn jp es'

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: kubernetes-docs-claude-arm
    # Sync and every backfill section share one branch and one writer.
    concurrency:
      group: gitbook-translation-batch
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSLATION_BEFORE: ${{ inputs.before }}
      TRANSLATION_SECTION: ${{ inputs.section }}
      TRANSLATION_LANGUAGES: ${{ inputs.langs || 'cn jp es' }}
      ANTHROPIC_MODEL: us.anthropic.claude-fable-5
      CLAUDE_CODE_USE_BEDROCK: 1
      ANTHROPIC_BEDROCK_BASE_URL: https://bedrock-runtime.us-east-1.amazonaws.com
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify CLIs
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            npm install -g @anthropic-ai/claude-code
          fi
          command -v gh
          command -v kiro-cli

      - name: Preserve pending work in one draft PR on latest main
        run: node scripts/translation-batch.mjs prepare

      - name: Translate queued pages with gpt-6-luna
        run: |
          node scripts/translation-batch.mjs translate
          node scripts/sync-translated-assets.mjs

      - name: Sync backfilled navigation
        if: inputs.section != ''
        run: |
          for LANG in $TRANSLATION_LANGUAGES; do
            python3 scripts/sync-nav.py "$TRANSLATION_SECTION" "$LANG"
          done

      - name: Reconcile main changes before review
        run: |
          node scripts/translation-batch.mjs refresh
          node scripts/sync-translated-assets.mjs
          git add -- cn jp es .github/translation-state.json .github/i18n-heading-map.json

      - name: Quality gate on the complete pending diff
        id: gate
        run: |
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          git diff HEAD -- cn/SUMMARY.md cn/README.md jp/SUMMARY.md jp/README.md \
            es/SUMMARY.md es/README.md .github/i18n-heading-map.json > /tmp/review-diff.txt
          # Avoid SIGPIPE under Actions' pipefail, and include staged new files.
          git diff HEAD -- cn jp es > /tmp/review-content.txt
          head -c 200000 /tmp/review-content.txt >> /tmp/review-diff.txt
          {
            cat <<'PROMPT'
          Review this pending GitBook translation diff against the English source
          files in the working directory. Score 0-100 on markdown structure,
          code fences and link targets preserved, faithful translation, English
          Kubernetes/AWS technical terms, target-language readability, and no
          PII/sensitive data. Chinese/Japanese/Spanish are GitBook mirrors only.
          Navigation is shown in full; the content diff may be truncated.
          Failed or stale translations intentionally keep prior content and stay
          queued. Do not penalize their absence from this diff; still flag any
          other dropped or invented content. Pending destinations:
          PROMPT
            node -e 'console.log(JSON.parse(require("fs").readFileSync(".github/translation-state.json")).pending.join("\n"))'
            printf '\nOutput EXACTLY two lines:\nSCORE: <0-100>\nFEEDBACK: <one sentence>\n'
          } > /tmp/review-prompt.txt
          claude -p "$(cat /tmp/review-prompt.txt)" --output-format text \
            --allowedTools "Read" < /tmp/review-diff.txt > /tmp/review-result.txt || true
          cat /tmp/review-result.txt
          score=$(grep -oE 'SCORE:[[:space:]]*[0-9]+' /tmp/review-result.txt | head -1 | grep -oE '[0-9]+' || true)
          if [[ "$score" =~ ^[0-9]+$ ]] && [ "$score" -ge 85 ] && [ "$score" -le 100 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the same PR after quality review
        if: steps.gate.outputs.has_changes == 'true' && steps.gate.outputs.passed == 'true'
        run: node scripts/translation-batch.mjs publish

      - name: Retain draft and retry queue when review fails
        if: steps.gate.outputs.has_changes == 'true' && steps.gate.outputs.passed == 'false'
        run: |
          echo "::warning::Quality score must be 85-100. Pending work remains in the draft PR; re-run Translate Sync to retry."
          exit 1
