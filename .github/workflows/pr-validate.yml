name: PR validation

# Runs the same validation suite deploy.yml runs on main, but at PR time, so
# broken links, missing assets, and ko/en parity gaps fail the PR check
# instead of breaking the Pages deploy after merge.
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'examples/ai-ml/qwen-pii-finetuning/**'
      - 'examples/eks/spot-production/**'
      - '.vitepress/**'
      - '.github/workflows/pr-validate.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  qwen-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      OTEL_SDK_DISABLED: 'true'
    defaults:
      run:
        working-directory: examples/ai-ml/qwen-pii-finetuning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 PyYAML==6.0.3 boto3==1.42.97
      - run: python -m pytest tests -q

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:validate
      - name: Validate Spot experiment measurement tools
        run: python3 -B -m unittest discover -s examples/eks/spot-production -p 'test_*.py'

  build:
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
