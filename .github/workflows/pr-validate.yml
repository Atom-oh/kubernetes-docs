name: PR validation

# Runs the same validation suite deploy.yml runs on main, but at PR time, so
# broken links, missing assets, and ko/en parity gaps fail the PR check
# instead of breaking the Pages deploy after merge.
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.vitepress/**'
      - '.github/workflows/pr-validate.yml'
      - '.github/workflows/deploy.yml'
      - 'examples/eks/spot-production/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:validate
      - name: Validate Spot experiment measurement tools
        run: python3 -B -m unittest discover -s examples/eks/spot-production -p 'test_*.py'

  build:
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
