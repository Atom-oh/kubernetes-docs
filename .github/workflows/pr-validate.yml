name: PR validation

# Runs the same validation suite deploy.yml runs on main, but at PR time, so
# broken links, missing assets, and ko/en parity gaps fail the PR check
# instead of breaking the Pages deploy after merge.
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'examples/ai-ml/qwen-pii-finetuning/**'
      - 'examples/eks/spot-production/**'
      - 'examples/observability/secret-profiles/**'
      - 'examples/platform/**'
      - '.vitepress/**'
      - '.github/workflows/pr-validate.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  observability-secret-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.3
      - run: python -m pip install PyYAML==6.0.3
      - name: Prepare isolated chart paths
        run: |
          printf 'PROMETHEUS_CHART=%s/kube-prometheus-stack-90.0.0.tgz\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DATADOG_CHART=%s/datadog-3.244.0.tgz\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'HELM_CACHE_HOME=%s/helm-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'HELM_CONFIG_HOME=%s/helm-config\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'HELM_DATA_HOME=%s/helm-data\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Fetch pinned public charts
        run: |
          curl --fail --location --retry 3 --output "$PROMETHEUS_CHART" \
            https://github.com/prometheus-community/helm-charts/releases/download/kube-prometheus-stack-90.0.0/kube-prometheus-stack-90.0.0.tgz
          curl --fail --location --retry 3 --output "$DATADOG_CHART" \
            https://github.com/DataDog/helm-charts/releases/download/datadog-3.244.0/datadog-3.244.0.tgz
      - name: Validate offline secret-delivery contracts
        # Tests verify both archive SHA-256 values before Helm reads the charts.
        run: python -B -m unittest discover -s examples/observability/secret-profiles -p 'test_*.py' -v

  replica-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/platform/extensions/policy-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: examples/platform/extensions/policy-tests/go.mod
          cache-dependency-path: examples/platform/extensions/policy-tests/go.sum
      - run: go test ./...

  qwen-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      OTEL_SDK_DISABLED: 'true'
    defaults:
      run:
        working-directory: examples/ai-ml/qwen-pii-finetuning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 PyYAML==6.0.3 boto3==1.42.97
      - run: python -m pytest tests -q

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:validate
      - name: Validate Spot experiment measurement tools
        run: python3 -B -m unittest discover -s examples/eks/spot-production -p 'test_*.py'

  build:
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
