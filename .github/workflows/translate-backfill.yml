name: Translate Backfill (cn/jp/es)

on:
  workflow_dispatch:
    inputs:
      section:
        description: 'Section to backfill (en/<section>/ directory name)'
        required: true
        type: choice
        options:
          - basics
          - kernel
          - core
          - scheduling
          - autoscaling
          - eks
          - eks-hybrid-nodes
          - eks-auto-mode
          - ai-ml
          - data-on-eks
          - storage
          - database
          - blockchain
          - networking
          - service-mesh
          - security
          - platform-engineering
          - gitops
          - ops
          - observability
          - news
      langs:
        description: 'Space-separated language codes to translate into'
        required: false
        default: 'cn jp es'

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    uses: ./.github/workflows/translation-batch.yml
    with:
      section: ${{ inputs.section }}
      langs: ${{ inputs.langs }}
