name: Translate Sync (cn/jp/es)

on:
  push:
    branches: [main]
    paths:
      - 'en/**/*.md'
      - '.github/workflows/translate*.yml'
      - '.github/workflows/translation-batch.yml'
      - 'scripts/translation-batch.mjs'
      - 'scripts/translate.sh'
      - 'scripts/sync-nav.py'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: ./.github/workflows/translation-batch.yml
    with:
      before: ${{ github.event.before || '' }}
