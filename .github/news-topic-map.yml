# Keyword -> doc mapping for the weekly news digest (weekly-news-digest.yml).
#
# When a news item's title/summary matches one of a doc's keywords, that news
# item is a candidate for an in-place update to `ko/<doc>` and `en/<doc>`
# (both, same relative path). No match -> the item only gets a link in
# ko/news/README.md and en/news/README.md's changelog, no doc is touched.
#
# This is deliberately not exhaustive (502 docs total) -- it covers the
# sections most likely to get fast-moving ecosystem news. Add an entry here
# whenever a topic starts showing up in digests with "매칭 문서 없음", or when
# a new SUMMARY.md section is added that should participate in this pipeline.

- keywords: [etcd]
  docs: [core/01-cluster-architecture.md]
- keywords: [kubernetes v1., kubernetes 1., k8s release, kubernetes release]
  docs: [core/01-cluster-architecture.md]
