<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="100%" role="img" aria-labelledby="en-ops-14-tekton-pipelines-2-title en-ops-14-tekton-pipelines-2-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="en-ops-14-tekton-pipelines-2-title">Task dependency graph of a Tekton CI pipeline</title>
    <desc id="en-ops-14-tekton-pipelines-2-desc">Shows git-clone feeding two parallel tasks, lint and unit-test, which both must finish before build-image runs, followed by security-scan and finally deploy.</desc>
    <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ===== Arrows ===== -->
    <!-- git-clone -> lint (own fan point on git-clone's bottom edge) -->
    <path d="M 150,208 V 240 Q 150,248 158,248 H 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- git-clone -> unit-test (second fan point, 60px from the first) -->
    <path d="M 210,208 V 356 Q 210,364 218,364 H 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- lint -> build-image -->
    <path d="M 420,248 H 468 Q 476,248 476,256 V 268" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- unit-test -> build-image -->
    <path d="M 420,364 H 468 Q 476,364 476,356 V 324" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- build-image -> security-scan (headline) -->
    <path d="M 596,296 H 660" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- security-scan -> deploy -->
    <path d="M 740,324 V 340 Q 740,348 748,348 H 800" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Nodes (rectangles = step / action) ===== -->
    <!-- git-clone -->
    <g>
      <rect x="100" y="152" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="100" y="152" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="180" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">git-clone</text>
      <text x="180" y="190" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fetch source</text>
    </g>
    <!-- lint -->
    <g>
      <rect x="260" y="220" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="260" y="220" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="340" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">lint</text>
      <text x="340" y="258" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">static checks</text>
    </g>
    <!-- unit-test -->
    <g>
      <rect x="260" y="336" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="260" y="336" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="340" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">unit-test</text>
      <text x="340" y="374" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">test suite</text>
    </g>
    <!-- build-image (focal: parallel branches converge here) -->
    <g>
      <rect x="476" y="268" width="120" height="56" rx="6" fill="#ffffff"/>
      <rect x="476" y="268" width="120" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="536" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">build-image</text>
      <text x="536" y="306" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docker build</text>
    </g>
    <!-- security-scan -->
    <g>
      <rect x="660" y="268" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="660" y="268" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="740" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">security-scan</text>
      <text x="740" y="306" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vuln scan</text>
    </g>
    <!-- deploy -->
    <g>
      <rect x="640" y="336" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="640" y="336" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="720" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">deploy</text>
      <text x="720" y="374" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">apply manifests</text>
    </g>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="512" width="16" height="2" fill="#545B64"/>
    <text x="64" y="519" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">RUN ORDER</text>
    <rect x="220" y="512" width="16" height="2" fill="#EC7211"/>
    <text x="244" y="519" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">CONVERGENCE POINT</text>
  </svg>