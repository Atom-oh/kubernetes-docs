<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ebpf3-title ebpf3-desc">
    <title id="ebpf3-title">iptables 모드 데이터플레인 아키텍처</title>
    <desc id="ebpf3-desc">Pod의 애플리케이션에서 나온 패킷이 veth를 지나 raw, mangle, nat, filter 4개의 iptables 테이블을 순서대로 통과한 뒤 라우팅 테이블을 거쳐 eth0로 나가는, 규칙이 많아질수록 느려지는 선형 체인을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="32" y="204" width="88" height="152" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="208" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="70" y="217" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">POD</text>

    <rect x="128" y="204" width="800" height="152" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="148" y="208" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="236" y="217" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOST NETWORK STACK</text>

    <rect x="240" y="244" width="468" height="104" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>
    <rect x="256" y="248" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="326" y="257" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">IPTABLES PROCESSING</text>

    <!-- Arrows: straight horizontal chain, same y -->
    <line x1="124" y1="308" x2="148" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="236" y1="308" x2="260" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="324" y1="308" x2="348" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="432" y1="308" x2="456" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="556" y1="308" x2="580" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="688" y1="308" x2="712" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="820" y1="308" x2="844" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: Application (Pod) -->
    <rect x="52" y="276" width="72" height="64" rx="6" fill="#ffffff"/>
    <rect x="52" y="276" width="72" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="88" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">App</text>

    <!-- Node: veth pair -->
    <rect x="148" y="276" width="88" height="64" rx="6" fill="#ffffff"/>
    <rect x="148" y="276" width="88" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="192" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">veth</text>
    <text x="192" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pair</text>

    <!-- Node: raw table -->
    <rect x="260" y="276" width="64" height="64" rx="6" fill="#ffffff"/>
    <rect x="260" y="276" width="64" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="292" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">raw</text>

    <!-- Node: mangle table -->
    <rect x="348" y="276" width="84" height="64" rx="6" fill="#ffffff"/>
    <rect x="348" y="276" width="84" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="390" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">mangle</text>

    <!-- Node: nat table (focal 1/2) -->
    <rect x="456" y="276" width="100" height="64" rx="6" fill="#ffffff"/>
    <rect x="456" y="276" width="100" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="506" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">nat</text>
    <text x="506" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SNAT/DNAT</text>

    <!-- Node: filter table (focal 2/2) -->
    <rect x="580" y="276" width="108" height="64" rx="6" fill="#ffffff"/>
    <rect x="580" y="276" width="108" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="634" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">filter</text>
    <text x="634" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">정책 적용</text>

    <!-- Node: Routing Table -->
    <rect x="712" y="276" width="108" height="64" rx="6" fill="#ffffff"/>
    <rect x="712" y="276" width="108" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="766" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">Routing</text>
    <text x="766" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Table</text>

    <!-- Node: eth0 -->
    <rect x="844" y="276" width="64" height="64" rx="6" fill="#ffffff"/>
    <rect x="844" y="276" width="64" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="876" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">eth0</text>

    <!-- Legend -->
    <line x1="40" y1="420" x2="920" y2="420" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="436" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="448" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="456" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif">규칙 폭발이 발생하는 테이블(선형 검색)</text>
  </svg>