<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="appset-rollout-title appset-rollout-desc">
    <title id="appset-rollout-title">Progressive rollout pipeline</title>
    <desc id="appset-rollout-desc">Diagram showing a progressive-rollout ApplicationSet strategy that promotes a change through a canary cluster, a manual approval gate, a 25% rollout to two production clusters, and finally a full rollout to all six production clusters.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (painted before arrows and nodes) -->
    <rect x="28"  y="140" width="204" height="300" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="60"  y="144" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="130" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">STEP 1 · CANARY</text>

    <rect x="260" y="140" width="204" height="300" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="272" y="144" width="180" height="12" rx="2" fill="#ffffff"/>
    <text x="362" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">STEP 2 · MANUAL GATE</text>

    <rect x="492" y="140" width="204" height="300" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="512" y="144" width="164" height="12" rx="2" fill="#ffffff"/>
    <text x="594" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">STEP 3 · 25% ROLLOUT</text>

    <rect x="724" y="140" width="208" height="300" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="744" y="144" width="168" height="12" rx="2" fill="#ffffff"/>
    <text x="828" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">STEP 4 · FULL ROLLOUT</text>

    <!-- Arrows between stages (straight, same y) -->
    <line x1="232" y1="300" x2="260" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="464" y1="300" x2="492" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="696" y1="300" x2="724" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels: masked, 8px visible gap above the line at y=300 -->
    <rect x="220" y="280" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="246" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SUCCESS</text>

    <rect x="446" y="280" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="478" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>

    <rect x="678" y="280" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="704" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SUCCESS</text>

    <!-- Step 1: canary-cluster (focal) -->
    <rect x="56" y="268" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="56" y="268" width="152" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="64" y="276" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="82" y="285" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">ENTRY</text>
    <text x="132" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">canary-cluster</text>
    <text x="132" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">1 cluster</text>

    <!-- Step 2: manual gate (optional/wait treatment, dashed) -->
    <rect x="288" y="268" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="288" y="268" width="152" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="300" y="291" width="4" height="18" fill="#7D8998"/>
    <rect x="308" y="291" width="4" height="18" fill="#7D8998"/>
    <text x="374" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Paused</text>
    <text x="374" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">awaits approval</text>

    <!-- Step 3: 25% rollout — prod-1, prod-2 -->
    <rect x="520" y="228" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="520" y="228" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="596" y="264" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">prod-1</text>

    <rect x="520" y="308" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="520" y="308" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="596" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">prod-2</text>

    <!-- Step 4: full rollout — prod-3..prod-6 (2x2) -->
    <rect x="752" y="240" width="72" height="56" rx="6" fill="#ffffff"/>
    <rect x="752" y="240" width="72" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="788" y="272" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">prod-3</text>

    <rect x="832" y="240" width="72" height="56" rx="6" fill="#ffffff"/>
    <rect x="832" y="240" width="72" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="868" y="272" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">prod-4</text>

    <rect x="752" y="304" width="72" height="56" rx="6" fill="#ffffff"/>
    <rect x="752" y="304" width="72" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="788" y="336" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">prod-5</text>

    <rect x="832" y="304" width="72" height="56" rx="6" fill="#ffffff"/>
    <rect x="832" y="304" width="72" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="868" y="336" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">prod-6</text>

    <!-- Legend -->
    <line x1="40" y1="480" x2="920" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="508" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="516" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Canary / entry stage</text>

    <rect x="240" y="508" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="260" y="516" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Manual approval gate</text>

    <rect x="460" y="508" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="516" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Production cluster</text>

    <line x1="660" y1="513" x2="688" y2="513" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="696" y="516" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Stage promotion</text>
  </svg>