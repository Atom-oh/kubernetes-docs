<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="argo-rollouts-arch-title argo-rollouts-arch-desc">
      <title id="argo-rollouts-arch-title">Argo Rollouts 아키텍처</title>
      <desc id="argo-rollouts-arch-desc">Rollouts 컨트롤러가 블루/그린·카나리·실험 배포 전략을 실행하고, Ingress Controller와 Service Mesh로 트래픽을 내보내며 Analysis Provider가 수집한 지표를 Metrics Server로 전달하는 구조를 보여주는 다이어그램입니다.</desc>
      <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zones (painted first, backgrounds) -->
      <rect x="40" y="24" width="880" height="104" rx="8" fill="#f2f3f3" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
      <text x="52" y="40" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">ARGO ROLLOUTS</text>

      <rect x="40" y="160" width="880" height="104" rx="8" fill="#f2f3f3" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
      <text x="52" y="176" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">배포 전략</text>

      <rect x="40" y="296" width="880" height="104" rx="8" fill="#f2f3f3" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
      <text x="52" y="312" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">통합</text>

      <!-- Arrows (drawn before nodes) -->
      <!-- E1 Controller -> BlueGreen (straight) -->
      <path d="M140,112 V200" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- E2 Controller -> Canary -->
      <path d="M180,112 V160 Q180,168 188,168 H412 Q420,168 420,176 V200" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E3 Controller -> Experiment -->
      <path d="M220,112 V140 Q220,148 228,148 H632 Q640,148 640,156 V200" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E4 Controller -> Analysis -->
      <path d="M250,112 V120 Q250,128 258,128 H752 Q760,128 760,136 V336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E5 BlueGreen -> Ingress (straight) -->
      <path d="M180,248 V336" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- E6 Canary -> Ingress -->
      <path d="M364,248 V284 Q364,292 356,292 H228 Q220,292 220,300 V336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E7 Canary -> ServiceMesh (straight) -->
      <path d="M420,248 V336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E8 Analysis -> Metrics Server (straight, feedback) -->
      <path d="M800,336 V112" fill="none" stroke="#545B64" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Nodes: row 1 (Argo Rollouts) -->
      <rect x="100" y="64" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="100" y="64" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.4"/>
      <text x="180" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rollouts Controller</text>

      <rect x="700" y="64" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="780" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics Server</text>

      <!-- Nodes: row 2 (배포 전략) -->
      <rect x="100" y="200" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="180" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">블루/그린</text>

      <rect x="340" y="200" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="420" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">카나리</text>

      <rect x="560" y="200" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="640" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">실험</text>

      <!-- Nodes: row 3 (통합) -->
      <rect x="100" y="336" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="180" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Ingress Controller</text>

      <rect x="340" y="336" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="420" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service Mesh</text>

      <rect x="700" y="336" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="780" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Analysis Provider</text>

      <!-- Legend -->
      <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND</text>

      <rect x="40" y="472" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.4"/>
      <text x="72" y="482" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Rollouts Controller (허브)</text>

      <rect x="260" y="472" width="24" height="12" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="292" y="482" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">구성 요소</text>

      <line x1="460" y1="478" x2="488" y2="478" stroke="#545B64" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="496" y="482" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">지표 피드백</text>
    </svg>