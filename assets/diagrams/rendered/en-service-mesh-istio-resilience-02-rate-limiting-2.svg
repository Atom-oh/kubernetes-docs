<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rl-global-title rl-global-desc">
      <title id="rl-global-title">Global rate limiting architecture</title>
      <desc id="rl-global-desc">Architecture diagram showing clients sending requests through an Istio ingress gateway that checks a centralized rate limit server backed by an in-memory cache before forwarding allowed traffic to backend services.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zone: Clients -->
      <rect x="40" y="60" width="180" height="300" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="90" y="64" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="130" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENTS</text>

      <!-- Zone: Backend Services -->
      <rect x="740" y="60" width="180" height="300" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="770" y="64" width="120" height="12" rx="2" fill="#ffffff"/>
      <text x="830" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BACKEND SERVICES</text>

      <!-- Zone: Rate Limit Service -->
      <rect x="340" y="400" width="320" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="410" y="404" width="180" height="12" rx="2" fill="#ffffff"/>
      <text x="500" y="413" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RATE LIMIT SERVICE</text>

      <!-- Arrows (behind boxes) -->
      <!-- C1 -> IG (down elbow) -->
      <path d="M 196,120 H 260 Q 268,120 268,128 V 190 Q 268,198 276,198 H 340"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- C2 -> IG (straight) -->
      <line x1="196" y1="220" x2="340" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- C3 -> IG (up elbow) -->
      <path d="M 196,320 H 260 Q 268,320 268,312 V 250 Q 268,242 276,242 H 340"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- IG -> Service A (up elbow, accent) -->
      <path d="M 500,200 H 624 Q 632,200 632,192 V 188 Q 632,180 640,180 H 764"
            fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- IG -> Service B (down elbow, accent) -->
      <path d="M 500,240 H 624 Q 632,240 632,248 V 252 Q 632,260 640,260 H 764"
            fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- IG -> RLS: check request (straight vertical) -->
      <line x1="396" y1="264" x2="396" y2="432" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- RLS -> IG: allow/deny response (straight vertical, reverse) -->
      <line x1="444" y1="432" x2="444" y2="264" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- RLS -.-> Cache (dashed horizontal) -->
      <line x1="486" y1="464" x2="524" y2="464" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="358" y="338" width="30" height="12" rx="2" fill="#ffffff"/>
      <text x="373" y="347" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK</text>

      <rect x="452" y="338" width="34" height="12" rx="2" fill="#ffffff"/>
      <text x="469" y="347" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>

      <rect x="490" y="444" width="30" height="12" rx="2" fill="#ffffff"/>
      <text x="505" y="453" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE</text>

      <!-- Node: Client 1 -->
      <rect x="64" y="92" width="132" height="56" rx="6" fill="#ffffff"/>
      <rect x="64" y="92" width="132" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="130" y="118" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Client 1</text>
      <text x="130" y="134" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">request</text>

      <!-- Node: Client 2 -->
      <rect x="64" y="192" width="132" height="56" rx="6" fill="#ffffff"/>
      <rect x="64" y="192" width="132" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="130" y="218" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Client 2</text>
      <text x="130" y="234" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">request</text>

      <!-- Node: Client 3 -->
      <rect x="64" y="292" width="132" height="56" rx="6" fill="#ffffff"/>
      <rect x="64" y="292" width="132" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="130" y="318" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Client 3</text>
      <text x="130" y="334" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">request</text>

      <!-- Node: Ingress Gateway (focal) -->
      <rect x="340" y="176" width="160" height="88" rx="6" fill="#ffffff"/>
      <rect x="340" y="176" width="160" height="88" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <rect x="348" y="184" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
      <text x="366" y="193" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
      <text x="420" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Ingress Gateway</text>
      <text x="420" y="240" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Envoy proxy</text>

      <!-- Node: Service A -->
      <rect x="764" y="148" width="132" height="64" rx="6" fill="#ffffff"/>
      <rect x="764" y="148" width="132" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="830" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Service A</text>
      <text x="830" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">backend</text>

      <!-- Node: Service B -->
      <rect x="764" y="228" width="132" height="64" rx="6" fill="#ffffff"/>
      <rect x="764" y="228" width="132" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="830" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Service B</text>
      <text x="830" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">backend</text>

      <!-- Node: Rate Limit Server (external) -->
      <rect x="354" y="432" width="132" height="64" rx="6" fill="#ffffff"/>
      <rect x="354" y="432" width="132" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="420" y="460" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Rate Limit Server</text>
      <text x="420" y="476" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">envoyproxy/ratelimit</text>

      <!-- Node: Cache (store) -->
      <rect x="524" y="432" width="112" height="64" rx="6" fill="#ffffff"/>
      <rect x="524" y="432" width="112" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="580" y="460" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Cache</text>
      <text x="580" y="476" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in-memory</text>

      <!-- Legend strip -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="568" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="60" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Client</text>

      <rect x="150" y="568" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="170" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Gateway (focal)</text>

      <rect x="308" y="568" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="328" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">External service</text>

      <rect x="452" y="568" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="472" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Cache / store</text>

      <line x1="580" y1="573" x2="608" y2="573" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="616" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">gRPC check</text>

      <line x1="712" y1="573" x2="740" y2="573" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="748" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Cache / response</text>
    </svg>