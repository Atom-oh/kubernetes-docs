    <title id="ko-data-on-eks-flink-03-state-checkpointing-streaming-0-title">Flink 상태 저장과 체크포인트 흐름</title>
    <desc id="ko-data-on-eks-flink-03-state-checkpointing-streaming-0-desc">Kafka 소스 토픽에서 유입된 데이터를 Flink Job의 TaskManager가 RocksDB 상태 백엔드로 처리하면서 주기적으로 S3에 체크포인트를 남기고, 싱크 단계에서 KafkaSink(EXACTLY_ONCE 2PC)와 Dynamic Iceberg Sink 두 갈래로 결과를 내보내는 흐름을 보여주는 다이어그램.</desc>
