<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0title d0desc">
    <title id="d0title">Linkerd 다중 클러스터 서비스 미러링 아키텍처</title>
    <desc id="d0desc">West와 East 두 클러스터가 각각 Service Mirror Controller와 Gateway를 두고, East의 컨트롤러가 West를 감시(Watch)해 미러 서비스를 만들고, 두 클러스터의 Gateway가 mTLS로 연결되어 East의 미러 서비스가 West Gateway로 라우팅되는 구조를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- zones -->
    <rect x="40" y="88" width="420" height="248" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="60" y="92" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="116" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER WEST</text>

    <rect x="500" y="88" width="420" height="248" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="520" y="92" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="576" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER EAST</text>

    <!-- arrows (drawn before nodes) -->
    <!-- SM_W -> SVC_W (unlabeled) -->
    <path d="M230,176 V196 Q230,204 238,204 H332 Q340,204 340,212 V260"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- SM_E -> SVC_E_MIRROR (unlabeled) -->
    <path d="M690,176 V196 Q690,204 698,204 H792 Q800,204 800,212 V260"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- SM_E -> SM_W : Watch -->
    <path d="M610,148 H310" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="428" y="128" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="460" y="137" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">WATCH</text>
    <!-- GW_W <-> GW_E : mTLS (accent, bidirectional) -->
    <path d="M220,288 H520" fill="none" stroke="#EC7211" stroke-width="1.2"
          marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <rect x="338" y="268" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="370" y="277" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">MTLS</text>
    <!-- SVC_E_MIRROR -> GW_W : Route -->
    <path d="M800,316 V348 Q800,356 792,356 H148 Q140,356 140,348 V316"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="446" y="336" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="470" y="345" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

    <!-- Node: SM_W (Service Mirror Controller, West) -->
    <rect x="150" y="120" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="150" y="120" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="158" y="126" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="176" y="135" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
    <text x="230" y="152" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service Mirror</text>
    <text x="230" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">controller.west</text>

    <!-- Node: GW_W (focal) -->
    <rect x="60" y="260" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="60" y="260" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="68" y="266" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,113,17,0.60)" stroke-width="0.8"/>
    <text x="82" y="275" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
    <text x="140" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway (인그레스)</text>
    <text x="140" y="306" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">west</text>

    <!-- Node: SVC_W -->
    <rect x="260" y="260" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="260" y="260" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="268" y="266" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="284" y="275" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="340" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">web-service</text>
    <text x="340" y="306" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">production ns</text>

    <!-- Node: SM_E (Service Mirror Controller, East) -->
    <rect x="610" y="120" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="610" y="120" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="618" y="126" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="636" y="135" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
    <text x="690" y="152" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service Mirror</text>
    <text x="690" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">controller.east</text>

    <!-- Node: GW_E (focal) -->
    <rect x="520" y="260" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="520" y="260" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="528" y="266" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,113,17,0.60)" stroke-width="0.8"/>
    <text x="542" y="275" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
    <text x="600" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway (인그레스)</text>
    <text x="600" y="306" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">east</text>

    <!-- Node: SVC_E_MIRROR -->
    <rect x="720" y="260" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="720" y="260" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="728" y="266" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="744" y="275" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="800" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">web-service-west</text>
    <text x="800" y="306" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">미러 서비스</text>
  </svg>