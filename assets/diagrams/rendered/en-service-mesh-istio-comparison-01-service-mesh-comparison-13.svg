<title id="en-service-mesh-istio-comparison-01-service-mesh-comparison-13-title">Istio Multi-Primary Multi-Cluster</title>
<desc id="en-service-mesh-istio-comparison-01-service-mesh-comparison-13-desc">Diagram of Istio&#x27;s multi-primary multi-cluster model: each cluster runs its own Istiod, the two discover each other&#x27;s services, and workloads across clusters communicate directly over cross-cluster mTLS.</desc>
