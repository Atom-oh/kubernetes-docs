<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tm-pipeline-title tm-pipeline-desc">
    <title id="tm-pipeline-title">End-to-end Istio traffic flow from user to pod</title>
    <desc id="tm-pipeline-desc">A user request enters the ingress Gateway, passes through VirtualService routing (path, header, then weight matching), is shaped by DestinationRule policies (load balancing, circuit breaking, connection pooling), and is finally delivered to one of three backing pods.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ===== Arrows (behind nodes) ===== -->
    <!-- User -> Gateway -->
    <path d="M168,300 H200" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="150" y="252" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="184" y="261" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text>

    <!-- Gateway -> VirtualService Routing -->
    <path d="M320,300 H352" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- VirtualService Routing -> DestinationRule Policies (accent, leads to focal) -->
    <path d="M532,300 H564" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- DestinationRule Policies fan-out -> Pods (3 parallel horizontal lines, same-y = straight) -->
    <path d="M744,250 H768" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M744,300 H768" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M744,350 H768" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- internal micro-sequence arrows inside VirtualService Routing card -->
    <path d="M442,276 V296" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M442,328 V348" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- internal micro-sequence arrows inside DestinationRule Policies card -->
    <path d="M654,276 V296" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M654,328 V348" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== Nodes ===== -->
    <!-- User (input treatment) -->
    <rect x="48" y="272" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="48" y="272" width="120" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="108" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">User</text>

    <!-- Gateway -->
    <rect x="200" y="272" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="200" y="272" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="260" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway</text>
    <text x="260" y="314" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">port 80/443</text>

    <!-- VirtualService Routing (collapsed group of 3) -->
    <rect x="352" y="200" width="180" height="200" rx="6" fill="#ffffff"/>
    <rect x="352" y="200" width="180" height="200" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="442" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VirtualService Routing</text>

    <rect x="366" y="244" width="152" height="32" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="442" y="264" fill="#232F3E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">PATH MATCHING</text>

    <rect x="366" y="296" width="152" height="32" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="442" y="316" fill="#232F3E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">HEADER MATCHING</text>

    <rect x="366" y="348" width="152" height="32" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="442" y="368" fill="#232F3E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">WEIGHT DISTRIBUTION</text>

    <!-- DestinationRule Policies (collapsed group of 3, focal) -->
    <rect x="564" y="200" width="180" height="200" rx="6" fill="#ffffff"/>
    <rect x="564" y="200" width="180" height="200" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="654" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">DestinationRule Policies</text>

    <rect x="578" y="244" width="152" height="32" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="654" y="264" fill="#232F3E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">LOAD BALANCING</text>

    <rect x="578" y="296" width="152" height="32" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="654" y="316" fill="#232F3E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CIRCUIT BREAKER</text>

    <rect x="578" y="348" width="152" height="32" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="654" y="368" fill="#232F3E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CONNECTION POOL</text>

    <!-- Pods (collapsed group of 3, fan-in destinations) -->
    <rect x="768" y="200" width="140" height="200" rx="6" fill="#ffffff"/>
    <rect x="768" y="200" width="140" height="200" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="838" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pods</text>

    <rect x="780" y="234" width="116" height="32" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="838" y="254" fill="#232F3E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">POD V1-1</text>

    <rect x="780" y="284" width="116" height="32" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="838" y="304" fill="#232F3E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">POD V1-2</text>

    <rect x="780" y="334" width="116" height="32" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="838" y="354" fill="#232F3E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">POD V2-1</text>
  </svg>