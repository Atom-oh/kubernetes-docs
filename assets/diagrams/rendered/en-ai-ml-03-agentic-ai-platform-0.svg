<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t0 d0">
<title id="t0">Agentic AI workflow loop</title>
<desc id="d0">An agentic AI system applies four characteristics -- autonomous planning, tool-based execution, iterative improvement, and state/memory management -- onto a goal-plan-execute-evaluate loop that either returns to planning or completes.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- eyebrow + title -->
<text x="40" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">AGENTIC AI</text>
<text x="40" y="60" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Characteristics drive the plan-execute-evaluate loop</text>

<!-- zone: characteristics -->
<rect x="32" y="128" width="216" height="392" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="60" y="132" width="160" height="12" rx="2" fill="#ffffff"/>
<text x="140" y="141" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">CHARACTERISTICS</text>

<!-- arrows behind boxes -->
<!-- Planning -> Plan (straight, y=192) -->
<line x1="228" y1="192" x2="640" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Execution -> Execute (straight, y=304) -->
<line x1="228" y1="304" x2="640" y2="304" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Iteration -> Evaluate (straight, y=416) -->
<line x1="228" y1="416" x2="640" y2="416" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Memory -> Execute (route via right side, entering Execute's right edge) -->
<path d="M228,496 H904 Q912,496 912,488 V312 Q912,304 904,304 H840"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- workflow chain, vertical -->
<line x1="740" y1="96" x2="740" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="740" y1="208" x2="740" y2="264" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="740" y1="320" x2="740" y2="376" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="740" y1="432" x2="740" y2="488" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="716" y="452" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="748" y="461" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">COMPLETE</text>

<!-- loop-back: Evaluate -> Plan -->
<path d="M840,404 H884 Q892,404 892,396 V188 Q892,180 884,180 H840"
      fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="846" y="278" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="870" y="287" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">RETRY</text>

<!-- characteristics nodes -->
<g>
  <rect x="48" y="164" width="180" height="56" rx="6" fill="#ffffff"/>
  <rect x="48" y="164" width="180" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="138" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Autonomous Planning</text>
</g>
<g>
  <rect x="48" y="276" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="138" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tool-based Execution</text>
</g>
<g>
  <rect x="48" y="388" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="138" y="420" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Iterative Improvement</text>
</g>
<g>
  <rect x="48" y="468" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="138" y="494" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">State &amp; Memory</text>
  <text x="138" y="510" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">management</text>
</g>

<!-- workflow nodes -->
<g>
  <rect x="640" y="40" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="740" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Goal Setting</text>
</g>
<g>
  <rect x="640" y="152" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="740" y="184" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Planning</text>
</g>
<g>
  <rect x="640" y="264" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="740" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Execution</text>
</g>
<g>
  <rect x="640" y="376" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="740" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Evaluation</text>
</g>
<g>
  <rect x="640" y="488" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="740" y="520" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Return Result</text>
</g>

<!-- legend -->
<line x1="40" y1="562" x2="920" y2="562" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="578" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="140" y1="574" x2="168" y2="574" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="176" y="578" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">flow</text>
<line x1="240" y1="574" x2="268" y2="574" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="276" y="578" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">loop-back</text>
</svg>