<title id="en-core-01-cluster-architecture-1-title">Container runtime layers</title>
<desc id="en-core-01-cluster-architecture-1-desc">Tree diagram showing Kubernetes calling the Container Runtime Interface, which delegates to containerd or CRI-O, each backed by a low-level runtime (runc or crun).</desc>
