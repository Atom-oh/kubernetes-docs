    <title id="ko-autoscaling-03-knative-3-title">Knative Scale-to-Zero와 콜드 스타트 흐름</title>
    <desc id="ko-autoscaling-03-knative-3-desc">트래픽이 없으면 Autoscaler가 파드를 0으로 줄이고 Activator가 목적지가 되며, 새 요청이 들어오면 Activator가 요청을 버퍼링한 채 Autoscaler에 스케일업을 요청해 파드를 다시 만들고 응답한 뒤에는 이후 요청이 Gateway에서 파드로 직접 전달되는 콜드 스타트 시퀀스를 보여준다.</desc>
