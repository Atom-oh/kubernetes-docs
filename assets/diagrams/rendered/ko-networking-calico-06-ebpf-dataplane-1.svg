<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ebpf1-title ebpf1-desc">
    <title id="ebpf1-title">eBPF 프로그램 실행 구조</title>
    <desc id="ebpf1-desc">사용자 공간에서 작성된 eBPF 프로그램이 libbpf를 통해 커널로 로드되어 Verifier의 안전성 검증과 JIT 컴파일을 거쳐 eBPF VM에서 실행되고, XDP·TC·Socket Ops·Kprobes 같은 Hook Point에 연결되거나 BPF Map을 통해 애플리케이션과 상태를 주고받는 과정을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="28" width="200" height="288" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="60" y="32" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="104" y="41" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">사용자 공간</text>

    <rect x="320" y="116" width="400" height="376" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="340" y="120" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="376" y="129" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">커널 공간</text>

    <!-- Arrows -->
    <line x1="140" y1="124" x2="140" y2="148" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="220" y1="180" x2="340" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="420" y1="212" x2="420" y2="236" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="420" y1="300" x2="420" y2="324" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="500" y1="356" x2="540" y2="356" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="420" y1="388" x2="420" y2="412" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <path d="M 220,268 H 288 Q 296,268 296,276 V 436 Q 296,444 304,444 H 340"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>

    <!-- Arrow label: 검증 통과 (vertical segment, label to the side) -->
    <rect x="430" y="218" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="462" y="227" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">검증 통과</text>

    <!-- Node: eBPF 프로그램 -->
    <rect x="60" y="60" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="60" width="160" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="140" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">eBPF 프로그램</text>
    <text x="140" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">C/Rust 소스</text>

    <!-- Node: libbpf / BCC -->
    <rect x="60" y="148" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="148" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="184" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">libbpf / BCC</text>

    <!-- Node: 애플리케이션 -->
    <rect x="60" y="236" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="236" width="160" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="140" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">애플리케이션</text>

    <!-- Node: eBPF Verifier -->
    <rect x="340" y="148" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="340" y="148" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="420" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">eBPF Verifier</text>
    <text x="420" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">안전성 검증</text>

    <!-- Node: JIT Compiler -->
    <rect x="340" y="236" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="340" y="236" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="420" y="264" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">JIT Compiler</text>
    <text x="420" y="280" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">네이티브 코드 변환</text>

    <!-- Node: eBPF VM (focal) -->
    <rect x="340" y="324" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="340" y="324" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="420" y="352" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">eBPF VM</text>
    <text x="420" y="368" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">프로그램 실행</text>

    <!-- Node: Hook Points (collapsed group) -->
    <rect x="540" y="324" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="540" y="324" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="620" y="352" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">Hook Points</text>
    <text x="620" y="368" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">XDP·TC·Socket·Kprobes</text>

    <!-- Node: BPF Maps -->
    <rect x="340" y="412" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="340" y="412" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="420" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">BPF Maps</text>
    <text x="420" y="456" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">상태 저장소</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="552" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="560" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif">검증된 프로그램이 실제로 실행되는 곳</text>
  </svg>