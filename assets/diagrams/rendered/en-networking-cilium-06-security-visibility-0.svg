<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" width="960" height="600" role="img" aria-labelledby="sec-vis-ttl sec-vis-desc">
<title id="sec-vis-ttl">Cilium Security Layers</title>
<desc id="sec-vis-desc">Traffic passes down through four stacked defense-in-depth layers enforced by Cilium: Network Security (L3/L4 policy, encryption, microsegmentation), Application Security (L7 policy, API-aware filtering, identity-based policy), Threat Detection (Hubble observability, intrusion detection, anomaly detection), and Runtime Security (process monitoring, syscall filtering, container security). Threat Detection is highlighted because Hubble's eBPF-native visibility underlies enforcement at every other layer.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    .name { font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:600; }
    .title { font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:700; }
    .mono { font-family:'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="32" y="32" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">DEFENSE IN DEPTH</text>
<text x="32" y="56" class="title" font-size="20" fill="#232F3E">Cilium Security Layers</text>

<!-- Traffic input node -->
<rect x="420" y="88" width="120" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="108" class="name" font-size="12" fill="#232F3E" text-anchor="middle">Traffic</text>

<!-- entry arrow (vertical, shares x-axis, straight line permitted) -->
<line x1="480" y1="120" x2="480" y2="160" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<!-- Direction indicator, left margin -->
<text x="90" y="148" class="mono" font-size="8" letter-spacing="0.12em" fill="#7D8998" text-anchor="middle">ENFORCE</text>
<line x1="90" y1="168" x2="90" y2="436" stroke="#B6BEC9" stroke-width="1"/>
<polygon points="90,436 85,428 95,428" fill="#B6BEC9"/>

<!-- Outer stack silhouette -->
<rect x="140" y="160" width="680" height="288" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>

<!-- Focal band fill: Threat Detection (304-376) -->
<rect x="140" y="304" width="680" height="72" fill="rgba(255,153,0,0.10)"/>

<!-- Dividers -->
<line x1="140" y1="232" x2="820" y2="232" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
<line x1="140" y1="304" x2="820" y2="304" stroke="#EC7211" stroke-width="1.2"/>
<line x1="140" y1="376" x2="820" y2="376" stroke="#EC7211" stroke-width="1.2"/>

<!-- Layer 1: Network Security -->
<text x="156" y="180" class="mono" font-size="8" letter-spacing="0.1em" fill="#7D8998">L1</text>
<text x="210" y="204" class="name" font-size="14" fill="#232F3E">Network Security</text>
<text x="804" y="204" class="mono" font-size="9" fill="#545B64" text-anchor="end">L3/L4 POLICY &#183; ENCRYPTION &#183; MICROSEGMENTATION</text>

<!-- Layer 2: Application Security -->
<text x="156" y="252" class="mono" font-size="8" letter-spacing="0.1em" fill="#7D8998">L2</text>
<text x="210" y="276" class="name" font-size="14" fill="#232F3E">Application Security</text>
<text x="804" y="276" class="mono" font-size="9" fill="#545B64" text-anchor="end">L7 POLICY &#183; API-AWARE FILTER &#183; IDENTITY POLICY</text>

<!-- Layer 3: Threat Detection (focal) -->
<text x="156" y="324" class="mono" font-size="8" letter-spacing="0.1em" fill="#EC7211">L3</text>
<text x="210" y="348" class="name" font-size="14" fill="#EC7211">Threat Detection</text>
<text x="804" y="348" class="mono" font-size="9" fill="#545B64" text-anchor="end">HUBBLE &#183; INTRUSION DETECTION &#183; ANOMALY DETECTION</text>

<!-- Layer 4: Runtime Security -->
<text x="156" y="396" class="mono" font-size="8" letter-spacing="0.1em" fill="#7D8998">L4</text>
<text x="210" y="420" class="name" font-size="14" fill="#232F3E">Runtime Security</text>
<text x="804" y="420" class="mono" font-size="9" fill="#545B64" text-anchor="end">PROCESS MONITOR &#183; SYSCALL FILTER &#183; CONTAINER SEC</text>

<!-- Legend -->
<line x1="32" y1="486" x2="928" y2="486" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="32" y="504" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
<rect x="140" y="497" width="12" height="12" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="160" y="507" class="mono" font-size="9" fill="#545B64">eBPF-native visibility layer (Hubble) underlies every other layer</text>
<rect x="600" y="497" width="12" height="12" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="620" y="507" class="mono" font-size="9" fill="#545B64">Policy enforcement stage</text>

</svg>