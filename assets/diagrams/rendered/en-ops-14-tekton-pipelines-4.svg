<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="100%" role="img" aria-labelledby="en-ops-14-tekton-pipelines-4-title en-ops-14-tekton-pipelines-4-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="en-ops-14-tekton-pipelines-4-title">Sequence of a Tekton Chains signing and attestation flow after a code push</title>
    <desc id="en-ops-14-tekton-pipelines-4-desc">Shows a developer's push triggering a Tekton pipeline that builds and pushes an image, after which Tekton Chains observes the completed TaskRun, generates SLSA provenance, signs it with Cosign, and publishes the signature and attestation to the registry and to Rekor's transparency log.</desc>
    <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Lifelines: Dev=90, Git=250, Tekton=415, Chains=580, ECR=740, Rekor=885 (all within the 20-940 safe area) -->
    <line x1="90" y1="100" x2="90" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="250" y1="100" x2="250" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="415" y1="100" x2="415" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="580" y1="100" x2="580" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="740" y1="100" x2="740" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="885" y1="100" x2="885" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="246" y="176" width="8" height="212" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="411" y="204" width="8" height="152" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="576" y="384" width="8" height="140" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- ===== Messages ===== -->
    <!-- Dev -> Git: Push code -->
    <path d="M 90,176 H 250" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="135" y="160" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="170" y="169" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PUSH CODE</text>

    <!-- Git -> Tekton: Webhook trigger -->
    <path d="M 250,204 H 415" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="288" y="188" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="333" y="197" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WEBHOOK TRIGGER</text>

    <!-- Tekton self-message: Build image (TaskRun) -->
    <path d="M 419,232 H 455 Q 463,232 463,240 V 244 Q 463,252 455,252 H 419" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="425" y="216" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="473" y="225" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">BUILD IMAGE (RUN)</text>

    <!-- Tekton -> ECR: Push image -->
    <path d="M 415,280 H 740" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="543" y="264" width="66" height="12" rx="2" fill="#ffffff"/>
    <text x="576" y="273" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PUSH IMAGE</text>

    <!-- Tekton self-message: TaskRun completes -->
    <path d="M 419,308 H 455 Q 463,308 463,316 V 320 Q 463,328 455,328 H 419" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="425" y="332" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="481" y="341" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">TASKRUN COMPLETES</text>

    <!-- Chains -> Tekton: Observe TaskRun completion -->
    <path d="M 580,384 H 415" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="455" y="368" width="118" height="12" rx="2" fill="#ffffff"/>
    <text x="514" y="377" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">OBSERVES COMPLETION</text>

    <!-- Chains self-message: Generate SLSA provenance -->
    <path d="M 584,412 H 620 Q 628,412 628,420 V 424 Q 628,432 620,432 H 584" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="590" y="396" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="654" y="405" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">GENERATE PROVENANCE</text>

    <!-- Chains self-message: Sign with Cosign (headline) -->
    <path d="M 584,460 H 620 Q 628,460 628,468 V 472 Q 628,480 620,480 H 584" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="590" y="444" width="98" height="12" rx="2" fill="#ffffff"/>
    <text x="639" y="453" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SIGN WITH COSIGN</text>

    <!-- Chains -> ECR: Store signature + attestation -->
    <path d="M 584,504 H 740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="611" y="488" width="102" height="12" rx="2" fill="#ffffff"/>
    <text x="662" y="497" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">STORE SIG + ATTEST</text>

    <!-- Chains -> Rekor: Upload to transparency log -->
    <path d="M 580,532 H 885" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="683" y="516" width="98" height="12" rx="2" fill="#ffffff"/>
    <text x="732" y="525" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">UPLOAD TO LOG</text>

    <!-- ===== Actors ===== -->
    <g>
      <rect x="20" y="72" width="140" height="28" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="90" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Developer</text>
    </g>
    <g>
      <rect x="180" y="72" width="140" height="28" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="250" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Git Repository</text>
    </g>
    <g>
      <rect x="340" y="72" width="150" height="28" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="415" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tekton Pipeline</text>
    </g>
    <g>
      <rect x="510" y="72" width="140" height="28" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="580" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tekton Chains</text>
    </g>
    <g>
      <rect x="670" y="72" width="140" height="28" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="740" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Amazon ECR</text>
    </g>
    <g>
      <rect x="830" y="72" width="110" height="28" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="885" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rekor</text>
    </g>

    <!-- Note over ECR / Rekor -->
    <path d="M 660,552 H 920 V 596 H 660 Z" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
    <text x="790" y="565" fill="#545B64" font-size="8" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" text-anchor="middle">Image now carries: layers,</text>
    <text x="790" y="577" fill="#545B64" font-size="8" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" text-anchor="middle">Cosign signature, and an</text>
    <text x="790" y="589" fill="#545B64" font-size="8" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" text-anchor="middle">SLSA provenance attestation</text>
  </svg>