<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="tm-title tm-desc">
  <title id="tm-title">Traffic Management Layers</title>
  <desc id="tm-desc">A request from a client passes down through three Cilium traffic-management layers — L7 Envoy HTTP routing, L4 eBPF load balancing, and L3 eBPF IP routing — before reaching the server, with each layer's additional capabilities shown as supporting tags.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== Zones (bg wash, painted before arrows/nodes) ===== -->
  <rect x="260" y="76" width="468" height="132" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="260" y="224" width="468" height="132" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="260" y="372" width="468" height="132" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>

  <!-- zone eyebrow labels (left-aligned, clear of the x=480 flow column) -->
  <rect x="276" y="84" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="276" y="93" fill="rgba(35,47,62,0.45)" font-size="7" class="mono" letter-spacing="0.14em">L7 &#183; ENVOY</text>

  <rect x="276" y="232" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="276" y="241" fill="rgba(35,47,62,0.45)" font-size="7" class="mono" letter-spacing="0.14em">L4 &#183; EBPF</text>

  <rect x="276" y="380" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="276" y="389" fill="rgba(35,47,62,0.45)" font-size="7" class="mono" letter-spacing="0.14em">L3 &#183; EBPF</text>

  <!-- ===== Arrows (drawn before boxes) ===== -->
  <!-- Client -> HTTP Routing -->
  <path d="M480,60 V132" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- HTTP Routing -> Load Balancing (focal) -->
  <path d="M480,172 V280" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- Load Balancing -> IP Routing -->
  <path d="M480,320 V428" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- IP Routing -> Server -->
  <path d="M480,468 V520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <!-- ===== Client ===== -->
  <rect x="400" y="20" width="160" height="40" rx="6" fill="#ffffff"/>
  <rect x="400" y="20" width="160" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="0.8"/>
  <text x="480" y="44" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Client</text>

  <!-- ===== L7 zone: HTTP Routing (main) + chips ===== -->
  <rect x="380" y="132" width="200" height="40" rx="6" fill="#ffffff"/>
  <rect x="380" y="132" width="200" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="156" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">HTTP Routing</text>

  <g>
    <rect x="600" y="108" width="112" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="656" y="123" fill="#545B64" font-size="9" text-anchor="middle">gRPC Routing</text>
    <rect x="600" y="140" width="112" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="656" y="155" fill="#545B64" font-size="9" text-anchor="middle">TLS Termination</text>
    <rect x="600" y="172" width="112" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="656" y="187" fill="#545B64" font-size="9" text-anchor="middle">Header Manip.</text>
  </g>

  <!-- ===== L4 zone: Load Balancing (focal) + chips ===== -->
  <rect x="380" y="280" width="200" height="40" rx="6" fill="#ffffff"/>
  <rect x="380" y="280" width="200" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="480" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Load Balancing</text>

  <g>
    <rect x="600" y="256" width="112" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="656" y="271" fill="#545B64" font-size="9" text-anchor="middle">Conn. Tracking</text>
    <rect x="600" y="288" width="112" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="656" y="303" fill="#545B64" font-size="9" text-anchor="middle">NAT / SNAT</text>
    <rect x="600" y="320" width="112" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="656" y="335" fill="#545B64" font-size="9" text-anchor="middle">Direct Srv Return</text>
  </g>

  <!-- ===== L3 zone: IP Routing (main) + chips ===== -->
  <rect x="380" y="428" width="200" height="40" rx="6" fill="#ffffff"/>
  <rect x="380" y="428" width="200" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="452" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">IP Routing</text>

  <g>
    <rect x="600" y="420" width="112" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="656" y="435" fill="#545B64" font-size="9" text-anchor="middle">Tunnel/Overlay</text>
    <rect x="600" y="452" width="112" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="656" y="467" fill="#545B64" font-size="9" text-anchor="middle">Network Policy</text>
  </g>

  <!-- ===== Server ===== -->
  <rect x="400" y="520" width="160" height="40" rx="6" fill="#ffffff"/>
  <rect x="400" y="520" width="160" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="544" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Server</text>

  <!-- ===== Legend ===== -->
  <line x1="30" y1="576" x2="930" y2="576" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="30" y="584" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="52" y="593" fill="#545B64" font-size="8" class="mono" letter-spacing="0.06em">REQUEST PATH</text>
  <rect x="200" y="584" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="222" y="593" fill="#545B64" font-size="8" class="mono" letter-spacing="0.06em">OTHER CAPABILITY IN LAYER</text>

</svg>