<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="lattice-seq-title lattice-seq-desc">
    <title id="lattice-seq-title">VPC Lattice request lifecycle</title>
    <desc id="lattice-seq-desc">Sequence showing a client request passing through VPC Lattice, a service's listener rules, and a target group before reaching an EKS pod, then the response tracing the same path back to the client.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="lt2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="lt2-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="100" y1="80" x2="100" y2="420" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="290" y1="80" x2="290" y2="420" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="80" x2="480" y2="420" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="670" y1="80" x2="670" y2="420" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="860" y1="80" x2="860" y2="420" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="286" y="100" width="8" height="280" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="476" y="140" width="8" height="200" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="666" y="180" width="8" height="120" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="856" y="220" width="8" height="40" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- Messages -->
    <line x1="100" y1="100" x2="290" y2="100" stroke="#545B64" stroke-width="1.2" marker-end="url(#lt2-arrow)"/>
    <line x1="290" y1="140" x2="480" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#lt2-arrow)"/>
    <line x1="480" y1="180" x2="670" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#lt2-arrow)"/>
    <line x1="670" y1="220" x2="860" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#lt2-arrow)"/>

    <line x1="860" y1="260" x2="670" y2="260" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#lt2-arrow)"/>
    <line x1="670" y1="300" x2="480" y2="300" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#lt2-arrow)"/>
    <line x1="480" y1="340" x2="290" y2="340" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#lt2-arrow)"/>
    <line x1="290" y1="380" x2="100" y2="380" stroke="#EC7211" stroke-width="1.4" marker-end="url(#lt2-arrow-accent)"/>

    <!-- Message labels -->
    <rect x="155" y="80" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="195" y="89" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">REQUEST</text>

    <rect x="345" y="120" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="385" y="129" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">LISTENER RULE</text>

    <rect x="535" y="160" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="575" y="169" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">ROUTE TO TG</text>

    <rect x="725" y="200" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="765" y="209" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">FORWARD</text>

    <rect x="725" y="240" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="765" y="249" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">RESPONSE</text>

    <rect x="535" y="280" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="575" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">FORWARD RESP</text>

    <rect x="345" y="320" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="385" y="329" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">PROCESS RESP</text>

    <rect x="155" y="360" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="195" y="369" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">RETURN</text>

    <!-- Actor: Client -->
    <rect x="30" y="32" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="30" y="32" width="140" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="100" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>

    <!-- Actor: VPC Lattice (focal) -->
    <rect x="220" y="32" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="220" y="32" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="290" y="54" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC Lattice</text>
    <text x="290" y="70" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">service network</text>

    <!-- Actor: Service -->
    <rect x="410" y="32" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="410" y="32" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service</text>

    <!-- Actor: Target Group -->
    <rect x="600" y="32" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="600" y="32" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="670" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Target Group</text>

    <!-- Actor: Target (EKS Pod) -->
    <rect x="790" y="32" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="790" y="32" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="860" y="54" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Target</text>
    <text x="860" y="70" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EKS pod</text>

    <!-- Legend -->
    <line x1="40" y1="460" x2="920" y2="460" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <line x1="40" y1="496" x2="68" y2="496" stroke="#545B64" stroke-width="1.2" marker-end="url(#lt2-arrow)"/>
    <text x="76" y="499" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Call</text>

    <line x1="180" y1="496" x2="208" y2="496" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#lt2-arrow)"/>
    <text x="216" y="499" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return</text>

    <line x1="320" y1="496" x2="348" y2="496" stroke="#EC7211" stroke-width="1.4" marker-end="url(#lt2-arrow-accent)"/>
    <text x="356" y="499" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Final response (focal)</text>
  </svg>