<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="promtail-arch-title promtail-arch-desc">
    <title id="promtail-arch-title">Promtail architecture pipeline</title>
    <desc id="promtail-arch-desc">Promtail's service discovery locates pods, journal, and syslog targets, scrapes their logs, runs a pipeline of parsing, labeling, and timestamp stages, then pushes the result exclusively to the Loki API.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ ZONE ============ -->
    <rect x="24" y="220" width="912" height="216" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="384" y="224" width="192" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="233" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DISCOVER &#8594; SCRAPE &#8594; PROCESS</text>

    <!-- ============ ARROWS ============ -->
    <line x1="228" y1="336" x2="252" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="404" y1="336" x2="428" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="740" y1="336" x2="764" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ============ NODES ============ -->

    <!-- Service Discovery -->
    <rect x="20" y="272" width="208" height="128" rx="6" fill="#ffffff"/>
    <rect x="20" y="272" width="208" height="128" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="124" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service Discovery</text>
    <text x="124" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubernetes_sd</text>
    <text x="124" y="336" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">file_sd &#183; static</text>

    <!-- Scrape Targets -->
    <rect x="252" y="272" width="152" height="128" rx="6" fill="#ffffff"/>
    <rect x="252" y="272" width="152" height="128" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="328" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Scrape Targets</text>
    <text x="328" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod logs</text>
    <text x="328" y="336" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">journal &#183; syslog</text>

    <!-- Pipeline Stages (focal) -->
    <rect x="428" y="272" width="312" height="128" rx="6" fill="#ffffff"/>
    <rect x="428" y="272" width="312" height="128" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="584" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pipeline Stages</text>
    <text x="584" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docker &#183; cri &#183; json &#183; regex</text>
    <text x="584" y="336" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">multiline &#183; labels &#183; timestamp &#183; output</text>

    <!-- Push to Loki -->
    <rect x="764" y="272" width="176" height="128" rx="6" fill="#ffffff"/>
    <rect x="764" y="272" width="176" height="128" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="852" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Push to Loki</text>
    <text x="852" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Loki API</text>
    <text x="852" y="336" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">only destination</text>
  </svg>