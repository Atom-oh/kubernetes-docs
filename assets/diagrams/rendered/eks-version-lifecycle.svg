<title id="eks-version-lifecycle-title">EKS Version Lifecycle</title>
<desc id="eks-version-lifecycle-desc">Timeline showing the standard and extended support windows for Amazon EKS Kubernetes versions 1.29 through 1.36, each running 14 months of standard support followed by 12 months of extended support at six times the hourly price, with the current date marked against versions 1.29 through 1.32 already in or near extended support.</desc>
