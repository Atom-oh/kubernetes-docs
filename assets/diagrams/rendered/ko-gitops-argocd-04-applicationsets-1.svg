<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
  <title id="t1">단계적 프로그레시브 배포 흐름</title>
  <desc id="d1">ApplicationSet의 progressive rollout 전략에 따라 배포가 Dev에서 Staging을 거쳐 Prod로 순차적으로 진행되며, Prod 단계는 maxUpdate 1로 제한되어 myapp-prod-ap가 완료된 후에만 myapp-prod-us가 배포되는 순서를 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;}
      .mono{font-family:'Geist Mono','Amazon Ember Mono',ui-monospace,monospace;}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="32" y="28" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7D8998">ARGO CD · APPLICATIONSET</text>
  <text x="32" y="52" font-size="20" font-weight="700" fill="#232F3E">프로그레시브 롤아웃 순서</text>

  <!-- Zones -->
  <rect x="280" y="88" width="400" height="104" rx="8" fill="rgba(122,161,22,0.05)" stroke="rgba(122,161,22,0.35)" stroke-width="1"/>
  <circle cx="300" cy="108" r="4" fill="#7AA116"/>
  <text x="312" y="111" class="mono" font-size="8" font-weight="500" letter-spacing="0.1em" fill="#545B64">STEP 1 · DEV</text>

  <rect x="280" y="232" width="400" height="104" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,163,17,0.35)" stroke-width="1"/>
  <circle cx="300" cy="252" r="4" fill="#DD9C11"/>
  <text x="312" y="255" class="mono" font-size="8" font-weight="500" letter-spacing="0.1em" fill="#545B64">STEP 2 · STAGING</text>

  <rect x="280" y="376" width="400" height="184" rx="8" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.35)" stroke-width="1"/>
  <circle cx="300" cy="396" r="4" fill="#DD344C"/>
  <text x="312" y="399" class="mono" font-size="8" font-weight="500" letter-spacing="0.1em" fill="#545B64">STEP 3 · PROD (MAXUPDATE: 1)</text>

  <!-- Arrows -->
  <path d="M 480 176 L 480 256" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="500" y="208" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="530" y="217" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998" text-anchor="middle">성공 후</text>

  <path d="M 480 320 L 480 400 Q 480 408 472 408 L 394 408 Q 386 408 386 416 L 386 456"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="500" y="352" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="530" y="361" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998" text-anchor="middle">성공 후</text>

  <path d="M 476 488 L 524 488" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="478" y="466" width="44" height="12" rx="2" fill="#ffffff"/>
  <text x="500" y="475" class="mono" font-size="8" letter-spacing="0.06em" fill="#EC7211" text-anchor="middle">완료 후</text>

  <!-- Nodes -->
  <g>
    <rect x="380" y="112" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="112" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="140" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">myapp-dev</text>
    <text x="480" y="156" class="mono" font-size="9" fill="#545B64" text-anchor="middle">cluster: dev</text>
  </g>

  <g>
    <rect x="380" y="256" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="256" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="284" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">myapp-staging</text>
    <text x="480" y="300" class="mono" font-size="9" fill="#545B64" text-anchor="middle">cluster: staging</text>
  </g>

  <g>
    <rect x="296" y="456" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="296" y="456" width="180" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="386" y="484" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">myapp-prod-ap</text>
    <text x="386" y="500" class="mono" font-size="9" fill="#545B64" text-anchor="middle">region: ap</text>
  </g>

  <g>
    <rect x="524" y="456" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="524" y="456" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="614" y="484" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">myapp-prod-us</text>
    <text x="614" y="500" class="mono" font-size="9" fill="#545B64" text-anchor="middle">region: us</text>
  </g>

  <!-- Legend -->
  <line x1="32" y1="580" x2="928" y2="580" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="592" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <circle cx="140" cy="589" r="4" fill="#7AA116"/>
  <text x="150" y="592" class="mono" font-size="8" fill="#545B64">LOW RISK</text>
  <circle cx="280" cy="589" r="4" fill="#DD9C11"/>
  <text x="290" y="592" class="mono" font-size="8" fill="#545B64">MEDIUM RISK</text>
  <circle cx="440" cy="589" r="4" fill="#DD344C"/>
  <text x="450" y="592" class="mono" font-size="8" fill="#545B64">HIGH RISK · SEQUENTIAL ROLLOUT</text>
</svg>