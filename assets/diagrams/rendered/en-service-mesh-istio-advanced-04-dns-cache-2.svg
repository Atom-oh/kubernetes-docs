<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dnsaddr-title dnsaddr-desc">
    <title id="dnsaddr-title">Automatic Address Allocation Sequence</title>
    <desc id="dnsaddr-desc">Sequence diagram showing an application resolving a ServiceEntry host to an Envoy-assigned virtual IP, then Envoy mapping that virtual IP back to the real external host and completing the HTTP request on the application's behalf.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="150" y1="88" x2="150" y2="544" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="390" y1="88" x2="390" y2="544" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="630" y1="88" x2="630" y2="544" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="870" y1="88" x2="870" y2="544" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ============ MESSAGES ============ -->

    <!-- 1: Istiod -> Envoy: xDS push -->
    <line x1="630" y1="120" x2="390" y2="120" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="452" y="100" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="490" y="110" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">XDS PUSH</text>

    <!-- 2: App -> Envoy: DNS query -->
    <line x1="150" y1="160" x2="390" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="230" y="140" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="270" y="150" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DNS QUERY</text>

    <!-- 3: Envoy self: VIP lookup -->
    <path d="M 390,196 H 430 V 220 H 398" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="436" y="202" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="472" y="212" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">VIP LOOKUP</text>

    <!-- 4: Envoy -> App: DNS response (dashed return) -->
    <line x1="390" y1="252" x2="150" y2="252" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="212" y="232" width="116" height="12" rx="2" fill="#ffffff"/>
    <text x="270" y="242" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DNS RESPONSE</text>

    <!-- 5: App -> Envoy: HTTP request -->
    <line x1="150" y1="288" x2="390" y2="288" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="212" y="268" width="116" height="12" rx="2" fill="#ffffff"/>
    <text x="270" y="278" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">HTTP REQUEST</text>

    <!-- 6: Envoy self: host mapping -->
    <path d="M 390,324 H 430 V 348 H 398" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="436" y="330" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="472" y="340" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">HOST MAP</text>

    <!-- 7: Envoy -> External: DNS lookup -->
    <line x1="390" y1="380" x2="870" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="592" y="360" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="630" y="370" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DNS LOOKUP</text>

    <!-- 8: External -> Envoy: actual IP (dashed return) -->
    <line x1="870" y1="416" x2="390" y2="416" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="576" y="396" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="630" y="406" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">203.0.113.10</text>

    <!-- 9: Envoy -> External: HTTP request -->
    <line x1="390" y1="452" x2="870" y2="452" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="592" y="432" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="630" y="442" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">HTTP:443</text>

    <!-- 10: External -> Envoy: response (dashed return) -->
    <line x1="870" y1="488" x2="390" y2="488" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="592" y="468" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="630" y="478" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text>

    <!-- 11: Envoy -> App: response (headline success, solid accent) -->
    <line x1="390" y1="524" x2="150" y2="524" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="232" y="504" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="270" y="514" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text>

    <!-- ============ ACTORS ============ -->

    <rect x="80" y="40" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="80" y="40" width="140" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="150" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>

    <rect x="320" y="40" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="320" y="40" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="390" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy</text>
    <text x="390" y="74" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">DNS proxy</text>

    <rect x="560" y="40" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="560" y="40" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="630" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istiod</text>

    <rect x="800" y="40" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="800" y="40" width="140" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="870" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">api.example.com</text>
    <text x="870" y="74" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">actual server</text>

    <!-- Legend -->
    <line x1="30" y1="560" x2="930" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="576" x2="172" y2="576" stroke="#545B64" stroke-width="1.2"/>
    <text x="180" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">CALL</text>
    <line x1="260" y1="576" x2="292" y2="576" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="300" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">RETURN</text>
    <line x1="400" y1="576" x2="432" y2="576" stroke="#EC7211" stroke-width="1.4"/>
    <text x="440" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">HEADLINE SUCCESS</text>
  </svg>