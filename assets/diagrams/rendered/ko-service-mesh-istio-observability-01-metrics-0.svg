<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">Istio 메트릭 수집 아키텍처</title>
  <desc id="ddesc">애플리케이션 파드의 Envoy 사이드카가 istiod의 설정을 받아 Prometheus에 스크레이프되고 OpenTelemetry Collector로 푸시되며, 수집된 메트릭이 Prometheus를 거쳐 Grafana와 Kiali로 시각화되는 흐름을 보여준다.</desc>

  <rect width="960" height="600" fill="var(--paper)"/>

  <!-- header -->
  <text x="24" y="28" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="var(--soft)">ISTIO OBSERVABILITY</text>
  <text x="24" y="52" class="sans" font-size="20" font-weight="700" fill="var(--ink)">메트릭 수집 아키텍처</text>

  <!-- ===================== ZONES (bg -> zones -> arrows -> nodes) ===================== -->
  <!-- Zone 1: Application Pods -->
  <rect x="8" y="256" width="328" height="96" rx="8" fill="var(--ink)" fill-opacity="0.02" stroke="var(--rule)" stroke-width="0.8"/>
  <rect x="24" y="260" width="128" height="12" rx="2" fill="var(--paper)"/>
  <text x="88" y="269" class="mono" font-size="7" font-weight="500" letter-spacing="0.14em" text-anchor="middle" fill="var(--soft)">APPLICATION PODS</text>

  <!-- Zone 2: Metrics Backend -->
  <rect x="384" y="188" width="192" height="240" rx="8" fill="var(--ink)" fill-opacity="0.02" stroke="var(--rule)" stroke-width="0.8"/>
  <rect x="416" y="192" width="128" height="12" rx="2" fill="var(--paper)"/>
  <text x="480" y="201" class="mono" font-size="7" font-weight="500" letter-spacing="0.14em" text-anchor="middle" fill="var(--soft)">METRICS BACKEND</text>

  <!-- Zone 3: Visualization -->
  <rect x="696" y="188" width="192" height="240" rx="8" fill="var(--ink)" fill-opacity="0.02" stroke="var(--rule)" stroke-width="0.8"/>
  <rect x="740" y="192" width="104" height="12" rx="2" fill="var(--paper)"/>
  <text x="792" y="201" class="mono" font-size="7" font-weight="500" letter-spacing="0.14em" text-anchor="middle" fill="var(--soft)">VISUALIZATION</text>

  <!-- Control plane group label (unzoned, kept under 3-zone limit) -->
  <text x="190" y="84" class="mono" font-size="7" font-weight="500" letter-spacing="0.14em" fill="var(--soft)">ISTIO CONTROL PLANE</text>

  <!-- ===================== ARROW MARKERS ===================== -->
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- ===================== ARROWS ===================== -->

  <!-- App1 -.-> Envoy1 (sidecar attachment, structural, unlabeled) -->
  <line x1="152" y1="308" x2="180" y2="308" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Telemetry -.-> Istiod ("적용") -->
  <line x1="356" y1="124" x2="310" y2="124" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="316" y="104" width="34" height="12" rx="2" fill="var(--paper)"/>
  <text x="333" y="113" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--soft)">적용</text>

  <!-- Istiod --> Envoy1 ("설정") straight vertical, x=250 -->
  <path d="M250,152 V280" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="258" y="204" width="40" height="12" rx="2" fill="var(--paper)"/>
  <text x="278" y="213" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--soft)">설정</text>

  <!-- Envoy1 --> OTEL ("푸시") elbow up, muted -->
  <path d="M320,294 H368 Q376,294 376,286 V240 Q376,232 384,232 H400"
        fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="324" y="257" width="40" height="12" rx="2" fill="var(--paper)"/>
  <text x="344" y="266" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--soft)">푸시</text>

  <!-- Envoy1 --> Prometheus ("스크레이프") elbow down, ACCENT -->
  <path d="M320,322 H368 Q376,322 376,330 V376 Q376,384 384,384 H400"
        fill="none" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="322" y="347" width="46" height="12" rx="2" fill="var(--paper)"/>
  <text x="345" y="356" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--accent)">스크레이프</text>

  <!-- OTEL --> Prometheus straight vertical, x=480, unlabeled -->
  <path d="M480,260 V356" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Prometheus --> Grafana elbow up, unlabeled -->
  <path d="M560,364 H628 Q636,364 636,356 V240 Q636,232 644,232 H712"
        fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Prometheus --> Kiali straight horizontal, y=384, unlabeled -->
  <path d="M560,384 H712" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===================== NODES ===================== -->

  <!-- App1 -->
  <rect x="24" y="280" width="128" height="56" rx="6" fill="var(--paper)"/>
  <rect x="24" y="280" width="128" height="56" rx="6" fill="var(--muted)" fill-opacity="0.10" stroke="var(--soft)" stroke-width="1"/>
  <rect x="32" y="286" width="28" height="12" rx="2" fill="transparent" stroke="var(--soft)" stroke-width="0.8"/>
  <text x="46" y="295" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="var(--soft)">POD</text>
  <text x="88" y="312" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">App Container</text>
  <text x="88" y="326" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">app-v1</text>

  <!-- Envoy1 (FOCAL) -->
  <rect x="180" y="280" width="140" height="56" rx="6" fill="var(--paper)"/>
  <rect x="180" y="280" width="140" height="56" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
  <rect x="188" y="286" width="36" height="12" rx="2" fill="transparent" stroke="var(--accent)" stroke-width="0.8" opacity="0.6"/>
  <text x="206" y="295" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="var(--accent)">PROXY</text>
  <text x="250" y="312" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Envoy Sidecar</text>
  <text x="250" y="326" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">:15020/stats</text>

  <!-- Istiod -->
  <rect x="190" y="96" width="120" height="56" rx="6" fill="var(--paper)"/>
  <rect x="190" y="96" width="120" height="56" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <rect x="198" y="102" width="22" height="12" rx="2" fill="transparent" stroke="var(--ink)" stroke-width="0.8" opacity="0.4"/>
  <text x="209" y="111" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="var(--muted)">CP</text>
  <text x="250" y="128" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">istiod</text>
  <text x="250" y="142" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">control plane</text>

  <!-- Telemetry -->
  <rect x="356" y="96" width="144" height="56" rx="6" fill="var(--paper)"/>
  <rect x="356" y="96" width="144" height="56" rx="6" fill="var(--ink)" fill-opacity="0.02" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="364" y="102" width="20" height="12" rx="2" fill="transparent" stroke="var(--ink)" stroke-width="0.8" opacity="0.4"/>
  <text x="374" y="111" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="var(--muted)">CR</text>
  <text x="428" y="128" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Telemetry Config</text>
  <text x="428" y="142" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">metrics override</text>

  <!-- OTEL Collector -->
  <rect x="400" y="204" width="160" height="56" rx="6" fill="var(--paper)"/>
  <rect x="400" y="204" width="160" height="56" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <rect x="408" y="210" width="34" height="12" rx="2" fill="transparent" stroke="var(--ink)" stroke-width="0.8" opacity="0.4"/>
  <text x="425" y="219" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="var(--muted)">OTEL</text>
  <text x="480" y="236" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">OpenTelemetry</text>
  <text x="480" y="250" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">:4317 grpc</text>

  <!-- Prometheus (FOCAL) -->
  <rect x="400" y="356" width="160" height="56" rx="6" fill="var(--paper)"/>
  <rect x="400" y="356" width="160" height="56" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
  <rect x="408" y="362" width="34" height="12" rx="2" fill="transparent" stroke="var(--accent)" stroke-width="0.8" opacity="0.6"/>
  <text x="425" y="371" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="var(--accent)">TSDB</text>
  <text x="480" y="388" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Prometheus</text>
  <text x="480" y="402" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">:9090</text>

  <!-- Grafana -->
  <rect x="712" y="204" width="160" height="56" rx="6" fill="var(--paper)"/>
  <rect x="712" y="204" width="160" height="56" rx="6" fill="var(--ink)" fill-opacity="0.03" stroke="var(--ink)" stroke-width="1" stroke-opacity="0.30"/>
  <rect x="720" y="210" width="28" height="12" rx="2" fill="transparent" stroke="var(--ink)" stroke-width="0.8" opacity="0.4"/>
  <text x="734" y="219" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="var(--muted)">VIZ</text>
  <text x="792" y="236" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Grafana</text>
  <text x="792" y="250" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">dashboards</text>

  <!-- Kiali -->
  <rect x="712" y="356" width="160" height="56" rx="6" fill="var(--paper)"/>
  <rect x="712" y="356" width="160" height="56" rx="6" fill="var(--ink)" fill-opacity="0.03" stroke="var(--ink)" stroke-width="1" stroke-opacity="0.30"/>
  <rect x="720" y="362" width="28" height="12" rx="2" fill="transparent" stroke="var(--ink)" stroke-width="0.8" opacity="0.4"/>
  <text x="734" y="371" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="var(--muted)">VIZ</text>
  <text x="792" y="388" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Kiali</text>
  <text x="792" y="402" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">service graph</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="24" y1="460" x2="936" y2="460" stroke="var(--rule)" stroke-width="0.8"/>
  <text x="24" y="480" class="mono" font-size="8" letter-spacing="0.14em" fill="var(--soft)">LEGEND</text>

  <line x1="140" y1="477" x2="172" y2="477" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="180" y="480" class="mono" font-size="9" fill="var(--muted)">메트릭/제어 흐름</text>

  <line x1="340" y1="477" x2="372" y2="477" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="380" y="480" class="mono" font-size="9" fill="var(--muted)">설정/연동 관계</text>

  <line x1="560" y1="477" x2="592" y2="477" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="600" y="480" class="mono" font-size="9" fill="var(--muted)">핵심 스크레이프 경로</text>

  <rect x="800" y="470" width="14" height="14" rx="3" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="822" y="480" class="mono" font-size="9" fill="var(--muted)">허브 컴포넌트</text>
</svg>