<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ipam-blocks-title ipam-blocks-desc">
    <title id="ipam-blocks-title">Block 기반 IPAM 아키텍처</title>
    <desc id="ipam-blocks-desc">IPPool에서 각 노드가 자신에게 할당된 IP 블록에 대해 친화성을 갖고, 블록이 소진되면 새 블록을 추가로 할당받는 구조를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: IPPool -->
    <rect x="60" y="176" width="840" height="288" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="428" y="180" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="189" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">IPPOOL 10.244.0.0/16</text>

    <!-- Arrows (behind boxes) -->
    <line x1="180" y1="120" x2="180" y2="240" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="480" y1="120" x2="480" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="780" y1="120" x2="780" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: Node 1 (focal) -->
    <rect x="110" y="72" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="110" y="72" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="180" y="100" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 1</text>
    <text x="180" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">calico-node</text>

    <!-- Node: Node 2 -->
    <rect x="410" y="72" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="410" y="72" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="100" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 2</text>
    <text x="480" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">calico-node</text>

    <!-- Node: Node 3 -->
    <rect x="710" y="72" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="710" y="72" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="100" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 3</text>
    <text x="780" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">calico-node</text>

    <!-- Node: Node 1 Blocks (focal, 2 blocks = expansion example) -->
    <rect x="90" y="240" width="180" height="108" rx="6" fill="#ffffff"/>
    <rect x="90" y="240" width="180" height="108" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="180" y="264" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 1 블록</text>
    <text x="180" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.0.0/26 · 64 IPs</text>
    <text x="180" y="304" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.0.64/26 · 64 IPs</text>
    <text x="180" y="328" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">확장됨 (2 블록)</text>

    <!-- Node: Node 2 Blocks -->
    <rect x="390" y="240" width="180" height="108" rx="6" fill="#ffffff"/>
    <rect x="390" y="240" width="180" height="108" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="264" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 2 블록</text>
    <text x="480" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.1.0/26 · 64 IPs</text>
    <text x="480" y="304" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.1.64/26 · 64 IPs</text>

    <!-- Node: Node 3 Blocks -->
    <rect x="690" y="240" width="180" height="108" rx="6" fill="#ffffff"/>
    <rect x="690" y="240" width="180" height="108" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="780" y="264" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 3 블록</text>
    <text x="780" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.2.0/26 · 64 IPs</text>

    <!-- Legend -->
    <line x1="60" y1="500" x2="900" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="60" y="532" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="80" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">노드 / 확장된 블록 그룹</text>

    <rect x="300" y="532" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="320" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">블록 그룹 (IP 저장소)</text>

    <line x1="560" y1="537" x2="588" y2="537" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="596" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">블록 친화성 할당</text>
  </svg>