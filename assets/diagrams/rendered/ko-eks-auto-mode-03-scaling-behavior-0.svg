<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scaling-flow-title scaling-flow-desc">
  <title id="scaling-flow-title">Auto Mode 스케일링 흐름</title>
  <desc id="scaling-flow-desc">Auto Mode Controller가 Pending Pod를 감지해 NodePool을 평가하고 인스턴스를 선택해 노드를 프로비저닝한 뒤 Pod를 스케줄링하는 흐름을 보여주는 플로차트.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="28" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7D8998">FLOWCHART · EKS AUTO MODE</text>
  <text x="40" y="56" font-size="20" font-weight="700" fill="#232F3E">Pod 생성부터 Running까지의 스케일링 흐름</text>

  <!-- Zone backgrounds -->
  <rect x="40" y="92" width="880" height="156" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="56" y="112" class="mono" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#7D8998">트리거</text>

  <rect x="40" y="272" width="880" height="160" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="56" y="292" class="mono" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#7D8998">AUTO MODE CONTROLLER</text>

  <rect x="40" y="448" width="880" height="72" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="56" y="468" class="mono" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#7D8998">프로비저닝</text>

  <rect x="40" y="536" width="880" height="64" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="56" y="556" class="mono" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#7D8998">스케줄링</text>

  <!-- ===== Arrows (drawn before boxes) ===== -->

  <!-- Start -> Diamond -->
  <line x1="380" y1="140" x2="380" y2="160" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Diamond right -> Branch (Yes) -->
  <path d="M456,200 H640" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="530" y="180" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="548" y="189" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">YES</text>

  <!-- Diamond bottom -> PendingPod (No) -->
  <line x1="380" y1="240" x2="380" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="386" y="252" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="401" y="261" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">NO</text>

  <!-- PendingPod -> Decision -->
  <line x1="380" y1="328" x2="380" y2="360" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Decision -> Provisioning -->
  <line x1="380" y1="424" x2="380" y2="456" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Provisioning -> EndOval -->
  <line x1="380" y1="512" x2="380" y2="544" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Branch -> EndOval (long elbow down right margin, then left into right edge) -->
  <path d="M760,224 V560 A8,8 0 0 1 752,568 H480" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===== Nodes ===== -->

  <!-- Start oval -->
  <rect x="308" y="100" width="144" height="40" rx="20" fill="#ffffff"/>
  <rect x="308" y="100" width="144" height="40" rx="20" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="380" y="124" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Pod 생성</text>

  <!-- Diamond -->
  <polygon points="380,160 456,200 380,240 304,200" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="380" y="196" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">스케줄</text>
  <text x="380" y="210" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">가능?</text>

  <!-- Branch oval (immediate placement) -->
  <rect x="640" y="176" width="240" height="48" rx="24" fill="rgba(35,47,62,0.05)"/>
  <rect x="640" y="176" width="240" height="48" rx="24" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="760" y="196" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">기존 노드에 배치</text>
  <text x="760" y="212" class="mono" font-size="9" fill="#545B64" text-anchor="middle">즉시 Running</text>

  <!-- Pending Pod 감지 -->
  <rect x="288" y="280" width="184" height="48" rx="6" fill="#ffffff"/>
  <rect x="288" y="280" width="184" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="380" y="308" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Pending Pod 감지</text>

  <!-- Decision node (focal / accent) -->
  <rect x="248" y="360" width="264" height="64" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="248" y="360" width="264" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="380" y="386" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">NodePool 평가 → 인스턴스 선택</text>
  <text x="380" y="402" class="mono" font-size="9" fill="#545B64" text-anchor="middle">요구사항 분석 → 최적 인스턴스 선택</text>

  <!-- Provisioning node -->
  <rect x="248" y="456" width="264" height="56" rx="6" fill="#ffffff"/>
  <rect x="248" y="456" width="264" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="380" y="480" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">노드 프로비저닝</text>
  <text x="380" y="496" class="mono" font-size="9" fill="#545B64" text-anchor="middle">EC2 시작 → 부트스트랩 → kubelet 등록 → Ready</text>

  <!-- End oval -->
  <rect x="280" y="544" width="200" height="48" rx="24" fill="#ffffff"/>
  <rect x="280" y="544" width="200" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="380" y="564" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Pod 스케줄링</text>
  <text x="380" y="580" class="mono" font-size="9" fill="#545B64" text-anchor="middle">Pod Running</text>

</svg>