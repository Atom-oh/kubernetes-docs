<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="d1-title d1-desc">
  <title id="d1-title">Istio 인증서 계층 구조</title>
  <desc id="d1-desc">Istio CA의 Root CA가 Intermediate CA에 서명하고, Intermediate CA가 각 워크로드 서비스에 인증서를 발급하는 계층 구조를 보여주는 다이어그램</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .mono { font-family: 'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="32" y="40" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">CERTIFICATE CHAIN</text>
  <text x="32" y="64" font-size="28" font-weight="700" fill="#232F3E">Istio 인증서 계층 구조</text>

  <!-- zone: Istio CA (istiod) -->
  <rect x="64" y="120" width="320" height="180" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="76" y="124" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="136" y="133" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)" text-anchor="middle">ISTIO CA (ISTIOD)</text>

  <!-- zone: 워크로드 -->
  <rect x="576" y="120" width="320" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="588" y="124" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="618" y="133" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)" text-anchor="middle">워크로드</text>

  <!-- Root CA -->
  <rect x="96" y="168" width="140" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="166" y="192" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Root CA</text>
  <text x="166" y="208" class="mono" font-size="9" fill="#545B64" text-anchor="middle">자체 서명</text>

  <!-- Intermediate CA (focal) -->
  <rect x="256" y="168" width="112" height="100" rx="6" fill="#ffffff"/>
  <rect x="256" y="168" width="112" height="100" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="264" y="176" width="40" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.5)" stroke-width="0.8"/>
  <text x="284" y="185" class="mono" font-size="7" fill="#EC7211" text-anchor="middle" letter-spacing="0.08em">CA</text>
  <text x="312" y="212" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Intermediate</text>
  <text x="312" y="228" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">CA</text>
  <text x="312" y="248" class="mono" font-size="9" fill="#545B64" text-anchor="middle">워크로드 인증서</text>
  <text x="312" y="260" class="mono" font-size="9" fill="#545B64" text-anchor="middle">발급</text>

  <!-- Service certs -->
  <rect x="712" y="152" width="152" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="788" y="176" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Service A</text>
  <text x="788" y="192" class="mono" font-size="9" fill="#545B64" text-anchor="middle">인증서</text>

  <rect x="712" y="272" width="152" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="788" y="296" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Service B</text>
  <text x="788" y="312" class="mono" font-size="9" fill="#545B64" text-anchor="middle">인증서</text>

  <rect x="712" y="392" width="152" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="788" y="416" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Service C</text>
  <text x="788" y="432" class="mono" font-size="9" fill="#545B64" text-anchor="middle">인증서</text>

  <!-- Root -> Intermediate (same y, straight line) -->
  <line x1="236" y1="198" x2="256" y2="198" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="228" y="176" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="246" y="185" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">서명</text>

  <!-- Intermediate -> Service A/B/C, accent (focal outgoing), fanned attach on right edge of Intermediate (x=368) -->
  <!-- attach points at y=193, 218, 243 (span 168-268, 3 pts at offsets 100/4,200/4,300/4 -> 193,218,243) -->
  <path d="M 368,193 H 692 Q 700,193 700,201 V 172 Q 700,164 708,164 H 712"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="592" y="164" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="612" y="173" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.06em">발급</text>

  <path d="M 368,218 H 712" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="592" y="204" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="612" y="213" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.06em">발급</text>

  <path d="M 368,243 H 692 Q 700,243 700,251 V 412 Q 700,420 708,420 H 712"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="592" y="404" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="612" y="413" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.06em">발급</text>

  <!-- legend -->
  <line x1="32" y1="524" x2="928" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="544" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <line x1="140" y1="540" x2="172" y2="540" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="180" y="544" font-size="12" fill="#232F3E">CA 서명</text>
  <line x1="320" y1="540" x2="352" y2="540" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="360" y="544" font-size="12" fill="#232F3E">워크로드 인증서 발급 (자동 갱신)</text>
</svg>