<line x1="40" y1="504" x2="920" y2="504" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="520" fill="#545B64" font-size="8" font-family="var(--font-mono)" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="536" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="60" y="544" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">데이터 저장소</text>
<rect x="220" y="536" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="240" y="544" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Typha / Felix 프로세스</text>
