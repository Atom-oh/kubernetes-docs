<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-title d3-desc">
<title id="d3-title">Typha 도입 전후의 연결 구조 비교</title>
<desc id="d3-desc">Typha 없이는 Datastore가 모든 Felix 에이전트에 직접 연결돼야 하지만, Typha를 3대 두면 Datastore는 Typha에만 연결되고 Typha가 각 Felix 그룹으로 연결을 분산시켜 대규모 클러스터를 지원한다는 것을 비교하는 다이어그램.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="d3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="d3-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone 1: Without Typha -->
<rect x="40" y="64" width="400" height="424" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="140" y="68" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="240" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">WITHOUT TYPHA (소규모)</text>

<!-- Zone 2: With Typha -->
<rect x="480" y="64" width="440" height="424" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="600" y="68" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="700" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">WITH TYPHA (대규모)</text>

<!-- Arrows: zone 1 -->
<line x1="240" y1="160" x2="240" y2="400" stroke="#545B64" stroke-width="1.2" marker-end="url(#d3-arrow)"/>
<rect x="200" y="264" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="240" y="273" fill="#545B64" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">N개 직접 연결</text>

<!-- Arrows: zone 2, Datastore -> Typha x3 -->
<path d="M 650,160 V 196 Q 650,204 642,204 H 564 Q 556,204 556,212 V 248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d3-arrow)"/>
<line x1="700" y1="160" x2="700" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#d3-arrow)"/>
<path d="M 750,160 V 196 Q 750,204 758,204 H 836 Q 844,204 844,212 V 248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d3-arrow)"/>

<!-- Arrows: zone 2, Typha x3 -> Felix xN -->
<path d="M 556,312 V 348 Q 556,356 564,356 H 642 Q 650,356 650,364 V 400" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d3-arrow)"/>
<line x1="700" y1="312" x2="700" y2="400" stroke="#545B64" stroke-width="1.2" marker-end="url(#d3-arrow)"/>
<path d="M 844,312 V 348 Q 844,356 836,356 H 758 Q 750,356 750,364 V 400" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d3-arrow)"/>

<!-- Node: Datastore (zone1, store) -->
<rect x="140" y="96" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="140" y="96" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<rect x="148" y="104" width="24" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
<text x="160" y="113" fill="#545B64" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">DS</text>
<text x="240" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Datastore</text>
<text x="240" y="148" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">etcd / K8s API</text>

