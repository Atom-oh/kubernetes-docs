<rect x="140" y="400" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="148" y="408" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="164" y="417" fill="#545B64" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">AGT</text>
<text x="240" y="436" font-size="12" font-weight="600" fill="#232F3E" font-family="var(--font-sans)" text-anchor="middle">Felix ×N</text>
<text x="240" y="452" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">node agents</text>

<!-- Node: Datastore (zone2, store) -->
<rect x="600" y="96" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="600" y="96" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<rect x="608" y="104" width="24" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
<text x="620" y="113" fill="#545B64" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">DS</text>
<text x="700" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Datastore</text>
<text x="700" y="148" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">etcd / K8s API</text>

<!-- Node: Typha 1 -->
<rect x="496" y="248" width="120" height="64" rx="6" fill="#ffffff"/>
<rect x="496" y="248" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="556" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Typha 1</text>
<text x="556" y="294" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">cache proxy</text>

<!-- Node: Typha 2 -->
<rect x="640" y="248" width="120" height="64" rx="6" fill="#ffffff"/>
<rect x="640" y="248" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="700" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Typha 2</text>
<text x="700" y="294" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">cache proxy</text>

<!-- Node: Typha 3 -->
<rect x="784" y="248" width="120" height="64" rx="6" fill="#ffffff"/>
<rect x="784" y="248" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="844" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Typha 3</text>
<text x="844" y="294" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">cache proxy</text>

<!-- Node: Felix xN (zone2, backend) -->
<rect x="600" y="400" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="600" y="400" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="608" y="408" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="624" y="417" fill="#545B64" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">AGT</text>
<text x="700" y="436" font-size="12" font-weight="600" fill="#232F3E" font-family="var(--font-sans)" text-anchor="middle">Felix ×N</text>
<text x="700" y="452" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">grouped by Typha</text>

