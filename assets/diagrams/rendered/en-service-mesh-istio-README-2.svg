<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mesh-simple-title mesh-simple-desc">
    <title id="mesh-simple-title">Simple architecture without a mesh</title>
    <desc id="mesh-simple-desc">A user request passing through a load balancer to a single monolithic application and its database — simple enough that an ingress controller suffices without a service mesh.</desc><defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows -->
    <line x1="184" y1="280" x2="244" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="428" y1="280" x2="488" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="672" y1="280" x2="732" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: User -->
    <rect x="64" y="252" width="120" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="124" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">User</text>

    <!-- Node: Load Balancer -->
    <rect x="244" y="252" width="184" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="336" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Load Balancer</text>
    <text x="336" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">single ingress point</text>

    <!-- Node: Monolithic Application (focal) -->
    <rect x="488" y="252" width="184" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="580" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Monolithic App</text>
    <text x="580" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one deployable unit</text>

    <!-- Node: Database (cylinder-ish via rect + curved cap) -->
    <path d="M 732,264 v 32 a 74,10 0 0 0 148,0 v -32" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <ellipse cx="806" cy="264" rx="74" ry="10" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="806" y="288" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Database</text>

    <!-- Editorial caption -->
    <text x="480" y="392" fill="#232F3E" font-size="14" font-style="italic" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Single app, simple traffic pattern —</text>
    <text x="480" y="412" fill="#232F3E" font-size="14" font-style="italic" font-family="'Amazon Ember', sans-serif" text-anchor="middle">an Ingress controller is sufficient</text>

    <!-- Legend -->
    <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="488" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="140" y="480" width="24" height="12" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="172" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">User / input</text>
    <rect x="300" y="480" width="24" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="332" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Backend / step</text>
    <rect x="480" y="480" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="512" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Focal / core app</text>
    <ellipse cx="672" cy="486" rx="12" ry="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="700" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Data store</text>
  </svg>