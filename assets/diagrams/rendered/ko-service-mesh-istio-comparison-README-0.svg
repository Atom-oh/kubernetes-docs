<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">Service Mesh 선택 기준 플로차트</title>
  <desc id="ddesc">플랫폼과 요구사항에 따라 Service Mesh 솔루션을 선택하는 두 개의 의사결정 트리. 왼쪽은 Kubernetes 플랫폼 상에서 Istio, Linkerd, Consul/Kong Mesh 중 선택하는 경로를, 오른쪽은 AWS 중심 아키텍처에서 VPC Lattice, Istio on EKS, Istio Multi-cluster, 리전별 솔루션 중 선택하는 경로를 보여준다.</desc>

  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs><defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="var(--paper)"/>

  <!-- zone divider -->
  <line x1="480" y1="55" x2="480" y2="430" stroke="var(--rule)" stroke-width="1"/>

  <!-- zone eyebrows -->
  <text class="eyebrow" x="30" y="34">쿠버네티스 플랫폼 선택</text>
  <text class="eyebrow" x="500" y="34">AWS 중심 아키텍처 선택</text>

  <!-- ===================== LEFT ZONE ===================== -->

  <!-- edges (painted before nodes) -->
  <!-- E1 Start->Q1 -->
  <path d="M150,124 V176" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- E2 Start->NoMesh -->
  <path d="M220,90 H305" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- E3 Q1->Q2 -->
  <path d="M150,244 V296" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- E4 Q1->ConsulKong -->
  <path d="M220,210 H305" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- E5 Q2->Istio (accent path) -->
  <path d="M134,364 V400 Q134,408 126,408 H103 Q95,408 95,416 V420" fill="none" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- E6 Q2->Linkerd -->
  <path d="M166,364 V400 Q166,408 174,408 H217 Q225,408 225,416 V420" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <g class="arrow-label">
    <rect x="153" y="144" width="18" height="12" fill="var(--paper)"/>
    <text x="162" y="153" text-anchor="middle">예</text>

    <rect x="245" y="76" width="34" height="12" fill="var(--paper)"/>
    <text x="262" y="85" text-anchor="middle">아니오</text>

    <rect x="163" y="264" width="66" height="12" fill="var(--paper)"/>
    <text x="196" y="273" text-anchor="middle">Kubernetes 전용</text>

    <rect x="230" y="196" width="64" height="12" fill="var(--paper)"/>
    <text x="262" y="205" text-anchor="middle">멀티플랫폼</text>

    <rect x="72" y="394" width="82" height="12" fill="var(--paper)"/>
    <text x="113" y="403" text-anchor="middle">예 · 풍부한 기능</text>

    <rect x="160" y="394" width="72" height="12" fill="var(--paper)"/>
    <text x="196" y="403" text-anchor="middle">아니오 · 단순함</text>
  </g>

  <!-- nodes -->
  <!-- Start: decision diamond -->
  <polygon points="150,56 220,90 150,124 80,90" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text class="node-name-sm" x="150" y="87" text-anchor="middle">Service Mesh</text>
  <text class="node-name-sm" x="150" y="100" text-anchor="middle">필요?</text>

  <!-- NoMesh: outcome rect -->
  <rect x="305" y="68" width="150" height="44" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="0.8"/>
  <text class="node-name-sm" x="380" y="94" text-anchor="middle">기본 K8s Service 사용</text>

  <!-- Q1: decision diamond -->
  <polygon points="150,176 220,210 150,244 80,210" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text class="node-name" x="150" y="214" text-anchor="middle">플랫폼?</text>

  <!-- ConsulKong: outcome rect -->
  <rect x="305" y="188" width="150" height="44" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="0.8"/>
  <text class="node-name-sm" x="380" y="214" text-anchor="middle">Consul/Kong Mesh 고려</text>

  <!-- Q2: decision diamond -->
  <polygon points="150,296 220,330 150,364 80,330" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text class="node-name-sm" x="150" y="326" text-anchor="middle">복잡도</text>
  <text class="node-name-sm" x="150" y="339" text-anchor="middle">수용 가능?</text>

  <!-- Istio: focal outcome rect (accent) -->
  <rect x="35" y="426" width="120" height="48" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
  <text class="node-name" x="95" y="454" text-anchor="middle" fill="var(--accent)" font-weight="700">Istio 선택</text>

  <!-- Linkerd: outcome rect -->
  <rect x="165" y="426" width="120" height="48" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="0.8"/>
  <text class="node-name" x="225" y="454" text-anchor="middle">Linkerd 선택</text>

  <!-- ===================== RIGHT ZONE ===================== -->

  <!-- edges -->
  <!-- E7 Q3->Q4 -->
  <path d="M694,174 V204 Q694,212 686,212 H610 Q602,212 602,220 V226" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- E8 Q3->Q5 -->
  <path d="M726,174 V204 Q726,212 734,212 H810 Q818,212 818,220 V226" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- E9 Q4->Lattice (accent path) -->
  <path d="M594,290 V320 Q594,328 586,328 H556 Q548,328 548,336 V352" fill="none" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- E10 Q4->IstioEKS -->
  <path d="M610,290 V320 Q610,328 618,328 H648 Q656,328 656,336 V352" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- E11 Q5->IstioMulti -->
  <path d="M810,290 V320 Q810,328 802,328 H772 Q764,328 764,336 V352" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- E12 Q5->Regional -->
  <path d="M826,290 V320 Q826,328 834,328 H864 Q872,328 872,336 V352" fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <g class="arrow-label">
    <rect x="633" y="196" width="18" height="12" fill="var(--paper)"/>
    <text x="642" y="205" text-anchor="middle">예</text>

    <rect x="753" y="196" width="34" height="12" fill="var(--paper)"/>
    <text x="770" y="205" text-anchor="middle">아니오</text>

    <rect x="536" y="312" width="70" height="12" fill="var(--paper)"/>
    <text x="571" y="321" text-anchor="middle">예 · 서버리스</text>

    <rect x="614" y="312" width="34" height="12" fill="var(--paper)"/>
    <text x="631" y="321" text-anchor="middle">아니오</text>

    <rect x="748" y="312" width="82" height="12" fill="var(--paper)"/>
    <text x="789" y="321" text-anchor="middle">예 · 멀티클라우드</text>

    <rect x="830" y="312" width="34" height="12" fill="var(--paper)"/>
    <text x="847" y="321" text-anchor="middle">아니오</text>
  </g>

  <!-- nodes -->
  <!-- Q3 -->
  <polygon points="710,106 780,140 710,174 640,140" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text class="node-name" x="710" y="144" text-anchor="middle">AWS 중심?</text>

  <!-- Q4 -->
  <polygon points="602,230 662,260 602,290 542,260" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text class="node-name-sm" x="602" y="256" text-anchor="middle">서버리스/</text>
  <text class="node-name-sm" x="602" y="269" text-anchor="middle">간편함?</text>

  <!-- Q5 -->
  <polygon points="818,230 878,260 818,290 758,260" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text class="node-name-sm" x="818" y="256" text-anchor="middle">멀티</text>
  <text class="node-name-sm" x="818" y="269" text-anchor="middle">클라우드?</text>

  <!-- Lattice: focal outcome rect (accent) -->
  <rect x="500" y="356" width="96" height="48" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
  <text class="node-name-sm" x="548" y="384" text-anchor="middle" fill="var(--accent)" font-weight="700">VPC Lattice</text>

  <!-- IstioEKS -->
  <rect x="608" y="356" width="96" height="48" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="0.8"/>
  <text class="node-name-sm" x="656" y="384" text-anchor="middle">Istio on EKS</text>

  <!-- IstioMulti -->
  <rect x="716" y="356" width="96" height="48" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="0.8"/>
  <text class="node-name-sm" x="764" y="378" text-anchor="middle">Istio</text>
  <text class="node-name-sm" x="764" y="391" text-anchor="middle">Multi-cluster</text>

  <!-- Regional -->
  <rect x="824" y="356" width="96" height="48" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="0.8"/>
  <text class="node-name-sm" x="872" y="384" text-anchor="middle">Regional 솔루션</text>

  <!-- legend -->
  <g>
    <rect x="380" y="520" width="14" height="14" rx="3" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
    <text class="legend-label" x="402" y="531">권장 솔루션 (기능 풍부 / AWS 네이티브)</text>
  </g>
</svg>