<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="cost-alloc-title cost-alloc-desc">
    <title id="cost-alloc-title">팀별 클러스터 비용 배분</title><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
    <desc id="cost-alloc-desc">월 1만 달러의 클러스터 비용을 직접·공유·유휴 비용으로 나눠 팀 A, B, C에 배분한 누적 막대 그래프로, 유휴 비용을 최적화 대상으로 강조한다.</desc>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- total note, top-right -->
    <text x="920" y="48" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="end" letter-spacing="0.10em">총 클러스터 비용 $10,000/월</text>

    <!-- y-axis rotated label -->
    <text transform="rotate(-90 24 240)" x="24" y="240" fill="#7D8998" font-size="7"
          font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">월 비용 ($)</text>

    <!-- gridlines -->
    <line x1="80" y1="420" x2="920" y2="420" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <line x1="80" y1="334" x2="920" y2="334" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="80" y1="249" x2="920" y2="249" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="80" y1="163" x2="920" y2="163" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="80" y1="77"  x2="920" y2="77"  stroke="rgba(35,47,62,0.06)" stroke-width="0.8"/>

    <!-- y-axis line + x-axis baseline -->
    <line x1="80" y1="60" x2="80" y2="420" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>
    <line x1="80" y1="420" x2="920" y2="420" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>

    <!-- y-axis tick labels -->
    <text x="72" y="424" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">$0</text>
    <text x="72" y="338" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">$1,000</text>
    <text x="72" y="253" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">$2,000</text>
    <text x="72" y="167" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">$3,000</text>
    <text x="72" y="81"  fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">$4,000</text>

    <!-- ===== Team A: total $4,120 (Direct 3000 / Shared 800 / Idle 320) ===== -->
    <text x="260" y="55" fill="#232F3E" font-size="11" font-weight="700" text-anchor="middle"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">$4,120</text>
    <!-- Direct 257px -->
    <rect x="180" y="163" width="160" height="257" fill="rgba(35,47,62,0.12)" stroke="#545B64" stroke-width="1"/>
    <text x="260" y="296" fill="#232F3E" font-size="9" text-anchor="middle"
          font-family="'Geist Mono', monospace">$3,000</text>
    <!-- Shared 69px -->
    <rect x="180" y="94" width="160" height="69" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="1"/>
    <text x="260" y="132" fill="#232F3E" font-size="9" text-anchor="middle"
          font-family="'Geist Mono', monospace">$800</text>
    <!-- Idle 27px, focal -->
    <rect x="180" y="67" width="160" height="27" fill="rgba(255,153,0,0.14)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="450" y="82" fill="#EC7211" font-size="9" text-anchor="start"
          font-family="'Geist Mono', monospace">$320</text>
    <line x1="340" y1="80" x2="440" y2="80" stroke="#EC7211" stroke-width="0.8" stroke-dasharray="3,3"/>
    <text x="260" y="440" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">팀 A</text>

    <!-- ===== Team B: total $2,840 (Direct 2000 / Shared 600 / Idle 240) ===== -->
    <text x="500" y="165" fill="#232F3E" font-size="11" font-weight="700" text-anchor="middle"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">$2,840</text>
    <!-- Direct 171px -->
    <rect x="420" y="249" width="160" height="171" fill="rgba(35,47,62,0.12)" stroke="#545B64" stroke-width="1"/>
    <text x="500" y="338" fill="#232F3E" font-size="9" text-anchor="middle"
          font-family="'Geist Mono', monospace">$2,000</text>
    <!-- Shared 51px -->
    <rect x="420" y="198" width="160" height="51" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="1"/>
    <text x="500" y="227" fill="#232F3E" font-size="9" text-anchor="middle"
          font-family="'Geist Mono', monospace">$600</text>
    <!-- Idle 21px, focal -->
    <rect x="420" y="177" width="160" height="21" fill="rgba(255,153,0,0.14)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="690" y="191" fill="#EC7211" font-size="9" text-anchor="start"
          font-family="'Geist Mono', monospace">$240</text>
    <line x1="580" y1="188" x2="680" y2="188" stroke="#EC7211" stroke-width="0.8" stroke-dasharray="3,3"/>
    <text x="500" y="440" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">팀 B</text>

    <!-- ===== Team C: total $3,040 (Direct 1500 / Shared 1100 / Idle 440) ===== -->
    <text x="740" y="147" fill="#232F3E" font-size="11" font-weight="700" text-anchor="middle"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">$3,040</text>
    <!-- Direct 129px -->
    <rect x="660" y="291" width="160" height="129" fill="rgba(35,47,62,0.12)" stroke="#545B64" stroke-width="1"/>
    <text x="740" y="360" fill="#232F3E" font-size="9" text-anchor="middle"
          font-family="'Geist Mono', monospace">$1,500</text>
    <!-- Shared 94px -->
    <rect x="660" y="197" width="160" height="94" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="1"/>
    <text x="740" y="248" fill="#232F3E" font-size="9" text-anchor="middle"
          font-family="'Geist Mono', monospace">$1,100</text>
    <!-- Idle 38px, focal -->
    <rect x="660" y="159" width="160" height="38" fill="rgba(255,153,0,0.14)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="740" y="182" fill="#EC7211" font-size="9" text-anchor="middle"
          font-family="'Geist Mono', monospace">$440</text>
    <text x="740" y="440" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">팀 C</text>

    <!-- ===== legend strip ===== -->
    <line x1="80" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="80" y="520" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="220" y="511" width="14" height="10" rx="2" fill="rgba(35,47,62,0.12)" stroke="#545B64" stroke-width="1"/>
    <text x="240" y="520" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">직접 비용 (65%)</text>
    <rect x="400" y="511" width="14" height="10" rx="2" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="1"/>
    <text x="420" y="520" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">공유 비용 (25%)</text>
    <rect x="580" y="511" width="14" height="10" rx="2" fill="rgba(255,153,0,0.14)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="600" y="520" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">유휴 비용 (10%) · 최적화 대상</text>
  </svg>