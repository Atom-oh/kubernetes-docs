<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mwaa-eks-integration-title mwaa-eks-integration-desc">
  <title id="mwaa-eks-integration-title">MWAA에서 외부 EKS 클러스터로 Pod를 실행하는 아키텍처</title>
  <desc id="mwaa-eks-integration-desc">AWS가 관리하는 MWAA 환경의 DAG가 S3에서 받은 kube_config.yaml로 별도 인프라인 사용자 EKS 클러스터에 접속해 Pod를 생성하고, eksctl로 사전에 부여한 IAM RBAC 매핑이 이 접근을 허용하는 과정을 보여준다.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== Zones (bg -> zones -> arrows -> nodes) ===== -->
  <rect x="40" y="40" width="380" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8" stroke-dasharray="4,4"/>
  <rect x="52" y="44" width="168" height="12" rx="2" fill="#ffffff"/>
  <text x="56" y="53" fill="rgba(35,47,62,0.55)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">AWS 관리 MWAA 환경</text>

  <rect x="580" y="40" width="340" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8" stroke-dasharray="4,4"/>
  <rect x="592" y="44" width="288" height="12" rx="2" fill="#ffffff"/>
  <text x="596" y="53" fill="rgba(35,47,62,0.55)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">사용자의 EKS 클러스터 (별도 인프라)</text>

  <!-- ===== Arrows (drawn before nodes) ===== -->

  <!-- S3 -> AWS zone (sync) -->
  <path d="M140,340 V260" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="150" y="294" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="178" y="303" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">동기화</text>

  <!-- SCH -> DAG (run) -->
  <path d="M136,128 V168" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="146" y="142" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="166" y="151" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">실행</text>

  <!-- DAG -> POD (focal, cross-boundary pod creation) -->
  <path d="M392,206 H506 Q514,206 514,198 V188 Q514,180 522,180 H636"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="417" y="186" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="449" y="195" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POD 생성</text>

  <!-- IAM -> EKS zone (RBAC grant) -->
  <path d="M800,340 V260" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="810" y="294" width="100" height="12" rx="2" fill="#ffffff"/>
  <text x="860" y="303" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">RBAC 권한 부여</text>

  <!-- ===== Nodes ===== -->

  <!-- SCH: MWAA scheduler / worker (backend) -->
  <rect x="68" y="72" width="136" height="56" rx="6" fill="#ffffff"/>
  <rect x="68" y="72" width="136" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="76" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="94" y="89" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MWAA</text>
  <text x="136" y="108" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Scheduler / Worker</text>
  <text x="136" y="120" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MWAA 실행 엔진</text>

  <!-- DAG: focal node -->
  <rect x="68" y="168" width="324" height="76" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="68" y="168" width="324" height="76" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="76" y="176" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.55)" stroke-width="0.8"/>
  <text x="92" y="185" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DAG</text>
  <text x="230" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">KubernetesPodOperator</text>
  <text x="230" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in_cluster=False</text>
  <text x="230" y="230" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">config_file=kube_config.yaml</text>

  <!-- POD: pod created by the operator (backend, external cluster) -->
  <rect x="636" y="148" width="228" height="64" rx="6" fill="#ffffff"/>
  <rect x="636" y="148" width="228" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="644" y="156" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="660" y="165" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POD</text>
  <text x="750" y="184" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Operator가 생성한 Pod</text>
  <text x="750" y="200" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">사용자 EKS 클러스터 내부</text>

  <!-- S3: store, official service icon -->
  <rect x="40" y="340" width="200" height="72" rx="6" fill="#ffffff"/>
  <rect x="40" y="340" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <g transform="translate(56,358) scale(0.375)" aria-hidden="true">
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
      <g fill="#7AA116"><rect x="0" y="0" width="64" height="64"></rect></g>
