    </g>
  </g>
  <text x="92" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">S3 버킷</text>
  <text x="92" y="388" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">DAG + kube_config.yaml</text>

  <!-- IAM: one-time RBAC mapping config, official service icon, dashed = setup/optional -->
  <rect x="680" y="340" width="240" height="72" rx="6" fill="rgba(35,47,62,0.02)"/>
  <rect x="680" y="340" width="240" height="72" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <g transform="translate(696,358) scale(0.375)" aria-hidden="true">
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
      <g fill="#DD344C"><rect x="0" y="0" width="64" height="64"></rect></g>
      <path d="M12,47 L52,47 L52,18 L12,18 L12,47 Z M54,17 L54,48 C54,48.552 53.553,49 53,49 L11,49 C10.447,49 10,48.552 10,48 L10,17 C10,16.448 10.447,16 11,16 L53,16 C53.553,16 54,16.448 54,17 L54,17 Z M35,39 L47,39 L47,37 L35,37 L35,39 Z M45,35 L49,35 L49,33 L45,33 L45,35 Z M35,35 L41,35 L41,33 L35,33 L35,35 Z M22.5,37.5 C22.5,37.776 22.725,38 23,38 C23.275,38 23.5,37.776 23.5,37.5 C23.5,37.224 23.275,37 23,37 C22.725,37 22.5,37.224 22.5,37.5 L22.5,37.5 Z M25.5,37.5 C25.5,38.522 24.882,39.401 24,39.788 L24,42 L22,42 L22,39.788 C21.118,39.401 20.5,38.522 20.5,37.5 C20.5,36.122 21.621,35 23,35 C24.379,35 25.5,36.122 25.5,37.5 L25.5,37.5 Z M16,42.995 L29.995,43 L29.996,41 L27,41 L27,39 L29.997,39 L29.998,37 L27,37 L27,35 L29.999,35 L30,33.005 L16.005,33 L16,42.995 Z M18,31.001 L28.001,31.004 L28.002,26 C28.002,24.976 27.2,24.273 26.722,23.945 C25.847,23.345 24.174,23 23.002,23 L23,23 C20.873,23 18.003,24.232 18.002,26 L18,31.001 Z M14.293,44.701 C14.105,44.513 14,44.259 14,43.994 L14.005,32 C14.005,31.447 14.453,31 15.005,31 L16,31 L16.002,26 C16.003,22.911 19.876,21 23,21 L23.002,21 C24.567,21 26.653,21.473 27.854,22.295 C29.239,23.246 30.003,24.562 30.002,26 L30.001,31.005 L31,31.006 C31.266,31.006 31.52,31.111 31.707,31.299 C31.895,31.487 32,31.741 32,32.006 L31.995,44 C31.995,44.553 31.547,45 30.995,45 L15,44.994 C14.734,44.994 14.48,44.889 14.293,44.701 L14.293,44.701 Z M47,30 L49,30 L49,28 L47,28 L47,30 Z M35,30 L44,30 L44,28 L35,28 L35,30 Z" fill="#FFFFFF"></path>
    </g>
  </g>
  <text x="732" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">eksctl iamidentitymapping</text>
  <text x="732" y="388" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">MWAA 실행 역할 → EKS RBAC</text>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="492" x2="920" y2="492" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>

  <circle cx="44" cy="508" r="3.5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="56" y="511" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">FOCAL: DAG (KUBERNETESPODOPERATOR)</text>

  <circle cx="304" cy="508" r="3.5" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="316" y="511" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">RUNTIME COMPONENT</text>

  <circle cx="524" cy="508" r="3.5" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.30)" stroke-width="1" stroke-dasharray="2,1.5"/>
  <text x="536" y="511" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">ONE-TIME SETUP / CONFIG</text>

  <rect x="737" y="504" width="10" height="8" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.30)" stroke-width="0.8" stroke-dasharray="2,1.5"/>
  <text x="756" y="511" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">TRUST BOUNDARY / SEPARATE INFRA</text>

</svg>