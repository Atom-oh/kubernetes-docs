      <title id="en-service-mesh-cilium-service-mesh-01-architecture-9-title">SPIFFE workload identity issuance</title>
      <desc id="en-service-mesh-cilium-service-mesh-01-architecture-9-desc">Diagram showing a workload requesting identity through the SPIRE agent and server, which uses a certificate authority to issue an X.509 SVID that is delivered back to the workload.</desc>
