<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="lb-roundrobin-title lb-roundrobin-desc">
    <title id="lb-roundrobin-title">ROUND_ROBIN 알고리즘으로 4번의 요청이 파드에 순차 분배되는 과정</title>
    <desc id="lb-roundrobin-desc">클라이언트가 보낸 4번의 요청을 로드 밸런서가 Pod 1, Pod 2, Pod 3에 순서대로 라우팅하고, 네 번째 요청에서 다시 Pod 1로 순환하여 라운드 로빈 방식임을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- lifelines -->
    <line x1="90" y1="80" x2="90" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="300" y1="80" x2="300" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="510" y1="80" x2="510" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="700" y1="80" x2="700" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="890" y1="80" x2="890" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ===== Messages (arrows before actor boxes) ===== -->
    <!-- 1 -->
    <line x1="90" y1="104" x2="300" y2="104" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="160" y="88" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="196" y="97" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST 1</text>
    <!-- 2 -->
    <line x1="300" y1="140" x2="510" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="370" y="124" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="400" y="133" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>
    <!-- 3 return -->
    <line x1="510" y1="176" x2="90" y2="176" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="264" y="160" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="300" y="169" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text>
    <!-- 4 -->
    <line x1="90" y1="212" x2="300" y2="212" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="160" y="196" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="196" y="205" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST 2</text>
    <!-- 5 -->
    <line x1="300" y1="248" x2="700" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="470" y="232" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="500" y="241" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>
    <!-- 6 return -->
    <line x1="700" y1="284" x2="90" y2="284" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="359" y="268" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="395" y="277" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text>
    <!-- 7 -->
    <line x1="90" y1="320" x2="300" y2="320" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="160" y="304" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="196" y="313" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST 3</text>
    <!-- 8 -->
    <line x1="300" y1="356" x2="890" y2="356" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="565" y="340" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="595" y="349" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>
    <!-- 9 return -->
    <line x1="890" y1="392" x2="90" y2="392" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="454" y="376" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="490" y="385" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text>
    <!-- 10 -->
    <line x1="90" y1="428" x2="300" y2="428" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="160" y="412" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="196" y="421" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST 4</text>
    <!-- 11 headline (round-trip back to Pod 1) -->
    <line x1="300" y1="464" x2="510" y2="464" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="356" y="448" width="98" height="12" rx="2" fill="#ffffff"/>
    <text x="405" y="457" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE (순환)</text>
    <!-- 12 headline return -->
    <line x1="510" y1="500" x2="90" y2="500" stroke="#EC7211" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <rect x="264" y="484" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="300" y="493" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text>

    <!-- ===== Actor boxes ===== -->
    <rect x="35" y="40" width="110" height="40" rx="6" fill="#ffffff"/>
    <rect x="35" y="40" width="110" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="90" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>

    <rect x="220" y="40" width="160" height="40" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="220" y="40" width="160" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="300" y="58" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Load Balancer</text>
    <text x="300" y="72" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(ROUND_ROBIN)</text>

    <rect x="460" y="40" width="100" height="40" rx="6" fill="#ffffff"/>
    <rect x="460" y="40" width="100" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="510" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 1</text>

    <rect x="650" y="40" width="100" height="40" rx="6" fill="#ffffff"/>
    <rect x="650" y="40" width="100" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="700" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 2</text>

    <rect x="840" y="40" width="100" height="40" rx="6" fill="#ffffff"/>
    <rect x="840" y="40" width="100" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="890" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 3</text>
  </svg>