<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cilium-arch-title cilium-arch-desc">
<title id="cilium-arch-title">Cilium 아키텍처와 eBPF의 역할</title>
<desc id="cilium-arch-desc">쿠버네티스 API 서버와 연동하는 Cilium Agent가 클러스터 컨트롤 플레인(Operator·CLI·Hubble)과 노드 위의 eBPF 프로그램·맵을 모두 매개하여, 파드 트래픽을 커널 수준에서 로드밸런싱·정책 적용하는 구조를 보여준다.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    text{font-family:'Amazon Ember','Noto Sans CJK KR','Helvetica Neue',Helvetica,Arial,sans-serif;}
    .mono{font-family:'Geist Mono','Noto Sans Mono CJK KR','Amazon Ember Mono',ui-monospace,monospace;}
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
  <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="460" fill="#ffffff"/>

<!-- zone -->
<rect x="24" y="24" width="912" height="372" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="36" y="28" width="164" height="12" rx="2" fill="#ffffff"/>
<text x="118" y="37" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">KUBERNETES 클러스터</text>

<!-- ===== arrows ===== -->

<!-- API <-> Agent (straight vertical, focal) -->
<line x1="380" y1="128" x2="380" y2="256" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>
<rect x="392" y="184" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="430" y="193" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">상태 동기화</text>

<!-- Operator <-> API (straight horizontal) -->
<line x1="208" y1="96" x2="280" y2="96" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="208" y="76" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="244" y="85" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">CRD 관리</text>

<!-- Agent <-> Operator (elbow via corridor, enters Agent top) -->
<path d="M128,128 V168 Q128,176 136,176 H302 Q310,176 310,184 V256"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="184" y="156" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="220" y="165" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">클러스터 상태</text>

<!-- CLI -> Agent (elbow via corridor, enters Agent top) -->
<path d="M600,128 V192 Q600,200 592,200 H458 Q450,200 450,208 V256"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="489" y="180" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="513" y="189" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">관리</text>

<!-- Agent <-> Hubble (elbow via corridor, enters Agent top) -->
<path d="M830,128 V216 Q830,224 822,224 H428 Q420,224 420,232 V256"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="589" y="204" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="625" y="213" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">메트릭 수집</text>

<!-- Pod <-> eBPF program (elbow via corridor, above row) -->
<path d="M128,256 V248 Q128,240 136,240 H592 Q600,240 600,248 V256"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="328" y="220" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="364" y="229" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">패킷 처리</text>

<!-- Agent -> eBPF program (straight horizontal, focal source) -->
<line x1="480" y1="288" x2="520" y2="288" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="486" y="268" width="28" height="12" rx="2" fill="#ffffff"/>
<text x="500" y="277" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">로드</text>

<!-- eBPF program <-> Maps (straight horizontal) -->
<line x1="680" y1="288" x2="740" y2="288" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="686" y="268" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="710" y="277" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">데이터 접근</text>

<!-- Agent -> Maps (elbow via bottom corridor) -->
<path d="M420,320 V344 Q420,352 428,352 H792 Q800,352 800,344 V320"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="574" y="332" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="600" y="341" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">관리</text>

<!-- ===== nodes ===== -->

<!-- Operator (backend) -->
<rect x="48" y="64" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="48" y="64" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="128" y="94" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Cilium Operator</text>
<text x="128" y="110" fill="#545B64" font-size="9" class="mono" text-anchor="middle">CRD · cluster-wide</text>

<!-- API (external) -->
<rect x="280" y="64" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="280" y="64" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="380" y="94" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Kubernetes API Server</text>
<text x="380" y="110" fill="#545B64" font-size="9" class="mono" text-anchor="middle">control plane</text>

<!-- CLI (input) -->
<rect x="520" y="64" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="520" y="64" width="160" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="600" y="94" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Cilium CLI</text>
<text x="600" y="110" fill="#545B64" font-size="9" class="mono" text-anchor="middle">operator input</text>

<!-- Hubble (backend) -->
<rect x="740" y="64" width="180" height="64" rx="6" fill="#ffffff"/>
<rect x="740" y="64" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="830" y="94" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Hubble</text>
<text x="830" y="110" fill="#545B64" font-size="9" class="mono" text-anchor="middle">observability platform</text>

<!-- Pod (input / workload) -->
<rect x="48" y="256" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="48" y="256" width="160" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="128" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">워크로드 Pod</text>
<text x="128" y="302" fill="#545B64" font-size="9" class="mono" text-anchor="middle">pod A / B / C / D</text>

<!-- Agent (focal) -->
<rect x="280" y="256" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="280" y="256" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="380" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Cilium Agent</text>
<text x="380" y="302" fill="#545B64" font-size="9" class="mono" text-anchor="middle">per-node daemon</text>

<!-- eBPF program (backend) -->
<rect x="520" y="256" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="520" y="256" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="600" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">eBPF 프로그램</text>
<text x="600" y="302" fill="#545B64" font-size="9" class="mono" text-anchor="middle">datapath · LB · policy</text>

<!-- Maps (store) -->
<rect x="740" y="256" width="180" height="64" rx="6" fill="#ffffff"/>
<rect x="740" y="256" width="180" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="830" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">eBPF 맵</text>
<text x="830" y="302" fill="#545B64" font-size="9" class="mono" text-anchor="middle">endpoint · policy · lb</text>

<!-- legend -->
<line x1="30" y1="424" x2="930" y2="424" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="30" y="440" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
<circle cx="150" cy="436" r="4" fill="#EC7211"/>
<text x="160" y="440" fill="#545B64" font-size="9" class="mono">핵심 데몬 (Agent)</text>
<circle cx="320" cy="436" r="4" fill="none" stroke="#232F3E"/>
<text x="330" y="440" fill="#545B64" font-size="9" class="mono">컨트롤 플레인 구성</text>
<circle cx="500" cy="436" r="4" fill="rgba(35,47,62,0.05)" stroke="#545B64"/>
<text x="510" y="440" fill="#545B64" font-size="9" class="mono">데이터 저장</text>
<circle cx="640" cy="436" r="4" fill="rgba(84,91,100,0.10)" stroke="#7D8998"/>
<text x="650" y="440" fill="#545B64" font-size="9" class="mono">워크로드/입력</text>
<circle cx="800" cy="436" r="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)"/>
<text x="810" y="440" fill="#545B64" font-size="9" class="mono">클러스터 외부 시스템</text>
</svg>