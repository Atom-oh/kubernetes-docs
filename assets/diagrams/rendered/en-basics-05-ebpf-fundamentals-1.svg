<title id="en-basics-05-ebpf-fundamentals-1-title">Traditional kernel module versus eBPF</title>
<desc id="en-basics-05-ebpf-fundamentals-1-desc">Comparison diagram contrasting the traditional approach of developing and compiling a kernel module, which requires a reboot and risks system instability, with the eBPF approach of writing a program that loads at runtime and executes only after verification, guaranteeing safe execution.</desc>
