<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d5-title d5-desc">
<title id="d5-title">Consistent hash imbalance risk</title>
<desc id="d5-desc">When too many users hash to the same range, one pod can end up carrying most of the traffic while the others stay nearly empty — a risk specific to consistent-hash load balancing.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#DD344C"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Arrows first -->
<path d="M 430,164 V 220 Q 430,228 422,228 H 248 Q 240,228 240,236 V 300"
      fill="none" stroke="#DD344C" stroke-width="1.4" marker-end="url(#arrow-danger)"/>
<rect x="320" y="208" width="30" height="12" rx="2" fill="#ffffff"/>
<text x="335" y="217" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">80%</text>

<line x1="480" y1="164" x2="480" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="488" y="230" width="30" height="12" rx="2" fill="#ffffff"/>
<text x="503" y="239" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">15%</text>

<path d="M 530,164 V 220 Q 530,228 538,228 H 712 Q 720,228 720,236 V 308"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="610" y="208" width="30" height="12" rx="2" fill="#ffffff"/>
<text x="625" y="217" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5%</text>

<!-- Users hub -->
<rect x="380" y="100" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="380" y="100" width="200" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="480" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">1000 Users</text>
<text x="480" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consistent-hash keys</text>

<!-- Pod 1 - overloaded -->
<rect x="120" y="300" width="240" height="88" rx="6" fill="#ffffff"/>
<rect x="120" y="300" width="240" height="88" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1.2"/>
<text x="240" y="336" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod 1</text>
<text x="240" y="356" fill="#DD344C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">800 users — overloaded</text>

<!-- Pod 2 -->
<rect x="400" y="308" width="160" height="72" rx="6" fill="#ffffff"/>
<rect x="400" y="308" width="160" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod 2</text>
<text x="480" y="356" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">150 users</text>

<!-- Pod 3 -->
<rect x="620" y="308" width="200" height="72" rx="6" fill="#ffffff"/>
<rect x="620" y="308" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="720" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod 3</text>
<text x="720" y="356" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">50 users</text>

<text x="480" y="472" fill="#545B64" font-size="14" font-style="italic" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Traffic concentrated on one hash range — increase minimumRingSize to spread it out.</text>

<!-- Legend -->
<line x1="40" y1="520" x2="920" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="140" y="529" width="10" height="10" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1.2"/>
<text x="156" y="537" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">overloaded pod</text>
</svg>