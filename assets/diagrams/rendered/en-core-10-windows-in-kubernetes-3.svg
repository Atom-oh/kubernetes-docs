<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wci3-title wci3-desc">
    <title id="wci3-title">Windows node storage options</title>
    <desc id="wci3-desc">A Windows container can mount emptyDir, hostPath, ConfigMap, Secret, or PersistentVolume storage, with hostPath backed by the node disk and PersistentVolumes reaching Azure Disk/File, AWS EBS, or SMB shares through a CSI driver.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="384" y="60" width="240" height="92" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="452" y="64" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="504" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WINDOWS POD</text>

    <rect x="72" y="244" width="336" height="228" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="140" y="248" width="200" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="257" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WINDOWS NODE</text>

    <rect x="416" y="244" width="336" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="486" y="248" width="196" height="12" rx="2" fill="#ffffff"/>
    <text x="584" y="257" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KUBERNETES API</text>

    <!-- Arrows: WC fan-out (waterfall elbows) -->
    <path d="M434,136 V144 Q434,152 426,152 H168 Q160,152 160,160 V280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M464,136 V156 Q464,164 456,164 H328 Q320,164 320,172 V280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="504" y1="136" x2="504" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M544,136 V156 Q544,164 552,164 H656 Q664,164 664,172 V280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M574,136 V144 Q574,152 582,152 H816 Q824,152 824,160 V280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- HP -> ND -->
    <line x1="320" y1="328" x2="320" y2="400" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- PV -> CSI -->
    <path d="M824,328 V336 Q824,344 816,344 H488 Q480,344 480,352 V400" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- CSI -> AZ / AWS / SMB -->
    <path d="M420,448 H376 Q368,448 368,456 V504 Q368,512 360,512 H316" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="448" x2="480" y2="512" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M540,448 H584 Q592,448 592,456 V504 Q592,512 600,512 H644" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Windows Container (focal) -->
    <rect x="424" y="92" width="160" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="504" y="118" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Windows Container</text>

    <!-- Row 2: volume types -->
    <rect x="92" y="280" width="136" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">emptyDir</text>

    <rect x="252" y="280" width="136" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="320" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">hostPath</text>

    <rect x="436" y="280" width="136" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="504" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ConfigMap</text>

    <rect x="596" y="280" width="136" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="664" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Secret</text>

    <rect x="756" y="280" width="136" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="824" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PersistentVolume</text>

    <!-- Node Disk -->
    <rect x="252" y="400" width="136" height="48" rx="6" fill="#ffffff"/>
    <rect x="252" y="400" width="136" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="320" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node Disk</text>

    <!-- CSI Driver -->
    <rect x="400" y="400" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CSI Driver</text>

    <!-- Backends -->
    <rect x="246" y="512" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="246" y="512" width="140" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="316" y="536" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Azure Disk/File</text>

    <rect x="410" y="512" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="410" y="512" width="140" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="536" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS EBS</text>

    <rect x="574" y="512" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="574" y="512" width="140" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="644" y="536" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SMB Share</text>

    <!-- Legend -->
    <line x1="20" y1="584" x2="900" y2="584" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="20" y="600" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="20" y="608" width="10" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="38" y="617" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">WORKLOAD</text>
    <rect x="180" y="608" width="10" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="198" y="617" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">VOLUME TYPE</text>
    <rect x="360" y="608" width="10" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="378" y="617" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">EXTERNAL BACKEND</text>
  </svg>