<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t0 d0">
    <title id="t0">Kubernetes 서비스 아키텍처</title>
    <desc id="d0">외부 클라이언트와 클러스터 내부 클라이언트가 LoadBalancer, NodePort, ClusterIP 서비스를 거쳐 CoreDNS와 Endpoints를 통해 백엔드 포드에 도달하는 경로를 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Arrows (drawn before boxes) ===== -->
    <!-- ExtClient -> LB -->
    <path d="M 90,96 V 130 Q 90,138 98,138 H 102 Q 110,138 110,146 V 180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- ExtClient -> NP -->
    <path d="M 150,96 V 130 Q 150,138 158,138 H 282 Q 290,138 290,146 V 180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- IntClient -> CIP -->
    <path d="M 564,96 V 130 Q 564,138 556,138 H 548 Q 540,138 540,146 V 180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- IntClient -> DNS (routes through NP/CIP gap) -->
    <path d="M 516,96 V 152 Q 516,160 508,160 H 435 Q 427,160 427,168 V 320" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- LB -> NP -->
    <line x1="180" y1="208" x2="220" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- NP -> CIP -->
    <line x1="360" y1="208" x2="460" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- CIP -> DNS -->
    <path d="M 513,236 V 270 Q 513,278 505,278 H 482 Q 474,278 474,286 V 320" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- CIP -> EP -->
    <path d="M 567,236 V 270 Q 567,278 575,278 H 622 Q 630,278 630,286 V 320" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- EP -> Pods -->
    <path d="M 630,376 V 410 Q 630,418 622,418 H 568 Q 560,418 560,426 V 460" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Nodes ===== -->
    <!-- ExtClient -->
    <rect x="40" y="40" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="40" y="40" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="120" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">외부 클라이언트</text>
    <text x="120" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">external</text>

    <!-- IntClient -->
    <rect x="460" y="40" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="460" y="40" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="540" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">클러스터 내부 클라이언트</text>
    <text x="540" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">in-cluster</text>

    <!-- ExternalName (standalone entry) -->
    <rect x="760" y="40" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="760" y="40" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="840" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">ExternalName</text>
    <text x="840" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CNAME→외부 서비스</text>

    <!-- LB -->
    <rect x="40" y="180" width="140" height="56" rx="6" fill="#ffffff"/>
    <rect x="40" y="180" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="110" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">LoadBalancer</text>
    <text x="110" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">external ip</text>

    <!-- NP -->
    <rect x="220" y="180" width="140" height="56" rx="6" fill="#ffffff"/>
    <rect x="220" y="180" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="290" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">NodePort</text>
    <text x="290" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">30000-32767</text>

    <!-- CIP (focal) -->
    <rect x="460" y="180" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="460" y="180" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="540" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">ClusterIP</text>
    <text x="540" y="220" fill="#EC7211" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">stable virtual ip</text>

    <!-- DNS -->
    <rect x="380" y="320" width="140" height="56" rx="6" fill="#ffffff"/>
    <rect x="380" y="320" width="140" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="450" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">CoreDNS</text>
    <text x="450" y="360" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">svc.cluster.local</text>

    <!-- EP -->
    <rect x="560" y="320" width="140" height="56" rx="6" fill="#ffffff"/>
    <rect x="560" y="320" width="140" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="630" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Endpoints</text>
    <text x="630" y="360" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">pod ip:port list</text>

    <!-- Pods group -->
    <rect x="460" y="460" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="460" y="460" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="560" y="486" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">백엔드 포드</text>
    <text x="560" y="502" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Pod 1 · Pod 2 · Pod 3</text>

    <!-- Legend -->
    <line x1="40" y1="556" x2="920" y2="556" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="572" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="140" y="562" width="12" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="158" y="572" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">서비스 디스커버리의 핵심 허브</text>
    <rect x="500" y="562" width="12" height="12" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="518" y="572" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">디스커버리 계층</text>
  </svg>