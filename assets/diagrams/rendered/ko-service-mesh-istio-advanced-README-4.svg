<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="keda-title keda-desc">
    <title id="keda-title">KEDA 오토스케일링 아키텍처</title>
    <desc id="keda-desc">Envoy 프록시가 내보낸 메트릭을 Prometheus와 CloudWatch가 수집하고, KEDA Operator가 이를 쿼리해 ScaledObject 정책에 따라 HPA를 생성·관리함으로써 최종적으로 서비스를 스케일하는 순환 구조를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="72" width="200" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="60" y="76" width="160" height="12" rx="2" fill="#ffffff"/>
    <text x="140" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">ISTIO SERVICE MESH</text>

    <rect x="380" y="72" width="200" height="176" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="404" y="76" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">관찰성 스택</text>

    <rect x="700" y="72" width="220" height="352" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="736" y="76" width="148" height="12" rx="2" fill="#ffffff"/>
    <text x="810" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">오토스케일링</text>

    <!-- Arrows (behind boxes) -->
    <!-- Service -> Envoy (within Istio zone) -->
    <line x1="140" y1="176" x2="140" y2="216" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Envoy -> Prometheus -->
    <path d="M240,232 H344 Q352,232 352,224 V136 Q352,128 360,128 H380"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Envoy -> CloudWatch -->
    <path d="M240,248 H328 Q336,248 336,256 V276 Q336,284 344,284 H380"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Prometheus -> KEDA -->
    <path d="M580,132 H636 Q644,132 644,140 V172 Q644,180 652,180 H700"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CloudWatch -> KEDA -->
    <path d="M580,280 H628 Q636,280 636,272 V212 Q636,204 628,204 H700"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- ScaledObject -> KEDA -->
    <line x1="796" y1="360" x2="796" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- KEDA -> HPA -->
    <line x1="796" y1="252" x2="796" y2="280" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- HPA -> Service (long dashed return, routed through the open corridor between Prometheus and CloudWatch) -->
    <path d="M716,308 H680 Q672,308 672,300 V208 Q672,200 664,200 H360 a8,8 0 0,0 -16,0 H260 Q252,200 252,192 V156 Q252,148 244,148 H220"
          fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="332" y="120" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="352" y="129" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">메트릭</text>

    <rect x="304" y="256" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="324" y="265" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">메트릭</text>

    <rect x="624" y="164" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="173" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">쿼리</text>

    <rect x="616" y="188" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="632" y="197" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">쿼리</text>

    <rect x="772" y="340" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="796" y="349" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">정의</text>

    <rect x="772" y="260" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="796" y="269" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">생성/관리</text>

    <rect x="260" y="166" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="280" y="175" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">스케일</text>

    <!-- Node: Service -->
    <rect x="60" y="120" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="60" y="120" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service</text>
    <text x="140" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">with Envoy</text>

    <!-- Node: Envoy -->
    <rect x="60" y="216" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="60" y="216" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>

    <!-- Node: Prometheus -->
    <rect x="400" y="104" width="180" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="104" width="180" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="490" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
    <text x="490" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">메트릭 수집</text>

    <!-- Node: CloudWatch -->
    <rect x="400" y="252" width="180" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="252" width="180" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="490" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch</text>
    <text x="490" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">AWS 메트릭</text>

    <!-- Node: KEDA (focal) -->
    <rect x="716" y="196" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="716" y="196" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="796" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">KEDA</text>
    <text x="796" y="236" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">operator</text>

    <!-- Node: HPA -->
    <rect x="716" y="280" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="716" y="280" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="796" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">HPA</text>
    <text x="796" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">controller</text>

    <!-- Node: ScaledObject -->
    <rect x="716" y="364" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="716" y="364" width="160" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="796" y="388" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ScaledObject</text>
    <text x="796" y="404" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">정책</text>

    <!-- Legend -->
    <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="488" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="504" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">스케일링 결정 지점</text>

    <line x1="280" y1="509" x2="308" y2="509" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="316" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">HPA 생성/관리</text>

    <line x1="480" y1="509" x2="508" y2="509" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="516" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">실제 스케일 반영</text>
  </svg>