<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch3-title arch3-desc">
      <title id="arch3-title">Pull 기반 배포 아키텍처</title>
      <desc id="arch3-desc">클러스터 내부의 GitOps Agent가 외부 Git 저장소를 스스로 감시(poll/watch)하다가 변경을 발견하면 API Server에 적용해 애플리케이션을 배포하는 pull 기반 구조를 보여준다.</desc>
      <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
        <marker id="s3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zones -->
      <rect x="40" y="140" width="220" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="52" y="144" width="120" height="12" rx="2" fill="#ffffff"/>
      <text x="112" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">외부 시스템</text>

      <rect x="340" y="140" width="580" height="300" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="352" y="144" width="180" height="12" rx="2" fill="#ffffff"/>
      <text x="442" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">KUBERNETES 클러스터</text>

      <!-- Arrows -->
      <line x1="380" y1="200" x2="232" y2="200" stroke="#545B64" stroke-width="1.2" marker-end="url(#s3-arrow)"/>
      <rect x="270" y="176" width="80" height="14" rx="2" fill="#ffffff"/>
      <text x="310" y="187" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">POLL/WATCH</text>

      <line x1="460" y1="224" x2="460" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#s3-arrow)"/>
      <rect x="468" y="234" width="52" height="14" rx="2" fill="#ffffff"/>
      <text x="494" y="245" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">APPLY</text>

      <line x1="460" y1="308" x2="460" y2="356" stroke="#545B64" stroke-width="1.2" marker-end="url(#s3-arrow)"/>

      <!-- Git node (external) -->
      <rect x="72" y="176" width="160" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="152" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Git 저장소</text>
      <text x="152" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">source of truth</text>

      <!-- GitOps Agent node (focal) -->
      <rect x="380" y="176" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="460" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">GitOps Agent</text>
      <text x="460" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">in-cluster</text>

      <!-- API Server node -->
      <rect x="380" y="260" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="460" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">API Server</text>
      <text x="460" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">control plane</text>

      <!-- Apps node -->
      <rect x="380" y="356" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="460" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">애플리케이션</text>

      <!-- Legend -->
      <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="40" y="556" width="16" height="16" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="66" y="568" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">자율 조정 주체 (핵심)</text>
      <rect x="240" y="556" width="16" height="16" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="266" y="568" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">구성 요소</text>
    </svg>