<rect x="158.0" y="512" width="44" height="12" rx="2" fill="#ffffff"/><text x="180.0" y="521" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATUS</text>
