<rect x="131.0" y="96" width="98" height="12" rx="2" fill="#ffffff"/><text x="180.0" y="105" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECEIVE &amp; GROUP</text>
