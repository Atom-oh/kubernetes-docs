<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-observability-alerting-03-grafana-oncall-1-title en-observability-alerting-03-grafana-oncall-1-desc">
<title id="en-observability-alerting-03-grafana-oncall-1-title">Grafana OnCall Alert Processing Sequence</title>
<desc id="en-observability-alerting-03-grafana-oncall-1-desc">Sequence diagram of an alert moving from source through OnCall routing and an escalation chain to a notified responder, with an optional re-escalation to the next responder when the first does not respond in time, ending in acknowledgement and a status update back to the source.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#545B64" stroke-width="1.2"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
