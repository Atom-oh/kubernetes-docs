<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch-arch-title ch-arch-desc">
    <title id="ch-arch-title">ClickHouse 클러스터 아키텍처</title>
    <desc id="ch-arch-desc">수집기가 Kafka를 거쳐 3개 샤드(각 2개 레플리카)로 구성된 ClickHouse 클러스터에 로그를 적재하고, ZooKeeper/Keeper가 샤드 간 복제를 조정하며, 데이터는 EBS(Hot)에서 S3(Cold)로 이동하고 Grafana/Superset이 클러스터를 조회하는 흐름을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <!-- ClickHouse cluster zone -->
    <rect x="336" y="176" width="368" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="440" y="180" width="160" height="12" rx="2" fill="#ffffff"/>
    <text x="520" y="189" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLICKHOUSE CLUSTER</text>

    <!-- Storage zone -->
    <rect x="756" y="176" width="164" height="184" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="796" y="180" width="84" height="12" rx="2" fill="#ffffff"/>
    <text x="838" y="189" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STORAGE</text>

    <!-- ============ ARROWS (drawn before boxes) ============ -->

    <!-- Collectors -> Kafka Topic -->
    <line x1="164" y1="272" x2="216" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="168" y="252" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="190" y="262" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEND</text>

    <!-- Kafka Topic -> Shard1/2/3 (fan out on Kafka's right edge, attach pts spaced) -->
    <path d="M 344,258 H 380 Q 388,258 388,250 V 232 Q 388,224 396,224 H 424" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="344" y1="272" x2="424" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 344,286 H 380 Q 388,286 388,294 V 312 Q 388,320 396,320 H 424" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="352" y="262" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="367" y="271" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">FEED</text>

    <!-- ZK -> Shard2 (dashed, coordination — representative single line into cluster) -->
    <path d="M 560,424 H 484 Q 476,424 476,416 V 336" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="486" y="432" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="522" y="441" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">COORDINATE</text>

    <!-- Shard1/2/3 -> EBS (fan into EBS left edge, attach pts at 296/312/328) -->
    <path d="M 528,224 H 630 Q 638,224 638,232 V 288 Q 638,296 646,296 H 748" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 528,304 H 740 Q 748,304 748,312" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 528,384 H 630 Q 638,384 638,376 V 336 Q 638,328 646,328 H 748" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="565" y="284" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="580" y="293" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">FLUSH</text>

    <!-- EBS -> S3 (accent — the primary hot->cold tiering flow) -->
    <line x1="818" y1="280" x2="818" y2="256" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="828" y="262" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="860" y="271" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">TTL→COLD</text>

    <!-- Visualization -> Shard2 (link-blue query, representative) -->
    <path d="M 592,472 V 424 Q 592,416 584,416 H 512" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="600" y="440" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="626" y="450" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SQL</text>

    <!-- ============ NODES ============ -->

    <!-- Collectors -->
    <rect x="40" y="240" width="124" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="240" width="124" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="48" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="62" y="257" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
    <text x="102" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">수집기</text>
    <text x="102" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FluentBit/Vector/OTEL</text>

    <!-- Kafka Topic -->
    <rect x="216" y="240" width="128" height="64" rx="6" fill="#ffffff"/>
    <rect x="216" y="240" width="128" height="64" rx="6" fill="rgba(9,114,213,0.05)" stroke="#0972D3" stroke-width="1"/>
    <rect x="224" y="248" width="36" height="12" rx="2" fill="transparent" stroke="rgba(9,114,213,0.40)" stroke-width="0.8"/>
    <text x="242" y="257" fill="#0972D3" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MQ</text>
    <text x="280" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Kafka Topic</text>
    <text x="280" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">메시지 큐 (선택)</text>

    <!-- Shard 1 -->
    <rect x="424" y="192" width="104" height="64" rx="6" fill="#ffffff"/>
    <rect x="424" y="192" width="104" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="476" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Shard 1</text>
    <text x="476" y="232" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replica × 2</text>
    <text x="476" y="244" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MergeTree</text>

    <!-- Shard 2 (focal — coordination + query entry) -->
    <rect x="424" y="272" width="104" height="64" rx="6" fill="#ffffff"/>
    <rect x="424" y="272" width="104" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="476" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Shard 2</text>
    <text x="476" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replica × 2</text>
    <text x="476" y="324" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MergeTree</text>

    <!-- Shard 3 -->
    <rect x="424" y="352" width="104" height="64" rx="6" fill="#ffffff"/>
    <rect x="424" y="352" width="104" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="476" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Shard 3</text>
    <text x="476" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replica × 2</text>
    <text x="476" y="404" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MergeTree</text>

    <!-- ZooKeeper/Keeper -->
    <rect x="560" y="396" width="128" height="56" rx="6" fill="#ffffff"/>
    <rect x="560" y="396" width="128" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <text x="624" y="420" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">ZooKeeper</text>
    <text x="624" y="436" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/ Keeper</text>

    <!-- EBS -->
    <rect x="748" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="748" y="280" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="818" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">EBS</text>
    <text x="818" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Hot Data</text>
    <text x="818" y="332" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gp3</text>

    <!-- S3 -->
    <rect x="768" y="204" width="100" height="52" rx="6" fill="#ffffff"/>
    <rect x="768" y="204" width="100" height="52" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="818" y="227" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">S3</text>
    <text x="818" y="243" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cold Data</text>

    <!-- Visualization -->
    <rect x="536" y="480" width="176" height="64" rx="6" fill="#ffffff"/>
    <rect x="536" y="480" width="176" height="64" rx="6" fill="rgba(9,114,213,0.05)" stroke="#0972D3" stroke-width="1"/>
    <text x="624" y="504" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">시각화</text>
    <text x="624" y="520" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Grafana / Superset</text>
    <text x="624" y="532" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">읽기 전용 쿼리</text>

    <!-- Legend -->
    <line x1="40" y1="566" x2="920" y2="566" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <circle cx="48" cy="584" r="3.5" fill="none" stroke="#545B64" stroke-width="1.2"/>
    <text x="58" y="588" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">수집/복제 흐름</text>
    <circle cx="220" cy="584" r="3.5" fill="none" stroke="#EC7211" stroke-width="1.4"/>
    <text x="230" y="588" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">TTL 기반 Cold 이동</text>
    <circle cx="420" cy="584" r="3.5" fill="none" stroke="#0972D3" stroke-width="1.2"/>
    <text x="430" y="588" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">쿼리(SQL/링크)</text>
    <circle cx="580" cy="584" r="3.5" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="590" y="588" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">조정(점선)</text>
  </svg>