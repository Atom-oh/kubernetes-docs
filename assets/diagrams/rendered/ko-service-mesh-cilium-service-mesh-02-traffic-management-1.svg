<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="tm1-title tm1-desc">
  <title id="tm1-title">Maglev 일관 해싱을 이용한 백엔드 선택 흐름</title>
  <desc id="tm1-desc">클라이언트 요청의 5-튜플을 해시 함수에 넣고 65537개 엔트리를 가진 룩업 테이블을 거쳐, 허브 역할을 하는 백엔드 선택 단계에서 세 개의 백엔드 중 하나로 일관되게 분산시키는 과정을 보여준다.</desc>

  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");
      .name{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;}
      .title{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;}
      .mono{font-family:'Geist Mono','Amazon Ember Mono',ui-monospace,monospace;}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- header -->
  <text x="24" y="20" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">ARCHITECTURE · L4 LOAD BALANCING</text>
  <text x="24" y="42" class="title" font-size="20" fill="#232F3E">Maglev 일관 해싱 흐름</text>
  <line x1="24" y1="56" x2="936" y2="56" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>

  <!-- ============ ZONES ============ -->
  <rect x="180" y="64" width="600" height="300" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="404" y="68" width="152" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="77" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="rgba(35,47,62,0.40)">MAGLEV 일관 해싱</text>

  <rect x="160" y="388" width="680" height="84" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="424" y="392" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="401" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="rgba(35,47,62,0.40)">BACKENDS</text>

  <!-- ============ ARROWS (before nodes) ============ -->
  <!-- vertical chain: Client -> Hash -> Table -> Backend Selection -->
  <path d="M 480,132 V 164" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 480,204 V 236" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 480,276 V 308" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- fan-out from Backend Selection bottom edge (attach x=420/480/540) to 3 backends -->
  <path d="M 420,348 V 368 Q 420,376 412,376 H 288 Q 280,376 280,384 V 420"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 480,348 V 420" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 540,348 V 368 Q 540,376 548,376 H 672 Q 680,376 680,384 V 420"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============ NODES ============ -->

  <!-- Client Request (input) -->
  <rect x="370" y="96" width="220" height="36" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="480" y="118" class="name" font-size="12" text-anchor="middle" fill="#232F3E">클라이언트 요청</text>

  <!-- Hash Function (backend) -->
  <rect x="340" y="164" width="280" height="40" rx="6" fill="#ffffff"/>
  <rect x="340" y="164" width="280" height="40" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="180" class="name" font-size="12" text-anchor="middle" fill="#232F3E">해시 함수</text>
  <text x="480" y="196" class="mono" font-size="9" text-anchor="middle" fill="#545B64">src/dst ip · src/dst port · proto</text>

  <!-- Lookup Table (backend / store) -->
  <rect x="360" y="236" width="240" height="40" rx="6" fill="rgba(35,47,62,0.05)"/>
  <rect x="360" y="236" width="240" height="40" rx="6" fill="none" stroke="#545B64" stroke-width="1"/>
  <text x="480" y="252" class="name" font-size="12" text-anchor="middle" fill="#232F3E">룩업 테이블</text>
  <text x="480" y="268" class="mono" font-size="9" text-anchor="middle" fill="#545B64">65,537 entries</text>

  <!-- Backend Selection (FOCAL hub) -->
  <rect x="360" y="308" width="240" height="40" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="360" y="308" width="240" height="40" rx="6" fill="none" stroke="#EC7211" stroke-width="1.2"/>
  <text x="480" y="332" class="name" font-size="12" text-anchor="middle" fill="#232F3E">백엔드 선택</text>

  <!-- Backends -->
  <rect x="200" y="420" width="160" height="36" rx="6" fill="#ffffff"/>
  <rect x="200" y="420" width="160" height="36" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
  <text x="280" y="442" class="name" font-size="12" text-anchor="middle" fill="#232F3E">백엔드 1</text>

  <rect x="400" y="420" width="160" height="36" rx="6" fill="#ffffff"/>
  <rect x="400" y="420" width="160" height="36" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="442" class="name" font-size="12" text-anchor="middle" fill="#232F3E">백엔드 2</text>

  <rect x="600" y="420" width="160" height="36" rx="6" fill="#ffffff"/>
  <rect x="600" y="420" width="160" height="36" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
  <text x="680" y="442" class="name" font-size="12" text-anchor="middle" fill="#232F3E">백엔드 3</text>

  <!-- ============ LEGEND ============ -->
  <line x1="24" y1="504" x2="936" y2="504" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="24" y="514" width="14" height="14" rx="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="46" y="525" class="mono" font-size="8" letter-spacing="0.06em" fill="#545B64">선택 허브 (다중 백엔드로 분기)</text>
  <line x1="300" y1="521" x2="328" y2="521" stroke="#545B64" stroke-width="1.2"/>
  <text x="336" y="525" class="mono" font-size="8" letter-spacing="0.06em" fill="#545B64">요청/해시 조회 흐름</text>
</svg>
