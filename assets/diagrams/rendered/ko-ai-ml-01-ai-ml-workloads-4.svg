<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
    <title id="t">모델 서빙 아키텍처</title>
    <desc id="d">클라이언트 요청이 Ingress/ALB 네트워킹 계층을 거쳐 KServe 등 추론 서비스로 전달되고, 추론 서비스가 S3·ECR 등 모델 저장소를 읽으며, HPA/KEDA 스케일링이 추론 서비스를 자동 확장하는 모델 서빙 구조를 보여주는 다이어그램.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#FFFFFF"/>

    <!-- Arrows (behind nodes) -->
    <!-- Client -> Networking -->
    <path d="M 176,296 H 232" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Networking -> Inference services -->
    <path d="M 424,296 H 480" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Inference services -> Model storage -->
    <path d="M 672,296 H 728" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <!-- Scaling -> Inference services (from below) -->
    <path d="M 576,432 V 384 Q 576,376 584,376 V 328" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="188" y="278" width="32" height="12" rx="2" fill="#FFFFFF"/>
    <text x="204" y="287" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

    <rect x="436" y="278" width="32" height="12" rx="2" fill="#FFFFFF"/>
    <text x="452" y="287" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

    <rect x="678" y="278" width="44" height="12" rx="2" fill="#FFFFFF"/>
    <text x="700" y="287" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOAD</text>

    <rect x="560" y="352" width="48" height="12" rx="2" fill="#FFFFFF"/>
    <text x="584" y="361" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCALES</text>

    <!-- Node: Client -->
    <rect x="48" y="264" width="128" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="48" y="264" width="128" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="112" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">클라이언트</text>
    <text x="112" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">inference request</text>

    <!-- Node: Networking (focal) -->
    <rect x="232" y="264" width="192" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="232" y="264" width="192" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="328" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">네트워킹 계층</text>
    <text x="328" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Ingress · ALB · API GW</text>

    <!-- Node: Inference services -->
    <rect x="480" y="264" width="192" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="480" y="264" width="192" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="576" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">추론 서비스</text>
    <text x="576" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KServe · TorchServe · Triton</text>

    <!-- Node: Model storage -->
    <rect x="728" y="264" width="184" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="728" y="264" width="184" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="820" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">모델 저장소</text>
    <text x="820" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">S3 · ECR · EFS</text>

    <!-- Node: Scaling -->
    <rect x="480" y="432" width="192" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="480" y="432" width="192" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="576" y="460" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">스케일링</text>
    <text x="576" y="476" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HPA · KEDA · VPA</text>

    <!-- Legend -->
    <line x1="48" y1="524" x2="912" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="48" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="48" y="548" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="68" y="556" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">요청 경로 (focal)</text>
    <line x1="228" y1="553" x2="256" y2="553" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="264" y="556" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">모델 로드</text>
    <rect x="380" y="548" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="400" y="556" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">자동 확장 제어</text>
  </svg>