<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="k8sarch-title k8sarch-desc">
    <title id="k8sarch-title">Kubernetes 클러스터의 메트릭 수집·저장·시각화 구조</title>
    <desc id="k8sarch-desc">node-exporter, kube-state-metrics, cAdvisor, 애플리케이션의 /metrics를 Prometheus(또는 vmagent)가 모두 수집해 Prometheus TSDB와 VictoriaMetrics 두 저장 계층에 나눠 넣고, 이 데이터를 Grafana와 Alertmanager가 조회하는 4단 아키텍처.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="500" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="32" y="96" width="192" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="88" y="100" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="128" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">메트릭 소스</text>

    <rect x="252" y="96" width="184" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="304" y="100" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="344" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">수집 계층</text>

    <rect x="496" y="96" width="200" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="556" y="100" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="596" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">저장 계층</text>

    <rect x="740" y="96" width="180" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="784" y="100" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="830" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">쿼리 / 시각화</text>

    <!-- Arrows: 4 targets fan in to P -->
    <path d="M208,140 Q216,140 216,148 V240 Q216,248 224,248 H268" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M208,228 H224 Q232,228 232,236 V256 Q232,264 240,264 H268" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M208,316 H240 Q248,316 248,308 V288 Q248,280 256,280 H268" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M208,404 H252 Q260,404 260,396 V304 Q260,296 268,296" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: P -> S1 / S2 -->
    <path d="M420,260 H458 Q466,260 466,252 V216 Q466,208 474,208 H512" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M420,284 H458 Q466,284 466,292 V344 Q466,352 474,352 H512" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="476" y="312" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="492" y="321" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

    <!-- Arrows: S1/S2 -> G, S1 -> AL -->
    <line x1="680" y1="192" x2="756" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M680,212 H698 Q706,212 706,220 V364 Q706,372 714,372 H756" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M680,352 H722 Q730,352 730,344 V224 Q730,216 738,216 H756" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: node-exporter -->
    <rect x="48" y="112" width="160" height="56" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="128" y="136" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">node-exporter</text>
    <text x="128" y="151" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">노드 메트릭</text>

    <!-- Node: kube-state-metrics -->
    <rect x="48" y="200" width="160" height="56" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="128" y="224" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">kube-state-metrics</text>
    <text x="128" y="239" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">K8s 객체 메트릭</text>

    <!-- Node: cAdvisor -->
    <rect x="48" y="288" width="160" height="56" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="128" y="312" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">cAdvisor</text>
    <text x="128" y="327" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">컨테이너 메트릭</text>

    <!-- Node: 애플리케이션 -->
    <rect x="48" y="376" width="160" height="56" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="128" y="400" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">애플리케이션</text>
    <text x="128" y="415" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/metrics</text>

    <!-- Node: Prometheus / vmagent (focal) -->
    <rect x="268" y="240" width="152" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="276" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.40)" stroke-width="0.8"/>
    <text x="292" y="257" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TSDB</text>
    <text x="344" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
    <text x="344" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">또는 vmagent</text>

    <!-- Node: Prometheus TSDB (short-term) -->
    <rect x="512" y="168" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="596" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus TSDB</text>
    <text x="596" y="211" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">단기 저장</text>

    <!-- Node: VictoriaMetrics (long-term) -->
    <rect x="512" y="320" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="596" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VictoriaMetrics</text>
    <text x="596" y="363" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">장기 저장</text>

    <!-- Node: Grafana -->
    <rect x="756" y="168" width="148" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="830" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana</text>
    <text x="830" y="211" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">시각화</text>

    <!-- Node: Alertmanager -->
    <rect x="756" y="340" width="148" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="830" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alertmanager</text>
    <text x="830" y="383" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">알림</text>
  </svg>