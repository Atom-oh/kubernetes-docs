<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cwa4-title cwa4-desc">
    <title id="cwa4-title">Automatic Alarm Response Routing</title>
    <desc id="cwa4-desc">A CloudWatch alarm state change flows through EventBridge to an event rule that dispatches it to one of five automated responses: auto scaling, instance restart, Slack notification, an SSM runbook, or a Step Functions recovery workflow.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="cwa4-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="cwa4-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ ARROWS ============ -->
    <g fill="none" stroke="#545B64" stroke-width="1.2">
      <path d="M 180,300 H 220" marker-end="url(#cwa4-arrow)"/>
      <path d="M 360,300 H 400" marker-end="url(#cwa4-arrow)"/>
      <!-- trunk: Event Rule -> bus spine (no arrowhead, connective) -->
      <path d="M 540,300 H 580"/>
      <!-- bus spine (no arrowhead, connective) -->
      <path d="M 580,96 V 544"/>
      <!-- branches into each response -->
      <path d="M 580,96 H 680" marker-end="url(#cwa4-arrow)"/>
      <path d="M 580,208 H 680" marker-end="url(#cwa4-arrow)"/>
      <path d="M 580,320 H 680" marker-end="url(#cwa4-arrow)"/>
      <path d="M 580,432 H 680" marker-end="url(#cwa4-arrow)"/>
      <path d="M 580,544 H 680" marker-end="url(#cwa4-arrow)"/>
    </g>

    <!-- ============ NODES ============ -->
    <!-- CloudWatch Alarm -->
    <g>
      <rect x="40" y="276" width="140" height="48" rx="6" fill="#ffffff"/>
      <rect x="40" y="276" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="110" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch Alarm</text>
    </g>

    <!-- EventBridge -->
    <g>
      <rect x="220" y="276" width="140" height="48" rx="6" fill="#ffffff"/>
      <rect x="220" y="276" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="290" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EventBridge</text>
    </g>

    <!-- Event Rule (FOCAL hub) -->
    <g>
      <rect x="400" y="252" width="140" height="96" rx="6" fill="#ffffff"/>
      <rect x="400" y="252" width="140" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="470" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Event Rule</text>
      <text x="470" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">dispatch</text>
    </g>

    <!-- Lambda: Auto Scaling -->
    <g>
      <rect x="680" y="72" width="220" height="48" rx="6" fill="#ffffff"/>
      <rect x="680" y="72" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="790" y="92" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Lambda:</text>
      <text x="790" y="108" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Auto Scaling</text>
    </g>

    <!-- Lambda: Instance Restart -->
    <g>
      <rect x="680" y="184" width="220" height="48" rx="6" fill="#ffffff"/>
      <rect x="680" y="184" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="790" y="204" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Lambda:</text>
      <text x="790" y="220" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Instance Restart</text>
    </g>

    <!-- Lambda: Slack Notification -->
    <g>
      <rect x="680" y="296" width="220" height="48" rx="6" fill="#ffffff"/>
      <rect x="680" y="296" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="790" y="316" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Lambda:</text>
      <text x="790" y="332" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Slack Notification</text>
    </g>

    <!-- SSM: Runbook Execution -->
    <g>
      <rect x="680" y="408" width="220" height="48" rx="6" fill="#ffffff"/>
      <rect x="680" y="408" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="790" y="428" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SSM:</text>
      <text x="790" y="444" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Runbook Execution</text>
    </g>

    <!-- Step Functions: Recovery Workflow -->
    <g>
      <rect x="680" y="520" width="220" height="48" rx="6" fill="#ffffff"/>
      <rect x="680" y="520" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="790" y="540" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Step Functions:</text>
      <text x="790" y="556" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Recovery Workflow</text>
    </g>
  </svg>