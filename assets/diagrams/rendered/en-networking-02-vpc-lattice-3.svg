<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="lattice-eks-title lattice-eks-desc">
    <title id="lattice-eks-title">EKS and VPC Lattice integration architecture</title>
    <desc id="lattice-eks-desc">The Gateway API Controller in an EKS cluster transforms Gateway API resources into a VPC Lattice service that a client application in another VPC can reach directly, while the same service's target group registers the backing Kubernetes pod.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="lt3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="88" width="280" height="404" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="128" y="92" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="180" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">EKS CLUSTER</text>

    <rect x="740" y="268" width="180" height="116" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="774" y="272" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="830" y="281" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.09em">ANOTHER VPC</text>

    <!-- Arrows -->
    <line x1="180" y1="184" x2="180" y2="216" stroke="#545B64" stroke-width="1.2" marker-end="url(#lt3-arrow)"/>
    <line x1="180" y1="280" x2="180" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#lt3-arrow)"/>
    <line x1="180" y1="376" x2="180" y2="408" stroke="#545B64" stroke-width="1.2" marker-end="url(#lt3-arrow)"/>

    <path d="M 300,152 H 372 Q 380,152 380,160 V 304 Q 380,312 388,312 H 460"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#lt3-arrow)"/>
    <line x1="580" y1="184" x2="580" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#lt3-arrow)"/>
    <line x1="580" y1="344" x2="580" y2="408" stroke="#545B64" stroke-width="1.2" marker-end="url(#lt3-arrow)"/>
    <line x1="460" y1="440" x2="300" y2="440" stroke="#545B64" stroke-width="1" marker-end="url(#lt3-arrow)"/>
    <path d="M 760,332 H 738 Q 730,332 730,324 V 320 Q 730,312 722,312 H 700"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#lt3-arrow)"/>

    <!-- Arrow labels -->
    <rect x="188" y="192" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="216" y="201" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">TRANSFORM</text>

    <rect x="188" y="288" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="218" y="297" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">REFERENCE</text>

    <rect x="188" y="384" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="212" y="393" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">SELECT</text>

    <rect x="390" y="226" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="435" y="235" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">CREATE/MANAGE</text>

    <rect x="588" y="222" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="616" y="231" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">CONTAINS</text>

    <rect x="588" y="366" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="616" y="375" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">ROUTING</text>

    <rect x="340" y="420" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="370" y="429" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">REGISTER</text>

    <rect x="700" y="312" width="54" height="12" rx="2" fill="#ffffff"/>
    <text x="727" y="321" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">REQUEST</text>

    <!-- Node: Gateway API Controller -->
    <rect x="60" y="120" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="120" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="68" y="126" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="82" y="135" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTL</text>
    <text x="180" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway API Controller</text>
    <text x="180" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">watches CRDs</text>

    <!-- Node: Gateway API Resources -->
    <rect x="60" y="216" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="216" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="68" y="222" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="82" y="231" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RES</text>
    <text x="180" y="246" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway API Resources</text>
    <text x="180" y="262" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HTTPRoute · Gateway</text>

    <!-- Node: Kubernetes Service -->
    <rect x="60" y="312" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="312" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="68" y="318" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="82" y="327" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">K8S</text>
    <text x="180" y="342" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes Service</text>
    <text x="180" y="358" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">selector</text>

    <!-- Node: Kubernetes Pod -->
    <rect x="60" y="408" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="408" width="240" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="68" y="414" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="82" y="423" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POD</text>
    <text x="180" y="438" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes Pod</text>
    <text x="180" y="454" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workload target</text>

    <!-- Node: VPC Lattice Service Network -->
    <rect x="460" y="120" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="460" y="120" width="240" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="468" y="126" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="482" y="135" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NET</text>
    <text x="580" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC Lattice</text>
    <text x="580" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">service network</text>

    <!-- Node: VPC Lattice Service (focal) -->
    <rect x="460" y="280" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="460" y="280" width="240" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="468" y="286" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="482" y="295" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SVC</text>
    <text x="580" y="310" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC Lattice Service</text>
    <text x="580" y="326" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DNS endpoint</text>

    <!-- Node: VPC Lattice Target Group -->
    <rect x="460" y="408" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="460" y="408" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="468" y="414" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="482" y="423" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TGT</text>
    <text x="580" y="438" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC Lattice Target Group</text>
    <text x="580" y="454" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">registers pod</text>

    <!-- Node: Application (client) -->
    <rect x="760" y="300" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="760" y="300" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="768" y="306" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
    <text x="782" y="315" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXT</text>
    <text x="830" y="336" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>

    <!-- Legend -->
    <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="544" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">VPC Lattice Service (focal)</text>

    <rect x="270" y="544" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="290" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Controller / Kubernetes object</text>

    <rect x="530" y="544" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="550" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Workload target</text>

    <rect x="680" y="544" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="700" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Managed control plane</text>

    <rect x="850" y="544" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="870" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">External client</text>
  </svg>