<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="qcache-title qcache-desc">
    <title id="qcache-title">Mimir 쿼리 캐싱 전략</title>
    <desc id="qcache-desc">쿼리가 Query-frontend의 결과 캐시, Querier의 메타데이터 캐시, Store-gateway의 청크 캐시를 순서대로 거치며, 각 단계에서 캐시가 있으면 즉시 응답하고 없을 때만 다음 단계로 내려가 최종적으로 S3까지 도달하는 3단계 캐시 확인 흐름을 보여주는 플로차트.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows first -->
    <!-- Query -> Query-frontend (entry, accent) -->
    <line x1="160" y1="40" x2="160" y2="64" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Query-frontend -> RC diamond (straight, same row) -->
    <line x1="240" y1="96" x2="324" y2="96" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Querier -> MC diamond -->
    <line x1="240" y1="208" x2="324" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Store-gateway -> CC diamond -->
    <line x1="240" y1="320" x2="324" y2="320" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- RC -> 응답 (Hit, elbow down-right) -->
    <path d="M 436,96 H 486 Q 494,96 494,104 V 176 Q 494,184 502,184 H 560"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- MC -> 응답 (Hit, straight, same row) -->
    <line x1="436" y1="208" x2="560" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CC -> 응답 (Hit, elbow up-right) -->
    <path d="M 436,320 H 486 Q 494,320 494,312 V 240 Q 494,232 502,232 H 560"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- RC -> Querier (Miss, elbow down-left) -->
    <path d="M 380,128 V 144 Q 380,152 372,152 H 168 Q 160,152 160,160 V 176"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- MC -> Store-gateway (Miss, elbow down-left) -->
    <path d="M 380,240 V 256 Q 380,264 372,264 H 168 Q 160,264 160,272 V 288"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CC -> S3 (Miss, elbow down-left) -->
    <path d="M 380,352 V 368 Q 380,376 372,376 H 168 Q 160,376 160,384 V 400"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Hit labels -->
    <rect x="448" y="76" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="462" y="85" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HIT</text>

    <rect x="484" y="188" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="498" y="197" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HIT</text>

    <rect x="448" y="300" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="462" y="309" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HIT</text>

    <!-- Miss labels -->
    <rect x="220" y="140" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="238" y="149" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MISS</text>

    <rect x="220" y="252" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="238" y="261" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MISS</text>

    <rect x="220" y="364" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="238" y="373" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MISS</text>

    <!-- Node: Query (start oval) -->
    <rect x="100" y="8" width="120" height="32" rx="16" fill="#ffffff"/>
    <rect x="100" y="8" width="120" height="32" rx="16" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="28" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Query</text>

    <!-- Node: Query-frontend (rect) -->
    <rect x="80" y="64" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="80" y="64" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Query-frontend</text>
    <text x="160" y="108" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">결과 캐시 확인</text>

    <!-- Node: RC diamond -->
    <polygon points="380,64 436,96 380,128 324,96" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="92" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">결과</text>
    <text x="380" y="104" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">캐시?</text>

    <!-- Node: Querier (rect) -->
    <rect x="80" y="176" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="80" y="176" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Querier</text>
    <text x="160" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">메타데이터 조회</text>

    <!-- Node: MC diamond -->
    <polygon points="380,176 436,208 380,240 324,208" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="204" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">메타</text>
    <text x="380" y="216" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">캐시?</text>

    <!-- Node: Store-gateway (rect) -->
    <rect x="80" y="288" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="80" y="288" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Store-gateway</text>
    <text x="160" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">청크 조회</text>

    <!-- Node: CC diamond -->
    <polygon points="380,288 436,320 380,352 324,320" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="316" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">청크</text>
    <text x="380" y="328" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">캐시?</text>

    <!-- Node: S3 (rect, focal — expensive fallback) -->
    <rect x="80" y="400" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="80" y="400" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="160" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">S3</text>
    <text x="160" y="444" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">전체 캐시 미스</text>

    <!-- Node: 응답 (merge/return, oval) -->
    <rect x="560" y="160" width="140" height="96" rx="6" fill="#ffffff"/>
    <rect x="560" y="160" width="140" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="630" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">응답 반환</text>
    <text x="630" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">캐시 적중 시</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="200" y="508" width="16" height="16" rx="16" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="224" y="520" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">시작 / 종료</text>

    <rect x="360" y="508" width="16" height="16" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="384" y="520" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">처리 단계</text>

    <polygon points="516,508 524,516 516,524 508,516" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="536" y="520" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">캐시 확인(결정)</text>

    <rect x="680" y="508" width="16" height="16" rx="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="704" y="520" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">최종 저장소(초점)</text>
  </svg>