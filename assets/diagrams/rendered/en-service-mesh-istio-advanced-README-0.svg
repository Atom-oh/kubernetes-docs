<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="keytopics-title keytopics-desc">
    <title id="keytopics-title">Key topics in the advanced Istio surface</title>
    <desc id="keytopics-desc">Map of advanced Istio topics: sidecar and ambient deployment modes both feed into EnvoyFilter customization, which unlocks gRPC/WebSocket protocol support; multi-cluster topology and Argo Rollouts integration are related but separate concerns, with Argo Rollouts triggering sidecar-based canary pods.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="40" y="32" width="200" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="76" y="36" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="140" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEPLOYMENT MODES</text>

    <rect x="320" y="32" width="240" height="324" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="380" y="36" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="440" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ADVANCED FEATURES</text>

    <rect x="600" y="32" width="240" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="660" y="36" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MULTI-CLUSTER</text>

    <!-- Arrows (before nodes) -->
    <!-- Sidecar -> EnvoyFilter -->
    <path d="M 224,96 H 276 Q 284,96 284,104 V 121 Q 284,129 292,129 H 344" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Ambient -> EnvoyFilter -->
    <path d="M 224,184 H 276 Q 284,184 284,176 V 159 Q 284,151 292,151 H 344" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- EnvoyFilter -> Protocol (straight, shared x) -->
    <line x1="440" y1="172" x2="440" y2="196" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Primary -> Remote (straight, shared x) -->
    <line x1="720" y1="128" x2="720" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- ArgoRollouts -.-> Sidecar (dashed, routed around Ambient) -->
    <path d="M 224,428 H 264 Q 272,428 272,420 V 136 Q 272,128 264,128 H 200" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Node: Sidecar Mode -->
    <rect x="56" y="64" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="56" y="64" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sidecar Mode</text>
    <text x="140" y="108" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">traditional approach</text>

    <!-- Node: Ambient Mode -->
    <rect x="56" y="152" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="56" y="152" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Ambient Mode</text>
    <text x="140" y="196" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">new architecture</text>

    <!-- Node: EnvoyFilter (focal) -->
    <rect x="344" y="108" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="344" y="108" width="192" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="440" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EnvoyFilter</text>
    <text x="440" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proxy customization</text>

    <!-- Node: gRPC/WebSocket Protocol -->
    <rect x="344" y="196" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="344" y="196" width="192" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="440" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">gRPC / WebSocket</text>
    <text x="440" y="240" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">protocol support</text>

    <!-- Node: DNS Caching (unconnected / optional) -->
    <rect x="344" y="284" width="192" height="56" rx="6" fill="rgba(35,47,62,0.02)"/>
    <rect x="344" y="284" width="192" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="440" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">DNS Caching</text>
    <text x="440" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">independent · perf only</text>

    <!-- Node: Primary Cluster -->
    <rect x="624" y="64" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="624" y="64" width="192" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Primary Cluster</text>
    <text x="720" y="108" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">control plane</text>

    <!-- Node: Remote Cluster -->
    <rect x="624" y="152" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="624" y="152" width="192" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Remote Cluster</text>
    <text x="720" y="196" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workload only</text>

    <!-- Node: Argo Rollouts (standalone, not zoned) -->
    <rect x="56" y="396" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="56" y="396" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="424" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Argo Rollouts</text>
    <text x="140" y="440" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">progressive delivery</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="556" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal customization point</text>

    <rect x="260" y="556" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="280" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Feature area</text>

    <rect x="420" y="556" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="440" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Independent / unconnected</text>

    <line x1="640" y1="562" x2="668" y2="562" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="676" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Triggers / integrates with</text>
  </svg>