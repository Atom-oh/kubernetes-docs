<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 360" role="img" aria-labelledby="oncall-title oncall-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="oncall-title">SRE 팀 주간 온콜 로테이션</title>
    <desc id="oncall-desc">SRE 팀 네 명의 엔지니어가 7일 단위로 온콜을 순차적으로 이어받는 4주 로테이션 일정을 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="960" height="360" fill="#ffffff"/>

    <!-- Phase zone -->
    <rect x="20" y="72" width="920" height="216" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="24" y="60" width="76" height="14" rx="2" fill="#ffffff"/>
    <text x="62" y="70" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">SRE 팀</text>

    <!-- Time axis: 4 weeks, pitch=180px, timeline x=200..920 (720px / 4 = 180) -->
    <line x1="200" y1="92" x2="200" y2="288" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <line x1="380" y1="92" x2="380" y2="288" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <line x1="560" y1="92" x2="560" y2="288" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <line x1="740" y1="92" x2="740" y2="288" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <line x1="920" y1="92" x2="920" y2="288" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>

    <text x="200" y="88" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">02-17</text>
    <text x="380" y="88" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">02-24</text>
    <text x="560" y="88" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">03-03</text>
    <text x="740" y="88" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">03-10</text>
    <text x="920" y="88" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">03-17</text>
    <line x1="200" y1="96" x2="920" y2="96" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>

    <!-- Row labels -->
    <text x="180" y="128" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">Engineer A</text>
    <text x="180" y="168" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">Engineer B</text>
    <text x="180" y="208" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">Engineer C</text>
    <text x="180" y="248" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">Engineer D</text>

    <!-- Focal task bar: Engineer A (current on-call) -->
    <rect x="200" y="112" width="180" height="24" rx="4" fill="rgba(255,153,0,0.12)" stroke="#EC7211" stroke-width="1"/>
    <text x="212" y="128" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace">02-17 → 02-24</text>

    <rect x="380" y="152" width="180" height="24" rx="4" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
    <text x="392" y="168" fill="#232F3E" font-size="9" font-family="'Geist Mono', monospace">02-24 → 03-03</text>

    <rect x="560" y="192" width="180" height="24" rx="4" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
    <text x="572" y="208" fill="#232F3E" font-size="9" font-family="'Geist Mono', monospace">03-03 → 03-10</text>

    <rect x="740" y="232" width="180" height="24" rx="4" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
    <text x="752" y="248" fill="#232F3E" font-size="9" font-family="'Geist Mono', monospace">03-10 → 03-17</text>

    <!-- Legend -->
    <line x1="20" y1="312" x2="940" y2="312" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="20" y="328" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="216" y="322" width="20" height="10" rx="3" fill="rgba(255,153,0,0.12)" stroke="#EC7211" stroke-width="1"/>
    <text x="244" y="330" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">현재 온콜 담당 주 (초점)</text>
  </svg>