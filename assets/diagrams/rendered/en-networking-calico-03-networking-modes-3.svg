<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="vxlan-flow-title vxlan-flow-desc">
    <title id="vxlan-flow-title">VXLAN packet flow between two VTEPs</title>
    <desc id="vxlan-flow-desc">Pod A's packet is encapsulated by its node's VTEP into a UDP/VXLAN frame, crosses the physical network, and is decapsulated by the destination VTEP before reaching Pod B.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="80" width="220" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="84" width="150" height="12" rx="2" fill="#ffffff"/>
    <text x="127" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NODE 1 · 10.0.1.10</text>

    <rect x="370" y="80" width="220" height="220" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <rect x="382" y="84" width="180" height="12" rx="2" fill="#ffffff"/>
    <text x="472" y="93" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VXLAN ENCAPSULATION</text>

    <rect x="700" y="80" width="220" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="712" y="84" width="150" height="12" rx="2" fill="#ffffff"/>
    <text x="787" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NODE 2 · 10.0.1.11</text>

    <!-- Arrows (all straight, same y=192 center) -->
    <line x1="150" y1="192" x2="150" y2="192" stroke="none"/>
    <!-- PodA -> VTEP1 (vertical, same x) -->
    <line x1="150" y1="160" x2="150" y2="212" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="158" y="176" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="178" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

    <!-- VTEP1 -> Outer headers -->
    <line x1="260" y1="240" x2="382" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="304" y="220" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="321" y="229" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>

    <!-- Outer -> Inner (vertical inside zone) -->
    <line x1="472" y1="176" x2="472" y2="212" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="480" y="184" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="497" y="193" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>

    <!-- Inner -> VTEP2 -->
    <line x1="590" y1="240" x2="712" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="634" y="220" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="651" y="229" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>

    <!-- VTEP2 -> PodB -->
    <line x1="810" y1="212" x2="810" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="818" y="176" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="835" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>

    <!-- Nodes -->
    <rect x="90" y="104" width="120" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="150" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A</text>
    <text x="150" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.0.10</text>

    <rect x="90" y="212" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="150" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VTEP</text>
    <text x="150" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vxlan.calico</text>

    <rect x="412" y="104" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="472" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Outer headers</text>
    <text x="472" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UDP:4789 VNI:4096</text>

    <rect x="412" y="212" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="472" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Inner frame</text>
    <text x="472" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">original L2+L3</text>

    <rect x="750" y="212" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="810" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VTEP</text>
    <text x="810" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vxlan.calico</text>

    <rect x="750" y="104" width="120" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="810" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B</text>
    <text x="810" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.1.10</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="200" y1="511" x2="240" y2="511" stroke="#545B64" stroke-width="1.2"/>
    <text x="248" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">hop, in order</text>
    <line x1="440" y1="511" x2="480" y2="511" stroke="#EC7211" stroke-width="1.2"/>
    <text x="488" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">encapsulation step</text>
  </svg>