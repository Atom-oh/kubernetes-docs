<title id="en-service-mesh-istio-02-basic-concepts-5-title">Traditional Approach vs Istio</title>
<desc id="en-service-mesh-istio-02-basic-concepts-5-desc">Diagram showing four microservices challenges — traffic management, security, observability, resilience — leading either to a traditional chain of duplicated, inconsistent, hard-to-maintain application code, or to Istio's infrastructure-level automatic handling with central, consistent, code-free policy.</desc>
