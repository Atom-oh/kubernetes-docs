<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="mcseq1-title mcseq1-desc">
    <title id="mcseq1-title">Service mirroring request flow</title>
    <desc id="mcseq1-desc">Sequence diagram showing an application call to a local mirror service resolve to the remote cluster's gateway, open an mTLS connection, verify identity, and forward the request to the real target service, with the response returning along the same path.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="130" y1="96" x2="130" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="370" y1="96" x2="370" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="610" y1="96" x2="610" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="850" y1="96" x2="850" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Messages (behind actor boxes is not needed here since actors sit at top only) -->
    <!-- 1: App -> Mirror -->
    <line x1="130" y1="120" x2="370" y2="120" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 2: Mirror self-loop: resolve to gateway IP -->
    <path d="M 370,150 H 402 Q 410,150 410,158 V 162 Q 410,170 402,170 H 370"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 3: Mirror -> Gateway (headline: mTLS connect) -->
    <line x1="370" y1="200" x2="610" y2="200" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- 4: Gateway self-loop: verify identity -->
    <path d="M 610,230 H 642 Q 650,230 650,238 V 242 Q 650,250 642,250 H 610"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 5: Gateway -> Target -->
    <line x1="610" y1="280" x2="850" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 6: Target to Gateway (return) -->
    <line x1="850" y1="320" x2="610" y2="320" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- 7: Gateway to Mirror (return) -->
    <line x1="610" y1="360" x2="370" y2="360" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- 8: Mirror to App (return) -->
    <line x1="370" y1="400" x2="130" y2="400" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <!-- Message labels -->
    <rect x="200" y="100" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="250" y="109" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">REQUEST WEB-WEST</text>

    <rect x="416" y="157" width="94" height="12" rx="2" fill="#ffffff"/>
    <text x="463" y="166" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">RESOLVE GW IP</text>

    <rect x="440" y="180" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="490" y="189" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">MTLS CONNECT</text>

    <rect x="656" y="237" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="704" y="246" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">VERIFY IDENTITY</text>

    <rect x="680" y="260" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="730" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">FORWARD REQUEST</text>

    <rect x="694" y="300" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="730" y="309" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">RESPONSE</text>

    <rect x="440" y="340" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="490" y="349" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">MTLS RESPONSE</text>

    <rect x="214" y="380" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="250" y="389" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">RESPONSE</text>

    <!-- Actor boxes (drawn after lifelines and messages) -->
    <rect x="50" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="130" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    <text x="130" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cluster east</text>

    <rect x="290" y="40" width="160" height="56" rx="6" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1"/>
    <text x="370" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Mirror Service</text>
    <text x="370" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">web-west</text>

    <rect x="530" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="610" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway</text>
    <text x="610" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cluster west</text>

    <rect x="770" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="850" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Target Service</text>
    <text x="850" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cluster west</text>

    <!-- Legend strip -->
    <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <line x1="40" y1="573" x2="68" y2="573" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="76" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Headline call (mTLS)</text>

    <line x1="270" y1="573" x2="298" y2="573" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="306" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Call</text>

    <line x1="380" y1="573" x2="408" y2="573" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="416" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return</text>
  </svg>