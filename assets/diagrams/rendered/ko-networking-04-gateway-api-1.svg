    <desc id="gwapi-model-desc">인프라 제공자가 만드는 GatewayClass부터 클러스터 운영자의 Gateway, 애플리케이션 개발자의 HTTPRoute·GRPCRoute·TCPRoute·TLSRoute·UDPRoute를 거쳐 백엔드 Service까지, 역할별로 책임이 분리된 흐름을 보여준다.</desc>
