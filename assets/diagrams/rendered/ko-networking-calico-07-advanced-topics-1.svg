<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ipam-algo-title ipam-algo-desc">
    <title id="ipam-algo-title">IP 할당 알고리즘</title>
    <desc id="ipam-algo-desc">Pod 생성 시 노드의 블록 친화성과 여유 IP를 확인해 기존 블록을 재사용하거나 새 블록을 할당한 뒤 IP를 배정하는 결정 흐름을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Arrows first ===== -->
    <!-- Start -> CheckNode (straight, accent happy path) -->
    <line x1="140" y1="84" x2="140" y2="132" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- CheckNode -Yes-> CheckSpace (straight horizontal, accent) -->
    <line x1="215" y1="176" x2="405" y2="176" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- CheckSpace -Yes-> AllocIP (straight vertical, accent happy path) -->
    <line x1="480" y1="216" x2="480" y2="384" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- CheckSpace -No-> CheckOther (straight horizontal) -->
    <line x1="555" y1="176" x2="705" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CheckOther -Yes-> UseOther (straight vertical) -->
    <line x1="780" y1="216" x2="780" y2="264" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CheckNode -No-> AllocBlock : elbow down-left, attach AllocBlock top at x=120 -->
    <path d="M 140,216 V 240 Q 140,248 132,248 H 120 V 264"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CheckOther -No-> AllocBlock : elbow, attach AllocBlock top at x=160 (fanned), bridges over the CheckSpace-Yes vertical at x=480,y=228 -->
    <path d="M 780,216 V 228 H 488 a 8,8 0 0,1 -16,0 H 160 V 264"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- AllocBlock -> AllocIP : two-bend elbow right+down -->
    <path d="M 210,300 H 322 Q 330,300 330,308 V 396 Q 330,404 338,404 H 400"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- UseOther -> AllocIP : two-bend elbow left+down -->
    <path d="M 710,300 H 638 Q 630,300 630,308 V 396 Q 630,404 622,404 H 560"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- AllocIP -> Done -->
    <line x1="480" y1="420" x2="480" y2="468" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- ===== Arrow labels (masked, 6-10px gap) ===== -->
    <rect x="118" y="98" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="140" y="107" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POD-REQ</text>

    <rect x="290" y="160" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="305" y="169" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

    <rect x="150" y="222" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="164" y="231" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <rect x="612" y="160" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="626" y="169" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <rect x="750" y="222" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="765" y="231" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

    <rect x="465" y="290" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="479" y="299" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

    <!-- ===== Nodes ===== -->
    <!-- Start (oval) -->
    <rect x="80" y="36" width="120" height="48" rx="24" fill="#ffffff"/>
    <rect x="80" y="36" width="120" height="48" rx="24" fill="rgba(35,47,62,0.03)" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 생성 요청</text>

    <!-- CheckNode (diamond) -->
    <path d="M 140,132 L 215,176 L 140,220 L 65,176 Z" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="170" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">노드에 블록</text>
    <text x="140" y="184" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">친화성 있음?</text>

    <!-- CheckSpace (diamond, focal happy path) -->
    <path d="M 480,132 L 555,176 L 480,220 L 405,176 Z" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="170" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">블록에 여유</text>
    <text x="480" y="184" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">IP 있음?</text>

    <!-- CheckOther (diamond) -->
    <path d="M 780,132 L 855,176 L 780,220 L 705,176 Z" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="170" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">다른 친화</text>
    <text x="780" y="184" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">블록 있음?</text>

    <!-- AllocBlock (rect) -->
    <rect x="50" y="264" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="120" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">새 블록 할당</text>

    <!-- UseOther (rect) -->
    <rect x="710" y="264" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">다른 블록 사용</text>

    <!-- AllocIP (rect, focal merge) -->
    <rect x="400" y="384" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="412" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">IP 할당</text>

    <!-- Done (oval) -->
    <rect x="420" y="468" width="120" height="48" rx="24" fill="#ffffff"/>
    <rect x="420" y="468" width="120" height="48" rx="24" fill="rgba(35,47,62,0.03)" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="496" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">완료</text>

    <!-- Legend -->
    <line x1="60" y1="548" x2="900" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <path d="M 65,586 L 72,592 L 65,598 L 58,592 Z" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="82" y="595" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">결정</text>

    <rect x="180" y="588" width="20" height="10" rx="5" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="210" y="596" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">시작 / 종료</text>

    <line x1="330" y1="592" x2="358" y2="592" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="366" y="595" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">happy path</text>
  </svg>