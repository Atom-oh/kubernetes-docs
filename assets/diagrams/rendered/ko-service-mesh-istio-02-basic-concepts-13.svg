<title id="dtitle">레거시 VM의 단계적 마이그레이션 경로</title>
<desc id="ddesc">레거시 모놀리스 VM이 메시 등록, 부분 이전, 하이브리드 mTLS 통신을 거쳐 완전한 Kubernetes 마이크로서비스로 이전되는 4단계 과정</desc>
