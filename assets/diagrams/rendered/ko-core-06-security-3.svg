<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
  <title id="t3">포드 및 컨테이너 보안 컨텍스트</title>
  <desc id="d3">포드 안에 포드 보안 컨텍스트와 컨테이너가 함께 있고, 컨테이너 내부에 컨테이너 보안 컨텍스트가 포함되며, 포드 전체는 Privileged·Baseline·Restricted 세 수준의 포드 보안 표준을 준수해야 함을 보여주는 다이어그램.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="40" y="32" fill="#7D8998" font-size="8" letter-spacing="0.18em" class="mono">SECURITY CONTEXT</text>
  <text x="40" y="58" fill="#232F3E" font-size="24" font-weight="700">보안 컨텍스트(Security Context)</text>
  <text x="40" y="78" fill="#545B64" font-size="12">포드 · 컨테이너 수준의 설정과 포드 보안 표준이 적용되는 범위</text>

  <!-- Zone: Pod -->
  <rect x="100" y="100" width="520" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="108" y="104" width="52" height="12" rx="2" fill="#ffffff"/>
  <text x="134" y="113" fill="rgba(35,47,62,0.40)" font-size="7" text-anchor="middle" letter-spacing="0.14em" class="mono">포드</text>

  <!-- Arrows (drawn before nodes painted, still before) -->
  <!-- Container -> CSC (straight vertical) -->
  <line x1="500" y1="192" x2="500" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="512" y="276" width="60" height="14" rx="2" fill="#ffffff"/>
  <text x="542" y="286" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" class="mono">포함</text>

  <!-- Pod zone -> PSS (straight horizontal) -->
  <line x1="620" y1="220" x2="700" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="640" y="198" width="60" height="14" rx="2" fill="#ffffff"/>
  <text x="670" y="208" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" class="mono">준수</text>

  <!-- PSC node -->
  <rect x="132" y="136" width="240" height="140" rx="6" fill="#ffffff"/>
  <rect x="132" y="136" width="240" height="140" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="252" y="160" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">포드 보안 컨텍스트</text>
  <text x="252" y="182" fill="#545B64" font-size="9" text-anchor="middle" class="mono">runAsUser (사용자 ID)</text>
  <text x="252" y="198" fill="#545B64" font-size="9" text-anchor="middle" class="mono">runAsGroup (그룹 ID)</text>
  <text x="252" y="214" fill="#545B64" font-size="9" text-anchor="middle" class="mono">fsGroup (파일시스템 그룹)</text>
  <text x="252" y="230" fill="#545B64" font-size="9" text-anchor="middle" class="mono">supplementalGroups (추가 그룹)</text>

  <!-- Container node -->
  <rect x="420" y="136" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="420" y="136" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="500" y="160" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">컨테이너</text>
  <text x="500" y="178" fill="#545B64" font-size="9" text-anchor="middle" class="mono">busybox / nginx …</text>

  <!-- CSC node (focal — the most commonly misconfigured settings) -->
  <rect x="360" y="380" width="280" height="160" rx="6" fill="#ffffff"/>
  <rect x="360" y="380" width="280" height="160" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="500" y="404" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">컨테이너 보안 컨텍스트</text>
  <text x="500" y="426" fill="#545B64" font-size="9" text-anchor="middle" class="mono">privileged (특권 모드)</text>
  <text x="500" y="442" fill="#545B64" font-size="9" text-anchor="middle" class="mono">allowPrivilegeEscalation (권한 상승)</text>
  <text x="500" y="458" fill="#545B64" font-size="9" text-anchor="middle" class="mono">readOnlyRootFilesystem (읽기 전용)</text>
  <text x="500" y="474" fill="#545B64" font-size="9" text-anchor="middle" class="mono">capabilities (Linux 커널 기능)</text>
  <text x="500" y="490" fill="#545B64" font-size="9" text-anchor="middle" class="mono">seLinuxOptions (SELinux 옵션)</text>

  <!-- PSS node -->
  <rect x="700" y="150" width="220" height="140" rx="6" fill="#ffffff"/>
  <rect x="700" y="150" width="220" height="140" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="810" y="174" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">포드 보안 표준</text>
  <text x="810" y="196" fill="#545B64" font-size="9" text-anchor="middle" class="mono">Privileged — 제한 없음</text>
  <text x="810" y="212" fill="#545B64" font-size="9" text-anchor="middle" class="mono">Baseline — 기본 보안</text>
  <text x="810" y="228" fill="#545B64" font-size="9" text-anchor="middle" class="mono">Restricted — 강화된 보안</text>
</svg>