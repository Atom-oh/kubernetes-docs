<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">부하 테스트에 따른 KEDA/Karpenter 오토스케일링 시퀀스</title>
  <desc id="ddesc">k6 부하 테스트가 램프업, 지속, 스파이크, 쿨다운 4단계를 거치는 동안 API Gateway 트래픽 변화에 따라 KEDA가 파드를 스케일하고 Karpenter가 노드를 프로비저닝/정리하며, Grafana가 지표를 관찰하는 과정을 시간 순으로 보여준다.</desc>

  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- ============ LIFELINES (drawn first, behind everything) ============ -->
  <line x1="88"  y1="76" x2="88"  y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="284" y1="76" x2="284" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="76" x2="480" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="676" y1="76" x2="676" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="872" y1="76" x2="872" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ============ PHASE DIVIDERS ============ -->
  <!-- L1 -->
  <line x1="40" y1="104" x2="920" y2="104" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="40" y="92" width="252" height="16" fill="#ffffff"/>
  <text class="mono" x="40" y="104" fill="#545B64" font-size="8" letter-spacing="0.10em">PHASE 1 · RAMP-UP (1→50 VUS)</text>

  <!-- L2 -->
  <line x1="40" y1="188" x2="920" y2="188" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="40" y="176" width="292" height="16" fill="#ffffff"/>
  <text class="mono" x="40" y="188" fill="#545B64" font-size="8" letter-spacing="0.10em">PHASE 2 · SUSTAINED (50 VUS, 5MIN)</text>

  <!-- L3 -->
  <line x1="40" y1="288" x2="920" y2="288" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="40" y="276" width="220" height="16" fill="#ffffff"/>
  <text class="mono" x="40" y="288" fill="#545B64" font-size="8" letter-spacing="0.10em">PHASE 3 · SPIKE (200 VUS)</text>

  <!-- L4 -->
  <line x1="40" y1="416" x2="920" y2="416" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="40" y="404" width="180" height="16" fill="#ffffff"/>
  <text class="mono" x="40" y="416" fill="#545B64" font-size="8" letter-spacing="0.10em">PHASE 4 · COOL-DOWN</text>

  <!-- ============ MESSAGES ============ -->

  <!-- M1: k6 -> API Gateway, TRAFFIC UP (phase1) -->
  <line x1="88" y1="132" x2="284" y2="132" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="150" y="112" width="72" height="12" fill="#ffffff"/>
  <text class="mono" x="186" y="121" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em">TRAFFIC UP</text>

  <!-- M2: API Gateway -> Grafana, RATE UP (phase1, telemetry / link) -->
  <line x1="284" y1="160" x2="872" y2="160" stroke="#0972D3" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="550" y="140" width="56" height="12" fill="#ffffff"/>
  <text class="mono" x="578" y="149" fill="#0972D3" font-size="8" text-anchor="middle" letter-spacing="0.06em">RATE UP</text>

  <!-- M3: KEDA self-loop, SCALE PODS 2-5 (phase2) -->
  <path d="M480,220 L502,220 Q508,220 508,226 L508,234 Q508,240 502,240 L480,240"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="512" y="224" width="88" height="12" fill="#ffffff"/>
  <text class="mono" x="556" y="233" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.04em">SCALE PODS 2-5</text>

  <!-- M4: Karpenter self-loop, PROVISION NODE (phase2, HEADLINE / ACCENT) -->
  <path d="M676,256 L698,256 Q704,256 704,262 L704,270 Q704,276 698,276 L676,276"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="708" y="260" width="96" height="12" fill="#ffffff"/>
  <text class="mono" x="756" y="269" fill="#EC7211" font-size="8" text-anchor="middle" letter-spacing="0.04em">PROVISION NODE</text>

  <!-- M5: k6 -> API Gateway, SPIKE TRAFFIC (phase3) -->
  <line x1="88" y1="316" x2="284" y2="316" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="146" y="296" width="80" height="12" fill="#ffffff"/>
  <text class="mono" x="186" y="305" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em">SPIKE TRAFFIC</text>

  <!-- M6: KEDA self-loop, SCALE-OUT FAST (phase3) -->
  <path d="M480,348 L502,348 Q508,348 508,354 L508,362 Q508,368 502,368 L480,368"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="512" y="352" width="96" height="12" fill="#ffffff"/>
  <text class="mono" x="560" y="361" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.04em">SCALE-OUT FAST</text>

  <!-- M7: Karpenter self-loop, ADD NODES (phase3) -->
  <path d="M676,384 L698,384 Q704,384 704,390 L704,398 Q704,404 698,404 L676,404"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="708" y="388" width="68" height="12" fill="#ffffff"/>
  <text class="mono" x="742" y="397" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em">ADD NODES</text>

  <!-- M8: k6 -> API Gateway, TRAFFIC DOWN (phase4) -->
  <line x1="88" y1="444" x2="284" y2="444" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="148" y="424" width="76" height="12" fill="#ffffff"/>
  <text class="mono" x="186" y="433" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em">TRAFFIC DOWN</text>

  <!-- M9: KEDA self-loop, SCALE-IN PODS (phase4) -->
  <path d="M480,476 L502,476 Q508,476 508,482 L508,490 Q508,496 502,496 L480,496"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="512" y="480" width="88" height="12" fill="#ffffff"/>
  <text class="mono" x="556" y="489" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.04em">SCALE-IN PODS</text>

  <!-- M10: Karpenter self-loop, REMOVE NODES (phase4) -->
  <path d="M676,512 L698,512 Q704,512 704,518 L704,526 Q704,532 698,532 L676,532"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="708" y="516" width="88" height="12" fill="#ffffff"/>
  <text class="mono" x="752" y="525" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.04em">REMOVE NODES</text>

  <!-- ============ ACTORS (painted last, over lifelines/arrows) ============ -->

  <!-- k6 (input) -->
  <rect x="18" y="40" width="140" height="36" rx="6" fill="#ffffff"/>
  <rect x="18" y="40" width="140" height="36" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <rect x="26" y="46" width="32" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.60)" stroke-width="0.8"/>
  <text class="mono" x="42" y="55" fill="#7D8998" font-size="7" text-anchor="middle" letter-spacing="0.08em">LOAD</text>
  <text x="88" y="66" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">k6</text>

  <!-- API Gateway (backend) -->
  <rect x="214" y="40" width="140" height="36" rx="6" fill="#ffffff"/>
  <rect x="214" y="40" width="140" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="222" y="46" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text class="mono" x="234" y="55" fill="#232F3E" font-size="7" text-anchor="middle" letter-spacing="0.08em">GW</text>
  <text x="284" y="66" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API Gateway</text>

  <!-- KEDA (focal) -->
  <rect x="410" y="40" width="140" height="36" rx="6" fill="#ffffff"/>
  <rect x="410" y="40" width="140" height="36" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <rect x="418" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
  <text class="mono" x="432" y="55" fill="#EC7211" font-size="7" text-anchor="middle" letter-spacing="0.08em">HPA</text>
  <text x="480" y="66" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">KEDA</text>

  <!-- Karpenter (focal) -->
  <rect x="606" y="40" width="140" height="36" rx="6" fill="#ffffff"/>
  <rect x="606" y="40" width="140" height="36" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <rect x="614" y="46" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
  <text class="mono" x="630" y="55" fill="#EC7211" font-size="7" text-anchor="middle" letter-spacing="0.08em">NODE</text>
  <text x="676" y="66" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Karpenter</text>

  <!-- Grafana (external/observability) -->
  <rect x="802" y="40" width="140" height="36" rx="6" fill="#ffffff"/>
  <rect x="802" y="40" width="140" height="36" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="810" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
  <text class="mono" x="824" y="55" fill="#545B64" font-size="7" text-anchor="middle" letter-spacing="0.08em">OBS</text>
  <text x="872" y="66" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Grafana</text>

</svg>