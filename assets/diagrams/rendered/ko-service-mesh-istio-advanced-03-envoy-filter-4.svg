<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="albdirect-title albdirect-desc">
  <title id="albdirect-title">클라이언트-ALB 직접 연결 XFF 흐름</title>
  <desc id="albdirect-desc">중간 CDN 없이 클라이언트가 AWS ALB에 직접 연결되어 Istio Gateway에 도달하며, ALB의 IP 한 홉만 XFF 헤더에 추가되는 가장 단순한 구성을 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Arrows first -->
  <line x1="164" y1="280" x2="284" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="176" y="260" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="224" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">XFF: (없음)</text>

  <line x1="412" y1="280" x2="532" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="420" y="260" width="104" height="12" rx="2" fill="#ffffff"/>
  <text x="472" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">XFF: 203.0.113.5</text>

  <line x1="660" y1="280" x2="780" y2="280" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="656" y="260" width="188" height="12" rx="2" fill="#ffffff"/>
  <text x="750" y="269" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">XFF: 203.0.113.5, 10.0.1.100</text>

  <!-- Nodes -->
  <rect x="40" y="256" width="124" height="48" rx="6" fill="#ffffff"/>
  <rect x="40" y="256" width="124" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="102" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">클라이언트</text>
  <text x="102" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">203.0.113.5</text>

  <rect x="288" y="256" width="124" height="48" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="288" y="256" width="124" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="350" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS ALB</text>
  <text x="350" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">10.0.1.100</text>

  <!-- Focal: Istio Gateway -->
  <rect x="536" y="256" width="124" height="48" rx="6" fill="#ffffff"/>
  <rect x="536" y="256" width="124" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="598" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio Gateway</text>
  <text x="598" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">10.0.2.50</text>

  <rect x="784" y="256" width="124" height="48" rx="6" fill="#ffffff"/>
  <rect x="784" y="256" width="124" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="846" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">애플리케이션</text>

  <!-- Legend -->
  <line x1="30" y1="404" x2="930" y2="404" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="424" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="160" y1="420" x2="192" y2="420" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="200" y="424" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">HOP 전달</text>
  <line x1="340" y1="420" x2="372" y2="420" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="380" y="424" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">xff_num_trusted_hops: 1 적용 지점</text>
</svg>