    <title id="en-eks-05-eks-security-2-title">EKS authentication mechanisms</title>
    <desc id="en-eks-05-eks-security-2-desc">Architecture diagram showing how DevOps, developers, CI/CD, and pods authenticate through IAM Authenticator, OIDC, or IRSA into the Kubernetes API server, RBAC, and service accounts, with IRSA also granting pods direct access to AWS resources.</desc>
