<title id="d5-title">Storage Options in Amazon EKS</title>
<desc id="d5-desc">Amazon EKS pods consume block storage from EBS, shared file storage from EFS, and high-performance parallel storage from FSx for Lustre, each provisioned through its own CSI driver, StorageClass, and PersistentVolume.</desc>
