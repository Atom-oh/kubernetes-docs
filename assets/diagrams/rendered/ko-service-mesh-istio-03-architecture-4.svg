<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inject-arch-title inject-arch-desc">
    <title id="inject-arch-title">사이드카 자동 주입 흐름</title>
    <desc id="inject-arch-desc">사용자의 Deployment 생성 요청이 API Server와 Mutating Webhook을 거쳐 Sidecar Injector에서 Pod Spec을 수정한 뒤, 수정된 스펙으로 istio-init·애플리케이션·istio-proxy 컨테이너를 가진 파드가 생성되는 과정을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Kubernetes -->
    <rect x="232" y="88" width="376" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="386" y="92" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="420" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KUBERNETES</text>

    <!-- Zone: Pod -->
    <rect x="32" y="388" width="576" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="48" y="392" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="112" y="401" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">생성된 파드</text>

    <!-- Arrows -->
    <line x1="192" y1="152" x2="248" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="392" y1="140" x2="448" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="448" y1="164" x2="392" y2="164" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="592" y1="140" x2="648" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="648" y1="164" x2="592" y2="164" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="320" y1="184" x2="320" y2="420" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="248" y1="452" x2="192" y2="452" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="392" y1="452" x2="448" y2="452" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Labels -->
    <rect x="196" y="134" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="220" y="143" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1·POST</text>

    <rect x="396" y="122" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="420" y="131" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2·호출</text>

    <rect x="396" y="170" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="420" y="179" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5·반환</text>

    <rect x="596" y="122" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="620" y="131" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3·요청</text>

    <rect x="596" y="170" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="620" y="179" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">4·SPEC</text>

    <rect x="336" y="296" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="364" y="305" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">6·생성</text>

    <rect x="196" y="434" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="220" y="443" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">7·완료</text>

    <rect x="396" y="434" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="420" y="443" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">7·완료</text>

    <!-- Node: Deploy (user) -->
    <rect x="48" y="120" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="48" y="120" width="144" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="56" y="128" width="32" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="72" y="137" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
    <text x="120" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Deployment 생성</text>
    <text x="120" y="172" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl apply</text>

    <!-- Node: API Server -->
    <rect x="248" y="120" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="248" y="120" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="256" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="270" y="137" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
    <text x="320" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Server</text>
    <text x="320" y="172" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">admission chain</text>

    <!-- Node: Mutating Webhook (focal) -->
    <rect x="448" y="120" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="448" y="120" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="456" y="128" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="472" y="137" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
    <text x="520" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Mutating Webhook</text>
    <text x="520" y="172" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sidecar-injector.istio.io</text>

    <!-- Node: Sidecar Injector -->
    <rect x="648" y="120" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="648" y="120" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="656" y="128" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="672" y="137" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MESH</text>
    <text x="720" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sidecar Injector</text>
    <text x="720" y="172" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Istio component</text>

    <!-- Node: 애플리케이션 -->
    <rect x="48" y="420" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="48" y="420" width="144" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="56" y="428" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="70" y="437" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="120" y="456" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">애플리케이션</text>
    <text x="120" y="472" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">container</text>

    <!-- Node: istio-init -->
    <rect x="248" y="420" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="248" y="420" width="144" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="256" y="428" width="32" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="272" y="437" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INIT</text>
    <text x="320" y="456" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">istio-init</text>
    <text x="320" y="472" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">init container</text>

    <!-- Node: istio-proxy -->
    <rect x="448" y="420" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="448" y="420" width="144" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="456" y="428" width="36" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="474" y="437" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>
    <text x="520" y="456" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">istio-proxy</text>
    <text x="520" y="472" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sidecar container</text>

    <!-- Legend -->
    <line x1="48" y1="524" x2="912" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="48" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="48" y="552" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="68" y="560" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal · Admission Webhook</text>
    <line x1="300" y1="558" x2="328" y2="558" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="336" y="560" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Webhook 응답(return)</text>
  </svg>