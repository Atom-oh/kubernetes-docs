<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vc-arch-title vc-arch-desc">
    <title id="vc-arch-title">vCluster multi-tenancy on a shared EKS cluster</title>
    <desc id="vc-arch-desc">Architecture diagram showing two teams each running a virtual Kubernetes control plane inside its own namespace, with developers connecting through a per-team Service and both vCluster pods syncing their workloads onto the same shared worker nodes.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="180" y="56" width="616" height="444" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="188" y="60" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="264" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">HOST CLUSTER (EKS)</text>

    <rect x="200" y="88" width="340" height="180" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="208" y="92" width="180" height="12" rx="2" fill="#ffffff"/>
    <text x="298" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NAMESPACE: TEAM-ALPHA</text>

    <rect x="200" y="304" width="340" height="180" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="208" y="308" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="296" y="317" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NAMESPACE: TEAM-BETA</text>

    <!-- Arrows -->
    <line x1="140" y1="144" x2="220" y2="144" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="140" y1="360" x2="220" y2="360" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M524,220 H564 Q572,220 572,228 V272 Q572,280 580,280 H620" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M524,436 H564 Q572,436 572,428 V304 Q572,296 580,296 H620" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="142" y="124" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="180" y="133" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KUBECONFIG</text>

    <rect x="142" y="340" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="180" y="349" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KUBECONFIG</text>

    <rect x="528" y="200" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="544" y="209" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC</text>

    <rect x="528" y="416" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="544" y="425" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC</text>

    <!-- Node: Developer A (input) -->
    <rect x="20" y="112" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="20" y="112" width="120" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="28" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
    <text x="42" y="129" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEV</text>
    <text x="80" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Developer A</text>
    <text x="80" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl</text>

    <!-- Node: Developer B (input) -->
    <rect x="20" y="328" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="20" y="328" width="120" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="28" y="336" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
    <text x="42" y="345" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEV</text>
    <text x="80" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Developer B</text>
    <text x="80" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl</text>

    <!-- Node: Service A (backend) -->
    <rect x="220" y="120" width="304" height="48" rx="6" fill="#ffffff"/>
    <rect x="220" y="120" width="304" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="228" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="242" y="137" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="380" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vcluster-team-alpha</text>
    <text x="380" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Kubernetes Service (ClusterIP)</text>

    <!-- Node: vCluster Pod A (backend) -->
    <rect x="220" y="188" width="304" height="64" rx="6" fill="#ffffff"/>
    <rect x="220" y="188" width="304" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="228" y="196" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="242" y="205" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
    <text x="380" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vCluster Pod</text>
    <text x="380" y="240" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">API + controller-manager + etcd + syncer</text>

    <!-- Node: Service B (backend) -->
    <rect x="220" y="336" width="304" height="48" rx="6" fill="#ffffff"/>
    <rect x="220" y="336" width="304" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="228" y="344" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="242" y="353" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="380" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vcluster-team-beta</text>
    <text x="380" y="376" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Kubernetes Service (ClusterIP)</text>

    <!-- Node: vCluster Pod B (backend) -->
    <rect x="220" y="404" width="304" height="64" rx="6" fill="#ffffff"/>
    <rect x="220" y="404" width="304" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="228" y="412" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="242" y="421" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
    <text x="380" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vCluster Pod</text>
    <text x="380" y="456" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">API + controller-manager + etcd + syncer</text>

    <!-- Node: Shared Worker Nodes (focal) -->
    <rect x="620" y="256" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="620" y="256" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="628" y="264" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.55)" stroke-width="0.8"/>
    <text x="646" y="273" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
    <text x="700" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Shared Worker Nodes</text>
    <text x="700" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one EC2/nodegroup pool</text>

    <!-- Legend -->
    <line x1="30" y1="528" x2="930" y2="528" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="546" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <circle cx="200" cy="542" r="4" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="212" y="546" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Developer (client)</text>

    <circle cx="400" cy="542" r="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="412" y="546" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Service / vCluster pod</text>

    <circle cx="620" cy="542" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="632" y="546" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Shared node capacity</text>

    <circle cx="820" cy="542" r="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="832" y="546" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Namespace boundary</text>
  </svg>