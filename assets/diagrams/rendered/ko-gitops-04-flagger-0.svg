<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t0-title t0-desc">
<title id="t0-title">전통적 배포와 점진적 배포 비교</title>
<desc id="t0-desc">전통적 배포는 전체 트래픽을 한번에 전환한 뒤 수동으로 모니터링하고 수동 롤백하지만, 점진적 배포는 소량의 트래픽부터 시작해 메트릭을 자동 분석하며 성공 시 트래픽 비율을 늘리고 실패 시 자동으로 롤백하는 순환 구조를 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: Traditional -->
<rect x="32" y="32" width="896" height="160" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="48" y="36" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="96" y="45" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">TRADITIONAL</text>

<!-- Zone: Progressive -->
<rect x="32" y="224" width="896" height="312" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="48" y="228" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="96" y="237" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">PROGRESSIVE</text>

<!-- Traditional arrows -->
<line x1="208" y1="132" x2="288" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="448" y1="132" x2="528" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="688" y1="132" x2="768" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Traditional nodes -->
<rect x="48" y="100" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="128" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">롤링 업데이트</text>

<rect x="288" y="100" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="368" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">전체 트래픽 전환</text>

<rect x="528" y="100" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="608" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">수동 모니터링</text>

<rect x="768" y="100" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="848" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">수동 롤백</text>

<!-- Progressive arrows -->
<line x1="208" y1="336" x2="330" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="510" y1="336" x2="580" y2="336" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="420" y1="384" x2="420" y2="440" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 660,304 V 268 Q 660,260 652,260 H 428 Q 420,260 420,268 V 288"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Arrow labels -->
<rect x="524" y="316" width="32" height="12" rx="2" fill="#ffffff"/>
<text x="540" y="325" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">성공</text>

<rect x="392" y="400" width="32" height="12" rx="2" fill="#ffffff"/>
<text x="408" y="409" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">실패</text>

<!-- Progressive nodes -->
<rect x="48" y="304" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="128" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">소량 트래픽 전환</text>

<!-- Diamond P2 -->
<polygon points="420,288 510,336 420,384 330,336" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="420" y="332" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">메트릭</text>
<text x="420" y="346" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">자동 분석</text>

<!-- P3 focal -->
<rect x="580" y="304" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="660" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">트래픽 비율 증가</text>

<!-- P4 -->
<rect x="340" y="440" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="420" y="476" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">자동 롤백</text>

<!-- Legend -->
<line x1="32" y1="556" x2="928" y2="556" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="32" y="572" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND</text>

<rect x="32" y="584" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="52" y="592" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">단계적 승격 (focal)</text>

<line x1="240" y1="590" x2="268" y2="590" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="276" y="592" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">순차 흐름</text>
</svg>