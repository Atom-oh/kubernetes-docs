<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ebpf4-title ebpf4-desc">
    <title id="ebpf4-title">eBPF 모드 데이터플레인 아키텍처</title>
    <desc id="ebpf4-desc">Pod의 애플리케이션에서 나온 패킷이 veth를 지나 하나의 TC eBPF 프로그램에서 Policy·NAT·Conntrack 맵을 해시로 조회해 정책, NAT, 라우팅을 한 번에 처리한 뒤 eth0로 나가는 구조를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="32" y="228" width="88" height="152" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="232" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="70" y="241" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">POD</text>

    <rect x="128" y="140" width="800" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="148" y="144" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="236" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOST NETWORK STACK</text>

    <rect x="380" y="180" width="480" height="288" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>
    <rect x="400" y="184" width="132" height="12" rx="2" fill="#ffffff"/>
    <text x="466" y="193" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">EBPF PROCESSING</text>

    <!-- Arrows -->
    <line x1="144" y1="332" x2="180" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="300" y1="332" x2="440" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M 480,300 V 260 Q 480,252 488,252 H 656"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <line x1="592" y1="332" x2="656" y2="332" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <path d="M 480,364 V 404 Q 480,412 488,412 H 656"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <path d="M 592,332 V 488 Q 592,496 600,496 H 884 Q 892,496 892,488 V 364"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: Application (Pod) -->
    <rect x="52" y="300" width="72" height="64" rx="6" fill="#ffffff"/>
    <rect x="52" y="300" width="72" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="88" y="336" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">App</text>

    <!-- Node: veth pair -->
    <rect x="180" y="300" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="180" y="300" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="336" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">veth pair</text>

    <!-- Node: TC eBPF Program (focal hub) -->
    <rect x="440" y="300" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="440" y="300" width="152" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="516" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">TC eBPF Program</text>
    <text x="516" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">정책 + NAT + 라우팅</text>

    <!-- Node: Policy Map (cylinder) -->
    <ellipse cx="724" cy="252" rx="68" ry="10" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <path d="M 656,252 V 288 A 68,10 0 0 0 792,288 V 252" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <ellipse cx="724" cy="288" rx="68" ry="10" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="724" y="273" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">Policy Map</text>

    <!-- Node: NAT Map (cylinder) -->
    <ellipse cx="724" cy="332" rx="68" ry="10" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <path d="M 656,332 V 368 A 68,10 0 0 0 792,368 V 332" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <ellipse cx="724" cy="368" rx="68" ry="10" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="724" y="353" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">NAT Map</text>

    <!-- Node: CT Map (cylinder) -->
    <ellipse cx="724" cy="412" rx="68" ry="10" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <path d="M 656,412 V 448 A 68,10 0 0 0 792,448 V 412" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <ellipse cx="724" cy="448" rx="68" ry="10" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="724" y="433" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">CT Map</text>

    <!-- Node: eth0 -->
    <rect x="860" y="300" width="64" height="64" rx="6" fill="#ffffff"/>
    <rect x="860" y="300" width="64" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="892" y="336" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">eth0</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="552" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="560" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif">O(1) 해시 조회로 정책·NAT·라우팅을 한 번에 처리</text>
  </svg>