<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="xffseq-title xffseq-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="xffseq-title">X-Forwarded-For header growth across the proxy chain</title>
    <desc id="xffseq-desc">Sequence diagram showing a client request passing through a load balancer, an Istio Gateway, and an Envoy sidecar, with each hop appending its own address to the X-Forwarded-For header before the application receives the final request.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Lifelines: Client 100, LB 300, Gateway 500, Envoy 700, App 900 -->
    <line x1="100" y1="96" x2="100" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="300" y1="96" x2="300" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="500" y1="96" x2="500" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="700" y1="96" x2="700" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="900" y1="96" x2="900" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Message 1: Client -> LB -->
    <path d="M100,148 H300" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="146" y="128" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="137" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">HTTP REQUEST</text>

    <!-- Note over LB -->
    <rect x="220" y="160" width="160" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
    <text x="300" y="175" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">XFF: 203.0.113.5</text>

    <!-- Message 2: LB -> Gateway -->
    <path d="M300,224 H500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="326" y="204" width="148" height="12" rx="2" fill="#ffffff"/>
    <text x="400" y="213" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">XFF: 203.0.113.5</text>

    <!-- Note over Gateway -->
    <rect x="404" y="236" width="192" height="24" rx="4" fill="rgba(255,153,0,0.06)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8"/>
    <text x="500" y="251" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">XFF: 203.0.113.5, 10.0.1.100</text>

    <!-- Message 3: Gateway -> Envoy (headline / focal) -->
    <path d="M500,300 H700" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="514" y="280" width="172" height="12" rx="2" fill="#ffffff"/>
    <text x="600" y="289" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">XFF: ...5.5, 10.0.1.100</text>

    <!-- Note over Envoy -->
    <rect x="592" y="312" width="216" height="36" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
    <text x="700" y="327" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">XFF PROCESSING DETERMINED</text>
    <text x="700" y="339" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">BY use_remote_address</text>

    <!-- Message 4: Envoy -> App -->
    <path d="M700,388 H900" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="742" y="368" width="116" height="12" rx="2" fill="#ffffff"/>
    <text x="800" y="377" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">XFF PASSED</text>

    <!-- Actor boxes (drawn after lifelines/messages, top) -->
    <g>
      <rect x="44" y="48" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="100" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
      <text x="100" y="82" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">203.0.113.5</text>
    </g>
    <g>
      <rect x="244" y="48" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="300" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Load Balancer</text>
      <text x="300" y="82" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.1.100</text>
    </g>
    <g>
      <rect x="444" y="48" width="112" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="500" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio Gateway</text>
      <text x="500" y="82" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.2.50</text>
    </g>
    <g>
      <rect x="644" y="48" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="700" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>
      <text x="700" y="82" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.1.10</text>
    </g>
    <g>
      <rect x="844" y="48" width="112" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="900" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    </g>
  </svg>