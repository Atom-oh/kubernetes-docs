<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fluxcd-ttl fluxcd-desc">
<title id="fluxcd-ttl">How FluxCD reconciles a Kubernetes cluster</title>
<desc id="fluxcd-desc">Git, Helm, OCI, and bucket source definitions feed the Source Controller, which drives the Kustomize and Helm controllers to apply resources into the cluster; the Notification Controller watches all three controllers, and the Image Automation Controller writes updated image tags back to the source definitions.</desc>

<rect width="960" height="600" fill="var(--paper)"/>

<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs><defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/>
  </marker>
  <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="var(--soft)"/>
  </marker>
</defs>

<!-- Header -->
<text x="24" y="24" class="mono" font-size="8" letter-spacing="0.18em" fill="var(--soft)">GITOPS &#183; FLUXCD</text>
<text x="24" y="46" font-size="20" font-weight="700" fill="var(--ink)">How FluxCD reconciles a cluster</text>

<!-- ================= ZONES (bg -> zones -> arrows -> nodes) ================= -->
<!-- Git Sources zone -->
<rect x="24" y="220" width="192" height="112" rx="8" fill="var(--ink)" opacity="0.02" stroke="var(--rule)" stroke-width="0.8"/>
<rect x="36" y="224" width="112" height="12" rx="2" fill="var(--paper)"/>
<text x="92" y="233" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="var(--soft)">GIT SOURCES</text>

<!-- FluxCD Controllers zone -->
<rect x="208" y="64" width="536" height="468" rx="8" fill="var(--ink)" opacity="0.02" stroke="var(--rule)" stroke-width="0.8"/>
<rect x="220" y="68" width="164" height="12" rx="2" fill="var(--paper)"/>
<text x="302" y="77" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="var(--soft)">FLUXCD CONTROLLERS</text>

<!-- Kubernetes Cluster zone -->
<rect x="768" y="308" width="176" height="112" rx="8" fill="var(--ink)" opacity="0.02" stroke="var(--rule)" stroke-width="0.8"/>
<rect x="780" y="312" width="152" height="12" rx="2" fill="var(--paper)"/>
<text x="856" y="321" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="var(--soft)">KUBERNETES CLUSTER</text>

<!-- ================= ARROWS (behind nodes) ================= -->

<!-- 1. Source Definitions -> Source Controller -->
<path d="M200,284 H284 Q292,284 292,276 V240 Q292,232 300,232 H384"
      fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="228" y="256" width="40" height="12" rx="2" fill="var(--paper)"/>
<text x="248" y="265" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--soft)">FETCH</text>

<!-- 2. Source Controller -> Kustomize Controller -->
<path d="M424,264 V300 Q424,308 416,308 H312 Q304,308 304,316 V340"
      fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- 3. Source Controller -> Helm Controller -->
<path d="M504,264 V300 Q504,308 512,308 H636 Q644,308 644,316 V340"
      fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="428" y="292" width="72" height="12" rx="2" fill="var(--paper)"/>
<text x="464" y="301" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--soft)">RECONCILE</text>

<!-- 4. Kustomize Controller -> Kubernetes Resources -->
<path d="M384,360 H768 Q776,360 776,360 H784"
      fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="584" y="344" width="48" height="12" rx="2" fill="var(--paper)"/>
<text x="608" y="353" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--soft)">APPLY</text>

<!-- 5. Helm Controller -> Kubernetes Resources -->
<path d="M728,384 H756 Q764,384 764,384 V392 Q764,400 772,400 H784"
      fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="736" y="392" width="44" height="12" rx="2" fill="var(--paper)"/>
<text x="758" y="401" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--soft)">RELEASE</text>

<!-- 6. Notification Controller -> Source Controller (same x, straight) -->
<line x1="464" y1="152" x2="464" y2="200" stroke="var(--soft)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>

<!-- 7. Notification Controller -> Kustomize Controller -->
<path d="M424,152 H312 Q304,152 304,160 V340"
      fill="none" stroke="var(--soft)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>

<!-- 8. Notification Controller -> Helm Controller -->
<path d="M504,152 H636 Q644,152 644,160 V340"
      fill="none" stroke="var(--soft)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>

<!-- 9. Image Automation Controller -> Source Definitions (dashed, transit) -->
<path d="M568,488 H120 V332"
      fill="none" stroke="var(--soft)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
<rect x="272" y="472" width="88" height="12" rx="2" fill="var(--paper)"/>
<text x="316" y="481" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--soft)">IMAGE UPDATE</text>

<!-- ================= NODES ================= -->

<!-- Source Definitions -->
<rect x="40" y="252" width="160" height="64" rx="6" fill="var(--paper)"/>
<rect x="40" y="252" width="160" height="64" rx="6" fill="var(--ink)" opacity="0.05" stroke="var(--muted)" stroke-width="1"/>
<text x="120" y="278" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Source Definitions</text>
<text x="120" y="296" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">Git &#183; Helm &#183; OCI &#183; Bucket</text>

<!-- Notification Controller (optional/support treatment) -->
<rect x="384" y="96" width="160" height="56" rx="6" fill="var(--paper)"/>
<rect x="384" y="96" width="160" height="56" rx="6" fill="var(--ink)" opacity="0.02" stroke="var(--ink)" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
<text x="464" y="128" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Notification Controller</text>
<text x="464" y="142" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">events &#183; alerts</text>

<!-- Source Controller (FOCAL) -->
<rect x="384" y="200" width="160" height="64" rx="6" fill="var(--paper)"/>
<rect x="384" y="200" width="160" height="64" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
<text x="464" y="228" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Source Controller</text>
<text x="464" y="246" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">fetch &#183; verify &#183; cache</text>

<!-- Kustomize Controller -->
<rect x="224" y="340" width="160" height="64" rx="6" fill="var(--paper)"/>
<rect x="224" y="340" width="160" height="64" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
<text x="304" y="368" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Kustomize Controller</text>
<text x="304" y="386" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">build &#183; apply</text>

<!-- Helm Controller -->
<rect x="568" y="340" width="160" height="64" rx="6" fill="var(--paper)"/>
<rect x="568" y="340" width="160" height="64" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
<text x="648" y="368" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Helm Controller</text>
<text x="648" y="386" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">template &#183; release</text>

<!-- Image Automation Controller (optional/support treatment) -->
<rect x="488" y="460" width="160" height="56" rx="6" fill="var(--paper)"/>
<rect x="488" y="460" width="160" height="56" rx="6" fill="var(--ink)" opacity="0.02" stroke="var(--ink)" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
<text x="568" y="486" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Image Automation</text>
<text x="568" y="502" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">scan &#183; write back</text>

<!-- Kubernetes Resources -->
<rect x="784" y="340" width="144" height="64" rx="6" fill="var(--paper)"/>
<rect x="784" y="340" width="144" height="64" rx="6" fill="var(--ink)" opacity="0.05" stroke="var(--muted)" stroke-width="1"/>
<text x="856" y="366" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Cluster Resources</text>
<text x="856" y="384" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">NS &#183; Deploy &#183; Svc &#183; CM</text>

<!-- Legend -->
<line x1="24" y1="556" x2="936" y2="556" stroke="var(--rule)" stroke-width="0.8"/>
<circle cx="30" cy="572" r="4" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
<text x="40" y="576" class="mono" font-size="8" fill="var(--muted)">RECONCILIATION HUB</text>
<line x1="220" y1="572" x2="240" y2="572" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="248" y="576" class="mono" font-size="8" fill="var(--muted)">RECONCILE PATH</text>
<line x1="420" y1="572" x2="440" y2="572" stroke="var(--soft)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
<text x="448" y="576" class="mono" font-size="8" fill="var(--muted)">EVENTS / ASYNC</text>

</svg>