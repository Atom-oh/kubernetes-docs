<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc">
    <title id="d2-title">Span 구조</title>
    <desc id="d2-desc">하나의 Span이 식별자 헤더, 시간 정보, 운영 메타데이터, 최종 상태의 네 그룹으로 구성되어 순서대로 채워지는 구조를 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows -->
    <line x1="480" y1="136" x2="480" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="272" x2="480" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="408" x2="480" y2="448" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Box 1: 헤더 정보 -->
    <rect x="240" y="40" width="480" height="96" rx="6" fill="#ffffff"/>
    <rect x="240" y="40" width="480" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="264" y="58" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">01 · 식별자</text>
    <text x="480" y="66" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">헤더 정보</text>
    <text x="264" y="86" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">TraceID: abc123</text>
    <text x="264" y="100" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">SpanID: span001</text>
    <text x="264" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">ParentSpanID: null</text>

    <!-- Box 2: 시간 정보 -->
    <rect x="240" y="176" width="480" height="96" rx="6" fill="#ffffff"/>
    <rect x="240" y="176" width="480" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="264" y="194" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">02 · 타이밍</text>
    <text x="480" y="202" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">시간 정보</text>
    <text x="264" y="222" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Start: 10:30:00.000</text>
    <text x="264" y="236" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Duration: 150ms</text>

    <!-- Box 3: 메타데이터 -->
    <rect x="240" y="312" width="480" height="96" rx="6" fill="#ffffff"/>
    <rect x="240" y="312" width="480" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="264" y="330" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">03 · 메타데이터</text>
    <text x="480" y="338" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">메타데이터</text>
    <text x="264" y="358" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Operation: HTTP GET /users</text>
    <text x="264" y="372" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Tags: service=api, http.method=GET</text>
    <text x="264" y="386" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Logs: request received, response sent</text>

    <!-- Box 4: 상태 (focal) -->
    <rect x="240" y="448" width="480" height="96" rx="6" fill="#ffffff"/>
    <rect x="240" y="448" width="480" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="264" y="466" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">04 · 결과</text>
    <text x="480" y="474" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">상태</text>
    <text x="264" y="494" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace">Status: OK</text>
  </svg>