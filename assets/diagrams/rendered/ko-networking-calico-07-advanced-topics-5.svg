<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hns-title hns-desc">
    <title id="hns-title">Calico Windows의 HNS 통합</title>
    <desc id="hns-desc">Windows 노드에서 컨테이너와 Calico Node 서비스의 트래픽이 모두 HNS로 모여 VFP를 거쳐 물리 NIC로 나가는 통합 경로를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Windows Node -->
    <rect x="60" y="72" width="840" height="400" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="424" y="76" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WINDOWS NODE</text>

    <!-- Zone: Container Runtime (nested) -->
    <rect x="88" y="112" width="220" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="112" y="116" width="172" height="12" rx="2" fill="#ffffff"/>
    <text x="198" y="125" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONTAINER RUNTIME</text>

    <!-- Zone: Calico Windows (nested) -->
    <rect x="356" y="112" width="256" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="404" y="116" width="160" height="12" rx="2" fill="#ffffff"/>
    <text x="484" y="125" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CALICO WINDOWS</text>

    <!-- Arrows first -->
    <path d="M 168,204 V 244 Q 168,252 176,252 H 420"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 228,204 V 232 Q 228,240 236,240 H 420"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="376" y1="204" x2="424" y2="228" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="228" x2="480" y2="264" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="480" y1="312" x2="480" y2="416" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels -->
    <rect x="452" y="242" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="251" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">가상 스위치</text>

    <rect x="452" y="352" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="361" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">패킷 필터링</text>

    <!-- Nodes: Containers -->
    <rect x="108" y="156" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="168" y="184" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Container 1</text>

    <rect x="248" y="156" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="308" y="184" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Container 2</text>

    <!-- Node: Calico Node service -->
    <rect x="376" y="156" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="446" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Calico Node</text>
    <text x="446" y="194" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Windows Service</text>

    <!-- Node: HNS (focal - fan-in) -->
    <rect x="420" y="264" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="490" y="288" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">HNS</text>
    <text x="490" y="302" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Host Network Svc</text>

    <!-- Node: VFP -->
    <rect x="410" y="368" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="392" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VFP</text>
    <text x="480" y="406" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Virtual Filtering</text>

    <!-- Node: Physical NIC -->
    <rect x="410" y="428" width="140" height="32" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="448" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Physical NIC</text>

    <!-- Legend -->
    <line x1="60" y1="500" x2="900" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="60" y="532" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="80" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">HNS (트래픽 통합 지점)</text>

    <rect x="300" y="532" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="320" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">필터링 계층</text>

    <rect x="460" y="532" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">물리 인터페이스</text>
  </svg>