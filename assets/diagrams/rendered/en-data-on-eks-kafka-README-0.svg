<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kafka-recon-title kafka-recon-desc">
  <title id="kafka-recon-title">Strimzi Kafka reconciliation flow on EKS</title>
  <desc id="kafka-recon-desc">The Strimzi operator watches Kafka and KafkaNodePool custom resources applied to the Kubernetes API server, then reconciles broker and controller pods, each backed by its own EBS gp3-backed persistent volume claim.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs><defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="32" y="36" class="mono" fill="#7D8998" font-size="8" letter-spacing="0.14em">STRIMZI ON EKS</text>
  <text x="32" y="62" font-size="20" font-weight="700" fill="#232F3E">Kafka reconciliation flow</text>
  <text x="32" y="82" font-size="12" fill="#545B64">Custom resource to broker/controller pods, each on its own EBS-backed volume</text>

  <!-- Zone: reconciled workloads -->
  <rect x="424" y="216" width="504" height="180" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="440" y="220" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="510" y="229" class="mono" fill="rgba(35,47,62,0.40)" font-size="7" text-anchor="middle" letter-spacing="0.14em">RECONCILED WORKLOADS</text>

  <!-- ===== Arrows (drawn before boxes) ===== -->

  <!-- User -> API Server (horizontal) -->
  <path d="M 176,132 H 276" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="176" y="112" width="100" height="12" rx="2" fill="#ffffff"/>
  <text x="226" y="121" class="mono" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em">APPLY CR</text>

  <!-- API Server -> Operator (horizontal) -->
  <path d="M 460,132 H 572" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="474" y="112" width="86" height="12" rx="2" fill="#ffffff"/>
  <text x="517" y="121" class="mono" fill="#EC7211" font-size="8" text-anchor="middle" letter-spacing="0.06em">WATCHES</text>

  <!-- Operator -> Broker Pod 1 (down, fan point 1 of 3, L=168 width of operator box) -->
  <path d="M 664,168 V 200 Q 664,208 656,208 H 508 Q 500,208 500,216 V 236"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- Operator -> Broker Pod 2 (straight down center) -->
  <path d="M 728,168 V 236" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- Operator -> Controller Pod (down, fan point 3 of 3) -->
  <path d="M 792,168 V 200 Q 792,208 800,208 H 844 Q 852,208 852,216 V 236"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="700" y="188" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="756" y="197" class="mono" fill="#EC7211" font-size="8" text-anchor="middle" letter-spacing="0.06em">RECONCILES</text>

  <!-- Broker Pod 1 -> PVC 1 (vertical) -->
  <path d="M 500,320 V 356" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Broker Pod 2 -> PVC 2 (vertical) -->
  <path d="M 728,320 V 356" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Controller Pod -> PVC 3 (vertical) -->
  <path d="M 852,320 V 356" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="466" y="330" width="68" height="12" rx="2" fill="#ffffff"/>
  <text x="500" y="339" class="mono" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.04em">MOUNTS</text>

  <!-- ===== Nodes ===== -->

  <!-- User -->
  <rect x="76" y="112" width="100" height="40" rx="6" fill="rgba(84,91,100,0.10)"/>
  <rect x="76" y="112" width="100" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="126" y="136" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Operator / User</text>

  <!-- API Server -->
  <rect x="276" y="112" width="184" height="40" rx="6" fill="#ffffff"/>
  <rect x="276" y="112" width="184" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="284" y="118" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="299" y="127" class="mono" fill="rgba(35,47,62,0.8)" font-size="7" text-anchor="middle" letter-spacing="0.06em">API</text>
  <text x="368" y="136" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Kubernetes API Server</text>

  <!-- Operator (focal) -->
  <rect x="572" y="112" width="192" height="56" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="572" y="112" width="192" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="668" y="138" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Strimzi Operator</text>
  <text x="668" y="154" class="mono" fill="#545B64" font-size="9" text-anchor="middle">Kafka / KafkaNodePool</text>

  <!-- Broker Pod 1 -->
  <rect x="444" y="236" width="112" height="84" rx="6" fill="#ffffff"/>
  <rect x="444" y="236" width="112" height="84" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="500" y="272" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Broker Pod 1</text>
  <text x="500" y="288" class="mono" fill="#545B64" font-size="9" text-anchor="middle">strimzi-kafka</text>

  <!-- Broker Pod 2 -->
  <rect x="672" y="236" width="112" height="84" rx="6" fill="#ffffff"/>
  <rect x="672" y="236" width="112" height="84" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="728" y="272" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Broker Pod 2</text>
  <text x="728" y="288" class="mono" fill="#545B64" font-size="9" text-anchor="middle">strimzi-kafka</text>

  <!-- Controller Pod -->
  <rect x="796" y="236" width="112" height="84" rx="6" fill="#ffffff"/>
  <rect x="796" y="236" width="112" height="84" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="852" y="272" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Controller Pod</text>
  <text x="852" y="288" class="mono" fill="#545B64" font-size="9" text-anchor="middle">strimzi-kafka</text>

  <!-- PVC 1 -->
  <rect x="444" y="356" width="112" height="40" rx="6" fill="rgba(35,47,62,0.05)"/>
  <rect x="444" y="356" width="112" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="500" y="380" class="mono" fill="#232F3E" font-size="9" text-anchor="middle" letter-spacing="0.02em">EBS gp3 PVC</text>

  <!-- PVC 2 -->
  <rect x="672" y="356" width="112" height="40" rx="6" fill="rgba(35,47,62,0.05)"/>
  <rect x="672" y="356" width="112" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="728" y="380" class="mono" fill="#232F3E" font-size="9" text-anchor="middle" letter-spacing="0.02em">EBS gp3 PVC</text>

  <!-- PVC 3 -->
  <rect x="796" y="356" width="112" height="40" rx="6" fill="rgba(35,47,62,0.05)"/>
  <rect x="796" y="356" width="112" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="852" y="380" class="mono" fill="#232F3E" font-size="9" text-anchor="middle" letter-spacing="0.02em">EBS gp3 PVC</text>

  <!-- Legend -->
  <line x1="32" y1="452" x2="928" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="472" class="mono" fill="#545B64" font-size="8" letter-spacing="0.14em">LEGEND</text>

  <line x1="140" y1="468" x2="172" y2="468" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="180" y="472" font-size="11" fill="#232F3E">Operator control path</text>

  <line x1="420" y1="468" x2="452" y2="468" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="460" y="472" font-size="11" fill="#232F3E">Storage mount</text>

  <rect x="660" y="460" width="16" height="16" rx="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="684" y="472" font-size="11" fill="#232F3E">Focal reconciler</text>

  <text x="32" y="500" font-size="14" font-style="italic" fill="#545B64">One CR apply drives three independently reconciled, independently persisted pods.</text>
</svg>