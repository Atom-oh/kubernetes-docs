    <title id="ko-core-04-storage-5-title">Projected Volume 구성</title>
    <desc id="ko-core-04-storage-5-desc">하나의 Projected Volume이 secret·configMap·downwardAPI·serviceAccountToken 네 가지 소스를 /etc/credentials 한 경로로 모아 마운트하고, 각 소스가 결과 디렉토리에서 이름이 다른 개별 파일로 나타남을 보여준다.</desc>
