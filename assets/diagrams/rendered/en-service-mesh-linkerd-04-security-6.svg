<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seclayers-title seclayers-desc">
    <title id="seclayers-title">Network vs. application security layers</title>
    <desc id="seclayers-desc">Architecture diagram showing Linkerd's network-level mTLS encryption, service authorization, and workload identity each feeding a corresponding application-level control: JWT/OAuth, application RBAC, and input validation.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="60" width="880" height="160" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="384" y="64" width="192" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NETWORK LEVEL (LINKERD)</text>

    <rect x="40" y="340" width="880" height="160" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="392" y="344" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="353" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APPLICATION LEVEL</text>

    <!-- Arrows: three parallel vertical connectors, same x, straight -->
    <line x1="160" y1="216" x2="160" y2="336" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="480" y1="216" x2="480" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="800" y1="216" x2="800" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="130" y="264" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="160" y="274" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">ENFORCES</text>
    <rect x="450" y="264" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="274" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">FEEDS INTO</text>
    <rect x="770" y="264" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="800" y="274" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">FEEDS INTO</text>

    <!-- Nodes: Network Level -->
    <rect x="80" y="140" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="80" y="140" width="160" height="56" rx="6" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="160" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">mTLS Encryption</text>
    <text x="160" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">automatic</text>

    <rect x="400" y="140" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service Authz</text>
    <text x="480" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">serverauthorization</text>

    <rect x="720" y="140" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="720" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="800" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Workload Identity</text>
    <text x="800" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">spiffe id</text>

    <!-- Nodes: Application Level -->
    <rect x="80" y="420" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="80" y="420" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="160" y="444" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">JWT / OAuth</text>
    <text x="160" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user auth</text>

    <rect x="400" y="420" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="420" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="444" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application RBAC</text>
    <text x="480" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">permission checks</text>

    <rect x="720" y="420" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="720" y="420" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="800" y="444" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Input Validation</text>
    <text x="800" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sanitization</text>

    <!-- Legend -->
    <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="550" width="14" height="10" rx="2" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="558" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">mTLS (focal — automatic, zero-config)</text>
    <rect x="380" y="552" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="400" y="558" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Application-level control</text>
  </svg>