<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="traffic-shift-title traffic-shift-desc">
<title id="traffic-shift-title">Traffic Shifting Progress</title>
<desc id="traffic-shift-desc">Canary traffic weight climbs in five steps from 10% to 50% before promotion to 100%, and at each step Flagger analyzes the request success rate and P99 duration and runs any configured webhooks.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ===== Zones ===== -->
<rect x="40" y="80" width="880" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="48" y="84" width="170" height="12" rx="2" fill="#ffffff"/>
<text x="133" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">TRAFFIC SHIFTING PROGRESS</text>

<rect x="40" y="252" width="880" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="48" y="256" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="98" y="265" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">AT EACH STEP</text>

<!-- ===== Chain arrows ===== -->
<path d="M160,140 H192" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M312,140 H344" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M464,140 H496" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M616,140 H648" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M768,140 H800" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- ===== Analysis arrows (dashed, fanned from S3 bottom) ===== -->
<path d="M380,164 V232 Q380,240 372,240 H288 Q280,240 280,248 V280" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M404,164 V256 Q404,264 412,264 H432 Q440,264 440,272 V280" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M428,164 V240 Q428,248 436,248 H592 Q600,248 600,256 V280" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Analysis labels -->
<rect x="256" y="220" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="286" y="229" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">ANALYZE</text>

<rect x="410" y="244" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="440" y="253" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">ANALYZE</text>

<rect x="546" y="228" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="576" y="237" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">EXECUTE</text>

<!-- ===== Chain nodes ===== -->
<rect x="40" y="116" width="120" height="48" rx="6" fill="#ffffff"/>
<rect x="40" y="116" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#232F3E" stroke-width="1"/>
<text x="100" y="137" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Step 1</text>
<text x="100" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">weight: 10%</text>

<rect x="192" y="116" width="120" height="48" rx="6" fill="#ffffff"/>
<rect x="192" y="116" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#232F3E" stroke-width="1"/>
<text x="252" y="137" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Step 2</text>
<text x="252" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">weight: 20%</text>

<rect x="344" y="116" width="120" height="48" rx="6" fill="#ffffff"/>
<rect x="344" y="116" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#232F3E" stroke-width="1"/>
<text x="404" y="137" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Step 3</text>
<text x="404" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">weight: 30%</text>

<rect x="496" y="116" width="120" height="48" rx="6" fill="#ffffff"/>
<rect x="496" y="116" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#232F3E" stroke-width="1"/>
<text x="556" y="137" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Step 4</text>
<text x="556" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">weight: 40%</text>

<rect x="648" y="116" width="120" height="48" rx="6" fill="#ffffff"/>
<rect x="648" y="116" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#232F3E" stroke-width="1"/>
<text x="708" y="137" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Step 5</text>
<text x="708" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">weight: 50%</text>

<rect x="800" y="116" width="120" height="48" rx="6" fill="rgba(255,153,0,0.10)"/>
<rect x="800" y="116" width="120" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="860" y="137" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Promote</text>
<text x="860" y="152" fill="#EC7211" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">weight: 100%</text>

<!-- ===== Check nodes ===== -->
<rect x="220" y="280" width="120" height="56" rx="6" fill="#ffffff"/>
<rect x="220" y="280" width="120" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="280" y="304" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Success rate</text>
<text x="280" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">&gt;= 99%</text>

<rect x="380" y="280" width="120" height="56" rx="6" fill="#ffffff"/>
<rect x="380" y="280" width="120" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="440" y="304" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Duration P99</text>
<text x="440" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">&lt;= 500ms</text>

<rect x="540" y="280" width="120" height="56" rx="6" fill="#ffffff"/>
<rect x="540" y="280" width="120" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="600" y="304" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Webhooks</text>
<text x="600" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">load test · conformance</text>
</svg>