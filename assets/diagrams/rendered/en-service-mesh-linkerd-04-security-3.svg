<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="identseq-title identseq-desc">
    <title id="identseq-title">Workload identity issuance</title>
    <desc id="identseq-desc">Sequence diagram showing a pod obtaining its ServiceAccount token, generating a CSR with a SPIFFE ID, and sending it to the Identity Controller, which validates the request, asks the Trust Anchor to sign the certificate, and returns the signed workload certificate to the pod.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines: x = 128, 388, 648, 872 -->
    <line x1="128" y1="128" x2="128" y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="388" y1="128" x2="388" y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="648" y1="128" x2="648" y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="872" y1="128" x2="872" y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="124" y="172" width="8" height="312" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="644" y="264" width="8" height="220" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- M1: Pod -> ServiceAccount, obtain token -->
    <line x1="132" y1="172" x2="384" y2="172" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M2: Pod self, generate CSR -->
    <path d="M 132 200 L 168 200 L 168 232 L 132 232" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M3: Pod -> Identity Controller, send CSR + token -->
    <line x1="132" y1="264" x2="644" y2="264" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- M4: ID self, validate SA token -->
    <path d="M 652 292 L 688 292 L 688 320 L 652 320" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M5: ID self, validate pod info -->
    <path d="M 652 332 L 688 332 L 688 360 L 652 360" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M6: ID self, generate SPIFFE ID -->
    <path d="M 652 372 L 688 372 L 688 400 L 652 400" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M7: ID -> Trust Anchor, cert signing request -->
    <line x1="652" y1="428" x2="872" y2="428" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M8: Trust Anchor to Identity Controller, signed certificate (dashed return) -->
    <line x1="872" y1="456" x2="652" y2="456" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- M9: Identity Controller to Pod, workload certificate (dashed return, headline) -->
    <line x1="644" y1="484" x2="132" y2="484" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

    <!-- Message labels -->
    <rect x="216" y="160" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="256" y="170" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">GET SA TOKEN</text>

    <rect x="176" y="212" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="212" y="222" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">GENERATE CSR</text>

    <rect x="348" y="252" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="388" y="262" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">CSR + SA TOKEN</text>

    <rect x="696" y="302" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="734" y="312" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">VALIDATE SA</text>

    <rect x="696" y="342" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="736" y="352" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">VALIDATE POD</text>

    <rect x="696" y="382" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="740" y="392" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">GEN SPIFFE ID</text>

    <rect x="700" y="416" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="736" y="426" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">SIGN CSR</text>

    <rect x="700" y="444" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="736" y="454" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">SIGNED CERT</text>

    <rect x="332" y="472" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="376" y="482" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">WORKLOAD CERT</text>

    <!-- Actors -->
    <rect x="56" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="72" width="144" height="56" rx="6" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="128" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod / Proxy</text>
    <text x="128" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">requester</text>

    <rect x="316" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="316" y="72" width="144" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="388" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ServiceAccount</text>
    <text x="388" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">k8s token</text>

    <rect x="576" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="576" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="648" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Identity Controller</text>
    <text x="648" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">control plane</text>

    <rect x="800" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="800" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="872" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Trust Anchor</text>
    <text x="872" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">root ca</text>

    <!-- Legend -->
    <line x1="56" y1="500" x2="912" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="56" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="56" y="530" width="14" height="10" rx="2" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="76" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Requesting pod (focal)</text>
    <line x1="256" y1="535" x2="284" y2="535" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="292" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Headline cert request / issuance</text>
    <line x1="540" y1="535" x2="568" y2="535" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="576" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return message</text>
  </svg>