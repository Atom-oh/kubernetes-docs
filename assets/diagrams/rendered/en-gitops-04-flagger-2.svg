<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="canary-metrics-seq-title canary-metrics-seq-desc">
<title id="canary-metrics-seq-title">Canary Metrics Analysis Step</title>
<desc id="canary-metrics-seq-desc">Flagger shifts a slice of traffic to the canary pod through the mesh, then queries Prometheus for success rate and latency against thresholds before advancing the traffic weight.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ===== Lifelines ===== -->
<line x1="140" y1="76" x2="140" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="380" y1="76" x2="380" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="620" y1="76" x2="620" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="860" y1="76" x2="860" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- ===== Messages ===== -->
<!-- 1 F->M -->
<path d="M620,104 H380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="440" y="86" width="132" height="12" rx="2" fill="#ffffff"/>
<text x="506" y="95" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">SET CANARY WEIGHT 10%</text>

<!-- 2 M->C -->
<path d="M380,144 H140" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="180" y="126" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="255" y="135" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">ROUTE 10% TRAFFIC TO CANARY</text>

<!-- Note over C -->
<rect x="76" y="160" width="128" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.25)" stroke-width="0.8"/>
<text x="140" y="175" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">NOTE: handles</text>
<text x="140" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">incoming requests</text>

<!-- 3 C->M -->
<path d="M140,216 H380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="188" y="198" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="258" y="207" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">RETURN RESPONSES</text>

<!-- 4 M->P (spans over F lifeline) -->
<path d="M380,256 H860" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="558" y="238" width="164" height="12" rx="2" fill="#ffffff"/>
<text x="640" y="247" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">REPORT METRICS: LATENCY, STATUS</text>

<!-- 5 F->P -->
<path d="M620,296 H860" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="668" y="278" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="743" y="287" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">QUERY: SUCCESS RATE?</text>

<!-- 6 P-->F return -->
<path d="M860,336 H620" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="668" y="318" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="743" y="327" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">99.5% (threshold 99%)</text>

<!-- 7 F->P -->
<path d="M620,376 H860" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="662" y="358" width="162" height="12" rx="2" fill="#ffffff"/>
<text x="743" y="367" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">QUERY: DURATION P99?</text>

<!-- 8 P-->F return -->
<path d="M860,416 H620" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="662" y="398" width="162" height="12" rx="2" fill="#ffffff"/>
<text x="743" y="407" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">250ms (threshold 500ms)</text>

<!-- 9 F->F self loop -->
<path d="M620,448 H688 Q696,448 696,456 V456 Q696,464 688,464 H620" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="702" y="450" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="708" y="459" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.02em">all checks passed</text>

<!-- 10 F->M headline success -->
<path d="M620,504 H380" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="418" y="486" width="164" height="12" rx="2" fill="#ffffff"/>
<text x="500" y="495" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">ADVANCE: SET WEIGHT 20%</text>

<!-- ===== Actor boxes (drawn after lines) ===== -->
<rect x="80" y="40" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="80" y="40" width="120" height="36" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="140" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Canary Pod</text>

<rect x="320" y="40" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="320" y="40" width="120" height="36" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="380" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Mesh / Ingress</text>

<rect x="560" y="40" width="120" height="36" rx="6" fill="rgba(255,153,0,0.10)"/>
<rect x="560" y="40" width="120" height="36" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="620" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Flagger</text>

<rect x="800" y="40" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="800" y="40" width="120" height="36" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="860" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
</svg>