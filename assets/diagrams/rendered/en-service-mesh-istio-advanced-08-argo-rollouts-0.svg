<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
    <title id="d0-title">Manual vs. automated canary traffic control</title>
    <desc id="d0-desc">Without Argo Rollouts, two static Deployments require a human to hand-edit the VirtualService for every traffic shift. With Argo Rollouts and Istio, a single Rollout resource drives automatic, metric-verified traffic adjustment through an Analysis step.</desc>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="24" y="40" width="424" height="464" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="512" y="40" width="424" height="464" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="52" width="180" height="16" rx="2" fill="#ffffff"/>
    <text x="130" y="64" text-anchor="middle" class="eyebrow" font-size="8" letter-spacing="0.14em" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace">WITHOUT ARGO ROLLOUTS</text>
    <rect x="528" y="52" width="220" height="16" rx="2" fill="#ffffff"/>
    <text x="638" y="64" text-anchor="middle" font-size="8" letter-spacing="0.14em" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace">WITH ARGO ROLLOUTS + ISTIO</text>

    <!-- Arrows (before nodes) -->
    <!-- D1 -> Manual, D2 -> Manual : fan attach on Manual top edge (x=104..384, w=280) -->
    <path d="M 149,196 V 244 Q 149,252 157,252 H 189" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 355,196 V 268 Q 355,276 347,276 H 283" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Right chain: R1 -> Auto -> Analysis (straight vertical, shared x=656) -->
    <line x1="656" y1="176" x2="656" y2="196" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="656" y1="308" x2="656" y2="328" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Nodes -->
    <!-- D1 -->
    <rect x="64" y="124" width="170" height="72" rx="6" fill="#ffffff"/>
    <rect x="64" y="124" width="170" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="149" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Deployment v1</text>
    <text x="149" y="172" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">100% traffic</text>

    <!-- D2 -->
    <rect x="270" y="124" width="170" height="72" rx="6" fill="#ffffff"/>
    <rect x="270" y="124" width="170" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="355" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Deployment v2</text>
    <text x="355" y="172" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">0% traffic</text>

    <!-- Manual -->
    <rect x="104" y="276" width="280" height="92" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="104" y="276" width="280" height="92" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="120" y="288" width="64" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
    <text x="152" y="297" text-anchor="middle" font-size="7" letter-spacing="0.08em" fill="rgba(84,91,100,0.85)" font-family="'Geist Mono',monospace">MANUAL</text>
    <text x="244" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Traffic adjustment</text>
    <text x="244" y="336" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">edit VirtualService by hand</text>
    <text x="244" y="352" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">no metric verification</text>

    <!-- R1 -->
    <rect x="556" y="104" width="200" height="72" rx="6" fill="#ffffff"/>
    <rect x="556" y="104" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="656" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Rollout</text>
    <text x="656" y="152" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">automatic version mgmt</text>

    <!-- Auto (focal) -->
    <rect x="556" y="196" width="200" height="72" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="556" y="196" width="200" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="572" y="208" width="40" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.45)" stroke-width="0.8"/>
    <text x="592" y="217" text-anchor="middle" font-size="7" letter-spacing="0.08em" fill="rgba(236,114,17,0.90)" font-family="'Geist Mono',monospace">AUTO</text>
    <text x="656" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Traffic adjustment</text>
    <text x="656" y="256" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">metric-based progression</text>

    <!-- Analysis -->
    <rect x="556" y="328" width="200" height="72" rx="6" fill="#ffffff"/>
    <rect x="556" y="328" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="656" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Analysis</text>
    <text x="656" y="376" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">success rate / latency check</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" font-size="8" letter-spacing="0.14em" fill="#545B64" font-family="'Geist Mono',monospace">LEGEND</text>
    <circle cx="160" cy="536" r="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="172" y="540" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">manual step</text>
    <circle cx="300" cy="536" r="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="312" y="540" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">automated / focal</text>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
  </svg>