<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
<title id="t2">L3/L4와 L7의 점진적 소유권 전환</title>
<desc id="d2">Cilium을 L3/L4 CNI로 먼저 도입한 뒤 L7 서비스 메시 기능을 Istio에서 Cilium으로 단계적으로 옮기는 3단계 전환. Phase 1은 L7을 Istio가 담당, Phase 2는 Cilium과 Istio가 L7을 혼합 담당, Phase 3에서는 L7까지 Cilium이 전부 담당한다.</desc>
<defs>
  <style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");
    text { font-family: 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="48" y="48" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7D8998">GRADUAL ADOPTION</text>
<text x="48" y="80" font-size="24" font-weight="700" fill="#232F3E">점진적 L7 전환</text>
<text x="48" y="104" font-size="13" fill="#545B64">L3/L4는 Cilium이 먼저 담당하고, L7 소유권을 Istio에서 Cilium으로 단계적으로 이관</text>

<!-- Connector: box1 -> box2 -->
<line x1="304" y1="300" x2="352" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="303" y="284" width="50" height="14" fill="#ffffff"/>
<text x="328" y="295" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.04em" fill="#7D8998">L7 이관</text>

<!-- Connector: box2 -> box3 -->
<line x1="608" y1="300" x2="656" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="607" y="284" width="50" height="14" fill="#ffffff"/>
<text x="632" y="295" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.04em" fill="#7D8998">L7 이관</text>

<!-- Phase 1 box -->
<rect x="48" y="240" width="256" height="120" rx="8" fill="#ffffff"/>
<rect x="48" y="240" width="256" height="120" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="72" y="264" class="mono" font-size="8" font-weight="600" letter-spacing="0.14em" fill="#7D8998">PHASE 1</text>
<text x="72" y="296" font-size="12" font-weight="600" fill="#232F3E">L3/L4: Cilium</text>
<text x="72" y="316" font-size="12" font-weight="600" fill="#545B64">L7: Istio</text>

<!-- Phase 2 box -->
<rect x="352" y="240" width="256" height="120" rx="8" fill="#ffffff"/>
<rect x="352" y="240" width="256" height="120" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="376" y="264" class="mono" font-size="8" font-weight="600" letter-spacing="0.14em" fill="#7D8998">PHASE 2</text>
<text x="376" y="296" font-size="12" font-weight="600" fill="#232F3E">L3/L4: Cilium</text>
<text x="376" y="316" font-size="12" font-weight="600" fill="#545B64">L7: Cilium + Istio 혼합</text>

<!-- Phase 3 box (focal - target state) -->
<rect x="656" y="240" width="256" height="120" rx="8" fill="#ffffff"/>
<rect x="656" y="240" width="256" height="120" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="680" y="264" class="mono" font-size="8" font-weight="600" letter-spacing="0.14em" fill="#EC7211">PHASE 3 · 목표</text>
<text x="680" y="296" font-size="12" font-weight="600" fill="#232F3E">L3/L4: Cilium</text>
<text x="680" y="316" font-size="12" font-weight="600" fill="#EC7211">L7: Cilium</text>

</svg>