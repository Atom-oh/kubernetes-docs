<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tm-overview-title tm-overview-desc">
    <title id="tm-overview-title">Istio traffic management request flow</title>
    <desc id="tm-overview-desc">A client request enters through the Gateway, is routed by the VirtualService, has traffic policy applied by the DestinationRule, and is then split across three service versions: the main version, a canary, and a mirrored copy for shadow testing.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones (bg) -->
    <rect x="280" y="116" width="400" height="272" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="424" y="120" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="129" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">ISTIO TRAFFIC MGMT</text>

    <rect x="80" y="428" width="800" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="440" y="432" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="441" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">SERVICES</text>

    <!-- Arrows (behind nodes) -->
    <!-- Client -> Gateway -->
    <path d="M480,80 V148" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="500" y="108" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="544" y="117" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">1. REQUEST</text>

    <!-- Gateway -> VirtualService -->
    <path d="M480,204 V232" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="500" y="212" width="84" height="12" rx="2" fill="#ffffff"/>
    <text x="542" y="221" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">2. ROUTING</text>

    <!-- VirtualService -> DestinationRule (accent, leads to focal) -->
    <path d="M480,288 V316" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="500" y="296" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="556" y="305" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">3. APPLY POLICY</text>

    <!-- DestinationRule -> V1 (elbow left) -->
    <path d="M420,372 V396 Q420,404 412,404 H248 Q240,404 240,412 V432" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="288" y="384" width="84" height="12" rx="2" fill="#ffffff"/>
    <text x="330" y="393" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">4A. MAIN</text>

    <!-- DestinationRule -> V2 (straight, canary) -->
    <path d="M480,372 V432" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="494" y="392" width="86" height="12" rx="2" fill="#ffffff"/>
    <text x="537" y="401" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">4B. CANARY</text>

    <!-- DestinationRule -> V3 (elbow right) -->
    <path d="M540,372 V396 Q540,404 548,404 H712 Q720,404 720,412 V432" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="628" y="384" width="84" height="12" rx="2" fill="#ffffff"/>
    <text x="670" y="393" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">4C. MIRROR</text>

    <!-- Nodes -->
    <!-- Client (input treatment) -->
    <rect x="400" y="32" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="400" y="32" width="160" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="480" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client Request</text>

    <!-- Gateway -->
    <rect x="360" y="148" width="240" height="56" rx="6" fill="#ffffff"/>
    <rect x="360" y="148" width="240" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway</text>
    <text x="480" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">external traffic entry</text>

    <!-- VirtualService -->
    <rect x="360" y="232" width="240" height="56" rx="6" fill="#ffffff"/>
    <rect x="360" y="232" width="240" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VirtualService</text>
    <text x="480" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">routing rules</text>

    <!-- DestinationRule (focal) -->
    <rect x="360" y="316" width="240" height="56" rx="6" fill="#ffffff"/>
    <rect x="360" y="316" width="240" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">DestinationRule</text>
    <text x="480" y="356" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">traffic policy</text>

    <!-- V1 -->
    <rect x="140" y="460" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="140" y="460" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Version 1</text>
    <text x="240" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">weight: 90%</text>

    <!-- V2 -->
    <rect x="380" y="460" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="380" y="460" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Version 2</text>
    <text x="480" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">weight: 10% (canary)</text>

    <!-- V3 -->
    <rect x="620" y="460" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="620" y="460" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Version 3</text>
    <text x="720" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">mirror (shadow)</text>
  </svg>