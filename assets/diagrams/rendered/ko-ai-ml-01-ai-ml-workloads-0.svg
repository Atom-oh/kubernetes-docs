<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
    <title id="t">AI/ML 워크로드 특성</title>
    <desc id="d">AI/ML 워크로드의 네 가지 핵심 특성 중 리소스 집약성은 GPU·메모리·CPU·네트워크 요구사항으로, 워크로드 다양성은 훈련·추론·전처리·HPO 유형으로 이어짐을 보여주는 다이어그램.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#FFFFFF"/>

    <!-- Zone A: AI/ML 워크로드 특성 -->
    <rect x="40" y="64" width="240" height="480" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="60" y="68" width="152" height="12" rx="2" fill="#FFFFFF"/>
    <text x="136" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WORKLOAD TRAITS</text>

    <!-- Zone B: 리소스 요구사항 -->
    <rect x="580" y="64" width="340" height="224" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="600" y="68" width="128" height="12" rx="2" fill="#FFFFFF"/>
    <text x="664" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RESOURCE NEEDS</text>

    <!-- Zone C: 워크로드 유형 -->
    <rect x="580" y="320" width="340" height="224" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="600" y="324" width="120" height="12" rx="2" fill="#FFFFFF"/>
    <text x="660" y="333" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WORKLOAD TYPES</text>

    <!-- Arrows (behind nodes) -->
    <!-- Resource (focal) -> GPU node in Zone B -->
    <path d="M 256,140 H 580" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Diversity (focal) -> Training node in Zone C -->
    <path d="M 256,456 H 580" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Node: Resource (focal) -->
    <rect x="64" y="96" width="192" height="88" rx="6" fill="#FFFFFF"/>
    <rect x="64" y="96" width="192" height="88" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="160" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">리소스 집약적</text>
    <text x="160" y="158" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">compute-heavy</text>

    <!-- Node: 데이터·처리 특성 -->
    <rect x="64" y="208" width="192" height="88" rx="6" fill="#FFFFFF"/>
    <rect x="64" y="208" width="192" height="88" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">데이터 집약적</text>
    <text x="160" y="266" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">batch + realtime</text>

    <!-- Node: 분산 처리 -->
    <rect x="64" y="320" width="192" height="88" rx="6" fill="#FFFFFF"/>
    <rect x="64" y="320" width="192" height="88" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">분산 처리</text>

    <!-- Node: Diversity (focal) -->
    <rect x="64" y="432" width="192" height="88" rx="6" fill="#FFFFFF"/>
    <rect x="64" y="432" width="192" height="88" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="160" y="476" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">워크로드 다양성</text>
    <text x="160" y="494" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">diverse workload mix</text>

    <!-- Zone B nodes: GPU, Memory, CPU, Network -->
    <rect x="604" y="96" width="136" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="604" y="96" width="136" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="672" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">GPU 가속</text>

    <rect x="760" y="96" width="136" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="760" y="96" width="136" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="828" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">대용량 메모리</text>

    <rect x="604" y="196" width="136" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="604" y="196" width="136" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="672" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">고성능 CPU</text>

    <rect x="760" y="196" width="136" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="760" y="196" width="136" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="828" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">고속 네트워크</text>

    <!-- Zone C nodes: Training, Inference, DataPrep, HPO -->
    <rect x="604" y="352" width="136" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="604" y="352" width="136" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="672" y="392" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">모델 훈련</text>

    <rect x="760" y="352" width="136" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="760" y="352" width="136" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="828" y="392" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">모델 추론</text>

    <rect x="604" y="452" width="136" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="604" y="452" width="136" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="672" y="492" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">데이터 전처리</text>

    <rect x="760" y="452" width="136" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="760" y="452" width="136" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="828" y="486" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">하이퍼파라미터</text>
    <text x="828" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">optimization (HPO)</text>

    <!-- Legend -->
    <line x1="40" y1="564" x2="920" y2="564" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="588" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="596" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">핵심 특성 (focal)</text>
    <rect x="220" y="588" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="240" y="596" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">파생 요구사항 / 유형</text>
  </svg>