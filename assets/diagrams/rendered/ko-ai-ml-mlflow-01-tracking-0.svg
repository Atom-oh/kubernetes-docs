<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mlflow-tracking-title mlflow-tracking-desc">
  <title id="mlflow-tracking-title">MLflow Tracking 아키텍처</title>
  <desc id="mlflow-tracking-desc">학습 스크립트가 MLflow Tracking API를 통해 Tracking 서버에 실험 데이터를 기록하고, 서버는 파라미터·메트릭 등의 메타데이터는 Backend Store에, 모델·플롯 같은 파일은 Artifact Store에 각각 저장하며, Tracking UI는 두 저장소를 조회해 실험 결과를 보여준다.</desc>

  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ============ ARROWS (drawn before boxes) ============ -->

  <!-- A -> B : straight horizontal, accent (primary write path) -->
  <line x1="200" y1="96" x2="280" y2="96" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="204" y="74" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="240" y="83" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">API 호출</text>

  <!-- B -> C : straight horizontal, accent -->
  <line x1="500" y1="96" x2="560" y2="96" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- C -> D : elbow, muted, write -->
  <path d="M 620,128 V 196 Q 620,204 612,204 H 458 Q 450,204 450,212 V 280"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="502" y="192" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="517" y="201" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">저장</text>

  <!-- C -> E : elbow, muted, write -->
  <path d="M 680,128 V 196 Q 680,204 688,204 H 782 Q 790,204 790,212 V 280"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="719" y="192" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="734" y="201" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">저장</text>

  <!-- F -> D : straight horizontal, muted, read -->
  <line x1="220" y1="328" x2="340" y2="328" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="254" y="310" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="269" y="319" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">조회</text>

  <!-- F -> E : dip below D to avoid passing behind it, muted, read -->
  <path d="M 130,376 V 392 Q 130,400 138,400 H 782 Q 790,400 790,392 V 376"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="440" y="404" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="455" y="413" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">조회</text>

  <!-- ============ NODES ============ -->

  <!-- A: 학습 스크립트 (input) -->
  <rect x="40" y="64" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="40" y="64" width="160" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <rect x="48" y="72" width="52" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
  <text x="74" y="81" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
  <text x="120" y="102" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">학습 스크립트</text>

  <!-- B: MLflow Tracking API (backend) -->
  <rect x="280" y="64" width="220" height="64" rx="6" fill="#ffffff"/>
  <rect x="280" y="64" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="288" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="304" y="81" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="390" y="102" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">MLflow Tracking API</text>

  <!-- C: Tracking 서버 (focal) -->
  <rect x="560" y="64" width="180" height="64" rx="6" fill="#ffffff"/>
  <rect x="560" y="64" width="180" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="568" y="72" width="52" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
  <text x="594" y="81" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVER</text>
  <text x="650" y="102" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Tracking 서버</text>

  <!-- F: Tracking UI (input) -->
  <rect x="40" y="280" width="180" height="96" rx="6" fill="#ffffff"/>
  <rect x="40" y="280" width="180" height="96" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <rect x="48" y="288" width="24" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
  <text x="60" y="297" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
  <text x="130" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Tracking UI</text>

  <!-- D: Backend Store -->
  <rect x="340" y="280" width="220" height="96" rx="6" fill="#ffffff"/>
  <rect x="340" y="280" width="220" height="96" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="348" y="288" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="370" y="297" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="450" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Backend Store</text>
  <text x="450" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">메타데이터: 파라미터, 메트릭, 태그</text>

  <!-- E: Artifact Store -->
  <rect x="680" y="280" width="220" height="96" rx="6" fill="#ffffff"/>
  <rect x="680" y="280" width="220" height="96" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="688" y="288" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="710" y="297" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="790" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Artifact Store</text>
  <text x="790" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">파일: 모델, 플롯, 데이터셋</text>

  <!-- ============ LEGEND ============ -->
  <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="468" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <circle cx="220" cy="464" r="3.5" fill="#EC7211"/>
  <text x="230" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">실험 기록(쓰기) 경로</text>

  <circle cx="440" cy="464" r="3.5" fill="#545B64"/>
  <text x="450" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">저장/조회 경로</text>

</svg>