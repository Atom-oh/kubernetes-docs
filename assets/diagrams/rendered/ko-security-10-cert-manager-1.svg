<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
    <title id="t1">Certificate 리소스 관계</title>
    <desc id="d1">사용자가 정의한 Certificate와 Issuer/ClusterIssuer가 자동으로 CertificateRequest, ACME Order, Challenge를 생성하며, 최종적으로 발급된 인증서가 Kubernetes Secret에 저장되는 흐름을 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="48" y="8" width="664" height="124" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="356" y="12" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="404" y="21" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">사용자 정의</text>

    <rect x="48" y="192" width="664" height="124" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="356" y="196" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="404" y="205" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">자동 생성</text>

    <!-- Arrows -->
    <!-- Certificate -> Issuer -->
    <line x1="296" y1="80" x2="232" y2="80" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Certificate -> ClusterIssuer -->
    <line x1="464" y1="80" x2="528" y2="80" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Certificate -> CertificateRequest -->
    <path d="M380,112 V140 Q380,148 372,148 H198 Q190,148 190,156 V192" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Issuer -> CertificateRequest (straight) -->
    <line x1="148" y1="112" x2="148" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- ClusterIssuer -> CertificateRequest (elbow w/ hop over Certificate->CertReq crossing) -->
    <path d="M612,112 V172 Q612,180 604,180 H198 a8,8 0 0 0 -16,0 H114 Q106,180 106,188 V192" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CertificateRequest -> Order -->
    <line x1="232" y1="264" x2="296" y2="264" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Order -> Challenge -->
    <line x1="464" y1="264" x2="528" y2="264" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CertificateRequest -> Secret (straight, accent) -->
    <line x1="148" y1="296" x2="148" y2="416" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels -->
    <rect x="240" y="70" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="258" y="80" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">참조</text>

    <rect x="478" y="70" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="496" y="80" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">참조</text>

    <rect x="120" y="336" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="148" y="345" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE</text>

    <rect x="240" y="254" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="264" y="264" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACME</text>

    <rect x="472" y="254" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="496" y="264" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERIFY</text>

    <!-- Node: Issuer -->
    <rect x="64" y="48" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="48" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="72" y="56" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="86" y="65" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
    <text x="148" y="82" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Issuer</text>
    <text x="148" y="98" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">네임스페이스 범위</text>

    <!-- Node: Certificate (focal) -->
    <rect x="296" y="48" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="296" y="48" width="168" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="304" y="56" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="318" y="65" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
    <text x="380" y="82" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Certificate</text>
    <text x="380" y="98" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">인증서 요청 명세</text>

    <!-- Node: ClusterIssuer -->
    <rect x="528" y="48" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="528" y="48" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="536" y="56" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="550" y="65" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
    <text x="612" y="82" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">ClusterIssuer</text>
    <text x="612" y="98" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">클러스터 범위</text>

    <!-- Node: CertificateRequest -->
    <rect x="64" y="192" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="192" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="72" y="200" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="86" y="209" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
    <text x="148" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">CertificateRequest</text>
    <text x="148" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">발급 요청</text>

    <!-- Node: Order -->
    <rect x="296" y="192" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="296" y="192" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="304" y="200" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="321" y="209" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACME</text>
    <text x="380" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Order</text>
    <text x="380" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ACME 주문</text>

    <!-- Node: Challenge -->
    <rect x="528" y="192" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="528" y="192" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="536" y="200" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="553" y="209" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACME</text>
    <text x="612" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Challenge</text>
    <text x="612" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">도메인 검증</text>

    <!-- Node: Secret -->
    <rect x="64" y="416" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="416" width="168" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="72" y="424" width="34" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="89" y="433" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STORE</text>
    <text x="148" y="452" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Secret</text>
    <text x="148" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tls.crt + tls.key</text>

    <!-- Legend -->
    <line x1="48" y1="524" x2="912" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="48" y="536" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="68" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Focal / 생성 경로</text>
    <rect x="240" y="536" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="260" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">사용자 정의 / 자동 생성 CRD</text>
    <rect x="500" y="536" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="520" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">결과물 (Secret)</text>
  </svg>