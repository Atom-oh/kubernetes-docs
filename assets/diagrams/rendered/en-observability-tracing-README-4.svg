<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="head-title head-desc">
    <title id="head-title">Head-based sampling decides upfront</title>
    <desc id="head-desc">Flowchart showing head-based sampling: a request arrives, a sampling decision is made immediately, and the request is either collected as a full trace at roughly 10 percent or skipped at roughly 90 percent, with no knowledge of the eventual outcome.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- connectors -->
    <line x1="230" y1="284" x2="300" y2="284" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="380" y1="248" x2="380" y2="176" stroke="#EC7211" stroke-width="1.4"/>
    <line x1="380" y1="176" x2="560" y2="176" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="380" y1="320" x2="380" y2="392" stroke="#545B64" stroke-width="1.2"/>
    <line x1="380" y1="392" x2="560" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- labels -->
    <rect x="440" y="160" width="72" height="14" rx="2" fill="#ffffff"/>
    <text x="476" y="171" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">10% SAMPLE</text>
    <rect x="440" y="376" width="60" height="14" rx="2" fill="#ffffff"/>
    <text x="470" y="387" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">90% SKIP</text>

    <!-- REQ: oval -->
    <rect x="80" y="260" width="150" height="48" rx="24" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="155" y="288" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Request Received</text>

    <!-- DEC: diamond -->
    <polygon points="380,248 460,284 380,320 300,284" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="280" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sampling</text>
    <text x="380" y="294" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Decision</text>

    <!-- TRACE: rectangle (focal - happy path) -->
    <rect x="560" y="148" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="640" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Collect Trace</text>

    <!-- SKIP: rectangle -->
    <rect x="560" y="364" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="640" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Skip Trace</text>

    <!-- annotation -->
    <text x="80" y="480" fill="#232F3E" font-size="14" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Cheap and consistent — but the decision is made before</text>
    <text x="80" y="504" fill="#545B64" font-size="14" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">anyone knows whether this request will error or run slow.</text>

    <!-- legend -->
    <line x1="30" y1="540" x2="930" y2="540" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="30" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.16em">LEGEND</text>
    <line x1="180" y1="552" x2="204" y2="552" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="212" y="556" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Sampled path</text>
  </svg>