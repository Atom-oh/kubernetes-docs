<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="collab-ttl collab-desc">
  <title id="collab-ttl">협업 에이전트 패턴</title>
  <desc id="collab-desc">운영자 또는 경보가 Collaborator Agent를 트리거하면 Collaborator가 지표·로그·트레이스 세 전문 에이전트와 양방향으로 협의한 뒤 그 결과를 종합해 근본 원인 보고서를 만드는 허브-스포크 구조를 보여준다.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="8 0, 0 3, 8 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="8 0, 0 3, 8 6" fill="#545B64"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="30" y="34" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.18em">ARCHITECTURE</text>
  <text x="30" y="58" fill="#232F3E" font-size="20" font-weight="700">협업 에이전트 패턴</text>

  <!-- === ARROWS (before nodes) === -->
  <!-- User -> Collaborator -->
  <path d="M 190,300 H 380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Collaborator <-> MetricAgent (bidirectional, top) -->
  <path d="M 488,268 H 560 Q 568,268 568,260 V 176 Q 568,168 576,168 H 680"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>

  <!-- Collaborator <-> LogAgent (bidirectional, straight horizontal, mid) -->
  <path d="M 488,300 H 680" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>

  <!-- Collaborator <-> TraceAgent (bidirectional, bottom) -->
  <path d="M 488,332 H 560 Q 568,332 568,340 V 424 Q 568,432 576,432 H 680"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>

  <!-- Collaborator -> Report: exits bottom edge, hops over the Trace-Agent link, enters Report's top edge -->
  <path d="M 432,336 V 352 Q 432,360 440,360 H 560 a 8,8 0 0,1 16,0 H 859 Q 867,360 867,368"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- === NODES === -->
  <!-- User / Alert -->
  <rect x="50" y="276" width="140" height="48" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="120" y="296" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">운영자 / Alert</text>
  <text x="120" y="311" fill="#545B64" font-size="9" class="mono" text-anchor="middle">trigger</text>

  <!-- Collaborator Agent (focal) -->
  <rect x="384" y="264" width="96" height="72" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.4"/>
  <text x="432" y="298" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Collaborator</text>
  <text x="432" y="313" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Agent</text>

  <!-- Metric Agent -->
  <rect x="684" y="144" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="754" y="172" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Metric Agent</text>

  <!-- Log Agent -->
  <rect x="684" y="276" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="754" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Log Agent</text>

  <!-- Trace Agent -->
  <rect x="684" y="408" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="754" y="436" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Trace Agent</text>

  <!-- Report -->
  <rect x="804" y="368" width="126" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="867" y="388" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">종합 근본</text>
  <text x="867" y="403" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">원인 보고서</text>

  <!-- Arrow labels -->
  <rect x="200" y="284" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="230" y="293" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">TRIGGER</text>

  <rect x="596" y="152" width="52" height="12" rx="2" fill="#ffffff"/>
  <text x="622" y="161" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">METRIC</text>

  <rect x="554" y="284" width="52" height="12" rx="2" fill="#ffffff"/>
  <text x="580" y="293" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">LOG</text>

  <rect x="596" y="416" width="52" height="12" rx="2" fill="#ffffff"/>
  <text x="622" y="425" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">TRACE</text>

  <rect x="732" y="340" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="760" y="349" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">SUMMARY</text>

  <!-- Legend -->
  <line x1="30" y1="480" x2="930" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="496" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
  <path d="M 130,492 H 154" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
  <text x="164" y="496" fill="#545B64" font-size="9" class="mono">협의 (양방향)</text>
  <path d="M 340,492 H 372" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="380" y="496" fill="#545B64" font-size="9" class="mono">단방향 전달</text>
</svg>