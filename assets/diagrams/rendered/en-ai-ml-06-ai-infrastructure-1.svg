<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jupyter-ray-title jupyter-ray-desc">
    <title id="jupyter-ray-title">Interactive ML platform architecture</title>
    <desc id="jupyter-ray-desc">Data scientists reach JupyterHub notebooks, which hand off to Argo Workflows and a Ray cluster for training and tuning; Ray triggers Karpenter to provision GPU and Neuron nodes, while JupyterHub and Ray both read and write shared storage on EFS, FSx, and S3.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== arrows (drawn before boxes) ===== -->
    <!-- Users -> JupyterHub -->
    <line x1="440" y1="88" x2="440" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- JupyterHub -> Argo -->
    <path d="M388,192 V212 Q388,220 380,220 H208 Q200,220 200,228 V248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- JupyterHub -> Ray Cluster -->
    <path d="M440,192 V212 Q440,220 448,220 H472 Q480,220 480,228 V248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- JupyterHub -> Storage -->
    <path d="M488,192 V212 Q488,220 496,220 H772 Q780,220 780,228 V248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Argo -> Ray Cluster -->
    <line x1="300" y1="280" x2="380" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- Ray Cluster -> Karpenter -->
    <line x1="480" y1="312" x2="480" y2="368" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- Ray Cluster -> Storage -->
    <line x1="580" y1="280" x2="680" y2="280" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- ===== nodes ===== -->
    <!-- Users (input) -->
    <rect x="340" y="40" width="200" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="440" y="69" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Data Scientists &amp; ML Engineers</text>

    <!-- JupyterHub -->
    <rect x="340" y="128" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="440" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">JupyterHub</text>
    <text x="440" y="174" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Hub · KubeSpawner · OAuth</text>

    <!-- Argo Workflows -->
    <rect x="100" y="248" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Argo Workflows</text>
    <text x="200" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">preprocess &#8594; train &#8594; tune &#8594; eval</text>

    <!-- Ray Cluster (focal) -->
    <rect x="380" y="248" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Ray Cluster</text>
    <text x="480" y="294" fill="#232F3E" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Train · Tune · Serve · Data</text>

    <!-- Storage -->
    <rect x="680" y="248" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="780" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Shared Storage</text>
    <text x="780" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EFS · FSx for Lustre · S3</text>

    <!-- Karpenter -->
    <rect x="380" y="368" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Karpenter Auto-Scaling</text>
    <text x="480" y="414" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CPU · GPU · Neuron NodePools</text>

    <!-- legend -->
    <line x1="40" y1="464" x2="920" y2="464" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="480" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="160" y="471" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="180" y="480" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">User / input</text>
    <rect x="320" y="471" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="340" y="480" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Platform service</text>
    <rect x="520" y="471" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="540" y="480" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Focal: distributed compute</text>
    <rect x="760" y="471" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="780" y="480" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Shared store</text>
  </svg>
