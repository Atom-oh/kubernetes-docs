<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="sidecarless-arch-title sidecarless-arch-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="sidecarless-arch-title">사이드카 방식과 Cilium eBPF 사이드카리스 방식 비교</title>
    <desc id="sidecarless-arch-desc">Istio의 Pod당 사이드카 프록시 체인과, Cilium이 노드당 하나의 공유 Envoy로 L7 처리를 넘겨주는 eBPF 데이터패스를 나란히 비교하는 아키텍처 다이어그램입니다.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="8 0, 0 3, 8 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zone 1: Sidecar (Istio) -->
    <rect x="40" y="60" width="880" height="180" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="64" width="296" height="12" rx="2" fill="#ffffff"/>
    <text x="204" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">전통적인 사이드카 방식 (ISTIO)</text>

    <!-- Zone 2: Cilium -->
    <rect x="40" y="280" width="880" height="180" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8"/>
    <rect x="56" y="284" width="240" height="12" rx="2" fill="#ffffff"/>
    <text x="176" y="293" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CILIUM SERVICE MESH 방식</text>

    <!-- Row 1 arrows: Pod A -> Sidecar A -> Sidecar B -> Pod B -->
    <line x1="176" y1="150" x2="264" y2="150" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="376" y1="150" x2="584" y2="150" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="696" y1="150" x2="784" y2="150" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- label on middle segment (network hop) -->
    <rect x="462" y="130" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="139" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NET</text>

    <!-- Row 2 arrows: Pod A -> eBPF -> NodeEnvoy (bidirectional) -> Pod B -->
    <line x1="176" y1="370" x2="264" y2="370" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="376" y1="358" x2="584" y2="358" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <rect x="462" y="336" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="477" y="345" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">L7</text>
    <line x1="376" y1="382" x2="696" y2="382" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="502" y="390" width="42" height="12" rx="2" fill="#ffffff"/>
    <text x="523" y="399" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KERNEL</text>
    <line x1="696" y1="370" x2="784" y2="370" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Row1 nodes -->
    <rect x="96" y="120" width="80" height="60" rx="6" fill="#ffffff"/>
    <rect x="96" y="120" width="80" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="136" y="154" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A</text>

    <rect x="264" y="120" width="112" height="60" rx="6" fill="#ffffff"/>
    <rect x="264" y="120" width="112" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="320" y="147" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sidecar</text>
    <text x="320" y="163" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proxy-a</text>

    <rect x="584" y="120" width="112" height="60" rx="6" fill="#ffffff"/>
    <rect x="584" y="120" width="112" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="640" y="147" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sidecar</text>
    <text x="640" y="163" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proxy-b</text>

    <rect x="784" y="120" width="80" height="60" rx="6" fill="#ffffff"/>
    <rect x="784" y="120" width="80" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="824" y="154" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B</text>

    <!-- Row2 nodes -->
    <rect x="96" y="340" width="80" height="60" rx="6" fill="#ffffff"/>
    <rect x="96" y="340" width="80" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="136" y="374" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A</text>

    <rect x="264" y="340" width="112" height="60" rx="6" fill="#ffffff"/>
    <rect x="264" y="340" width="112" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="320" y="367" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF</text>
    <text x="320" y="383" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">datapath</text>

    <rect x="584" y="328" width="112" height="60" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="584" y="328" width="112" height="60" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="640" y="355" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node Envoy</text>
    <text x="640" y="371" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L7 처리 (공유)</text>

    <rect x="784" y="340" width="80" height="60" rx="6" fill="#ffffff"/>
    <rect x="784" y="340" width="80" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="824" y="374" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="200" cy="513" r="4" fill="none" stroke="#545B64" stroke-width="1.2"/>
    <text x="212" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Pod당 사이드카 프록시</text>
    <circle cx="480" cy="513" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="492" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">노드당 공유 Envoy (L7)</text>
  </svg>