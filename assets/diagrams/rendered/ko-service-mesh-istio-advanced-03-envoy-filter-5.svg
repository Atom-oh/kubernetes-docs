<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="selectiveip-title selectiveip-desc">
  <title id="selectiveip-title">앱별 선택적 IP 제한 아키텍처</title>
  <desc id="selectiveip-desc">인터넷의 일반 사용자와 회사 사용자가 AWS ALB를 거쳐 Istio Gateway의 Envoy에 도달하고, Envoy가 추출한 원본 IP를 바탕으로 App A-C는 모든 클라이언트를 허용하지만 App F-G는 AuthorizationPolicy로 회사 IP만 허용하는 구조를 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Zones (background, before arrows/nodes) -->
  <rect x="160" y="20" width="640" height="92" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="440" y="24" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="470" y="33" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">인터넷</text>

  <rect x="350" y="132" width="300" height="92" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="472" y="136" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="490" y="145" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">AWS</text>

  <rect x="40" y="244" width="880" height="248" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="428" y="248" width="104" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="257" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">KUBERNETES 클러스터</text>

  <rect x="360" y="268" width="240" height="84" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>
  <rect x="440" y="272" width="80" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="281" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">ISTIO GATEWAY</text>

  <rect x="56" y="384" width="360" height="88" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>
  <rect x="176" y="388" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="236" y="397" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">제한 없는 앱</text>

  <rect x="560" y="384" width="300" height="88" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>
  <rect x="650" y="388" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="710" y="397" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">IP 제한 앱</text>

  <!-- Arrows (before nodes) -->
  <!-- Client1 -> ALB -->
  <path d="M270,92 V124 Q270,132 278,132 H448 Q456,132 456,140 V164"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="292" y="118" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="328" y="127" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">XFF: 1.2.3.4</text>

  <!-- Client2 -> ALB -->
  <path d="M690,92 V124 Q690,132 682,132 H512 Q504,132 504,140 V164"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="560" y="118" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="608" y="127" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">XFF: 203.0.113.10</text>

  <!-- ALB -> EnvoyGW (straight, shared x) -->
  <line x1="480" y1="204" x2="480" y2="296" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="490" y="242" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="546" y="251" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">XFF + ALB_IP</text>

  <!-- EnvoyGW -> AppA -->
  <path d="M428,336 V352 Q428,360 420,360 H130 Q122,360 122,368 V412"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="140" y="340" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="170" y="349" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">제한 없음</text>

  <!-- EnvoyGW -> AppB -->
  <path d="M452,336 V368 Q452,376 444,376 H242 Q234,376 234,384 V412"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- EnvoyGW -> AppC -->
  <path d="M480,336 V384 Q480,392 472,392 H354"
        fill="none" stroke="#545B64" stroke-width="1.2"/>
  <path d="M354,392 Q346,392 346,400 V412"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- EnvoyGW -> AppF -->
  <path d="M508,336 V368 Q508,376 516,376 H632 Q640,376 640,384 V412"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="660" y="356" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="696" y="365" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">회사 IP만</text>

  <!-- EnvoyGW -> AppG -->
  <path d="M532,336 V352 Q532,360 540,360 H776 Q784,360 784,368 V412"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Nodes -->
  <!-- Client1 -->
  <rect x="200" y="52" width="140" height="40" rx="6" fill="#ffffff"/>
  <rect x="200" y="52" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="270" y="70" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">일반 사용자</text>
  <text x="270" y="84" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">1.2.3.4</text>

  <!-- Client2 -->
  <rect x="620" y="52" width="140" height="40" rx="6" fill="#ffffff"/>
  <rect x="620" y="52" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="690" y="70" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">회사 사용자</text>
  <text x="690" y="84" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">203.0.113.10</text>

  <!-- ALB -->
  <rect x="410" y="164" width="140" height="40" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="410" y="164" width="140" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="480" y="188" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application Load Balancer</text>

  <!-- Focal: EnvoyGW -->
  <rect x="400" y="296" width="160" height="40" rx="6" fill="#ffffff"/>
  <rect x="400" y="296" width="160" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="480" y="313" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy · XFF 처리</text>
  <text x="480" y="327" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">xff_num_trusted_hops: 1</text>

  <!-- AppA/B/C -->
  <rect x="76" y="412" width="92" height="40" rx="6" fill="#ffffff"/>
  <rect x="76" y="412" width="92" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="122" y="436" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App A</text>

  <rect x="188" y="412" width="92" height="40" rx="6" fill="#ffffff"/>
  <rect x="188" y="412" width="92" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="234" y="436" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App B</text>

  <rect x="300" y="412" width="92" height="40" rx="6" fill="#ffffff"/>
  <rect x="300" y="412" width="92" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="346" y="436" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App C</text>

  <!-- AppF/G (security-treatment boxes) -->
  <rect x="580" y="412" width="120" height="40" rx="6" fill="rgba(221,52,76,0.05)"/>
  <rect x="580" y="412" width="120" height="40" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.55)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="640" y="430" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App F</text>
  <text x="640" y="444" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">AuthorizationPolicy</text>

  <rect x="724" y="412" width="120" height="40" rx="6" fill="rgba(221,52,76,0.05)"/>
  <rect x="724" y="412" width="120" height="40" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.55)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="784" y="430" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App G</text>
  <text x="784" y="444" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">AuthorizationPolicy</text>

  <!-- Legend -->
  <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="532" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="180" y1="528" x2="212" y2="528" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="220" y="532" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">모든 클라이언트 허용</text>
  <line x1="420" y1="528" x2="452" y2="528" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="460" y="532" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">XFF 처리 · 회사 IP 제한</text>
  <rect x="660" y="522" width="18" height="12" rx="2" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.55)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="686" y="532" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">AuthorizationPolicy 적용됨</text>
</svg>