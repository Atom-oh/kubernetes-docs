    <title id="ko-storage-p3-1-title">EKS 스토리지 문제 해결 흐름</title>
    <desc id="ko-storage-p3-1-desc">PVC 프로비저닝 문제와 볼륨 마운트·성능 문제가 각각 어떤 진단 단계를 거쳐 어떤 해결 조치로 이어지는지 두 그룹으로 나누어 보여준다.</desc>
