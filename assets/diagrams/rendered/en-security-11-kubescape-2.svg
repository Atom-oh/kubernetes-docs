<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="kubescape-operator-title kubescape-operator-desc">
    <title id="kubescape-operator-title">Kubescape operator architecture</title>
    <desc id="kubescape-operator-desc">Inside the cluster, a scheduled scanner pod collects workload resources and runtime events into results storage, which feeds Prometheus, dashboards, and the Kubescape API outside the cluster.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Zones ===== -->
    <rect x="40" y="64" width="560" height="420" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="68" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="144" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">KUBERNETES CLUSTER</text>

    <rect x="640" y="64" width="280" height="420" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="656" y="68" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="692" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">OUTPUTS</text>

    <!-- ===== Arrows (drawn before nodes) ===== -->
    <!-- E1: CronJob Scheduler -> Scanner Pod (trigger) -->
    <path d="M152,152 V176 Q152,184 160,184 H276 Q284,184 284,192 V216"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="200" y="164" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="218" y="173" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TRIGGER</text>

    <!-- E2: Scanner Pod -> Cluster Workloads (collect) -->
    <path d="M340,216 V192 Q340,184 348,184 H464 Q472,184 472,176 V152"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="388" y="164" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="406" y="173" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">COLLECT</text>

    <!-- E3: Node Agent -> Scanner Pod (runtime events) -->
    <path d="M152,336 V312 Q152,304 160,304 H276 Q284,304 284,296 V272"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="200" y="284" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="218" y="293" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">RUNTIME</text>

    <!-- E4: Scanner Pod -> Results Storage (store) -->
    <path d="M340,272 V296 Q340,304 348,304 H464 Q472,304 472,312 V336"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="388" y="284" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="406" y="293" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">STORE</text>

    <!-- E5: Results Storage -> Dashboard (same height, straight) -->
    <line x1="560" y1="364" x2="664" y2="364" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- E6: Results Storage -> Prometheus -->
    <path d="M560,348 H604 Q612,348 612,340 V132 Q612,124 620,124 H664"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- E7: Results Storage -> Kubescape API -->
    <path d="M560,380 H604 Q612,380 612,388 V428 Q612,436 620,436 H664"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- E8: Prometheus -> Alertmanager -->
    <line x1="780" y1="152" x2="780" y2="184" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== Cluster nodes ===== -->
    <rect x="64" y="96" width="176" height="56" rx="6" fill="#ffffff"/>
    <rect x="64" y="96" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="152" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CronJob Scheduler</text>
    <text x="152" y="138" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">scheduled scan</text>

    <rect x="384" y="96" width="176" height="56" rx="6" fill="#ffffff"/>
    <rect x="384" y="96" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="472" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cluster Workloads</text>
    <text x="472" y="138" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">deployments &#183; configmaps &#183; secrets</text>

    <rect x="224" y="216" width="176" height="56" rx="6" fill="#ffffff"/>
    <rect x="224" y="216" width="176" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="312" y="242" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Scanner Pod</text>
    <text x="312" y="258" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">operator core</text>

    <rect x="64" y="336" width="176" height="56" rx="6" fill="#ffffff"/>
    <rect x="64" y="336" width="176" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="152" y="362" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node Agent (eBPF)</text>
    <text x="152" y="378" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">process &#183; network probes</text>

    <rect x="384" y="336" width="176" height="56" rx="6" fill="#ffffff"/>
    <rect x="384" y="336" width="176" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="472" y="362" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Results Storage</text>
    <text x="472" y="378" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">scan &#38; baseline history</text>

    <!-- ===== Output nodes ===== -->
    <rect x="664" y="96" width="232" height="56" rx="6" fill="#ffffff"/>
    <rect x="664" y="96" width="232" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus Metrics</text>

    <rect x="664" y="184" width="232" height="56" rx="6" fill="#ffffff"/>
    <rect x="664" y="184" width="232" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="210" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alertmanager</text>

    <rect x="664" y="336" width="232" height="56" rx="6" fill="#ffffff"/>
    <rect x="664" y="336" width="232" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="362" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Dashboard</text>

    <rect x="664" y="408" width="232" height="56" rx="6" fill="#ffffff"/>
    <rect x="664" y="408" width="232" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="434" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubescape API</text>
  </svg>