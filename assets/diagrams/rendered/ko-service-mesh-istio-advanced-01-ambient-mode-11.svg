<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="amb11-title amb11-desc">
<title id="amb11-title">Istio 데이터 플레인의 진화: Sidecar에서 Ambient Stable까지</title>
<desc id="amb11-desc">Istio 1.0의 Sidecar Mode에서 시작해 1.15의 Ambient Beta를 거쳐 1.28의 Ambient Stable로 이어지는 데이터 플레인 아키텍처의 진화 과정을 보여주는 타임라인.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
<marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#545B64" stroke-width="1.2"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="120" y1="300" x2="840" y2="300" stroke="#545B64" stroke-width="1"/>
<line x1="200" y1="300" x2="480" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="311.5" y="280" width="57" height="12" rx="2" fill="#ffffff"/>
<text x="340" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">리소스 최적화</text>
<line x1="480" y1="300" x2="760" y2="300" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="605.5" y="280" width="29" height="12" rx="2" fill="#ffffff"/>
<text x="620" y="289" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">안정화</text>
<circle cx="200" cy="300" r="5" fill="#232F3E"/>
<line x1="200" y1="295" x2="200" y2="176" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
<text x="200" y="160" fill="#232F3E" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">Istio 1.0 · 2018</text>
<text x="200" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Sidecar Mode</text>
<circle cx="480" cy="300" r="5" fill="#232F3E"/>
<line x1="480" y1="305" x2="480" y2="380" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
<text x="480" y="400" fill="#232F3E" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">Istio 1.15 · 2022</text>
<text x="480" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Ambient Beta</text>
<circle cx="760" cy="300" r="7" fill="#EC7211"/>
<line x1="760" y1="293" x2="760" y2="176" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
<text x="760" y="160" fill="#EC7211" font-size="9" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">Istio 1.28 · 2024</text>
<text x="760" y="176" fill="#EC7211" font-size="12" font-weight="700" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Ambient Stable</text>
</svg>