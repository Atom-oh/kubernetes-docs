<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="mon-obs-title mon-obs-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="mon-obs-title">모니터링과 관측성의 구조 비교</title>
    <desc id="mon-obs-desc">사전 정의된 지표를 쌓아가는 모니터링 체계가 로그·메트릭·트레이스가 서로 연결된 관측성 체계로 진화하는 과정을 보여준다.</desc>
    <defs><style>@import url(https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="8 0, 0 3, 8 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones (drawn first) -->
    <rect x="40" y="80" width="360" height="280" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="84" width="180" height="12" rx="2" fill="#ffffff"/>
    <text x="146" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MONITORING (모니터링)</text>

    <rect x="560" y="80" width="360" height="280" rx="8" fill="rgba(255,153,0,0.04)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8"/>
    <rect x="576" y="84" width="200" height="12" rx="2" fill="#ffffff"/>
    <text x="676" y="93" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OBSERVABILITY (관측성)</text>

    <!-- Arrows (before boxes) -->
    <!-- M1 -> M2 -->
    <line x1="220" y1="180" x2="220" y2="228" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M2 -> M3 -->
    <line x1="220" y1="300" x2="220" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- O1 <-> O2 -->
    <line x1="740" y1="180" x2="740" y2="228" stroke="#7D8998" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <!-- O2 <-> O3 -->
    <line x1="740" y1="300" x2="740" y2="308" stroke="#7D8998" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <!-- O3 <-> O1 (side loop) -->
    <path d="M 800,168 H 848 Q 856,168 856,176 V 316 Q 856,324 848,324 H 800"
          fill="none" stroke="#7D8998" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>

    <!-- Monitoring -> Observability -->
    <rect x="450" y="204" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="213" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">진화</text>
    <line x1="400" y1="220" x2="556" y2="220" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Monitoring nodes -->
    <rect x="160" y="140" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="160" y="140" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">사전 정의된 메트릭</text>

    <rect x="160" y="228" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="160" y="228" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">임계값 알림</text>

    <rect x="160" y="308" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="160" y="308" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">대시보드</text>

    <!-- Observability nodes -->
    <rect x="680" y="140" width="120" height="40" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="680" y="140" width="120" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="740" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Logs</text>
    <text x="740" y="174" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">로그</text>

    <rect x="680" y="228" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="680" y="228" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="740" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics</text>
    <text x="740" y="262" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">메트릭</text>

    <rect x="680" y="308" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="680" y="308" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="740" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Traces</text>
    <text x="740" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">추적</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="536" x2="164" y2="536" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="172" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">단방향 순서</text>
    <line x1="320" y1="536" x2="344" y2="536" stroke="#7D8998" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <text x="352" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">상호 연결</text>
    <line x1="480" y1="536" x2="504" y2="536" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="512" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">진화 방향</text>
  </svg>