<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fed-title fed-desc">
    <title id="fed-title">Typha 기반 멀티 클러스터 페더레이션</title>
    <desc id="fed-desc">각 클러스터의 Felix가 자신의 Typha 인스턴스에 연결되고, 두 클러스터의 대표 Typha가 하나의 Federation Controller로 상태를 취합하는 구조를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Cluster A -->
    <rect x="60" y="72" width="340" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="192" y="76" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="230" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER A</text>

    <!-- Zone: Cluster B -->
    <rect x="560" y="72" width="340" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="692" y="76" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="730" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER B</text>

    <!-- Arrows first -->
    <line x1="150" y1="196" x2="150" y2="156" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="310" y1="196" x2="310" y2="156" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="650" y1="196" x2="650" y2="156" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="810" y1="196" x2="810" y2="156" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Typha A1 -> Federation, Typha B1 -> Federation (elbow, fanned attach) -->
    <path d="M 150,108 V 104 Q 150,96 158,96 H 392 Q 400,96 400,104 V 428 Q 400,436 408,436 H 440"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M 650,108 V 104 Q 650,96 642,96 H 568 Q 560,96 560,104 V 428 Q 560,436 552,436 H 520"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels -->
    <rect x="360" y="252" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="390" y="261" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SYNC A→FED</text>

    <rect x="540" y="252" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="570" y="261" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SYNC B→FED</text>

    <!-- Nodes: Cluster A -->
    <rect x="80" y="108" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="150" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Typha A1</text>
    <text x="150" y="146" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sync svc</text>

    <rect x="240" y="196" width="140" height="48" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="310" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Felix A1 / A2</text>
    <text x="310" y="234" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">노드 에이전트</text>

    <!-- Nodes: Cluster B -->
    <rect x="580" y="108" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="650" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Typha B1</text>
    <text x="650" y="146" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sync svc</text>

    <rect x="740" y="196" width="140" height="48" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="810" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Felix B1 / B2</text>
    <text x="810" y="234" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">노드 에이전트</text>

    <!-- Node: Federation Controller (focal) -->
    <rect x="400" y="412" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="436" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Federation</text>
    <text x="480" y="450" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Controller</text>

    <!-- Legend -->
    <line x1="60" y1="500" x2="900" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="60" y="532" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="80" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Federation Controller (상태 취합)</text>

    <rect x="380" y="532" width="14" height="10" rx="2" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="400" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Felix 노드 에이전트</text>

    <line x1="620" y1="537" x2="648" y2="537" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="656" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">클러스터 내부 sync</text>
  </svg>