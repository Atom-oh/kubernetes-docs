<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="modes-title modes-desc">
    <title id="modes-title">Cilium networking modes</title>
    <desc id="modes-desc">Diagram grouping Cilium's networking modes into overlay, native routing, and cloud integration, showing that skipping encapsulation with native routing yields the best performance while overlay modes trade some performance for portability.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="40" y="32" width="580" height="156" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="64" y="36" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="134" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OVERLAY MODE</text>

    <rect x="40" y="208" width="580" height="156" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="64" y="212" width="180" height="12" rx="2" fill="#ffffff"/>
    <text x="154" y="221" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NATIVE ROUTING MODE</text>

    <rect x="40" y="384" width="580" height="156" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="64" y="388" width="188" height="12" rx="2" fill="#ffffff"/>
    <text x="158" y="397" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLOUD INTEGRATION MODE</text>

    <!-- Arrows (drawn before boxes) -->
    <!-- VXLAN (64,64-112) -> Encap fan pt (740,96) -->
    <path d="M 260,88 H 484 Q 492,88 492,96 V 96 H 740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Geneve (64,128-176) -> Encap fan pt (740,144) -->
    <path d="M 260,152 H 484 Q 492,152 492,144 V 144 H 740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Direct (64,240-288) -> NoEncap fan pt (740,272) -->
    <path d="M 260,264 H 484 Q 492,264 492,272 V 272 H 740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- BGP (64,304-352) -> NoEncap fan pt (740,320) -->
    <path d="M 260,328 H 484 Q 492,328 492,320 V 320 H 740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- Cloud Integration (64,432-496) -> Cloud (740,440-488) -->
    <line x1="260" y1="464" x2="740" y2="464" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="466" y="76" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="492" y="86" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UDP 8472</text>

    <rect x="466" y="132" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="492" y="142" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UDP 6081</text>

    <rect x="466" y="240" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="492" y="250" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO ENCAP</text>

    <rect x="466" y="304" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="492" y="314" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO ENCAP</text>

    <rect x="470" y="440" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="500" y="450" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VPC IPAM</text>

    <!-- Nodes: Overlay Mode -->
    <rect x="64" y="64" width="196" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="72" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="86" y="81" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TUN</text>
    <text x="162" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VXLAN</text>
    <text x="162" y="106" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">udp/8472</text>

    <rect x="64" y="128" width="196" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="72" y="136" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="86" y="145" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TUN</text>
    <text x="162" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Geneve</text>
    <text x="162" y="170" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">udp/6081</text>

    <!-- Nodes: Native Routing Mode -->
    <rect x="64" y="240" width="196" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="72" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="86" y="257" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RTE</text>
    <text x="162" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Direct Routing</text>
    <text x="162" y="282" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no overlay</text>

    <rect x="64" y="304" width="196" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="72" y="312" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="86" y="321" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RTE</text>
    <text x="162" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">BGP</text>
    <text x="162" y="346" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L3 routing</text>

    <!-- Node: Cloud Integration Mode (collapsed) -->
    <rect x="64" y="432" width="196" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="72" y="440" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="86" y="449" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLD</text>
    <text x="162" y="464" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cloud Integration</text>
    <text x="162" y="480" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AWS ENI / Azure /</text>
    <text x="162" y="490" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GKE IPAM</text>

    <!-- Outcome nodes -->
    <rect x="740" y="72" width="180" height="96" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <rect x="748" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
    <text x="762" y="89" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
    <text x="830" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Encapsulation</text>
    <text x="830" y="126" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle"><tspan fill="#232F3E">Overhead</tspan></text>
    <text x="830" y="146" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">slight perf hit</text>

    <rect x="740" y="248" width="180" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="748" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="762" y="265" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
    <text x="830" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">No Encapsulation</text>
    <text x="830" y="322" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">best performance</text>

    <rect x="740" y="440" width="180" height="48" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <rect x="748" y="448" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
    <text x="762" y="457" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
    <text x="830" y="468" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cloud Native</text>
    <text x="830" y="482" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">perf optimized</text>

    <!-- Legend -->
    <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="140" y="562" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="570" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Mode / step</text>

    <rect x="300" y="562" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="320" y="570" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Best performance</text>

    <line x1="500" y1="567" x2="528" y2="567" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="536" y="570" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Leads to</text>
  </svg>