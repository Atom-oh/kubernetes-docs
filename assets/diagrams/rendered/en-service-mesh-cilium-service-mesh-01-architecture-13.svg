      <text x="944" y="73" fill="#545B64" font-size="7" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.1em">TOTAL &#8776; 1.5 MS</text>
