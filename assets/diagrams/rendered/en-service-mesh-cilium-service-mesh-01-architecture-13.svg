<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-service-mesh-cilium-service-mesh-01-architecture-13-title en-service-mesh-cilium-service-mesh-01-architecture-13-desc">
      <title id="en-service-mesh-cilium-service-mesh-01-architecture-13-title">Per-hop latency: Istio sidecar vs. Cilium eBPF</title>
      <desc id="en-service-mesh-cilium-service-mesh-01-architecture-13-desc">Diagram breaking down end-to-end request latency into per-hop components, showing Istio's sidecar model spending roughly 1.5 milliseconds across two userspace proxy hops versus Cilium's eBPF model completing the same round trip in about a quarter of a millisecond, with the network hop itself costing the same in both.</desc>
