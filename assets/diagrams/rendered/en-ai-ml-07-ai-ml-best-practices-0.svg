<line x1="40" y1="564" x2="920" y2="564" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="580" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MOST PRACTICES CONVERGE ON PERFORMANCE; A SMALLER SET DRIVES EFFICIENCY, RELIABILITY, AND COST SAVINGS</text>

