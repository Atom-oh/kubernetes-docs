<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bp-title bp-desc">
<title id="bp-title">AI/ML best practices map to outcomes</title>
<desc id="bp-desc">A flowchart mapping eight AI/ML best-practice areas on EKS — benchmarking, container optimization, GPU selection, networking, storage, observability, cost optimization, and security — to four outcomes, showing that most practices converge on high performance while a smaller set drives resource efficiency, reliability, and cost savings.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="40" y="36" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AI/ML ON EKS · FLOWCHART</text>
<text x="40" y="60" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Eight practices, four outcomes</text>

<!-- Zones (drawn before arrows/nodes) -->
<rect x="24" y="64" width="232" height="484" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="32" y="68" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="76" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PRACTICES</text>

<rect x="664" y="64" width="272" height="484" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="672" y="68" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="712" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OUTCOMES</text>

<!-- ===================== CONNECTORS (drawn before nodes) ===================== -->
<!-- E1 Benchmarking(118) -> Performance(118) straight, same y -->
<path d="M 240,118 H 680" fill="none" stroke="#545B64" stroke-width="1"/>
<!-- E2 Container-upper(166) -> Performance(140) trunk 280 up -->
<path d="M 240,166 H 272 Q 280,166 280,158 V 148 Q 280,140 288,140 H 680" fill="none" stroke="#545B64" stroke-width="1"/>
<!-- E3 Container-lower(182) -> Efficiency(280) trunk 296 down -->
<path d="M 240,182 H 288 Q 296,182 296,190 V 272 Q 296,280 304,280 H 680" fill="none" stroke="#545B64" stroke-width="1"/>
<!-- E4 GPU-upper(222) -> Performance(162) trunk 312 up -->
<path d="M 240,222 H 304 Q 312,222 312,214 V 170 Q 312,162 320,162 H 680" fill="none" stroke="#545B64" stroke-width="1"/>
<!-- E5 GPU-lower(238) -> Efficiency(304) trunk 328 down -->
<path d="M 240,238 H 320 Q 328,238 328,246 V 296 Q 328,304 336,304 H 680" fill="none" stroke="#545B64" stroke-width="1"/>
<!-- E6 Network(286) -> Performance(184) trunk 344 up -->
<path d="M 240,286 H 336 Q 344,286 344,278 V 192 Q 344,184 352,184 H 680" fill="none" stroke="#545B64" stroke-width="1"/>
<!-- E7 Storage(342) -> Performance(196) trunk 360 up -->
<path d="M 240,342 H 352 Q 360,342 360,334 V 204 Q 360,196 368,196 H 680" fill="none" stroke="#545B64" stroke-width="1"/>
<!-- E8 Observability(398) -> Reliability(398) straight, same y -->
<path d="M 240,398 H 680" fill="none" stroke="#545B64" stroke-width="1"/>
<!-- E9 Security(454) -> Reliability(416) trunk 392 up -->
<path d="M 240,454 H 384 Q 392,454 392,446 V 424 Q 392,416 400,416 H 680" fill="none" stroke="#545B64" stroke-width="1"/>
<!-- E10 Cost(510) -> Cost Savings(510) straight -->
<path d="M 240,510 H 680" fill="none" stroke="#545B64" stroke-width="1"/>

<!-- Arrowheads placed separately at each destination point since paths above omit markers to avoid duplicate defs churn -->
<g fill="#545B64">
  <polygon points="672,115 680,118 672,121"/>
  <polygon points="672,137 680,140 672,143"/>
  <polygon points="672,277 680,280 672,283"/>
  <polygon points="672,159 680,162 672,165"/>
  <polygon points="672,301 680,304 672,307"/>
  <polygon points="672,181 680,184 672,187"/>
  <polygon points="672,193 680,196 672,199"/>
  <polygon points="672,395 680,398 672,401"/>
