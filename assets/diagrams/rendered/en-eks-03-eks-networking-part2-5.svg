<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Network Policy Best Practices</title>
<desc id="d">Five best practices for Kubernetes network policies branching from a single root: default-deny by default, isolate namespaces, apply least privilege, restrict egress, and test policies before rollout.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<text x="40" y="44" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">TREE · GUIDANCE</text>
<text x="40" y="68" fill="#232F3E" font-size="20" font-weight="700">Network Policy Best Practices</text>

<!-- root (focal) -->
<rect x="380" y="100" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="480" y="128" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Network Policy</text>
<text x="480" y="146" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">best practices</text>

<path d="M 480,164 V 196" fill="none" stroke="#545B64" stroke-width="1.2"/>
<line x1="112" y1="196" x2="848" y2="196" stroke="#545B64" stroke-width="1.2"/>
<path d="M 112,196 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 296,196 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 480,196 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 664,196 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 848,196 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="32" y="260" width="160" height="128" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="112" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Default deny</text>
<text x="112" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">deny all traffic,</text>
<text x="112" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">allow only what</text>
<text x="112" y="338" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">is necessary</text>

<rect x="216" y="260" width="160" height="128" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="296" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Isolate namespaces</text>
<text x="296" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">restrict cross-</text>
<text x="296" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">namespace</text>
<text x="296" y="338" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">communication</text>

<rect x="400" y="260" width="160" height="128" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Least privilege</text>
<text x="480" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">allow only the</text>
<text x="480" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">minimum needed</text>
<text x="480" y="338" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">communication</text>

<rect x="584" y="260" width="160" height="128" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="664" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Restrict egress</text>
<text x="664" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">limit traffic</text>
<text x="664" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">leaving pods to</text>
<text x="664" y="338" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">known destinations</text>

<rect x="768" y="260" width="160" height="128" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="848" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Test policies</text>
<text x="848" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">verify before</text>
<text x="848" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">rollout to avoid</text>
<text x="848" y="338" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">unintended blocks</text>

</svg>