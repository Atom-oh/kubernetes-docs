<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4-title d4-desc">
<title id="d4-title">Volume Expansion Flow</title>
<desc id="d4-desc">A user&#x27;s request to enlarge a PersistentVolumeClaim passes through the StorageClass, which checks that allowVolumeExpansion is enabled before the PersistentVolume grows the underlying disk and the Pod&#x27;s filesystem.</desc>
