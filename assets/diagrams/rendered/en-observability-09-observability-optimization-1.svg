<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="arch-title">Overall EKS observability architecture from workload to dashboard</title>
    <desc id="arch-desc">Application pods emit data to Fluent Bit and the OTel Collector, which fan out to log, metrics, and trace storage backends alongside Prometheus, all converging into Grafana as the single-pane-of-glass dashboard.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ===== Zones ===== -->
    <rect x="24" y="52" width="176" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="32" y="56" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="72" y="65" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.12em">WORKLOAD</text>

    <rect x="232" y="52" width="176" height="300" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="240" y="56" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="288" y="65" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.12em">COLLECTION</text>

    <rect x="440" y="52" width="320" height="300" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="448" y="56" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="484" y="65" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.12em">STORAGE</text>

    <!-- ===== Connectors (before nodes) ===== -->
    <!-- APP -> FB, OTEL -->
    <path d="M 200,96 H 244" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 200,108 H 220 Q 228,108 228,116 V 176 Q 228,184 236,184 H 244"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- FB -> LogStorage ; OTEL -> MetricStorage, TraceStorage ; PROM -> MetricStorage -->
    <path d="M 408,96 H 452" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 408,184 H 424 Q 432,184 432,192 V 200 Q 432,208 440,208 H 452"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 408,196 H 420 Q 428,196 428,204 V 292 Q 428,300 436,300 H 452"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 408,300 H 452" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Log/Metric/Trace Storage -> Grafana -->
    <path d="M 600,96 H 656 Q 664,96 664,104 V 400 Q 664,408 672,408 H 812"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 600,208 H 700 Q 708,208 708,216 V 400 Q 708,408 716,408 H 812"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 600,300 H 752 Q 760,300 760,308 V 400 Q 760,408 768,408 H 812"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- ===== Nodes ===== -->
    <!-- Application Pod -->
    <rect x="40" y="72" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="72" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="120" y="100" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application Pod</text>
    <text x="120" y="118" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workload</text>

    <!-- Fluent Bit -->
    <rect x="248" y="72" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="248" y="72" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="324" y="92" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Fluent Bit</text>
    <text x="324" y="108" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">daemonset</text>

    <!-- OTel Collector -->
    <rect x="248" y="160" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="248" y="160" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="324" y="180" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OTel Collector</text>
    <text x="324" y="196" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">daemonset</text>

    <!-- Prometheus -->
    <rect x="248" y="276" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="248" y="276" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="324" y="296" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
    <text x="324" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scraper</text>

    <!-- Log Storage -->
    <rect x="456" y="72" width="144" height="48" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="456" y="72" width="144" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="528" y="90" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Log Storage</text>
    <text x="528" y="106" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CWL · Loki · OpenSearch</text>

    <!-- Metrics Storage -->
    <rect x="456" y="184" width="144" height="48" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="456" y="184" width="144" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="528" y="202" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics Storage</text>
    <text x="528" y="218" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AMP · VictoriaMetrics</text>

    <!-- Trace Storage -->
    <rect x="456" y="276" width="144" height="48" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="456" y="276" width="144" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="528" y="294" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Trace Storage</text>
    <text x="528" y="310" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">X-Ray · Tempo · Jaeger</text>

    <!-- Grafana (focal) -->
    <rect x="812" y="368" width="128" height="80" rx="6" fill="#ffffff"/>
    <rect x="812" y="368" width="128" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="876" y="404" fill="#232F3E" font-size="14" font-weight="700"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana</text>
    <text x="876" y="422" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unified dashboard</text>

    <!-- Legend -->
    <line x1="24" y1="480" x2="936" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="498" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="495" x2="172" y2="495" stroke="#545B64" stroke-width="1.2"/>
    <text x="182" y="498" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Collect / write</text>
    <line x1="330" y1="495" x2="362" y2="495" stroke="#EC7211" stroke-width="1.2"/>
    <text x="372" y="498" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Query into dashboard</text>
  </svg>