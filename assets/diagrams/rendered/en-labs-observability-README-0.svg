<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obslab-topo-title obslab-topo-desc">
<title id="obslab-topo-title">Observability lab end-to-end topology</title>
<desc id="obslab-topo-desc">Argo CD deploys the OTel-instrumented MSA application onto the service cluster, whose autoscalers and OTel agent feed telemetry into the managed cluster's observability stack, while the application and the stack both integrate with AWS managed services (Aurora, SQS/SNS, MWAA, AMP, CloudWatch, OpenSearch).</desc>
<defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
  <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
</marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
  <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
</marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- ============ ZONES ============ -->
<!-- Managed Cluster zone -->
<rect x="20" y="40" width="288" height="328" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="28" y="44" width="180" height="12" rx="2" fill="#ffffff"/>
<text x="118" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">MANAGED CLUSTER (EKS)</text>

<!-- Service Cluster zone -->
<rect x="332" y="40" width="288" height="328" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="340" y="44" width="180" height="12" rx="2" fill="#ffffff"/>
<text x="430" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE CLUSTER (EKS)</text>

<!-- AWS Managed Services zone -->
<rect x="644" y="40" width="288" height="328" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="652" y="44" width="180" height="12" rx="2" fill="#ffffff"/>
<text x="742" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">AWS MANAGED SERVICES</text>

<!-- ============ ARROWS (drawn before nodes) ============ -->

<!-- 1. ArgoCD -> MSA : deploys (straight, shared y=100) -->
<line x1="284" y1="100" x2="356" y2="100" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="300" y="80" width="42" height="12" rx="2" fill="#ffffff"/>
<text x="321" y="89" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DEPLOYS</text>

<!-- 2. MSA -> AWS : db writes, y=100 -->
<line x1="596" y1="100" x2="668" y2="100" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="609" y="80" width="46" height="12" rx="2" fill="#ffffff"/>
<text x="632" y="89" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DB WRITE</text>

<!-- 3. MSA -> AWS : publish events, y=128 -->
<line x1="596" y1="128" x2="668" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="609" y="108" width="46" height="12" rx="2" fill="#ffffff"/>
<text x="632" y="117" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text>

<!-- 4. AWS -> MSA : trigger batch, y=156 -->
<line x1="668" y1="156" x2="596" y2="156" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="609" y="164" width="46" height="12" rx="2" fill="#ffffff"/>
<text x="632" y="173" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TRIGGER</text>

<!-- 5. OTel Agent -> Observability Stack : send telemetry -->
<path d="M356,316 H328 Q320,316 320,308 V216 Q320,208 312,208 H284"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="322" y="296" width="34" height="12" rx="2" fill="#ffffff"/>
<text x="339" y="305" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SEND</text>

<!-- 6. Observability Stack -> AWS : export telemetry + alerts (accent, headline flow) -->
<path d="M164,264 V392 Q164,400 172,400 H780 Q788,400 788,392 V352"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="440" y="380" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="476" y="389" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">EXPORT + ALERT</text>

<!-- ============ NODES ============ -->

<!-- ArgoCD -->
<rect x="44" y="72" width="240" height="56" rx="6" fill="#ffffff"/>
<rect x="44" y="72" width="240" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="164" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Argo CD</text>
<text x="164" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">+ Argo Rollouts</text>

<!-- Observability Stack (focal) -->
<rect x="44" y="152" width="240" height="112" rx="6" fill="#ffffff"/>
<rect x="44" y="152" width="240" height="112" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="164" y="174" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Observability Stack</text>
<text x="164" y="190" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">metrics: prometheus / mimir</text>
<text x="164" y="203" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">logs: loki / clickhouse</text>
<text x="164" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">traces: tempo / otel collector</text>
<text x="164" y="229" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">alert: alertmanager / oncall</text>
<text x="164" y="242" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">viz: grafana</text>

<!-- Load Testing -->
<rect x="44" y="288" width="240" height="56" rx="6" fill="#ffffff"/>
<rect x="44" y="288" width="240" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="164" y="314" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Load Testing</text>
<text x="164" y="330" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">k6 / locust</text>

<!-- MSA Application (focal) -->
<rect x="356" y="72" width="240" height="112" rx="6" fill="#ffffff"/>
<rect x="356" y="72" width="240" height="112" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="476" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">MSA Application</text>
<text x="476" y="110" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">api gateway (go)</text>
<text x="476" y="123" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">order / payment svc</text>
<text x="476" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">notification (node.js)</text>
<text x="476" y="149" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">analytics batch (python)</text>
<text x="476" y="162" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">otel-instrumented</text>

<!-- Karpenter + KEDA -->
<rect x="356" y="208" width="240" height="56" rx="6" fill="#ffffff"/>
<rect x="356" y="208" width="240" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="476" y="234" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Karpenter + KEDA</text>
<text x="476" y="250" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">node / pod autoscaling</text>

<!-- OTel Agent -->
<rect x="356" y="288" width="240" height="56" rx="6" fill="#ffffff"/>
<rect x="356" y="288" width="240" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="476" y="314" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OTel Agent</text>
<text x="476" y="330" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">daemonset</text>

<!-- AWS Managed Services -->
<rect x="668" y="72" width="240" height="280" rx="6" fill="#ffffff"/>
<rect x="668" y="72" width="240" height="280" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="788" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS Managed Services</text>
<text x="788" y="110" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">amazon managed prometheus</text>
<text x="788" y="126" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">amazon managed grafana</text>
<text x="788" y="142" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">cloudwatch</text>
<text x="788" y="158" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">opensearch</text>
<text x="788" y="174" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">sqs / sns</text>
<text x="788" y="190" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">aurora postgresql</text>
<text x="788" y="206" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">mwaa</text>

<!-- ============ LEGEND ============ -->
<line x1="20" y1="500" x2="932" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="20" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

<circle cx="140" cy="512" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="152" y="516" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal hub</text>

<circle cx="300" cy="512" r="5" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="312" y="516" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">AWS managed service</text>

<circle cx="480" cy="512" r="5" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="492" y="516" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Cluster / trust boundary</text>

</svg>