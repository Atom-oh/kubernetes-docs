    <title id="ko-service-mesh-istio-advanced-02-multi-cluster-4-title">East-West Gateway 기반 Istio-only Multi-cluster 패턴</title>
    <desc id="ko-service-mesh-istio-advanced-02-multi-cluster-4-desc">두 클러스터의 Istiod가 서비스 디스커버리로 동기화되고, East-West Gateway가 Cross-region mTLS로 연결되어 각 클러스터의 App Services를 서로 라우팅하는 패턴.</desc>
