<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vmcmp-title vmcmp-desc">
    <title id="vmcmp-title">Prometheus와 VictoriaMetrics 비교</title>
    <desc id="vmcmp-desc">아키텍처, 압축률, 쿼리 언어, 보존 기간 네 축에서 Prometheus의 한계를 VictoriaMetrics가 어떻게 보완하는지 나란히 비교하는 다이어그램.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      </style>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="32" y="88" width="256" height="376" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="92" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="96" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROMETHEUS</text>

    <rect x="672" y="88" width="256" height="376" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="692" y="92" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="756" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VICTORIAMETRICS</text>

    <!-- Arrows: rows at cy 144,232,320,408; L right edge x=264, R left edge x=696 -->
    <line x1="264" y1="144" x2="696" y2="144" stroke="#0972D3" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
    <rect x="452" y="122" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="131" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">확장 필요</text>

    <line x1="264" y1="232" x2="696" y2="232" stroke="#0972D3" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
    <rect x="440" y="210" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="219" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">스토리지 절약</text>

    <line x1="264" y1="320" x2="696" y2="320" stroke="#0972D3" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
    <rect x="452" y="298" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="307" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">완벽 호환</text>

    <line x1="264" y1="408" x2="696" y2="408" stroke="#0972D3" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
    <rect x="452" y="386" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="395" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">장기 저장</text>

    <!-- Left column nodes (Prometheus) -->
    <!-- P1 -->
    <rect x="56" y="116" width="208" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="116" width="208" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="146" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">단일 노드</text>
    <text x="160" y="162" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">architecture</text>

    <!-- P2 -->
    <rect x="56" y="204" width="208" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="204" width="208" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="234" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">중간 압축률</text>
    <text x="160" y="250" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">disk usage: baseline</text>

    <!-- P3 -->
    <rect x="56" y="292" width="208" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="292" width="208" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PromQL</text>
    <text x="160" y="338" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">query language</text>

    <!-- P4 -->
    <rect x="56" y="380" width="208" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="380" width="208" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="410" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">15-30일 보존</text>
    <text x="160" y="426" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retention</text>

    <!-- Right column nodes (VictoriaMetrics) -->
    <!-- V1 -->
    <rect x="696" y="116" width="208" height="56" rx="6" fill="#ffffff"/>
    <rect x="696" y="116" width="208" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="800" y="146" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">단일 / 클러스터</text>
    <text x="800" y="162" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vmsingle | vmcluster</text>

    <!-- V2 (focal) -->
    <rect x="696" y="204" width="208" height="56" rx="6" fill="#ffffff"/>
    <rect x="696" y="204" width="208" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="800" y="234" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">7x 압축률</text>
    <text x="800" y="250" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">disk usage: -70%</text>

    <!-- V3 -->
    <rect x="696" y="292" width="208" height="56" rx="6" fill="#ffffff"/>
    <rect x="696" y="292" width="208" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="800" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">MetricsQL</text>
    <text x="800" y="338" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PromQL 호환 상위집합</text>

    <!-- V4 -->
    <rect x="696" y="380" width="208" height="56" rx="6" fill="#ffffff"/>
    <rect x="696" y="380" width="208" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="800" y="410" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">무제한 보존</text>
    <text x="800" y="426" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">long-term storage</text>

    <!-- Legend -->
    <line x1="32" y1="500" x2="928" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="132" y="500" width="16" height="16" rx="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="156" y="512" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">핵심 차별점</text>
    <line x1="292" y1="508" x2="324" y2="508" stroke="#0972D3" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="332" y="512" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">대응 관계</text>
  </svg>