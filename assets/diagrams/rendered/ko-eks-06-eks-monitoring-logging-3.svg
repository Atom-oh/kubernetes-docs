<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="eksalert-title eksalert-desc">
    <title id="eksalert-title">EKS 알림 및 이벤트 파이프라인</title>
    <desc id="eksalert-desc">지표·로그·이벤트 기반의 알림 소스가 CloudWatch 경보, Prometheus Alertmanager, EventBridge, 이벤트 라우터라는 네 처리 경로를 거쳐 SNS, Lambda, Slack 등 알림 채널로 전달되는 흐름을 보여준다.</desc>
