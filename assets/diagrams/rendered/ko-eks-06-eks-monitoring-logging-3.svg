    <path d="M 600,98 H 640 Q 648,98 648,106 V 110 Q 648,118 656,118 H 740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 600,204 H 696 Q 704,204 704,212 V 366 Q 704,374 712,374 H 740" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
