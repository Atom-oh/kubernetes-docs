  <line x1="676" y1="563" x2="704" y2="563" stroke="#EC7211" stroke-width="1.2"/>
  <text x="716" y="566" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Trace fan-out to analysis services</text>

