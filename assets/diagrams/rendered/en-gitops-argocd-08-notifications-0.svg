<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="argonotif-title argonotif-desc">
<title id="argonotif-title">ArgoCD notification pipeline</title>
<desc id="argonotif-desc">Flow diagram showing ArgoCD's Application Controller handing sync events to the Notifications Controller, which watches applications, evaluates trigger conditions, and — once a trigger matches — dispatches messages out to Slack, Teams, Email, a generic webhook, and GitHub.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<!-- ============ ZONES (bg -> zones -> arrows -> nodes) ============ -->
<!-- Zone 1: ArgoCD -->
<rect x="32" y="140" width="192" height="248" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="100" y="144" width="56" height="12" rx="2" fill="#FFFFFF"/>
<text x="128" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">ARGOCD</text>

<!-- Zone 2: Notifications Controller -->
<rect x="256" y="112" width="224" height="328" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="324" y="116" width="88" height="12" rx="2" fill="#FFFFFF"/>
<text x="368" y="125" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">NOTIFICATIONS</text>

<!-- Zone 3: Notification Services -->
<rect x="544" y="56" width="200" height="348" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="606" y="60" width="76" height="12" rx="2" fill="#FFFFFF"/>
<text x="644" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">SERVICES</text>

<!-- ============ ARROWS (drawn before nodes) ============ -->

<!-- APPS -> CTRL (straight vertical, same x) -->
<line x1="128" y1="228" x2="128" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- CTRL -> WATCH (cross-zone elbow, right then up then right) -->
<path d="M 200,336 H 232 Q 240,336 240,328 V 180 Q 240,172 248,172 H 280"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- WATCH -> EVAL (straight vertical) -->
<line x1="368" y1="200" x2="368" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- EVAL -> SEND (straight vertical, primary flow, accent) -->
<line x1="368" y1="296" x2="368" y2="336" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="378" y="308" width="60" height="12" rx="2" fill="#FFFFFF"/>
<text x="408" y="317" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">MATCHED</text>

<!-- SEND -> 5 services: fanned attach points on SEND's right edge (x=456),
     spaced 14.67px apart per the N=5 formula, each routed on its own
     vertical bend column (488/500/512/524/536) so no two segments overlap. -->
<!-- SEND -> Slack -->
<path d="M 456,350.67 H 480 Q 488,350.67 488,342.67 V 118 Q 488,110 496,110 H 544"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- SEND -> Teams -->
<path d="M 456,365.33 H 492 Q 500,365.33 500,357.33 V 182 Q 500,174 508,174 H 544"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- SEND -> Email -->
<path d="M 456,380 H 504 Q 512,380 512,372 V 246 Q 512,238 520,238 H 544"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- SEND -> Webhook (HTTP call — link-blue) -->
<path d="M 456,394.67 H 516 Q 524,394.67 524,386.67 V 310 Q 524,302 532,302 H 544"
      fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<!-- SEND -> GitHub -->
<path d="M 456,409.33 H 528 Q 536,409.33 536,401.33 V 374 Q 536,366 544,366 H 544"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ============ NODES ============ -->

<!-- APPS -->
<rect x="56" y="172" width="144" height="56" rx="6" fill="#FFFFFF"/>
<rect x="56" y="172" width="144" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<rect x="64" y="180" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="78" y="189" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
<text x="128" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Applications</text>
<text x="128" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Argo CD CRs</text>

<!-- CTRL -->
<rect x="56" y="308" width="144" height="56" rx="6" fill="#FFFFFF"/>
<rect x="56" y="308" width="144" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<rect x="64" y="316" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="78" y="325" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CTL</text>
<text x="128" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App Controller</text>
<text x="128" y="356" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">sync state</text>

<!-- WATCH -->
<rect x="280" y="144" width="176" height="56" rx="6" fill="#FFFFFF"/>
<rect x="280" y="144" width="176" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<rect x="288" y="152" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="302" y="161" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">OBS</text>
<text x="368" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Watch Apps</text>
<text x="368" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">app events</text>

<!-- EVAL -->
<rect x="280" y="240" width="176" height="56" rx="6" fill="#FFFFFF"/>
<rect x="280" y="240" width="176" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<rect x="288" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="304" y="257" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">RULE</text>
<text x="368" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Evaluate Triggers</text>
<text x="368" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">on-sync-*, on-health-*</text>

<!-- SEND (focal) -->
<rect x="280" y="336" width="176" height="88" rx="6" fill="#FFFFFF"/>
<rect x="280" y="336" width="176" height="88" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<rect x="288" y="344" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="302" y="353" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">MSG</text>
<text x="368" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Send Notifications</text>
<text x="368" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">render + dispatch</text>

<!-- Service leaf nodes (external) -->
<!-- Slack -->
<rect x="544" y="88" width="160" height="44" rx="6" fill="#FFFFFF"/>
<rect x="544" y="88" width="160" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="624" y="114" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Slack</text>

<!-- Teams -->
<rect x="544" y="152" width="160" height="44" rx="6" fill="#FFFFFF"/>
<rect x="544" y="152" width="160" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="624" y="178" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Teams</text>

<!-- Email -->
<rect x="544" y="216" width="160" height="44" rx="6" fill="#FFFFFF"/>
<rect x="544" y="216" width="160" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="624" y="242" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Email</text>

<!-- Webhook -->
<rect x="544" y="280" width="160" height="44" rx="6" fill="#FFFFFF"/>
<rect x="544" y="280" width="160" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(9,114,211,0.45)" stroke-width="1"/>
<text x="624" y="306" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Webhook</text>

<!-- GitHub -->
<rect x="544" y="344" width="160" height="44" rx="6" fill="#FFFFFF"/>
<rect x="544" y="344" width="160" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="624" y="370" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">GitHub</text>

<!-- ============ LEGEND ============ -->
<line x1="32" y1="472" x2="928" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="32" y="488" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

<rect x="32" y="504" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="52" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal step</text>

<rect x="164" y="504" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="184" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">ArgoCD / controller step</text>

<rect x="380" y="504" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="400" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">External service</text>

<line x1="548" y1="509" x2="576" y2="509" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="584" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Primary flow</text>

<line x1="700" y1="509" x2="728" y2="509" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<text x="736" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">HTTP call</text>

</svg>