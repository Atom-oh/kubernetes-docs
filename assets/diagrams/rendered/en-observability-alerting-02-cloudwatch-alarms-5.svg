<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cwa5-title cwa5-desc">
    <title id="cwa5-title">Alarm Cost Optimization Strategies</title>
    <desc id="cwa5-desc">Four cost-optimization strategies branch from a central goal — minimizing alarm count, optimizing evaluation resolution, using composite alarms, and removing unnecessary alarms — each broken down into concrete tactics.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="cwa5-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ CONNECTORS (tree, orthogonal, drawn before nodes) ============ -->
    <g fill="none" stroke="#545B64" stroke-width="1">
      <!-- root -> bus -> L1 -->
      <path d="M 480,88 V 128"/>
      <path d="M 180,128 H 780"/>
      <path d="M 180,128 V 160" marker-end="url(#cwa5-arrow)"/>
      <path d="M 420,128 V 160" marker-end="url(#cwa5-arrow)"/>
      <path d="M 600,128 V 160" marker-end="url(#cwa5-arrow)"/>
      <path d="M 780,128 V 160" marker-end="url(#cwa5-arrow)"/>

      <!-- B: Minimize Alarm Count -> 2 leaves -->
      <path d="M 180,208 V 248"/>
      <path d="M 120,248 H 240"/>
      <path d="M 120,248 V 320" marker-end="url(#cwa5-arrow)"/>
      <path d="M 240,248 V 320" marker-end="url(#cwa5-arrow)"/>

      <!-- C: Optimize Resolution -> 2 leaves -->
      <path d="M 420,208 V 248"/>
      <path d="M 360,248 H 480"/>
      <path d="M 360,248 V 320" marker-end="url(#cwa5-arrow)"/>
      <path d="M 480,248 V 320" marker-end="url(#cwa5-arrow)"/>

      <!-- D: Use Composite Alarms -> 1 leaf (straight, no bus) -->
      <path d="M 600,208 V 308" marker-end="url(#cwa5-arrow)"/>

      <!-- E: Remove Unnecessary Alarms -> 2 leaves -->
      <path d="M 780,208 V 248"/>
      <path d="M 720,248 H 840"/>
      <path d="M 720,248 V 320" marker-end="url(#cwa5-arrow)"/>
      <path d="M 840,248 V 320" marker-end="url(#cwa5-arrow)"/>
    </g>

    <!-- ============ NODES ============ -->
    <!-- Root: Cost Optimization (FOCAL) -->
    <g>
      <rect x="400" y="40" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="400" y="40" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="480" y="68" fill="#232F3E" font-size="13" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cost Optimization</text>
    </g>

    <!-- L1: Minimize Alarm Count -->
    <g>
      <rect x="108" y="160" width="144" height="48" rx="6" fill="#ffffff"/>
      <rect x="108" y="160" width="144" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="180" y="180" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Minimize Alarm</text>
      <text x="180" y="196" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Count</text>
    </g>

    <!-- L1: Optimize Resolution -->
    <g>
      <rect x="348" y="160" width="144" height="48" rx="6" fill="#ffffff"/>
      <rect x="348" y="160" width="144" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="420" y="188" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Optimize Resolution</text>
    </g>

    <!-- L1: Use Composite Alarms -->
    <g>
      <rect x="528" y="160" width="144" height="48" rx="6" fill="#ffffff"/>
      <rect x="528" y="160" width="144" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="600" y="180" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Use Composite</text>
      <text x="600" y="196" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alarms</text>
    </g>

    <!-- L1: Remove Unnecessary Alarms -->
    <g>
      <rect x="708" y="160" width="144" height="48" rx="6" fill="#ffffff"/>
      <rect x="708" y="160" width="144" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="780" y="180" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Remove Unnecessary</text>
      <text x="780" y="196" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alarms</text>
    </g>

    <!-- Leaf: Consolidate Duplicate Alarms -->
    <g>
      <rect x="68" y="320" width="104" height="48" rx="6" fill="#ffffff"/>
      <rect x="68" y="320" width="104" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
      <text x="120" y="340" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Consolidate</text>
      <text x="120" y="354" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Duplicate Alarms</text>
    </g>

    <!-- Leaf: Replace with Composite -->
    <g>
      <rect x="188" y="320" width="104" height="48" rx="6" fill="#ffffff"/>
      <rect x="188" y="320" width="104" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
      <text x="240" y="340" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Replace with</text>
      <text x="240" y="354" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Composite</text>
    </g>

    <!-- Leaf: Set Resolution by Priority -->
    <g>
      <rect x="308" y="320" width="104" height="48" rx="6" fill="#ffffff"/>
      <rect x="308" y="320" width="104" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
      <text x="360" y="340" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Set Resolution</text>
      <text x="360" y="354" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">by Priority</text>
    </g>

    <!-- Leaf: Minimize High Resolution -->
    <g>
      <rect x="428" y="320" width="104" height="48" rx="6" fill="#ffffff"/>
      <rect x="428" y="320" width="104" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
      <text x="480" y="340" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Minimize High</text>
      <text x="480" y="354" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Resolution</text>
    </g>

    <!-- Leaf: Combine Multiple Metric Alarms into One Composite (taller) -->
    <g>
      <rect x="548" y="308" width="104" height="64" rx="6" fill="#ffffff"/>
      <rect x="548" y="308" width="104" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
      <text x="600" y="328" fill="#232F3E" font-size="9.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Combine Multiple</text>
      <text x="600" y="342" fill="#232F3E" font-size="9.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metric Alarms into</text>
      <text x="600" y="356" fill="#232F3E" font-size="9.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">One Composite</text>
    </g>

    <!-- Leaf: Delete Unused Alarms -->
    <g>
      <rect x="668" y="320" width="104" height="48" rx="6" fill="#ffffff"/>
      <rect x="668" y="320" width="104" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
      <text x="720" y="340" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Delete Unused</text>
      <text x="720" y="354" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alarms</text>
    </g>

    <!-- Leaf: Regular Review -->
    <g>
      <rect x="788" y="320" width="104" height="48" rx="6" fill="#ffffff"/>
      <rect x="788" y="320" width="104" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
      <text x="840" y="348" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Regular Review</text>
    </g>
  </svg>