<text x="440" y="287" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">what can you do</text>

<rect x="320" y="312" width="240" height="44" rx="6" fill="#ffffff"/>
<rect x="320" y="312" width="240" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
