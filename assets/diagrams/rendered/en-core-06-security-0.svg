<text x="790" y="169" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Role · RoleBinding</text>

<rect x="680" y="200" width="220" height="48" rx="6" fill="#ffffff"/>
<rect x="680" y="200" width="220" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
