<text x="440" y="347" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">mutate, validate</text>

<rect x="320" y="372" width="240" height="44" rx="6" fill="#ffffff"/>
<rect x="320" y="372" width="240" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="440" y="392" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Audit Logging</text>
<text x="440" y="407" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">who did what</text>

