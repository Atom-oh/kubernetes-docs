<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Kubernetes Security Architecture</title>
<desc id="d">Three defense-in-depth layers — infrastructure, cluster, and workload security — feed into the API server's authentication-authorization-admission-audit pipeline, which enforces RBAC, Pod Security Standards, security contexts, and network policy.</desc>
<rect width="960" height="600" fill="#ffffff"/>

<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<text x="40" y="34" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CORE · SECURITY</text>
<text x="40" y="58" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Arial,sans-serif">Kubernetes Security Architecture</text>

<!-- ===== Zones (bg -> zones -> arrows -> nodes) ===== -->
<rect x="40" y="88" width="220" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="86" y="92" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="150" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">INFRASTRUCTURE</text>

<rect x="300" y="88" width="280" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="380" y="92" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="440" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">CLUSTER SECURITY</text>

<rect x="660" y="88" width="260" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="732" y="92" width="116" height="12" rx="2" fill="#ffffff"/>
<text x="790" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">WORKLOAD SECURITY</text>

<!-- ===== Arrows ===== -->
<!-- Host/Network/Container -> API (fanned into API left edge) -->
<path d="M 228,164 H 266 Q 274,164 274,156 V 152 Q 274,144 282,144 H 320" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 228,248 H 266 Q 274,248 274,240 V 164 Q 274,156 282,156 H 320" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 228,344 H 266 Q 274,344 274,336 V 176 Q 274,168 282,168 H 320" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Network -> NetPol (routed below all zones) -->
<path d="M 228,266 H 240 Q 248,266 248,274 V 462 Q 248,470 256,470 H 782 Q 790,470 790,462 V 384" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- API pipeline chain (straight verticals) -->
<line x1="440" y1="176" x2="440" y2="192" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="440" y1="236" x2="440" y2="252" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="440" y1="296" x2="440" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="440" y1="356" x2="440" y2="372" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Authz -> RBAC -->
<path d="M 560,274 H 612 Q 620,274 620,266 V 164 Q 620,156 628,156 H 680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Admission -> PodSec -->
<path d="M 560,328 H 612 Q 620,328 620,320 V 232 Q 620,224 628,224 H 680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Admission -> SecCtx -->
<path d="M 560,348 H 612 Q 620,348 620,340 V 300 Q 620,292 628,292 H 680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ===== Nodes: Infrastructure ===== -->
<g font-family="'Amazon Ember','Helvetica Neue',Arial,sans-serif">
<rect x="52" y="140" width="176" height="56" rx="6" fill="#ffffff"/>
