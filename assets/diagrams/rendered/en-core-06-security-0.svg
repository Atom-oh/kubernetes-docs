<text x="140" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">OS hardening</text>

<rect x="52" y="224" width="176" height="56" rx="6" fill="#ffffff"/>
<rect x="52" y="224" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="140" y="248" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Network Security</text>
<text x="140" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">firewall, policy</text>

<rect x="52" y="316" width="176" height="56" rx="6" fill="#ffffff"/>
<rect x="52" y="316" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="140" y="340" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Container Runtime</text>
<text x="140" y="356" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">image, sandboxing</text>

<!-- ===== Nodes: Cluster (focal API) ===== -->
<rect x="320" y="132" width="240" height="44" rx="6" fill="#ffffff"/>
<rect x="320" y="132" width="240" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="440" y="152" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API Server</text>
<text x="440" y="167" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">+ etcd encryption</text>

<rect x="320" y="192" width="240" height="44" rx="6" fill="#ffffff"/>
<rect x="320" y="192" width="240" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
