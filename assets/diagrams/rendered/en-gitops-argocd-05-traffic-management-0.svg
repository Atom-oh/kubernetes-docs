<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rollouts-arch-title rollouts-arch-desc">
    <title id="rollouts-arch-title">Argo Rollouts traffic management architecture</title>
    <desc id="rollouts-arch-desc">The Rollouts controller drives traffic tools and workload replica sets while the Analysis controller queries metrics backends and reports pass/fail back to the controller.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Argo Rollouts -->
    <rect x="184" y="56" width="772" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="484" y="60" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="540" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ARGO ROLLOUTS</text>

    <!-- Zone: Traffic Management -->
    <rect x="24" y="228" width="340" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="120" y="232" width="148" height="12" rx="2" fill="#ffffff"/>
    <text x="194" y="241" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TRAFFIC MANAGEMENT</text>

    <!-- Zone: Workloads -->
    <rect x="424" y="228" width="332" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="552" y="232" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="590" y="241" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WORKLOADS</text>

    <!-- Arrows (behind boxes) -->
    <!-- CTRL -> INGRESS -->
    <path d="M 224,152 V 168 Q 224,176 216,176 H 118 Q 110,176 110,184 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CTRL -> MESH -->
    <path d="M 248,152 V 184 Q 248,192 256,192 H 262 Q 270,192 270,200 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CTRL -> ACTIVE -->
    <path d="M 296,152 V 208 Q 296,216 304,216 H 502 Q 510,216 510,224 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CTRL -> PREVIEW -->
    <path d="M 328,152 V 192 Q 328,200 336,200 H 662 Q 670,200 670,208 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- ANALYSIS -> METRICS -->
    <path d="M 860,152 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- ANALYSIS -> CTRL: Pass/Fail (headline feedback) -->
    <path d="M 780,120 H 360" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="536" y="100" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="562" y="110" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS/FAIL</text>

    <!-- Node: Rollouts Controller (focal) -->
    <rect x="200" y="88" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="200" y="88" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="208" y="96" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="222" y="105" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROL</text>
    <text x="280" y="118" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rollouts Controller</text>
    <text x="280" y="134" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">argo-rollouts</text>

    <!-- Node: Analysis Controller -->
    <rect x="780" y="88" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="780" y="88" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="788" y="96" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="802" y="105" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ANL</text>
    <text x="860" y="118" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Analysis Controller</text>
    <text x="860" y="134" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AnalysisRun CRD</text>

    <!-- Node: Ingress Controller -->
    <rect x="40" y="260" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="260" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="48" y="268" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="62" y="277" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ING</text>
    <text x="110" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Ingress Controller</text>
    <text x="110" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">weighted routes</text>

    <!-- Node: Service Mesh -->
    <rect x="200" y="260" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="200" y="260" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="208" y="268" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="222" y="277" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MSH</text>
    <text x="270" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service Mesh</text>
    <text x="270" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">traffic split</text>

    <!-- Node: Active ReplicaSet -->
    <rect x="440" y="260" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="440" y="260" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="448" y="268" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="462" y="277" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACT</text>
    <text x="510" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Active ReplicaSet</text>
    <text x="510" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stable pods</text>

    <!-- Node: Preview/Canary ReplicaSet -->
    <rect x="600" y="260" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="260" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="608" y="268" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="622" y="277" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRV</text>
    <text x="670" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Preview/Canary RS</text>
    <text x="670" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">candidate pods</text>

    <!-- Node: Metrics Backends -->
    <rect x="780" y="260" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="780" y="260" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="788" y="268" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="802" y="277" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBS</text>
    <text x="860" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics Backends</text>
    <text x="860" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Prometheus · Datadog · New Relic</text>

    <!-- Legend -->
    <line x1="24" y1="484" x2="936" y2="484" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="500" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="24" y="516" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="44" y="524" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Rollouts controller (focal)</text>

    <rect x="220" y="516" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="524" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Component</text>

    <line x1="360" y1="521" x2="392" y2="521" stroke="#EC7211" stroke-width="1.4"/>
    <text x="400" y="524" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Pass/fail feedback signal</text>
  </svg>
