<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="se-overview-title se-overview-desc">
  <title id="se-overview-title">ServiceEntry registration overview</title>
  <desc id="se-overview-desc">An application inside the service mesh sends requests through a ServiceEntry registration, which applies traffic control, monitoring, and security before reaching two external services: an external API and an external database.</desc>

  <rect width="960" height="600" fill="#ffffff"/>

  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <!-- Zones -->
  <rect x="40" y="232" width="560" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="56" y="236" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="60" y="245" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SERVICE MESH</text>

  <rect x="640" y="100" width="280" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="656" y="104" width="164" height="12" rx="2" fill="#ffffff"/>
  <text x="660" y="113" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">EXTERNAL SERVICES</text>

  <!-- ===== Connectors (drawn before boxes) ===== -->

  <!-- App -> SE : same y-band, straight horizontal -->
  <path d="M 240,300 H 380" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="270" y="280" width="80" height="12" rx="2" fill="#ffffff"/>
  <text x="310" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1. REQUEST</text>

  <!-- SE -> API : fan point 1 (560,284), elbow right+up into API left edge (680,172) -->
  <path d="M 560,284 H 600 Q 608,284 608,276 V 180 Q 608,172 616,172 H 680"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="560" y="196" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="608" y="205" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2. TRAFFIC CTRL</text>

  <!-- SE -> DB : fan point 2 (560,320), elbow right+down into DB left edge (680,428) -->
  <path d="M 560,320 H 640 Q 648,320 648,328 V 420 Q 648,428 656,428 H 680"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="600" y="356" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="648" y="365" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2. TRAFFIC CTRL</text>

  <!-- ===== Nodes ===== -->

  <!-- App -->
  <rect x="80" y="268" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="80" y="268" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="160" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
  <text x="160" y="313" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mesh workload</text>

  <!-- SE (focal) -->
  <rect x="380" y="268" width="180" height="64" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="380" y="268" width="180" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="470" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ServiceEntry</text>
  <text x="470" y="313" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">registration</text>

  <!-- API -->
  <rect x="680" y="140" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="680" y="140" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="780" y="167" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">External API</text>
  <text x="780" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api.example.com</text>

  <!-- DB -->
  <rect x="680" y="396" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="680" y="396" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="780" y="423" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">External DB</text>
  <text x="780" y="440" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">db.example.com</text>
</svg>