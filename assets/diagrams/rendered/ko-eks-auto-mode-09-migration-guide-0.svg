<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="migration-title migration-desc">
  <title id="migration-title">EKS Auto Mode 마이그레이션 7단계 프로세스</title>
  <desc id="migration-desc">기존 노드 그룹 기반 EKS 클러스터를 현재 상태 분석부터 Auto Mode 활성화, NodePool 구성, 워크로드 마이그레이션, 기존 노드 그룹 축소·삭제, 검증 및 최적화까지 7단계로 전환하는 순차 흐름을 보여준다.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="28" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MIGRATION PROCESS</text>
  <text x="40" y="56" fill="#232F3E" font-size="24" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">EKS Auto Mode 마이그레이션 프로세스</text>
  <text x="40" y="76" fill="#545B64" font-size="12" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">기존 노드 그룹에서 Auto Mode로 전환하는 7단계 흐름</text>

  <!-- Arrows (drawn first, straight vertical, same x=480) -->
  <line x1="480" y1="148" x2="480" y2="168" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="224" x2="480" y2="244" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="300" x2="480" y2="320" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="376" x2="480" y2="396" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="452" x2="480" y2="472" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="528" x2="480" y2="548" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Node A: start oval -->
  <rect x="240" y="100" width="480" height="48" rx="24" fill="#ffffff"/>
  <rect x="240" y="100" width="480" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="118" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">START</text>
  <text x="480" y="134" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">현재 상태 분석</text>

  <!-- Node B: rect -->
  <rect x="240" y="168" width="480" height="56" rx="6" fill="#ffffff"/>
  <rect x="240" y="168" width="480" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="252" y="176" width="40" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="272" y="186" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
  <text x="480" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Auto Mode 활성화</text>

  <!-- Node C: rect -->
  <rect x="240" y="244" width="480" height="56" rx="6" fill="#ffffff"/>
  <rect x="240" y="244" width="480" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="252" y="252" width="40" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="272" y="262" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
  <text x="480" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">NodePool 구성</text>

  <!-- Node D: rect, FOCAL -->
  <rect x="240" y="320" width="480" height="56" rx="6" fill="#ffffff"/>
  <rect x="240" y="320" width="480" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="252" y="328" width="40" height="14" rx="2" fill="transparent" stroke="#EC7211" stroke-width="0.8"/>
  <text x="272" y="338" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
  <text x="480" y="352" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">워크로드 마이그레이션</text>

  <!-- Focal callout, open canvas to the right of D, no overlap -->
  <text x="744" y="352" fill="#EC7211" font-size="14" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">핵심 전환 단계</text>

  <!-- Node E: rect -->
  <rect x="240" y="396" width="480" height="56" rx="6" fill="#ffffff"/>
  <rect x="240" y="396" width="480" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="252" y="404" width="40" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="272" y="414" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
  <text x="480" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">기존 노드 그룹 축소</text>

  <!-- Node F: rect -->
  <rect x="240" y="472" width="480" height="56" rx="6" fill="#ffffff"/>
  <rect x="240" y="472" width="480" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="252" y="480" width="40" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="272" y="490" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">06</text>
  <text x="480" y="504" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">기존 노드 그룹 삭제</text>

  <!-- Node G: end oval -->
  <rect x="240" y="548" width="480" height="48" rx="24" fill="#ffffff"/>
  <rect x="240" y="548" width="480" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="566" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DONE</text>
  <text x="480" y="582" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">검증 및 최적화</text>
</svg>