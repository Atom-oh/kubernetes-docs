<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="100%" role="img" aria-labelledby="en-ops-14-tekton-pipelines-0-title en-ops-14-tekton-pipelines-0-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="en-ops-14-tekton-pipelines-0-title">Tekton CRD hierarchy and the Kubernetes resources they create</title>
    <desc id="en-ops-14-tekton-pipelines-0-desc">Shows how Tekton's Pipeline, PipelineRun, Task, and TaskRun custom resources relate to Step, Workspace, and Result, and how those in turn map onto native Kubernetes Pod, Container, and PersistentVolumeClaim objects.</desc>
    <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="40" width="880" height="392" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="44" width="180" height="12" rx="2" fill="#ffffff"/>
    <text x="146" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TEKTON CRD HIERARCHY</text>

    <rect x="40" y="456" width="880" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="460" width="188" height="12" rx="2" fill="#ffffff"/>
    <text x="150" y="469" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KUBERNETES RESOURCES</text>

    <!-- ===== Arrows (drawn before boxes) ===== -->
    <!-- PipelineRun -> Pipeline (references) -->
    <path d="M 410,148 V 164 Q 410,164 410,164 H 268 Q 260,164 260,172 V 180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="298" y="150" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="328" y="159" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFERENCES</text>

    <!-- PipelineRun -> TaskRun (creates) -->
    <path d="M 510,148 V 164 H 642 Q 650,164 650,172 V 180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="562" y="150" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="588" y="159" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATES</text>

    <!-- Pipeline -> Task (contains) -->
    <path d="M 300,236 V 252 H 402 Q 410,252 410,260 V 268" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="330" y="238" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="356" y="247" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONTAINS</text>

    <!-- Pipeline -> Workspace (declares) [straight] -->
    <path d="M 220,236 V 356" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="190" y="288" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="218" y="297" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DECLARES</text>

    <!-- TaskRun -> Task (references), routed via left edge to avoid Pod column -->
    <path d="M 570,200 H 518 Q 510,200 510,208 V 260 Q 510,268 510,268" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="500" y="222" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="530" y="231" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFERENCES</text>

    <!-- TaskRun -> Pod (creates) [straight, focal-adjacent] -->
    <path d="M 650,236 V 488" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="622" y="352" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="648" y="361" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATES</text>

    <!-- Task -> Workspace (declares) -->
    <path d="M 410,324 V 340 H 308 Q 300,340 300,348 V 356" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="322" y="326" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="350" y="335" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DECLARES</text>

    <!-- Task -> Step (contains) [straight] -->
    <path d="M 460,324 V 356" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="432" y="332" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="458" y="341" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONTAINS</text>

    <!-- Task -> Result (produces), bridged over TaskRun->Pod column -->
    <path d="M 510,324 V 340 H 638" fill="none" stroke="#EC7211" stroke-width="1.2"/>
    <path d="M 638,340 a 8,8 0 0 1 16,0" fill="none" stroke="#EC7211" stroke-width="1.2"/>
    <path d="M 654,340 H 792 Q 800,340 800,348 V 356" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="700" y="326" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="726" y="335" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRODUCES</text>

    <!-- Step -> Container (maps to) [straight] -->
    <path d="M 460,412 V 488" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="424" y="440" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="460" y="449" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MAPS TO</text>

    <!-- Workspace -> PVC (backed by) [straight] -->
    <path d="M 220,412 V 488" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="182" y="440" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="220" y="449" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BACKED BY</text>

    <!-- ===== Nodes ===== -->
    <!-- PipelineRun -->
    <g>
      <rect x="380" y="92" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="380" y="92" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="388" y="98" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="404" y="107" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
      <text x="460" y="126" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PipelineRun</text>
      <text x="460" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">executes a Pipeline</text>
    </g>
    <!-- Pipeline -->
    <g>
      <rect x="180" y="180" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="180" y="180" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="188" y="186" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="204" y="195" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
      <text x="260" y="214" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pipeline</text>
      <text x="260" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ordered Tasks</text>
    </g>
    <!-- TaskRun -->
    <g>
      <rect x="570" y="180" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="570" y="180" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="578" y="186" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="594" y="195" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
      <text x="650" y="214" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">TaskRun</text>
      <text x="650" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">executes a Task</text>
    </g>
    <!-- Task (FOCAL) -->
    <g>
      <rect x="380" y="268" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="380" y="268" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <rect x="388" y="274" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.60)" stroke-width="0.8"/>
      <text x="404" y="283" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
      <text x="460" y="302" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Task</text>
      <text x="460" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">defines Steps</text>
    </g>
    <!-- Workspace -->
    <g>
      <rect x="180" y="356" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="180" y="356" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="188" y="362" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="204" y="371" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
      <text x="260" y="390" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Workspace</text>
      <text x="260" y="404" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared volume</text>
    </g>
    <!-- Step -->
    <g>
      <rect x="380" y="356" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="380" y="356" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="388" y="362" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="404" y="371" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
      <text x="460" y="390" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Step</text>
      <text x="460" y="404" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">container action</text>
    </g>
    <!-- Result -->
    <g>
      <rect x="760" y="356" width="140" height="56" rx="6" fill="#ffffff"/>
      <rect x="760" y="356" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="768" y="362" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="784" y="371" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
      <text x="830" y="390" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Result</text>
      <text x="830" y="404" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">output value</text>
    </g>

    <!-- Pod -->
    <g>
      <rect x="570" y="488" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="570" y="488" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="650" y="512" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod</text>
      <text x="650" y="526" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">v1/pods</text>
    </g>
    <!-- Container -->
    <g>
      <rect x="380" y="488" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="380" y="488" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="460" y="512" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Container</text>
      <text x="460" y="526" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runtime unit</text>
    </g>
    <!-- PVC -->
    <g>
      <rect x="180" y="488" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="180" y="488" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="260" y="512" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PVC</text>
      <text x="260" y="526" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">volume claim</text>
    </g>

    <!-- Legend -->
    <line x1="40" y1="570" x2="920" y2="570" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="580" width="12" height="8" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="58" y="587" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">TEKTON CRD</text>
    <rect x="180" y="580" width="12" height="8" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="198" y="587" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">CORE HUB</text>
    <rect x="320" y="580" width="12" height="8" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="338" y="587" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">K8S RESOURCE</text>
  </svg>