      <text x="248" y="236" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kube-state-metrics, node exporter</text>

      <rect x="120" y="288" width="256" height="56" rx="6" fill="#ffffff"/>
      <rect x="120" y="288" width="256" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="128" y="294" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="143" y="303" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OSS</text>
      <text x="248" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Distributed Tracing</text>
      <text x="248" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AWS X-Ray, OpenTelemetry</text>

      <!-- Targets -->
      <rect x="632" y="80" width="208" height="56" rx="6" fill="#ffffff"/>
      <rect x="632" y="80" width="208" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <rect x="640" y="86" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="655" y="95" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TGT</text>
      <text x="736" y="108" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Control Plane</text>
      <text x="736" y="124" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">API server, scheduler, controller</text>

      <rect x="632" y="176" width="208" height="56" rx="6" fill="#ffffff"/>
      <rect x="632" y="176" width="208" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <rect x="640" y="182" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="655" y="191" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TGT</text>
      <text x="736" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node Resources</text>
      <text x="736" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CPU, memory, disk, network</text>

      <rect x="632" y="272" width="208" height="56" rx="6" fill="#ffffff"/>
      <rect x="632" y="272" width="208" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <rect x="640" y="278" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="655" y="287" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TGT</text>
      <text x="736" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod Resources</text>
      <text x="736" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CPU, memory, restarts</text>

      <!-- ================= LEGEND ================= -->
      <line x1="30" y1="448" x2="930" y2="448" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="30" y="464" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="220" cy="460" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="232" y="464" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Focal — broadest single coverage</text>
