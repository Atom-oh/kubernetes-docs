<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cm-map-title cm-map-desc">
      <title id="cm-map-title">Monitoring solutions mapped to what they observe in an EKS cluster</title>
      <desc id="cm-map-desc">CloudWatch Container Insights, the Prometheus stack, and distributed tracing each cover a different slice of the control plane, node, and pod telemetry an EKS cluster produces.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- ================= ZONES ================= -->
      <rect x="88" y="64" width="272" height="344" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="92" y="68" width="152" height="12" rx="2" fill="#ffffff"/>
      <text x="168" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">MONITORING SOLUTIONS</text>

      <rect x="600" y="64" width="272" height="344" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="604" y="68" width="140" height="12" rx="2" fill="#ffffff"/>
      <text x="674" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">MONITORING TARGETS</text>

      <!-- ================= ARROWS (drawn before nodes) ================= -->
      <!-- Each edge gets its own vertical corridor (x=420..540, 20px apart) so no two connectors overlap. -->
      <!-- CloudWatch Container Insights (r1) fans to all three targets -->
      <path d="M376,110 H412 Q420,110 420,102 Q420,94 428,94 H600" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M376,124 H432 Q440,124 440,132 V186 Q440,194 448,194 H600" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M376,138 H452 Q460,138 460,146 V282 Q460,290 468,290 H600" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- Prometheus Stack (r2) -> Control Plane, Node Resources -->
      <path d="M376,211 H472 Q480,211 480,203 V116 Q480,108 488,108 H600" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M376,229 H492 Q500,229 500,221 Q500,213 508,213 H600" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Tracing (r3) -> Control Plane, Pod Resources -->
      <path d="M376,307 H512 Q520,307 520,299 V130 Q520,122 528,122 H600" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M376,325 H532 Q540,325 540,317 V318 Q540,310 548,310 H600" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ================= NODES ================= -->
      <!-- Sources -->
      <rect x="120" y="96" width="256" height="56" rx="6" fill="#ffffff"/>
      <rect x="120" y="96" width="256" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <rect x="128" y="102" width="30" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
      <text x="143" y="111" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AWS</text>
      <text x="248" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch Container Insights</text>
      <text x="248" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agent-based, cluster-wide</text>

      <rect x="120" y="192" width="256" height="56" rx="6" fill="#ffffff"/>
      <rect x="120" y="192" width="256" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="128" y="198" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="143" y="207" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OSS</text>
