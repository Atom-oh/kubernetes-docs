<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
    <title id="t">Amazon EKS 기반 AI/ML 인프라</title>
    <desc id="d">Amazon EKS 안의 훈련·추론·CPU 노드 그룹이 스토리지와 네트워킹 계층을 공유하고, EKS가 SageMaker·ECR·CloudWatch 등 AWS 서비스와 연동되는 AI/ML 인프라 구조를 보여주는 다이어그램.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#FFFFFF"/>

    <!-- Zone: AWS Cloud -->
    <rect x="32" y="40" width="896" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="44" width="96" height="12" rx="2" fill="#FFFFFF"/>
    <text x="100" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AWS CLOUD</text>

    <!-- Zone: Amazon EKS node groups -->
    <rect x="56" y="80" width="480" height="200" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
    <rect x="76" y="84" width="128" height="12" rx="2" fill="#FFFFFF"/>
    <text x="140" y="93" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AMAZON EKS NODES</text>

    <!-- Zone: shared storage + networking -->
    <rect x="536" y="312" width="376" height="112" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
    <rect x="556" y="316" width="176" height="12" rx="2" fill="#FFFFFF"/>
    <text x="644" y="325" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SHARED STORAGE + NETWORK</text>

    <!-- Arrows (behind nodes) -->
    <!-- All three node groups mount the shared storage/network layer -->
    <path d="M 296,280 V 288 Q 296,296 304,296 H 716 Q 724,296 724,304 V 312"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="470" y="276" width="80" height="12" rx="2" fill="#FFFFFF"/>
    <text x="510" y="285" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MOUNTS</text>

    <!-- EKS node groups -> AWS Services -->
    <path d="M 536,132 H 720 Q 728,132 728,140 V 142"
          fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="592" y="112" width="56" height="12" rx="2" fill="#FFFFFF"/>
    <text x="620" y="121" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MANAGES</text>

    <!-- Node: Training node group (focal) -->
    <rect x="80" y="104" width="272" height="76" rx="6" fill="#FFFFFF"/>
    <rect x="80" y="104" width="272" height="76" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="216" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">훈련 노드 그룹</text>
    <text x="216" y="150" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">p4d.24xl · p3.16xl · g5.48xl</text>
    <text x="216" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPU training</text>

    <!-- Node: Inference node group -->
    <rect x="368" y="104" width="140" height="76" rx="6" fill="#FFFFFF"/>
    <rect x="368" y="104" width="140" height="76" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="438" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">추론 노드 그룹</text>
    <text x="438" y="150" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">g4dn · inf1 · trn1</text>

    <!-- Node: CPU node group -->
    <rect x="368" y="196" width="140" height="60" rx="6" fill="#FFFFFF"/>
    <rect x="368" y="196" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="438" y="222" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">CPU 노드 그룹</text>
    <text x="438" y="240" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">c6i.32xl · r6i.32xl</text>

    <!-- Node: Storage -->
    <rect x="536" y="328" width="168" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="536" y="328" width="168" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="620" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">스토리지</text>
    <text x="620" y="378" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EBS · EFS · FSx · S3</text>

    <!-- Node: Networking -->
    <rect x="676" y="328" width="168" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="676" y="328" width="168" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="760" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">네트워킹</text>
    <text x="760" y="378" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VPC CNI · ENA/EFA</text>

    <!-- Node: AWS Services -->
    <rect x="728" y="104" width="176" height="76" rx="6" fill="#FFFFFF"/>
    <rect x="728" y="104" width="176" height="76" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="816" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">AWS 서비스</text>
    <text x="816" y="150" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SageMaker · ECR</text>
    <text x="816" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CloudWatch</text>

    <!-- Legend -->
    <line x1="32" y1="500" x2="928" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="32" y="524" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="52" y="532" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">GPU 훈련 (focal)</text>
    <rect x="220" y="524" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="240" y="532" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">공유 계층</text>
    <line x1="380" y1="529" x2="408" y2="529" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="416" y="532" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">AWS 서비스 연동</text>
  </svg>