<title id="flag-change-gitops-pipeline-title">Flag 변경 GitOps 파이프라인</title>
<desc id="flag-change-gitops-pipeline-desc">Flag 변경 PR이 CI 검증과 리뷰를 거쳐 승인되면 GitOps로 배포되고 헬스 체크와 메트릭 확인 후 알림이 발송되며, 리뷰가 거부되면 다시 PR 생성 단계로 되돌아가는 전체 파이프라인.</desc>
