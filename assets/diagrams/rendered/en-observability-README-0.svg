<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
      <title id="d0-title">Monitoring evolving into observability</title>
      <desc id="d0-desc">Monitoring's predefined metrics feed threshold alerts and fixed dashboards in a one-way chain, while observability's logs, metrics, and traces cross-reference each other in a closed loop; monitoring evolves into observability.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="960" height="600" fill="#ffffff"/>

      <!-- Zones -->
      <rect x="32" y="96" width="380" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="182" y="100" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="222" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">MONITORING</text>

      <rect x="548" y="96" width="380" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="688" y="100" width="100" height="12" rx="2" fill="#ffffff"/>
      <text x="738" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">OBSERVABILITY</text>

      <!-- Arrows (behind nodes) -->
      <line x1="222" y1="212" x2="222" y2="252" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="222" y1="324" x2="222" y2="364" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="738" y1="212" x2="738" y2="252" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
      <line x1="738" y1="324" x2="738" y2="364" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
      <path d="M 878,176 H 902 Q 910,176 910,184 V 392 Q 910,400 902,400 H 878"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

      <line x1="412" y1="276" x2="548" y2="276" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="450" y="256" width="62" height="12" rx="2" fill="#ffffff"/>
      <text x="481" y="265" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">EVOLUTION</text>

      <!-- Monitoring nodes -->
      <g>
        <rect x="82" y="140" width="280" height="72" rx="6" fill="#ffffff"/>
        <rect x="82" y="140" width="280" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <rect x="90" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
        <text x="106" y="157" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">MON</text>
        <text x="222" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Predefined Metrics</text>
      </g>
      <g>
        <rect x="82" y="252" width="280" height="72" rx="6" fill="#ffffff"/>
        <rect x="82" y="252" width="280" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <rect x="90" y="260" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
        <text x="106" y="269" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">MON</text>
        <text x="222" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Threshold Alerts</text>
      </g>
      <g>
        <rect x="82" y="364" width="280" height="72" rx="6" fill="#ffffff"/>
        <rect x="82" y="364" width="280" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <rect x="90" y="372" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
        <text x="106" y="381" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">MON</text>
        <text x="222" y="406" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Dashboards</text>
      </g>

      <!-- Observability nodes -->
      <g>
        <rect x="598" y="140" width="280" height="72" rx="6" fill="#ffffff"/>
        <rect x="598" y="140" width="280" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <rect x="606" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
        <text x="622" y="157" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">OBS</text>
        <text x="738" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Logs</text>
      </g>
      <g>
        <rect x="598" y="252" width="280" height="72" rx="6" fill="#ffffff"/>
        <rect x="598" y="252" width="280" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <rect x="606" y="260" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
        <text x="622" y="269" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">OBS</text>
        <text x="738" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Metrics</text>
      </g>
      <g>
        <rect x="598" y="364" width="280" height="72" rx="6" fill="#ffffff"/>
        <rect x="598" y="364" width="280" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <rect x="606" y="372" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
        <text x="622" y="381" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">OBS</text>
        <text x="738" y="406" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Traces</text>
      </g>

      <!-- Legend -->
      <line x1="32" y1="490" x2="928" y2="490" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="32" y="506" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="32" y1="530" x2="60" y2="530" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="68" y="533" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">One-way step</text>

      <line x1="220" y1="530" x2="248" y2="530" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
      <text x="256" y="533" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">Cross-reference</text>

      <line x1="440" y1="530" x2="468" y2="530" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="476" y="533" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">Evolution path</text>
    </svg>