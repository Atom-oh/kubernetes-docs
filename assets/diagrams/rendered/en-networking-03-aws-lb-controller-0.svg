<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lbc-topology-title lbc-topology-desc">
    <title id="lbc-topology-title">AWS Load Balancer Controller resource topology</title>
    <desc id="lbc-topology-desc">Diagram showing how Ingress, Service, and TargetGroupBinding resources trigger the AWS Load Balancer Controller, which creates and manages an Application Load Balancer and a Network Load Balancer, each pointing to its own AWS Target Group, with all target groups ultimately registering the same backend Pods.</desc>

    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ===== Zones (bg → zones → arrows → nodes) ===== -->
    <!-- EKS Cluster zone (col1) -->
    <rect x="16" y="64" width="176" height="280" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="24" y="72" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="68" y="81" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">EKS CLUSTER</text>

    <!-- Load Balancers zone (col3) -->
    <rect x="376" y="64" width="176" height="192" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="384" y="72" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="440" y="81" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">LOAD BALANCERS</text>

    <!-- Target Groups zone (col4) -->
    <rect x="584" y="64" width="176" height="192" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="592" y="72" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="646" y="81" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">TARGET GROUPS</text>

    <!-- ===== Arrows (drawn before nodes) ===== -->

    <!-- ING -> CTRL (Triggers) -->
    <path d="M176,124 H208 Q216,124 216,132 V148 Q216,156 224,156 H256" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="182" y="104" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="204" y="113" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">TRIGGERS</text>

    <!-- SVC -> CTRL (Triggers) -->
    <path d="M176,212 H208 Q216,212 216,204 V188 Q216,180 224,180 H256" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- CTRL -> ALB (Creates/Manages) accent -->
    <path d="M376,156 H392 Q400,156 400,148 V132 Q400,124 408,124 H424" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="340" y="100" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="372" y="109" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">CREATES</text>

    <!-- CTRL -> NLB (Creates/Manages) accent -->
    <path d="M376,180 H392 Q400,180 400,188 V204 Q400,212 408,212 H424" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- ALB -> TG1 (straight, same row) -->
    <line x1="568" y1="112" x2="616" y2="112" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- NLB -> TG2 (straight, same row) -->
    <line x1="568" y1="212" x2="616" y2="212" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- TGB -> TG1 (long routed elbow, threads the Target Groups zone's left padding, never crosses TG2) -->
    <path d="M176,300 H592 Q600,300 600,292 V148 Q600,140 608,140 H616" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="364" y="280" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="384" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">BINDS</text>

    <!-- TG1 -> POD -->
    <path d="M744,124 H776 Q784,124 784,132 V144 Q784,152 792,152 H824" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- TG2 -> POD -->
    <path d="M744,212 H776 Q784,212 784,204 V192 Q784,184 792,184 H824" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Nodes ===== -->

    <!-- ING -->
    <rect x="32" y="96" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="32" y="96" width="144" height="56" rx="6" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="104" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Ingress</text>
    <text x="104" y="138" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resource</text>

    <!-- SVC -->
    <rect x="32" y="184" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="32" y="184" width="144" height="56" rx="6" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="104" y="210" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service</text>
    <text x="104" y="226" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resource</text>

    <!-- TGB -->
    <rect x="32" y="272" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="32" y="272" width="144" height="56" rx="6" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="104" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">TargetGroupBinding</text>
    <text x="104" y="314" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">crd</text>

    <!-- CTRL (focal) -->
    <rect x="256" y="136" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="256" y="136" width="120" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="316" y="166" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Controller</text>
    <text x="316" y="182" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">watches k8s resources</text>

    <!-- ALB -->
    <rect x="424" y="96" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="424" y="96" width="144" height="56" rx="6" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="496" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application LB</text>
    <text x="496" y="138" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">http/https · l7</text>

    <!-- NLB -->
    <rect x="424" y="184" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="424" y="184" width="144" height="56" rx="6" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="496" y="210" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Network LB</text>
    <text x="496" y="226" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tcp/udp · l4</text>

    <!-- TG1 -->
    <rect x="616" y="96" width="128" height="56" rx="6" fill="#ffffff"/>
    <rect x="616" y="96" width="128" height="56" rx="6" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="680" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Target Group 1</text>

    <!-- TG2 -->
    <rect x="616" y="184" width="128" height="56" rx="6" fill="#ffffff"/>
    <rect x="616" y="184" width="128" height="56" rx="6" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="680" y="210" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Target Group 2</text>

    <!-- POD (terminal) -->
    <rect x="824" y="120" width="132" height="96" rx="6" fill="#ffffff"/>
    <rect x="824" y="120" width="132" height="96" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="890" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pods</text>
    <text x="890" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workload</text>

    <!-- ===== Legend ===== -->
    <line x1="24" y1="392" x2="936" y2="392" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="412" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="24" y="424" width="16" height="16" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="48" y="436" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal — the controller</text>

    <line x1="220" y1="432" x2="252" y2="432" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="260" y="436" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Creates / manages AWS resource</text>

    <line x1="524" y1="432" x2="556" y2="432" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="564" y="436" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Watch / bind relationship</text>
  </svg>