<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cr-pipeline-title cr-pipeline-desc">
      <title id="cr-pipeline-title">Container delivery pipeline</title>
      <desc id="cr-pipeline-desc">Flowchart showing a container image moving from the CI/CD pipeline where it is built, tested, and pushed, through a container registry that stores, versions, and scans it, into a Kubernetes cluster that pulls, runs, and scales it.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Arrows (drawn before boxes) -->
      <line x1="288" y1="160" x2="336" y2="160" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="628" y1="160" x2="676" y2="160" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- Node 1: CI/CD Pipeline -->
      <rect x="48" y="120" width="240" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="60" y="132" width="60" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="90" y="142" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CI/CD</text>
      <text x="168" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CI/CD Pipeline</text>
      <text x="168" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">build · test · push</text>

      <!-- Node 2: Container Registry (focal) -->
      <rect x="336" y="120" width="288" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <rect x="348" y="132" width="72" height="14" rx="2" fill="transparent" stroke="rgba(236,114,17,0.60)" stroke-width="0.8"/>
      <text x="384" y="142" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REGISTRY</text>
      <text x="480" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Container Registry</text>
      <text x="480" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">store · version · scan</text>

      <!-- Node 3: Kubernetes Cluster -->
      <rect x="676" y="120" width="256" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="688" y="132" width="52" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="714" y="142" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">K8S</text>
      <text x="804" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes Cluster</text>
      <text x="804" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pull · run · scale</text>

      <!-- Legend -->
      <line x1="48" y1="248" x2="932" y2="248" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="48" y="264" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="48" y="280" width="24" height="14" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="80" y="291" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Registry is the checkpoint between build and runtime</text>
    </svg>