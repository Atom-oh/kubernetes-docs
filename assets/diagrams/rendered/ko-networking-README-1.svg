<title id="dtitle">Pod 간 직접 통신</title>
<desc id="ddesc">두 노드에 걸친 4개 Pod가 NAT 없이 서로 직접 통신하는 쿠버네티스 Pod 네트워킹 모델을 보여준다.</desc>

