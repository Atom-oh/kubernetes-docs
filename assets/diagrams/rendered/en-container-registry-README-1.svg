<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cr-decision-title cr-decision-desc">
      <title id="cr-decision-title">Registry choice decision tree</title>
      <desc id="cr-decision-desc">Decision tree for picking a container registry: air-gapped environments route to Harbor; connected AWS/EKS workloads route to Amazon ECR; other production workloads with compliance needs route to Harbor or Docker Hub Business; everything else uses Docker Hub Free or Pro.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Arrows (drawn before boxes) -->
      <!-- Q1 -> Harbor (Yes, down) -->
      <line x1="220" y1="128" x2="220" y2="176" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Q1 -> Q2 (No, right) -->
      <line x1="320" y1="80" x2="480" y2="80" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Q2 -> ECR (Yes, down, accent — happy path for AWS/EKS) -->
      <line x1="480" y1="128" x2="480" y2="176" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- Q2 -> Q3 (No, right) -->
      <line x1="580" y1="80" x2="740" y2="80" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Q3 -> HarborBiz (Yes, down) -->
      <line x1="740" y1="128" x2="740" y2="176" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Q3 -> DockerHub (No, right then down elbow) -->
      <path d="M 840 80 L 900 80 Q 908 80 908 88 L 908 448 Q 908 456 900 456 L 852 456" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Labels: vertical segments get a side gap; horizontal segments get an 8px gap above the line -->
      <rect x="234" y="146" width="28" height="12" rx="2" fill="#ffffff"/>
      <text x="248" y="155" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="388" y="60" width="24" height="12" rx="2" fill="#ffffff"/>
      <text x="400" y="69" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="494" y="146" width="28" height="12" rx="2" fill="#ffffff"/>
      <text x="508" y="155" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="648" y="60" width="24" height="12" rx="2" fill="#ffffff"/>
      <text x="660" y="69" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="754" y="146" width="28" height="12" rx="2" fill="#ffffff"/>
      <text x="768" y="155" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="858" y="60" width="24" height="12" rx="2" fill="#ffffff"/>
      <text x="870" y="69" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <!-- Q1 diamond: Air-gap/disconnected support needed? -->
      <polygon points="220,32 320,80 220,128 120,80" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="220" y="76" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Air-gap / disconnected</text>
      <text x="220" y="90" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">support needed?</text>

      <!-- Harbor result -->
      <rect x="140" y="176" width="160" height="56" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="220" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Harbor</text>

      <!-- Q2 diamond: Running on AWS/EKS? -->
      <polygon points="480,32 580,80 480,128 380,80" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="76" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Running on</text>
      <text x="480" y="90" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS / EKS?</text>

      <!-- ECR result (focal) -->
      <rect x="400" y="176" width="160" height="56" rx="28" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="480" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Amazon ECR</text>

      <!-- Q3 diamond: Production with compliance needs? -->
      <polygon points="740,32 840,80 740,128 640,80" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="740" y="76" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Production with</text>
      <text x="740" y="90" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">compliance needs?</text>

      <!-- Harbor or Docker Hub Business result -->
      <rect x="660" y="176" width="160" height="56" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="740" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Harbor or</text>
      <text x="740" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Docker Hub Business</text>

      <!-- Docker Hub Free/Pro result -->
      <rect x="692" y="428" width="160" height="56" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="772" y="452" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Docker Hub</text>
      <text x="772" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">free / pro</text>

      <!-- Legend -->
      <line x1="48" y1="536" x2="912" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="48" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <polygon points="52,570 64,564 76,570 64,576" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="88" y="574" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Decision</text>
      <rect x="220" y="564" width="24" height="12" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="252" y="574" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Outcome</text>
      <rect x="360" y="564" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="392" y="574" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Default fit for AWS/EKS workloads</text>
    </svg>