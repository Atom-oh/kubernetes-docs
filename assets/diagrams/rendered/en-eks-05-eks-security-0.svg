    <title id="en-eks-05-eks-security-0-title">EKS shared responsibility model</title>
    <desc id="en-eks-05-eks-security-0-desc">Architecture diagram showing AWS manages the encrypted control plane, etcd, KMS, and IAM authentication, while the customer secures worker nodes, pods, service accounts, security groups, network policies, and secrets.</desc>
