<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="ko-storage-p3-4-title ko-storage-p3-4-desc">
    <title id="ko-storage-p3-4-title">EKS 스토리지 관리 수명 주기</title>
    <desc id="ko-storage-p3-4-desc">스토리지 수명 주기의 계획·구현·운영·최적화 네 단계가 각각 계획 설계, 자동화, 백업·재해복구, 성능·비용 최적화라는 실행 영역과 짝을 이루는 구조를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: lifecycle phases -->
    <rect x="40" y="32" width="880" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="424" y="36" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">수명 주기 단계</text>

    <!-- Zone: practice bundles -->
    <rect x="40" y="212" width="880" height="180" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="416" y="216" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="225" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">실행 영역별 모범 사례</text>

    <!-- Arrows: each phase -> its practice bundle (straight, same column) -->
    <line x1="150" y1="112" x2="150" y2="256" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="390" y1="112" x2="390" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="630" y1="112" x2="630" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="850" y1="112" x2="850" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Phase nodes ===== -->
    <rect x="80" y="64" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="80" y="64" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="150" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">계획 단계</text>

    <rect x="320" y="64" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="320" y="64" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="390" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">구현 단계</text>

    <rect x="560" y="64" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="560" y="64" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="630" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">운영 단계</text>

    <rect x="780" y="64" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="780" y="64" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="850" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">최적화 단계</text>

    <!-- ===== Practice bundle nodes ===== -->
    <rect x="80" y="256" width="140" height="112" rx="6" fill="#ffffff"/>
    <rect x="80" y="256" width="140" height="112" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="150" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">계획 및 설계</text>
    <text x="150" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">요구사항 분석</text>
    <text x="150" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ 스토리지 유형 선택</text>
    <text x="150" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ 용량 계획</text>

    <rect x="320" y="256" width="140" height="112" rx="6" fill="#ffffff"/>
    <rect x="320" y="256" width="140" height="112" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="390" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">자동화 및 IaC</text>
    <text x="390" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Terraform/CFN</text>
    <text x="390" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ Helm 차트</text>
    <text x="390" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ GitOps 워크플로우</text>

    <rect x="560" y="256" width="140" height="112" rx="6" fill="#ffffff"/>
    <rect x="560" y="256" width="140" height="112" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="630" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">백업 및 재해 복구</text>
    <text x="630" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">정기 백업</text>
    <text x="630" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ DR 계획</text>
    <text x="630" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ Velero 백업</text>

    <rect x="780" y="256" width="140" height="112" rx="6" fill="#ffffff"/>
    <rect x="780" y="256" width="140" height="112" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="850" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">성능·비용 최적화</text>
    <text x="850" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">성능 검토</text>
    <text x="850" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ 비용 검토</text>
    <text x="850" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ 자동 스케일링</text>

    <!-- Legend -->
    <line x1="40" y1="424" x2="920" y2="424" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="440" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="456" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="464" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Noto Sans KR',sans-serif">첫 단계 (기준선)</text>

    <rect x="230" y="456" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="250" y="464" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Noto Sans KR',sans-serif">수명 주기 단계</text>

    <rect x="420" y="456" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="440" y="464" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Noto Sans KR',sans-serif">단계별 모범 사례 (내부 순서는 화살표로 표기)</text>

    <text x="40" y="486" fill="#7D8998" font-size="8.5" font-family="'Amazon Ember','Noto Sans KR',sans-serif" font-style="italic">※ 폐기 단계는 원본에서 다른 단계와 연결되지 않아 이 다이어그램에서 생략함.</text>
  </svg>
