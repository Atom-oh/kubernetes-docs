<title id="en-service-mesh-istio-03-architecture-6-title">Traffic Flow After iptables Applied</title>
<desc id="en-service-mesh-istio-03-architecture-6-desc">Architecture diagram showing an application's outbound request redirected by iptables OUTPUT chain rules into Envoy's outbound listener and forwarded to an external service using the proxy's own UID to bypass further interception, and a mirrored inbound path through the PREROUTING chain into Envoy's inbound listener after mTLS verification back to the application.</desc>
