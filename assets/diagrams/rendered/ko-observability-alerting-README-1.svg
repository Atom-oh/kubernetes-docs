<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="lifecycle-title lifecycle-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="lifecycle-title">알림 생명주기 상태 머신</title>
    <desc id="lifecycle-desc">알림이 비활성에서 시작해 대기, 발생, 통보, 확인, 조치, 해결을 거쳐 종료되며, 임계값 이내 복귀나 자동 해결 시 조기에 비활성 상태로 되돌아갈 수 있음을 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#7D8998"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- start dot -->
    <circle cx="40" cy="148" r="6" fill="#232F3E"/>
    <line x1="46" y1="148" x2="76" y2="148" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="46" y="130" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="61" y="139" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">INIT</text>

    <!-- Row 1: Inactive -> Pending -> Firing -->
    <!-- Inactive -->
    <rect x="80" y="116" width="120" height="64" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Inactive</text>
    <text x="140" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">정상 상태</text>

    <!-- Pending -->
    <rect x="280" y="116" width="120" height="64" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="340" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pending</text>
    <text x="340" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">for 대기 중</text>

    <!-- Firing (focal) -->
    <rect x="480" y="116" width="120" height="64" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="540" y="144" fill="#EC7211" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Firing</text>
    <text x="540" y="160" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">발생 · 전송 대기</text>

    <!-- Inactive -> Pending -->
    <line x1="200" y1="148" x2="280" y2="148" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="205" y="126" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="135" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">임계값 초과</text>

    <!-- Pending -> Firing -->
    <line x1="400" y1="148" x2="480" y2="148" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="405" y="126" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="440" y="135" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">대기 경과</text>

    <!-- Pending -> Inactive (return, dashed, below) -->
    <path d="M 300,180 V 220 Q 300,228 292,228 H 148 Q 140,228 140,220 V 180"
          fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
    <rect x="180" y="222" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="231" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">임계값 이내 복귀</text>

    <!-- Firing -> Inactive (return, dashed, long, below) -->
    <path d="M 520,180 V 256 Q 520,264 512,264 H 148 Q 140,264 140,256 V 180"
          fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
    <rect x="280" y="258" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="325" y="267" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">자동 해결</text>

    <!-- Firing -> Notified (down then right into row 2) -->
    <line x1="540" y1="180" x2="540" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="505" y="228" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="540" y="237" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">알림 전송</text>

    <!-- Row 2: Notified -->
    <rect x="480" y="300" width="120" height="64" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="540" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Notified</text>
    <text x="540" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">통보됨</text>

    <!-- Notified -> Acknowledged (same row, straight) -->
    <line x1="480" y1="332" x2="400" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="405" y="310" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="440" y="319" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">담당자 확인</text>

    <!-- Acknowledged -->
    <rect x="280" y="300" width="120" height="64" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="340" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Acknowledged</text>
    <text x="340" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">확인됨</text>

    <!-- Acknowledged -> InProgress (same row, straight) -->
    <line x1="280" y1="332" x2="200" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="205" y="310" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="319" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">조치 중</text>

    <!-- InProgress -->
    <rect x="80" y="300" width="120" height="64" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">InProgress</text>
    <text x="140" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">조치 진행 중</text>

    <!-- InProgress -> Resolved (down to row 3) -->
    <line x1="140" y1="364" x2="140" y2="440" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="105" y="392" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="140" y="401" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">문제 해결</text>

    <!-- Resolved -->
    <rect x="80" y="440" width="120" height="64" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="468" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Resolved</text>
    <text x="140" y="484" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">해결됨</text>

    <!-- Resolved -> end -->
    <line x1="200" y1="472" x2="260" y2="472" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="205" y="450" width="50" height="12" rx="2" fill="#ffffff"/>
    <text x="230" y="459" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">종료</text>
    <circle cx="276" cy="472" r="8" fill="none" stroke="#232F3E" stroke-width="1.2"/>
    <circle cx="276" cy="472" r="5" fill="#232F3E"/>

    <!-- Legend -->
    <line x1="30" y1="552" x2="930" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="220" cy="564" r="5" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="232" y="568" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">정상 상태 전이</text>
    <line x1="440" y1="564" x2="460" y2="564" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="468" y="568" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">조기 복귀 (자동 해결)</text>
    <circle cx="700" cy="564" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="712" y="568" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">알림이 발생 중인 상태 (초점)</text>
  </svg>