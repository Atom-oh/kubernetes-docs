<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc">
<title id="d2-title">Dynamic Provisioning via Storage Classes</title>
<desc id="d2-desc">A user&#x27;s PersistentVolumeClaim references a StorageClass, which dynamically provisions a PersistentVolume that the claim binds to and a Pod uses, ultimately connecting to physical storage.</desc>
