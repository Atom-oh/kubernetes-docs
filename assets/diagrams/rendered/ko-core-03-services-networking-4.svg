<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t4 d4">
    <title id="t4">Cilium과 eBPF 데이터 경로</title>
    <desc id="d4">Kubernetes가 CNI 표준을 통해 Cilium을 호출하고, Cilium이 eBPF로 커널 데이터 경로를 구현하며 Hubble로 네트워크 흐름을 관찰 가능하게 만드는 계층 구조를 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Arrows ===== -->
    <!-- K8S -> CNI -->
    <line x1="480" y1="140" x2="480" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CNI -> Cilium (focal) -->
    <line x1="480" y1="260" x2="480" y2="300" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- Cilium -> eBPF -->
    <path d="M 452,380 H 300 Q 292,380 292,388 V 424 Q 292,432 300,432 H 388" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- eBPF -> Kernel -->
    <line x1="480" y1="480" x2="480" y2="520" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Cilium -> Hubble -->
    <path d="M 508,380 H 660 Q 668,380 668,388 V 424 Q 668,432 660,432 H 572" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Nodes ===== -->
    <!-- K8S -->
    <rect x="400" y="80" width="160" height="60" rx="6" fill="#ffffff"/>
    <rect x="400" y="80" width="160" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="106" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Kubernetes</text>
    <text x="480" y="122" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">kubelet</text>

    <!-- CNI -->
    <rect x="400" y="180" width="160" height="80" rx="6" fill="#ffffff"/>
    <rect x="400" y="180" width="160" height="80" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Container Network</text>
    <text x="480" y="226" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Interface</text>
    <text x="480" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CNI spec</text>

    <!-- Cilium (focal) -->
    <rect x="400" y="300" width="160" height="80" rx="6" fill="#ffffff"/>
    <rect x="400" y="300" width="160" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="336" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Cilium</text>
    <text x="480" y="352" fill="#EC7211" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CNI plugin</text>

    <!-- eBPF -->
    <rect x="388" y="424" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="388" y="424" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="468" y="448" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">eBPF</text>
    <text x="468" y="464" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">kernel programs</text>

    <!-- Kernel -->
    <rect x="400" y="520" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="520" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="544" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Linux Kernel</text>
    <text x="480" y="560" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">data path</text>

    <!-- Hubble -->
    <rect x="572" y="424" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="572" y="424" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="652" y="448" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Hubble</text>
    <text x="652" y="464" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">observability</text>

    <!-- Legend -->
    <line x1="40" y1="60" x2="920" y2="60" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="40" width="200" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="140" y="49" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">eBPF 기반 CNI 구현</text>
  </svg>