<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-eks-11-eks-advanced-debugging-0-title en-eks-11-eks-advanced-debugging-0-desc">
<title id="en-eks-11-eks-advanced-debugging-0-title">EKS Incident Triage Decision Tree</title>
<desc id="en-eks-11-eks-advanced-debugging-0-desc">Decision-tree flowchart for the first five minutes of EKS incident triage: starting from an incident being detected, it branches on service accessibility, kubectl connectivity, node readiness, and response-delay symptoms to route the responder to one of six root-cause categories -- control plane, node, scheduling, app/config, workload, cluster-wide, or network/DNS issues.</desc>
