<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Ambient 모드의 노드 레벨 트래픽 처리</title>
<desc id="ddesc">사이드카 없이 노드당 하나씩 배치된 ztunnel이 파드의 트래픽을 투명하게 리다이렉트받고 필요시 Waypoint Proxy로 L7 처리를 넘기는 구조</desc>
