<circle cx="60" cy="140" r="6" fill="#232F3E"/>
<circle cx="912" cy="140" r="8" fill="#ffffff" stroke="#232F3E" stroke-width="1.2"/>
<circle cx="912" cy="140" r="5" fill="#232F3E"/>
<rect x="80" y="440" width="220" height="100" rx="6" fill="#ffffff"/>
