<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-eks-11-eks-advanced-debugging-2-title en-eks-11-eks-advanced-debugging-2-desc">
<title id="en-eks-11-eks-advanced-debugging-2-title">Pod Lifecycle State Machine</title>
<desc id="en-eks-11-eks-advanced-debugging-2-desc">State machine for a Kubernetes Pod's lifecycle: Pending moves to ContainerCreating on image pull, which succeeds into Running or fails; Running either completes into Succeeded or crashes into Failed; and Failed pods return to Pending under the restart policy. Annotation cards below list the major failure causes typically seen at the Pending, ContainerCreating, and Failed states.</desc>
<defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
  <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
</defs>
