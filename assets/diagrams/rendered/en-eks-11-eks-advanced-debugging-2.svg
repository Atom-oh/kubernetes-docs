<text x="480.0" y="478" fill="#232F3E" font-size="11.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ContainerCreating</text>
<text x="480.0" y="494" fill="#545B64" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Image pull failure,</text>
