<text x="515" y="129" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUCCESS</text>
<line x1="690" y1="140" x2="750" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="700.0" y="120" width="40" height="12" rx="2" fill="#ffffff"/>
