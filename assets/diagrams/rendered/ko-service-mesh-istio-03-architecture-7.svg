<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dns-basic-title dns-basic-desc">
    <title id="dns-basic-title">쿠버네티스 기본 DNS 조회</title>
    <desc id="dns-basic-desc">애플리케이션의 이름 해석 요청이 파드 내부의 resolv.conf를 거쳐 CoreDNS로 전달되고, ClusterIP가 반환되어 애플리케이션에 전달되는 기본 DNS 조회 경로를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: 파드 Network -->
    <rect x="356" y="248" width="248" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="416" y="252" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="261" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">파드 NETWORK</text>

    <!-- Zone: Kubernetes -->
    <rect x="676" y="248" width="248" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="746" y="252" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="800" y="261" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KUBERNETES</text>

    <!-- Arrows -->
    <line x1="200" y1="300" x2="380" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="380" y1="324" x2="200" y2="324" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <line x1="580" y1="300" x2="700" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="700" y1="324" x2="580" y2="324" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <!-- Labels -->
    <rect x="216" y="282" width="148" height="12" rx="2" fill="#ffffff"/>
    <text x="290" y="291" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1·이름 해석 요청</text>

    <rect x="216" y="330" width="148" height="12" rx="2" fill="#ffffff"/>
    <text x="290" y="339" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">4·IP 반환 (10.100.1.5)</text>

    <rect x="596" y="282" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="291" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2·DNS 쿼리</text>

    <rect x="596" y="330" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="339" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3·ClusterIP</text>

    <!-- Node: 애플리케이션 -->
    <rect x="60" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="280" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="68" y="288" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="82" y="297" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="130" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">애플리케이션</text>
    <text x="130" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">curl reviews</text>

    <!-- Node: resolv.conf (focal) -->
    <rect x="380" y="280" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="280" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="388" y="288" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="406" y="297" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONF</text>
    <text x="480" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">/etc/resolv.conf</text>
    <text x="480" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nameserver 10.96.0.10</text>

    <!-- Node: CoreDNS -->
    <rect x="700" y="280" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="700" y="280" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="708" y="288" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="724" y="297" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DNS</text>
    <text x="800" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CoreDNS</text>
    <text x="800" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kube-dns · 10.96.0.10</text>

    <!-- Legend -->
    <line x1="60" y1="440" x2="900" y2="440" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="456" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="60" y="468" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="80" y="476" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal · 파드 내 리졸버</text>
    <line x1="300" y1="476" x2="328" y2="476" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="336" y="479" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">응답 반환(return)</text>
  </svg>