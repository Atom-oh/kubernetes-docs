<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="ko-observability-logging-01-loki-1-title ko-observability-logging-01-loki-1-desc">
  <title id="ko-observability-logging-01-loki-1-title">라벨 카디널리티가 스트림 수를 통해 성능에 미치는 영향</title>
  <desc id="ko-observability-logging-01-loki-1-desc">라벨 수와 라벨값 종류가 곱해져 총 스트림 수를 만들고, 그 스트림 수가 인덱스 크기·쿼리 성능·메모리 사용량을 함께 좌우한다는 것을 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== Arrows (drawn before nodes) ===== -->
  <!-- A -> B -->
  <path d="M 240,168 L 356,168 Q 364,168 364,176 L 364,288 Q 364,296 372,296 L 380,296"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- C -> B -->
  <path d="M 240,400 L 356,400 Q 364,400 364,392 L 364,320 Q 364,312 372,312 L 380,312"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- B -> D -->
  <path d="M 580,288 L 664,288 Q 672,288 672,280 L 672,136 Q 672,128 680,128 L 700,128"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- B -> E (straight, same y) -->
  <path d="M 580,304 H 700" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- B -> F -->
  <path d="M 580,320 L 664,320 Q 672,320 672,328 L 672,472 Q 672,480 680,480 L 700,480"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- ===== Nodes ===== -->

  <!-- A: 라벨 수 (input) -->
  <rect x="60" y="140" width="180" height="56" rx="6" fill="#ffffff"/>
  <rect x="60" y="140" width="180" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="150" y="172" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">라벨 수</text>

  <!-- C: 라벨값 종류 (input) -->
  <rect x="60" y="372" width="180" height="56" rx="6" fill="#ffffff"/>
  <rect x="60" y="372" width="180" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="150" y="404" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">라벨값 종류</text>

  <!-- B: 총 스트림 수 (focal hub) -->
  <rect x="380" y="272" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="380" y="272" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="480" y="300" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">총 스트림 수</text>
  <text x="480" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">labels × values</text>

  <!-- D: 인덱스 크기 -->
  <rect x="700" y="100" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="700" y="100" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="800" y="132" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">인덱스 크기</text>

  <!-- E: 쿼리 성능 -->
  <rect x="700" y="276" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="700" y="276" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="800" y="308" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">쿼리 성능</text>

  <!-- F: 메모리 사용량 -->
  <rect x="700" y="452" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="700" y="452" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="800" y="484" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">메모리 사용량</text>

</svg>