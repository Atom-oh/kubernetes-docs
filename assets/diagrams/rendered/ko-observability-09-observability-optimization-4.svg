  <title id="ko-observability-09-observability-optimization-4-title">전통적 계측 방식과 eBPF 계측 방식 비교</title>
  <desc id="ko-observability-09-observability-optimization-4-desc">전통적 계측은 SDK 추가와 코드 재배포를 거쳐야 하지만, eBPF 계측은 애플리케이션 코드 변경 없이 커널 레벨 훅에서 데이터를 수집한다.</desc>
