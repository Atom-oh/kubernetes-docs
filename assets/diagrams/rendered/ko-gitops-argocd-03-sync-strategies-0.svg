<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="argocd-sync-loop-title argocd-sync-loop-desc">
      <title id="argocd-sync-loop-title">ArgoCD 동기화 루프</title>
      <desc id="argocd-sync-loop-desc">ArgoCD가 Git의 원하는 상태와 Kubernetes의 실제 상태를 비교하고, 차이가 있으면 변경을 적용해 실제 상태를 원하는 상태로 되돌리는 순환 구조를 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zone containers -->
      <rect x="32" y="176" width="248" height="168" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="48" y="200" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GIT REPOSITORY</text>

      <rect x="344" y="88" width="288" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="360" y="112" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ARGOCD</text>

      <rect x="744" y="176" width="184" height="168" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="760" y="200" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">KUBERNETES</text>

      <!-- Arrows (behind nodes) -->
      <!-- Desired -> Compare -->
      <path d="M 208 260 L 292 260 Q 300 260 300 252 L 300 180 Q 300 172 308 172 L 376 172" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Live -> Compare (enters bottom edge) -->
      <path d="M 768 260 L 528 260 Q 520 260 520 252 L 520 204" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Compare -> Apply (straight, shared x) -->
      <line x1="488" y1="204" x2="488" y2="340" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Apply -> Live -->
      <path d="M 600 372 L 680 372 Q 688 372 688 364 L 688 268 Q 688 260 696 260 L 768 260" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow label: OUTOFSYNC -->
      <rect x="452" y="258" width="72" height="14" rx="2" fill="#ffffff"/>
      <text x="488" y="269" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTOFSYNC</text>

      <!-- Node: Desired State -->
      <rect x="56" y="236" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="132" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">원하는 상태</text>
      <text x="132" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">desired state</text>

      <!-- Node: Compare (focal) -->
      <rect x="376" y="140" width="224" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="488" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">상태 비교</text>
      <text x="488" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">diff engine</text>

      <!-- Node: Apply (focal) -->
      <rect x="376" y="340" width="224" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="488" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">변경 적용</text>
      <text x="488" y="384" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl apply</text>

      <!-- Node: Live State -->
      <rect x="768" y="236" width="136" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="836" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">실제 상태</text>
      <text x="836" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">live state</text>

      <!-- Legend -->
      <line x1="32" y1="512" x2="928" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="32" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="32" y="544" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="64" y="554" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">ArgoCD 컨트롤러 단계</text>

      <line x1="380" y1="550" x2="408" y2="550" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="416" y="554" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">상태 조회</text>

      <line x1="560" y1="550" x2="588" y2="550" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="596" y="554" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">동기화 실행 경로</text>
    </svg>