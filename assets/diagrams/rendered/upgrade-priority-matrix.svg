<rect x="428" y="359" width="159" height="14" rx="2" fill="#ffffff" opacity="0.9"/>
<text x="430" y="370" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">5 clusters, mixed workloads</text>
<circle cx="540" cy="282" r="4" fill="#545B64"/>
<rect x="548" y="263" width="154" height="14" rx="2" fill="#ffffff" opacity="0.9"/>
<text x="550" y="274" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">10 clusters, stateful apps</text>
<circle cx="630" cy="228" r="4" fill="#545B64"/>
<rect x="638" y="209" width="137" height="14" rx="2" fill="#ffffff" opacity="0.9"/>
<text x="640" y="220" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">25 clusters, multi-team</text>
<circle cx="720" cy="156" r="5" fill="#EC7211"/>
