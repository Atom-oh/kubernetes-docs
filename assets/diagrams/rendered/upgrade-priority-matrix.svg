<circle cx="30" cy="596" r="4" fill="#545B64"/>
<text x="42" y="600" fill="#545B64" font-size="9" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Fleet profile</text>
<circle cx="180" cy="596" r="5" fill="#EC7211"/>
<text x="194" y="600" fill="#EC7211" font-size="9" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Highest cost-risk exposure</text>
