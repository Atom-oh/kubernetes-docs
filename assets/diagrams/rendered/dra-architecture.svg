<title id="dra-architecture-title">Dynamic Resource Allocation Architecture</title>
<desc id="dra-architecture-desc">Flowchart showing the Dynamic Resource Allocation architecture that reached GA in Kubernetes 1.34: DeviceClass definitions feed ResourceClaims and ResourceClaimTemplates, which the scheduler consumes alongside device information from the DRA driver to place pods, before the kubelet prepares the actual devices.</desc>
