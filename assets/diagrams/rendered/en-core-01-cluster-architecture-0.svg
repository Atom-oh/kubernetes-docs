<title id="en-core-01-cluster-architecture-0-title">Kubernetes cluster architecture</title>
<desc id="en-core-01-cluster-architecture-0-desc">Architecture diagram showing the control plane's kube-apiserver coordinating etcd, the scheduler, and controller managers, and reaching across to a worker node's kubelet and kube-proxy, which in turn drive the container runtime and running pods.</desc>
