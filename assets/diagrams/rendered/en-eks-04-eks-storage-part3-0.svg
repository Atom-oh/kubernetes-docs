<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mon-title mon-desc">
    <title id="mon-title">Storage monitoring solutions</title>
    <desc id="mon-desc">Diagram showing three parallel storage-monitoring pipelines: AWS CloudWatch turning per-volume metrics into alarms and a dashboard, Prometheus feeding ServiceMonitor/PodMonitor discovery into Grafana and alert rules, and a custom volume-usage exporter driving custom metrics and alerts.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="32" y="64" width="280" height="392" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="68" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="116" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AWS CLOUDWATCH</text>

    <rect x="336" y="64" width="296" height="392" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="356" y="68" width="164" height="12" rx="2" fill="#ffffff"/>
    <text x="438" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KUBERNETES MONITORING</text>

    <rect x="656" y="64" width="272" height="392" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="676" y="68" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="736" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CUSTOM SOLUTIONS</text>

    <!-- Arrows (drawn before boxes) -->
    <!-- Zone A vertical chain: Volume Metrics(104-160) -> Key Metrics(176-232) -> CW Alarms(248-304) -> CW Dashboard(320-376) -->
    <line x1="172" y1="160" x2="172" y2="176" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="172" y1="232" x2="172" y2="248" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="172" y1="304" x2="172" y2="320" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Zone B: Prometheus(104-160) -> Discovery(176-232) -> Grafana(248-304); Prometheus -> Alert Rules (side, same row) -->
    <line x1="426" y1="160" x2="426" y2="176" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="426" y1="232" x2="426" y2="248" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="496" y1="132" x2="524" y2="132" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Zone C: Usage Exporter(104-160) -> Custom Metrics(176-232) -> Custom Alerts(248-304) -->
    <line x1="792" y1="160" x2="792" y2="176" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="792" y1="232" x2="792" y2="248" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Nodes: Zone A -->
    <!-- Volume Metrics (external) -->
    <rect x="52" y="104" width="240" height="56" rx="6" fill="#ffffff"/>
    <rect x="52" y="104" width="240" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="172" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Volume Metrics</text>
    <text x="172" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EBS / EFS / FSx</text>

    <!-- Key Metrics (store) -->
    <rect x="52" y="176" width="240" height="56" rx="6" fill="#ffffff"/>
    <rect x="52" y="176" width="240" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="172" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Key Metrics</text>
    <text x="172" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">usage/iops/tput/lat/queue/burst</text>

    <!-- CW Alarms (focal) -->
    <rect x="52" y="248" width="240" height="56" rx="6" fill="#ffffff"/>
    <rect x="52" y="248" width="240" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="172" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch Alarms</text>
    <text x="172" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">threshold breach</text>

    <!-- CW Dashboard (backend) -->
    <rect x="52" y="320" width="240" height="56" rx="6" fill="#ffffff"/>
    <rect x="52" y="320" width="240" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="172" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch Dashboard</text>
    <text x="172" y="360" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">visualize</text>

    <!-- Nodes: Zone B -->
    <rect x="356" y="104" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="426" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
    <text x="426" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scrape/store</text>

    <rect x="524" y="104" width="88" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="568" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alert Rules</text>
    <text x="568" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PrometheusRule</text>

    <rect x="356" y="176" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="426" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Discovery</text>
    <text x="426" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ServiceMonitor/PodMonitor</text>

    <rect x="356" y="248" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="426" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana Dashboard</text>
    <text x="426" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">visualize</text>

    <!-- Nodes: Zone C -->
    <rect x="676" y="104" width="232" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="792" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Volume Usage Exporter</text>
    <text x="792" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">custom collector</text>

    <rect x="676" y="176" width="232" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="792" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Custom Metrics</text>
    <text x="792" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app-specific</text>

    <rect x="676" y="248" width="232" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="792" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Custom Alerts</text>
    <text x="792" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">notify</text>

    <!-- Legend -->
    <line x1="32" y1="512" x2="928" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="120" y="521" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="140" y="529" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">AGGREGATION BOTTLENECK</text>
    <rect x="340" y="521" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="360" y="529" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">OPTIONAL / NO DOWNSTREAM ACTION</text>
  </svg>