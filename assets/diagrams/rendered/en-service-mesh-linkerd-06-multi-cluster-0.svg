<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="mcarch-title mcarch-desc">
    <title id="mcarch-title">Multi-cluster service mirroring architecture</title>
    <desc id="mcarch-desc">Architecture diagram showing the East cluster's service mirror controller watching the West cluster, creating a local mirror of web-service that routes traffic through the West gateway over an mTLS connection between the two clusters' gateways.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="8 0, 0 3, 8 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (drawn before arrows and nodes) -->
    <rect x="40" y="88" width="388" height="216" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="164" y="92" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="234" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER WEST</text>

    <rect x="532" y="88" width="388" height="216" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="656" y="92" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="726" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER EAST</text>

    <!-- Arrows (behind boxes) -->
    <!-- SM_W -> SVC_W (vertical, axis-aligned) -->
    <line x1="144" y1="184" x2="144" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- SM_E -> SVC_E_MIRROR (vertical, axis-aligned) -->
    <line x1="816" y1="184" x2="816" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- SM_E -> SM_W : Watch (horizontal) -->
    <line x1="736" y1="152" x2="224" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- GW_W <-> GW_E : mTLS (horizontal, bidirectional, accent) -->
    <line x1="408" y1="202" x2="552" y2="202" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <!-- SVC_E_MIRROR -> GW_W : Route (S-elbow, r=8) -->
    <path d="M 816,284 V 332 Q 816,340 808,340 H 336 Q 328,340 328,332 V 234"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="455" y="132" width="50" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="141" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WATCH</text>

    <rect x="460" y="182" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="191" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MTLS</text>

    <rect x="547" y="320" width="50" height="12" rx="2" fill="#ffffff"/>
    <text x="572" y="329" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

    <!-- Node: SM_W (Service Mirror Controller, West) -->
    <rect x="64" y="120" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="120" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="72" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="86" y="137" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SM</text>
    <text x="144" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service Mirror</text>
    <text x="144" y="172" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">controller</text>

    <!-- Node: SVC_W (web-service, West) -->
    <rect x="64" y="220" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="220" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="72" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="86" y="237" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="144" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">web-service</text>
    <text x="144" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local target</text>

    <!-- Node: GW_W (Gateway Ingress, West) -->
    <rect x="248" y="170" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="248" y="170" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="256" y="178" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="270" y="187" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
    <text x="328" y="206" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway</text>
    <text x="328" y="222" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ingress</text>

    <!-- Node: GW_E (Gateway Ingress, East) -->
    <rect x="552" y="170" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="552" y="170" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="560" y="178" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="574" y="187" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
    <text x="632" y="206" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway</text>
    <text x="632" y="222" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ingress</text>

    <!-- Node: SM_E (Service Mirror Controller, East) -->
    <rect x="736" y="120" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="736" y="120" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="744" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="758" y="137" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SM</text>
    <text x="816" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service Mirror</text>
    <text x="816" y="172" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">controller</text>

    <!-- Node: SVC_E_MIRROR (web-service-west mirror, East) — FOCAL -->
    <rect x="736" y="220" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="736" y="220" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="744" y="228" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="762" y="237" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MIRROR</text>
    <text x="816" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">web-service-west</text>
    <text x="816" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mirror service</text>

    <!-- Legend strip -->
    <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="568" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Mirror service (focal)</text>

    <line x1="256" y1="573" x2="284" y2="573" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="292" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">mTLS (secure channel)</text>

    <line x1="480" y1="573" x2="508" y2="573" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="516" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Internal / control call</text>
  </svg>