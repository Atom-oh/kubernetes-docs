<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Airflow on Kubernetes 컴포넌트 아키텍처</title>
<desc id="ddesc">Kubernetes 클러스터 안에서 Airflow api-server, scheduler, dag-processor, triggerer 배포가 모두 PostgreSQL 상태 저장소를 공유하고, scheduler가 실행기(Executor) 종류에 따라 CeleryExecutor의 Redis 브로커/워커 풀 또는 KubernetesExecutor의 태스크별 파드 중 하나로 작업을 위임하는 구조를 보여준다.</desc>

<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    .name{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:12px;fill:#232F3E;}
    .sub{font-family:'Geist Mono',ui-monospace,monospace;font-size:9px;fill:#545B64;}
    .tag{font-family:'Geist Mono',ui-monospace,monospace;font-size:7px;letter-spacing:0.08em;text-anchor:middle;}
    .eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;font-weight:500;letter-spacing:0.18em;fill:#7D8998;}
    .title{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:20px;fill:#232F3E;}
    .zonelabel{font-family:'Geist Mono',ui-monospace,monospace;font-size:7px;letter-spacing:0.14em;text-anchor:middle;}
    .arrlabel{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;letter-spacing:0.06em;text-anchor:middle;fill:#7D8998;}
    .legend{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;fill:#545B64;}
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<!-- background -->
<rect width="960" height="600" fill="#ffffff"/>

<!-- header -->
<text x="32" y="24" class="eyebrow">DATA ON EKS · AIRFLOW</text>
<text x="32" y="48" class="title">Airflow on Kubernetes 컴포넌트 아키텍처</text>

<!-- ===== zones (bg -> zones -> arrows -> nodes) ===== -->
<rect x="32" y="72" width="896" height="464" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="44" y="76" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="114" y="85" class="zonelabel" fill="rgba(35,47,62,0.40)">KUBERNETES CLUSTER</text>

<rect x="160" y="360" width="400" height="168" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.35)" stroke-width="0.8" stroke-dasharray="4,4"/>
<rect x="176" y="364" width="252" height="12" rx="2" fill="#ffffff"/>
<text x="302" y="373" class="zonelabel" fill="rgba(35,47,62,0.45)">OPTIONAL · CELERYEXECUTOR ONLY</text>

<!-- ===== arrows (drawn before nodes) ===== -->

<!-- API -> PG -->
<path d="M228,176 V204 Q228,212 236,212 H400 Q408,212 408,220 V248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="250" y="192" width="68" height="12" rx="2" fill="#ffffff"/>
<text x="284" y="201" class="arrlabel">R/W STATE</text>

<!-- SCH -> PG -->
<path d="M400,176 V204 Q400,212 408,212 H440 Q448,212 448,220 V248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="390" y="192" width="68" height="12" rx="2" fill="#ffffff"/>
<text x="424" y="201" class="arrlabel">READ DAG</text>

<!-- DP -> PG -->
<path d="M564,176 V204 Q564,212 556,212 H504 Q496,212 496,220 V248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="492" y="192" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="530" y="201" class="arrlabel">WRITE DAGS</text>

