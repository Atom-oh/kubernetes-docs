<path d="M320,448 V452 Q320,460 312,460 H276 Q268,460 268,468 V472" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- REDIS -> W2 (dashed) -->
<path d="M400,448 V452 Q400,460 408,460 H428 Q436,460 436,468 V472" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

