<path d="M336,176 V332 Q336,340 344,340 H744 Q752,340 752,348 V392" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="616" y="320" width="68" height="12" rx="2" fill="#ffffff"/>
<text x="650" y="329" class="arrlabel">CREATE POD</text>

