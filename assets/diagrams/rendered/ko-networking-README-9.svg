<text x="220" y="165" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Primary ENI</text>
<text x="220" y="181" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">eth0</text>
<rect x="400" y="140" width="160" height="56" rx="6" fill="#FFFFFF"/>
