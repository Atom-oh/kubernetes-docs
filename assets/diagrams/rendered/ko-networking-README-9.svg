<text x="405" y="365" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">Secondary IP</text>
<rect x="490" y="320" width="110" height="64" rx="6" fill="#FFFFFF"/>
<rect x="490" y="320" width="110" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="545" y="349" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod 3</text>
<text x="545" y="365" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">Secondary IP</text>
<rect x="620" y="320" width="110" height="64" rx="6" fill="#FFFFFF"/>
<rect x="620" y="320" width="110" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="675" y="349" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod 4</text>
<text x="675" y="365" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">Secondary IP</text>
<text x="80" y="546" fill="#545B64" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">각 ENI의 보조(Secondary) IP가 Pod에 직접 할당되어, Pod가 VPC 네이티브 IP로 통신한다. eth2(Secondary ENI)는 여유 용량으로 대기 중이다.</text>
