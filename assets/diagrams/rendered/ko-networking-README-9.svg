<text x="40" y="68" fill="#232F3E" font-size="17" font-weight="700" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Worker Node의 ENI-Pod IP 매핑</text>
<rect x="80" y="92" width="800" height="420" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
