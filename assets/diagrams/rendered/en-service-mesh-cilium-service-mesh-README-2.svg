<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="memcompare-title memcompare-desc">
    <title id="memcompare-title">Memory usage for a 100-pod cluster</title>
    <desc id="memcompare-desc">Bar chart comparing total mesh memory overhead across a 100-pod cluster: Cilium Service Mesh at roughly 500MB total using one shared proxy per node, versus Istio at roughly 5GB and Linkerd at roughly 2GB, both driven by a proxy running in every pod.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Gridlines (0..5000 in steps of 1000) -->
    <line x1="80" y1="460" x2="920" y2="460" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>
    <line x1="80" y1="388" x2="920" y2="388" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="80" y1="316" x2="920" y2="316" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="80" y1="244" x2="920" y2="244" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="80" y1="172" x2="920" y2="172" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="80" y1="100" x2="920" y2="100" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="80" y1="64" x2="80" y2="460" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>

    <!-- Y-axis labels -->
    <text x="72" y="463" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0MB</text>
    <text x="72" y="391" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">1000MB</text>
    <text x="72" y="319" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">2000MB</text>
    <text x="72" y="247" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">3000MB</text>
    <text x="72" y="175" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">4000MB</text>
    <text x="72" y="103" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">5000MB</text>

    <!-- Bars: paper mask then body -->
    <!-- Cilium SM: ~500MB total, focal -->
    <rect x="136" y="424" width="168" height="36" fill="#ffffff"/>
    <rect x="136" y="424" width="168" height="36" fill="rgba(255,153,0,0.12)" stroke="#EC7211" stroke-width="1"/>
    <text x="220" y="412" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">~500MB</text>

    <!-- Istio: ~5000MB total -->
    <rect x="416" y="100" width="168" height="360" fill="#ffffff"/>
    <rect x="416" y="100" width="168" height="360" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
    <text x="500" y="88" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">~5000MB</text>

    <!-- Linkerd: ~2000MB total -->
    <rect x="696" y="316" width="168" height="144" fill="#ffffff"/>
    <rect x="696" y="316" width="168" height="144" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
    <text x="780" y="304" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">~2000MB</text>

    <!-- X-axis category labels -->
    <text x="220" y="484" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cilium SM</text>
    <text x="220" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~100MB / node</text>

    <text x="500" y="484" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio</text>
    <text x="500" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~50MB / pod</text>

    <text x="780" y="484" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Linkerd</text>
    <text x="780" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~20MB / pod</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="556" width="14" height="10" rx="2" fill="rgba(255,153,0,0.12)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal · shared node proxy</text>

    <rect x="280" y="556" width="14" height="10" rx="2" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
    <text x="300" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Per-pod sidecar proxy</text>
  </svg>