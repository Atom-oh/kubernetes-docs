<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d6-title d6-desc">
<title id="d6-title">멀티 AZ 게이트웨이 고가용성 구조</title>
<desc id="d6-desc">가용 영역 A의 리더 게이트웨이가 Lease를 갱신하며 VPC 라우트 테이블과 온프레미스 하이브리드 노드로 향하는 활성 VXLAN 터널을 유지하고, 가용 영역 B의 스탠바이 게이트웨이는 Lease를 감시하며 대기 상태의 터널만 유지하는 장애 대비 구조를 보여준다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="d6-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="d6-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="d6-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  <marker id="d6-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: AZ A -->
<rect x="40" y="60" width="320" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="56" y="64" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="106" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">가용 영역 A</text>

<!-- Zone: AZ B -->
<rect x="600" y="60" width="320" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="616" y="64" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="666" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">가용 영역 B</text>

<!-- Zone: OnPrem -->
<rect x="320" y="440" width="320" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="336" y="444" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="384" y="453" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">온프레미스</text>

<!-- Arrows -->
<!-- E1: Gateway A <-> Lease -->
<line x1="320" y1="132" x2="400" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#d6-arrow)" marker-start="url(#d6-arrow-start)"/>
<!-- E2: Gateway B -.-> Lease (watch) -->
<line x1="640" y1="132" x2="560" y2="132" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d6-arrow)"/>
<!-- E3: Gateway A -> Route Table -->
<line x1="160" y1="168" x2="160" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#d6-arrow)"/>
<!-- E4: Gateway A <-> Hybrid Nodes (active tunnel) -->
<path d="M240,168 V246 Q240,254 248,254 H432 Q440,254 440,262 V472" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#d6-arrow-accent)" marker-start="url(#d6-arrow-accent-start)"/>
<!-- E5: Gateway B -.-> Hybrid Nodes (standby tunnel) -->
<path d="M720,168 V246 Q720,254 712,254 H528 Q520,254 520,262 V472" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d6-arrow)"/>

<!-- Labels -->
<rect x="330" y="112" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="360" y="121" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">LEASE 갱신</text>

<rect x="570" y="112" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="600" y="121" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">LEASE 감시</text>

<rect x="168" y="210" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="200" y="219" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">라우트 관리</text>

<rect x="362" y="380" width="70" height="12" rx="2" fill="#ffffff"/>
<text x="397" y="389" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">VXLAN · 활성</text>

<rect x="528" y="380" width="70" height="12" rx="2" fill="#ffffff"/>
<text x="563" y="389" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">VXLAN · 대기</text>

<!-- Node: Gateway A (leader, focal) -->
<rect x="80" y="96" width="240" height="72" rx="8" fill="#ffffff"/>
<rect x="80" y="96" width="240" height="72" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="200" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">게이트웨이 EC2 A (리더)</text>
<text x="200" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EC2 + Gateway Pod</text>
<text x="200" y="158" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.1.100</text>

<!-- Node: Gateway B (standby) -->
<rect x="640" y="96" width="240" height="72" rx="8" fill="#ffffff"/>
<rect x="640" y="96" width="240" height="72" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="760" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">게이트웨이 EC2 B (스탠바이)</text>
<text x="760" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EC2 + Gateway Pod</text>
<text x="760" y="158" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.2.200</text>

<!-- Node: Kubernetes Lease -->
<rect x="400" y="104" width="160" height="56" rx="8" fill="#ffffff"/>
<rect x="400" y="104" width="160" height="56" rx="8" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="480" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Kubernetes Lease</text>
<text x="480" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eks-hybrid-nodes-gateway</text>

<!-- Node: VPC Route Table -->
<rect x="40" y="280" width="240" height="64" rx="8" fill="#ffffff"/>
<rect x="40" y="280" width="240" height="64" rx="8" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="160" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">VPC 라우트 테이블</text>
<text x="160" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.85.0.0/16 → eni-A</text>

<!-- Node: Hybrid Nodes -->
<rect x="360" y="472" width="240" height="64" rx="8" fill="#ffffff"/>
<rect x="360" y="472" width="240" height="64" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="480" y="500" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Hybrid Nodes</text>
<text x="480" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">온프레미스 데이터센터</text>

<!-- Legend -->
<line x1="40" y1="558" x2="920" y2="558" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<circle cx="52" cy="574" r="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="68" y="577" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">리더 · 활성 경로</text>
<line x1="260" y1="574" x2="284" y2="574" stroke="rgba(35,47,62,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="292" y="577" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">스탠바이 · 대기 경로</text>
</svg>