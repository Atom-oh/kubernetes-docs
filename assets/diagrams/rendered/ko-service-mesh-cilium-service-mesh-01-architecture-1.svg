<title id="ko-service-mesh-cilium-service-mesh-01-architecture-1-title">전통적 네트워킹과 eBPF 네트워킹 비교</title>
<desc id="ko-service-mesh-cilium-service-mesh-01-architecture-1-desc">전통적인 네트워킹은 애플리케이션이 커널 네트워크 스택을 거쳐 NIC로 나가지만, eBPF 네트워킹은 커널 진입 전 단계에서 eBPF 프로그램이 패킷을 처리해 필요 시 네트워크 스택을 우회한다.</desc>
