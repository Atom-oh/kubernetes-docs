<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="trnop-title trnop-desc">
    <title id="trnop-title">Trainer 컨트롤러의 TrainJob 조정 흐름</title>
    <desc id="trnop-desc">TrainJob과 ClusterTrainingRuntime을 감시하는 Trainer 컨트롤러가 JobSet을 생성해 워커 Pod를 띄우고, 워커 Pod는 헤드리스 Service로 서로를 찾은 뒤 진행 상황과 메트릭을 컨트롤러로 되돌려 TrainJob.status에 반영되는 과정을 보여준다.</desc>

    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===================== ARROWS (behind nodes) ===================== -->

    <!-- TJ -> RT : 참조 -->
    <line x1="280" y1="80" x2="680" y2="80" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="450" y="60" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="69" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">참조</text>

    <!-- TJ -> C : 감시 -->
    <path d="M160,112 H360 Q368,112 368,120 V192" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="292" y="92" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="101" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">감시</text>

    <!-- RT -> C : 감시 -->
    <path d="M800,112 H440 Q432,112 432,120 V192" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="532" y="92" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="560" y="101" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">감시</text>

    <!-- C -> ST : 상태 반영 -->
    <line x1="500" y1="212" x2="620" y2="212" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="530" y="192" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="560" y="201" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">상태 반영</text>

    <!-- C -> JS : 생성 (accent, primary flow) -->
    <line x1="400" y1="264" x2="400" y2="336" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="408" y="294" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="430" y="303" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">생성</text>

    <!-- JS -> WP (unlabeled: JobSet creates worker pods) -->
    <path d="M400,400 H308 Q300,400 300,408 V472" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- WP <-> SVC : 피어 탐색 (bidirectional) -->
    <line x1="460" y1="508" x2="540" y2="508" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <rect x="470" y="488" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="500" y="497" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">피어 탐색</text>

    <!-- WP -> C : 진행/메트릭 전달 (feedback loop, routed clear of JS) -->
    <path d="M380,472 V444 Q380,436 388,436 H552 Q560,436 560,428 V256 Q560,248 552,248 H500"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="458" y="416" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="490" y="425" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">진행·메트릭</text>

    <!-- ===================== NODES ===================== -->

    <!-- TJ: TrainJob (input) -->
    <rect x="40" y="48" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="48" width="240" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="48" y="56" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
    <text x="62" y="65" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
    <text x="160" y="86" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">TrainJob</text>
    <text x="160" y="102" fill="#545B64" font-size="9" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">스크립트 · 인자 · 워커 수</text>

    <!-- RT: ClusterTrainingRuntime (input) -->
    <rect x="680" y="48" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="680" y="48" width="240" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="688" y="56" width="32" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
    <text x="704" y="65" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
    <text x="800" y="86" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">ClusterTrainingRuntime</text>
    <text x="800" y="102" fill="#545B64" font-size="9" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">이미지 · 실행 메커니즘</text>

    <!-- C: Trainer 컨트롤러 (focal) -->
    <rect x="300" y="192" width="200" height="72" rx="6" fill="#ffffff"/>
    <rect x="300" y="192" width="200" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="308" y="200" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.55)" stroke-width="0.8"/>
    <text x="322" y="209" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTL</text>
    <text x="400" y="234" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Trainer 컨트롤러</text>
    <text x="400" y="250" fill="#545B64" font-size="9" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">조정 루프의 중심</text>

    <!-- ST: TrainJob.status (store) -->
    <rect x="620" y="180" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="620" y="180" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="628" y="188" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="644" y="197" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STA</text>
    <text x="720" y="218" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">TrainJob.status</text>
    <text x="720" y="234" fill="#545B64" font-size="9" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">진행 · 메트릭 · 완료 여부</text>

    <!-- JS: JobSet / PodGroup (backend/step) -->
    <rect x="300" y="336" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="300" y="336" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="308" y="344" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="322" y="353" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SET</text>
    <text x="400" y="374" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">JobSet / PodGroup</text>
    <text x="400" y="390" fill="#545B64" font-size="9" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">갱 스케줄된 워커 Pod</text>

    <!-- WP: 워커 Pod 0..N (backend/step, merged group) -->
    <rect x="220" y="472" width="240" height="72" rx="6" fill="#ffffff"/>
    <rect x="220" y="472" width="240" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="228" y="480" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="242" y="489" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
    <text x="340" y="514" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">워커 Pod 0..N</text>
    <text x="340" y="530" fill="#545B64" font-size="9" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">RANK=0 · RANK=1 · … · RANK=N</text>

    <!-- SVC: 헤드리스 Service (external/infra) -->
    <rect x="540" y="480" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="540" y="480" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="548" y="488" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="562" y="497" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="620" y="514" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">헤드리스 Service</text>
    <text x="620" y="528" fill="#545B64" font-size="9" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">피어 디스커버리</text>

    <!-- ===================== LEGEND ===================== -->
    <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="576" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="584" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">핵심 컨트롤러</text>

    <rect x="196" y="576" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="216" y="584" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">입력 리소스</text>

    <rect x="352" y="576" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="372" y="584" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">실행 리소스</text>

    <rect x="508" y="576" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="528" y="584" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">상태 저장</text>

    <rect x="664" y="576" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="684" y="584" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">인프라 서비스</text>
  </svg>