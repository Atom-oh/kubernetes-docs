<title id="en-core-11-extending-kubernetes-4-title">How the Container Storage Interface works</title>
<desc id="en-core-11-extending-kubernetes-4-desc">Architecture diagram showing a PersistentVolumeClaim referencing a StorageClass and external provisioner that requests a volume from the CSI driver, while the CSI driver's controller and node services manage and mount storage from the underlying storage system, and pods mount the resulting volume.</desc>
