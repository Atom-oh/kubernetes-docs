<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-service-mesh-istio-resilience-readme-1-title en-service-mesh-istio-resilience-readme-1-desc"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <title id="en-service-mesh-istio-resilience-readme-1-title">Circuit Breaker Sequence</title>
    <desc id="en-service-mesh-istio-resilience-readme-1-desc">A sequence diagram showing Envoy proxy forwarding normal client requests to a service, then rejecting a request past the connection limit with a 503 circuit-breaker-open response instead of forwarding it.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="160" y1="96" x2="160" y2="552" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="96" x2="480" y2="552" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="800" y1="96" x2="800" y2="552" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="476" y="132" width="8" height="404" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- Messages -->
    <!-- 1. Client -> Envoy: normal requests -->
    <line x1="160" y1="152" x2="472" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="216" y="128" width="200" height="12" rx="2" fill="#ffffff"/>
    <text x="316" y="137" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">1. REQUESTS 1-100 (NORMAL)</text>

    <!-- 2. Envoy -> Service: forward -->
    <line x1="488" y1="196" x2="792" y2="196" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="608" y="172" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="181" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">2. FORWARD</text>

    <!-- 3. Service -> Envoy: response (dashed return) -->
    <line x1="800" y1="240" x2="492" y2="240" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="608" y="216" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="644" y="225" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">3. RESPONSE</text>

    <!-- 4. Envoy -> Client: response (dashed return, headline success) -->
    <line x1="476" y1="284" x2="164" y2="284" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <rect x="228" y="260" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="264" y="269" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">4. RESPONSE</text>

    <!-- 5. Client -> Envoy: request 101 exceeded -->
    <line x1="160" y1="336" x2="472" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="192" y="312" width="248" height="12" rx="2" fill="#ffffff"/>
    <text x="316" y="321" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">5. REQUEST 101 (LIMIT EXCEEDED)</text>

    <!-- 6. Envoy -> Client: 503 circuit breaker open (dashed, muted - failure) -->
    <line x1="476" y1="380" x2="164" y2="380" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="204" y="356" width="224" height="12" rx="2" fill="#ffffff"/>
    <text x="316" y="365" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">6. 503 CIRCUIT BREAKER OPEN</text>

    <!-- Note over Envoy,Service -->
    <rect x="480" y="424" width="320" height="44" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="640" y="442" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" font-style="italic">Connection limit reached</text>
    <text x="640" y="456" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" font-style="italic">New connections blocked</text>

    <!-- Actor boxes (drawn after arrows/notes, before top of lifelines visually — but order after masks is fine since actors sit above all messages) -->
    <rect x="80" y="64" width="160" height="40" rx="6" fill="#ffffff"/>
    <rect x="80" y="64" width="160" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="160" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>

    <rect x="400" y="64" width="160" height="40" rx="6" fill="#ffffff"/>
    <rect x="400" y="64" width="160" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>

    <rect x="720" y="64" width="160" height="40" rx="6" fill="#ffffff"/>
    <rect x="720" y="64" width="160" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="800" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service</text>

    <!-- Legend -->
    <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="532" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="140" y1="529" x2="172" y2="529" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="180" y="532" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Call</text>

    <line x1="320" y1="529" x2="352" y2="529" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <text x="360" y="532" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Headline success return</text>

    <line x1="600" y1="529" x2="632" y2="529" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="640" y="532" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return / rejection</text>
  </svg>