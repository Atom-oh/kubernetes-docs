<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="lineage-title lineage-desc">
    <title id="lineage-title">Mimir, Cortex, Thanos 계보와 접근 방식</title>
    <desc id="lineage-desc">Cortex에서 파생된 Mimir와 독립적으로 발전한 Thanos가 각각 중앙 집중식 원격 쓰기 방식과 사이드카 기반 연합 쿼리 방식을 사용함을 보여주는 다이어그램.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: 발전 과정 -->
    <rect x="40" y="56" width="880" height="136" rx="8"
          fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="452" y="60" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="490" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.14em">발전 과정</text>

    <!-- Zone: 접근 방식 -->
    <rect x="40" y="340" width="880" height="136" rx="8"
          fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="444" y="344" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="353" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.14em">접근 방식</text>

    <!-- Arrows first -->
    <!-- Cortex -> Mimir (solid, same y) -->
    <line x1="224" y1="128" x2="344" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Cortex --> CA (dashed elbow, attach x=172) -->
    <path d="M 144,160 V 364 Q 144,372 152,372 H 164"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- Mimir --> CA (dashed elbow, attach x=236) -->
    <path d="M 424,160 V 356 Q 424,364 416,364 H 244"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- Thanos --> TA (dashed, straight vertical, same x) -->
    <line x1="816" y1="160" x2="816" y2="380" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Arrow label: 후속 프로젝트 -->
    <rect x="248" y="112" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="284" y="121" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">SUCCESSOR</text>

    <!-- Node: Cortex 2016 -->
    <rect x="64" y="96" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="96" width="160" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="144" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cortex</text>
    <text x="144" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2016</text>

    <!-- Node: Mimir 2022 (focal) -->
    <rect x="344" y="96" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="344" y="96" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="424" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Mimir</text>
    <text x="424" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2022</text>

    <!-- Node: Thanos 2017 -->
    <rect x="736" y="96" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="736" y="96" width="160" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="816" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Thanos</text>
    <text x="816" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2017</text>

    <!-- Node: CA 중앙 집중식 원격 쓰기 -->
    <rect x="104" y="380" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="104" y="380" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="204" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">중앙 집중식</text>
    <text x="204" y="424" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">remote_write</text>

    <!-- Node: TA 사이드카 기반 연합 쿼리 -->
    <rect x="616" y="380" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="616" y="380" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="716" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">사이드카 기반</text>
    <text x="716" y="424" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">federated query</text>

    <!-- Legend -->
    <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="552" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="560" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Mimir(초점)</text>

    <line x1="200" y1="557" x2="228" y2="557" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="236" y="560" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">계보(후속)</text>

    <line x1="380" y1="557" x2="408" y2="557" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="416" y="560" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">사용하는 접근 방식</text>
  </svg>