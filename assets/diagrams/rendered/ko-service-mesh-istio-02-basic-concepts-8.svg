<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Istio 트래픽 라우팅 흐름</title>
<desc id="ddesc">클라이언트 요청이 Gateway, VirtualService, DestinationRule을 거쳐 Kubernetes Service의 특정 파드 버전으로 라우팅되는 5단계 흐름</desc>
