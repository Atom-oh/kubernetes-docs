    <text x="138" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">다양한 프로토콜 지원</text>

    <rect x="276" y="264" width="180" height="72" rx="6" fill="#ffffff"/>
