<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gwapi-benefits-title gwapi-benefits-desc">
    <title id="gwapi-benefits-title">Gateway API의 네 가지 핵심 특징</title>
    <desc id="gwapi-benefits-desc">표현력, 역할 기반 권한 분리, 이식성, 확장성이 서로 이어지며 Gateway API가 기존 Ingress API의 한계를 보완하는 방식을 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <line x1="228" y1="300" x2="276" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="456" y1="300" x2="504" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="684" y1="300" x2="732" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="48" y="264" width="180" height="72" rx="6" fill="#ffffff"/>
