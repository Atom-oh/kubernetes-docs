    <title id="ko-ops-14-tekton-pipelines-1-title">Tekton 컨트롤 플레인과 데이터 플레인</title>
    <desc id="ko-ops-14-tekton-pipelines-1-desc">kube-apiserver를 중심으로 Tekton 컨트롤러가 CRD 변경을 감시해 TaskRun Pod를 생성하고, Webhook과 Resolver가 API 서버를 거쳐 리소스를 검증·해석하며, 생성된 Pod들이 같은 Workspace PVC를 공유하는 구조를 보여주는 아키텍처 다이어그램.</desc>
