<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t6 d6">
<title id="t6">AS-per-Rack 멀티 데이터센터 BGP 설계</title>
<desc id="d6">두 데이터센터가 각각 랙마다 별도의 AS를 두고 Spine이 각 랙과 eBGP로 연결되며, 두 데이터센터의 Spine이 공통 WAN 라우터(AS 64000)를 통해 서로 연결되는 멀티 데이터센터 BGP 구조를 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<text x="32" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MULTI-DC DESIGN</text>
<text x="32" y="60" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">AS-per-Rack 멀티 데이터센터 설계</text>

<!-- Zone DC1 -->
<rect x="64" y="112" width="400" height="232" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
<rect x="88" y="122" width="120" height="16" rx="2" fill="#ffffff"/>
<text x="148" y="134" fill="#545B64" font-size="8" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="0.04em">데이터센터 1</text>

<!-- Zone DC2 -->
<rect x="536" y="112" width="280" height="232" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
<rect x="560" y="122" width="120" height="16" rx="2" fill="#ffffff"/>
<text x="620" y="134" fill="#545B64" font-size="8" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="0.04em">데이터센터 2</text>

<!-- Zone WAN -->
<rect x="400" y="392" width="160" height="112" rx="8" fill="rgba(255,153,0,0.06)" stroke="rgba(236,114,17,0.45)" stroke-width="0.8"/>
<rect x="424" y="402" width="112" height="16" rx="2" fill="#ffffff"/>
<text x="480" y="414" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAN / INTERNET</text>

<!-- DC1 spine mesh -->
<line x1="200" y1="184" x2="260" y2="184" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

<!-- DC1 S1 -> Rack1 -->
<path d="M125,208 V220 Q125,228 133,228 H162 Q170,228 170,236 V280"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<!-- DC1 S1 -> Rack2 (bridges over the Rack1 connector) -->
<path d="M150,208 V232 Q150,240 158,240 H162 a8,8 0 0,1 16,0 H342 Q350,240 350,248 V280"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<!-- DC1 S1 -> WAN (bridges over the Rack2 connector) -->
<path d="M175,208 V244 Q175,252 183,252 H342 a8,8 0 0,1 16,0 H452 Q460,252 460,260 V440"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<rect x="220" y="266" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="246" y="275" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">eBGP</text>

<!-- DC2 spine mesh -->
<line x1="656" y1="184" x2="696" y2="184" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

<!-- DC2 S1 -> Rack1 -->
<path d="M589,208 V220 Q589,228 597,228 H668 Q676,228 676,236 V280"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<!-- DC2 S1 -> WAN -->
<path d="M623,208 V236 Q623,244 615,244 H508 Q500,244 500,252 V440"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<rect x="640" y="266" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="666" y="275" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">eBGP</text>

<!-- DC1 Spine nodes -->
<rect x="100" y="160" width="100" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="150" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Spine 1</text>
<text x="150" y="198" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AS 64500</text>

<rect x="260" y="160" width="100" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="310" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Spine 2</text>
<text x="310" y="198" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AS 64500</text>

<!-- DC1 Rack nodes -->
<rect x="100" y="280" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="170" y="301" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rack 1 노드</text>
<text x="170" y="317" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AS 64510</text>

<rect x="280" y="280" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="350" y="301" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rack 2 노드</text>
<text x="350" y="317" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AS 64511</text>

<!-- DC2 Spine nodes -->
<rect x="556" y="160" width="100" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="606" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Spine 1</text>
<text x="606" y="198" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AS 64600</text>

<rect x="696" y="160" width="100" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="746" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Spine 2</text>
<text x="746" y="198" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AS 64600</text>

<!-- DC2 Rack nodes -->
<rect x="606" y="280" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="676" y="301" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rack 1 노드</text>
<text x="676" y="317" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AS 64610</text>

<!-- WAN Router: focal (bridges both datacenters) -->
<rect x="420" y="440" width="120" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="480" y="462" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">WAN Router</text>
<text x="480" y="478" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AS 64000</text>

<!-- Legend -->
<line x1="32" y1="530" x2="928" y2="530" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="32" y="548" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<text x="140" y="548" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">랙마다 별도 AS 부여 · Spine이 각 랙 및 WAN과 eBGP로 연결</text>
</svg>