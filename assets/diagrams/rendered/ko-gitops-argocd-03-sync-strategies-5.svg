<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="retry-backoff-title retry-backoff-desc">
      <title id="retry-backoff-title">ArgoCD의 지수 백오프 재시도 흐름</title>
      <desc id="retry-backoff-desc">ArgoCD가 동기화에 4번 실패할 때마다 5초, 10초, 20초, 40초로 대기 시간을 두 배씩 늘려가며 재시도하다가 다섯 번째 시도에서 성공하고, limit=5에 도달하면 재시도를 중단하는 지수 백오프 동작을 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Lifelines: ArgoCD=280, K8s=680 -->
      <line x1="280" y1="128" x2="280" y2="656" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="680" y1="128" x2="680" y2="656" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Attempt 1: call + fail -->
      <line x1="280" y1="164" x2="680" y2="164" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="424" y="148" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="158" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">동기화 시도 1</text>
      <line x1="680" y1="192" x2="280" y2="192" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="440" y="176" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="186" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">실패</text>

      <!-- Note: wait 5s -->
      <rect x="404" y="208" width="152" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
      <text x="480" y="224" fill="#545B64" font-size="9" font-family="'Amazon Ember', sans-serif" text-anchor="middle">5초 대기</text>

      <!-- Attempt 2 -->
      <line x1="280" y1="260" x2="680" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="424" y="244" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="254" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">동기화 시도 2</text>
      <line x1="680" y1="288" x2="280" y2="288" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="440" y="272" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="282" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">실패</text>

      <!-- Note: wait 10s -->
      <rect x="368" y="304" width="224" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
      <text x="480" y="320" fill="#545B64" font-size="9" font-family="'Amazon Ember', sans-serif" text-anchor="middle">10초 대기 (5s × 2)</text>

      <!-- Attempt 3 -->
      <line x1="280" y1="356" x2="680" y2="356" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="424" y="340" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="350" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">동기화 시도 3</text>
      <line x1="680" y1="384" x2="280" y2="384" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="440" y="368" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="378" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">실패</text>

      <!-- Note: wait 20s -->
      <rect x="368" y="400" width="224" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
      <text x="480" y="416" fill="#545B64" font-size="9" font-family="'Amazon Ember', sans-serif" text-anchor="middle">20초 대기 (10s × 2)</text>

      <!-- Attempt 4 -->
      <line x1="280" y1="452" x2="680" y2="452" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="424" y="436" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="446" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">동기화 시도 4</text>
      <line x1="680" y1="480" x2="280" y2="480" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="440" y="464" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="474" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">실패</text>

      <!-- Note: wait 40s -->
      <rect x="368" y="496" width="224" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
      <text x="480" y="512" fill="#545B64" font-size="9" font-family="'Amazon Ember', sans-serif" text-anchor="middle">40초 대기 (20s × 2)</text>

      <!-- Attempt 5: headline success (accent) -->
      <line x1="280" y1="548" x2="680" y2="548" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="424" y="532" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="542" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">동기화 시도 5</text>
      <line x1="680" y1="576" x2="280" y2="576" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="440" y="560" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="570" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">성공</text>

      <!-- Note: limit reached -->
      <rect x="332" y="592" width="296" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
      <text x="480" y="608" fill="#545B64" font-size="9" font-family="'Amazon Ember', sans-serif" text-anchor="middle">limit=5 도달 시 재시도 중단</text>

      <!-- Actor boxes -->
      <rect x="208" y="72" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="280" y="102" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">ArgoCD</text>
      <text x="280" y="118" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">controller</text>

      <rect x="608" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="680" y="102" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Kubernetes</text>
      <text x="680" y="118" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">API server</text>

      <!-- Legend -->
      <line x1="208" y1="636" x2="752" y2="636" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="208" y="652" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="208" y1="668" x2="236" y2="668" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="244" y="672" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">실패 응답</text>

      <line x1="360" y1="668" x2="388" y2="668" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="396" y="672" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">성공 응답</text>
    </svg>