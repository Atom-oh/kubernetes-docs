    <rect x="440" y="12" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="468" y="21" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HARBOR</text>

