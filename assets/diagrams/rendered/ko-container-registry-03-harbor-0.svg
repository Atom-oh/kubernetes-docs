    <title id="ko-container-registry-03-harbor-0-title">Harbor 아키텍처 구성도</title>
    <desc id="ko-container-registry-03-harbor-0-desc">Portal과 Core를 중심으로 Registry, Job Service가 연결되고, Core가 PostgreSQL·Redis 데이터 계층과 연결되며 Job Service가 Trivy·Notary 보안 계층과 연결되는 Harbor 내부 구조를 보여준다.</desc>
