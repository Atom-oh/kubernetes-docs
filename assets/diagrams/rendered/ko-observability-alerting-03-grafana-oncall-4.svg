<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oncall-routes-title oncall-routes-desc">
    <title id="oncall-routes-title">알림 라우트 설정</title>
    <desc id="oncall-routes-desc">수신된 알림이 Integration 유형과 레이블·폴더·네임스페이스 조건에 따라 Critical, Infra, Default, Low Priority, DBA 다섯 개의 에스컬레이션 체인 중 하나로 라우팅되는 규칙을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows (behind nodes) -->
    <path d="M430,68 H313 Q305,68 305,76 V152 Q305,160 297,160 H180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M480,100 H428 Q420,100 420,108 V152 Q420,160 412,160 H360" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M530,68 H617 Q625,68 625,76 V152 Q625,160 633,160 H720" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M130,192 H118 Q110,192 110,200 V332 Q110,340 102,340 H90" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M180,224 H206 Q214,224 214,232 V332 Q214,340 222,340 H248" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M230,192 V232 Q230,240 238,240 H318 a8,8 0 0,1 16,0 H422 a8,8 0 0,1 16,0 H600 Q608,240 608,248 V340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M360,224 H334 Q326,224 326,232 V332 Q326,340 318,340 H292" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M410,192 H422 Q430,192 430,200 V332 Q430,340 438,340 H450" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M720,224 H694 Q686,224 686,232 V332 Q686,340 678,340 H652" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M770,192 H782 Q790,192 790,200 V332 Q790,340 798,340 H810" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Edge labels -->
    <rect x="264" y="98" width="84" height="12" rx="2" fill="#ffffff"/>
    <text x="306" y="108" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">Alertmanager</text>
    <rect x="392" y="126" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="420" y="136" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">Grafana</text>
    <rect x="590" y="98" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="625" y="108" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">CloudWatch</text>

    <rect x="60" y="260" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="100" y="270" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">default</text>
    <rect x="180" y="260" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="226" y="270" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">severity=critical</text>
    <rect x="484" y="220" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="524" y="230" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">team=infra</text>

    <rect x="292" y="260" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="328" y="270" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">Production</text>
    <rect x="386" y="260" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="416" y="270" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">Staging</text>

    <rect x="628" y="260" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="658" y="270" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">AWS/EKS</text>
    <rect x="758" y="260" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="788" y="270" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">AWS/RDS</text>

    <!-- Node B: Integration Type? -->
    <polygon points="480,36 530,68 480,100 430,68" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="63" fill="#232F3E" font-size="9" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Integration</text>
    <text x="480" y="75" fill="#232F3E" font-size="9" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Type?</text>
    <rect x="418" y="14" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="448" y="24" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">알림 수신</text>

    <!-- Node C: Labels? -->
    <polygon points="180,160 230,192 180,224 130,192" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="196" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Labels?</text>

    <!-- Node D: Folder? -->
    <polygon points="360,160 410,192 360,224 310,192" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="360" y="196" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Folder?</text>

    <!-- Node E: Namespace? -->
    <polygon points="720,160 770,192 720,224 670,192" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="196" fill="#232F3E" font-size="9" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Namespace?</text>

    <!-- Node H: Default Chain -->
    <rect x="20" y="340" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="90" y="372" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Default Chain</text>

    <!-- Node F: Critical Chain (focal) -->
    <rect x="200" y="340" width="140" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="270" y="372" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Critical Chain</text>

    <!-- Node I: Low Priority Chain -->
    <rect x="380" y="340" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="450" y="365" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Low Priority</text>
    <text x="450" y="379" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Chain</text>

    <!-- Node G: Infra Chain -->
    <rect x="560" y="340" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="630" y="372" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Infra Chain</text>

    <!-- Node J: DBA Chain -->
    <rect x="740" y="340" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="810" y="372" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">DBA Chain</text>

  </svg>