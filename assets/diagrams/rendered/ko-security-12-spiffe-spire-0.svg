<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spire-arch-title spire-arch-desc">
    <title id="spire-arch-title">SPIRE 컴포넌트 아키텍처</title>
    <desc id="spire-arch-desc">SPIRE Server가 데이터스토어와 CA를 관리하며 각 노드의 SPIRE Agent로부터 노드 어테스테이션과 SVID 요청을 받고, Agent는 자신이 실행 중인 노드의 워크로드들에 Workload API로 SVID를 전달하며, Controller Manager가 등록 엔트리를 관리하는 구조를 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="32" y="48" width="360" height="164" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="176" y="52" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="220" y="61" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE</text>

    <rect x="452" y="48" width="220" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="512" y="52" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="562" y="61" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NODE 1</text>

    <rect x="712" y="48" width="220" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="772" y="52" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="822" y="61" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NODE 2</text>

    <!-- Arrows: Server -> Datastore, Server -> CA (exit Server's bottom edge, fanned) -->
    <path d="M 204,136 Q 204,144 196,144 H 112 Q 104,144 104,152" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 236,136 Q 236,144 244,144 H 328 Q 336,144 336,152" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Agent1 <- workloads (Workload API, straight verticals into Agent1's bottom edge) -->
    <path d="M 516,184 V 144" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 592,184 V 144" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Agent2 <- workloads -->
    <path d="M 776,184 V 144" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 852,184 V 144" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Agent1 -> Server: attestation + SVID request (direct, same y as fanned attach point) -->
    <path d="M 512,124 H 264"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="328" y="104" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="388" y="113" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">어테스테이션·SVID</text>

    <!-- Agent2 -> Server: elbow routed above Agent1's box, fanned to a separate attach point -->
    <path d="M 772,126 H 708 Q 700,126 700,118 V 108 Q 700,100 692,100 H 264"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="418" y="80" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="478" y="89" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">어테스테이션·SVID</text>

    <!-- Controller Manager -> Server (straight vertical, clears DS/CA boxes on either side) -->
    <path d="M 220,368 V 136" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="116" y="332" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="160" y="341" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">등록 엔트리</text>

    <!-- Node: SPIRE Server (focal) -->
    <rect x="176" y="80" width="88" height="56" rx="6" fill="#ffffff"/>
    <rect x="176" y="80" width="88" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="220" y="105" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">SPIRE</text>
    <text x="220" y="119" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Server</text>

    <!-- Node: Datastore -->
    <rect x="60" y="152" width="88" height="52" rx="6" fill="#ffffff"/>
    <rect x="60" y="152" width="88" height="52" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="104" y="174" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">데이터스토어</text>
    <text x="104" y="190" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite/PG</text>

    <!-- Node: CA -->
    <rect x="292" y="152" width="88" height="52" rx="6" fill="#ffffff"/>
    <rect x="292" y="152" width="88" height="52" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="336" y="174" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">내장 CA /</text>
    <text x="336" y="190" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Upstream CA</text>

    <!-- Node: Agent1 -->
    <rect x="512" y="108" width="120" height="36" rx="6" fill="#ffffff"/>
    <rect x="512" y="108" width="120" height="36" rx="6" fill="rgba(255,153,0,0.05)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="572" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">SPIRE Agent</text>

    <!-- Node: WL1A / WL1B -->
    <rect x="472" y="184" width="88" height="36" rx="6" fill="#ffffff"/>
    <rect x="472" y="184" width="88" height="36" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="516" y="206" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">워크로드 A</text>

    <rect x="592" y="184" width="88" height="36" rx="6" fill="#ffffff"/>
    <rect x="592" y="184" width="88" height="36" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="636" y="206" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">워크로드 B</text>

    <!-- Node: Agent2 -->
    <rect x="772" y="108" width="120" height="36" rx="6" fill="#ffffff"/>
    <rect x="772" y="108" width="120" height="36" rx="6" fill="rgba(255,153,0,0.05)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="832" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">SPIRE Agent</text>

    <!-- Node: WL2A / WL2B -->
    <rect x="732" y="184" width="88" height="36" rx="6" fill="#ffffff"/>
    <rect x="732" y="184" width="88" height="36" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="776" y="206" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">워크로드 C</text>

    <rect x="852" y="184" width="88" height="36" rx="6" fill="#ffffff"/>
    <rect x="852" y="184" width="88" height="36" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="896" y="206" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">워크로드 D</text>

    <!-- Node: Controller Manager -->
    <rect x="132" y="368" width="160" height="44" rx="6" fill="#ffffff"/>
    <rect x="132" y="368" width="160" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="212" y="393" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">SPIRE Controller</text>
    <text x="212" y="407" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Manager</text>

    <!-- Legend -->
    <line x1="32" y1="472" x2="928" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="488" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="32" y="504" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="52" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">SPIRE Server (focal)</text>

    <rect x="240" y="504" width="14" height="10" rx="2" fill="rgba(255,153,0,0.05)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="260" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">SPIRE Agent</text>

    <rect x="420" y="504" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="440" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">워크로드</text>

    <line x1="560" y1="510" x2="588" y2="510" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="596" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">노드 어테스테이션</text>

    <line x1="760" y1="510" x2="788" y2="510" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="796" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">동일 유형 흐름</text>
  </svg>
