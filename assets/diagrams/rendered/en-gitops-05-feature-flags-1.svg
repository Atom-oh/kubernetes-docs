<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sdkarch-title sdkarch-desc">
<title id="sdkarch-title">OpenFeature SDK provider architecture</title>
<desc id="sdkarch-desc">Architecture diagram showing application code calling the OpenFeature SDK, which routes flag evaluation through a swappable provider to one of four flag backends: flagd, LaunchDarkly, Flagsmith, or environment variables.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: providers -->
<rect x="24" y="352" width="912" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="40" y="356" width="220" height="12" rx="2" fill="#ffffff"/>
<text x="150" y="365" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROVIDERS + BACKENDS</text>

<!-- Arrows -->
<line x1="332" y1="140" x2="440" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 520,172 V 300 Q 520,308 512,308 H 172 Q 164,308 164,316 V 380"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 520,172 V 300 Q 520,308 512,308 H 452 Q 444,308 444,316 V 380"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 520,172 V 300 Q 520,308 528,308 H 588 Q 596,308 596,316 V 380"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 520,172 V 300 Q 520,308 528,308 H 868 Q 876,308 876,316 V 380"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- Node: Application (Client) -->
<rect x="220" y="108" width="112" height="64" rx="6" fill="#ffffff"/>
<rect x="220" y="108" width="112" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<rect x="228" y="116" width="24" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
<text x="240" y="125" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APP</text>
<text x="276" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Application Code</text>
<text x="276" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OpenFeature client</text>

<!-- Node: SDK (focal) -->
<rect x="440" y="108" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="440" y="108" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<rect x="448" y="116" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="462" y="125" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SDK</text>
<text x="520" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">OpenFeature SDK</text>
<text x="520" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api · hooks · context</text>

<!-- Node: flagd provider+backend -->
<rect x="88" y="380" width="152" height="76" rx="6" fill="#ffffff"/>
<rect x="88" y="380" width="152" height="76" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="96" y="388" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="110" y="397" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRV</text>
<text x="164" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">flagd Provider</text>
<text x="164" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gRPC/REST</text>
<text x="164" y="446" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ flagd</text>

<!-- Node: LaunchDarkly provider+backend -->
<rect x="368" y="380" width="152" height="76" rx="6" fill="#ffffff"/>
<rect x="368" y="380" width="152" height="76" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="376" y="388" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="390" y="397" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRV</text>
<text x="444" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">LaunchDarkly</text>
<text x="444" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SaaS API</text>
<text x="444" y="446" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ LD Service</text>

<!-- Node: Flagsmith provider+backend -->
<rect x="520" y="380" width="152" height="76" rx="6" fill="#ffffff"/>
<rect x="520" y="380" width="152" height="76" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="528" y="388" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="542" y="397" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRV</text>
<text x="596" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Flagsmith</text>
<text x="596" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SaaS/self-host</text>
<text x="596" y="446" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ FS Service</text>

<!-- Node: Environment provider+backend -->
<rect x="800" y="380" width="112" height="76" rx="6" fill="#ffffff"/>
<rect x="800" y="380" width="112" height="76" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="808" y="388" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
<text x="822" y="397" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENV</text>
<text x="856" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Environment</text>
<text x="856" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">static config</text>
<text x="856" y="446" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ env vars</text>

<!-- Legend -->
<line x1="24" y1="516" x2="936" y2="516" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="24" y="532" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="24" y="548" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="44" y="557" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">SDK evaluation path (focal)</text>
<rect x="280" y="548" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="300" y="557" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Provider + backend</text>
<rect x="480" y="548" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="500" y="557" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Optional / static</text>
</svg>