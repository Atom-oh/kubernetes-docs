<title id="en-service-mesh-istio-comparison-01-service-mesh-comparison-6-title">Cross-Zone Service Connection Flow</title>
<desc id="en-service-mesh-istio-comparison-01-service-mesh-comparison-6-desc">Sequence diagram of a Kong Mesh cross-zone request: the control plane pushes policy to both zones&#x27; Kuma DP proxies, then an application&#x27;s request is routed through mTLS-encrypted cross-zone proxy hops to the target service and back, with metrics reported afterward.</desc>
