<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="injection-title injection-desc">
    <title id="injection-title">How sidecar injection is decided</title>
    <desc id="injection-desc">Flowchart showing that a new pod's namespace label determines whether the Envoy sidecar is injected or skipped before the pod is deployed.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Arrows (before nodes) -->
    <!-- Pod Creation -> Check (straight) -->
    <line x1="480" y1="96" x2="480" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Check -> Inject (YES, accent happy path) -->
    <line x1="570" y1="176" x2="620" y2="176" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Check -> Skip (NO) -->
    <line x1="390" y1="176" x2="340" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Inject -> Deploy (accent happy path, elbow) -->
    <path d="M 710,208 V 284 Q 710,292 702,292 H 508 Q 500,292 500,300 V 312" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Skip -> Deploy (elbow) -->
    <path d="M 250,208 V 284 Q 250,292 258,292 H 452 Q 460,292 460,300 V 312" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="579" y="156" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="595" y="165" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

    <rect x="349" y="156" width="26" height="12" rx="2" fill="#ffffff"/>
    <text x="362" y="165" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

    <!-- Start oval: Pod Creation -->
    <rect x="400" y="32" width="160" height="64" rx="32" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod Creation</text>

    <!-- Diamond: Namespace has label? -->
    <polygon points="480,128 570,176 480,224 390,176" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="172" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Namespace has</text>
    <text x="480" y="186" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">label?</text>

    <!-- Rectangle: Sidecar Injection (happy path, focal) -->
    <rect x="620" y="144" width="180" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="710" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sidecar Injection</text>
    <text x="710" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">envoy proxy added</text>

    <!-- Rectangle: Skip Injection -->
    <rect x="160" y="144" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="250" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Skip Injection</text>
    <text x="250" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod runs bare</text>

    <!-- End oval: Pod Deployment -->
    <rect x="380" y="308" width="200" height="64" rx="32" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="336" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod Deployment</text>
    <text x="480" y="352" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">both paths converge</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

    <rect x="40" y="556" width="24" height="12" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="72" y="566" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Start / end (oval)</text>

    <rect x="220" y="556" width="24" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="252" y="566" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Step (rectangle)</text>

    <polygon points="412,562 424,556 436,562 424,568" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="448" y="566" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Decision (diamond)</text>

    <line x1="604" y1="564" x2="632" y2="564" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="640" y="566" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Happy path (injected)</text>
  </svg>