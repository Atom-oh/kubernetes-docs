<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t0 d0">
  <title id="t0">Zone-aware traffic split across three availability zones</title>
  <desc id="d0">A client pod in Availability Zone A sends 80% of its traffic to two service pods in its own zone, and fails over 10% each to service pods in Availability Zone B and Availability Zone C.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;}</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Eyebrow + title -->
  <text x="40" y="32" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ISTIO · LOCALITY LOAD BALANCING</text>
  <text x="40" y="56" fill="#232F3E" font-size="20" font-weight="700">Zone-aware traffic split</text>

  <!-- Zones (bg -> zones -> arrows -> nodes) -->
  <rect x="32" y="88" width="360" height="344" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="44" y="92" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="114" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">AVAILABILITY ZONE A</text>

  <rect x="424" y="88" width="240" height="344" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="436" y="92" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="506" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">AVAILABILITY ZONE B</text>

  <rect x="696" y="88" width="232" height="344" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="708" y="92" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="778" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">AVAILABILITY ZONE C</text>

  <!-- Arrows (drawn before nodes) -->
  <!-- Client1 -> Service1 (solid, same-zone, bottom-entry) exit attach x=180 -->
  <path d="M 180,184 V 216 Q 180,224 172,224 H 120 V 264"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="98" y="220" width="66" height="12" rx="2" fill="#ffffff"/>
  <text x="131" y="229" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">80% SAME</text>

  <!-- Client1 -> Service2 (solid, same-zone, bottom-entry) exit attach x=228 -->
  <path d="M 228,184 V 216 Q 228,224 236,224 H 288 V 264"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="256" y="220" width="66" height="12" rx="2" fill="#ffffff"/>
  <text x="289" y="229" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">80% SAME</text>

  <!-- Client1 -> Service3 (dashed, cross-zone) exit right edge upper attach y=141 -->
  <path d="M 284,141 H 396 Q 404,141 404,149 V 176 Q 404,184 412,184 H 424"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="356" y="127" width="76" height="12" rx="2" fill="#ffffff"/>
  <text x="394" y="136" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">10% FAILOVER</text>

  <!-- Client1 -> Service5 (dashed, cross-zone, farther) exit right edge lower attach y=163 -->
  <path d="M 284,163 H 660 Q 668,163 668,171 V 236 Q 668,244 676,244 H 696"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="300" y="143" width="76" height="12" rx="2" fill="#ffffff"/>
  <text x="338" y="152" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">10% FAILOVER</text>

  <!-- Nodes -->
  <!-- Client1 (focal) -->
  <rect x="124" y="120" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="124" y="120" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="204" y="147" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Client Pod</text>
  <text x="204" y="163" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone: us-east-1a</text>

  <!-- Service1 -->
  <rect x="48" y="264" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="120" y="291" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service Pod 1</text>
  <text x="120" y="307" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone: us-east-1a</text>

  <!-- Service2 -->
  <rect x="216" y="264" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="288" y="291" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service Pod 2</text>
  <text x="288" y="307" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone: us-east-1a</text>

  <!-- Service3 -->
  <rect x="452" y="152" width="184" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="544" y="179" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service Pod 3</text>
  <text x="544" y="195" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone: us-east-1b</text>

  <!-- Service4 (unconnected, optional treatment) -->
  <rect x="452" y="280" width="184" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="544" y="307" fill="#545B64" font-size="12" font-weight="600" text-anchor="middle">Service Pod 4</text>
  <text x="544" y="323" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone: us-east-1b (idle)</text>

  <!-- Service5 -->
  <rect x="724" y="212" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="812" y="239" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service Pod 5</text>
  <text x="812" y="255" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone: us-east-1c</text>

  <!-- Legend -->
  <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <line x1="40" y1="576" x2="80" y2="576" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="88" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">SAME-ZONE ROUTE (LOW COST)</text>
  <line x1="360" y1="576" x2="400" y2="576" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="408" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">CROSS-ZONE FAILOVER (COSTED)</text>
</svg>