<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">CI/CD 이미지 스캔 게이트 파이프라인</title>
  <desc id="d">코드 커밋 후 이미지를 빌드하여 ECR에 푸시하고 Trivy로 스캔하되, 통과하면 쿠버네티스에 배포하고 HIGH/CRITICAL 취약점이 발견되면 배포를 막고 알림을 보내는 CI/CD 파이프라인.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#DD344C"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== connectors ===== -->
  <line x1="180" y1="260" x2="220" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="360" y1="260" x2="400" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="540" y1="260" x2="580" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="740" y1="260" x2="780" y2="260" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <line x1="660" y1="300" x2="660" y2="388" stroke="#DD344C" stroke-width="1.2" marker-end="url(#arrow-red)"/>

  <!-- ===== arrow labels ===== -->
  <rect x="744" y="240" width="32" height="12" rx="2" fill="#ffffff"/>
  <text x="760" y="249" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASS</text>

  <rect x="668" y="338" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="688" y="347" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAIL</text>

  <!-- ===== nodes ===== -->
  <!-- Commit (start, pill) -->
  <rect x="40" y="228" width="140" height="64" rx="32" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="110" y="264" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Code Commit</text>

  <!-- Build -->
  <rect x="220" y="228" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="290" y="264" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Build Image</text>

  <!-- Push -->
  <rect x="400" y="228" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="470" y="264" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Push to ECR</text>

  <!-- Scan (decision) -->
  <polygon points="660,220 740,260 660,300 580,260" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="660" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Scan</text>
  <text x="660" y="270" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(Trivy)</text>

  <!-- Deploy (end, focal pill) -->
  <rect x="780" y="228" width="140" height="64" rx="32" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="850" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Deploy to K8s</text>
  <text x="850" y="274" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl apply</text>

  <!-- Block (end, danger pill) -->
  <rect x="590" y="388" width="140" height="64" rx="32" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="660" y="420" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alert / Block</text>
  <text x="660" y="434" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HIGH / CRITICAL</text>

  <!-- Legend -->
  <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <polygon points="44,536 56,530 68,536 56,542" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="80" y="539" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">스캔 게이트 (다이아몬드)</text>

  <line x1="300" y1="536" x2="328" y2="536" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="336" y="539" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">통과 → 배포</text>

  <line x1="480" y1="536" x2="508" y2="536" stroke="#DD344C" stroke-width="1.2" marker-end="url(#arrow-red)"/>
  <text x="516" y="539" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">실패 → 차단/알림</text>
</svg>