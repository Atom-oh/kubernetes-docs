<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">Cilium 아키텍처: 컨트롤 플레인, 데이터 플레인, 관찰성 계층</title>
  <desc id="ddesc">Cilium Operator와 Cilium API Server로 구성된 Control Plane이 Data Plane의 Cilium Agent를 관리하고, Agent가 eBPF Programs를 로드하며, Agent가 수집한 메트릭이 Hubble Server, Hubble Relay, Hubble UI로 이어지는 Observability 파이프라인으로 전달되는 구조를 보여준다.</desc>

  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="var(--paper)"/>

  <!-- ============ ZONES (bg layer) ============ -->
  <!-- Control Plane -->
  <rect class="zone-rect" x="40" y="140" width="400" height="112" rx="8"/>
  <rect class="zone-label-mask" x="56" y="144" width="88" height="12" rx="2"/>
  <text class="zone-label mono" x="100" y="153" text-anchor="middle">CONTROL PLANE</text>

  <!-- Data Plane -->
  <rect class="zone-rect" x="40" y="320" width="400" height="112" rx="8"/>
  <rect class="zone-label-mask" x="56" y="324" width="76" height="12" rx="2"/>
  <text class="zone-label mono" x="94" y="333" text-anchor="middle">DATA PLANE</text>

  <!-- Observability -->
  <rect class="zone-rect" x="560" y="140" width="280" height="320" rx="8"/>
  <rect class="zone-label-mask" x="576" y="144" width="92" height="12" rx="2"/>
  <text class="zone-label mono" x="622" y="153" text-anchor="middle">OBSERVABILITY</text>

  <!-- ============ CONNECTORS (drawn before nodes) ============ -->

  <!-- B -> A : API (horizontal, y=200) -->
  <path class="conn" d="M212,200 H300" marker-end="url(#arrow)"/>
  <rect class="zone-label-mask" x="234" y="182" width="34" height="12" rx="2"/>
  <text class="arrow-label mono" x="256" y="191" text-anchor="middle">API</text>

  <!-- A -> C : Manages (Z elbow: down, left, down) -->
  <path class="conn" d="M370,228 V282 Q370,290 362,290 H150 Q142,290 142,298 V352" marker-end="url(#arrow)"/>
  <rect class="zone-label-mask" x="220" y="272" width="72" height="12" rx="2"/>
  <text class="arrow-label mono" x="256" y="281" text-anchor="middle">Manages</text>

  <!-- C -> D : Loads (horizontal, y=368) -->
  <path class="conn" d="M212,368 H300" marker-end="url(#arrow)"/>
  <rect class="zone-label-mask" x="234" y="350" width="46" height="12" rx="2"/>
  <text class="arrow-label mono" x="256" y="359" text-anchor="middle">Loads</text>

  <!-- C -> E : Metrics (right, up, right elbow, routed through the inter-zone gap at x=480) -->
  <path class="conn" d="M212,392 H472 Q480,392 480,384 V208 Q480,200 488,200 H600" marker-end="url(#arrow)"/>
  <rect class="zone-label-mask" x="484" y="290" width="58" height="12" rx="2"/>
  <text class="arrow-label mono" x="513" y="299">Metrics</text>

  <!-- E -> F : Aggregates (vertical, x=700) -->
  <path class="conn" d="M700,228 V280" marker-end="url(#arrow)"/>
  <rect class="zone-label-mask" x="710" y="248" width="76" height="12" rx="2"/>
  <text class="arrow-label mono" x="714" y="257">Aggregates</text>

  <!-- F -> G : Visualizes (vertical, x=700) -->
  <path class="conn" d="M700,336 V388" marker-end="url(#arrow)"/>
  <rect class="zone-label-mask" x="710" y="356" width="72" height="12" rx="2"/>
  <text class="arrow-label mono" x="714" y="365">Visualizes</text>

  <!-- ============ NODES ============ -->

  <!-- B: Cilium API Server -->
  <rect class="node-box" x="72" y="172" width="140" height="56" rx="6"/>
  <text class="eyebrow mono" x="142" y="188" text-anchor="middle">API</text>
  <text class="node-name" x="142" y="205" text-anchor="middle">Cilium API Server</text>

  <!-- A: Cilium Operator -->
  <rect class="node-box" x="300" y="172" width="140" height="56" rx="6"/>
  <text class="eyebrow mono" x="370" y="188" text-anchor="middle">CONTROLLER</text>
  <text class="node-name" x="370" y="205" text-anchor="middle">Cilium Operator</text>

  <!-- C: Cilium Agent (focal) -->
  <rect class="node-focal" x="72" y="352" width="140" height="56" rx="6"/>
  <text class="eyebrow mono" x="142" y="368" text-anchor="middle" fill="var(--accent)">PER-NODE</text>
  <text class="node-name" x="142" y="385" text-anchor="middle">Cilium Agent</text>

  <!-- D: eBPF Programs -->
  <rect class="node-box" x="300" y="352" width="140" height="56" rx="6"/>
  <text class="eyebrow mono" x="370" y="368" text-anchor="middle">KERNEL</text>
  <text class="node-name" x="370" y="385" text-anchor="middle">eBPF Programs</text>

  <!-- E: Hubble Server -->
  <rect class="node-box" x="600" y="172" width="200" height="56" rx="6"/>
  <text class="eyebrow mono" x="700" y="188" text-anchor="middle">PER-NODE</text>
  <text class="node-name" x="700" y="205" text-anchor="middle">Hubble Server</text>

  <!-- F: Hubble Relay -->
  <rect class="node-box" x="600" y="280" width="200" height="56" rx="6"/>
  <text class="eyebrow mono" x="700" y="296" text-anchor="middle">CLUSTER-WIDE</text>
  <text class="node-name" x="700" y="313" text-anchor="middle">Hubble Relay</text>

  <!-- G: Hubble UI -->
  <rect class="node-box" x="600" y="388" width="200" height="56" rx="6"/>
  <text class="eyebrow mono" x="700" y="404" text-anchor="middle">DASHBOARD</text>
  <text class="node-name" x="700" y="421" text-anchor="middle">Hubble UI</text>

</svg>