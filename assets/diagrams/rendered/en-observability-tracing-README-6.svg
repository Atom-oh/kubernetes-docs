<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="corr-title corr-desc">
    <title id="corr-title">The correlation loop in Grafana</title>
    <desc id="corr-desc">Flowchart showing a click-through loop in Grafana: a metrics dashboard spike leads to an exemplar carrying a trace ID, the exemplar opens the full trace in Tempo, the trace links out to related logs in Loki, and the logs link back to the metric that started the investigation.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- connectors: M -> E -> T -> L -> M (clockwise) -->
    <line x1="320" y1="172" x2="636" y2="172" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="750" y1="204" x2="750" y2="376" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="640" y1="412" x2="324" y2="412" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="210" y1="380" x2="210" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- labels -->
    <rect x="440" y="156" width="96" height="14" rx="2" fill="#ffffff"/>
    <text x="488" y="167" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CLICK EXEMPLAR</text>
    <rect x="756" y="278" width="76" height="14" rx="2" fill="#ffffff"/>
    <text x="794" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">VIEW TRACE</text>
    <rect x="440" y="404" width="70" height="14" rx="2" fill="#ffffff"/>
    <text x="475" y="415" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">LOG LINK</text>
    <rect x="152" y="284" width="82" height="14" rx="2" fill="#ffffff"/>
    <text x="193" y="295" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">METRIC LINK</text>

    <!-- M: Metrics Dashboard -->
    <rect x="100" y="140" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="210" y="166" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics Dashboard</text>
    <text x="210" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">response time spike</text>

    <!-- E: Exemplar (focal) -->
    <rect x="640" y="140" width="220" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="750" y="166" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Exemplar</text>
    <text x="750" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">TraceID: abc123</text>

    <!-- T: Tempo -->
    <rect x="640" y="380" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="750" y="406" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tempo</text>
    <text x="750" y="424" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">trace details</text>

    <!-- L: Loki -->
    <rect x="100" y="380" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="210" y="406" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Loki</text>
    <text x="210" y="424" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">related logs</text>

    <!-- legend -->
    <line x1="30" y1="512" x2="930" y2="512" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="30" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.16em">LEGEND</text>
    <line x1="180" y1="524" x2="204" y2="524" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="212" y="528" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Where the investigation starts</text>
  </svg>