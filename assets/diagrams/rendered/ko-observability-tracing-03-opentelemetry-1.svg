<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc">
    <title id="d1-title">세 가지 신호와 상호 연결</title>
    <desc id="d1-desc">OpenTelemetry가 Traces, Metrics, Logs 세 가지 신호를 생성하며, Traces와 Logs는 TraceID로, Metrics와 Traces는 Exemplar로 서로 연결됨을 보여주는 다이어그램.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Arrows (before boxes) -->
    <path d="M 440,224 V 254 Q 440,262 432,262 H 208 Q 200,262 200,270 V 300" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="480" y1="224" x2="480" y2="300" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 520,224 V 254 Q 520,262 528,262 H 752 Q 760,262 760,270 V 300" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Bidirectional: Metrics <-> Traces (Exemplar) -->
    <line x1="308" y1="350" x2="372" y2="350" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <!-- Bidirectional: Traces <-> Logs (TraceID 연결) -->
    <line x1="588" y1="350" x2="652" y2="350" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

    <!-- Arrow labels -->
    <rect x="316" y="330" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="340" y="339" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">EXEMPLAR</text>

    <rect x="596" y="330" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="620" y="339" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">TRACE ID</text>

    <!-- Node: OpenTelemetry (focal hub) -->
    <rect x="400" y="160" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="160" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="196" fill="#232F3E" font-size="12" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OpenTelemetry</text>

    <!-- Node: Metrics -->
    <rect x="92" y="300" width="216" height="100" rx="6" fill="#ffffff"/>
    <rect x="92" y="300" width="216" height="100" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="108" y="316" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="124" y="325" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MET</text>
    <text x="200" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics</text>
    <text x="200" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Counter · Gauge</text>
    <text x="200" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Histogram</text>

    <!-- Node: Traces -->
    <rect x="372" y="300" width="216" height="100" rx="6" fill="#ffffff"/>
    <rect x="372" y="300" width="216" height="100" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="388" y="316" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="404" y="325" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRC</text>
    <text x="480" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Traces</text>
    <text x="480" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Span · SpanContext</text>
    <text x="480" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Links</text>

    <!-- Node: Logs -->
    <rect x="652" y="300" width="216" height="100" rx="6" fill="#ffffff"/>
    <rect x="652" y="300" width="216" height="100" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="668" y="316" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="680" y="325" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOG</text>
    <text x="760" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Logs</text>
    <text x="760" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LogRecord · Severity</text>
    <text x="760" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Body</text>

    <!-- Legend -->
    <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="468" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="482" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">계측 프레임워크 (focal)</text>

    <rect x="260" y="482" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="280" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">신호 유형</text>

    <line x1="420" y1="487" x2="448" y2="487" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <text x="456" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">신호 간 상호 참조</text>
  </svg>