<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="ko-dash-arch-0-title ko-dash-arch-0-desc">
  <title id="ko-dash-arch-0-title">Istio 관찰성 스택 아키텍처</title>
  <desc id="ko-dash-arch-0-desc">데이터 플레인의 Envoy 사이드카가 메트릭·로그·트레이스를 Prometheus, Loki, Jaeger, Tempo로 보내고, 이 백엔드들이 Kiali와 Grafana, Jaeger UI 같은 시각화 도구로 이어지며, istiod가 설정 정보를 Kiali에 전달하는 흐름을 보여준다.</desc>

  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- ============ ZONES (bg -> zones -> arrows -> nodes) ============ -->
  <rect x="180" y="140" width="720" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="196" y="144" width="128" height="12" rx="2" fill="#ffffff"/>
  <text x="260" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.10em">메트릭 백엔드</text>

  <rect x="180" y="300" width="720" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="196" y="304" width="80" height="12" rx="2" fill="#ffffff"/>
  <text x="236" y="313" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.10em">시각화</text>

  <!-- ============ ARROWS ============ -->

  <!-- Envoy fan-out -> metrics backends -->
  <path d="M480,96 V104 Q480,112 472,112 H272 Q264,112 264,120 V172" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M520,96 V132 Q520,140 512,140 H456 Q448,140 448,148 V172" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M560,96 V132 Q560,140 568,140 H624 Q632,140 632,148 V172" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M600,96 V104 Q600,112 608,112 H808 Q816,112 816,120 V172" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- metrics backends -> visualization -->
  <line x1="264" y1="236" x2="264" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M300,236 V296 Q300,304 308,304 H392 Q400,304 400,312 V332" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="448" y1="236" x2="448" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="632" y1="236" x2="632" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="816" y1="236" x2="816" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

