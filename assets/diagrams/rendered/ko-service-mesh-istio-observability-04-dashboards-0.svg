  <rect x="196" y="332" width="136" height="64" rx="6" fill="#ffffff"/>
  <rect x="196" y="332" width="136" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="204" y="338" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
