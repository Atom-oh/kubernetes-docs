  <rect x="196" y="172" width="136" height="64" rx="6" fill="#ffffff"/>
  <rect x="196" y="172" width="136" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
