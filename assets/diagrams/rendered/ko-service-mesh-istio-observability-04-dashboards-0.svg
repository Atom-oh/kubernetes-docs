  <rect x="564" y="172" width="136" height="64" rx="6" fill="#ffffff"/>
  <rect x="564" y="172" width="136" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="572" y="178" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="588" y="187" fill="rgba(35,47,62,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOG</text>
  <text x="632" y="206" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Loki</text>
  <text x="632" y="222" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">로그 수집</text>

  <rect x="748" y="172" width="136" height="64" rx="6" fill="#ffffff"/>
  <rect x="748" y="172" width="136" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="756" y="178" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="778" y="187" fill="rgba(35,47,62,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRACE</text>
  <text x="816" y="206" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Jaeger</text>
  <text x="816" y="222" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">트레이스 수집</text>

