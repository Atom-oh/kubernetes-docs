  <text x="816" y="382" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">트레이싱</text>

  <!-- ============ LEGEND ============ -->
  <line x1="30" y1="452" x2="930" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
