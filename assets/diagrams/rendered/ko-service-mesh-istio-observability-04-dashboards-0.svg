  <line x1="150" y1="464" x2="182" y2="464" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="190" y="468" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">데이터 전송 (메트릭 / 로그 / 트레이스)</text>

  <line x1="480" y1="464" x2="512" y2="464" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
