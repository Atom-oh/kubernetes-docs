  <text x="540" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>
  <text x="540" y="88" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">모든 파드에 주입 (×N)</text>

