  <text x="632" y="366" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana</text>
  <text x="632" y="382" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">로그 대시보드</text>

  <rect x="748" y="332" width="136" height="64" rx="6" fill="#ffffff"/>
  <rect x="748" y="332" width="136" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="756" y="338" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="768" y="347" fill="rgba(35,47,62,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UI</text>
