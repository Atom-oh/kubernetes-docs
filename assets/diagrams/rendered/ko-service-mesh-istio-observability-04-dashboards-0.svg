  <path d="M140,96 V364 Q140,372 148,372 H196" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="112" y="196" width="52" height="12" rx="2" fill="#ffffff"/>
  <text x="138" y="205" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG</text>

