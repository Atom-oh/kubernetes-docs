<title id="en-service-mesh-istio-advanced-01-ambient-mode-8-title">Sidecar-to-ambient migration steps</title>
<desc id="en-service-mesh-istio-advanced-01-ambient-mode-8-desc">Flowchart of a five-step migration path from sidecar mode in production, through installing ambient components, labeling the namespace, removing sidecars, and deploying waypoint proxies, to a completed zero-downtime ambient mode.</desc>
