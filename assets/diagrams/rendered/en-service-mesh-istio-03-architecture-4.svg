<title id="en-service-mesh-istio-03-architecture-4-title">Sidecar Injection Process</title>
<desc id="en-service-mesh-istio-03-architecture-4-desc">Flowchart showing a Deployment's pod creation call to the Kubernetes API triggering a mutating webhook that asks Istio's sidecar injector to modify the pod spec, resulting in a pod with an istio-init container and an istio-proxy sidecar alongside the application container.</desc>
