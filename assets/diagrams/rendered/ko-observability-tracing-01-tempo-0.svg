<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tempo-pipeline-ttl tempo-pipeline-desc">
<title id="tempo-pipeline-ttl">Tempo 트레이스 파이프라인 아키텍처</title>
<desc id="tempo-pipeline-desc">애플리케이션이 생성한 트레이스가 OTEL Collector를 거쳐 Tempo 클러스터의 쓰기 경로(Distributor→Ingester)로 S3에 저장되고, Metrics Generator가 만든 RED 메트릭이 Grafana로 전달되며, Grafana의 TraceQL 조회는 Query Frontend와 Querier를 통해 S3와 캐시에서 트레이스를 검색하는 흐름을 보여준다.</desc>
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
text { font-family: 'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
.mono { font-family: 'Geist Mono', ui-monospace, monospace; }
</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
  <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
</marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
  <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
</marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
  <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
</marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- ================= ZONES ================= -->
<rect x="24" y="48" width="336" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="36" y="52" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="80" y="61" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">데이터 수신</text>

<rect x="208" y="168" width="520" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="414" y="172" width="108" height="12" rx="2" fill="#ffffff"/>
<text x="468" y="181" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">TEMPO 클러스터</text>

<rect x="756" y="168" width="124" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="768" y="172" width="68" height="12" rx="2" fill="#ffffff"/>
<text x="802" y="181" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">스토리지</text>

<text x="818" y="444" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">시각화</text>

<!-- ================= ARROWS (drawn before nodes) ================= -->

<!-- 1. APP -> OTEL -->
<path d="M160,92 H220" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="162" y="72" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="190" y="81" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">OTLP</text>

<!-- 2. OTEL -> DIST (straight vertical) -->
<path d="M280,120 V184" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="262" y="144" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="280" y="153" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">OTLP</text>

<!-- 3. DIST -> ING -->
<path d="M336,212 H372" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="338" y="192" width="32" height="12" rx="2" fill="#ffffff"/>
<text x="354" y="201" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">해시분배</text>

<!-- 4. ING -> METRICS -->
<path d="M484,212 H520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="486" y="192" width="32" height="12" rx="2" fill="#ffffff"/>
<text x="502" y="201" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="-0.02em">메트릭생성</text>

<!-- 5. ING -> S3 (elbow, dip below row, hop over METRICS->GRAFANA vertical at x=576) -->
<path d="M428,240 V242 Q428,250 436,250 H568 a8,8 0 0,1 16,0 H793 Q801,250 801,242 V240"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="580" y="258" width="44" height="12" rx="2" fill="#ffffff"/>
<text x="602" y="267" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">블록저장</text>

<!-- 6. COMPACT -> S3 (elbow, hops over METRICS vertical at x=576 and QUERY vertical at x=818) -->
<path d="M280,300 V270 Q280,262 288,262 H568 a8,8 0 0,1 16,0 H810 a8,8 0 0,1 16,0 H843 Q851,262 851,270 V240"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="288" y="266" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="324" y="275" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.01em">압축/최적화</text>

<!-- 7. QUERY -> S3 (elbow) -->
<path d="M428,300 V292 Q428,284 436,284 H810 Q818,284 818,276 V240"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="700" y="284" width="30" height="12" rx="2" fill="#ffffff"/>
<text x="715" y="293" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">검색</text>

<!-- 8. QUERY -> CACHE (elbow, dip below, hop over GRAFANA->QFRONT vertical at x=800) -->
<path d="M428,356 V398 Q428,406 436,406 H792 a8,8 0 0,1 16,0 H810 Q818,406 818,398 V356"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="600" y="402" width="30" height="12" rx="2" fill="#ffffff"/>
<text x="615" y="411" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">캐시</text>

<!-- 9. QFRONT -> QUERY -->
<path d="M520,328 H484" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="486" y="308" width="32" height="12" rx="2" fill="#ffffff"/>
<text x="502" y="317" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="-0.02em">쿼리분할</text>

<!-- 10. METRICS -> GRAFANA (link-blue, elbow, hops over ING(x=576 crossing already resolved by 5/6) and QUERY vertical at x=818) -->
<path d="M576,240 V268 Q576,276 584,276 H810 a8,8 0 0,1 16,0 H892 Q900,276 900,284 V484 H874"
      fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<rect x="640" y="264" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="666" y="273" fill="#0972D3" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.01em">RED 메트릭</text>

<!-- 11. GRAFANA -> QFRONT (link-blue, elbow) -->
<path d="M800,456 V384 Q800,376 792,376 H584 Q576,376 576,368 V356"
      fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<rect x="700" y="372" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="728" y="381" fill="#0972D3" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">TraceQL</text>

<!-- ================= NODES ================= -->

<!-- APP -->
<rect x="40" y="64" width="120" height="56" rx="6" fill="#ffffff"/>
<rect x="40" y="64" width="120" height="56" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="100" y="90" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">애플리케이션</text>
<text x="100" y="104" fill="#545B64" font-size="9" class="mono" text-anchor="middle">trace source</text>

<!-- OTEL -->
<rect x="220" y="64" width="120" height="56" rx="6" fill="#ffffff"/>
<rect x="220" y="64" width="120" height="56" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="280" y="90" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">OTEL Collector</text>
<text x="280" y="104" fill="#545B64" font-size="9" class="mono" text-anchor="middle">collector</text>

