<title id="en-observability-alerting-03-grafana-oncall-3-title">Grafana OnCall Escalation Chain Steps</title>
<desc id="en-observability-alerting-03-grafana-oncall-3-desc">Flowchart showing a four-step escalation chain: each step waits 15 minutes for a response before escalating to the next responder tier, from the current on-call through secondary, team lead, and finally the entire team, with any timely response resolving the alert.</desc>
