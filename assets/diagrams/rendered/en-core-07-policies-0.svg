<title id="dtitle">Kubernetes Policy Architecture</title>
<desc id="ddesc">Diagram showing how the four Kubernetes policy types (resource, security, network, custom) are implemented by concrete mechanisms, which are in turn applied at the cluster, namespace, or pod level.</desc>
