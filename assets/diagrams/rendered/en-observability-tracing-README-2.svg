<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="span-title span-desc">
    <title id="span-title">Anatomy of a span</title>
    <desc id="span-desc">Flowchart showing the four record groups that make up one span — header identifiers, timing, metadata tags and logs, and status — flowing top to bottom from identification to outcome.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- connectors -->
    <line x1="480" y1="132" x2="480" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="252" x2="480" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="404" x2="480" y2="424" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Header Information -->
    <rect x="280" y="52" width="400" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="292" y="44" width="126" height="16" rx="2" fill="#ffffff"/>
    <text x="296" y="56" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.12em">HEADER INFORMATION</text>
    <text x="480" y="82" fill="#232F3E" font-size="10.5" font-family="'Geist Mono',monospace" text-anchor="middle">TraceID: abc123</text>
    <text x="480" y="100" fill="#232F3E" font-size="10.5" font-family="'Geist Mono',monospace" text-anchor="middle">SpanID: span001</text>
    <text x="480" y="118" fill="#232F3E" font-size="10.5" font-family="'Geist Mono',monospace" text-anchor="middle">ParentSpanID: null</text>

    <!-- Timing Information (focal) -->
    <rect x="280" y="152" width="400" height="100" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="292" y="144" width="130" height="16" rx="2" fill="#ffffff"/>
    <text x="296" y="156" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.12em">TIMING INFORMATION</text>
    <text x="480" y="192" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Start: 10:30:00.000</text>
    <text x="480" y="214" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Duration: 150ms</text>

    <!-- Metadata -->
    <rect x="280" y="272" width="400" height="132" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="292" y="264" width="88" height="16" rx="2" fill="#ffffff"/>
    <text x="296" y="276" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.12em">METADATA</text>
    <text x="480" y="308" fill="#232F3E" font-size="10.5" font-family="'Geist Mono',monospace" text-anchor="middle">Operation: HTTP GET /users</text>
    <text x="480" y="330" fill="#232F3E" font-size="10.5" font-family="'Geist Mono',monospace" text-anchor="middle">Tags: service=api, http.method=GET</text>
    <text x="480" y="352" fill="#232F3E" font-size="10.5" font-family="'Geist Mono',monospace" text-anchor="middle">Logs: request received, response sent</text>

    <!-- Status -->
    <rect x="280" y="424" width="400" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="292" y="416" width="68" height="16" rx="2" fill="#ffffff"/>
    <text x="296" y="428" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.12em">STATUS</text>
    <text x="480" y="458" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Status: OK</text>

    <!-- legend -->
    <line x1="30" y1="512" x2="930" y2="512" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="30" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.16em">LEGEND</text>
    <rect x="180" y="520" width="20" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="208" y="530" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Drives sampling and duration math</text>
  </svg>