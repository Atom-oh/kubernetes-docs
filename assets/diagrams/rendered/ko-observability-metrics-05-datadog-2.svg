<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dd-tree-ttl dd-tree-desc">
<title id="dd-tree-ttl">Datadog 비용 최적화 전략</title>
<desc id="dd-tree-desc">Datadog 비용 최적화가 메트릭 최적화, 로그 최적화, APM 최적화 세 갈래로 나뉘고 각 갈래마다 세부 실행 방법이 딸린 트리 구조를 보여주는 다이어그램.</desc>
<defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
  .name { font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:600; font-size:13px; fill:#232F3E; }
  .item { font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:400; font-size:11px; fill:#232F3E; }
  .eyebrow { font-family:'Geist Mono',monospace; font-size:8px; letter-spacing:0.18em; fill:#7D8998; text-transform:uppercase; }
  .tag { font-family:'Geist Mono',monospace; font-size:7px; letter-spacing:0.10em; fill:#EC7211; }
  .title { font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:700; font-size:28px; fill:#232F3E; }
</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<text x="32" y="40" class="eyebrow">COST OPTIMIZATION STRATEGY</text>
<text x="32" y="72" class="title">Datadog 비용 최적화 전략</text>

<!-- ===== CONNECTORS (before nodes) ===== -->
<!-- Root at (480,140) box 200x48 centered -> bus at y=212 -->
<path d="M 480,188 V 212" fill="none" stroke="#545B64" stroke-width="1"/>
<path d="M 168,212 H 792" fill="none" stroke="#545B64" stroke-width="1"/>
<!-- drops into each branch top edge -->
<path d="M 168,212 V 236" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 480,212 V 236" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 792,212 V 236" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ===== ROOT NODE (focal) ===== -->
<rect x="380" y="140" width="200" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<rect x="392" y="150" width="72" height="12" rx="2" fill="transparent" stroke="#EC7211" stroke-width="0.8"/>
<text x="428" y="159" text-anchor="middle" class="tag">STRATEGY</text>
<text x="480" y="176" text-anchor="middle" class="name">Datadog 비용 최적화</text>

<!-- ===== BRANCH NODES ===== -->
<!-- Branch 1: 메트릭 최적화 x center 168 -->
<rect x="68" y="236" width="200" height="332" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<rect x="68" y="236" width="200" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="168" y="262" text-anchor="middle" class="name">메트릭 최적화</text>
<line x1="88" y1="300" x2="248" y2="300" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<circle cx="92" cy="316" r="3" fill="#545B64"/>
<text x="102" y="320" class="item">커스텀 메트릭 제한</text>
<circle cx="92" cy="352" r="3" fill="#545B64"/>
<text x="102" y="356" class="item">태그 카디널리티 관리</text>
<circle cx="92" cy="388" r="3" fill="#545B64"/>
<text x="102" y="392" class="item">수집 간격 조정</text>

<!-- Branch 2: 로그 최적화 x center 480 -->
<rect x="380" y="236" width="200" height="332" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<rect x="380" y="236" width="200" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="262" text-anchor="middle" class="name">로그 최적화</text>
<line x1="400" y1="300" x2="560" y2="300" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<circle cx="404" cy="316" r="3" fill="#545B64"/>
<text x="414" y="320" class="item">로그 필터링</text>
<circle cx="404" cy="352" r="3" fill="#545B64"/>
<text x="414" y="356" class="item">샘플링</text>
<circle cx="404" cy="388" r="3" fill="#545B64"/>
<text x="414" y="392" class="item">인덱스 제외 필터</text>

<!-- Branch 3: APM 최적화 x center 792 -->
<rect x="692" y="236" width="200" height="332" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<rect x="692" y="236" width="200" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="792" y="262" text-anchor="middle" class="name">APM 최적화</text>
<line x1="712" y1="300" x2="872" y2="300" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<circle cx="716" cy="316" r="3" fill="#545B64"/>
<text x="726" y="320" class="item">샘플링 레이트 조정</text>
<circle cx="716" cy="352" r="3" fill="#545B64"/>
<text x="726" y="356" class="item">서비스 선별</text>
<circle cx="716" cy="388" r="3" fill="#545B64"/>
<text x="726" y="392" class="item">계측 범위 최적화</text>

<!-- Footer -->
<line x1="32" y1="588" x2="928" y2="588" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
</svg>