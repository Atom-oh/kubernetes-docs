<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-service-mesh-istio-advanced-01-ambient-mode-0-title en-service-mesh-istio-advanced-01-ambient-mode-0-desc">
<title id="en-service-mesh-istio-advanced-01-ambient-mode-0-title">Sidecar vs. ambient core concepts</title>
<desc id="en-service-mesh-istio-advanced-01-ambient-mode-0-desc">Diagram contrasting the sidecar model, where each pod pairs an application with its own Envoy proxy, against ambient mode, where application pods talk transparently to a shared node-level ztunnel that only escalates to an optional waypoint proxy when L7 features are needed.</desc>
