<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gf-arch-title gf-arch-desc">
  <title id="gf-arch-title">Grafana architecture</title>
  <desc id="gf-arch-desc">Browsers and API clients reach Grafana's frontend and backend, which write to Postgres/MySQL and Redis, route through a plugin system to six metrics/logs/traces data sources, and route alert notifications from the alerting engine to four channels.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Zone: Grafana Server (drawn before arrows/nodes) -->
  <rect x="280" y="132" width="400" height="232" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="420" y="136" width="120" height="12" rx="2" fill="#FFFFFF"/>
  <text x="480" y="145" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GRAFANA SERVER</text>

  <!-- Plain group captions (no zone rect) -->
  <text x="118" y="234" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">USERS</text>
  <text x="260" y="428" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STORAGE</text>

  <!-- Arrows (behind nodes) -->
  <path d="M188,268 H236 Q244,268 244,260 V190 Q244,182 252,182 H300" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M188,360 H252 Q260,360 260,352 V210 Q260,202 268,202 H300" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="370" y1="220" x2="370" y2="284" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M330,340 V384 Q330,392 322,392 H168 Q160,392 160,400 V444" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M410,340 V384 Q410,392 402,392 H368 Q360,392 360,400 V444" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="440" y1="304" x2="520" y2="304" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M660,312 H684 Q692,312 692,304 V212 Q692,204 700,204 H740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M660,192 H704 Q712,192 712,200 V434 Q712,442 720,442 H740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Node: Web Browser -->
  <rect x="48" y="244" width="140" height="48" rx="6" fill="#FFFFFF"/>
  <rect x="48" y="244" width="140" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="118" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Web Browser</text>

  <!-- Node: API Client -->
  <rect x="48" y="336" width="140" height="48" rx="6" fill="#FFFFFF"/>
  <rect x="48" y="336" width="140" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="118" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Client</text>

  <!-- Node: Frontend -->
  <rect x="300" y="164" width="140" height="56" rx="6" fill="#FFFFFF"/>
  <rect x="300" y="164" width="140" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="370" y="190" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Frontend</text>
  <text x="370" y="205" fill="#545B64" font-size="9" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle">React</text>

  <!-- Node: Backend -->
  <rect x="300" y="284" width="140" height="56" rx="6" fill="#FFFFFF"/>
  <rect x="300" y="284" width="140" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="370" y="310" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Backend</text>
  <text x="370" y="325" fill="#545B64" font-size="9" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle">Go</text>

  <!-- Node: Alerting Engine -->
  <rect x="520" y="164" width="140" height="56" rx="6" fill="#FFFFFF"/>
  <rect x="520" y="164" width="140" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="590" y="197" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alerting Engine</text>

  <!-- Node: Plugin System (focal) -->
  <rect x="520" y="284" width="140" height="56" rx="6" fill="#FFFFFF"/>
  <rect x="520" y="284" width="140" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="590" y="317" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Plugin System</text>

  <!-- Node: PostgreSQL/MySQL -->
  <rect x="80" y="444" width="160" height="56" rx="6" fill="#FFFFFF"/>
  <rect x="80" y="444" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="160" y="470" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PostgreSQL</text>
  <text x="160" y="485" fill="#545B64" font-size="9" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle">/ MySQL</text>

  <!-- Node: Redis/Memcached -->
  <rect x="280" y="444" width="160" height="56" rx="6" fill="#FFFFFF"/>
  <rect x="280" y="444" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="360" y="470" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Redis</text>
  <text x="360" y="485" fill="#545B64" font-size="9" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle">/ Memcached</text>

  <!-- Group box: Data Sources -->
  <rect x="740" y="128" width="180" height="152" rx="6" fill="#FFFFFF"/>
  <rect x="740" y="128" width="180" height="152" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="830" y="152" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Data Sources</text>

  <rect x="752" y="168" width="76" height="24" rx="4" fill="#FFFFFF" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
  <text x="790" y="184" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>

  <rect x="832" y="168" width="76" height="24" rx="4" fill="#FFFFFF" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
  <text x="870" y="184" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VictoriaMetrics</text>

  <rect x="752" y="200" width="76" height="24" rx="4" fill="#FFFFFF" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
  <text x="790" y="216" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Loki</text>

  <rect x="832" y="200" width="76" height="24" rx="4" fill="#FFFFFF" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
  <text x="870" y="216" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tempo</text>

  <rect x="752" y="232" width="76" height="24" rx="4" fill="#FFFFFF" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
  <text x="790" y="248" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch</text>

  <rect x="832" y="232" width="76" height="24" rx="4" fill="#FFFFFF" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
  <text x="870" y="248" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Elasticsearch</text>

  <!-- Group box: Notification Channels -->
  <rect x="740" y="384" width="180" height="116" rx="6" fill="#FFFFFF"/>
  <rect x="740" y="384" width="180" height="116" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="830" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Notification Channels</text>

  <rect x="752" y="424" width="76" height="24" rx="4" fill="#FFFFFF" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
  <text x="790" y="440" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Slack</text>

  <rect x="832" y="424" width="76" height="24" rx="4" fill="#FFFFFF" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
  <text x="870" y="440" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PagerDuty</text>

  <rect x="752" y="456" width="76" height="24" rx="4" fill="#FFFFFF" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
  <text x="790" y="472" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Email</text>

  <rect x="832" y="456" width="76" height="24" rx="4" fill="#FFFFFF" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
  <text x="870" y="472" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Webhook</text>

</svg>