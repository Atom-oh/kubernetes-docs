<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">인증 및 권한 부여 흐름</title>
<desc id="d">사용자 또는 서비스 계정의 요청이 인증, 권한 부여, 어드미션 컨트롤을 차례로 통과해 API 서버에 도달하며, 인증에는 X.509·토큰·OIDC·웹훅 방식이, 권한 부여에는 RBAC·ABAC·Node·Webhook 모드가 쓰인다는 것을 보여주는 흐름도</desc>
