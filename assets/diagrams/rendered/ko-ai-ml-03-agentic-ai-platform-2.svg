<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="d2-title d2-desc">
    <title id="d2-title">vLLM 핵심 기술과 성능 이점 매핑</title>
    <desc id="d2-desc">PagedAttention, 연속 배치 처리, Prefix 캐싱, Chunked Prefill이라는 vLLM의 네 가지 핵심 기술이 각각 메모리 효율, 처리량 향상, 지연시간 최소화, 긴 컨텍스트 지원이라는 성능 이점으로 이어지는 관계를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="8" width="288" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="112" y="16" width="144" height="12" rx="2" fill="#ffffff"/>
    <text x="184" y="25" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">vLLM 핵심 기술</text>

    <rect x="632" y="8" width="288" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="724" y="16" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="776" y="25" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">성능 이점</text>

    <!-- Arrows -->
    <line x1="304" y1="64" x2="660" y2="64" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="304" y1="152" x2="660" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="304" y1="240" x2="660" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="304" y1="328" x2="660" y2="328" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Left column: techniques -->
    <rect x="64" y="40" width="240" height="48" rx="6" fill="#ffffff"/>
    <rect x="64" y="40" width="240" height="48" rx="6" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="1"/>
    <text x="184" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">PagedAttention</text>

    <rect x="64" y="128" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="184" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">연속 배치 처리</text>

    <rect x="64" y="216" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="184" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Prefix 캐싱</text>

    <rect x="64" y="304" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="184" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Chunked Prefill</text>

    <!-- Right column: benefits -->
    <rect x="660" y="40" width="240" height="48" rx="6" fill="#ffffff"/>
    <rect x="660" y="40" width="240" height="48" rx="6" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="1"/>
    <text x="780" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">메모리 효율 95%+</text>

    <rect x="660" y="128" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">처리량 24x 향상</text>

    <rect x="660" y="216" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">지연시간 최소화</text>

    <rect x="660" y="304" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">긴 컨텍스트 지원</text>

    <!-- Legend -->
    <line x1="40" y1="404" x2="920" y2="404" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="420" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="444" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">핵심 혁신 기술</text>

    <rect x="200" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="444" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">기술 / 성능 이점</text>

    <line x1="400" y1="441" x2="428" y2="441" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="436" y="444" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">성능 기여</text>
