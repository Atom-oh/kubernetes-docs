    <title id="en-eks-05-eks-security-15-title">Financial services EKS VPC architecture</title>
    <desc id="en-eks-05-eks-security-15-desc">Architecture diagram showing internet traffic filtered by AWS WAF and a load balancer into application pods running on a private-subnet EKS cluster alongside security sidecars, with security tooling monitoring the cluster and KMS-encrypted data services holding RDS, S3, and DynamoDB.</desc>
