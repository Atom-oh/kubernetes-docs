<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="argoapp0-title argoapp0-desc">
  <title id="argoapp0-title">Application CRD의 소스와 대상 구조</title>
  <desc id="argoapp0-desc">ArgoCD Application CRD가 Git·Helm·OCI 저장소를 소스로 받아 Kubernetes 클러스터와 네임스페이스라는 대상에 배포함을 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- zone: source -->
  <rect x="60" y="72" width="200" height="384" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="72" y="76" width="60" height="12" rx="2" fill="#FFFFFF"/>
  <text x="102" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SOURCE</text>

  <!-- zone: destination -->
  <rect x="740" y="132" width="180" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="752" y="136" width="88" height="12" rx="2" fill="#FFFFFF"/>
  <text x="796" y="145" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DESTINATION</text>

  <!-- Arrows (behind nodes) -->
  <!-- Git -> Application (down) -->
  <path d="M240,120 H342 Q350,120 350,128 V232 Q350,240 358,240 H460" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Helm -> Application (flat) -->
  <path d="M240,264 H460" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- OCI -> Application (up) -->
  <path d="M240,408 H342 Q350,408 350,400 V296 Q350,288 358,288 H460" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Application -> Cluster (up, accent happy path) -->
  <path d="M680,248 H712 Q720,248 720,240 V188 Q720,180 728,180 H760" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <!-- Application -> Namespace (down) -->
  <path d="M680,280 H712 Q720,280 720,288 V340 Q720,348 728,348 H760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Source nodes (external treatment) -->
  <rect x="80" y="96" width="160" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="160" y="116" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Git Repository</text>
  <text x="160" y="131" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git</text>

  <rect x="80" y="240" width="160" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="160" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Helm Repository</text>
  <text x="160" y="275" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">helm</text>

  <rect x="80" y="384" width="160" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="160" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OCI Registry</text>
  <text x="160" y="419" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">oci</text>

  <!-- Focal: Application CRD -->
  <rect x="460" y="216" width="220" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="570" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application CRD</text>
  <rect x="500" y="268" width="56" height="16" rx="2" fill="#FFFFFF" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
  <text x="528" y="279" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPEC</text>
  <rect x="584" y="268" width="56" height="16" rx="2" fill="#FFFFFF" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
  <text x="612" y="279" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATUS</text>

  <!-- Destination nodes (backend treatment) -->
  <rect x="760" y="156" width="160" height="48" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="840" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes Cluster</text>
  <text x="840" y="191" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cluster</text>

  <rect x="760" y="324" width="160" height="48" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="840" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Namespace</text>
  <text x="840" y="359" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ns</text>

  <!-- Legend -->
  <line x1="60" y1="500" x2="900" y2="500" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="60" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="200" y="510" width="24" height="12" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="232" y="520" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">소스 저장소</text>

  <rect x="400" y="510" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="432" y="520" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Application CRD</text>

  <rect x="600" y="510" width="24" height="12" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="632" y="520" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">배포 대상</text>
</svg>