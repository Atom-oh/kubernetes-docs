<title id="en-service-mesh-istio-02-basic-concepts-4-title">Istio Major Version History</title>
<desc id="en-service-mesh-istio-02-basic-concepts-4-desc">Timeline of Istio's major releases from the 0.1 announcement in May 2017 through version 1.28 in January 2025, marking the 1.0 production-ready release, the 1.5 istiod consolidation, and the 1.20 introduction of Ambient Mode as major milestones.</desc>
