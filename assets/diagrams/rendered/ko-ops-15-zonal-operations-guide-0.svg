<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zonal-fetch-title zonal-fetch-desc">
  <title id="zonal-fetch-title">Rack-Aware Fetch: Follower Fetch Redirect Sequence</title>
  <desc id="zonal-fetch-desc">컨슈머가 client.rack을 포함해 리더 브로커에 Fetch를 요청하면 리더가 같은 AZ의 팔로워로 리다이렉트하고, 컨슈머는 그 팔로워에서 직접 데이터를 받아 크로스 AZ 비용을 없앤다.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Eyebrow / header -->
  <text x="32" y="28" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SEQUENCE · RACK-AWARE FETCH</text>
  <text x="32" y="48" fill="#232F3E" font-size="16" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">동일 AZ 팔로워 Fetch 리다이렉트</text>

  <!-- Zone badges under actor names -->
  <!-- Actor boxes -->
  <!-- Consumer (AZ-a) -->
  <rect x="60" y="72" width="160" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="140" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Consumer</text>
  <text x="140" y="107" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AZ-a</text>

  <!-- Leader Broker (AZ-b) -->
  <rect x="400" y="72" width="160" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Leader Broker</text>
  <text x="480" y="107" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AZ-b</text>

  <!-- Follower Broker (AZ-a) -->
  <rect x="740" y="72" width="160" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="820" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Follower Broker</text>
  <text x="820" y="107" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AZ-a</text>

  <!-- Lifelines -->
  <line x1="140" y1="116" x2="140" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="116" x2="480" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="820" y1="116" x2="820" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Activation bars -->
  <!-- Consumer: active across the whole exchange -->
  <rect x="136" y="152" width="8" height="308" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
  <!-- Leader Broker: active for its request/response -->
  <rect x="476" y="156" width="8" height="76" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
  <!-- Follower Broker: active for its request/response -->
  <rect x="816" y="316" width="8" height="76" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

  <!-- Message 1: C -> L  Fetch request with client.rack=AZ-a -->
  <line x1="148" y1="168" x2="472" y2="168" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="220" y="140" width="220" height="24" rx="2" fill="#ffffff"/>
  <text x="330" y="150" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">Fetch 요청</text>
  <text x="330" y="160" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">(client.rack=AZ-a 포함)</text>

  <!-- Message 2: L -> C  return, dashed, filled marker -->
  <line x1="472" y1="232" x2="148" y2="232" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="220" y="200" width="240" height="24" rx="2" fill="#ffffff"/>
  <text x="330" y="210" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">"AZ-a의 팔로워로 가라"</text>
  <text x="330" y="220" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">(선호 replica 지시)</text>

  <!-- Message 3: C -> F  Fetch 요청 재전송 -->
  <line x1="148" y1="332" x2="812" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="400" y="308" width="180" height="16" rx="2" fill="#ffffff"/>
  <text x="490" y="320" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">Fetch 요청 재전송</text>

  <!-- Message 4: F -> C  headline success, solid accent -->
  <line x1="812" y1="396" x2="148" y2="396" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="330" y="356" width="320" height="32" rx="2" fill="#ffffff"/>
  <text x="490" y="368" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em" font-weight="600">데이터 반환</text>
  <text x="490" y="380" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">(동일 AZ, cross-AZ 비용 없음)</text>

  <!-- Legend -->
  <line x1="30" y1="518" x2="930" y2="518" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <line x1="120" y1="533" x2="150" y2="533" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="158" y="536" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">요청 (Call)</text>

  <line x1="290" y1="533" x2="320" y2="533" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="328" y="536" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">응답 (Return)</text>

  <line x1="500" y1="533" x2="530" y2="533" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="538" y="536" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">최종 성공 응답 (동일 AZ)</text>
</svg>