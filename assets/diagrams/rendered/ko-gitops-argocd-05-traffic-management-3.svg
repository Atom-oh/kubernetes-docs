<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="progressive-rollout-title progressive-rollout-desc">
      <title id="progressive-rollout-title">단계적 카나리 롤아웃 흐름</title>
      <desc id="progressive-rollout-desc">트래픽 비중을 5%에서 20%, 50%, 80%까지 단계적으로 늘리며 각 단계 사이 분석 결과가 성공이면 다음 단계로, 실패면 롤백으로 이어지고 최종 분석에 성공하면 100% 완료되는 흐름을 보여주는 다이어그램입니다.</desc>
