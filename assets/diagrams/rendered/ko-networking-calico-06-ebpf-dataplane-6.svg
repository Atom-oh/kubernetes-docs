<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ebpf6-title ebpf6-desc">
    <title id="ebpf6-title">DSR(Direct Server Return) 동작 원리</title>
    <desc id="ebpf6-desc">일반 모드에서는 백엔드 Pod의 응답이 로드밸런서 노드를 거쳐 SNAT된 뒤 클라이언트로 돌아가지만, DSR 모드에서는 로드밸런서를 거치지 않고 백엔드 Pod가 응답을 클라이언트에 직접 전송한다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="200" y1="88" x2="200" y2="460" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="88" x2="480" y2="460" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="760" y1="88" x2="760" y2="460" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Messages: block 1, Non-DSR -->
    <line x1="200" y1="144" x2="480" y2="144" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="248" y="124" width="132" height="12" rx="2" fill="#ffffff"/>
    <text x="314" y="133" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">1. REQUEST TO VIP:80</text>

    <line x1="480" y1="184" x2="760" y2="184" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="530" y="164" width="150" height="12" rx="2" fill="#ffffff"/>
    <text x="605" y="173" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">2. DNAT TO POD:8080</text>

    <line x1="760" y1="224" x2="480" y2="224" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="530" y="204" width="160" height="12" rx="2" fill="#ffffff"/>
    <text x="610" y="213" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">3. RESPONSE VIA NODE1</text>

    <line x1="480" y1="264" x2="200" y2="264" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="248" y="244" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="324" y="253" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">4. SNAT BACK TO VIP</text>

    <!-- Divider -->
    <line x1="130" y1="292" x2="830" y2="292" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>

    <!-- Messages: block 2, DSR -->
    <line x1="200" y1="344" x2="480" y2="344" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="248" y="324" width="132" height="12" rx="2" fill="#ffffff"/>
    <text x="314" y="333" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">1. REQUEST TO VIP:80</text>

    <line x1="480" y1="384" x2="760" y2="384" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="530" y="364" width="168" height="12" rx="2" fill="#ffffff"/>
    <text x="614" y="373" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">2. TUNNEL/ENCAP TO POD</text>

    <line x1="760" y1="424" x2="200" y2="424" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="380" y="392" width="200" height="24" rx="2" fill="#ffffff"/>
    <text x="480" y="401" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">3. DIRECT RESPONSE</text>
    <text x="480" y="413" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">(SRC=VIP:80)</text>

    <!-- Captions -->
    <text x="480" y="112" fill="#232F3E" font-size="12" font-style="italic" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">일반 모드 (Non-DSR)</text>
    <text x="480" y="312" fill="#232F3E" font-size="12" font-style="italic" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">DSR 모드</text>

    <!-- Actors -->
    <rect x="130" y="40" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="130" y="40" width="140" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="200" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">클라이언트</text>
    <text x="200" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.100</text>

    <rect x="410" y="40" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="410" y="40" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">Node 1</text>
    <text x="480" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LB 노드</text>

    <rect x="690" y="40" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="690" y="40" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="760" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">Node 2</text>
    <text x="760" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Backend Pod</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <line x1="40" y1="533" x2="68" y2="533" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="76" y="536" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif">LB 노드를 거치지 않는 직접 응답</text>
    <line x1="360" y1="533" x2="388" y2="533" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="396" y="536" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif">응답 / 반환</text>
  </svg>