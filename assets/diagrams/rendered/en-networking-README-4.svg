<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-networking-README-4-title en-networking-README-4-desc">
<title id="en-networking-README-4-title">CNI ADD / DEL Call Flow</title>
<desc id="en-networking-README-4-desc">The kubelet calls the CNI plugin's ADD hook on pod creation, which configures the network and returns the pod's IP, then calls DEL on pod deletion to clean the network back up.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- lifelines -->
<line x1="160" y1="108" x2="160" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="480" y1="108" x2="480" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="800" y1="108" x2="800" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- activation bars on CNI Plugin -->
<rect x="476" y="140" width="8" height="192" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="476" y="420" width="8" height="80" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- messages: ADD flow -->
<line x1="160" y1="140" x2="480" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="284" y="120" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="320" y="129" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADD CALL</text>

<line x1="480" y1="188" x2="800" y2="188" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="596" y="168" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="640" y="177" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE IFACE</text>

<line x1="480" y1="236" x2="800" y2="236" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="596" y="216" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="640" y="225" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASSIGN IP</text>

<line x1="480" y1="284" x2="800" y2="284" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="588" y="264" width="104" height="12" rx="2" fill="#ffffff"/>
<text x="640" y="273" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG ROUTES</text>

<!-- headline success return: solid accent -->
<line x1="480" y1="332" x2="160" y2="332" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="264" y="312" width="92" height="12" rx="2" fill="#ffffff"/>
<text x="320" y="321" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETURN IP</text>

<!-- note -->
<rect x="160" y="356" width="640" height="32" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<text x="480" y="376" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" font-style="italic">Pod running…</text>

<!-- DEL flow -->
<line x1="160" y1="420" x2="480" y2="420" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="284" y="400" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="320" y="409" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEL CALL</text>

<line x1="480" y1="460" x2="800" y2="460" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="600" y="440" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="640" y="449" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLEANUP</text>

<line x1="480" y1="500" x2="160" y2="500" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="280" y="480" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="320" y="489" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMPLETE</text>

<!-- actors -->
<rect x="90" y="60" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="160" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubelet</text>

<rect x="410" y="60" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CNI Plugin</text>

<rect x="730" y="60" width="140" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="800" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Network</text>
</svg>