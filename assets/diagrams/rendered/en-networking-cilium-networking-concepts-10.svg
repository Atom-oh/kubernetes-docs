<title id="en-networking-cilium-networking-concepts-10-title">DNS Resolution Process</title>
<desc id="en-networking-cilium-networking-concepts-10-desc">Sequence diagram showing a client's iterative DNS query walking from the root DNS server to the .com TLD server to the example.com authoritative server, which returns the final IP address.</desc>
