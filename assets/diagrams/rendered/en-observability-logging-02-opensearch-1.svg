<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-title seq-desc">
    <title id="seq-title">OpenSearch log data flow sequence</title>
    <desc id="seq-desc">An application sends logs through FluentBit into OpenSearch, which indexes them to EBS as hot data, then an ISM policy moves data older than 7 days to UltraWarm and data older than 30 days on to S3-backed cold storage.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="90"  y1="80" x2="90"  y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="285" y1="80" x2="285" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="80" x2="480" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="675" y1="80" x2="675" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="870" y1="80" x2="870" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="281" y="120" width="8" height="48" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="476" y="168" width="8" height="232" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="671" y="320" width="8" height="80" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- Messages -->
    <!-- 1. Application -> FluentBit -->
    <line x1="90" y1="120" x2="277" y2="120" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="150" y="100" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="184" y="109" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEND LOGS</text>

    <!-- 2. FluentBit -> OpenSearch (headline) -->
    <line x1="289" y1="168" x2="472" y2="168" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="342" y="148" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="376" y="157" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BULK API</text>

    <!-- 3. OpenSearch self-loop -> EBS (hot index) -->
    <path d="M 484,208 H 528 V 232 H 484" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="536" y="204" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="580" y="213" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INDEX HOT→EBS</text>

    <!-- Note: after 7 days -->
    <rect x="480" y="260" width="196" height="20" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
    <text x="578" y="273" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" text-anchor="middle">After 7 days</text>

    <!-- 5. OpenSearch -> UltraWarm -->
    <line x1="484" y1="320" x2="667" y2="320" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="516" y="300" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="576" y="309" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ISM: MOVE TO WARM</text>

    <!-- Note: after 30 days -->
    <rect x="675" y="352" width="196" height="20" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
    <text x="773" y="365" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" text-anchor="middle">After 30 days</text>

    <!-- 7. UltraWarm -> Cold Storage -->
    <line x1="679" y1="400" x2="866" y2="400" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="708" y="380" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="764" y="389" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MOVE TO COLD</text>

    <!-- Actor boxes -->
    <rect x="20"  y="40" width="140" height="40" rx="6" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="90" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>

    <rect x="215" y="40" width="140" height="40" rx="6" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="285" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">FluentBit</text>

    <rect x="410" y="40" width="140" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OpenSearch</text>

    <rect x="605" y="40" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="675" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">UltraWarm</text>

    <rect x="800" y="40" width="140" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="870" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cold Storage</text>

    <!-- Legend -->
    <line x1="30" y1="580" x2="930" y2="580" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="596" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="150" y1="592" x2="180" y2="592" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="188" y="596" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">PRIMARY INGEST PATH</text>
    <line x1="400" y1="592" x2="430" y2="592" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="438" y="596" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">TIER TRANSITION</text>
  </svg>