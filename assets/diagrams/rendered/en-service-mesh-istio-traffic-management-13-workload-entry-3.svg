<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="we-resolution-flow-title we-resolution-flow-desc">
    <title id="we-resolution-flow-title">ServiceEntry resolution flow</title>
    <desc id="we-resolution-flow-desc">Sequence diagram showing a Kubernetes Pod resolving a virtual IP through Istio DNS, then the Envoy proxy matching a ServiceEntry and WorkloadEntry before opening an mTLS connection to the registered VM and returning its response.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <line x1="120" y1="128" x2="120" y2="480" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="360" y1="128" x2="360" y2="480" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="600" y1="128" x2="600" y2="480" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="840" y1="128" x2="840" y2="480" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

    <rect x="596" y="252" width="8" height="192" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="836" y="376" width="8" height="32" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <line x1="120" y1="176" x2="360" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="360" y1="212" x2="120" y2="212" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <line x1="120" y1="248" x2="600" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 604 284 L 640 284 L 640 308 L 604 308" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 604 336 L 640 336 L 640 360 L 604 360" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="600" y1="372" x2="840" y2="372" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="840" y1="408" x2="600" y2="408" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <line x1="600" y1="444" x2="120" y2="444" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <rect x="200" y="156" width="79" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="165" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 DNS LOOKUP</text>
    <rect x="200" y="192" width="79" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="201" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 VIRTUAL IP</text>
    <rect x="315" y="228" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="360" y="237" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 HTTP REQUEST</text>
    <rect x="618" y="276" width="107" height="12" rx="2" fill="#ffffff"/>
    <text x="672" y="285" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">4 MATCH SVC-ENTRY</text>
    <rect x="610" y="328" width="124" height="12" rx="2" fill="#ffffff"/>
    <text x="672" y="337" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">5 FIND WORKLOADENTRY</text>
    <rect x="675" y="352" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="361" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">6 MTLS CONNECT</text>
    <rect x="686" y="388" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="397" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">7 RESPONSE</text>
    <rect x="326" y="424" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="360" y="433" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">8 RESPONSE</text>

    <rect x="48" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="48" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="56" y="78" width="28" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-width="0.8" opacity="0.6"/>
    <text x="70" y="87" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
    <text x="120" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Kubernetes Pod</text>
    <text x="120" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Client</text>

    <rect x="288" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="288" y="72" width="144" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="296" y="78" width="28" height="12" rx="2" fill="transparent" stroke="#545B64" stroke-width="0.8" opacity="0.6"/>
    <text x="310" y="87" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DNS</text>
    <text x="360" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Istio DNS</text>
    <text x="360" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Resolver</text>

    <rect x="520" y="72" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="520" y="72" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="528" y="78" width="28" height="12" rx="2" fill="transparent" stroke="#EC7211" stroke-width="0.8" opacity="0.6"/>
    <text x="542" y="87" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PXY</text>
    <text x="600" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Envoy Proxy</text>
    <text x="600" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Sidecar</text>

    <rect x="768" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="768" y="72" width="144" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="776" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8" opacity="0.6"/>
    <text x="790" y="87" fill="rgba(35,47,62,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VM</text>
    <text x="840" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">WorkloadEntry</text>
    <text x="840" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VM</text>

    <!-- legend -->
    <line x1="40" y1="508" x2="920" y2="508" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="524" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <line x1="40" y1="540" x2="68" y2="540" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="76" y="543" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Call</text>

    <line x1="180" y1="540" x2="208" y2="540" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="216" y="543" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Return</text>

    <line x1="332" y1="540" x2="360" y2="540" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="368" y="543" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Headline response</text>

    <rect x="524" y="534" width="14" height="10" rx="2" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <text x="544" y="543" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Activation (holds control)</text>
  </svg>