<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obslab-roadmap-title obslab-roadmap-desc">
<title id="obslab-roadmap-title">Six-part observability lab roadmap</title>
<desc id="obslab-roadmap-desc">A six-step linear path from standing up infrastructure through the observability stack, MSA deployment with canary rollout, load testing and scaling, alerting and AIOps, and finally distributed tracing.</desc>
<defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
  <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
</marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
  <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
</marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- ============ ARROWS (before nodes) ============ -->
<!-- Part1(148) -> Part2(172) -->
<line x1="148" y1="300" x2="172" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Part2(300) -> Part3(324) -->
<line x1="300" y1="300" x2="324" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Part3(452) -> Part4(476) (accent: canary / deployment is the pedagogical hinge) -->
<line x1="452" y1="300" x2="476" y2="300" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<!-- Part4(604) -> Part5(628) -->
<line x1="604" y1="300" x2="628" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Part5(756) -> Part6(780) -->
<line x1="756" y1="300" x2="780" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ============ NODES ============ -->
