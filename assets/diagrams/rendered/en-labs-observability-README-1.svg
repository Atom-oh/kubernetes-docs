<rect x="28" y="272" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="46" y="281" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
<text x="84" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Infrastructure</text>
<text x="84" y="318" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">setup</text>

