<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 660" role="img" aria-labelledby="os-arch-title os-arch-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="os-arch-title">OpenSearch 클러스터 아키텍처</title>
    <desc id="os-arch-desc">애플리케이션, FluentBit, Kinesis Data Firehose가 VPC 내 Multi-AZ OpenSearch 클러스터의 Data Node로 로그를 전송하고, Master Node가 클러스터를 관리하며, Data Node가 UltraWarm을 거쳐 S3 Cold Storage로 데이터를 이동시키는 구조를 보여준다.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ============ ZONES (bg -> zones -> arrows -> nodes) ============ -->
    <!-- Client zone -->
    <rect x="24" y="56" width="168" height="400" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="36" y="60" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="74" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">클라이언트</text>

    <!-- VPC zone -->
    <rect x="232" y="56" width="456" height="460" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="244" y="60" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="300" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">VPC · MULTI-AZ</text>

    <!-- Storage zone -->
    <rect x="728" y="56" width="192" height="460" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="740" y="60" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="770" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">스토리지</text>

    <!-- ============ ARROWS (before nodes) ============ -->
    <!-- App -> Data (down-right elbow, r=8) -->
    <path d="M 180,128 H 210 Q 218,128 218,136 V 236 Q 218,244 226,244 H 256"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- FluentBit -> Data (small down elbow, r=4) -->
    <path d="M 180,256 H 214 Q 218,256 218,260 Q 218,264 222,264 H 256"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Kinesis -> Data (up-right elbow, r=8) -->
    <path d="M 180,384 H 210 Q 218,384 218,376 V 292 Q 218,284 226,284 H 256"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Data -> EBS (straight, same y) -->
    <path d="M 456,264 H 748" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Data -> UltraWarm (down-right elbow, r=8) -->
    <path d="M 456,284 H 476 Q 484,284 484,292 V 376 Q 484,384 492,384 H 512"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- UltraWarm -> S3 (straight, same y) -->
    <path d="M 664,384 H 748" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow label: Data -> EBS -->
    <rect x="574" y="246" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="600" y="255" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">INDEX</text>
    <!-- Arrow label: UltraWarm -> S3 -->
    <rect x="680" y="366" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="706" y="375" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">30D+</text>

    <!-- ============ NODES ============ -->
    <!-- App -->
    <rect x="40" y="96" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="96" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="48" y="102" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="63" y="111" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="110" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">애플리케이션</text>
    <text x="110" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">log source</text>

    <!-- FluentBit -->
    <rect x="40" y="224" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="224" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="48" y="230" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="65" y="239" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">AGNT</text>
    <text x="110" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">FluentBit</text>
    <text x="110" y="276" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">DaemonSet</text>

    <!-- Kinesis Data Firehose -->
    <rect x="40" y="352" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="352" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="48" y="358" width="38" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="67" y="367" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">STRM</text>
    <text x="110" y="384" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kinesis Data</text>
    <text x="110" y="398" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Firehose</text>

    <!-- Master Node -->
    <rect x="512" y="96" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="512" y="96" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="520" y="102" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="535" y="111" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
    <text x="588" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Master Node</text>
    <text x="588" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">3-node quorum</text>

    <!-- Data Node (focal) -->
    <rect x="256" y="224" width="200" height="80" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="256" y="224" width="200" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="264" y="230" width="30" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.6)" stroke-width="0.8"/>
    <text x="279" y="239" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">HOT</text>
    <text x="356" y="262" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Data Node</text>
    <text x="356" y="278" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">r6g.xlarge · Multi-AZ</text>
    <text x="356" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">replicated x2</text>

    <!-- UltraWarm Node -->
    <rect x="512" y="352" width="152" height="64" rx="6" fill="rgba(35,47,62,0.02)"/>
    <rect x="512" y="352" width="152" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="#545B64" stroke-width="1"/>
    <rect x="520" y="358" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="537" y="367" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">WARM</text>
    <text x="588" y="388" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">UltraWarm Node</text>
    <text x="588" y="404" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">read-only tier</text>

    <!-- EBS (store, cylinder) -->
    <rect x="748" y="232" width="152" height="64" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="748" y="232" width="152" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <ellipse cx="772" cy="244" rx="10" ry="6" fill="none" stroke="#545B64" stroke-width="1"/>
    <path d="M 762,244 V 254 A 10,6 0 0 0 782,254 V 244" fill="none" stroke="#545B64" stroke-width="1"/>
    <text x="824" y="264" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EBS</text>
    <text x="824" y="280" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">gp3 · hot storage</text>

    <!-- S3 Cold Storage (store, cylinder) -->
    <rect x="748" y="352" width="152" height="64" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="748" y="352" width="152" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <ellipse cx="772" cy="364" rx="10" ry="6" fill="none" stroke="#545B64" stroke-width="1"/>
    <path d="M 762,364 V 374 A 10,6 0 0 0 782,374 V 364" fill="none" stroke="#545B64" stroke-width="1"/>
    <text x="824" y="384" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">S3</text>
    <text x="824" y="400" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">cold storage archive</text>

    <!-- ============ LEGEND ============ -->
    <line x1="24" y1="548" x2="920" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

    <circle cx="180" cy="564" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="192" y="568" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">FOCAL · HOT TIER</text>

    <circle cx="340" cy="564" r="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="352" y="568" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">STORE / STORAGE</text>

    <circle cx="520" cy="564" r="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="532" y="568" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">COMPUTE NODE</text>
  </svg>