<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
<title id="t1">Self-healing sequence</title>
<desc id="d1">Sequence diagram showing a user manually scaling a deployment with kubectl, Argo CD detecting the state change, reading the desired replica count from Git, and reapplying it so Kubernetes self-heals back to the Git-declared state.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#545B64" stroke-width="1.2"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Lifelines -->
<line x1="100" y1="76" x2="100" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="350" y1="76" x2="350" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="600" y1="76" x2="600" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="850" y1="76" x2="850" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Activation bars -->
<rect x="346" y="120" width="8" height="52" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="596" y="172" width="8" height="168" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- Message 1: User -> K8s (call) -->
<line x1="100" y1="120" x2="342" y2="120" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="128" y="100" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="228" y="109" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">KUBECTL SCALE --REPLICAS=5</text>

<!-- Message 2: K8s -->> ArgoCD (async event, dashed + open) -->
<line x1="354" y1="172" x2="592" y2="172" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
<rect x="400" y="152" width="104" height="12" rx="2" fill="#ffffff"/>
<text x="452" y="161" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATE CHANGED</text>

<!-- Message 3: ArgoCD -> Git (call) -->
<line x1="600" y1="224" x2="842" y2="224" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="648" y="204" width="144" height="12" rx="2" fill="#ffffff"/>
<text x="720" y="213" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET DESIRED STATE</text>

<!-- Message 4: Git -->> ArgoCD (return, dashed + filled) -->
<line x1="850" y1="276" x2="608" y2="276" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="668" y="256" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="704" y="265" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPLICAS: 3</text>

<!-- Message 5: ArgoCD -> K8s (headline success, solid accent) -->
<line x1="600" y1="340" x2="358" y2="340" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="404" y="320" width="152" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="329" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPLY REPLICAS: 3</text>

<!-- Note over K8s -->
<rect x="240" y="380" width="220" height="40" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<text x="350" y="397" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" text-anchor="middle">Self-healed back to</text>
<text x="350" y="411" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" text-anchor="middle">desired state</text>

<!-- Actor boxes -->
<rect x="30" y="40" width="140" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="100" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">User</text>

<rect x="280" y="40" width="140" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="350" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes</text>

<rect x="530" y="40" width="140" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="600" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Argo CD</text>

<rect x="780" y="40" width="140" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="850" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Git</text>
</svg>