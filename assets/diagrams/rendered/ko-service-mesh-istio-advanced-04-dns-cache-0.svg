<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
  <title id="d0-title">Istio DNS Proxy 아키텍처</title>
  <desc id="d0-desc">애플리케이션 파드 안에서 iptables가 DNS 쿼리와 HTTP 요청을 각각 Envoy의 DNS Listener와 HTTP Listener로 리다이렉트하고, DNS Listener가 ServiceEntry 기반 DNS 테이블에서 가상 IP를 조회해 응답한 뒤, HTTP Listener가 그 가상 IP를 실제 IP로 변환해 외부 서비스로 보내는 흐름을 보여준다. Istiod는 xDS로 DNS 테이블을 채우고, ServiceEntry에 없는 도메인은 DNS Listener가 CoreDNS로 위임한다.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Zones (bg -> zones -> arrows -> nodes) -->
  <rect x="24" y="32" width="624" height="472" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="36" y="36" width="32" height="12" rx="2" fill="#ffffff"/>
  <text x="52" y="45" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">POD</text>

  <rect x="88" y="272" width="520" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="100" y="276" width="52" height="12" rx="2" fill="#ffffff"/>
  <text x="126" y="285" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">ENVOY</text>

  <rect x="712" y="272" width="200" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="724" y="276" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="752" y="285" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">EXTERNAL</text>

  <!-- ===== Arrows (before nodes) ===== -->

  <!-- E1 App -> DNS_Rule (1. DNS 쿼리 UDP53) -->
  <path d="M140,132 V180" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="104" y="148" width="72" height="12" fill="#ffffff"/>
  <text x="140" y="157" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">DNS·UDP53</text>

  <!-- E5 DNS_Listener -> App (5. DNS 응답) -->
  <path d="M256,320 H272 Q280,320 280,312 V176 Q280,168 284,164"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="284" y="196" width="60" height="12" fill="#ffffff"/>
  <text x="314" y="205" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">DNS 응답</text>

  <!-- E6 App -> TCP_Rule (6. HTTP 요청, 가상IP) — hops over E5 (x=280) and E-XDS (x=304) at y=168 -->
  <path d="M220,132 V156 Q220,164 224,164 H272 A8,8 0 0 1 288,164 H296 A8,8 0 0 1 312,164 H440 Q448,164 448,172 V180"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="360" y="148" width="88" height="12" fill="#ffffff"/>
  <text x="404" y="157" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">HTTP·240.240.0.1</text>

  <!-- E2 DNS_Rule -> DNS_Listener (2. 리다이렉트 15053) -->
  <path d="M176,228 V248 Q176,256 184,256 V312"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="188" y="240" width="64" height="12" fill="#ffffff"/>
  <text x="220" y="249" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">→ 15053</text>

  <!-- E7 TCP_Rule -> HTTP_Listener (7. 리다이렉트) -->
  <path d="M448,228 V312" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="412" y="260" width="72" height="12" fill="#ffffff"/>
  <text x="448" y="269" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">리다이렉트</text>

  <!-- E3 DNS_Listener -> DNS_Table (3. 조회) -->
  <path d="M256,324 H312" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="266" y="308" width="32" height="12" fill="#ffffff"/>
  <text x="282" y="317" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">조회</text>

  <!-- E4 DNS_Table -> DNS_Listener (4. 가상IP 240.240.0.1) -->
  <path d="M312,340 H256" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="262" y="344" width="46" height="12" fill="#ffffff"/>
  <text x="285" y="353" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">가상IP</text>

  <!-- E8 HTTP_Listener -> API (8. 실제 IP로 변환) -->
  <path d="M616,332 H736" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="632" y="316" width="88" height="12" fill="#ffffff"/>
  <text x="676" y="325" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">실제 IP로 변환</text>

  <!-- E-XDS Istiod -> DNS_Table (dashed, ServiceEntry 푸시) — hop over E6 at (304,164) -->
  <path d="M712,80 H316 Q308,80 308,88 V156 Q308,164 304,164 A8,8 0 0 1 296,164 Q292,164 292,172 V312"
        fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="332" y="64" width="112" height="12" fill="#ffffff"/>
  <text x="388" y="73" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">SERVICEENTRY 푸시</text>

  <!-- E-CoreDNS DNS_Listener -> CoreDNS (dashed, Istio 외부 도메인 위임) -->
  <path d="M212,352 V376 Q212,384 220,384 H700 Q708,384 708,392 V412 H736"
        fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="452" y="368" width="96" height="12" fill="#ffffff"/>
  <text x="500" y="377" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">외부 도메인 위임</text>

  <!-- ===== Nodes ===== -->

  <!-- App -->
  <rect x="88" y="76" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="88" y="76" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="188" y="100" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">애플리케이션</text>
  <text x="188" y="116" fill="#545B64" font-size="9" class="mono" text-anchor="middle">curl api.example.com</text>

  <!-- DNS_Rule -->
  <rect x="88" y="180" width="176" height="48" rx="6" fill="#ffffff"/>
  <rect x="88" y="180" width="176" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="176" y="200" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">DNS 규칙</text>
  <text x="176" y="216" fill="#545B64" font-size="9" class="mono" text-anchor="middle">UDP 53 → 15053</text>

  <!-- TCP_Rule -->
  <rect x="360" y="180" width="176" height="48" rx="6" fill="#ffffff"/>
  <rect x="360" y="180" width="176" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="448" y="200" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">TCP 규칙</text>
  <text x="448" y="216" fill="#545B64" font-size="9" class="mono" text-anchor="middle">TCP → 15001</text>

  <!-- DNS_Listener (focal) -->
  <rect x="112" y="312" width="144" height="40" rx="6" fill="#ffffff"/>
  <rect x="112" y="312" width="144" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="184" y="328" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">DNS Listener</text>
  <text x="184" y="342" fill="#EC7211" font-size="9" class="mono" text-anchor="middle">:15053</text>

  <!-- DNS_Table -->
  <rect x="312" y="312" width="144" height="40" rx="6" fill="#ffffff"/>
  <rect x="312" y="312" width="144" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="384" y="328" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">DNS 테이블</text>
  <text x="384" y="342" fill="#545B64" font-size="9" class="mono" text-anchor="middle">ServiceEntry</text>

  <!-- HTTP_Listener -->
  <rect x="472" y="312" width="144" height="40" rx="6" fill="#ffffff"/>
  <rect x="472" y="312" width="144" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="544" y="328" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">HTTP Listener</text>
  <text x="544" y="342" fill="#545B64" font-size="9" class="mono" text-anchor="middle">:15001</text>

  <!-- Istiod / xDS -->
  <rect x="712" y="52" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="712" y="52" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="812" y="76" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Istiod</text>
  <text x="812" y="92" fill="#545B64" font-size="9" class="mono" text-anchor="middle">xDS · ServiceEntry 구성</text>

  <!-- API -->
  <rect x="736" y="312" width="152" height="40" rx="6" fill="#ffffff"/>
  <rect x="736" y="312" width="152" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="812" y="328" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">api.example.com</text>
  <text x="812" y="342" fill="#545B64" font-size="9" class="mono" text-anchor="middle">실제 IP</text>

  <!-- CoreDNS -->
  <rect x="736" y="392" width="152" height="40" rx="6" fill="#ffffff"/>
  <rect x="736" y="392" width="152" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="812" y="408" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">CoreDNS</text>
  <text x="812" y="422" fill="#545B64" font-size="9" class="mono" text-anchor="middle">클러스터 DNS</text>

  <!-- ===== Legend ===== -->
  <line x1="24" y1="524" x2="936" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="24" y="540" fill="#545B64" font-size="8" class="mono" letter-spacing="0.18em">LEGEND</text>

  <rect x="24" y="552" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="44" y="560" fill="#545B64" font-size="8.5">가상 IP 조회 (Focal)</text>

  <rect x="204" y="552" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="224" y="560" fill="#545B64" font-size="8.5">iptables · 외부 DNS</text>

  <line x1="380" y1="557" x2="404" y2="557" stroke="#7D8998" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="412" y="560" fill="#545B64" font-size="8.5">비동기 · 우회 경로</text>
</svg>
