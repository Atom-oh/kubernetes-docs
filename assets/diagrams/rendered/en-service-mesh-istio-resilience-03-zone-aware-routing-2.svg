<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">How Istiod derives Pod locality from Node topology labels</title>
  <desc id="d2">Istiod's service discovery queries the topology.kubernetes.io/zone label on each Node to determine the locality of the pods running on it, without needing any zone label on the pods themselves, then pushes that locality information to Envoy via EDS.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;}</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="40" y="32" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ISTIO · CONTROL PLANE</text>
  <text x="40" y="56" fill="#232F3E" font-size="20" font-weight="700">Node-label locality discovery</text>

  <!-- Zones (bg -> zones -> arrows -> nodes) -->
  <rect x="32" y="88" width="880" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="44" y="92" width="164" height="12" rx="2" fill="#ffffff"/>
  <text x="126" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ISTIOD (CONTROL PLANE)</text>

  <rect x="32" y="380" width="280" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="44" y="384" width="132" height="12" rx="2" fill="#ffffff"/>
  <text x="110" y="393" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE · ZONE=1A</text>

  <rect x="352" y="380" width="280" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="364" y="384" width="132" height="12" rx="2" fill="#ffffff"/>
  <text x="430" y="393" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE · ZONE=1B</text>

  <!-- Arrows -->
  <!-- Discovery -> Node1 zone (left, down) exit attach x=140 -->
  <path d="M 140,184 V 220 Q 140,228 132,228 H 100 V 380"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="60" y="252" width="150" height="24" rx="2" fill="#ffffff"/>
  <text x="135" y="261" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">1. QUERY NODE</text>
  <text x="135" y="272" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">LABELS</text>

  <!-- Discovery -> Node2 zone (right, down) exit attach x=188 -->
  <path d="M 188,184 V 220 Q 188,228 196,228 H 480 V 380"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="500" y="252" width="150" height="24" rx="2" fill="#ffffff"/>
  <text x="575" y="261" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">1. QUERY NODE</text>
  <text x="575" y="272" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">LABELS</text>

  <!-- Discovery -> EDS (internal, shared y) -->
  <line x1="248" y1="152" x2="720" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="380" y="126" width="220" height="22" rx="2" fill="#ffffff"/>
  <text x="490" y="135" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">2. DETERMINE POD LOCALITY</text>
  <text x="490" y="146" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">FROM NODE ZONE LABEL</text>

  <!-- EDS -> Envoy (down, shared x) -->
  <line x1="800" y1="216" x2="800" y2="452" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="812" y="320" width="90" height="24" rx="2" fill="#ffffff"/>
  <text x="857" y="329" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">3. XDS PUSH</text>
  <text x="857" y="340" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">W/ LOCALITY</text>

  <!-- Nodes -->
  <!-- Discovery (focal) -->
  <rect x="76" y="120" width="172" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="162" y="147" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service Discovery</text>
  <text x="162" y="163" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod → node lookup</text>

  <!-- EDS -->
  <rect x="720" y="120" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="800" y="147" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">EDS Generation</text>
  <text x="800" y="163" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">endpoint discovery</text>

  <!-- Pod1, Pod2 (Node1 zone) -->
  <rect x="52" y="420" width="112" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="108" y="444" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod A</text>
  <text x="108" y="460" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no zone label</text>

  <rect x="196" y="420" width="112" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="252" y="444" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod B</text>
  <text x="252" y="460" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no zone label</text>

  <!-- Pod3 (Node2 zone) -->
  <rect x="424" y="420" width="136" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="492" y="444" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod C</text>
  <text x="492" y="460" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no zone label</text>

  <!-- Envoy (terminal) -->
  <rect x="716" y="452" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="800" y="479" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Envoy Proxy</text>
  <text x="800" y="495" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routes by locality</text>

  <!-- Legend -->
  <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <line x1="40" y1="576" x2="80" y2="576" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="88" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">READS NODE TOPOLOGY LABEL</text>
  <line x1="400" y1="576" x2="440" y2="576" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="448" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">INTERNAL / XDS FLOW</text>
</svg>