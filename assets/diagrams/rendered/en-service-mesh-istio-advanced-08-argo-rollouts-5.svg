<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d5-title d5-desc">
    <title id="d5-title">Canary rollout steps with a parallel analysis run</title>
    <desc id="d5-desc">Step 1 sets weight to 10 percent and waits two minutes, then step 2 sets weight to 30 percent, waits two minutes, and starts an AnalysisRun. That run measures every 30 seconds and can trigger an immediate rollback on failure, while the rollout continues on to step 3 which sets weight to 50 percent.</desc>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Arrows -->
    <line x1="256" y1="140" x2="256" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Step2 -> Step3 (main path continues, straight) -->
    <line x1="416" y1="212" x2="516" y2="212" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Step2 -> Analysis start (branch down) -->
    <line x1="360" y1="248" x2="360" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="368" y="270" width="98" height="12" rx="2" fill="#ffffff"/>
    <text x="417" y="279" text-anchor="middle" font-size="8" fill="#7D8998" font-family="'Geist Mono',monospace">on step start</text>
    <!-- Analysis start -> Measure -->
    <line x1="360" y1="380" x2="360" y2="416" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Measure -> Rollback -->
    <line x1="360" y1="452" x2="360" y2="488" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="368" y="458" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="428" y="467" text-anchor="middle" font-size="8" fill="#7D8998" font-family="'Geist Mono',monospace">on sample failure</text>

    <!-- Nodes -->
    <rect x="176" y="76" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="256" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Step 1: weight 10</text>
    <text x="256" y="120" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">wait 2m</text>

    <rect x="176" y="176" width="184" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="268" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Step 2: weight 30</text>
    <text x="268" y="222" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">wait 2m</text>

    <rect x="516" y="176" width="160" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="596" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Step 3: weight 50</text>
    <text x="596" y="222" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">continues rollout</text>

    <rect x="280" y="308" width="160" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="360" y="338" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Analysis start</text>
    <text x="360" y="354" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">background run</text>

    <rect x="280" y="416" width="160" height="36" rx="18" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="360" y="438" text-anchor="middle" font-size="11" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Measure every 30s</text>

    <rect x="280" y="488" width="160" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="360" y="516" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Immediate rollback</text>

    <!-- Legend -->
    <line x1="30" y1="556" x2="930" y2="556" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="572" font-size="8" letter-spacing="0.14em" fill="#545B64" font-family="'Geist Mono',monospace">LEGEND</text>
    <line x1="150" y1="569" x2="178" y2="569" stroke="#EC7211" stroke-width="1.4"/>
    <text x="186" y="572" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">main rollout path</text>
    <line x1="340" y1="569" x2="368" y2="569" stroke="#545B64" stroke-width="1.2"/>
    <text x="376" y="572" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">background analysis</text>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
  </svg>