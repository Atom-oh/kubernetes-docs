<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vc-gallery-title vc-gallery-desc">
    <title id="vc-gallery-title">Four team vClusters sharing one EKS host cluster</title>
    <desc id="vc-gallery-desc">Diagram showing four independent teams — frontend, backend, data, and ML — each running its own isolated vCluster inside one EKS host cluster, all drawing on the same shared nodes, CNI, CSI, and monitoring stack.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: EKS Host Cluster -->
    <rect x="40" y="56" width="880" height="256" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="48" y="60" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="112" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">EKS HOST CLUSTER</text>

    <!-- Team boxes -->
    <rect x="60" y="88" width="192" height="112" rx="6" fill="#ffffff"/>
    <rect x="60" y="88" width="192" height="112" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="68" y="96" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="80" y="105" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VC</text>
    <text x="156" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Frontend</text>
    <text x="156" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">React + Node.js team</text>

    <rect x="276" y="88" width="192" height="112" rx="6" fill="#ffffff"/>
    <rect x="276" y="88" width="192" height="112" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="284" y="96" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="296" y="105" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VC</text>
    <text x="372" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Backend</text>
    <text x="372" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Java + Go team</text>

    <rect x="492" y="88" width="192" height="112" rx="6" fill="#ffffff"/>
    <rect x="492" y="88" width="192" height="112" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="500" y="96" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="512" y="105" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VC</text>
    <text x="588" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Data</text>
    <text x="588" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Spark + Flink team</text>

    <rect x="708" y="88" width="192" height="112" rx="6" fill="#ffffff"/>
    <rect x="708" y="88" width="192" height="112" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="716" y="96" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="728" y="105" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VC</text>
    <text x="804" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ML</text>
    <text x="804" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PyTorch + TensorFlow team</text>

    <!-- Shared infra (focal) -->
    <rect x="60" y="232" width="840" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="232" width="840" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="68" y="240" width="40" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.55)" stroke-width="0.8"/>
    <text x="88" y="249" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INFRA</text>
    <text x="480" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Shared Infrastructure</text>
    <text x="480" y="284" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Nodes · CNI · CSI · Monitoring</text>

    <!-- Legend -->
    <line x1="30" y1="536" x2="930" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="554" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <circle cx="220" cy="550" r="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="232" y="554" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Team vCluster (isolated control plane)</text>

    <circle cx="620" cy="550" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="632" y="554" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Shared node capacity</text>
  </svg>