    <path d="M192,248 H244 Q252,248 252,256 V272 Q252,280 260,280 H612 Q620,280 620,272 V264" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Payment -> Aurora (straight) -->
    <path d="M452,224 H572" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Payment -> SNS (publish, link, dashed, 2 hops) -->
    <path d="M380,264 V272 a8,8 0 0,0 0,16 V288 Q380,296 388,296 H660 a8,8 0 0,0 16,0 H820 Q828,296 828,288 V264" fill="none" stroke="#0972D3" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

