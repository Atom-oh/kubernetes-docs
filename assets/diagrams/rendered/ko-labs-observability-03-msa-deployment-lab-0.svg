<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="msa-arch-title msa-arch-desc">
    <title id="msa-arch-title">MSA 배포 아키텍처</title>
    <desc id="msa-arch-desc">API 게이트웨이가 주문·결제 서비스로 요청을 분배하고, 각 서비스가 Aurora PostgreSQL에 기록하며 SQS·SNS로 비동기 이벤트를 발행하고, MWAA가 트리거하는 분석 배치가 다시 Aurora에 기록하는 흐름을 보여준다.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      </style>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> labels -> nodes) -->
    <rect x="24" y="32" width="472" height="464" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="140" y="36" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">SERVICE CLUSTER</text>

    <rect x="540" y="32" width="380" height="464" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="670" y="36" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="710" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">AWS SERVICES</text>

    <!-- ===== Arrows (drawn before nodes) ===== -->

    <!-- APIGW -> Order -->
    <path d="M244,144 V156 Q244,164 236,164 H128 Q120,164 120,172 V184" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- APIGW -> Payment -->
    <path d="M292,144 V156 Q292,164 300,164 H372 Q380,164 380,172 V184" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Order -> SQS (publish, link) -->
    <path d="M192,200 H466 Q474,200 474,192 V112 Q474,104 482,104 H756" fill="none" stroke="#0972D3" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

