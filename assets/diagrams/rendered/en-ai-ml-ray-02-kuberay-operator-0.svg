<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kuberay-title kuberay-desc">
  <title id="kuberay-title">KubeRay Operator Reconciliation and Autoscaling Loop</title>
  <desc id="kuberay-desc">The KubeRay Operator reconciles a RayCluster custom resource into a Head Pod and CPU/GPU worker group pods. The Ray Autoscaler monitors worker group load, requests more replicas back on the RayCluster spec, and signals pending Pods to Karpenter, which provisions matching EC2 nodes for the worker groups.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="28" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.18em">KUBERAY OPERATOR</text>
  <text x="40" y="50" fill="#232F3E" font-size="20" font-weight="700">Reconciliation &amp; autoscaling loop</text>
  <line x1="40" y1="64" x2="920" y2="64" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>

  <!-- ===== Arrows (drawn before boxes) ===== -->

  <!-- RC -> OP -->
  <path d="M200,252 H280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- OP -> HP (up, bottom entry) -->
  <path d="M440,236 H632 Q640,236 640,228 V144" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- OP -> WG1 (straight, shared y) -->
  <path d="M440,252 H560" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- OP -> WG2 (down, top entry) -->
  <path d="M440,268 H632 Q640,268 640,276 V340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- WG1 -.monitored by.-> RA -->
  <path d="M720,252 H752 Q760,252 760,260 V311 Q760,319 768,319 H800" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="724" y="270" width="70" height="12" rx="2" fill="#ffffff"/>
  <text x="759" y="279" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">MONITORED BY</text>

  <!-- WG2 -.monitored by.-> RA -->
  <path d="M720,372 H752 Q760,372 760,364 V345 Q760,337 768,337 H800" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="724" y="352" width="70" height="12" rx="2" fill="#ffffff"/>
  <text x="759" y="361" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">MONITORED BY</text>

  <!-- RA -> KP (straight vertical, pending Pods) -->
  <path d="M872,356 V436" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="880" y="388" width="84" height="12" rx="2" fill="#ffffff"/>
  <text x="922" y="397" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">PENDING PODS</text>

  <!-- RA -> RC feedback loop (requests more replicas) -->
  <path d="M872,300 V72 Q872,64 864,64 H128 Q120,64 120,72 V220" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="196" y="52" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="240" y="61" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">SCALE REQUEST</text>

  <!-- KP -> WG1 (provisions EC2 nodes, bottom entry) -->
  <path d="M800,457 H632 Q624,457 624,449 V284" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="558" y="412" width="84" height="12" rx="2" fill="#ffffff"/>
  <text x="600" y="421" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">NEW EC2 NODES</text>

  <!-- KP -> WG2 (provisions EC2 nodes, bottom entry) -->
  <path d="M800,479 H648 Q656,479 656,471 V404" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="664" y="482" width="84" height="12" rx="2" fill="#ffffff"/>
  <text x="706" y="491" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">NEW EC2 NODES</text>

  <!-- ===== Nodes ===== -->

  <!-- RC: RayCluster CR (store treatment) -->
  <rect x="40" y="220" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="40" y="220" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="48" y="226" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
  <text x="62" y="235" fill="#545B64" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">CR</text>
  <text x="120" y="256" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">RayCluster CR</text>
  <text x="120" y="272" fill="#545B64" font-size="9" class="mono" text-anchor="middle">head + worker specs</text>

  <!-- OP: KubeRay Operator (focal) -->
  <rect x="280" y="220" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="280" y="220" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="288" y="226" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.40)" stroke-width="0.8"/>
  <text x="302" y="235" fill="#EC7211" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">OPR</text>
  <text x="360" y="256" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">KubeRay Operator</text>
  <text x="360" y="272" fill="#545B64" font-size="9" class="mono" text-anchor="middle">reconciles</text>

  <!-- HP: Head Pod -->
  <rect x="560" y="88" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="560" y="88" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="568" y="94" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="582" y="103" fill="#232F3E" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">POD</text>
  <text x="640" y="122" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Head Pod</text>

  <!-- WG1: CPU Worker Group -->
  <rect x="560" y="220" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="560" y="220" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="568" y="226" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="582" y="235" fill="#232F3E" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">CPU</text>
  <text x="640" y="256" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">CPU Worker Group</text>
  <text x="640" y="272" fill="#545B64" font-size="9" class="mono" text-anchor="middle">pods</text>

  <!-- WG2: GPU Worker Group -->
  <rect x="560" y="340" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="560" y="340" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="568" y="346" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="582" y="355" fill="#232F3E" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">GPU</text>
  <text x="640" y="376" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">GPU Worker Group</text>
  <text x="640" y="392" fill="#545B64" font-size="9" class="mono" text-anchor="middle">pods</text>

  <!-- RA: Ray Autoscaler -->
  <rect x="800" y="300" width="144" height="56" rx="6" fill="#ffffff"/>
  <rect x="800" y="300" width="144" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="808" y="306" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
  <text x="822" y="315" fill="#545B64" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">AS</text>
  <text x="872" y="332" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Ray Autoscaler</text>

  <!-- KP: Karpenter (focal) -->
  <rect x="800" y="436" width="144" height="64" rx="6" fill="#ffffff"/>
  <rect x="800" y="436" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="808" y="442" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.40)" stroke-width="0.8"/>
  <text x="822" y="451" fill="#EC7211" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">KRP</text>
  <text x="872" y="472" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Karpenter</text>
  <text x="872" y="488" fill="#545B64" font-size="9" class="mono" text-anchor="middle">EC2 node provisioning</text>

  <!-- Legend -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="552" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
  <line x1="140" y1="548" x2="176" y2="548" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="184" y="552" fill="#545B64" font-size="9" class="mono">reconcile / scale flow</text>
  <line x1="380" y1="548" x2="416" y2="548" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="424" y="552" fill="#545B64" font-size="9" class="mono">autoscaler monitoring signal</text>
</svg>