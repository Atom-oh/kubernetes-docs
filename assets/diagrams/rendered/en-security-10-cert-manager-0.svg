<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="cm-arch-title cm-arch-desc">
    <title id="cm-arch-title">cert-manager control plane architecture</title>
    <desc id="cm-arch-desc">Architecture diagram showing the cert-manager control plane watching Certificate and Issuer custom resources, requesting signed certificates from an external CA, and writing the result into a TLS Secret that Ingress and Gateway resources reference.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="76" width="880" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="452" y="80" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="500" y="89" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE</text>

    <rect x="440" y="220" width="480" height="96" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="628" y="224" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="680" y="233" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CUSTOM RESOURCES</text>

    <rect x="200" y="348" width="544" height="96" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="392" y="352" width="160" height="12" rx="2" fill="#ffffff"/>
    <text x="472" y="361" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KUBERNETES RESOURCES</text>

    <!-- Arrows (behind nodes) -->
    <!-- Row1: API -> Webhook -->
    <line x1="224" y1="132" x2="280" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="232" y="120" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="252" y="129" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">VALID</text>

    <!-- cainjector -> Webhook (dip, band y=176) -->
    <path d="M 768,156 V 168 Q 768,176 760,176 H 368 Q 360,176 360,168 V 156"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="532" y="158" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="564" y="167" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">INJECTS CA</text>

    <!-- cainjector -> API (dip, band y=196) -->
    <path d="M 864,156 V 188 Q 864,196 856,196 H 152 Q 144,196 144,188 V 156"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="472" y="178" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="504" y="187" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">INJECTS CA</text>

    <!-- cert-manager Controller -> Certificate Resources: straight (shared x=576) -->
    <line x1="576" y1="156" x2="576" y2="252" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="584" y="196" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="636" y="205" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WATCHES/CREATES</text>

    <!-- Certificate Resources -> Issuer Resources: adjacent, straight -->
    <line x1="688" y1="276" x2="744" y2="276" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="698" y="264" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="716" y="273" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SIGNS</text>

    <!-- Issuer Resources -> External CA: straight (shared x=832) -->
    <line x1="832" y1="300" x2="832" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="840" y="330" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="876" y="339" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ISSUES VIA</text>

    <!-- cert-manager Controller -> TLS Secret: turn then straight down x=360 -->
    <path d="M 616,156 V 204 Q 616,212 608,212 H 368 Q 360,212 360,220 V 380"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="368" y="320" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="412" y="329" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CREATES SECRET</text>

    <!-- Ingress/Gateway -> TLS Secret: adjacent, straight, pointing left -->
    <line x1="520" y1="404" x2="480" y2="404" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="488" y="392" width="24" height="12" rx="2" fill="#ffffff"/>
    <text x="500" y="401" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REF</text>

    <!-- Node: API Server (external) -->
    <rect x="64" y="108" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="64" y="108" width="160" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="72" y="116" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="86" y="125" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
    <text x="144" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">API Server</text>

    <!-- Node: Webhook Server -->
    <rect x="280" y="108" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="280" y="108" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="288" y="116" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="302" y="125" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="360" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Webhook Server</text>

    <!-- Node: cert-manager Controller (focal) -->
    <rect x="496" y="108" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="496" y="108" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="504" y="116" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="518" y="125" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTL</text>
    <text x="576" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">cert-manager Controller</text>

    <!-- Node: cainjector -->
    <rect x="736" y="108" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="736" y="108" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="744" y="116" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="758" y="125" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTL</text>
    <text x="816" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">cainjector</text>

    <!-- Node: Certificate Resources -->
    <rect x="464" y="252" width="224" height="48" rx="6" fill="#ffffff"/>
    <rect x="464" y="252" width="224" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="472" y="260" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="489" y="269" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRD</text>
    <text x="576" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Certificate Resources</text>

    <!-- Node: Issuer Resources -->
    <rect x="744" y="252" width="176" height="48" rx="6" fill="#ffffff"/>
    <rect x="744" y="252" width="176" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="752" y="260" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="769" y="269" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRD</text>
    <text x="832" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Issuer Resources</text>

    <!-- Node: External CA (external) -->
    <rect x="744" y="380" width="176" height="48" rx="6" fill="#ffffff"/>
    <rect x="744" y="380" width="176" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="752" y="388" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="769" y="397" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="832" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">External CA</text>
    <text x="832" y="418" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LE / Vault / PCA</text>

    <!-- Node: TLS Secret (store) -->
    <rect x="240" y="380" width="240" height="48" rx="6" fill="#ffffff"/>
    <rect x="240" y="380" width="240" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="248" y="388" width="30" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="263" y="397" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEC</text>
    <text x="360" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">TLS Secret</text>

    <!-- Node: Ingress / Gateway -->
    <rect x="520" y="380" width="200" height="48" rx="6" fill="#ffffff"/>
    <rect x="520" y="380" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="528" y="388" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="543" y="397" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NET</text>
    <text x="620" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Ingress / Gateway</text>

    <!-- Legend -->
    <line x1="40" y1="484" x2="920" y2="484" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="500" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="512" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="520" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Focal controller</text>

    <rect x="200" y="512" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="520" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Controller / resource</text>

    <rect x="392" y="512" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="412" y="520" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Store</text>

    <rect x="490" y="512" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="510" y="520" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">External</text>

    <line x1="620" y1="518" x2="648" y2="518" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="656" y="520" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Reference</text>
  </svg>