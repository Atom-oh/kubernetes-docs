<title id="en-service-mesh-istio-02-basic-concepts-10-title">Envoy-generated Metrics, Traces, and Logs</title>
<desc id="en-service-mesh-istio-02-basic-concepts-10-desc">Diagram showing an application's traffic passing through its Envoy sidecar, which emits metrics to Prometheus, traces to Jaeger, and entries to a logging system, feeding Grafana dashboards, the Jaeger UI, and Kiali's service mesh dashboard.</desc>
