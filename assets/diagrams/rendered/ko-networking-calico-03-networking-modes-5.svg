<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crosssubnet-title crosssubnet-desc">
    <title id="crosssubnet-title">CrossSubnet 모드의 서브넷 내/외부 라우팅</title>
    <desc id="crosssubnet-desc">같은 서브넷의 노드 간에는 캡슐화 없이 직접 통신하고, 다른 서브넷의 노드 간에는 IPIP 또는 VXLAN으로 캡슐화하여 통신하는 CrossSubnet 모드의 동작을 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="144" y="68" width="592" height="116" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="352" y="72" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="440" y="81" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SUBNET A · 10.0.1.0/24</text>

    <rect x="144" y="388" width="592" height="116" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="352" y="392" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="440" y="401" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SUBNET B · 10.0.2.0/24</text>

    <!-- Arrows (before boxes) -->
    <!-- N1 <-> N2 (direct, same subnet) -->
    <line x1="320" y1="132" x2="560" y2="132" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <rect x="420" y="112" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="440" y="121" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DIRECT</text>

    <!-- N3 <-> N4 (direct, same subnet) -->
    <line x1="320" y1="452" x2="560" y2="452" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <rect x="420" y="432" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="440" y="441" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DIRECT</text>

    <!-- N1 <-> N3 (encapsulated, cross-subnet) -->
    <line x1="240" y1="164" x2="240" y2="420" stroke="#EC7211" stroke-width="1.2" marker-start="url(#arrow-accent-rev)" marker-end="url(#arrow-accent)"/>
    <rect x="248" y="286" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="270" y="295" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENCAP</text>

    <!-- N2 <-> N4 (encapsulated, cross-subnet) -->
    <line x1="640" y1="164" x2="640" y2="420" stroke="#EC7211" stroke-width="1.2" marker-start="url(#arrow-accent-rev)" marker-end="url(#arrow-accent)"/>
    <rect x="648" y="286" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="670" y="295" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENCAP</text>

    <!-- Node boxes: N1 -->
    <rect x="160" y="100" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="160" y="100" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Node 1</text>
    <text x="240" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.1.10</text>

    <!-- N2 -->
    <rect x="560" y="100" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="560" y="100" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="640" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Node 2</text>
    <text x="640" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.1.11</text>

    <!-- N3 -->
    <rect x="160" y="420" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="160" y="420" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="448" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Node 3</text>
    <text x="240" y="464" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.2.10</text>

    <!-- N4 -->
    <rect x="560" y="420" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="560" y="420" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="640" y="448" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Node 4</text>
    <text x="640" y="464" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.2.11</text>

    <!-- Legend -->
    <line x1="144" y1="540" x2="816" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="144" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="324" y1="552" x2="348" y2="552" stroke="#545B64" stroke-width="1.2"/>
    <text x="358" y="556" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">DIRECT — 같은 서브넷, 캡슐화 없음</text>
    <line x1="584" y1="552" x2="608" y2="552" stroke="#EC7211" stroke-width="1.2"/>
    <text x="618" y="556" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">ENCAP — 다른 서브넷, IPIP/VXLAN</text>
  </svg>
