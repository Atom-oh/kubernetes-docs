<title id="en-service-mesh-istio-02-basic-concepts-13-title">Gradual Migration from VM to Kubernetes</title>
<desc id="en-service-mesh-istio-02-basic-concepts-13-desc">Diagram showing a four-phase migration: a standalone legacy VM, the same VM registered into the mesh with Envoy, a hybrid phase where the remaining legacy VM module talks over mTLS to new Kubernetes microservices, and a final phase fully migrated to Kubernetes.</desc>
