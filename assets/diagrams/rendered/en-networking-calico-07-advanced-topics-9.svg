<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calico-rr-topology-title calico-rr-topology-desc">
    <title id="calico-rr-topology-title">BGP route reflector topology</title>
    <desc id="calico-rr-topology-desc">Instead of a full BGP mesh, one route reflector per zone peers with the other reflectors, and every regular node in its zone peers only with its own zone's reflector.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Route Reflector Tier zone -->
    <rect x="120" y="68" width="720" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="128" y="72" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="204" y="81" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">ROUTE REFLECTOR TIER</text>

    <!-- RR mesh connectors -->
    <line x1="300" y1="128" x2="400" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <line x1="560" y1="128" x2="660" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <path d="M 220,100 V 52 Q 220,44 228,44 H 732 Q 740,44 740,52 V 100" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>

    <!-- zone -> RR connectors -->
    <line x1="220" y1="280" x2="220" y2="156" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="280" x2="480" y2="156" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="740" y1="280" x2="740" y2="156" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- RR 1 -->
    <rect x="140" y="100" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="140" y="100" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="124" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">RR 1</text>
    <text x="220" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">zone A</text>

    <!-- RR 2 -->
    <rect x="400" y="100" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="100" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="124" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">RR 2</text>
    <text x="480" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">zone B</text>

    <!-- RR 3 -->
    <rect x="660" y="100" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="660" y="100" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="740" y="124" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">RR 3</text>
    <text x="740" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">zone C</text>

    <!-- Zone A nodes (representative) -->
    <rect x="140" y="280" width="160" height="72" rx="6" fill="#ffffff"/>
    <rect x="140" y="280" width="160" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="220" y="312" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Zone A nodes</text>
    <text x="220" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">~300 nodes</text>

    <!-- Zone B nodes -->
    <rect x="400" y="280" width="160" height="72" rx="6" fill="#ffffff"/>
    <rect x="400" y="280" width="160" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="312" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Zone B nodes</text>
    <text x="480" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">~350 nodes</text>

    <!-- Zone C nodes -->
    <rect x="660" y="280" width="160" height="72" rx="6" fill="#ffffff"/>
    <rect x="660" y="280" width="160" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="740" y="312" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Zone C nodes</text>
    <text x="740" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">~350 nodes</text>
  </svg>