<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="amb07-title amb07-desc">
<title id="amb07-title">HBONE 프로토콜: 평문 트래픽의 터널링 구조</title>
<desc id="amb07-desc">애플리케이션이 보낸 평문 TCP 트래픽이 출발지 ztunnel에서 HBONE(HTTP/2 기반 mTLS) 터널로 감싸져 네트워크를 통과한 뒤, 도착지 ztunnel에서 다시 평문으로 풀려 대상 앱에 전달되는 과정을 보여주는 다이어그램.</desc>
