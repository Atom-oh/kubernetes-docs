<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mc-p2-title mc-p2-desc">
<title id="mc-p2-title">VPC Lattice only pattern</title>
<desc id="mc-p2-desc">App services in two separate VPCs each register as a VPC Lattice service, and both services route through a shared Lattice service network instead of an Istio mesh.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- zones -->
<rect x="80" y="140" width="200" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="92" y="144" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="152" y="153" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">VPC 1 · US-EAST-1</text>

<rect x="680" y="140" width="200" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="692" y="144" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="752" y="153" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">VPC 2 · US-WEST-2</text>

<rect x="340" y="120" width="280" height="180" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.40)" stroke-width="0.8" stroke-dasharray="4,4"/>
<rect x="352" y="124" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="427" y="133" fill="#EC7211" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">AWS VPC LATTICE</text>

<!-- arrows -->
<path d="M 240,200 H 352 Q 360,200 360,192 V 184 H 368" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="270" y="182" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="300" y="191" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.02em">REGISTER</text>

<path d="M 720,200 H 608 Q 600,200 600,192 V 184 H 592" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="630" y="182" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="660" y="191" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.02em">REGISTER</text>

<line x1="424" y1="204" x2="424" y2="240" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<line x1="536" y1="204" x2="536" y2="240" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="453" y="216" width="54" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="225" fill="#EC7211" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.02em">ROUTE</text>

<!-- nodes -->
<rect x="120" y="180" width="120" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="180" y="204" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">App services</text>

<rect x="720" y="180" width="120" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="780" y="204" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">App services</text>

<rect x="368" y="164" width="112" height="40" rx="6" fill="#ffffff" stroke="#EC7211" stroke-width="1"/>
<text x="424" y="180" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Service 1</text>
<text x="424" y="194" fill="#545B64" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle">lattice svc</text>

<rect x="480" y="164" width="112" height="40" rx="6" fill="#ffffff" stroke="#EC7211" stroke-width="1"/>
<text x="536" y="180" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Service 2</text>
<text x="536" y="194" fill="#545B64" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle">lattice svc</text>

<rect x="380" y="240" width="200" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="480" y="260" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Service network</text>
<text x="480" y="274" fill="#545B64" font-family="'Geist Mono',monospace" font-size="9" text-anchor="middle">shared routing plane</text>

<!-- legend -->
<line x1="30" y1="440" x2="930" y2="440" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="30" y="456" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="130" y="448" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="150" y="456" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">SERVICE NETWORK (FOCAL)</text>
<line x1="400" y1="453" x2="424" y2="453" stroke="#545B64" stroke-width="1.2"/>
<text x="432" y="456" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">REGISTRATION</text>
<line x1="620" y1="453" x2="644" y2="453" stroke="#EC7211" stroke-width="1.4"/>
<text x="652" y="456" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">TRAFFIC ROUTING</text>
</svg>
