<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
    <title id="dtitle">ConfigMap Consumption Modes</title>
    <desc id="ddesc">Diagram showing a ConfigMap's key-value data consumed by Pods in three ways -- as environment variables, as a mounted volume, or as command-line arguments -- with the environment-variable and volume paths shown resolving into concrete values inside the container.</desc>
