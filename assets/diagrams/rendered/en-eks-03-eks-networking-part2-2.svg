<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Application Load Balancer Ingress Path</title>
<desc id="d">Internet traffic reaches an ALB in the VPC's public subnet, which is driven by the AWS Load Balancer Controller and an Ingress resource in the private-subnet EKS cluster to route to Service 1 and Service 2 and their backing pods.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<text x="40" y="44" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">ARCHITECTURE · INGRESS</text>
<text x="40" y="68" fill="#232F3E" font-size="20" font-weight="700">Application Load Balancer Ingress Path</text>

<!-- zones: VPC outer, Public Subnet, Private Subnet/EKS Cluster -->
<rect x="176" y="96" width="744" height="464" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="200" y="104" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="220" y="113" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">VPC</text>

<rect x="216" y="140" width="672" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="240" y="148" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="304" y="157" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">PUBLIC SUBNET</text>

<rect x="216" y="288" width="672" height="248" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="240" y="296" width="216" height="12" rx="2" fill="#ffffff"/>
<text x="348" y="305" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">PRIVATE SUBNET · EKS CLUSTER</text>

<!-- Internet node outside VPC -->
<rect x="40" y="176" width="120" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="100" y="204" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Internet</text>
<text x="100" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">clients</text>

<!-- ALB (focal) in public subnet -->
<rect x="392" y="168" width="152" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="468" y="196" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">ALB</text>
<text x="468" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">public-facing</text>

<!-- Private subnet contents -->
<rect x="240" y="320" width="152" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="316" y="346" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">LBC</text>
<text x="316" y="362" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">AWS LB Controller</text>

<rect x="424" y="320" width="152" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="500" y="346" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Ingress</text>
<text x="500" y="362" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">resource</text>

<rect x="608" y="320" width="132" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="674" y="346" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service 1</text>
<text x="674" y="362" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">svc</text>

<rect x="756" y="320" width="132" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="822" y="346" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service 2</text>
<text x="822" y="362" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">svc</text>

<rect x="608" y="452" width="132" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="674" y="478" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod 1</text>
<text x="674" y="494" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">backend</text>

<rect x="756" y="452" width="132" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="822" y="478" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod 2</text>
<text x="822" y="494" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">backend</text>

<!-- arrows -->
<path d="M 160,208 H 392" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 468,232 V 288 Q 468,296 476,296 H 492 Q 500,296 500,304 V 320" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 340,320 V 300 Q 340,292 348,292 H 424 Q 432,292 432,284 V 232" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 576,344 H 608" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 500,380 V 400 Q 500,408 508,408 H 660 Q 668,408 668,416 V 452" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 500,380 V 428 Q 500,436 508,436 H 808 Q 816,436 816,444 V 452" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 674,380 V 452" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 822,380 V 452" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- label for LBC -> ALB (control) -->
<rect x="286" y="252" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="322" y="261" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">RECONCILES</text>

</svg>