<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2title d2desc">
  <title id="d2title">오퍼레이터 패턴 작동 방식</title>
  <desc id="d2desc">사용자가 만든 커스텀 리소스를 오퍼레이터의 컨트롤러가 감시·상태 확인하며 필요한 조치를 실행해 실제 Kubernetes 리소스에 반영하고 다시 커스텀 리소스 상태를 갱신하는 조정 루프를 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="28" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.18em">ARCHITECTURE · OPERATOR PATTERN</text>
  <text x="40" y="50" fill="#232F3E" font-size="16" font-weight="700" class="sans">오퍼레이터 패턴 작동 방식</text>
  <text x="40" y="66" fill="#545B64" font-size="10" class="sans">컨트롤러가 커스텀 리소스를 감시하며 실제 상태를 원하는 상태로 조정한다</text>

  <!-- ============ Zones ============ -->
  <rect x="336" y="84" width="304" height="80" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="352" y="88" width="152" height="12" rx="2" fill="#ffffff"/>
  <text x="428" y="97" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">KUBERNETES API 서버</text>

  <rect x="200" y="296" width="280" height="80" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="344" y="300" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="388" y="309" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">오퍼레이터</text>

  <!-- ============ Arrows ============ -->
  <!-- User -> CR (1. 생성/수정) -->
  <path d="M192,132 H352" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="244" y="112" width="56" height="12" fill="#ffffff"/>
  <text x="272" y="121" fill="#545B64" font-size="8" class="mono" text-anchor="middle">1. 생성/수정</text>

  <!-- CR -> STOR (저장) -->
  <path d="M472,132 H512" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="478" y="112" width="28" height="12" fill="#ffffff"/>
  <text x="492" y="121" fill="#545B64" font-size="8" class="mono" text-anchor="middle">저장</text>

  <!-- CTRL -> CR (2. 감시) -->
  <path d="M266,328 V218 Q266,210 274,210 H374 Q382,210 382,202 V148" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="330" y="154" width="44" height="12" fill="#ffffff"/>
  <text x="352" y="163" fill="#545B64" font-size="8" class="mono" text-anchor="middle">2. 감시</text>

  <!-- CTRL -> CR (3. 상태 확인) -->
  <path d="M300,328 V226 Q300,218 308,218 H404 Q412,218 412,210 V148" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="340" y="174" width="64" height="12" fill="#ffffff"/>
  <text x="372" y="183" fill="#545B64" font-size="8" class="mono" text-anchor="middle">3. 상태 확인</text>

  <!-- CTRL -> CR (6. 상태 업데이트, dashed return) -->
  <path d="M334,328 V234 Q334,226 342,226 H434 Q442,226 442,218 V148" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="362" y="194" width="72" height="12" fill="#ffffff"/>
  <text x="398" y="203" fill="#545B64" font-size="8" class="mono" text-anchor="middle">6. 상태 업데이트</text>

  <!-- CTRL -> ACT (4. 조치 결정, accent headline) -->
  <path d="M368,344 H568" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="440" y="324" width="56" height="12" fill="#ffffff"/>
  <text x="468" y="333" fill="#EC7211" font-size="8" class="mono" text-anchor="middle">4. 조치 결정</text>

  <!-- ACT -> K8S (5. 실행) -->
  <path d="M700,344 H748" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="706" y="324" width="36" height="12" fill="#ffffff"/>
  <text x="724" y="333" fill="#545B64" font-size="8" class="mono" text-anchor="middle">5. 실행</text>

  <!-- ============ Nodes ============ -->
  <!-- User -->
  <rect x="56" y="116" width="136" height="32" rx="6" fill="#ffffff"/>
  <rect x="56" y="116" width="136" height="32" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="124" y="136" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">사용자</text>

  <!-- CR (focal) -->
  <rect x="352" y="116" width="120" height="32" rx="6" fill="#ffffff"/>
  <rect x="352" y="116" width="120" height="32" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="412" y="136" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">커스텀 리소스</text>

  <!-- STOR etcd -->
  <rect x="512" y="116" width="112" height="32" rx="6" fill="#ffffff"/>
  <rect x="512" y="116" width="112" height="32" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="568" y="136" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">etcd 스토리지</text>

  <!-- CTRL 컨트롤러 -->
  <rect x="232" y="328" width="136" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="300" y="348" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">컨트롤러</text>

  <!-- ACT 액션 -->
  <rect x="568" y="328" width="132" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="634" y="348" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">액션</text>

  <!-- K8S 리소스 -->
  <rect x="748" y="328" width="152" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="824" y="348" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">Kubernetes 리소스</text>

  <!-- Legend -->
  <line x1="40" y1="460" x2="920" y2="460" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="476" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
  <circle cx="220" cy="472" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="232" y="476" fill="#545B64" font-size="9" class="sans">조정 대상 커스텀 리소스</text>
  <circle cx="440" cy="472" r="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="452" y="476" fill="#545B64" font-size="9" class="sans">저장소</text>
  <circle cx="560" cy="472" r="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="572" y="476" fill="#545B64" font-size="9" class="sans">오퍼레이터/리소스</text>
</svg>