<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ebpf-arch-title ebpf-arch-desc">
<title id="ebpf-arch-title">eBPF 아키텍처: 사용자 공간에서 커널 훅까지</title>
<desc id="ebpf-arch-desc">사용자 공간의 로더가 eBPF 프로그램을 커널의 검증기에 전달하면, 검증기·JIT 컴파일러를 거쳐 eBPF 가상 머신이 이를 실행하고, 이 가상 머신이 다양한 커널 훅 포인트에 연결되며 eBPF 맵을 통해 사용자 공간과 데이터를 주고받는 구조를 보여준다.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    text{font-family:'Amazon Ember','Noto Sans CJK KR','Helvetica Neue',Helvetica,Arial,sans-serif;}
    .mono{font-family:'Geist Mono','Noto Sans Mono CJK KR','Amazon Ember Mono',ui-monospace,monospace;}
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
  <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="640" fill="#ffffff"/>

<!-- zones -->
<rect x="24" y="24" width="912" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="36" y="28" width="176" height="12" rx="2" fill="#ffffff"/>
<text x="124" y="37" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">사용자 공간 (USER SPACE)</text>

<rect x="24" y="188" width="912" height="372" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="36" y="192" width="164" height="12" rx="2" fill="#ffffff"/>
<text x="118" y="201" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">커널 공간 (KERNEL SPACE)</text>

<!-- ===== arrows (drawn before boxes) ===== -->

<!-- App -> Loader (straight, same y) -->
<line x1="188" y1="96" x2="252" y2="96" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Loader -> Verifier (straight vertical, label beside) -->
<line x1="362" y1="128" x2="362" y2="236" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="372" y="176" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="410" y="185" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">프로그램 로드</text>

<!-- Verifier -> JIT (straight horizontal, accent — validation gate) -->
<line x1="444" y1="268" x2="488" y2="268" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="446" y="248" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="466" y="257" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">검증 통과</text>

<!-- JIT -> VM (straight horizontal) -->
<line x1="628" y1="268" x2="700" y2="268" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="634" y="248" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="664" y="257" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">최적화된 코드</text>

<!-- VM -> HookGroup (straight vertical) -->
<line x1="820" y1="300" x2="820" y2="428" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="784" y="356" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="820" y="365" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">훅 실행</text>

<!-- VM <-> Maps (elbow, bidir) -->
<path d="M760,300 V356 Q760,364 752,364 H388 Q380,364 380,372 V428"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="534" y="344" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="570" y="353" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">데이터 교환</text>

<!-- App <-> Maps (elbow, bidir, crosses zone gap) -->
<path d="M118,128 V452 Q118,460 126,460 H280"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="132" y="284" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="168" y="293" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">데이터 교환</text>

<!-- ===== nodes ===== -->

<!-- App (input) -->
<rect x="48" y="64" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="48" y="64" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="118" y="98" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">애플리케이션</text>
<text x="118" y="114" fill="#545B64" font-size="9" class="mono" text-anchor="middle">user-space app</text>

<!-- Loader (backend) -->
<rect x="252" y="64" width="220" height="64" rx="6" fill="#ffffff"/>
<rect x="252" y="64" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="362" y="94" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">로더</text>
<text x="362" y="110" fill="#545B64" font-size="9" class="mono" text-anchor="middle">libbpf · BCC · bpftrace</text>

<!-- Dev toolchain (optional / side path, dashed) -->
<rect x="536" y="64" width="300" height="64" rx="6" fill="#ffffff"/>
<rect x="536" y="64" width="300" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="686" y="94" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">컴파일 도구체인</text>
<text x="686" y="110" fill="#545B64" font-size="9" class="mono" text-anchor="middle">Clang → LLVM → BTF</text>

<!-- Verifier (backend, safety gate) -->
<rect x="280" y="236" width="164" height="64" rx="6" fill="#ffffff"/>
<rect x="280" y="236" width="164" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="362" y="266" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">eBPF 검증기</text>
<text x="362" y="282" fill="#545B64" font-size="9" class="mono" text-anchor="middle">safety verifier</text>

<!-- JIT (backend) -->
<rect x="488" y="236" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="488" y="236" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="558" y="266" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">JIT 컴파일러</text>
<text x="558" y="282" fill="#545B64" font-size="9" class="mono" text-anchor="middle">native codegen</text>

<!-- VM (focal) -->
<rect x="700" y="236" width="180" height="64" rx="6" fill="#ffffff"/>
<rect x="700" y="236" width="180" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="790" y="266" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">eBPF 가상 머신</text>
<text x="790" y="282" fill="#545B64" font-size="9" class="mono" text-anchor="middle">program execution</text>

<!-- Maps (store) -->
<rect x="280" y="428" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="280" y="428" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="380" y="458" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">eBPF 맵</text>
<text x="380" y="474" fill="#545B64" font-size="9" class="mono" text-anchor="middle">hash · array · ringbuf …</text>

<!-- Hook points (external, merged group) -->
<rect x="710" y="428" width="220" height="64" rx="6" fill="#ffffff"/>
<rect x="710" y="428" width="220" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="820" y="458" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">훅 포인트</text>
<text x="820" y="474" fill="#545B64" font-size="9" class="mono" text-anchor="middle">XDP·TC·kprobe·tracepoint…</text>

<!-- legend -->
<line x1="30" y1="580" x2="930" y2="580" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="30" y="596" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
<circle cx="150" cy="592" r="4" fill="#EC7211"/>
<text x="160" y="596" fill="#545B64" font-size="9" class="mono">핵심 실행 엔진</text>
<circle cx="290" cy="592" r="4" fill="none" stroke="#232F3E"/>
<text x="300" y="596" fill="#545B64" font-size="9" class="mono">실행 파이프라인</text>
<circle cx="440" cy="592" r="4" fill="rgba(35,47,62,0.05)" stroke="#545B64"/>
<text x="450" y="596" fill="#545B64" font-size="9" class="mono">데이터 저장</text>
<circle cx="570" cy="592" r="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)"/>
<text x="580" y="596" fill="#545B64" font-size="9" class="mono">외부/커널 훅</text>
<circle cx="720" cy="592" r="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)"/>
<text x="730" y="596" fill="#545B64" font-size="9" class="mono">선택적 컴파일 경로</text>
</svg>