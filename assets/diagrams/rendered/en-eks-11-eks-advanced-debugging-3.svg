<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-eks-11-eks-advanced-debugging-3-title en-eks-11-eks-advanced-debugging-3-desc">
<title id="en-eks-11-eks-advanced-debugging-3-title">Failure Detection Pipeline</title>
<desc id="en-eks-11-eks-advanced-debugging-3-desc">Four-layer failure-detection pipeline for EKS observability: raw metrics, logs, traces, and events are gathered by CloudWatch Agent, Fluent Bit, the ADOT Collector, and Prometheus, analyzed via CloudWatch Logs Insights, metric alarms, anomaly detection, and composite alarms, and finally routed to SNS, Slack, PagerDuty, or EventBridge for alerting.</desc>
