    <title id="ko-core-04-storage-9-title">EKS의 EBS · EFS · FSx for Lustre 스토리지 경로</title>
    <desc id="ko-core-04-storage-9-desc">Amazon EKS에서 EBS·EFS·FSx for Lustre 세 관리형 스토리지가 각각 전용 CSI 드라이버와 StorageClass, PersistentVolume을 거쳐 서로 다른 접근 모드의 파드에 연결되는 병렬 구조를 보여준다.</desc>
