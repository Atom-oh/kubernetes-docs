<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="ekslog-title ekslog-desc">
    <title id="ekslog-title">EKS 컨테이너 로깅 흐름</title>
    <desc id="ekslog-desc">워커 노드의 컨테이너 표준출력이 kubelet을 거쳐 로그 에이전트로 모이고, 그 에이전트가 CloudWatch Logs, Amazon OpenSearch, Amazon S3 세 곳으로 로그를 분산 전달하는 흐름을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: 워커 노드 -->
    <rect x="24" y="80" width="472" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="216" y="84" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="260" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">워커 노드</text>

    <!-- Arrows -->
    <line x1="216" y1="168" x2="256" y2="168" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="424" y1="168" x2="552" y2="168" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 720,152 H 748 Q 756,152 756,144 V 116 Q 756,108 764,108 H 784" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <line x1="720" y1="168" x2="784" y2="168" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <path d="M 720,184 H 748 Q 756,184 756,192 V 220 Q 756,228 764,228 H 784" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>

    <!-- Arrow labels -->
    <rect x="220" y="140" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="236" y="149" fill="#545B64" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">LOG</text>

    <!-- Node: 컨테이너 -->
    <rect x="56" y="140" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="140" width="160" height="56" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="64" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
    <text x="78" y="157" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="136" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">컨테이너</text>
    <text x="136" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">app process</text>

    <!-- Node: kubelet (focal) -->
    <rect x="256" y="140" width="168" height="56" rx="6" fill="#ffffff"/>
    <rect x="256" y="140" width="168" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="264" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="280" y="157" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
    <text x="340" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">kubelet</text>
    <text x="340" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">/var/log/containers/</text>

    <!-- Node: 로그 에이전트 -->
    <rect x="552" y="140" width="168" height="56" rx="6" fill="#ffffff"/>
    <rect x="552" y="140" width="168" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="560" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="576" y="157" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">LOG</text>
    <text x="636" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">로그 에이전트</text>
    <text x="636" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Fluent Bit / Fluentd</text>

    <!-- Node: CloudWatch Logs -->
    <rect x="784" y="80" width="152" height="56" rx="6" fill="#ffffff"/>
    <rect x="784" y="80" width="152" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="792" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="808" y="97" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">AWS</text>
    <text x="860" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">CloudWatch Logs</text>
    <text x="860" y="128" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">managed store</text>

    <!-- Node: Amazon OpenSearch -->
    <rect x="784" y="140" width="152" height="56" rx="6" fill="#ffffff"/>
    <rect x="784" y="140" width="152" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="792" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="808" y="157" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">AWS</text>
    <text x="860" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Amazon OpenSearch</text>
    <text x="860" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">managed store</text>

    <!-- Node: Amazon S3 -->
    <rect x="784" y="200" width="152" height="56" rx="6" fill="#ffffff"/>
    <rect x="784" y="200" width="152" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="792" y="208" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="808" y="217" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">AWS</text>
    <text x="860" y="232" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Amazon S3</text>
    <text x="860" y="248" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">archive store</text>

    <!-- Legend -->
    <line x1="24" y1="352" x2="936" y2="352" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="368" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="24" y="380" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="44" y="388" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">핵심 수집 지점</text>

    <rect x="184" y="380" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="204" y="388" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">AWS 관리형 서비스</text>

    <line x1="356" y1="385" x2="384" y2="385" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="392" y="388" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">AWS 전송</text>
  </svg>