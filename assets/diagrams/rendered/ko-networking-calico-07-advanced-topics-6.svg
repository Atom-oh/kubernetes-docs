<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rr-topo-title rr-topo-desc">
    <title id="rr-topo-title">1000+ 노드를 위한 Route Reflector 토폴로지</title>
    <desc id="rr-topo-desc">Tier 1의 세 Route Reflector가 서로 풀메시로 피어링하고, 각각 자신이 담당하는 랙 RR과 워커 노드 그룹으로 라우트를 전달하는 계층 구조를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Tier 1 Route Reflectors -->
    <rect x="60" y="60" width="840" height="128" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.30)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <rect x="386" y="64" width="188" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="73" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TIER 1 · ROUTE REFLECTORS</text>

    <!-- Zone: Tier 2 Rack RRs -->
    <rect x="60" y="260" width="840" height="96" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="358" y="264" width="244" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="273" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TIER 2 · RACK RRS (OPTIONAL)</text>

    <!-- Zone: Worker Nodes -->
    <rect x="60" y="420" width="840" height="96" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="404" y="424" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="433" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WORKER NODES</text>

    <!-- Arrows first -->
    <!-- RR full mesh, bidirectional -->
    <line x1="248" y1="124" x2="392" y2="124" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <line x1="568" y1="124" x2="712" y2="124" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <path d="M 216,148 V 200 Q 216,208 224,208 H 736 Q 744,208 744,200 V 148"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>

    <!-- RR -> Rack RR (vertical, straight) -->
    <line x1="180" y1="148" x2="180" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="148" x2="480" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="780" y1="148" x2="780" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Rack RR -> Worker Nodes -->
    <line x1="180" y1="344" x2="180" y2="456" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="344" x2="480" y2="456" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="780" y1="344" x2="780" y2="456" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Nodes: Tier 1 RRs (focal) -->
    <rect x="110" y="100" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="180" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">RR 1</text>
    <text x="180" y="138" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cluster ID 1.0.0.1</text>

    <rect x="410" y="100" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">RR 2</text>
    <text x="480" y="138" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cluster ID 1.0.0.2</text>

    <rect x="710" y="100" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="780" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">RR 3</text>
    <text x="780" y="138" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cluster ID 1.0.0.3</text>

    <!-- Nodes: Tier 2 Rack RRs -->
    <rect x="110" y="296" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="324" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rack 1 RR</text>

    <rect x="410" y="296" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="324" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rack 2 RR</text>

    <rect x="710" y="296" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="324" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rack 3 RR</text>

    <!-- Nodes: Worker groups -->
    <rect x="110" y="456" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="180" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 1-100</text>

    <rect x="410" y="456" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 101-200</text>

    <rect x="710" y="456" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="780" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 201-300</text>

    <!-- Legend -->
    <line x1="60" y1="540" x2="900" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="60" y="572" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="80" y="580" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Route Reflector (풀메시)</text>

    <rect x="320" y="572" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="340" y="580" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">워커 노드</text>

    <line x1="460" y1="577" x2="488" y2="577" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="496" y="580" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">단방향 라우트 전파</text>
  </svg>