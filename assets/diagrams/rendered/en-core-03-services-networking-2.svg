<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="netpol-title netpol-desc"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <title id="netpol-title">Network Policy Enforcement Across Namespaces</title>
    <desc id="netpol-desc">Network policies allow the Frontend Pod to reach the API Pod and the API Pod to reach the Database Pod, and allow a Monitoring Pod in another namespace to reach the API Pod, while directly blocking the Frontend Pod and the Monitoring Pod from reaching the Database Pod.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="60" y="88" width="420" height="340" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="220" y="92" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="270" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NAMESPACE A</text>

    <rect x="560" y="88" width="220" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="620" y="92" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="670" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NAMESPACE B</text>

    <!-- Arrows -->
    <!-- FE -> API allowed, straight horizontal y=152 -->
    <line x1="240" y1="152" x2="300" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- API -> DB allowed, straight vertical x=370 -->
    <line x1="370" y1="184" x2="370" y2="320" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- FE -> DB blocked, dashed elbow via left side -->
    <path d="M170,184 V344 Q170,352 178,352 H300" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- MON -> API allowed, straight horizontal y=152 -->
    <line x1="620" y1="152" x2="440" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- MON -> DB blocked, dashed elbow via right side -->
    <path d="M690,184 V344 Q690,352 682,352 H440" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="244" y="132" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="270" y="141" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOWED</text>

    <rect x="380" y="244" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="406" y="253" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOWED</text>

    <rect x="180" y="330" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="206" y="339" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BLOCKED</text>

    <rect x="504" y="132" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="530" y="141" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOWED</text>

    <rect x="614" y="330" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="339" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BLOCKED</text>

    <!-- Node: Frontend Pod -->
    <rect x="100" y="120" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="100" y="120" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="170" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Frontend Pod</text>
    <text x="170" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app: frontend</text>

    <!-- Node: API Pod (focal) -->
    <rect x="300" y="120" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="300" y="120" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="370" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">API Pod</text>
    <text x="370" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app: api</text>

    <!-- Node: Database Pod -->
    <rect x="300" y="320" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="300" y="320" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="370" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Database Pod</text>
    <text x="370" y="364" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app: db</text>

    <!-- Node: Monitoring Pod -->
    <rect x="620" y="120" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="620" y="120" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="690" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Monitoring Pod</text>
    <text x="690" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app: monitoring</text>

    <!-- Legend -->
    <line x1="60" y1="452" x2="928" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="60" y="468" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="80" y="476" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Focal: policy target</text>
    <line x1="300" y1="473" x2="328" y2="473" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="336" y="476" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Allowed by policy</text>
    <line x1="540" y1="473" x2="568" y2="473" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="576" y="476" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Blocked (default-deny)</text>
  </svg>