<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wci0-title wci0-desc">
    <title id="wci0-title">Windows container isolation models</title>
    <desc id="wci0-desc">Comparison of Windows Server Containers, which share one host kernel, against Hyper-V Isolation Containers, where each container gets its own lightweight VM and kernel before reaching the shared hypervisor and hardware.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="40" y="60" width="400" height="420" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="112" y="64" width="256" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WINDOWS SERVER CONTAINERS</text>

    <rect x="520" y="60" width="400" height="420" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="596" y="64" width="248" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HYPER-V ISOLATION CONTAINERS</text>

    <!-- Arrows: Zone A chain (straight vertical) -->
    <line x1="240" y1="152" x2="240" y2="196" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="240" y1="244" x2="240" y2="288" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="240" y1="336" x2="240" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: Zone B chain -->
    <line x1="628" y1="168" x2="628" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="832" y1="168" x2="832" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="720" y1="268" x2="720" y2="316" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="720" y1="364" x2="720" y2="408" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Zone A nodes -->
    <!-- Apps (input style) -->
    <rect x="140" y="104" width="200" height="48" rx="6" fill="#ffffff"/>
    <rect x="140" y="104" width="200" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="240" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Windows Apps (×3)</text>

    <!-- Runtime -->
    <rect x="140" y="196" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Container Runtime</text>

    <!-- OS -->
    <rect x="140" y="288" width="200" height="48" rx="6" fill="#ffffff"/>
    <rect x="140" y="288" width="200" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="240" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Windows Server OS</text>

    <!-- HW -->
    <rect x="140" y="380" width="200" height="48" rx="6" fill="#ffffff"/>
    <rect x="140" y="380" width="200" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="240" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Physical Hardware</text>

    <!-- Zone B nodes -->
    <rect x="548" y="104" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="628" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Windows App 1</text>
    <text x="628" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runtime + own kernel</text>

    <rect x="752" y="104" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="832" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Windows App 2</text>
    <text x="832" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runtime + own kernel</text>

    <!-- Hypervisor (focal) -->
    <rect x="560" y="220" width="320" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="720" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Hyper-V Hypervisor</text>

    <!-- OS (shared, matches Zone A style) -->
    <rect x="620" y="316" width="200" height="48" rx="6" fill="#ffffff"/>
    <rect x="620" y="316" width="200" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="720" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Windows Server OS</text>

    <!-- HW -->
    <rect x="620" y="408" width="200" height="48" rx="6" fill="#ffffff"/>
    <rect x="620" y="408" width="200" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="720" y="436" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Physical Hardware</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="544" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="40" y="556" width="10" height="10" rx="2" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="58" y="565" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">USER WORKLOAD</text>
    <rect x="220" y="556" width="10" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="238" y="565" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">RUNTIME / KERNEL</text>
    <rect x="424" y="556" width="10" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="442" y="565" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">ISOLATION BOUNDARY</text>
    <rect x="660" y="556" width="10" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="678" y="565" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">SHARED HOST LAYER</text>
  </svg>