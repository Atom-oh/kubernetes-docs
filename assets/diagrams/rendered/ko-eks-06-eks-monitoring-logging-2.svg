<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="ekscov-title ekscov-desc">
    <title id="ekscov-title">EKS 모니터링 솔루션 커버리지</title>
    <desc id="ekscov-desc">AWS 솔루션, Kubernetes 솔루션, 추적 솔루션이라는 세 축의 모니터링 도구가 클러스터·노드·파드 수준의 관찰 대상을 각각 어떻게 나누어 커버하는지 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="112" width="280" height="304" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="112" y="116" width="136" height="12" rx="2" fill="#ffffff"/>
    <text x="180" y="125" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">모니터링 솔루션</text>

    <rect x="600" y="112" width="280" height="304" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="672" y="116" width="136" height="12" rx="2" fill="#ffffff"/>
    <text x="740" y="125" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">모니터링 대상</text>

    <!-- Arrows -->
    <line x1="304" y1="168" x2="616" y2="168" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M 304,152 H 432 Q 440,152 440,160 V 242 Q 440,250 448,250 H 616" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M 304,184 H 472 Q 480,184 480,192 V 338 Q 480,346 488,346 H 616" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M 304,254 H 492 Q 500,254 500,246 V 158 Q 500,150 508,150 H 616" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="304" y1="278" x2="616" y2="278" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 304,350 H 532 Q 540,350 540,342 V 194 Q 540,186 548,186 H 616" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="304" y1="374" x2="616" y2="374" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: AWS 솔루션 (focal) -->
    <rect x="56" y="140" width="248" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="140" width="248" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="64" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="80" y="157" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">AWS</text>
    <text x="188" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">AWS 솔루션</text>
    <text x="188" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Container Insights · AMP · AMG</text>

    <!-- Node: Kubernetes 솔루션 -->
    <rect x="56" y="236" width="248" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="236" width="248" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="64" y="244" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="80" y="253" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
    <text x="188" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Kubernetes 솔루션</text>
    <text x="188" y="284" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Prometheus · Grafana · kube-state</text>

    <!-- Node: 추적 솔루션 -->
    <rect x="56" y="332" width="248" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="332" width="248" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="64" y="340" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="80" y="349" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">TRC</text>
    <text x="188" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">추적 솔루션</text>
    <text x="188" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">X-Ray · Jaeger · OpenTelemetry</text>

    <!-- Node: 클러스터 수준 -->
    <rect x="616" y="140" width="248" height="56" rx="6" fill="#ffffff"/>
    <rect x="616" y="140" width="248" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="624" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="638" y="157" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">LV1</text>
    <text x="748" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">클러스터 수준</text>
    <text x="748" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">컨트롤 플레인 · API 서버</text>

    <!-- Node: 노드 수준 -->
    <rect x="616" y="236" width="248" height="56" rx="6" fill="#ffffff"/>
    <rect x="616" y="236" width="248" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="624" y="244" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="638" y="253" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">LV2</text>
    <text x="748" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">노드 수준</text>
    <text x="748" y="284" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CPU · 메모리 · 디스크 · 네트워크</text>

    <!-- Node: 파드 수준 -->
    <rect x="616" y="332" width="248" height="56" rx="6" fill="#ffffff"/>
    <rect x="616" y="332" width="248" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="624" y="340" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="638" y="349" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">LV3</text>
    <text x="748" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">파드 수준</text>
    <text x="748" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">파드 CPU/메모리 · 재시작 횟수</text>

    <!-- Legend -->
    <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="468" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="480" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="488" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">가장 넓은 커버리지</text>

    <line x1="220" y1="485" x2="248" y2="485" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="256" y="488" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">AWS 솔루션 커버</text>

    <line x1="404" y1="485" x2="432" y2="485" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="440" y="488" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">기타 솔루션 커버</text>
  </svg>