    <title id="dtitle">Secret Types and Consumption</title>
    <desc id="ddesc">Diagram showing a Kubernetes Secret's supported types (Opaque, TLS, docker-registry, basic-auth) and its base64/etcd-encryption storage method, alongside the three ways a Pod can consume it: as environment variables, a mounted volume, or an image-pull secret.</desc>
