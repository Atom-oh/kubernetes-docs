<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ko-security-11-kubescape-2-title ko-security-11-kubescape-2-desc">
    <title id="ko-security-11-kubescape-2-title">Kubescape Operator 클러스터 내부 동작</title>
    <desc id="ko-security-11-kubescape-2-desc">클러스터 안에서 CronJob이 Operator Controller를 트리거해 스캐너들이 배포·파드·서비스·Secret·ServiceAccount를 검사하고, Node Agent의 eBPF 이벤트도 Controller로 모여 그 결과가 CRD로 저장되어 Baseline과 비교되며, 변경이 감지되면 외부 Alerting과 SIEM/SOAR로 이어지는 구조를 보여준다.</desc>
