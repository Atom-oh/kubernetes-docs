<svg viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-networking-calico-02-architecture-3-title en-networking-calico-02-architecture-3-desc">
      <title id="en-networking-calico-02-architecture-3-title">BIRD in the Calico architecture</title>
      <desc id="en-networking-calico-02-architecture-3-desc">Diagram showing BIRD instances on each node forming a full iBGP mesh to exchange pod routes, then peering over eBGP with the top-of-rack switch and core router to advertise those routes externally.</desc>
