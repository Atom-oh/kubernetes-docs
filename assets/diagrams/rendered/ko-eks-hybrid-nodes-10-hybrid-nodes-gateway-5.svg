<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d5-title d5-desc">
<title id="d5-title">AWS 관리형 서비스가 게이트웨이를 통해 하이브리드 Pod에 연결되는 구조</title>
<desc id="d5-desc">ALB, NLB, Amazon Managed Prometheus가 VPC 라우트 테이블과 게이트웨이 EC2를 거쳐 온프레미스의 세 Hybrid Pod에 IP 타겟으로 직접 연결되는 구조를 보여준다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="d5-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="d5-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: AWS Services -->
<rect x="40" y="44" width="880" height="124" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="56" y="48" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="104" y="57" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AWS 서비스</text>

