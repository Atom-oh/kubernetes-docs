<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calico-cloud-title calico-cloud-desc">
    <title id="calico-cloud-title">Calico Cloud SaaS topology</title>
    <desc id="calico-cloud-desc">Each customer cluster's Calico agent reports to a shared Management UI, which feeds an Analytics Engine that in turn drives threat intelligence and compliance reporting.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- SaaS zone -->
    <rect x="280" y="88" width="400" height="304" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="288" y="92" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="352" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CALICO CLOUD (SAAS)</text>

    <!-- Customer clusters zone -->
    <rect x="340" y="460" width="280" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="348" y="464" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="424" y="473" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CUSTOMER CLUSTERS &#215;3</text>

    <!-- connectors -->
    <path d="M 420,492 V 448 Q 420,440 412,440 H 148 Q 140,440 140,432 V 156 Q 140,148 148,148 H 380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <line x1="480" y1="176" x2="480" y2="210" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 453,266 V 282 Q 453,290 445,290 H 388 Q 380,290 380,298 V 320" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 507,266 V 282 Q 507,290 515,290 H 572 Q 580,290 580,298 V 320" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- x3 badge on the agent<->UI connector -->
    <rect x="124" y="294" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="140" y="303" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">&#215;3</text>

    <!-- Management UI (focal) -->
    <rect x="380" y="120" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="380" y="120" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="152" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Management UI</text>

    <!-- Analytics Engine -->
    <rect x="400" y="210" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="210" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="242" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Analytics Engine</text>

    <!-- Threat Intelligence -->
    <rect x="300" y="320" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="300" y="320" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="352" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Threat Intel</text>

    <!-- Compliance Engine -->
    <rect x="500" y="320" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="500" y="320" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="580" y="352" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Compliance</text>

    <!-- Calico Agent (representative) -->
    <rect x="360" y="492" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="360" y="492" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="420" y="524" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Calico Agent</text>

    <!-- Workloads (representative) -->
    <rect x="500" y="492" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="500" y="492" width="120" height="56" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="560" y="524" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Workloads</text>
  </svg>