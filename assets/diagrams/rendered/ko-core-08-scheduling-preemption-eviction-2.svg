<title id="ko-core-08-scheduling-preemption-eviction-2-title">노드 선택 메커니즘</title>
<desc id="ko-core-08-scheduling-preemption-eviction-2-desc">nodeSelector, nodeName, nodeAffinity 세 가지 노드 선택 방식이 각각 레이블 매칭, 직접 지정, 표현식 매칭을 통해 포드를 노드에 배치하는 방식을 비교한다.</desc>
