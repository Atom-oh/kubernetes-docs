<title id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-13-title">VPC Lattice 트러블슈팅 실전: 5-10분이면 끝나는 사례</title>
<desc id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-13-desc">엔지니어가 CloudWatch에서 UnhealthyTargetCount 이상을 확인하고, Target Group의 Health Check 경로가 잘못 설정된 것을 AWS Console에서 발견해 경로를 수정하면, Auto Healing이 30초 안에 Target을 정상 상태로 되돌려 트래픽이 곧바로 정상화되는 흐름을 보여준다.</desc>
