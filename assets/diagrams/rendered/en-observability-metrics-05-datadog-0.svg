<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="dd-compare-title dd-compare-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="dd-compare-title">Datadog vs. CloudWatch vs. Open Source monitoring comparison</title>
    <desc id="dd-compare-desc">Three side-by-side profiles comparing Datadog, Amazon CloudWatch, and a self-hosted open-source stack across platform model, intelligence, integration breadth, and pricing shape.</desc>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zone: Datadog (focal) -->
    <rect x="40" y="132" width="272" height="316" rx="8" fill="rgba(255,153,0,0.05)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="56" y="148" width="88" height="20" rx="2" fill="#ffffff"/>
    <text x="60" y="162" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SAAS PLATFORM</text>
    <text x="60" y="196" fill="#232F3E" font-size="16" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Datadog</text>

    <g font-family="'Geist Mono', monospace" font-size="9" fill="#545B64">
      <rect x="60" y="224" width="6" height="6" rx="1" fill="#EC7211"/>
      <text x="76" y="230">Unified metrics, logs, traces</text>
      <rect x="60" y="252" width="6" height="6" rx="1" fill="#EC7211"/>
      <text x="76" y="258">Watchdog AI anomaly detection</text>
      <rect x="60" y="280" width="6" height="6" rx="1" fill="#EC7211"/>
      <text x="76" y="286">750+ integrations</text>
      <rect x="60" y="308" width="6" height="6" rx="1" fill="#EC7211"/>
      <text x="76" y="314">Per-host pricing</text>
    </g>
    <line x1="60" y1="356" x2="288" y2="356" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="60" y="378" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">COST: HIGH, PREDICTABLE</text>

    <!-- Zone: CloudWatch -->
    <rect x="344" y="132" width="272" height="316" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <rect x="360" y="148" width="72" height="20" rx="2" fill="#ffffff"/>
    <text x="364" y="162" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MANAGED</text>
    <text x="364" y="196" fill="#232F3E" font-size="16" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">CloudWatch</text>

    <g font-family="'Geist Mono', monospace" font-size="9" fill="#545B64">
      <rect x="364" y="224" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="380" y="230">AWS-native metrics and logs</text>
      <rect x="364" y="252" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="380" y="258">Deep AWS service integration</text>
      <rect x="364" y="280" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="380" y="286">APM limited (separate X-Ray)</text>
      <rect x="364" y="308" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="380" y="314">Usage-based pricing</text>
    </g>
    <line x1="364" y1="356" x2="592" y2="356" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="364" y="378" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">COST: LOW, VARIABLE</text>

    <!-- Zone: Open Source -->
    <rect x="648" y="132" width="272" height="316" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <rect x="664" y="148" width="80" height="20" rx="2" fill="#ffffff"/>
    <text x="668" y="162" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SELF-HOSTED</text>
    <text x="668" y="196" fill="#232F3E" font-size="16" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Open Source</text>

    <g font-family="'Geist Mono', monospace" font-size="9" fill="#545B64">
      <rect x="668" y="224" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="684" y="230">Full control over stack</text>
      <rect x="668" y="252" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="684" y="258">High flexibility, no lock-in</text>
      <rect x="668" y="280" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="684" y="286">Operational overhead</text>
      <rect x="668" y="308" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="684" y="314">Infrastructure cost only</text>
    </g>
    <line x1="668" y1="356" x2="896" y2="356" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="668" y="378" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">COST: HIGH OPS EFFORT</text>
  </svg>