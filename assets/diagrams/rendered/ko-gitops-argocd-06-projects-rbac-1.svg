<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="argorbac2-title argorbac2-desc">
    <title id="argorbac2-title">ArgoCD 프로젝트의 클러스터 전체 배포 매핑</title>
    <desc id="argorbac2-desc">ArgoCD 안의 Frontend, Backend, Data 세 프로젝트가 각각 자신의 애플리케이션을 묶고, 세 프로젝트 모두 동일하게 Dev, Staging, Prod 클러스터 전체로 배포되는 구조를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Outer zone: ArgoCD -->
    <rect x="32" y="56" width="896" height="232" rx="8"
          fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="64" y="60" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="96" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.14em">ARGOCD</text>

    <!-- Project zone: Frontend -->
    <rect x="48" y="96" width="272" height="176" rx="8" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
    <rect x="60" y="104" width="164" height="12" rx="2" fill="#ffffff"/>
    <text x="64" y="113" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace"
          letter-spacing="0.1em">PROJECT: FRONTEND</text>
    <rect x="68" y="136" width="232" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="184" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">frontend-web</text>
    <rect x="68" y="200" width="232" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="184" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">frontend-api</text>

    <!-- Project zone: Backend -->
    <rect x="344" y="96" width="272" height="176" rx="8" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
    <rect x="356" y="104" width="164" height="12" rx="2" fill="#ffffff"/>
    <text x="360" y="113" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace"
          letter-spacing="0.1em">PROJECT: BACKEND</text>
    <rect x="364" y="136" width="232" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">user-service</text>
    <rect x="364" y="200" width="232" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">order-service</text>

    <!-- Project zone: Data -->
    <rect x="640" y="96" width="272" height="176" rx="8" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
    <rect x="652" y="104" width="164" height="12" rx="2" fill="#ffffff"/>
    <text x="656" y="113" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace"
          letter-spacing="0.1em">PROJECT: DATA</text>
    <rect x="660" y="136" width="232" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="776" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">analytics</text>
    <rect x="660" y="200" width="232" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="776" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ml-pipeline</text>

    <!-- Fan-in arrows: each project -> shared Clusters zone (accent = the one node all three share) -->
    <line x1="184" y1="376" x2="184" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="376" x2="480" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="776" y1="376" x2="776" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow label (one representative label, applies to all three identical fan-out edges); offset to the side of the x=480 line, clear of the stroke -->
    <rect x="492" y="316" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="536" y="325" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEPLOYS TO ALL</text>

    <!-- Clusters zone (focal — shared destination for every project) -->
    <rect x="60" y="376" width="840" height="80" rx="8" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="72" y="384" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="76" y="393" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.1em">CLUSTERS</text>

    <rect x="120" y="404" width="200" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Dev Cluster</text>

    <rect x="380" y="404" width="200" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Staging Cluster</text>

    <rect x="640" y="404" width="200" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="740" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prod Cluster</text>

    <!-- Legend -->
    <line x1="32" y1="484" x2="928" y2="484" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="504" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="32" y="516" width="14" height="12" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
    <text x="52" y="525" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">PROJECT</text>

    <rect x="176" y="516" width="14" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="196" y="525" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">APPLICATION / CLUSTER</text>

    <rect x="420" y="516" width="14" height="12" rx="2" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="440" y="525" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">모든 프로젝트가 공유하는 대상</text>
  </svg>