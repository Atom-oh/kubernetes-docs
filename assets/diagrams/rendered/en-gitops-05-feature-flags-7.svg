<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="canaryflags-title canaryflags-desc">
<title id="canaryflags-title">Canary traffic split combined with feature flags</title>
<desc id="canaryflags-desc">Architecture diagram showing an Istio VirtualService splitting 90% of traffic to a primary v1 deployment where a flag stays off, and 10% to a canary v2 deployment where pods evaluate the same flag against flagd.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zones -->
<rect x="140" y="32" width="680" height="328" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="380" y="36" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TRAFFIC LAYER (ISTIO)</text>

<rect x="140" y="368" width="680" height="216" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="380" y="372" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="381" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FEATURE LAYER (OPENFEATURE)</text>

<!-- Arrows -->
<line x1="480" y1="120" x2="480" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 453,216 V 240 Q 453,248 445,248 H 288 Q 280,248 280,256 V 280"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 507,216 V 240 Q 507,248 515,248 H 672 Q 680,248 680,256 V 280"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<line x1="280" y1="344" x2="280" y2="400" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="680" y1="344" x2="680" y2="400" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 680,456 V 468 Q 680,476 672,476 H 488 Q 480,476 480,484 V 496"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Arrow labels -->
<rect x="336" y="228" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="356" y="238" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">90%</text>
<rect x="574" y="228" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="594" y="238" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">10%</text>

<!-- Node: Ingress Gateway -->
<rect x="400" y="64" width="160" height="56" rx="6" fill="#ffffff"/>
<rect x="400" y="64" width="160" height="56" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="480" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Ingress Gateway</text>
<text x="480" y="106" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">entry point</text>

<!-- Node: VirtualService (focal) -->
<rect x="400" y="160" width="160" height="56" rx="6" fill="#ffffff"/>
<rect x="400" y="160" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="480" y="186" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">VirtualService</text>
<text x="480" y="202" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">focal · traffic split</text>

<!-- Node: Primary (v1) -->
<rect x="180" y="280" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="180" y="280" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="280" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Primary (v1)</text>
<text x="280" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">90% of traffic</text>

<!-- Node: Canary (v2) -->
<rect x="580" y="280" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="580" y="280" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="680" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Canary (v2)</text>
<text x="680" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10% of traffic</text>

<!-- Node: new-feature off -->
<rect x="180" y="400" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="180" y="400" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="280" y="426" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">new-feature: off</text>
<text x="280" y="442" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">v1 pods</text>

<!-- Node: new-feature on -->
<rect x="580" y="400" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="580" y="400" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="680" y="426" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">new-feature: on</text>
<text x="680" y="442" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">v2 pods evaluate</text>

<!-- Node: flagd -->
<rect x="380" y="496" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="380" y="496" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="480" y="524" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">flagd</text>
<text x="480" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">evaluation backend</text>
</svg>