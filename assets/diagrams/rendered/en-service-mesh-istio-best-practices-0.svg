<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="istio-roadmap-title istio-roadmap-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="istio-roadmap-title">Istio service mesh adoption roadmap</title>
    <desc id="istio-roadmap-desc">Flowchart of the five-phase Istio adoption path: starting from observability-only sidecar injection, moving through permissive then strict mutual TLS enforcement, then advanced traffic-management features, ending at full adoption.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ============ ARROWS (drawn before boxes) ============ -->
    <line x1="104" y1="260" x2="120" y2="260" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="280" y1="260" x2="296" y2="260" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="456" y1="260" x2="472" y2="260" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="632" y1="260" x2="648" y2="260" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="808" y1="260" x2="824" y2="260" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ============ NODES ============ -->

    <!-- Start (oval) -->
    <ellipse cx="56" cy="260" rx="48" ry="28" fill="#ffffff"/>
    <ellipse cx="56" cy="260" rx="48" ry="28" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="56" y="264" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Start</text>

    <!-- Phase 1: Observability -->
    <rect x="128" y="228" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="128" y="228" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="204" y="250" fill="#7D8998" font-size="8" letter-spacing="0.10em"
          font-family="'Geist Mono',monospace" text-anchor="middle">PHASE 1</text>
    <text x="204" y="266" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Observability</text>
    <text x="204" y="282" fill="#545B64" font-size="8" letter-spacing="0.06em"
          font-family="'Geist Mono',monospace" text-anchor="middle">1&#8211;2 WEEKS</text>

    <!-- Phase 2: mTLS Permissive -->
    <rect x="304" y="228" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="304" y="228" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="250" fill="#7D8998" font-size="8" letter-spacing="0.10em"
          font-family="'Geist Mono',monospace" text-anchor="middle">PHASE 2</text>
    <text x="380" y="266" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">mTLS Permissive</text>
    <text x="380" y="282" fill="#545B64" font-size="8" letter-spacing="0.06em"
          font-family="'Geist Mono',monospace" text-anchor="middle">1&#8211;2 WEEKS</text>

    <!-- Phase 3: mTLS Strict (focal — critical cutover) -->
    <rect x="480" y="228" width="152" height="64" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="480" y="228" width="152" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="556" y="250" fill="#EC7211" font-size="8" letter-spacing="0.10em"
          font-family="'Geist Mono',monospace" text-anchor="middle">PHASE 3</text>
    <text x="556" y="266" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">mTLS Strict</text>
    <text x="556" y="282" fill="#EC7211" font-size="8" letter-spacing="0.06em"
          font-family="'Geist Mono',monospace" text-anchor="middle">1 WEEK</text>

    <!-- Phase 4: Advanced Features -->
    <rect x="656" y="228" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="656" y="228" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="732" y="250" fill="#7D8998" font-size="8" letter-spacing="0.10em"
          font-family="'Geist Mono',monospace" text-anchor="middle">PHASE 4</text>
    <text x="732" y="266" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Advanced Features</text>
    <text x="732" y="282" fill="#545B64" font-size="8" letter-spacing="0.06em"
          font-family="'Geist Mono',monospace" text-anchor="middle">ONGOING</text>

    <!-- Full Adoption (oval) -->
    <ellipse cx="892" cy="260" rx="60" ry="28" fill="#ffffff"/>
    <ellipse cx="892" cy="260" rx="60" ry="28" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="892" y="264" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Full Adoption</text>

    <!-- ============ LEGEND ============ -->
    <line x1="32" y1="480" x2="928" y2="480" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="32" y="500" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

    <ellipse cx="48" cy="524" rx="12" ry="7" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="68" y="527" fill="#545B64" font-size="8" letter-spacing="0.06em"
          font-family="'Geist Mono',monospace">START / END</text>

    <rect x="332" y="517" width="24" height="14" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="364" y="527" fill="#545B64" font-size="8" letter-spacing="0.06em"
          font-family="'Geist Mono',monospace">PHASE (SEQUENTIAL)</text>

    <rect x="644" y="517" width="24" height="14" rx="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="676" y="527" fill="#545B64" font-size="8" letter-spacing="0.06em"
          font-family="'Geist Mono',monospace">CRITICAL CUTOVER</text>
  </svg>