<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="alertpipe-title alertpipe-desc">
    <title id="alertpipe-title">Alert detection to AI analysis to notification pipeline</title>
    <desc id="alertpipe-desc">Alertmanager and CloudWatch Alarms trigger Grafana OnCall and an AIOps Lambda agent; CloudWatch Investigations feeds the agent a hypothesis, the agent queries Bedrock Claude, and results route through SNS to email, Slack, and PagerDuty.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ===== ZONES ===== -->
    <rect x="32" y="60" width="216" height="260" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="64" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="126" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ALERT DETECTION</text>

    <rect x="372" y="60" width="216" height="260" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="396" y="64" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="452" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AI ANALYSIS</text>

    <rect x="712" y="60" width="216" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="736" y="64" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="792" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NOTIFICATION</text>

    <!-- ===== ARROWS (drawn before nodes) ===== -->

    <!-- AM -> GO webhook: straight vertical -->
    <path d="M 140,144 V 168" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="148" y="150" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="178" y="159" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WEBHOOK</text>

    <!-- CWI -> AIOPS hypothesis: straight vertical -->
    <path d="M 480,144 V 168" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="484" y="150" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="522" y="159" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">HYPOTHESIS</text>

    <!-- AIOPS -> Bedrock query: straight vertical -->
    <path d="M 480,216 V 240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="484" y="222" width="46" height="12" rx="2" fill="#ffffff"/>
    <text x="507" y="231" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">QUERY</text>

    <!-- AM -> AIOPS webhook: elbow with two hops (crosses GO-path and CWA-CWI-path) -->
    <path d="M 224,120 H 256 a 8,8 0 0,1 16,0 H 292 Q 300,120 300,128 V 184 Q 300,192 308,192
             H 332
             a 8,8 0 0,1 16,0
             H 396"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="332" y="176" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="362" y="185" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WEBHOOK</text>

    <!-- CWA -> CWI anomaly: (224,256) H to 340 [bend up] V to 120 [bend] H to 396, crosses AM path at (340,192) - hop already placed on AM path above -->
    <path d="M 224,256 H 332 Q 340,256 340,248 V 128 Q 340,120 348,120 H 396"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="252" y="238" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="280" y="247" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ANOMALY</text>

    <!-- GO -> SNS escalation: (224,192) H to 264 [bend up] V to 40 [bend] H to 890 [bend] V down to 96 -->
    <path d="M 224,192 H 256 Q 264,192 264,184 V 48 Q 264,40 272,40 H 882 Q 890,40 890,48 V 96"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="614" y="28" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="650" y="37" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ESCALATION</text>

    <!-- CWA -> SNS trigger: (224,272) H to 370 [bend up] V to 52 [bend] H to 860 [bend] V down to 96 -->
    <path d="M 224,272 H 362 Q 370,272 370,264 V 60 Q 370,52 378,52 H 852 Q 860,52 860,60 V 96"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="424" y="40" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="450" y="49" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">TRIGGER</text>

    <!-- AIOPS -> SNS analysis -->
    <path d="M 564,192 H 648 Q 656,192 656,184 V 128 Q 656,120 664,120 H 736"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="628" y="176" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="656" y="185" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ANALYSIS</text>

    <!-- SNS -> Email: straight down -->
    <path d="M 778,144 V 176" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- SNS -> Slack: (820,144) V to 156 H to 916 V to 252 H to 904 -->
    <path d="M 820,144 V 148 Q 820,156 828,156 H 908 Q 916,156 916,164 V 244 Q 916,252 908,252 H 904"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- SNS -> PD: (862,144) V to 168 H to 724 V to 308 H to 736, hops over Slack's horizontal at (862,156) -->
    <path d="M 862,144 V 152
             a 8,8 0 0,1 0,8
             V 160 Q 862,168 854,168 H 732 Q 724,168 724,176 V 300 Q 724,308 732,308 H 736"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== NODES ===== -->

    <!-- AM: Alertmanager (external/OSS) -->
    <rect x="56" y="96" width="168" height="48" rx="6" fill="#ffffff"/>
    <rect x="56" y="96" width="168" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="140" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alertmanager</text>
    <text x="140" y="136" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">oss</text>

    <!-- GO: Grafana OnCall (external) -->
    <rect x="56" y="168" width="168" height="48" rx="6" fill="#ffffff"/>
    <rect x="56" y="168" width="168" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="140" y="194" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana OnCall</text>
    <text x="140" y="208" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">saas</text>

    <!-- CWA: CloudWatch Alarms (backend/aws) -->
    <rect x="56" y="240" width="168" height="48" rx="6" fill="#ffffff"/>
    <rect x="56" y="240" width="168" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="266" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch Alarms</text>
    <text x="140" y="280" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aws</text>

    <!-- CWI: CloudWatch Investigations (backend/aws) -->
    <rect x="396" y="96" width="168" height="48" rx="6" fill="#ffffff"/>
    <rect x="396" y="96" width="168" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="118" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch</text>
    <text x="480" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Investigations</text>

    <!-- AIOPS: AIOps Agent (Lambda) - FOCAL -->
    <rect x="396" y="168" width="168" height="48" rx="6" fill="#ffffff"/>
    <rect x="396" y="168" width="168" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="190" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AIOps Agent</text>
    <text x="480" y="204" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lambda</text>

    <!-- Bedrock: Bedrock Claude (backend/aws) -->
    <rect x="396" y="240" width="168" height="48" rx="6" fill="#ffffff"/>
    <rect x="396" y="240" width="168" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="266" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Bedrock Claude</text>
    <text x="480" y="280" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aws</text>

    <!-- SNS: SNS Topic (backend/aws) -->
    <rect x="736" y="96" width="168" height="48" rx="6" fill="#ffffff"/>
    <rect x="736" y="96" width="168" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="820" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SNS Topic</text>
    <text x="820" y="136" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aws</text>

    <!-- Email (external) -->
    <rect x="736" y="176" width="168" height="40" rx="6" fill="#ffffff"/>
    <rect x="736" y="176" width="168" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="820" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Email</text>

    <!-- Slack (external) -->
    <rect x="736" y="232" width="168" height="40" rx="6" fill="#ffffff"/>
    <rect x="736" y="232" width="168" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="820" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Slack</text>

    <!-- PD: PagerDuty (external) -->
    <rect x="736" y="288" width="168" height="40" rx="6" fill="#ffffff"/>
    <rect x="736" y="288" width="168" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="820" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PagerDuty</text>

    <!-- ===== LEGEND ===== -->
    <line x1="32" y1="552" x2="928" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="140" y="560" width="14" height="14" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="570" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">AWS SERVICE</text>

    <rect x="300" y="560" width="14" height="14" rx="3" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="320" y="570" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">EXTERNAL / SAAS</text>

    <rect x="500" y="560" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="520" y="570" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">AI AGENT (FOCAL)</text>
  </svg>
