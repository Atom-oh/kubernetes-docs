    <title id="en-core-08-scheduling-preemption-eviction-6-title">Pod eviction types and causes</title>
    <desc id="en-core-08-scheduling-preemption-eviction-6-desc">Diagram grouping pod eviction into three sources -- the controller manager evicting pods from unready or unreachable nodes, kubelet evicting pods under resource or hardware pressure while monitoring memory, filesystem, and PID signals, and users draining nodes for maintenance.</desc>
