<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="cm-flow-title cm-flow-desc">
    <title id="cm-flow-title">Certificate issuance flowchart</title>
    <desc id="cm-flow-desc">Flowchart showing cert-manager creating a CertificateRequest from a Certificate resource, branching into an ACME order-and-challenge sequence for ACME issuers or going straight to storage for non-ACME issuers, and finally writing the TLS Secret.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows first -->
    <!-- Start -> CreateCR -->
    <line x1="480" y1="112" x2="480" y2="148" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- CreateCR -> Decision -->
    <line x1="480" y1="196" x2="480" y2="232" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Decision -> ACME order (right, YES) -->
    <path d="M 552,280 H 700 Q 708,280 708,288 V 316"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="588" y="266" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="628" y="275" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ACME ISSUER</text>

    <!-- Decision -> Store (left/down, NO) -->
    <path d="M 408,280 H 260 Q 252,280 252,288 V 420 Q 252,428 260,428 H 416"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="252" y="266" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="297" y="275" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">NON-ACME</text>

    <!-- Order/Challenge -> Solve/Finalize -->
    <line x1="708" y1="364" x2="708" y2="400" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Solve/Finalize -> Store -->
    <path d="M 708,448 V 456 Q 708,464 700,464 H 600"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Store -> Ready -->
    <line x1="480" y1="452" x2="480" y2="488" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Start oval -->
    <rect x="400" y="76" width="160" height="36" rx="18" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Create Certificate CR</text>

    <!-- Step: CreateCR -->
    <rect x="360" y="148" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Detect &amp; Create</text>
    <text x="480" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CertificateRequest</text>

    <!-- Decision diamond -->
    <polygon points="480,232 552,280 480,328 408,280" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="276" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Issuer</text>
    <text x="480" y="290" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">type?</text>

    <!-- ACME step 1: Order & Challenge -->
    <rect x="588" y="316" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="708" y="336" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Create Order</text>
    <text x="708" y="352" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ Challenge</text>

    <!-- ACME step 2: Solve & Finalize -->
    <rect x="588" y="400" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="708" y="420" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Solve Challenge</text>
    <text x="708" y="436" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ Finalize Order</text>

    <!-- Merge dot -->
    <circle cx="480" cy="452" r="4" fill="#232F3E"/>

    <!-- Store step -->
    <rect x="360" y="428" width="240" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="448" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Store in Secret</text>
    <text x="480" y="464" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubernetes.io/tls</text>

    <!-- End oval (focal) -->
    <rect x="400" y="488" width="160" height="36" rx="18" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="510" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Certificate Ready</text>

    <!-- Legend -->
    <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="580" width="20" height="14" rx="10" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="70" y="590" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Start / end</text>

    <rect x="220" y="580" width="20" height="14" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="250" y="590" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Step</text>

    <polygon points="380,580 396,587 380,594 364,587" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="406" y="590" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Decision</text>

    <circle cx="510" cy="587" r="4" fill="#232F3E"/>
    <text x="524" y="590" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Branch merge</text>
  </svg>