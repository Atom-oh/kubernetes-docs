<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
    <title id="t">분산 훈련 아키텍처</title>
    <desc id="d">MPI Job의 Launcher 파드가 4개 Worker 파드를 기동하고, Worker들이 NCCL·MPI·EFA로 서로 통신하며, 훈련 체크포인트와 데이터를 FSx for Lustre를 거쳐 S3에 저장하는 분산 훈련 구조를 보여주는 다이어그램.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#FFFFFF"/>

    <!-- Zone: MPI Job -->
    <rect x="40" y="56" width="304" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="60" y="60" width="64" height="12" rx="2" fill="#FFFFFF"/>
    <text x="92" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MPI JOB</text>

    <!-- Zone: Communication layer -->
    <rect x="384" y="56" width="216" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="404" y="60" width="72" height="12" rx="2" fill="#FFFFFF"/>
    <text x="440" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FABRIC</text>

    <!-- Zone: Shared storage -->
    <rect x="640" y="56" width="280" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="660" y="60" width="80" height="12" rx="2" fill="#FFFFFF"/>
    <text x="700" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SHARED FS</text>

    <!-- Arrows -->
    <!-- Launcher -> Worker pods -->
    <path d="M 192,148 V 184" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="164" y="156" width="56" height="12" rx="2" fill="#FFFFFF"/>
    <text x="192" y="165" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LAUNCH x4</text>

    <!-- Worker pods <-> NCCL (bidirectional) -->
    <path d="M 344,320 H 384" fill="none" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <rect x="346" y="298" width="36" height="12" rx="2" fill="#FFFFFF"/>
    <text x="364" y="307" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC</text>

    <!-- NCCL -> MPI -> EFA (vertical chain) -->
    <path d="M 492,264 V 296" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 492,360 V 392" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Worker pods -> FSx for Lustre -->
    <path d="M 344,404 H 640" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="454" y="376" width="64" height="12" rx="2" fill="#FFFFFF"/>
    <text x="486" y="385" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECKPOINT</text>

    <!-- FSx -> S3, FSx -> Checkpoints store -->
    <path d="M 828,168 V 200" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 780,232 H 748 Q 740,232 740,240 V 296" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: Launcher pod (focal) -->
    <rect x="80" y="96" width="224" height="52" rx="6" fill="#FFFFFF"/>
    <rect x="80" y="96" width="224" height="52" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="192" y="126" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Launcher 파드</text>

    <!-- Node: Worker pods (merged x4) -->
    <rect x="64" y="184" width="256" height="120" rx="6" fill="#FFFFFF"/>
    <rect x="64" y="184" width="256" height="120" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="192" y="234" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Worker 파드 x4</text>
    <text x="192" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">worker-0 .. worker-3</text>
    <text x="192" y="266" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gradient allreduce</text>

    <!-- Node: NVIDIA NCCL -->
    <rect x="404" y="216" width="176" height="48" rx="6" fill="#FFFFFF"/>
    <rect x="404" y="216" width="176" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="492" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">NVIDIA NCCL</text>

    <!-- Node: MPI -->
    <rect x="404" y="296" width="176" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="404" y="296" width="176" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="492" y="324" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">MPI</text>
    <text x="492" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rank coordination</text>

    <!-- Node: EFA -->
    <rect x="404" y="392" width="176" height="60" rx="6" fill="#FFFFFF"/>
    <rect x="404" y="392" width="176" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="492" y="418" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Elastic Fabric</text>
    <text x="492" y="436" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Adapter (EFA)</text>

    <!-- Node: FSx for Lustre -->
    <rect x="700" y="96" width="192" height="72" rx="6" fill="#FFFFFF"/>
    <rect x="700" y="96" width="192" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="796" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">FSx for Lustre</text>
    <text x="796" y="146" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">high-throughput scratch</text>

    <!-- Node: Amazon S3 -->
    <rect x="700" y="200" width="192" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="700" y="200" width="192" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="796" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Amazon S3</text>
    <text x="796" y="246" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">datasets · artifacts</text>

    <!-- Node: Checkpoints store -->
    <rect x="700" y="296" width="192" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="700" y="296" width="192" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="796" y="324" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">체크포인트 저장소</text>
    <text x="796" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">model checkpoints</text>

    <!-- Legend -->
    <line x1="40" y1="516" x2="920" y2="516" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="532" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="540" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="548" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">주요 흐름 (focal)</text>
    <line x1="220" y1="545" x2="248" y2="545" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <text x="256" y="548" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">양방향 통신</text>
  </svg>