<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ce-tt-title ce-tt-desc">
    <title id="ce-tt-title">Chaos Engineering vs. Traditional Testing</title>
    <desc id="ce-tt-desc">Comparison flowchart showing how traditional testing only surfaces failures in production, while chaos engineering continuously injects faults to discover weaknesses and build a resilient system.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Lane labels -->
    <text x="140" y="104" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TRADITIONAL TESTING</text>
    <text x="124" y="288" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHAOS ENGINEERING</text>

    <!-- Traditional lane arrows (y=152, straight) -->
    <line x1="340" y1="152" x2="380" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="580" y1="152" x2="620" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Chaos lane arrows (y=332, straight) -->
    <line x1="284" y1="332" x2="308" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="468" y1="332" x2="492" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="652" y1="332" x2="676" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Traditional Testing lane: 3 boxes -->
    <rect x="140" y="120" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Development</text>
    <text x="240" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Environment Testing</text>

    <rect x="380" y="120" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Staging</text>
    <text x="480" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Environment Testing</text>

    <rect x="620" y="120" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Production</text>
    <text x="720" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Failure Occurs</text>

    <!-- Chaos Engineering lane: 4 boxes -->
    <rect x="124" y="300" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="204" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Continuous</text>
    <text x="204" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Fault Injection</text>

    <rect x="308" y="300" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="388" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Discover</text>
    <text x="388" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Weaknesses</text>

    <rect x="492" y="300" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="572" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Proactive</text>
    <text x="572" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Fixes</text>

    <rect x="676" y="300" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="756" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Resilient</text>
    <text x="756" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">System</text>

    <!-- Legend -->
    <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="552" width="24" height="14" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="72" y="563" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Testing step</text>

    <rect x="220" y="552" width="24" height="14" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="252" y="563" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Target outcome</text>
  </svg>