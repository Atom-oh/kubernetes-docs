<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calico-egress-gw-title calico-egress-gw-desc">
    <title id="calico-egress-gw-title">Egress Gateway traffic path</title>
    <desc id="calico-egress-gw-desc">Pods in the production namespace route outbound traffic through a dedicated Egress Gateway pod, which source-NATs it to a fixed external IP before it reaches partner services.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- zones -->
    <rect x="20" y="188" width="280" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="28" y="192" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="80" y="201" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">NS: PRODUCTION</text>

    <rect x="340" y="188" width="280" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="348" y="192" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="408" y="201" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">EGRESS GATEWAYS</text>

    <rect x="660" y="188" width="280" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="668" y="192" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="724" y="201" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">EXTERNAL SERVICES</text>

    <!-- connectors -->
    <line x1="260" y1="252" x2="380" y2="252" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="260" y1="340" x2="380" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="580" y1="252" x2="700" y2="252" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="580" y1="340" x2="700" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- SNAT labels -->
    <rect x="620" y="232" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="241" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SNAT</text>
    <rect x="620" y="320" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="329" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SNAT</text>

    <!-- Pod A -->
    <rect x="60" y="220" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="220" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="256" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod A</text>

    <!-- Pod B -->
    <rect x="60" y="308" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="308" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="344" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod B</text>

    <!-- Egress Gateway 1 (focal) -->
    <rect x="380" y="220" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="220" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="248" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Egress Gateway 1</text>
    <text x="480" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">203.0.113.10</text>

    <!-- Egress Gateway 2 (focal) -->
    <rect x="380" y="308" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="308" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="336" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Egress Gateway 2</text>
    <text x="480" y="352" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">203.0.113.11</text>

    <!-- Partner API -->
    <rect x="700" y="220" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="700" y="220" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="800" y="248" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Partner API</text>
    <text x="800" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">allow .10-.11</text>

    <!-- Database -->
    <rect x="700" y="308" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="700" y="308" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="800" y="336" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Database</text>
    <text x="800" y="352" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">ACL 203.0.113.0/24</text>
  </svg>