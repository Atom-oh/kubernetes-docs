<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="par-title par-desc">
    <title id="par-title">모델 병렬화 전략 4가지</title>
    <desc id="par-desc">데이터 병렬화, 텐서 병렬화, 파이프라인 병렬화, 전문가 병렬화(MoE)라는 네 가지 독립적인 분산 훈련 전략 각각의 내부 흐름을 나란히 비교해서 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="24" y="88" width="432" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="48" y="92" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="108" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">데이터 병렬화</text>

    <rect x="480" y="88" width="432" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="504" y="92" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="564" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">텐서 병렬화</text>

    <rect x="24" y="332" width="432" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="48" y="336" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="118" y="345" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">파이프라인 병렬화</text>

    <rect x="480" y="332" width="432" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="504" y="336" width="160" height="12" rx="2" fill="#ffffff"/>
    <text x="584" y="345" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">전문가 병렬화 (MOE)</text>

    <!-- Arrows: one per zone, straight horizontal (same y) -->
    <line x1="228" y1="180" x2="252" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="684" y1="180" x2="708" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="228" y1="424" x2="252" y2="424" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="684" y1="424" x2="708" y2="424" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Zone TL: Data parallelism -->
    <rect x="48" y="148" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="48" y="148" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="56" y="156" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="70" y="165" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GPU</text>
    <text x="138" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">데이터 샤드 → 모델</text>
    <text x="138" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">복제본 (×3)</text>

    <rect x="252" y="148" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="252" y="148" width="180" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="260" y="156" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="274" y="165" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
    <text x="342" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">그래디언트 동기화</text>
    <text x="342" y="196" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AllReduce</text>

    <!-- Zone TR: Tensor parallelism -->
    <rect x="504" y="148" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="504" y="148" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="512" y="156" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="526" y="165" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GPU</text>
    <text x="594" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">단일 레이어 열 분할</text>
    <text x="594" y="196" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPU 1 / GPU 2</text>

    <rect x="708" y="148" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="708" y="148" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="716" y="156" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="730" y="165" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUM</text>
    <text x="798" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">결과 결합</text>
    <text x="798" y="196" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">combine</text>

    <!-- Zone BL: Pipeline parallelism -->
    <rect x="48" y="392" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="48" y="392" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="56" y="400" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="70" y="409" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BAT</text>
    <text x="138" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">마이크로 배치</text>

    <rect x="252" y="392" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="252" y="392" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="260" y="400" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="274" y="409" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GPU</text>
    <text x="342" y="426" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">스테이지 1→2→3</text>
    <text x="342" y="440" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPU 1-3</text>

    <!-- Zone BR: Expert parallelism (MoE) -->
    <rect x="504" y="392" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="504" y="392" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="512" y="400" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="526" y="409" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RTR</text>
    <text x="594" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">라우터 / 게이팅</text>

    <rect x="708" y="392" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="708" y="392" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="716" y="400" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="730" y="409" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GPU</text>
    <text x="798" y="424" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">전문가 1-4 → 결합</text>
    <text x="798" y="438" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPU 1-4</text>

    <!-- Legend -->
    <line x1="24" y1="568" x2="936" y2="568" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="588" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="200" cy="584" r="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="212" y="588" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">COMPUTE STEP</text>
    <circle cx="380" cy="584" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="392" y="588" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">COMMUNICATION BOTTLENECK</text>
  </svg>