<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title dg-desc">
  <title id="dg-title">Log Storage Decision Flow</title>
  <desc id="dg-desc">A decision tree for choosing a log storage backend: it branches on an existing Grafana stack, need for full-text search, preference for AWS-native tooling, analysis complexity, and cost versus features, converging on Loki, OpenSearch, or CloudWatch Logs.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <text x="40" y="24" class="mono" font-size="8" letter-spacing="0.14em" fill="#7D8998">OBSERVABILITY &#183; LOGGING</text>
  <text x="40" y="48" class="sans" font-size="20" font-weight="700" fill="#232F3E">Log Storage Decision Flow</text>

  <!-- ============ ARROWS ============ -->

  <!-- START -> Q1 -->
  <line x1="480" y1="96" x2="480" y2="116" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Q1 -> Q2 (YES) -->
  <path d="M 464,172 V 178 Q 464,186 456,186 H 248 Q 240,186 240,192 V 200"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Q1 -> Q3 (NO) -->
  <path d="M 496,172 V 178 Q 496,186 504,186 H 712 Q 720,186 720,192 V 200"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Q2 -> OS (YES, full-text search) -->
  <path d="M 252,256 V 264 Q 252,272 260,272 H 432 Q 440,272 440,280 V 456"
        fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <!-- Q2 -> LOKI (NO) -->
  <path d="M 228,256 V 264 Q 228,272 220,272 H 158 Q 150,272 150,280 V 456"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Q3 -> Q4 (YES) -->
  <path d="M 708,256 V 262 Q 708,270 700,270 H 568 Q 560,270 560,276 V 284"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Q3 -> Q5 (NO) -->
  <path d="M 732,256 V 262 Q 732,270 740,270 H 792 Q 800,270 800,276 V 284"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Q4 -> OS (COMPLEX) -->
  <path d="M 548,340 V 356 Q 548,364 540,364 H 488 Q 480,364 480,372 V 456"
        fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <!-- Q4 -> CW (SIMPLE) -->
  <path d="M 572,340 V 376 Q 572,384 580,384 H 800 Q 808,384 808,392 V 456"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Q5 -> OS (FEATURES FIRST) -->
  <path d="M 784,340 V 406 Q 784,414 776,414 H 528 Q 520,414 520,422 V 456"
        fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <!-- Q5 -> LOKI (COST FIRST) — routed around the right/bottom edge, entering LOKI from below -->
  <path d="M 876,312 H 904 Q 912,312 912,320 V 514 Q 912,522 904,522 H 158 Q 150,522 150,514 V 508"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============ ARROW LABELS ============ -->
  <rect x="337" y="166" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="352" y="175" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="#545B64">YES</text>
  <rect x="593" y="166" width="26" height="12" rx="2" fill="#ffffff"/>
  <text x="606" y="175" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="#545B64">NO</text>

  <rect x="619" y="250" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="634" y="259" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="#545B64">YES</text>
  <rect x="753" y="250" width="26" height="12" rx="2" fill="#ffffff"/>
  <text x="766" y="259" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="#545B64">NO</text>

  <rect x="259" y="240" width="34" height="12" rx="2" fill="#ffffff"/>
  <text x="276" y="249" class="mono" font-size="8" letter-spacing="0.04em" text-anchor="middle" fill="#EC7211">YES</text>
  <rect x="180" y="240" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="195" y="249" class="mono" font-size="8" letter-spacing="0.04em" text-anchor="middle" fill="#545B64">NO</text>

  <rect x="500" y="344" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="530" y="353" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#EC7211">COMPLEX</text>
  <rect x="592" y="360" width="52" height="12" rx="2" fill="#ffffff"/>
  <text x="618" y="369" class="mono" font-size="8" letter-spacing="0.03em" text-anchor="middle" fill="#545B64">SIMPLE</text>

  <rect x="676" y="390" width="80" height="12" rx="2" fill="#ffffff"/>
  <text x="716" y="399" class="mono" font-size="8" letter-spacing="0.01em" text-anchor="middle" fill="#EC7211">FEATURES FIRST</text>
  <rect x="617" y="502" width="66" height="12" rx="2" fill="#ffffff"/>
  <text x="650" y="511" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#545B64">COST FIRST</text>

  <!-- ============ NODES ============ -->

  <!-- START -->
  <rect x="400" y="64" width="160" height="32" rx="16" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="85" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Choose Log Storage</text>

  <!-- Q1 diamond (focal) -->
  <polygon points="480,116 568,144 480,172 392,144" fill="#ffffff" stroke="#EC7211" stroke-width="1.4"/>
  <text x="480" y="140" class="sans" font-size="11" font-weight="600" text-anchor="middle" fill="#232F3E">Existing Grafana</text>
  <text x="480" y="154" class="sans" font-size="11" font-weight="600" text-anchor="middle" fill="#232F3E">stack?</text>

  <!-- Q2 diamond -->
  <polygon points="240,200 316,228 240,256 164,228" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="240" y="224" class="sans" font-size="10.5" font-weight="600" text-anchor="middle" fill="#232F3E">Need full-text</text>
  <text x="240" y="238" class="sans" font-size="10.5" font-weight="600" text-anchor="middle" fill="#232F3E">search?</text>

  <!-- Q3 diamond -->
  <polygon points="720,200 796,228 720,256 644,228" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="720" y="224" class="sans" font-size="10.5" font-weight="600" text-anchor="middle" fill="#232F3E">Prefer AWS</text>
  <text x="720" y="238" class="sans" font-size="10.5" font-weight="600" text-anchor="middle" fill="#232F3E">native?</text>

  <!-- Q4 diamond -->
  <polygon points="560,284 636,312 560,340 484,312" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="560" y="308" class="sans" font-size="10.5" font-weight="600" text-anchor="middle" fill="#232F3E">Analysis</text>
  <text x="560" y="322" class="sans" font-size="10.5" font-weight="600" text-anchor="middle" fill="#232F3E">complexity?</text>

  <!-- Q5 diamond -->
  <polygon points="800,284 876,312 800,340 724,312" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="800" y="308" class="sans" font-size="10.5" font-weight="600" text-anchor="middle" fill="#232F3E">Cost vs</text>
  <text x="800" y="322" class="sans" font-size="10.5" font-weight="600" text-anchor="middle" fill="#232F3E">features?</text>

  <!-- Terminal: Loki -->
  <rect x="80" y="456" width="140" height="52" rx="6" fill="#ffffff"/>
  <rect x="80" y="456" width="140" height="52" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="150" y="480" class="sans" font-size="13" font-weight="600" text-anchor="middle" fill="#232F3E">Loki</text>
  <text x="150" y="495" class="mono" font-size="8.5" text-anchor="middle" fill="#7D8998">cost-first &#183; S3</text>

  <!-- Terminal: OpenSearch (focal outcome) -->
  <rect x="400" y="456" width="160" height="52" rx="6" fill="#ffffff"/>
  <rect x="400" y="456" width="160" height="52" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.4"/>
  <text x="480" y="480" class="sans" font-size="13" font-weight="600" text-anchor="middle" fill="#232F3E">OpenSearch</text>
  <text x="480" y="495" class="mono" font-size="8.5" text-anchor="middle" fill="#7D8998">full-text &#183; analytics</text>

  <!-- Terminal: CloudWatch Logs -->
  <rect x="736" y="456" width="144" height="52" rx="6" fill="#ffffff"/>
  <rect x="736" y="456" width="144" height="52" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="808" y="480" class="sans" font-size="12.5" font-weight="600" text-anchor="middle" fill="#232F3E">CloudWatch Logs</text>
  <text x="808" y="495" class="mono" font-size="8.5" text-anchor="middle" fill="#7D8998">AWS-native &#183; simple</text>

  <!-- ============ LEGEND ============ -->
  <line x1="40" y1="546" x2="920" y2="546" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="562" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <polygon points="52,576 62,582 52,588 42,582" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="70" y="586" class="sans" font-size="8.5" fill="#545B64">Decision</text>
  <rect x="176" y="576" width="14" height="12" rx="3" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
  <text x="200" y="586" class="sans" font-size="8.5" fill="#545B64">Storage outcome</text>
  <rect x="340" y="576" width="14" height="12" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="364" y="586" class="sans" font-size="8.5" fill="#545B64">Most-reached outcome (OpenSearch, 3 paths)</text>
</svg>
