    <title id="ko-core-04-storage-6-title">Filesystem Mode와 Block Mode 비교</title>
    <desc id="ko-core-04-storage-6-desc">같은 PersistentVolume이 Filesystem Mode에서는 ext4/xfs로 포맷된 디렉토리로, Block Mode에서는 /dev/xvda 원시 블록 디바이스로 파드에 노출되는 두 방식을 나란히 비교한다.</desc>
