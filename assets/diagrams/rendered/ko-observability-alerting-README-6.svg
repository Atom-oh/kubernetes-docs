<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="eks-zones-title eks-zones-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="eks-zones-title">Amazon EKS 알림 영역 구성</title>
    <desc id="eks-zones-desc">EKS 클러스터의 알림 대상을 컨트롤 플레인, 데이터 플레인, 네트워킹, 스토리지 네 영역으로 나누고 각 영역의 핵심 감시 대상을 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zone: Control plane -->
    <rect x="20" y="60" width="440" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="36" y="64" width="128" height="14" rx="2" fill="#ffffff"/>
    <text x="100" y="74" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">컨트롤 플레인</text>

    <!-- Zone: Data plane -->
    <rect x="500" y="60" width="440" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="516" y="64" width="120" height="14" rx="2" fill="#ffffff"/>
    <text x="576" y="74" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">데이터 플레인</text>

    <!-- Zone: Network -->
    <rect x="20" y="320" width="440" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="36" y="324" width="96" height="14" rx="2" fill="#ffffff"/>
    <text x="84" y="334" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">네트워킹</text>

    <!-- Zone: Storage -->
    <rect x="500" y="320" width="440" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="516" y="324" width="96" height="14" rx="2" fill="#ffffff"/>
    <text x="564" y="334" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">스토리지</text>

    <!-- Control plane nodes -->
    <rect x="36" y="100" width="120" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="96" y="132" fill="#EC7211" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Server</text>

    <rect x="180" y="100" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="132" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">etcd</text>

    <rect x="324" y="100" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="384" y="128" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Scheduler /</text>
    <text x="384" y="142" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Controller Mgr</text>

    <!-- Data plane nodes -->
    <rect x="516" y="100" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="576" y="128" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">노드 상태</text>
    <text x="576" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Node</text>

    <rect x="660" y="100" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="128" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">파드 상태</text>
    <text x="720" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pod</text>

    <rect x="804" y="100" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="864" y="128" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">컨테이너 상태</text>
    <text x="864" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Container</text>

    <!-- Network nodes -->
    <rect x="36" y="360" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="96" y="388" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC CNI</text>

    <rect x="180" y="360" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="388" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">서비스/인그레스</text>

    <rect x="324" y="360" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="384" y="388" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CoreDNS</text>

    <!-- Storage nodes -->
    <rect x="516" y="360" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="576" y="388" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EBS CSI</text>

    <rect x="660" y="360" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="388" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EFS CSI</text>

    <rect x="804" y="360" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="864" y="388" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PV / PVC</text>

    <!-- Legend -->
    <line x1="20" y1="580" x2="940" y2="580" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="20" y="596" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="220" cy="592" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="232" y="596" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">클러스터 가용성의 단일 관문 (초점)</text>
  </svg>