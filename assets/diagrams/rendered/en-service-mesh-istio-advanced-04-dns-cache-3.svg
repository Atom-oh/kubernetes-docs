<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rollout-title rollout-desc">
    <title id="rollout-title">DNS Proxy Rollout Decision Flow</title>
    <desc id="rollout-desc">Flowchart showing a gradual rollout of DNS Proxy through test, staging, and production, with validation and monitoring gates that route back to troubleshooting or rollback on failure.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ============ ARROWS (before boxes) ============ -->

    <!-- Start -> Test -->
    <line x1="240" y1="64" x2="240" y2="88" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Test -> Validate -->
    <line x1="240" y1="136" x2="240" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Validate -> Debug (NO) -->
    <line x1="340" y1="192" x2="600" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="452" y="176" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="470" y="186" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
    <!-- Debug -> Test (loop back) -->
    <path d="M 680,168 V 152 Q 680,144 672,144 H 288 Q 280,144 280,136"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Validate -> Stage (YES) -->
    <line x1="240" y1="224" x2="240" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="248" y="228" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="266" y="238" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
    <!-- Stage -> Monitor -->
    <line x1="240" y1="296" x2="240" y2="320" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Monitor -> Rollback (NO) -->
    <line x1="340" y1="352" x2="600" y2="352" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="452" y="336" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="470" y="346" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
    <!-- Rollback -> Debug (loop back) -->
    <line x1="680" y1="328" x2="680" y2="216" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Monitor -> Prod (YES) -->
    <line x1="240" y1="384" x2="240" y2="408" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="248" y="388" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="266" y="398" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
    <!-- Prod -> Complete -->
    <line x1="240" y1="456" x2="240" y2="480" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- ============ NODES ============ -->

    <!-- Start (oval) -->
    <ellipse cx="240" cy="44" rx="80" ry="20" fill="#ffffff"/>
    <ellipse cx="240" cy="44" rx="80" ry="20" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="240" y="48" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Start</text>

    <!-- Test (rect) -->
    <rect x="160" y="88" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="160" y="88" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="108" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Enable DNS Proxy</text>
    <text x="240" y="122" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">test environment</text>

    <!-- Validate (diamond) -->
    <polygon points="240,160 340,192 240,224 140,192" fill="#ffffff"/>
    <polygon points="240,160 340,192 240,224 140,192" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="188" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Validation</text>
    <text x="240" y="202" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">successful?</text>

    <!-- Debug (optional/off-path) -->
    <rect x="600" y="168" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="600" y="168" width="160" height="48" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="680" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Troubleshoot</text>

    <!-- Stage (rect) -->
    <rect x="160" y="248" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="160" y="248" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Apply to staging</text>
    <text x="240" y="282" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">environment</text>

    <!-- Monitor (diamond) -->
    <polygon points="240,320 340,352 240,384 140,352" fill="#ffffff"/>
    <polygon points="240,320 340,352 240,384 140,352" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Monitoring</text>
    <text x="240" y="362" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">normal?</text>

    <!-- Rollback (optional/off-path) -->
    <rect x="600" y="328" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="600" y="328" width="160" height="48" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="680" y="356" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rollback</text>

    <!-- Prod (rect) -->
    <rect x="160" y="408" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="160" y="408" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gradual rollout</text>
    <text x="240" y="442" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">to production</text>

    <!-- Complete (oval, focal) -->
    <ellipse cx="240" cy="500" rx="80" ry="20" fill="#ffffff"/>
    <ellipse cx="240" cy="500" rx="80" ry="20" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="240" y="504" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Complete</text>

    <!-- Legend -->
    <line x1="30" y1="548" x2="930" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <ellipse cx="152" cy="564" rx="12" ry="8" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="180" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">START / END</text>
    <rect x="330" y="558" width="24" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="366" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">ACTION STEP</text>
    <polygon points="510,552 528,564 510,576 492,564" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="546" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">DECISION</text>
    <rect x="660" y="558" width="24" height="12" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="696" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">OFF HAPPY PATH</text>
  </svg>