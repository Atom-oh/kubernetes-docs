<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="golden-signals-title golden-signals-desc">
    <title id="golden-signals-title">Four Golden Signals</title>
    <desc id="golden-signals-desc">Diagram presenting the four golden signals of monitoring side by side: latency (response time), traffic (throughput), errors (error rate), and saturation (resource usage).</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Card 1: Latency -->
    <rect x="32" y="230" width="200" height="140" rx="6" fill="#ffffff"/>
    <rect x="32" y="230" width="200" height="140" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="204" y="358" fill="rgba(35,47,62,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
    <text x="52" y="270" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Latency</text>
    <text x="52" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">response time</text>

    <!-- Card 2: Traffic -->
    <rect x="264" y="230" width="200" height="140" rx="6" fill="#ffffff"/>
    <rect x="264" y="230" width="200" height="140" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="436" y="358" fill="rgba(35,47,62,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
    <text x="284" y="270" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Traffic</text>
    <text x="284" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">throughput</text>

    <!-- Card 3: Errors -->
    <rect x="496" y="230" width="200" height="140" rx="6" fill="#ffffff"/>
    <rect x="496" y="230" width="200" height="140" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="668" y="358" fill="rgba(35,47,62,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">03</text>
    <text x="516" y="270" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Errors</text>
    <text x="516" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">error rate</text>

    <!-- Card 4: Saturation -->
    <rect x="728" y="230" width="200" height="140" rx="6" fill="#ffffff"/>
    <rect x="728" y="230" width="200" height="140" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="900" y="358" fill="rgba(35,47,62,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">04</text>
    <text x="748" y="270" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Saturation</text>
    <text x="748" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">resource usage</text>
  </svg>