<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sglang-title sglang-desc">
    <title id="sglang-title">SGLang Architecture</title>
    <desc id="sglang-desc">Three-tier view of SGLang showing its frontend APIs feeding a RadixAttention runtime engine, which in turn drives KV-cache reuse and schedule-overlap optimizations.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Arrows (drawn before boxes) ===== -->
    <!-- Frontend -> Runtime -->
    <line x1="280" y1="250" x2="360" y2="250" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Runtime -> Optimization: RadixAttention feeds KV Cache Reuse (accent) -->
    <line x1="600" y1="233" x2="680" y2="233" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- Runtime -> Optimization: Compressed FSM feeds Schedule Overlap -->
    <line x1="600" y1="267" x2="680" y2="267" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Arrow labels ===== -->
    <rect x="290" y="228" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="238" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DSL / API</text>

    <rect x="608" y="211" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="634" y="221" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REUSE</text>

    <rect x="606" y="279" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="634" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OVERLAP</text>

    <!-- ===== Nodes ===== -->

    <!-- Frontend -->
    <rect x="40" y="200" width="240" height="100" rx="6" fill="#ffffff"/>
    <rect x="40" y="200" width="240" height="100" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="160" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Frontend</text>
    <text x="160" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SGLang DSL</text>
    <text x="160" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OpenAI-compatible API</text>
    <text x="160" y="276" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Native API</text>

    <!-- Runtime Engine (FOCAL) -->
    <rect x="360" y="200" width="240" height="100" rx="6" fill="#ffffff"/>
    <rect x="360" y="200" width="240" height="100" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Runtime Engine</text>
    <text x="480" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RadixAttention</text>
    <text x="480" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Compressed FSM output</text>
    <text x="480" y="276" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Chunked prefill · FlashInfer</text>

    <!-- Optimization -->
    <rect x="680" y="200" width="240" height="100" rx="6" fill="#ffffff"/>
    <rect x="680" y="200" width="240" height="100" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="800" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Optimization</text>
    <text x="800" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KV cache reuse</text>
    <text x="800" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Schedule overlapping</text>
    <text x="800" y="276" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Data parallelism</text>

    <!-- Legend -->
    <line x1="40" y1="360" x2="920" y2="360" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="376" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="392" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="60" y="400" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Client-facing API</text>

    <rect x="216" y="392" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="236" y="400" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Focal / runtime</text>

    <rect x="392" y="392" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="412" y="400" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Derived optimization</text>
  </svg>