<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zone-local-happy-title zone-local-happy-desc">
<title id="zone-local-happy-title">Zone-local 트래픽 처리 흐름</title>
<desc id="zone-local-happy-desc">정상 상태에서 Client A의 요청이 같은 Zone A의 Envoy Sidecar와 Pod만 거쳐 처리되고, Zone B의 Pod는 사용되지 않음을 보여줍니다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ============ LIFELINES ============ -->
<line x1="140" y1="140" x2="140" y2="500" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="440" y1="140" x2="440" y2="500" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="740" y1="140" x2="740" y2="500" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- zone eyebrow: all three actors (Client A, Envoy Sidecar, Pod A) live in Zone A -->
<text x="440" y="106" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ZONE A · US-EAST-1A</text>

<!-- ============ MESSAGES (arrows drawn before actor boxes) ============ -->
<!-- 1. ClientA -> EnvoyA -->
<line x1="140" y1="176" x2="440" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="256" y="156" width="68" height="12" rx="2" fill="#ffffff"/>
<text x="290" y="165" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GET /api</text>

<!-- note: locality-aware routing -->
<rect x="300" y="192" width="180" height="28" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
<text x="390" y="204" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LOCALITY-AWARE ROUTING</text>
<text x="390" y="215" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">distribute: 100% local</text>

<!-- 2. EnvoyA -> PodA (headline / accent) -->
<line x1="440" y1="244" x2="740" y2="244" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="546" y="224" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="590" y="233" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Request (zone-local)</text>

<!-- note between EnvoyA and PodA -->
<rect x="480" y="260" width="220" height="16" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
<text x="590" y="271" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">같은 zone 내에서 처리</text>

<!-- 3. PodA -> EnvoyA (return, dashed filled) -->
<line x1="740" y1="308" x2="440" y2="308" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="556" y="288" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="588" y="297" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Response</text>

<!-- 4. EnvoyA -> ClientA (return, dashed filled) -->
<line x1="440" y1="356" x2="140" y2="356" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="256" y="336" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="288" y="345" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Response</text>

<!-- note: Zone B / Pod B unused (placed in open canvas between Envoy and Pod A lifelines, avoiding overlap) -->
<rect x="520" y="392" width="160" height="32" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
<text x="600" y="405" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ZONE B · POD B</text>
<text x="600" y="417" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">사용되지 않음</text>

<!-- ============ ACTIVATION BARS ============ -->
<rect x="136" y="176" width="8" height="180" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="436" y="176" width="8" height="180" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="736" y="244" width="8" height="64" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- ============ ACTOR BOXES (drawn last) ============ -->
<rect x="80" y="140" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="80" y="140" width="120" height="36" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="140" y="162" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client A</text>

<rect x="380" y="140" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="380" y="140" width="120" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="440" y="162" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>

<rect x="680" y="140" width="120" height="44" rx="6" fill="#ffffff"/>
<rect x="680" y="140" width="120" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="740" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A</text>
<text x="740" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone=a</text>

<!-- ============ LEGEND ============ -->
<line x1="60" y1="452" x2="900" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="60" y="470" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

<line x1="180" y1="464" x2="212" y2="464" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="220" y="468" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Zone-local 요청 (headline)</text>

<line x1="460" y1="464" x2="492" y2="464" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="500" y="468" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">응답 (dashed)</text>

</svg>