    <desc id="ko-basics-05-ebpf-fundamentals-0-desc">사용자 공간에서 작성한 eBPF 프로그램이 컴파일과 검증, JIT 컴파일을 거쳐 커널 공간에서 실행되며 네트워크 패킷, 시스템 콜 등 다양한 이벤트 훅 포인트에 연결되는 과정을 보여주는 아키텍처 다이어그램.</desc>
