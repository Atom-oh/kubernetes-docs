<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-networking-README-5-title en-networking-README-5-desc">
<title id="en-networking-README-5-title">CNI Plugin Architecture</title>
<desc id="en-networking-README-5-desc">The kubelet invokes the node-local CNI binary, which the CNI agent also drives, and the binary in turn reads its config file and calls the IPAM plugin to allocate a Pod IP.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- zone -->
<rect x="80" y="180" width="760" height="280" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="92" y="188" width="176" height="12" rx="2" fill="#ffffff"/>
<text x="180" y="197" fill="rgba(35,47,62,0.4)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">CNI PLUGIN ARCHITECTURE</text>

<!-- connectors -->
<line x1="480" y1="156" x2="480" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="280" y1="248" x2="400" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M440,276 H308 Q300,276 300,284 V380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M520,276 H652 Q660,276 660,284 V380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Kubelet (caller, outside zone) -->
<rect x="400" y="100" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="480" y="126" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubelet</text>
<text x="480" y="142" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">caller</text>

<!-- Agent -->
<rect x="120" y="220" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="200" y="246" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CNI Agent</text>
<text x="200" y="262" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">per-node daemon</text>

<!-- Binary (focal) -->
<rect x="400" y="220" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="480" y="246" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CNI Binary</text>
<text x="480" y="262" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/opt/cni/bin/</text>

<!-- Config -->
<rect x="220" y="380" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="300" y="406" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CNI Config</text>
<text x="300" y="422" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/etc/cni/net.d/</text>

<!-- IPAM -->
<rect x="580" y="380" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="660" y="406" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">IPAM Plugin</text>
<text x="660" y="422" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">IP address mgmt</text>
</svg>