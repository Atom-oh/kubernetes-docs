<title id="image-pipeline-title">Image-to-Canary Delivery Pipeline</title>
<desc id="image-pipeline-desc">A new image built and pushed to ECR is picked up by Flux's image automation controllers, which commit an updated manifest that Kustomize applies, and Flagger's metrics analysis then promotes the resulting canary to primary or leaves it in place.</desc>
