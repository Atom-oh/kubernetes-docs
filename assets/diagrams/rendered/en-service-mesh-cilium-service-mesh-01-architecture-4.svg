      <title id="en-service-mesh-cilium-service-mesh-01-architecture-4-title">Sidecar proxy vs. per-node proxy resource footprint</title>
      <desc id="en-service-mesh-cilium-service-mesh-01-architecture-4-desc">Side-by-side diagram contrasting the sidecar model, where each pod runs its own 50MB Envoy proxy, with the node proxy model, where three pods on a node share a single 100MB Envoy instance.</desc>
