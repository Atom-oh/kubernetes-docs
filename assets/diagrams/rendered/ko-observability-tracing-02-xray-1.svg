<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="xray-map-title xray-map-desc">
<title id="xray-map-title">응답 시간이 표시된 X-Ray 서비스 맵</title>
<desc id="xray-map-desc">클라이언트 요청이 API Gateway를 거쳐 Auth Service와 Order Service로 분기되고, Order Service가 Payment Service, DynamoDB, ElastiCache를 호출하는 경로마다 응답 시간과 Payment Service의 오류율을 함께 보여준다.</desc>
<defs>
  <style>
    @import url(https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap);
    text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;}
    .mono{font-family:'Geist Mono',ui-monospace,monospace;}
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- ===== Arrows (drawn before nodes) ===== -->

<!-- CLIENT -> APIGW : straight horizontal, y=296 -->
<path d="M160,296 H232" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- APIGW -> AUTH : up then right, attach APIGW top (302,268) -> AUTH left (452,168) -->
<path d="M302,268 V176 Q302,168 310,168 H452"
      fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- APIGW -> ORDER : straight horizontal, y=296 -->
<path d="M372,296 H452" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ORDER -> PAYMENT : straight horizontal, y=296 -->
<path d="M592,296 H664" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ORDER -> CACHE : straight vertical, x=522 -->
<path d="M522,324 V420" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ORDER -> DB : down, right, down. attach ORDER bottom (480,324) -> DB top (744,420) -->
<path d="M480,324 V392 Q480,400 488,400 H736 Q744,400 744,408 V420"
      fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- PAYMENT -> DB : straight vertical, x=744 -->
<path d="M744,324 V420" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ===== Nodes ===== -->

<!-- CLIENT -->
<rect x="40" y="268" width="120" height="56" rx="6" fill="rgba(35,47,62,0.10)"/>
<rect x="40" y="268" width="120" height="56" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="100" y="294" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Client</text>
<text x="100" y="310" fill="#545B64" font-size="9" class="mono" text-anchor="middle">응답 250ms</text>

<!-- APIGW -->
<rect x="232" y="268" width="140" height="56" rx="6" fill="#ffffff"/>
<rect x="232" y="268" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="302" y="294" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API Gateway</text>
<text x="302" y="310" fill="#545B64" font-size="9" class="mono" text-anchor="middle">응답 50ms</text>

<!-- AUTH -->
<rect x="452" y="140" width="140" height="56" rx="6" fill="#ffffff"/>
<rect x="452" y="140" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="522" y="166" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Auth Service</text>
<text x="522" y="182" fill="#545B64" font-size="9" class="mono" text-anchor="middle">응답 30ms</text>

<!-- ORDER (focal) -->
<rect x="452" y="268" width="140" height="56" rx="6" fill="rgba(255,153,0,0.10)"/>
<rect x="452" y="268" width="140" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="522" y="294" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Order Service</text>
<text x="522" y="310" fill="#545B64" font-size="9" class="mono" text-anchor="middle">응답 100ms</text>

<!-- PAYMENT -->
<rect x="664" y="268" width="160" height="56" rx="6" fill="#ffffff"/>
<rect x="664" y="268" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="744" y="290" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Payment Service</text>
<text x="744" y="304" fill="#545B64" font-size="9" class="mono" text-anchor="middle">응답 150ms</text>
<text x="744" y="316" fill="#DD344C" font-size="9" class="mono" text-anchor="middle">오류율 2%</text>

<!-- CACHE (store, cylinder): X=452 Y=420 W=140 H=64 -->
<rect x="452" y="432" width="140" height="40" fill="rgba(35,47,62,0.05)"/>
<line x1="452" y1="432" x2="452" y2="472" stroke="#545B64" stroke-width="1"/>
<line x1="592" y1="432" x2="592" y2="472" stroke="#545B64" stroke-width="1"/>
<path d="M452,472 A70,12 0 0,0 592,472" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<ellipse cx="522" cy="432" rx="70" ry="12" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="522" y="500" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">ElastiCache</text>
<text x="522" y="516" fill="#545B64" font-size="9" class="mono" text-anchor="middle">응답 5ms</text>

<!-- DB (store, cylinder): X=664 Y=420 W=160 H=64 -->
<rect x="664" y="432" width="160" height="40" fill="rgba(35,47,62,0.05)"/>
<line x1="664" y1="432" x2="664" y2="472" stroke="#545B64" stroke-width="1"/>
<line x1="824" y1="432" x2="824" y2="472" stroke="#545B64" stroke-width="1"/>
<path d="M664,472 A80,12 0 0,0 824,472" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<ellipse cx="744" cy="432" rx="80" ry="12" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="744" y="500" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">DynamoDB</text>
<text x="744" y="516" fill="#545B64" font-size="9" class="mono" text-anchor="middle">응답 20ms</text>

<!-- ===== Legend ===== -->
<line x1="40" y1="562" x2="920" y2="562" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<circle cx="48" cy="578" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="58" y="581" fill="#545B64" font-size="8" class="mono" letter-spacing="0.04em">가장 많은 호출을 처리하는 서비스</text>
<circle cx="330" cy="578" r="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="340" y="581" fill="#545B64" font-size="8" class="mono" letter-spacing="0.04em">데이터 저장소</text>
<circle cx="470" cy="578" r="4" fill="#DD344C"/>
<text x="480" y="581" fill="#545B64" font-size="8" class="mono" letter-spacing="0.04em">오류율 표시</text>
</svg>