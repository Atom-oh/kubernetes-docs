    <title id="ko-autoscaling-03-knative-2-title">Knative Service 리소스 계층과 트래픽 분배</title>
    <desc id="ko-autoscaling-03-knative-2-desc">Service가 Configuration과 Route를 소유하고, Configuration이 Revision을 생성하며, Route가 최신 Revision에는 트래픽 100%를, 이전 Revision에는 0%를 배분해 유지하는 구조를 보여주는 다이어그램.</desc>
