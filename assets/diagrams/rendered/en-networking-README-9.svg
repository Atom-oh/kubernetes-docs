<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-networking-README-9-title en-networking-README-9-desc">
<title id="en-networking-README-9-title">VPC CNI ENI Assignment</title>
<desc id="en-networking-README-9-desc">Inside a worker node, the AWS VPC CNI hands out secondary IP addresses from each attached elastic network interface to the pods scheduled on that node, with a spare ENI held in reserve.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- outer zone: EC2 Instance -->
<rect x="80" y="80" width="800" height="480" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="92" y="88" width="230" height="12" rx="2" fill="#ffffff"/>
<text x="207" y="97" fill="rgba(35,47,62,0.4)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EC2 INSTANCE (WORKER NODE)</text>

<!-- inner zone: Pods -->
<rect x="560" y="100" width="280" height="420" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>
<rect x="572" y="108" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="598" y="117" fill="rgba(35,47,62,0.4)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">PODS</text>

<!-- connectors -->
<path d="M300,192 H432 Q440,192 440,184 V160 Q440,152 448,152 H600" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M300,212 H452 Q460,212 460,220 V252 Q460,260 468,260 H600" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M300,312 H432 Q440,312 440,320 V364 Q440,372 448,372 H600" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M300,332 H452 Q460,332 460,340 V364 a8,8 0 0,0 0,16 V472 Q460,480 468,480 H600" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ENI1 -->
<rect x="140" y="172" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="220" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Primary ENI</text>
<text x="220" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eth0</text>

<!-- ENI2 -->
<rect x="140" y="292" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="220" y="320" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Secondary ENI</text>
<text x="220" y="336" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eth1</text>

<!-- ENI3 (no traffic yet) -->
<rect x="140" y="412" width="160" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="220" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Secondary ENI</text>
<text x="220" y="456" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eth2 · spare</text>

<!-- Pods -->
<rect x="600" y="128" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="700" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 1</text>
<text x="700" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">secondary IP</text>

<rect x="600" y="236" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="700" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 2</text>
<text x="700" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">secondary IP</text>

<rect x="600" y="348" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="700" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 3</text>
<text x="700" y="384" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">secondary IP</text>

<rect x="600" y="456" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="700" y="476" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 4</text>
<text x="700" y="492" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">secondary IP</text>
</svg>