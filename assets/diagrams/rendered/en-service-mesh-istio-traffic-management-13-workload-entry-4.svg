<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="migration-phases-title migration-phases-desc">
    <title id="migration-phases-title">VM-to-Kubernetes migration phases</title>
    <desc id="migration-phases-desc">Flowchart of the five-phase path for moving a workload off a VM: register it in the mesh, split traffic, deploy to Kubernetes, transition traffic, then remove the VM.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <line x1="192" y1="364" x2="232" y2="364" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="368" y1="364" x2="408" y2="364" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="544" y1="364" x2="584" y2="364" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="720" y1="364" x2="760" y2="364" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="56" y="332" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="56" y="332" width="136" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="64" y="338" width="28" height="12" rx="2" fill="transparent" stroke="#EC7211" stroke-width="0.8" opacity="0.6"/>
    <text x="78" y="347" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
    <text x="124" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Phase 1</text>
    <text x="124" y="378" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VM Mesh Registration</text>

    <rect x="232" y="332" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="232" y="332" width="136" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="240" y="338" width="28" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-width="0.8" opacity="0.6"/>
    <text x="254" y="347" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
    <text x="300" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Phase 2</text>
    <text x="300" y="378" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Traffic Splitting</text>

    <rect x="408" y="332" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="408" y="332" width="136" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="416" y="338" width="28" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-width="0.8" opacity="0.6"/>
    <text x="430" y="347" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
    <text x="476" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Phase 3</text>
    <text x="476" y="378" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Kubernetes Deployment</text>

    <rect x="584" y="332" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="584" y="332" width="136" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="592" y="338" width="28" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-width="0.8" opacity="0.6"/>
    <text x="606" y="347" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
    <text x="652" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Phase 4</text>
    <text x="652" y="378" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Traffic Transition</text>

    <rect x="760" y="332" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="760" y="332" width="136" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="768" y="338" width="28" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-width="0.8" opacity="0.6"/>
    <text x="782" y="347" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
    <text x="828" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Phase 5</text>
    <text x="828" y="378" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VM Removal</text>

    <!-- legend -->
    <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="468" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="484" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="60" y="492" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Starting phase</text>

    <rect x="196" y="484" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="216" y="492" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Migration phase</text>

    <line x1="376" y1="489" x2="404" y2="489" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="412" y="492" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Sequence</text>
  </svg>