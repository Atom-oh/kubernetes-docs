    <title id="ko-core-01-cluster-architecture-8-title">워커 노드 가용 영역 분산 배포</title>
    <desc id="ko-core-01-cluster-architecture-8-desc">여러 워커 노드를 3개의 가용 영역에 나누어 배치함으로써 하나의 가용 영역 장애가 전체 클러스터에 영향을 주지 않도록 하는 구조를 보여준다.</desc>
