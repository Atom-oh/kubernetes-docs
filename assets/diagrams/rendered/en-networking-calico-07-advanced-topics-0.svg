<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calico-adv-overview-title calico-adv-overview-desc">
    <title id="calico-adv-overview-title">Advanced Calico topics overview</title>
    <desc id="calico-adv-overview-desc">A sequential flow of six advanced Calico topics covered in this chapter: IPAM internals, WireGuard encryption, Egress Gateway, multi-cluster federation, Windows support, and large-scale cluster design.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- arrows first -->
    <line x1="360" y1="152" x2="400" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="560" y1="152" x2="600" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="680" y1="184" x2="680" y2="320" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="600" y1="352" x2="560" y2="352" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="400" y1="352" x2="360" y2="352" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- IPAM -->
    <rect x="200" y="120" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="200" y="120" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="280" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">IPAM Deep Dive</text>
    <text x="280" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">block-based allocation</text>

    <!-- WireGuard -->
    <rect x="400" y="120" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="120" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">WireGuard Encryption</text>
    <text x="480" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">in-transit security</text>

    <!-- Egress Gateway -->
    <rect x="600" y="120" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="120" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="680" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Egress Gateway</text>
    <text x="680" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">controlled egress</text>

    <!-- Multi-Cluster -->
    <rect x="600" y="320" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="320" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="680" y="350" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Multi-Cluster</text>
    <text x="680" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">federation</text>

    <!-- Windows -->
    <rect x="400" y="320" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="320" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="350" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Windows Support</text>
    <text x="480" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">HNS integration</text>

    <!-- Scale -->
    <rect x="200" y="320" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="200" y="320" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="280" y="350" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Large-Scale Design</text>
    <text x="280" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">1000+ nodes</text>
  </svg>