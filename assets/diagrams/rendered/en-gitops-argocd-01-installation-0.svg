<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="argocd-ha-title argocd-ha-desc">
  <title id="argocd-ha-title">Argo CD HA Topology</title>
  <desc id="argocd-ha-desc">Diagram showing an Argo CD high-availability control plane: a load balancer fans traffic into redundant API server, application controller, and repo server tiers, all of which share state through a three-node Redis HA cluster at the center of the topology.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .sans { font-family: 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#232F3E">Argo CD HA Topology</text>
  <text x="480" y="53" text-anchor="middle" class="mono" font-size="9" letter-spacing="0.06em" fill="#7D8998">PRODUCTION CONTROL PLANE &#8212; REDUNDANT TIERS SHARE STATE VIA REDIS</text>

  <!-- ===== Arrows (drawn before boxes) ===== -->
  <!-- ALB -> API server (straight vertical) -->
  <path d="M480,140 V220" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- API server -> Redis (straight vertical, center attach) -->
  <path d="M480,290 V430" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Controller -> Redis (elbow, left attach) -->
  <path d="M190,290 V352 Q190,360 198,360 H432 Q440,360 440,368 V430"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Repo server -> Redis (elbow, right attach) -->
  <path d="M770,290 V352 Q770,360 762,360 H528 Q520,360 520,368 V430"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Nodes ===== -->

  <!-- Load Balancer -->
  <rect x="380" y="70" width="200" height="70" rx="6" fill="#ffffff"/>
  <rect x="380" y="70" width="200" height="70" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="388" y="80" width="30" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="403" y="89" text-anchor="middle" class="mono" font-size="7" fill="#232F3E" fill-opacity="0.8" letter-spacing="0.1em">LB</text>
  <text x="480" y="112" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">Load Balancer</text>
  <text x="480" y="127" text-anchor="middle" class="mono" font-size="9" fill="#545B64">AWS ALB / NGINX</text>

  <!-- Controller tier -->
  <rect x="90" y="220" width="200" height="70" rx="6" fill="#ffffff"/>
  <rect x="90" y="220" width="200" height="70" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="98" y="230" width="42" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="119" y="239" text-anchor="middle" class="mono" font-size="7" fill="#232F3E" fill-opacity="0.8" letter-spacing="0.1em">CTRL</text>
  <text x="190" y="262" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">Controller</text>
  <text x="190" y="277" text-anchor="middle" class="mono" font-size="9" fill="#545B64">2+ replicas &#183; sharded</text>

  <!-- API server tier -->
  <rect x="380" y="220" width="200" height="70" rx="6" fill="#ffffff"/>
  <rect x="380" y="220" width="200" height="70" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="388" y="230" width="34" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="405" y="239" text-anchor="middle" class="mono" font-size="7" fill="#232F3E" fill-opacity="0.8" letter-spacing="0.1em">API</text>
  <text x="480" y="262" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">API Server</text>
  <text x="480" y="277" text-anchor="middle" class="mono" font-size="9" fill="#545B64">2+ replicas &#183; argocd-server</text>

  <!-- Repo server tier -->
  <rect x="670" y="220" width="200" height="70" rx="6" fill="#ffffff"/>
  <rect x="670" y="220" width="200" height="70" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="678" y="230" width="42" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="699" y="239" text-anchor="middle" class="mono" font-size="7" fill="#232F3E" fill-opacity="0.8" letter-spacing="0.1em">REPO</text>
  <text x="770" y="262" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">Repo Server</text>
  <text x="770" y="277" text-anchor="middle" class="mono" font-size="9" fill="#545B64">2+ replicas &#183; repo-server</text>

  <!-- Redis HA (focal) -->
  <rect x="360" y="430" width="240" height="90" rx="6" fill="#ffffff"/>
  <rect x="360" y="430" width="240" height="90" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="368" y="440" width="46" height="12" rx="2" fill="transparent" stroke="#EC7211" stroke-opacity="0.6" stroke-width="0.8"/>
  <text x="391" y="449" text-anchor="middle" class="mono" font-size="7" fill="#EC7211" letter-spacing="0.1em">CACHE</text>
  <text x="480" y="473" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#232F3E">Redis HA</text>
  <text x="480" y="490" text-anchor="middle" class="mono" font-size="9" fill="#545B64">3 nodes &#183; shared state</text>
  <text x="480" y="505" text-anchor="middle" class="mono" font-size="8" fill="#7D8998">sentinel-managed failover</text>
</svg>