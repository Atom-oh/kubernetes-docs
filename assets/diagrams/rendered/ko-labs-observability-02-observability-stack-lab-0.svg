    <path d="M420,296 H600" fill="none" stroke="rgba(35,47,62,0.30)" stroke-width="0.8" marker-end="url(#arr)"/>

    <text x="420" y="315" fill="#232F3E" font-size="8.5" font-weight="600" font-family="'Amazon Ember', sans-serif">Processors</text>
    <text x="600" y="315" fill="#545B64" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="end">batch · k8sattributes</text>

    <path d="M420,323 H600" fill="none" stroke="rgba(35,47,62,0.30)" stroke-width="0.8" marker-end="url(#arr)"/>

    <text x="420" y="342" fill="#232F3E" font-size="8.5" font-weight="600" font-family="'Amazon Ember', sans-serif">Exporters</text>
    <text x="600" y="342" fill="#545B64" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="end">fan-out</text>

    <text x="510" y="360" fill="#7D8998" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">metrics · logs · traces로 분기</text>

