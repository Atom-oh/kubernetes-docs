    <path d="M620,300 H710" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arr)"/>
    <path d="M620,348 H665 Q673,348 673,356 V450 Q673,458 681,458 H710" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arr)"/>

