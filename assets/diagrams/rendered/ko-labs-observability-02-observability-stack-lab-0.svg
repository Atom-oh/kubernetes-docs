    <rect x="710" y="96" width="200" height="76" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="718" y="104" width="30" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="733" y="113" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MET</text>
    <text x="810" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">메트릭 백엔드</text>
    <text x="810" y="148" fill="#545B64" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Prometheus → AMP</text>
    <text x="810" y="160" fill="#545B64" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">VictoriaMetrics · Mimir · CW</text>

