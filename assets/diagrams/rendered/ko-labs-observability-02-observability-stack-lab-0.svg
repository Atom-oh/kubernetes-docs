<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dia-title dia-desc"><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <title id="dia-title">OTel Collector 기반 관측성 파이프라인</title>
    <desc id="dia-desc">MSA 애플리케이션, 노드 메트릭, K8s 이벤트 같은 데이터 소스가 OTel Collector로 모이고, Collector는 수신·가공·내보내기 단계를 거쳐 메트릭·로깅·트레이싱 백엔드로 데이터를 각각 분기 전달하는 구조를 보여준다.</desc>
    <defs>
      <marker id="arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
        <path d="M0,0 L7,3 L0,6 Z" fill="#545B64"/>
      </marker>
      <marker id="arr-accent" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
        <path d="M0,0 L7,3 L0,6 Z" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#FFFFFF"/>

    <!-- Zone: Sources -->
    <rect x="40" y="140" width="200" height="328" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="96" y="144" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="140" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">데이터 소스</text>

    <!-- Zone: Backends -->
