    <rect x="765" y="64" width="90" height="12" rx="2" fill="#FFFFFF"/>
    <text x="810" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">백엔드</text>

    <!-- Arrows: sources -> collector (fan-in), drawn before node rects -->
    <path d="M230,208 H307 Q315,208 315,216 V236 Q315,244 323,244 H400" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arr)"/>
    <path d="M230,292 H400" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arr)"/>
    <path d="M230,376 H307 Q315,376 315,368 V348 Q315,340 323,340 H400" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Arrows: collector -> backends (fan-out), labeled -->
