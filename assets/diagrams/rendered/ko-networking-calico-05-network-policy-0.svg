<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="np-layers-title np-layers-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="np-layers-title">Network Policy 계층 구조</title>
    <desc id="np-layers-desc">Kubernetes 표준 NetworkPolicy 위에 Calico NetworkPolicy, GlobalNetworkPolicy, Tier 기반 정책이 차례로 쌓이며 적용 범위와 기능이 넓어지는 4단계 계층을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <style>
        text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;}
        .mono{font-family:'Geist Mono',monospace;}
      </style>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- direction indicator, left margin -->
    <g>
      <line x1="88" y1="404" x2="88" y2="148" stroke="#7D8998" stroke-width="1.2" marker-end="url(#dir-arrow)"/>
      <text x="76" y="276" fill="#7D8998" font-size="9" class="mono" text-anchor="middle" transform="rotate(-90 76 276)" letter-spacing="0.06em">범위·기능 확장</text>
    </g>

    <defs>
      <marker id="dir-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#7D8998"/>
      </marker>
    </defs>

    <!-- Layer stack: x 160-880 (width 720), 4 layers x 72px, y 140-428 -->
    <!-- order top->bottom: TIER, GLOBAL, CAL, K8S -->

    <!-- L4 TIER (top, focal is GLOBAL not this one) -->
    <rect x="160" y="140" width="720" height="72" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <line x1="160" y1="140" x2="880" y2="140" stroke="#232F3E" stroke-width="1"/>
    <text x="176" y="160" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.14em">L4</text>
    <text x="176" y="186" fill="#232F3E" font-size="16" font-weight="600">Tier 기반 정책</text>
    <text x="864" y="181" fill="#545B64" font-size="10" class="mono" text-anchor="end">계층화된 정책 관리</text>

    <!-- divider -->
    <line x1="160" y1="212" x2="880" y2="212" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>

    <!-- L3 GLOBAL (focal) -->
    <rect x="160" y="212" width="720" height="72" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="176" y="232" fill="#EC7211" font-size="8" class="mono" letter-spacing="0.14em">L3</text>
    <text x="176" y="258" fill="#232F3E" font-size="16" font-weight="600">GlobalNetworkPolicy</text>
    <text x="864" y="253" fill="#545B64" font-size="10" class="mono" text-anchor="end">클러스터 전역 정책</text>

    <line x1="160" y1="284" x2="880" y2="284" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>

    <!-- L2 CAL -->
    <rect x="160" y="284" width="720" height="72" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="176" y="304" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.14em">L2</text>
    <text x="176" y="330" fill="#232F3E" font-size="16" font-weight="600">Calico NetworkPolicy</text>
    <text x="864" y="325" fill="#545B64" font-size="10" class="mono" text-anchor="end">확장된 L3/L4/L7 정책</text>

    <line x1="160" y1="356" x2="880" y2="356" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>

    <!-- L1 K8S (base) -->
    <rect x="160" y="356" width="720" height="72" fill="#F2F3F3" stroke="#232F3E" stroke-width="1"/>
    <text x="176" y="376" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.14em">L1</text>
    <text x="176" y="402" fill="#232F3E" font-size="16" font-weight="600">Kubernetes NetworkPolicy</text>
    <text x="864" y="397" fill="#545B64" font-size="10" class="mono" text-anchor="end">기본 L3/L4 정책</text>

    <!-- outer silhouette -->
    <rect x="160" y="140" width="720" height="288" fill="none" stroke="#232F3E" stroke-width="1"/>

    <!-- Legend -->
    <line x1="160" y1="520" x2="880" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="160" y="540" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
    <rect x="272" y="530" width="14" height="14" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="292" y="541" fill="#545B64" font-size="9" class="mono">이 문서가 다루는 핵심 계층</text>
    <rect x="540" y="530" width="14" height="14" rx="2" fill="#F2F3F3" stroke="#232F3E" stroke-width="1"/>
    <text x="560" y="541" fill="#545B64" font-size="9" class="mono">Kubernetes 표준 기반 계층</text>
  </svg>