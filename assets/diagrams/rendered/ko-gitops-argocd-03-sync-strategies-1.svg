<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prune-flow-title prune-flow-desc">
      <title id="prune-flow-title">prune=true일 때 ArgoCD의 리소스 삭제 흐름</title>
      <desc id="prune-flow-desc">Git에서 deployment-A가 삭제되면 ArgoCD가 변경을 감지하고, prune 옵션이 켜져 있음을 확인한 뒤 Kubernetes 클러스터에서 실제로 해당 리소스를 삭제하는 과정을 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Lifelines: Git=160, ArgoCD=480, K8s=800 -->
      <line x1="160" y1="128" x2="160" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="128" x2="480" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Note over Git -->
      <rect x="88" y="148" width="144" height="28" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
      <text x="160" y="166" fill="#545B64" font-size="9" font-family="'Amazon Ember', sans-serif" text-anchor="middle">deployment-A 삭제</text>

      <!-- Activation bars -->
      <rect x="476" y="200" width="8" height="216" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

      <!-- M1: Git -> ArgoCD -->
      <line x1="160" y1="200" x2="476" y2="200" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="260" y="184" width="88" height="12" rx="2" fill="#ffffff"/>
      <text x="304" y="194" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">변경 감지</text>

      <!-- M2: ArgoCD -> K8s -->
      <line x1="484" y1="240" x2="800" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="596" y="224" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="652" y="234" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">상태 확인 요청</text>

      <!-- M3: K8s --> ArgoCD (return, dashed) -->
      <line x1="800" y1="272" x2="488" y2="272" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="596" y="256" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="652" y="266" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">존재 확인됨</text>

      <!-- M4: ArgoCD self-message: prune=true 확인 -->
      <path d="M 484 304 L 520 304 L 520 336 L 484 336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="528" y="312" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="584" y="322" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">PRUNE=TRUE 확인</text>

      <!-- M5: ArgoCD -> K8s (headline delete, accent) -->
      <line x1="484" y1="368" x2="800" y2="368" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="596" y="352" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="652" y="362" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">DEPLOYMENT-A 삭제</text>

      <!-- M6: K8s --> ArgoCD (return, dashed) -->
      <line x1="800" y1="400" x2="488" y2="400" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="596" y="384" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="652" y="394" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">삭제 완료</text>

      <!-- Actor boxes -->
      <rect x="88" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="160" y="102" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Git Repo</text>
      <text x="160" y="118" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">source of truth</text>

      <rect x="408" y="72" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="480" y="102" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">ArgoCD</text>
      <text x="480" y="118" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">controller</text>

      <rect x="728" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="800" y="102" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Kubernetes</text>
      <text x="800" y="118" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cluster</text>

      <!-- Legend -->
      <line x1="88" y1="472" x2="872" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="88" y="488" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="88" y="504" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="108" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Focal actor</text>

      <line x1="220" y1="510" x2="248" y2="510" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="256" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">반환 메시지</text>

      <line x1="380" y1="510" x2="408" y2="510" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="416" y="512" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">삭제 실행</text>
    </svg>