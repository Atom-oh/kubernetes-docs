<title id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-7-title">사이드카 모델이 초래하는 숨겨진 리소스 비용</title>
<desc id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-7-desc">Istio 없이는 애플리케이션 컨테이너만 필요하지만, Istio 사이드카를 붙이면 모든 트래픽이 지나가는 Envoy 프록시가 추가되어 리소스 2배 증가, 파드 시작 시간 증가, 네트워크 홉 추가로 인한 지연, 트러블슈팅 복잡화라는 네 가지 영향을 낳는다는 것을 보여준다.</desc>
