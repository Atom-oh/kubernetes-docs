<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc">
      <title id="d1-title">Three pillars of observability and their correlations</title>
      <desc id="d1-desc">Logs, metrics, and traces each break into three concrete data forms, and the three pillar groups correlate pairwise through TraceID linking, exemplars, and label matching.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
        <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>
      <rect width="960" height="600" fill="#ffffff"/>

      <!-- Zones: Logs, Metrics, Traces -->
      <rect x="32" y="120" width="272" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="136" y="124" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="168" y="133" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">LOGS</text>

      <rect x="344" y="120" width="272" height="360" rx="8" fill="rgba(255,153,0,0.05)" stroke="#EC7211" stroke-width="0.8"/>
      <rect x="440" y="124" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="133" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">METRICS</text>

      <rect x="656" y="120" width="272" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="756" y="124" width="72" height="12" rx="2" fill="#ffffff"/>
      <text x="792" y="133" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">TRACES</text>

      <!-- Correlation arrows (between zone bands, above zone tops, drawn before nodes) -->
      <line x1="304" y1="160" x2="344" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
      <rect x="292" y="140" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="324" y="149" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">LABELS</text>

      <line x1="616" y1="160" x2="656" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
      <rect x="602" y="140" width="68" height="12" rx="2" fill="#ffffff"/>
      <text x="636" y="149" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">EXEMPLAR</text>

      <path d="M 168,480 V 500 Q 168,508 176,508 H 792 Q 800,508 800,500 V 480"
            fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
      <rect x="450" y="500" width="86" height="12" rx="2" fill="#ffffff"/>
      <text x="493" y="509" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">TRACE ID</text>

      <!-- Logs children -->
      <g>
        <rect x="56" y="164" width="224" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="168" y="198" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Event Records</text>
      </g>
      <g>
        <rect x="56" y="256" width="224" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="168" y="290" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Structured Data</text>
      </g>
      <g>
        <rect x="56" y="348" width="224" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="168" y="382" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Context Information</text>
      </g>

      <!-- Metrics children (focal zone) -->
      <g>
        <rect x="368" y="164" width="224" height="60" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
        <text x="480" y="198" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Numeric Measurements</text>
      </g>
      <g>
        <rect x="368" y="256" width="224" height="60" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
        <text x="480" y="290" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Time Series Data</text>
      </g>
      <g>
        <rect x="368" y="348" width="224" height="60" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
        <text x="480" y="382" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Aggregatable</text>
      </g>

      <!-- Traces children -->
      <g>
        <rect x="680" y="164" width="224" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="792" y="198" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Request Path</text>
      </g>
      <g>
        <rect x="680" y="256" width="224" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="792" y="290" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Inter-service Flow</text>
      </g>
      <g>
        <rect x="680" y="348" width="224" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="792" y="382" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Latency Analysis</text>
      </g>

      <!-- Legend -->
      <line x1="32" y1="540" x2="928" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="32" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="32" y="566" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="52" y="574" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">Metrics (focal)</text>

      <line x1="220" y1="571" x2="248" y2="571" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
      <text x="256" y="574" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">Pairwise correlation</text>
    </svg>