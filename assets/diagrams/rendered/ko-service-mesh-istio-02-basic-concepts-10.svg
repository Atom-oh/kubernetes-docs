<title id="dtitle">Envoy가 자동 생성하는 관찰성 데이터 흐름</title>
<desc id="ddesc">Envoy Proxy가 자동으로 생성한 메트릭, 트레이스, 로그가 Prometheus, Jaeger, 로깅 시스템을 거쳐 Grafana와 Jaeger UI, Kiali로 시각화되는 흐름</desc>
