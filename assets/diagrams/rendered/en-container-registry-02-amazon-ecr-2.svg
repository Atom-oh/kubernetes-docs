<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pc-title pc-desc">
  <title id="pc-title">ECR pull-through cache lookup path</title>
  <desc id="pc-desc">Flowchart showing a kubelet image pull request checking the ECR endpoint: a cache hit serves the image instantly, while a cache miss pulls the image from the upstream registry, caches it in the ECR repository, and then serves it.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="40" y="40" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CONTAINER REGISTRY</text>
  <text x="40" y="68" fill="#232F3E" font-size="24" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">ECR pull-through cache</text>

  <!-- Arrows (drawn before boxes) -->
  <!-- Pod -> ECR (straight, shared y) -->
  <path d="M200,300 H240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Cache hit: ECR right vertex -> Serve left edge (right+up elbow) -->
  <path d="M440,300 H552 Q560,300 560,292 V208 Q560,200 568,200 H680" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="524" y="272" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="560" y="281" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE HIT</text>

  <!-- Cache miss: ECR bottom vertex -> Upstream top edge (straight, shared x) -->
  <path d="M340,360 V440" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="356" y="386" width="76" height="12" rx="2" fill="#ffffff"/>
  <text x="394" y="395" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE MISS</text>

  <!-- Upstream -> Cache (straight, shared y) -->
  <path d="M420,464 H500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Cache -> Serve (top edge exits up, bends right, enters Serve bottom edge) -->
  <path d="M590,440 V340 Q590,332 598,332 H772 Q780,332 780,324 V224" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="604" y="320" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="622" y="329" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

  <!-- Pod (start oval) -->
  <rect x="60" y="276" width="140" height="48" rx="24" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="130" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">kubelet pull</text>
  <text x="130" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">request</text>

  <!-- ECR endpoint (decision) -->
  <polygon points="340,240 440,300 340,360 240,300" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="340" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ECR</text>
  <text x="340" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Endpoint</text>

  <!-- Serve (focal, happy path outcome) -->
  <rect x="680" y="176" width="200" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="780" y="198" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Serve cached image</text>
  <text x="780" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">instantly</text>

  <!-- Upstream registry (external) -->
  <rect x="260" y="440" width="160" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="340" y="462" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pull from upstream</text>
  <text x="340" y="476" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">registry</text>

  <!-- Cache repository (store) -->
  <rect x="500" y="440" width="180" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="590" y="462" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cache in ECR</text>
  <text x="590" y="476" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">repository</text>

  <!-- Legend -->
  <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="558" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="180" y="550" width="16" height="12" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="204" y="559" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">HAPPY PATH — CACHE HIT</text>
  <rect x="420" y="550" width="16" height="12" rx="3" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="444" y="559" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">EXTERNAL SYSTEM</text>
</svg>
