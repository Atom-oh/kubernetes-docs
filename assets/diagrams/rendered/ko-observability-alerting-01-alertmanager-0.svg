<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq0-title seq0-desc">
    <title id="seq0-title">Prometheus 알림 처리 흐름</title>
    <desc id="seq0-desc">Prometheus가 알림 규칙을 평가하고 for 기간이 지나면 Alertmanager로 전송하며, Alertmanager가 내부 파이프라인을 거쳐 수신자에게 알림을 보내고 결과를 돌려받는 과정을 보여주는 시퀀스 다이어그램입니다.</desc>
    <defs><style>@import url(https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines (drawn first, behind everything) -->
    <line x1="140" y1="80" x2="140" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="80" x2="480" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="800" y1="80" x2="800" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Messages (behind actor boxes) -->
    <!-- self-loop 1: Prometheus eval -->
    <path d="M 140,144 H 172 Q 180,144 180,152 V 156 Q 180,164 172,164 H 140" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- self-loop 2: Prometheus wait -->
    <path d="M 140,208 H 172 Q 180,208 180,216 V 220 Q 180,228 172,228 H 140" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- P -> AM -->
    <line x1="140" y1="284" x2="480" y2="284" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- AM self-loop: pipeline -->
    <path d="M 480,340 H 512 Q 520,340 520,348 V 352 Q 520,360 512,360 H 480" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- AM -> R -->
    <line x1="480" y1="440" x2="800" y2="440" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- R --> AM dashed return -->
    <line x1="800" y1="500" x2="480" y2="500" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Actor: Prometheus -->
    <rect x="68" y="40" width="144" height="40" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="140" y="65" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>

    <!-- Actor: Alertmanager (focal) -->
    <rect x="400" y="40" width="160" height="40" rx="6" fill="#FFF8F0" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="65" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alertmanager</text>

    <!-- Actor: Receiver -->
    <rect x="704" y="40" width="192" height="40" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="800" y="59" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Receiver</text>
    <text x="800" y="72" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Slack / PagerDuty</text>

    <!-- Label: self-loop 1 -->
    <rect x="188" y="140" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="192" y="149" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">알림 규칙 평가</text>
    <rect x="188" y="156" width="216" height="12" rx="2" fill="#ffffff"/>
    <text x="192" y="165" fill="#7D8998" font-size="9" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">expr 조건 충족 시 Pending 전환</text>

    <!-- Label: self-loop 2 -->
    <rect x="188" y="204" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="192" y="213" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">for 기간 대기</text>
    <rect x="188" y="220" width="216" height="12" rx="2" fill="#ffffff"/>
    <text x="192" y="229" fill="#7D8998" font-size="9" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">기간 내 유지 시 Firing 전환</text>

    <!-- Label: P -> AM -->
    <rect x="228" y="264" width="164" height="12" rx="2" fill="#ffffff"/>
    <text x="310" y="273" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">POST /api/v2/alerts</text>

    <!-- Label: AM self-loop (pipeline) -->
    <rect x="528" y="316" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="532" y="325" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">파이프라인 처리</text>
    <rect x="528" y="330" width="220" height="60" rx="2" fill="#ffffff"/>
    <text x="532" y="341" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace">1. 중복 제거</text>
    <text x="532" y="353" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace">2. 그룹화</text>
    <text x="532" y="365" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace">3. 라우팅 결정</text>
    <text x="532" y="377" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace">4. Inhibition · Silence 확인</text>

    <!-- Label: AM -> R -->
    <rect x="600" y="424" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="433" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">알림 전송</text>

    <!-- Label: R --> AM -->
    <rect x="600" y="484" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="493" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">전송 결과</text>

    <!-- Legend -->
    <line x1="60" y1="548" x2="900" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <circle cx="70" cy="566" r="4" fill="#EC7211"/>
    <text x="80" y="569" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">주요 호출</text>
    <line x1="220" y1="566" x2="248" y2="566" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="256" y="569" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">응답 / 결과</text>
  </svg>