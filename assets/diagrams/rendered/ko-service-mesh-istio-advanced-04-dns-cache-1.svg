<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc">
  <title id="d1-title">DNS Proxy와 DNS Caching의 통합 사용</title>
  <desc id="d1-desc">애플리케이션이 ServiceEntry로 등록된 도메인을 조회하면 Envoy의 DNS Proxy가 가상 IP를 즉시 반환하고, 그 외 외부 도메인은 DNS Cache가 CoreDNS에 조회한 뒤 결과를 캐시해 재사용하는 두 경로를 함께 사용하는 구성을 보여준다.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Zone: Envoy Proxy -->
  <rect x="368" y="170" width="248" height="286" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="380" y="174" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="424" y="183" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">ENVOY PROXY</text>

  <!-- ===== Arrows (before nodes) ===== -->

  <!-- App -> DNS_Proxy (1. api.example.com) -->
  <path d="M248,220 H392" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="264" y="200" width="112" height="12" fill="#ffffff"/>
  <text x="320" y="209" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">1 · api.example.com</text>

  <!-- DNS_Proxy -> App (가상 IP, return) -->
  <path d="M392,252 H248" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="272" y="256" width="72" height="12" fill="#ffffff"/>
  <text x="308" y="265" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">가상 IP 반환</text>

  <!-- App -> DNS_Cache (2. google.com) -->
  <path d="M140,268 V372 Q140,380 148,380 H392"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="176" y="384" width="96" height="12" fill="#ffffff"/>
  <text x="224" y="393" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">2 · google.com</text>

  <!-- DNS_Cache -> CoreDNS (캐시 미스) -->
  <path d="M592,392 H700" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="608" y="376" width="60" height="12" fill="#ffffff"/>
  <text x="638" y="385" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">캐시 미스</text>

  <!-- CoreDNS -> DNS_Cache (실제 IP, return) -->
  <path d="M700,432 H592" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="608" y="436" width="60" height="12" fill="#ffffff"/>
  <text x="638" y="445" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">실제 IP</text>

  <!-- DNS_Cache -> App (캐시된 IP, return) -->
  <path d="M392,420 H204 Q196,420 196,412 V268"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="204" y="424" width="88" height="12" fill="#ffffff"/>
  <text x="248" y="433" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">캐시된 IP 반환</text>

  <!-- SE -> DNS_Proxy (dashed, 등록) -->
  <path d="M492,156 V204" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="504" y="168" width="28" height="12" fill="#ffffff"/>
  <text x="518" y="177" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">등록</text>

  <!-- ===== Nodes ===== -->

  <!-- App -->
  <rect x="88" y="204" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="88" y="204" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="168" y="230" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">애플리케이션</text>
  <text x="168" y="246" fill="#545B64" font-size="9" class="mono" text-anchor="middle">outbound DNS</text>

  <!-- ServiceEntry -->
  <rect x="412" y="100" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="412" y="100" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="492" y="124" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">ServiceEntry</text>
  <text x="492" y="140" fill="#545B64" font-size="9" class="mono" text-anchor="middle">api.example.com</text>

  <!-- DNS Proxy (focal) -->
  <rect x="392" y="204" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="392" y="204" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="492" y="230" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">DNS Proxy</text>
  <text x="492" y="246" fill="#EC7211" font-size="9" class="mono" text-anchor="middle">ServiceEntry 서비스</text>

  <!-- DNS Cache -->
  <rect x="392" y="368" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="392" y="368" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="492" y="394" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">DNS Cache</text>
  <text x="492" y="410" fill="#545B64" font-size="9" class="mono" text-anchor="middle">기타 외부 서비스</text>

  <!-- CoreDNS -->
  <rect x="700" y="368" width="176" height="64" rx="6" fill="#ffffff"/>
  <rect x="700" y="368" width="176" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="788" y="394" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">CoreDNS</text>
  <text x="788" y="410" fill="#545B64" font-size="9" class="mono" text-anchor="middle">google.com</text>

  <!-- ===== Legend ===== -->
  <line x1="24" y1="512" x2="936" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="24" y="528" fill="#545B64" font-size="8" class="mono" letter-spacing="0.18em">LEGEND</text>

  <rect x="24" y="540" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="44" y="548" fill="#545B64" font-size="8.5">DNS Proxy (Focal · 즉시 응답)</text>

  <line x1="260" y1="545" x2="284" y2="545" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="292" y="548" fill="#545B64" font-size="8.5">응답 · 등록 관계</text>
</svg>
