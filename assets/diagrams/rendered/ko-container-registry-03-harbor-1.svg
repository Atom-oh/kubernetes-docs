<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="ko-container-registry-03-harbor-1-title ko-container-registry-03-harbor-1-desc">
    <title id="ko-container-registry-03-harbor-1-title">Harbor Pull/Push 복제 방향</title>
    <desc id="ko-container-registry-03-harbor-1-desc">외부 레지스트리에서 로컬 Harbor로 이미지를 미러링하는 Pull 복제와, 소스 Harbor에서 원격 레지스트리로 배포·재해복구용으로 내보내는 Push 복제의 방향 차이를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Pull Replication -->
    <rect x="80" y="126" width="800" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="384" y="134" width="192" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="143" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PULL REPLICATION · 미러링</text>

    <!-- Zone: Push Replication -->
    <rect x="80" y="346" width="800" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="368" y="354" width="224" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="363" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PUSH REPLICATION · 배포/DR</text>

    <!-- Arrows -->
    <line x1="380" y1="190" x2="580" y2="190" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="380" y1="410" x2="580" y2="410" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels -->
    <rect x="446" y="170" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="179" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PULL</text>

    <rect x="446" y="390" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="399" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH</text>

    <!-- Node: External Registry -->
    <rect x="140" y="158" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="140" y="158" width="240" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="148" y="166" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="162" y="175" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="260" y="194" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">External Registry</text>
    <text x="260" y="210" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Docker Hub / ECR</text>

    <!-- Node: Harbor (Local) — focal -->
    <rect x="580" y="158" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="580" y="158" width="240" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="588" y="166" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="602" y="175" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REG</text>
    <text x="700" y="194" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Harbor (Local)</text>
    <text x="700" y="210" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local mirror</text>

    <!-- Node: Harbor (Source) — focal -->
    <rect x="140" y="378" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="140" y="378" width="240" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="148" y="386" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="162" y="395" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REG</text>
    <text x="260" y="414" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Harbor (Source)</text>
    <text x="260" y="430" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">source registry</text>

    <!-- Node: Remote Registry -->
    <rect x="580" y="378" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="580" y="378" width="240" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="588" y="386" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="602" y="395" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="700" y="414" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Remote Registry</text>
    <text x="700" y="430" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ECR / Harbor DR</text>
  </svg>
