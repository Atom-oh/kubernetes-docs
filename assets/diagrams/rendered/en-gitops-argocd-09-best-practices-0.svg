<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">GitOps branch promotion flow</title>
  <desc id="ddesc">Git branches develop, staging, and main are merged in sequence, each triggering a deploy to its matching environment: develop to the Dev Cluster, staging to the Staging Cluster, and main to the Production Cluster, which is the highest-stakes step in the pipeline.</desc>

  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="var(--paper)"/>

  <!-- Title -->
  <text x="40" y="44" class="title">GitOps Branch Promotion Flow</text>
  <text x="40" y="64" class="eyebrow mono">ARGO CD &#8226; BRANCH-PER-ENVIRONMENT PATTERN</text>

  <!-- Column eyebrows -->
  <text x="180" y="96" text-anchor="middle" class="eyebrow mono">GIT BRANCHES</text>
  <text x="780" y="96" text-anchor="middle" class="eyebrow mono">ENVIRONMENTS</text>

  <!-- Column containers -->
  <rect x="40" y="108" width="280" height="444" rx="8" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="1"/>
  <rect x="640" y="108" width="280" height="444" rx="8" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="1"/>

  <!-- Left nodes: develop, staging, main -->
  <g>
    <rect x="70" y="148" width="220" height="64" rx="6" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
    <text x="180" y="186" text-anchor="middle" class="node-name mono">develop</text>
  </g>
  <g>
    <rect x="70" y="308" width="220" height="64" rx="6" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
    <text x="180" y="346" text-anchor="middle" class="node-name mono">staging</text>
  </g>
  <g>
    <rect x="70" y="468" width="220" height="64" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
    <text x="180" y="506" text-anchor="middle" class="node-name mono">main</text>
  </g>

  <!-- Right nodes: Dev Cluster, Staging Cluster, Production Cluster -->
  <g>
    <rect x="670" y="148" width="220" height="64" rx="6" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
    <text x="780" y="186" text-anchor="middle" class="node-name">Dev Cluster</text>
  </g>
  <g>
    <rect x="670" y="308" width="220" height="64" rx="6" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
    <text x="780" y="346" text-anchor="middle" class="node-name">Staging Cluster</text>
  </g>
  <g>
    <rect x="670" y="468" width="220" height="64" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
    <text x="780" y="506" text-anchor="middle" class="node-name">Production Cluster</text>
  </g>

  <!-- Vertical merge arrows within Git Branches column -->
  <line x1="180" y1="212" x2="180" y2="308" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow-ink)"/>
  <rect x="192" y="248" width="52" height="16" fill="var(--paper-2)"/>
  <text x="218" y="260" text-anchor="middle" class="arrow-label mono">merge</text>

  <line x1="180" y1="372" x2="180" y2="468" stroke="var(--accent)" stroke-width="1" marker-end="url(#arrow-accent)"/>
  <rect x="192" y="408" width="52" height="16" fill="var(--paper-2)"/>
  <text x="218" y="420" text-anchor="middle" class="arrow-label mono">merge</text>

  <!-- Horizontal deploy arrows -->
  <line x1="290" y1="180" x2="670" y2="180" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow-ink)"/>
  <rect x="440" y="164" width="60" height="16" fill="var(--paper)"/>
  <text x="470" y="176" text-anchor="middle" class="arrow-label mono">deploy</text>

  <line x1="290" y1="340" x2="670" y2="340" stroke="var(--muted)" stroke-width="1" marker-end="url(#arrow-ink)"/>
  <rect x="440" y="324" width="60" height="16" fill="var(--paper)"/>
  <text x="470" y="336" text-anchor="middle" class="arrow-label mono">deploy</text>

  <line x1="290" y1="500" x2="670" y2="500" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="440" y="484" width="60" height="16" fill="var(--paper)"/>
  <text x="470" y="496" text-anchor="middle" class="arrow-label mono">deploy</text>

</svg>