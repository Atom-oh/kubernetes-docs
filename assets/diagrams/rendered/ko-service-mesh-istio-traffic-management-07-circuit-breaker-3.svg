<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl3 desc3">
  <title id="ttl3">Retry와 Circuit Breaker 조합 시 중복 결제 문제</title>
  <desc id="desc3">결제 요청이 타임아웃으로 3번 재시도되는 동안 실제로는 매번 결제가 성공해 데이터베이스에 3건이 중복 기록되지만, Circuit Breaker는 5번 연속 에러가 나야 작동하므로 재시도 도중에는 중복을 막지 못한다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-fail" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DD344C"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="32" y="24" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.18em">SEQUENCE</text>
  <text x="32" y="46" fill="#232F3E" font-size="18" font-weight="700">Retry + Circuit Breaker 중복 결제 시나리오</text>

  <!-- lifelines -->
  <line x1="100" y1="104" x2="100" y2="556" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="104" x2="360" y2="556" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="620" y1="104" x2="620" y2="556" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="880" y1="104" x2="880" y2="556" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- top note over Proxy -->
  <rect x="240" y="116" width="240" height="12" rx="2" fill="#ffffff"/>
  <text x="360" y="125" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">RETRY×3 · CB consecutiveErrors=5</text>

  <!-- m1 Client -> Proxy -->
  <path d="M100,160 H354" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="106" y="140" width="200" height="12" rx="2" fill="#ffffff"/>
  <text x="206" y="149" fill="#545B64" font-size="8" class="mono" letter-spacing="0.02em">POST /payment (결제 요청)</text>

  <!-- m2 Proxy -> Service : Attempt 1 -->
  <path d="M360,196 H614" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="410" y="176" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="470" y="185" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">Attempt 1</text>

  <!-- m3 Service -> DB : INSERT ok -->
  <path d="M620,232 H874" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="640" y="212" width="196" height="12" rx="2" fill="#ffffff"/>
  <text x="738" y="221" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">INSERT payment (성공)</text>

  <!-- m4 Service -> Proxy : Timeout -->
  <path d="M620,268 H366" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="404" y="248" width="180" height="12" rx="2" fill="#ffffff"/>
  <text x="494" y="257" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">Timeout (응답 손실)</text>
  <text x="884" y="272" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.02em">⚠ Retry 1/3</text>

  <!-- m5 Proxy -> Service : Attempt 2 -->
  <path d="M360,304 H614" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="392" y="284" width="196" height="12" rx="2" fill="#ffffff"/>
  <text x="490" y="293" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">Attempt 2 (같은 요청)</text>

  <!-- m6 Service -> DB : INSERT dup! -->
  <path d="M620,340 H874" fill="none" stroke="#DD344C" stroke-width="1.2" marker-end="url(#arrow-fail)"/>
  <rect x="636" y="320" width="204" height="12" rx="2" fill="#ffffff"/>
  <text x="738" y="329" fill="#DD344C" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">INSERT payment (중복!)</text>

  <!-- m7 Service -> Proxy : Timeout -->
  <path d="M620,376 H366" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="404" y="356" width="180" height="12" rx="2" fill="#ffffff"/>
  <text x="494" y="365" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">Timeout (응답 손실)</text>
  <text x="884" y="380" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.02em">⚠ Retry 2/3</text>

  <!-- m8 Proxy -> Service : Attempt 3 -->
  <path d="M360,412 H614" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="392" y="392" width="196" height="12" rx="2" fill="#ffffff"/>
  <text x="490" y="401" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">Attempt 3 (같은 요청)</text>

  <!-- m9 Service -> DB : INSERT dup! -->
  <path d="M620,448 H874" fill="none" stroke="#DD344C" stroke-width="1.2" marker-end="url(#arrow-fail)"/>
  <rect x="636" y="428" width="204" height="12" rx="2" fill="#ffffff"/>
  <text x="738" y="437" fill="#DD344C" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">INSERT payment (중복!)</text>

  <!-- m10 Service -> Proxy : 200 OK -->
  <path d="M620,480 H366" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="458" y="460" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="490" y="469" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">200 OK</text>

  <!-- m11 Proxy -> Client : 200 OK -->
  <path d="M360,508 H106" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="198" y="488" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="230" y="497" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">200 OK</text>

  <!-- final warning note -->
  <rect x="620" y="522" width="308" height="16" rx="2" fill="rgba(221,52,76,0.06)" stroke="rgba(221,52,76,0.40)" stroke-width="0.8"/>
  <text x="774" y="533" fill="#DD344C" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">❌ 결제 3회 중복 · CB는 5회 에러 후 작동</text>

  <!-- actor boxes (top) -->
  <rect x="30" y="64" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="100" y="88" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Client</text>

  <rect x="290" y="64" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="360" y="82" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Istio Proxy</text>
  <text x="360" y="96" fill="#545B64" font-size="8" class="mono" text-anchor="middle">VirtualService Retry</text>

  <rect x="550" y="64" width="140" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="620" y="88" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Payment Service</text>

  <rect x="810" y="64" width="140" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="880" y="88" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Database</text>
</svg>