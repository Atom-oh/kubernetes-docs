<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iptables-flow-title iptables-flow-desc">
    <title id="iptables-flow-title">iptables 적용 후 트래픽 흐름</title>
    <desc id="iptables-flow-desc">애플리케이션의 아웃바운드 요청이 OUTPUT 체인을 거쳐 Envoy의 15001 리스너로 리다이렉트되어 외부 서비스로 나가고, 외부 서비스의 응답은 PREROUTING 체인을 거쳐 15006 리스너에서 mTLS 검증 후 애플리케이션으로 전달되는 경로를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Pod Network Namespace -->
    <rect x="40" y="140" width="640" height="312" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="248" y="144" width="216" height="12" rx="2" fill="#ffffff"/>
    <text x="356" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">파드 NETWORK NAMESPACE</text>

    <!-- Zone: iptables NAT -->
    <rect x="248" y="176" width="160" height="256" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="284" y="180" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="328" y="189" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">IPTABLES NAT</text>

    <!-- Zone: Envoy Proxy UID 1337 -->
    <rect x="460" y="176" width="200" height="256" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="500" y="180" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="560" y="189" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ENVOY · UID 1337</text>

    <!-- Arrows -->
    <path d="M 204,300 H 228 Q 236,300 236,292 V 256 Q 236,248 244,248 H 268" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="396" y1="248" x2="476" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 644,248 H 704 Q 712,248 712,256 V 292 Q 712,300 720,300 H 780" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 780,324 H 596 Q 588,324 588,332 V 352 Q 588,360 580,360 H 396" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 396,388 H 428 Q 436,388 436,380 V 364 Q 436,356 444,356 H 476" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M 476,388 H 452 Q 444,388 444,380 V 332 Q 444,324 436,324 H 204" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Labels -->
    <rect x="196" y="264" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="232" y="273" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1·curl:9080</text>

    <rect x="404" y="232" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="436" y="241" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2·REDIRECT</text>

    <rect x="716" y="264" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="746" y="273" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">4·UID우회</text>

    <rect x="628" y="308" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="660" y="317" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5·요청수신</text>

    <rect x="404" y="344" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="436" y="353" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">6·REDIRECT</text>

    <rect x="264" y="306" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="300" y="315" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">8·localhost</text>

    <!-- Node: 애플리케이션 -->
    <rect x="64" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="280" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="72" y="288" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="86" y="297" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="134" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">애플리케이션</text>
    <text x="134" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">localhost:8080</text>

    <!-- Node: OUTPUT 체인 -->
    <rect x="268" y="216" width="128" height="64" rx="6" fill="#ffffff"/>
    <rect x="268" y="216" width="128" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="276" y="224" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="290" y="233" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NAT</text>
    <text x="332" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OUTPUT 체인</text>
    <text x="332" y="268" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">outbound</text>

    <!-- Node: PREROUTING 체인 -->
    <rect x="268" y="340" width="128" height="64" rx="6" fill="#ffffff"/>
    <rect x="268" y="340" width="128" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="276" y="348" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="290" y="357" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NAT</text>
    <text x="332" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PREROUTING 체인</text>
    <text x="332" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">inbound</text>

    <!-- Node: Listener 15001 -->
    <rect x="476" y="216" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="476" y="216" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="484" y="224" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="498" y="233" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
    <text x="560" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Listener 15001</text>
    <text x="560" y="268" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">아웃바운드 · 라우팅</text>

    <!-- Node: Listener 15006 (focal) -->
    <rect x="476" y="340" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="476" y="340" width="168" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="484" y="348" width="24" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="496" y="357" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
    <text x="560" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Listener 15006</text>
    <text x="560" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">인바운드 · mTLS</text>

    <!-- Node: 외부 서비스 -->
    <rect x="780" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="780" y="280" width="140" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="788" y="288" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="802" y="297" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="850" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">외부 서비스</text>
    <text x="850" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reviews:9080</text>

    <!-- Legend -->
    <line x1="40" y1="480" x2="920" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="508" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="516" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal · mTLS 검증 지점</text>
    <rect x="272" y="508" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="292" y="516" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">iptables / Listener</text>
    <rect x="480" y="508" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="500" y="516" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">외부 서비스</text>
  </svg>