<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cilium-title cilium-desc"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <title id="cilium-title">Cilium's eBPF Data Path</title>
    <desc id="cilium-desc">Kubernetes delegates networking through the Container Network Interface to Cilium, which programs eBPF code running in the Linux kernel and also feeds Hubble for network observability.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Top chain, all same y=280 -->
    <line x1="160" y1="280" x2="200" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="370" y1="280" x2="410" y2="280" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="550" y1="280" x2="590" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="710" y1="280" x2="750" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Cilium -> Hubble (straight vertical, same x center=480) -->
    <line x1="480" y1="312" x2="480" y2="400" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="164" y="260" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="180" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CNI</text>

    <rect x="374" y="260" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="390" y="269" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOAD</text>

    <rect x="554" y="260" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="570" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JIT</text>

    <rect x="714" y="260" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="730" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXEC</text>

    <rect x="456" y="332" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="341" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FLOWS</text>

    <!-- Node: Kubernetes -->
    <rect x="40" y="248" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="248" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="100" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Kubernetes</text>
    <text x="100" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubelet</text>

    <!-- Node: Container Network Interface -->
    <rect x="200" y="248" width="170" height="64" rx="6" fill="#ffffff"/>
    <rect x="200" y="248" width="170" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="285" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Container Network</text>
    <text x="285" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Interface (CNI)</text>

    <!-- Node: Cilium (focal) -->
    <rect x="410" y="248" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="410" y="248" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Cilium</text>
    <text x="480" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agent · CNI plugin</text>

    <!-- Node: eBPF -->
    <rect x="590" y="248" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="590" y="248" width="120" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="650" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">eBPF</text>
    <text x="650" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">verified programs</text>

    <!-- Node: Linux Kernel -->
    <rect x="750" y="248" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="750" y="248" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="820" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Linux Kernel</text>
    <text x="820" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data path</text>

    <!-- Node: Hubble -->
    <rect x="400" y="400" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="400" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Hubble</text>
    <text x="480" y="444" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">observability</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="928" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="516" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="524" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Focal: Cilium agent</text>
    <rect x="280" y="516" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="300" y="524" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Kernel-space / observability</text>
  </svg>