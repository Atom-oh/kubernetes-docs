<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="100%" role="img" aria-labelledby="rt0-title rt0-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="rt0-title">VirtualService routing decision</title>
  <desc id="rt0-desc">Diagram showing how an incoming request is evaluated against ordered match conditions in an Istio VirtualService and routed to the corresponding destination service, with a default fallback rule applied when no earlier condition matches.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ============ ARROWS (drawn before boxes) ============ -->
  <!-- Request fan-out attach points: y=284, 300, 316 on Request right edge (x=180) -->
  <!-- Request -> Rule 1 (up elbow) -->
  <path d="M180,284 H242 Q250,284 250,276 V116 Q250,108 258,108 H320"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- Request -> Rule 2 (straight, shared y=300) -->
  <line x1="180" y1="300" x2="320" y2="300" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- Request -> Rule 3 (down elbow) -->
  <path d="M180,316 H242 Q250,316 250,324 V484 Q250,492 258,492 H320"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Rule -> Service (all straight, shared y) -->
  <line x1="580" y1="108" x2="700" y2="108" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="300" x2="700" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="492" x2="700" y2="492" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============ NODES ============ -->

  <!-- Request (focal) -->
  <rect x="40" y="268" width="140" height="64" rx="6" fill="#ffffff"/>
  <rect x="40" y="268" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="110" y="294" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Incoming Request</text>
  <text x="110" y="310" fill="#EC7211" font-size="9"
        font-family="'Geist Mono',monospace" text-anchor="middle">HTTP / HTTPS</text>

  <!-- Rule 1 -->
  <rect x="320" y="64" width="260" height="88" rx="6" fill="#ffffff"/>
  <rect x="320" y="64" width="260" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="332" y="76" width="64" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="364" y="85" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace"
        text-anchor="middle" letter-spacing="0.08em">RULE 1</text>
  <text x="450" y="112" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API v1 traffic</text>
  <text x="450" y="130" fill="#545B64" font-size="9"
        font-family="'Geist Mono',monospace" text-anchor="middle">match: uri prefix "/api/v1"</text>

  <!-- Rule 2 -->
  <rect x="320" y="256" width="260" height="88" rx="6" fill="#ffffff"/>
  <rect x="320" y="256" width="260" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="332" y="268" width="64" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="364" y="277" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace"
        text-anchor="middle" letter-spacing="0.08em">RULE 2</text>
  <text x="450" y="304" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Mobile clients</text>
  <text x="450" y="322" fill="#545B64" font-size="9"
        font-family="'Geist Mono',monospace" text-anchor="middle">match: user-agent ~ "Mobile"</text>

  <!-- Rule 3 (default / fallback) -->
  <rect x="320" y="448" width="260" height="88" rx="6" fill="#ffffff"/>
  <rect x="320" y="448" width="260" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="332" y="460" width="88" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="376" y="469" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace"
        text-anchor="middle" letter-spacing="0.08em">RULE 3 · DEFAULT</text>
  <text x="450" y="496" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Fallback traffic</text>
  <text x="450" y="514" fill="#545B64" font-size="9"
        font-family="'Geist Mono',monospace" text-anchor="middle">no match condition (catch-all)</text>

  <!-- Service 1 -->
  <rect x="700" y="76" width="180" height="64" rx="6" fill="#ffffff"/>
  <rect x="700" y="76" width="180" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="790" y="102" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">api-v1</text>
  <text x="790" y="118" fill="#545B64" font-size="9"
        font-family="'Geist Mono',monospace" text-anchor="middle">kubernetes service</text>

  <!-- Service 2 -->
  <rect x="700" y="268" width="180" height="64" rx="6" fill="#ffffff"/>
  <rect x="700" y="268" width="180" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="790" y="294" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">mobile-app</text>
  <text x="790" y="310" fill="#545B64" font-size="9"
        font-family="'Geist Mono',monospace" text-anchor="middle">kubernetes service</text>

  <!-- Service 3 -->
  <rect x="700" y="460" width="180" height="64" rx="6" fill="#ffffff"/>
  <rect x="700" y="460" width="180" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="790" y="486" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">web-app</text>
  <text x="790" y="502" fill="#545B64" font-size="9"
        font-family="'Geist Mono',monospace" text-anchor="middle">kubernetes service</text>

  <!-- ============ LEGEND ============ -->
  <line x1="32" y1="560" x2="928" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

  <circle cx="220" cy="576" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="232" y="580" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">entry point (evaluated top → bottom)</text>

  <circle cx="560" cy="576" r="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="572" y="580" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">match + route rule</text>

  <circle cx="760" cy="576" r="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="772" y="580" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">destination service</text>

</svg>