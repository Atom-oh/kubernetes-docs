<title id="en-service-mesh-istio-02-basic-concepts-7-title">Ambient Mode: Node-level ztunnel and Optional Waypoint</title>
<desc id="en-service-mesh-istio-02-basic-concepts-7-desc">Diagram showing two sidecar-less pods on a worker node transparently redirected to a shared per-node ztunnel L4 proxy, which forwards to an optional Waypoint L7 proxy only when L7 features are needed.</desc>
