    <title id="ko-platform-engineering-07-crossplane-4-title">Backstage 셀프서비스 프로비저닝 흐름</title>
    <desc id="ko-platform-engineering-07-crossplane-4-desc">개발자가 Backstage 폼에 입력하면 Scaffolder가 Claim YAML을 Git에 커밋하고 ArgoCD가 이를 클러스터에 적용해 Crossplane이 Composite Resource와 Managed Resource를 거쳐 RDS·S3·SecurityGroup을 프로비저닝하는 셀프서비스 흐름.</desc>
