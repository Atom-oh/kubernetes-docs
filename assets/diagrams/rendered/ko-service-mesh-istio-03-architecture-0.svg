<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="istiod-arch-title istiod-arch-desc">
    <title id="istiod-arch-title">Istiod 내부 구조</title>
    <desc id="istiod-arch-desc">Kubernetes API에서 검증된 구성이 Istiod의 Galley·Citadel·Pilot 기능을 거쳐 xDS API와 X.509 인증서로 Envoy 사이드카들에 전달되는 과정을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Istiod -->
    <rect x="128" y="220" width="704" height="144" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="416" y="224" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="233" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ISTIOD · 단일 프로세스</text>

    <!-- Arrows (behind boxes) -->
    <!-- K8s -> Galley : straight vertical, shared x=480 -->
    <line x1="480" y1="160" x2="480" y2="252" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Galley -> Citadel : straight horizontal, shared y=300 -->
    <line x1="384" y1="300" x2="344" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Galley -> Pilot : straight horizontal, shared y=300 -->
    <line x1="576" y1="300" x2="616" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Citadel -> Envoy (elbow) -->
    <path d="M 248,348 V 392 Q 248,400 256,400 H 436 Q 444,400 444,408 V 456" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Pilot -> Envoy (elbow, focal/accent) -->
    <path d="M 712,348 V 392 Q 712,400 704,400 H 524 Q 516,400 516,408 V 456" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels -->
    <rect x="428" y="196" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="205" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">구성 검증 요청</text>

    <rect x="346" y="282" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="364" y="291" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">검증됨</text>

    <rect x="578" y="282" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="596" y="291" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">검증됨</text>

    <rect x="264" y="376" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="312" y="385" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">X.509 · SDS API</text>

    <rect x="560" y="376" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="616" y="385" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">xDS API · 구성 푸시</text>

    <!-- Node: Kubernetes API -->
    <rect x="380" y="96" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="96" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="388" y="104" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="404" y="113" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
    <text x="480" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes API</text>
    <text x="480" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">API Server + Istio CRDs</text>

    <!-- Node: Citadel 기능 -->
    <rect x="152" y="252" width="192" height="96" rx="6" fill="#ffffff"/>
    <rect x="152" y="252" width="192" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="160" y="260" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="178" y="269" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FUNC</text>
    <text x="248" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Citadel 기능</text>
    <text x="248" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CA · Identity (SPIFFE)</text>

    <!-- Node: Galley 기능 -->
    <rect x="384" y="252" width="192" height="96" rx="6" fill="#ffffff"/>
    <rect x="384" y="252" width="192" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="392" y="260" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="410" y="269" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FUNC</text>
    <text x="480" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Galley 기능</text>
    <text x="480" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">구성 검증 · 처리</text>

    <!-- Node: Pilot 기능 (focal) -->
    <rect x="616" y="252" width="192" height="96" rx="6" fill="#ffffff"/>
    <rect x="616" y="252" width="192" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="624" y="260" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="642" y="269" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FUNC</text>
    <text x="712" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pilot 기능</text>
    <text x="712" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Service Discovery · xDS</text>

    <!-- Node: Envoy Proxies -->
    <rect x="380" y="456" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="456" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="388" y="464" width="36" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="406" y="473" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
    <text x="480" y="492" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxies</text>
    <text x="480" y="508" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">사이드카 1..N</text>

    <!-- Legend -->
    <line x1="128" y1="548" x2="832" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="128" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="128" y="576" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="148" y="584" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal · xDS 구성 배포</text>
    <rect x="360" y="576" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="584" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Istiod 내부 기능</text>
    <rect x="560" y="576" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="580" y="584" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Data Plane</text>
  </svg>