<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sec-title sec-desc">
    <title id="sec-title">Storage security controls</title>
    <desc id="sec-desc">Diagram showing EBS, EFS, FSx, and S3 security pairing into data encryption (backed by AWS KMS) and access control (IAM and Kubernetes RBAC), with access control and an independent pod security context both converging on policy enforcement via OPA Gatekeeper, Kyverno, and Pod Security Standards.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="8" y="64" width="240" height="384" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="28" y="68" width="132" height="12" rx="2" fill="#ffffff"/>
    <text x="94" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STORAGE SERVICES</text>

    <rect x="360" y="64" width="280" height="384" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="380" y="68" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="456" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SECURITY MEASURES</text>

    <rect x="712" y="64" width="224" height="384" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="732" y="68" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="802" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ENFORCEMENT</text>

    <!-- Arrows (drawn before boxes) -->
    <!-- service rows r1=128 r2=224 r3=320 r4=416 -->
    <!-- EBS,EFS -> Encryption (straight, box spans 96-256) -->
    <line x1="232" y1="128" x2="376" y2="128" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="232" y1="224" x2="376" y2="224" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- FSx,S3 -> Access Control (straight, box spans 288-448) -->
    <line x1="232" y1="320" x2="376" y2="320" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="232" y1="416" x2="376" y2="416" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Encryption -> KMS (straight, same span) -->
    <line x1="624" y1="176" x2="728" y2="176" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Access Control -> Policy Enforcement (straight, primary entry y=368) -->
    <line x1="624" y1="368" x2="728" y2="368" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- Pod Security Context -> Policy Enforcement (elbow, secondary entry y=408) -->
    <path d="M624,496 H668 Q676,496 676,488 V416 Q676,408 684,408 H728" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Nodes: Storage Services (col1) -->
    <rect x="24" y="96" width="208" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="128" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EBS Security</text>
    <text x="128" y="138" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kmsKeyId param</text>

    <rect x="24" y="192" width="208" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="128" y="218" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EFS Security</text>
    <text x="128" y="234" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mountOptions: tls</text>

    <rect x="24" y="288" width="208" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="128" y="314" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">FSx Security</text>
    <text x="128" y="330" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sg port 988</text>

    <rect x="24" y="384" width="208" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="128" y="410" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">S3 Security</text>
    <text x="128" y="426" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">--sse AES256</text>

    <!-- Nodes: Security Measures (col2) -->
    <rect x="376" y="96" width="248" height="160" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="500" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Data Encryption</text>
    <text x="500" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">at-rest + in-transit</text>

    <rect x="376" y="288" width="248" height="160" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="500" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Access Control</text>
    <text x="500" y="376" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">IAM · security groups · RBAC</text>

    <!-- Node: Pod Security Context (standalone, optional/dashed) -->
    <rect x="376" y="468" width="248" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="500" y="492" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod Security Context</text>
    <text x="500" y="508" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">readOnlyRootFS · seccomp</text>

    <!-- Nodes: Enforcement (col3) -->
    <rect x="728" y="96" width="192" height="160" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="824" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS KMS</text>
    <text x="824" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">key management</text>

    <rect x="728" y="288" width="192" height="160" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="824" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Policy Enforcement</text>
    <text x="824" y="376" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OPA · Kyverno · PSS</text>

    <!-- Legend -->
    <line x1="32" y1="552" x2="928" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="120" y="561" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="140" y="569" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">FINAL ADMISSION GATE</text>
    <rect x="360" y="561" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="380" y="569" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">INDEPENDENT OF STORAGE SERVICE CHOICE</text>
  </svg>