<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="harbor-repl-title harbor-repl-desc">
    <title id="harbor-repl-title">Pull vs. push replication</title>
    <desc id="harbor-repl-desc">Harbor supports two replication directions: pulling images in from an external registry to mirror them locally, and pushing images out from a source Harbor to a remote registry to distribute them.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zone: Pull Replication -->
    <rect x="60" y="108" width="840" height="124" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="84" y="112" width="188" height="12" rx="2" fill="#ffffff"/>
    <text x="178" y="121" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PULL REPLICATION (MIRROR)</text>

    <!-- Zone: Push Replication -->
    <rect x="60" y="352" width="840" height="124" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="84" y="356" width="200" height="12" rx="2" fill="#ffffff"/>
    <text x="184" y="365" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PUSH REPLICATION (DISTRIBUTE)</text>

    <!-- Arrows -->
    <line x1="320" y1="176" x2="620" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="320" y1="420" x2="620" y2="420" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="450" y="156" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="470" y="165" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PULL</text>

    <rect x="450" y="400" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="470" y="409" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH</text>

    <!-- Node: External Registry -->
    <rect x="100" y="140" width="220" height="72" rx="6" fill="#ffffff"/>
    <rect x="100" y="140" width="220" height="72" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="108" y="148" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="126" y="157" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="210" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">External Registry</text>
    <text x="210" y="196" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Docker Hub / ECR</text>

    <!-- Node: Harbor (Local) — focal -->
    <rect x="620" y="140" width="220" height="72" rx="6" fill="#ffffff"/>
    <rect x="620" y="140" width="220" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="628" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="644" y="157" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="730" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Harbor (Local)</text>
    <text x="730" y="196" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mirror target</text>

    <!-- Node: Harbor (Source) — focal -->
    <rect x="100" y="384" width="220" height="72" rx="6" fill="#ffffff"/>
    <rect x="100" y="384" width="220" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="108" y="392" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="124" y="401" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="210" y="424" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Harbor (Source)</text>
    <text x="210" y="440" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">distribution origin</text>

    <!-- Node: Remote Registry -->
    <rect x="620" y="384" width="220" height="72" rx="6" fill="#ffffff"/>
    <rect x="620" y="384" width="220" height="72" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="628" y="392" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="646" y="401" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="730" y="424" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Remote Registry</text>
    <text x="730" y="440" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ECR / Harbor DR</text>
  </svg>