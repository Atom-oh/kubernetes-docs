<title id="en-observability-alerting-03-grafana-oncall-7-title">Grafana OnCall Notification Channel Priority</title>
<desc id="en-observability-alerting-03-grafana-oncall-7-desc">Flowchart showing that an important alert fans out to every notification channel — push, phone, SMS, Slack, and email — while a default-priority alert reaches only Slack and email.</desc>
