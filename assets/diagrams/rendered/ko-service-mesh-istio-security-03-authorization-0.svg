<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authz-decision-title authz-decision-desc">
  <title id="authz-decision-title">Istio AuthorizationPolicy 평가 흐름</title>
  <desc id="authz-decision-desc">요청이 AuthorizationPolicy 내부의 Service Account, Namespace, HTTP Method 세 가지 조건을 순서대로 통과해야 허용되며, 어느 단계든 불일치하면 즉시 거부로 이동하는 흐름을 보여준다.</desc>
  <defs><style>@import url(https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
    <style>
      .node-name{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:600; font-size:12px; fill:var(--ink); }
      .node-name-strong{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:700; font-size:12px; }
      .eyebrow{ font-family:'Geist Mono',ui-monospace,monospace; font-size:8px; font-weight:500; letter-spacing:0.14em; fill:var(--soft); text-transform:uppercase; }
      .arrow-label{ font-family:'Geist Mono',ui-monospace,monospace; font-size:8px; letter-spacing:0.06em; fill:var(--muted); }
      .legend-label{ font-family:'Geist Mono',ui-monospace,monospace; font-size:8px; letter-spacing:0.06em; fill:var(--muted); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Zone: AuthorizationPolicy boundary -->
  <rect x="280" y="80" width="280" height="392" rx="8" fill="rgba(236,114,17,0.05)" stroke="rgba(236,114,17,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="292" y="84" width="176" height="14" fill="#ffffff"/>
  <text x="292" y="94" class="eyebrow">AUTHORIZATION POLICY</text>

  <!-- ===== Connectors (drawn before boxes) ===== -->

  <!-- Request -> Check1 (straight, same x) -->
  <path d="M420,72 V112" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Check1 -> Check2 (match) -->
  <path d="M420,200 V240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="428" y="213" width="40" height="14" fill="#ffffff"/>
  <text x="448" y="223" class="arrow-label" text-anchor="middle">일치</text>

  <!-- Check2 -> Check3 (match) -->
  <path d="M420,328 V368" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="428" y="341" width="40" height="14" fill="#ffffff"/>
  <text x="448" y="351" class="arrow-label" text-anchor="middle">일치</text>

  <!-- Check3 -> Allow (match) -->
  <path d="M420,456 V496" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="428" y="469" width="40" height="14" fill="#ffffff"/>
  <text x="448" y="479" class="arrow-label" text-anchor="middle">일치</text>

  <!-- Check1 -> Deny (mismatch, right+down elbow) -->
  <path d="M510,156 H592 Q600,156 600,164 V256 Q600,264 608,264 H725"
        fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="606" y="203" width="44" height="14" fill="#ffffff"/>
  <text x="628" y="213" class="arrow-label" text-anchor="middle">불일치</text>

  <!-- Check2 -> Deny (mismatch, straight) -->
  <path d="M510,284 H725" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="595" y="264" width="44" height="14" fill="#ffffff"/>
  <text x="617" y="274" class="arrow-label" text-anchor="middle">불일치</text>

  <!-- Check3 -> Deny (mismatch, right+up elbow) -->
  <path d="M510,412 H642 Q650,412 650,404 V312 Q650,304 658,304 H725"
        fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="656" y="351" width="44" height="14" fill="#ffffff"/>
  <text x="678" y="361" class="arrow-label" text-anchor="middle">불일치</text>

  <!-- ===== Nodes ===== -->

  <!-- Request (oval) -->
  <ellipse cx="420" cy="48" rx="80" ry="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="420" y="52" class="node-name" text-anchor="middle">요청</text>

  <!-- Check1: Service Account -->
  <polygon points="420,112 510,156 420,200 330,156" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="420" y="152" class="eyebrow" text-anchor="middle">CHECK 1</text>
  <text x="420" y="168" class="node-name" text-anchor="middle">Service Account 확인</text>

  <!-- Check2: Namespace -->
  <polygon points="420,240 510,284 420,328 330,284" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="420" y="280" class="eyebrow" text-anchor="middle">CHECK 2</text>
  <text x="420" y="296" class="node-name" text-anchor="middle">Namespace 확인</text>

  <!-- Check3: HTTP Method -->
  <polygon points="420,368 510,412 420,456 330,412" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="420" y="408" class="eyebrow" text-anchor="middle">CHECK 3</text>
  <text x="420" y="424" class="node-name" text-anchor="middle">HTTP Method 확인</text>

  <!-- Allow (oval, focal) -->
  <ellipse cx="420" cy="520" rx="80" ry="24" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="420" y="524" class="node-name-strong" text-anchor="middle" fill="#EC7211">허용</text>

  <!-- Deny (rect) -->
  <rect x="725" y="252" width="150" height="64" rx="6" fill="#ffffff"/>
  <rect x="725" y="252" width="150" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="800" y="288" class="node-name" text-anchor="middle">거부</text>

  <!-- Legend -->
  <line x1="30" y1="548" x2="930" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <line x1="40" y1="572" x2="72" y2="572" stroke="#EC7211" stroke-width="1.2"/>
  <text x="80" y="576" class="legend-label">일치 → 다음 검사 / 최종 허용</text>
  <line x1="360" y1="572" x2="392" y2="572" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="576" class="legend-label">불일치 → 즉시 거부</text>
</svg>