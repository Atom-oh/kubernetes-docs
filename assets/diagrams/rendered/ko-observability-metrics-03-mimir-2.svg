<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="tenant-title tenant-desc">
    <title id="tenant-title">Mimir 테넌트 격리 구조</title>
    <desc id="tenant-desc">세 테넌트가 각자의 X-Scope-OrgID 헤더로 Distributor에 메트릭을 보내고, Ingester를 거쳐 객체 스토리지의 서로 다른 테넌트별 블록 경로에 격리 저장됨을 보여주는 다이어그램.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: 테넌트 -->
    <rect x="40" y="72" width="200" height="360" rx="8"
          fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="98" y="76" width="84" height="12" rx="2" fill="#ffffff"/>
    <text x="140" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.14em">테넌트</text>

    <!-- Zone: Mimir -->
    <rect x="380" y="160" width="200" height="204" rx="8"
          fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="450" y="164" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="173" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.14em">MIMIR</text>

    <!-- Zone: 객체 스토리지 -->
    <rect x="720" y="72" width="200" height="360" rx="8"
          fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="760" y="76" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="820" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.14em">객체 스토리지</text>

    <!-- Arrows: tenants -> Distributor, fan attach on Distributor's left edge (y=210,232,254) -->
    <path d="M 224,140 H 302 Q 310,140 310,148 V 202 Q 310,210 318,210 H 396"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 224,260 H 302 Q 310,260 310,252 V 240 Q 310,232 318,232 H 396"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 224,380 H 302 Q 310,380 310,372 V 262 Q 310,254 318,254 H 396"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Distributor -> Ingester (same column, straight) -->
    <line x1="480" y1="264" x2="480" y2="284" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Ingester -> tenant blocks (fan out from Ingester's right edge y=300,316,332) -->
    <path d="M 564,300 H 642 Q 650,300 650,292 V 148 Q 650,140 658,140 H 736"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="564" y1="316" x2="736" y2="316" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 564,332 H 642 Q 650,332 650,340 V 372 Q 650,380 658,380 H 736"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="248" y="120" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="276" y="129" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">ORGID=A</text>

    <rect x="248" y="240" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="276" y="249" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">ORGID=B</text>

    <rect x="248" y="360" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="276" y="369" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">ORGID=C</text>

    <!-- Node: Tenant A -->
    <rect x="56" y="108" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="56" y="108" width="168" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="140" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tenant A</text>
    <text x="140" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">팀 A</text>

    <!-- Node: Tenant B -->
    <rect x="56" y="228" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="56" y="228" width="168" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="140" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tenant B</text>
    <text x="140" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">팀 B</text>

    <!-- Node: Tenant C -->
    <rect x="56" y="348" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="56" y="348" width="168" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="140" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tenant C</text>
    <text x="140" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">팀 C</text>

    <!-- Node: Distributor (focal) -->
    <rect x="396" y="200" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="396" y="200" width="168" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Distributor</text>
    <text x="480" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">테넌트 검증</text>

    <!-- Node: Ingester -->
    <rect x="396" y="284" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="396" y="284" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Ingester</text>
    <text x="480" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">블록 라우팅</text>

    <!-- Node: tenant-a/blocks -->
    <rect x="736" y="108" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="736" y="108" width="168" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="820" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">tenant-a/</text>
    <text x="820" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">blocks/</text>

    <!-- Node: tenant-b/blocks -->
    <rect x="736" y="284" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="736" y="284" width="168" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="820" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">tenant-b/</text>
    <text x="820" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">blocks/</text>

    <!-- Node: tenant-c/blocks -->
    <rect x="736" y="348" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="736" y="348" width="168" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="820" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">tenant-c/</text>
    <text x="820" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">blocks/</text>

    <!-- Legend -->
    <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="488" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="200" y="480" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="220" y="488" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">진입점(초점)</text>

    <rect x="380" y="480" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="400" y="488" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">테넌트별 저장소</text>
  </svg>