<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Knative Service resource ownership: Configuration, Route, and Revisions</title>
<desc id="d">A Knative Service owns a Configuration and a Route; the Configuration creates a new immutable Revision each time it changes, while the Route directs all live traffic to the latest revision and keeps older revisions available at zero percent for rollback.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- Arrows -->
<!-- SVC -> Configuration -->
<path d="M 456,140 V 156 Q 456,164 448,164 H 380 Q 372,164 372,172" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- SVC -> Route -->
<path d="M 504,140 V 156 Q 504,164 512,164 H 580 Q 588,164 588,172" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Configuration -> Revision 3/2/1 (creates on change), fanned off Configuration's bottom edge -->
<path d="M 344,216 V 280 Q 344,288 352,288 H 400" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 372,216 V 376 Q 372,384 380,384 H 400" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 400,216 V 472 Q 400,480 400,480" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Route -> Revision 3 (100% traffic, accent headline) -->
<line x1="588" y1="216" x2="588" y2="260" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="596" y="228" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="616" y="237" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">100%</text>

<!-- Route -> Revision 2 (0%, dashed rollback), fanned off Route's bottom edge to clear Revision 3 -->
<path d="M 620,216 V 376 Q 620,384 612,384 H 600" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<!-- Route -> Revision 1 (0%, dashed rollback), fanned further to clear Revisions 3 and 2 -->
<path d="M 636,216 V 472 Q 636,480 628,480 H 600" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Nodes -->
<!-- Knative Service -->
<rect x="432" y="76" width="96" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Knative</text>
<text x="480" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service</text>
<text x="480" y="132" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ksvc</text>

<!-- Configuration -->
<rect x="316" y="172" width="112" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="372" y="198" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Configuration</text>

<!-- Route -->
<rect x="532" y="172" width="112" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="588" y="198" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Route</text>

<!-- Revision 1 (oldest, standby) -->
<rect x="400" y="452" width="200" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="#7D8998" stroke-width="1"/>
<text x="500" y="478" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Revision v1</text>
<text x="500" y="494" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">immutable — rollback target</text>

<!-- Revision 2 (standby) -->
<rect x="400" y="356" width="200" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="#7D8998" stroke-width="1"/>
<text x="500" y="382" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Revision v2</text>
<text x="500" y="398" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">immutable — rollback target</text>

<!-- Revision 3 (latest, focal) -->
<rect x="400" y="260" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="500" y="286" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Revision v3</text>
<text x="500" y="302" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">immutable — latest, serving live</text>

<!-- Legend -->
<line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="556" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="60" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal — revision serving traffic</text>
<line x1="292" y1="560" x2="320" y2="560" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="328" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Live traffic</text>
<line x1="452" y1="560" x2="480" y2="560" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="488" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Owns / rollback-available</text>
</svg>