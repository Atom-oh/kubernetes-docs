<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title dg-desc">
  <title id="dg-title">Log Collection Pipeline</title>
  <desc id="dg-desc">Logs move left to right through five stages: raw sources, a collection layer of agents, a processing layer that parses and buffers records, a storage layer that fans out to multiple backends, and an analysis layer where each backend is queried.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <text x="40" y="28" class="mono" font-size="8" letter-spacing="0.14em" fill="#7D8998">OBSERVABILITY &#183; LOGGING</text>
  <text x="40" y="52" class="sans" font-size="20" font-weight="700" fill="#232F3E">Log Collection Pipeline</text>

  <!-- ============ ARROWS (behind boxes) ============ -->
  <!-- Sources -> Collection -->
  <line x1="184" y1="280" x2="224" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Collection -> Processing -->
  <line x1="368" y1="280" x2="408" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Processing -> Storage (accent: entering focal layer) -->
  <line x1="552" y1="280" x2="592" y2="280" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <!-- Storage -> Analysis (accent: leaving focal layer) -->
  <line x1="736" y1="280" x2="776" y2="280" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

  <!-- ============ NODE: Log Sources ============ -->
  <rect x="40" y="180" width="144" height="200" rx="6" fill="#ffffff"/>
  <rect x="40" y="180" width="144" height="200" rx="6" fill="rgba(84,91,100,0.08)" stroke="#7D8998" stroke-width="1"/>
  <rect x="48" y="188" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
  <text x="62" y="197" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="#7D8998">SRC</text>
  <text x="112" y="220" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Log Sources</text>
  <line x1="56" y1="232" x2="168" y2="232" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="56" y="250" class="mono" font-size="9" fill="#545B64">Application logs</text>
  <text x="56" y="268" class="mono" font-size="9" fill="#545B64">System logs</text>
  <text x="56" y="286" class="mono" font-size="9" fill="#545B64">Kubernetes events</text>
  <text x="56" y="304" class="mono" font-size="9" fill="#545B64">Control plane logs</text>

  <!-- ============ NODE: Collection Layer ============ -->
  <rect x="224" y="180" width="144" height="200" rx="6" fill="#ffffff"/>
  <rect x="224" y="180" width="144" height="200" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="232" y="188" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="246" y="197" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="#232F3E">COL</text>
  <text x="296" y="220" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Collection Layer</text>
  <line x1="240" y1="232" x2="352" y2="232" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="240" y="250" class="mono" font-size="9" fill="#545B64">DaemonSet agent</text>
  <text x="240" y="268" class="mono" font-size="9" fill="#545B64">(FluentBit/Promtail)</text>
  <text x="240" y="286" class="mono" font-size="9" fill="#545B64">Sidecar container</text>
  <text x="240" y="304" class="mono" font-size="9" fill="#545B64">OTel Collector</text>

  <!-- ============ NODE: Processing Layer ============ -->
  <rect x="408" y="180" width="144" height="200" rx="6" fill="#ffffff"/>
  <rect x="408" y="180" width="144" height="200" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="416" y="188" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="430" y="197" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="#232F3E">PROC</text>
  <text x="480" y="220" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Processing Layer</text>
  <line x1="424" y1="232" x2="536" y2="232" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="424" y="250" class="mono" font-size="9" fill="#545B64">Parse &amp; normalize</text>
  <text x="424" y="268" class="mono" font-size="9" fill="#545B64">Enrich metadata</text>
  <text x="424" y="286" class="mono" font-size="9" fill="#545B64">Filter &amp; sample</text>
  <text x="424" y="304" class="mono" font-size="9" fill="#545B64">Buffer</text>

  <!-- ============ NODE: Storage Layer (focal) ============ -->
  <rect x="592" y="180" width="144" height="200" rx="6" fill="#ffffff"/>
  <rect x="592" y="180" width="144" height="200" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.4"/>
  <rect x="600" y="188" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.55)" stroke-width="0.8"/>
  <text x="616" y="197" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="#EC7211">STORE</text>
  <text x="664" y="220" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Storage Layer</text>
  <line x1="608" y1="232" x2="720" y2="232" stroke="rgba(236,114,17,0.25)" stroke-width="0.8"/>
  <text x="608" y="250" class="mono" font-size="9" fill="#545B64">Grafana Loki</text>
  <text x="608" y="268" class="mono" font-size="9" fill="#545B64">OpenSearch</text>
  <text x="608" y="286" class="mono" font-size="9" fill="#545B64">CloudWatch Logs</text>
  <text x="608" y="304" class="mono" font-size="9" fill="#545B64">ClickHouse</text>

  <!-- ============ NODE: Analysis Layer ============ -->
  <rect x="776" y="180" width="144" height="200" rx="6" fill="#ffffff"/>
  <rect x="776" y="180" width="144" height="200" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="784" y="188" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="796" y="197" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="#232F3E">VIZ</text>
  <text x="848" y="220" class="sans" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Analysis Layer</text>
  <line x1="792" y1="232" x2="904" y2="232" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="792" y="250" class="mono" font-size="9" fill="#545B64">Grafana</text>
  <text x="792" y="268" class="mono" font-size="9" fill="#545B64">OpenSearch</text>
  <text x="792" y="286" class="mono" font-size="9" fill="#545B64">Dashboards</text>
  <text x="792" y="304" class="mono" font-size="9" fill="#545B64">CloudWatch Insights</text>

  <!-- ============ LEGEND ============ -->
  <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="488" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>

  <rect x="40" y="504" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="60" y="512" class="sans" font-size="8.5" fill="#545B64">Pipeline stage</text>

  <rect x="216" y="504" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="236" y="512" class="sans" font-size="8.5" fill="#545B64">Focal &#183; fan-out storage tier</text>

  <line x1="480" y1="509" x2="508" y2="509" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="516" y="512" class="sans" font-size="8.5" fill="#545B64">Log flow</text>

  <line x1="640" y1="509" x2="668" y2="509" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="676" y="512" class="sans" font-size="8.5" fill="#545B64">Primary sink boundary</text>

  <text x="40" y="546" class="sans" font-size="9.5" font-style="italic" fill="#545B64">Each stage box groups the collapsed set of components from the source pipeline; the storage layer is the pipeline's fan-out point across four backends.</text>
</svg>
