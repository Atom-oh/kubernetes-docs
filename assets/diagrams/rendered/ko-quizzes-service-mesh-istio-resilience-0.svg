<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="outlier-flow-title outlier-flow-desc">
<title id="outlier-flow-title">아웃라이어 감지 흐름</title>
<desc id="outlier-flow-desc">요청 처리 중 에러가 누적되어 임계값을 넘으면 해당 인스턴스를 일시적으로 제외하고, 대기 후 복구를 시도하는 아웃라이어 감지 루프를 보여준다.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="40" y="52" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ISTIO · OUTLIER DETECTION</text>
<text x="40" y="80" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">아웃라이어 감지 흐름</text>

<!-- ===== Nodes ===== -->
<!-- Row 1 y=140 : Start(oval) -> Check(diamond) -->
<!-- Start oval -->
<ellipse cx="140" cy="160" rx="76" ry="28" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="140" y="165" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">요청 시작</text>

<!-- Check diamond, center 400,160, half-w 72 half-h 40 -->
<polygon points="400,120 472,160 400,200 328,160" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="400" y="157" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">에러</text>
<text x="400" y="171" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">확인?</text>

<!-- Normal rectangle, right side, x 700-880 y 136-184 -->
<rect x="700" y="136" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="790" y="164" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">정상 처리</text>

<!-- Count rectangle, row2 y=280, x 328-472 -->
<rect x="328" y="256" width="144" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="400" y="278" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">에러 카운트</text>
<text x="400" y="293" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">증가</text>

<!-- Threshold diamond row3 center 400,400 half 72/40 -->
<polygon points="400,360 472,400 400,440 328,400" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="400" y="397" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">임계값</text>
<text x="400" y="411" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">초과?</text>

<!-- Eject rectangle FOCAL, x700-880 y376-424 -->
<rect x="700" y="376" width="180" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="790" y="404" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">인스턴스 제외</text>

<!-- Wait rectangle row4 x700-880 y 480-528 -->
<rect x="700" y="480" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="790" y="508" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">대기 시간</text>

<!-- Retry rectangle x400-580 y 480-528 -->
<rect x="220" y="480" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="310" y="508" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">복구 시도</text>

<!-- ===== Arrows (drawn first conceptually, but placed after nodes here per markup order is fine since paths reference marker) ===== -->
<!-- Start -> Check : straight horizontal, same y -->
<line x1="216" y1="160" x2="322" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Check -success-> Normal : right, same y=160/160... Normal center y=160 -->
<line x1="472" y1="160" x2="694" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="552" y="140" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="572" y="149" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" font-family="'Geist Mono', monospace">성공</text>

<!-- Check -error-> Count : vertical down, same x=400 -->
<line x1="400" y1="200" x2="400" y2="252" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="416" y="218" width="34" height="12" rx="2" fill="#ffffff"/>
<text x="433" y="227" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" font-family="'Geist Mono', monospace">에러</text>

<!-- Count -> Threshold : vertical down same x -->
<line x1="400" y1="304" x2="400" y2="356" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Threshold -Yes-> Eject : elbow right then down. Threshold right tip (472,400) -> Eject left-center (700,400) same y actually -->
<line x1="472" y1="400" x2="694" y2="400" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="562" y="380" width="30" height="12" rx="2" fill="#ffffff"/>
<text x="577" y="389" fill="#EC7211" font-size="8" text-anchor="middle" letter-spacing="0.06em" font-family="'Geist Mono', monospace">Yes</text>

<!-- Threshold -No-> Normal : from bottom-left region up to Normal bottom. Threshold bottom (400,440) elbow to Normal bottom (790,184) -->
<path d="M 400,440 V 452 Q 400,460 408,460 H 842 Q 850,460 850,452 V 184" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="580" y="452" width="24" height="12" rx="2" fill="#ffffff"/>
<text x="592" y="461" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" font-family="'Geist Mono', monospace">No</text>

<!-- Eject -> Wait : vertical down same x=790 -->
<line x1="790" y1="424" x2="790" y2="476" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Wait -> Retry : horizontal same y=504, from Wait left(700,504) to Retry right(400,504) -->
<line x1="700" y1="504" x2="404" y2="504" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Retry -> Start : elbow up then left. Retry top (310,480) up to y=160 then left into Start bottom (140,188) -->
<path d="M 310,480 V 240 Q 310,232 302,232 H 148 Q 140,232 140,224 V 192" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="122" y="248" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="140" y="257" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" font-family="'Geist Mono', monospace">재시도</text>

<!-- Legend -->
<line x1="40" y1="562" x2="920" y2="562" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="578" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<circle cx="176" cy="574" r="5" fill="#EC7211"/>
<text x="188" y="578" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">임계값 초과 시 제외 처리 (핵심 분기)</text>

</svg>
