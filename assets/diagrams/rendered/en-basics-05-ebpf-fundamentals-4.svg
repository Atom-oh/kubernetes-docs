<rect x="660" y="168" width="260" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="790.0" y="196.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pass to Kernel Stack</text>
<path d="M 480,280 H 564.0 Q 570.0,280 570.0,274 V 266.0 Q 570.0,260.0 576.0,260.0 H 660" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="475.0" y="262" width="100" height="12" rx="2" fill="#ffffff"/>
