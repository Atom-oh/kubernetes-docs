<rect x="660" y="236" width="260" height="48" rx="6" fill="#ffffff"/>
<rect x="660" y="236" width="260" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="790.0" y="264.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Return to Same NIC</text>
<path d="M 480,350 H 564.0 Q 570.0,350 570.0,344 V 334.0 Q 570.0,328.0 576.0,328.0 H 660" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="475.0" y="332" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="525.0" y="341" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">XDP_REDIRECT</text>
<rect x="660" y="304" width="260" height="48" rx="6" fill="#ffffff"/>
<rect x="660" y="304" width="260" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="790.0" y="332.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Redirect to Interface</text>
<path d="M 480,410 H 564.0 Q 570.0,410 570.0,404 V 402.0 Q 570.0,396.0 576.0,396.0 H 660" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="475.0" y="392" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="525.0" y="401" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">XDP_ABORTED</text>
<rect x="660" y="372" width="260" height="48" rx="6" fill="#ffffff"/>
<rect x="660" y="372" width="260" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="790.0" y="400.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Error Handling</text>
<line x1="40" y1="544" x2="920" y2="544" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
<text x="40" y="560" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="116" y="550" width="16" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="150" y="559" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">XDP program (in-driver hook)</text>
<rect x="346" y="550" width="16" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="380" y="559" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Verdict / outcome</text>
