<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc">
  <title id="d2-title">Istio DNS Proxy의 자동 주소 할당 시퀀스</title>
  <desc id="d2-desc">Istiod가 ServiceEntry 등록 시 Envoy에 xDS로 가상 IP 구성을 미리 푸시해 두면, 애플리케이션의 DNS 쿼리에 Envoy가 즉시 가상 IP로 응답하고, 이후 그 가상 IP로 들어온 HTTP 요청을 Envoy가 실제 호스트로 매핑해 외부 서버의 실제 IP를 조회한 뒤 트래픽을 전달하고 응답을 돌려주는 과정을 보여준다.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Lifelines -->
  <line x1="120" y1="108" x2="120" y2="576" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="380" y1="108" x2="380" y2="576" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="620" y1="108" x2="620" y2="576" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="860" y1="108" x2="860" y2="576" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Activation bars -->
  <rect x="376" y="132" width="8" height="424" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="0.8"/>

  <!-- ===== Messages ===== -->

  <!-- M1 y=140: Istiod -> Envoy : xDS 구성 푸시 (가상 IP 할당) -->
  <path d="M620,140 L384,140" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="440" y="120" width="140" height="12" fill="#ffffff"/>
  <text x="510" y="129" fill="#545B64" font-size="8" class="mono" text-anchor="middle">xDS 구성 푸시 (가상 IP)</text>

  <!-- M2 y=180: App -> Envoy : DNS 쿼리 api.example.com -->
  <path d="M120,180 L376,180" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="164" y="160" width="152" height="12" fill="#ffffff"/>
  <text x="240" y="169" fill="#545B64" font-size="8" class="mono" text-anchor="middle">DNS 쿼리 · api.example.com</text>

  <!-- M3 y=220: Envoy self : 가상 IP 조회 240.240.0.1 -->
  <path d="M384,220 L418,220 A6,6 0 0 1 424,226 L424,238 A6,6 0 0 1 418,244 L390,244"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="430" y="225" width="132" height="12" fill="#ffffff"/>
  <text x="496" y="234" fill="#545B64" font-size="8" class="mono" text-anchor="middle">가상 IP 조회 · 240.240.0.1</text>

  <!-- M4 y=268: Envoy -> App : DNS 응답 240.240.0.1 (headline, accent) -->
  <path d="M376,268 L120,268" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="164" y="248" width="152" height="12" fill="#ffffff"/>
  <text x="240" y="257" fill="#EC7211" font-size="8" class="mono" text-anchor="middle">DNS 응답 · 240.240.0.1</text>

  <!-- M5 y=308: App -> Envoy : HTTP 요청 240.240.0.1:443 -->
  <path d="M120,308 L376,308" fill="none" stroke="#0972D3" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="164" y="288" width="152" height="12" fill="#ffffff"/>
  <text x="240" y="297" fill="#0972D3" font-size="8" class="mono" text-anchor="middle">HTTP 요청 · 240.240.0.1:443</text>

  <!-- M6 y=348: Envoy self : 실제 호스트 매핑 api.example.com -->
  <path d="M384,348 L418,348 A6,6 0 0 1 424,354 L424,366 A6,6 0 0 1 418,372 L390,372"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="430" y="353" width="152" height="12" fill="#ffffff"/>
  <text x="506" y="362" fill="#545B64" font-size="8" class="mono" text-anchor="middle">실제 호스트 매핑 · api.example.com</text>

  <!-- M7 y=396: Envoy -> External : DNS 조회 (실제 IP) -->
  <path d="M384,396 L616,396" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="440" y="376" width="120" height="12" fill="#ffffff"/>
  <text x="500" y="385" fill="#545B64" font-size="8" class="mono" text-anchor="middle">DNS 조회 (실제 IP)</text>

  <!-- M8 y=436: External -> Envoy : 203.0.113.10 (return, dashed) -->
  <path d="M620,436 L384,436" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="440" y="416" width="120" height="12" fill="#ffffff"/>
  <text x="500" y="425" fill="#545B64" font-size="8" class="mono" text-anchor="middle">203.0.113.10</text>

  <!-- M9 y=476: Envoy -> External : HTTP 요청 203.0.113.10:443 -->
  <path d="M384,476 L616,476" fill="none" stroke="#0972D3" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="420" y="456" width="160" height="12" fill="#ffffff"/>
  <text x="500" y="465" fill="#0972D3" font-size="8" class="mono" text-anchor="middle">HTTP 요청 · 203.0.113.10:443</text>

  <!-- M10 y=516: External -> Envoy : 응답 (return, dashed) -->
  <path d="M620,516 L384,516" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="470" y="496" width="60" height="12" fill="#ffffff"/>
  <text x="500" y="505" fill="#545B64" font-size="8" class="mono" text-anchor="middle">응답</text>

  <!-- M11 y=556: Envoy -> App : 응답 (return, dashed) -->
  <path d="M376,556 L120,556" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="210" y="536" width="60" height="12" fill="#ffffff"/>
  <text x="240" y="545" fill="#545B64" font-size="8" class="mono" text-anchor="middle">응답</text>

  <!-- ===== Actor boxes (painted last) ===== -->

  <!-- App -->
  <rect x="56" y="72" width="128" height="36" rx="6" fill="#ffffff"/>
  <rect x="56" y="72" width="128" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="120" y="94" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">애플리케이션</text>

  <!-- Envoy (focal) -->
  <rect x="316" y="72" width="128" height="36" rx="6" fill="#ffffff"/>
  <rect x="316" y="72" width="128" height="36" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="380" y="94" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Envoy DNS Proxy</text>

  <!-- Istiod -->
  <rect x="556" y="72" width="128" height="36" rx="6" fill="#ffffff"/>
  <rect x="556" y="72" width="128" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="620" y="94" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Istiod</text>

  <!-- External -->
  <rect x="792" y="72" width="136" height="36" rx="6" fill="#ffffff"/>
  <rect x="792" y="72" width="136" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="860" y="94" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">api.example.com</text>
</svg>
