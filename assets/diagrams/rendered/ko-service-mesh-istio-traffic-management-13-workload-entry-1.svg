<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc">
  <title id="d1-title">Kubernetes Pod 흐름과 WorkloadEntry 흐름 비교</title>
  <desc id="d1-desc">Kubernetes Pod 경로는 Service를 통해 자동으로 디스커버리·라우팅되는 반면, WorkloadEntry 경로는 ServiceEntry를 통해 VM을 수동으로 등록하고 라우팅해야 함을 나란히 비교한다.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="48" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">FLOWCHART · SIDE BY SIDE</text>
  <text x="36" y="84" font-size="28" font-weight="700" fill="#232F3E">트래픽 흐름 비교</text>
  <text x="36" y="108" font-size="14" fill="#545B64">자동 디스커버리를 쓰는 Pod 경로와 수동 등록이 필요한 WorkloadEntry 경로</text>

  <!-- Zone: Kubernetes Pod flow -->
  <rect x="36" y="152" width="440" height="180" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="52" y="160" width="176" height="14" rx="2" fill="#ffffff"/>
  <text x="140" y="171" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="rgba(35,47,62,0.4)">KUBERNETES 파드 흐름</text>

  <!-- Zone: WorkloadEntry flow -->
  <rect x="484" y="152" width="440" height="180" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="500" y="160" width="164" height="14" rx="2" fill="#ffffff"/>
  <text x="582" y="171" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="rgba(35,47,62,0.4)">WORKLOADENTRY 흐름</text>

  <!-- Arrows: Pod flow row (y=260) -->
  <path d="M150,260 H190" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="156" y="240" width="28" height="12" rx="2" fill="#ffffff"/>
  <text x="170" y="249" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#7D8998">요청</text>

  <path d="M330,260 H370" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="336" y="240" width="28" height="12" rx="2" fill="#ffffff"/>
  <text x="350" y="249" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#EC7211">라우팅</text>

  <!-- Arrows: VM flow row (y=260) -->
  <path d="M598,260 H638" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="604" y="240" width="28" height="12" rx="2" fill="#ffffff"/>
  <text x="618" y="249" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#7D8998">요청</text>

  <path d="M786,260 H826" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="792" y="240" width="28" height="12" rx="2" fill="#ffffff"/>
  <text x="806" y="249" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#EC7211">라우팅</text>

  <!-- Pod flow: Client1 -->
  <g>
    <rect x="54" y="232" width="96" height="56" rx="6" fill="#ffffff"/>
    <rect x="54" y="232" width="96" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="102" y="264" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">클라이언트</text>
  </g>
  <!-- Pod flow: K8s Service -->
  <g>
    <rect x="190" y="228" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="190" y="228" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="260" y="256" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Service</text>
    <text x="260" y="272" class="mono" font-size="9" text-anchor="middle" fill="#545B64">자동 디스커버리</text>
  </g>
  <!-- Pod flow: K8s Pod -->
  <g>
    <rect x="370" y="228" width="96" height="64" rx="6" fill="#ffffff"/>
    <rect x="370" y="228" width="96" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="418" y="256" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Pod</text>
    <text x="418" y="272" class="mono" font-size="9" text-anchor="middle" fill="#545B64">Envoy 자동</text>
  </g>

  <!-- VM flow: Client2 -->
  <g>
    <rect x="502" y="232" width="96" height="56" rx="6" fill="#ffffff"/>
    <rect x="502" y="232" width="96" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="550" y="264" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">클라이언트</text>
  </g>
  <!-- VM flow: ServiceEntry (focal - the manual step) -->
  <g>
    <rect x="638" y="224" width="148" height="72" rx="6" fill="#ffffff"/>
    <rect x="638" y="224" width="148" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="712" y="255" font-size="12" font-weight="700" text-anchor="middle" fill="#232F3E">ServiceEntry</text>
    <text x="712" y="271" class="mono" font-size="9" text-anchor="middle" fill="#545B64">수동 등록</text>
  </g>
  <!-- VM flow: WorkloadEntry -->
  <g>
    <rect x="826" y="228" width="96" height="64" rx="6" fill="#ffffff"/>
    <rect x="826" y="228" width="96" height="64" rx="6" fill="rgba(149,165,166,0.15)" stroke="#7D8998" stroke-width="1"/>
    <text x="874" y="252" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">WorkloadEntry</text>
    <text x="874" y="268" class="mono" font-size="9" text-anchor="middle" fill="#545B64">VM + Envoy</text>
  </g>

  <!-- Legend -->
  <line x1="36" y1="500" x2="924" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="36" y="520" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <rect x="120" y="510" width="16" height="16" rx="3" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="144" y="522" font-size="11" fill="#545B64">클라이언트</text>
  <rect x="280" y="510" width="16" height="16" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="304" y="522" font-size="11" fill="#545B64">수동 등록이 필요한 지점</text>
  <rect x="520" y="510" width="16" height="16" rx="3" fill="rgba(149,165,166,0.15)" stroke="#7D8998" stroke-width="1"/>
  <text x="544" y="522" font-size="11" fill="#545B64">VM 워크로드</text>

  <text x="36" y="568" font-size="14" font-style="italic" fill="#545B64">Pod 경로는 Service가 자동으로 처리하는 일을, VM 경로에서는 ServiceEntry로 직접 선언해야 한다.</text>
</svg>