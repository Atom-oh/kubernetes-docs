<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="staticresp-title staticresp-desc">
  <title id="staticresp-title">Envoy 정적 응답 개요</title>
  <desc id="staticresp-desc">클라이언트 요청이 Envoy Proxy에 도달했을 때 조건이 일치하면 백엔드 서비스를 거치지 않고 Envoy가 직접 정적 응답을 반환하고, 조건이 일치하지 않으면 백엔드로 프록시된다는 것을 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Arrows first -->
  <!-- Client -> Envoy (request) -->
  <line x1="176" y1="304" x2="404" y2="304" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="248" y="284" width="84" height="12" rx="2" fill="#ffffff"/>
  <text x="290" y="293" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">HTTP 요청</text>

  <!-- Envoy -> Client (static response, headline) -->
  <line x1="404" y1="248" x2="176" y2="248" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="220" y="216" width="140" height="24" rx="2" fill="#ffffff"/>
  <text x="290" y="225" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">조건 일치 시</text>
  <text x="290" y="237" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">정적 응답</text>

  <!-- Envoy -> Backend (dashed, conditional passthrough) -->
  <line x1="552" y1="304" x2="748" y2="304" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="580" y="284" width="140" height="24" rx="2" fill="#ffffff"/>
  <text x="650" y="293" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">조건 불일치 시</text>
  <text x="650" y="305" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">프록시</text>

  <!-- Nodes -->
  <rect x="60" y="280" width="116" height="48" rx="6" fill="#ffffff"/>
  <rect x="60" y="280" width="116" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="118" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">클라이언트</text>

  <!-- Focal: Envoy Proxy -->
  <rect x="404" y="272" width="148" height="64" rx="6" fill="#ffffff"/>
  <rect x="404" y="272" width="148" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="478" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>
  <text x="478" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">directResponse</text>
  <text x="478" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">/ EnvoyFilter</text>

  <rect x="748" y="280" width="152" height="48" rx="6" fill="#ffffff"/>
  <rect x="748" y="280" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="824" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">백엔드 서비스</text>

  <!-- Legend -->
  <line x1="30" y1="440" x2="930" y2="440" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="460" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="160" y1="456" x2="192" y2="456" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="200" y="460" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">요청</text>
  <line x1="300" y1="456" x2="332" y2="456" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="340" y="460" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">Envoy가 직접 반환하는 정적 응답</text>
  <line x1="600" y1="456" x2="632" y2="456" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="640" y="460" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">조건부 백엔드 프록시</text>
</svg>