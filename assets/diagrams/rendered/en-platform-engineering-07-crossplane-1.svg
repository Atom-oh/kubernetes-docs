<line x1="30" y1="484" x2="930" y2="484" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="30" y="500" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<circle cx="190" cy="497" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="202" y="500" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal — the core controller</text>
<line x1="480" y1="497" x2="510" y2="497" stroke="#0972D3" stroke-width="1.2"/>
<text x="518" y="500" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Call to an external cloud API</text>
