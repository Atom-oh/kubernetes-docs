<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cp-runtime-title cp-runtime-desc">
<title id="cp-runtime-title">Crossplane controller architecture</title>
<desc id="cp-runtime-desc">The Crossplane core controller manages RBAC and package installation inside the cluster, the package manager installs a provider pod that watches CRDs in etcd and reconciles them against the AWS APIs.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- Zones -->
<rect x="20" y="16" width="680" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="32" y="20" width="176" height="12" rx="2" fill="#ffffff"/>
<text x="120" y="29" text-anchor="middle" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.14em">KUBERNETES CLUSTER</text>

<rect x="720" y="16" width="220" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="732" y="20" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="758" y="29" text-anchor="middle" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.14em">AWS</text>

<!-- Arrows -->
<!-- CP -> RBAC elbow (up) -->
<path d="M200,132 H232 Q240,132 240,124 V84 Q240,76 248,76 H280" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="204" y="94" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="234" y="103" text-anchor="middle" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">MANAGES</text>

<!-- CP -> PKG elbow (down) -->
<path d="M200,132 H232 Q240,132 240,140 V196 Q240,204 248,204 H280" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="204" y="160" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="234" y="169" text-anchor="middle" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">MANAGES</text>

<!-- PKG -> PAWS straight -->
<line x1="420" y1="204" x2="480" y2="204" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="424" y="184" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="450" y="193" text-anchor="middle" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">INSTALLS</text>

<!-- PAWS -> CRD straight -->
<line x1="560" y1="232" x2="560" y2="320" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="524" y="264" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="550" y="273" text-anchor="middle" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">WATCHES</text>

<!-- PAWS -> API straight, link -->
<line x1="640" y1="204" x2="760" y2="204" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<rect x="656" y="184" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="692" y="193" text-anchor="middle" fill="#0972D3" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">RECONCILES</text>

<!-- Nodes -->
<!-- CP (focal) -->
<rect x="60" y="100" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)"/>
<rect x="60" y="100" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="130" y="126" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Crossplane</text>
<text x="130" y="142" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">core controller</text>

<!-- RBAC -->
<rect x="280" y="48" width="140" height="56" rx="6" fill="#ffffff"/>
<rect x="280" y="48" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="350" y="80" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">RBAC Manager</text>

<!-- PKG -->
<rect x="280" y="176" width="140" height="56" rx="6" fill="#ffffff"/>
<rect x="280" y="176" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="350" y="208" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Package Manager</text>

<!-- PAWS -->
<rect x="480" y="176" width="160" height="56" rx="6" fill="#ffffff"/>
<rect x="480" y="176" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="560" y="200" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">provider-aws</text>
<text x="560" y="216" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">controller pod</text>

<!-- CRD (store) -->
<rect x="480" y="320" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)"/>
<rect x="480" y="320" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="560" y="346" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">etcd</text>
<text x="560" y="362" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">CRDs · XRDs · Compositions</text>

<!-- API (external) -->
<rect x="760" y="176" width="140" height="56" rx="6" fill="rgba(35,47,62,0.03)"/>
<rect x="760" y="176" width="140" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="830" y="208" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">AWS APIs</text>

