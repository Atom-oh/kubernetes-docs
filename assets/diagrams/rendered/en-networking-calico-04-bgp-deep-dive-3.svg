<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rr-topology-title rr-topology-desc">
    <title id="rr-topology-title">Route Reflector Peering Topology</title>
    <desc id="rr-topology-desc">Two route reflectors peer with each other and with every client node, letting client nodes learn routes without peering directly with one another, eliminating the need for a full mesh.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- zone -->
    <rect x="248" y="112" width="464" height="328" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="260" y="116" width="188" height="12" rx="2" fill="#ffffff"/>
    <text x="354" y="125" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">ROUTE REFLECTOR TOPOLOGY</text>

    <!-- connectors -->
    <line x1="410" y1="180" x2="550" y2="180" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
    <line x1="340" y1="212" x2="340" y2="344" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="620" y1="212" x2="620" y2="344" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- RR1 -->
    <rect x="270" y="148" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="270" y="148" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="340" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">RR Node 1</text>
    <text x="340" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">cluster-id 1.0.0.1</text>

    <!-- RR2 -->
    <rect x="550" y="148" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="550" y="148" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="620" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">RR Node 2</text>
    <text x="620" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">cluster-id 1.0.0.1</text>

    <!-- Client Nodes aggregate (focal) -->
    <rect x="260" y="344" width="440" height="72" rx="6" fill="#ffffff"/>
    <rect x="260" y="344" width="440" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client Nodes</text>
    <text x="480" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">×6 — no peering between clients</text>

    <!-- legend -->
    <line x1="30" y1="472" x2="930" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="492" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="220" y1="490" x2="248" y2="490" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="258" y="493" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">RR-to-RR iBGP peering</text>
    <line x1="500" y1="490" x2="528" y2="490" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="538" y="493" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Client-to-RR peering (each of 6 clients, to both RRs)</text>

  </svg>