<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="istio-rollout-title istio-rollout-desc">
  <title id="istio-rollout-title">점진적 Istio 도입 전략</title>
  <desc id="istio-rollout-desc">Istio를 시작(Start)에서 완전 도입(End)까지 5단계로 점진 도입하는 흐름: Observability 확보 뒤 mTLS를 PERMISSIVE로 켜고, STRICT로 강화한 다음 고급 기능을 도입한다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#EC7211"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="46" class="title">점진적 Istio 도입 전략</text>
  <text x="30" y="66" class="subtitle">Observability에서 mTLS STRICT, 고급 기능까지 단계적으로 확장한다</text>

  <!-- Eyebrow row -->
  <text x="30" y="200" class="eyebrow">배포 전략 · 운영 가이드</text>

  <!-- Connector line (baseline) -->
  <!-- Nodes: Start(oval) Phase1 Phase2 Phase3(accent) Phase4 End(oval) -->

  <!-- edges (drawn first, under nodes) -->
  <line x1="150" y1="300" x2="186" y2="300" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="306" y1="300" x2="342" y2="300" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="462" y1="300" x2="498" y2="300" stroke="#545B64" stroke-width="1" marker-end="url(#arrow-accent)"/>
  <line x1="618" y1="300" x2="654" y2="300" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="774" y1="300" x2="810" y2="300" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Start (oval) -->
  <rect x="30" y="268" width="120" height="64" rx="32" fill="#F2F3F3" stroke="#232F3E" stroke-width="1"/>
  <text x="90" y="304" text-anchor="middle" class="node-name">시작</text>

  <!-- Phase1 -->
  <rect x="186" y="268" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="246" y="294" text-anchor="middle" class="node-name">Phase 1</text>
  <text x="246" y="310" text-anchor="middle" class="sublabel">Observability</text>

  <!-- Phase2 -->
  <rect x="342" y="268" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="402" y="294" text-anchor="middle" class="node-name">Phase 2</text>
  <text x="402" y="310" text-anchor="middle" class="sublabel">mTLS PERMISSIVE</text>

  <!-- Phase3 (accent / focal) -->
  <rect x="498" y="264" width="120" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="558" y="294" text-anchor="middle" class="node-name-accent">Phase 3</text>
  <text x="558" y="310" text-anchor="middle" class="sublabel-accent">mTLS STRICT</text>

  <!-- Phase4 -->
  <rect x="654" y="268" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="714" y="294" text-anchor="middle" class="node-name">Phase 4</text>
  <text x="714" y="310" text-anchor="middle" class="sublabel">Advanced Features</text>

  <!-- End (oval) -->
  <rect x="810" y="268" width="120" height="64" rx="32" fill="#232F3E" stroke="#232F3E" stroke-width="1"/>
  <text x="870" y="304" text-anchor="middle" class="node-name-white">완전 도입</text>

  <!-- Duration annotations below -->
  <text x="90" y="358" text-anchor="middle" class="sublabel">-</text>
  <text x="246" y="358" text-anchor="middle" class="sublabel">1-2주</text>
  <text x="402" y="358" text-anchor="middle" class="sublabel">1-2주</text>
  <text x="558" y="366" text-anchor="middle" class="sublabel-accent">1주</text>
  <text x="714" y="358" text-anchor="middle" class="sublabel">지속적</text>
  <text x="870" y="358" text-anchor="middle" class="sublabel">-</text>

  <!-- Legend / callout -->
  <line x1="30" y1="410" x2="930" y2="410" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
  <text x="30" y="436" class="sublabel">단계마다 소요 기간을 두고 검증을 거친 뒤 다음 단계로 넘어간다. Phase 3(mTLS STRICT)가 보안 강제의 전환점이다.</text>
</svg>