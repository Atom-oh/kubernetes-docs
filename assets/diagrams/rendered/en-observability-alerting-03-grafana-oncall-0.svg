<title id="en-observability-alerting-03-grafana-oncall-0-title">Grafana OnCall Component Architecture</title>
<desc id="en-observability-alerting-03-grafana-oncall-0-desc">Architecture diagram showing alert sources feeding a central Alert Engine that reads and writes PostgreSQL and Redis/Celery state, drives routing, escalation chains, and schedules to build alert groups, which fan out to notification channels.</desc>
