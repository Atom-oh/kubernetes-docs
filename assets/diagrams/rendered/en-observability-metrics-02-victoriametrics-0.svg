<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vm-cmp-title vm-cmp-desc">
    <title id="vm-cmp-title">Prometheus vs VictoriaMetrics</title>
    <desc id="vm-cmp-desc">Four Prometheus traits are each paired with the corresponding VictoriaMetrics improvement: single-node architecture needs horizontal scaling, medium compression gets 7x better, PromQL becomes MetricsQL while staying fully compatible, and limited retention becomes unlimited long-term storage.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- zones -->
    <rect x="40" y="100" width="400" height="344" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>
    <rect x="520" y="100" width="400" height="344" rx="8" fill="rgba(255,153,0,0.03)" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,4"/>

    <rect x="56" y="104" width="128" height="16" rx="2" fill="#ffffff"/>
    <text x="120" y="116" fill="rgba(35,47,62,0.55)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROMETHEUS</text>

    <rect x="536" y="104" width="176" height="16" rx="2" fill="#ffffff"/>
    <text x="624" y="116" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VICTORIAMETRICS</text>

    <!-- connectors (drawn before nodes) -->
    <!-- row 1 -->
    <line x1="416" y1="168" x2="544" y2="168" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="440" y="146" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="155" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEEDS SCALE</text>

    <!-- row 2 -->
    <line x1="416" y1="248" x2="544" y2="248" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="444" y="226" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="235" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE SPACE</text>

    <!-- row 3 -->
    <line x1="416" y1="328" x2="544" y2="328" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="444" y="306" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="315" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FULL COMPAT</text>

    <!-- row 4 -->
    <line x1="416" y1="408" x2="544" y2="408" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="448" y="386" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="395" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LT STORAGE</text>

    <!-- Prometheus nodes -->
    <g>
      <rect x="64" y="140" width="352" height="56" rx="6" fill="#ffffff"/>
      <rect x="64" y="140" width="352" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="240" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Single Node</text>
    </g>
    <g>
      <rect x="64" y="220" width="352" height="56" rx="6" fill="#ffffff"/>
      <rect x="64" y="220" width="352" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="240" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Medium Compression</text>
    </g>
    <g>
      <rect x="64" y="300" width="352" height="56" rx="6" fill="#ffffff"/>
      <rect x="64" y="300" width="352" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="240" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PromQL</text>
    </g>
    <g>
      <rect x="64" y="380" width="352" height="56" rx="6" fill="#ffffff"/>
      <rect x="64" y="380" width="352" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="240" y="412" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">15–30 Day Retention</text>
    </g>

    <!-- VictoriaMetrics nodes -->
    <g>
      <rect x="544" y="140" width="352" height="56" rx="6" fill="#ffffff"/>
      <rect x="544" y="140" width="352" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="720" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Single / Cluster</text>
    </g>
    <g>
      <rect x="544" y="220" width="352" height="56" rx="6" fill="#ffffff"/>
      <rect x="544" y="220" width="352" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="720" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">7x Compression</text>
    </g>
    <g>
      <rect x="544" y="300" width="352" height="56" rx="6" fill="rgba(255,153,0,0.10)"/>
      <rect x="544" y="300" width="352" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="720" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">MetricsQL</text>
      <text x="720" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">promql-compatible</text>
    </g>
    <g>
      <rect x="544" y="380" width="352" height="56" rx="6" fill="#ffffff"/>
      <rect x="544" y="380" width="352" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="720" y="412" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Unlimited Retention</text>
    </g>

    <!-- legend -->
    <line x1="40" y1="484" x2="920" y2="484" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="500" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="160" y1="496" x2="196" y2="496" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="204" y="500" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">MIGRATION BENEFIT</text>
  </svg>