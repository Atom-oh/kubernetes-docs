<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rl-bucket-title rl-bucket-desc">
      <title id="rl-bucket-title">Token bucket algorithm</title>
      <desc id="rl-bucket-desc">Flowchart showing a token bucket refilled at a steady rate, checked on each incoming request, and either allowing the request while consuming a token or rejecting it with a 429 when empty.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
        <marker id="arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#DD344C"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Arrows first -->
      <!-- Refill -.-> Bucket (dashed, down-left elbow) -->
      <path d="M 800,120 V 188 Q 800,196 792,196 H 560"
            fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="676" y="168" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="708" y="177" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADD 10/S</text>

      <!-- Request --> Check (down-right elbow) -->
      <path d="M 160,120 V 336 Q 160,344 168,344 H 400"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Bucket --> Check (straight vertical) -->
      <line x1="480" y1="248" x2="480" y2="294" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Check to Allow: Yes (accent, right-down elbow) -->
      <path d="M 560,344 H 657 Q 665,344 665,352 V 444 Q 665,452 673,452 H 770"
            fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="588" y="332" width="30" height="12" rx="2" fill="#ffffff"/>
      <text x="603" y="341" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- Check to Reject: No (left-down elbow) -->
      <path d="M 400,344 H 343 Q 335,344 335,352 V 444 Q 335,452 327,452 H 270"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="352" y="332" width="24" height="12" rx="2" fill="#ffffff"/>
      <text x="364" y="341" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- Allow -.-> Bucket (feedback, dashed, right corridor) -->
      <path d="M 860,468 H 900 Q 908,468 908,460 V 220 Q 908,212 900,212 H 560"
            fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="864" y="330" width="70" height="12" rx="2" fill="#ffffff"/>
      <text x="899" y="339" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">-1 TOKEN</text>

      <!-- Node: Request Arrives -->
      <rect x="80" y="64" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="80" y="64" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="160" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Request Arrives</text>
      <text x="160" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">incoming HTTP</text>

      <!-- Node: Refill -->
      <rect x="720" y="64" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="720" y="64" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="800" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Refill</text>
      <text x="800" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10 tokens/sec</text>

      <!-- Node: Bucket (focal) -->
      <rect x="400" y="176" width="160" height="72" rx="6" fill="#ffffff"/>
      <rect x="400" y="176" width="160" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <rect x="408" y="184" width="52" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
      <text x="434" y="193" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="480" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Token Bucket</text>
      <text x="480" y="236" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">max 100 tokens</text>

      <!-- Node: Check (diamond) -->
      <polygon points="480,294 560,344 480,394 400,344" fill="#ffffff"/>
      <polygon points="480,294 560,344 480,394 400,344" fill="rgba(35,47,62,0.05)" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Token</text>
      <text x="480" y="356" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">available?</text>

      <!-- Node: Allow -->
      <rect x="770" y="452" width="160" height="64" rx="6" fill="#ffffff"/>
      <rect x="770" y="452" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="850" y="480" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Allow Request</text>
      <text x="850" y="496" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consume 1 token</text>

      <!-- Node: Reject -->
      <rect x="110" y="452" width="160" height="64" rx="6" fill="#ffffff"/>
      <rect x="110" y="452" width="160" height="64" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="190" y="480" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Reject Request</text>
      <text x="190" y="496" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">return 429</text>

      <!-- Legend strip -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="568" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="60" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Bucket state (focal)</text>

      <rect x="240" y="568" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#232F3E" stroke-width="1"/>
      <text x="260" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Decision</text>

      <rect x="356" y="568" width="14" height="10" rx="2" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="376" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Rejected</text>

      <line x1="480" y1="573" x2="508" y2="573" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="516" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Bucket update</text>

      <line x1="640" y1="573" x2="668" y2="573" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="676" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Happy path</text>
    </svg>