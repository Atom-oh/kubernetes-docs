<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
    <title id="dtitle">Configuration Management at a Glance</title>
    <desc id="ddesc">Diagram showing that Cluster Administrators, GitOps pipelines, and external systems all provision ConfigMaps and Secrets, which Pods then consume as environment variables, volume mounts, and image-pull credentials, with Secret additionally feeding sidecar auto-reload, KSOPS encryption, and Vault dynamic injection.</desc>
