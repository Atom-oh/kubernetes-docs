<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zone-pdb-before-after-title zone-pdb-before-after-desc">
<title id="zone-pdb-before-after-title">Zone 전체 중단 전후 PodDisruptionBudget 비교</title>
<desc id="zone-pdb-before-after-desc">3개 가용 영역에 Pod가 고르게 분산된 정상 상태와, Zone C의 Spot Instance가 모두 중단되어 PodDisruptionBudget이 무너지는 상태를 비교하는 다이어그램입니다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ============ ARROWS (drawn first) ============ -->
