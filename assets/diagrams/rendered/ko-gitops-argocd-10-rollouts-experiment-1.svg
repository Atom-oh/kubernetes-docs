<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
    <title id="t1">AnalysisRun 상태에 따른 Experiment 결과 분기</title>
    <desc id="d1">AnalysisRun 상태가 Successful이면 Experiment가 성공해 Rollout이 다음 step으로 진행하고, Failed·Inconclusive·Error면 Experiment가 실패해 Rollout이 Degraded 상태로 중단된다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#DD344C"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Arrows (behind nodes) ===== -->

    <!-- Diamond right vertex (600,180) -> up to y=132 -> right to OK box left edge (720,132) : Successful -->
    <path d="M600,180 V148 A8,8 0 0 1 608,140 H712 A8,8 0 0 1 720,140 V132" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="628" y="112" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="672" y="121" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Successful</text>

    <!-- Diamond bottom vertex (480,240) -> down -> NG box top (480,300) : Failed/Inconclusive/Error (accent-danger) -->
    <line x1="480" y1="240" x2="480" y2="300" stroke="#DD344C" stroke-width="1.2" marker-end="url(#arrow-danger)"/>
    <rect x="392" y="256" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="265" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">Failed / Inconclusive / Error</text>

    <!-- ===== Nodes ===== -->

    <!-- AnalysisRun 상태 (diamond decision) -->
    <polygon points="480,132 600,180 480,228 360,180" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="176" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AnalysisRun</text>
    <text x="480" y="190" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">상태</text>

    <!-- Experiment Successful (end, oval) -->
    <rect x="720" y="88" width="200" height="88" rx="44" fill="rgba(255,153,0,0.10)"/>
    <rect x="720" y="88" width="200" height="88" rx="44" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="820" y="126" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Experiment Successful</text>
    <text x="820" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rollout 다음 step 진행</text>

    <!-- Experiment Failed (end, oval, danger) -->
    <rect x="380" y="300" width="200" height="88" rx="44" fill="rgba(221,52,76,0.05)"/>
    <rect x="380" y="300" width="200" height="88" rx="44" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1.2"/>
    <text x="480" y="338" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Experiment Failed</text>
    <text x="480" y="356" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rollout abort (Degraded)</text>

    <!-- ===== Legend ===== -->
    <line x1="30" y1="416" x2="930" y2="416" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="432" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="120" y="422" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="152" y="432" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">정상 종료</text>

    <rect x="280" y="422" width="24" height="12" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1.2"/>
    <text x="312" y="432" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">실패 종료 (Rollout 중단)</text>
  </svg>