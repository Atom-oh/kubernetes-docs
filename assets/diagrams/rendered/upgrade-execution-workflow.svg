<line x1="480" y1="210" x2="480" y2="236" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="280" x2="480" y2="306" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="350" x2="480" y2="368" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="448" x2="480" y2="466" stroke="#1D8102" stroke-width="1.2" marker-end="url(#arrow-green)"/>
<rect x="486" y="450" width="30" height="14" rx="2" fill="#ffffff"/>
<text x="501" y="461" fill="#1D8102" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<line x1="590" y1="408" x2="670" y2="408" stroke="#B0031A" stroke-width="1.2" marker-end="url(#arrow-red)"/>
<rect x="612" y="396" width="30" height="14" rx="2" fill="#ffffff"/>
<text x="627" y="407" fill="#B0031A" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<line x1="480" y1="510" x2="480" y2="536" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 590 178 L 646 178 Q 654 178 654 170 L 654 158 Q 654 150 646 150 L 608 150 Q 600 150 600 158 L 600 166" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
<rect x="600" y="132" width="72" height="14" rx="2" fill="#ffffff"/>
<text x="636" y="143" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">RETRY ON FAIL</text>
<path d="M 590 478 L 646 478 Q 654 478 654 470 L 654 458 Q 654 450 646 450 L 608 450 Q 600 450 600 458 L 600 466" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
<rect x="600" y="432" width="72" height="14" rx="2" fill="#ffffff"/>
<text x="636" y="443" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">FIX &amp; RETRY</text>
<rect x="380" y="26" width="200" height="44" rx="22" fill="#ffffff"/>
<rect x="380" y="26" width="200" height="44" rx="22" fill="rgba(35,47,62,0.03)" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="53" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Begin Upgrade Process</text>
<rect x="370" y="96" width="220" height="44" rx="6" fill="#ffffff"/>
