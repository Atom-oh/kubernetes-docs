<text x="480" y="128" fill="#545B64" font-size="9" font-weight="400" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Changelog, add-ons, third-party</text>
<rect x="370" y="166" width="220" height="44" rx="6" fill="#ffffff"/>
<rect x="370" y="166" width="220" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1.2"/>
<text x="480" y="184" fill="#232F3E" font-size="11" font-weight="700" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Staging Test</text>
<text x="480" y="198" fill="#545B64" font-size="9" font-weight="400" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Full upgrade rehearsal</text>
<rect x="370" y="236" width="220" height="44" rx="6" fill="#ffffff"/>
<rect x="370" y="236" width="220" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1.2"/>
<text x="480" y="254" fill="#232F3E" font-size="11" font-weight="700" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Preparation</text>
<text x="480" y="268" fill="#545B64" font-size="9" font-weight="400" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Window, rollback, IaC</text>
<rect x="360" y="306" width="240" height="44" rx="6" fill="#ffffff"/>
<rect x="360" y="306" width="240" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1.2"/>
<text x="480" y="324" fill="#232F3E" font-size="11" font-weight="700" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Execution</text>
<text x="480" y="338" fill="#545B64" font-size="9" font-weight="400" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Control plane → add-ons → nodes</text>
<polygon points="480,368 590,408 480,448 370,408" fill="#ffffff"/>
<polygon points="480,368 590,408 480,448 370,408" fill="rgba(35,47,62,0.03)" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="405" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">API Server</text>
<text x="480" y="419" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Healthy?</text>
<rect x="670" y="386" width="180" height="44" rx="6" fill="#ffffff"/>
<rect x="670" y="386" width="180" height="44" rx="6" fill="rgba(176,3,26,0.06)" stroke="#B0031A" stroke-width="1.2"/>
<text x="760" y="411" fill="#B0031A" font-size="11" font-weight="700" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Contact AWS Support</text>
<rect x="370" y="466" width="220" height="44" rx="6" fill="#ffffff"/>
<rect x="370" y="466" width="220" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1.2"/>
<text x="480" y="484" fill="#232F3E" font-size="11" font-weight="700" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Validation</text>
<text x="480" y="498" fill="#545B64" font-size="9" font-weight="400" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Workloads, network, storage</text>
<rect x="380" y="536" width="200" height="44" rx="22" fill="rgba(29,129,2,0.06)"/>
<rect x="380" y="536" width="200" height="44" rx="22" fill="rgba(29,129,2,0.06)" stroke="#1D8102" stroke-width="1.2"/>
<text x="480" y="563" fill="#1D8102" font-size="11" font-weight="700" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Upgrade Complete</text>
</svg>