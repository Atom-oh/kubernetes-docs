<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="mesh-cni-title mesh-cni-desc">
    <title id="mesh-cni-title">Service Mesh와 CNI 기능 비교</title>
    <desc id="mesh-cni-desc">L7 프록시 기반의 Istio 서비스 메시와 eBPF 커널 레벨의 Cilium CNI 각각의 특징을 나열하고, 두 접근을 언제 쓰는지 사용 시나리오로 정리한 비교표.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Service Mesh (Istio) -->
    <rect x="40" y="80" width="280" height="360" rx="8" fill="rgba(50,108,229,0.04)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="88" width="200" height="14" fill="#ffffff"/>
    <text x="60" y="99" fill="rgba(35,47,62,0.55)" font-size="8" font-family="var(--font-mono)" letter-spacing="0.1em">SERVICE MESH (ISTIO)</text>

    <rect x="64" y="128" width="232" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="154" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">L7 프록시 기반</text>
    <text x="180" y="170" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">Envoy Sidecar</text>

    <rect x="64" y="212" width="232" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="238" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">애플리케이션 레벨</text>
    <text x="180" y="254" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">트래픽 제어</text>

    <rect x="64" y="296" width="232" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">풍부한 L7 기능</text>
    <text x="180" y="338" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">Retry · Timeout</text>

    <!-- Zone: CNI (Cilium) -->
    <rect x="340" y="80" width="280" height="360" rx="8" fill="rgba(248,181,42,0.05)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="356" y="88" width="160" height="14" fill="#ffffff"/>
    <text x="360" y="99" fill="rgba(35,47,62,0.55)" font-size="8" font-family="var(--font-mono)" letter-spacing="0.1em">CNI (CILIUM)</text>

    <rect x="364" y="128" width="232" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="154" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">eBPF 기반</text>
    <text x="480" y="170" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">커널 레벨</text>

    <rect x="364" y="212" width="232" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="238" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">네트워크 레벨</text>
    <text x="480" y="254" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">정책 적용</text>

    <rect x="364" y="296" width="232" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">높은 성능</text>
    <text x="480" y="338" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">낮은 오버헤드</text>

    <!-- Zone: Use cases -->
    <rect x="640" y="80" width="280" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="656" y="88" width="160" height="14" fill="#ffffff"/>
    <text x="660" y="99" fill="rgba(35,47,62,0.55)" font-size="8" font-family="var(--font-mono)" letter-spacing="0.1em">사용 시나리오</text>

    <rect x="664" y="128" width="232" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="154" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">Service Mesh</text>
    <text x="780" y="170" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">complex L7 logic</text>

    <rect x="664" y="212" width="232" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="238" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">Cilium</text>
    <text x="780" y="254" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">policy · performance</text>

    <rect x="664" y="296" width="232" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="780" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">둘 다 사용</text>
    <text x="780" y="338" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">대규모 엔터프라이즈</text>

    <!-- Legend -->
    <line x1="40" y1="480" x2="920" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="496" fill="#545B64" font-size="8" font-family="var(--font-mono)" letter-spacing="0.14em">LEGEND</text>
    <rect x="140" y="486" width="24" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="172" y="496" fill="#545B64" font-size="8.5" font-family="var(--font-cjk)">대규모 환경의 병행 채택 시나리오</text>
  </svg>