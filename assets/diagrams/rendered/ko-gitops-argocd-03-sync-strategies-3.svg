<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sync-waves-title sync-waves-desc">
      <title id="sync-waves-title">sync-wave 값에 따라 순서대로 적용되는 리소스</title>
      <desc id="sync-waves-desc">ArgoCD가 sync-wave 어노테이션 값이 작은 그룹부터 순서대로 리소스를 적용하며, Namespace와 ServiceAccount가 가장 먼저, Ingress와 HPA가 가장 나중에 생성되는 순서를 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Arrows between wave containers -->
      <line x1="240" y1="228" x2="272" y2="228" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="472" y1="228" x2="504" y2="228" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="704" y1="228" x2="736" y2="228" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Wave -1 container -->
      <rect x="32" y="112" width="208" height="232" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
      <rect x="32" y="112" width="72" height="20" rx="4" fill="#232F3E"/>
      <text x="68" y="126" fill="#ffffff" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAVE -1</text>
      <rect x="52" y="152" width="168" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="136" y="178" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Namespace</text>
      <rect x="52" y="212" width="168" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="136" y="238" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">ServiceAccount</text>

      <!-- Wave 0 container -->
      <rect x="264" y="112" width="208" height="232" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
      <rect x="264" y="112" width="64" height="20" rx="4" fill="#232F3E"/>
      <text x="296" y="126" fill="#ffffff" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAVE 0</text>
      <rect x="284" y="152" width="168" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="368" y="178" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">ConfigMap</text>
      <rect x="284" y="212" width="168" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="368" y="238" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Secret</text>

      <!-- Wave 1 container (focal) -->
      <rect x="496" y="112" width="208" height="232" rx="8" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1"/>
      <rect x="496" y="112" width="64" height="20" rx="4" fill="#EC7211"/>
      <text x="528" y="126" fill="#ffffff" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAVE 1</text>
      <rect x="516" y="152" width="168" height="44" rx="6" fill="#ffffff" stroke="#EC7211" stroke-width="1"/>
      <text x="600" y="178" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Deployment</text>
      <rect x="516" y="212" width="168" height="44" rx="6" fill="#ffffff" stroke="#EC7211" stroke-width="1"/>
      <text x="600" y="238" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service</text>

      <!-- Wave 2 container -->
      <rect x="728" y="112" width="208" height="232" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
      <rect x="728" y="112" width="64" height="20" rx="4" fill="#232F3E"/>
      <text x="760" y="126" fill="#ffffff" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAVE 2</text>
      <rect x="748" y="152" width="168" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="832" y="178" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Ingress</text>
      <rect x="748" y="212" width="168" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="832" y="238" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">HPA</text>

      <!-- Legend -->
      <line x1="32" y1="380" x2="936" y2="380" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="32" y="396" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="32" y="412" width="24" height="12" rx="6" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1"/>
      <text x="64" y="422" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">워크로드 실행 웨이브 (wave 1)</text>

      <line x1="380" y1="418" x2="408" y2="418" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="416" y="422" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">웨이브 번호 오름차순으로 순차 적용</text>
    </svg>