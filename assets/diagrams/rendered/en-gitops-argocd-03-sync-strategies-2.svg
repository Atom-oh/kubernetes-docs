<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
<title id="t2">Sync wave ordering</title>
<desc id="d2">Layer-stack diagram showing Argo CD sync waves applying resources in order from wave -2 through wave 1: CRDs first, then namespaces and service accounts, then the default wave of config maps, secrets, and deployments, then services and ingress last.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<text x="140" y="72" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Apply order: lowest sync-wave first</text>

<!-- Direction indicator -->
<line x1="60" y1="108" x2="60" y2="376" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<text x="60" y="96" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">SYNC</text>

<!-- Layer stack: x=140..900, y=100..388, 4 rows of 72 -->
<!-- Outer silhouette -->
<rect x="140" y="100" width="760" height="288" fill="none" stroke="#232F3E" stroke-width="1"/>

<!-- Row 1: Wave -2 -->
<rect x="140" y="100" width="760" height="72" fill="#ffffff"/>
<line x1="140" y1="172" x2="900" y2="172" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
<text x="164" y="132" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">WAVE -2</text>
<text x="360" y="140" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">CRDs</text>
<text x="876" y="140" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">1 kind</text>

<!-- Row 2: Wave -1 -->
<rect x="140" y="172" width="760" height="72" fill="rgba(35,47,62,0.018)"/>
<line x1="140" y1="244" x2="900" y2="244" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
<text x="164" y="204" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">WAVE -1</text>
<text x="360" y="212" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Namespaces, ServiceAccounts</text>
<text x="876" y="212" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">2 kinds</text>

<!-- Row 3: Wave 0 (focal) -->
<rect x="140" y="244" width="760" height="72" fill="rgba(255,153,0,0.08)"/>
<line x1="140" y1="316" x2="900" y2="316" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
<rect x="141" y="245" width="758" height="70" fill="none" stroke="#EC7211" stroke-width="1.2"/>
<text x="164" y="276" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">WAVE 0</text>
<text x="360" y="280" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">ConfigMaps, Secrets,</text>
<text x="360" y="296" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Deployments</text>
<text x="876" y="280" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">default</text>
<text x="876" y="292" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">3 kinds</text>

<!-- Row 4: Wave 1 -->
<rect x="140" y="316" width="760" height="72" fill="#ffffff"/>
<text x="164" y="348" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">WAVE 1</text>
<text x="360" y="356" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Services, Ingress</text>
<text x="876" y="356" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">2 kinds</text>

<!-- Legend -->
<line x1="140" y1="440" x2="900" y2="440" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="140" y="460" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="140" y="472" width="14" height="14" rx="3" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="1.2"/>
<text x="162" y="483" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">DEFAULT SYNC WAVE (FOCAL)</text>
<text x="140" y="512" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">Argo CD applies each wave in ascending order and waits for the previous wave's resources to become healthy before continuing.</text>
</svg>