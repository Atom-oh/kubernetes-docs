  <rect x="504" y="152" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="540" y="161" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACCESS LOG</text>

