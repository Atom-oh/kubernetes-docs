<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 660" role="img" aria-labelledby="ko-svc-logging-0-title ko-svc-logging-0-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="ko-svc-logging-0-title">Istio 로깅 아키텍처</title>
  <desc id="ko-svc-logging-0-desc">애플리케이션 파드의 Envoy 프록시가 생성한 액세스 로그를 세 가지 수집기가 각기 다른 저장소로 전달하고, Grafana가 이를 조회하는 흐름과 istiod가 Envoy를 설정하는 제어 경로를 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== Zones (bg -> zones -> arrows -> nodes) ===== -->
  <rect x="64" y="24" width="392" height="108" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="76" y="28" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="146" y="37" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APPLICATION POD</text>

  <rect x="24" y="196" width="752" height="108" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="36" y="200" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="106" y="209" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOG COLLECTION</text>

  <rect x="144" y="368" width="632" height="108" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="156" y="372" width="160" height="12" rx="2" fill="#ffffff"/>
  <text x="236" y="381" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOG STORAGE &amp; QUERY</text>

  <text x="832" y="40" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ISTIO CONTROL PLANE</text>
  <text x="460" y="524" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VISUALIZATION</text>

  <!-- ===== Arrows (drawn before nodes) ===== -->

  <!-- App -> Envoy (straight horizontal) -->
  <path d="M 240,86 H 280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Istiod -> Envoy (Configure, dashed control path) -->
  <path d="M 752,86 H 440" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="562" y="66" width="68" height="12" rx="2" fill="#ffffff"/>
  <text x="596" y="75" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIGURE</text>

