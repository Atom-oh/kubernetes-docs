  <rect x="288" y="234" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="308" y="243" fill="rgba(35,47,62,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
  <text x="360" y="262" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OTel Collector</text>
  <text x="360" y="276" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DaemonSet</text>

