  <text x="240" y="434" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana Loki</text>
  <text x="240" y="448" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LogQL</text>

  <!-- Elasticsearch -->
  <rect x="600" y="400" width="160" height="60" rx="6" fill="#ffffff"/>
  <rect x="600" y="400" width="160" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="608" y="406" width="36" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
