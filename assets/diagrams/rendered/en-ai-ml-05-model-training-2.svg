<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slurm-eks-title slurm-eks-desc">
    <title id="slurm-eks-title">Slurm scheduler running inside an Amazon EKS cluster</title>
    <desc id="slurm-eks-desc">ArgoCD, ECR, and a network load balancer feed an EKS cluster where the Slurm control plane dispatches GPU pods, user access pods reach the controller and REST API, Karpenter scales a GPU node pool, and all compute pods share FSx for Lustre storage.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- outer EKS cluster boundary -->
    <rect x="192" y="72" width="716" height="308" rx="8" fill="rgba(35,47,62,0.015)" stroke="rgba(35,47,62,0.30)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <rect x="208" y="76" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="272" y="85" fill="rgba(35,47,62,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AMAZON EKS CLUSTER</text>

    <!-- inner zones -->
    <rect x="200" y="96" width="300" height="148" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="216" y="100" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="286" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SLURM CONTROL PLANE</text>

    <rect x="540" y="96" width="340" height="148" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8"/>
    <rect x="556" y="100" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="616" y="109" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">COMPUTE NODES</text>

    <rect x="200" y="272" width="300" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="216" y="276" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="272" y="285" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">USER ACCESS</text>

    <rect x="540" y="272" width="340" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="556" y="276" width="200" height="12" rx="2" fill="#ffffff"/>
    <text x="656" y="285" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STORAGE + AUTOSCALING</text>

    <!-- ===== arrows (before nodes) ===== -->
    <!-- ArgoCD -> Slurmctld -->
    <path d="M 160,124 H 272 Q 280,124 280,132 V 136" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <!-- ECR -> ComputeNodes -->
    <path d="M 160,188 H 560 Q 568,188 568,180 V 172 H 580" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <!-- NLB -> LoginPod -->
    <path d="M 160,296 H 180 Q 188,296 188,304 V 312 Q 188,320 196,320 H 216" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>

    <!-- Slurmctld -> Slurmdbd -->
    <path d="M 320,160 V 172 Q 320,180 312,180 H 284 V 188" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Slurmctld -> SlurmREST -->
    <path d="M 380,160 V 176 Q 380,184 388,184 H 400 V 188" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Slurmctld -> ComputeNodes (accent, primary dispatch path) -->
    <path d="M 420,136 H 492 Q 500,136 500,144 V 164 Q 500,172 508,172 H 580" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- LoginPod -> Slurmctld -->
    <path d="M 280,296 V 250 Q 280,242 288,242 H 342 Q 350,242 350,234 V 160" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- JupyterHub -> SlurmREST -->
    <line x1="424" y1="296" x2="424" y2="236" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ComputeNodes -> FSxLustre -->
    <path d="M 710,204 V 246 Q 710,254 702,254 H 614 Q 606,254 606,262 V 296" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Karpenter -> NodePool -->
    <line x1="760" y1="320" x2="776" y2="320" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- NodePool -> ComputeNodes -->
    <path d="M 820,296 V 250 Q 820,242 812,242 H 804 V 204" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== nodes ===== -->
    <!-- External services -->
    <rect x="20" y="100" width="140" height="48" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="90" y="121" fill="#232F3E" font-size="11" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">ArgoCD</text>
    <text x="90" y="136" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GitOps deploy</text>

    <rect x="20" y="164" width="140" height="48" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="90" y="185" fill="#232F3E" font-size="11" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Amazon ECR</text>
    <text x="90" y="200" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AWS DLC images</text>

    <rect x="20" y="272" width="140" height="48" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="90" y="293" fill="#232F3E" font-size="11" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Network LB</text>
    <text x="90" y="308" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SSH ingress</text>

    <!-- Control plane -->
    <rect x="280" y="112" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="350" y="133" fill="#232F3E" font-size="11" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">slurmctld</text>
    <text x="350" y="148" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">controller daemon</text>

    <rect x="216" y="188" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="276" y="209" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">slurmdbd</text>
    <text x="276" y="223" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">db daemon</text>

    <rect x="364" y="188" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="424" y="209" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">slurmrestd</text>
    <text x="424" y="223" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">REST API</text>

    <!-- Compute (focal, collapsed pool) -->
    <rect x="580" y="140" width="260" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="710" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">slurmd Pods (x4)</text>
    <text x="710" y="182" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">8x A100 GPU each</text>

    <!-- Access -->
    <rect x="216" y="296" width="128" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="280" y="317" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Login Pod</text>
    <text x="280" y="332" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SSH via NLB</text>

    <rect x="360" y="296" width="128" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="424" y="325" fill="#232F3E" font-size="11" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">JupyterHub</text>

    <!-- Storage + scaling -->
    <rect x="556" y="296" width="100" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="606" y="317" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">FSx for</text>
    <text x="606" y="330" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Lustre</text>

    <rect x="672" y="296" width="88" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="716" y="325" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Karpenter</text>

    <rect x="776" y="296" width="88" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="820" y="317" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">GPU</text>
    <text x="820" y="330" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">NodePool</text>

    <!-- legend -->
    <line x1="30" y1="404" x2="930" y2="404" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="420" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="130" y="411" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="150" y="420" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">GPU compute (focal)</text>
    <rect x="330" y="411" width="14" height="10" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="350" y="420" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">External AWS service</text>
    <rect x="530" y="411" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="550" y="420" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">User access</text>
    <line x1="700" y1="416" x2="722" y2="416" stroke="#0972D3" stroke-width="1.2"/>
    <text x="730" y="420" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">External call</text>
  </svg>