<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-observability-alerting-03-grafana-oncall-5-title en-observability-alerting-03-grafana-oncall-5-desc">
<title id="en-observability-alerting-03-grafana-oncall-5-title">Grafana OnCall Slack Workflow</title>
<desc id="en-observability-alerting-03-grafana-oncall-5-desc">Sequence diagram of a Slack-based ChatOps workflow: an alert posts to a channel with action buttons, and a user's Acknowledge or Resolve click round-trips through Slack to update OnCall's alert status, with a resolve also notifying the alert source.</desc>
