<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ekslattice-title ekslattice-desc">
<title id="ekslattice-title">EKS와 VPC Lattice 통합</title>
<desc id="ekslattice-desc">EKS 클러스터의 Gateway API Controller가 Gateway API 리소스를 VPC Lattice 서비스와 대상 그룹으로 변환하여 Kubernetes 파드를 등록하고, 다른 VPC의 클라이언트가 서비스 네트워크를 통해 그 파드에 도달하는 구조를 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="40" y="44" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ARCHITECTURE</text>
<text x="40" y="68" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">EKS와 VPC Lattice 통합</text>

<!-- ===== Zones ===== -->
<rect x="24" y="140" width="392" height="304" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="172" y="144" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="220" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">EKS 클러스터</text>

<rect x="24" y="468" width="200" height="72" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="52" y="472" width="144" height="12" rx="2" fill="#ffffff"/>
<text x="124" y="481" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">다른 VPC의 클라이언트</text>

<!-- ===== Arrows (before nodes) — all paths first, then all labels, so a
     later-drawn connector can never paint over an earlier label mask ===== -->
<!-- A -> B : straight -->
<path d="M220,212 V244" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- B -> C : straight -->
<path d="M220,284 V316" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- C -> D : straight -->
<path d="M220,356 V388" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- A -> E : off-axis elbow, A right edge -> E left edge (upper attach point) -->
<path d="M340,192 H480 Q488,192 488,200 V240 Q488,248 496,248 H636" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- E -> F : straight -->
<path d="M724,284 V316" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- F -> D : off-axis elbow, F left edge -> D right edge; hops over the H->E
     accent connector's vertical run at x=416 (bridge/hop primitive, §6 rule 3) -->
<path d="M636,336 H496 Q488,336 488,344 V400 Q488,408 480,408 H424 a 8,8 0 0,0 -16,0 H340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- G -> E : straight -->
<path d="M724,188 V228" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- H -> E : off-axis elbow, H right edge -> E left edge (lower attach point), headline -->
<path d="M196,504 H408 Q416,504 416,496 V272 Q416,264 424,264 H636" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- Arrow labels (drawn after every path, so no connector can cross a label) -->
<rect x="232" y="222" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="250" y="231" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">변환</text>
<rect x="232" y="294" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="250" y="303" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">참조</text>
<rect x="232" y="366" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="250" y="375" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">선택</text>
<rect x="372" y="172" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="410" y="181" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">생성 / 관리</text>
<rect x="738" y="294" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="756" y="303" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">라우팅</text>
<rect x="442" y="388" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="460" y="397" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">등록</text>
<rect x="738" y="200" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="756" y="209" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">포함</text>
<rect x="284" y="484" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="302" y="493" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">요청</text>

<!-- ===== Nodes ===== -->
<rect x="100" y="172" width="240" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="220" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway API Controller</text>

<rect x="100" y="244" width="240" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="220" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway API 리소스</text>

<rect x="100" y="316" width="240" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="220" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes 서비스</text>

<rect x="100" y="388" width="240" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="220" y="412" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes 파드</text>

<rect x="656" y="156" width="136" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="724" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">서비스 네트워크</text>

<rect x="636" y="228" width="176" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="724" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC Lattice</text>
<text x="724" y="267" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">서비스</text>

<rect x="636" y="316" width="176" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="724" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC Lattice 대상 그룹</text>

<rect x="44" y="488" width="152" height="32" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="120" y="508" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">애플리케이션</text>

<!-- Legend -->
<line x1="40" y1="560" x2="920" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="140" y="572" width="14" height="14" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="160" y="582" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Kubernetes 리소스</text>
<rect x="320" y="572" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="340" y="582" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">VPC Lattice 서비스</text>
<rect x="500" y="572" width="14" height="14" rx="3" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="520" y="582" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">런타임 대상(파드)</text>
<rect x="680" y="572" width="14" height="14" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="700" y="582" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">클러스터 / VPC 경계</text>
</svg>