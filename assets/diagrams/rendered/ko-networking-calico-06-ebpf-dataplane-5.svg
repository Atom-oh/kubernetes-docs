<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ebpf5-title ebpf5-desc">
    <title id="ebpf5-title">Calico eBPF 프로그램 구조</title>
    <desc id="ebpf5-desc">TC Programs, XDP 프로그램, Socket Programs 세 그룹의 eBPF 프로그램이 각각 Policy Map, NAT Backend Map, NAT Frontend Map, Conntrack Map을 조회하며, NAT Frontend Map은 TC Programs와 Socket Programs 양쪽에서 함께 참조되는 중심 데이터임을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="140" y="148" width="700" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="160" y="152" width="184" height="12" rx="2" fill="#ffffff"/>
    <text x="252" y="161" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">CALICO EBPF PROGRAMS</text>

    <rect x="120" y="304" width="640" height="116" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="140" y="308" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="180" y="317" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">BPF MAPS</text>

    <!-- Arrows: TC Programs fan (3), XDP-CT, Socket-NAT (bidir, all) -->
    <path d="M 230,244 V 276 Q 230,284 222,284 H 208 Q 200,284 200,292 V 336"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <path d="M 300,244 V 276 Q 300,284 308,284 H 352 Q 360,284 360,292 V 336"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <path d="M 370,244 V 276 Q 370,284 378,284 H 492 Q 500,284 500,292 V 336"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <path d="M 740,244 V 276 Q 740,284 732,284 H 688 Q 680,284 680,292 V 336"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <line x1="540" y1="244" x2="540" y2="336" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>

    <!-- Node: TC Programs (collapsed group) -->
    <rect x="160" y="180" width="280" height="64" rx="6" fill="#ffffff"/>
    <rect x="160" y="180" width="280" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="300" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">TC Programs</text>
    <text x="300" y="224" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">from_host·to_host·from/to_workload</text>

    <!-- Node: Socket Programs (collapsed group) -->
    <rect x="460" y="180" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="460" y="180" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="540" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">Socket Programs</text>
    <text x="540" y="224" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">connect4/6·sendmsg4/6</text>

    <!-- Node: XDP 프로그램 -->
    <rect x="660" y="180" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="660" y="180" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="740" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">XDP 프로그램</text>
    <text x="740" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">조기 패킷 처리</text>

    <!-- Node: Policy Map (cylinder) -->
    <ellipse cx="200" cy="346" rx="60" ry="10" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <path d="M 140,346 V 394 A 60,10 0 0 0 260,394 V 346" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <ellipse cx="200" cy="394" rx="60" ry="10" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="200" y="374" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">Policy Map</text>

    <!-- Node: NAT Backend Map (cylinder) -->
    <ellipse cx="360" cy="346" rx="60" ry="10" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <path d="M 300,346 V 394 A 60,10 0 0 0 420,394 V 346" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <ellipse cx="360" cy="394" rx="60" ry="10" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="360" y="369" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">NAT Backend</text>
    <text x="360" y="381" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Map</text>

    <!-- Node: NAT Frontend Map (cylinder, focal) -->
    <ellipse cx="520" cy="346" rx="60" ry="10" fill="#ffffff" stroke="#EC7211" stroke-width="1"/>
    <path d="M 460,346 V 394 A 60,10 0 0 0 580,394 V 346" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <ellipse cx="520" cy="394" rx="60" ry="10" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="520" y="369" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">NAT Frontend</text>
    <text x="520" y="381" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Map</text>

    <!-- Node: Conntrack Map (cylinder) -->
    <ellipse cx="680" cy="346" rx="60" ry="10" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <path d="M 620,346 V 394 A 60,10 0 0 0 740,394 V 346" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <ellipse cx="680" cy="394" rx="60" ry="10" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="680" y="374" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">Conntrack Map</text>

    <!-- Legend -->
    <line x1="40" y1="480" x2="920" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="508" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="516" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif">TC·Socket 프로그램이 함께 참조하는 서비스 VIP 맵</text>
  </svg>