<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="d4-title d4-desc">
    <title id="d4-title">Kagent 아키텍처와 AI 에이전트 런타임 구성</title>
    <desc id="d4-desc">Kagent Controller가 Agent CRD를 거쳐 Agent Runtime을 기동시키고, LLM 백엔드·도구 세트·메모리 스토어·상태 관리라는 AI 에이전트의 네 가지 구성요소가 각각 추론, 실행, 저장/조회, 관리 역할로 Runtime에 연결되는 구조를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="600" y="8" width="200" height="304" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="646" y="12" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="700" y="21" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KAGENT 아키텍처</text>

    <rect x="24" y="72" width="200" height="312" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="76" y="76" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="124" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">AI 에이전트</text>

    <!-- Chain arrows: Controller -> CRD -> Runtime -->
    <line x1="700" y1="88" x2="700" y2="120" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="700" y1="168" x2="700" y2="200" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Agent -> Runtime connectors, fanned on Runtime's left edge, with hops on LLM path -->
    <path d="M 208,128 H 592 Q 600,128 600,136 V 208 Q 600,216 608,216 H 620"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 208,200 H 492 Q 500,200 500,208 V 232 Q 500,240 508,240 H 620"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 208,272 H 612 Q 620,272 620,264"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 208,344 H 532 Q 540,344 540,336 V 296 Q 540,288 548,288 H 620"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="292" y="108" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="312" y="117" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">추론</text>

    <rect x="312" y="180" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="332" y="189" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">실행</text>

    <rect x="352" y="252" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="384" y="261" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">저장/조회</text>

    <rect x="332" y="324" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="352" y="333" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">관리</text>

    <!-- Kagent chain nodes -->
    <rect x="620" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="700" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Kagent Controller</text>
    <text x="700" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">controller</text>

    <rect x="620" y="120" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="700" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Agent CRD</text>

    <rect x="620" y="200" width="160" height="96" rx="6" fill="#ffffff"/>
    <rect x="620" y="200" width="160" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="700" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Agent Runtime</text>

    <!-- Agent components -->
    <rect x="40" y="104" width="168" height="48" rx="6" fill="#ffffff"/>
    <rect x="40" y="104" width="168" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="124" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">LLM 백엔드</text>

    <rect x="40" y="176" width="168" height="48" rx="6" fill="#ffffff"/>
    <rect x="40" y="176" width="168" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="124" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">도구 세트</text>

    <rect x="40" y="248" width="168" height="48" rx="6" fill="#ffffff"/>
    <rect x="40" y="248" width="168" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="124" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">메모리 스토어</text>

    <rect x="40" y="320" width="168" height="48" rx="6" fill="#ffffff"/>
    <rect x="40" y="320" width="168" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="124" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">상태 관리</text>

    <!-- Legend -->
    <line x1="24" y1="428" x2="936" y2="428" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="444" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="24" y="460" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="44" y="468" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">에이전트 런타임(핵심)</text>

    <rect x="220" y="460" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="468" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Kagent 제어 컴포넌트</text>

    <rect x="420" y="460" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="440" y="468" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">AI 에이전트 구성요소</text>
  </svg>
