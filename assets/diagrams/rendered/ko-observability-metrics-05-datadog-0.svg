<line x1="32" y1="572" x2="928" y2="572" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<circle cx="36" cy="586" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="48" y="589" class="tag" letter-spacing="0.06em">SAAS 통합 플랫폼 (강조)</text>
<circle cx="248" cy="586" r="4" fill="#ffffff" stroke="rgba(35,47,62,0.4)" stroke-width="1"/>
