  <rect x="668" y="248" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="680" y="260" width="60" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
