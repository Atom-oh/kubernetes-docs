<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dd-cmp-ttl dd-cmp-desc">
<title id="dd-cmp-ttl">Datadog vs CloudWatch vs 오픈소스 비교</title>
<desc id="dd-cmp-desc">Datadog, CloudWatch, 오픈소스(Prometheus+Grafana) 세 가지 모니터링 방식을 통합 플랫폼 여부, AI 분석, 통합 범위, 과금 방식 네 가지 기준으로 나란히 비교하는 다이어그램.</desc>
<defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
  .name { font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:600; font-size:12px; fill:#232F3E; }
  .item { font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:400; font-size:12px; fill:#232F3E; }
  .eyebrow { font-family:'Geist Mono',monospace; font-size:8px; letter-spacing:0.18em; fill:#7D8998; text-transform:uppercase; }
  .tag { font-family:'Geist Mono',monospace; font-size:7px; letter-spacing:0.10em; fill:#545B64; }
  .title { font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:700; font-size:28px; fill:#232F3E; }
</style>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="32" y="40" class="eyebrow">MONITORING PLATFORM COMPARISON</text>
<text x="32" y="72" class="title">모니터링 방식 비교</text>

<!-- Three zones side by side -->
<!-- Zone geometry: y=112, height=428, 3 columns -->
<!-- Zone 1: Datadog (focal) x=32 w=280 -->
<rect x="32" y="112" width="280" height="440" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<rect x="52" y="132" width="120" height="16" rx="2" fill="#ffffff"/>
<text x="112" y="144" text-anchor="middle" class="eyebrow" fill="#EC7211">DATADOG · SAAS</text>

<!-- Zone 2: CloudWatch x=340 w=280 -->
<rect x="340" y="112" width="280" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<rect x="360" y="132" width="140" height="16" rx="2" fill="#ffffff"/>
<text x="430" y="144" text-anchor="middle" class="eyebrow">CLOUDWATCH · 관리형</text>

<!-- Zone 3: OpenSource x=648 w=280 -->
<rect x="648" y="112" width="280" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<rect x="668" y="132" width="160" height="16" rx="2" fill="#ffffff"/>
<text x="748" y="144" text-anchor="middle" class="eyebrow">오픈소스 · 자체 호스팅</text>

