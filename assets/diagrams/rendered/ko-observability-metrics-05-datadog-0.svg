  <rect x="668" y="324" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="680" y="336" width="72" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
  <text x="716" y="346" text-anchor="middle" class="tag">FLEXIBILITY</text>
