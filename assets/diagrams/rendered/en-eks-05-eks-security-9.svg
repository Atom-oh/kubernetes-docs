    <title id="en-eks-05-eks-security-9-title">Pod security control stack</title>
    <desc id="en-eks-05-eks-security-9-desc">Layer stack diagram showing the three Pod Security Standards levels from Privileged down to Restricted, above the security-context settings and policy-engine admission controls that enforce them.</desc>
