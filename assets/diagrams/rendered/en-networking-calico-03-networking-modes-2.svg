<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="ipip-flow-title ipip-flow-desc">
    <title id="ipip-flow-title">IPIP packet flow from Pod A to Pod B</title>
    <desc id="ipip-flow-desc">A packet from Pod A is routed into the tunl0 interface on Node 1, IPIP-encapsulated, carried across the physical network to Node 2, decapsulated, and delivered to Pod B.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines (5): PodA=100, Node1=320, Network=520, Node2=720, PodB=900 -->
    <line x1="100" y1="112" x2="100" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="320" y1="112" x2="320" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="520" y1="112" x2="520" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="720" y1="112" x2="720" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="900" y1="112" x2="900" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Messages: PodA -> Node1 -->
    <line x1="100" y1="152" x2="320" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="150" y="132" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="210" y="141" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">IP to 192.168.2.10</text>

    <!-- Node1 self-message: route + encapsulate -->
    <path d="M 320,192 h 60 a 8,8 0 0 1 0,16 h -60" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="330" y="176" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="390" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">route via tunl0</text>

    <!-- Note over Node1: outer/inner headers -->
    <rect x="252" y="240" width="136" height="28" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
    <text x="320" y="253" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">outer 10.0.1.10→.11</text>
    <text x="320" y="264" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">inner 192.168.1→2.10</text>

    <!-- Node1 -> Network: send encapsulated (accent, headline) -->
    <line x1="320" y1="300" x2="520" y2="300" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="360" y="280" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="420" y="289" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">IPIP encapsulated</text>

    <!-- Network -> Node2: deliver -->
    <line x1="520" y1="340" x2="720" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="565" y="320" width="110" height="12" rx="2" fill="#ffffff"/>
    <text x="620" y="329" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">deliver to node 2</text>

    <!-- Node2 self-message: decapsulate -->
    <path d="M 720,380 h 60 a 8,8 0 0 1 0,16 h -60" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="730" y="364" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="790" y="373" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">decapsulate IPIP</text>

    <!-- Node2 -> PodB: deliver to destination -->
    <line x1="720" y1="440" x2="900" y2="440" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="760" y="420" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="810" y="429" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">forward packet</text>

    <!-- Activation bars -->
    <rect x="96" y="140" width="8" height="20" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="316" y="152" width="8" height="176" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="516" y="300" width="8" height="48" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="716" y="340" width="8" height="108" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="896" y="440" width="8" height="20" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- Actor boxes at top -->
    <rect x="40" y="76" width="120" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="100" y="97" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A</text>
    <text x="100" y="108" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.10</text>

    <rect x="260" y="76" width="120" height="36" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="320" y="97" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 1</text>
    <text x="320" y="108" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Felix + tunl0</text>

    <rect x="460" y="76" width="120" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="520" y="97" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Network</text>
    <text x="520" y="108" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">physical fabric</text>

    <rect x="660" y="76" width="120" height="36" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="720" y="97" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 2</text>
    <text x="720" y="108" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Felix + tunl0</text>

    <rect x="840" y="76" width="120" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="900" y="97" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B</text>
    <text x="900" y="108" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.2.10</text>

    <!-- Legend -->
    <line x1="40" y1="546" x2="920" y2="546" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="562" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="200" y1="557" x2="240" y2="557" stroke="#545B64" stroke-width="1.2"/>
    <text x="248" y="562" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">call</text>
    <line x1="360" y1="557" x2="400" y2="557" stroke="#EC7211" stroke-width="1.2"/>
    <text x="408" y="562" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">on-wire headline transfer</text>
  </svg>