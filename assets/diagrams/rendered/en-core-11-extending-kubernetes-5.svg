<title id="en-core-11-extending-kubernetes-5-title">How the Container Network Interface works</title>
<desc id="en-core-11-extending-kubernetes-5-desc">Architecture diagram showing kubelet asking the container runtime to create a container, which requests network setup from the CNI plugin, which in turn allocates an IP from the IPAM plugin's pool and applies network configuration to the pod network.</desc>
