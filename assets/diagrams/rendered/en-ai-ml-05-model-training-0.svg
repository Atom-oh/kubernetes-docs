<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="training-pipeline-title training-pipeline-desc">
    <title id="training-pipeline-title">Distributed training pipeline</title>
    <desc id="training-pipeline-desc">Training data flows from an S3 data lake through preprocessing into a scheduler-managed pool of worker pods that synchronize gradients via a parameter server and AllReduce, checkpoint to FSx for Lustre, and hand off to an evaluation job that logs metrics and registers the model.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- zones: bg -> zones -> arrows -> nodes -->
    <rect x="20" y="60" width="180" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="36" y="64" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="92" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA PREP</text>

    <rect x="220" y="60" width="280" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="284" y="64" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="360" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DISTRIBUTED TRAINING</text>

    <rect x="520" y="60" width="160" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="540" y="64" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="600" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CHECKPOINTING</text>

    <rect x="720" y="60" width="220" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="768" y="64" width="124" height="12" rx="2" fill="#ffffff"/>
    <text x="830" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EVALUATION</text>

    <!-- ===== arrows (drawn before nodes) ===== -->
    <!-- S3Data -> DataLoader (vertical, same x) -->
    <line x1="120" y1="164" x2="120" y2="204" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- DataLoader -> Preprocessing (vertical) -->
    <line x1="120" y1="260" x2="120" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Preprocessing(zone1) -> Scheduler(zone2), elbow right+up -->
    <path d="M 180,328 H 224 Q 232,328 232,320 V 132 Q 232,124 240,124 H 284" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Scheduler -> Workers (vertical, same x) -->
    <line x1="360" y1="148" x2="360" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Workers <-> PS (elbow, bidirectional, fanned attach point left of center) -->
    <path d="M 320,236 V 252 Q 320,260 312,260 H 304 Q 296,260 296,268 V 284" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>

    <!-- Workers <-> AllReduce (elbow, bidirectional, fanned attach point right of center) -->
    <path d="M 400,236 V 252 Q 400,260 408,260 H 416 Q 424,260 424,268 V 284" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>

    <!-- Workers(zone2) -> FSxLustre(zone3) horizontal at workers mid y -->
    <line x1="436" y1="208" x2="540" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- FSxLustre -> CheckpointMgr vertical -->
    <line x1="600" y1="244" x2="600" y2="284" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CheckpointMgr(zone3) -> EvalJob(zone4) elbow right+up -->
    <path d="M 660,312 H 692 Q 700,312 700,304 V 180 Q 700,172 708,172 H 740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- EvalJob -> Metrics vertical -->
    <line x1="830" y1="204" x2="830" y2="244" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Metrics -> ModelRegistry vertical -->
    <line x1="830" y1="300" x2="830" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== nodes ===== -->
    <!-- S3Data (store) -->
    <rect x="60" y="100" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="100" width="120" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="120" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">S3 Data Lake</text>
    <text x="120" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">object store</text>

    <!-- DataLoader -->
    <rect x="60" y="204" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="60" y="204" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="120" y="234" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Data Loader</text>
    <text x="120" y="250" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod</text>

    <!-- Preprocessing -->
    <rect x="60" y="300" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="60" y="300" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="120" y="330" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Preprocessing</text>
    <text x="120" y="346" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">job</text>

    <!-- Scheduler -->
    <rect x="284" y="100" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="284" y="100" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="360" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Job Scheduler</text>

    <!-- Workers (focal) -->
    <rect x="284" y="180" width="152" height="56" rx="6" fill="#ffffff"/>
    <rect x="284" y="180" width="152" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="360" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Worker Pods</text>
    <text x="360" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPU replicas</text>

    <!-- PS -->
    <rect x="240" y="284" width="112" height="48" rx="6" fill="#ffffff"/>
    <rect x="240" y="284" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="296" y="308" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Parameter</text>
    <text x="296" y="322" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Server</text>

    <!-- AllReduce -->
    <rect x="368" y="284" width="112" height="48" rx="6" fill="#ffffff"/>
    <rect x="368" y="284" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="424" y="308" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">AllReduce</text>
    <text x="424" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">comm</text>

    <!-- FSxLustre (store) -->
    <rect x="540" y="180" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="540" y="180" width="120" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="600" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">FSx for Lustre</text>
    <text x="600" y="226" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared fs</text>

    <!-- CheckpointMgr -->
    <rect x="540" y="284" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="540" y="284" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="600" y="308" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Checkpoint</text>
    <text x="600" y="322" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Manager</text>

    <!-- EvalJob -->
    <rect x="740" y="140" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="740" y="140" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="830" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Evaluation Job</text>
    <text x="830" y="186" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">holdout metrics</text>

    <!-- Metrics -->
    <rect x="740" y="244" width="180" height="56" rx="6" fill="#ffffff"/>
    <rect x="740" y="244" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="830" y="274" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Metrics Collection</text>

    <!-- ModelRegistry (store) -->
    <rect x="740" y="340" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="740" y="340" width="180" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="830" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Model Registry</text>
    <text x="830" y="386" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">versioned artifacts</text>

    <!-- legend -->
    <line x1="30" y1="512" x2="930" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="130" y="519" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="150" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Data store</text>
    <rect x="260" y="519" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="280" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Compute step</text>
    <rect x="420" y="519" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="440" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Focal / synchronization hub</text>
  </svg>