<title id="ko-eks-05-eks-security-13-title">EKS 암호화 및 비밀 관리 옵션</title>
<desc id="ko-eks-05-eks-security-13-desc">etcd에 저장되는 Kubernetes Secrets가 AWS KMS로 암호화되고, AWS Secrets Manager·Vault·SOPS 같은 비밀 관리 솔루션이 External Secrets Operator 등 통합 도구를 거쳐 파드에 주입되는 흐름을 보여준다.</desc>
