<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="push-pull-title push-pull-desc">
      <title id="push-pull-title">Push model vs. pull model</title>
      <desc id="push-pull-desc">Flowchart contrasting traditional push-based CI/CD, where a pipeline applies changes directly to the cluster, with the GitOps pull model, where an agent watches Git and applies changes itself.</desc>
      <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zone: Push model -->
      <rect x="200" y="140" width="600" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="400" y="144" width="200" height="12" rx="2" fill="#ffffff"/>
      <text x="500" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PUSH MODEL · TRADITIONAL CI/CD</text>

      <!-- Zone: Pull model (focal) -->
      <rect x="200" y="300" width="600" height="120" rx="8" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1"/>
      <rect x="416" y="304" width="168" height="12" rx="2" fill="#ffffff"/>
      <text x="500" y="313" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PULL MODEL · GITOPS</text>

      <!-- Arrows -->
      <!-- CI -> Cluster -->
      <path d="M 380,212 H 620" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="440" y="194" width="120" height="12" rx="2" fill="#ffffff"/>
      <text x="500" y="203" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KUBECTL APPLY</text>

      <!-- Git -> Agent -->
      <path d="M 364,372 H 420" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="376" y="354" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="392" y="363" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WATCH</text>

      <!-- Agent -> Cluster (pull) -->
      <path d="M 564,372 H 636" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="584" y="354" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="600" y="363" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPLY</text>

      <!-- Nodes: Push -->
      <rect x="220" y="180" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="300" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CI Pipeline</text>

      <rect x="620" y="180" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="700" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cluster</text>

      <!-- Nodes: Pull -->
      <rect x="220" y="340" width="144" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="292" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Git Repo</text>

      <rect x="420" y="340" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="492" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">GitOps Agent</text>

      <rect x="636" y="340" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="708" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cluster</text>

      <!-- Legend -->
      <line x1="200" y1="460" x2="800" y2="460" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="200" y="480" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="200" y="492" width="14" height="14" rx="3" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
      <text x="222" y="503" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">CI-DRIVEN, IMPERATIVE</text>

      <rect x="500" y="492" width="14" height="14" rx="3" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1"/>
      <text x="522" y="503" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">AGENT-DRIVEN, DECLARATIVE (FOCAL)</text>
    </svg>