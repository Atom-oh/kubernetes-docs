<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="docker-bridge-title docker-bridge-desc">
      <title id="docker-bridge-title">Docker bridge networking on a single host</title>
      <desc id="docker-bridge-desc">Two containers each reach an external network through a shared docker0 bridge, iptables NAT rules, and the host's physical network interface.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
        <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zone: Host boundary -->
      <rect x="140" y="64" width="680" height="408" rx="8"
            fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="152" y="68" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="178" y="77" fill="rgba(35,47,62,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HOST</text>

      <!-- Arrows (drawn before nodes) -->
      <!-- Container A -> Bridge (veth pair) -->
      <path d="M 280,152 V 164 Q 280,172 288,172 H 432 Q 440,172 440,180 V 192"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="342" y="152" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="368" y="161" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">VETH PAIR</text>

      <!-- Container B -> Bridge (veth pair) -->
      <path d="M 680,152 V 164 Q 680,172 672,172 H 528 Q 520,172 520,180 V 192"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="574" y="152" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="600" y="161" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">VETH PAIR</text>

      <!-- Bridge -> iptables -->
      <line x1="480" y1="248" x2="480" y2="288" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- iptables -> eth0 (host) -->
      <line x1="480" y1="344" x2="480" y2="384" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- eth0 (host) <-> Internet -->
      <line x1="480" y1="440" x2="480" y2="512" stroke="#545B64" stroke-width="1.2"
            marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

      <!-- Node: Container A -->
      <rect x="180" y="96" width="200" height="56" rx="6" fill="#ffffff"/>
      <rect x="180" y="96" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="280" y="120" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">Container A</text>
      <text x="280" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">eth0 · 172.17.0.2</text>

      <!-- Node: Container B -->
      <rect x="580" y="96" width="200" height="56" rx="6" fill="#ffffff"/>
      <rect x="580" y="96" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="680" y="120" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">Container B</text>
      <text x="680" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">eth0 · 172.17.0.3</text>

      <!-- Node: Bridge (docker0) — focal -->
      <rect x="368" y="192" width="224" height="56" rx="6" fill="#ffffff"/>
      <rect x="368" y="192" width="224" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="480" y="216" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">docker0 Bridge</text>
      <text x="480" y="232" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">172.17.0.1/16</text>

      <!-- Node: iptables -->
      <rect x="380" y="288" width="200" height="56" rx="6" fill="#ffffff"/>
      <rect x="380" y="288" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="312" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">iptables</text>
      <text x="480" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">nat rules</text>

      <!-- Node: eth0 (host NIC) -->
      <rect x="380" y="384" width="200" height="56" rx="6" fill="#ffffff"/>
      <rect x="380" y="384" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="408" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">eth0</text>
      <text x="480" y="424" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">192.168.1.10</text>

      <!-- Node: Internet — external -->
      <rect x="380" y="512" width="200" height="56" rx="6" fill="#ffffff"/>
      <rect x="380" y="512" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="480" y="536" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">Internet</text>
      <text x="480" y="552" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">external network</text>
    </svg>
