<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lktm-timeout-title lktm-timeout-desc">
<title id="lktm-timeout-title">Linkerd 타임아웃 동작 시퀀스</title>
<desc id="lktm-timeout-desc">linkerd-proxy가 요청에 5초 타임아웃을 적용해, 정상 응답이면 200 OK를 반환하고 5초를 넘기면 백엔드 처리와 무관하게 클라이언트에 504 Gateway Timeout을 반환하는 두 가지 경로를 보여주는 시퀀스 다이어그램.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<!-- Actor boxes -->
<rect x="80" y="40" width="144" height="40" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="152" y="65" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>

<rect x="408" y="40" width="144" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="480" y="59" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">linkerd-proxy</text>
<text x="480" y="72" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">timeout: 5s</text>

<rect x="736" y="40" width="144" height="40" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="808" y="65" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Backend Service</text>

<!-- Lifelines -->
<line x1="152" y1="80" x2="152" y2="580" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="480" y1="80" x2="480" y2="580" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="808" y1="80" x2="808" y2="580" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Activation: proxy holds control through both branches -->
<rect x="476" y="112" width="8" height="440" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- 1. Client -> Proxy: HTTP Request -->
<line x1="152" y1="112" x2="476" y2="112" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="270" y="92" width="88" height="12" rx="2" fill="#FFFFFF"/>
<text x="314" y="101" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">HTTP REQUEST</text>

<!-- Note: timeout timer starts -->
<text x="500" y="132" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic">timeout: 5s 시작</text>

<!-- 2. Proxy -> Backend: Request -->
<line x1="484" y1="156" x2="804" y2="156" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="602" y="136" width="72" height="12" rx="2" fill="#FFFFFF"/>
<text x="638" y="145" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">REQUEST</text>

<!-- alt fragment frame spanning Proxy..Backend -->
<rect x="356" y="188" width="524" height="360" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
<rect x="356" y="188" width="40" height="16" rx="2" fill="#FFFFFF" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
<text x="376" y="200" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

<!-- Region 1 guard -->
<rect x="404" y="210" width="180" height="14" fill="#FFFFFF"/>
<text x="408" y="220" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[정상 응답, 5초 이내]</text>

<!-- Backend --> Proxy: 200 OK -->
<line x1="804" y1="252" x2="484" y2="252" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="614" y="232" width="60" height="12" rx="2" fill="#FFFFFF"/>
<text x="644" y="241" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">200 OK</text>

<!-- Proxy --> Client: 200 OK (headline success) -->
<line x1="476" y1="288" x2="152" y2="288" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
<rect x="282" y="268" width="60" height="12" rx="2" fill="#FFFFFF"/>
<text x="312" y="277" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">200 OK</text>

<!-- divider -->
<line x1="364" y1="332" x2="872" y2="332" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

<!-- Region 2 guard -->
<rect x="404" y="346" width="160" height="14" fill="#FFFFFF"/>
<text x="408" y="356" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else — 5초 초과]</text>

<!-- Note: 5s elapsed -->
<text x="500" y="396" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic">5초 경과</text>

<!-- Proxy --> Client: 504 Gateway Timeout -->
<line x1="476" y1="420" x2="152" y2="420" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="256" y="400" width="144" height="12" rx="2" fill="#FFFFFF"/>
<text x="328" y="409" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">504 GATEWAY TIMEOUT</text>

<!-- Note: backend still processing -->
<rect x="700" y="448" width="164" height="44" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
<text x="782" y="466" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" text-anchor="middle">요청은 계속</text>
<text x="782" y="480" fill="#232F3E" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" text-anchor="middle">처리될 수 있음</text>

</svg>