    <title id="ko-service-mesh-istio-advanced-02-multi-cluster-10-title">글로벌 전자상거래: Multi-Primary Istio + VPC Lattice 결제 연동</title>
    <desc id="ko-service-mesh-istio-advanced-02-multi-cluster-10-desc">미국과 유럽 리전의 각 EKS 클러스터 내부에서 Frontend, Cart, Order 서비스가 Istio로 통신하고, 두 리전의 Order 서비스가 VPC Lattice Service Network를 통해 아시아 리전의 결제 서비스로 라우팅되는 하이브리드 구성.</desc>
