<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="mg-title mg-desc">
  <title id="mg-title">Maglev Consistent Hashing</title>
  <desc id="mg-desc">A client request is hashed on its five-tuple, looked up in a 65,537-entry Maglev table, and the resulting backend selection is fanned out consistently to one of three backend pods.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== Zones ===== -->
  <rect x="328" y="40" width="304" height="336" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="184" y="408" width="592" height="96" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>

  <rect x="344" y="48" width="180" height="12" rx="2" fill="#ffffff"/>
  <text x="344" y="57" fill="rgba(35,47,62,0.45)" font-size="7" class="mono" letter-spacing="0.14em">MAGLEV CONSISTENT HASHING</text>

  <rect x="200" y="416" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="200" y="425" fill="rgba(35,47,62,0.45)" font-size="7" class="mono" letter-spacing="0.14em">BACKENDS</text>

  <!-- ===== Arrows (drawn before boxes) ===== -->
  <path d="M480,112 V144" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M480,208 V240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M480,288 V320" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Backend Selection -> Backend 1 (elbow left) -->
  <path d="M440,360 V392 Q440,400 432,400 H288 Q280,400 280,408 V440"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Backend Selection -> Backend 2 (straight) -->
  <path d="M480,360 V440" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Backend Selection -> Backend 3 (elbow right) -->
  <path d="M520,360 V392 Q520,400 528,400 H672 Q680,400 680,408 V440"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Client Request ===== -->
  <rect x="380" y="72" width="200" height="40" rx="6" fill="#ffffff"/>
  <rect x="380" y="72" width="200" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="0.8"/>
  <text x="480" y="96" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Client Request</text>

  <!-- ===== Hash Function ===== -->
  <rect x="360" y="144" width="240" height="64" rx="6" fill="#ffffff"/>
  <rect x="360" y="144" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="164" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Hash Function</text>
  <text x="480" y="182" fill="#545B64" font-size="8" class="mono" text-anchor="middle">src_ip + dst_ip +</text>
  <text x="480" y="194" fill="#545B64" font-size="8" class="mono" text-anchor="middle">src_port + dst_port + proto</text>

  <!-- ===== Lookup Table ===== -->
  <rect x="380" y="240" width="200" height="48" rx="6" fill="#ffffff"/>
  <rect x="380" y="240" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="262" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Lookup Table</text>
  <text x="480" y="278" fill="#545B64" font-size="9" class="mono" text-anchor="middle">65,537 ENTRIES</text>

  <!-- ===== Backend Selection (focal) ===== -->
  <rect x="380" y="320" width="200" height="40" rx="6" fill="#ffffff"/>
  <rect x="380" y="320" width="200" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="480" y="344" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Backend Selection</text>

  <!-- ===== Backends ===== -->
  <rect x="200" y="440" width="160" height="48" rx="6" fill="#ffffff"/>
  <rect x="200" y="440" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="280" y="468" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Backend 1</text>

  <rect x="400" y="440" width="160" height="48" rx="6" fill="#ffffff"/>
  <rect x="400" y="440" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="468" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Backend 2</text>

  <rect x="600" y="440" width="160" height="48" rx="6" fill="#ffffff"/>
  <rect x="600" y="440" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="680" y="468" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Backend 3</text>

</svg>