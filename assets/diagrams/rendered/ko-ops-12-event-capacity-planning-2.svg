    <title id="ko-ops-12-event-capacity-planning-2-title">KEDA-Karpenter 사전/실시간 노드 프로비저닝</title>
    <desc id="ko-ops-12-event-capacity-planning-2-desc">이벤트 30분 전 Cron 트리거로 KEDA가 200개 Pod를 요청해 Scheduler가 Pending을 감지하면 Karpenter가 AWS EC2에 노드 20대를 프로비저닝하고, 이벤트 시작 후 메트릭 트리거가 250개로 목표를 올려 5대를 추가로 확보하는 과정을 보여주는 시퀀스 다이어그램.</desc>
