<title id="ko-service-mesh-linkerd-02-architecture-5-title">프록시 간 mTLS 트래픽 흐름</title>
<desc id="ko-service-mesh-linkerd-02-architecture-5-desc">클라이언트 프록시가 대상을 조회하고 로드밸런싱과 mTLS 핸드셰이크를 마친 뒤 암호화된 요청을 서버 프록시로 전달하고, 서버 프록시가 검증과 정책 확인 후 애플리케이션에 전달하는 왕복 흐름을 보여준다.</desc>
