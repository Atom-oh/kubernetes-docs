<rect x="579.0" y="208" width="82" height="12" rx="2" fill="#ffffff"/>
<text x="620.0" y="217" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGN REQUEST</text>
