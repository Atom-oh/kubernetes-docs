<rect x="670" y="40" width="180" height="48" rx="6" fill="#ffffff"/>
<rect x="670" y="40" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="760.0" y="68.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Trust Anchor (CA)</text>
