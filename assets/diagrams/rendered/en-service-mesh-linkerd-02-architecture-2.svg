<rect x="390" y="40" width="180" height="48" rx="6" fill="#ffffff"/>
<rect x="390" y="40" width="180" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
