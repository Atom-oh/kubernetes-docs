<line x1="760" y1="100" x2="760" y2="500" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="162.0" y="86" width="76" height="20" rx="3" fill="rgba(35,47,62,0.04)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
<text x="200" y="100" fill="#545B64" font-size="9" font-style="italic" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod starts</text>
<path d="M 200,132 L 480,132" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="326.0" y="112" width="28" height="12" rx="2" fill="#ffffff"/>
