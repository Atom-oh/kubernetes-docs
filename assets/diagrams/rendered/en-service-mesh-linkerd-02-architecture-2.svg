<rect x="532" y="170.0" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="570.0" y="179.0" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALIDATE SA</text>
