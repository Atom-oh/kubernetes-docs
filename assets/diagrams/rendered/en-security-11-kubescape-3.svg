<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="kubescape-ci-gate-title kubescape-ci-gate-desc">
    <title id="kubescape-ci-gate-title">Kubescape CI security gate</title>
    <desc id="kubescape-ci-gate-desc">A CI pipeline checks out code, runs a Kubescape scan, and evaluates the risk score against a threshold to either deploy to the cluster or block the deployment.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Arrows (drawn before nodes) ===== -->
    <line x1="150" y1="204" x2="190" y2="204" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="340" y1="204" x2="380" y2="204" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="530" y1="204" x2="560" y2="204" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Pass: Threshold Check -> Deploy to Cluster (happy path, accent, straight vertical) -->
    <line x1="630" y1="254" x2="630" y2="420" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="638" y="331" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="656" y="340" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PASS</text>

    <!-- Fail: Threshold Check -> Block Deployment -->
    <path d="M700,204 H832 Q840,204 840,212 V292"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="748" y="184" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="766" y="193" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">FAIL</text>

    <!-- ===== Nodes ===== -->
    <!-- Git Push (start) -->
    <rect x="40" y="180" width="110" height="48" rx="24" fill="#ffffff"/>
    <rect x="40" y="180" width="110" height="48" rx="24" fill="rgba(35,47,62,0.04)" stroke="#7D8998" stroke-width="1"/>
    <text x="95" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Git Push</text>

    <!-- Checkout Code (step) -->
    <rect x="190" y="180" width="150" height="48" rx="6" fill="#ffffff"/>
    <rect x="190" y="180" width="150" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="265" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Checkout Code</text>

    <!-- kubescape scan (step) -->
    <rect x="380" y="180" width="150" height="48" rx="6" fill="#ffffff"/>
    <rect x="380" y="180" width="150" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="455" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">kubescape scan</text>
    <text x="455" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CLI in CI job</text>

    <!-- Threshold Check (decision, focal) -->
    <polygon points="560,204 630,154 700,204 630,254" fill="#ffffff"/>
    <polygon points="560,204 630,154 700,204 630,254" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="630" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Threshold</text>
    <text x="630" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Check</text>

    <!-- Deploy to Cluster (end) -->
    <rect x="550" y="420" width="160" height="48" rx="24" fill="#ffffff"/>
    <rect x="550" y="420" width="160" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="630" y="448" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Deploy to Cluster</text>

    <!-- Block Deployment (end) -->
    <rect x="775" y="292" width="130" height="48" rx="24" fill="#ffffff"/>
    <rect x="775" y="292" width="130" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="840" y="320" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Block Deployment</text>
  </svg>