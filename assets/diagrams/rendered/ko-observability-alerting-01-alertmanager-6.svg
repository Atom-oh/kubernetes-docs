<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ha6-title ha6-desc">
    <title id="ha6-title">Alertmanager 고가용성 클러스터링 아키텍처</title>
    <desc id="ha6-desc">Prometheus가 3개의 Alertmanager 복제본에 동시에 알림을 보내고, 복제본들은 Gossip 프로토콜로 서로 상태를 동기화하며, 그중 한 대가 최종적으로 수신자에게 알림을 전달하는 고가용성 구성을 보여줍니다.</desc>
    <defs><style>@import url(https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Alertmanager Cluster -->
    <rect x="300" y="108" width="340" height="328" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="380" y="112" width="180" height="12" rx="2" fill="#ffffff"/>
    <text x="470" y="121" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">ALERTMANAGER CLUSTER</text>

    <!-- Edges: Prometheus fan-out -->
    <path d="M 180,248 H 252 Q 260,248 260,240 V 176 Q 260,168 268,168 H 340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="180" y1="276" x2="340" y2="276" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 180,304 H 252 Q 260,304 260,312 V 376 Q 260,384 268,384 H 340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Edges: Gossip (bidirectional) -->
    <line x1="420" y1="196" x2="420" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <line x1="420" y1="304" x2="420" y2="356" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <path d="M 500,384 H 580 Q 588,384 588,376 V 188 Q 588,180 580,180 H 500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

    <!-- Edge: AM1 -> Receivers -->
    <line x1="500" y1="156" x2="680" y2="156" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Node: Prometheus -->
    <rect x="40" y="232" width="140" height="88" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="110" y="280" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Prometheus</text>

    <!-- Node: AM1 (focal / leader) -->
    <rect x="340" y="140" width="160" height="56" rx="6" fill="#FFF8F0" stroke="#EC7211" stroke-width="1.4"/>
    <text x="420" y="164" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Alertmanager 1</text>
    <text x="420" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">리더 · 전송 담당</text>

    <!-- Node: AM2 -->
    <rect x="340" y="248" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="420" y="280" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Alertmanager 2</text>

    <!-- Node: AM3 -->
    <rect x="340" y="356" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="420" y="388" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Alertmanager 3</text>

    <!-- Node: Receivers -->
    <rect x="680" y="128" width="140" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="750" y="160" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Receivers</text>

    <!-- Edge labels -->
    <rect x="238" y="196" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="258" y="205" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">알림</text>
    <rect x="238" y="256" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="258" y="265" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">알림</text>
    <rect x="238" y="328" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="258" y="337" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">알림</text>

    <rect x="426" y="216" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="454" y="225" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">GOSSIP</text>
    <rect x="426" y="324" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="454" y="333" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">GOSSIP</text>
    <rect x="596" y="276" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="624" y="285" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">GOSSIP</text>

    <rect x="540" y="140" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="580" y="149" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">알림 전송</text>

    <!-- Legend -->
    <line x1="40" y1="470" x2="920" y2="470" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <line x1="52" y1="488" x2="80" y2="488" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <text x="88" y="491" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">Gossip 상태 동기화 (양방향)</text>
    <line x1="380" y1="488" x2="408" y2="488" stroke="#EC7211" stroke-width="1.4"/>
    <text x="416" y="491" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">최종 알림 전송</text>
  </svg>