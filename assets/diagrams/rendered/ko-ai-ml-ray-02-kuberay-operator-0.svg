<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc"><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap'); text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;} .mono{font-family:'Geist Mono','Amazon Ember Mono',ui-monospace,monospace;}</style></defs>
  <title id="dtitle">KubeRay 오퍼레이터 재조정 루프</title>
  <desc id="ddesc">RayCluster CR을 KubeRay 오퍼레이터가 재조정하여 Head Pod와 워커 그룹 Pod를 생성하고, Ray 오토스케일러가 워커 그룹을 모니터링해 RayCluster에 replica 증설을 요청하며, 대기 중인 Pod가 생기면 Karpenter가 EC2 노드를 프로비저닝해 워커 그룹을 확장하는 순환 구조를 보여준다.</desc>

  <rect width="960" height="616" fill="#ffffff"/>

  <!-- eyebrow -->
  <text x="40" y="28" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.14em">KUBERAY · AUTOSCALING LOOP</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
    </marker>
  </defs>

  <!-- ================= ARROWS (drawn before boxes) ================= -->

  <!-- E1 RC -> OP : straight vertical -->
  <path d="M276,96 V160" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- E3 OP -> WG1 : straight vertical (main line) -->
  <path d="M276,216 V292" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- E2 OP -> HP : elbow -->
  <path d="M226,216 V244 Q226,252 218,252 H116 Q108,252 108,260 V292"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- E4 OP -> WG2 : elbow -->
  <path d="M326,216 V244 Q326,252 334,252 H428 Q436,252 436,260 V292"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- E6 WG2 -.모니터링.-> RA : dashed, mostly straight -->
  <path d="M508,320 H584 Q592,320 592,312 V308 H616"
        fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- E5 WG1 -.모니터링.-> RA : dashed, detour under WG2, with hop over KP->WG2 vertical at x=436,y=400 -->
  <path d="M344,320 H352 Q360,320 360,328 V392 Q360,400 368,400 H428"
        fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M428,400 a8,8 0 0,1 16,0" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M444,400 H592 Q600,400 600,392 V332 Q600,324 608,324 H616"
        fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- E7 RA -> RC : accent feedback loop (replica 증설 요청) -->
  <path d="M696,292 V116 Q696,108 688,108 H384"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- E8 RA -> KP : straight vertical (Pending Pod) -->
  <path d="M696,348 V440" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- E9 KP -> WG1 : elbow, with hop over KP->WG2's vertical at x=436,y=456 -->
  <path d="M616,456 H460"
        fill="none" stroke="#545B64" stroke-width="1.2"/>
  <path d="M452,456 a8,8 0 0,0 -16,0" fill="none" stroke="#545B64" stroke-width="1.2"/>
  <path d="M436,456 H292 Q284,456 284,448 V348"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- E10 KP -> WG2 : elbow, straight vertical rise -->
  <path d="M616,472 H444 Q436,472 436,464 V356 Q436,348 436,348"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ================= ARROW LABELS (masked, 6-10px gap) ================= -->

  <!-- 모니터링 (WG2->RA) near y=320 segment -->
  <rect x="518" y="300" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="546" y="309" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">모니터링</text>

  <!-- 모니터링 (WG1->RA) near y=400 segment -->
  <rect x="470" y="380" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="498" y="389" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">모니터링</text>

  <!-- replica 증설 요청 (RA->RC), on the horizontal run near top -->
  <rect x="486" y="94" width="92" height="12" rx="2" fill="#ffffff"/>
  <text x="532" y="103" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">REPLICA 증설 요청</text>

  <!-- Pending Pod (RA->KP) -->
  <rect x="654" y="384" width="84" height="12" rx="2" fill="#ffffff"/>
  <text x="696" y="393" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">PENDING POD</text>

  <!-- EC2 프로비저닝 (KP->WG1 / KP->WG2, single shared label near KP) -->
  <rect x="510" y="424" width="90" height="12" rx="2" fill="#ffffff"/>
  <text x="555" y="433" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">EC2 프로비저닝</text>

  <!-- ================= NODES ================= -->

  <!-- RC : RayCluster CR -->
  <g>
    <rect x="176" y="40" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="176" y="40" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="184" y="46" width="26" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="197" y="55" fill="rgba(35,47,62,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.06em">CR</text>
    <text x="276" y="70" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">RayCluster CR</text>
    <text x="276" y="84" fill="#545B64" font-size="9" class="mono" text-anchor="middle">head + 워커 그룹 스펙</text>
  </g>

  <!-- OP : KubeRay 오퍼레이터 (FOCAL) -->
  <g>
    <rect x="176" y="160" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="176" y="160" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="184" y="166" width="34" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.5)" stroke-width="0.8"/>
    <text x="201" y="175" fill="#EC7211" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.06em">CTRL</text>
    <text x="276" y="190" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">KubeRay 오퍼레이터</text>
    <text x="276" y="204" fill="#545B64" font-size="9" class="mono" text-anchor="middle">reconcile loop</text>
  </g>

  <!-- HP : Head Pod -->
  <g>
    <rect x="40" y="292" width="136" height="56" rx="6" fill="#ffffff"/>
    <rect x="40" y="292" width="136" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="108" y="322" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Head Pod</text>
    <text x="108" y="336" fill="#545B64" font-size="9" class="mono" text-anchor="middle">scheduler</text>
  </g>

  <!-- WG1 : CPU 워커 그룹 Pod -->
  <g>
    <rect x="208" y="292" width="136" height="56" rx="6" fill="#ffffff"/>
    <rect x="208" y="292" width="136" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="276" y="322" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">CPU 워커 그룹</text>
    <text x="276" y="336" fill="#545B64" font-size="9" class="mono" text-anchor="middle">Pod replicas</text>
  </g>

  <!-- WG2 : GPU 워커 그룹 Pod -->
  <g>
    <rect x="364" y="292" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="364" y="292" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="436" y="322" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">GPU 워커 그룹</text>
    <text x="436" y="336" fill="#545B64" font-size="9" class="mono" text-anchor="middle">Pod replicas</text>
  </g>

  <!-- RA : Ray 오토스케일러 (FOCAL) -->
  <g>
    <rect x="616" y="292" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="616" y="292" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="624" y="298" width="34" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.5)" stroke-width="0.8"/>
    <text x="641" y="307" fill="#EC7211" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.06em">AUTO</text>
    <text x="696" y="322" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Ray 오토스케일러</text>
    <text x="696" y="336" fill="#545B64" font-size="9" class="mono" text-anchor="middle">scale decision</text>
  </g>

  <!-- KP : Karpenter -->
  <g>
    <rect x="616" y="440" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="616" y="440" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="696" y="470" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Karpenter</text>
    <text x="696" y="484" fill="#545B64" font-size="9" class="mono" text-anchor="middle">node provisioner</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="576" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>

  <path d="M180,592 H212" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="220" y="596" fill="#545B64" font-size="9">재조정 / 스케줄</text>

  <path d="M380,592 H412" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="420" y="596" fill="#545B64" font-size="9">모니터링 (관측)</text>

  <path d="M600,592 H632" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="640" y="596" fill="#545B64" font-size="9">오토스케일링 피드백</text>
</svg>