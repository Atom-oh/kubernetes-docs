<title id="dtitle">Policy Management in Amazon EKS</title>
<desc id="ddesc">Diagram showing how AWS-side controls (IAM, Security Groups, Organizations, Config, Firewall Manager) integrate with EKS-specific mechanisms and built-in Kubernetes policies to govern the EKS cluster, its namespaces, and pods.</desc>
