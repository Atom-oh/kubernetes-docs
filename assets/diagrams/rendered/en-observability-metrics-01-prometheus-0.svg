<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prom-arch-title prom-arch-desc">
    <title id="prom-arch-title">Prometheus architecture and data flow</title>
    <desc id="prom-arch-desc">Service discovery feeds the Retrieval component, which scrapes exporters and pushgateway targets and writes into the TSDB; TSDB serves the HTTP query API out to Grafana and other clients, and feeds alert rule evaluation into Alertmanager, which routes to notification channels.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- zone: Prometheus Server -->
    <rect x="296" y="92" width="488" height="260" rx="8" fill="var(--zone-fill)" stroke="var(--zone-stroke)" stroke-width="0.8"/>
    <rect x="308" y="96" width="164" height="12" rx="2" fill="#ffffff"/>
    <text class="zone-label" x="390" y="105" text-anchor="middle">PROMETHEUS SERVER</text>

    <!-- arrows (drawn before nodes) -->
    <!-- SD -> R -->
    <path d="M 260,156 H 320" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- R -> T -->
    <path d="M 460,156 H 520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- T -> A -->
    <path d="M 568,188 V 212 Q 568,220 560,220 H 518 Q 510,220 510,228 V 252" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- T -> H -->
    <path d="M 612,188 V 212 Q 612,220 620,220 H 682 Q 690,220 690,228 V 252" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- R -> Targets (scrape) -->
    <path d="M 390,188 V 296 Q 390,304 382,304 H 368 Q 360,304 360,312 V 420" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- A -> AM (alerts) -->
    <path d="M 510,316 V 360 Q 510,368 518,368 H 522 Q 530,368 530,376 V 420" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- H -> Vis -->
    <path d="M 690,316 V 360 Q 690,368 698,368 H 702 Q 710,368 710,376 V 420" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- AM -> Notify -->
    <path d="M 530,484 V 504" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- arrow label: SCRAPE -->
    <rect x="402" y="232" width="60" height="12" rx="2" fill="#ffffff"/>
    <text class="arrow-label" x="432" y="241" text-anchor="middle">SCRAPE</text>

    <!-- arrow label: ALERTS -->
    <rect x="520" y="332" width="56" height="12" rx="2" fill="#ffffff"/>
    <text class="arrow-label" x="548" y="341" text-anchor="middle">ALERTS</text>

    <!-- Node: Service Discovery (external) -->
    <rect x="80" y="124" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="80" y="124" width="180" height="64" rx="6" fill="var(--ext-fill)" stroke="var(--ext-stroke)" stroke-width="1"/>
    <text class="name" x="170" y="154" text-anchor="middle">Service Discovery</text>
    <text class="sub" x="170" y="170" text-anchor="middle">k8s api · dns · file · consul</text>

    <!-- Node: Retrieval (backend) -->
    <rect x="320" y="124" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="320" y="124" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text class="name" x="390" y="154" text-anchor="middle">Retrieval</text>
    <text class="sub" x="390" y="170" text-anchor="middle">metric collection</text>

    <!-- Node: TSDB (focal) -->
    <rect x="520" y="124" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="520" y="124" width="140" height="64" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
    <text class="name" x="590" y="154" text-anchor="middle">TSDB</text>
    <text class="sub" x="590" y="170" text-anchor="middle">time series database</text>

    <!-- Node: Alert Rules (backend) -->
    <rect x="440" y="252" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="440" y="252" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text class="name" x="510" y="282" text-anchor="middle">Alert Rules</text>
    <text class="sub" x="510" y="298" text-anchor="middle">rule evaluation</text>

    <!-- Node: HTTP Server (backend) -->
    <rect x="620" y="252" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="620" y="252" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text class="name" x="690" y="282" text-anchor="middle">HTTP Server</text>
    <text class="sub" x="690" y="298" text-anchor="middle">query api</text>

    <!-- Node: Scrape Targets (external) -->
    <rect x="280" y="420" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="280" y="420" width="160" height="64" rx="6" fill="var(--ext-fill)" stroke="var(--ext-stroke)" stroke-width="1"/>
    <text class="name" x="360" y="450" text-anchor="middle">Scrape Targets</text>
    <text class="sub" x="360" y="466" text-anchor="middle">exporters · pushgateway</text>

    <!-- Node: Alertmanager (backend) -->
    <rect x="460" y="420" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="460" y="420" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text class="name" x="530" y="450" text-anchor="middle">Alertmanager</text>
    <text class="sub" x="530" y="466" text-anchor="middle">routing · grouping</text>

    <!-- Node: Grafana / API / UI (external) -->
    <rect x="640" y="420" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="640" y="420" width="140" height="64" rx="6" fill="var(--ext-fill)" stroke="var(--ext-stroke)" stroke-width="1"/>
    <text class="name" x="710" y="450" text-anchor="middle">Grafana · API · UI</text>
    <text class="sub" x="710" y="466" text-anchor="middle">query clients</text>

    <!-- Node: Notification Channels (external) -->
    <rect x="460" y="504" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="460" y="504" width="140" height="64" rx="6" fill="var(--ext-fill)" stroke="var(--ext-stroke)" stroke-width="1"/>
    <text class="name" x="530" y="534" text-anchor="middle">Notification Channels</text>
    <text class="sub" x="530" y="550" text-anchor="middle">email · slack · pagerduty</text>
  </svg>