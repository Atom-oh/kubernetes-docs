<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seqflow-title seqflow-desc">
<title id="seqflow-title">VPC Lattice 요청 흐름</title>
<desc id="seqflow-desc">클라이언트의 요청이 VPC Lattice, 서비스, 대상 그룹을 차례로 거쳐 EKS 파드에 도달하고, 응답이 동일한 경로를 역순으로 되돌아오는 왕복 처리 과정을 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="40" y="44" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SEQUENCE</text>
<text x="40" y="68" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">VPC Lattice 요청 흐름</text>

<!-- Actor centers (x): Client 100, VPCLattice 300, Service 500, TargetGroup 700, Target 900 -->
<!-- Lifelines -->
<line x1="100" y1="140" x2="100" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="300" y1="140" x2="300" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="500" y1="140" x2="500" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="700" y1="140" x2="700" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="900" y1="140" x2="900" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Activation bars (control held while handling downstream calls) -->
<rect x="296" y="164" width="8" height="308" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="496" y="188" width="8" height="216" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="696" y="212" width="8" height="120" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="896" y="236" width="8" height="36" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- Messages (top -> down) -->
<!-- 1. Client -> VPCLattice : headline call, accent -->
<path d="M100,164 H296" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="130" y="150" width="220" height="12" rx="2" fill="#ffffff"/>
<text x="240" y="159" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">요청(service-name.vpc-lattice-svcs...)</text>

<!-- 2. VPCLattice -> Service -->
<path d="M304,188 H496" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="330" y="174" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="405" y="183" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">리스너 규칙 적용</text>

<!-- 3. Service -> TargetGroup -->
<path d="M504,212 H696" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="530" y="198" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="600" y="207" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">대상 그룹으로 라우팅</text>

<!-- 4. TargetGroup -> Target -->
<path d="M704,236 H896" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="730" y="222" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="800" y="231" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">요청을 대상으로 전달</text>

<!-- 5. Target -> TargetGroup : return, dashed -->
<path d="M896,272 H704" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="730" y="258" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="780" y="267" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">응답 반환</text>

<!-- 6. TargetGroup -> Service : return, dashed -->
<path d="M696,332 H504" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="530" y="318" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="580" y="327" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">응답 전달</text>

<!-- 7. Service -> VPCLattice : return, dashed -->
<path d="M496,404 H304" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="330" y="390" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="380" y="399" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">응답 처리</text>

<!-- 8. VPCLattice -> Client : headline return, accent, dashed -->
<path d="M296,472 H100" fill="none" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
<rect x="140" y="458" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="200" y="467" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">응답 반환</text>

<!-- Actor boxes (drawn after lifelines/messages, above the lifeline top) -->
<rect x="40" y="108" width="120" height="32" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="100" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">클라이언트</text>

<rect x="240" y="108" width="120" height="32" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="300" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC Lattice</text>

<rect x="440" y="108" width="120" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="500" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">서비스</text>

<rect x="640" y="108" width="120" height="32" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="700" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">대상 그룹</text>

<rect x="840" y="108" width="120" height="32" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="900" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">대상</text>
<text x="900" y="137" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EKS 파드</text>

<!-- Legend -->
<line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="140" y1="552" x2="176" y2="552" stroke="#EC7211" stroke-width="1.2"/>
<text x="184" y="556" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">요청 · 응답(핵심 경로)</text>
<line x1="380" y1="552" x2="416" y2="552" stroke="#545B64" stroke-width="1.2"/>
<text x="424" y="556" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">요청 호출</text>
<line x1="540" y1="552" x2="576" y2="552" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4"/>
<text x="584" y="556" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">응답(반환)</text>
</svg>