<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="psstl-title psstl-desc">
  <title id="psstl-title">PSP에서 PSS로의 전환 타임라인</title>
  <desc id="psstl-desc">Kubernetes 1.21부터 1.28+까지 버전별로 PodSecurityPolicy가 단계적으로 사용 중단되고 Pod Security Admission/Standards로 대체되어 안정화되는 과정을 보여준다.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .mono{ font-family:'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; }
    </style>
  </defs>

  <!-- background -->
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- eyebrow -->
  <text x="60" y="64" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">KUBERNETES 버전 · 타임라인</text>
  <text x="60" y="92" font-size="16" font-weight="700" fill="#232F3E">PSP → PSS 전환 로드맵</text>

  <!-- baseline -->
  <line x1="80" y1="300" x2="880" y2="300" stroke="#545B64" stroke-width="1"/>

  <!-- end caps -->
  <line x1="80" y1="292" x2="80" y2="308" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
  <line x1="880" y1="292" x2="880" y2="308" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>

  <!-- Event 1: v1.21 (below) -->
  <line x1="140" y1="300" x2="140" y2="332" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <circle cx="140" cy="300" r="4" fill="#232F3E"/>
  <text x="140" y="348" class="mono" font-size="8" letter-spacing="0.12em" fill="#545B64" text-anchor="middle">V1.21</text>
  <text x="140" y="364" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">PSP 사용 중단</text>
  <text x="140" y="380" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">발표</text>

  <!-- Event 2: v1.22 (above) -->
  <line x1="320" y1="248" x2="320" y2="300" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <circle cx="320" cy="300" r="4" fill="#232F3E"/>
  <text x="320" y="216" class="mono" font-size="8" letter-spacing="0.12em" fill="#545B64" text-anchor="middle">V1.22</text>
  <text x="320" y="232" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">PSA 알파 도입</text>

  <!-- Event 3: v1.23 (below) -->
  <line x1="500" y1="300" x2="500" y2="332" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <circle cx="500" cy="300" r="4" fill="#232F3E"/>
  <text x="500" y="348" class="mono" font-size="8" letter-spacing="0.12em" fill="#545B64" text-anchor="middle">V1.23</text>
  <text x="500" y="364" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">PSA 베타</text>

  <!-- Event 4: v1.25 major milestone (above, accent) -->
  <line x1="660" y1="220" x2="660" y2="300" stroke="rgba(236,114,17,0.45)" stroke-width="1"/>
  <circle cx="660" cy="300" r="6" fill="#EC7211"/>
  <text x="660" y="188" class="mono" font-size="8" letter-spacing="0.12em" fill="#EC7211" text-anchor="middle">V1.25</text>
  <text x="660" y="204" font-size="12" font-weight="700" fill="#232F3E" text-anchor="middle">PSP 제거, PSA GA</text>

  <!-- Event 5: v1.28+ (below) -->
  <line x1="820" y1="300" x2="820" y2="332" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <circle cx="820" cy="300" r="4" fill="#232F3E"/>
  <text x="820" y="348" class="mono" font-size="8" letter-spacing="0.12em" fill="#545B64" text-anchor="middle">V1.28+</text>
  <text x="820" y="364" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">PSS/PSA 안정화</text>

  <!-- legend -->
  <line x1="60" y1="512" x2="900" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="60" y="536" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">범례</text>
  <circle cx="180" cy="533" r="4" fill="#232F3E"/>
  <text x="192" y="537" class="mono" font-size="9" fill="#545B64">일반 이벤트</text>
  <circle cx="340" cy="533" r="6" fill="#EC7211"/>
  <text x="356" y="537" class="mono" font-size="9" fill="#545B64">주요 전환점 (PSS 안정화 기준)</text>
</svg>
