<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svc-arch-title svc-arch-desc"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <title id="svc-arch-title">Kubernetes Service Types and Discovery</title>
    <desc id="svc-arch-desc">External and internal clients reach backend Pods through LoadBalancer, NodePort, or ClusterIP services, while ClusterIP is resolved via CoreDNS and routed through Endpoints; ExternalName instead aliases to an outside service via DNS CNAME.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones (bg, before arrows/nodes) -->
    <rect x="220" y="88" width="224" height="456" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="268" y="92" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="332" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE TYPES</text>

    <rect x="476" y="176" width="200" height="224" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="524" y="180" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="576" y="189" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DISCOVERY</text>

    <!-- Arrows (behind nodes) -->
    <!-- LB -> NP -> CIP: straight vertical, same x=332 -->
    <line x1="332" y1="176" x2="332" y2="232" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="332" y1="296" x2="332" y2="352" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ExtClient -> LB (elbow up) -->
    <path d="M192,200 H206 Q214,200 214,192 V152 Q214,144 222,144 H236" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- ExtClient -> NP (straight, same y=264... ExtClient center y=200, NP center y=264, elbow down) -->
    <path d="M192,216 H206 Q214,216 214,224 V256 Q214,264 222,264 H236" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- IntClient -> CIP (elbow up, IntClient center y=376 -> CIP center y=384... same-ish, short) -->
    <path d="M192,368 H206 Q214,368 214,376 V376 H236" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- IntClient -> DNS (long elbow up and right, routed above the Service Types zone) -->
    <path d="M112,340 V72 Q112,64 120,64 H568 Q576,64 576,72 V224" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- CIP -> DNS (accent, elbow right+up) -->
    <path d="M428,368 H452 Q460,368 460,360 V248 Q460,240 468,240 H492" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- CIP -> EP (accent, straight-ish elbow right) -->
    <path d="M428,400 H452 Q460,400 460,392 V368 Q460,360 468,360 H492" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- EP -> PodsGroup (straight horizontal, same y center=352) -->
    <line x1="660" y1="352" x2="708" y2="352" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="188" y="130" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="208" y="139" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

    <rect x="188" y="242" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="208" y="251" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PORT</text>

    <rect x="120" y="50" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="136" y="59" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DNS</text>

    <rect x="444" y="292" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="460" y="301" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">A/AAAA</text>

    <!-- Node: External Client -->
    <rect x="32" y="168" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="32" y="168" width="160" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="112" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">External Client</text>
    <text x="112" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">outside cluster</text>

    <!-- Node: Internal Client -->
    <rect x="32" y="344" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="32" y="344" width="160" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="112" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Internal Client</text>
    <text x="112" y="388" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pod in-cluster</text>

    <!-- Node: LoadBalancer -->
    <rect x="236" y="112" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="236" y="112" width="192" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="332" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">LoadBalancer</text>
    <text x="332" y="156" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">external IP</text>

    <!-- Node: NodePort -->
    <rect x="236" y="232" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="236" y="232" width="192" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="332" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">NodePort</text>
    <text x="332" y="276" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">30000-32767</text>

    <!-- Node: ClusterIP (focal) -->
    <rect x="236" y="352" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="236" y="352" width="192" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="332" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">ClusterIP</text>
    <text x="332" y="396" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">default type</text>

    <!-- Node: ExternalName -->
    <rect x="236" y="472" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="236" y="472" width="192" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="332" y="500" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">ExternalName</text>
    <text x="332" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ external DB (CNAME)</text>

    <!-- Node: CoreDNS -->
    <rect x="492" y="192" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="492" y="192" width="168" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="576" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">CoreDNS</text>
    <text x="576" y="236" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cluster.local</text>

    <!-- Node: Endpoints -->
    <rect x="492" y="320" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="492" y="320" width="168" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="576" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Endpoints</text>
    <text x="576" y="364" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pod IP:port list</text>

    <!-- Node: Backend Pods (merged x3) -->
    <rect x="708" y="320" width="188" height="64" rx="6" fill="#ffffff"/>
    <rect x="708" y="320" width="188" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="802" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Backend Pods</text>
    <text x="802" y="364" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod-1 · pod-2 · pod-3</text>

    <!-- Legend -->
    <line x1="32" y1="556" x2="928" y2="556" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="32" y="572" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="52" y="580" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Focal service (ClusterIP)</text>
    <rect x="272" y="572" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="292" y="580" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Client</text>
    <rect x="392" y="572" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="412" y="580" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Discovery / store</text>
  </svg>