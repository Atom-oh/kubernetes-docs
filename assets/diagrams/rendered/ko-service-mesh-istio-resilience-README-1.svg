<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rp1-title rp1-desc" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">
    <title id="rp1-title">Circuit Breaker 동작 방식</title>
    <desc id="rp1-desc">Envoy 프록시가 정상 요청은 서비스로 전달하다가 연결 수 제한에 도달하면 이후 요청을 즉시 503으로 거부하는 Circuit Breaker의 동작 순서를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- lifelines -->
    <line x1="140" y1="112" x2="140" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="112" x2="480" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="820" y1="112" x2="820" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- actor boxes -->
    <rect x="80" y="72" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="96" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">클라이언트</text>

    <rect x="420" y="72" width="120" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="96" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Envoy Proxy</text>

    <rect x="760" y="72" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="820" y="96" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">서비스</text>

    <!-- activation bars -->
    <rect x="136" y="152" width="8" height="120" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="476" y="152" width="8" height="120" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="816" y="176" width="8" height="48" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- 1. Client -> Envoy: 요청 1-100 -->
    <line x1="144" y1="152" x2="476" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="270" y="130" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="330" y="139" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">1. 요청 1-100 (정상)</text>

    <!-- 2. Envoy -> Service: 전달 -->
    <line x1="484" y1="176" x2="816" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="610" y="154" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="650" y="163" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">2. 전달</text>

    <!-- 3. Service -> Envoy: 응답 (dashed return) -->
    <line x1="816" y1="200" x2="484" y2="200" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="610" y="178" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="650" y="187" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">3. 응답</text>

    <!-- 4. Envoy -> Client: 응답 (dashed return, accent headline success) -->
    <line x1="476" y1="224" x2="144" y2="224" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <rect x="270" y="202" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="310" y="211" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">4. 응답</text>

    <!-- 5. Client -> Envoy: 요청 101 (제한 초과) -->
    <line x1="144" y1="304" x2="476" y2="304" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="230" y="282" width="160" height="12" rx="2" fill="#ffffff"/>
    <text x="310" y="291" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">5. 요청 101 (제한 초과)</text>

    <!-- 6. Envoy --> Client: 503 dashed (rejection, muted) -->
    <line x1="476" y1="328" x2="144" y2="328" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="220" y="306" width="180" height="12" rx="2" fill="#ffffff"/>
    <text x="310" y="315" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">6. 503 CIRCUIT BREAKER OPEN</text>

    <!-- Note frame over Envoy,Service -->
    <rect x="480" y="384" width="340" height="64" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <rect x="480" y="384" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="500" y="396" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">NOTE</text>
    <text x="650" y="416" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">연결 수 제한 도달</text>
    <text x="650" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">새 연결 차단</text>

    <!-- legend -->
    <line x1="60" y1="484" x2="900" y2="484" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="500" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="180" y1="496" x2="204" y2="496" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="212" y="500" fill="#545B64" font-size="9">호출</text>
    <line x1="300" y1="496" x2="324" y2="496" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="332" y="500" fill="#545B64" font-size="9">응답 / 거부</text>
    <line x1="460" y1="496" x2="484" y2="496" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <text x="492" y="500" fill="#545B64" font-size="9">성공 응답</text>
  </svg>