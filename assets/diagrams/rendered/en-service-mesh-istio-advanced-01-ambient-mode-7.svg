<title id="en-service-mesh-istio-advanced-01-ambient-mode-7-title">HBONE tunneling protocol</title>
<desc id="en-service-mesh-istio-advanced-01-ambient-mode-7-desc">Flowchart showing plain TCP traffic from an application getting encapsulated into an HTTP/2, mTLS-secured HBONE tunnel by the source ztunnel, carried across the network, and decapsulated back to plain TCP by the destination ztunnel before reaching the target app.</desc>
