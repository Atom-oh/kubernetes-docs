<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dh-flow-title dh-flow-desc">
      <title id="dh-flow-title">Rate Limit 대응 흐름</title>
      <desc id="dh-flow-desc">Docker Hub Rate Limit 발생 여부를 확인하고, 환경별로 ECR Pull-through Cache, Harbor Proxy Cache, containerd 미러 중 하나를 적용하거나 인증된 Pull로 사전 예방하여 Rate Limit을 해소하는 흐름.</desc>
      <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <!-- D1 -> Auth (No) -->
      <line x1="568" y1="76" x2="776" y2="76" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D1 -> D2 (Yes) -->
      <line x1="480" y1="112" x2="480" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D2 -> ECR (AWS/EKS) -->
      <path d="M 380,220 H 200 Q 192,220 192,228 V 304" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D2 -> Harbor (자체 호스팅) -->
      <line x1="480" y1="264" x2="480" y2="304" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D2 -> Mirror (기타) -->
      <path d="M 580,220 H 760 Q 768,220 768,228 V 304" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ECR/Harbor/Mirror/Auth -> merge dot (no markers, dot represents the merge) -->
      <path d="M 192,368 V 392 Q 192,400 200,400 H 476" fill="none" stroke="#545B64" stroke-width="1"/>
      <line x1="480" y1="368" x2="480" y2="400" stroke="#545B64" stroke-width="1"/>
      <path d="M 768,368 V 392 Q 768,400 760,400 H 484" fill="none" stroke="#545B64" stroke-width="1"/>
      <path d="M 860,104 V 392 Q 860,400 852,400 H 484" fill="none" stroke="#545B64" stroke-width="1"/>

      <!-- merge dot -> Result -->
      <line x1="480" y1="400" x2="480" y2="432" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="654" y="56" width="24" height="12" rx="2" fill="#ffffff"/>
      <text x="666" y="65" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NO</text>

      <rect x="500" y="132" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="516" y="141" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">YES</text>

      <rect x="256" y="200" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="288" y="209" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AWS/EKS</text>

      <rect x="488" y="278" width="70" height="12" rx="2" fill="#ffffff"/>
      <text x="523" y="287" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SELF-HOST</text>

      <rect x="640" y="200" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="660" y="209" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OTHER</text>

      <!-- Node: D1 decision -->
      <polygon points="480,40 568,76 480,112 392,76" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="80" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Rate Limit 발생?</text>

      <!-- Node: Auth (prevention box) -->
      <rect x="776" y="48" width="168" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="860" y="72" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">인증된 Pull 사용</text>
      <text x="860" y="88" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rate limit 사전 예방</text>

      <!-- Node: D2 decision -->
      <polygon points="480,176 580,220 480,264 380,220" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="224" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">환경 확인</text>

      <!-- Node: ECR -->
      <rect x="112" y="304" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="192" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">ECR</text>
      <text x="192" y="348" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pull-through Cache</text>

      <!-- Node: Harbor -->
      <rect x="400" y="304" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Harbor</text>
      <text x="480" y="348" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Proxy Cache</text>

      <!-- Node: Mirror -->
      <rect x="688" y="304" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="768" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">containerd</text>
      <text x="768" y="348" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">미러 설정</text>

      <!-- Merge dot -->
      <circle cx="480" cy="400" r="4" fill="#232F3E"/>

      <!-- Node: Result (focal) -->
      <rect x="380" y="432" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="480" y="460" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Rate Limit 해소</text>
      <text x="480" y="476" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stable pull path</text>

      <!-- Legend -->
      <line x1="48" y1="524" x2="912" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="48" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <polygon points="52,558 64,552 76,558 64,564" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="88" y="561" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">결정 (다이아몬드)</text>

      <rect x="256" y="552" width="24" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="288" y="561" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">조치 (사각형)</text>

      <circle cx="472" cy="558" r="4" fill="#232F3E"/>
      <text x="488" y="561" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">분기 병합점</text>

      <line x1="616" y1="558" x2="644" y2="558" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="652" y="561" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">해소 경로</text>
    </svg>