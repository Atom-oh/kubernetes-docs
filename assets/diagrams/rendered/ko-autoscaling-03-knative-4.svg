    <title id="ko-autoscaling-03-knative-4-title">Knative Autoscaler와 KEDA 스케일링 경로 비교</title>
    <desc id="ko-autoscaling-03-knative-4-desc">Knative는 Queue Proxy가 보고한 동시성 메트릭으로 자체 Autoscaler(KPA)가 파드 수를 조절하고, KEDA는 외부 메트릭 소스를 기반으로 Kubernetes HPA를 생성/관리해 파드 수를 조절하는 두 스케일링 경로를 나란히 비교한다.</desc>
