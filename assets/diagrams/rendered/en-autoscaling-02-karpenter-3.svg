<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="karpaws-title karpaws-desc">
    <title id="karpaws-title">Karpenter AWS integration</title>
    <desc id="karpaws-desc">Architecture diagram showing the Karpenter controller in an Amazon EKS cluster assuming an IAM role to call the EC2 API directly, bypassing Auto Scaling Groups and Managed Node Groups to create EC2 instances.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="80" width="240" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="88" y="84" width="144" height="12" rx="2" fill="#ffffff"/>
    <text x="160" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AMAZON EKS CLUSTER</text>

    <rect x="480" y="80" width="300" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="570" y="84" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="630" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">AWS SERVICES</text>

    <!-- Arrows (drawn before nodes) -->
    <!-- KC -> EKS watches (shared x=160) -->
    <line x1="160" y1="200" x2="160" y2="168" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- KC -> IRSA uses (shared x=160) -->
    <line x1="160" y1="296" x2="160" y2="416" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- KC -> ASG bypasses -->
    <path d="M 260,216 H 312 Q 320,216 320,208 V 206 Q 320,198 328,198 H 510"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- KC -> MNG bypasses -->
    <path d="M 260,232 H 332 Q 340,232 340,240 V 254 Q 340,262 348,262 H 510"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- KC -> SG uses -->
    <path d="M 260,248 H 352 Q 360,248 360,256 V 318 Q 360,326 368,326 H 510"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- KC -> VPC uses -->
    <path d="M 260,264 H 372 Q 380,264 380,272 V 382 Q 380,390 388,390 H 510"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- KC -> NI creates (accent headline) -->
    <path d="M 260,280 H 392 Q 400,280 400,288 V 446 Q 400,454 408,454 H 510"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- IRSA -> EC2 assumes (outer right-margin corridor, clear of every other box) -->
    <path d="M 160,472 V 496 Q 160,504 168,504 H 872 Q 880,504 880,496 V 142 Q 880,134 872,134 H 750"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="132" y="176" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="160" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WATCHES</text>

    <rect x="270" y="188" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="302" y="197" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">BYPASSES</text>

    <rect x="286" y="238" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="318" y="247" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">BYPASSES</text>

    <rect x="360" y="420" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="386" y="429" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CREATES</text>

    <rect x="850" y="304" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="876" y="313" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ASSUMES</text>

    <!-- Left zone nodes -->
    <rect x="60" y="112" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EKS Control</text>
    <text x="160" y="152" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Plane</text>

    <rect x="60" y="200" width="200" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="160" y="240" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Karpenter</text>
    <text x="160" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Controller</text>

    <rect x="60" y="328" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="352" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Karpenter</text>
    <text x="160" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Webhook</text>

    <rect x="60" y="416" width="200" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="160" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">IAM Role for</text>
    <text x="160" y="454" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service Account</text>

    <!-- Right zone nodes -->
    <rect x="510" y="112" width="240" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="630" y="139" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EC2 API</text>

    <rect x="510" y="176" width="240" height="44" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="630" y="203" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Auto Scaling Groups</text>

    <rect x="510" y="240" width="240" height="44" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="630" y="267" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Managed Node Groups</text>

    <rect x="510" y="304" width="240" height="44" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="630" y="331" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Security Groups</text>

    <rect x="510" y="368" width="240" height="44" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="630" y="395" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC / Subnets</text>

    <rect x="510" y="432" width="240" height="44" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="630" y="459" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EC2 Instances</text>

    <!-- Legend -->
    <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="560" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="556" x2="168" y2="556" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="176" y="560" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">DIRECT PROVISIONING</text>
    <line x1="420" y1="556" x2="448" y2="556" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="456" y="560" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">BYPASSED BY KARPENTER</text>
    <rect x="700" y="550" width="14" height="10" rx="2" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="722" y="560" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">IAM / SECURITY</text>
  </svg>