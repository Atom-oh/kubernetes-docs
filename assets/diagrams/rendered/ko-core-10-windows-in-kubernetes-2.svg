<?xml version="1.0" encoding="UTF-8"?>
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="win-net-arch-title win-net-arch-desc">
<title id="win-net-arch-title">Windows·Linux 혼합 클러스터 네트워킹</title>
<desc id="win-net-arch-desc">외부 클라이언트의 요청이 로드 밸런서와 Kubernetes 서비스를 거쳐 Linux 포드와 Windows 포드로 분산되고, 두 포드가 서로 다른 OS의 노드에 있어도 클러스터 네트워크로 직접 통신할 수 있음을 보여준다.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
  <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
    <polygon points="8 0, 0 3, 8 6" fill="#545B64"/>
  </marker>
</defs>
