<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2-title t2-desc">
<title id="t2-title">GitOps 기반 카나리 배포 시퀀스</title>
<desc id="t2-desc">개발자의 이미지 태그 업데이트가 FluxCD를 거쳐 쿠버네티스 배포를 갱신하면 Flagger가 트래픽 비율을 늘리며 메트릭을 조회하고, 메트릭이 정상이면 승격하지만 이상이면 롤백한 뒤 결과를 개발자에게 알리는 과정을 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#545B64" stroke-width="1.2"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Lifelines -->
<line x1="96" y1="80" x2="96" y2="664" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="288" y1="80" x2="288" y2="664" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="480" y1="80" x2="480" y2="664" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="672" y1="80" x2="672" y2="664" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="864" y1="80" x2="864" y2="664" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Activation bars -->
<rect x="668" y="184" width="8" height="452" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="860" y="280" width="8" height="192" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- Pre-loop messages -->
<line x1="96" y1="112" x2="288" y2="112" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="120" y="96" width="144" height="12" rx="2" fill="#ffffff"/>
<text x="192" y="105" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">이미지 태그 업데이트</text>

<line x1="288" y1="152" x2="480" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="316" y="136" width="136" height="12" rx="2" fill="#ffffff"/>
<text x="384" y="145" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Deployment 업데이트</text>

<line x1="480" y1="192" x2="672" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="512" y="176" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="576" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">변경 감지</text>

<!-- ALT fragment: spans K8s(480) .. Mesh(864) -->
<rect x="456" y="224" width="432" height="328" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
<rect x="456" y="224" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
<text x="476" y="236" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
<text x="504" y="256" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[메트릭 정상 · 단계별 반복]</text>

<!-- Region 1 messages -->
<line x1="672" y1="288" x2="864" y2="288" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="700" y="272" width="136" height="12" rx="2" fill="#ffffff"/>
<text x="768" y="281" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">트래픽 비율 증가</text>

<line x1="672" y1="328" x2="864" y2="328" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="716" y="312" width="104" height="12" rx="2" fill="#ffffff"/>
<text x="768" y="321" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">메트릭 쿼리</text>

<line x1="864" y1="368" x2="672" y2="368" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
<rect x="716" y="352" width="104" height="12" rx="2" fill="#ffffff"/>
<text x="768" y="361" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">성공 응답</text>

<!-- Divider -->
<line x1="464" y1="408" x2="880" y2="408" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="504" y="432" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else · 메트릭 이상]</text>

<!-- Region 2 messages -->
<line x1="864" y1="460" x2="672" y2="460" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="716" y="444" width="104" height="12" rx="2" fill="#ffffff"/>
<text x="768" y="453" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">실패 응답</text>

<line x1="672" y1="500" x2="480" y2="500" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="500" y="484" width="152" height="12" rx="2" fill="#ffffff"/>
<text x="576" y="493" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Canary 배포 롤백</text>

<!-- Post-loop messages -->
<line x1="672" y1="584" x2="480" y2="584" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="500" y="568" width="152" height="12" rx="2" fill="#ffffff"/>
<text x="576" y="577" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Primary Deployment 갱신</text>

<line x1="672" y1="624" x2="96" y2="624" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
<rect x="320" y="608" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="384" y="617" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">배포 완료 알림</text>

<!-- Actor boxes -->
<rect x="26" y="40" width="140" height="40" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="96" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">개발자</text>

<rect x="218" y="40" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="288" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">FluxCD / Git</text>

<rect x="410" y="40" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Kubernetes</text>

<rect x="602" y="40" width="140" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="672" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Flagger</text>

<rect x="794" y="40" width="140" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="864" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Mesh / 메트릭</text>

<!-- Legend -->
<line x1="32" y1="680" x2="928" y2="680" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<line x1="32" y1="696" x2="60" y2="696" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
<text x="68" y="698" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">헤드라인 성공 응답</text>
<line x1="240" y1="696" x2="268" y2="696" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
<text x="276" y="698" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">비동기 알림</text>
</svg>