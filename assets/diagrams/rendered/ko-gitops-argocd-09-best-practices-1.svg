<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="branchpromo-title branchpromo-desc">
    <title id="branchpromo-title">브랜치 승격과 환경 배포 흐름</title>
    <desc id="branchpromo-desc">develop, staging, main 브랜치가 PR 승인으로 순차 승격되며 각각 Dev·Staging 환경에는 자동 배포되지만 Prod 환경만 수동 동기화로 게이트가 걸려 있음을 보여준다.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Connectors (drawn before boxes) ===== -->
    <!-- top row: Dev -> Staging -> Prod (PR approval) -->
    <path d="M312,172 L392,172" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M568,172 L648,172" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- vertical deploy arrows -->
    <path d="M224,204 L224,340" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M480,204 L480,340" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M736,204 L736,340" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- top-row arrow labels -->
    <rect x="322" y="152" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="352" y="161" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" font-family="'Geist Mono', monospace">PR 승인</text>
    <rect x="578" y="152" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="608" y="161" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" font-family="'Geist Mono', monospace">PR 승인</text>

    <!-- vertical arrow labels (beside the line, 10px gap) -->
    <rect x="234" y="264" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="272" y="273" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" font-family="'Geist Mono', monospace">자동 배포</text>
    <rect x="490" y="264" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="528" y="273" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" font-family="'Geist Mono', monospace">자동 배포</text>
    <rect x="746" y="264" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="790" y="273" fill="#EC7211" font-size="8" text-anchor="middle" letter-spacing="0.06em" font-family="'Geist Mono', monospace">수동 동기화</text>

    <!-- ===== Top row: branches ===== -->
    <g>
      <rect x="136" y="140" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="224" y="168" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">develop 브랜치</text>
      <text x="224" y="184" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">git branch</text>
    </g>
    <g>
      <rect x="392" y="140" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="168" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">staging 브랜치</text>
      <text x="480" y="184" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">git branch</text>
    </g>
    <g>
      <rect x="648" y="140" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="736" y="168" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">main 브랜치</text>
      <text x="736" y="184" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">git branch</text>
    </g>

    <!-- ===== Bottom row: environments ===== -->
    <g>
      <rect x="136" y="340" width="176" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="224" y="368" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Dev 환경</text>
      <text x="224" y="384" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">env: dev</text>
    </g>
    <g>
      <rect x="392" y="340" width="176" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="480" y="368" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Staging 환경</text>
      <text x="480" y="384" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">env: staging</text>
    </g>
    <g>
      <rect x="648" y="340" width="176" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="736" y="368" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Prod 환경</text>
      <text x="736" y="384" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">env: prod</text>
    </g>

    <!-- Legend -->
    <line x1="30" y1="512" x2="930" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="140" cy="524" r="4" fill="#232F3E"/>
    <text x="152" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">브랜치</text>
    <circle cx="240" cy="524" r="4" fill="none" stroke="#545B64" stroke-width="1"/>
    <text x="252" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">배포 환경</text>
    <circle cx="360" cy="524" r="4" fill="#EC7211"/>
    <text x="372" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">수동 승인 게이트</text>
  </svg>