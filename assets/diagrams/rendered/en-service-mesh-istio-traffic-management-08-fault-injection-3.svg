<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cascade-title cascade-desc">
    <title id="cascade-title">Microservice Cascade Failure Test</title>
    <desc id="cascade-desc">Flowchart showing a request path from frontend through order service to a fault-injected payment service, where a 30% failure rate trips a circuit breaker that protects the frontend and lets inventory service keep operating normally.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Arrows drawn first -->
    <!-- Frontend -> OrderService -->
    <line x1="240" y1="280" x2="380" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- OrderService -> Frontend (Circuit Breaker) -->
    <line x1="380" y1="304" x2="240" y2="304" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- OrderService -> PaymentService -->
    <path d="M 580 270 L 645 270 L 645 172 L 720 172" stroke="#545B64" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <!-- PaymentService -> OrderService (30% Failure) -->
    <path d="M 720 184 L 665 184 L 665 304 L 580 304 L 580 304" stroke="#EC7211" stroke-width="1.2" fill="none" marker-end="url(#arrow-accent)"/>
    <!-- OrderService -> InventoryService -->
    <path d="M 480 324 L 480 432 L 720 432" stroke="#545B64" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- Labels -->
    <rect x="254" y="284" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="310" y="293" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CIRCUIT BREAKER</text>

    <rect x="642" y="164" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="678" y="173" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">30% FAIL</text>

    <!-- Nodes -->
    <rect x="60" y="260" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="150" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Frontend</text>

    <rect x="380" y="260" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Order Service</text>

    <rect x="720" y="140" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="820" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Payment Service</text>
    <text x="820" y="184" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Fault Injection</text>

    <rect x="720" y="400" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="820" y="436" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Inventory Service</text>

    <!-- Legend -->
    <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="552" width="24" height="14" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="72" y="563" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Service</text>

    <rect x="180" y="552" width="24" height="14" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="212" y="563" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Fault injection point</text>

    <line x1="420" y1="559" x2="448" y2="559" stroke="#EC7211" stroke-width="1.2"/>
    <text x="456" y="563" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Failure signal</text>
  </svg>