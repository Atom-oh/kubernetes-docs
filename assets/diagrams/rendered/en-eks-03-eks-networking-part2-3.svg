<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Service and Load Balancer Best Practices</title>
<desc id="d">Five best practices for choosing and configuring Kubernetes Services and load balancers on EKS, branching from a single root recommendation: keep traffic internal by default, expose externally with LoadBalancer or Ingress, pick ALB for L7 needs, pick NLB for L4 needs, and tune load balancer attributes for availability and targeting.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<text x="40" y="44" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">TREE · GUIDANCE</text>
<text x="40" y="68" fill="#232F3E" font-size="20" font-weight="700">Service &amp; Load Balancer Best Practices</text>

<!-- root (focal) -->
<rect x="380" y="100" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="480" y="128" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Best Practices</text>
<text x="480" y="146" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">service &amp; LB selection</text>

<!-- bus line at y=196, drops into 5 leaves -->
<path d="M 480,164 V 196" fill="none" stroke="#545B64" stroke-width="1.2"/>
<line x1="112" y1="196" x2="848" y2="196" stroke="#545B64" stroke-width="1.2"/>
<!-- vertical drops to leaves centers: 112,296,480,664,848 -->
<path d="M 112,196 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 296,196 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 480,196 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 664,196 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 848,196 V 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- 5 leaves -->
<rect x="32" y="260" width="160" height="140" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="112" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Default internal</text>
<text x="112" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">ClusterIP for</text>
<text x="112" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">in-cluster traffic;</text>
<text x="112" y="338" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">internal LB for</text>
<text x="112" y="352" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">private-only access</text>

<rect x="216" y="260" width="160" height="140" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="296" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Go external</text>
<text x="296" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">deliberately</text>
<text x="296" y="330" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">LoadBalancer or</text>
<text x="296" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Ingress only for</text>
<text x="296" y="358" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">services needing it</text>

<rect x="400" y="260" width="160" height="140" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Choose ALB</text>
<text x="480" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">for L7 needs</text>
<text x="480" y="330" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">path routing,</text>
<text x="480" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">SSL termination,</text>
<text x="480" y="358" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">authentication</text>

<rect x="584" y="260" width="160" height="140" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="664" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Choose NLB</text>
<text x="664" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">for L4 needs</text>
<text x="664" y="330" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">TCP/UDP traffic,</text>
<text x="664" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">high performance,</text>
<text x="664" y="358" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">static IP</text>

<rect x="768" y="260" width="160" height="140" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="848" y="286" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Tune LB attrs</text>
<text x="848" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">cross-zone LB</text>
<text x="848" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">for HA; pick</text>
<text x="848" y="338" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">the right target</text>
<text x="848" y="352" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">type (ip/instance)</text>

</svg>