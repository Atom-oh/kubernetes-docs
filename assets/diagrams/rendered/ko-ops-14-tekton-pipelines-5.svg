    <title id="ko-ops-14-tekton-pipelines-5-title">Tekton CI에서 ArgoCD CD까지 GitOps 배포 흐름</title>
    <desc id="ko-ops-14-tekton-pipelines-5-desc">소스 저장소의 push가 Tekton CI를 트리거해 클론·테스트·이미지 빌드·ECR Push·매니페스트 업데이트를 거치고, 갱신된 매니페스트가 GitOps 저장소에 커밋되면 ArgoCD가 이를 감지해 ECR 이미지를 pull하여 클러스터에 동기화·배포하는 전체 파이프라인을 보여주는 아키텍처 다이어그램.</desc>
