<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">Cilium architecture: control plane, data plane, and observability</title>
  <desc id="ddesc">The Cilium Agent runs on every node and is managed by the Cilium Operator, which is fronted by the Cilium API Server. The Agent loads eBPF programs into the kernel and reports metrics to the Hubble Server, which the Hubble Relay aggregates cluster-wide for the Hubble UI to visualize.</desc>

  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- header -->
  <text x="20" y="28" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7D8998">KUBERNETES NETWORKING · CILIUM</text>
  <text x="20" y="56" font-size="20" font-weight="700" fill="#232F3E">Cilium Architecture</text>

  <!-- ===================== ZONES (bg -> zones -> arrows -> nodes) ===================== -->
  <!-- Control Plane zone -->
  <rect x="20" y="88" width="280" height="224" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="34" y="92" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="90" y="101" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)" text-anchor="middle">CONTROL PLANE</text>

  <!-- Data Plane zone -->
  <rect x="340" y="88" width="280" height="224" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="354" y="92" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="402" y="101" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)" text-anchor="middle">DATA PLANE</text>

  <!-- Observability zone -->
  <rect x="660" y="88" width="280" height="328" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="674" y="92" width="116" height="12" rx="2" fill="#ffffff"/>
  <text x="732" y="101" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)" text-anchor="middle">OBSERVABILITY</text>

  <!-- ===================== ARROWS ===================== -->

  <!-- 1. API Server -> Operator (vertical, internal control plane) -->
  <line x1="160" y1="184" x2="160" y2="224" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="168" y="198" width="34" height="12" rx="2" fill="#ffffff"/>
  <text x="172" y="207" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">API</text>

  <!-- 2. Operator -> Agent (elbow, right+up, crosses zone gap) -->
  <path d="M270,256 H312 Q320,256 320,248 V160 Q320,152 328,152 H370"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="328" y="198" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="332" y="207" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">MANAGES</text>

  <!-- 3. Agent -> eBPF Programs (vertical, internal data plane) -->
  <line x1="480" y1="184" x2="480" y2="224" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="488" y="198" width="42" height="12" rx="2" fill="#ffffff"/>
  <text x="492" y="207" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">LOADS</text>

  <!-- 4. Agent -> Hubble Server (horizontal, focal outbound, crosses zone gap) -->
  <line x1="590" y1="152" x2="690" y2="152" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="608" y="132" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="640" y="141" class="mono" font-size="8" letter-spacing="0.06em" fill="#EC7211" text-anchor="middle">METRICS</text>

  <!-- 5. Hubble Server -> Hubble Relay (vertical, internal observability) -->
  <line x1="800" y1="184" x2="800" y2="224" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="808" y="198" width="82" height="12" rx="2" fill="#ffffff"/>
  <text x="812" y="207" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">AGGREGATES</text>

  <!-- 6. Hubble Relay -> Hubble UI (vertical, internal observability) -->
  <line x1="800" y1="288" x2="800" y2="328" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="808" y="302" width="78" height="12" rx="2" fill="#ffffff"/>
  <text x="812" y="311" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">VISUALIZES</text>

  <!-- ===================== NODES ===================== -->

  <!-- Cilium API Server -->
  <rect x="50" y="120" width="220" height="64" rx="6" fill="#ffffff"/>
  <rect x="50" y="120" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="58" y="126" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="72" y="135" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)" text-anchor="middle">API</text>
  <text x="160" y="156" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Cilium API Server</text>
  <text x="160" y="172" class="mono" font-size="9" fill="#545B64" text-anchor="middle">cluster-scope API</text>

  <!-- Cilium Operator -->
  <rect x="50" y="224" width="220" height="64" rx="6" fill="#ffffff"/>
  <rect x="50" y="224" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="58" y="230" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="72" y="239" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)" text-anchor="middle">OP</text>
  <text x="160" y="260" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Cilium Operator</text>
  <text x="160" y="276" class="mono" font-size="9" fill="#545B64" text-anchor="middle">cluster-level resources</text>

  <!-- Cilium Agent (focal) -->
  <rect x="370" y="120" width="220" height="64" rx="6" fill="#ffffff"/>
  <rect x="370" y="120" width="220" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="378" y="126" width="30" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.60)" stroke-width="0.8"/>
  <text x="393" y="135" class="mono" font-size="7" letter-spacing="0.08em" fill="#EC7211" text-anchor="middle">AGT</text>
  <text x="480" y="156" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Cilium Agent</text>
  <text x="480" y="172" class="mono" font-size="9" fill="#545B64" text-anchor="middle">runs on every node</text>

  <!-- eBPF Programs -->
  <rect x="370" y="224" width="220" height="64" rx="6" fill="#ffffff"/>
  <rect x="370" y="224" width="220" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="378" y="230" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="393" y="239" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)" text-anchor="middle">BPF</text>
  <text x="480" y="260" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">eBPF Programs</text>
  <text x="480" y="276" class="mono" font-size="9" fill="#545B64" text-anchor="middle">loaded in-kernel</text>

  <!-- Hubble Server -->
  <rect x="690" y="120" width="220" height="64" rx="6" fill="#ffffff"/>
  <rect x="690" y="120" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="698" y="126" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="713" y="135" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)" text-anchor="middle">SRV</text>
  <text x="800" y="156" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Hubble Server</text>
  <text x="800" y="172" class="mono" font-size="9" fill="#545B64" text-anchor="middle">per-node flow export</text>

  <!-- Hubble Relay -->
  <rect x="690" y="224" width="220" height="64" rx="6" fill="#ffffff"/>
  <rect x="690" y="224" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="698" y="230" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="713" y="239" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)" text-anchor="middle">RLY</text>
  <text x="800" y="260" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Hubble Relay</text>
  <text x="800" y="276" class="mono" font-size="9" fill="#545B64" text-anchor="middle">cluster-wide aggregation</text>

  <!-- Hubble UI -->
  <rect x="690" y="328" width="220" height="64" rx="6" fill="#ffffff"/>
  <rect x="690" y="328" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="698" y="334" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="710" y="343" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)" text-anchor="middle">UI</text>
  <text x="800" y="364" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Hubble UI</text>
  <text x="800" y="380" class="mono" font-size="9" fill="#545B64" text-anchor="middle">flow visualization</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="20" y1="544" x2="940" y2="544" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="20" y="560" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>

  <rect x="140" y="552" width="12" height="12" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="160" y="561" font-size="11" fill="#545B64">Per-node core component</text>

  <rect x="380" y="552" width="12" height="12" rx="3" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="400" y="561" font-size="11" fill="#545B64">In-kernel loaded state</text>
</svg>