<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fc4-title fc4-desc">
      <title id="fc4-title">GitOps 도구 선택 흐름도</title>
      <desc id="fc4-desc">웹 UI, 멀티 클러스터 관리, 모듈형 아키텍처, 프로그레시브 딜리버리, CI/CD 통합 요구사항에 따라 ArgoCD, FluxCD, Jenkins X 중 어떤 GitOps 도구를 선택할지 안내하는 의사결정 흐름도이다.</desc>
      <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
        <marker id="s4-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Arrows -->
      <line x1="480" y1="80" x2="480" y2="108" stroke="#545B64" stroke-width="1.2" marker-end="url(#s4-arrow)"/>

      <path d="M404,152 H208 Q200,152 200,160 V228" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#s4-arrow)"/>
      <path d="M556,152 H692 Q700,152 700,160 V228" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#s4-arrow)"/>

      <path d="M276,272 H348 Q356,272 356,280 V464" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#s4-arrow)"/>
      <line x1="200" y1="316" x2="200" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#s4-arrow)"/>
      <path d="M276,384 H396 Q404,384 404,392 V464" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#s4-arrow)"/>
      <line x1="200" y1="428" x2="200" y2="464" stroke="#545B64" stroke-width="1.2" marker-end="url(#s4-arrow)"/>

      <path d="M624,272 H564 Q556,272 556,280 V464" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#s4-arrow)"/>
      <line x1="700" y1="316" x2="700" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#s4-arrow)"/>
      <path d="M776,384 H812 Q820,384 820,392 V464" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#s4-arrow)"/>
      <path d="M624,384 H612 Q604,384 604,392 V464" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#s4-arrow)"/>

      <!-- Edge labels -->
      <rect x="286" y="132" width="40" height="14" rx="2" fill="#ffffff"/>
      <text x="306" y="142" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">예</text>

      <rect x="600" y="132" width="48" height="14" rx="2" fill="#ffffff"/>
      <text x="624" y="142" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">아니오</text>

      <rect x="292" y="252" width="40" height="14" rx="2" fill="#ffffff"/>
      <text x="312" y="262" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">예</text>

      <rect x="208" y="321" width="40" height="14" rx="2" fill="#ffffff"/>
      <text x="228" y="331" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">아니오</text>

      <rect x="316" y="364" width="40" height="14" rx="2" fill="#ffffff"/>
      <text x="336" y="374" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">예</text>

      <rect x="208" y="439" width="40" height="14" rx="2" fill="#ffffff"/>
      <text x="228" y="449" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">아니오</text>

      <rect x="570" y="252" width="48" height="14" rx="2" fill="#ffffff"/>
      <text x="594" y="262" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">예</text>

      <rect x="708" y="321" width="40" height="14" rx="2" fill="#ffffff"/>
      <text x="728" y="331" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">아니오</text>

      <rect x="774" y="364" width="40" height="14" rx="2" fill="#ffffff"/>
      <text x="794" y="374" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">예</text>

      <rect x="612" y="421" width="40" height="14" rx="2" fill="#ffffff"/>
      <text x="632" y="431" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">아니오</text>

      <!-- Start oval -->
      <rect x="400" y="32" width="160" height="48" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="480" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">GitOps 도구 선택</text>

      <!-- Q1 -->
      <polygon points="480,108 556,152 480,196 404,152" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="148" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">웹 UI가</text>
      <text x="480" y="161" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">필요한가?</text>

      <!-- Q2 -->
      <polygon points="200,228 276,272 200,316 124,272" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="200" y="266" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">멀티 클러스터</text>
      <text x="200" y="279" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">관리 필요?</text>

      <!-- Q3 -->
      <polygon points="700,228 776,272 700,316 624,272" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="700" y="266" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">모듈형 아키텍처</text>
      <text x="700" y="279" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">선호?</text>

      <!-- Q4 -->
      <polygon points="200,340 276,384 200,428 124,384" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="200" y="378" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">프로그레시브</text>
      <text x="200" y="391" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">딜리버리 필요?</text>

      <!-- Q5 -->
      <polygon points="700,340 776,384 700,428 624,384" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="700" y="378" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">CI/CD 통합</text>
      <text x="700" y="391" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">필요?</text>

      <!-- Both (result) -->
      <rect x="124" y="464" width="152" height="56" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="200" y="488" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">ArgoCD 또는</text>
      <text x="200" y="502" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">FluxCD</text>

      <!-- ArgoCD (result, focal / hub) -->
      <rect x="304" y="464" width="152" height="56" rx="24" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="380" y="497" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">ArgoCD 추천</text>

      <!-- FluxCD (result) -->
      <rect x="504" y="464" width="152" height="56" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="580" y="497" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">FluxCD 추천</text>

      <!-- Jenkins X (result) -->
      <rect x="744" y="464" width="152" height="56" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="820" y="488" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Jenkins X</text>
      <text x="820" y="502" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">고려</text>

      <!-- Legend -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND · SHAPE CARRIES TYPE</text>
      <polygon points="52,572 60,580 52,588 44,580" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="70" y="584" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">분기 질문 (diamond)</text>
      <rect x="240" y="572" width="24" height="16" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="272" y="584" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">가장 많이 추천되는 도구</text>
    </svg>