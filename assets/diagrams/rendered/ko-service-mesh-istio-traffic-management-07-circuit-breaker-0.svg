<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl0 desc0">
  <title id="ttl0">Circuit Breaker 없이 vs 사용 시 장애 전파 비교</title>
  <desc id="desc0">Circuit Breaker가 없으면 서비스 A의 느린 응답이 서비스 B, C, D로 연쇄적으로 전파되어 모두 장애 상태가 되지만, Circuit Breaker를 사용하면 서비스 A가 장애 서비스 B를 향해 빠르게 실패 처리하고 서비스 C, D는 정상 동작을 유지한다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-fail" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DD344C"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- eyebrow / title -->
  <text x="32" y="32" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.18em">FLOWCHART</text>
  <text x="32" y="56" fill="#232F3E" font-size="20" font-weight="700">Cascading Failure 방지</text>

  <!-- Zone: Without -->
  <rect x="32" y="88" width="896" height="196" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="44" y="92" width="176" height="16" rx="2" fill="#ffffff"/>
  <text x="132" y="104" fill="rgba(221,52,76,0.75)" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.10em">CIRCUIT BREAKER 없이</text>

  <!-- Zone: With -->
  <rect x="32" y="308" width="896" height="196" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="44" y="312" width="176" height="16" rx="2" fill="#ffffff"/>
  <text x="132" y="324" fill="rgba(236,114,17,0.85)" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.10em">CIRCUIT BREAKER 사용</text>

  <!-- ===== WITHOUT: edges (drawn before boxes) ===== -->
  <!-- A1 -> B1: 느린 응답 (up-right elbow, A1 top edge to B1 left edge) -->
  <path d="M150,180 V164 Q150,156 158,156 H280" fill="none" stroke="#DD344C" stroke-width="1.2" marker-end="url(#arrow-fail)"/>
  <rect x="182" y="140" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="214" y="149" fill="#DD344C" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">느린 응답</text>

  <!-- A1 -> C1: 타임아웃 누적 (straight horizontal, center height) -->
  <path d="M180,208 H468" fill="none" stroke="#DD344C" stroke-width="1.2" marker-end="url(#arrow-fail)"/>
  <rect x="282" y="192" width="84" height="12" rx="2" fill="#ffffff"/>
  <text x="324" y="201" fill="#DD344C" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">타임아웃 누적</text>

  <!-- A1 self-loop: 리소스 고갈 (below A1) -->
  <path d="M100,236 C100,260 140,260 140,236" fill="none" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-fail)"/>
  <rect x="86" y="260" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="122" y="269" fill="#DD344C" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">리소스 고갈</text>

  <!-- C1 -> D1: 연쇄 장애 (straight horizontal) -->
  <path d="M588,208 H700" fill="none" stroke="#DD344C" stroke-width="1.2" marker-end="url(#arrow-fail)"/>
  <rect x="610" y="192" width="68" height="12" rx="2" fill="#ffffff"/>
  <text x="644" y="201" fill="#DD344C" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">연쇄 장애</text>

  <!-- ===== WITHOUT: nodes ===== -->
  <!-- A1 -->
  <rect x="60" y="180" width="120" height="56" rx="6" fill="#ffffff"/>
  <rect x="60" y="180" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="120" y="212" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">서비스 A</text>
  <!-- B1 -->
  <rect x="280" y="124" width="120" height="56" rx="6" fill="rgba(221,52,76,0.05)"/>
  <rect x="280" y="124" width="120" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="340" y="148" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">서비스 B</text>
  <text x="340" y="164" fill="#DD344C" font-size="9" class="mono" text-anchor="middle">장애</text>
  <!-- C1 -->
  <rect x="468" y="180" width="120" height="56" rx="6" fill="rgba(221,52,76,0.05)"/>
  <rect x="468" y="180" width="120" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="528" y="204" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">서비스 C</text>
  <text x="528" y="220" fill="#DD344C" font-size="9" class="mono" text-anchor="middle">장애</text>
  <!-- D1 -->
  <rect x="700" y="180" width="120" height="56" rx="6" fill="rgba(221,52,76,0.05)"/>
  <rect x="700" y="180" width="120" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="760" y="204" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">서비스 D</text>
  <text x="760" y="220" fill="#DD344C" font-size="9" class="mono" text-anchor="middle">장애</text>

  <!-- ===== WITH: edges ===== -->
  <!-- A2 -> B2: 빠른 실패 (up-right elbow) -->
  <path d="M150,400 V384 Q150,376 158,376 H280" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="182" y="360" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="214" y="369" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">빠른 실패</text>

  <!-- A2 -> C2: 정상 동작 -->
  <path d="M180,428 H468" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="290" y="412" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="322" y="421" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">정상 동작</text>

  <!-- C2 -> D2: 정상 동작 -->
  <path d="M588,428 H700" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="610" y="412" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="642" y="421" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">정상 동작</text>

  <!-- ===== WITH: nodes ===== -->
  <!-- A2 -->
  <rect x="60" y="400" width="120" height="56" rx="6" fill="#ffffff"/>
  <rect x="60" y="400" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="120" y="432" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">서비스 A</text>
  <!-- B2 (focal: Circuit Open) -->
  <rect x="280" y="344" width="120" height="56" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="280" y="344" width="120" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="340" y="368" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">서비스 B</text>
  <text x="340" y="384" fill="#EC7211" font-size="9" class="mono" text-anchor="middle">CIRCUIT OPEN</text>
  <!-- C2 -->
  <rect x="468" y="400" width="120" height="56" rx="6" fill="#ffffff"/>
  <rect x="468" y="400" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="528" y="424" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">서비스 C</text>
  <text x="528" y="440" fill="#545B64" font-size="9" class="mono" text-anchor="middle">정상</text>
  <!-- D2 -->
  <rect x="700" y="400" width="120" height="56" rx="6" fill="#ffffff"/>
  <rect x="700" y="400" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="760" y="424" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">서비스 D</text>
  <text x="760" y="440" fill="#545B64" font-size="9" class="mono" text-anchor="middle">정상</text>

  <!-- Legend -->
  <line x1="32" y1="540" x2="928" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="32" y="556" width="12" height="12" rx="2" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="52" y="566" fill="#545B64" font-size="9" class="mono">장애 상태</text>
  <rect x="152" y="556" width="12" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="172" y="566" fill="#545B64" font-size="9" class="mono">Circuit Breaker 격리 지점</text>
</svg>