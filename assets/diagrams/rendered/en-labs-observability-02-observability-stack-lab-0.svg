<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="otel-pipeline-title otel-pipeline-desc">
    <title id="otel-pipeline-title">OpenTelemetry collector pipeline feeding multi-backend observability stores</title>
    <desc id="otel-pipeline-desc">Applications, Kubernetes, and infrastructure data sources flow through an OTel Collector pipeline of receivers, processors, and exporters, which routes to separate metrics, logs, and traces backends, all visualized together in Grafana.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ ZONES (bg -> zones -> arrows -> nodes) ============ -->
    <rect x="48" y="152" width="864" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="368" y="156" width="224" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="165" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OTEL COLLECTOR PIPELINE</text>

    <rect x="24" y="340" width="912" height="148" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="380" y="344" width="200" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="353" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OBSERVABILITY BACKENDS</text>

    <!-- ============ ARROWS (drawn before boxes) ============ -->

    <!-- Sources -> Receivers -->
    <path d="M480,104 V136 Q480,144 472,144 H208 Q200,144 200,152 V184" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Receivers -> Processors -->
    <line x1="320" y1="216" x2="360" y2="216" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Processors -> Exporters -->
    <line x1="600" y1="216" x2="640" y2="216" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Exporters -> Metrics / Logs / Traces (fanned attach points on Exporters bottom edge: 700, 760, 820) -->
    <path d="M700,248 V264 Q700,272 692,272 H188 Q180,272 180,280 V372" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M760,248 V296 Q760,304 752,304 H488 Q480,304 480,312 V372" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M820,248 V328 Q820,336 812,336 H788 Q780,336 780,344 V372" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Metrics / Logs / Traces -> Visualization (fanned attach points on Visualization top edge: 420, 480, 540) -->
    <path d="M180,468 V480 Q180,488 188,488 H412 Q420,488 420,496 V520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="468" x2="480" y2="520" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M780,468 V496 Q780,504 772,504 H548 Q540,504 540,512 V520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow label: multi-backend routing (on the accent line, vertical segment near x=760) -->
    <rect x="762" y="270" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="798" y="279" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAN-OUT</text>

    <!-- ============ NODES ============ -->

    <!-- Sources -->
    <rect x="340" y="40" width="280" height="64" rx="6" fill="#ffffff"/>
    <rect x="340" y="40" width="280" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="348" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="362" y="57" fill="rgba(125,137,152,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
    <text x="480" y="76" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Data Sources</text>
    <text x="480" y="92" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Applications &#183; Kubernetes &#183; Infrastructure</text>

    <!-- Receivers -->
    <rect x="80" y="184" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="80" y="184" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Receivers</text>
    <text x="200" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OTLP &#183; Prometheus &#183; Fluent</text>

    <!-- Processors -->
    <rect x="360" y="184" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="360" y="184" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Processors</text>
    <text x="480" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Batch &#183; Memory Limit &#183; Attributes</text>

    <!-- Exporters (focal) -->
    <rect x="640" y="184" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="640" y="184" width="240" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="760" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Exporters</text>
    <text x="760" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Multi-backend routing</text>

    <!-- Metrics -->
    <rect x="50" y="372" width="260" height="96" rx="6" fill="#ffffff"/>
    <rect x="50" y="372" width="260" height="96" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="180" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics</text>
    <text x="180" y="412" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Prometheus &#183; VictoriaMetrics</text>
    <text x="180" y="426" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Mimir &#183; AWS AMP</text>

    <!-- Logs -->
    <rect x="350" y="372" width="260" height="96" rx="6" fill="#ffffff"/>
    <rect x="350" y="372" width="260" height="96" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Logs</text>
    <text x="480" y="412" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Loki &#183; ClickHouse &#183; OpenSearch</text>
    <text x="480" y="426" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CloudWatch Logs</text>

    <!-- Traces -->
    <rect x="650" y="372" width="260" height="96" rx="6" fill="#ffffff"/>
    <rect x="650" y="372" width="260" height="96" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="780" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Traces</text>
    <text x="780" y="412" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tempo &#183; X-Ray</text>

    <!-- Visualization -->
    <rect x="360" y="520" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="360" y="520" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="548" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Visualization</text>
    <text x="480" y="564" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Grafana &#183; AWS AMG</text>
  </svg>