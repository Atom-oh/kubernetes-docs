<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 340" role="img" aria-labelledby="xffs3-title xffs3-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="xffs3-title">XFF chain through CloudFront, an L4 NLB, and an ALB</title>
    <desc id="xffs3-desc">Flowchart showing a client request passing through CloudFront, an AWS NLB, and an AWS ALB before reaching the Istio Gateway and application, highlighting that the L4 NLB passes the header through unchanged while CloudFront and the ALB each add a hop.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="340" fill="#ffffff"/>

    <!-- 6 nodes width112 gap32 y132 h64; x:64,208,352,496,640,784 -->
    <path d="M176,164 H208" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="180" y="140" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="194" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+0</text>

    <path d="M320,164 H352" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="324" y="140" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="338" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+1</text>

    <!-- NLB -> ALB: L4, dashed, no XFF change -->
    <path d="M464,164 H496" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="464" y="140" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="478" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">L4</text>

    <path d="M608,164 H640" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="612" y="140" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="626" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+1</text>

    <path d="M752,164 H784" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="756" y="140" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="770" y="149" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+2</text>

    <!-- nodes -->
    <g><rect x="8" y="132" width="112" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="#7D8998" stroke-width="1"/>
      <text x="64" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
      <text x="64" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">203.0.113.5</text></g>
    <g><rect x="152" y="132" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="208" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudFront</text>
      <text x="208" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">172.64.0.1</text></g>
    <g><rect x="296" y="132" width="112" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="352" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS NLB</text>
      <text x="352" y="176" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L4 · no XFF</text></g>
    <g><rect x="440" y="132" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="496" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS ALB</text>
      <text x="496" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.1.100</text></g>
    <g><rect x="584" y="132" width="112" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="640" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio Gateway</text>
      <text x="640" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.2.50</text></g>
    <g><rect x="728" y="132" width="112" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="784" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text></g>

    <line x1="30" y1="240" x2="930" y2="240" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="258" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="130" y1="254" x2="160" y2="254" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="168" y="258" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">L7 hop adds to XFF</text>
    <line x1="330" y1="254" x2="360" y2="254" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="368" y="258" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">L4 passthrough, header unchanged</text>
    <line x1="640" y1="254" x2="670" y2="254" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="678" y="258" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">xff_num_trusted_hops: 2</text>
  </svg>