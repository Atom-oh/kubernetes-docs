<title id="en-service-mesh-istio-comparison-01-service-mesh-comparison-8-title">Kuma Data Plane Lifecycle</title>
<desc id="en-service-mesh-istio-comparison-01-service-mesh-comparison-8-desc">Flowchart of a Kuma data plane proxy&#x27;s lifecycle: it initializes and registers with the Zone Control Plane, receives xDS configuration, runs traffic proxying with hot-reloadable updates, and drains connections on shutdown.</desc>
