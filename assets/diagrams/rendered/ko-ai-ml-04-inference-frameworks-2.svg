<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="dyn-title dyn-desc">
    <title id="dyn-title">NVIDIA Dynamo 배포: Prefill/Decode 분리</title>
    <desc id="dyn-desc">클라이언트 요청이 KV 인식 라우터를 통해 Prefill 워커로 전달되고, 분산 KV 캐시를 거쳐 Decode 워커로 이어지며, 각 워커가 vLLM·SGLang·TensorRT-LLM 백엔드에서 실행되는 Dynamo의 prefill/decode 분리 구조를 보여주는 다이어그램.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Prefill pool -->
    <rect x="228" y="96" width="180" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="272" y="100" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="318" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">PREFILL 풀</text>

    <!-- Zone: Decode pool -->
    <rect x="588" y="96" width="180" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="632" y="100" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="678" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">DECODE 풀</text>

    <!-- Arrows -->
    <!-- Client -> Router -->
    <line x1="40" y1="228" x2="80" y2="228" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Router -> Prefill (accent, primary path) -->
    <path d="M 220,228 H 260 Q 268,228 268,220 V 196" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Prefill -> KV cache -->
    <path d="M 318,196 V 236 Q 318,244 326,244 H 388" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- KV cache -> Decode (accent, primary path) -->
    <path d="M 572,260 H 620 Q 628,260 628,252 V 196" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Prefill -> vLLM backend -->
    <path d="M 268,196 V 292 Q 268,300 276,300 H 441 Q 449,300 449,308 V 352" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- Decode -> SGLang backend -->
    <path d="M 628,196 V 312 Q 628,320 620,320 H 506 Q 498,320 498,328 V 352" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- Decode -> TensorRT-LLM backend -->
    <path d="M 680,196 V 332 Q 680,340 672,340 H 555 Q 547,340 547,348 V 352" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="326" y="218" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="352" y="227" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">KV WRITE</text>

    <rect x="596" y="234" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="622" y="243" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">KV READ</text>

    <!-- Nodes -->
    <!-- Client -->
    <rect x="40" y="196" width="128" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="196" width="128" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="104" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">클라이언트</text>
    <text x="104" y="240" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">추론 요청</text>

    <!-- Router (focal) -->
    <rect x="196" y="196" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="196" y="196" width="112" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="252" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Dynamo 라우터</text>
    <text x="252" y="236" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">KV 인식 라우팅</text>

    <!-- Prefill worker -->
    <rect x="252" y="132" width="132" height="64" rx="6" fill="#ffffff"/>
    <rect x="252" y="132" width="132" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="318" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Prefill 워커</text>
    <text x="318" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">8x A100 · 고대역폭</text>

    <!-- KV cache store -->
    <rect x="388" y="228" width="184" height="64" rx="6" fill="#ffffff"/>
    <rect x="388" y="228" width="184" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">분산 KV 캐시</text>
    <text x="480" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">KV 전송 서비스</text>

    <!-- Decode worker -->
    <rect x="612" y="132" width="132" height="64" rx="6" fill="#ffffff"/>
    <rect x="612" y="132" width="132" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="678" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Decode 워커</text>
    <text x="678" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">4x A10G · 비용 최적화</text>

    <!-- Backends -->
    <rect x="400" y="352" width="196" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="352" width="196" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="498" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">추론 백엔드</text>
    <text x="498" y="396" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">vLLM · SGLang · TensorRT-LLM</text>

    <!-- Legend -->
    <line x1="40" y1="460" x2="920" y2="460" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="488" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="496" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">라우터 (focal)</text>

    <rect x="220" y="488" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="496" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">GPU 워커</text>

    <rect x="360" y="488" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="380" y="496" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">캐시 / 스토어</text>

    <line x1="520" y1="494" x2="548" y2="494" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="556" y="496" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">주요 요청 경로</text>

    <line x1="700" y1="494" x2="728" y2="494" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="736" y="496" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">백엔드 실행</text>
  </svg>