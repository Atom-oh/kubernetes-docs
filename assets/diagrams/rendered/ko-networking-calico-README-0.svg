<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
    <title id="d0-title">Calico 핵심 가치</title>
    <desc id="d0-desc">고성능, 강력한 보안, 대규모 확장성, 유연성이라는 Calico의 4가지 핵심 가치가 모두 엔터프라이즈 프로덕션 환경이라는 하나의 결과로 모인다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone -->
    <rect x="24" y="64" width="912" height="144" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="404" y="68" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CALICO 핵심 가치</text>

    <!-- Arrows (before boxes) -->
    <!-- stems: on-axis vertical, box bottom (160) to bus (224) -->
    <line x1="144" y1="160" x2="144" y2="224" stroke="#545B64" stroke-width="1"/>
    <line x1="368" y1="160" x2="368" y2="224" stroke="#545B64" stroke-width="1"/>
    <line x1="592" y1="160" x2="592" y2="224" stroke="#545B64" stroke-width="1"/>
    <line x1="816" y1="160" x2="816" y2="224" stroke="#545B64" stroke-width="1"/>
    <!-- collector bus -->
    <line x1="144" y1="224" x2="816" y2="224" stroke="#545B64" stroke-width="1"/>
    <!-- trunk: bus -> USE (accent, single consolidated outcome) -->
    <line x1="480" y1="224" x2="480" y2="272" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- merge dot -->
    <circle cx="480" cy="224" r="4" fill="#232F3E"/>

    <!-- Feature boxes -->
    <!-- PERF -->
    <rect x="44" y="96" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="52" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="66" y="113" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRF</text>
    <text x="144" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">고성능</text>
    <text x="144" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BGP / eBPF 기반</text>

    <!-- SEC -->
    <rect x="268" y="96" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="276" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="290" y="113" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEC</text>
    <text x="368" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">강력한 보안</text>
    <text x="368" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L3-L7 Policy</text>

    <!-- SCALE -->
    <rect x="492" y="96" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="500" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="514" y="113" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCL</text>
    <text x="592" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">대규모 확장성</text>
    <text x="592" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">수천 노드 지원</text>

    <!-- FLEX -->
    <rect x="716" y="96" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="724" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="738" y="113" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FLX</text>
    <text x="816" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">유연성</text>
    <text x="816" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">멀티 환경 지원</text>

    <!-- USE (focal outcome) -->
    <rect x="360" y="272" width="240" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="368" y="280" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="384" y="289" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
    <text x="480" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">엔터프라이즈</text>
    <text x="480" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">프로덕션 환경</text>

    <!-- Legend -->
    <line x1="24" y1="500" x2="936" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="24" y="532" width="24" height="12" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="56" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">핵심 가치</text>

    <rect x="180" y="532" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="212" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">엔터프라이즈 결과</text>

    <circle cx="356" cy="538" r="4" fill="#232F3E"/>
    <text x="368" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">합류점 (merge)</text>
  </svg>