<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authz-title authz-desc">
  <title id="authz-title">Linkerd 인가 정책 모델</title>
  <desc id="authz-desc">Server가 정의한 인바운드 포트에 ServerAuthorization이 접근 권한을 부여하고, AuthorizationPolicy가 이를 적용해 default-deny 또는 default-allow 모드로 귀결되는 정책 적용 순서를 보여준다.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="40" y="100" width="880" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="404" y="104" width="152" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="113" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AUTHORIZATION MODEL</text>

  <rect x="40" y="320" width="880" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="424" y="324" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="333" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">POLICY MODES</text>

  <!-- Arrows row 1 -->
  <line x1="240" y1="180" x2="380" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="180" x2="720" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrows down to policy modes (AP -> DENY / AP -> ALLOW), fanned + rounded elbows -->
  <path d="M 760,208 V 262 Q 760,270 752,270 H 268 Q 260,270 260,278 V 356"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 800,208 V 286 Q 800,294 792,294 H 728 Q 720,294 720,302 V 356"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Nodes row 1 -->
  <g>
    <rect x="80" y="152" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Server</text>
    <text x="160" y="192" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">인바운드 포트 정의</text>
  </g>
  <g>
    <rect x="380" y="152" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">ServerAuthorization</text>
    <text x="480" y="192" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">접근 권한 정의</text>
  </g>
  <g>
    <rect x="720" y="152" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="720" y="152" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="800" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">AuthorizationPolicy</text>
    <text x="800" y="192" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">정책 적용</text>
  </g>

  <!-- Nodes row 2 -->
  <g>
    <rect x="140" y="356" width="240" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="260" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">default-deny</text>
    <text x="260" y="396" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">명시적 허용만 (권장)</text>
  </g>
  <g>
    <rect x="600" y="356" width="240" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="720" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">default-allow</text>
    <text x="720" y="396" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">명시적 거부만</text>
  </g>

  <!-- Legend -->
  <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <circle cx="220" cy="548" r="4.5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="232" y="551" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif">정책이 실제로 적용되는 지점</text>
  <circle cx="500" cy="548" r="4.5" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="512" y="551" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif">두 정책 모드 중 하나로 귀결</text>
</svg>