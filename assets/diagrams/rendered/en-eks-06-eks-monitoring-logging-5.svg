<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ts-map-title ts-map-desc">
      <title id="ts-map-title">EKS troubleshooting areas mapped to their debugging tool categories</title>
      <desc id="ts-map-desc">Cluster issues, workload issues, and common failure patterns each draw on a mix of Kubernetes CLI tools, AWS tools, and network diagnostic tools to investigate and resolve.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- ================= ZONES ================= -->
      <rect x="88" y="44" width="288" height="424" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="92" y="48" width="176" height="12" rx="2" fill="#ffffff"/>
      <text x="180" y="57" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">TROUBLESHOOTING AREAS</text>

      <rect x="600" y="44" width="272" height="424" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="604" y="48" width="128" height="12" rx="2" fill="#ffffff"/>
      <text x="668" y="57" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">DEBUGGING TOOLS</text>

      <!-- ================= ARROWS ================= -->
      <!-- Cluster Issues (source right edge x=360, fanned y=92/104/118) -> K8s Tools, AWS Tools, Network Tools -->
      <path d="M360,92 H616" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M360,104 H404 Q412,104 412,112 V203 Q412,211 420,211 H616" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M360,118 H420 Q428,118 428,126 V338 Q428,346 436,346 H616" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- Workload Issues (source, fanned y=207/225) -> K8s Tools, Network Tools -->
      <path d="M360,207 H436 Q444,207 444,199 V116 Q444,108 452,108 H616" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M360,225 H452 Q460,225 460,233 V352 Q460,360 468,360 H616" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Common Problems (source, fanned y=314/328/342) -> K8s Tools, AWS Tools, Network Tools -->
      <path d="M360,314 H468 Q476,314 476,306 V130 Q476,122 484,122 H616" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M360,328 H484 Q492,328 492,320 V237 Q492,229 500,229 H616" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M360,342 H500 Q508,342 508,350 V366 Q508,374 516,374 H616" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ================= NODES ================= -->
      <!-- Cluster Issues -->
      <rect x="104" y="76" width="256" height="56" rx="6" fill="#ffffff"/>
      <rect x="104" y="76" width="256" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="112" y="82" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="127" y="91" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLU</text>
      <text x="232" y="108" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cluster Issues</text>
      <text x="232" y="124" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">control plane, node, network, auth</text>

      <!-- Workload Issues -->
      <rect x="104" y="188" width="256" height="56" rx="6" fill="#ffffff"/>
      <rect x="104" y="188" width="256" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="112" y="194" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="127" y="203" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WKL</text>
      <text x="232" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Workload Issues</text>
      <text x="232" y="236" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod, service, deployment, resource</text>

      <!-- Common Problems (FOCAL) -->
      <rect x="104" y="300" width="256" height="56" rx="6" fill="#ffffff"/>
      <rect x="104" y="300" width="256" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <rect x="112" y="306" width="30" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
      <text x="127" y="315" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CMN</text>
      <text x="232" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Common Problems</text>
      <text x="232" y="348" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ImagePullBackOff, CrashLoop, …</text>

      <!-- Kubernetes Tools -->
      <rect x="616" y="80" width="240" height="56" rx="6" fill="#ffffff"/>
      <rect x="616" y="80" width="240" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <rect x="624" y="86" width="30" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
      <text x="639" y="95" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">K8S</text>
      <text x="736" y="108" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes Tools</text>
      <text x="736" y="124" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl debug / events / logs</text>

      <!-- AWS Tools -->
      <rect x="616" y="192" width="240" height="56" rx="6" fill="#ffffff"/>
      <rect x="616" y="192" width="240" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <rect x="624" y="198" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="639" y="207" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AWS</text>
      <text x="736" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS Tools</text>
      <text x="736" y="236" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CLI, CloudWatch, CloudTrail, X-Ray</text>

      <!-- Network Tools -->
      <rect x="616" y="332" width="240" height="56" rx="6" fill="#ffffff"/>
      <rect x="616" y="332" width="240" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="624" y="338" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="639" y="347" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NET</text>
      <text x="736" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Network Tools</text>
      <text x="736" y="376" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">netshoot, tcpdump, dig, curl</text>

      <!-- ================= LEGEND ================= -->
      <line x1="30" y1="500" x2="930" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="30" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="220" cy="512" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="232" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Focal — reaches all three tool families</text>
      <circle cx="560" cy="512" r="5" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="572" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Troubleshooting area / tool family</text>
    </svg>