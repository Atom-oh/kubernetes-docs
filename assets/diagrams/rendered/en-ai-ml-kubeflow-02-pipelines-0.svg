<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Kubeflow Pipelines: from Python DSL to running pods</title>
<desc id="d">A pipeline diagram showing how a Kubeflow Pipelines Python DSL definition is compiled to IR YAML, submitted to the KFP API server, translated to an Argo Workflow, executed as component pods, and how those pods write artifacts to object storage and record execution and artifact metadata in ML Metadata (MLMD).</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs><defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#FFFFFF"/>

<!-- Eyebrow -->
<text x="30" y="32" fill="#7D8998" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" letter-spacing="0.18em" font-weight="500">KUBEFLOW PIPELINES &#8226; FROM DSL TO RUNNING PODS</text>
<line x1="30" y1="44" x2="930" y2="44" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>

<!-- ===== Connectors (drawn first) ===== -->
<!-- Row 1 forward chain: A-B-C-D -->
<line x1="210" y1="140" x2="270" y2="140" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="450" y1="140" x2="510" y2="140" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="690" y1="140" x2="750" y2="140" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- D -> E straight vertical drop (same column) -->
<line x1="840" y1="180" x2="840" y2="420" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Row 2 reverse chain: E-F-G-H -->
<line x1="750" y1="460" x2="690" y2="460" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="510" y1="460" x2="450" y2="460" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<line x1="270" y1="460" x2="210" y2="460" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- F -> H skip route, elbowed below row 2 to clear G -->
<path d="M 600 500 L 600 544 Q 600 552 592 552 L 128 552 Q 120 552 120 544 L 120 500"
      fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Arrow label chips -->
<rect x="452" y="453" width="56" height="13" rx="2" fill="#FFFFFF"/>
<text x="480" y="462.5" fill="#EC7211" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.02em">artifacts</text>

<rect x="332" y="545.5" width="60" height="13" rx="2" fill="#FFFFFF"/>
<text x="362" y="555" fill="#545B64" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.02em">metadata</text>

<!-- ===== Nodes ===== -->
<!-- A: Python pipeline -->
<rect x="30" y="100" width="180" height="80" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="120" y="136" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Python Pipeline</text>
<text x="120" y="151" fill="#545B64" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">@dsl.pipeline /</text>
<text x="120" y="162" fill="#545B64" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">@dsl.component</text>

<!-- B: KFP SDK Compiler -->
<rect x="270" y="100" width="180" height="80" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="360" y="136" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">KFP SDK Compiler</text>
<text x="360" y="156" fill="#545B64" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">produces IR YAML</text>

<!-- C: KFP API Server -->
<rect x="510" y="100" width="180" height="80" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="600" y="136" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">KFP API Server</text>
<text x="600" y="151" fill="#545B64" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">stores pipeline,</text>
<text x="600" y="162" fill="#545B64" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">accepts run</text>

<!-- D: Backend translator -->
<rect x="750" y="100" width="180" height="80" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="840" y="136" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Backend Translator</text>
<text x="840" y="151" fill="#545B64" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">IR YAML &#8594;</text>
<text x="840" y="162" fill="#545B64" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">Argo Workflow</text>

<!-- E: Argo Workflow Controller -->
<rect x="750" y="420" width="180" height="80" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="840" y="456" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Argo Workflow</text>
<text x="840" y="470" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Controller</text>
<text x="840" y="486" fill="#545B64" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">schedules steps</text>

<!-- F: Component Pods (focal) -->
<rect x="510" y="420" width="180" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="600" y="456" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Component Pods</text>
<text x="600" y="476" fill="#545B64" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">execute</text>

<!-- G: Object store -->
<rect x="270" y="420" width="180" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="360" y="456" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Object Store</text>
<text x="360" y="476" fill="#545B64" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">artifacts: S3 / MinIO</text>

<!-- H: MLMD -->
<rect x="30" y="420" width="180" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="120" y="456" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">ML Metadata (MLMD)</text>
<text x="120" y="471" fill="#545B64" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">execution + artifact</text>
<text x="120" y="482" fill="#545B64" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">metadata</text>

<!-- Legend -->
<line x1="30" y1="580" x2="930" y2="580" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="30" y="558" width="20" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="58" y="568" fill="#545B64" font-size="8.5" text-anchor="start">Focal: pod execution step</text>
</svg>