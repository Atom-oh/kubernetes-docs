<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workload-placement-ttl workload-placement-desc">
  <title id="workload-placement-ttl">HPA 다운스케일 시 Pod 삭제 순서와 Karpenter 노드 회수 흐름</title>
  <desc id="workload-placement-desc">트래픽이 줄어 HPA가 스케일 다운되면 deletion-cost 값에 따라 삭제 순서가 갈린다. deletion-cost=0인 클라우드 Pod가 먼저 삭제되고, deletion-cost=1000인 온프레미스 Pod는 유지된다. 클라우드 Pod가 모두 사라져 클라우드 노드가 비면 Karpenter가 그 빈 노드를 제거한다.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#545B64"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- ============ A: start oval ============ -->
  <ellipse cx="480" cy="40" rx="88" ry="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="45" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">트래픽 감소</text>

  <!-- A -> B -->
  <line x1="480" y1="64" x2="480" y2="88" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============ B: step ============ -->
  <rect x="380" y="88" width="200" height="48" rx="6" fill="#ffffff"/>
  <rect x="380" y="88" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="116" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">HPA 스케일 다운</text>

  <!-- B -> C -->
  <line x1="480" y1="136" x2="480" y2="164" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============ C: decision diamond ============ -->
  <polygon points="480,164 580,210 480,256 380,210" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="206" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">Pod 삭제</text>
  <text x="480" y="221" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">순서</text>

  <!-- C -> D (left vertex, elbow r=8) -->
  <path d="M 380 210 L 298 210 Q 290 210 290 218 L 290 300" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="309" y="190" width="60" height="14" rx="2" fill="#ffffff"/>
  <text x="339" y="200" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">COST=0</text>

  <!-- C -> E (right vertex, elbow r=8) -->
  <path d="M 580 210 L 662 210 Q 670 210 670 218 L 670 300" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="591" y="190" width="80" height="14" rx="2" fill="#ffffff"/>
  <text x="631" y="200" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">COST=1000</text>

  <!-- ============ D: focal — cloud pod deleted first ============ -->
  <rect x="190" y="300" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="190" y="300" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="290" y="323" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">클라우드 Pod</text>
  <text x="290" y="339" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">먼저 삭제</text>
  <text x="290" y="354" text-anchor="middle" class="mono" font-size="9" fill="#545B64">deletion-cost: 0</text>

  <!-- ============ E: on-prem pod kept (terminal) ============ -->
  <rect x="570" y="300" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="670" y="323" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">온프레미스 Pod</text>
  <text x="670" y="339" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">유지</text>
  <text x="670" y="354" text-anchor="middle" class="mono" font-size="9" fill="#545B64">deletion-cost: 1000</text>

  <!-- D -> F -->
  <line x1="290" y1="364" x2="290" y2="396" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============ F: cloud node emptied ============ -->
  <rect x="190" y="396" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="290" y="414" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">클라우드 노드</text>
  <text x="290" y="429" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">비어짐</text>

  <!-- F -> G -->
  <line x1="290" y1="444" x2="290" y2="476" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============ G: focal — Karpenter reclaims empty node ============ -->
  <rect x="190" y="476" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="190" y="476" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="290" y="500" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">Karpenter</text>
  <text x="290" y="516" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#232F3E">빈 노드 제거</text>

  <!-- ============ legend ============ -->
  <line x1="30" y1="560" x2="930" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="580" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <rect x="120" y="571" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="142" y="582" class="mono" font-size="9" fill="#545B64">비용 최적화 핵심 동작</text>
  <rect x="330" y="571" width="14" height="14" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="352" y="582" class="mono" font-size="9" fill="#545B64">일반 단계 / 유지 상태</text>
</svg>