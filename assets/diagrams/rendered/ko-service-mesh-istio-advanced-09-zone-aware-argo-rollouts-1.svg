<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zone-rollout-arch-title zone-rollout-arch-desc">
<title id="zone-rollout-arch-title">Zone-Aware Argo Rollouts 전체 아키텍처</title>
<desc id="zone-rollout-arch-desc">클라이언트가 단일 VirtualService를 호출하고, DestinationRule의 locality 설정에 따라 각 Zone의 독립적인 Rollout이 관리하는 stable/canary Pod로 트래픽이 분배되는 구조를 보여줍니다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ============ ISTIO CONTROL PLANE ZONE (painted before arrows/nodes) ============ -->
<rect x="316" y="80" width="360" height="116" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="332" y="84" width="152" height="12" fill="#ffffff"/>
<text x="408" y="93" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ISTIO CONTROL PLANE</text>

<!-- ============ ARROWS (drawn first, boxes drawn after) ============ -->

<!-- Clients -> VS (enters VS left edge, roughly horizontal) -->
<path d="M 200,122 H 332 Q 340,122 340,130 V 140" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="228" y="100" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="268" y="109" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">test.default</text>

<!-- DR -.-> VS (dashed, locality setting): DR left edge -> VS right edge, same height, plain line -->
<line x1="576" y1="140" x2="460" y2="140" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="480" y="120" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="516" y="129" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">LOCALITY LB</text>

<!-- VS -> Zone A/B/C pods (solid, weighted split) — 3 fanned exit points on VS bottom edge, offset 12px above each dashed pair -->
<path d="M 346,196 V 264 Q 346,272 338,272 H 208" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 382,196 V 320 Q 382,328 374,328 H 208" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 418,196 V 384 Q 418,392 410,392 H 208" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="232" y="252" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="270" y="261" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">90/10 · A</text>
<rect x="232" y="308" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="270" y="317" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">90/10 · B</text>
<rect x="232" y="372" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="270" y="381" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">90/10 · C</text>

<!-- Rollout A/B/C -.-> VS (dashed, manages weights) — 3 fanned entry points on VS bottom edge, offset 12px below each solid pair -->
<path d="M 112,284 H 356 Q 364,284 364,276 V 196" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 112,340 H 392 Q 400,340 400,332 V 196" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 112,404 H 428 Q 436,404 436,396 V 196" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="440" y="420" width="112" height="12" rx="2" fill="#ffffff"/>
<text x="496" y="429" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">manages weights</text>

<!-- Clients box (single input) -->
<rect x="40" y="92" width="160" height="60" rx="6" fill="#ffffff"/>
<rect x="40" y="92" width="160" height="60" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="120" y="118" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Clients (Zone A/B/C)</text>
<text x="120" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">단일 서비스명 호출</text>

<!-- VS box: FOCAL -->
<rect x="340" y="120" width="120" height="76" rx="6" fill="#ffffff"/>
<rect x="340" y="120" width="120" height="76" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="400" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VirtualService</text>
<text x="400" y="166" fill="#EC7211" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">test</text>
<text x="400" y="184" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Zone별 route 분리</text>

<!-- DR box -->
<rect x="576" y="108" width="88" height="60" rx="6" fill="#ffffff"/>
<rect x="576" y="108" width="88" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="620" y="134" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Destination</text>
<text x="620" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rule: test</text>
<text x="620" y="162" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">locality-aware</text>

<!-- ============ ZONE A/B/C CONTAINERS ============ -->
<!-- Zone A -->
<rect x="40" y="248" width="180" height="56" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="52" y="252" width="80" height="10" fill="#ffffff"/>
<text x="92" y="260" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ZONE A · 1a</text>
<rect x="52" y="264" width="60" height="28" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="82" y="281" fill="#232F3E" font-size="9" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rollout A</text>
<rect x="120" y="264" width="88" height="28" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="164" y="277" fill="#232F3E" font-size="9" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Stable/Canary</text>
<text x="164" y="288" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">zone=a</text>

<!-- Zone B -->
<rect x="40" y="304" width="180" height="56" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="52" y="308" width="80" height="10" fill="#ffffff"/>
<text x="92" y="316" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ZONE B · 1b</text>
<rect x="52" y="320" width="60" height="28" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="82" y="337" fill="#232F3E" font-size="9" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rollout B</text>
<rect x="120" y="320" width="88" height="28" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="164" y="333" fill="#232F3E" font-size="9" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Stable/Canary</text>
<text x="164" y="344" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">zone=b</text>

<!-- Zone C -->
<rect x="40" y="368" width="180" height="56" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="52" y="372" width="80" height="10" fill="#ffffff"/>
<text x="92" y="380" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ZONE C · 1c</text>
<rect x="52" y="384" width="60" height="28" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="82" y="401" fill="#232F3E" font-size="9" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rollout C</text>
<rect x="120" y="384" width="88" height="28" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="164" y="397" fill="#232F3E" font-size="9" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Stable/Canary</text>
<text x="164" y="408" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">zone=c</text>

<!-- ============ LEGEND ============ -->
<line x1="40" y1="452" x2="920" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="470" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

<line x1="160" y1="464" x2="192" y2="464" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="200" y="468" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">트래픽 흐름 (실선)</text>

<line x1="380" y1="464" x2="412" y2="464" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="420" y="468" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">제어/설정 관계 (점선)</text>

<rect x="640" y="458" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="662" y="469" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">단일 진입점 (VirtualService)</text>

<text x="40" y="512" fill="#545B64" font-size="9" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">각 Zone의 Rollout은 서로 다른 route/subset 이름을 관리해 충돌 없이 독립적으로 배포됩니다.</text>

</svg>