<title id="ko-eks-05-eks-security-16-title">금융 서비스를 위한 EKS 보안 아키텍처</title>
<desc id="ko-eks-05-eks-security-16-desc">인터넷 트래픽이 WAF와 ALB를 거쳐 보안 사이드카가 포함된 애플리케이션 파드에 도달하고, KMS로 암호화된 데이터 서비스에 접근하는 동안 GuardDuty·Security Hub 등이 EKS 클러스터 전체를 모니터링하는 금융권 보안 구조를 보여준다.</desc>
