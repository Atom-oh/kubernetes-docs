<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ingress-title ingress-desc"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <title id="ingress-title">Ingress Request Routing</title>
    <desc id="ingress-desc">An external client's request passes through a load balancer and Ingress controller to a single Ingress resource, which fans out by host or path to Service A and Service B, each load-balancing across its own backend Pods.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Top chain arrows -->
    <line x1="180" y1="132" x2="220" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="360" y1="132" x2="400" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="540" y1="132" x2="580" y2="132" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Ingress -> S1 (fan attach x=612, jog y=180) -->
    <path d="M612,164 V172 Q612,180 604,180 H538 Q530,180 530,188 V248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Ingress -> S2 (fan attach x=644, jog y=340, routed clear of S1/PodsA) -->
    <path d="M644,164 V332 Q644,340 636,340 H538 Q530,340 530,348 V408" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- S1 -> PodsA (straight, same y=280) -->
    <line x1="600" y1="280" x2="680" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- S2 -> PodsB (straight, same y=440) -->
    <line x1="600" y1="440" x2="680" y2="440" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="184" y="112" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="121" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

    <rect x="364" y="112" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="380" y="121" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">L7</text>

    <rect x="544" y="112" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="560" y="121" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RULES</text>

    <rect x="612" y="330" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="632" y="339" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/web</text>

    <rect x="580" y="170" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="600" y="179" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/api</text>

    <!-- Node: External Client -->
    <rect x="40" y="100" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="100" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="110" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">External Client</text>
    <text x="110" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser</text>

    <!-- Node: Load Balancer -->
    <rect x="220" y="100" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="220" y="100" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="290" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Load Balancer</text>
    <text x="290" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cloud LB</text>

    <!-- Node: Ingress Controller -->
    <rect x="400" y="100" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="100" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="470" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Ingress Controller</text>
    <text x="470" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nginx / ALB</text>

    <!-- Node: Ingress Resource (focal) -->
    <rect x="580" y="100" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="580" y="100" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="650" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Ingress Resource</text>
    <text x="650" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">host / path rules</text>

    <!-- Node: Service A -->
    <rect x="460" y="248" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="460" y="248" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="530" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service A</text>
    <text x="530" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ClusterIP</text>

    <!-- Node: Pods A -->
    <rect x="680" y="248" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="680" y="248" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="750" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Pods A</text>
    <text x="750" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod-a-1 · pod-a-2</text>

    <!-- Node: Service B -->
    <rect x="460" y="408" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="460" y="408" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="530" y="436" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service B</text>
    <text x="530" y="452" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ClusterIP</text>

    <!-- Node: Pods B -->
    <rect x="680" y="408" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="680" y="408" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="750" y="436" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Pods B</text>
    <text x="750" y="452" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod-b-1 · pod-b-2</text>

    <!-- Legend -->
    <line x1="40" y1="520" x2="928" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="536" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Focal: Ingress Resource</text>
    <rect x="300" y="536" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="320" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Client</text>
    <rect x="420" y="536" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="440" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Backend Pods</text>
  </svg>