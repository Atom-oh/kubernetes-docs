<title id="ko-service-mesh-istio-advanced-08-argo-rollouts-6-title">Blue/Green 배포 승인 흐름</title>
<desc id="ko-service-mesh-istio-advanced-08-argo-rollouts-6-desc">새 버전을 Preview 환경에 배포해 사전 분석을 통과한 뒤 수동 승인으로 Active Service를 Blue에서 Green으로 전환하고, 사후 분석 결과에 따라 이전 버전을 정리하거나 롤백하는 배포 승인 흐름도.</desc>
