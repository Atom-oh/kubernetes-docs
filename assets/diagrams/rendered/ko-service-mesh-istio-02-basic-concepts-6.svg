<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Sidecar 모드에서 파드 내부 트래픽 경로</title>
<desc id="ddesc">각 파드에 사이드카로 주입된 Envoy Proxy가 외부 요청과 애플리케이션 컨테이너 사이의 모든 트래픽을 가로채 처리하는 구조</desc>
