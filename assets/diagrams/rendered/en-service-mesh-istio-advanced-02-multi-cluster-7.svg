<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mc-pr-title mc-pr-desc">
<title id="mc-pr-title">Primary-remote topology</title>
<desc id="mc-pr-desc">One primary cluster's Istiod pushes config to two services in a remote cluster, while Service A on the primary and the two remote services communicate over mTLS, giving the topology a single control plane but a single point of failure.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- zones -->
<rect x="80" y="140" width="320" height="280" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8"/>
<rect x="92" y="144" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="167" y="153" fill="#EC7211" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">PRIMARY · US-EAST-1</text>

<rect x="560" y="140" width="320" height="280" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="572" y="144" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="647" y="153" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">REMOTE · US-WEST-2</text>

<!-- arrows -->
<!-- Istiod -> Service B (push config) -->
<path d="M 240,192 H 480 Q 488,192 488,200 V 292 Q 488,300 496,300 H 640"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<!-- Istiod -> Service C (push config) -->
<path d="M 240,208 H 460 Q 468,208 468,216 V 368 Q 468,376 476,376 H 640"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="404" y="242" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="444" y="251" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.02em">PUSH CONFIG</text>

<!-- Service A <-> Service B mTLS -->
<line x1="240" y1="300" x2="640" y2="300" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="422" y="306" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="440" y="315" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.03em">MTLS</text>

<!-- Service B <-> Service C mTLS -->
<line x1="700" y1="320" x2="700" y2="356" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="674" y="330" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="692" y="339" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.03em">MTLS</text>

<!-- nodes -->
<rect x="100" y="180" width="140" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="170" y="200" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">Istiod</text>
<text x="170" y="214" fill="#545B64" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">control plane</text>

<rect x="100" y="280" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="170" y="304" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Service A</text>

<rect x="640" y="280" width="120" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="700" y="304" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Service B</text>

<rect x="640" y="356" width="120" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="700" y="380" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Service C</text>

<!-- legend -->
<line x1="30" y1="460" x2="930" y2="460" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="30" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="130" y="468" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="150" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">SINGLE CONTROL PLANE</text>
<line x1="400" y1="473" x2="424" y2="473" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
<text x="432" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">CONFIG PUSH</text>
<line x1="600" y1="473" x2="624" y2="473" stroke="#232F3E" stroke-width="1.2"/>
<text x="632" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">DATA-PLANE MTLS</text>
</svg>
