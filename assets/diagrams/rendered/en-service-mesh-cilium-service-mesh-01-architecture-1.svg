      <title id="en-service-mesh-cilium-service-mesh-01-architecture-1-title">Traditional networking vs. eBPF networking</title>
      <desc id="en-service-mesh-cilium-service-mesh-01-architecture-1-desc">Diagram contrasting a traditional application-to-NIC path that always traverses the kernel network stack with an eBPF-based path where kernel-attached programs process packets directly and can bypass the stack.</desc>
