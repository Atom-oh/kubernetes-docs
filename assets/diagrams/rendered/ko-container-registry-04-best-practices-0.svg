<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">캐싱/미러링 전략 선택 흐름도</title>
  <desc id="d">레이트 리밋 이슈인지 가용성/성능 문제인지에 따라, 그리고 AWS/EKS 환경인지 자체 인프라인지에 따라 ECR Pull-through Cache, Harbor Proxy Cache, containerd 미러, Harbor 전체 미러링, ECR 멀티 리전 복제, Harbor Pull Replication 중 적합한 방식을 고르는 의사결정 트리.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== connectors (behind nodes) ===== -->
  <!-- root -> RL (rate limit) -->
  <path d="M450,98 L450,122 Q450,130 442,130 L248,130 Q240,130 240,138 L240,154" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- root -> Perf (availability/perf) -->
  <path d="M510,98 L510,122 Q510,130 518,130 L712,130 Q720,130 720,138 L720,154" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- RL -> ECR_PTC (focal / happy path) -->
  <path d="M160,190 L160,292 Q160,300 152,300 L88,300 Q80,300 80,308 L80,380" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <!-- RL -> Harbor_Proxy -->
  <line x1="240" y1="226" x2="240" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- RL -> Containerd -->
  <path d="M320,190 L320,292 Q320,300 328,300 L392,300 Q400,300 400,308 L400,380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Perf -> Harbor_Full -->
  <path d="M640,190 L640,292 Q640,300 632,300 L568,300 Q560,300 560,308 L560,380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Perf -> ECR_Rep -->
  <line x1="720" y1="226" x2="720" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Perf -> Harbor_Rep -->
  <path d="M800,190 L800,292 Q800,300 808,300 L872,300 Q880,300 880,308 L880,380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== arrow labels ===== -->
  <rect x="309" y="110" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="345" y="119" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RATE LIMIT</text>

  <rect x="583" y="110" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="615" y="119" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">가용성/성능</text>

  <rect x="92" y="280" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="120" y="289" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AWS/EKS</text>

  <rect x="248" y="294" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="284" y="303" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">자체 인프라</text>

  <rect x="332" y="280" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="360" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">단순 미러</text>

  <rect x="580" y="280" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="600" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">에어갭</text>

  <rect x="728" y="294" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="760" y="303" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">멀티 리전</text>

  <rect x="824" y="280" width="32" height="12" rx="2" fill="#ffffff"/>
  <text x="840" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">엣지</text>

  <!-- ===== nodes ===== -->
  <!-- Root decision diamond -->
  <polygon points="480,30 580,70 480,110 380,70" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="66" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">캐싱/미러링</text>
  <text x="480" y="80" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">필요한가?</text>

  <!-- Level-1 diamonds -->
  <polygon points="240,154 320,190 240,226 160,190" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="240" y="194" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">환경 확인</text>

  <polygon points="720,154 800,190 720,226 640,190" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="720" y="194" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">인프라 확인</text>

  <!-- Leaf boxes -->
  <rect x="10" y="380" width="140" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="80" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ECR Pull-through</text>
  <text x="80" y="418" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cache</text>

  <rect x="170" y="380" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="240" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Harbor Proxy</text>
  <text x="240" y="418" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cache</text>

  <rect x="330" y="380" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="400" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">containerd</text>
  <text x="400" y="418" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">미러 설정</text>

  <rect x="490" y="380" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="560" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Harbor 전체</text>
  <text x="560" y="418" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">미러링</text>

  <rect x="650" y="380" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="720" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ECR 멀티 리전</text>
  <text x="720" y="418" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">복제</text>

  <rect x="810" y="380" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="880" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Harbor Pull</text>
  <text x="880" y="418" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Replication</text>

  <!-- Legend -->
  <line x1="40" y1="470" x2="920" y2="470" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="40" y="486" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <polygon points="44,506 56,500 68,506 56,512" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="80" y="509" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">결정 (다이아몬드)</text>

  <rect x="260" y="500" width="24" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="296" y="509" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">선택 결과 (사각형)</text>

  <line x1="480" y1="506" x2="508" y2="506" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="516" y="509" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">AWS/EKS 표준 경로</text>
</svg>