<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl2 desc2"><defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs>
  <title id="ttl2">Circuit Breaker의 역할과 한계</title>
  <desc id="desc2">Circuit Breaker는 장애 서비스 격리, 연쇄 장애 방지, 리소스 보호, 자동 복구 시도를 담당하지만 중복 요청 방지, 데이터 정합성 보장, 트랜잭션 관리, 멱등성 보장은 담당하지 않는다.</desc>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="32" y="32" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.18em">FLOWCHART</text>
  <text x="32" y="56" fill="#232F3E" font-size="20" font-weight="700">Circuit Breaker의 역할과 한계</text>

  <!-- Zone: What it does -->
  <rect x="32" y="88" width="432" height="460" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="52" y="100" width="220" height="16" rx="2" fill="#ffffff"/>
  <text x="162" y="112" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">✅ Circuit Breaker의 역할</text>

  <!-- Zone: What it doesn't -->
  <rect x="496" y="88" width="432" height="460" rx="8" fill="rgba(221,52,76,0.03)" stroke="rgba(221,52,76,0.30)" stroke-width="0.8"/>
  <rect x="516" y="100" width="240" height="16" rx="2" fill="#ffffff"/>
  <text x="636" y="112" fill="#DD344C" font-size="11" font-weight="600" text-anchor="middle">❌ Circuit Breaker의 한계</text>

  <!-- Left items (do) -->
  <g>
    <rect x="64" y="140" width="368" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="248" y="172" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">장애 서비스 격리</text>

    <rect x="64" y="216" width="368" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="248" y="248" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Cascading Failure 방지</text>

    <rect x="64" y="292" width="368" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="248" y="324" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">시스템 리소스 보호</text>

    <rect x="64" y="368" width="368" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="248" y="400" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">자동 복구 시도</text>
  </g>

  <!-- Right items (doesn't) -->
  <g>
    <rect x="528" y="140" width="368" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.55)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="712" y="172" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">중복 요청 방지</text>

    <rect x="528" y="216" width="368" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.55)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="712" y="248" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">데이터 정합성 보장</text>

    <rect x="528" y="292" width="368" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.55)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="712" y="324" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">트랜잭션 관리</text>

    <rect x="528" y="368" width="368" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.55)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="712" y="400" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">멱등성 보장</text>
  </g>

  <!-- Legend -->
  <line x1="32" y1="560" x2="928" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="576" fill="#545B64" font-size="9" class="mono">애플리케이션 레벨에서 Idempotency Key 등으로 별도 보장이 필요합니다</text>
</svg>