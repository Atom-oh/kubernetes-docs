    <text x="508" y="299" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">아니오</text>

    <rect x="522" y="264" width="24" height="12" rx="2" fill="#ffffff"/>
    <text x="534" y="273" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">예</text>

    <rect x="699" y="264" width="24" height="12" rx="2" fill="#ffffff"/>
    <text x="711" y="273" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">예</text>

    <rect x="798" y="290" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="818" y="299" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">아니오</text>

