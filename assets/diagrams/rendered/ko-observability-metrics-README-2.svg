    <!-- Leaf: G Datadog -->
    <rect x="200" y="340" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="270" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Datadog</text>
    <text x="270" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SaaS</text>

    <!-- Leaf: I Amazon Managed Prometheus -->
    <rect x="410" y="340" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Amazon Managed</text>
    <text x="480" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Prometheus (AMP)</text>

    <!-- Leaf: HJ VictoriaMetrics / Mimir (focal, shared answer) -->
    <rect x="565" y="340" width="140" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="635" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VictoriaMetrics</text>
    <text x="635" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/ Mimir</text>

    <!-- Leaf: K AMP + Grafana -->
    <rect x="720" y="340" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="790" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AMP + Grafana</text>
    <text x="790" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Managed Service</text>
  </svg>