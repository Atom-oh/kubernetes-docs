    <polygon points="480,44 552,76 480,108 408,76" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="72" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">팀 규모와</text>
    <text x="480" y="86" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">운영 역량?</text>

    <!-- Diamond: C -->
    <polygon points="170,164 242,196 170,228 98,196" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="170" y="200" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS 환경?</text>

    <!-- Diamond: D -->
    <polygon points="480,164 552,196 480,228 408,196" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="200" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">비용 우선?</text>

