<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="decide-title decide-desc">
    <title id="decide-title">팀 규모와 환경에 따른 메트릭 솔루션 선택 흐름도</title>
    <desc id="decide-desc">팀 규모와 운영 역량, AWS 환경 여부, 비용 우선순위, 멀티클라우드 여부를 차례로 물어 CloudWatch, Datadog, VictoriaMetrics, Amazon Managed Prometheus, AMP+Grafana 중 하나로 안내하는 의사결정 흐름도.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="440" fill="#ffffff"/>

    <!-- Arrows: START -> C / D / E -->
    <path d="M480,108 V128 Q480,136 472,136 H178 Q170,136 170,144 V164" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M480,108 V164" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M480,108 V128 Q480,136 488,136 H782 Q790,136 790,144 V164" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: C -> F / G -->
    <path d="M170,228 V276 Q170,284 162,284 H108 Q100,284 100,292 V340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M170,228 V276 Q170,284 178,284 H262 Q270,284 270,292 V340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: D -> I (straight) / HJ (elbow, accent-free but shared focal target) -->
    <path d="M480,228 V340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M480,228 V276 Q480,284 488,284 H605 Q613,284 613,292 V340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: E -> K (straight) / HJ (elbow) -->
    <path d="M790,228 V340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M790,228 V276 Q790,284 782,284 H665 Q657,284 657,292 V340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Edge labels -->
    <rect x="277" y="116" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="325" y="125" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">소규모/제한적</text>

    <rect x="488" y="130" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="508" y="139" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">중간</text>

    <rect x="587" y="116" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="635" y="125" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">대규모/전문</text>

    <rect x="115" y="264" width="24" height="12" rx="2" fill="#ffffff"/>
    <text x="127" y="273" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">예</text>

    <rect x="196" y="264" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="220" y="273" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">아니오</text>

