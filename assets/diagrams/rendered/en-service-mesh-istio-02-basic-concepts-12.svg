<title id="en-service-mesh-istio-02-basic-concepts-12-title">VM Envoy Sidecar Joins the Mesh</title>
<desc id="en-service-mesh-istio-02-basic-concepts-12-desc">Diagram showing a manually installed Envoy sidecar on a virtual machine exchanging mTLS traffic with a pod's Envoy sidecar in the Kubernetes cluster, with istiod delivering xDS configuration and certificates to both sidecars.</desc>
