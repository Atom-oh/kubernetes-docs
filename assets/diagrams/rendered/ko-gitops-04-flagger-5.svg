<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t5-title t5-desc">
<title id="t5-title">카나리 라우팅 조건 흐름</title>
<desc id="t5-desc">사용자 요청이 로드밸런서를 지나 라우팅 조건을 확인해, x-canary 헤더가 있으면 Canary v2로, 조건을 만족하지 않으면 Primary v1로 보내진 뒤 두 버전 모두 메트릭을 수집하고, 분석 결과가 성공이면 전체 승격, 실패면 롤백되는 과정을 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Arrows first -->
<line x1="480" y1="72" x2="480" y2="96" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="144" x2="480" y2="164" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<line x1="590" y1="208" x2="650" y2="208" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="596" y="188" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="620" y="197" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">CANARY</text>

<path d="M 480,252 V 264 Q 480,272 472,272 H 178 Q 170,272 170,280"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="288" y="252" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="332" y="261" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">조건 미충족</text>

<path d="M 760,232 V 300 Q 760,308 752,308 H 488 Q 480,308 480,316 V 336"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<path d="M 280,304 H 360 Q 368,304 368,312 V 352 Q 368,360 376,360 H 380"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<line x1="480" y1="384" x2="480" y2="436" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<line x1="590" y1="480" x2="650" y2="480" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="604" y="460" width="32" height="12" rx="2" fill="#ffffff"/>
<text x="620" y="469" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">성공</text>

<line x1="480" y1="524" x2="480" y2="548" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="360" y="524" width="32" height="12" rx="2" fill="#ffffff"/>
<text x="376" y="533" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">실패</text>

<!-- Nodes -->
<rect x="380" y="24" width="200" height="48" rx="24" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="480" y="52" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">사용자 요청</text>

<rect x="380" y="96" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Load Balancer</text>

<polygon points="480,164 590,208 480,252 370,208" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="204" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">라우팅 조건</text>
<text x="480" y="218" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">확인</text>

<rect x="650" y="184" width="220" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="760" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Canary · v2</text>

<rect x="60" y="280" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="170" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Primary · v1</text>

<rect x="380" y="336" width="200" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="480" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">메트릭 수집</text>

<polygon points="480,436 590,480 480,524 370,480" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="476" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">분석 결과</text>

<rect x="650" y="456" width="220" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="760" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">전체 승격</text>

<rect x="380" y="548" width="200" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="574" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">롤백</text>
</svg>