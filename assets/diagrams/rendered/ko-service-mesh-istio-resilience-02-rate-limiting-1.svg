<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="rl-tokenbucket-title rl-tokenbucket-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="rl-tokenbucket-title">Token Bucket 알고리즘의 요청 판정 흐름</title>
    <desc id="rl-tokenbucket-desc">Refill이 주기적으로 토큰을 채우는 버킷에서 요청이 도착하면 토큰 보유 여부를 판정해 허용 시 토큰을 소비하고, 부족하면 429로 거부하는 순환 흐름을 보여줍니다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Arrows (before nodes) -->
    <!-- Refill -> Bucket (dashed, periodic, straight) -->
    <line x1="280" y1="122" x2="300" y2="122" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Bucket -> Check (straight vertical) -->
    <line x1="380" y1="152" x2="380" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Request -> Check (straight horizontal) -->
    <line x1="280" y1="300" x2="320" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Check -> Allow (Yes, straight horizontal, accent) -->
    <line x1="440" y1="300" x2="520" y2="300" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="456" y="278" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="476" y="287" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

    <!-- Check -> Reject (No, straight vertical) -->
    <line x1="380" y1="352" x2="380" y2="420" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="356" y="378" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="371" y="387" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <!-- Allow -> Bucket (feedback, dashed, elbow, enters bottom edge at x=440 distinct from Check exit at x=380) -->
    <path d="M 600,268 V 184 Q 600,176 592,176 H 448 Q 440,176 440,168 V 152" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="484" y="170" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="522" y="179" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">토큰 1개 소비</text>

    <!-- Nodes -->
    <!-- Refill -->
    <rect x="120" y="94" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="120" y="94" width="160" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="200" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Refill</text>
    <text x="200" y="138" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10 tokens/sec</text>

    <!-- Bucket (focal) -->
    <rect x="300" y="92" width="160" height="60" rx="6" fill="#ffffff"/>
    <rect x="300" y="92" width="160" height="60" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="380" y="118" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Token Bucket</text>
    <text x="380" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">max: 100 tokens</text>

    <!-- Request (oval / start) -->
    <rect x="120" y="272" width="160" height="56" rx="20" fill="#ffffff"/>
    <rect x="120" y="272" width="160" height="56" rx="20" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="200" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">요청 도착</text>

    <!-- Check (diamond) -->
    <polygon points="380,248 440,300 380,352 320,300" fill="#ffffff"/>
    <polygon points="380,248 440,300 380,352 320,300" fill="#ffffff" stroke="#232F3E" stroke-width="1.2"/>
    <text x="380" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">토큰</text>
    <text x="380" y="311" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">있음?</text>

    <!-- Allow -->
    <rect x="520" y="268" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="520" y="268" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="600" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">요청 허용</text>
    <text x="600" y="314" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">토큰 1개 소비</text>

    <!-- Reject -->
    <rect x="300" y="420" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="300" y="420" width="160" height="64" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="380" y="448" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">요청 거부</text>
    <text x="380" y="466" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">429 반환</text>

    <!-- Legend -->
    <line x1="30" y1="528" x2="930" y2="528" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="544" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <circle cx="180" cy="540" r="7" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="196" y="543" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">토큰 저장소 (핵심)</text>

    <polygon points="376,536 386,540 376,544 366,540" fill="#ffffff" stroke="#232F3E" stroke-width="1.2"/>
    <text x="392" y="543" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">판정</text>

    <circle cx="576" cy="540" r="7" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="592" y="543" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">거부됨</text>
  </svg>