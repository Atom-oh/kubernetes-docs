<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ko-service-mesh-istio-glossary-1-title ko-service-mesh-istio-glossary-1-desc">
    <title id="ko-service-mesh-istio-glossary-1-title">Ingress Gateway 외부 요청 흐름</title>
    <desc id="ko-service-mesh-istio-glossary-1-desc">외부 클라이언트(Downstream)가 Ingress Gateway로 HTTP 요청을 보내고, Gateway가 이를 내부 서비스(Upstream)로 라우팅하는 흐름을 보여줍니다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows first (behind boxes) -->
    <!-- Client -> Gateway -->
    <line x1="260" y1="264" x2="376" y2="264" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="270" y="228" width="96" height="24" rx="2" fill="#ffffff"/>
    <text x="318" y="238" text-anchor="middle" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">HTTP 요청</text>
    <text x="318" y="248" text-anchor="middle" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.02em">DOWNSTREAM → ENVOY</text>

    <!-- Gateway -> Service -->
    <line x1="584" y1="264" x2="700" y2="264" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="600" y="228" width="84" height="24" rx="2" fill="#ffffff"/>
    <text x="642" y="238" text-anchor="middle" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">라우팅</text>
    <text x="642" y="248" text-anchor="middle" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.02em">ENVOY → UPSTREAM</text>

    <!-- Client box (Downstream) -->
    <rect x="60" y="216" width="200" height="96" rx="6" fill="#ffffff"/>
    <rect x="60" y="216" width="200" height="96" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="76" y="228" width="72" height="16" rx="2" fill="transparent" stroke="rgba(35,47,62,0.32)" stroke-width="0.8"/>
    <text x="112" y="240" text-anchor="middle" fill="#545B64" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">DOWNSTREAM</text>
    <text x="160" y="272" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">외부 클라이언트</text>
    <text x="160" y="290" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">external caller</text>

    <!-- Gateway box (Proxy, focal) -->
    <rect x="380" y="216" width="200" height="96" rx="6" fill="#ffffff"/>
    <rect x="380" y="216" width="200" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="396" y="228" width="52" height="16" rx="2" fill="transparent" stroke="rgba(236,114,17,0.5)" stroke-width="0.8"/>
    <text x="422" y="240" text-anchor="middle" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">PROXY</text>
    <text x="480" y="272" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Ingress Gateway</text>
    <text x="480" y="290" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Envoy</text>

    <!-- Service box (Upstream) -->
    <rect x="700" y="216" width="200" height="96" rx="6" fill="#ffffff"/>
    <rect x="700" y="216" width="200" height="96" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="716" y="228" width="56" height="16" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="744" y="240" text-anchor="middle" fill="#545B64" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">UPSTREAM</text>
    <text x="800" y="272" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">내부 서비스</text>
    <text x="800" y="290" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">cluster-local svc</text>

    <!-- Legend -->
    <line x1="60" y1="452" x2="900" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="472" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

    <circle cx="220" cy="468" r="5" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="232" y="472" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Downstream — 요청을 보내는 쪽</text>

    <circle cx="500" cy="468" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="512" y="472" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Envoy Proxy — 중계자</text>

    <circle cx="720" cy="468" r="5" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="732" y="472" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Upstream — 요청을 받는 쪽</text>
  </svg>