<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">Istio AuthorizationPolicy decision flow</title>
  <desc id="ddesc">A request runs through three sequential AuthorizationPolicy checks — service account, namespace, and HTTP method. Any failed check immediately denies the request and logs the decision; passing all three checks allows it.</desc>

  <rect width="960" height="600" fill="var(--paper)"/>

  <!-- ============ Header ============ -->
  <text x="30" y="26" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="var(--soft)">ISTIO · AUTHORIZATIONPOLICY</text>
  <text x="30" y="50" font-size="20" font-weight="700" fill="var(--ink)">Authorization Decision Flow</text>

  <!-- ============ Zone: Authorization Policy (painted first) ============ -->
  <rect x="152" y="112" width="296" height="384" rx="12" fill="var(--zone-fill)" stroke="var(--zone-stroke)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="172" y="132" class="mono" font-size="7" font-weight="500" letter-spacing="0.16em" fill="var(--soft)">AUTHORIZATION POLICY · RULES EVALUATED IN ORDER</text>

  <!-- ============ Markers ============ -->
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/>
    </marker>
    <marker id="arrow-deny" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--deny)"/>
    </marker>
  </defs>

  <!-- ============ Connectors (drawn before boxes) ============ -->

  <!-- Chain: Request -> Check1 -->
  <line x1="280" y1="120" x2="280" y2="148" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

  <!-- Chain: Check1 -> Check2 (MATCH) -->
  <line x1="280" y1="232" x2="280" y2="260" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="292" y="234" width="60" height="14" rx="2" fill="var(--paper)"/>
  <text x="322" y="244" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--accent)">MATCH</text>

  <!-- Chain: Check2 -> Check3 (MATCH) -->
  <line x1="280" y1="344" x2="280" y2="372" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="292" y="346" width="60" height="14" rx="2" fill="var(--paper)"/>
  <text x="322" y="356" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--accent)">MATCH</text>

  <!-- Chain: Check3 -> Allow (MATCH) -->
  <line x1="280" y1="456" x2="280" y2="484" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="292" y="458" width="60" height="14" rx="2" fill="var(--paper)"/>
  <text x="322" y="468" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--accent)">MATCH</text>

  <!-- No-match: Check1 -> Deny (fan point 1, y=284) -->
  <path d="M368,192 L472,192 Q480,192 480,200 L480,276 Q480,284 488,284 L660,284"
        fill="none" stroke="var(--deny)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-deny)"/>
  <rect x="386" y="172" width="68" height="14" rx="2" fill="var(--paper)"/>
  <text x="420" y="182" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--deny)">NO MATCH</text>

  <!-- No-match: Check2 -> Deny (fan point 2, y=304, straight) -->
  <line x1="368" y1="304" x2="660" y2="304" stroke="var(--deny)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-deny)"/>
  <rect x="366" y="284" width="68" height="14" rx="2" fill="var(--paper)"/>
  <text x="400" y="294" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--deny)">NO MATCH</text>

  <!-- No-match: Check3 -> Deny (fan point 3, y=324) -->
  <path d="M368,416 L512,416 Q520,416 520,408 L520,332 Q520,324 528,324 L660,324"
        fill="none" stroke="var(--deny)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-deny)"/>
  <rect x="406" y="396" width="68" height="14" rx="2" fill="var(--paper)"/>
  <text x="440" y="406" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--deny)">NO MATCH</text>

  <!-- ============ Nodes (painted last) ============ -->

  <!-- Request (input) -->
  <rect x="200" y="72" width="160" height="48" rx="20" fill="var(--paper)"/>
  <rect x="200" y="72" width="160" height="48" rx="20" fill="var(--input-fill)" stroke="var(--soft)" stroke-width="1"/>
  <text x="280" y="100" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Request</text>

  <!-- Check1: Service Account -->
  <polygon points="280,152 368,192 280,232 192,192" fill="var(--paper)"/>
  <polygon points="280,152 368,192 280,232 192,192" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text x="280" y="186" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Service Account</text>
  <text x="280" y="200" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Check</text>

  <!-- Check2: Namespace -->
  <polygon points="280,264 368,304 280,344 192,304" fill="var(--paper)"/>
  <polygon points="280,264 368,304 280,344 192,304" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text x="280" y="298" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Namespace</text>
  <text x="280" y="312" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Check</text>

  <!-- Check3: HTTP Method -->
  <polygon points="280,376 368,416 280,456 192,416" fill="var(--paper)"/>
  <polygon points="280,376 368,416 280,456 192,416" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text x="280" y="410" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">HTTP Method</text>
  <text x="280" y="424" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Check</text>

  <!-- Allow (focal) -->
  <rect x="200" y="488" width="160" height="48" rx="20" fill="var(--paper)"/>
  <rect x="200" y="488" width="160" height="48" rx="20" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="280" y="516" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Allow</text>

  <!-- Deny -->
  <rect x="660" y="276" width="160" height="56" rx="20" fill="var(--paper)"/>
  <rect x="660" y="276" width="160" height="56" rx="20" fill="var(--deny-tint)" stroke="var(--deny-stroke)" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="740" y="300" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Deny</text>
  <text x="740" y="316" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">audit logged</text>

  <!-- ============ Legend ============ -->
  <line x1="30" y1="548" x2="930" y2="548" stroke="var(--rule)" stroke-width="0.8"/>
  <text x="30" y="564" class="mono" font-size="7" font-weight="500" letter-spacing="0.18em" fill="var(--soft)">LEGEND</text>

  <line x1="110" y1="574" x2="142" y2="574" stroke="var(--accent)" stroke-width="1.4"/>
  <text x="150" y="578" class="mono" font-size="8" letter-spacing="0.04em" fill="var(--muted)">MATCH &#8594; NEXT CHECK</text>

  <line x1="460" y1="574" x2="492" y2="574" stroke="var(--deny)" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="500" y="578" class="mono" font-size="8" letter-spacing="0.04em" fill="var(--muted)">NO MATCH &#8594; DENY (LOGGED)</text>
</svg>