<title id="en-service-mesh-istio-03-architecture-12-title">The Problem: Envoy Receives All Service Information</title>
<desc id="en-service-mesh-istio-03-architecture-12-desc">Architecture diagram showing that by default every Envoy sidecar in a 1000-service mesh receives configuration for all services, even though the application in its pod only talks to two of them.</desc>
