<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="harbor-cache-title harbor-cache-desc">
    <title id="harbor-cache-title">Proxy cache lookup flow</title>
    <desc id="harbor-cache-desc">A client pull request hits Harbor's proxy cache; a cache hit returns the cached image directly, while a cache miss fetches the image from the upstream registry, stores it in Harbor, and then returns it.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Arrows (behind boxes) -->
    <!-- Client -> Harbor diamond (straight, shared x=480) -->
    <line x1="480" y1="104" x2="480" y2="142" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Harbor diamond -> Return (cache hit, straight, shared y=202) -->
    <line x1="580" y1="202" x2="720" y2="202" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Harbor diamond -> Upstream (cache miss, straight, shared x=480) -->
    <line x1="480" y1="262" x2="480" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Upstream -> Store (straight, shared x=480) -->
    <line x1="480" y1="404" x2="480" y2="460" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Store -> Return (elbow, enters Return's bottom edge) -->
    <path d="M 580,492 H 812 Q 820,492 820,484 V 234"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow label: CACHE HIT -->
    <rect x="622" y="182" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="654" y="191" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE HIT</text>

    <!-- Arrow label: CACHE MISS (beside vertical segment) -->
    <rect x="490" y="292" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="526" y="301" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE MISS</text>

    <!-- Node: Client (start) -->
    <rect x="400" y="48" width="160" height="56" rx="28" fill="#ffffff"/>
    <rect x="400" y="48" width="160" height="56" rx="28" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="480" y="80" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
    <text x="480" y="94" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docker / containerd</text>

    <!-- Node: Harbor Proxy Cache (decision diamond, focal) -->
    <polygon points="480,142 580,202 480,262 380,202" fill="#ffffff"/>
    <polygon points="480,142 580,202 480,262 380,202" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="198" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Harbor</text>
    <text x="480" y="214" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proxy cache</text>

    <!-- Node: Return cached image -->
    <rect x="720" y="170" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="720" y="170" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="810" y="198" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Return image</text>
    <text x="810" y="214" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">to client</text>

    <!-- Node: Upstream Registry -->
    <rect x="380" y="340" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="340" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="388" y="348" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="406" y="357" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="480" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Upstream Registry</text>
    <text x="480" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Docker Hub, etc.</text>

    <!-- Node: Store in Harbor -->
    <rect x="380" y="460" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="460" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="488" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Store in Harbor</text>
    <text x="480" y="504" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cache the layer</text>
  </svg>