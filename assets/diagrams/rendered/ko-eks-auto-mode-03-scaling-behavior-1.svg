<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="consolidation-title consolidation-desc">
  <title id="consolidation-title">노드 통합 (Consolidation) 전후 비교</title>
  <desc id="consolidation-desc">통합 전 3개 노드에 분산돼 있던 낮은 사용률의 워크로드가 통합 후 1개 노드로 모이고 나머지 2개 노드는 제거되는 것을 보여주는 다이어그램.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="28" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7D8998">FLOWCHART · NODE CONSOLIDATION</text>
  <text x="40" y="56" font-size="20" font-weight="700" fill="#232F3E">낮은 사용률 노드의 통합</text>

  <!-- Zone backgrounds -->
  <rect x="40" y="136" width="360" height="384" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="56" y="156" class="mono" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#7D8998">통합 전 (BEFORE)</text>

  <rect x="560" y="136" width="360" height="384" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="576" y="156" class="mono" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#7D8998">통합 후 (AFTER)</text>

  <!-- Consolidation arrow (drawn before boxes) -->
  <line x1="404" y1="332" x2="596" y2="332" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="440" y="308" width="124" height="12" rx="2" fill="#ffffff"/>
  <text x="502" y="317" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.06em">CONSOLIDATION</text>

  <!-- ===== Before nodes ===== -->
  <rect x="80" y="176" width="280" height="88" rx="6" fill="#ffffff"/>
  <rect x="80" y="176" width="280" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="220" y="206" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">노드 1</text>
  <text x="220" y="226" class="mono" font-size="9" fill="#545B64" text-anchor="middle">CPU 20% · 메모리 30%</text>

  <rect x="80" y="288" width="280" height="88" rx="6" fill="#ffffff"/>
  <rect x="80" y="288" width="280" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="220" y="318" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">노드 2</text>
  <text x="220" y="338" class="mono" font-size="9" fill="#545B64" text-anchor="middle">CPU 15% · 메모리 25%</text>

  <rect x="80" y="400" width="280" height="88" rx="6" fill="#ffffff"/>
  <rect x="80" y="400" width="280" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="220" y="430" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">노드 3</text>
  <text x="220" y="450" class="mono" font-size="9" fill="#545B64" text-anchor="middle">CPU 10% · 메모리 20%</text>

  <!-- ===== After nodes ===== -->
  <!-- Kept node (focal / accent) -->
  <rect x="600" y="176" width="280" height="88" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="600" y="176" width="280" height="88" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="740" y="206" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">노드 1</text>
  <text x="740" y="226" class="mono" font-size="9" fill="#545B64" text-anchor="middle">CPU 45% · 메모리 75%</text>

  <!-- Removed ghost nodes -->
  <rect x="600" y="288" width="280" height="88" rx="6" fill="rgba(35,47,62,0.02)"/>
  <rect x="600" y="288" width="280" height="88" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="740" y="336" font-size="12" font-weight="600" fill="#7D8998" text-anchor="middle">(제거됨)</text>

  <rect x="600" y="400" width="280" height="88" rx="6" fill="rgba(35,47,62,0.02)"/>
  <rect x="600" y="400" width="280" height="88" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="740" y="448" font-size="12" font-weight="600" fill="#7D8998" text-anchor="middle">(제거됨)</text>

</svg>