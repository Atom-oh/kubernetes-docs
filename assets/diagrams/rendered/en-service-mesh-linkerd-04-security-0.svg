<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secarch-title secarch-desc">
    <title id="secarch-title">Linkerd security architecture</title>
    <desc id="secarch-desc">Architecture diagram showing the certificate chain issuing workload certificates, the control plane's identity and policy controllers pushing identity and authorization into both data-plane proxies, and the two proxies terminating mutual TLS between each other.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="40" y="40" width="880" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="428" y="44" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CERTIFICATE CHAIN</text>

    <rect x="40" y="180" width="880" height="108" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="416" y="184" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="193" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE</text>

    <rect x="40" y="340" width="880" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="424" y="344" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="353" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA PLANE</text>

    <!-- Arrows (before nodes) -->
    <!-- TA -> II -> WC : straight, same y=100 -->
    <line x1="240" y1="100" x2="400" y2="100" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="560" y1="100" x2="720" y2="100" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ID -> P1 (channel mid-y 296) -->
    <path d="M 176,268 V 288 Q 176,296 184,296 H 328 Q 336,296 336,304 V 372"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- ID -> P2 (channel mid-y 308) -->
    <path d="M 224,268 V 300 Q 224,308 232,308 H 568 Q 576,308 576,316 V 372"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- POL -> P1 (channel mid-y 320) -->
    <path d="M 732,268 V 312 Q 732,320 724,320 H 396 Q 388,320 388,328 V 372"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- POL -> P2 (channel mid-y 332) -->
    <path d="M 788,268 V 324 Q 788,332 780,332 H 636 Q 628,332 628,340 V 372"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- P1 <-> P2 mTLS bidirectional -->
    <line x1="440" y1="400" x2="520" y2="400" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>

    <!-- Arrow labels -->
    <rect x="292" y="88" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="98" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNS</text>
    <rect x="612" y="88" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="98" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ISSUES</text>
    <rect x="452" y="380" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="390" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MTLS</text>

    <!-- Nodes: Certificate Chain -->
    <rect x="80" y="72" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="80" y="72" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Trust Anchor</text>
    <text x="160" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">root ca</text>

    <rect x="400" y="72" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="72" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Identity Issuer</text>
    <text x="480" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">intermediate ca</text>

    <rect x="720" y="72" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="720" y="72" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="800" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Workload Certs</text>
    <text x="800" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">per proxy</text>

    <!-- Nodes: Control Plane -->
    <rect x="120" y="212" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="120" y="212" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Identity Controller</text>
    <text x="200" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cert issuance</text>

    <rect x="680" y="212" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="680" y="212" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="760" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Policy Controller</text>
    <text x="760" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">authz policies</text>

    <!-- Nodes: Data Plane (focal) -->
    <rect x="280" y="372" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="280" y="372" width="160" height="56" rx="6" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="360" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Proxy 1</text>
    <text x="360" y="412" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mtls termination</text>

    <rect x="520" y="372" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="520" y="372" width="160" height="56" rx="6" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="600" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Proxy 2</text>
    <text x="600" y="412" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mtls termination</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="532" width="14" height="10" rx="2" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Data-plane proxy (focal)</text>
    <line x1="240" y1="537" x2="268" y2="537" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="276" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Certificate / identity push</text>
    <line x1="472" y1="537" x2="500" y2="537" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <text x="508" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Mutual TLS</text>
  </svg>