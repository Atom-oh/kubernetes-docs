<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calico-vs-kubeproxy-title calico-vs-kubeproxy-desc">
    <title id="calico-vs-kubeproxy-title">Traditional kube-proxy rule chains versus Calico's optimized data plane</title>
    <desc id="calico-vs-kubeproxy-desc">Architecture diagram contrasting kube-proxy's linear iptables rule chains, which degrade in performance as a cluster grows, with Calico's Felix agent using optimized iptables or eBPF and IP sets to hold consistent performance at scale.</desc>

    <rect width="960" height="600" fill="#ffffff"/>

    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <!-- Zones -->
    <rect x="64" y="80" width="392" height="472" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="168" y="84" width="184" height="12" rx="2" fill="#ffffff"/>
    <text x="260" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">TRADITIONAL (KUBE-PROXY)</text>

    <rect x="504" y="80" width="392" height="472" rx="8" fill="rgba(255,153,0,0.03)" stroke="rgba(236,114,17,0.25)" stroke-width="0.8"/>
    <rect x="608" y="84" width="184" height="12" rx="2" fill="#ffffff"/>
    <text x="700" y="93" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">CALICO APPROACH</text>

    <!-- Traditional chain (vertical, same x, straight lines) -->
    <line x1="260" y1="176" x2="260" y2="212" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="260" y1="296" x2="260" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="260" y1="416" x2="260" y2="452" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Calico chain -->
    <line x1="700" y1="176" x2="700" y2="212" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="700" y1="296" x2="700" y2="332" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="700" y1="416" x2="700" y2="452" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Traditional: kube-proxy -->
    <rect x="140" y="112" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="140" y="112" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="260" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">kube-proxy</text>

    <!-- Traditional: iptables rules -->
    <rect x="140" y="212" width="240" height="84" rx="6" fill="#ffffff"/>
    <rect x="140" y="212" width="240" height="84" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="260" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">iptables rules</text>
    <text x="260" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">linear chains</text>
    <text x="260" y="280" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">O(n) traversal</text>

    <!-- Traditional: linear matching -->
    <rect x="140" y="332" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="140" y="332" width="240" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="260" y="370" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Linear rule matching</text>

    <!-- Traditional: performance degradation (outcome, muted) -->
    <rect x="140" y="452" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="140" y="452" width="240" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="260" y="480" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Degrades at scale</text>
    <text x="260" y="496" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2-5ms added latency</text>

    <!-- Calico: Felix -->
    <rect x="580" y="112" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="580" y="112" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="700" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Felix agent</text>

    <!-- Calico: optimized iptables/eBPF -->
    <rect x="580" y="212" width="240" height="84" rx="6" fill="#ffffff"/>
    <rect x="580" y="212" width="240" height="84" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="700" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Optimized iptables</text>
    <text x="700" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">or eBPF data plane</text>

    <!-- Calico: IP sets -->
    <rect x="580" y="332" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="580" y="332" width="240" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="700" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">IP sets</text>
    <text x="700" y="376" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">O(1) lookups</text>

    <!-- Calico: consistent performance (focal outcome) -->
    <rect x="580" y="452" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="580" y="452" width="240" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="700" y="480" fill="#232F3E" font-size="12" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Consistent at scale</text>
    <text x="700" y="496" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;0.5ms added latency</text>

    <!-- Legend -->
    <line x1="40" y1="568" x2="920" y2="568" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="580" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="588" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Calico's scaling outcome</text>
    <rect x="300" y="580" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="320" y="588" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">kube-proxy's scaling outcome</text>
  </svg>