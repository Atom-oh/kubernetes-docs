<title id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-2-title">보안 기능 비교: Istio vs VPC Lattice</title>
<desc id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-2-desc">Istio는 자동 mTLS, 세밀한 L7 Authorization, JWT 인증, External CA 통합, EnvoyFilter 기반 Rate Limiting을 제공하고, VPC Lattice는 ACM 기반 TLS, IAM 인증, SigV4, PrivateLink 네트워크 격리, WAF 통합을 제공한다는 것을 나란히 보여준다.</desc>
