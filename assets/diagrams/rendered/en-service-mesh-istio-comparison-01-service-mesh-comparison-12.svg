<title id="en-service-mesh-istio-comparison-01-service-mesh-comparison-12-title">Maximum Throughput vs. Baseline</title>
<desc id="en-service-mesh-istio-comparison-01-service-mesh-comparison-12-desc">Comparison of maximum sustained requests-per-second for each service mesh&#x27;s data plane as a percentage of an unmeshed baseline, with Linkerd retaining the most throughput and Istio/Consul the least.</desc>
