<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ebpf3-title ebpf3-desc">
    <title id="ebpf3-title">XDP verdict routing a packet to one of four outcomes</title>
    <desc id="ebpf3-desc">Flowchart showing a packet arriving from the network card into an XDP program, which returns one of four verdicts: drop for DDoS protection, pass to normal TC processing, direct TX return, or redirect to another interface.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows (before boxes) -->
    <line x1="480" y1="128" x2="480" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M 420,240 V 288 Q 420,296 412,296 H 176 Q 168,296 168,304 V 380"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 456,264 V 300 Q 456,308 448,308 H 384 Q 376,308 376,316 V 380"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 504,264 V 300 Q 504,308 512,308 H 576 Q 584,308 584,316 V 380"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 540,240 V 288 Q 540,296 548,296 H 784 Q 792,296 792,304 V 380"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="266" y="276" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="294" y="285" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">XDP_DROP</text>

    <rect x="392" y="288" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="420" y="297" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">XDP_PASS</text>

    <rect x="512" y="288" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="540" y="297" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">XDP_TX</text>

    <rect x="636" y="276" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="666" y="285" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">XDP_REDIRECT</text>

    <!-- Node: Network Card -->
    <rect x="400" y="64" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Network Card</text>
    <text x="480" y="108" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NIC</text>

    <!-- Node: XDP Program (diamond decision, focal) -->
    <polygon points="480,160 568,220 480,280 392,220" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">XDP</text>
    <text x="480" y="230" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Program</text>

    <!-- Outcome nodes -->
    <rect x="80" y="380" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="168" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Drop</text>
    <text x="168" y="424" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DDoS protection</text>

    <rect x="288" y="380" width="176" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="376" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">TC Programs</text>
    <text x="376" y="424" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">normal processing</text>

    <rect x="496" y="380" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="584" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">TX</text>
    <text x="584" y="424" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">direct return</text>

    <rect x="704" y="380" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="792" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Redirect</text>
    <text x="792" y="424" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">other interface</text>

    <!-- Legend -->
    <line x1="80" y1="488" x2="880" y2="488" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="80" y="504" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="80" y="520" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="100" y="528" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Verdict / happy path (focal)</text>
    <rect x="340" y="520" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="360" y="528" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Outcome</text>
  </svg>