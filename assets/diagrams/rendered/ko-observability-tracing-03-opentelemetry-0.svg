<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
    <title id="d0-title">OpenTracing와 OpenCensus의 통합</title>
    <desc id="d0-desc">2016년 OpenTracing과 2017년 OpenCensus가 2019년 OpenTelemetry로 통합되었고, OpenTelemetry는 Specification, SDKs, Collector, Protocol의 네 가지 핵심 구성 요소로 이어짐을 보여주는 다이어그램.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="40" y="148" width="380" height="228" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="188" y="152" width="84" height="12" rx="2" fill="#ffffff"/>
    <text x="230" y="161" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">역사</text>

    <rect x="460" y="108" width="220" height="412" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="530" y="112" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="570" y="121" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">구성 요소</text>

    <!-- Arrows (before boxes) -->
    <path d="M 200,212 H 216 Q 224,212 224,220 V 238 Q 224,246 232,246 H 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 200,332 H 228 Q 236,332 236,324 V 306 Q 236,298 244,298 H 260" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M 400,222 H 408 Q 416,222 416,214 V 180 Q 416,172 424,172 H 480" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 400,254 H 424 Q 432,254 432,262 V 268 Q 432,276 440,276 H 480" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 400,286 H 440 Q 448,286 448,294 V 364 Q 448,372 456,372 H 480" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 400,322 H 456 Q 464,322 464,330 V 460 Q 464,468 472,468 H 480" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Node: OpenTracing -->
    <rect x="60" y="180" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="180" width="140" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="130" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OpenTracing</text>
    <text x="130" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2016</text>

    <!-- Node: OpenCensus -->
    <rect x="60" y="300" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="300" width="140" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="130" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OpenCensus</text>
    <text x="130" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2017</text>

    <!-- Node: OpenTelemetry (focal) -->
    <rect x="260" y="190" width="140" height="164" rx="6" fill="#ffffff"/>
    <rect x="260" y="190" width="140" height="164" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="330" y="264" fill="#232F3E" font-size="12" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OpenTelemetry</text>
    <text x="330" y="280" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2019 · 통합</text>

    <!-- Node: Specification -->
    <rect x="480" y="140" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="480" y="140" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="570" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Specification</text>

    <!-- Node: SDKs -->
    <rect x="480" y="244" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="480" y="244" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="570" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SDKs</text>

    <!-- Node: Collector -->
    <rect x="480" y="340" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="480" y="340" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="570" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Collector</text>

    <!-- Node: Protocol -->
    <rect x="480" y="436" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="480" y="436" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="570" y="472" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Protocol</text>

    <!-- Legend -->
    <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="566" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="60" y="574" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">선행 프로젝트</text>

    <rect x="200" y="566" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="220" y="574" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">통합 프로젝트 (focal)</text>

    <rect x="420" y="566" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="440" y="574" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">핵심 구성 요소</text>
  </svg>