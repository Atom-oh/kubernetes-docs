<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="modes-overview-title modes-overview-desc">
    <title id="modes-overview-title">Calico networking modes compared</title>
    <desc id="modes-overview-desc">Three parallel rows show IPIP, VXLAN, and Direct/Native mode, each tracing its encapsulation approach and MTU to the use case it fits best, with Direct/Native highlighted as the top-performance path.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (painted before arrows/nodes) -->
    <rect x="40" y="64" width="280" height="328" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="68" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="128" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NETWORKING MODE</text>

    <rect x="340" y="64" width="280" height="328" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="352" y="68" width="136" height="12" rx="2" fill="#ffffff"/>
    <text x="420" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ENCAPSULATION</text>

    <rect x="640" y="64" width="280" height="328" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="652" y="68" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="716" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BEST USE CASE</text>

    <!-- Arrows: row 1 (IPIP) -->
    <line x1="280" y1="132" x2="380" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="312" y="112" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="330" y="121" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">1480</text>
    <line x1="580" y1="132" x2="680" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: row 2 (VXLAN) -->
    <line x1="280" y1="236" x2="380" y2="236" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="312" y="216" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="330" y="225" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">1450</text>
    <line x1="580" y1="236" x2="680" y2="236" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: row 3 (Direct) -->
    <line x1="280" y1="340" x2="380" y2="340" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="312" y="320" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="330" y="329" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">1500</text>
    <line x1="580" y1="340" x2="680" y2="340" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Row 1 nodes: IPIP -->
    <rect x="80" y="104" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="80" y="104" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">IPIP Mode</text>

    <rect x="380" y="104" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="380" y="104" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">IP-in-IP</text>
    <text x="480" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">encapsulation</text>

    <rect x="680" y="104" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="680" y="104" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="780" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cloud environments</text>
    <text x="780" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">simple setup</text>

    <!-- Row 2 nodes: VXLAN -->
    <rect x="80" y="208" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="80" y="208" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="240" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VXLAN Mode</text>

    <rect x="380" y="208" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="380" y="208" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">UDP/VXLAN</text>
    <text x="480" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">encapsulation</text>

    <rect x="680" y="208" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="680" y="208" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="780" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Multicast-restricted</text>
    <text x="780" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">standard overlay</text>

    <!-- Row 3 nodes: Direct (focal) -->
    <rect x="80" y="312" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="80" y="312" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="180" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Direct/Native Mode</text>

    <rect x="380" y="312" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="380" y="312" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">No encapsulation</text>
    <text x="480" y="356" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">native routing</text>

    <rect x="680" y="312" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="680" y="312" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="780" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">On-prem with BGP</text>
    <text x="780" y="356" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">max performance</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="140" y="508" width="12" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="517" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">mode</text>

    <rect x="280" y="508" width="12" height="12" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="300" y="517" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">encapsulation</text>

    <rect x="480" y="508" width="12" height="12" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="500" y="517" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">use case</text>

    <rect x="640" y="508" width="12" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="660" y="517" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">best performance</text>
  </svg>