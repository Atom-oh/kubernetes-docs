<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spire-svid-flow-title spire-svid-flow-desc">
    <title id="spire-svid-flow-title">SVID 발급 요청 흐름</title>
    <desc id="spire-svid-flow-desc">애플리케이션이 Workload API로 SVID를 요청하면 Agent가 프로세스 정보로 어테스테이션 셀렉터를 매칭하고 Server의 Node API가 등록 엔트리를 확인해 CA로 서명한 X.509-SVID를 발급, Agent가 캐시에 저장한 뒤 애플리케이션에 전달하는 과정을 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="32" y="48" width="140" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="60" y="52" width="84" height="12" rx="2" fill="#ffffff"/>
    <text x="102" y="61" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">워크로드</text>

    <rect x="232" y="48" width="320" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="336" y="52" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="392" y="61" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">SPIRE AGENT</text>

    <rect x="612" y="48" width="316" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="716" y="52" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="772" y="61" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">SPIRE SERVER</text>

    <!-- 1. App -> WA -->
    <path d="M 144,94 H 268" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="168" y="72" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="206" y="81" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 SVID 요청</text>

    <!-- 10. WA -> App -->
    <path d="M 268,110 H 144" fill="none" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
    <rect x="168" y="88" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="206" y="97" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">10 SVID전달</text>

    <!-- 9. WA -> CACHE (routed left of Attest/Cache to avoid passing behind them) -->
    <path d="M 268,122 H 258 Q 250,122 250,130 V 388 Q 250,396 258,396 H 268"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="172" y="252" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="208" y="261" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">9 캐시저장</text>

    <!-- 2. WA -> ATTEST -->
    <path d="M 336,124 V 156" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="344" y="132" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="392" y="141" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2 프로세스정보</text>

    <!-- 3. ATTEST -> REG -->
    <path d="M 404,172 H 520 Q 528,172 528,180 V 332 Q 528,340 536,340 H 652"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="412" y="152" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="462" y="161" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3 셀렉터매칭</text>

    <!-- 4. WA -> SVC -->
    <path d="M 404,104 H 680" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="494" y="84" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="542" y="93" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">4 SVID 요청</text>

    <!-- 8. SVC -> WA -->
    <path d="M 680,120 H 404" fill="none" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
    <rect x="504" y="100" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="544" y="109" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">8 SVID반환</text>

    <!-- 5. SVC -> REG -->
    <path d="M 712,136 V 324" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="720" y="224" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="760" y="233" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5 등록확인</text>

    <!-- 6. SVC -> SIGN -->
    <path d="M 780,136 V 188" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="792" y="152" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="820" y="161" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">6 CA 서명</text>

    <!-- 7. SIGN -> SVC (return, offset 16px from arrow 6) -->
    <path d="M 796,188 V 136" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="712" y="152" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="746" y="161" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">7 X.509</text>

    <!-- Node: App -->
    <rect x="60" y="80" width="84" height="56" rx="6" fill="#ffffff"/>
    <rect x="60" y="80" width="84" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="102" y="105" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">애플리</text>
    <text x="102" y="119" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">케이션</text>

    <!-- Node: WA -->
    <rect x="268" y="80" width="136" height="44" rx="6" fill="#ffffff"/>
    <rect x="268" y="80" width="136" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="336" y="100" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Workload API</text>
    <text x="336" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unix socket</text>

    <!-- Node: ATTEST -->
    <rect x="268" y="156" width="136" height="32" rx="6" fill="#ffffff"/>
    <rect x="268" y="156" width="136" height="32" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="336" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">워크로드 어테스테이터</text>

    <!-- Node: CACHE -->
    <rect x="268" y="380" width="136" height="32" rx="6" fill="#ffffff"/>
    <rect x="268" y="380" width="136" height="32" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="336" y="400" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">SVID 캐시</text>

    <!-- Node: SVC -->
    <rect x="680" y="104" width="136" height="32" rx="6" fill="#ffffff"/>
    <rect x="680" y="104" width="136" height="32" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="748" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Node API</text>

    <!-- Node: SIGN -->
    <rect x="760" y="188" width="88" height="32" rx="6" fill="#ffffff"/>
    <rect x="760" y="188" width="88" height="32" rx="6" fill="rgba(255,153,0,0.05)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="804" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">CA 서명</text>

    <!-- Node: REG -->
    <rect x="652" y="324" width="148" height="32" rx="6" fill="#ffffff"/>
    <rect x="652" y="324" width="148" height="32" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="726" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">등록 엔트리</text>

    <!-- Legend -->
    <line x1="32" y1="452" x2="928" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="468" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <line x1="32" y1="490" x2="60" y2="490" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="68" y="493" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">요청 경로 (1·4)</text>

    <line x1="240" y1="490" x2="268" y2="490" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
    <text x="276" y="493" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">SVID 반환 경로 (8·10)</text>

    <line x1="460" y1="490" x2="488" y2="490" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="496" y="493" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">내부 조회 / 검증</text>
  </svg>
