<rect x="90" y="40" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="180.0" y="68.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">linkerd-proxy</text>
<rect x="400" y="40" width="160" height="48" rx="6" fill="#ffffff"/>
<rect x="400" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480.0" y="68.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">ServiceAccount</text>
<rect x="690" y="40" width="180" height="48" rx="6" fill="#ffffff"/>
<rect x="690" y="40" width="180" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="780.0" y="68.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Identity Controller</text>
</svg>