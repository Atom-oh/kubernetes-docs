<rect x="430.0" y="312" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="480.0" y="321" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNED CERT 24H</text>
<rect x="394.0" y="354" width="172" height="20" rx="3" fill="rgba(35,47,62,0.04)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
<text x="480.0" y="368" fill="#545B64" font-size="9" font-style="italic" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">After 22h (renewal window)</text>
<path d="M 180,396 L 780,396" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="442.0" y="376" width="76" height="12" rx="2" fill="#ffffff"/>
