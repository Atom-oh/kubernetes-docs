<title id="en-service-mesh-istio-02-basic-concepts-6-title">Sidecar Mode: Envoy Injected per Pod</title>
<desc id="en-service-mesh-istio-02-basic-concepts-6-desc">Diagram showing an external request entering an Envoy sidecar proxy inside a pod, which forwards traffic locally to the application container; the application's outbound calls return through the same sidecar out to a target service.</desc>
