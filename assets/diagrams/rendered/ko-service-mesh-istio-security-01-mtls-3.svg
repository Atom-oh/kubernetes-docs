<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">CloudFront mTLS 검증 체인</title>
  <desc id="d3-desc">클라이언트의 mTLS가 CloudFront 엣지에서 검증되고, ALB와 Istio Gateway를 거쳐 백엔드 서비스까지 TLS/mTLS로 이어지는 구간별 보안 체인을 보여주는 다이어그램</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .mono { font-family: 'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="32" y="40" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">AWS INTEGRATION</text>
  <text x="32" y="64" font-size="28" font-weight="700" fill="#232F3E">CloudFront와 Istio mTLS 통합</text>

  <!-- 5 nodes evenly spaced across width, y center 292 -->
  <rect x="32" y="256" width="120" height="72" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="92" y="286" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">클라이언트</text>
  <text x="92" y="304" class="mono" font-size="9" fill="#545B64" text-anchor="middle">Client Cert</text>

  <!-- CloudFront focal -->
  <rect x="216" y="248" width="152" height="88" rx="6" fill="#ffffff"/>
  <rect x="216" y="248" width="152" height="88" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="228" y="256" width="56" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.5)" stroke-width="0.8"/>
  <text x="256" y="265" class="mono" font-size="7" fill="#EC7211" text-anchor="middle" letter-spacing="0.08em">CDN</text>
  <text x="292" y="292" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">CloudFront</text>
  <text x="292" y="308" class="mono" font-size="9" fill="#545B64" text-anchor="middle">mTLS + Edge</text>

  <rect x="432" y="256" width="112" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="488" y="286" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">ALB</text>
  <text x="488" y="302" class="mono" font-size="9" fill="#545B64" text-anchor="middle">TLS</text>

  <rect x="608" y="256" width="140" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="678" y="298" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Istio Gateway</text>

  <rect x="812" y="256" width="116" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="870" y="280" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Backend</text>
  <text x="870" y="296" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Service</text>
  <text x="870" y="312" class="mono" font-size="9" fill="#545B64" text-anchor="middle">Envoy mTLS</text>

  <!-- edges -->
  <line x1="152" y1="292" x2="216" y2="292" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
  <rect x="166" y="270" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="184" y="279" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.06em">mTLS</text>

  <line x1="368" y1="292" x2="432" y2="292" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
  <rect x="382" y="270" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="400" y="279" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">TLS</text>

  <line x1="544" y1="292" x2="608" y2="292" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
  <rect x="558" y="270" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="576" y="279" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">TLS</text>

  <line x1="748" y1="292" x2="812" y2="292" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
  <rect x="762" y="270" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="780" y="279" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">mTLS</text>

  <!-- legend -->
  <line x1="32" y1="524" x2="928" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="544" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <line x1="140" y1="540" x2="172" y2="540" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
  <text x="180" y="544" font-size="12" fill="#232F3E">CloudFront 엣지 mTLS 검증</text>
  <line x1="440" y1="540" x2="472" y2="540" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
  <text x="480" y="544" font-size="12" fill="#232F3E">내부 TLS / mTLS 구간</text>
</svg>