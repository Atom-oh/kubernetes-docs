<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ray-arch-title ray-arch-desc">
  <title id="ray-arch-title">Ray on Kubernetes architecture flow</title>
  <desc id="ray-arch-desc">KubeRay Operator가 RayCluster/RayJob/RayService 리소스를 받아 분산 학습·튜닝을 담당하는 Ray Train &amp; Tune과 모델·LLM 서빙을 담당하는 Ray Serve로 작업을 나누어 실행시키는 구조를 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== Arrows (drawn before boxes) ===== -->
  <!-- A -> K : same y, straight line -->
  <line x1="240" y1="300" x2="376" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- K -> T : elbow, upper attach point -->
  <path d="M580,290 H622 Q630,290 630,282 V180 Q630,172 638,172 H696"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- K -> S : elbow, lower attach point -->
  <path d="M580,310 H622 Q630,310 630,318 V420 Q630,428 638,428 H696"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Nodes ===== -->

  <!-- A: Architecture -->
  <rect x="40" y="248" width="200" height="104" rx="6" fill="#ffffff"/>
  <rect x="40" y="248" width="200" height="104" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="48" y="260" width="64" height="16" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="80" y="272" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="140" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Architecture</text>
  <text x="140" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Task / Actor / 오브젝트 스토어</text>

  <!-- K: KubeRay Operator (focal) -->
  <rect x="380" y="248" width="200" height="104" rx="6" fill="#ffffff"/>
  <rect x="380" y="248" width="200" height="104" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="388" y="260" width="88" height="16" rx="2" fill="transparent" stroke="rgba(236,114,17,0.55)" stroke-width="0.8"/>
  <text x="432" y="272" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">OPERATOR</text>
  <text x="480" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">KubeRay Operator</text>
  <text x="480" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">RayCluster / RayJob / RayService</text>

  <!-- T: Ray Train & Tune -->
  <rect x="700" y="120" width="200" height="104" rx="6" fill="#ffffff"/>
  <rect x="700" y="120" width="200" height="104" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="708" y="132" width="56" height="16" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="736" y="144" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">TRAIN</text>
  <text x="800" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Ray Train &amp; Tune</text>
  <text x="800" y="194" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">분산 학습, 튜닝</text>

  <!-- S: Ray Serve -->
  <rect x="700" y="376" width="200" height="104" rx="6" fill="#ffffff"/>
  <rect x="700" y="376" width="200" height="104" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="708" y="388" width="56" height="16" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="736" y="400" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SERVE</text>
  <text x="800" y="432" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Ray Serve</text>
  <text x="800" y="450" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">모델 &amp; LLM 서빙</text>

</svg>