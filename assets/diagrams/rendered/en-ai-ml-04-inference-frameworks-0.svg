<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ecosystem-title ecosystem-desc">
    <title id="ecosystem-title">LLM Inference Framework Ecosystem</title>
    <desc id="ecosystem-desc">Map showing how NVIDIA's stack, dev/gateway tools, and the orchestration layer all feed workloads into the open-source inference frameworks, with AWS Native services provisioned in parallel.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows (behind boxes) -->
    <!-- DevTools -> NVIDIAStack (left column x=88..268, top row y=104..184; NVIDIA at x=428) -->
    <path d="M 268,140 H 388" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- DevTools -> OpenSource (accent target center) -->
    <path d="M 208,184 V 300 H 428" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- NVIDIAStack -> OpenSource -->
    <path d="M 508,184 V 300" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- Orchestration -> NVIDIAStack -->
    <path d="M 728,352 V 300 H 588 V 184" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Orchestration -> OpenSource -->
    <path d="M 708,352 V 328" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Orchestration -> AWSNative -->
    <path d="M 788,352 V 300 H 828 V 184" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="298" y="122" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="328" y="132" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GATEWAY</text>

    <rect x="360" y="272" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="386" y="282" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTES</text>

    <rect x="482" y="272" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="508" y="282" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXECUTES</text>

    <rect x="560" y="220" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="588" y="230" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPTIMIZE</text>

    <rect x="682" y="332" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="712" y="342" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCALE</text>

    <rect x="800" y="220" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="828" y="230" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROVISION</text>

    <!-- Node: Dev / Gateway Tools -->
    <rect x="88" y="104" width="180" height="80" rx="6" fill="#ffffff"/>
    <rect x="88" y="104" width="180" height="80" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="96" y="112" width="60" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="126" y="121" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATEWAY</text>
    <text x="178" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Dev / Gateway Tools</text>
    <text x="178" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LiteLLM · Ollama</text>
    <text x="178" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">llama.cpp</text>

    <!-- Node: NVIDIA Stack -->
    <rect x="428" y="104" width="160" height="80" rx="6" fill="#ffffff"/>
    <rect x="428" y="104" width="160" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="436" y="112" width="52" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="462" y="121" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VENDOR</text>
    <text x="508" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">NVIDIA Stack</text>
    <text x="508" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NIM · Dynamo</text>
    <text x="508" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TensorRT-LLM · Triton</text>

    <!-- Node: AWS Native -->
    <rect x="748" y="104" width="160" height="80" rx="6" fill="#ffffff"/>
    <rect x="748" y="104" width="160" height="80" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="756" y="112" width="52" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="782" y="121" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLOUD</text>
    <text x="828" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">AWS Native</text>
    <text x="828" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Neuron SDK</text>
    <text x="828" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Inferentia2 · SageMaker</text>

    <!-- Node: Open Source Frameworks (FOCAL) -->
    <rect x="368" y="300" width="220" height="80" rx="6" fill="#ffffff"/>
    <rect x="368" y="300" width="220" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="376" y="308" width="60" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="406" y="317" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPEN SRC</text>
    <text x="478" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Open Source Frameworks</text>
    <text x="478" y="360" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vLLM · SGLang · TGI</text>
    <text x="478" y="372" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AIBrix · Ray Serve</text>

    <!-- Node: Orchestration Layer -->
    <rect x="668" y="352" width="160" height="80" rx="6" fill="#ffffff"/>
    <rect x="668" y="352" width="160" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="676" y="360" width="52" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="702" y="369" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONTROL</text>
    <text x="748" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Orchestration Layer</text>
    <text x="748" y="412" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KubeRay · Karpenter</text>
    <text x="748" y="424" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KEDA</text>

    <!-- Legend -->
    <line x1="88" y1="484" x2="908" y2="484" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="88" y="500" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="88" y="516" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="108" y="524" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Focal group</text>

    <rect x="248" y="516" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="268" y="524" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Vendor stack</text>

    <rect x="428" y="516" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="448" y="524" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Cloud native</text>

    <rect x="608" y="516" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="628" y="524" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Dev tooling</text>

    <line x1="768" y1="522" x2="796" y2="522" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="804" y="524" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Executes on</text>
  </svg>