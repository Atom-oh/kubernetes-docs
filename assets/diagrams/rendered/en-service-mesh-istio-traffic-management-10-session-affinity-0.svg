<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="sa-title sa-desc">
  <title id="sa-title">Consistent hash session affinity</title>
  <desc id="sa-desc">A client request carrying a user ID is hashed by the load balancer and always routed to the same pod, while the other pod replicas remain unused for that session.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs><defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- header -->
  <text x="40" y="44" fill="#EC7211" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SESSION AFFINITY</text>
  <text x="40" y="72" fill="#232F3E" font-size="24" font-weight="700">Consistent Hash Routing</text>
  <text x="40" y="94" fill="#545B64" font-size="14" font-style="italic">The same user ID always resolves to the same pod, regardless of other replicas.</text>

  <!-- zones (bg -> zones -> arrows -> nodes) -->
  <rect x="220" y="160" width="200" height="280" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="252" y="164" width="136" height="12" rx="2" fill="#ffffff"/>
  <text x="320" y="173" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOAD BALANCER</text>

  <rect x="460" y="160" width="320" height="280" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="558" y="164" width="124" height="12" rx="2" fill="#ffffff"/>
  <text x="620" y="173" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">POD REPLICAS</text>

  <!-- arrows -->
  <!-- User -> Hash (straight, same y) -->
  <line x1="180" y1="300" x2="248" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="182" y="280" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="214" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">USER_ID=123</text>

  <!-- Hash -> Pod1 (elbow, right+up) -->
  <path d="M392,300 H448 Q456,300 456,292 V220 Q456,212 464,212 H520"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="462" y="248" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="466" y="257" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ALWAYS SAME</text>

  <!-- User node -->
  <rect x="40" y="268" width="140" height="64" rx="6" fill="#ffffff"/>
  <rect x="40" y="268" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <rect x="48" y="276" width="34" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.6)" stroke-width="0.8"/>
  <text x="65" y="285" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="110" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">User A</text>
  <text x="110" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">client request</text>

  <!-- Hash node (focal) -->
  <rect x="248" y="260" width="144" height="80" rx="6" fill="#ffffff"/>
  <rect x="248" y="260" width="144" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="256" y="268" width="34" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.6)" stroke-width="0.8"/>
  <text x="273" y="277" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HASH</text>
  <text x="320" y="302" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Consistent Hash</text>
  <text x="320" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">based on user ID</text>

  <!-- Pod 1 (focal, destination) -->
  <rect x="520" y="180" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="520" y="180" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="528" y="188" width="30" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.6)" stroke-width="0.8"/>
  <text x="543" y="197" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
  <text x="620" y="216" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod 1</text>
  <text x="620" y="232" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">session A</text>

  <!-- Pod 2 (unused, dashed) -->
  <rect x="520" y="268" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="520" y="268" width="200" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="528" y="276" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="543" y="285" fill="rgba(35,47,62,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
  <text x="620" y="304" fill="#545B64" font-size="12" font-weight="600" text-anchor="middle">Pod 2</text>

  <!-- Pod 3 (unused, dashed) -->
  <rect x="520" y="356" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="520" y="356" width="200" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="528" y="364" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="543" y="373" fill="rgba(35,47,62,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
  <text x="620" y="392" fill="#545B64" font-size="12" font-weight="600" text-anchor="middle">Pod 3</text>

  <!-- legend -->
  <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="140" y="508" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="162" y="518" fill="#232F3E" font-size="10">Sticky path for this session</text>

  <rect x="380" y="508" width="14" height="14" rx="3" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="402" y="518" fill="#232F3E" font-size="10">Other replicas — never selected for this user</text>

</svg>