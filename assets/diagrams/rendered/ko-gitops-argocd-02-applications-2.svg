<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="argoapp2-title argoapp2-desc">
  <title id="argoapp2-title">ArgoCD 동기화 훅 실행 순서</title>
  <desc id="argoapp2-desc">ArgoCD가 PreSync, Sync, PostSync 훅을 순서대로 실행하고, Sync나 PostSync 단계에서 실패하면 SyncFail 훅으로 전환됨을 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Arrows (behind nodes) -->
  <!-- PreSync -> Sync -->
  <line x1="240" y1="228" x2="360" y2="228" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Sync -> PostSync -->
  <line x1="520" y1="228" x2="640" y2="228" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Sync -.-> SyncFail -->
  <path d="M440,256 V320 Q440,328 448,328 H542 Q550,328 550,336 V400" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <!-- PostSync -.-> SyncFail -->
  <path d="M720,256 V320 Q720,328 712,328 H618 Q610,328 610,336 V400" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Arrow labels -->
  <rect x="466" y="316" width="52" height="14" rx="2" fill="#FFFFFF"/>
  <text x="492" y="326" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">실패 시</text>

  <rect x="642" y="316" width="52" height="14" rx="2" fill="#FFFFFF"/>
  <text x="668" y="326" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">실패 시</text>

  <!-- PreSync Hook -->
  <rect x="80" y="200" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="160" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PreSync Hook</text>
  <text x="160" y="240" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pre-sync</text>

  <!-- Sync (focal) -->
  <rect x="360" y="200" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="440" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sync</text>
  <text x="440" y="240" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">동기화 실행</text>

  <!-- PostSync Hook -->
  <rect x="640" y="200" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="720" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PostSync Hook</text>
  <text x="720" y="240" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">post-sync</text>

  <!-- SyncFail Hook (security treatment) -->
  <rect x="490" y="400" width="180" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="580" y="424" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SyncFail Hook</text>
  <text x="580" y="440" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sync-fail</text>

  <!-- Legend -->
  <line x1="60" y1="510" x2="900" y2="510" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="60" y="526" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="220" y="518" width="24" height="12" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="252" y="528" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">동기화 훅</text>

  <rect x="380" y="518" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="412" y="528" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Sync 단계</text>

  <rect x="540" y="518" width="24" height="12" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="572" y="528" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">실패 처리</text>

  <line x1="700" y1="524" x2="728" y2="524" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="736" y="528" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">실패 시 전환</text>
</svg>