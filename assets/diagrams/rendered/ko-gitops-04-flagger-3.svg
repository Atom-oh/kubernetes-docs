<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3-title t3-desc">
<title id="t3-title">Canary CRD와 배포 프로세스</title>
<desc id="t3-desc">Canary CRD의 대상 리소스 정의가 초기화, 변경 감지, 카나리 스케일업, 트래픽 전환, 메트릭 분석 단계를 거치며, 분석에 성공하면 승격되고 실패하면 초기화 단계로 되돌아가는 순환을 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: Canary CRD -->
<rect x="32" y="32" width="272" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="48" y="36" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="98" y="45" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">CANARY CRD</text>

<!-- Zone: Process -->
<rect x="360" y="32" width="568" height="536" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="376" y="36" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="436" y="45" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">배포 프로세스</text>

<!-- CRD field nodes -->
<rect x="48" y="76" width="240" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="168" y="100" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">targetRef</text>
<text x="168" y="116" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Deployment</text>

<rect x="48" y="164" width="240" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="168" y="188" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">service</text>
<text x="168" y="204" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">포트 · 프로토콜</text>

<rect x="48" y="252" width="240" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="168" y="276" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">analysis</text>
<text x="168" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">메트릭 · 임계값</text>

<rect x="48" y="340" width="240" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="168" y="364" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">provider</text>
<text x="168" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mesh / ingress</text>

<!-- Arrows: CRD -> INIT -->
<line x1="288" y1="104" x2="360" y2="104" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 288,192 H 320 Q 328,192 328,184 V 112 Q 328,104 336,104 H 360" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M 288,280 H 320 Q 328,280 328,272 V 112 Q 328,104 336,104 H 356" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M 288,368 H 320 Q 328,368 328,360 V 112 Q 328,104 336,104 H 352" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>

<!-- Process chain nodes -->
<rect x="360" y="76" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="448" y="108" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">초기화 (Primary 생성)</text>

<rect x="360" y="164" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="448" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">변경 감지</text>

<rect x="360" y="252" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="448" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Canary 스케일 업</text>

<rect x="360" y="340" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="448" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">트래픽 전환</text>

<rect x="360" y="428" width="176" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="448" y="460" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">메트릭 분석</text>

<rect x="712" y="428" width="176" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="800" y="460" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">승격</text>

<!-- Chain arrows -->
<line x1="448" y1="132" x2="448" y2="164" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="448" y1="220" x2="448" y2="252" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="448" y1="308" x2="448" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="448" y1="396" x2="448" y2="428" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Metric -> Promote (success, focal) -->
<line x1="536" y1="456" x2="712" y2="456" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="588" y="440" width="32" height="12" rx="2" fill="#ffffff"/>
<text x="604" y="449" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">성공</text>

<!-- Metric -> Init (failure loop) -->
<path d="M 448,428 V 148 Q 448,140 440,140 H 552 Q 560,140 560,132 V 108 Q 560,100 552,100 H 536"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="572" y="118" width="32" height="12" rx="2" fill="#ffffff"/>
<text x="588" y="127" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">실패</text>

<!-- Legend -->
<line x1="32" y1="524" x2="928" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="32" y="540" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="52" y="548" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">분석 · 승격 (focal)</text>
<line x1="240" y1="546" x2="268" y2="546" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
<text x="276" y="548" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">CRD 필드 참조</text>
</svg>