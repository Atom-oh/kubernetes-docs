<title id="en-service-mesh-istio-comparison-01-service-mesh-comparison-14-title">Linkerd Multi-Cluster via Gateway</title>
<desc id="en-service-mesh-istio-comparison-01-service-mesh-comparison-14-desc">Diagram of Linkerd&#x27;s multi-cluster model: a service routes through a gateway in its source cluster, which mesh-connects over mTLS to a gateway in the target cluster that forwards to a mirrored service.</desc>
