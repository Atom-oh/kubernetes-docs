<desc id="ko-service-mesh-linkerd-02-architecture-4-desc">Pod 안의 linkerd-proxy가 인바운드 트래픽을 TLS 종료 후 애플리케이션에 전달하고, 애플리케이션의 아웃바운드 트래픽을 로드밸런싱과 TLS 처리를 거쳐 다시 내보내는 구조를 보여준다.</desc>
