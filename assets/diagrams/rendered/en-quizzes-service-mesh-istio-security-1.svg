<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="mtls-title mtls-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="mtls-title">Envoy Certificate Auto-Renewal</title>
  <desc id="mtls-desc">Sequence diagram showing Istiod issuing a 24-hour mTLS certificate to an Envoy sidecar, then Envoy requesting and receiving a renewed certificate eight hours before expiry and hot-reloading it without downtime, so the old certificate's expiry at hour 24 has no operational impact.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <style>
      text{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .mono{ font-family:'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- ============ TIME HIGHLIGHT BANDS (background, drawn first) ============ -->
  <rect x="180" y="180" width="600" height="80" rx="6" fill="rgba(122,199,120,0.14)"/>
  <text x="480" y="225" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.10em" fill="#3D7A3A">CERTIFICATE IN USE &#183; T=0&#8211;16H</text>

  <rect x="180" y="452" width="600" height="80" rx="6" fill="rgba(122,199,120,0.14)"/>
  <text x="480" y="497" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.10em" fill="#3D7A3A">USING NEW CERTIFICATE &#183; T=16&#8211;24H</text>

  <!-- ============ LIFELINES ============ -->
  <line x1="280" y1="84" x2="280" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="680" y1="84" x2="680" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ============ TIME AXIS TICKS (left margin) ============ -->
  <text x="24" y="114" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">T=0H</text>
  <text x="24" y="294" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">T=16H</text>
  <text x="24" y="554" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">T=24H</text>

  <!-- ============ ACTIVATION BAR (Istiod, CSR handling) ============ -->
  <rect x="676" y="330" width="8" height="70" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

  <!-- ============ MESSAGES ============ -->

  <!-- msg1: Istiod -> Envoy, T=0h issuance -->
  <line x1="680" y1="110" x2="280" y2="110" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="404" y="88" width="152" height="14" rx="2" fill="#ffffff"/>
  <text x="480" y="98" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.05em" fill="#7D8998">ISSUE CERTIFICATE</text>

  <!-- note1: cert details, right of Envoy lifeline -->
  <text x="296" y="146" class="mono" font-size="9" fill="#545B64">Validity: 24h &#183; X.509 &#183; SPIFFE ID</text>

  <!-- divider: T=16h auto-renewal starts -->
  <line x1="60" y1="294" x2="900" y2="294" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="330" y="284" width="300" height="14" rx="2" fill="#ffffff"/>
  <text x="480" y="294" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.04em" fill="#545B64">AUTO-RENEWAL STARTS (8H BEFORE EXPIRY)</text>

  <!-- msg2: Envoy -> Istiod, CSR request -->
  <line x1="280" y1="330" x2="676" y2="330" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="410" y="308" width="140" height="14" rx="2" fill="#ffffff"/>
  <text x="480" y="318" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.05em" fill="#7D8998">REQUEST CSR</text>

  <!-- note2: validation + generation, left of Istiod lifeline -->
  <text x="664" y="356" text-anchor="end" class="mono" font-size="9" fill="#545B64">Validate SPIFFE ID &#183; generate cert</text>

  <!-- msg3: Istiod -> Envoy, renewed cert issued (HEADLINE) -->
  <line x1="680" y1="400" x2="280" y2="400" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="404" y="378" width="152" height="14" rx="2" fill="#ffffff"/>
  <text x="480" y="388" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.05em" fill="#EC7211">ISSUE CERTIFICATE</text>

  <!-- msg4: self-message on Envoy, hot reload -->
  <path d="M280,432 L340,432 L340,458 L280,458" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="346" y="435" width="150" height="26" rx="2" fill="#ffffff"/>
  <text x="352" y="445" class="mono" font-size="8" letter-spacing="0.04em" fill="#7D8998">CERT ROTATION</text>
  <text x="352" y="457" class="mono" font-size="8" letter-spacing="0.04em" fill="#7D8998">(HOT RELOAD, NO DOWNTIME)</text>

  <!-- divider: T=24h expiry, no impact -->
  <line x1="60" y1="554" x2="900" y2="554" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="300" y="544" width="360" height="14" rx="2" fill="#ffffff"/>
  <text x="480" y="554" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.04em" fill="#545B64">PREVIOUS CERTIFICATE EXPIRES &#8212; NO IMPACT</text>

  <!-- ============ PARTICIPANT BOXES (drawn after messages/bands, before top labels) ============ -->
  <text x="280" y="30" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.14em" fill="#7D8998">POD</text>
  <rect x="180" y="36" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Envoy Sidecar</text>

  <text x="680" y="30" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.14em" fill="#7D8998">CONTROL PLANE</text>
  <rect x="580" y="36" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="680" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Istiod (CA)</text>

</svg>