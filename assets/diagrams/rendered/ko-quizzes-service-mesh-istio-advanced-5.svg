<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bluegreen-title bluegreen-desc">
    <title id="bluegreen-title">Argo Rollouts 블루-그린 배포 흐름</title>
    <desc id="bluegreen-desc">사용자 트래픽은 Istio Gateway를 거쳐 Active Service의 Blue 버전으로 가고, Preview Service는 미리보기 트래픽만 Green 버전으로 보내며, AnalysisTemplate이 Green을 분석해 성공하면 트래픽을 전환하고 실패하면 롤백하는 흐름을 보여준다.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#FFFFFF"/>

    <!-- User -> Gateway -->
    <line x1="140" y1="96" x2="200" y2="96" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Gateway -> ActiveService -->
    <path d="M328,88 H356 Q364,88 364,80 V72 Q364,64 372,64 H400" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="333" y="60" width="60" height="12" rx="2" fill="#FFFFFF"/>
    <text x="363" y="69" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">프로덕션</text>

    <!-- Gateway -> PreviewService (dashed) -->
    <path d="M328,104 H356 Q364,104 364,112 V168 Q364,176 372,176 H400" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="333" y="182" width="60" height="12" rx="2" fill="#FFFFFF"/>
    <text x="363" y="191" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">미리보기</text>

    <!-- ActiveService -> Blue -->
    <line x1="560" y1="64" x2="640" y2="64" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- PreviewService -> Green -->
    <line x1="560" y1="176" x2="640" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Analysis -> Green (metric analysis) -->
    <path d="M450,280 V248 Q450,240 458,240 H692 Q700,240 700,232 V200" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="519" y="220" width="112" height="12" rx="2" fill="#FFFFFF"/>
    <text x="575" y="229" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">메트릭 분석</text>

    <!-- Analysis -> Promote&Swap (success, accent, straight) -->
    <line x1="480" y1="320" x2="480" y2="400" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="488" y="352" width="48" height="12" rx="2" fill="#FFFFFF"/>
    <text x="512" y="361" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">성공</text>

    <!-- Analysis -> Rollback (failure) -->
    <path d="M560,300 H647 Q655,300 655,308 V392 Q655,400 663,400 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="671" y="340" width="48" height="12" rx="2" fill="#FFFFFF"/>
    <text x="695" y="349" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">실패</text>

    <!-- Nodes -->
    <!-- User -->
    <rect x="40" y="76" width="100" height="40" rx="6" fill="rgba(84,91,100,0.10)"/>
    <rect x="40" y="76" width="100" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="90" y="100" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">사용자</text>

    <!-- Gateway -->
    <rect x="200" y="76" width="128" height="40" rx="6" fill="#ffffff"/>
    <rect x="200" y="76" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="264" y="100" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio Gateway</text>

    <!-- ActiveService -->
    <rect x="400" y="40" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="400" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Active Service</text>
    <text x="480" y="74" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">프로덕션 트래픽</text>

    <!-- PreviewService -->
    <rect x="400" y="152" width="160" height="48" rx="6" fill="rgba(35,47,62,0.02)"/>
    <rect x="400" y="152" width="160" height="48" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="480" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Preview Service</text>
    <text x="480" y="186" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">테스트 트래픽</text>

    <!-- Blue -->
    <rect x="640" y="40" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="640" y="40" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="700" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Blue</text>
    <text x="700" y="74" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">현재 버전 v1</text>

    <!-- Green -->
    <rect x="640" y="152" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="640" y="152" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="700" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Green</text>
    <text x="700" y="186" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">새 버전 v2</text>

    <!-- Analysis -->
    <rect x="400" y="280" width="160" height="40" rx="6" fill="#ffffff"/>
    <rect x="400" y="280" width="160" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AnalysisTemplate</text>

    <!-- Promote & Swap (focal) -->
    <rect x="380" y="400" width="200" height="48" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="380" y="400" width="200" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="420" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">트래픽 전환</text>
    <text x="480" y="434" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">active ↔ preview swap</text>

    <!-- Rollback -->
    <rect x="680" y="400" width="140" height="40" rx="6" fill="#ffffff"/>
    <rect x="680" y="400" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="750" y="424" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">롤백</text>

    <!-- Legend -->
    <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="560" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="140" y1="557" x2="164" y2="557" stroke="#545B64" stroke-width="1.2"/>
    <text x="172" y="561" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">PRODUCTION PATH</text>

    <line x1="360" y1="557" x2="384" y2="557" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="392" y="561" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">PREVIEW (TEST) PATH</text>

    <rect x="620" y="550" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="642" y="561" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">TRAFFIC SWITCH ACTION</text>
  </svg>