<title id="en-service-mesh-istio-02-basic-concepts-2-title">How Envoy Solved Legacy Proxy Problems</title>
<desc id="en-service-mesh-istio-02-basic-concepts-2-desc">Diagram pairing four limitations of pre-Envoy proxies — static file-based configuration, limited metrics, complex restarts, simple routing — with the Envoy capability that solved each one.</desc>
