<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mimir-tenant-isolation-title mimir-tenant-isolation-desc">
<title id="mimir-tenant-isolation-title">Mimir multi-tenant isolation</title>
<desc id="mimir-tenant-isolation-desc">Each tenant's samples carry an X-Scope-OrgID header through a shared Distributor and Ingester, which write to a separate object-storage prefix per tenant so data never mixes across tenants.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- zone: Mimir -->
<rect x="380" y="240" width="200" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="400" y="244" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="424" y="253" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">MIMIR</text>

<!-- ============ ARROWS ============ -->

<!-- Tenant A -> Distributor -->
<path d="M180,180 H340 Q348,180 348,188 V264 Q348,272 356,272 H380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="200" y="160" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="244" y="169" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ORGID: A</text>

<!-- Tenant B -> Distributor (straight, same row) -->
<line x1="180" y1="296" x2="380" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="248" y="276" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="292" y="285" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ORGID: B</text>

<!-- Tenant C -> Distributor -->
<path d="M180,412 H340 Q348,412 348,404 V328 Q348,320 356,320 H380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="200" y="420" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="244" y="429" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ORGID: C</text>

<!-- Distributor -> Ingester -->
<line x1="480" y1="296" x2="500" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Ingester -> tenant-a blocks -->
<path d="M580,280 H700 Q708,280 708,272 V196 Q708,188 716,188 H740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Ingester -> tenant-b blocks (straight) -->
<line x1="580" y1="296" x2="740" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Ingester -> tenant-c blocks -->
<path d="M580,312 H700 Q708,312 708,320 V396 Q708,404 716,404 H740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ============ NODES ============ -->

<!-- Tenants -->
<rect x="40" y="148" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="40" y="148" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="110" y="178" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tenant A</text>
<text x="110" y="194" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Team A</text>

<rect x="40" y="264" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="40" y="264" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="110" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tenant B</text>
<text x="110" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Team B</text>

<rect x="40" y="380" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="40" y="380" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="110" y="410" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tenant C</text>
<text x="110" y="426" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Team C</text>

<!-- Distributor (focal) -->
<rect x="380" y="264" width="100" height="64" rx="6" fill="#ffffff"/>
<rect x="380" y="264" width="100" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="430" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Distributor</text>
<text x="430" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">validates tenant</text>

<!-- Ingester -->
<rect x="500" y="264" width="80" height="64" rx="6" fill="#ffffff"/>
<rect x="500" y="264" width="80" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="540" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Ingester</text>

<!-- Object storage: tenant-a/b/c blocks -->
<rect x="740" y="164" width="160" height="48" rx="6" fill="#ffffff"/>
<rect x="740" y="164" width="160" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="820" y="184" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">tenant-a/</text>
<text x="820" y="200" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">blocks/</text>

<rect x="740" y="272" width="160" height="48" rx="6" fill="#ffffff"/>
<rect x="740" y="272" width="160" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="820" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">tenant-b/</text>
<text x="820" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">blocks/</text>

<rect x="740" y="380" width="160" height="48" rx="6" fill="#ffffff"/>
<rect x="740" y="380" width="160" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="820" y="400" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">tenant-c/</text>
<text x="820" y="416" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">blocks/</text>

<!-- legend -->
<line x1="40" y1="512" x2="900" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="160" y="518" width="14" height="12" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="182" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">tenant client</text>
<rect x="320" y="518" width="14" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="342" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Distributor (focal)</text>
<rect x="520" y="518" width="14" height="12" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="542" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">object storage, per-tenant prefix</text>

</svg>