<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obs-arch-title obs-arch-desc">
    <title id="obs-arch-title">Linkerd 관찰성 아키텍처</title>
    <desc id="obs-arch-desc">데이터 플레인 프록시가 수집한 메트릭이 Viz 확장의 Prometheus에 모이고, 이를 통해 Grafana와 Web Dashboard가 시각화되며, 선택적으로 외부 Prometheus/Grafana 및 Jaeger 분산 추적으로 확장되는 구조를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#FFFFFF"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="40" y="224" width="180" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="60" y="228" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="104" y="237" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA PLANE</text>

    <rect x="230" y="76" width="420" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="250" y="80" width="104" height="12" rx="2" fill="#FFFFFF"/>
    <text x="302" y="89" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VIZ EXTENSION</text>

    <rect x="700" y="140" width="220" height="260" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="720" y="144" width="140" height="12" rx="2" fill="#FFFFFF"/>
    <text x="790" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL (선택)</text>

    <!-- Arrows (behind nodes) -->
    <!-- E1: Proxy -> Prometheus (:4191) -->
    <path d="M180,288 H232 Q240,288 240,280 V148 Q240,140 248,140 H300"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="248" y="204" width="40" height="12" rx="2" fill="#FFFFFF"/>
    <text x="268" y="213" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">:4191</text>

    <!-- E2: Prometheus -> Grafana -->
    <line x1="460" y1="140" x2="490" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- E3: Prometheus -> Web Dashboard (via Metrics API) -->
    <path d="M400,172 V262 Q400,270 408,270 H492 Q500,270 500,278 V368"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="410" y="256" width="86" height="12" rx="2" fill="#FFFFFF"/>
    <text x="453" y="265" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">METRICS API</text>

    <!-- E4: Tap API -> Web Dashboard -->
    <line x1="390" y1="400" x2="420" y2="400" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- E5: Prometheus -> External (dashed, optional) -->
    <path d="M440,172 V180 Q440,188 448,188 H720"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- E6: Proxy -> Jaeger (dashed, optional) -->
    <path d="M120,320 V452 Q120,460 128,460 H802 Q810,460 810,452 V368"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Node: Proxy (Data Plane) -->
    <rect x="60" y="256" width="120" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="60" y="256" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <rect x="68" y="264" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="82" y="273" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">×3</text>
    <text x="120" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Proxy</text>
    <text x="120" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">메트릭 수집</text>

    <!-- Node: Prometheus (focal) -->
    <rect x="300" y="108" width="160" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="300" y="108" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="308" y="116" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="324" y="125" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TSDB</text>
    <text x="380" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
    <text x="380" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">메트릭 저장</text>

    <!-- Node: Grafana -->
    <rect x="490" y="112" width="140" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="490" y="112" width="140" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <rect x="498" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="512" y="129" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIZ</text>
    <text x="560" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana</text>
    <text x="560" y="156" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">시각화</text>

    <!-- Node: Tap API -->
    <rect x="250" y="372" width="140" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="250" y="372" width="140" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <rect x="258" y="380" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="272" y="389" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIZ</text>
    <text x="320" y="400" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tap API</text>
    <text x="320" y="416" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">실시간 스트림</text>

    <!-- Node: Web Dashboard -->
    <rect x="420" y="368" width="160" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="420" y="368" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <rect x="428" y="376" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="442" y="385" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
    <text x="500" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Web Dashboard</text>
    <text x="500" y="420" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Metrics API 집계</text>

    <!-- Node: External Prometheus/Grafana -->
    <rect x="720" y="172" width="180" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="720" y="172" width="180" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="728" y="180" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="744" y="189" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="810" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">External Prometheus /</text>
    <text x="810" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Grafana</text>

    <!-- Node: Jaeger -->
    <rect x="720" y="312" width="180" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="720" y="312" width="180" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="728" y="320" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="744" y="329" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="810" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Jaeger</text>
    <text x="810" y="360" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">분산 추적</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="530" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">핵심 저장소 (Prometheus)</text>

    <rect x="260" y="530" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="280" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Viz 확장 구성요소</text>

    <rect x="460" y="530" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">외부(선택) 연동</text>

    <line x1="660" y1="535" x2="688" y2="535" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="696" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">선택적 연동 흐름</text>
  </svg>