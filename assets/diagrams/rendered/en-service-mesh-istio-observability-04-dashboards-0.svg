  <line x1="180" y1="624" x2="204" y2="624" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="212" y="628" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Telemetry flow</text>

  <line x1="380" y1="624" x2="404" y2="624" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="412" y="628" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Config push</text>

  <rect x="608" y="617" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="632" y="628" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Primary metrics store</text>
</svg>