<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obs-stack-title obs-stack-desc">
  <title id="obs-stack-title">Istio observability stack architecture</title>
  <desc id="obs-stack-desc">Envoy sidecars in the data plane send metrics, logs, and traces to Prometheus, Loki, Jaeger, and Tempo; those backends feed Kiali, Grafana, and the Jaeger UI, while istiod pushes configuration state to Kiali for validation.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#ffffff"/>

  <!-- ===== Zones (bg -> zones -> arrows -> nodes) ===== -->
  <rect x="76" y="40" width="248" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="88" y="44" width="104" height="12" rx="2" fill="#ffffff"/>
  <text x="140" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA PLANE</text>

  <rect x="676" y="40" width="208" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="688" y="44" width="124" height="12" rx="2" fill="#ffffff"/>
  <text x="750" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE</text>

  <rect x="76" y="272" width="808" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="88" y="276" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="158" y="285" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">METRICS BACKEND</text>

  <rect x="124" y="448" width="712" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="136" y="452" width="128" height="12" rx="2" fill="#ffffff"/>
  <text x="200" y="461" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VISUALIZATION</text>

  <!-- ===== Arrows: Data Plane -> Metrics Backend ===== -->
  <path d="M140,152 V236 Q140,244 148,244 H172 Q180,244 180,252 V304" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M180,152 V212 Q180,220 188,220 H372 Q380,220 380,228 V304" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M220,152 V188 Q220,196 228,196 H572 Q580,196 580,204 V304" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M260,152 V164 Q260,172 268,172 H772 Q780,172 780,180 V304" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- arrow labels: Metrics / Logs / Traces / Traces -->
  <rect x="142" y="252" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="160" y="261" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">METRICS</text>

  <rect x="262" y="228" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="277" y="237" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOGS</text>

  <rect x="382" y="204" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="400" y="213" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRACES</text>

  <rect x="502" y="180" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="520" y="189" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRACES</text>

  <!-- ===== Arrows: Metrics Backend -> Visualization ===== -->
  <path d="M780,384 V388 Q780,396 772,396 H538 Q530,396 530,404 V480" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M220,384 V404 Q220,412 228,412 H422 Q430,412 430,420 V480" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M580,384 V420 Q580,428 588,428 H704 Q712,428 712,436 V480" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M140,384 V436 Q140,444 148,444 H240 Q248,444 248,452 V480" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <path d="M380,384 V452 Q380,460 388,460 H472 Q480,460 480,468 V480" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Config push: istiod -> Kiali (dashed, routed via right/bottom margin) ===== -->
  <path d="M860,112 H904 Q912,112 912,120 V600 Q912,608 904,608 H256 Q248,608 248,600 V560"
        fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="562" y="588" width="52" height="12" rx="2" fill="#ffffff"/>
  <text x="588" y="597" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG</text>

  <!-- ===== Nodes ===== -->

  <!-- Envoy Sidecars (Data Plane) -->
  <rect x="100" y="72" width="200" height="80" rx="6" fill="#ffffff"/>
  <rect x="100" y="72" width="200" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="108" y="80" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="130" y="89" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>
  <text x="200" y="118" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecars</text>
  <text x="200" y="134" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3x proxy instances</text>

  <!-- istiod (Control Plane) -->
  <rect x="700" y="72" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="700" y="72" width="160" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="708" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="720" y="89" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CP</text>
  <text x="780" y="118" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">istiod</text>
  <text x="780" y="134" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">config &amp; xDS</text>

  <!-- Prometheus (focal) -->
  <rect x="100" y="304" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="100" y="304" width="160" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="108" y="312" width="40" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.55)" stroke-width="0.8"/>
  <text x="128" y="321" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TSDB</text>
  <text x="180" y="350" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
  <text x="180" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">metrics store</text>

  <!-- Loki -->
  <rect x="300" y="304" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="300" y="304" width="160" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="308" y="312" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="328" y="321" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOGS</text>
  <text x="380" y="350" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Loki</text>
  <text x="380" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">log store</text>

  <!-- Jaeger -->
  <rect x="500" y="304" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="500" y="304" width="160" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="508" y="312" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="530" y="321" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRACE</text>
  <text x="580" y="350" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Jaeger</text>
  <text x="580" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trace store</text>

  <!-- Tempo -->
  <rect x="700" y="304" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="700" y="304" width="160" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="708" y="312" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="730" y="321" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRACE</text>
  <text x="780" y="350" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tempo</text>
  <text x="780" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trace store</text>

  <!-- Kiali -->
  <rect x="148" y="480" width="200" height="80" rx="6" fill="#ffffff"/>
  <rect x="148" y="480" width="200" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="156" y="488" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="168" y="497" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
  <text x="248" y="526" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kiali</text>
  <text x="248" y="542" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">service graph</text>

  <!-- Grafana -->
  <rect x="380" y="480" width="200" height="80" rx="6" fill="#ffffff"/>
  <rect x="380" y="480" width="200" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="388" y="488" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="400" y="497" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
  <text x="480" y="526" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana</text>
  <text x="480" y="542" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">metrics &amp; log dashboards</text>

  <!-- Jaeger UI -->
  <rect x="612" y="480" width="200" height="80" rx="6" fill="#ffffff"/>
  <rect x="612" y="480" width="200" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="620" y="488" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="632" y="497" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
  <text x="712" y="526" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Jaeger UI</text>
  <text x="712" y="542" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">distributed tracing</text>

  <!-- ===== Legend ===== -->
  <line x1="76" y1="608" x2="884" y2="608" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
