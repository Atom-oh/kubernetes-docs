<title id="en-service-mesh-linkerd-02-architecture-3-title">Proxy Injector Admission Webhook</title>
<desc id="en-service-mesh-linkerd-02-architecture-3-desc">Sequence diagram showing the Kubernetes API server calling the Proxy Injector admission webhook on pod creation, which either injects the linkerd-proxy sidecar and returns a mutated pod spec, or returns the pod unchanged when injection is disabled.</desc>
