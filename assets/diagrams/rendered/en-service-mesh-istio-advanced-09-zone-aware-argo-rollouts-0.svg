<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pdb-outage-title pdb-outage-desc">
<title id="pdb-outage-title">Spot Instance zone outage and PodDisruptionBudget balance</title>
<desc id="pdb-outage-desc">Before a Spot Instance interruption, three zones each run 3 pods and the PodDisruptionBudget requires 6 of 9 pods; after Zone C is fully lost, only Zone A and B remain and the same 6-pod minimum now equals 100% of remaining capacity, breaking the budget's safety margin.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zones (drawn before arrows/nodes) -->
<rect x="24" y="40" width="392" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="60" y="44" width="176" height="12" rx="2" fill="#ffffff"/>
<text x="148" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BEFORE FULL ZONE OUTAGE</text>

<rect x="544" y="40" width="392" height="320" rx="8" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.35)" stroke-width="0.8" stroke-dasharray="4,4"/>
<rect x="580" y="44" width="188" height="12" rx="2" fill="#ffffff"/>
<text x="674" y="53" fill="#DD344C" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AFTER ZONE C FULL OUTAGE</text>

<!-- Arrow marker + connector: Before -> After -->
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<path d="M 416,200 H 544" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="438" y="176" width="84" height="24" rx="2" fill="#ffffff"/>
<text x="480" y="185" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SPOT INSTANCE</text>
<text x="480" y="195" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">INTERRUPTION</text>

<!-- BEFORE nodes: 2x2 grid -->
<!-- Zone A1 -->
<rect x="60" y="80" width="160" height="72" rx="6" fill="#ffffff"/>
<rect x="60" y="80" width="160" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="140" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Zone A</text>
<text x="140" y="128" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 pods</text>

<!-- Zone B1 -->
<rect x="240" y="80" width="160" height="72" rx="6" fill="#ffffff"/>
<rect x="240" y="80" width="160" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="320" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Zone B</text>
<text x="320" y="128" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 pods</text>

<!-- Zone C1 -->
<rect x="60" y="176" width="160" height="72" rx="6" fill="#ffffff"/>
<rect x="60" y="176" width="160" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="140" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Zone C</text>
<text x="140" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 pods</text>

<!-- PDB1 -->
<rect x="240" y="176" width="160" height="72" rx="6" fill="#ffffff"/>
<rect x="240" y="176" width="160" height="72" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="320" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PDB: 33%</text>
<text x="320" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">min 6/9 pods</text>

<!-- caption row before -->
<text x="140" y="332" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">STEADY STATE</text>

<!-- AFTER nodes -->
<!-- Zone A2 -->
<rect x="580" y="80" width="160" height="72" rx="6" fill="#ffffff"/>
<rect x="580" y="80" width="160" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="660" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Zone A</text>
<text x="660" y="128" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 pods · normal</text>

<!-- Zone B2 -->
<rect x="760" y="80" width="160" height="72" rx="6" fill="#ffffff"/>
<rect x="760" y="80" width="160" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="840" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Zone B</text>
<text x="840" y="128" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 pods · normal</text>

<!-- Zone C2 (failed, focal) -->
<rect x="580" y="176" width="160" height="72" rx="6" fill="#ffffff"/>
<rect x="580" y="176" width="160" height="72" rx="6" fill="rgba(221,52,76,0.08)" stroke="#DD344C" stroke-width="1.2"/>
<text x="660" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Zone C</text>
<text x="660" y="224" fill="#DD344C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0 pods · outage</text>

<!-- PDB2 (focal, accent) -->
<rect x="760" y="176" width="160" height="72" rx="6" fill="#ffffff"/>
<rect x="760" y="176" width="160" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="840" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PDB: 33%</text>
<text x="840" y="220" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">6/6 = 100%</text>

<text x="660" y="332" fill="#DD344C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BALANCE BROKEN</text>

<!-- legend -->
<line x1="24" y1="376" x2="936" y2="376" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<circle cx="30" cy="388" r="3.5" fill="#545B64"/>
<text x="40" y="391" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">HEALTHY ZONE</text>
<circle cx="180" cy="388" r="3.5" fill="#DD344C"/>
<text x="190" y="391" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">ZONE OUTAGE</text>
<circle cx="330" cy="388" r="3.5" fill="#EC7211"/>
<text x="340" y="391" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">PDB AT RISK</text>
</svg>