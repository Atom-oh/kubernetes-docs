    <title id="ko-service-mesh-istio-advanced-02-multi-cluster-2-title">Route53 기반 Active-Standby 재해 복구 흐름</title>
    <desc id="ko-service-mesh-istio-advanced-02-multi-cluster-2-desc">Global DNS(Route53)가 평상시 100% 트래픽을 활성 클러스터로 보내고, 재해 발생 시 대기 클러스터로 전환하며, 두 클러스터는 실시간 구성 복제로 연결된 DR 구조.</desc>
