<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
  <title id="t1">Locality load-balancing decision flow</title>
  <desc id="d1">A request is routed by first checking for healthy pods in the same zone; if none, it checks the adjacent zone; if none there either, it falls back to another region entirely.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;}</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="40" y="32" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ISTIO · LOCALITY LOAD BALANCING</text>
  <text x="40" y="56" fill="#232F3E" font-size="20" font-weight="700">Locality load-balancing decision</text>

  <!-- Arrows first -->
  <!-- Request -> CheckLocal (vertical, shared x) -->
  <line x1="300" y1="120" x2="300" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- CheckLocal -> LocalRoute (Yes, right, shared y) -->
  <line x1="400" y1="230" x2="468" y2="230" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="411" y="210" width="42" height="12" rx="2" fill="#ffffff"/>
  <text x="432" y="219" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

  <!-- CheckLocal -> CheckNearby (No, down, shared x) -->
  <line x1="300" y1="308" x2="300" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="308" y="312" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="323" y="321" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

  <!-- CheckNearby -> NearbyRoute (Yes, right, shared y) -->
  <line x1="400" y1="414" x2="468" y2="414" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="411" y="394" width="42" height="12" rx="2" fill="#ffffff"/>
  <text x="432" y="403" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

  <!-- CheckNearby -> RemoteRoute (No, down, shared x) -->
  <line x1="300" y1="492" x2="300" y2="520" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="308" y="496" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="323" y="505" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

  <!-- Nodes -->
  <!-- Request (oval, start) -->
  <rect x="220" y="88" width="160" height="32" rx="16" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="300" y="108" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Request Arrives</text>

  <!-- CheckLocal (diamond, focal) -->
  <polygon points="300,152 400,230 300,308 200,230" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="300" y="226" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Healthy pods in</text>
  <text x="300" y="242" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">same zone?</text>

  <!-- LocalRoute (rect, focal happy path) -->
  <rect x="468" y="198" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="568" y="225" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Route to same zone</text>
  <text x="568" y="241" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">weight: 80-100%</text>

  <!-- CheckNearby (diamond) -->
  <polygon points="300,336 400,414 300,492 200,414" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="300" y="410" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Healthy pods in</text>
  <text x="300" y="426" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">adjacent zone?</text>

  <!-- NearbyRoute (rect) -->
  <rect x="468" y="382" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="568" y="409" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Route to adjacent zone</text>
  <text x="568" y="425" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">weight: 10-20%</text>

  <!-- RemoteRoute (rect, terminal) -->
  <rect x="200" y="520" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="300" y="547" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Route to other region</text>
  <text x="300" y="563" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">last resort</text>
</svg>