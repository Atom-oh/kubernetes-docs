<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-labelledby="cilium-security-title cilium-security-desc">
  <title id="cilium-security-title">Cilium 보안 계층과 Hubble 가시성 파이프라인</title>
  <desc id="cilium-security-desc">Cilium의 보안 계층은 트래픽이 네트워크 보안(L3/L4 정책, 암호화, 마이크로세그멘테이션)과 애플리케이션 보안(L7 정책, API 인식 필터링, ID 기반 정책)을 거치며, 두 계층 모두 Hubble 관찰성을 중심으로 한 위협 탐지로 흘러들고, ID 기반 정책은 별도로 런타임 보안(프로세스·시스템콜·컨테이너 보안)으로 이어짐을 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .mono { font-family: 'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; }
      .eyebrow { font-family: 'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; font-size: 7.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
      .title { font-weight: 700; }
      .name { font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#EC7211"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="30" class="eyebrow" fill="#7D8998">CILIUM 보안 아키텍처</text>
  <text x="40" y="52" font-weight="600" font-size="17" fill="#232F3E"><tspan>보</tspan><tspan>안</tspan><tspan> </tspan><tspan>계</tspan><tspan>층</tspan><tspan>과</tspan><tspan> </tspan><tspan>Hubble</tspan><tspan> </tspan><tspan>가</tspan><tspan>시</tspan><tspan>성</tspan><tspan> </tspan><tspan>파</tspan><tspan>이</tspan><tspan>프</tspan><tspan>라</tspan><tspan>인</tspan></text>

  <!-- ===== ARROWS (drawn before nodes) ===== -->
  <!-- Traffic -> Network Security -->
  <line x1="136" y1="240" x2="176" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Network Security -> App Security -->
  <line x1="352" y1="240" x2="392" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- App Security -> Threat Detection (accent, primary flow into focal) -->
  <line x1="568" y1="240" x2="604" y2="240" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- Network Security -> Threat Detection (bridge over the top) -->
  <path d="M264,140 V124 Q264,116 272,116 H688 Q696,116 696,124 V136"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- App Security -> Runtime Security -->
  <line x1="480" y1="340" x2="480" y2="376" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Traffic entry node ===== -->
  <rect x="40" y="220" width="96" height="40" rx="6" fill="#232F3E" stroke="#232F3E" stroke-width="1"/>
  <text x="88" y="244" class="name" font-size="12" fill="#FFFFFF" text-anchor="middle">트래픽</text>

  <!-- ===== Network Security card ===== -->
  <g>
    <rect x="176" y="140" width="176" height="200" rx="8" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="264" y="164" class="name" font-size="12" fill="#232F3E" text-anchor="middle">네트워크 보안</text>
    <line x1="196" y1="174" x2="332" y2="174" stroke="#D5DBDB" stroke-width="0.8"/>
    <g>
      <rect x="196" y="186" width="136" height="26" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="264" y="203" class="mono" font-size="9" fill="#545B64" text-anchor="middle">L3/L4 정책</text>
    </g>
    <g>
      <rect x="196" y="222" width="136" height="26" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="264" y="239" class="mono" font-size="9" fill="#545B64" text-anchor="middle">암호화</text>
    </g>
    <g>
      <rect x="196" y="258" width="136" height="26" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="264" y="275" class="mono" font-size="9" fill="#545B64" text-anchor="middle">마이크로세그멘테이션</text>
    </g>
  </g>

  <!-- ===== Application Security card ===== -->
  <g>
    <rect x="392" y="140" width="176" height="200" rx="8" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="164" class="name" font-size="12" fill="#232F3E" text-anchor="middle">애플리케이션 보안</text>
    <line x1="412" y1="174" x2="548" y2="174" stroke="#D5DBDB" stroke-width="0.8"/>
    <g>
      <rect x="412" y="186" width="136" height="26" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="480" y="203" class="mono" font-size="9" fill="#545B64" text-anchor="middle">L7 정책</text>
    </g>
    <g>
      <rect x="412" y="222" width="136" height="26" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="480" y="239" class="mono" font-size="9" fill="#545B64" text-anchor="middle">API 인식 필터링</text>
    </g>
    <g>
      <rect x="412" y="258" width="136" height="26" rx="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="0.8"/>
      <text x="480" y="275" class="mono" font-size="9" fill="#232F3E" text-anchor="middle">ID 기반 정책</text>
    </g>
  </g>

  <!-- ===== Threat Detection card (focal) ===== -->
  <g>
    <rect x="604" y="140" width="176" height="200" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="692" y="164" class="name" font-size="12" fill="#232F3E" text-anchor="middle">위협 탐지</text>
    <line x1="624" y1="174" x2="760" y2="174" stroke="#EC7211" stroke-width="0.8" opacity="0.4"/>
    <g>
      <rect x="624" y="186" width="136" height="26" rx="4" fill="#FFFFFF" stroke="#EC7211" stroke-width="1"/>
      <text x="692" y="203" class="mono" font-size="9" font-weight="600" fill="#EC7211" text-anchor="middle">Hubble 관찰성</text>
    </g>
    <g>
      <rect x="624" y="222" width="136" height="26" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="692" y="239" class="mono" font-size="9" fill="#545B64" text-anchor="middle">침입 탐지</text>
    </g>
    <g>
      <rect x="624" y="258" width="136" height="26" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="692" y="275" class="mono" font-size="9" fill="#545B64" text-anchor="middle">이상 탐지</text>
    </g>
  </g>

  <!-- ===== Runtime Security card ===== -->
  <g>
    <rect x="392" y="376" width="176" height="176" rx="8" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="400" class="name" font-size="12" fill="#232F3E" text-anchor="middle">런타임 보안</text>
    <line x1="412" y1="410" x2="548" y2="410" stroke="#D5DBDB" stroke-width="0.8"/>
    <g>
      <rect x="412" y="422" width="136" height="26" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="480" y="439" class="mono" font-size="9" fill="#545B64" text-anchor="middle">프로세스 모니터링</text>
    </g>
    <g>
      <rect x="412" y="458" width="136" height="26" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="480" y="475" class="mono" font-size="9" fill="#545B64" text-anchor="middle">시스템 콜 필터링</text>
    </g>
    <g>
      <rect x="412" y="494" width="136" height="26" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="480" y="511" class="mono" font-size="9" fill="#545B64" text-anchor="middle">컨테이너 보안</text>
    </g>
  </g>

  <!-- edge label for bridged connection -->
  <rect x="452" y="102" width="56" height="14" fill="#FFFFFF"/>
  <text x="480" y="112" class="mono" font-size="7.5" fill="#7D8998" text-anchor="middle" letter-spacing="0.04em">FLOW LOGS</text>

</svg>