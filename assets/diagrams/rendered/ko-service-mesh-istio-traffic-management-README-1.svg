<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="tm1-title tm1-desc">
      <title id="tm1-title">요청부터 파드까지, Istio 트래픽 흐름 파이프라인</title>
      <desc id="tm1-desc">사용자 요청이 Ingress Gateway를 지나 VirtualService의 라우팅 단계, DestinationRule의 정책 단계를 차례로 통과한 뒤 파드로 전달되는 5단계 파이프라인.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Arrows (drawn before nodes) — all straight, centers aligned on y=300 -->
      <line x1="180" y1="300" x2="220" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="184" y="280" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="200" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">요청</text>

      <line x1="320" y1="300" x2="368" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="536" y1="300" x2="584" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="752" y1="300" x2="800" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Node: User (input) -->
      <rect x="60" y="268" width="120" height="64" rx="6" fill="#ffffff"/>
      <rect x="60" y="268" width="120" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="120" y="296" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">사용자</text>
      <text x="120" y="312" fill="#545B64" font-size="9"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">외부 요청</text>

      <!-- Node: Ingress Gateway -->
      <rect x="220" y="260" width="100" height="80" rx="6" fill="#ffffff"/>
      <rect x="220" y="260" width="100" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="270" y="286" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">Gateway</text>
      <text x="270" y="304" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">포트 80/443</text>
      <text x="270" y="318" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">INGRESS</text>

      <!-- Node: VirtualService group -->
      <rect x="368" y="228" width="168" height="144" rx="6" fill="#ffffff"/>
      <rect x="368" y="228" width="168" height="144" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="452" y="250" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">VirtualService 라우팅</text>
      <line x1="392" y1="262" x2="512" y2="262" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="452" y="284" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">PATH 매칭</text>
      <text x="452" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">HEADER 매칭</text>
      <text x="452" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">WEIGHT 분배</text>
      <text x="452" y="360" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">3 RULES</text>

      <!-- Node: DestinationRule group (focal) -->
      <rect x="584" y="228" width="168" height="144" rx="6" fill="#ffffff"/>
      <rect x="584" y="228" width="168" height="144" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="668" y="250" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">DestinationRule 정책</text>
      <line x1="608" y1="262" x2="728" y2="262" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="668" y="284" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">로드 밸런싱</text>
      <text x="668" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">CIRCUIT BREAKER</text>
      <text x="668" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">CONNECTION POOL</text>
      <text x="668" y="360" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">3 POLICIES</text>

      <!-- Node: Pods (store) -->
      <rect x="800" y="256" width="128" height="88" rx="6" fill="#ffffff"/>
      <rect x="800" y="256" width="128" height="88" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="864" y="284" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">파드</text>
      <text x="864" y="302" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">v1 × 2</text>
      <text x="864" y="318" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">v2 × 1</text>
      <text x="864" y="334" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">3 REPLICAS</text>
    </svg>
