<title id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-11-title">Istio 트러블슈팅 실전: 5개 레이어를 30-60분간 확인한 사례</title>
<desc id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-11-desc">엔지니어가 애플리케이션 로그부터 Envoy 사이드카, Istiod, Kubernetes Service까지 차례로 확인한 끝에 Backend 배포가 0개 레플리카로 스케일된 것을 istioctl analyze로 발견하고, 스케일을 복구한 뒤 프록시 동기화를 재확인하고서야 트래픽이 정상화되는 실제 디버깅 흐름을 보여준다.</desc>
