<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dnsproxy-title dnsproxy-desc">
    <title id="dnsproxy-title">DNS Proxy Architecture in Istio</title>
    <desc id="dnsproxy-desc">Diagram showing how Envoy's DNS proxy intercepts application DNS and HTTP traffic inside a pod, resolves ServiceEntry-registered hosts to a virtual IP via its DNS table, forwards other lookups to CoreDNS, and receives ServiceEntry configuration pushed by Istiod.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="180" y="28" width="520" height="416" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="196" y="32" width="132" height="12" rx="2" fill="#ffffff"/>
    <text x="262" y="41" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">APPLICATION POD</text>

    <rect x="716" y="28" width="224" height="108" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="788" y="32" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="828" y="41" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">ISTIOD</text>

    <rect x="716" y="236" width="224" height="208" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="784" y="240" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="828" y="249" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL</text>

    <!-- ============ ARROWS (before boxes) ============ -->

    <!-- E1: App -> IPTables (straight vertical) -->
    <line x1="480" y1="116" x2="480" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="500" y="130" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="544" y="140" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">APP TRAFFIC</text>

    <!-- E2: IPTables -> DNS Listener (elbow via left corridor x=240) -->
    <path d="M 440,224 V 240 Q 440,248 432,248 H 248 Q 240,248 240,256 V 388 Q 240,396 248,396 H 280"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="306" y="228" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="350" y="238" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DNS REDIRECT</text>

    <!-- E3: IPTables -> HTTP Listener (elbow) -->
    <path d="M 520,224 V 238 Q 520,246 528,246 H 592 Q 600,246 600,254 V 268"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="516" y="226" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="560" y="236" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TCP REDIRECT</text>

    <!-- E4: DNS Table <-> DNS Listener (bidirectional, straight vertical) -->
    <line x1="360" y1="324" x2="360" y2="368" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <rect x="380" y="340" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="426" y="350" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">LOOKUP / VIP</text>

    <!-- E5: DNS Listener -> App (dashed return, elbow via far-left corridor x=208) -->
    <path d="M 280,380 H 216 Q 208,380 208,372 V 96 Q 208,88 216,88 H 400"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="112" y="224" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="158" y="234" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DNS RESPONSE</text>

    <!-- E6: HTTP Listener -> API (straight horizontal) -->
    <line x1="680" y1="296" x2="760" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="688" y="276" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="286" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CONVERT IP</text>

    <!-- E7: XDS -> DNS Table (dashed elbow via top corridor y=140) -->
    <path d="M 800,116 V 132 Q 800,140 792,140 H 368 Q 360,140 360,148 V 268"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="536" y="120" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="572" y="130" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SE PUSH</text>

    <!-- E8: DNS Listener -> CoreDNS (dashed, straight horizontal) -->
    <line x1="440" y1="396" x2="760" y2="396" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="556" y="376" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="600" y="386" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">NON-ISTIO</text>

    <!-- ============ NODES ============ -->

    <!-- App (input) -->
    <rect x="400" y="60" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="60" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="408" y="68" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="422" y="77" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="480" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    <text x="480" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">curl api.example.com</text>

    <!-- IPTables (merged NAT rules) -->
    <rect x="380" y="160" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="160" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="388" y="168" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="402" y="177" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">NAT</text>
    <text x="480" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">iptables NAT rules</text>
    <text x="480" y="210" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">UDP:53&#8594;15053</text>
    <text x="480" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">TCP&#8594;15001</text>

    <!-- DNS Table (focal) -->
    <rect x="280" y="268" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="280" y="268" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="288" y="276" width="24" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="300" y="285" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SE</text>
    <text x="360" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">DNS Table</text>
    <text x="360" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">ServiceEntry-based</text>

    <!-- HTTP Listener -->
    <rect x="520" y="268" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="520" y="268" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="528" y="276" width="48" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="552" y="285" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">ENVOY</text>
    <text x="600" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">HTTP Listener</text>
    <text x="600" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">port 15001</text>

    <!-- DNS Listener -->
    <rect x="280" y="368" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="280" y="368" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="288" y="376" width="48" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="312" y="385" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">ENVOY</text>
    <text x="360" y="398" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">DNS Listener</text>
    <text x="360" y="412" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">port 15053</text>

    <!-- XDS (Istiod) -->
    <rect x="728" y="60" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="728" y="60" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="736" y="68" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="748" y="77" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CP</text>
    <text x="800" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">xDS Server</text>
    <text x="800" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Istiod</text>

    <!-- API (external) -->
    <rect x="760" y="268" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="760" y="268" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="768" y="276" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="782" y="285" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="840" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">api.example.com</text>
    <text x="840" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">actual IP</text>

    <!-- CoreDNS (external) -->
    <rect x="760" y="368" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="760" y="368" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="768" y="376" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="782" y="385" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="840" y="398" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CoreDNS</text>
    <text x="840" y="412" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">cluster DNS</text>

    <!-- Legend -->
    <line x1="30" y1="488" x2="930" y2="488" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="508" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="504" x2="172" y2="504" stroke="#545B64" stroke-width="1.2"/>
    <text x="180" y="508" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">REQUEST PATH</text>
    <line x1="340" y1="504" x2="372" y2="504" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="380" y="508" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">CONTROL / FALLBACK</text>
    <rect x="600" y="498" width="14" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="622" y="508" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">SERVICEENTRY TABLE</text>
  </svg>