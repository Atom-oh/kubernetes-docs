<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t0 d0">
    <title id="t0">cert-manager 전체 아키텍처</title>
    <desc id="d0">cert-manager 컨트롤 플레인(컨트롤러·웹훅·CA 인젝터)이 Certificate·CertificateRequest·Issuer 같은 커스텀 리소스를 관리하고, 외부 발급자와 통신해 인증서를 발급한 뒤 Kubernetes Secret에 저장하며 Ingress·Gateway가 이를 참조하는 구조를 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (drawn first) -->
    <rect x="48" y="8" width="664" height="124" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="332" y="12" width="144" height="12" rx="2" fill="#ffffff"/>
    <text x="404" y="21" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">컨트롤 플레인</text>

    <rect x="48" y="152" width="664" height="124" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="352" y="156" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="404" y="165" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">CUSTOM RESOURCES</text>

    <rect x="48" y="424" width="664" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="336" y="428" width="136" height="12" rx="2" fill="#ffffff"/>
    <text x="404" y="437" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">KUBERNETES 리소스</text>

    <!-- Arrows (behind nodes) -->
    <!-- 1. Controller -> Certificate (straight, accent) -->
    <line x1="148" y1="112" x2="148" y2="176" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- 2. Webhook -> Certificate -->
    <path d="M352,112 V148 Q352,156 344,156 H204 Q196,156 196,164 V176" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 3. Webhook -> Issuer -->
    <path d="M408,112 V132 Q408,140 416,140 H604 Q612,140 612,148 V176" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 4. Certificate -> CertificateRequest (straight) -->
    <line x1="232" y1="208" x2="296" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 5. Certificate -> Secret (straight, accent) -->
    <line x1="148" y1="240" x2="148" y2="448" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- 6. CertificateRequest -> External Issuers (straight) -->
    <line x1="380" y1="240" x2="380" y2="320" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 7. CAInjector -> Secret (long route via right + bottom margin) -->
    <path d="M612,112 V124 Q612,132 620,132 H704 Q712,132 712,140 V520 Q712,528 704,528 H156 Q148,528 148,520 V512" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 8. Ingress/Gateway -> Certificate (route via left gap) -->
    <path d="M612,448 V434 Q612,426 604,426 H256 Q248,426 248,418 V198 Q248,190 240,190 H232" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="120" y="132" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="148" y="141" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECONCILE</text>

    <rect x="120" y="336" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="148" y="345" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ISSUE</text>

    <rect x="352" y="272" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="380" y="281" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text>

    <!-- Node: Controller -->
    <rect x="64" y="48" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="48" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="72" y="56" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="87" y="65" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTRL</text>
    <text x="148" y="82" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">cert-manager-controller</text>
    <text x="148" y="98" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">인증서 수명주기 관리</text>

    <!-- Node: Webhook -->
    <rect x="296" y="48" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="296" y="48" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="304" y="56" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="321" y="65" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOOK</text>
    <text x="380" y="82" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">cert-manager-webhook</text>
    <text x="380" y="98" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">리소스 검증/변환</text>

    <!-- Node: CAInjector -->
    <rect x="528" y="48" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="528" y="48" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="536" y="56" width="26" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="549" y="65" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CA</text>
    <text x="612" y="82" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">cert-manager-cainjector</text>
    <text x="612" y="98" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CA 번들 자동 주입</text>

    <!-- Node: Certificate (focal) -->
    <rect x="64" y="176" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="176" width="168" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="72" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="86" y="193" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
    <text x="148" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Certificate</text>
    <text x="148" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">인증서 요청 명세</text>

    <!-- Node: CertificateRequest -->
    <rect x="296" y="176" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="296" y="176" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="304" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="318" y="193" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
    <text x="380" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">CertificateRequest</text>
    <text x="380" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">발급 요청</text>

    <!-- Node: Issuer/ClusterIssuer -->
    <rect x="528" y="176" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="528" y="176" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="536" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="550" y="193" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
    <text x="612" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Issuer / ClusterIssuer</text>
    <text x="612" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">발급 방법 정의</text>

    <!-- Node: External Issuers -->
    <rect x="296" y="320" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="296" y="320" width="168" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="304" y="328" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="319" y="337" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXT</text>
    <text x="380" y="356" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">외부 발급자</text>
    <text x="380" y="372" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Let's Encrypt · Vault · PCA</text>

    <!-- Node: Secret -->
    <rect x="64" y="448" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="448" width="168" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="72" y="456" width="34" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="89" y="465" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STORE</text>
    <text x="148" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Secret</text>
    <text x="148" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tls.crt · tls.key</text>

    <!-- Node: Ingress/Gateway -->
    <rect x="528" y="448" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="528" y="448" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="536" y="456" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="551" y="465" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">K8S</text>
    <text x="612" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Ingress / Gateway</text>
    <text x="612" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TLS 종료 리소스</text>

    <!-- Legend -->
    <line x1="48" y1="556" x2="912" y2="556" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="48" y="568" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="68" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Focal / Certificate</text>
    <rect x="220" y="568" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">컨트롤 플레인 / CRD</text>
    <rect x="420" y="568" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="440" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">외부 발급자</text>
    <line x1="600" y1="573" x2="628" y2="573" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="636" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">외부 API 호출</text>
  </svg>