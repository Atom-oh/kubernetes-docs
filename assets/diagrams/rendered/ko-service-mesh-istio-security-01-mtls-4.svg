<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="d4-title d4-desc">
  <title id="d4-title">End-to-End mTLS 아키텍처</title>
  <desc id="d4-desc">클라이언트부터 CloudFront, ALB, Istio Gateway를 거쳐 메시 내부 서비스 A·B·C까지 6개 구간이 모두 mTLS 또는 TLS로 보호되는 전체 경로를 보여주는 다이어그램</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .mono { font-family: 'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="32" y="40" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">END-TO-END SECURITY</text>
  <text x="32" y="64" font-size="28" font-weight="700" fill="#232F3E">클라이언트-백엔드 전체 구간 mTLS</text>

  <!-- outer zone: EKS Cluster -->
  <rect x="456" y="152" width="480" height="172" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="468" y="156" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="512" y="165" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)" text-anchor="middle">EKS CLUSTER</text>

  <!-- nested zone: Service Mesh -->
  <rect x="596" y="200" width="328" height="108" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>
  <rect x="608" y="204" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="656" y="213" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)" text-anchor="middle">SERVICE MESH</text>

  <!-- zone: AWS Edge -->
  <rect x="168" y="176" width="264" height="132" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="180" y="180" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="216" y="189" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)" text-anchor="middle">AWS EDGE</text>

  <!-- Client -->
  <rect x="32" y="220" width="112" height="72" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="88" y="252" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">클라이언트</text>
  <text x="88" y="268" class="mono" font-size="9" fill="#545B64" text-anchor="middle">Client Cert</text>

  <!-- CloudFront (focal) -->
  <rect x="184" y="220" width="104" height="72" rx="6" fill="#ffffff"/>
  <rect x="184" y="220" width="104" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="196" y="228" width="56" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.5)" stroke-width="0.8"/>
  <text x="224" y="237" class="mono" font-size="7" fill="#EC7211" text-anchor="middle" letter-spacing="0.08em">CDN</text>
  <text x="236" y="260" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">CloudFront</text>
  <text x="236" y="276" class="mono" font-size="9" fill="#545B64" text-anchor="middle">mTLS 검증</text>

  <!-- ALB -->
  <rect x="312" y="220" width="104" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="364" y="252" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">ALB</text>
  <text x="364" y="268" class="mono" font-size="9" fill="#545B64" text-anchor="middle">헤더 전달</text>

  <!-- Gateway -->
  <rect x="468" y="220" width="104" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="520" y="252" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Istio</text>
  <text x="520" y="268" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Gateway</text>

  <!-- Service A/B/C -->
  <rect x="608" y="220" width="88" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="652" y="252" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Service A</text>
  <text x="652" y="268" class="mono" font-size="9" fill="#545B64" text-anchor="middle">Envoy</text>

  <rect x="716" y="220" width="88" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="760" y="252" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Service B</text>
  <text x="760" y="268" class="mono" font-size="9" fill="#545B64" text-anchor="middle">Envoy</text>

  <rect x="824" y="220" width="88" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="868" y="252" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Service C</text>
  <text x="868" y="268" class="mono" font-size="9" fill="#545B64" text-anchor="middle">Envoy</text>

  <!-- edges, all straight horizontal at y=256 -->
  <!-- 1: Client <-> CloudFront, mTLS, accent -->
  <line x1="144" y1="256" x2="184" y2="256" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
  <rect x="144" y="234" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="164" y="243" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.04em">1 mTLS</text>

  <!-- 2: CloudFront -> ALB, TLS+Headers -->
  <line x1="288" y1="256" x2="312" y2="256" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="272" y="234" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="300" y="243" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.02em">2 TLS+HDR</text>

  <!-- 3: ALB -> Gateway, TLS+Headers -->
  <line x1="416" y1="256" x2="468" y2="256" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="414" y="234" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="442" y="243" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.02em">3 TLS+HDR</text>

  <!-- 4: Gateway <-> Service A, mTLS, accent -->
  <line x1="572" y1="256" x2="608" y2="256" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
  <rect x="570" y="234" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="590" y="243" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.04em">4 mTLS</text>

  <!-- 5: Service A <-> Service B, mTLS, accent -->
  <line x1="696" y1="256" x2="716" y2="256" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
  <rect x="686" y="234" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="706" y="243" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.04em">5 mTLS</text>

  <!-- 6: Service B <-> Service C, mTLS, accent -->
  <line x1="804" y1="256" x2="824" y2="256" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
  <rect x="794" y="234" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="814" y="243" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.04em">6 mTLS</text>

  <!-- legend -->
  <line x1="32" y1="524" x2="928" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="544" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <line x1="140" y1="540" x2="172" y2="540" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
  <text x="180" y="544" font-size="12" fill="#232F3E">mTLS 구간 (클라이언트-CDN, 메시 내부)</text>
  <line x1="520" y1="540" x2="552" y2="540" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="560" y="544" font-size="12" fill="#232F3E">TLS + 인증서 헤더 전달 구간</text>
</svg>