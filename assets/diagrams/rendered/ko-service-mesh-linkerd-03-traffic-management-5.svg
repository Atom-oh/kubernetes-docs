<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lktm-state-title lktm-state-desc">
<title id="lktm-state-title">Linkerd Failure Accrual 상태 머신</title>
<desc id="lktm-state-desc">연속 실패 임계값을 넘으면 정상(Closed) 상태의 엔드포인트가 차단(Open) 상태로 바뀌고, 백오프 시간이 지나면 절반 개방(Half-Open) 상태에서 프로브를 보내 성공하면 다시 정상으로, 실패하면 다시 차단 상태로 돌아가는 흐름을 보여주는 상태 머신 다이어그램.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<!-- Start dot -->
<circle cx="80" cy="280" r="6" fill="#232F3E"/>

<!-- start -> Closed -->
<line x1="86" y1="280" x2="156" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="89" y="260" width="64" height="12" rx="2" fill="#FFFFFF"/>
<text x="121" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">정상 상태</text>

<!-- Closed -> Open -->
<line x1="308" y1="280" x2="404" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="316" y="260" width="80" height="12" rx="2" fill="#FFFFFF"/>
<text x="356" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">임계값 초과</text>

<!-- Open -> HalfOpen -->
<line x1="556" y1="280" x2="652" y2="280" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="564" y="260" width="80" height="12" rx="2" fill="#FFFFFF"/>
<text x="604" y="269" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">백오프 경과</text>

<!-- HalfOpen -> Closed (probe success — curved return along bottom) -->
<path d="M728,316 V380 Q728,388 720,388 H240 Q232,388 232,380 V316" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="444" y="368" width="72" height="12" rx="2" fill="#FFFFFF"/>
<text x="480" y="377" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">프로브 성공</text>

<!-- HalfOpen -> Open (probe failure — arc above both nodes) -->
<path d="M728,244 Q604,170 480,244" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="568" y="150" width="72" height="12" rx="2" fill="#FFFFFF"/>
<text x="604" y="159" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">프로브 실패</text>

<!-- Node: Closed -->
<rect x="156" y="244" width="152" height="72" rx="8" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="232" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Closed</text>
<text x="232" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">모든 요청 전달</text>

<!-- Node: Open (focal — the failure state to notice) -->
<rect x="404" y="244" width="152" height="72" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="480" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Open</text>
<text x="480" y="300" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">요청 전달 안함</text>

<!-- Node: HalfOpen -->
<rect x="652" y="244" width="152" height="72" rx="8" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="728" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Half-Open</text>
<text x="728" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">프로브 전송</text>

</svg>