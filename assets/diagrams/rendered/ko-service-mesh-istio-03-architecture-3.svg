<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="filter-chain-title filter-chain-desc">
    <title id="filter-chain-title">HTTP 요청의 필터 체인 처리</title>
    <desc id="filter-chain-desc">HTTP 요청이 JWT 인증, Rate Limiting, RBAC 검증, Stats 수집을 거쳐 Router에 도달한 뒤 HTTP 응답으로 반환되는 Envoy 필터 체인 순서를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Filter Chain -->
    <rect x="172" y="216" width="616" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="416" y="220" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="229" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FILTER CHAIN</text>

    <!-- Arrows -->
    <line x1="172" y1="280" x2="188" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="292" y1="280" x2="308" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="412" y1="280" x2="428" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="532" y1="280" x2="548" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="652" y1="280" x2="668" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="772" y1="280" x2="788" y2="280" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Node: Request (input) -->
    <rect x="68" y="248" width="104" height="64" rx="6" fill="#ffffff"/>
    <rect x="68" y="248" width="104" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="76" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="90" y="265" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="120" y="284" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">HTTP 요청</text>
    <text x="120" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">request in</text>

    <!-- Node: JWT -->
    <rect x="188" y="248" width="104" height="64" rx="6" fill="#ffffff"/>
    <rect x="188" y="248" width="104" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="196" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="208" y="265" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">F1</text>
    <text x="240" y="284" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">JWT 인증</text>
    <text x="240" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">authn</text>

    <!-- Node: Rate Limit -->
    <rect x="308" y="248" width="104" height="64" rx="6" fill="#ffffff"/>
    <rect x="308" y="248" width="104" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="316" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="328" y="265" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">F2</text>
    <text x="360" y="284" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rate Limit</text>
    <text x="360" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">throttle</text>

    <!-- Node: RBAC -->
    <rect x="428" y="248" width="104" height="64" rx="6" fill="#ffffff"/>
    <rect x="428" y="248" width="104" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="436" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="448" y="265" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">F3</text>
    <text x="480" y="284" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">RBAC 검증</text>
    <text x="480" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">authz</text>

    <!-- Node: Stats -->
    <rect x="548" y="248" width="104" height="64" rx="6" fill="#ffffff"/>
    <rect x="548" y="248" width="104" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="556" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="568" y="265" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">F4</text>
    <text x="600" y="284" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Stats 수집</text>
    <text x="600" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">metrics</text>

    <!-- Node: Router (focal) -->
    <rect x="668" y="248" width="104" height="64" rx="6" fill="#ffffff"/>
    <rect x="668" y="248" width="104" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="676" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="688" y="265" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">F5</text>
    <text x="720" y="284" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Router</text>
    <text x="720" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">dispatch</text>

    <!-- Node: Response (output) -->
    <rect x="788" y="248" width="104" height="64" rx="6" fill="#ffffff"/>
    <rect x="788" y="248" width="104" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="796" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="810" y="265" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="840" y="284" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">HTTP 응답</text>
    <text x="840" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">response out</text>

    <!-- Legend -->
    <line x1="68" y1="380" x2="892" y2="380" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="68" y="396" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="68" y="408" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="88" y="416" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal · 최종 라우팅</text>
    <rect x="300" y="408" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="320" y="416" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">필터 단계</text>
    <rect x="460" y="408" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="480" y="416" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">요청/응답 경계</text>
  </svg>