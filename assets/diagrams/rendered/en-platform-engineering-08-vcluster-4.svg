<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vc-selfservice-title vc-selfservice-desc">
    <title id="vc-selfservice-title">Self-service vCluster request via Backstage and GitOps</title>
    <desc id="vc-selfservice-desc">Sequence diagram showing a developer requesting a vCluster from a Backstage portal, the request flowing through a GitOps pull request and sync into the host cluster, and the developer receiving a kubeconfig once the new vCluster is healthy.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="90"  y1="136" x2="90"  y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="270" y1="136" x2="270" y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="450" y1="136" x2="450" y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="630" y1="136" x2="630" y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="810" y1="136" x2="810" y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="446" y="180" width="8" height="216" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="626" y="300" width="8" height="72" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- Messages -->
    <!-- m1: Dev -> Backstage -->
    <line x1="90" y1="156" x2="270" y2="156" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m2: Backstage -> GitOps -->
    <line x1="270" y1="180" x2="450" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m3: GitOps --> Dev (PR link, return) -->
    <line x1="450" y1="204" x2="90" y2="204" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <!-- note 1 -->
    <rect x="350" y="220" width="200" height="20" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
    <text x="450" y="233" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">auto-approve or manual review</text>

    <!-- m4: GitOps self-message (PR merge triggers sync) -->
    <path d="M450,256 h40 q8,0 8,8 v8 q0,8 -8,8 h-40" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- m5: GitOps -> Host -->
    <line x1="450" y1="300" x2="630" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m6: Host -> vCluster -->
    <line x1="630" y1="324" x2="810" y2="324" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m7: vCluster --> Host (return) -->
    <line x1="810" y1="348" x2="630" y2="348" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- m8: Host --> GitOps (return) -->
    <line x1="630" y1="372" x2="450" y2="372" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- m9: GitOps --> Backstage (return) -->
    <line x1="450" y1="396" x2="270" y2="396" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- m10: Backstage --> Dev (headline success, return) -->
    <line x1="270" y1="420" x2="90" y2="420" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- note 2 -->
    <rect x="70" y="436" width="760" height="20" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
    <text x="450" y="449" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">developer now uses the vCluster as a normal Kubernetes cluster</text>

    <!-- m11: Dev -> vCluster -->
    <line x1="90" y1="472" x2="810" y2="472" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m12: vCluster -> Host -->
    <line x1="810" y1="496" x2="630" y2="496" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="152" y="136" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="180" y="145" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REQUEST</text>

    <rect x="334" y="160" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="360" y="169" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">OPEN PR</text>

    <rect x="244" y="184" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="270" y="193" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PR LINK</text>

    <rect x="508" y="256" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="512" y="265" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">MERGE SYNC</text>

    <rect x="508" y="280" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="540" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CREATE NS</text>

    <rect x="694" y="304" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="313" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POD START</text>

    <rect x="694" y="328" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="337" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">API READY</text>

    <rect x="514" y="352" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="540" y="361" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">HEALTHY</text>

    <rect x="334" y="376" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="360" y="385" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">STATUS</text>

    <rect x="152" y="400" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="180" y="409" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">KUBECONFIG</text>

    <rect x="422" y="452" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="450" y="461" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">APPLY</text>

    <rect x="694" y="476" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="485" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SYNC</text>

    <!-- Actor boxes -->
    <rect x="30" y="88" width="120" height="48" rx="6" fill="#ffffff"/>
    <rect x="30" y="88" width="120" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="90" y="116" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Developer</text>

    <rect x="210" y="88" width="120" height="48" rx="6" fill="#ffffff"/>
    <rect x="210" y="88" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="270" y="116" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Backstage</text>

    <rect x="390" y="88" width="120" height="48" rx="6" fill="#ffffff"/>
    <rect x="390" y="88" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="450" y="110" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">GitOps</text>
    <text x="450" y="124" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitHub + ArgoCD</text>

    <rect x="570" y="88" width="120" height="48" rx="6" fill="#ffffff"/>
    <rect x="570" y="88" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="630" y="116" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Host Cluster</text>

    <rect x="750" y="88" width="120" height="48" rx="6" fill="#ffffff"/>
    <rect x="750" y="88" width="120" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="810" y="116" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vCluster</text>

    <!-- Legend -->
    <line x1="30" y1="536" x2="930" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="554" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="180" y1="550" x2="204" y2="550" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="212" y="554" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Call</text>

    <line x1="300" y1="550" x2="324" y2="550" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="332" y="554" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Return</text>

    <line x1="440" y1="550" x2="464" y2="550" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="472" y="554" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Headline success</text>

    <rect x="680" y="544" width="12" height="12" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <text x="700" y="554" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Activation</text>
  </svg>