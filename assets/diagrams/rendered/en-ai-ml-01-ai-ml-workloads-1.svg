<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="ekshw-title ekshw-desc">
    <title id="ekshw-title">EKS AI/ML infrastructure layout across AWS Cloud</title>
    <desc id="ekshw-desc">Diagram showing an Amazon EKS cluster with training, inference, and CPU node groups that all depend on shared storage (EBS, EFS, FSx for Lustre, S3) and shared networking (VPC CNI, ENA/EFA, placement groups), with the EKS cluster integrating with AWS services SageMaker, ECR, and CloudWatch.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Outer zone: AWS Cloud -->
    <rect x="24" y="24" width="896" height="296" rx="8" fill="rgba(35,47,62,0.015)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="32" y="28" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="44" y="37" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AWS CLOUD</text>

    <!-- Zone: Amazon EKS -->
    <rect x="40" y="56" width="600" height="248" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <rect x="48" y="60" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="60" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AMAZON EKS</text>

    <!-- Nested zone: Node Groups -->
    <rect x="64" y="88" width="552" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="72" y="92" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="84" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NODE GROUPS</text>

    <!-- arrows behind nodes -->
    <path d="M 248,200 V 216 Q 248,224 240,224 H 196" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 432,200 V 216 Q 432,224 440,224 H 484" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="640" y1="180" x2="704" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node group chips -->
    <rect x="76" y="120" width="168" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="160" y="145" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Training</text>
    <text x="160" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">p4d · p3 · g5</text>

    <rect x="256" y="120" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="340" y="145" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Inference</text>
    <text x="340" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">g4dn · inf1 · trn1</text>

    <rect x="436" y="120" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="520" y="145" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">CPU</text>
    <text x="520" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">c6i · r6i</text>

    <!-- Storage (focal) -->
    <rect x="64" y="224" width="264" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="196" y="249" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Storage</text>
    <text x="196" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EBS · EFS · FSx · S3</text>

    <!-- Networking -->
    <rect x="352" y="224" width="264" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="484" y="249" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Networking</text>
    <text x="484" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VPC CNI · ENA/EFA · placement group</text>

    <!-- AWS Services -->
    <rect x="704" y="148" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="792" y="173" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">AWS Services</text>
    <text x="792" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SageMaker · ECR · CloudWatch</text>

    <!-- Legend -->
    <line x1="40" y1="344" x2="920" y2="344" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="360" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="376" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="384" fill="#545B64" font-size="8.5">Shared / focal dependency</text>

    <rect x="256" y="376" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="276" y="384" fill="#545B64" font-size="8.5">Node group / AWS service</text>

    <rect x="480" y="376" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="500" y="384" fill="#545B64" font-size="8.5">Cluster / cloud boundary</text>

    <line x1="716" y1="381" x2="744" y2="381" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="752" y="384" fill="#545B64" font-size="8.5">Depends on / integrates</text>
  </svg>