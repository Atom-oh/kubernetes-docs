<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
  <title id="d0-title">WorkloadEntry로 VM을 메시에 등록하는 사용 시나리오</title>
  <desc id="d0-desc">레거시 VM과 베어메탈 서버가 istiod에 메시로 등록되고, istiod가 Kubernetes 파드의 Envoy에 구성을 전달하여 VM과 파드가 mTLS로 통신하는 하이브리드 아키텍처를 보여준다.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="8 0, 0 3, 8 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="40" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">FLOWCHART · USAGE SCENARIO</text>
  <text x="36" y="72" font-size="24" font-weight="700" fill="#232F3E">WorkloadEntry 사용 시나리오</text>

  <!-- Zone: Legacy -->
  <rect x="36" y="100" width="200" height="280" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="52" y="108" width="100" height="14" rx="2" fill="#ffffff"/>
  <text x="102" y="119" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="rgba(35,47,62,0.4)">레거시 환경</text>

  <!-- Zone: Control Plane -->
  <rect x="400" y="212" width="160" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="416" y="220" width="128" height="14" rx="2" fill="#ffffff"/>
  <text x="480" y="231" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="rgba(35,47,62,0.4)">CONTROL PLANE</text>

  <!-- Zone: Kubernetes -->
  <rect x="724" y="100" width="200" height="280" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="740" y="108" width="168" height="14" rx="2" fill="#ffffff"/>
  <text x="824" y="119" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="rgba(35,47,62,0.4)">KUBERNETES 클러스터</text>

  <!-- mTLS straight lines drawn first (VM1<->Pod1 at y=156, VM2<->Pod2 at y=236) -->
  <path d="M216,156 H724" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>
  <rect x="448" y="136" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="145" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="#EC7211">mTLS</text>

  <path d="M216,236 H724" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>
  <rect x="616" y="216" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="648" y="225" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="#EC7211">mTLS</text>

  <!-- Dashed: VM1 -> CP -->
  <path d="M216,182 H280 Q288,182 288,190 V258 Q288,266 296,266 H400"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <!-- Dashed: VM2 -> CP -->
  <path d="M216,262 H304 Q312,262 312,270 V272 Q312,280 320,280 H400"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <!-- Dashed: BM -> CP -->
  <path d="M216,328 H328 Q336,328 336,320 V302 Q336,294 344,294 H400"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="228" y="242" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="260" y="251" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#7D8998">메시 등록</text>

  <!-- Dashed: CP -> Pod1 -->
  <path d="M560,268 H608 Q616,268 616,260 V190 Q616,182 624,182 H724"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <!-- Dashed: CP -> Pod2 -->
  <path d="M560,292 H656 Q664,292 664,284 V270 Q664,262 672,262 H724"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="576" y="272" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="608" y="281" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#7D8998">구성 전달</text>

  <!-- VM1 -->
  <g>
    <rect x="56" y="140" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="140" width="160" height="56" rx="6" fill="rgba(149,165,166,0.15)" stroke="#7D8998" stroke-width="1"/>
    <text x="136" y="164" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">VM</text>
    <text x="136" y="180" class="mono" font-size="9" text-anchor="middle" fill="#545B64">레거시 앱</text>
  </g>
  <!-- VM2 -->
  <g>
    <rect x="56" y="220" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="220" width="160" height="56" rx="6" fill="rgba(149,165,166,0.15)" stroke="#7D8998" stroke-width="1"/>
    <text x="136" y="244" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">VM</text>
    <text x="136" y="260" class="mono" font-size="9" text-anchor="middle" fill="#545B64">데이터베이스</text>
  </g>
  <!-- BM -->
  <g>
    <rect x="56" y="300" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="300" width="160" height="56" rx="6" fill="rgba(149,165,166,0.15)" stroke="#7D8998" stroke-width="1"/>
    <text x="136" y="324" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">베어메탈</text>
    <text x="136" y="340" class="mono" font-size="9" text-anchor="middle" fill="#545B64">고성능 서버</text>
  </g>

  <!-- istiod (focal) -->
  <g>
    <rect x="400" y="252" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="252" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="276" font-size="12" font-weight="700" text-anchor="middle" fill="#232F3E">istiod</text>
    <text x="480" y="292" class="mono" font-size="9" text-anchor="middle" fill="#545B64">Control Plane</text>
  </g>

  <!-- Pod1 -->
  <g>
    <rect x="744" y="140" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="744" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="824" y="164" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Pod · 신규 앱</text>
    <text x="824" y="180" class="mono" font-size="9" text-anchor="middle" fill="#545B64">Envoy 자동 주입</text>
  </g>
  <!-- Pod2 -->
  <g>
    <rect x="744" y="220" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="744" y="220" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="824" y="244" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Pod · 마이크로서비스</text>
    <text x="824" y="260" class="mono" font-size="9" text-anchor="middle" fill="#545B64">Envoy 자동 주입</text>
  </g>

  <!-- Legend -->
  <line x1="36" y1="452" x2="924" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="36" y="472" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <line x1="120" y1="467" x2="152" y2="467" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="164" y="470" font-size="11" fill="#545B64">양방향 mTLS 트래픽</text>
  <line x1="340" y1="467" x2="372" y2="467" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="384" y="470" font-size="11" fill="#545B64">메시 등록 / 구성 전달 (제어)</text>
  <rect x="620" y="459" width="16" height="16" rx="3" fill="rgba(149,165,166,0.15)" stroke="#7D8998" stroke-width="1"/>
  <text x="644" y="470" font-size="11" fill="#545B64">메시 외부 워크로드 (VM/베어메탈)</text>

  <text x="36" y="520" font-size="14" font-style="italic" fill="#545B64">레거시 VM과 베어메탈은 WorkloadEntry로 등록되어, Kubernetes 파드와 동일한 mTLS·트래픽 관리 혜택을 받는다.</text>
</svg>