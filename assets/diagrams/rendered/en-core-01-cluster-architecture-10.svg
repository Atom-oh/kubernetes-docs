<title id="en-core-01-cluster-architecture-10-title">Container Storage Interface architecture</title>
<desc id="en-core-01-cluster-architecture-10-desc">Architecture diagram showing Kubernetes calling the Container Storage Interface, which delegates to a vendor CSI driver that provisions the underlying storage system.</desc>
