<?xml version="1.0" encoding="UTF-8"?>
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="win-container-types-title win-container-types-desc">
<title id="win-container-types-title">Windows 컨테이너 격리 모델 비교</title>
<desc id="win-container-types-desc">Windows Server 컨테이너는 커널을 공유하는 컨테이너 런타임을 통해 물리 호스트에 연결되고, Hyper-V 격리 컨테이너는 각 앱이 경량 VM으로 분리되어 하이퍼바이저를 거쳐 같은 물리 호스트에 연결되는 구조를 비교한다.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
  <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
    <polygon points="8 0, 0 3, 8 6" fill="#545B64"/>
  </marker>
</defs>
