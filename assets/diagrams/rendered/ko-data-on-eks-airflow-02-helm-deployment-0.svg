<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ko-airflow-helm-executor-title ko-airflow-helm-executor-desc">
  <title id="ko-airflow-helm-executor-title">Airflow Executor 아키텍처 비교</title>
  <desc id="ko-airflow-helm-executor-desc">KubernetesExecutor는 스케줄러가 태스크마다 Pod를 하나씩 새로 생성하는 구조이고, CeleryExecutor는 스케줄러가 Redis 브로커에 태스크를 큐잉하면 상시 실행 중인 warm 워커 Pod가 이를 가져가 처리하는 구조임을 비교하는 다이어그램.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="24" y="28" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7D8998">AIRFLOW · EXECUTOR</text>
  <text x="24" y="56" font-size="28" font-weight="700" fill="#232F3E">실행기 아키텍처 비교</text>

  <!-- Zones (drawn before arrows/nodes) -->
  <rect x="24" y="104" width="436" height="400" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="500" y="104" width="436" height="400" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>

  <rect x="40" y="108" width="176" height="12" rx="2" fill="#ffffff"/>
  <text x="128" y="117" text-anchor="middle" class="mono" font-size="7" font-weight="500" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)">KUBERNETESEXECUTOR</text>

  <rect x="516" y="108" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="586" y="117" text-anchor="middle" class="mono" font-size="7" font-weight="500" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)">CELERYEXECUTOR</text>

  <!-- ===== Arrows (behind nodes) ===== -->

  <!-- Left zone: scheduler fan-out to 3 pods -->
  <path d="M 207,184 V 224 Q 207,232 199,232 H 104 Q 96,232 96,240 V 280"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="240" y1="184" x2="240" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 277,184 V 224 Q 277,232 285,232 H 376 Q 384,232 384,240 V 280"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="210" y="210" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="240" y="219" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">POD 개별생성</text>

  <!-- Right zone: scheduler -> broker (accent), broker -> 2 workers -->
  <line x1="718" y1="184" x2="718" y2="280" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="690" y="210" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="718" y="219" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.06em" fill="#EC7211">큐 등록</text>

  <path d="M 696,336 V 372 Q 696,380 688,380 H 614 Q 606,380 606,388 V 424"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 740,336 V 372 Q 740,380 748,380 H 822 Q 830,380 830,388 V 424"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="621" y="360" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="653" y="369" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">웜워커 인출</text>

  <!-- ===== Nodes ===== -->

  <!-- SCH1 -->
  <rect x="172" y="136" width="140" height="48" rx="6" fill="#ffffff"/>
  <rect x="172" y="136" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="180" y="142" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="200" y="151" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)">SCHED</text>
  <text x="242" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Scheduler</text>
  <text x="242" y="180" text-anchor="middle" class="mono" font-size="9" fill="#545B64">task→pod 1:1</text>

  <!-- Pods -->
  <g>
    <rect x="36" y="280" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="36" y="280" width="120" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="44" y="286" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="60" y="295" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)">POD</text>
    <text x="96" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Pod: task A</text>
    <text x="96" y="326" text-anchor="middle" class="mono" font-size="9" fill="#545B64">ephemeral</text>
  </g>
  <g>
    <rect x="180" y="280" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="180" y="280" width="120" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="188" y="286" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="204" y="295" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)">POD</text>
    <text x="240" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Pod: task B</text>
    <text x="240" y="326" text-anchor="middle" class="mono" font-size="9" fill="#545B64">ephemeral</text>
  </g>
  <g>
    <rect x="324" y="280" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="324" y="280" width="120" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="332" y="286" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="348" y="295" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)">POD</text>
    <text x="384" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Pod: task C</text>
    <text x="384" y="326" text-anchor="middle" class="mono" font-size="9" fill="#545B64">ephemeral</text>
  </g>

  <!-- Editorial aside in left zone whitespace -->
  <text x="242" y="392" text-anchor="middle" font-size="14" font-style="italic" fill="#545B64">태스크 종료 즉시 Pod가 삭제됩니다</text>

  <!-- SCH2 -->
  <rect x="648" y="136" width="140" height="48" rx="6" fill="#ffffff"/>
  <rect x="648" y="136" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="656" y="142" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="676" y="151" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)">SCHED</text>
  <text x="718" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Scheduler</text>
  <text x="718" y="180" text-anchor="middle" class="mono" font-size="9" fill="#545B64">task→queue</text>

  <!-- Broker (focal) -->
  <rect x="648" y="280" width="140" height="56" rx="6" fill="#ffffff"/>
  <rect x="648" y="280" width="140" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="656" y="286" width="44" height="12" rx="2" fill="transparent" stroke="#EC7211" stroke-width="0.8"/>
  <text x="678" y="295" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.08em" fill="#EC7211">QUEUE</text>
  <text x="718" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Redis Broker</text>
  <text x="718" y="326" text-anchor="middle" class="mono" font-size="9" fill="#545B64">task queue</text>

  <!-- Workers -->
  <g>
    <rect x="536" y="424" width="140" height="56" rx="6" fill="#ffffff"/>
    <rect x="536" y="424" width="140" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="544" y="430" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="560" y="439" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)">POD</text>
    <text x="606" y="456" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Celery Worker 1</text>
    <text x="606" y="470" text-anchor="middle" class="mono" font-size="9" fill="#545B64">warm pod</text>
  </g>
  <g>
    <rect x="760" y="424" width="140" height="56" rx="6" fill="#ffffff"/>
    <rect x="760" y="424" width="140" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="768" y="430" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="784" y="439" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.08em" fill="rgba(35,47,62,0.8)">POD</text>
    <text x="830" y="456" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Celery Worker 2</text>
    <text x="830" y="470" text-anchor="middle" class="mono" font-size="9" fill="#545B64">warm pod</text>
  </g>

  <!-- Legend -->
  <line x1="24" y1="516" x2="936" y2="516" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>

  <rect x="24" y="534" width="24" height="14" rx="3" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="56" y="545" class="mono" font-size="8" letter-spacing="0.04em" fill="#545B64">일시적 Pod (태스크당 생성/삭제)</text>

  <rect x="360" y="534" width="24" height="14" rx="3" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="392" y="545" class="mono" font-size="8" letter-spacing="0.04em" fill="#545B64">상시 실행 warm 워커 Pod</text>

  <rect x="668" y="534" width="24" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="700" y="545" class="mono" font-size="8" letter-spacing="0.04em" fill="#545B64">브로커(큐) — 두 방식의 핵심 차이점</text>

</svg>