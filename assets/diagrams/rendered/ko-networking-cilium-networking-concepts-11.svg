<title id="ko-networking-cilium-networking-concepts-11-title">쿠버네티스 서비스 DNS 해석 과정</title>
<desc id="ko-networking-cilium-networking-concepts-11-desc">포드가 CoreDNS에 서비스 이름을 조회하면 CoreDNS가 서비스의 ClusterIP를 확인하고 백엔드 포드 중 하나를 선택해 최종 ClusterIP를 응답하는 쿠버네티스 서비스 디스커버리 과정을 보여주는 다이어그램.</desc>
