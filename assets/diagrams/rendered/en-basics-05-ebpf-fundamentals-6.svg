<title id="en-basics-05-ebpf-fundamentals-6-title">Hubble observability architecture</title>
<desc id="en-basics-05-ebpf-fundamentals-6-desc">Architecture diagram showing the Cilium agent programming the eBPF dataplane, which both emits collected data (flows, DNS queries, HTTP requests, and policy decisions) and feeds the Hubble Observer; the observer's data reaches Hubble Relay, which aggregates it for the Hubble CLI and the Hubble UI.</desc>
