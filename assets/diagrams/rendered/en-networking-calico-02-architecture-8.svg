      <title id="en-networking-calico-02-architecture-8-title">Controller reconciliation loop</title>
      <desc id="en-networking-calico-02-architecture-8-desc">Sequence diagram showing kube-controllers repeatedly listing Kubernetes and Calico resources, diffing them, and either writing changes to the Calico datastore or taking no action when the two are already in sync.</desc>
