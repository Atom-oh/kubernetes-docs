<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" role="img" aria-labelledby="npc-compare-title npc-compare-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="npc-compare-title">EKS Network Policy Controller와 Calico 비교</title>
  <desc id="npc-compare-desc">Kubernetes NetworkPolicy는 AWS Native Network Policy Controller와 Calico Felix 양쪽에서 처리될 수 있고, Calico 전용 NetworkPolicy는 Felix에서만 처리됨을 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="360" y="100" width="220" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="376" y="104" width="100" height="12" rx="2" fill="#ffffff"/>
  <text x="426" y="113" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AWS NATIVE</text>

  <rect x="360" y="300" width="220" height="140" rx="8" fill="rgba(255,153,0,0.03)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="376" y="304" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="412" y="313" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CALICO</text>

  <!-- Arrows -->
  <!-- K8sNP -> NPC -->
  <path d="M224,201 H296 Q304,201 304,193 V180 Q304,172 312,172 H384" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- K8sNP -> Felix -->
  <path d="M224,223 H296 Q304,223 304,231 V353 Q304,361 312,361 H384" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- CalNP -> Felix -->
  <path d="M224,352 H296 Q304,352 304,360 V375 Q304,383 312,383 H384" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Nodes -->
  <!-- K8sNP input -->
  <rect x="64" y="180" width="160" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="144" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Kubernetes</text>
  <text x="144" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NetworkPolicy</text>

  <!-- CalNP input -->
  <rect x="64" y="320" width="160" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="144" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Calico</text>
  <text x="144" y="364" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NetworkPolicy (전용)</text>

  <!-- NPC (focal) -->
  <rect x="384" y="140" width="172" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="470" y="166" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Network Policy</text>
  <text x="470" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Controller</text>
  <text x="470" y="196" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dataplane: eBPF</text>

  <!-- Felix (focal) -->
  <rect x="384" y="340" width="172" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="470" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Felix Agent</text>
  <text x="470" y="384" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dataplane: iptables/eBPF</text>

  <!-- Legend -->
  <line x1="40" y1="448" x2="920" y2="448" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="464" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <circle cx="220" cy="460" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="232" y="464" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Policy 처리 컨트롤러</text>
  <circle cx="500" cy="460" r="5" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="512" y="464" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">정책 리소스 (입력)</text>
</svg>