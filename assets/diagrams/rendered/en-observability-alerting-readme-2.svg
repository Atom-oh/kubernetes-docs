<title id="en-observability-alerting-readme-2-title">Alert escalation decision flow</title>
<desc id="en-observability-alerting-readme-2-desc">Flowchart showing an alert escalating every 15 minutes from the primary on-call through secondary and team-lead responders to a full-team page, until any responder acts.</desc>
