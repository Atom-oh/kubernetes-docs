<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">서비스 의존성 맵</title>
<desc id="d">Production 네임스페이스에서 Ingress부터 Frontend, API Gateway를 거쳐 User·Order·Payment 서비스로 이어지는 요청 흐름과 각 서비스가 PostgreSQL·Redis·Kafka에 접근하는 의존 관계를 RPS·P99 지연 시간과 함께 보여준다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="960" height="600" fill="#FFFFFF"/>

<!-- Zone: Production Namespace -->
<rect x="24" y="40" width="912" height="536" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="404" y="44" width="152" height="12" rx="2" fill="#FFFFFF"/>
<text x="480" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">PRODUCTION NAMESPACE</text>

<!-- ===== Arrows (drawn before nodes) ===== -->
<!-- Ingress -> Frontend -> API Gateway (same row, straight) -->
<line x1="176" y1="296" x2="224" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="364" y1="296" x2="420" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- API Gateway -> User Service (up) -->
<path d="M 560,280 H 584 Q 592,280 592,272 V 152 Q 592,144 600,144 H 616"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- API Gateway -> Order Service (down, accent: leads to the focal node) -->
<path d="M 560,312 H 596 Q 604,312 604,320 V 436 Q 604,444 612,444 H 616"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<!-- User Service -> Redis (same row, straight) -->
<line x1="756" y1="128" x2="792" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- User Service -> PostgreSQL (down) -->
<path d="M 756,160 H 776 Q 784,160 784,168 V 264 Q 784,272 792,272 H 792"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Order Service -> PostgreSQL (up, accent: from the focal node) -->
<path d="M 756,416 H 780 Q 788,416 788,408 V 296 Q 788,288 796,288 H 792"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- Order Service -> Payment Service (accent: from the focal node) -->
<path d="M 756,448 H 776 Q 784,448 784,440 V 412 Q 784,404 792,404 H 792"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- Order Service -> Kafka (down, accent: from the focal node) -->
<path d="M 756,472 H 776 Q 784,472 784,480 V 500 Q 784,508 792,508 H 792"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<!-- Payment Service -> Kafka (same column, straight drop) -->
<line x1="856" y1="440" x2="856" y2="468" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ===== Nodes ===== -->
<!-- Ingress Controller -->
<rect x="56" y="268" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="116" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Ingress</text>

<!-- Frontend -->
<rect x="224" y="252" width="140" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="294" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Frontend</text>
<text x="294" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">RPS 1000</text>
<text x="294" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">P99 50ms</text>

<!-- API Gateway -->
<rect x="420" y="252" width="140" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="490" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">API Gateway</text>
<text x="490" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">RPS 800</text>
<text x="490" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">P99 100ms</text>

<!-- User Service -->
<rect x="616" y="100" width="140" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="686" y="126" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">User Service</text>
<text x="686" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">RPS 500</text>
<text x="686" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">P99 80ms</text>

<!-- Order Service (focal) -->
<rect x="616" y="400" width="140" height="88" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="686" y="426" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Order Service</text>
<text x="686" y="444" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">RPS 300</text>
<text x="686" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">P99 120ms</text>

<!-- Payment Service -->
<rect x="792" y="368" width="128" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="856" y="394" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Payment</text>
<text x="856" y="410" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">RPS 100</text>
<text x="856" y="424" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">P99 200ms</text>

<!-- PostgreSQL (store) -->
<rect x="792" y="248" width="128" height="64" rx="10" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<line x1="792" y1="260" x2="920" y2="260" stroke="#545B64" stroke-width="0.8" opacity="0.5"/>
<text x="856" y="286" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">PostgreSQL</text>

<!-- Redis (store) -->
<rect x="792" y="96" width="128" height="64" rx="10" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<line x1="792" y1="108" x2="920" y2="108" stroke="#545B64" stroke-width="0.8" opacity="0.5"/>
<text x="856" y="134" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Redis</text>

<!-- Kafka -->
<rect x="792" y="468" width="128" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="856" y="504" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Kafka</text>

</svg>