<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc">
      <title id="d1-title">Token bucket rate limiter</title>
      <desc id="d1-desc">A bucket holding up to 100 tokens is refilled at 10 tokens per second; each arriving request checks whether a token is available, consuming one to proceed or being rejected with a 429 when the bucket is empty.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7D8998"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- ================= ARROWS ================= -->

      <!-- Refill -.-> Bucket (dashed, vertical) -->
      <path d="M480,132 V156" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

      <!-- Request -> Check (down then right into diamond's left vertex) -->
      <path d="M256,212 V320 Q256,328 264,328 H428" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Bucket -> Check (down then right into diamond's top apex) -->
      <path d="M480,260 V276 Q480,284 488,284 H500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Check -Yes-> Allow (vertical, focal path into Allow) -->
      <line x1="500" y1="372" x2="500" y2="424" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Check -No-> Reject (right then down) -->
      <path d="M572,328 H720 Q728,328 728,336 V424" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Allow -.-> Bucket (dashed write-back: left, up, right into bucket's bottom edge at x=440) -->
      <path d="M420,452 H320 Q312,452 312,444 V268 Q312,260 320,260 H440" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>

      <!-- ================= ARROW LABELS ================= -->
      <!-- +10/SEC: beside dashed Refill->Bucket vertical segment -->
      <rect x="488" y="136" width="56" height="12" rx="2" fill="#ffffff"/>
      <text x="516" y="145" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">+10/SEC</text>

      <!-- YES: beside vertical accent-free segment into Allow -->
      <rect x="508" y="388" width="30" height="12" rx="2" fill="#ffffff"/>
      <text x="523" y="397" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- NO: above horizontal segment y=328 x572-720 -->
      <rect x="632" y="308" width="26" height="12" rx="2" fill="#ffffff"/>
      <text x="645" y="317" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- -1 TOKEN: beside dashed vertical write-back segment x=312 -->
      <rect x="320" y="344" width="48" height="12" rx="2" fill="#ffffff"/>
      <text x="344" y="353" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">-1 TOKEN</text>

      <!-- ================= NODES ================= -->

      <!-- Refill -->
      <rect x="400" y="76" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="400" y="76" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="100" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Refill</text>
      <text x="480" y="116" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">10 TOK/SEC</text>

      <!-- Bucket (focal) -->
      <rect x="400" y="156" width="160" height="104" rx="6" fill="#ffffff"/>
      <rect x="400" y="156" width="160" height="104" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="480" y="196" fill="#EC7211" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Token Bucket</text>
      <text x="480" y="214" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">MAX: 100</text>
      <text x="480" y="230" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">TOKENS</text>

      <!-- Request Arrives -->
      <rect x="176" y="156" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="176" y="156" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="256" y="188" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Request Arrives</text>

      <!-- Check (diamond: Tokens Available?) -->
      <polygon points="500,284 572,328 500,372 428,328" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="500" y="324" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tokens</text>
      <text x="500" y="338" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Available?</text>

      <!-- Allow -->
      <rect x="420" y="424" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="420" y="424" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="500" y="448" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Allow Request</text>
      <text x="500" y="464" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CONSUME 1</text>

      <!-- Reject -->
      <rect x="648" y="424" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="648" y="424" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="728" y="448" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Reject Request</text>
      <text x="728" y="464" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">HTTP 429</text>

    </svg>
