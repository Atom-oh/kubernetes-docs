<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="am-internal-title am-internal-desc">
      <title id="am-internal-title">Alertmanager Internal Structure</title>
      <desc id="am-internal-desc">Architecture diagram showing alerts entering Alertmanager's API, flowing through a pipeline of dispatcher, inhibitor, silencer, aggregation and notification stages to receivers, while a clustered gossip protocol keeps the notification log and silence store synced across replicas.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zones -->
      <rect x="152" y="72" width="612" height="384" rx="8" fill="none" stroke="rgba(35,47,62,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="168" y="76" width="120" height="12" rx="2" fill="#ffffff"/>
      <text x="228" y="85" fill="rgba(35,47,62,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ALERTMANAGER</text>

      <rect x="264" y="100" width="480" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="280" y="104" width="120" height="12" rx="2" fill="#ffffff"/>
      <text x="340" y="113" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ALERT PIPELINE</text>

      <rect x="436" y="232" width="316" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="452" y="236" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="484" y="245" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STORAGE</text>

      <rect x="476" y="364" width="240" height="72" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="492" y="368" width="60" height="12" rx="2" fill="#ffffff"/>
      <text x="522" y="377" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER</text>

      <!-- Arrows (drawn before nodes) -->
      <!-- Prometheus -> API -->
      <path d="M 144,158 H 168" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- API -> Dispatcher -->
      <path d="M 248,158 H 280" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Dispatcher -> Inhibitor -->
      <path d="M 360,158 H 372" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Inhibitor -> Silencer -->
      <path d="M 452,158 H 464" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Silencer -> Aggregation -->
      <path d="M 544,158 H 556" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Aggregation -> Notification -->
      <path d="M 636,158 H 648" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Notification -> Receivers (headline) -->
      <path d="M 728,158 H 800" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- Silencer -> Silences (query) -->
      <path d="M 504,176 V 268" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="510" y="216" width="46" height="12" rx="2" fill="#ffffff"/>
      <text x="533" y="225" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">QUERY</text>

      <!-- Notification -> nflog (record) -->
      <path d="M 688,176 V 268" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="694" y="216" width="50" height="12" rx="2" fill="#ffffff"/>
      <text x="719" y="225" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">RECORD</text>

      <!-- Gossip -> Silences (sync) -->
      <path d="M 568,388 V 348 Q 568,340 560,340 H 512 Q 504,340 504,332 V 304"
            fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="516" y="320" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="536" y="329" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">SYNC</text>

      <!-- Gossip -> nflog (sync) -->
      <path d="M 624,388 V 348 Q 624,340 632,340 H 680 Q 688,340 688,332 V 304"
            fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="636" y="320" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="656" y="329" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">SYNC</text>

      <!-- Nodes -->
      <!-- Prometheus (external) -->
      <rect x="16" y="140" width="128" height="36" rx="6" fill="rgba(35,47,62,0.03)"/>
      <rect x="16" y="140" width="128" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="80" y="162" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Prometheus</text>

      <!-- API (focal) -->
      <rect x="168" y="140" width="80" height="36" rx="6" fill="rgba(255,153,0,0.10)"/>
      <rect x="168" y="140" width="80" height="36" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="208" y="158" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">API</text>
      <text x="208" y="170" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/v2/alerts</text>

      <!-- Dispatcher -->
      <rect x="280" y="140" width="80" height="36" rx="6" fill="#ffffff"/>
      <rect x="280" y="140" width="80" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="320" y="158" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Dispatcher</text>
      <text x="320" y="170" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routing</text>

      <!-- Inhibitor -->
      <rect x="372" y="140" width="80" height="36" rx="6" fill="#ffffff"/>
      <rect x="372" y="140" width="80" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="412" y="158" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Inhibitor</text>
      <text x="412" y="170" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">suppress</text>

      <!-- Silencer -->
      <rect x="464" y="140" width="80" height="36" rx="6" fill="#ffffff"/>
      <rect x="464" y="140" width="80" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="504" y="158" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Silencer</text>
      <text x="504" y="170" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">muting</text>

      <!-- Aggregation -->
      <rect x="556" y="140" width="80" height="36" rx="6" fill="#ffffff"/>
      <rect x="556" y="140" width="80" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="596" y="158" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Aggreg.</text>
      <text x="596" y="170" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">grouping</text>

      <!-- Notification -->
      <rect x="648" y="140" width="80" height="36" rx="6" fill="#ffffff"/>
      <rect x="648" y="140" width="80" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="688" y="158" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Notify</text>
      <text x="688" y="170" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sending</text>

      <!-- Receivers (external) -->
      <rect x="800" y="140" width="96" height="36" rx="6" fill="rgba(35,47,62,0.03)"/>
      <rect x="800" y="140" width="96" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="848" y="162" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Receivers</text>

      <!-- Silences (store) -->
      <rect x="456" y="268" width="96" height="36" rx="6" fill="rgba(35,47,62,0.05)"/>
      <rect x="456" y="268" width="96" height="36" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="504" y="286" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Silences</text>
      <text x="504" y="298" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">silence rules</text>

      <!-- nflog (store) -->
      <rect x="640" y="268" width="96" height="36" rx="6" fill="rgba(35,47,62,0.05)"/>
      <rect x="640" y="268" width="96" height="36" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="688" y="286" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">nflog</text>
      <text x="688" y="298" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">alert log</text>

      <!-- Gossip Protocol -->
      <rect x="516" y="388" width="160" height="36" rx="6" fill="#ffffff"/>
      <rect x="516" y="388" width="160" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="596" y="406" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Gossip Protocol</text>
      <text x="596" y="418" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">state sync</text>

      <!-- Legend -->
      <line x1="30" y1="500" x2="930" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="30" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="140" y1="512" x2="176" y2="512" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="184" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">PIPELINE STEP</text>
      <line x1="320" y1="512" x2="356" y2="512" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="364" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">STATE WRITE / SYNC</text>
      <line x1="560" y1="512" x2="596" y2="512" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="604" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">TO RECEIVERS</text>
    </svg>