<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ipam-modes-title ipam-modes-desc">
  <title id="ipam-modes-title">Cilium IPAM 모드별 할당 방식</title>
  <desc id="ipam-modes-desc">클러스터 범위, 노드 범위, 클라우드 제공업체, 사용자 정의라는 네 가지 Cilium IPAM 구현 방식이 각각 중앙 집중식, 분산, 클라우드 네이티브, 사용자 정의 할당 결과로 이어지는 것을 보여주는 다이어그램이며, 여러 퍼블릭 클라우드에 걸쳐 VPC/VNET IP를 그대로 쓰는 클라우드 네이티브 할당이 가장 폭넓게 쓰이는 방식으로 강조되어 있다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- ===== Zones (source categories) ===== -->
  <!-- Zone 1: 클러스터 범위 IPAM  y88-176 -->
  <rect x="40" y="88" width="380" height="88" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="56" y="112" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">클러스터 범위 IPAM</text>
  <text x="64" y="136" fill="#545B64" font-size="12"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">· 클러스터 풀</text>
  <text x="64" y="160" fill="#545B64" font-size="12"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">· 다중 풀</text>

  <!-- Zone 2: 노드 범위 IPAM  y208-272 -->
  <rect x="40" y="208" width="380" height="64" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="56" y="232" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">노드 범위 IPAM</text>
  <text x="64" y="256" fill="#545B64" font-size="12"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">· 쿠버네티스 호스트 범위</text>

  <!-- Zone 3: 클라우드 제공업체 IPAM  y304-416 (focal source) -->
  <rect x="40" y="304" width="380" height="112" rx="8" fill="rgba(255,153,0,0.06)" stroke="rgba(236,114,17,0.45)" stroke-width="0.8"/>
  <text x="56" y="328" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">클라우드 제공업체 IPAM</text>
  <text x="64" y="352" fill="#545B64" font-size="12"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">· AWS ENI</text>
  <text x="64" y="376" fill="#545B64" font-size="12"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">· Azure IPAM</text>
  <text x="64" y="400" fill="#545B64" font-size="12"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">· GKE IPAM</text>

  <!-- Zone 4: 사용자 정의 IPAM  y448-512 -->
  <rect x="40" y="448" width="380" height="64" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="56" y="472" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">사용자 정의 IPAM</text>
  <text x="64" y="496" fill="#545B64" font-size="12"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">· CRD 기반 IPAM</text>

  <!-- ===== Arrows (straight — same y on both ends) ===== -->
  <!-- 1: zone1(center y132) -> outcome1(center y132) -->
  <line x1="420" y1="132" x2="680" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="506" y="112" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="550" y="121" fill="#7D8998" font-size="8" letter-spacing="0.06em" text-anchor="middle"
        font-family="'Geist Mono',monospace">풀 기반 할당</text>

  <!-- 2: zone2(center y240) -> outcome2(center y240) -->
  <line x1="420" y1="240" x2="680" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="496" y="220" width="108" height="12" rx="2" fill="#ffffff"/>
  <text x="550" y="229" fill="#7D8998" font-size="8" letter-spacing="0.06em" text-anchor="middle"
        font-family="'Geist Mono',monospace">노드별 동적 할당</text>

  <!-- 3: zone3(center y360, focal) -> outcome3(center y360, focal) -->
  <line x1="420" y1="360" x2="680" y2="360" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="486" y="340" width="128" height="12" rx="2" fill="#ffffff"/>
  <text x="550" y="349" fill="#EC7211" font-size="8" letter-spacing="0.06em" text-anchor="middle"
        font-family="'Geist Mono',monospace">클라우드 API 할당</text>

  <!-- 4: zone4(center y480) -> outcome4(center y480) -->
  <line x1="420" y1="480" x2="680" y2="480" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="496" y="460" width="108" height="12" rx="2" fill="#ffffff"/>
  <text x="550" y="469" fill="#7D8998" font-size="8" letter-spacing="0.06em" text-anchor="middle"
        font-family="'Geist Mono',monospace">CRD 기반 할당</text>

  <!-- ===== Outcome nodes ===== -->
  <!-- outcome1: 중앙 집중식 할당  y100-164 -->
  <rect x="680" y="100" width="240" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="100" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="800" y="136" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">중앙 집중식 할당</text>

  <!-- outcome2: 분산 할당  y208-272 -->
  <rect x="680" y="208" width="240" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="208" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="800" y="244" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">분산 할당</text>

  <!-- outcome3: 클라우드 네이티브 할당 (focal)  y328-392 -->
  <rect x="680" y="328" width="240" height="64" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="680" y="328" width="240" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="800" y="364" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">클라우드 네이티브 할당</text>

  <!-- outcome4: 사용자 정의 할당  y448-512 -->
  <rect x="680" y="448" width="240" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="448" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="800" y="484" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">사용자 정의 할당</text>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="568" fill="#545B64" font-size="8" letter-spacing="0.14em"
        font-family="'Geist Mono',monospace">LEGEND</text>

  <rect x="140" y="560" width="14" height="14" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="162" y="571" fill="#545B64" font-size="12"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">구현 방식 (IPAM 모드)</text>

  <rect x="380" y="560" width="14" height="14" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="402" y="571" fill="#545B64" font-size="12"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">할당 결과</text>

  <rect x="540" y="560" width="14" height="14" rx="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="562" y="571" fill="#545B64" font-size="12"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">멀티클라우드 핵심 경로</text>
</svg>