<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
    <title id="t3">서비스 메시 사이드카 패턴</title>
    <desc id="d3">Istio 컨트롤 플레인이 세 서비스에 주입된 사이드카 프록시들에 설정을 배포하고, 각 서비스와 사이드카가 짝을 이루며 사이드카끼리 서로 통신하는 서비스 메시 구조를 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Zones ===== -->
    <rect x="40" y="160" width="200" height="172" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="100" y="164" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="140" y="173" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">서비스 A</text>

    <rect x="380" y="160" width="200" height="172" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="440" y="164" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="173" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">서비스 B</text>

    <rect x="720" y="160" width="200" height="172" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="780" y="164" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="820" y="173" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">서비스 C</text>

    <!-- ===== Arrows (bidirectional, drawn before boxes) ===== -->
    <!-- A <-> SA -->
    <line x1="115" y1="244" x2="115" y2="268" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <!-- B <-> SB -->
    <line x1="455" y1="244" x2="455" y2="268" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <!-- C <-> SC -->
    <line x1="795" y1="244" x2="795" y2="268" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

    <!-- IC <-.-> SA (dashed, routes through neutral gap left of zone B) -->
    <path d="M 440,96 V 100 Q 440,108 432,108 H 308 Q 300,108 300,116 V 248 Q 300,256 292,256 H 173 Q 165,256 165,264 V 268"
          fill="none" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <!-- IC <-.-> SB (dashed, routes through same neutral gap, offset) -->
    <path d="M 480,96 V 116 Q 480,124 472,124 H 338 Q 330,124 330,132 V 248 Q 330,256 338,256 H 497 Q 505,256 505,264 V 268"
          fill="none" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <!-- IC <-.-> SC (dashed, routes through neutral gap right of zone B) -->
    <path d="M 520,96 V 132 Q 520,140 528,140 H 642 Q 650,140 650,148 V 248 Q 650,256 658,256 H 837 Q 845,256 845,264 V 268"
          fill="none" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>

    <!-- SA <-> SB -->
    <line x1="216" y1="292" x2="404" y2="292" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <!-- SB <-> SC -->
    <line x1="556" y1="292" x2="744" y2="292" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <!-- SA <-> SC (routes below all zones) -->
    <path d="M 140,316 V 336 Q 140,344 148,344 H 812 Q 820,344 820,336 V 316"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

    <!-- ===== Nodes ===== -->
    <!-- IC (focal, standalone) -->
    <rect x="400" y="40" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="40" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Istio Control Plane</text>
    <text x="480" y="80" fill="#EC7211" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">istiod</text>

    <!-- A -->
    <rect x="64" y="196" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="64" y="196" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="218" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">서비스 A</text>
    <text x="140" y="234" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">app container</text>

    <!-- SA -->
    <rect x="64" y="268" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="64" y="268" width="152" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="140" y="290" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">사이드카 프록시 A</text>
    <text x="140" y="306" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">envoy</text>

    <!-- B -->
    <rect x="404" y="196" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="404" y="196" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="218" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">서비스 B</text>
    <text x="480" y="234" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">app container</text>

    <!-- SB -->
    <rect x="404" y="268" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="404" y="268" width="152" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="290" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">사이드카 프록시 B</text>
    <text x="480" y="306" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">envoy</text>

    <!-- C -->
    <rect x="744" y="196" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="744" y="196" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="820" y="218" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">서비스 C</text>
    <text x="820" y="234" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">app container</text>

    <!-- SC -->
    <rect x="744" y="268" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="744" y="268" width="152" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="820" y="290" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">사이드카 프록시 C</text>
    <text x="820" y="306" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">envoy</text>

    <!-- Legend -->
    <line x1="40" y1="480" x2="920" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="180" y1="491" x2="204" y2="491" stroke="#545B64" stroke-width="1.2"/>
    <text x="212" y="496" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">데이터 플레인 트래픽</text>
    <line x1="420" y1="491" x2="444" y2="491" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="452" y="496" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">컨트롤 플레인 설정 배포</text>
  </svg>