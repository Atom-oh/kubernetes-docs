<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Kubernetes Authorization Flow</title>
<desc id="d">An authenticated request is evaluated by one of four authorization modes — RBAC, ABAC, Node, or Webhook — and the decision either allows the request or denies it; RBAC itself is built from Roles bound to subjects via RoleBindings.</desc>
<rect width="960" height="600" fill="#ffffff"/>

<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<text x="40" y="34" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CORE · SECURITY</text>
<text x="40" y="58" fill="#232F3E" font-size="20" font-weight="700">Authorization Flow</text>

<!-- ===== Zone: RBAC components ===== -->
<rect x="700" y="220" width="220" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="746" y="224" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="810" y="233" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">RBAC COMPONENTS</text>

<!-- ===== Arrows ===== -->
<line x1="480" y1="88" x2="480" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="180" x2="480" y2="224" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="480" y1="336" x2="480" y2="372" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 447,420 V 444 Q 447,452 439,452 H 288 Q 280,452 280,460 V 464" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 513,420 V 444 Q 513,452 521,452 H 672 Q 680,452 680,460 V 464" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- RBAC -> Role (straight, same y), RBAC -> Binding (fanned, elbow down) -->
<line x1="436" y1="272" x2="722" y2="272" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M 436,292 H 571 Q 579,292 579,300 V 320 Q 579,328 587,328 H 722" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>

<!-- Arrow labels -->
<rect x="452" y="98" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="484" y="107" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">AUTHZ REQ</text>

<rect x="452" y="190" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="478" y="199" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">EVALUATE</text>

<rect x="452" y="346" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="355" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DECISION</text>

<rect x="322" y="426" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="350" y="435" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>

<rect x="608" y="426" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="632" y="435" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DENY</text>

<!-- ===== Nodes ===== -->
<g>
<!-- Authenticated user -->
<rect x="380" y="40" width="200" height="48" rx="6" fill="#ffffff"/>
<rect x="380" y="40" width="200" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="480" y="60" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Authenticated User</text>
<text x="480" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">identity confirmed</text>

<!-- API (focal) -->
<rect x="380" y="132" width="200" height="48" rx="6" fill="#ffffff"/>
<rect x="380" y="132" width="200" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="480" y="152" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API Server</text>
<text x="480" y="168" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">routes to authz mode</text>

<!-- Authorization modes box -->
<rect x="260" y="224" width="440" height="112" rx="6" fill="#ffffff"/>
<rect x="260" y="224" width="440" height="112" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="246" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Authorization Modes</text>

<!-- RBAC chip (with outgoing dashed links to Role/Binding zone) -->
<rect x="286" y="262" width="150" height="40" rx="4" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1"/>
<text x="361" y="286" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle">RBAC</text>

<rect x="443" y="266" width="72" height="32" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="479" y="286" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle">ABAC</text>

<rect x="530" y="266" width="76" height="32" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="568" y="286" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle">Node</text>

<rect x="286" y="308" width="150" height="20" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="361" y="322" fill="#232F3E" font-size="9" font-weight="600" text-anchor="middle">Webhook Authorization</text>

<!-- Decision -->
<rect x="380" y="372" width="200" height="48" rx="6" fill="#ffffff"/>
<rect x="380" y="372" width="200" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="480" y="392" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Authorization Decision</text>
<text x="480" y="408" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">allow or deny</text>

<!-- Allow -->
<rect x="180" y="464" width="200" height="48" rx="6" fill="#ffffff"/>
<rect x="180" y="464" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="280" y="484" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Process Request</text>
<text x="280" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">continue to handler</text>

<!-- Deny -->
<rect x="580" y="464" width="200" height="48" rx="6" fill="#ffffff"/>
<rect x="580" y="464" width="200" height="48" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="680" y="484" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Deny Request</text>
<text x="680" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">403 forbidden</text>

<!-- Role / Binding (RBAC components zone) -->
<rect x="722" y="252" width="176" height="40" rx="6" fill="#ffffff"/>
<rect x="722" y="252" width="176" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="810" y="270" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle">Role / ClusterRole</text>
<text x="810" y="284" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">permission definition</text>

<rect x="722" y="308" width="176" height="40" rx="6" fill="#ffffff"/>
<rect x="722" y="308" width="176" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="810" y="326" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle">RoleBinding</text>
<text x="810" y="340" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">permission assignment</text>
</g>
</svg>