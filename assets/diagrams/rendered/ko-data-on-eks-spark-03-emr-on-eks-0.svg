<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="emr-eks-seq-title emr-eks-seq-desc">
  <title id="emr-eks-seq-title">EMR on EKS 작업 제출 시퀀스</title>
  <desc id="emr-eks-seq-desc">사용자가 StartJobRun을 호출하면 EMR 컨트롤 플레인이 요청을 가상 클러스터에 매핑된 EKS 네임스페이스로 라우팅하고, 해당 네임스페이스가 작업 실행 역할(IRSA)로 드라이버 Pod를 생성하며, 드라이버가 Executor Pod를 요청하고 상태·로그·메트릭이 다시 EMR로 보고되는 흐름을 보여준다.</desc>

  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#545B64" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- ============ Lifelines ============ -->
  <line x1="140" y1="112" x2="140" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="380" y1="112" x2="380" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="620" y1="112" x2="620" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="860" y1="112" x2="860" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ============ Activation bars ============ -->
  <rect x="376" y="160" width="8" height="60" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
  <rect x="616" y="220" width="8" height="60" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
  <rect x="856" y="280" width="8" height="140" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
  <rect x="376" y="400" width="8" height="40" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

  <!-- ============ Messages (drawn before actor boxes) ============ -->

  <!-- m1: User -> EMR : StartJobRun (accent headline call) -->
  <line x1="140" y1="160" x2="376" y2="160" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="176" y="140" width="164" height="12" rx="2" fill="#ffffff"/>
  <text x="258" y="149" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">STARTJOBRUN(VC-ID, ROLE)</text>

  <!-- m2: EMR -> Virtual Cluster : bind namespace -->
  <line x1="384" y1="220" x2="616" y2="220" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="440" y="200" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="500" y="209" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">네임스페이스 지정</text>

  <!-- m3: Virtual Cluster -> Pods : create driver pod (IRSA role) -->
  <line x1="624" y1="280" x2="856" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="662" y="260" width="156" height="12" rx="2" fill="#ffffff"/>
  <text x="740" y="269" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">드라이버 생성(IRSA)</text>

  <!-- m4: Pods self-message : request executor pods -->
  <path d="M 864 320 L 908 320 Q 916 320 916 328 L 916 348 Q 916 356 908 356 L 864 356"
        fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="900" y="330" width="14" height="12" rx="2" fill="#ffffff"/>
  <text x="925" y="342" fill="#545B64" font-size="8" class="mono" text-anchor="start" letter-spacing="0.02em">EXECUTOR</text>
  <text x="925" y="352" fill="#545B64" font-size="8" class="mono" text-anchor="start" letter-spacing="0.02em">요청</text>

  <!-- m5: Pods -> EMR : status / logs / metrics (async, dashed, open head) -->
  <line x1="856" y1="420" x2="384" y2="420" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
  <rect x="560" y="400" width="150" height="12" rx="2" fill="#ffffff"/>
  <text x="635" y="409" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">상태·로그·메트릭</text>

  <!-- ============ Actor boxes ============ -->

  <!-- 1. User / SDK / Step Functions -->
  <rect x="60" y="32" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="60" y="32" width="160" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="68" y="40" width="52" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="94" y="49" fill="#232F3E" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.06em">CLIENT</text>
  <text x="140" y="80" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">사용자 / SDK /</text>
  <text x="140" y="96" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Step Functions</text>

  <!-- 2. EMR Control Plane -->
  <rect x="300" y="32" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="300" y="32" width="160" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="308" y="40" width="64" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="340" y="49" fill="#232F3E" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.06em">CONTROL</text>
  <text x="380" y="80" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">EMR</text>
  <text x="380" y="96" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">컨트롤 플레인</text>

  <!-- 3. Virtual Cluster (EKS Namespace) — focal -->
  <rect x="540" y="32" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="540" y="32" width="160" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="548" y="40" width="80" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
  <text x="588" y="49" fill="#EC7211" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.04em">NAMESPACE</text>
  <text x="620" y="80" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">가상 클러스터</text>
  <text x="620" y="96" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">(EKS 네임스페이스)</text>

  <!-- 4. Driver / Executor Pods -->
  <rect x="780" y="32" width="160" height="80" rx="6" fill="#ffffff"/>
  <rect x="780" y="32" width="160" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="788" y="40" width="64" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="820" y="49" fill="#232F3E" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.06em">COMPUTE</text>
  <text x="860" y="80" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">드라이버 / Executor</text>
  <text x="860" y="96" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod</text>

  <!-- ============ Legend ============ -->
  <line x1="30" y1="512" x2="930" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="528" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>

  <line x1="130" y1="524" x2="162" y2="524" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="170" y="528" fill="#545B64" font-size="8" class="mono" letter-spacing="0.02em">주요 호출</text>

  <line x1="340" y1="524" x2="372" y2="524" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="380" y="528" fill="#545B64" font-size="8" class="mono" letter-spacing="0.02em">내부 호출</text>

  <line x1="560" y1="524" x2="592" y2="524" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
  <text x="600" y="528" fill="#545B64" font-size="8" class="mono" letter-spacing="0.02em">비동기 보고</text>

  <rect x="800" y="519" width="8" height="10" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
  <text x="816" y="528" fill="#545B64" font-size="8" class="mono" letter-spacing="0.02em">ACTIVATION</text>

</svg>