<title id="en-observability-alerting-readme-5-title">Alert routing flow by severity and team</title>
<desc id="en-observability-alerting-readme-5-desc">Flowchart showing an alert routed first by severity to a phone, PagerDuty, Slack, or email channel, then — for the three actionable severities — routed again by owning team to SRE, dev, DBA, or security.</desc>
