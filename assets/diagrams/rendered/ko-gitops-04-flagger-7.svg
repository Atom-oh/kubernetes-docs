<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t7-title t7-desc">
<title id="t7-title">이미지 자동화 파이프라인 시퀀스</title>
<desc id="t7-desc">CI/CD가 새 이미지를 ECR에 푸시하면 Flux 이미지 자동화가 이를 스캔해 Git 저장소에 태그 갱신 커밋을 만들고, 이 변경을 감지한 쿠버네티스가 Deployment를 갱신하면 Flagger가 카나리 점진적 배포를 시작해 완료 또는 롤백으로 마무리하는 과정을 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Lifelines -->
<line x1="96" y1="80" x2="96" y2="500" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="288" y1="80" x2="288" y2="500" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="480" y1="80" x2="480" y2="500" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="672" y1="80" x2="672" y2="500" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="864" y1="80" x2="864" y2="500" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Activation -->
<rect x="668" y="360" width="8" height="100" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- Messages -->
<line x1="96" y1="112" x2="288" y2="112" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="112" y="96" width="160" height="12" rx="2" fill="#ffffff"/>
<text x="192" y="105" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">1 · 새 이미지 push v2.0.0</text>

<line x1="480" y1="152" x2="288" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="316" y="136" width="136" height="12" rx="2" fill="#ffffff"/>
<text x="384" y="145" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">2 · 이미지 태그 스캔</text>

<!-- self message on Flux/Git (commit) -->
<path d="M 480,192 H 560 Q 568,192 568,200 V 208 Q 568,216 560,216 H 480"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="576" y="196" width="144" height="12" rx="2" fill="#ffffff"/>
<text x="648" y="205" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">3 · 태그 갱신 커밋</text>

<line x1="480" y1="256" x2="672" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="508" y="240" width="136" height="12" rx="2" fill="#ffffff"/>
<text x="576" y="249" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">4 · Git 변경 감지</text>

<line x1="480" y1="296" x2="672" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="500" y="280" width="152" height="12" rx="2" fill="#ffffff"/>
<text x="576" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">5 · Deployment 갱신</text>

<line x1="672" y1="336" x2="864" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="700" y="320" width="136" height="12" rx="2" fill="#ffffff"/>
<text x="768" y="329" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">6 · Pod 변경 감지</text>

<!-- self message on Flagger (canary start, focal) -->
<path d="M 672,376 H 592 Q 584,376 584,384 V 392 Q 584,400 592,400 H 672"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="404" y="380" width="176" height="12" rx="2" fill="#ffffff"/>
<text x="492" y="389" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">7 · 카나리 점진적 배포 시작</text>

<line x1="864" y1="440" x2="672" y2="440" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="588" y="424" width="184" height="12" rx="2" fill="#ffffff"/>
<text x="680" y="433" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">8 · 배포 완료 또는 롤백</text>

<!-- Actor boxes -->
<rect x="26" y="40" width="140" height="40" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="96" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">CI/CD</text>

<rect x="218" y="40" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="288" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Amazon ECR</text>

<rect x="410" y="40" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Flux / Git</text>

<rect x="602" y="40" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="672" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Kubernetes</text>

<rect x="794" y="40" width="140" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="864" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Flagger</text>

<!-- Legend -->
<line x1="32" y1="512" x2="928" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<line x1="32" y1="528" x2="60" y2="528" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="68" y="530" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">카나리 배포 시작 (focal)</text>
<line x1="280" y1="528" x2="308" y2="528" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="316" y="530" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">결과 반환</text>
</svg>