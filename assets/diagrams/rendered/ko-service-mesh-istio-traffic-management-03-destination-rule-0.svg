<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dr-role-title dr-role-desc">
    <title id="dr-role-title">VirtualService와 DestinationRule의 역할 분리</title>
    <desc id="dr-role-desc">클라이언트 요청이 VirtualService의 라우팅 결정을 거쳐 DestinationRule의 트래픽 정책에 따라 두 버전으로 분배되는 흐름을 보여줍니다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="200" y="236" width="168" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="240" y="240" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="284" y="249" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">VIRTUALSERVICE</text>

    <rect x="408" y="236" width="168" height="112" rx="8" fill="rgba(255,153,0,0.04)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8"/>
    <rect x="440" y="240" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="492" y="249" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DESTINATIONRULE</text>

    <rect x="640" y="88" width="260" height="408" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="726" y="92" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="770" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">서비스</text>

    <!-- Arrows (behind boxes) -->
    <line x1="160" y1="300" x2="220" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="348" y1="284" x2="428" y2="284" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="348" y1="316" x2="428" y2="316" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 556,284 H 600 Q 608,284 608,276 V 160 Q 608,152 616,152 H 660" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M 556,316 H 600 Q 608,316 608,324 V 440 Q 608,448 616,448 H 660" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels -->
    <rect x="370" y="264" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="388" y="273" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">90%</text>
    <rect x="370" y="296" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="388" y="305" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">10%</text>

    <!-- Node: Client (input) -->
    <rect x="40" y="268" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="268" width="120" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="48" y="276" width="32" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
    <text x="64" y="285" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REQ</text>
    <text x="100" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">클라이언트</text>
    <text x="100" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">http request</text>

    <!-- Node: Route (backend) -->
    <rect x="220" y="268" width="128" height="64" rx="6" fill="#ffffff"/>
    <rect x="220" y="268" width="128" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="228" y="276" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="242" y="285" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VS</text>
    <text x="284" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">라우팅 결정</text>
    <text x="284" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">어디로?</text>

    <!-- Node: Policy (focal) -->
    <rect x="428" y="268" width="128" height="64" rx="6" fill="#ffffff"/>
    <rect x="428" y="268" width="128" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="436" y="276" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="450" y="285" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DR</text>
    <text x="500" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">트래픽 정책</text>
    <text x="500" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">어떻게?</text>

    <!-- Node: V1 (backend) -->
    <rect x="660" y="120" width="220" height="64" rx="6" fill="#ffffff"/>
    <rect x="660" y="120" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="668" y="128" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="680" y="137" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">V1</text>
    <text x="770" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Version 1</text>
    <text x="770" y="172" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">subset: v1</text>

    <!-- Node: V2 (backend) -->
    <rect x="660" y="416" width="220" height="64" rx="6" fill="#ffffff"/>
    <rect x="660" y="416" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="668" y="424" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="680" y="433" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">V2</text>
    <text x="770" y="452" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Version 2</text>
    <text x="770" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">subset: v2</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="556" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="60" y="565" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">클라이언트 요청</text>

    <rect x="220" y="556" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="565" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">라우팅 / 서비스</text>

    <rect x="420" y="556" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="440" y="565" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">DestinationRule 정책 (초점)</text>

    <line x1="700" y1="561" x2="728" y2="561" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="736" y="565" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">정책 적용 흐름</text>
  </svg>
