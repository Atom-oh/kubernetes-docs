<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployrelease-title deployrelease-desc">
<title id="deployrelease-title">Deployment phase vs. release phase</title>
<desc id="deployrelease-desc">Flowchart showing a container image deployed once through Kubernetes, then a feature flag evaluation gradually widening its release from internal users to beta, canary, and full general availability.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zones (bg, before arrows/nodes) -->
<rect x="24" y="64" width="416" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="40" y="68" width="168" height="12" rx="2" fill="#ffffff"/>
<text x="124" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEPLOYMENT PHASE</text>

<rect x="24" y="344" width="928" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="40" y="348" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="140" y="357" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RELEASE PHASE (FLAGS)</text>

<!-- Arrows (before boxes) -->
<line x1="152" y1="132" x2="176" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="288" y1="132" x2="312" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 368,164 V 264 Q 368,272 360,272 H 128 Q 120,272 120,280 V 380"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<line x1="200" y1="412" x2="224" y2="412" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="384" y1="412" x2="408" y2="412" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="568" y1="412" x2="592" y2="412" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="752" y1="412" x2="776" y2="412" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Node: CI Pipeline -->
<rect x="40" y="100" width="112" height="64" rx="6" fill="#ffffff"/>
<rect x="40" y="100" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="48" y="108" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="60" y="117" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CI</text>
<text x="96" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">CI Pipeline</text>
<text x="96" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">build</text>

<!-- Node: Container Image -->
<rect x="176" y="100" width="112" height="64" rx="6" fill="#ffffff"/>
<rect x="176" y="100" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="184" y="108" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="198" y="117" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IMG</text>
<text x="232" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Container Image</text>
<text x="232" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">registry push</text>

<!-- Node: Kubernetes Deploy -->
<rect x="312" y="100" width="112" height="64" rx="6" fill="#ffffff"/>
<rect x="312" y="100" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="320" y="108" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="336" y="117" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">K8S</text>
<text x="368" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Kubernetes Deploy</text>
<text x="368" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl apply</text>

<!-- Node: Flag Evaluation (focal) -->
<rect x="40" y="380" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="40" y="380" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<rect x="48" y="388" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="62" y="397" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FLG</text>
<text x="120" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Flag Evaluation</text>
<text x="120" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">openfeature sdk</text>

<!-- Node: Internal Users -->
<rect x="224" y="380" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="224" y="380" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<rect x="232" y="388" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
<text x="246" y="397" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INT</text>
<text x="304" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Internal Users</text>
<text x="304" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0.1%</text>

<!-- Node: Beta Users -->
<rect x="408" y="380" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="408" y="380" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<rect x="416" y="388" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
<text x="430" y="397" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BTA</text>
<text x="488" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Beta Users</text>
<text x="488" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5%</text>

<!-- Node: Canary -->
<rect x="592" y="380" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="592" y="380" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<rect x="600" y="388" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
<text x="614" y="397" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CNY</text>
<text x="672" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Canary</text>
<text x="672" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">25%</text>

<!-- Node: General Availability -->
<rect x="776" y="380" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="776" y="380" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<rect x="784" y="388" width="24" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
<text x="796" y="397" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GA</text>
<text x="856" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">General Availability</text>
<text x="856" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">100%</text>

<!-- Legend -->
<line x1="24" y1="500" x2="936" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="24" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="24" y="532" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="44" y="541" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Deployment step</text>
<rect x="200" y="532" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="220" y="541" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Release stage</text>
<rect x="360" y="532" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="380" y="541" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Flag evaluation (focal)</text>
</svg>