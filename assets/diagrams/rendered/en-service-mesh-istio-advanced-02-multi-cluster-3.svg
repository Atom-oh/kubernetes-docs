<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mc-single-title mc-single-desc">
<title id="mc-single-title">Single-cluster namespace separation</title>
<desc id="mc-single-desc">A single EKS cluster's Istio control plane manages three namespaces (prod, staging, dev), an approach sufficient for single-region, small-scale services that don't need multi-cluster.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- zone: single cluster -->
<rect x="80" y="140" width="520" height="260" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="92" y="144" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="162" y="153" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.10em">SINGLE EKS CLUSTER</text>

<!-- arrows: Istio -> each namespace, fanned on Istio's right edge -->
<path d="M 290,264 H 306 Q 314,264 314,256 V 212 Q 314,204 322,204 H 350"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<line x1="290" y1="284" x2="350" y2="284" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 290,304 H 306 Q 314,304 314,312 V 336 Q 314,344 322,344 H 350"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="302" y="266" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="320" y="275" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.02em">MANAGES</text>

<!-- Istio control plane (focal) -->
<rect x="140" y="252" width="150" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="215" y="280" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Istio control</text>
<text x="215" y="296" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">plane</text>

<!-- namespaces -->
<rect x="350" y="180" width="190" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="445" y="200" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">namespace: prod</text>
<text x="445" y="214" fill="#545B64" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">production traffic</text>

<rect x="350" y="260" width="190" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="445" y="280" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">namespace: staging</text>
<text x="445" y="294" fill="#545B64" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">pre-release checks</text>

<rect x="350" y="320" width="190" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="445" y="340" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">namespace: dev</text>
<text x="445" y="354" fill="#545B64" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">active development</text>

<!-- note (unconnected editorial aside) -->
<rect x="680" y="204" width="240" height="140" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="696" y="228" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-style="italic" font-weight="600">Multi-cluster not needed</text>
<text x="696" y="252" fill="#545B64" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-style="italic">Namespace separation is</text>
<text x="696" y="268" fill="#545B64" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-style="italic">sufficient here:</text>
<text x="696" y="290" fill="#545B64" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-style="italic">- NetworkPolicy for isolation</text>
<text x="696" y="306" fill="#545B64" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-style="italic">- Simple management</text>

<!-- legend -->
<line x1="30" y1="480" x2="930" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="30" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="130" y="488" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="150" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">CONTROL PLANE</text>
<line x1="330" y1="493" x2="354" y2="493" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
<text x="362" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">MANAGES (CONFIG PUSH)</text>
</svg>
