<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rollouts-seq-title rollouts-seq-desc">
    <title id="rollouts-seq-title">Canary promotion sequence</title>
    <desc id="rollouts-seq-desc">Sequence diagram showing a Rollout shifting traffic from an active v1 service to a preview v2 service, running pre- and post-promotion analysis, and switching production traffic to v2 after either automatic or manually approved promotion.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="64"  y1="128" x2="64"  y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="256" y1="128" x2="256" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="128" x2="480" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="700" y1="128" x2="700" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="900" y1="128" x2="900" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Actor boxes -->
    <rect x="16"  y="88" width="96"  height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="64"  y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">User</text>

    <rect x="196" y="88" width="120" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="256" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rollout</text>

    <rect x="416" y="88" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Active Svc</text>

    <rect x="636" y="88" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="700" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Preview Svc</text>

    <rect x="844" y="88" width="112" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="900" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Analysis</text>

    <!-- 1. User -> Rollout: Update image to v2 -->
    <line x1="64" y1="152" x2="256" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="92" y="140" width="136" height="12" rx="2" fill="#ffffff"/>
    <text x="160" y="150" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">UPDATE IMAGE v2</text>

    <!-- 2. Rollout -> Preview: Create v2 pods -->
    <line x1="256" y1="180" x2="700" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="428" y="168" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="478" y="178" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CREATE v2 PODS</text>

    <!-- 3. Rollout -> Preview: Route preview traffic -->
    <line x1="256" y1="208" x2="700" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="428" y="196" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="478" y="206" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ROUTE PREVIEW</text>

    <!-- 4. Rollout -> Analysis: pre-promotion analysis -->
    <line x1="256" y1="236" x2="900" y2="236" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="524" y="224" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="578" y="234" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PRE-PROMOTION</text>

    <!-- 5. Analysis --> Rollout: Analysis passed (dashed return) -->
    <line x1="900" y1="264" x2="256" y2="264" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="524" y="252" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="560" y="262" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PASSED</text>

    <!-- ALT fragment: promotion path (auto vs manual) -->
    <rect x="52" y="296" width="628" height="128" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <rect x="52" y="296" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="72" y="308" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
    <text x="100" y="308" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[auto-promotion enabled]</text>

    <!-- alt region 1: auto -->
    <line x1="256" y1="332" x2="480" y2="332" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="332" y="320" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="376" y="330" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SWITCH v2</text>

    <line x1="60" y1="356" x2="672" y2="356" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="64" y="372" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else: manual approval required]</text>

    <!-- alt region 2: manual -->
    <line x1="64" y1="392" x2="256" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="92" y="380" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="122" y="390" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PROMOTE</text>

    <line x1="256" y1="412" x2="480" y2="412" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="332" y="400" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="376" y="410" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SWITCH v2</text>

    <!-- 6. Rollout -> Analysis: post-promotion analysis -->
    <line x1="256" y1="452" x2="900" y2="452" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="524" y="440" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="580" y="450" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POST-PROMOTION</text>

    <!-- 7. Analysis --> Rollout: Analysis passed -->
    <line x1="900" y1="480" x2="256" y2="480" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="524" y="468" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="560" y="478" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PASSED</text>

    <!-- 8. Rollout self-message: scale down v1 -->
    <path d="M 256,508 H 320 Q 328,508 328,516 Q 328,524 320,524 H 256" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="332" y="510" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="392" y="520" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SCALE DOWN v1</text>

    <!-- Legend -->
    <line x1="24" y1="548" x2="936" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <line x1="140" y1="561" x2="172" y2="561" stroke="#545B64" stroke-width="1.2"/>
    <text x="180" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Call</text>
    <line x1="240" y1="561" x2="272" y2="561" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="280" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return</text>
    <line x1="360" y1="561" x2="392" y2="561" stroke="#EC7211" stroke-width="1.4"/>
    <text x="400" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Headline success</text>
  </svg>
