<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="collection-title collection-desc">
  <title id="collection-title">Kubernetes metrics collection architecture</title>
  <desc id="collection-desc">Diagram showing node-exporter, kube-state-metrics, cAdvisor, and application /metrics endpoints all scraped by Prometheus or vmagent, which writes into short-term Prometheus TSDB and, via remote_write, into long-term VictoriaMetrics storage; both feed Grafana for visualization, and Prometheus TSDB also feeds Alertmanager.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="40" y="80" width="200" height="428" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="85" y="84" width="110" height="12" rx="2" fill="#ffffff"/>
  <text x="140" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">METRIC SOURCES</text>

  <rect x="480" y="152" width="200" height="268" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="530" y="156" width="100" height="12" rx="2" fill="#ffffff"/>
  <text x="580" y="165" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">STORAGE LAYER</text>

  <rect x="720" y="156" width="200" height="276" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="760" y="160" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="820" y="169" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">QUERY / ALERTING</text>

  <!-- Arrows: 4 sources -> collector (fan on collector's left edge) -->
  <path d="M 216,140 H 220 Q 228,140 228,148 V 256 Q 228,264 236,264 H 288" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 216,248 H 232 Q 240,248 240,256 V 272 Q 240,280 248,280 H 288" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 216,356 H 244 Q 252,356 252,348 V 304 Q 252,296 260,296 H 288" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 216,464 H 256 Q 264,464 264,456 V 320 Q 264,312 272,312 H 288" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrows: collector -> storage -->
  <path d="M 432,280 H 460 Q 468,280 468,272 V 228 Q 468,220 476,220 H 504" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <path d="M 432,308 H 460 Q 468,308 468,316 V 360 Q 468,368 476,368 H 504" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="436" y="196" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="468" y="205" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">REMOTE_WRITE</text>

  <!-- Arrows: storage -> query -->
  <line x1="656" y1="220" x2="744" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 656,356 H 676 Q 684,356 684,348 V 244 Q 684,236 692,236 H 744" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="656" y1="380" x2="744" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Node: node-exporter -->
  <rect x="64" y="112" width="152" height="56" rx="6" fill="#ffffff"/>
  <rect x="64" y="112" width="152" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="140" y="136" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">node-exporter</text>
  <text x="140" y="150" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">node metrics</text>

  <!-- Node: kube-state-metrics -->
  <rect x="64" y="220" width="152" height="56" rx="6" fill="#ffffff"/>
  <rect x="64" y="220" width="152" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="140" y="244" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">kube-state-metrics</text>
  <text x="140" y="258" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">k8s object metrics</text>

  <!-- Node: cAdvisor -->
  <rect x="64" y="328" width="152" height="56" rx="6" fill="#ffffff"/>
  <rect x="64" y="328" width="152" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="140" y="352" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">cAdvisor</text>
  <text x="140" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">container metrics</text>

  <!-- Node: Applications -->
  <rect x="64" y="436" width="152" height="56" rx="6" fill="#ffffff"/>
  <rect x="64" y="436" width="152" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="140" y="460" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Applications</text>
  <text x="140" y="474" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">/metrics</text>

  <!-- Node: Prometheus / vmagent (focal collector) -->
  <rect x="288" y="256" width="144" height="72" rx="6" fill="#ffffff"/>
  <rect x="288" y="256" width="144" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <rect x="296" y="264" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
  <text x="310" y="273" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CLT</text>
  <text x="360" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
  <text x="360" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">or vmagent</text>

  <!-- Node: VictoriaMetrics -->
  <rect x="504" y="184" width="152" height="72" rx="6" fill="#ffffff"/>
  <rect x="504" y="184" width="152" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="580" y="216" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VictoriaMetrics</text>
  <text x="580" y="232" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">long-term</text>

  <!-- Node: Prometheus TSDB -->
  <rect x="504" y="332" width="152" height="72" rx="6" fill="#ffffff"/>
  <rect x="504" y="332" width="152" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="580" y="364" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus TSDB</text>
  <text x="580" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">short-term</text>

  <!-- Node: Grafana -->
  <rect x="744" y="188" width="152" height="64" rx="6" fill="#ffffff"/>
  <rect x="744" y="188" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="820" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana</text>

  <!-- Node: Alertmanager -->
  <rect x="744" y="344" width="152" height="72" rx="6" fill="#ffffff"/>
  <rect x="744" y="344" width="152" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="820" y="384" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alertmanager</text>

  <!-- Legend -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="40" y="548" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="60" y="557" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Collection agent (focal)</text>

  <rect x="240" y="548" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="260" y="557" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Component</text>

  <line x1="380" y1="553" x2="408" y2="553" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="416" y="557" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">remote_write</text>

  <line x1="536" y1="553" x2="564" y2="553" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="572" y="557" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">data flow</text>
</svg>