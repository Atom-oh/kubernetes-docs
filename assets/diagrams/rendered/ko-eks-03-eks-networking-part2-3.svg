<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">서비스 및 로드 밸런서 모범 사례</title>
  <desc id="d3-desc">서비스 및 로드 밸런서 선택의 핵심 원칙 하나에서 ClusterIP 사용, LoadBalancer/Ingress 사용, ALB 사용 조건, NLB 사용 조건, 내부 로드 밸런서 사용, 교차 영역 로드 밸런싱, 대상 유형 선택이라는 일곱 가지 실천 항목이 뻗어나가는 구조를 보여준다.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="d3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>
  <text x="40" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">TREE</text>
  <text x="40" y="60" fill="#232F3E" font-size="20" font-weight="700">서비스 · 로드 밸런서 모범 사례</text>

  <!-- Connectors: drawn before nodes -->
  <line x1="84" y1="216" x2="876" y2="216" stroke="#545B64" stroke-width="1"/>
  <line x1="480" y1="184" x2="480" y2="216" stroke="#545B64" stroke-width="1"/>
  <line x1="84" y1="216" x2="84" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#d3-arrow)"/>
  <line x1="216" y1="216" x2="216" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#d3-arrow)"/>
  <line x1="348" y1="216" x2="348" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#d3-arrow)"/>
  <line x1="480" y1="216" x2="480" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#d3-arrow)"/>
  <line x1="612" y1="216" x2="612" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#d3-arrow)"/>
  <line x1="744" y1="216" x2="744" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#d3-arrow)"/>
  <line x1="876" y1="216" x2="876" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#d3-arrow)"/>
  <circle cx="84" cy="216" r="3" fill="#232F3E"/>
  <circle cx="216" cy="216" r="3" fill="#232F3E"/>
  <circle cx="348" cy="216" r="3" fill="#232F3E"/>
  <circle cx="480" cy="216" r="3" fill="#232F3E"/>
  <circle cx="612" cy="216" r="3" fill="#232F3E"/>
  <circle cx="744" cy="216" r="3" fill="#232F3E"/>
  <circle cx="876" cy="216" r="3" fill="#232F3E"/>

  <!-- Root (focal) -->
  <rect x="340" y="104" width="280" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="480" y="140" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">서비스 및 로드 밸런서</text>
  <text x="480" y="156" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">모범 사례</text>
  <text x="480" y="172" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">7 practices</text>

  <!-- Leaves -->
  <rect x="28" y="280" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="84" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">ClusterIP</text>
  <text x="84" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">내부 전용 서비스</text>
  <text x="84" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">에 사용</text>

  <rect x="160" y="280" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="216" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">LB / Ingress</text>
  <text x="216" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">외부 노출 서비스</text>
  <text x="216" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">에 사용</text>

  <rect x="292" y="280" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="348" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">ALB</text>
  <text x="348" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">경로·SSL·인증</text>
  <text x="348" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">필요 시</text>

  <rect x="424" y="280" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">NLB</text>
  <text x="480" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">TCP/UDP·고성능</text>
  <text x="480" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">정적 IP 필요 시</text>

  <rect x="556" y="280" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="612" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">내부 LB</text>
  <text x="612" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">클러스터 내부 전용</text>
  <text x="612" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">접근에 사용</text>

  <rect x="688" y="280" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="744" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">교차 영역</text>
  <text x="744" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">로드 밸런싱</text>
  <text x="744" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">고가용성 확보</text>

  <rect x="820" y="280" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="876" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">대상 유형</text>
  <text x="876" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">ip / instance</text>
  <text x="876" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">적절히 선택</text>
</svg>