<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cwvsoss-title cwvsoss-desc">
    <title id="cwvsoss-title">CloudWatch vs. open-source monitoring</title>
    <desc id="cwvsoss-desc">Comparison of Amazon CloudWatch against a self-managed Prometheus/VictoriaMetrics stack across four properties: management model, cloud integration, cost model, and metric retention.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone A: CloudWatch (focal) -->
    <rect x="40" y="96" width="400" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="#EC7211" stroke-width="1"/>
    <rect x="180" y="100" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="109" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AWS CLOUDWATCH</text>

    <!-- Zone B: Open Source -->
    <rect x="520" y="96" width="400" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="660" y="100" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROMETHEUS / VM</text>

    <!-- Zone A chips -->
    <g>
      <rect x="64" y="140" width="352" height="80" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.15)" stroke-width="1"/>
      <circle cx="88" cy="180" r="4" fill="#545B64"/>
      <text x="108" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Fully managed</text>
      <text x="108" y="192" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">no infra to run</text>
    </g>
    <g>
      <rect x="64" y="240" width="352" height="80" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.15)" stroke-width="1"/>
      <circle cx="88" cy="280" r="4" fill="#545B64"/>
      <text x="108" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">AWS-native integration</text>
      <text x="108" y="292" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">EC2 / EKS / RDS out of the box</text>
    </g>
    <g>
      <rect x="64" y="340" width="352" height="80" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.15)" stroke-width="1"/>
      <circle cx="88" cy="380" r="4" fill="#545B64"/>
      <text x="108" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Usage-based cost</text>
      <text x="108" y="392" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">pay per metric / query</text>
    </g>
    <g>
      <rect x="64" y="440" width="352" height="64" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.15)" stroke-width="1"/>
      <circle cx="88" cy="472" r="4" fill="#545B64"/>
      <text x="108" y="468" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">15-month retention</text>
      <text x="108" y="484" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">fixed ceiling</text>
    </g>

    <!-- Zone B chips -->
    <g>
      <rect x="544" y="140" width="352" height="80" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.15)" stroke-width="1"/>
      <circle cx="568" cy="180" r="4" fill="#7D8998"/>
      <text x="588" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Self-managed</text>
      <text x="588" y="192" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">you run the servers</text>
    </g>
    <g>
      <rect x="544" y="240" width="352" height="80" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.15)" stroke-width="1"/>
      <circle cx="568" cy="280" r="4" fill="#7D8998"/>
      <text x="588" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Cloud-neutral</text>
      <text x="588" y="292" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">portable across clouds</text>
    </g>
    <g>
      <rect x="544" y="340" width="352" height="80" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.15)" stroke-width="1"/>
      <circle cx="568" cy="380" r="4" fill="#7D8998"/>
      <text x="588" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Infrastructure cost only</text>
      <text x="588" y="392" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">no per-metric billing</text>
    </g>
    <g>
      <rect x="544" y="440" width="352" height="64" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.15)" stroke-width="1"/>
      <circle cx="568" cy="472" r="4" fill="#7D8998"/>
      <text x="588" y="468" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Unlimited retention</text>
      <text x="588" y="484" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">as long as storage allows</text>
    </g>

    <!-- Legend -->
    <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="580" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="588" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Managed EKS-native path</text>

    <rect x="300" y="580" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="320" y="588" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Self-hosted alternative</text>
  </svg>