    <title id="ko-service-mesh-istio-advanced-02-multi-cluster-6-title">Hybrid: 클러스터 내부 Istio + 클러스터 간 VPC Lattice</title>
    <desc id="ko-service-mesh-istio-advanced-02-multi-cluster-6-desc">두 클러스터 내부에서는 Istio Mesh가 Service A와 Service B 사이의 mTLS/Retry를 담당하고, 클러스터 간 통신은 AWS VPC Lattice Service Network가 담당하는 하이브리드 아키텍처.</desc>
