<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ebpf1-title ebpf1-desc">
    <title id="ebpf1-title">iptables dataplane chain compared with the eBPF dataplane path</title>
    <desc id="ebpf1-desc">Diagram contrasting a packet traversing seven sequential iptables chains with the same packet traversing a single eBPF program that consults BPF maps between TC ingress and egress hooks.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="56" width="880" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="424" y="60" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">IPTABLES DATAPLANE</text>

    <rect x="40" y="236" width="880" height="170" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="440" y="240" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="249" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EBPF DATAPLANE</text>

    <!-- Arrows: iptables chain (y=128) -->
    <line x1="224" y1="128" x2="244" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="388" y1="128" x2="408" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="552" y1="128" x2="572" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="716" y1="128" x2="736" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: eBPF chain (y=312) -->
    <line x1="200" y1="312" x2="216" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="336" y1="312" x2="352" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="472" y1="312" x2="488" y2="312" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="608" y1="312" x2="624" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="744" y1="312" x2="760" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- iptables nodes -->
    <rect x="80" y="96" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="152" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Packet In</text>

    <rect x="244" y="96" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="316" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PREROUTING</text>

    <rect x="408" y="96" width="144" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Conntrack +</text>
    <text x="480" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Filter Chains</text>
    <text x="480" y="154" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 sequential chains</text>

    <rect x="572" y="96" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="644" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">POSTROUTING</text>

    <rect x="736" y="96" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="808" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Packet Out</text>

    <!-- eBPF nodes -->
    <rect x="80" y="280" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Packet In</text>

    <rect x="216" y="280" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="276" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">TC Ingress</text>

    <rect x="352" y="280" width="120" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="412" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF</text>
    <text x="412" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Program</text>

    <rect x="488" y="280" width="120" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="548" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">BPF Maps</text>
    <text x="548" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routes, policies</text>

    <rect x="624" y="280" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="684" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">TC Egress</text>

    <rect x="760" y="280" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="820" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Packet Out</text>

    <!-- Legend -->
    <line x1="40" y1="460" x2="920" y2="460" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="492" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="60" y="500" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Processing stage</text>
    <rect x="230" y="492" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="250" y="500" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">State / lookup</text>
    <rect x="420" y="492" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="440" y="500" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Single eBPF program (focal)</text>
  </svg>