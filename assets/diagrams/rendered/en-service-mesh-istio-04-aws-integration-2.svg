<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="istio-lattice-title istio-lattice-desc">
<title id="istio-lattice-title">Istio vs VPC Lattice</title>
<desc id="istio-lattice-desc">Side-by-side comparison showing Istio's control plane pushing config to Envoy sidecars that mesh directly over mTLS, versus AWS VPC Lattice's managed service network routing plain HTTP between sidecar-free application pods.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<text x="32" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ARCHITECTURE COMPARISON</text>
<text x="32" y="60" fill="#232F3E" font-size="20" font-weight="700">Istio vs VPC Lattice</text>

<!-- Zones -->
<rect x="40" y="100" width="400" height="460" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="48" y="104" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="123" y="113" fill="rgba(35,47,62,0.42)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ISTIO ARCHITECTURE</text>

<rect x="520" y="100" width="400" height="460" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="528" y="104" width="176" height="12" rx="2" fill="#ffffff"/>
<text x="616" y="113" fill="rgba(35,47,62,0.42)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">VPC LATTICE ARCHITECTURE</text>

<text x="240" y="304" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PODS</text>
<text x="720" y="304" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PODS</text>

<!-- ============ ARROWS ============ -->

<!-- ICP -> IA1 dashed Config -->
<path d="M 210,196 V 250 Q 210,258 202,258 H 158 Q 150,258 150,266 V 320"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="150" y="238" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="180" y="247" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG</text>

<!-- ICP -> IA2 dashed Config -->
<path d="M 270,196 V 250 Q 270,258 278,258 H 322 Q 330,258 330,266 V 320"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="270" y="238" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="300" y="247" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG</text>

<!-- IA1 <-> IA2 bidirectional mTLS -->
<path d="M 220,352 H 260" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-start)"/>
<rect x="220" y="332" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="240" y="341" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">mTLS</text>

<!-- LA1 -> LSN (HTTP, up) -->
<path d="M 607,320 V 258 Q 607,250 615,250 H 658 Q 666,250 666,242 V 196"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="616" y="230" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="636" y="239" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

<!-- LSN -> LA1 (Routing, down) -->
<path d="M 702,196 V 258 Q 702,266 694,266 H 661 Q 653,266 653,274 V 320"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="648" y="246" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="678" y="255" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ROUTING</text>

<!-- LA2 -> LSN (HTTP, up) -->
<path d="M 787,320 V 258 Q 787,250 779,250 H 746 Q 738,250 738,242 V 196"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="743" y="230" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="763" y="239" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

<!-- LSN -> LA2 (Routing, down) -->
<path d="M 774,196 V 258 Q 774,266 782,266 H 825 Q 833,266 833,274 V 320"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="774" y="246" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="804" y="255" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ROUTING</text>

<!-- ============ NODES ============ -->

<!-- ICP (focal) -->
<rect x="150" y="140" width="180" height="56" rx="6" fill="#ffffff"/>
<rect x="150" y="140" width="180" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="240" y="164" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">istiod</text>
<text x="240" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">control-plane</text>

<!-- IA1 -->
<rect x="80" y="320" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="150" y="350" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">App</text>
<text x="150" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ envoy sidecar</text>

<!-- IA2 -->
<rect x="260" y="320" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="330" y="350" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">App</text>
<text x="330" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ envoy sidecar</text>

<!-- LSN (focal) -->
<rect x="630" y="140" width="180" height="56" rx="6" fill="#ffffff"/>
<rect x="630" y="140" width="180" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="720" y="164" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service Network</text>
<text x="720" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aws-managed</text>

<!-- LA1 -->
<rect x="560" y="320" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="630" y="350" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">App</text>
<text x="630" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no sidecar</text>

<!-- LA2 -->
<rect x="740" y="320" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="810" y="350" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">App</text>
<text x="810" y="366" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no sidecar</text>

</svg>