<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Pod and Container Security Context</title>
<desc id="d">A Pod carries a pod-level security context and a container with its own container-level security context; the Pod as a whole must comply with one of three Pod Security Standards levels.</desc>
<rect width="960" height="600" fill="#ffffff"/>

<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<text x="40" y="34" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CORE · SECURITY</text>
<text x="40" y="58" fill="#232F3E" font-size="20" font-weight="700">Pod and Container Security Context</text>

<!-- ===== Arrows ===== -->
<!-- Pod -> PSC (left branch) -->
<path d="M 400,168 H 330 Q 322,168 322,176 V 200" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- Pod -> Container (right branch) -->
<path d="M 560,168 H 630 Q 638,168 638,176 V 200" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Container -> CSC -->
<line x1="638" y1="256" x2="638" y2="292" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Pod -> PSS -->
<line x1="480" y1="188" x2="480" y2="424" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Arrow labels -->
<rect x="298" y="178" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="322" y="187" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CONTAINS</text>

<rect x="614" y="178" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="638" y="187" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CONTAINS</text>

<rect x="614" y="270" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="638" y="279" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CONTAINS</text>

<rect x="452" y="392" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="401" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">COMPLIES</text>

<!-- ===== Nodes ===== -->
<g>
<!-- Pod (focal) -->
<rect x="400" y="120" width="160" height="48" rx="6" fill="#ffffff"/>
<rect x="400" y="120" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="480" y="140" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod</text>
<text x="480" y="156" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">security-context-pod</text>

<!-- Pod Security Context -->
<rect x="222" y="200" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="222" y="200" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="322" y="220" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod Security Context</text>
<text x="322" y="236" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">runAsUser · runAsGroup</text>
<text x="322" y="248" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">fsGroup · supplementalGroups</text>

<!-- Container -->
<rect x="558" y="200" width="160" height="56" rx="6" fill="#ffffff"/>
<rect x="558" y="200" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="638" y="224" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Container</text>
<text x="638" y="240" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">sec-ctx-demo</text>

<!-- Container Security Context -->
<rect x="538" y="292" width="200" height="72" rx="6" fill="#ffffff"/>
<rect x="538" y="292" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="638" y="312" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Container Security Context</text>
<text x="638" y="328" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">privileged · allowPrivilegeEscalation</text>
<text x="638" y="340" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">readOnlyRootFilesystem</text>
<text x="638" y="352" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">capabilities · seLinuxOptions</text>

<!-- Pod Security Standards -->
<rect x="360" y="424" width="240" height="88" rx="6" fill="rgba(35,47,62,0.05)"/>
<rect x="360" y="424" width="240" height="88" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="480" y="444" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod Security Standards</text>
<rect x="384" y="456" width="80" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
<text x="424" y="467" fill="#232F3E" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">PRIVILEGED</text>
<rect x="440" y="480" width="80" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
<text x="480" y="491" fill="#232F3E" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">BASELINE</text>
<rect x="496" y="456" width="80" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
<text x="536" y="467" fill="#232F3E" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">RESTRICTED</text>
</g>
</svg>