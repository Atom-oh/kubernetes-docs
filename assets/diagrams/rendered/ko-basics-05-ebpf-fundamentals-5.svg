    <title id="ko-basics-05-ebpf-fundamentals-5-title">Cilium eBPF 데이터플레인 아키텍처</title>
    <desc id="ko-basics-05-ebpf-fundamentals-5-desc">Cilium Agent가 Kubernetes API로부터 받은 설정을 eBPF 데이터플레인으로 내려보내고, XDP·TC·소켓 프로그램이 각각 DDoS 방어, 네트워크 정책, 로드 밸런싱, 소켓 레벨 라우팅 기능을 구현하는 과정을 보여주는 아키텍처 다이어그램.</desc>
