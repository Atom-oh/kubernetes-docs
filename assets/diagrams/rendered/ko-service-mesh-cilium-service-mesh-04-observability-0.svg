<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Hubble 아키텍처</title>
<desc id="d">각 노드의 eBPF 프로그램과 Cilium Agent가 수집한 흐름 데이터를 Hubble Observer가 모아 Hubble Relay로 전달하고, Relay는 Hubble UI·CLI로 시각화를 제공하며 Observer의 메트릭은 Prometheus를 거쳐 Grafana 대시보드로 흐른다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="960" height="600" fill="#FFFFFF"/>

<!-- Zone: Kubernetes Cluster -->
<rect x="24" y="40" width="712" height="500" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="380" y="44" width="128" height="12" rx="2" fill="#FFFFFF"/>
<text x="444" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">KUBERNETES CLUSTER</text>

<!-- Zone: Node 1 -->
<rect x="48" y="80" width="300" height="176" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="164" y="84" width="68" height="12" rx="2" fill="#FFFFFF"/>
<text x="198" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">NODE 1</text>

<!-- Zone: Node 2 -->
<rect x="48" y="288" width="300" height="176" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="164" y="292" width="68" height="12" rx="2" fill="#FFFFFF"/>
<text x="198" y="301" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">NODE 2</text>

<!-- Zone: External -->
<rect x="768" y="40" width="168" height="500" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="806" y="44" width="92" height="12" rx="2" fill="#FFFFFF"/>
<text x="852" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL</text>

<!-- ===== Arrows (drawn before nodes) ===== -->
<!-- Node1: eBPF -> Agent -> Hubble Observer (vertical stack) -->
<line x1="198" y1="140" x2="198" y2="164" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="198" y1="200" x2="198" y2="224" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Node2 -->
<line x1="198" y1="348" x2="198" y2="372" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="198" y1="408" x2="198" y2="432" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Observer1 -> Relay (exit right edge upper fan point, enter Relay left edge upper port) -->
<path d="M 262,234 H 372 Q 380,234 380,226 V 128 Q 380,120 388,120 H 424"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Observer2 -> Relay (exit right edge upper fan point, enter Relay left edge lower port; turn x offset from the path above) -->
<path d="M 262,438 H 396 Q 404,438 404,430 V 144 Q 404,136 412,136 H 424"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Observer1 -> Prometheus (exit right edge lower fan point, enter Prometheus left edge upper port) -->
<path d="M 262,246 H 760 Q 768,246 768,254 V 348 Q 768,356 776,356 H 780"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Observer2 -> Prometheus (exit right edge lower fan point, enter Prometheus left edge lower port) -->
<path d="M 262,450 H 760 Q 768,450 768,442 V 400 Q 768,392 776,392 H 780"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Relay -> UI (accent, focal) -->
<path d="M 512,116 H 588 Q 596,116 596,124 V 148 Q 596,156 604,156 H 616"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- Relay -> CLI (drops below UI box's bottom edge before crossing right, avoiding the UI box) -->
<path d="M 470,152 V 182 Q 470,190 478,190 H 780"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Prometheus -> Grafana -->
<line x1="852" y1="404" x2="852" y2="452" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ===== Nodes ===== -->
<!-- eBPF1 -->
<rect x="134" y="104" width="128" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="198" y="126" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">eBPF Programs</text>
<!-- Agent1 -->
<rect x="134" y="164" width="128" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="198" y="186" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Cilium Agent</text>
<!-- Hubble1 -->
<rect x="134" y="224" width="128" height="32" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="198" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Hubble Observer</text>

<!-- eBPF2 -->
<rect x="134" y="312" width="128" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="198" y="334" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">eBPF Programs</text>
<!-- Agent2 -->
<rect x="134" y="372" width="128" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="198" y="394" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Cilium Agent</text>
<!-- Hubble2 -->
<rect x="134" y="432" width="128" height="32" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="198" y="452" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Hubble Observer</text>

<!-- Relay (focal) -->
<rect x="424" y="96" width="88" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="468" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Hubble</text>
<text x="468" y="134" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Relay</text>

<!-- UI -->
<rect x="616" y="132" width="96" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="664" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Hubble UI</text>

<!-- CLI -->
<rect x="780" y="152" width="140" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="850" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Hubble CLI</text>

<!-- Prometheus -->
<rect x="780" y="344" width="140" height="60" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="850" y="378" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Prometheus</text>

<!-- Grafana -->
<rect x="780" y="452" width="140" height="60" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="850" y="486" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Grafana</text>

</svg>