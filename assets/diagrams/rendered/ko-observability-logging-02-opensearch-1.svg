<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" role="img" aria-labelledby="os-seq-title os-seq-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="os-seq-title">OpenSearch 로그 데이터 흐름 시퀀스</title>
    <desc id="os-seq-desc">애플리케이션의 로그가 FluentBit의 Bulk API 호출로 OpenSearch에 색인되고, 7일 후 ISM 정책에 따라 UltraWarm으로, 30일 후 다시 S3 Cold Storage로 자동 이동하는 라이프사이클을 보여준다.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ============ LIFELINES (drawn first, under actors/messages) ============ -->
    <line x1="100" y1="88" x2="100" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="290" y1="88" x2="290" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="88" x2="480" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="670" y1="88" x2="670" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="860" y1="88" x2="860" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ============ MESSAGES ============ -->
    <!-- 1. App -> FluentBit -->
    <path d="M 100,140 H 290" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="164" y="122" width="62" height="12" rx="2" fill="#ffffff"/>
    <text x="195" y="131" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">로그 전송</text>

    <!-- 2. FluentBit -> OpenSearch -->
    <path d="M 290,200 H 480" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="335" y="182" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="385" y="191" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">BULK API 호출</text>

    <!-- 3. OpenSearch self-message: indexing to hot/EBS -->
    <path d="M 480,254 H 540 V 274 H 480" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="548" y="256" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="604" y="265" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">인덱싱 (HOT/EBS)</text>

    <!-- Note: 7 days later, spans OpenSearch..UltraWarm -->
    <rect x="500" y="316" width="150" height="24" rx="3" fill="rgba(35,47,62,0.04)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
    <text x="575" y="332" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" font-style="italic">7일 후</text>

    <!-- 4. OpenSearch -> UltraWarm (headline: ISM lifecycle transition) -->
    <path d="M 480,380 H 670" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="500" y="350" width="150" height="24" rx="2" fill="#ffffff"/>
    <text x="575" y="360" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ISM 정책 →</text>
    <text x="575" y="372" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ULTRAWARM 이동</text>

    <!-- Note: 30 days later, spans UltraWarm..S3 -->
    <rect x="690" y="410" width="150" height="24" rx="3" fill="rgba(35,47,62,0.04)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
    <text x="765" y="426" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" font-style="italic">30일 후</text>

    <!-- 5. UltraWarm -> S3 Cold Storage -->
    <path d="M 670,470 H 860" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="700" y="440" width="130" height="24" rx="2" fill="#ffffff"/>
    <text x="765" y="450" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">COLD 스토리지로</text>
    <text x="765" y="462" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">이동</text>

    <!-- ============ ACTORS (top boxes, painted after lifelines/messages so labels stay crisp) ============ -->
    <!-- App -->
    <rect x="40" y="40" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="100" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">애플리케이션</text>

    <!-- FluentBit -->
    <rect x="230" y="40" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="290" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">FluentBit</text>

    <!-- OpenSearch (focal) -->
    <rect x="420" y="40" width="120" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OpenSearch</text>

    <!-- UltraWarm -->
    <rect x="610" y="40" width="120" height="48" rx="6" fill="rgba(35,47,62,0.02)" stroke="#545B64" stroke-width="1"/>
    <text x="670" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">UltraWarm</text>

    <!-- Cold Storage / S3 -->
    <rect x="800" y="40" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="860" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cold Storage</text>

    <!-- ============ ACTIVATION BARS ============ -->
    <rect x="286" y="140" width="8" height="60" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="476" y="200" width="8" height="280" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="0.8"/>
    <rect x="666" y="380" width="8" height="90" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- ============ LEGEND ============ -->
    <line x1="24" y1="548" x2="920" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

    <circle cx="180" cy="564" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="192" y="568" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">FOCAL ACTOR</text>

    <line x1="340" y1="564" x2="364" y2="564" stroke="#EC7211" stroke-width="1.2"/>
    <text x="372" y="568" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">LIFECYCLE TRANSITION</text>

    <line x1="580" y1="564" x2="604" y2="564" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="612" y="568" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">LIFELINE</text>
  </svg>