<title id="ko-service-mesh-linkerd-02-architecture-6-title">인증서 계층 구조</title>
<desc id="ko-service-mesh-linkerd-02-architecture-6-desc">Trust Anchor(루트 CA)가 Identity Issuer(중간 CA)에게 서명 권한을 위임하고, Identity Issuer가 24시간짜리 워크로드 인증서 여러 개를 발급하는 계층적 PKI 구조를 보여준다.</desc>
