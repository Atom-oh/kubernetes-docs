<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ctr-log-title ctr-log-desc">
      <title id="ctr-log-title">Container logging architecture on an EKS worker node</title>
      <desc id="ctr-log-desc">Container stdout/stderr is picked up by kubelet, read from disk by a log agent, and fanned out to CloudWatch Logs, Amazon OpenSearch, and Amazon S3.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- ================= ZONE ================= -->
      <rect x="56" y="96" width="288" height="304" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="60" y="100" width="120" height="12" rx="2" fill="#ffffff"/>
      <text x="120" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">WORKER NODE</text>

      <!-- ================= ARROWS ================= -->
      <!-- Containers -> kubelet -->
      <path d="M200,184 V216" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- kubelet -> Log Agent (FOCAL) -->
      <path d="M200,272 V328" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- Log Agent -> CloudWatch Logs -->
      <path d="M288,342 H460 Q468,342 468,334 V148 Q468,140 476,140 H648" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- Log Agent -> OpenSearch -->
      <path d="M288,356 H492 Q500,356 500,364 V376 Q500,384 508,384 H648" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- Arrow labels -->
      <rect x="168" y="192" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="200" y="201" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STDOUT/ERR</text>

      <rect x="150" y="280" width="100" height="12" rx="2" fill="#ffffff"/>
      <text x="200" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/VAR/LOG/CONTAINERS</text>

      <!-- ================= NODES ================= -->
      <!-- Containers -->
      <rect x="112" y="128" width="176" height="56" rx="6" fill="#ffffff"/>
      <rect x="112" y="128" width="176" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <rect x="120" y="134" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="135" y="143" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POD</text>
      <text x="200" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Containers</text>
      <text x="200" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">application output</text>

      <!-- kubelet -->
      <rect x="112" y="216" width="176" height="56" rx="6" fill="#ffffff"/>
      <rect x="112" y="216" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="120" y="222" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="135" y="231" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">K8S</text>
      <text x="200" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">kubelet</text>
      <text x="200" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">writes log files to disk</text>

      <!-- Log Agent (FOCAL) -->
      <rect x="112" y="328" width="176" height="56" rx="6" fill="#ffffff"/>
      <rect x="112" y="328" width="176" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <rect x="120" y="334" width="30" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
      <text x="135" y="343" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OSS</text>
      <text x="200" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Log Agent</text>
      <text x="200" y="376" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Fluent Bit / Fluentd</text>

      <!-- CloudWatch Logs -->
      <rect x="648" y="112" width="184" height="56" rx="6" fill="#ffffff"/>
      <rect x="648" y="112" width="184" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <rect x="656" y="118" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="671" y="127" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AWS</text>
      <text x="740" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch Logs</text>
      <text x="740" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">log groups</text>

      <!-- OpenSearch -->
      <rect x="648" y="356" width="184" height="56" rx="6" fill="#ffffff"/>
      <rect x="648" y="356" width="184" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <rect x="656" y="362" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="671" y="371" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AWS</text>
      <text x="740" y="388" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Amazon OpenSearch</text>
      <text x="740" y="404" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">search &amp; dashboards</text>

      <!-- S3 -->
      <rect x="648" y="452" width="184" height="56" rx="6" fill="#ffffff"/>
      <rect x="648" y="452" width="184" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <rect x="656" y="458" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="671" y="467" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AWS</text>
      <text x="740" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Amazon S3</text>
      <text x="740" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">long-term archive</text>

      <!-- Log Agent -> S3 (final segment, drawn after node so it terminates correctly; hops over the OpenSearch connector at x=500) -->
      <path d="M288,370 H492 A8,8 0 0,1 508,370 H524 Q532,370 532,378 V472 Q532,480 540,480 H648" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- ================= LEGEND ================= -->
      <line x1="30" y1="536" x2="930" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="30" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="200" cy="548" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="212" y="552" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Focal log agent / fan-out path</text>
      <circle cx="480" cy="548" r="5" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="492" y="552" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Managed AWS destination</text>
    </svg>