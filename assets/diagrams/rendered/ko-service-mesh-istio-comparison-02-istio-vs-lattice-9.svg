<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ko-service-mesh-istio-comparison-02-istio-vs-lattice-9-title ko-service-mesh-istio-comparison-02-istio-vs-lattice-9-desc">
<title id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-9-title">Ambient Mode 트래픽 흐름: eBPF 리다이렉트와 선택적 L7 처리</title>
<desc id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-9-desc">애플리케이션 파드가 보낸 패킷은 eBPF가 투명하게 ztunnel로 리다이렉트하며, mTLS와 메트릭만 필요하면 ztunnel이 곧바로 대상 서비스로 전송하지만 VirtualService 라우팅이나 AuthorizationPolicy 같은 L7 처리가 필요하면 ztunnel이 Waypoint Proxy를 거쳤다가 다시 대상 서비스로 mTLS 트래픽을 보낸다는 것을 보여준다.</desc>
