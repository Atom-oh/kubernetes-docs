<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="amb-title amb-desc">
    <title id="amb-title">Ambient Mode 아키텍처</title>
    <desc id="amb-desc">사이드카가 없는 애플리케이션 파드가 노드 레벨의 ztunnel을 통해 투명하게 mTLS 통신을 처리하고, L7 라우팅이 필요할 때만 선택적으로 waypoint 프록시를 거쳐 서비스에 도달하는 구조를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="72" width="180" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="68" y="76" width="124" height="12" rx="2" fill="#ffffff"/>
    <text x="130" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">POD (APP ONLY)</text>

    <rect x="280" y="72" width="200" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="316" y="76" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="380" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">KUBERNETES NODE</text>

    <rect x="600" y="228" width="220" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="628" y="232" width="164" height="12" rx="2" fill="#ffffff"/>
    <text x="710" y="241" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">WAYPOINT PROXY (OPTIONAL)</text>

    <!-- Arrows -->
    <line x1="220" y1="124" x2="296" y2="124" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M480,124 H650 Q658,124 658,132 V190 Q658,198 666,198 H836"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M388,152 V200 Q388,208 396,208 H700 Q708,208 708,216 V256"
          fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <path d="M800,284 H860 Q868,284 868,276 V226"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="220" y="112" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="252" y="121" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">TRANSPARENT</text>

    <rect x="666" y="150" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="692" y="159" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">L4 ONLY</text>

    <rect x="470" y="190" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="502" y="199" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">L7 NEEDED</text>

    <!-- Node: App1 -->
    <rect x="56" y="96" width="148" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="96" width="148" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="130" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    <text x="130" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">no sidecar</text>

    <!-- Node: Ztunnel (focal) -->
    <rect x="296" y="96" width="184" height="56" rx="6" fill="#ffffff"/>
    <rect x="296" y="96" width="184" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="388" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ztunnel</text>
    <text x="388" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">L4 · mTLS · telemetry</text>

    <!-- Node: Waypoint -->
    <rect x="616" y="256" width="184" height="56" rx="6" fill="#ffffff"/>
    <rect x="616" y="256" width="184" height="56" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="708" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Waypoint</text>
    <text x="708" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">L7 · advanced routing</text>

    <!-- Node: Service -->
    <rect x="836" y="170" width="88" height="56" rx="6" fill="#ffffff"/>
    <rect x="836" y="170" width="88" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="880" y="198" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service</text>

    <!-- Legend -->
    <line x1="40" y1="400" x2="920" y2="400" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="416" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="432" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="440" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">노드 레벨 데이터 플레인</text>

    <rect x="300" y="432" width="14" height="10" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="320" y="440" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">선택적 구성 요소</text>

    <line x1="520" y1="437" x2="548" y2="437" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="556" y="440" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">필요 시에만 경로</text>
  </svg>