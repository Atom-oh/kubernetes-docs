<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="certhier-title certhier-desc">
    <title id="certhier-title">Certificate hierarchy</title>
    <desc id="certhier-desc">Architecture diagram showing a long-lived Trust Anchor root CA signing a one-year Identity Issuer intermediate CA, which in turn signs each proxy's short-lived 24-hour workload certificate.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone -->
    <rect x="120" y="60" width="720" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="416" y="64" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CERTIFICATE HIERARCHY</text>

    <!-- Arrows -->
    <line x1="480" y1="164" x2="480" y2="228" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M 480,284 V 320 Q 480,328 472,328 H 348 Q 340,328 340,336 V 356"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 528,284 V 308 Q 528,316 536,316 H 604 Q 612,316 612,324 V 356"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="488" y="188" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="504" y="198" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNS</text>
    <rect x="296" y="338" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="313" y="348" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ISSUES</text>
    <rect x="618" y="326" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="635" y="336" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ISSUES</text>

    <!-- Nodes -->
    <rect x="360" y="92" width="240" height="72" rx="6" fill="#ffffff"/>
    <rect x="360" y="92" width="240" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1.2"/>
    <text x="480" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Trust Anchor</text>
    <text x="480" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">root ca</text>
    <text x="480" y="150" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">valid 1-10y</text>

    <rect x="360" y="228" width="240" height="72" rx="6" fill="#ffffff"/>
    <rect x="360" y="228" width="240" height="72" rx="6" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Identity Issuer</text>
    <text x="480" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">intermediate ca</text>
    <text x="480" y="286" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">valid 1y</text>

    <rect x="200" y="356" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="200" y="356" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="300" y="382" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Workload Cert 1</text>
    <text x="300" y="398" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">valid 24h</text>

    <rect x="480" y="356" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="480" y="356" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="580" y="382" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Workload Cert 2</text>
    <text x="580" y="398" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">valid 24h</text>

    <!-- Legend -->
    <line x1="40" y1="480" x2="920" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="510" width="14" height="10" rx="2" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="518" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Identity Issuer (focal — issues short-lived certs)</text>
    <rect x="420" y="512" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="440" y="518" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Per-workload certificate</text>
  </svg>