<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cwl-pipeline-title cwl-pipeline-desc">
  <title id="cwl-pipeline-title">CloudWatch Logs pipeline: sources to log group to features to destinations</title>
  <desc id="cwl-pipeline-desc">Log sources from EKS, applications, and Lambda write into a central CloudWatch Log Group, which organizes log streams and feeds three features — Logs Insights, Metric Filters, and Subscription Filters — with metric filters triggering alarms and subscription filters fanning out to S3, Kinesis Data Firehose, and Lambda, where Firehose loads into OpenSearch.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .node-name{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:600; font-size:12px; fill:#232F3E; }
      .node-sub{ font-family:'Geist Mono',ui-monospace,monospace; font-size:9px; fill:#545B64; }
      .zone-label{ font-family:'Geist Mono',ui-monospace,monospace; font-size:7px; letter-spacing:0.14em; fill:rgba(35,47,62,0.40); }
      .arrow-label{ font-family:'Geist Mono',ui-monospace,monospace; font-size:8px; letter-spacing:0.06em; fill:#7D8998; }
      .legend-text{ font-family:'Geist Mono',ui-monospace,monospace; font-size:8px; letter-spacing:0.06em; fill:#545B64; }
      .legend-eyebrow{ font-family:'Geist Mono',ui-monospace,monospace; font-size:7px; letter-spacing:0.14em; fill:#7D8998; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== ZONES (bg -> zones -> arrows -> nodes) ===== -->
  <!-- CloudWatch Logs zone -->
  <rect x="256" y="80" width="448" height="88" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="264" y="84" width="128" height="12" rx="2" fill="#ffffff"/>
  <text x="328" y="93" class="zone-label" text-anchor="middle">CLOUDWATCH LOGS</text>

  <!-- Features zone -->
  <rect x="208" y="184" width="512" height="168" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="216" y="188" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="248" y="197" class="zone-label" text-anchor="middle">FEATURES</text>

  <!-- Destinations zone -->
  <rect x="276" y="368" width="648" height="110" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="284" y="372" width="104" height="12" rx="2" fill="#ffffff"/>
  <text x="336" y="381" class="zone-label" text-anchor="middle">DESTINATIONS</text>

  <!-- ===== ARROWS (drawn before nodes) ===== -->

  <!-- Sources -> Log Group (straight vertical, shared x) -->
  <path d="M380,64 V112" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Log Group -> Log Streams (straight horizontal, shared y) -->
  <path d="M480,132 H520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Log Group bottom edge fan: attach x=330 -> Insights, x=380 -> Metric, x=430 -> Sub -->
  <path d="M330,152 V176 Q330,184 322,184 H312 Q304,184 304,192 V216"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M380,152 V168 Q380,176 388,176 H456 Q464,176 464,184 V216"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M430,152 V188 Q430,196 438,196 H616 Q624,196 624,204 V216"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Metric Filters -> CloudWatch Alarms (straight vertical, shared x) -->
  <path d="M464,256 V296" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="472" y="266" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="502" y="275" class="arrow-label" text-anchor="middle">TRIGGERS</text>

  <!-- Subscription Filters bottom edge fan: attach x=588 -> S3, x=624 -> Kinesis, x=660 -> Lambda -->
  <path d="M588,256 V336 Q588,344 580,344 H364 Q356,344 356,352 V400"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M624,256 V348 Q624,356 616,356 H528 Q520,356 520,364 V400"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M660,256 V360 Q660,368 668,368 H680 Q688,368 688,376 V400"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Kinesis Data Firehose -> OpenSearch (dip below Lambda box to avoid passing behind it) -->
  <path d="M520,440 V462 Q520,470 528,470 H828 Q836,470 836,462 V440"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="654" y="450" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="678" y="459" class="arrow-label" text-anchor="middle">LOADS</text>

  <!-- ===== NODES ===== -->

  <!-- Log Sources -->
  <rect x="280" y="24" width="200" height="40" rx="6" fill="#ffffff"/>
  <rect x="280" y="24" width="200" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="380" y="42" class="node-name" text-anchor="middle">Log Sources</text>
  <text x="380" y="56" class="node-sub" text-anchor="middle">EKS &#183; App &#183; Lambda</text>

  <!-- Log Group (focal) -->
  <rect x="280" y="112" width="200" height="40" rx="6" fill="#ffffff"/>
  <rect x="280" y="112" width="200" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="380" y="130" class="node-name" text-anchor="middle">Log Group</text>
  <text x="380" y="144" class="node-sub" text-anchor="middle">/aws/eks/cluster/logs</text>

  <!-- Log Streams -->
  <rect x="520" y="112" width="160" height="40" rx="6" fill="#ffffff"/>
  <rect x="520" y="112" width="160" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="600" y="130" class="node-name" text-anchor="middle">Log Streams</text>
  <text x="600" y="144" class="node-sub" text-anchor="middle">one per pod / host</text>

  <!-- Logs Insights -->
  <rect x="232" y="216" width="144" height="40" rx="6" fill="#ffffff"/>
  <rect x="232" y="216" width="144" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="304" y="234" class="node-name" text-anchor="middle">Logs Insights</text>
  <text x="304" y="248" class="node-sub" text-anchor="middle">ad-hoc queries</text>

  <!-- Metric Filters -->
  <rect x="392" y="216" width="144" height="40" rx="6" fill="#ffffff"/>
  <rect x="392" y="216" width="144" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="464" y="234" class="node-name" text-anchor="middle">Metric Filters</text>
  <text x="464" y="248" class="node-sub" text-anchor="middle">pattern &#8594; metric</text>

  <!-- Subscription Filters -->
  <rect x="552" y="216" width="144" height="40" rx="6" fill="#ffffff"/>
  <rect x="552" y="216" width="144" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="624" y="234" class="node-name" text-anchor="middle">Subscription Filters</text>
  <text x="624" y="248" class="node-sub" text-anchor="middle">real-time fan-out</text>

  <!-- CloudWatch Alarms -->
  <rect x="392" y="296" width="144" height="40" rx="6" fill="#ffffff"/>
  <rect x="392" y="296" width="144" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="464" y="314" class="node-name" text-anchor="middle">CloudWatch Alarms</text>
  <text x="464" y="328" class="node-sub" text-anchor="middle">threshold breach</text>

  <!-- S3 -->
  <rect x="300" y="400" width="112" height="40" rx="6" fill="#ffffff"/>
  <rect x="300" y="400" width="112" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="356" y="418" class="node-name" text-anchor="middle">S3</text>
  <text x="356" y="432" class="node-sub" text-anchor="middle">archive</text>

  <!-- Kinesis Data Firehose -->
  <rect x="436" y="400" width="168" height="40" rx="6" fill="#ffffff"/>
  <rect x="436" y="400" width="168" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="520" y="418" class="node-name" text-anchor="middle">Kinesis Data Firehose</text>
  <text x="520" y="432" class="node-sub" text-anchor="middle">streaming ETL</text>

  <!-- Lambda (destination) -->
  <rect x="628" y="400" width="120" height="40" rx="6" fill="#ffffff"/>
  <rect x="628" y="400" width="120" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="688" y="418" class="node-name" text-anchor="middle">Lambda</text>
  <text x="688" y="432" class="node-sub" text-anchor="middle">custom processing</text>

  <!-- OpenSearch -->
  <rect x="772" y="400" width="128" height="40" rx="6" fill="#ffffff"/>
  <rect x="772" y="400" width="128" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="836" y="418" class="node-name" text-anchor="middle">OpenSearch</text>
  <text x="836" y="432" class="node-sub" text-anchor="middle">search &amp; dashboards</text>

  <!-- ===== LEGEND ===== -->
  <line x1="32" y1="500" x2="928" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="516" class="legend-eyebrow">LEGEND</text>

  <rect x="32" y="528" width="12" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="52" y="537" class="legend-text">CENTRAL LOG GROUP</text>

  <rect x="220" y="528" width="12" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="240" y="537" class="legend-text">PROCESSING / QUERY</text>

  <rect x="420" y="528" width="12" height="12" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="440" y="537" class="legend-text">EXPORT DESTINATION</text>
</svg>