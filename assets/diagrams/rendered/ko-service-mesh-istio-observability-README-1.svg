<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="obsarch-title obsarch-desc">
    <title id="obsarch-title">관찰성 아키텍처</title>
    <desc id="obsarch-desc">Envoy 사이드카가 애플리케이션 트래픽에서 메트릭·트레이스·액세스 로그를 수집해 Prometheus, Jaeger, Fluentd/Loki 백엔드로 보내고, 이 백엔드들이 다시 Grafana와 Kiali로 모여 시각화되는 흐름을 보여준다. istiod는 사이드카에 설정을 전파한다.</desc>

    <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="8 0, 0 3, 8 6" fill="#EC7211"/>
      </marker>
      <style>
        text{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
      </style>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Application Layer (drawn before arrows/nodes) -->
    <rect x="200" y="144" width="560" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="216" y="148" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="280" y="157" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">APPLICATION LAYER</text>

    <!-- ===== Arrows (behind boxes) ===== -->

    <!-- Istiod -> Pod A / Pod B (dashed config) -->
    <path d="M456,104 V132 Q456,140 448,140 H348 Q340,140 340,148 V176"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <path d="M504,104 V132 Q504,140 512,140 H612 Q620,140 620,148 V176"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Pod A <-> Pod B mTLS (bidirectional) -->
    <line x1="440" y1="224" x2="520" y2="224" stroke="#EC7211" stroke-width="1.2"
          marker-start="url(#arrow-start)" marker-end="url(#arrow-accent)"/>

    <!-- Application zone -> backends -->
    <path d="M340,284 V304 Q340,312 332,312 H172 Q164,312 164,320 V340"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M480,284 V340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M620,284 V304 Q620,312 628,312 H788 Q796,312 796,320 V340"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Backends -> Kiali / Grafana -->
    <path d="M100,436 V440 Q100,448 108,448 H220 Q228,448 228,456 V484"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M228,436 V440 Q228,448 236,448 H580 Q588,448 588,456 V484"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M416,436 V440 a8,8 0 0,0 0,16 V460 Q416,468 408,468 H380 Q372,468 372,476 V484"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M544,436 V440 a8,8 0 0,0 0,16 V460 Q544,468 552,468 H652 Q660,468 660,476 V484"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M796,436 V440 Q796,448 788,448 H740 Q732,448 732,456 V484"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Arrow labels (masked, 6-10px gap above stroke) ===== -->

    <!-- CONFIG labels on dashed segments -->
    <rect x="376" y="120" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="402" y="129" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG</text>
    <rect x="536" y="120" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="562" y="129" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG</text>

    <!-- mTLS label -->
    <rect x="462" y="204" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="213" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">mTLS</text>

    <!-- METRICS / TRACES / ACCESS LOGS labels -->
    <rect x="222" y="292" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="252" y="301" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">METRICS</text>
    <rect x="490" y="306" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="516" y="315" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TRACES</text>
    <rect x="668" y="292" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="708" y="301" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ACCESS LOGS</text>

    <!-- ===== Nodes ===== -->

    <!-- Istiod (control plane) -->
    <rect x="400" y="40" width="160" height="64" rx="8" fill="#ffffff"/>
    <rect x="400" y="40" width="160" height="64" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="408" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="422" y="55" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CTL</text>
    <text x="480" y="74" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">istiod</text>
    <text x="480" y="90" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Telemetry Config</text>

    <!-- Pod A (focal) -->
    <rect x="240" y="176" width="200" height="96" rx="8" fill="#ffffff"/>
    <rect x="240" y="176" width="200" height="96" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="248" y="182" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.60)" stroke-width="0.8"/>
    <text x="262" y="191" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">POD</text>
    <text x="340" y="226" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod A</text>
    <text x="340" y="242" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">App + Envoy Sidecar</text>
    <text x="340" y="258" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Zero Instrumentation</text>

    <!-- Pod B (focal) -->
    <rect x="520" y="176" width="200" height="96" rx="8" fill="#ffffff"/>
    <rect x="520" y="176" width="200" height="96" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="528" y="182" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.60)" stroke-width="0.8"/>
    <text x="542" y="191" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">POD</text>
    <text x="620" y="226" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod B</text>
    <text x="620" y="242" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">App + Envoy Sidecar</text>
    <text x="620" y="258" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Zero Instrumentation</text>

    <!-- Prometheus -->
    <rect x="40" y="340" width="248" height="96" rx="8" fill="#ffffff"/>
    <rect x="40" y="340" width="248" height="96" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="48" y="346" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="62" y="355" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">MET</text>
    <text x="164" y="390" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Prometheus</text>
    <text x="164" y="406" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">+ OpenTelemetry · 메트릭 수집</text>

    <!-- Jaeger -->
    <rect x="356" y="340" width="248" height="96" rx="8" fill="#ffffff"/>
    <rect x="356" y="340" width="248" height="96" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="364" y="346" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="378" y="355" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TRC</text>
    <text x="480" y="390" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Jaeger</text>
    <text x="480" y="406" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">+ Grafana Tempo · 장기 저장</text>

    <!-- Fluentd / Loki -->
    <rect x="672" y="340" width="248" height="96" rx="8" fill="#ffffff"/>
    <rect x="672" y="340" width="248" height="96" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="680" y="346" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="694" y="355" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">LOG</text>
    <text x="796" y="390" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Fluentd · Loki</text>
    <text x="796" y="406" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">로그 수집 및 저장</text>

    <!-- Kiali -->
    <rect x="160" y="484" width="280" height="96" rx="8" fill="#ffffff"/>
    <rect x="160" y="484" width="280" height="96" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="168" y="490" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="182" y="499" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">VIZ</text>
    <text x="300" y="534" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Kiali</text>
    <text x="300" y="550" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">서비스 토폴로지 시각화</text>

    <!-- Grafana -->
    <rect x="520" y="484" width="280" height="96" rx="8" fill="#ffffff"/>
    <rect x="520" y="484" width="280" height="96" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="528" y="490" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="542" y="499" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">VIZ</text>
    <text x="660" y="534" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Grafana</text>
    <text x="660" y="550" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">통합 대시보드 · 메트릭/트레이스/로그</text>

    <!-- Legend -->
    <line x1="40" y1="612" x2="920" y2="612" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="624" width="10" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="58" y="633" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">Envoy 사이드카 (Focal)</text>
    <line x1="330" y1="629" x2="366" y2="629" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="376" y="633" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">istiod 설정 전파</text>
    <line x1="620" y1="629" x2="656" y2="629" stroke="#545B64" stroke-width="1.2"/>
    <text x="666" y="633" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">관찰성 데이터 흐름</text>
  </svg>