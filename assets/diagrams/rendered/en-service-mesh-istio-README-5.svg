<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mesh-arch-title mesh-arch-desc">
    <title id="mesh-arch-title">Istio control plane and data plane</title>
    <desc id="mesh-arch-desc">Architecture showing istiod's Pilot and Citadel pushing configuration and certificates down to Envoy sidecar proxies, which carry each application's requests and exchange mTLS-encrypted traffic between pods.</desc><defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Control Plane -->
    <rect x="40" y="100" width="280" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="108" y="108" width="144" height="14" rx="2" fill="#ffffff"/>
    <text x="180" y="118" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CONTROL PLANE (ISTIOD)</text>

    <!-- Zone: Data Plane -->
    <rect x="360" y="100" width="520" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="576" y="108" width="88" height="14" rx="2" fill="#ffffff"/>
    <text x="620" y="118" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DATA PLANE</text>

    <!-- Pod containers -->
    <rect x="392" y="140" width="208" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="404" y="148" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="432" y="157" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">POD 1</text>

    <rect x="648" y="140" width="208" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="660" y="148" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="716" y="157" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">POD 2 · +1 MORE</text>

    <!-- Arrows (behind boxes) -->
    <!-- Pilot -> Envoy A top (config) -->
    <path d="M 296,160 H 532 Q 540,160 540,168 V 220" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- Citadel -> Envoy A left (cert) -->
    <line x1="296" y1="242" x2="408" y2="242" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- App A -> Envoy A -->
    <line x1="496" y1="204" x2="496" y2="220" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- App B -> Envoy B -->
    <line x1="752" y1="204" x2="752" y2="220" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Envoy A <-> Envoy B mTLS (bidirectional) -->
    <line x1="584" y1="242" x2="664" y2="242" stroke="#EC7211" stroke-width="1.4" marker-start="url(#arrow-accent-rev)" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels -->
    <rect x="464" y="146" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="484" y="155" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CONFIG</text>
    <rect x="332" y="226" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="350" y="235" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CERT</text>
    <rect x="474" y="206" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="496" y="215" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REQUEST</text>
    <rect x="730" y="206" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="752" y="215" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REQUEST</text>
    <rect x="606" y="226" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="624" y="235" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">mTLS</text>

    <!-- Pilot -->
    <rect x="64" y="140" width="232" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Pilot</text>
    <text x="180" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">service discovery &amp; routing</text>

    <!-- Citadel -->
    <rect x="64" y="220" width="232" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Citadel</text>
    <text x="180" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">certificates &amp; mTLS</text>

    <!-- Galley (disconnected, as in source) -->
    <rect x="64" y="300" width="232" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="324" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Galley</text>
    <text x="180" y="340" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">config validation</text>

    <!-- App A -->
    <rect x="408" y="160" width="176" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="496" y="186" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Application</text>

    <!-- Envoy A (focal) -->
    <rect x="408" y="220" width="176" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="496" y="246" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Envoy Proxy</text>

    <!-- App B -->
    <rect x="664" y="160" width="176" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="752" y="186" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Application</text>

    <!-- Envoy B -->
    <rect x="664" y="220" width="176" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="752" y="246" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Envoy Proxy</text>

    <!-- Caption -->
    <text x="620" y="308" fill="#232F3E" font-size="14" font-style="italic" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Every pod repeats this pattern —</text>
    <text x="620" y="328" fill="#232F3E" font-size="14" font-style="italic" font-family="'Amazon Ember', sans-serif" text-anchor="middle">istiod wires each sidecar the same way</text>

    <!-- Legend -->
    <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="488" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <line x1="140" y1="486" x2="168" y2="486" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="176" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Control-plane push</text>
    <line x1="356" y1="486" x2="384" y2="486" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="392" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Application request</text>
    <line x1="576" y1="486" x2="604" y2="486" stroke="#EC7211" stroke-width="1.4" marker-start="url(#arrow-accent-rev)" marker-end="url(#arrow-accent)"/>
    <text x="612" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Encrypted mTLS peer link</text>
    <rect x="820" y="480" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="852" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Focal</text>
  </svg>