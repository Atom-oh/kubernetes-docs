<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="timeout-title timeout-desc">
    <title id="timeout-title">Linkerd Timeout Behavior</title>
    <desc id="timeout-desc">Sequence diagram showing linkerd-proxy starting a per-route timeout when it forwards a request, and branching on whether the backend service responds within the deadline or the proxy returns a 504 while the backend keeps processing.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="120" y1="112" x2="120" y2="580" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="112" x2="480" y2="580" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="840" y1="112" x2="840" y2="580" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="116" y="144" width="8" height="180" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="476" y="144" width="8" height="392" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="836" y="228" width="8" height="120" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- 1. Client -> Proxy: HTTP Request -->
    <line x1="120" y1="144" x2="472" y2="144" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="248" y="124" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="296" y="134" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">HTTP REQUEST</text>

    <!-- Note: start timeout -->
    <rect x="392" y="164" width="176" height="28" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
    <text x="480" y="182" fill="#232F3E" font-size="9" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Start timeout: 5s</text>

    <!-- 2. Proxy -> Service: Request -->
    <line x1="484" y1="228" x2="832" y2="228" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="632" y="208" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="668" y="218" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REQUEST</text>

    <!-- ALT fragment frame -->
    <rect x="96" y="256" width="768" height="304" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <rect x="96" y="256" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="116" y="268" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
    <text x="148" y="268" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[response within 5s]</text>

    <!-- Region 1: normal response -->
    <path d="M 836,348 L 488,348" fill="none" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
    <rect x="628" y="328" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="660" y="338" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">200 OK</text>

    <line x1="476" y1="392" x2="128" y2="392" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
    <rect x="268" y="372" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="300" y="382" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">200 OK</text>

    <!-- Divider -->
    <line x1="104" y1="424" x2="856" y2="424" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="116" y="440" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else: exceeds 5s]</text>

    <!-- Note: 5 seconds elapsed -->
    <rect x="392" y="460" width="176" height="28" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
    <text x="480" y="478" fill="#232F3E" font-size="9" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">5 seconds elapsed</text>

    <!-- Region 2: timeout -->
    <line x1="476" y1="516" x2="128" y2="516" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="252" y="496" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="312" y="506" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">504 GATEWAY TIMEOUT</text>

    <!-- Note: service still processing -->
    <rect x="740" y="496" width="176" height="40" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="828" y="512" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Request may</text>
    <text x="828" y="524" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">continue processing</text>

    <!-- Actor boxes -->
    <rect x="56" y="60" width="128" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="120" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>

    <rect x="416" y="60" width="128" height="52" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="84" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">linkerd-proxy</text>
    <text x="480" y="100" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sidecar</text>

    <rect x="776" y="60" width="128" height="52" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="840" y="84" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Backend Service</text>
    <text x="840" y="100" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">upstream</text>

    <!-- Legend -->
    <text x="40" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <line x1="112" y1="577" x2="140" y2="577" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
    <text x="148" y="580" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Happy path</text>

    <line x1="280" y1="577" x2="308" y2="577" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="316" y="580" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Timeout response</text>
  </svg>