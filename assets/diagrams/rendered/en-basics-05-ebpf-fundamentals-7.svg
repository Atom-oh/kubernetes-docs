<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-basics-05-ebpf-fundamentals-7-title en-basics-05-ebpf-fundamentals-7-desc">
<title id="en-basics-05-ebpf-fundamentals-7-title">Traditional application monitoring versus eBPF-based monitoring</title>
<desc id="en-basics-05-ebpf-fundamentals-7-desc">Comparison diagram contrasting traditional monitoring, where an application must embed an SDK or agent that collects metrics and ships them to a backend, with eBPF-based monitoring, where an unmodified application is observed by an eBPF program attached in the kernel that sends data straight to the same monitoring backend.</desc>
