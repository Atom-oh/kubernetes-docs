    <text x="450" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">저장</text>

    <rect x="680" y="56" width="220" height="368" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="716" y="60" width="148" height="12" rx="2" fill="#ffffff"/>
    <text x="790" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">분석 · 시각화</text>

