    <rect x="104" y="60" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="150" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">수집</text>

