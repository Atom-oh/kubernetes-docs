<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="eksloga-title eksloga-desc">
    <title id="eksloga-title">EKS 로그 분석 및 시각화 파이프라인</title>
    <desc id="eksloga-desc">여러 로그 소스가 수집 에이전트를 거쳐 CloudWatch Logs, OpenSearch, S3, Loki 네 가지 저장소로 나뉘어 들어가고, 각 저장소가 자신과 짝을 이루는 분석·시각화 도구로 이어지는 흐름을 보여준다.</desc>
