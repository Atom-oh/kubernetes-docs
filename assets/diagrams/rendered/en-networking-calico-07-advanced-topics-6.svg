<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calico-federation-title calico-federation-desc">
    <title id="calico-federation-title">Multi-cluster federation topology</title>
    <desc id="calico-federation-desc">Three clusters each peer their API server with a shared Federation Controller for policy sync, while their pod workloads mesh directly with each other over BGP or overlay.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- cluster zones -->
    <rect x="20" y="88" width="280" height="184" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="28" y="92" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="64" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">CLUSTER A</text>

    <rect x="340" y="88" width="280" height="184" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="348" y="92" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="384" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">CLUSTER B</text>

    <rect x="660" y="88" width="280" height="184" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="668" y="92" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="704" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">CLUSTER C</text>

    <!-- federation zone -->
    <rect x="340" y="340" width="280" height="184" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="348" y="344" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="404" y="353" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">FEDERATION LAYER</text>

    <!-- workloads mesh (drawn above all zones, y band 76) -->
    <line x1="260" y1="148" x2="380" y2="148" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <line x1="580" y1="148" x2="700" y2="148" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <path d="M 160,120 V 84 Q 160,76 168,76 H 792 Q 800,76 800,84 V 120" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>

    <!-- API servers <-> Federation Controller -->
    <path d="M 160,256 V 302 Q 160,310 168,310 H 422 Q 430,310 430,318 V 372" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <line x1="480" y1="256" x2="480" y2="372" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <path d="M 800,256 V 302 Q 800,310 792,310 H 538 Q 530,310 530,318 V 372" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>

    <!-- Federation Controller -> Policy Sync -->
    <line x1="480" y1="428" x2="480" y2="452" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- mesh edge label -->
    <rect x="452" y="128" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="137" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">BGP/OVERLAY</text>

    <!-- Cluster A -->
    <rect x="60" y="120" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="60" y="120" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="160" y="144" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Workloads</text>
    <text x="160" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">10.244.0.0/16</text>

    <rect x="60" y="200" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="60" y="200" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="232" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API Server</text>

    <!-- Cluster B -->
    <rect x="380" y="120" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="380" y="120" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="144" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Workloads</text>
    <text x="480" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">10.245.0.0/16</text>

    <rect x="380" y="200" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="380" y="200" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="232" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API Server</text>

    <!-- Cluster C -->
    <rect x="700" y="120" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="700" y="120" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="800" y="144" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Workloads</text>
    <text x="800" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">10.246.0.0/16</text>

    <rect x="700" y="200" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="700" y="200" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="800" y="232" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API Server</text>

    <!-- Federation Controller (focal) -->
    <rect x="380" y="372" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="380" y="372" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="404" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Federation Controller</text>

    <!-- Policy Sync -->
    <rect x="380" y="452" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="380" y="452" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="484" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Policy Sync</text>
  </svg>