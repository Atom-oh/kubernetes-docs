<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-service-mesh-istio-resilience-readme-2-title en-service-mesh-istio-resilience-readme-2-desc"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <title id="en-service-mesh-istio-resilience-readme-2-title">Retry Sequence</title>
    <desc id="en-service-mesh-istio-resilience-readme-2-desc">A sequence diagram showing Envoy proxy's first attempt to Pod 1 fail with a 503, then Envoy retrying the same request against Pod 2, which succeeds and returns 200 OK to the client.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines: Client 120, Envoy 360, Pod1 600, Pod2 840 -->
    <line x1="120" y1="96" x2="120" y2="552" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="360" y1="96" x2="360" y2="552" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="600" y1="96" x2="600" y2="552" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="840" y1="96" x2="840" y2="552" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bar: Envoy spans the whole exchange -->
    <rect x="356" y="132" width="8" height="380" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- 1. Client -> Envoy: Request -->
    <line x1="120" y1="152" x2="352" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="204" y="128" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="236" y="137" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">1. REQUEST</text>

    <!-- 2. Envoy -> Pod1: Attempt 1 -->
    <line x1="368" y1="196" x2="592" y2="196" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="420" y="172" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="181" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">2. ATTEMPT 1</text>

    <!-- 3. Pod1 -> Envoy: 503 (dashed return) -->
    <line x1="600" y1="240" x2="372" y2="240" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="416" y="216" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="225" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">3. 503 UNAVAILABLE</text>

    <!-- Note over Envoy: retry decision -->
    <rect x="300" y="264" width="240" height="44" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="420" y="282" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" font-style="italic">Retry condition met</text>
    <text x="420" y="296" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" font-style="italic">Retry to different pod</text>

    <!-- 4. Envoy -> Pod2: Attempt 2 -->
    <line x1="368" y1="340" x2="832" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="568" y="316" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="628" y="325" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">4. ATTEMPT 2</text>

    <!-- 5. Pod2 -> Envoy: 200 OK (dashed return, headline success start) -->
    <line x1="840" y1="384" x2="372" y2="384" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="588" y="360" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="616" y="369" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">5. 200 OK</text>

    <!-- 6. Envoy -> Client: 200 OK (headline success, accent) -->
    <line x1="356" y1="428" x2="124" y2="428" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <rect x="212" y="404" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="413" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">6. 200 OK</text>

    <!-- Actor boxes -->
    <rect x="40" y="64" width="160" height="40" rx="6" fill="#ffffff"/>
    <rect x="40" y="64" width="160" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="120" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>

    <rect x="280" y="64" width="160" height="40" rx="6" fill="#ffffff"/>
    <rect x="280" y="64" width="160" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="360" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>

    <rect x="520" y="64" width="160" height="40" rx="6" fill="#ffffff"/>
    <rect x="520" y="64" width="160" height="40" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="600" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 1</text>
    <text x="600" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(failure)</text>

    <rect x="760" y="64" width="160" height="40" rx="6" fill="#ffffff"/>
    <rect x="760" y="64" width="160" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="840" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 2</text>
    <text x="840" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(success)</text>

    <!-- Legend -->
    <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="532" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="140" y1="529" x2="172" y2="529" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="180" y="532" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Call</text>

    <line x1="320" y1="529" x2="352" y2="529" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <text x="360" y="532" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Headline success return</text>

    <line x1="600" y1="529" x2="632" y2="529" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="640" y="532" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return (incl. failure)</text>
  </svg>