<line x1="572" y1="140" x2="600" y2="140" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="712" y1="140" x2="740" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

