<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vcluster-lifecycle-title vcluster-lifecycle-desc">
<title id="vcluster-lifecycle-title">vCluster 라이프사이클 상태</title>
<desc id="vcluster-lifecycle-desc">개발자 요청으로 시작된 vCluster가 승인·프로비저닝을 거쳐 Running 상태에 이르고, 이후 자동 Sleep/Wake, 수동 Pause/Resume, TTL 만료에 의한 삭제까지 이어지는 상태 전이를 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs><defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Start dot -->
<circle cx="40" cy="140" r="6" fill="#232F3E"/>

<!-- Transitions (drawn before states) -->
<path d="M46,140 H80" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M200,140 H260" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M380,140 H440" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M560,140 H620" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<!-- Running -> Paused -->
<path d="M740,130 H800" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- Paused -> Running -->
<path d="M800,150 H740" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- Running -> Sleeping -->
<path d="M660,168 V232" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- Sleeping -> Running (wake) -->
<path d="M700,232 V168" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- Running -> Deleting -->
<path d="M640,168 V204 Q640,212 632,212 H428 Q420,212 420,220 V400" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- Sleeping -> Deleting -->
<path d="M660,288 V336 Q660,344 652,344 H448 Q440,344 440,352 V400" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- Deleting -> end -->
<path d="M360,428 H286" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Transition labels -->
<rect x="51" y="120" width="24" height="12" rx="2" fill="#ffffff"/>
<text x="63" y="129" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">요청</text>

<rect x="208" y="120" width="44" height="12" rx="2" fill="#ffffff"/>
<text x="230" y="129" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PR 머지</text>

<rect x="388" y="120" width="44" height="12" rx="2" fill="#ffffff"/>
<text x="410" y="129" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">동기화</text>

<rect x="568" y="120" width="44" height="12" rx="2" fill="#ffffff"/>
<text x="590" y="129" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">준비 완료</text>

<rect x="725" y="100" width="90" height="12" rx="2" fill="#ffffff"/>
<text x="770" y="109" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">수동 일시중지</text>

<rect x="725" y="172" width="90" height="12" rx="2" fill="#ffffff"/>
<text x="770" y="181" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">수동 재개</text>

<rect x="560" y="194" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="608" y="203" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">비활성 30분</text>

<rect x="744" y="210" width="110" height="12" rx="2" fill="#ffffff"/>
<text x="799" y="219" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">접근 감지 (WAKE)</text>

<rect x="495" y="194" width="90" height="12" rx="2" fill="#ffffff"/>
<text x="540" y="203" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TTL/수동 삭제</text>

<rect x="530" y="326" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="560" y="335" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TTL 만료</text>

<rect x="307" y="410" width="32" height="12" rx="2" fill="#ffffff"/>
<text x="323" y="419" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">완료</text>

<!-- States -->
<rect x="80" y="112" width="120" height="56" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="140" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Requested</text>

<rect x="260" y="112" width="120" height="56" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="320" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Approved</text>

<rect x="440" y="112" width="120" height="56" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="500" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Provisioning</text>

<rect x="620" y="112" width="120" height="56" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="680" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Running</text>

<rect x="800" y="112" width="120" height="56" rx="8" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="860" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Paused</text>

<rect x="620" y="232" width="120" height="56" rx="8" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="680" y="264" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sleeping</text>

<rect x="360" y="400" width="120" height="56" rx="8" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="420" y="432" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Deleting</text>

<!-- End dot (ringed) -->
<circle cx="272" cy="428" r="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<circle cx="272" cy="428" r="5" fill="#232F3E"/>

<!-- Legend -->
<line x1="24" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="24" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

<rect x="24" y="528" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="44" y="536" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Running (focal)</text>

<circle cx="204" cy="533" r="5" fill="#232F3E"/>
<text x="216" y="536" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">시작</text>

<circle cx="284" cy="533" r="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<circle cx="284" cy="533" r="3.5" fill="#232F3E"/>
<text x="300" y="536" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">종료</text>
</svg>