<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
<title id="t3">5개 노드의 iBGP Full-Mesh 토폴로지</title>
<desc id="d3">5개의 Kubernetes 노드가 서로 모든 쌍에 대해 직접 iBGP 세션을 맺어 10개의 세션으로 완전 연결된 full-mesh 구조를 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<text x="32" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BGP TOPOLOGY</text>
<text x="32" y="60" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Full-Mesh BGP (5개 노드)</text>

<!-- Boundary -->
<rect x="128" y="92" width="704" height="436" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="144" y="100" width="220" height="16" rx="2" fill="#ffffff"/>
<text x="254" y="112" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="0.08em">FULL-MESH BGP (5 노드)</text>

<!-- All 10 pairwise iBGP sessions (undirected peering, drawn before nodes) -->
<g stroke="#8D99A8" stroke-width="1" opacity="0.55">
  <line x1="478" y1="172" x2="638" y2="288"/>
  <line x1="478" y1="172" x2="578" y2="476"/>
  <line x1="478" y1="172" x2="378" y2="476"/>
  <line x1="478" y1="172" x2="318" y2="288"/>
  <line x1="638" y1="288" x2="578" y2="476"/>
  <line x1="638" y1="288" x2="378" y2="476"/>
  <line x1="638" y1="288" x2="318" y2="288"/>
  <line x1="578" y1="476" x2="378" y2="476"/>
  <line x1="578" y1="476" x2="318" y2="288"/>
  <line x1="378" y1="476" x2="318" y2="288"/>
</g>

<!-- Nodes -->
<rect x="428" y="152" width="100" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="478" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 1</text>

<rect x="588" y="268" width="100" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="638" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 2</text>

<rect x="528" y="456" width="100" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="578" y="480" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 3</text>

<rect x="328" y="456" width="100" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="378" y="480" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 4</text>

<rect x="268" y="268" width="100" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="318" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 5</text>

<!-- Session-count callout -->
<rect x="392" y="356" width="172" height="48" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<text x="478" y="376" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">N×(N-1)/2 = 10</text>
<text x="478" y="392" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">iBGP 세션</text>

<!-- Legend -->
<line x1="32" y1="548" x2="928" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="32" y="566" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="140" y1="562" x2="172" y2="562" stroke="#8D99A8" stroke-width="1"/>
<text x="180" y="566" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">iBGP 피어링 · 모든 노드 쌍이 직접 연결</text>
</svg>