<title id="en-service-mesh-istio-03-architecture-11-title">xDS Communication Flow</title>
<desc id="en-service-mesh-istio-03-architecture-11-desc">Sequence diagram showing a newly started Envoy proxy connecting to Istiod over mTLS, looping through xDS request/response round-trips for each discovery resource type until fully configured, and later receiving a pushed endpoint update after Istiod detects a Kubernetes service change.</desc>
