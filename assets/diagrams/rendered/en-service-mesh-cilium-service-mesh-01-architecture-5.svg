      <title id="en-service-mesh-cilium-service-mesh-01-architecture-5-title">L7 request and response flow through the node Envoy</title>
      <desc id="en-service-mesh-cilium-service-mesh-01-architecture-5-desc">Sequence diagram showing a client HTTP request passing through the eBPF datapath, which conditionally redirects traffic to the node Envoy for L7 policy enforcement on both the request and response legs before the response reaches the client.</desc>
