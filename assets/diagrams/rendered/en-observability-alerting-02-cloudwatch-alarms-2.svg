<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cwa2-title cwa2-desc">
    <title id="cwa2-title">Composite Alarm Concept</title>
    <desc id="cwa2-desc">Three metric alarms and a combining rule feed a composite alarm that evaluates the boolean condition across them, and only the composite alarm triggers the downstream SNS/Lambda action.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="cwa2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="cwa2-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ ARROWS ============ -->
    <g fill="none" stroke="#545B64" stroke-width="1.2">
      <path d="M 220,96 H 400" marker-end="url(#cwa2-arrow)"/>
      <path d="M 220,184 H 400" marker-end="url(#cwa2-arrow)"/>
      <path d="M 220,272 H 400" marker-end="url(#cwa2-arrow)"/>
      <path d="M 220,360 H 400" marker-end="url(#cwa2-arrow)"/>
      <path d="M 560,228 H 740" stroke="#EC7211" marker-end="url(#cwa2-arrow-accent)"/>
    </g>

    <!-- ============ NODES ============ -->
    <!-- High CPU Alarm -->
    <g>
      <rect x="60" y="72" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="60" y="72" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="140" y="100" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">High CPU Alarm</text>
    </g>

    <!-- High Memory Alarm -->
    <g>
      <rect x="60" y="160" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="60" y="160" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="140" y="188" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">High Memory Alarm</text>
    </g>

    <!-- High Disk Alarm -->
    <g>
      <rect x="60" y="248" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="60" y="248" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="140" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">High Disk Alarm</text>
    </g>

    <!-- Rule -->
    <g>
      <rect x="60" y="328" width="160" height="64" rx="6" fill="#ffffff"/>
      <rect x="60" y="328" width="160" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="140" y="354" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rule: (CPU AND</text>
      <text x="140" y="368" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Memory) OR Disk</text>
    </g>

    <!-- Composite Alarm (FOCAL) -->
    <g>
      <rect x="400" y="72" width="160" height="312" rx="8" fill="#ffffff"/>
      <rect x="400" y="72" width="160" height="312" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="480" y="220" fill="#232F3E" font-size="13" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Server Resource</text>
      <text x="480" y="238" fill="#232F3E" font-size="13" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Critical Alarm</text>
      <text x="480" y="256" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">composite alarm</text>
    </g>

    <!-- SNS/Lambda -->
    <g>
      <rect x="740" y="204" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="740" y="204" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="820" y="232" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SNS/Lambda</text>
    </g>
  </svg>