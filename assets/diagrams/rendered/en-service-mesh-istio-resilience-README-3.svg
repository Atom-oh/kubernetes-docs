<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-service-mesh-istio-resilience-readme-3-title en-service-mesh-istio-resilience-readme-3-desc"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <title id="en-service-mesh-istio-resilience-readme-3-title">Resilience Architecture</title>
    <desc id="en-service-mesh-istio-resilience-readme-3-desc">An architecture diagram showing a client request passing through an ingress gateway and rate limiting into Outlier Detection, which routes traffic to healthy pods in Service A while excluding an unhealthy one, then on to zone-matched pods in Service B under a Zone Aware Routing policy.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="280" y="76" width="320" height="84" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="292" y="80" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="362" y="89" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INGRESS GATEWAY</text>

    <rect x="40" y="192" width="880" height="88" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="196" width="184" height="12" rx="2" fill="#ffffff"/>
    <text x="144" y="205" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RESILIENCE POLICIES</text>

    <rect x="180" y="336" width="520" height="88" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="192" y="340" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="236" y="349" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE A</text>

    <rect x="180" y="464" width="420" height="88" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="192" y="468" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="236" y="477" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE B</text>

    <!-- Arrows (drawn before boxes) -->
    <!-- 1. Client -> GW (straight) -->
    <line x1="440" y1="64" x2="440" y2="104" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- 2. GW -> OD (straight) -->
    <line x1="440" y1="144" x2="440" y2="216" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- 3. RL -> GW (dashed, Applied) attach RL top x180, GW bottom x360 -->
    <path d="M180,216 V188 Q180,180 188,180 H352 Q360,180 360,172 V144"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="238" y="160" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="270" y="169" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPLIED</text>

    <!-- 4. OD -> A1 (solid, Healthy) attach OD bottom x380 -->
    <path d="M380,256 V300 Q380,308 372,308 H284 Q276,308 276,316 V360"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="284" y="288" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="328" y="297" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HEALTHY ONLY</text>

    <!-- 5. OD -> A2 (straight, Healthy) -->
    <line x1="440" y1="256" x2="440" y2="360" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="452" y="298" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="458" y="307" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HEALTHY</text>

    <!-- 6. OD -> A3 (dashed, Excluded) attach OD bottom x500 -->
    <path d="M500,256 V300 Q500,308 508,308 H596 Q604,308 604,316 V360"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="520" y="288" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="552" y="297" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXCLUDED</text>

    <!-- 7. A1 -> B1 (straight, Preferred) -->
    <line x1="276" y1="400" x2="276" y2="488" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="196" y="406" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="232" y="415" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PREFERRED</text>

    <!-- 8. A2 -> B2 (straight, Preferred) -->
    <line x1="440" y1="400" x2="440" y2="488" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="360" y="406" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="396" y="415" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PREFERRED</text>

    <!-- 9. ZA -> Service B zone (dashed, Affects) attach ZA bottom x700 -->
    <path d="M700,256 V432 Q700,440 692,440 H588 Q580,440 580,448 V464"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="608" y="420" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="429" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AFFECTS</text>

    <!-- Nodes -->
    <!-- Client (input) -->
    <rect x="360" y="24" width="160" height="40" rx="6" fill="#ffffff"/>
    <rect x="360" y="24" width="160" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="440" y="48" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>

    <!-- GW -->
    <rect x="320" y="104" width="240" height="40" rx="6" fill="#ffffff"/>
    <rect x="320" y="104" width="240" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="440" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway</text>
    <text x="440" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rate limiting</text>

    <!-- RL -->
    <rect x="80" y="216" width="200" height="40" rx="6" fill="#ffffff"/>
    <rect x="80" y="216" width="200" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="234" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rate Limiting</text>
    <text x="180" y="248" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">100 req/s</text>

    <!-- OD (FOCAL) -->
    <rect x="320" y="216" width="240" height="40" rx="6" fill="#ffffff"/>
    <rect x="320" y="216" width="240" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="440" y="234" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Outlier Detection</text>
    <text x="440" y="248" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod a3 excluded</text>

    <!-- ZA -->
    <rect x="600" y="216" width="200" height="40" rx="6" fill="#ffffff"/>
    <rect x="600" y="216" width="200" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="700" y="234" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Zone Aware</text>
    <text x="700" y="248" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a -&gt; b same zone</text>

    <!-- A1 -->
    <rect x="204" y="360" width="144" height="40" rx="6" fill="#ffffff"/>
    <rect x="204" y="360" width="144" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="276" y="378" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A1</text>
    <text x="276" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone a · healthy</text>

    <!-- A2 -->
    <rect x="368" y="360" width="144" height="40" rx="6" fill="#ffffff"/>
    <rect x="368" y="360" width="144" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="440" y="378" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A2</text>
    <text x="440" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone b · healthy</text>

    <!-- A3 (unhealthy) -->
    <rect x="532" y="360" width="144" height="40" rx="6" fill="#ffffff"/>
    <rect x="532" y="360" width="144" height="40" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="604" y="378" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A3</text>
    <text x="604" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone a · unhealthy</text>

    <!-- B1 -->
    <rect x="204" y="488" width="144" height="40" rx="6" fill="#ffffff"/>
    <rect x="204" y="488" width="144" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="276" y="506" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B1</text>
    <text x="276" y="520" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone a</text>

    <!-- B2 -->
    <rect x="368" y="488" width="144" height="40" rx="6" fill="#ffffff"/>
    <rect x="368" y="488" width="144" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="440" y="506" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B2</text>
    <text x="440" y="520" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone b</text>

    <!-- Legend -->
    <line x1="40" y1="568" x2="920" y2="568" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="584" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="140" y="576" width="20" height="12" rx="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="168" y="585" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Primary decision point</text>

    <line x1="380" y1="582" x2="412" y2="582" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="420" y="585" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Active traffic</text>

    <line x1="560" y1="582" x2="592" y2="582" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="600" y="585" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Policy / excluded</text>
  </svg>