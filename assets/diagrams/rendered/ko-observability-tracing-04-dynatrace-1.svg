<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="dyn-davis-title dyn-davis-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="dyn-davis-title">Davis AI 근본 원인 분석 파이프라인</title>
  <desc id="dyn-davis-desc">수집된 텔레메트리 데이터가 기준선 학습, 이상 탐지, 상관관계 분석을 거쳐 근본 원인을 식별하고, 그 결과가 문제 카드·영향 분석·해결 제안 세 가지 출력으로 나뉘어 전달되는 Davis AI의 처리 단계를 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="32" y="192" width="896" height="156" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="44" y="196" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="52" y="205" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DAVIS AI 엔진</text>

  <rect x="32" y="372" width="896" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="44" y="376" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="52" y="385" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">분석 결과</text>

  <!-- Arrows -->
  <!-- E0: 데이터 수집 -> 기준선 학습 -->
  <path d="M480,112 H170 Q162,112 162,120 V228" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Chain: BASELINE -> ANOMALY -> CORRELATE -> ROOT (straight, same y) -->
  <line x1="252" y1="256" x2="284" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="464" y1="256" x2="496" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="676" y1="256" x2="708" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Fan-out: ROOT -> PROBLEM / IMPACT / REMEDIATION (staggered horizontal runs to avoid overlap) -->
  <path d="M753,284 V292 Q753,300 745,300 H240 Q232,300 232,308 V408" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M798,284 V308 Q798,316 790,316 H488 Q480,316 480,324 V408" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M843,284 V324 Q843,332 835,332 H736 Q728,332 728,340 V408" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Nodes -->
  <!-- 데이터 수집 (merged input) -->
  <rect x="380" y="56" width="200" height="56" rx="6" fill="rgba(84,91,100,0.10)"/>
  <rect x="380" y="56" width="200" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="480" y="80" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">데이터 수집</text>
  <text x="480" y="96" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">메트릭·트레이스·로그·이벤트·토폴로지</text>

  <!-- BASELINE (focal) -->
  <rect x="72" y="228" width="180" height="56" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="72" y="228" width="180" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="162" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">기준선 학습</text>

  <!-- ANOMALY -->
  <rect x="284" y="228" width="180" height="56" rx="6" fill="#ffffff"/>
  <rect x="284" y="228" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="374" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">이상 탐지</text>

  <!-- CORRELATE -->
  <rect x="496" y="228" width="180" height="56" rx="6" fill="#ffffff"/>
  <rect x="496" y="228" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="586" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">상관관계 분석</text>

  <!-- ROOT -->
  <rect x="708" y="228" width="180" height="56" rx="6" fill="#ffffff"/>
  <rect x="708" y="228" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="798" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">근본 원인 식별</text>

  <!-- PROBLEM -->
  <rect x="132" y="408" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="132" y="408" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="232" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">문제 카드</text>

  <!-- IMPACT -->
  <rect x="380" y="408" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="380" y="408" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="480" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">영향 분석</text>

  <!-- REMEDIATION -->
  <rect x="628" y="408" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="628" y="408" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="728" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">해결 제안</text>
</svg>