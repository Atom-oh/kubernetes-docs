<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-networking-README-3-title en-networking-README-3-desc">
<title id="en-networking-README-3-title">Ingress Traffic Routing</title>
<desc id="en-networking-README-3-desc">An Ingress Controller receives all internet traffic and fans it out by host and path rule to three Services, each of which load-balances to its own backing pods.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- connectors -->
<line x1="480" y1="116" x2="480" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M440,216 H228 Q220,216 220,224 V300" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="216" x2="480" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M520,216 H732 Q740,216 740,224 V300" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M192,356 H168 Q160,356 160,364 V440" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M248,356 H292 Q300,356 300,364 V440" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="356" x2="480" y2="440" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="740" y1="356" x2="740" y2="440" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Internet -->
<rect x="400" y="60" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="480" y="86" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Internet</text>
<text x="480" y="102" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP/HTTPS</text>

<!-- Ingress Controller (focal) -->
<rect x="400" y="160" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="480" y="186" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Ingress Controller</text>
<text x="480" y="202" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">host + path rules</text>

<!-- Cluster zone -->
<rect x="80" y="260" width="800" height="280" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="92" y="268" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="128" y="277" fill="rgba(35,47,62,0.4)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">CLUSTER</text>

<!-- Services -->
<rect x="140" y="300" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="220" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service A</text>
<text x="220" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/v1</text>

<rect x="400" y="300" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service B</text>
<text x="480" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/v2</text>

<rect x="660" y="300" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="740" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service C</text>
<text x="740" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">web.example.com</text>

<!-- Pods -->
<rect x="100" y="440" width="120" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="160" y="466" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A1</text>
<text x="160" y="482" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replica</text>

<rect x="240" y="440" width="120" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="300" y="466" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A2</text>
<text x="300" y="482" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replica</text>

<rect x="420" y="440" width="120" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="480" y="466" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B1</text>
<text x="480" y="482" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replica</text>

<rect x="680" y="440" width="120" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="740" y="466" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod C1</text>
<text x="740" y="482" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replica</text>
</svg>