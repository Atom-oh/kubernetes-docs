    <title id="ko-core-05-configuration-secrets-0-title">Kubernetes 구성 관리 개요</title>
    <desc id="ko-core-05-configuration-secrets-0-desc">클러스터 관리자·GitOps·외부 시스템이 ConfigMap과 Secret을 생성하고, 이 값이 파드의 환경 변수·볼륨·이미지 풀 시크릿으로 소비되며, Secret은 사이드카 자동 리로드·KSOPS 암호화·Vault 동적 주입 같은 고급 패턴에도 연결됨을 보여준다.</desc>
