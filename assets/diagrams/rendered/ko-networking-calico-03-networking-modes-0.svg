<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mode-select-title mode-select-desc">
    <title id="mode-select-title">Calico 네트워킹 모드 선택 기준 개요</title>
    <desc id="mode-select-desc">네트워크 환경, 성능 요구사항, 호환성이라는 세 가지 선택 기준이 모드 선택 지점을 거쳐 IPIP, VXLAN, Direct, CrossSubnet 네 가지 네트워킹 모드로 이어지는 관계를 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="24" y="68" width="192" height="452" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="72" width="136" height="12" rx="2" fill="#ffffff"/>
    <text x="120" y="81" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">선택 기준</text>

    <rect x="744" y="28" width="192" height="506" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="778" y="32" width="124" height="12" rx="2" fill="#ffffff"/>
    <text x="840" y="41" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CALICO 모드</text>

    <!-- Arrows: criteria -> hub (before boxes) -->
    <path d="M200,132 H292 Q300,132 300,140 V276 Q300,284 308,284 H400" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="200" y1="300" x2="400" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M200,468 H292 Q300,468 300,460 V324 Q300,316 308,316 H400" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: hub -> modes (before boxes) -->
    <path d="M560,280 H628 Q636,280 636,272 V100 Q636,92 644,92 H760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M560,292 H652 Q660,292 660,284 V230 Q660,222 668,222 H760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M560,304 H676 Q684,304 684,312 V344 Q684,352 692,352 H700 a8,8 0 0,1 16,0 H760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M560,316 H676 a8,8 0 0,1 16,0 H700 Q708,316 708,324 V474 Q708,482 716,482 H760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Criteria nodes -->
    <rect x="40" y="100" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="100" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="120" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">네트워크 환경</text>

    <rect x="40" y="268" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="268" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="120" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">성능 요구사항</text>

    <rect x="40" y="436" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="436" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="120" y="472" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">호환성</text>

    <!-- Hub (focal) -->
    <rect x="400" y="268" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="268" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">모드 선택</text>
    <text x="480" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">환경 · 성능 · 호환성 종합</text>

    <!-- Mode nodes -->
    <rect x="760" y="60" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="760" y="60" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="840" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">IPIP 모드</text>
    <text x="840" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">IP-in-IP 캡슐화</text>

    <rect x="760" y="190" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="760" y="190" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="840" y="218" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">VXLAN 모드</text>
    <text x="840" y="234" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UDP 캡슐화</text>

    <rect x="760" y="320" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="760" y="320" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="840" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Direct 모드</text>
    <text x="840" y="364" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">캡슐화 없음</text>

    <rect x="760" y="450" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="760" y="450" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="840" y="478" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">CrossSubnet</text>
    <text x="840" y="494" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">조건부 캡슐화</text>

    <!-- Legend -->
    <line x1="24" y1="556" x2="936" y2="556" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="572" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="220" cy="568" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="234" y="572" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">모드 선택 — 세 기준을 종합해 결정하는 지점</text>
  </svg>
