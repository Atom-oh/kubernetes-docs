<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dynamo-title dynamo-desc">
    <title id="dynamo-title">NVIDIA Dynamo Deployment</title>
    <desc id="dynamo-desc">Pipeline showing a client request routed through Dynamo's KV-aware router to a prefill worker pool, which writes to a shared KV cache store that a decode worker pool reads from, with both pools executing on pluggable vLLM, SGLang, and TensorRT-LLM backends.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Arrows (drawn before boxes) ===== -->
    <!-- Client -> Router -->
    <line x1="160" y1="172" x2="224" y2="172" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Router -> Prefill Pool -->
    <line x1="344" y1="172" x2="408" y2="172" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Prefill Pool -> KV Cache Store (focal) -->
    <line x1="528" y1="172" x2="592" y2="172" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- KV Cache Store -> Decode Pool (focal) -->
    <line x1="712" y1="172" x2="776" y2="172" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- Prefill Pool -> Backends -->
    <path d="M 468,204 V 264 Q 468,272 476,272 H 608 Q 616,272 616,280 V 340"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Decode Pool -> Backends -->
    <path d="M 836,204 V 264 Q 836,272 828,272 H 696 Q 688,272 688,280 V 340"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Arrow labels ===== -->
    <rect x="168" y="150" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="192" y="160" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text>

    <rect x="348" y="150" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="376" y="160" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KV-ROUTE</text>

    <rect x="532" y="150" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="560" y="160" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE KV</text>

    <rect x="720" y="150" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="744" y="160" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ KV</text>

    <rect x="520" y="252" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="542" y="262" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXEC</text>

    <rect x="740" y="252" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="762" y="262" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXEC</text>

    <!-- ===== Nodes ===== -->

    <!-- Client -->
    <rect x="40" y="140" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="140" width="120" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="100" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Client</text>
    <text x="100" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">request</text>

    <!-- Router -->
    <rect x="224" y="140" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="224" y="140" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="284" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Dynamo</text>
    <text x="284" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Router · KV-aware</text>

    <!-- Prefill Pool -->
    <rect x="408" y="140" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="408" y="140" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="468" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Prefill Pool</text>
    <text x="468" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">8x A100 · high BW</text>

    <!-- KV Cache Store (FOCAL) -->
    <rect x="592" y="140" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="592" y="140" width="120" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="652" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">KV Cache</text>
    <text x="652" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">distributed store</text>

    <!-- Decode Pool -->
    <rect x="776" y="140" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="776" y="140" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="836" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Decode Pool</text>
    <text x="836" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4x A10G · cost-opt</text>

    <!-- Backends -->
    <rect x="552" y="340" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="552" y="340" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="652" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Inference Backends</text>
    <text x="652" y="384" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vLLM · SGLang · TensorRT-LLM</text>

    <!-- Legend -->
    <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="456" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="472" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="60" y="480" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">External / input</text>

    <rect x="216" y="472" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="236" y="480" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Worker / router</text>

    <rect x="392" y="472" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="412" y="480" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Focal / KV cache</text>

    <rect x="588" y="472" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="608" y="480" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Pluggable backend</text>
  </svg>