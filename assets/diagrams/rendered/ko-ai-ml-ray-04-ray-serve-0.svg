<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rayserve-title rayserve-desc">
  <title id="rayserve-title">Ray Serve 오토스케일링 흐름</title>
  <desc id="rayserve-desc">Ray Serve 요청 처리 파이프라인(클라이언트 → 인그레스 → 전처리·모델 추론 배포 → 응답)과, 그 위에서 동작하는 3단계 오토스케일링 감시 체인(Ray Serve Autoscaler → Ray/KubeRay Autoscaler → Karpenter)이 각각 replica 수, worker Pod 수, 노드 수를 순서대로 조정하는 관계를 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-muted-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7D8998"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- header -->
  <text x="32" y="28" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.14em">AI/ML · RAY SERVE</text>
  <text x="32" y="52" fill="#232F3E" font-size="20" font-weight="700">Ray Serve 오토스케일링 흐름</text>

  <!-- ===================== ZONE: Application ===================== -->
  <rect x="364" y="112" width="380" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="472" y="116" width="164" height="12" rx="2" fill="#ffffff"/>
  <text x="554" y="125" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">APPLICATION (ACTOR REPLICAS)</text>

  <!-- ===================== ARROWS (drawn before boxes) ===================== -->

  <!-- main request flow: solid -->
  <line x1="136" y1="176" x2="200" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="140" y="156" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="168" y="165" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">HTTP/gRPC</text>

  <line x1="332" y1="176" x2="380" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="540" y1="176" x2="560" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="720" y1="176" x2="792" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="732" y="156" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="756" y="165" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">응답</text>

  <!-- SA -> D1 / SA -> D2 : dashed monitoring, fanned attach points on SA top edge -->
  <path d="M 518,272 H 452 Q 460,272 460,264 V 208" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted-dash)"/>
  <path d="M 582,272 H 632 Q 640,272 640,264 V 208" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted-dash)"/>
  <rect x="480" y="240" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="550" y="249" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">큐 깊이 · 진행 요청 수 감시</text>

  <!-- RA -> SA : dashed vertical -->
  <line x1="550" y1="376" x2="550" y2="328" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted-dash)"/>
  <rect x="568" y="344" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="624" y="353" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">대기 중 actor 배치 감시</text>

  <!-- KP -> RA : dashed vertical -->
  <line x1="550" y1="480" x2="550" y2="432" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted-dash)"/>
  <rect x="568" y="448" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="628" y="457" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.04em">대기 중 worker Pod 감시</text>

  <!-- ===================== NODES ===================== -->

  <!-- Client -->
  <rect x="32" y="152" width="104" height="48" rx="6" fill="#ffffff"/>
  <rect x="32" y="152" width="104" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <rect x="40" y="158" width="32" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
  <text x="56" y="167" fill="rgba(125,137,152,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="84" y="184" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Client</text>

  <!-- Ingress -->
  <rect x="200" y="152" width="132" height="48" rx="6" fill="#ffffff"/>
  <rect x="200" y="152" width="132" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="208" y="158" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="230" y="167" fill="rgba(35,47,62,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">GATEWAY</text>
  <text x="266" y="184" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Ray Serve 인그레스</text>

  <!-- D1 전처리 -->
  <rect x="380" y="144" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="380" y="144" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="388" y="150" width="32" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
  <text x="404" y="159" fill="rgba(84,91,100,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
  <text x="460" y="180" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Deployment: 전처리</text>
  <text x="460" y="196" fill="#545B64" font-size="9" class="mono" text-anchor="middle">actor replicas</text>

  <!-- D2 모델 추론 -->
  <rect x="560" y="144" width="160" height="64" rx="6" fill="#ffffff"/>
  <rect x="560" y="144" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="568" y="150" width="32" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
  <text x="584" y="159" fill="rgba(84,91,100,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
  <text x="640" y="180" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Deployment: 모델 추론</text>
  <text x="640" y="196" fill="#545B64" font-size="9" class="mono" text-anchor="middle">actor replicas</text>

  <!-- Response -->
  <rect x="792" y="152" width="104" height="48" rx="6" fill="#ffffff"/>
  <rect x="792" y="152" width="104" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <rect x="800" y="158" width="24" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
  <text x="812" y="167" fill="rgba(125,137,152,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">OUT</text>
  <text x="844" y="184" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">클라이언트</text>

  <!-- SA : Ray Serve Autoscaler (focal) -->
  <rect x="450" y="272" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="450" y="272" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="458" y="278" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
  <text x="474" y="287" fill="#EC7211" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">AUTO</text>
  <text x="550" y="300" fill="#232F3E" font-size="12" font-weight="700" text-anchor="middle">Ray Serve Autoscaler</text>
  <text x="550" y="316" fill="#545B64" font-size="9" class="mono" text-anchor="middle">deployment별 replica 수</text>

  <!-- RA : Ray / KubeRay Autoscaler -->
  <rect x="450" y="376" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="450" y="376" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="458" y="382" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="474" y="391" fill="rgba(35,47,62,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">AUTO</text>
  <text x="550" y="404" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Ray / KubeRay Autoscaler</text>
  <text x="550" y="420" fill="#545B64" font-size="9" class="mono" text-anchor="middle">worker Pod 수</text>

  <!-- KP : Karpenter -->
  <rect x="450" y="480" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="450" y="480" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <rect x="458" y="486" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="474" y="495" fill="rgba(35,47,62,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">NODE</text>
  <text x="550" y="508" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Karpenter</text>
  <text x="550" y="524" fill="#545B64" font-size="9" class="mono" text-anchor="middle">노드 수 프로비저닝</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="32" y1="552" x2="928" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="568" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>

  <line x1="120" y1="565" x2="152" y2="565" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="160" y="568" fill="#545B64" font-size="9">요청 / 응답 흐름</text>

  <line x1="320" y1="565" x2="352" y2="565" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted-dash)"/>
  <text x="360" y="568" fill="#545B64" font-size="9">오토스케일링 감시 신호</text>

  <rect x="592" y="558" width="16" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="616" y="568" fill="#545B64" font-size="9">핵심 오토스케일러 (Ray Serve)</text>

</svg>