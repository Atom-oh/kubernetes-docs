<title id="en-service-mesh-linkerd-02-architecture-4-title">linkerd-proxy Internal Traffic Path</title>
<desc id="en-service-mesh-linkerd-02-architecture-4-desc">Architecture diagram showing traffic entering the linkerd-proxy sidecar through its inbound listener and TLS termination into the application, and application traffic leaving through the outbound listener, load balancer, and TLS origination back out, while the admin server exposes metrics.</desc>
