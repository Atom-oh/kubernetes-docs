<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Egress traffic path through the Istio service mesh</title>
<desc id="ddesc">A pod inside the service mesh sends outbound traffic through its Envoy sidecar proxy to the egress gateway, which is the single controlled exit point that forwards the request to an external service outside the mesh.</desc>
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
.sans { font-family: 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.mono { font-family: 'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0,0 L10,5 L0,10 z" fill="#545B64"/>
</marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0,0 L10,5 L0,10 z" fill="#EC7211"/>
</marker>
</defs>

<rect x="0" y="0" width="960" height="600" fill="#FFFFFF"/>

<!-- Title block -->
<text x="60" y="52" class="sans" font-size="20" font-weight="700" fill="#232F3E">Egress Traffic Flow</text>
<text x="60" y="74" class="mono" font-size="10" fill="#7D8998" letter-spacing="0.02em">POD → SIDECAR → EGRESS GATEWAY → EXTERNAL SERVICE</text>

<!-- Zone: Service Mesh (drawn before arrows/nodes) -->
<rect x="240" y="212" width="460" height="176" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="256" y="216" width="112" height="14" rx="2" fill="#FFFFFF"/>
<text x="312" y="226" class="mono" font-size="7" font-weight="500" fill="rgba(35,47,62,0.40)" text-anchor="middle" letter-spacing="0.14em">SERVICE MESH</text>

<!-- Arrows (behind nodes) -->
<line x1="200" y1="300" x2="278" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="440" y1="300" x2="518" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<line x1="682" y1="300" x2="758" y2="300" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- arrow labels -->
<text x="239" y="292" class="mono" font-size="8" fill="#545B64" text-anchor="middle" letter-spacing="0.06em">mTLS</text>
<text x="479" y="292" class="mono" font-size="8" fill="#545B64" text-anchor="middle" letter-spacing="0.06em">route</text>
<text x="720" y="292" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.06em">TLS orig.</text>

<!-- Node: Pod -->
<rect x="60" y="268" width="140" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="130" y="296" class="sans" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Pod</text>
<text x="130" y="312" class="mono" font-size="9" fill="#7D8998" text-anchor="middle">application</text>

<!-- Node: Sidecar -->
<rect x="280" y="268" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="360" y="294" class="sans" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Envoy Sidecar</text>
<text x="360" y="310" class="mono" font-size="9" fill="#7D8998" text-anchor="middle">intercepts outbound</text>

<!-- Node: Egress Gateway (focal) -->
<rect x="520" y="264" width="160" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="600" y="292" class="sans" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Egress Gateway</text>
<text x="600" y="308" class="mono" font-size="9" fill="#EC7211" text-anchor="middle">controlled exit point</text>

<!-- Node: External Service -->
<rect x="760" y="268" width="160" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="840" y="294" class="sans" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">External Service</text>
<text x="840" y="310" class="mono" font-size="9" fill="#7D8998" text-anchor="middle">api.external.com</text>

<!-- footer note -->
<text x="60" y="560" class="mono" font-size="8" fill="#7D8998" letter-spacing="0.04em">ServiceEntry registers the external host; the egress gateway is the single point where outbound policy and TLS origination are enforced.</text>

</svg>