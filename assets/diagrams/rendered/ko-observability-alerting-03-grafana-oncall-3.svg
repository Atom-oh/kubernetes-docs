<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="escalation-chain-title escalation-chain-desc">
    <title id="escalation-chain-title">에스컬레이션 체인 구조</title>
    <desc id="escalation-chain-desc">알림이 발생하면 현재 온콜, 2차 온콜, 팀 리드, 전체 팀 순으로 15분마다 응답 여부를 확인하며 단계적으로 에스컬레이션되고, 응답이 확인되면 알림이 해결되는 흐름을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows first -->
    <line x1="180" y1="56" x2="180" y2="72" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="180" y1="120" x2="180" y2="136" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M230,164 H447 Q455,164 455,172 V266 Q455,274 463,274 H680" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="180" y1="192" x2="180" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="180" y1="256" x2="180" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="230" y1="300" x2="680" y2="300" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="180" y1="328" x2="180" y2="344" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="180" y1="392" x2="180" y2="408" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M230,436 H447 Q455,436 455,428 V334 Q455,326 463,326 H680" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="180" y1="464" x2="180" y2="480" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Yes/No labels -->
    <rect x="380" y="152" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="395" y="162" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

    <rect x="188" y="194" width="26" height="12" rx="2" fill="#ffffff"/>
    <text x="201" y="204" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <rect x="440" y="284" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="455" y="294" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

    <rect x="188" y="330" width="26" height="12" rx="2" fill="#ffffff"/>
    <text x="201" y="340" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <rect x="380" y="392" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="395" y="402" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

    <rect x="188" y="466" width="26" height="12" rx="2" fill="#ffffff"/>
    <text x="201" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <!-- Node A: 알림 발생 (start, oval) -->
    <rect x="110" y="16" width="140" height="40" rx="20" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="40" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">알림 발생</text>

    <!-- Node B: Step 1 현재 온콜 -->
    <rect x="80" y="72" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="100" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Step 1: 현재 온콜</text>

    <!-- Node C: diamond 15분 내 응답? -->
    <polygon points="180,136 230,164 180,192 130,164" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="161" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">15분 내</text>
    <text x="180" y="173" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">응답?</text>

    <!-- Node E: Step 2 2차 온콜 -->
    <rect x="80" y="208" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="236" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Step 2: 2차 온콜</text>

    <!-- Node F: diamond -->
    <polygon points="180,272 230,300 180,328 130,300" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="297" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">15분 내</text>
    <text x="180" y="309" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">응답?</text>

    <!-- Node G: Step 3 팀 리드 -->
    <rect x="80" y="344" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="372" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Step 3: 팀 리드</text>

    <!-- Node H: diamond -->
    <polygon points="180,408 230,436 180,464 130,436" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="433" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">15분 내</text>
    <text x="180" y="445" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">응답?</text>

    <!-- Node I: Step 4 전체 팀 -->
    <rect x="80" y="480" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="508" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Step 4: 전체 팀</text>

    <!-- Node D: 알림 해결 (focal merge) -->
    <rect x="680" y="248" width="160" height="104" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="760" y="304" fill="#232F3E" font-size="13" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">알림 해결</text>

  </svg>