<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vcluster-gitops-title vcluster-gitops-desc">
<title id="vcluster-gitops-title">GitOps 기반 vCluster 배포</title>
<desc id="vcluster-gitops-desc">Backstage 셀프서비스 템플릿이 Git 저장소에 PR을 생성하면 ArgoCD ApplicationSet이 이를 감지해 두 개의 팀별 vCluster를 EKS 호스트 클러스터에 배포하는 GitOps 흐름을 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs><defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: ArgoCD -->
<rect x="460" y="140" width="380" height="184" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="616" y="144" width="68" height="12" rx="2" fill="#ffffff"/>
<text x="650" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ArgoCD</text>

<!-- Zone: EKS host -->
<rect x="460" y="344" width="380" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="600" y="348" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="650" y="357" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EKS 호스트</text>

