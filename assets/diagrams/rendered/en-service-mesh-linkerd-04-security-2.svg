<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nonmesh-title nonmesh-desc">
    <title id="nonmesh-title">Non-mesh traffic stays plaintext</title>
    <desc id="nonmesh-desc">Architecture diagram showing an external client outside the mesh sending plain HTTP to a mesh proxy, which forwards it unencrypted to the application because no peer identity exists to negotiate mTLS with.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="220" width="240" height="160" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="120" y="224" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="160" y="233" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL</text>

    <rect x="600" y="180" width="320" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="726" y="184" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="760" y="193" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MESH</text>

    <!-- Arrows -->
    <line x1="280" y1="300" x2="640" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="720" y1="328" x2="720" y2="356" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="424" y="286" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="460" y="296" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLAIN HTTP</text>
    <rect x="732" y="336" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="768" y="346" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLAIN HTTP</text>

    <!-- Nodes -->
    <rect x="80" y="272" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="80" y="272" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="180" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">External Client</text>
    <text x="180" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">outside mesh</text>

    <rect x="640" y="272" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="640" y="272" width="160" height="56" rx="6" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="720" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Proxy</text>
    <text x="720" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">inside mesh</text>

    <rect x="640" y="356" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="640" y="356" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    <text x="720" y="396" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workload</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="530" width="14" height="10" rx="2" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Mesh proxy detects no peer identity (focal)</text>
    <line x1="440" y1="535" x2="468" y2="535" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="476" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Unencrypted traffic</text>
  </svg>