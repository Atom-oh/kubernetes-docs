<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
    <title id="arch-title">Overall Istio telemetry architecture</title>
    <desc id="arch-desc">Envoy sidecars, configured by istiod, emit metrics, traces, and access logs to three separate backends, which all feed a shared Grafana and Kiali visualization layer.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="a-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="a-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows first (behind boxes) -->
    <!-- istiod -.-> Envoy Sidecars: dashed config push, same y, straight line -->
    <line x1="640" y1="168" x2="600" y2="168" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-arrow)"/>

    <!-- Envoy Sidecars -> Metrics (elbow, off-axis, accent) -->
    <path d="M420,216 V240 Q420,248 412,248 H248 Q240,248 240,256 V280"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#a-arrow-accent)"/>
    <!-- Envoy Sidecars -> Tracing (straight, shares x-axis) -->
    <line x1="480" y1="216" x2="480" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#a-arrow)"/>
    <!-- Envoy Sidecars -> Logging (elbow, off-axis) -->
    <path d="M540,216 V240 Q540,248 548,248 H712 Q720,248 720,256 V280"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#a-arrow)"/>

    <!-- Metrics -> Visualization (elbow) -->
    <path d="M240,392 V408 Q240,416 248,416 H392 Q400,416 400,424 V440"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#a-arrow)"/>
    <!-- Tracing -> Visualization (straight) -->
    <line x1="480" y1="392" x2="480" y2="440" stroke="#545B64" stroke-width="1.2" marker-end="url(#a-arrow)"/>
    <!-- Logging -> Visualization (elbow) -->
    <path d="M720,392 V408 Q720,416 712,416 H568 Q560,416 560,424 V440"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#a-arrow)"/>

    <!-- Node: Envoy Sidecars (data plane) -->
    <rect x="360" y="88" width="240" height="128" rx="6" fill="#ffffff"/>
    <rect x="360" y="88" width="240" height="128" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="372" y="100" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="388" y="109" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POD</text>
    <text x="480" y="134" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecars</text>
    <text x="480" y="150" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pod A ↔ Pod B</text>
    <line x1="376" y1="162" x2="584" y2="162" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="480" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mTLS between pods</text>
    <text x="480" y="198" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data plane</text>

    <!-- Node: istiod (control plane) -->
    <rect x="640" y="120" width="200" height="96" rx="6" fill="#ffffff"/>
    <rect x="640" y="120" width="200" height="96" rx="6" fill="rgba(70,107,176,0.08)" stroke="#232F3E" stroke-width="1"/>
    <rect x="652" y="132" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="666" y="141" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CP</text>
    <text x="740" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">istiod</text>
    <text x="740" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">telemetry config</text>
    <text x="740" y="198" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">control plane</text>

    <!-- Node: Metrics backend (focal) -->
    <rect x="140" y="280" width="200" height="112" rx="6" fill="#ffffff"/>
    <rect x="140" y="280" width="200" height="112" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="152" y="292" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="168" y="301" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MET</text>
    <text x="240" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics</text>
    <text x="240" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Prometheus</text>
    <text x="240" y="360" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OTel Collector</text>

    <!-- Node: Tracing backend -->
    <rect x="380" y="280" width="200" height="112" rx="6" fill="#ffffff"/>
    <rect x="380" y="280" width="200" height="112" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="392" y="292" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="406" y="301" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRC</text>
    <text x="480" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tracing</text>
    <text x="480" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Jaeger</text>
    <text x="480" y="360" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Grafana Tempo</text>

    <!-- Node: Logging backend -->
    <rect x="620" y="280" width="200" height="112" rx="6" fill="#ffffff"/>
    <rect x="620" y="280" width="200" height="112" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="632" y="292" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="646" y="301" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOG</text>
    <text x="720" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Logging</text>
    <text x="720" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Fluentd</text>
    <text x="720" y="360" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Grafana Loki</text>

    <!-- Node: Visualization -->
    <rect x="320" y="440" width="320" height="80" rx="6" fill="#ffffff"/>
    <rect x="320" y="440" width="320" height="80" rx="6" fill="rgba(248,181,42,0.10)" stroke="#232F3E" stroke-width="1"/>
    <rect x="332" y="452" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="346" y="461" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VIZ</text>
    <text x="480" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Visualization</text>
    <text x="480" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Grafana · Kiali</text>

    <!-- Arrow labels (masked, gap above stroke) -->
    <rect x="602" y="156" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="628" y="165" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">CONFIG</text>

    <rect x="374" y="256" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="400" y="265" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">METRICS</text>

    <rect x="454" y="256" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="265" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">TRACES</text>

    <rect x="654" y="256" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="686" y="265" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">ACCESS LOGS</text>

    <!-- Legend -->
    <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="560" x2="164" y2="560" stroke="#545B64" stroke-width="1.2" marker-end="url(#a-arrow)"/>
    <text x="172" y="564" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Telemetry export</text>
    <line x1="340" y1="560" x2="364" y2="560" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-arrow)"/>
    <text x="372" y="564" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Config push</text>
    <line x1="540" y1="560" x2="564" y2="560" stroke="#EC7211" stroke-width="1.2" marker-end="url(#a-arrow-accent)"/>
    <text x="572" y="564" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Primary data store</text>
  </svg>