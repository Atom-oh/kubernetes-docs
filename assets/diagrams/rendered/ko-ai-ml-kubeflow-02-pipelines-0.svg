<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kfp-pipeline-title kfp-pipeline-desc">
  <title id="kfp-pipeline-title">Kubeflow Pipelines 실행 흐름</title>
  <desc id="kfp-pipeline-desc">Kubeflow Pipelines 실행 흐름: Python SDK 파이프라인이 IR YAML로 컴파일되어 API 서버에 제출되고, 백엔드가 이를 Argo Workflow로 변환·실행하며, 실행된 컴포넌트 Pod가 아티팩트는 오브젝트 스토어에, 실행 및 아티팩트 메타데이터는 MLMD에 기록하는 8단계 과정을 보여준다.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="28" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7D8998">KUBEFLOW PIPELINES</text>
  <text x="40" y="56" font-size="20" font-weight="700" fill="#232F3E">파이프라인 실행 흐름</text>
  <text x="40" y="76" font-size="12" fill="#545B64">Python SDK 컴파일부터 아티팩트 · 메타데이터 기록까지 8단계</text>

  <!-- ===== Connectors (drawn before nodes) ===== -->
  <!-- A -> B -->
  <line x1="328" y1="156" x2="368" y2="156" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- B -> C -->
  <line x1="592" y1="156" x2="632" y2="156" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- C -> D (straight vertical) -->
  <line x1="744" y1="200" x2="744" y2="272" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- D -> E -->
  <line x1="632" y1="316" x2="592" y2="316" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- E -> F (accent: leads into focal hub) -->
  <line x1="368" y1="316" x2="328" y2="316" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- F -> G (accent, elbow) -->
  <path d="M180,360 V388 Q180,396 188,396 H208 Q216,396 216,404 V432"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- F -> H (accent, elbow) -->
  <path d="M252,360 V388 Q252,396 260,396 H504 Q512,396 512,404 V432"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- G -> H -->
  <line x1="344" y1="476" x2="384" y2="476" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===== Nodes ===== -->

  <!-- A: Python 파이프라인 -->
  <rect x="104" y="112" width="224" height="88" rx="6" fill="#ffffff"/>
  <rect x="104" y="112" width="224" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="112" y="120" width="20" height="14" rx="2" fill="transparent" stroke="#232F3E" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="122" y="130" class="mono" font-size="7" letter-spacing="0.06em" text-anchor="middle" fill="#232F3E" fill-opacity="0.8">1</text>
  <text x="216" y="150" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Python 파이프라인</text>
  <text x="216" y="168" class="mono" font-size="8" text-anchor="middle" fill="#545B64">@dsl.pipeline /</text>
  <text x="216" y="180" class="mono" font-size="8" text-anchor="middle" fill="#545B64">@dsl.component</text>

  <!-- B: KFP SDK 컴파일러 -->
  <rect x="368" y="112" width="224" height="88" rx="6" fill="#ffffff"/>
  <rect x="368" y="112" width="224" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="376" y="120" width="20" height="14" rx="2" fill="transparent" stroke="#232F3E" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="386" y="130" class="mono" font-size="7" letter-spacing="0.06em" text-anchor="middle" fill="#232F3E" fill-opacity="0.8">2</text>
  <text x="480" y="154" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">KFP SDK 컴파일러</text>
  <text x="480" y="174" class="mono" font-size="8" text-anchor="middle" fill="#545B64">IR YAML 생성</text>

  <!-- C: KFP API 서버 -->
  <rect x="632" y="112" width="224" height="88" rx="6" fill="#ffffff"/>
  <rect x="632" y="112" width="224" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="640" y="120" width="20" height="14" rx="2" fill="transparent" stroke="#232F3E" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="650" y="130" class="mono" font-size="7" letter-spacing="0.06em" text-anchor="middle" fill="#232F3E" fill-opacity="0.8">3</text>
  <text x="744" y="154" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">KFP API 서버</text>
  <text x="744" y="174" class="mono" font-size="8" text-anchor="middle" fill="#545B64">파이프라인 저장 · Run 접수</text>

  <!-- D: IR YAML -> Argo Workflow 변환 -->
  <rect x="632" y="272" width="224" height="88" rx="6" fill="#ffffff"/>
  <rect x="632" y="272" width="224" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="640" y="280" width="20" height="14" rx="2" fill="transparent" stroke="#232F3E" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="650" y="290" class="mono" font-size="7" letter-spacing="0.06em" text-anchor="middle" fill="#232F3E" fill-opacity="0.8">4</text>
  <text x="744" y="310" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">IR YAML → Argo</text>
  <text x="744" y="326" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Workflow 변환</text>
  <text x="744" y="344" class="mono" font-size="8" text-anchor="middle" fill="#545B64">백엔드 처리</text>

  <!-- E: Argo Workflow 컨트롤러 -->
  <rect x="368" y="272" width="224" height="88" rx="6" fill="#ffffff"/>
  <rect x="368" y="272" width="224" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="376" y="280" width="20" height="14" rx="2" fill="transparent" stroke="#232F3E" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="386" y="290" class="mono" font-size="7" letter-spacing="0.06em" text-anchor="middle" fill="#232F3E" fill-opacity="0.8">5</text>
  <text x="480" y="310" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Argo Workflow</text>
  <text x="480" y="326" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">컨트롤러</text>
  <text x="480" y="344" class="mono" font-size="8" text-anchor="middle" fill="#545B64">단계 스케줄링</text>

  <!-- F: 컴포넌트 Pod 실행 (focal hub) -->
  <rect x="104" y="272" width="224" height="88" rx="6" fill="#ffffff"/>
  <rect x="104" y="272" width="224" height="88" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="112" y="280" width="20" height="14" rx="2" fill="transparent" stroke="#EC7211" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="122" y="290" class="mono" font-size="7" letter-spacing="0.06em" text-anchor="middle" fill="#EC7211" fill-opacity="0.9">6</text>
  <text x="216" y="314" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">컴포넌트 Pod 실행</text>
  <text x="216" y="334" class="mono" font-size="8" text-anchor="middle" fill="#545B64">실행 단계 허브</text>

  <!-- G: 아티팩트 -> 오브젝트 스토어 -->
  <rect x="88" y="432" width="256" height="88" rx="6" fill="#ffffff"/>
  <rect x="88" y="432" width="256" height="88" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="96" y="440" width="20" height="14" rx="2" fill="transparent" stroke="#545B64" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="106" y="450" class="mono" font-size="7" letter-spacing="0.06em" text-anchor="middle" fill="#545B64" fill-opacity="0.9">7</text>
  <text x="216" y="474" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">오브젝트 스토어 기록</text>
  <text x="216" y="494" class="mono" font-size="8" text-anchor="middle" fill="#545B64">S3 / MinIO</text>

  <!-- H: 메타데이터 -> MLMD -->
  <rect x="384" y="432" width="256" height="88" rx="6" fill="#ffffff"/>
  <rect x="384" y="432" width="256" height="88" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="392" y="440" width="20" height="14" rx="2" fill="transparent" stroke="#545B64" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="402" y="450" class="mono" font-size="7" letter-spacing="0.06em" text-anchor="middle" fill="#545B64" fill-opacity="0.9">8</text>
  <text x="512" y="474" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">실행 · 아티팩트 메타데이터 기록</text>
  <text x="512" y="494" class="mono" font-size="8" text-anchor="middle" fill="#545B64">MLMD</text>

  <!-- Footer caption -->
  <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="570" font-style="italic" font-size="13" fill="#545B64">6단계 &quot;컴포넌트 Pod 실행&quot;이 흐름의 허브다 — 이 지점에서 아티팩트는 오브젝트 스토어로, 실행 · 아티팩트 메타데이터는 MLMD로 갈라져 기록된다.</text>
</svg>
