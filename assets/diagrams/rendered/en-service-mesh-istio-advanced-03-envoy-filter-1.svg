<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 340" role="img" aria-labelledby="xffs1-title xffs1-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="xffs1-title">XFF chain: Client through ALB to Istio Gateway</title>
    <desc id="xffs1-desc">Flowchart showing a client request passing through a single AWS ALB before reaching the Istio Gateway and application, with the X-Forwarded-For header gaining one hop at the ALB.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="340" fill="#ffffff"/>

    <!-- centers: Client 96,y164 ; ALB 352,164 ; Gateway 608,164 ; App 864,164 ; boxes 160x64 -->
    <path d="M176,164 H272" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="188" y="132" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="224" y="141" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">XFF: NONE</text>

    <path d="M432,164 H528" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="432" y="132" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="141" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">XFF: ...113.5</text>

    <path d="M688,164 H784" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="656" y="132" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="744" y="141" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">XFF: ...113.5, 10.0.1.100</text>

    <!-- nodes -->
    <g>
      <rect x="16" y="132" width="160" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="#7D8998" stroke-width="1"/>
      <text x="96" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
      <text x="96" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">203.0.113.5</text>
    </g>
    <g>
      <rect x="272" y="132" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="352" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS ALB</text>
      <text x="352" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.1.100</text>
    </g>
    <g>
      <rect x="528" y="132" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="608" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio Gateway</text>
      <text x="608" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.2.50</text>
    </g>
    <g>
      <rect x="784" y="132" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="864" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    </g>

    <!-- legend -->
    <line x1="30" y1="240" x2="930" y2="240" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="258" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="130" y1="254" x2="160" y2="254" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="168" y="258" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Request hop</text>
    <line x1="300" y1="254" x2="330" y2="254" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="338" y="258" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Final hop received by app (xff_num_trusted_hops: 1)</text>
  </svg>