    <title id="ko-core-05-configuration-secrets-4-title">볼륨을 통한 구성 마운트 경로</title>
    <desc id="ko-core-05-configuration-secrets-4-desc">파드가 정의한 볼륨을 컨테이너가 볼륨 마운트를 통해 참조하고, 그 볼륨이 ConfigMap 또는 Secret을 원본으로 삼아 전체·특정 키·읽기 전용·서브패스 등의 마운트 옵션을 지원함을 보여준다.</desc>
