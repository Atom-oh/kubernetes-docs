<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mimir-lineage-title mimir-lineage-desc">
<title id="mimir-lineage-title">Mimir, Cortex, and Thanos lineage</title>
<desc id="mimir-lineage-desc">Mimir evolved from Cortex and shares its centralized remote-write approach, while Thanos took a separate sidecar-based federated-query path.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- zones -->
<rect x="40" y="76" width="880" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="60" y="80" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="98" y="89" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">EVOLUTION</text>

<rect x="40" y="332" width="880" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="60" y="336" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="96" y="345" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">APPROACH</text>

<!-- arrows (drawn before nodes) -->
<!-- Cortex -> Mimir (evolved into), same y, accent -->
<line x1="280" y1="152" x2="420" y2="152" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="316" y="132" width="68" height="12" rx="2" fill="#ffffff"/>
<text x="350" y="141" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">EVOLVED</text>

<!-- Cortex -> Centralized Remote Write (dashed), fan attach 1 -->
<path d="M200,184 V274 Q200,282 208,282 H320 Q328,282 328,290 V380" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Mimir -> Centralized Remote Write (dashed), fan attach 2 -->
<path d="M500,184 V274 Q500,282 492,282 H400 Q392,282 392,290 V380" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Thanos -> Sidecar-based Federated Query (dashed) -->
<path d="M760,184 V274 Q760,282 752,282 H738 Q730,282 730,290 V380" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<rect x="608" y="234" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="644" y="243" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">USES</text>

<!-- Nodes: Cortex (predecessor) -->
<rect x="120" y="120" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="120" y="120" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="200" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cortex</text>
<text x="200" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">2016 · predecessor</text>

<!-- Mimir (focal) -->
<rect x="420" y="120" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="420" y="120" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="500" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Mimir</text>
<text x="500" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">2022 · successor</text>

<!-- Thanos -->
<rect x="680" y="120" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="680" y="120" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="760" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Thanos</text>
<text x="760" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">2017 · sidecar-based</text>

<!-- Centralized Remote Write -->
<rect x="260" y="380" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="260" y="380" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="360" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Centralized</text>
<text x="360" y="424" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Remote Write</text>
<text x="360" y="438" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">approach</text>

<!-- Sidecar-based Federated Query -->
<rect x="620" y="380" width="220" height="64" rx="6" fill="#ffffff"/>
<rect x="620" y="380" width="220" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="730" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sidecar-based</text>
<text x="730" y="424" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Federated Query</text>
<text x="730" y="438" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">approach</text>

<!-- legend -->
<line x1="60" y1="536" x2="900" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="60" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="180" y1="548" x2="212" y2="548" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="220" y="552" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">evolved into</text>
<line x1="360" y1="548" x2="392" y2="548" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="400" y="552" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">uses approach</text>
<rect x="580" y="542" width="14" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="602" y="552" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Mimir (focal)</text>

</svg>