<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="phased-title phased-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="phased-title">Three-phase roadmap from basic CloudWatch monitoring to advanced OpenTelemetry and eBPF observability</title>
    <desc id="phased-desc">A three-phase adoption path: Phase 1 uses CloudWatch-only basics, Phase 2 layers on the Prometheus/Grafana and Loki/X-Ray stack, and Phase 3 arrives at OpenTelemetry, eBPF monitoring, and cost monitoring as the advanced end state.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ===== Connectors ===== -->
    <path d="M 300,290 H 340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 620,290 H 660" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- ===== Phase 1 ===== -->
    <rect x="20" y="100" width="280" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
    <text x="160" y="128" fill="#232F3E" font-size="14" font-weight="700"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Phase 1 · Basic</text>
    <line x1="40" y1="144" x2="280" y2="144" stroke="rgba(35,47,62,0.15)" stroke-width="1"/>
    <text x="40" y="172" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">— CloudWatch Logs</text>
    <text x="40" y="196" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">— CloudWatch Metrics</text>
    <text x="40" y="220" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">— Container Insights</text>
    <text x="40" y="456" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace">1–2 DAYS · COST: LOW</text>

    <!-- ===== Phase 2 ===== -->
    <rect x="340" y="100" width="280" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
    <text x="480" y="128" fill="#232F3E" font-size="14" font-weight="700"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Phase 2 · Intermediate</text>
    <line x1="360" y1="144" x2="600" y2="144" stroke="rgba(35,47,62,0.15)" stroke-width="1"/>
    <text x="360" y="172" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">— Prometheus + Grafana</text>
    <text x="360" y="196" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">— Fluent Bit + Loki</text>
    <text x="360" y="220" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">— X-Ray Tracing</text>
    <text x="360" y="456" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace">1–2 WEEKS · COST: MEDIUM</text>

    <!-- ===== Phase 3 (focal end state) ===== -->
    <rect x="660" y="100" width="280" height="380" rx="8" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="800" y="128" fill="#232F3E" font-size="14" font-weight="700"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Phase 3 · Advanced</text>
    <line x1="680" y1="144" x2="920" y2="144" stroke="rgba(236,114,17,0.30)" stroke-width="1"/>
    <text x="680" y="172" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">— VictoriaMetrics / AMP</text>
    <text x="680" y="196" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">— OpenTelemetry</text>
    <text x="680" y="220" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">— eBPF Monitoring</text>
    <text x="680" y="244" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">— Cost Monitoring</text>
    <text x="680" y="456" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace">2–4 WEEKS · COST: HIGH</text>

    <!-- Legend -->
    <line x1="24" y1="520" x2="936" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="538" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="535" x2="172" y2="535" stroke="#EC7211" stroke-width="1.2"/>
    <text x="182" y="538" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Target end-state phase</text>
  </svg>