<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
  <title id="d0-title">Kubernetes 서비스 유형과 액세스 방법</title>
  <desc id="d0-desc">ClusterIP, NodePort, LoadBalancer, ExternalName 네 가지 Kubernetes 서비스 유형이 각각 클러스터 내부, 노드 IP:포트, 외부 로드 밸런서, DNS CNAME이라는 접근 방법에 1대1로 대응됨을 보여준다.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="d0-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="d0-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="40" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">ARCHITECTURE</text>
  <text x="40" y="60" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">서비스 유형 → 접근 방법</text>

  <!-- Zones -->
  <rect x="40" y="80" width="320" height="400" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="148" y="84" width="104" height="12" rx="2" fill="#ffffff"/>
  <text x="200" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE TYPE</text>

  <rect x="560" y="80" width="320" height="400" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="668" y="84" width="104" height="12" rx="2" fill="#ffffff"/>
  <text x="720" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">ACCESS METHOD</text>

  <!-- Arrows (behind boxes) -->
  <line x1="340" y1="144" x2="580" y2="144" stroke="#545B64" stroke-width="1.2" marker-end="url(#d0-arrow)"/>
  <line x1="340" y1="240" x2="580" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#d0-arrow)"/>
  <line x1="340" y1="336" x2="580" y2="336" stroke="#EC7211" stroke-width="1.4" marker-end="url(#d0-arrow-accent)"/>
  <line x1="340" y1="432" x2="580" y2="432" stroke="#545B64" stroke-width="1.2" marker-end="url(#d0-arrow)"/>

  <!-- Left column nodes -->
  <!-- ClusterIP -->
  <rect x="60" y="112" width="280" height="64" rx="6" fill="#ffffff"/>
  <rect x="60" y="112" width="280" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="68" y="120" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="84" y="129" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
  <text x="200" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ClusterIP</text>
  <text x="200" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">internal-only</text>

  <!-- NodePort -->
  <rect x="60" y="208" width="280" height="64" rx="6" fill="#ffffff"/>
  <rect x="60" y="208" width="280" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="68" y="216" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="84" y="225" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
  <text x="200" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">NodePort</text>
  <text x="200" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">node-ip:port</text>

  <!-- LoadBalancer (focal) -->
  <rect x="60" y="304" width="280" height="64" rx="6" fill="#ffffff"/>
  <rect x="60" y="304" width="280" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <rect x="68" y="312" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
  <text x="84" y="321" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
  <text x="200" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">LoadBalancer</text>
  <text x="200" y="356" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">provisions cloud LB</text>

  <!-- ExternalName -->
  <rect x="60" y="400" width="280" height="64" rx="6" fill="#ffffff"/>
  <rect x="60" y="400" width="280" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="68" y="408" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="84" y="417" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
  <text x="200" y="436" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ExternalName</text>
  <text x="200" y="452" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">returns CNAME</text>

  <!-- Right column nodes -->
  <rect x="580" y="112" width="280" height="64" rx="6" fill="#ffffff"/>
  <rect x="580" y="112" width="280" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="#7D8998" stroke-width="1"/>
  <text x="720" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">클러스터 내부</text>
  <text x="720" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">in-cluster only</text>

  <rect x="580" y="208" width="280" height="64" rx="6" fill="#ffffff"/>
  <rect x="580" y="208" width="280" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="#7D8998" stroke-width="1"/>
  <text x="720" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">노드 IP:포트</text>
  <text x="720" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">every node, fixed port</text>

  <rect x="580" y="304" width="280" height="64" rx="6" fill="#ffffff"/>
  <rect x="580" y="304" width="280" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="720" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">외부 로드 밸런서</text>
  <text x="720" y="356" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">internet-facing</text>

  <rect x="580" y="400" width="280" height="64" rx="6" fill="#ffffff"/>
  <rect x="580" y="400" width="280" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="#7D8998" stroke-width="1"/>
  <text x="720" y="436" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">DNS CNAME</text>
  <text x="720" y="452" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">points to external host</text>

  <!-- Legend -->
  <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="532" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="140" y="524" width="16" height="12" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="164" y="533" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">서비스 유형</text>
  <rect x="300" y="524" width="16" height="12" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="324" y="533" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">가장 흔히 쓰는 유형</text>
</svg>