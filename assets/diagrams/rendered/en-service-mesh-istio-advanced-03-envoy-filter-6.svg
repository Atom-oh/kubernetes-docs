<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="xffopflow-title xffopflow-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="xffopflow-title">Request flow showing per-app authorization after Gateway IP extraction</title>
    <desc id="xffopflow-desc">Sequence diagram of a single client request traveling through an ALB and Istio Gateway, where the Gateway extracts the real client IP once and forwards it to two apps — one with no AuthorizationPolicy that returns 200 OK, and one with an IP-restriction policy that returns 403 Forbidden for the same client.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#7D8998"/>
      </marker>
      <marker id="arrow-deny" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#DD344C"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Lifelines: Client 96, ALB 296, Gateway 496, AppA 696, AppF 880 -->
    <line x1="96" y1="96" x2="96" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="296" y1="96" x2="296" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="496" y1="96" x2="496" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="696" y1="96" x2="696" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="880" y1="96" x2="880" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Note over Gateway: configured with EnvoyFilter -->
    <rect x="408" y="112" width="176" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
    <text x="496" y="123" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">XFF CONFIGURED VIA</text>
    <text x="496" y="133" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ENVOYFILTER</text>

    <!-- 1: Client -> ALB -->
    <path d="M96,168 H296" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="150" y="148" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="196" y="157" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP REQUEST</text>

    <!-- 2: ALB -> Gateway -->
    <path d="M296,220 H496" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="342" y="200" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="396" y="209" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">XFF: 1.2.3.4, ALB</text>

    <!-- Note over Gateway: extract -->
    <rect x="404" y="232" width="184" height="24" rx="4" fill="rgba(255,153,0,0.06)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8"/>
    <text x="496" y="243" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TRUSTED HOPS: 1</text>
    <text x="496" y="253" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">-&gt; REAL IP: 1.2.3.4</text>

    <!-- 3: Gateway -> AppA (accent, headline) -->
    <path d="M496,304 H696" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="546" y="284" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="596" y="293" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">IP: 1.2.3.4</text>

    <!-- Note over AppA -->
    <rect x="608" y="316" width="176" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
    <text x="696" y="327" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO AUTHZPOLICY</text>
    <text x="696" y="337" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">-&gt; ALL IPS ALLOWED</text>

    <!-- 4: AppA -> Gateway return (dashed, filled) -->
    <path d="M696,368 H496" fill="none" stroke="#7D8998" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-return)"/>
    <rect x="546" y="376" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="584" y="385" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200 OK</text>

    <!-- 5: Gateway -> AppF -->
    <path d="M496,420 H880" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="738" y="400" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="788" y="409" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">IP: 1.2.3.4</text>

    <!-- Note over AppF -->
    <rect x="792" y="432" width="184" height="36" rx="4" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <text x="884" y="446" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">203.0.113.0/24 ONLY</text>
    <text x="884" y="458" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">-&gt; 1.2.3.4 DENIED</text>

    <!-- 6: AppF -> Gateway return, deny -->
    <path d="M880,500 H496" fill="none" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-deny)"/>
    <rect x="644" y="480" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="688" y="489" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">403 FORBIDDEN</text>

    <!-- Actor boxes -->
    <g>
      <rect x="40" y="48" width="112" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="#7D8998" stroke-width="1"/>
      <text x="96" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
      <text x="96" y="82" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1.2.3.4</text>
    </g>
    <g>
      <rect x="240" y="48" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="296" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ALB</text>
    </g>
    <g>
      <rect x="440" y="48" width="112" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="496" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio Gateway</text>
      <text x="496" y="82" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">XFF extraction</text>
    </g>
    <g>
      <rect x="640" y="48" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="696" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App A</text>
      <text x="696" y="82" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unrestricted</text>
    </g>
    <g>
      <rect x="824" y="48" width="112" height="48" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="880" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App F</text>
      <text x="880" y="82" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">IP-restricted</text>
    </g>

    <!-- legend -->
    <line x1="30" y1="530" x2="930" y2="530" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="548" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="544" x2="170" y2="544" stroke="#7D8998" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-return)"/>
    <text x="178" y="548" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Allowed return</text>
    <line x1="330" y1="544" x2="360" y2="544" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-deny)"/>
    <text x="368" y="548" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Denied by AuthorizationPolicy</text>
  </svg>