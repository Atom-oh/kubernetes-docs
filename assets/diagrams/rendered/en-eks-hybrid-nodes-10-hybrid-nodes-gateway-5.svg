<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="hng-multiaz-title hng-multiaz-desc">
    <title id="hng-multiaz-title">Multi-AZ gateway pod failover setup</title>
    <desc id="hng-multiaz-desc">Architecture diagram showing a leader gateway pod in Availability Zone A holding the Kubernetes lease, managing the CiliumVTEPConfig, and programming the VPC route table, while a standby gateway pod in Availability Zone B monitors the lease for takeover.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones: AZ A (top-left), AZ B (top-right) -->
    <rect x="60" y="72" width="280" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="150" y="76" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AZ · A</text>

    <rect x="620" y="72" width="280" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="710" y="76" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="760" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AZ · B</text>

    <!-- Arrows -->
    <!-- GW1 -> Lease (holds) -->
    <path d="M 200,152 V 300 Q 200,308 208,308 H 400" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- GW1 -> VTEP (manages) -->
    <path d="M 240,120 H 460 Q 468,120 468,128 V 356" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- GW1 -> RT (programs) -->
    <path d="M 220,184 V 448 Q 220,456 228,456 H 400" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- GW2 -.-> Lease (monitors) -->
    <path d="M 760,184 V 300 Q 760,308 752,308 H 640" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="176" y="260" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="269" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOLDS</text>

    <rect x="356" y="132" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="384" y="141" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MANAGES</text>

    <rect x="196" y="416" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="222" y="425" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROGRAMS</text>

    <rect x="700" y="260" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="730" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MONITORS</text>

    <!-- Node: Gateway Pod 1 (Leader) — focal -->
    <rect x="88" y="88" width="224" height="64" rx="6" fill="#ffffff"/>
    <rect x="88" y="88" width="224" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="96" y="96" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,113,17,0.50)" stroke-width="0.8"/>
    <text x="112" y="105" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LDR</text>
    <text x="200" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway Pod 1 (Leader)</text>
    <text x="200" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ip-10-0-1-100</text>
    <text x="200" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eni-abc123</text>

    <!-- Node: Gateway Pod 2 (Standby) -->
    <rect x="648" y="88" width="224" height="64" rx="6" fill="#ffffff"/>
    <rect x="648" y="88" width="224" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="656" y="96" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="676" y="105" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STBY</text>
    <text x="768" y="120" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway Pod 2 (Standby)</text>
    <text x="768" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ip-10-0-2-200</text>
    <text x="768" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eni-def456</text>

    <!-- Node: Kubernetes Lease -->
    <rect x="400" y="280" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="280" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="408" y="288" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="422" y="297" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
    <text x="480" y="312" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes Lease</text>
    <text x="480" y="327" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">holder: gateway-pod-1</text>

    <!-- Node: CiliumVTEPConfig -->
    <rect x="400" y="356" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="356" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="408" y="364" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="422" y="373" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRD</text>
    <text x="480" y="388" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CiliumVTEPConfig</text>
    <text x="480" y="403" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vtepIPs: [10.0.1.100]</text>

    <!-- Node: VPC Route Table -->
    <rect x="400" y="432" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="432" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="408" y="440" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="422" y="449" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RT</text>
    <text x="480" y="464" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC Route Table</text>
    <text x="480" y="479" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.100.0.0/20→eni-abc123</text>

    <!-- Legend -->
    <line x1="60" y1="512" x2="900" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="60" y="544" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="80" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Leader / focal</text>

    <rect x="220" y="544" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="240" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Standby</text>

    <line x1="360" y1="550" x2="388" y2="550" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="396" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Active management</text>

    <line x1="560" y1="550" x2="588" y2="550" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="596" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Passive watch</text>
  </svg>