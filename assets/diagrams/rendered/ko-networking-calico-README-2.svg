<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc">
    <title id="d2-title">네트워킹 모드 선택</title>
    <desc id="d2-desc">BGP 사용 가능 여부, 클라우드 환경, 서브넷 일치 여부를 차례로 물어 Direct·VXLAN·CrossSubnet·IPIP 중 적합한 Calico 네트워킹 모드로 안내하는 의사결정 트리이며, BGP가 가능한 Direct 모드가 최고 성능의 권장 경로다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows (before nodes) -->
    <line x1="480" y1="88" x2="480" y2="120" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Q1 Yes -> DIRECT (accent, happy path) -->
    <line x1="560" y1="160" x2="680" y2="160" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Q1 No -> Q2 -->
    <line x1="480" y1="200" x2="480" y2="240" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Q2 Azure -> VXLAN -->
    <line x1="560" y1="280" x2="680" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Q2 AWS/GCP -> Q3 -->
    <line x1="480" y1="320" x2="480" y2="360" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Q3 Yes -> CROSS -->
    <line x1="560" y1="400" x2="680" y2="400" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Q3 No -> IPIP -->
    <line x1="480" y1="440" x2="480" y2="464" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="602" y="148" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="617" y="157" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">YES</text>

    <rect x="464" y="208" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="217" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NO</text>

    <rect x="598" y="268" width="38" height="12" rx="2" fill="#ffffff"/>
    <text x="617" y="277" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AZURE</text>

    <rect x="458" y="328" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="337" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AWS/GCP</text>

    <rect x="602" y="388" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="617" y="397" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">YES</text>

    <rect x="464" y="448" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="457" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NO</text>

    <!-- START oval -->
    <rect x="400" y="40" width="160" height="48" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">시작</text>

    <!-- Q1 diamond -->
    <polygon points="480,120 560,160 480,200 400,160" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="157" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">BGP 사용</text>
    <text x="480" y="170" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">가능?</text>

    <!-- DIRECT (focal, happy path terminal) -->
    <rect x="680" y="136" width="160" height="48" rx="24" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="760" y="158" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Direct 모드</text>
    <text x="760" y="172" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">최고 성능</text>

    <!-- Q2 diamond -->
    <polygon points="480,240 560,280 480,320 400,280" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="277" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">클라우드</text>
    <text x="480" y="290" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">환경?</text>

    <!-- VXLAN terminal -->
    <rect x="680" y="256" width="160" height="48" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="760" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VXLAN 모드</text>
    <text x="760" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">광범위 호환</text>

    <!-- Q3 diamond -->
    <polygon points="480,360 560,400 480,440 400,400" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="397" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">같은</text>
    <text x="480" y="410" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">서브넷?</text>

    <!-- CROSS terminal -->
    <rect x="680" y="376" width="160" height="48" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="760" y="398" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CrossSubnet</text>
    <text x="760" y="412" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">하이브리드</text>

    <!-- IPIP terminal -->
    <rect x="400" y="464" width="160" height="48" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="486" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">IPIP 모드</text>
    <text x="480" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">효율적 캡슐화</text>

    <!-- Legend -->
    <line x1="24" y1="540" x2="936" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

    <rect x="24" y="572" width="24" height="12" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="56" y="582" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">시작 / 종료</text>

    <polygon points="196,566 212,578 196,590 180,578" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="582" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">결정 (diamond)</text>

    <line x1="356" y1="578" x2="384" y2="578" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="392" y="582" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">권장 경로</text>

    <line x1="520" y1="578" x2="548" y2="578" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="556" y="582" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">분기</text>
  </svg>