<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4-title d4-desc">
      <title id="d4-title">Layer-based observability strategy for EKS</title>
      <desc id="d4-desc">Infrastructure, Kubernetes, and application layers each feed their signals into a matching observability tool: infrastructure metrics go to CloudWatch, cluster and business metrics go to Prometheus and Grafana, and application logs and traces go to Loki and Tempo or X-Ray.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>
      <rect width="960" height="600" fill="#ffffff"/>

      <!-- Zone: Layers -->
      <rect x="32" y="80" width="280" height="400" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="112" y="84" width="120" height="12" rx="2" fill="#ffffff"/>
      <text x="172" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">EKS LAYERS</text>

      <!-- Zone: Tools (focal) -->
      <rect x="648" y="80" width="280" height="400" rx="8" fill="rgba(255,153,0,0.05)" stroke="#EC7211" stroke-width="0.8"/>
      <rect x="708" y="84" width="160" height="12" rx="2" fill="#ffffff"/>
      <text x="788" y="93" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">OBSERVABILITY TOOLS</text>

      <!-- Layer nodes -->
      <g>
        <rect x="56" y="120" width="232" height="76" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="172" y="152" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Infrastructure Layer</text>
        <text x="172" y="168" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">EC2/Fargate · VPC · EBS</text>
      </g>
      <g>
        <rect x="56" y="252" width="232" height="76" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="172" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Kubernetes Layer</text>
        <text x="172" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">kube-state · node-exporter</text>
      </g>
      <g>
        <rect x="56" y="384" width="232" height="76" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="172" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Application Layer</text>
        <text x="172" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">business metrics · logs · traces</text>
      </g>

      <!-- Tool nodes -->
      <g>
        <rect x="672" y="112" width="232" height="60" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
        <text x="788" y="146" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">CloudWatch</text>
      </g>
      <g>
        <rect x="672" y="204" width="232" height="60" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
        <text x="788" y="238" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Prometheus / Grafana</text>
      </g>
      <g>
        <rect x="672" y="296" width="232" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="788" y="330" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Loki</text>
      </g>
      <g>
        <rect x="672" y="388" width="232" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="788" y="422" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Tempo / X-Ray</text>
      </g>

      <!-- Arrows: Infra -> CloudWatch -->
      <path d="M 288,158 H 480 Q 488,158 488,150 V 148 Q 488,142 496,142 H 672"
            fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrows: K8s -> Prometheus/Grafana -->
      <line x1="288" y1="290" x2="672" y2="234" stroke="#545B64" stroke-width="0" opacity="0"/>
      <path d="M 288,290 H 620 Q 628,290 628,282 V 250 Q 628,242 636,242 H 672"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrows: App -> Prometheus/Grafana AND App -> Loki AND App -> Tempo/X-Ray (fan from same edge, offset attach points) -->
      <path d="M 288,406 H 596 Q 604,406 604,398 V 250 Q 604,242 612,242 H 672"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 288,422 H 648 Q 656,422 656,414 V 342 Q 656,334 664,334 H 672"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 288,438 H 672" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Legend -->
      <line x1="32" y1="500" x2="928" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="32" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="32" y="526" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="52" y="534" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">AWS-native path</text>

      <line x1="220" y1="531" x2="248" y2="531" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="256" y="534" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">OSS path</text>
    </svg>