<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="canary-traffic-title canary-traffic-desc">
<title id="canary-traffic-title">Canary 배포 중 Stable/Canary 트래픽 분배</title>
<desc id="canary-traffic-desc">Argo Rollouts가 점진적으로 조정하는 weight에 따라 VirtualService가 요청의 90%는 stable subset으로, 10%는 canary subset으로 분배하는 흐름을 보여줍니다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ============ ALT FRAGMENT (painted before lifelines/messages) ============ -->
<rect x="240" y="200" width="600" height="200" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
<rect x="240" y="200" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
<text x="260" y="212" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ALT</text>
<text x="292" y="212" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">[90% of traffic]</text>
<line x1="248" y1="300" x2="832" y2="300" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="260" y="316" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">[else — 10% of traffic]</text>

<!-- ============ LIFELINES ============ -->
<line x1="140" y1="164" x2="140" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="380" y1="164" x2="380" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="620" y1="164" x2="620" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="860" y1="164" x2="860" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- ============ MESSAGES ============ -->
<!-- 1. Client -> VS -->
<line x1="140" y1="184" x2="620" y2="184" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="346" y="164" width="68" height="12" rx="2" fill="#ffffff"/>
<text x="380" y="173" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GET /api</text>

<!-- alt region 1 (90%): VS -> Stable, Stable -> VS (headline / accent) -->
<line x1="620" y1="244" x2="380" y2="244" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="436" y="224" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="500" y="233" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">subset: stable-a · w90</text>

<line x1="380" y1="272" x2="620" y2="272" stroke="#EC7211" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
<rect x="452" y="252" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="500" y="261" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Response (v1)</text>

<!-- alt region 2 (10%): VS -> Canary, Canary -> VS -->
<line x1="620" y1="332" x2="860" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="676" y="312" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="740" y="321" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">subset: canary-a · w10</text>

<line x1="860" y1="360" x2="620" y2="360" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="676" y="340" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="724" y="349" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Response (v2)</text>

<!-- 6. VS -> Client (return, outside fragment) -->
<line x1="620" y1="432" x2="140" y2="432" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="346" y="412" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="378" y="421" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Response</text>

<!-- note: progressive weight change -->
<rect x="380" y="452" width="440" height="30" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
<text x="600" y="465" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ARGO ROLLOUTS · PROGRESSIVE WEIGHT</text>
<text x="600" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">10 → 20 → 50 → 80 → 100</text>

<!-- ============ ACTIVATION BARS ============ -->
<rect x="136" y="184" width="8" height="248" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="616" y="184" width="8" height="248" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="376" y="244" width="8" height="28" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="0.8"/>
<rect x="856" y="332" width="8" height="28" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- ============ ACTOR BOXES (drawn last) ============ -->
<rect x="80" y="120" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="80" y="120" width="120" height="36" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="140" y="142" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>

<rect x="560" y="120" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="560" y="120" width="120" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="620" y="142" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VirtualService</text>

<rect x="320" y="120" width="120" height="44" rx="6" fill="#ffffff"/>
<rect x="320" y="120" width="120" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="380" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Stable Pod</text>
<text x="380" y="156" fill="#EC7211" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">weight: 90%</text>

<rect x="800" y="120" width="120" height="44" rx="6" fill="#ffffff"/>
<rect x="800" y="120" width="120" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="860" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Canary Pod</text>
<text x="860" y="156" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">weight: 10%</text>

<!-- ============ LEGEND ============ -->
<line x1="60" y1="504" x2="900" y2="504" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="60" y="522" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

<line x1="180" y1="516" x2="212" y2="516" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="220" y="520" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Stable 경로 (90%, headline)</text>

<line x1="460" y1="516" x2="492" y2="516" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="500" y="520" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Canary 경로 (10%)</text>

</svg>