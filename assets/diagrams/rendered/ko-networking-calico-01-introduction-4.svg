<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4-title d4-desc">
<title id="d4-title">전통적인 VM 네트워킹의 한계</title>
<desc id="d4-desc">VM들이 VLAN을 거쳐 방화벽과 라우터로 나가는 전통적인 네트워킹 경로와, VLAN 개수 제한·정적 구성·중앙 집중이라는 세 가지 구조적 문제점을 함께 보여주는 다이어그램.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="d4-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="d4-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone 1: 전통적인 VM 네트워킹 -->
<rect x="40" y="64" width="880" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="380" y="68" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">전통적인 VM 네트워킹</text>

<!-- Zone 2: 문제점 -->
<rect x="40" y="320" width="880" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="430" y="324" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="333" fill="rgba(35,47,62,0.40)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">문제점</text>

<!-- Arrows: zone 1 -->
<path d="M 196,128 H 230 Q 238,128 238,136 V 148 Q 238,156 246,156 H 280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d4-arrow)"/>
<path d="M 196,208 H 230 Q 238,208 238,200 V 188 Q 238,180 246,180 H 280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d4-arrow)"/>
<line x1="400" y1="168" x2="480" y2="168" stroke="#545B64" stroke-width="1.2" marker-end="url(#d4-arrow)"/>
<line x1="620" y1="168" x2="700" y2="168" stroke="#545B64" stroke-width="1.2" marker-end="url(#d4-arrow)"/>

<!-- Node: VM 1 (input) -->
<rect x="76" y="96" width="120" height="64" rx="6" fill="#ffffff"/>
<rect x="76" y="96" width="120" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="136" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">VM 1</text>

<!-- Node: VM 2 (input) -->
<rect x="76" y="176" width="120" height="64" rx="6" fill="#ffffff"/>
<rect x="76" y="176" width="120" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="136" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">VM 2</text>

<!-- Node: VLAN (focal — the bottleneck) -->
<rect x="280" y="136" width="120" height="64" rx="6" fill="#ffffff"/>
<rect x="280" y="136" width="120" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<rect x="288" y="144" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="304" y="153" fill="#EC7211" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">L2</text>
<text x="340" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">VLAN</text>
<text x="340" y="188" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">단일 세그먼트</text>

<!-- Node: 방화벽 -->
<rect x="480" y="136" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="480" y="136" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="550" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">방화벽</text>

<!-- Node: 라우터 -->
<rect x="700" y="136" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="700" y="136" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="770" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">라우터</text>

<!-- Node: 문제점 1 (optional/note) -->
<rect x="76" y="352" width="240" height="64" rx="6" fill="#ffffff"/>
<rect x="76" y="352" width="240" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="196" y="378" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">VLAN 수 제한</text>
<text x="196" y="394" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">최대 4096개</text>

<!-- Node: 문제점 2 -->
<rect x="360" y="352" width="240" height="64" rx="6" fill="#ffffff"/>
<rect x="360" y="352" width="240" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="480" y="378" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">정적 구성</text>
<text x="480" y="394" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">느린 변경</text>

<!-- Node: 문제점 3 -->
<rect x="644" y="352" width="240" height="64" rx="6" fill="#ffffff"/>
<rect x="644" y="352" width="240" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="764" y="378" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">중앙 집중</text>
<text x="764" y="394" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">병목 현상</text>

<!-- Legend -->
<line x1="40" y1="556" x2="920" y2="556" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="572" fill="#545B64" font-size="8" font-family="var(--font-mono)" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="580" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="60" y="588" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">구조적 병목 (focal)</text>
<rect x="220" y="580" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="240" y="588" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">결과로 나타나는 문제</text>
</svg>