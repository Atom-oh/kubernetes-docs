<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mc-p1-title mc-p1-desc">
<title id="mc-p1-title">Istio multi-cluster pattern</title>
<desc id="mc-p1-desc">Two clusters each run their own Istiod control plane and east-west gateway; the gateways carry cross-region mTLS traffic between the clusters' app services while the two Istiod instances sync service discovery.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
<marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- zones -->
<rect x="80" y="120" width="360" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="92" y="124" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="162" y="133" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.10em">CLUSTER 1 · US-EAST-1</text>

<rect x="520" y="120" width="360" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="532" y="124" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="602" y="133" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.10em">CLUSTER 2 · US-WEST-2</text>

<!-- arrows -->
<!-- Istiod1 <-.-> Istiod2 service discovery -->
<line x1="260" y1="196" x2="560" y2="196" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="354" y="176" width="112" height="12" rx="2" fill="#ffffff"/>
<text x="410" y="185" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.02em">SERVICE DISCOVERY</text>

<!-- EWG1 <-> EWG2 mTLS cross-region (accent headline) -->
<line x1="330" y1="332" x2="630" y2="332" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>
<rect x="422" y="338" width="116" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="347" fill="#EC7211" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.02em">MTLS CROSS-REGION</text>

<!-- App1 -> EWG1 (Envoy) -->
<line x1="260" y1="392" x2="260" y2="356" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="234" y="366" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="260" y="375" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.03em">ENVOY</text>

<!-- EWG2 -> App2 (Envoy) -->
<line x1="700" y1="356" x2="700" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="674" y="366" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="700" y="375" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.03em">ENVOY</text>

<!-- Cluster 1 nodes -->
<rect x="120" y="176" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="190" y="200" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Istiod</text>

<rect x="190" y="312" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="260" y="336" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">East-west gateway</text>

<rect x="190" y="392" width="140" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="260" y="416" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">App services</text>

<!-- Cluster 2 nodes -->
<rect x="560" y="176" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="630" y="200" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Istiod</text>

<rect x="630" y="312" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="700" y="336" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">East-west gateway</text>

<rect x="630" y="392" width="140" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="700" y="416" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">App services</text>

<!-- legend -->
<line x1="30" y1="480" x2="930" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="30" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="130" y="488" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="150" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">ISTIOD (CONTROL PLANE)</text>
<line x1="380" y1="493" x2="404" y2="493" stroke="#EC7211" stroke-width="1.4"/>
<text x="412" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">CROSS-REGION DATA PATH</text>
<line x1="660" y1="493" x2="684" y2="493" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
<text x="692" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">CONTROL SYNC</text>
</svg>
