<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sq-title sq-desc">
      <title id="sq-title">PSA admission control sequence</title>
      <desc id="sq-desc">Sequence diagram showing a pod creation request flow from a user or controller through the API server and Pod Security Admission controller, which reads the namespace's enforce and audit labels, then either approves the pod for storage in etcd or denies it with a 403 when it violates the enforced policy.</desc>

      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="11" cy="11" r="0.8" fill="rgba(35,47,62,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
        <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#DD344C"/></marker>
      </defs>

      <rect width="960" height="600" fill="#ffffff"/>
      <rect width="960" height="600" fill="url(#dots)" opacity="0.55"/>

      <!-- Lifelines: User=104, API=328, PSA=552, NS=752, etcd=896 -->
      <line x1="104" y1="112" x2="104" y2="560" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="328" y1="112" x2="328" y2="560" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="552" y1="112" x2="552" y2="560" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="752" y1="112" x2="752" y2="560" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="896" y1="112" x2="896" y2="560" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <!-- API active from first message (152) to final response (536) -->
      <rect x="324" y="156" width="8" height="380" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
      <!-- PSA active from receiving admission request (188) to its verdict inside the fragment -->
      <rect x="548" y="192" width="8" height="140" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

      <!-- M1: User -> API : Pod Creation Request -->
      <line x1="104" y1="152" x2="324" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="140" y="136" width="150" height="12" rx="2" fill="#ffffff"/>
      <text x="215" y="146" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POD CREATION REQUEST</text>

      <!-- M2: API -> PSA : Admission Validation Request -->
      <line x1="332" y1="188" x2="548" y2="188" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="368" y="172" width="144" height="12" rx="2" fill="#ffffff"/>
      <text x="440" y="182" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADMISSION VALIDATION</text>

      <!-- M3: PSA -> NS : Check Namespace Labels -->
      <line x1="556" y1="224" x2="752" y2="224" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="588" y="208" width="132" height="12" rx="2" fill="#ffffff"/>
      <text x="654" y="218" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK NS LABELS</text>

      <!-- M4: NS --> PSA : enforce=restricted, audit=restricted (return, dashed) -->
      <line x1="752" y1="260" x2="556" y2="260" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="588" y="244" width="132" height="12" rx="2" fill="#ffffff"/>
      <text x="654" y="254" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENFORCE=RESTRICTED</text>

      <!-- ALT fragment frame: spans API..NS lifelines -->
      <rect x="284" y="296" width="624" height="220" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
      <rect x="284" y="296" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
      <text x="304" y="308" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="336" y="308" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[pod complies with policy]</text>

      <!-- Region 1: complies -->
      <!-- PSA --> API : Approved (dashed return) -->
      <line x1="548" y1="336" x2="332" y2="336" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="400" y="320" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="440" y="330" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>

      <!-- API -> etcd : Store Pod -->
      <line x1="332" y1="372" x2="896" y2="372" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="580" y="356" width="72" height="12" rx="2" fill="#ffffff"/>
      <text x="616" y="366" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STORE POD</text>

      <!-- etcd --> API return (unlabeled short dashed) then API --> User : 201 Created (headline, coral) -->
      <line x1="896" y1="404" x2="336" y2="404" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="324" y1="436" x2="108" y2="436" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="164" y="420" width="88" height="12" rx="2" fill="#ffffff"/>
      <text x="208" y="430" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">201 CREATED</text>

      <!-- Divider -->
      <line x1="292" y1="452" x2="900" y2="452" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="300" y="466" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else — pod violates policy]</text>

      <!-- Region 2: violates -->
      <!-- PSA --> API : Denied (enforce mode) -->
      <line x1="548" y1="484" x2="332" y2="484" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
      <rect x="376" y="468" width="128" height="12" rx="2" fill="#ffffff"/>
      <text x="440" y="478" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DENIED · ENFORCE</text>

      <!-- API --> User : 403 Forbidden -->
      <line x1="324" y1="500" x2="108" y2="500" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
      <rect x="152" y="490" width="120" height="12" rx="2" fill="#ffffff"/>
      <text x="212" y="500" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">403 FORBIDDEN</text>

      <!-- Actor boxes -->
      <!-- User/Controller (external) -->
      <rect x="32" y="56" width="144" height="56" rx="6" fill="#ffffff"/>
      <rect x="32" y="56" width="144" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <rect x="40" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
      <text x="54" y="73" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="104" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">User/Controller</text>

      <!-- API Server -->
      <rect x="256" y="56" width="144" height="56" rx="6" fill="#ffffff"/>
      <rect x="256" y="56" width="144" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <rect x="264" y="64" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
      <text x="279" y="73" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="328" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">API Server</text>

      <!-- PSA Controller (focal) -->
      <rect x="480" y="56" width="144" height="56" rx="6" fill="#ffffff"/>
      <rect x="480" y="56" width="144" height="56" rx="6" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="1"/>
      <rect x="488" y="64" width="30" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
      <text x="503" y="73" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PSA</text>
      <text x="552" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">PSA Controller</text>

      <!-- Namespace Labels (store) -->
      <rect x="680" y="56" width="144" height="56" rx="6" fill="#ffffff"/>
      <rect x="680" y="56" width="144" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <rect x="688" y="64" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
      <text x="703" y="73" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CFG</text>
      <text x="752" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Namespace</text>
      <text x="752" y="103" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">labels</text>

      <!-- etcd (store) -->
      <rect x="844" y="56" width="104" height="56" rx="6" fill="#ffffff"/>
      <rect x="844" y="56" width="104" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <rect x="852" y="64" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
      <text x="867" y="73" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="896" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">etcd</text>

      <!-- Legend -->
      <line x1="32" y1="536" x2="928" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="32" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="32" y="568" width="14" height="10" rx="2" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="1"/>
      <text x="52" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Focal actor</text>

      <line x1="184" y1="574" x2="212" y2="574" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="220" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Call</text>

      <line x1="316" y1="574" x2="344" y2="574" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="352" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Return</text>

      <line x1="444" y1="574" x2="472" y2="574" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="480" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Headline success</text>

      <line x1="644" y1="574" x2="672" y2="574" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
      <text x="680" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Denied</text>
    </svg>