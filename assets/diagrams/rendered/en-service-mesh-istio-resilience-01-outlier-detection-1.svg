<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
  <title id="t1">Outlier Detection Decision Process</title>
  <desc id="d1">Each request is checked for an error; errors increment a counter, and once the counter crosses a threshold the instance is ejected, waits out an ejection period, and is retried, looping back into the same request-checking cycle.</desc>
  <rect width="960" height="600" fill="var(--paper)"/>

  <text x="40" y="36" class="mono" fill="var(--soft)" font-size="8" letter-spacing="0.14em">ISTIO · RESILIENCE</text>
  <text x="40" y="60" font-size="20" font-weight="700" fill="var(--ink)">Outlier Detection Decision Process</text>

  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DD344C"/>
    </marker>
  </defs>

  <!-- ============ ARROWS (drawn before shapes) ============ -->

  <!-- Start -> Check : straight, aligned y=160 -->
  <line x1="152" y1="160" x2="220" y2="160" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Check -> Count (Error), bottom vertex straight down -->
  <line x1="260" y1="188" x2="260" y2="236" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Check -> Normal (Success), right vertex straight across (both y=160) -->
  <path d="M300,160 H520" fill="none" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Count -> Threshold : straight horizontal, aligned y=268 -->
  <line x1="300" y1="268" x2="360" y2="268" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Threshold -> Eject (Yes), bottom vertex straight down, aligned x=420 -->
  <line x1="420" y1="312" x2="420" y2="376" stroke="var(--danger)" stroke-width="1.2" marker-end="url(#arrow-danger)"/>

  <!-- Threshold -> Normal (No), top vertex up and over into Normal's bottom edge -->
  <path d="M420,224 H552 Q560,224 560,216 V188" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Eject -> Wait : straight vertical, aligned x=420 -->
  <line x1="420" y1="440" x2="420" y2="480" stroke="var(--danger)" stroke-width="1.2" marker-end="url(#arrow-danger)"/>

  <!-- Wait -> Retry : straight horizontal aligned y=508 -->
  <line x1="470" y1="508" x2="536" y2="508" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Retry -> Start : loop back over the top -->
  <path d="M584,480 V80 Q584,72 576,72 H120 Q112,72 112,80 V132" fill="none" stroke="var(--soft)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ============ ARROW LABELS ============ -->
  <!-- ERROR: vertical segment x=260, label beside (right of) the line -->
  <rect x="268" y="204" width="44" height="12" rx="2" fill="var(--paper)"/>
  <text x="290" y="213" class="mono" fill="var(--soft)" font-size="8" text-anchor="middle" letter-spacing="0.06em">ERROR</text>

  <!-- SUCCESS: horizontal segment y=160 -->
  <rect x="358" y="140" width="56" height="12" rx="2" fill="var(--paper)"/>
  <text x="386" y="149" class="mono" fill="var(--accent)" font-size="8" text-anchor="middle" letter-spacing="0.06em">SUCCESS</text>

  <!-- YES: vertical segment x=420, threshold->eject -->
  <rect x="430" y="336" width="30" height="12" rx="2" fill="var(--paper)"/>
  <text x="445" y="345" class="mono" fill="var(--danger)" font-size="8" text-anchor="middle" letter-spacing="0.06em">YES</text>

  <!-- NO: horizontal segment y=224, threshold->normal -->
  <rect x="462" y="204" width="28" height="12" rx="2" fill="var(--paper)"/>
  <text x="476" y="213" class="mono" fill="var(--soft)" font-size="8" text-anchor="middle" letter-spacing="0.06em">NO</text>

  <!-- ============ SHAPES ============ -->

  <!-- Start (oval) -->
  <rect x="72" y="132" width="80" height="56" rx="28" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text x="112" y="164" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Start</text>

  <!-- Check (diamond) -->
  <polygon points="260,132 300,160 260,188 220,160" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text x="260" y="157" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="middle">Check for</text>
  <text x="260" y="169" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="middle">Errors</text>

  <!-- Count (rect) -->
  <rect x="220" y="236" width="80" height="64" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text x="260" y="264" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Increment</text>
  <text x="260" y="280" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Error Count</text>

  <!-- Threshold (diamond, focal - the key decision) -->
  <polygon points="420,224 480,268 420,312 360,268" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="420" y="264" font-size="11" font-weight="700" fill="var(--ink)" text-anchor="middle">Threshold</text>
  <text x="420" y="276" font-size="11" font-weight="700" fill="var(--ink)" text-anchor="middle">Exceeded?</text>

  <!-- Normal (rect) -->
  <rect x="520" y="132" width="140" height="56" rx="6" fill="var(--paper)" stroke="var(--muted)" stroke-width="1"/>
  <text x="590" y="156" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Normal</text>
  <text x="590" y="172" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Processing</text>

  <!-- Eject (rect, danger) -->
  <rect x="380" y="376" width="80" height="64" rx="6" fill="rgba(221,52,76,0.05)" stroke="var(--danger)" stroke-width="1"/>
  <text x="420" y="404" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Eject</text>
  <text x="420" y="420" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Instance</text>

  <!-- Wait (rect) -->
  <rect x="370" y="480" width="100" height="56" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text x="420" y="512" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Wait Period</text>

  <!-- Retry (rect) -->
  <rect x="536" y="480" width="96" height="56" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text x="584" y="504" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Recovery</text>
  <text x="584" y="520" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Attempt</text>

  <!-- Legend -->
  <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="580" class="mono" fill="var(--soft)" font-size="8" letter-spacing="0.14em">LEGEND</text>
  <line x1="140" y1="576" x2="168" y2="576" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="176" y="580" class="mono" fill="var(--muted)" font-size="8">Happy path</text>
  <line x1="340" y1="576" x2="368" y2="576" stroke="var(--danger)" stroke-width="1.2" marker-end="url(#arrow-danger)"/>
  <text x="376" y="580" class="mono" fill="var(--muted)" font-size="8">Ejection path</text>
  <line x1="560" y1="576" x2="588" y2="576" stroke="var(--soft)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="596" y="580" class="mono" fill="var(--muted)" font-size="8">Loop back to start</text>
</svg>