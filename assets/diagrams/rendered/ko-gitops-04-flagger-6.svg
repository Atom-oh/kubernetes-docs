<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t6-title t6-desc">
<title id="t6-title">FluxCD와 Flagger 연동 아키텍처</title>
<desc id="t6-desc">Git 저장소의 HelmRelease가 FluxCD의 Source·Helm 컨트롤러를 거쳐 쿠버네티스 Deployment에 적용되고, Canary CRD를 감시하는 Flagger가 Primary/Canary 서비스와 서비스 메시를 제어하며 점진적 배포를 수행하는 구조를 보여준다.</desc>
