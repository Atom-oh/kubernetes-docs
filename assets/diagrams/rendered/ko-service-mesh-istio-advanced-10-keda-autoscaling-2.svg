<?xml version="1.0" encoding="UTF-8"?>
<svg id="diagram" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc">
  <title id="d2-title">메트릭 선택 가이드</title>
  <desc id="d2-desc">워크로드 특성(상태 유무, 트래픽 예측 가능성, 지연 시간 민감도)에 따라 RPS, Latency, 예측, 복합 스케일링 전략을 선택하는 의사결정 트리</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- ============ Connectors ============ -->

  <!-- Start -> Stateless -->
  <line x1="200" y1="82" x2="200" y2="128" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Stateless -no-> LatencyScale -->
  <line x1="260" y1="160" x2="380" y2="160" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="290" y="140" width="26" height="14" rx="2" fill="#ffffff"/>
  <text x="303" y="151" class="mono" font-size="8" fill="#545B64" text-anchor="middle">NO</text>

  <!-- Stateless -yes-> Traffic -->
  <line x1="200" y1="192" x2="200" y2="238" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="208" y="202" width="30" height="14" rx="2" fill="#ffffff"/>
  <text x="223" y="213" class="mono" font-size="8" fill="#545B64" text-anchor="middle">YES</text>

  <!-- Traffic -yes-> Predictive (accent: focal recommendation) -->
  <line x1="260" y1="270" x2="380" y2="270" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="290" y="250" width="30" height="14" rx="2" fill="#ffffff"/>
  <text x="305" y="261" class="mono" font-size="8" fill="#EC7211" text-anchor="middle">YES</text>

  <!-- Traffic -no-> Latency -->
  <line x1="200" y1="302" x2="200" y2="348" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="208" y="312" width="26" height="14" rx="2" fill="#ffffff"/>
  <text x="221" y="323" class="mono" font-size="8" fill="#545B64" text-anchor="middle">NO</text>

  <!-- Latency -yes-> LatencyScale: routed via a clear left-side channel (x=90), hopping over the
       Start->Stateless connector at (200,100) with a small bridge arc, entering LatencyScale's top edge
       so it never crosses the Stateless-NO or Traffic-YES arrows. -->
  <path d="M140,380 H90 V100 H192 Q200,84 208,100 H460 V132" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="50" y="233" width="30" height="14" rx="2" fill="#ffffff"/>
  <text x="65" y="244" class="mono" font-size="8" fill="#545B64" text-anchor="middle">YES</text>

  <!-- Latency -no-> RPSScale (elbow down, fan attach on RPSScale bottom edge) -->
  <path d="M200,412 V440 H460 V408" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="208" y="412" width="26" height="14" rx="2" fill="#ffffff"/>
  <text x="221" y="423" class="mono" font-size="8" fill="#545B64" text-anchor="middle">NO</text>

  <!-- RPSScale -.-> Composite (dashed combine, bend at x=636) -->
  <path d="M540,368 H636 V282 H676" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="612" y="316" width="40" height="14" rx="2" fill="#ffffff"/>
  <text x="632" y="327" class="mono" font-size="8" fill="#7D8998" text-anchor="middle">조합</text>

  <!-- LatencyScale -.-> Composite (dashed combine, bend at x=600) -->
  <path d="M540,172 H600 V258 H676" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="576" y="188" width="40" height="14" rx="2" fill="#ffffff"/>
  <text x="596" y="199" class="mono" font-size="8" fill="#7D8998" text-anchor="middle">조합</text>

  <!-- ============ Nodes ============ -->

  <!-- Start diamond -->
  <polygon points="200,18 260,50 200,82 140,50" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="200" y="46" font-size="11" font-weight="600" fill="#232F3E" text-anchor="middle">워크로드</text>
  <text x="200" y="60" class="mono" font-size="8" fill="#545B64" text-anchor="middle">특성?</text>

  <!-- Stateless diamond -->
  <polygon points="200,128 260,160 200,192 140,160" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="200" y="156" font-size="11" font-weight="600" fill="#232F3E" text-anchor="middle">Stateless</text>
  <text x="200" y="170" class="mono" font-size="8" fill="#545B64" text-anchor="middle">서비스?</text>

  <!-- Traffic diamond -->
  <polygon points="200,238 260,270 200,302 140,270" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="200" y="266" font-size="11" font-weight="600" fill="#232F3E" text-anchor="middle">트래픽 패턴</text>
  <text x="200" y="280" class="mono" font-size="8" fill="#545B64" text-anchor="middle">예측?</text>

  <!-- Latency diamond -->
  <polygon points="200,348 260,380 200,412 140,380" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="200" y="376" font-size="11" font-weight="600" fill="#232F3E" text-anchor="middle">지연 시간</text>
  <text x="200" y="390" class="mono" font-size="8" fill="#545B64" text-anchor="middle">민감?</text>

  <!-- LatencyScale rect -->
  <rect x="380" y="132" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="460" y="156" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Latency 기반</text>
  <text x="460" y="172" class="mono" font-size="9" fill="#545B64" text-anchor="middle">스케일링</text>

  <!-- Predictive rect (focal) -->
  <rect x="380" y="242" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="460" y="266" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">예측 스케일링</text>
  <text x="460" y="282" class="mono" font-size="9" fill="#545B64" text-anchor="middle">+ Cron</text>

  <!-- RPSScale rect -->
  <rect x="380" y="352" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="460" y="376" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">RPS 기반</text>
  <text x="460" y="392" class="mono" font-size="9" fill="#545B64" text-anchor="middle">스케일링</text>

  <!-- Composite rect -->
  <rect x="676" y="242" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="756" y="266" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">복합 메트릭</text>
  <text x="756" y="282" class="mono" font-size="9" fill="#545B64" text-anchor="middle">스케일링</text>

  <!-- Legend -->
  <line x1="30" y1="530" x2="930" y2="530" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="548" class="mono" font-size="8" fill="#545B64" letter-spacing="0.14em">LEGEND</text>
  <polygon points="180,540 190,547 180,554 170,547" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="198" y="551" class="mono" font-size="8" fill="#545B64">DECISION</text>
  <rect x="300" y="540" width="20" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="328" y="551" class="mono" font-size="8" fill="#545B64">권장 경로 (FOCAL)</text>
  <line x1="480" y1="547" x2="510" y2="547" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="516" y="551" class="mono" font-size="8" fill="#545B64">조합 가능</text>
</svg>