<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mc-mp-title mc-mp-desc">
<title id="mc-mp-title">Multi-primary topology</title>
<desc id="mc-mp-desc">Two clusters each run their own full Istiod control plane, which stay in sync with each other while Service A in both clusters load-balances traffic between them, trading single-control-plane simplicity for regional autonomy and no single point of failure.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
<marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- zones -->
<rect x="120" y="160" width="280" height="260" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8"/>
<rect x="132" y="164" width="130" height="12" rx="2" fill="#ffffff"/>
<text x="197" y="173" fill="#EC7211" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">CLUSTER 1 · US-EAST-1</text>

<rect x="560" y="160" width="280" height="260" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8"/>
<rect x="572" y="164" width="130" height="12" rx="2" fill="#ffffff"/>
<text x="637" y="173" fill="#EC7211" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">CLUSTER 2 · US-WEST-2</text>

<!-- arrows -->
<line x1="360" y1="224" x2="600" y2="224" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="460" y="204" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="213" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.03em">SYNC</text>

<line x1="320" y1="360" x2="640" y2="360" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>
<rect x="410" y="366" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="375" fill="#EC7211" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.02em">LOAD BALANCING</text>

<!-- nodes -->
<rect x="160" y="200" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="260" y="220" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">Istiod</text>
<text x="260" y="234" fill="#545B64" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">control plane</text>

<rect x="200" y="336" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="260" y="364" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Service A</text>

<rect x="600" y="200" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="700" y="220" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">Istiod</text>
<text x="700" y="234" fill="#545B64" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">control plane</text>

<rect x="640" y="336" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="700" y="364" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Service A</text>

<!-- legend -->
<line x1="30" y1="460" x2="930" y2="460" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="30" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="130" y="468" width="14" height="10" rx="2" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8"/>
<text x="150" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">CLUSTER (FULL CONTROL PLANE)</text>
<line x1="410" y1="473" x2="434" y2="473" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
<text x="442" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">CONTROL-PLANE SYNC</text>
<line x1="660" y1="473" x2="684" y2="473" stroke="#EC7211" stroke-width="1.4"/>
<text x="692" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">DATA-PLANE TRAFFIC</text>
</svg>
