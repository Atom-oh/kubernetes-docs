    <title id="ko-ops-14-tekton-pipelines-0-title">Tekton CRD 및 확장 생태계 개요</title>
    <desc id="ko-ops-14-tekton-pipelines-0-desc">Trigger가 새 PipelineRun을 생성하고, PipelineRun이 Pipeline과 TaskRun을 거쳐 Task를 실행한 뒤 결과를 Workspace에 남기고, TaskRun 완료를 Tekton Chains가 감지해 서명과 Provenance를 생성하는 전체 흐름을 보여주는 아키텍처 다이어그램.</desc>
