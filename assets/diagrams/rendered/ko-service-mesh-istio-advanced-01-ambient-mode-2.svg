<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="amb02-title amb02-desc">
<title id="amb02-title">Ambient Mode 데이터 플레인: ztunnel과 Waypoint의 역할 분리</title>
<desc id="amb02-desc">노드에 배치된 ztunnel이 애플리케이션 파드의 트래픽을 투명하게 처리해 L4 서비스로 직접 전달하고, L7 기능이 필요할 때만 선택적으로 Waypoint 프록시를 경유하는 구조를 보여주는 다이어그램.</desc>
