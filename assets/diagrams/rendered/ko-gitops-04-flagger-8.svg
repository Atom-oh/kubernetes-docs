<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t8-title t8-desc">
<title id="t8-title">멀티 클러스터 Flagger 배포</title>
<desc id="t8-desc">관리 클러스터의 FluxCD가 하나의 Git 저장소를 기준으로 서울과 오리건의 운영 클러스터, 그리고 스테이징 클러스터에 있는 각 Flagger 인스턴스로 배포를 전파해 클러스터별로 독립적인 카나리 승격/롤백을 수행하는 구조를 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: Management -->
<rect x="32" y="240" width="248" height="132" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.30)" stroke-width="0.8" stroke-dasharray="4,4"/>
<rect x="48" y="244" width="160" height="12" rx="2" fill="#ffffff"/>
<text x="128" y="253" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGEMENT CLUSTER</text>

<!-- Zone: Production A -->
<rect x="384" y="60" width="248" height="132" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="400" y="64" width="216" height="12" rx="2" fill="#ffffff"/>
<text x="508" y="73" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRODUCTION A · AP-NORTHEAST-2</text>

<!-- Zone: Production B -->
<rect x="384" y="240" width="248" height="132" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="400" y="244" width="180" height="12" rx="2" fill="#ffffff"/>
<text x="490" y="253" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRODUCTION B · US-WEST-2</text>

<!-- Zone: Staging -->
<rect x="384" y="420" width="248" height="132" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="400" y="424" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="460" y="433" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STAGING</text>

<!-- Arrows -->
<line x1="156" y1="228" x2="156" y2="284" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 280,284 H 328 Q 336,284 336,276 V 152 Q 336,144 344,144 H 384"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="280" y1="306" x2="384" y2="306" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 280,328 H 328 Q 336,328 336,336 V 464 Q 336,472 344,472 H 384"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Nodes: Management -->
<rect x="64" y="172" width="184" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="156" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Git Repository</text>

<rect x="64" y="284" width="184" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="156" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">FluxCD</text>

<!-- Nodes: Prod A -->
<rect x="400" y="76" width="216" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="508" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Flagger A</text>

<rect x="400" y="140" width="216" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="508" y="164" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">App Primary / Canary</text>

<!-- Nodes: Prod B -->
<rect x="400" y="256" width="216" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="508" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Flagger B</text>

<rect x="400" y="320" width="216" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="508" y="344" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">App Primary / Canary</text>

<!-- Nodes: Staging -->
<rect x="400" y="436" width="216" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="508" y="464" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Flagger S</text>

<rect x="400" y="500" width="216" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="508" y="524" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">App Primary / Canary</text>

<!-- Legend -->
<line x1="32" y1="576" x2="928" y2="576" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="32" y="584" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="52" y="592" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">GitOps 배포 소스 (focal)</text>
<line x1="260" y1="590" x2="288" y2="590" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="296" y="592" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">클러스터별 전파</text>
</svg>