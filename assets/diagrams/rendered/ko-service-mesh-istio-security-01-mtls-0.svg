<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="d0-title d0-desc">
  <title id="d0-title">mTLS 아이덴티티 프로비저닝</title>
  <desc id="d0-desc">Envoy 사이드카 간 mTLS 암호화 통신과 istiod가 각 Envoy에 인증서를 발급하는 과정을 보여주는 다이어그램</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .mono { font-family: 'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- header -->
  <text x="32" y="40" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">SPIFFE IDENTITY</text>
  <text x="32" y="64" font-size="28" font-weight="700" fill="#232F3E">mTLS 아이덴티티 프로비저닝</text>

  <!-- zones: Pod A, Pod B -->
  <rect x="64" y="140" width="288" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="76" y="144" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="106" y="153" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)" text-anchor="middle">POD A</text>

  <rect x="608" y="140" width="288" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="620" y="144" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="650" y="153" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)" text-anchor="middle">POD B</text>

  <!-- Istiod (focal), top center -->
  <rect x="404" y="184" width="152" height="64" rx="6" fill="#ffffff"/>
  <rect x="404" y="184" width="152" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="416" y="192" width="40" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.5)" stroke-width="0.8"/>
  <text x="436" y="201" class="mono" font-size="7" fill="#EC7211" text-anchor="middle" letter-spacing="0.08em">CA</text>
  <text x="480" y="220" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">istiod</text>
  <text x="480" y="236" class="mono" font-size="9" fill="#545B64" text-anchor="middle">인증서 발급</text>

  <!-- Pod A nodes -->
  <rect x="88" y="256" width="112" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="144" y="282" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">애플리케이션</text>
  <text x="144" y="298" class="mono" font-size="9" fill="#545B64" text-anchor="middle">App</text>

  <rect x="240" y="256" width="96" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="288" y="280" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Envoy</text>
  <text x="288" y="296" class="mono" font-size="9" fill="#545B64" text-anchor="middle">Proxy</text>

  <!-- Pod B nodes -->
  <rect x="624" y="256" width="96" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="672" y="280" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Envoy</text>
  <text x="672" y="296" class="mono" font-size="9" fill="#545B64" text-anchor="middle">Proxy</text>

  <rect x="760" y="256" width="112" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="816" y="282" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">애플리케이션</text>
  <text x="816" y="298" class="mono" font-size="9" fill="#545B64" text-anchor="middle">App</text>

  <!-- edges -->
  <!-- App1 -> Envoy1 (plaintext) horizontal -->
  <line x1="200" y1="286" x2="240" y2="286" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="196" y="264" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="220" y="273" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">평문</text>

  <!-- Envoy1 <-> Envoy2 (mTLS, bidir, accent) horizontal long -->
  <line x1="336" y1="286" x2="624" y2="286" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
  <rect x="440" y="264" width="80" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="273" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.06em">mTLS 암호화</text>

  <!-- Envoy2 -> App2 (plaintext) -->
  <line x1="720" y1="286" x2="760" y2="286" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="716" y="264" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="740" y="273" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">평문</text>

  <!-- Istiod -.-> Envoy1 dashed, fan attach on Istiod bottom edge -->
  <path d="M 436,248 V 260 Q 436,268 428,268 H 288 Q 280,268 280,260 V 256"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="332" y="238" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="360" y="247" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">인증서</text>

  <!-- Istiod -.-> Envoy2 dashed -->
  <path d="M 524,248 V 260 Q 524,268 532,268 H 672 Q 680,268 680,260 V 256"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="572" y="238" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="600" y="247" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">인증서</text>

  <!-- legend -->
  <line x1="32" y1="524" x2="928" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="544" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <line x1="140" y1="540" x2="172" y2="540" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="180" y="544" font-size="12" fill="#232F3E">평문 통신</text>
  <line x1="320" y1="540" x2="352" y2="540" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
  <text x="360" y="544" font-size="12" fill="#232F3E">mTLS 암호화 통신</text>
  <line x1="560" y1="540" x2="592" y2="540" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="600" y="544" font-size="12" fill="#232F3E">인증서 전달 (SDS)</text>
</svg>