<title id="en-service-mesh-linkerd-02-architecture-5-title">Proxy-to-Proxy Traffic Flow</title>
<desc id="en-service-mesh-linkerd-02-architecture-5-desc">Sequence diagram showing a client app's request transparently redirected into its linkerd-proxy, which resolves and load-balances the destination and opens an mTLS connection to the server's proxy, which verifies the connection and policy before forwarding to the server app and returning the response.</desc>
