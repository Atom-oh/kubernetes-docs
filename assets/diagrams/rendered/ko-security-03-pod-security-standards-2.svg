<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="pssmig-title pssmig-desc">
  <title id="pssmig-title">PSP에서 PSS로의 마이그레이션 7단계</title>
  <desc id="pssmig-desc">현재 상태 분석부터 PSS 프로파일 매핑, 테스트 검증, warn/audit 모드 적용, 워크로드 수정을 거쳐 enforce 모드로 전환하고 마지막으로 PSP를 제거하는 순차적 마이그레이션 절차를 보여준다.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .mono{ font-family:'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- header -->
  <text x="320" y="32" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">MIGRATION · FLOWCHART</text>
  <text x="320" y="56" font-size="16" font-weight="700" fill="#232F3E">PSP → PSS 마이그레이션 절차</text>

  <!-- ===== arrows (drawn before boxes) ===== -->
  <line x1="480" y1="120" x2="480" y2="152" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="192" x2="480" y2="224" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="264" x2="480" y2="296" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="336" x2="480" y2="368" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- arrow5: leads into the focal (enforce) step — accent -->
  <line x1="480" y1="408" x2="480" y2="440" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="480" y1="480" x2="480" y2="512" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===== step boxes ===== -->
  <rect x="320" y="80" width="320" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="104" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">1단계: 현재 상태 분석</text>

  <rect x="320" y="152" width="320" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="176" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">2단계: PSS 프로파일 매핑</text>

  <rect x="320" y="224" width="320" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="248" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">3단계: 테스트 환경에서 검증</text>

  <rect x="320" y="296" width="320" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="320" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">4단계: warn/audit 모드로 적용</text>

  <rect x="320" y="368" width="320" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="392" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">5단계: 워크로드 수정</text>

  <!-- focal step: enforce 모드 전환 -->
  <rect x="320" y="440" width="320" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="480" y="464" font-size="12" font-weight="700" fill="#232F3E" text-anchor="middle">6단계: enforce 모드 전환</text>

  <rect x="320" y="512" width="320" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="536" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">7단계: PSP 제거</text>

  <!-- legend -->
  <line x1="30" y1="572" x2="930" y2="572" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="588" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">범례</text>
  <rect x="150" y="580" width="16" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="176" y="588" class="mono" font-size="9" fill="#545B64">가장 중요한 전환 단계 (enforce 전환)</text>
</svg>
