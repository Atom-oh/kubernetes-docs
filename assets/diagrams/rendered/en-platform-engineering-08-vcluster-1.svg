<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vc-seq-title vc-seq-desc">
    <title id="vc-seq-title">vCluster syncer reconciliation sequence</title>
    <desc id="vc-seq-desc">Sequence diagram showing a developer's kubectl apply landing in the vCluster API server, the syncer rewriting object metadata and creating the real Pod on the host cluster, then continuously syncing status back down.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="100" y1="88" x2="100" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="360" y1="88" x2="360" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="620" y1="88" x2="620" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="860" y1="88" x2="860" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Messages (drawn before actor boxes, after lifelines) -->
    <!-- 1: Dev -> vAPI apply -->
    <line x1="100" y1="128" x2="360" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 2: vAPI self "store in etcd" -->
    <path d="M360,152 h40 q8,0 8,8 v8 q0,8 -8,8 h-40" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 3: vAPI self "controller creates Pods" -->
    <path d="M360,196 h40 q8,0 8,8 v8 q0,8 -8,8 h-40" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 4: Syncer -> vAPI watch -->
    <line x1="620" y1="240" x2="360" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 5: vAPI --> Syncer new pod detected (return, dashed) -->
    <line x1="360" y1="264" x2="620" y2="264" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- 6: Syncer self "rewrite metadata" -->
    <path d="M620,288 h40 q8,0 8,8 v8 q0,8 -8,8 h-40" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 7: Syncer -> Host create Pod (headline, accent) -->
    <line x1="620" y1="332" x2="860" y2="332" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- 8: Host --> Syncer scheduled/running (return) -->
    <line x1="860" y1="356" x2="620" y2="356" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- 9: Syncer -> vAPI update status -->
    <line x1="620" y1="380" x2="360" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Note: continuous reconciliation -->
    <rect x="560" y="404" width="200" height="24" rx="4" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
    <text x="660" y="419" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">continuous reconciliation loop</text>
    <!-- 10: Host --> Syncer status change -->
    <line x1="860" y1="452" x2="620" y2="452" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- 11: Syncer -> vAPI sync status -->
    <line x1="620" y1="476" x2="360" y2="476" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="200" y="108" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="244" y="117" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">KUBECTL APPLY</text>

    <rect x="368" y="156" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="416" y="165" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">STORE IN ETCD</text>

    <rect x="368" y="200" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="424" y="209" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CREATE POD SPEC</text>

    <rect x="446" y="220" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="490" y="229" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WATCH PODS</text>

    <rect x="446" y="244" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="490" y="253" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POD DETECTED</text>

    <rect x="628" y="292" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="692" y="301" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REWRITE METADATA</text>

    <rect x="686" y="312" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="730" y="321" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CREATE POD</text>

    <rect x="686" y="336" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="742" y="345" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SCHEDULED, RUNNING</text>

    <rect x="446" y="360" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="502" y="369" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">UPDATE STATUS</text>

    <rect x="686" y="432" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="742" y="441" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">STATUS CHANGE</text>

    <rect x="446" y="456" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="494" y="465" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SYNC STATUS</text>

    <!-- Activation bars -->
    <rect x="356" y="128" width="8" height="360" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="616" y="240" width="8" height="248" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- Actor boxes (top row, focal on Syncer) -->
    <rect x="40" y="88" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="40" y="88" width="120" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="100" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Developer</text>

    <rect x="300" y="88" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="300" y="88" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="360" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vCluster API</text>

    <rect x="560" y="88" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="560" y="88" width="120" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="620" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Syncer</text>

    <rect x="800" y="88" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="800" y="88" width="120" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="860" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Host Cluster API</text>

    <!-- Legend -->
    <line x1="30" y1="536" x2="930" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="554" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="180" y1="550" x2="204" y2="550" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="212" y="554" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Call</text>

    <line x1="300" y1="550" x2="324" y2="550" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="332" y="554" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Return</text>

    <line x1="440" y1="550" x2="464" y2="550" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="472" y="554" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Headline write</text>

    <rect x="640" y="544" width="12" height="12" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <text x="660" y="554" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Activation</text>
  </svg>