<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="np-tier-title np-tier-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="np-tier-title">Tier 기반 Calico 정책 평가 흐름</title>
    <desc id="np-tier-desc">들어오는 트래픽이 Security, Platform, Application, Default 네 Tier를 order 순서로 통과하며, 각 Tier는 규칙에 매치되면 즉시 Drop 또는 Accept로 보내고 매치되지 않으면 Pass로 다음 Tier에 넘긴다는 흐름을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <style>
        text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;}
        .mono{font-family:'Geist Mono',monospace;}
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ ARROWS (drawn before boxes) ============ -->

    <!-- Traffic -> Security (vertical, unlabeled) -->
    <line x1="480" y1="80" x2="480" y2="112" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Pass chain: Security->Platform->Application->Default (vertical) -->
    <line x1="480" y1="184" x2="480" y2="216" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="488" y="194" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="505" y="203" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">PASS</text>

    <line x1="480" y1="288" x2="480" y2="320" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="488" y="298" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="505" y="307" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">PASS</text>

    <line x1="480" y1="392" x2="480" y2="424" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="488" y="402" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="505" y="411" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">PASS</text>

    <!-- Deny arrows: each tier -> Drop (horizontal, left) -->
    <line x1="380" y1="148" x2="140" y2="148" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="240" y="128" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="260" y="137" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">DENY</text>

    <line x1="380" y1="252" x2="140" y2="252" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="240" y="232" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="260" y="241" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">DENY</text>

    <line x1="380" y1="356" x2="140" y2="356" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="240" y="336" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="260" y="345" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">DENY</text>

    <line x1="380" y1="460" x2="140" y2="460" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="232" y="440" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="260" y="449" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">NO MATCH</text>

    <!-- Allow arrows: each tier -> Accept (horizontal, right, accent = happy path) -->
    <line x1="580" y1="148" x2="820" y2="148" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="682" y="128" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="700" y="137" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>

    <line x1="580" y1="252" x2="820" y2="252" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="682" y="232" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="700" y="241" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>

    <line x1="580" y1="356" x2="820" y2="356" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="682" y="336" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="700" y="345" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>

    <line x1="580" y1="460" x2="820" y2="460" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="682" y="440" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="700" y="449" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>

    <!-- ============ NODES ============ -->

    <!-- Traffic (start oval, input treatment) -->
    <rect x="410" y="40" width="140" height="40" rx="20" fill="#ffffff"/>
    <rect x="410" y="40" width="140" height="40" rx="20" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="480" y="65" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">들어오는 트래픽</text>

    <!-- Security Tier -->
    <rect x="380" y="112" width="200" height="72" rx="6" fill="#ffffff"/>
    <rect x="380" y="112" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="396" y="130" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.14em">ORDER 100</text>
    <text x="396" y="152" fill="#232F3E" font-size="14" font-weight="600">Security Tier</text>
    <text x="396" y="170" fill="#545B64" font-size="9" class="mono">악성 IP 차단 → 규정 준수 검사</text>

    <!-- Platform Tier -->
    <rect x="380" y="216" width="200" height="72" rx="6" fill="#ffffff"/>
    <rect x="380" y="216" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="396" y="234" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.14em">ORDER 200</text>
    <text x="396" y="256" fill="#232F3E" font-size="14" font-weight="600">Platform Tier</text>
    <text x="396" y="274" fill="#545B64" font-size="9" class="mono">모니터링 허용 → 로깅 시스템 허용</text>

    <!-- Application Tier -->
    <rect x="380" y="320" width="200" height="72" rx="6" fill="#ffffff"/>
    <rect x="380" y="320" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="396" y="338" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.14em">ORDER 300</text>
    <text x="396" y="360" fill="#232F3E" font-size="14" font-weight="600">Application Tier</text>
    <text x="396" y="378" fill="#545B64" font-size="9" class="mono">마이크로서비스 정책 → DB 접근</text>

    <!-- Default Tier -->
    <rect x="380" y="424" width="200" height="72" rx="6" fill="#ffffff"/>
    <rect x="380" y="424" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="396" y="442" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.14em">DEFAULT</text>
    <text x="396" y="464" fill="#232F3E" font-size="14" font-weight="600">Default Tier</text>
    <text x="396" y="482" fill="#545B64" font-size="9" class="mono">K8s NetworkPolicy</text>

    <!-- Drop (deny terminal, danger treatment) -->
    <rect x="40" y="116" width="100" height="376" rx="8" fill="#ffffff"/>
    <rect x="40" y="116" width="100" height="376" rx="8" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="90" y="296" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.14em">DENY</text>
    <text x="90" y="312" fill="#232F3E" font-size="14" font-weight="600" text-anchor="middle">Drop</text>

    <!-- Accept (allow terminal, focal accent) -->
    <rect x="820" y="116" width="100" height="376" rx="8" fill="#ffffff"/>
    <rect x="820" y="116" width="100" height="376" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="870" y="296" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.14em">ALLOW</text>
    <text x="870" y="312" fill="#232F3E" font-size="14" font-weight="600" text-anchor="middle">Accept</text>

    <!-- Legend -->
    <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="556" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
    <rect x="160" y="546" width="14" height="14" rx="20" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="180" y="557" fill="#545B64" font-size="9" class="mono">시작</text>
    <rect x="256" y="546" width="14" height="14" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="276" y="557" fill="#545B64" font-size="9" class="mono">Tier (정책 평가 단계)</text>
    <rect x="472" y="546" width="14" height="14" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="492" y="557" fill="#545B64" font-size="9" class="mono">Accept (허용 경로)</text>
    <rect x="668" y="546" width="14" height="14" rx="2" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="688" y="557" fill="#545B64" font-size="9" class="mono">Drop (거부)</text>
  </svg>