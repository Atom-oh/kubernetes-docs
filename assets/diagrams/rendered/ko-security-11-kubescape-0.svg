    <title id="ko-security-11-kubescape-0-title">Kubescape 전체 아키텍처</title>
    <desc id="ko-security-11-kubescape-0-desc">CLI · Operator · CI/CD 파이프라인에서 들어온 스캔 요청이 보안 프레임워크 기준으로 컨트롤 평가·취약점 스캔·RBAC 분석을 거쳐 Risk Calculator에서 통합 위험도를 산정하고, 그 결과가 리포트·JSON/SARIF·Kubescape Cloud·알림으로 출력되는 흐름을 보여주는 다이어그램.</desc>
