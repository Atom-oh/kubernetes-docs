<text x="136" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">CORE TECHNOLOGY</text>

<rect x="592" y="96" width="336" height="464" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="656" y="100" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="726" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">PERFORMANCE</text>

<!-- row 1 -->
<line x1="368" y1="168" x2="592" y2="168" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<!-- row 2 -->
