<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmp4-title cmp4-desc">
    <title id="cmp4-title">Inhibition 억제 효과 비교</title>
    <desc id="cmp4-desc">억제 규칙이 없으면 NodeDown, PodNotReady, ServiceUnavailable 알림이 모두 수신자에게 전송되지만, 억제를 적용하면 NodeDown만 전송되고 관련된 PodNotReady, ServiceUnavailable 알림은 억제되어 차단되는 것을 비교해 보여줍니다.</desc>
    <defs><style>@import url(https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="64" width="420" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="160" y="68" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="196" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">억제 없이</text>

    <rect x="500" y="64" width="420" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="620" y="68" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="656" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">억제 적용</text>

    <!-- Left edges -->
    <line x1="220" y1="140" x2="300" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="220" y1="240" x2="300" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="220" y1="340" x2="300" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Right edges -->
    <line x1="680" y1="140" x2="760" y2="140" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="680" y1="240" x2="760" y2="240" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="680" y1="340" x2="760" y2="340" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Left nodes -->
    <rect x="80" y="116" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="150" y="144" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">NodeDown</text>

    <rect x="80" y="216" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="150" y="244" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">PodNotReady</text>

    <rect x="80" y="316" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="150" y="336" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Service</text>
    <text x="150" y="350" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Unavailable</text>

    <rect x="300" y="116" width="140" height="248" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="370" y="244" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Receiver</text>
    <text x="370" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">3건 모두 수신</text>

    <!-- Right nodes -->
    <rect x="540" y="116" width="140" height="48" rx="6" fill="#FFF8F0" stroke="#EC7211" stroke-width="1.4"/>
    <text x="610" y="144" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">NodeDown</text>

    <rect x="540" y="216" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="610" y="244" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">PodNotReady</text>

    <rect x="540" y="316" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="610" y="336" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Service</text>
    <text x="610" y="350" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Unavailable</text>

    <rect x="760" y="116" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="830" y="144" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Receiver</text>

    <rect x="760" y="216" width="140" height="148" rx="6" fill="rgba(35,47,62,0.06)" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="830" y="292" fill="#7D8998" font-size="12" font-weight="600" text-anchor="middle">억제됨</text>
    <text x="830" y="308" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">2건 차단</text>

    <!-- Labels -->
    <rect x="234" y="134" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="250" y="143" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">전송</text>
    <rect x="234" y="234" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="250" y="243" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">전송</text>
    <rect x="234" y="334" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="250" y="343" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">전송</text>

    <rect x="694" y="134" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="710" y="143" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">전송</text>
    <rect x="694" y="234" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="710" y="243" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">억제</text>
    <rect x="694" y="334" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="710" y="343" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">억제</text>

    <!-- Legend -->
    <line x1="40" y1="460" x2="920" y2="460" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <line x1="52" y1="480" x2="80" y2="480" stroke="#EC7211" stroke-width="1.4"/>
    <text x="88" y="483" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">억제 규칙의 source_match 알림</text>
    <line x1="380" y1="480" x2="408" y2="480" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="416" y="483" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">target_match 알림 (억제됨)</text>
  </svg>