<?xml version="1.0" encoding="UTF-8"?>
<svg id="diagram" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fc1-title fc1-desc">
  <title id="fc1-title">메트릭-Exemplar-트레이스-로그 드릴다운 흐름</title>
  <desc id="fc1-desc">메트릭 그래프에서 튄 지연 지점을 Exemplar로 클릭하면 트레이스로, 트레이스에서 다시 로그로 드릴다운하는 관찰 가능성 3요소 연계 흐름을 보여준다.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="40" y="60" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FLOWCHART</text>
  <text x="40" y="84" fill="#232F3E" font-size="16" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">메트릭 → Exemplar → 트레이스 → 로그 드릴다운</text>

  <!-- Arrows (drawn before boxes) -->
  <line x1="220" y1="308" x2="292" y2="308" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="308" x2="552" y2="308" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="740" y1="308" x2="812" y2="308" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Node 1: metrics -->
  <rect x="60" y="276" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="140" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">메트릭 그래프</text>
  <text x="140" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">p99 latency spike</text>

  <!-- Node 2: exemplar (focal) -->
  <rect x="300" y="272" width="160" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="380" y="302" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Exemplar 점</text>
  <text x="380" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">특정 요청</text>

  <!-- Node 3: trace -->
  <rect x="560" y="276" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="640" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">트레이스</text>
  <text x="640" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">상세 분석</text>

  <!-- Node 4: log -->
  <rect x="820" y="276" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="890" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">로그</text>
  <text x="890" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">에러 메시지</text>

  <!-- Legend -->
  <line x1="30" y1="404" x2="930" y2="404" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="420" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="130" y="411" width="16" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="154" y="420" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace">DRILL-DOWN PIVOT</text>
</svg>