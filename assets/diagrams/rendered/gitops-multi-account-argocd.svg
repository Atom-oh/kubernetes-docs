<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="multi-account-title multi-account-desc">
      <title id="multi-account-title">Multi-account GitOps with ArgoCD</title>
      <desc id="multi-account-desc">Architecture diagram showing ArgoCD in a management account reading from Git and reconciling EKS clusters in separate development, staging, and production accounts over cross-account connections.</desc>
      <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zones (drawn first) -->
      <rect x="60" y="140" width="180" height="208" rx="8" fill="rgba(255,153,0,0.05)" stroke="#EC7211" stroke-width="0.8"/>
      <rect x="76" y="144" width="148" height="12" rx="2" fill="#ffffff"/>
      <text x="150" y="153" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGEMENT ACCOUNT</text>

      <rect x="380" y="140" width="160" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="404" y="144" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="460" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEV ACCOUNT</text>

      <rect x="580" y="140" width="160" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="600" y="144" width="120" height="12" rx="2" fill="#ffffff"/>
      <text x="660" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STAGING ACCOUNT</text>

      <rect x="780" y="140" width="160" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="804" y="144" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="860" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROD ACCOUNT</text>

      <!-- Arrows -->
      <!-- Git -> ArgoCD -->
      <path d="M 140,244 V 268" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ArgoCD -> Dev EKS -->
      <path d="M 200,276 H 332 Q 340,276 340,268 V 220 Q 340,212 348,212 H 396" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="221" y="258" width="90" height="12" rx="2" fill="#ffffff"/>
      <text x="266" y="267" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CROSS-ACCOUNT</text>

      <!-- ArgoCD -> Staging EKS -->
      <path d="M 200,300 H 552 Q 560,300 560,292 V 220 Q 560,212 568,212 H 596" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="331" y="282" width="90" height="12" rx="2" fill="#ffffff"/>
      <text x="376" y="291" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CROSS-ACCOUNT</text>

      <!-- ArgoCD -> Prod EKS -->
      <path d="M 200,324 H 752 Q 760,324 760,316 V 220 Q 760,212 768,212 H 796" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="431" y="306" width="90" height="12" rx="2" fill="#ffffff"/>
      <text x="476" y="315" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CROSS-ACCOUNT</text>

      <!-- Nodes -->
      <!-- Git (store) -->
      <rect x="80" y="180" width="120" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="140" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Git Repo</text>

      <!-- ArgoCD (focal) -->
      <rect x="80" y="268" width="120" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="140" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ArgoCD</text>

      <!-- Dev EKS -->
      <rect x="396" y="180" width="128" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="460" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EKS Dev</text>

      <!-- Staging EKS -->
      <rect x="596" y="180" width="128" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="660" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EKS Staging</text>

      <!-- Prod EKS -->
      <rect x="796" y="180" width="128" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="860" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EKS Production</text>

      <!-- Legend -->
      <line x1="60" y1="404" x2="940" y2="404" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="60" y="424" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="60" y="436" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="82" y="447" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">ARGOCD (FOCAL)</text>

      <rect x="260" y="436" width="14" height="14" rx="3" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="282" y="447" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">SOURCE STORE</text>

      <rect x="460" y="436" width="14" height="14" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="482" y="447" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">TARGET CLUSTER</text>
    </svg>