    <title id="ko-basics-05-ebpf-fundamentals-4-title">XDP 프로그램의 패킷 처리 경로</title>
    <desc id="ko-basics-05-ebpf-fundamentals-4-desc">NIC에 도착한 패킷이 XDP 프로그램의 판정에 따라 드롭, 커널 스택 전달, 같은 인터페이스로 반환, 다른 인터페이스로 리다이렉트, 에러 처리 중 하나의 경로로 분기하는 것을 보여주는 흐름도.</desc>
