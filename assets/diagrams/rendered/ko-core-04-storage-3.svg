    <title id="ko-core-04-storage-3-title">볼륨 스냅샷으로 데이터 복원하기</title>
    <desc id="ko-core-04-storage-3-desc">기존 PVC에서 만든 볼륨 스냅샷이 볼륨 스냅샷 클래스를 참조하고, 새 PVC가 이 스냅샷을 데이터 소스로 사용해 새 PV를 생성·복원하는 과정을 보여준다.</desc>
