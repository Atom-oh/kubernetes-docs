<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mc-ecom-title mc-ecom-desc">
<title id="mc-ecom-title">Global e-commerce hybrid mesh</title>
<desc id="mc-ecom-desc">US and Europe clusters each use Istio internally to connect Frontend, Cart, and Order services, while both clusters' Order service reaches a Payment service in a third region only through a shared VPC Lattice service network.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- zones -->
<rect x="60" y="120" width="370" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="72" y="124" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="147" y="133" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.06em">US · EKS CLUSTER 1</text>

<rect x="530" y="120" width="370" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="542" y="124" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="617" y="133" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.06em">EUROPE · EKS CLUSTER 2</text>

<rect x="400" y="430" width="200" height="110" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="412" y="434" width="176" height="12" rx="2" fill="#ffffff"/>
<text x="500" y="443" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.05em">PAYMENT · EKS CLUSTER 3</text>

<!-- arrows: intra-cluster (US) -->
<line x1="166" y1="182" x2="190" y2="182" stroke="#232F3E" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<line x1="286" y1="182" x2="310" y2="182" stroke="#232F3E" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<!-- arrows: intra-cluster (EU) -->
<line x1="636" y1="182" x2="660" y2="182" stroke="#232F3E" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<line x1="756" y1="182" x2="780" y2="182" stroke="#232F3E" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>

<!-- Order1 -> Lattice -->
<path d="M 358,204 V 320 Q 358,328 366,328 H 452 Q 460,328 460,336 V 340"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Order2 -> Lattice -->
<path d="M 828,204 V 320 Q 828,328 820,328 H 548 Q 540,328 540,336 V 340"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="470" y="300" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="500" y="309" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.02em">VPC LATTICE</text>

<!-- Lattice -> Payment3 -->
<line x1="500" y1="388" x2="500" y2="460" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="510" y="414" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="540" y="423" fill="#EC7211" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.02em">ROUTING</text>

<!-- US nodes -->
<rect x="70" y="160" width="96" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="118" y="186" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Frontend</text>
<rect x="190" y="160" width="96" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="238" y="186" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cart</text>
<rect x="310" y="160" width="96" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="358" y="186" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Order</text>

<!-- EU nodes -->
<rect x="540" y="160" width="96" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="588" y="186" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Frontend</text>
<rect x="660" y="160" width="96" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="708" y="186" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cart</text>
<rect x="780" y="160" width="96" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="828" y="186" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Order</text>

<!-- Lattice (focal) -->
<rect x="430" y="340" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="500" y="360" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">VPC Lattice</text>
<text x="500" y="374" fill="#545B64" font-family="'Geist Mono',monospace" font-size="9" text-anchor="middle">service network</text>

<!-- Payment3 -->
<rect x="430" y="460" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="500" y="486" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Payment</text>

<!-- legend -->
<line x1="30" y1="560" x2="930" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="30" y="576" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="130" y1="573" x2="154" y2="573" stroke="#232F3E" stroke-width="1"/>
<text x="162" y="576" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">INTRA-CLUSTER ISTIO CALL</text>
<line x1="420" y1="573" x2="444" y2="573" stroke="#545B64" stroke-width="1.2"/>
<text x="452" y="576" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">TO VPC LATTICE</text>
<rect x="640" y="568" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="660" y="576" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">CROSS-REGION HUB</text>
</svg>
