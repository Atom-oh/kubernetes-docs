  <rect x="532" y="184" width="336" height="88" rx="6" fill="#ffffff" stroke="#DD344C" stroke-width="1"/>
  <rect x="540" y="192" width="18" height="18" rx="9" fill="rgba(221,52,76,0.12)"/>
  <text x="549" y="205" text-anchor="middle" font-size="11" fill="#DD344C">✕</text>
  <text x="568" y="208" font-size="13" font-weight="600" fill="#232F3E">랜덤 쓰기</text>
  <text x="568" y="228" class="mono" font-size="9" fill="#545B64">지원 안 됨 · S3 객체 특성상 불가</text>

  <rect x="532" y="284" width="336" height="88" rx="6" fill="#ffffff" stroke="#DD344C" stroke-width="1"/>
  <rect x="540" y="292" width="18" height="18" rx="9" fill="rgba(221,52,76,0.12)"/>
  <text x="549" y="305" text-anchor="middle" font-size="11" fill="#DD344C">△</text>
  <text x="568" y="308" font-size="13" font-weight="600" fill="#232F3E">작은 파일 많음</text>
  <text x="568" y="328" class="mono" font-size="9" fill="#545B64">요청 수 증가로 오버헤드 발생</text>

  <rect x="532" y="384" width="336" height="88" rx="6" fill="#ffffff" stroke="#DD344C" stroke-width="1"/>
  <rect x="540" y="392" width="18" height="18" rx="9" fill="rgba(221,52,76,0.12)"/>
  <text x="549" y="405" text-anchor="middle" font-size="11" fill="#DD344C">✕</text>
  <text x="568" y="408" font-size="13" font-weight="600" fill="#232F3E">파일 추가 쓰기</text>
  <text x="568" y="428" class="mono" font-size="9" fill="#545B64">지원 안 됨 · 덮어쓰기만 가능</text>

