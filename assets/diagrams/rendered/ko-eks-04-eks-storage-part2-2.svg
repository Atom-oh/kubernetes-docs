  <text x="184" y="562" text-anchor="middle" font-size="9" fill="#009900">✓</text>
  <text x="196" y="562" font-size="11" fill="#545B64">높은 처리량으로 지원</text>
  <circle cx="416" cy="558" r="6" fill="rgba(221,52,76,0.12)"/>
  <text x="424" y="562" text-anchor="middle" font-size="9" fill="#DD344C">✕/△</text>
  <text x="452" y="562" font-size="11" fill="#545B64">미지원 또는 오버헤드 발생</text>
