<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spire-svid-title spire-svid-desc">
<title id="spire-svid-title">Requesting an X.509-SVID</title>
<desc id="spire-svid-desc">Sequence diagram of a workload requesting an identity from the SPIRE Agent, which attests the caller against the Kubernetes API, forwards the matched request to the SPIRE Server, and returns a signed X.509-SVID to the workload.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Lifelines: APP=120 AGENT=360 K8S=600 SERVER=840 -->
<line x1="120" y1="116" x2="120" y2="452" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="360" y1="116" x2="360" y2="452" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="600" y1="116" x2="600" y2="452" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="840" y1="116" x2="840" y2="452" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Activation bars -->
<rect x="356" y="164" width="8" height="248" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="0.8"/>
<rect x="596" y="212" width="8" height="56" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="836" y="308" width="8" height="56" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- Messages -->
<line x1="120" y1="160" x2="360" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="360" y1="208" x2="600" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="600" y1="256" x2="360" y2="256" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="360" y1="304" x2="840" y2="304" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="840" y1="352" x2="360" y2="352" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="360" y1="400" x2="120" y2="400" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<!-- Message labels -->
<rect x="192" y="144" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="240" y="154" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST SVID</text>

<rect x="432" y="192" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="202" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY POD META</text>

<rect x="432" y="240" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="250" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POD METADATA</text>

<rect x="552" y="288" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="600" y="298" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MATCHED SVID</text>

<rect x="552" y="336" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="600" y="346" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">X.509-SVID</text>

<rect x="192" y="384" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="240" y="394" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHED SVID</text>

<!-- Actor boxes -->
<!-- APP (input) -->
<rect x="48" y="60" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="48" y="60" width="144" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<rect x="56" y="68" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
<text x="70" y="77" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
<text x="120" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Workload</text>
<text x="120" y="106" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unix socket</text>

<!-- AGENT (focal) -->
<rect x="288" y="60" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="288" y="60" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<rect x="296" y="68" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="310" y="77" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
<text x="360" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SPIRE Agent</text>
<text x="360" y="106" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Workload API</text>

<!-- K8S API (external) -->
<rect x="528" y="60" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="528" y="60" width="144" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<rect x="536" y="68" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
<text x="552" y="77" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
<text x="600" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes API</text>
<text x="600" y="106" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod attestor</text>

<!-- SERVER (backend) -->
<rect x="768" y="60" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="768" y="60" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="776" y="68" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="790" y="77" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
<text x="840" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SPIRE Server</text>
<text x="840" y="106" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CA · registry</text>

<!-- Legend -->
<line x1="48" y1="500" x2="912" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="48" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

<rect x="48" y="536" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="68" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal actor</text>

<rect x="196" y="533" width="4" height="18" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<text x="208" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Activation</text>

<line x1="320" y1="542" x2="348" y2="542" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="356" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Call</text>

<line x1="424" y1="542" x2="452" y2="542" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="460" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return</text>

<line x1="548" y1="542" x2="576" y2="542" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="584" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Primary response</text>

</svg>