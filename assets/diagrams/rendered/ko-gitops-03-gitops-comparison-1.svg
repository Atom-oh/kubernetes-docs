    <text x="525" y="492" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Notification Ctrl</text>
    <text x="525" y="507" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">controller</text>

