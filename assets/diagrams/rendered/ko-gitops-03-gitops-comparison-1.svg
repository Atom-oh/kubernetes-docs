    <rect x="240" y="272" width="130" height="56" rx="6" fill="#ffffff"/>
    <rect x="240" y="272" width="130" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="248" y="280" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,113,17,0.50)" stroke-width="0.8"/>
    <text x="262" y="289" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="305" y="305" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Source Controller</text>
