    <!-- GIT -> SC -->
    <path d="M 160,149 H 192 Q 200,149 200,157 V 276 Q 200,284 208,284 H 240"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- HELM -> SC (same height, straight) -->
    <line x1="160" y1="300" x2="240" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- OCI -> SC -->
    <path d="M 160,438 H 192 Q 200,438 200,430 V 320 Q 200,312 208,312 H 240"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- SC -> KC -->
    <path d="M 370,291 H 407 Q 415,291 415,283 V 214 Q 415,206 423,206 H 460"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- SC -> HC -->
    <path d="M 370,309 H 407 Q 415,309 415,317 V 388 Q 415,396 423,396 H 460"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- KC -> K8S -->
    <path d="M 590,199 H 687 Q 695,199 695,207 V 283 Q 695,291 703,291 H 800"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- HC -> K8S -->
    <path d="M 590,398 H 687 Q 695,398 695,390 V 317 Q 695,309 703,309 H 800"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Dashed / secondary arrows ===== -->
    <!-- NC -> HC (straight, aligned column) -->
    <line x1="547" y1="462" x2="547" y2="424" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- NC -> SC -->
    <path d="M 503,462 V 403 Q 503,395 495,395 H 348 Q 340,395 340,387 V 328"
          fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
