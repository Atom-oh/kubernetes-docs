<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zone-arch-title zone-arch-desc">
<title id="zone-arch-title">Zone-aware Argo Rollouts architecture with Istio</title>
<desc id="zone-arch-desc">Clients call a single VirtualService, which locality-aware routing (via a DestinationRule) splits into per-zone stable/canary weights, while each zone's own Argo Rollout independently manages only its own zone's route weights on that shared VirtualService.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: Istio Control Plane (drawn before arrows/nodes) -->
<rect x="326" y="40" width="388" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="440" y="44" width="160" height="12" rx="2" fill="#ffffff"/>
<text x="520" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ISTIO CONTROL PLANE</text>

<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<!-- Connector: Clients -> VS (straight, same y) -->
<path d="M 220,96 H 350" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="252" y="76" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="296" y="85" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">test.default</text>

<!-- Connector: DR -> VS (straight, dashed, same y) -->
<path d="M 580,96 H 500" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="505" y="76" width="70" height="12" rx="2" fill="#ffffff"/>
<text x="540" y="85" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">localityLb</text>

<!-- Connector: VS -> Zone A (solid, down) -->
<path d="M 372,128 V 140 Q 372,148 364,148 H 139 Q 131,148 131,156 V 280"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="220" y="140" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="256" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">90/10 wt</text>

<!-- Connector: Zone A -> VS (dashed, up, manages weights) -->
<path d="M 221,280 V 176 Q 221,168 229,168 H 385 Q 393,168 393,160 V 128"
      fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="292" y="160" width="70" height="12" rx="2" fill="#ffffff"/>
<text x="327" y="169" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">manage wt</text>

<!-- Connector: VS -> Zone B (solid, down) -->
<path d="M 415,128 V 196 Q 415,188 423,188 H 467 Q 475,188 475,196 V 280"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="440" y="196" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="476" y="205" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">90/10 wt</text>

<!-- Connector: Zone B -> VS (dashed, up) -->
<path d="M 565,280 V 216 Q 565,208 557,208 H 444 Q 436,208 436,200 V 128"
      fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="480" y="204" width="70" height="12" rx="2" fill="#ffffff"/>
<text x="515" y="213" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">manage wt</text>

<!-- Connector: VS -> Zone C (solid, down) -->
<path d="M 457,128 V 220 Q 457,228 465,228 H 771 Q 779,228 779,236 V 280"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="700" y="228" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="736" y="237" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">90/10 wt</text>

<!-- Connector: Zone C -> VS (dashed, up) -->
<path d="M 869,280 V 236 Q 869,248 861,248 H 487 Q 479,248 479,240 V 128"
      fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="600" y="220" width="70" height="12" rx="2" fill="#ffffff"/>
<text x="635" y="229" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">manage wt</text>

<!-- Clients -->
<rect x="40" y="64" width="180" height="64" rx="6" fill="#ffffff"/>
<rect x="40" y="64" width="180" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="130" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Clients (A/B/C)</text>
<text x="130" y="108" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">us-east-1a/b/c</text>

<!-- VirtualService (focal) -->
<rect x="350" y="64" width="150" height="64" rx="6" fill="#ffffff"/>
<rect x="350" y="64" width="150" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="425" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VirtualService: test</text>
<text x="425" y="108" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">single, shared</text>

<!-- DestinationRule -->
<rect x="580" y="64" width="130" height="64" rx="6" fill="#ffffff"/>
<rect x="580" y="64" width="130" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="645" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">DestinationRule</text>
<text x="645" y="108" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">locality-aware</text>

<!-- Zone A node -->
<rect x="40" y="280" width="272" height="88" rx="6" fill="#ffffff"/>
<rect x="40" y="280" width="272" height="88" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="176" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Zone A · us-east-1a</text>
<text x="176" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rollout test-a</text>
<text x="176" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stable-a / canary-a</text>

<!-- Zone B node -->
<rect x="344" y="280" width="272" height="88" rx="6" fill="#ffffff"/>
<rect x="344" y="280" width="272" height="88" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="480" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Zone B · us-east-1b</text>
<text x="480" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rollout test-b</text>
<text x="480" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stable-b / canary-b</text>

<!-- Zone C node -->
<rect x="648" y="280" width="272" height="88" rx="6" fill="#ffffff"/>
<rect x="648" y="280" width="272" height="88" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="784" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Zone C · us-east-1c</text>
<text x="784" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rollout test-c</text>
<text x="784" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stable-c / canary-c</text>

<!-- legend -->
<line x1="24" y1="392" x2="936" y2="392" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<line x1="30" y1="404" x2="50" y2="404" stroke="#545B64" stroke-width="1.2"/>
<text x="58" y="407" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">TRAFFIC SPLIT</text>
<line x1="200" y1="404" x2="220" y2="404" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
<text x="228" y="407" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">ROLLOUT MANAGES WEIGHTS</text>
</svg>