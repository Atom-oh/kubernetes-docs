<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vpc-cni-arch-title vpc-cni-arch-desc">
  <title id="vpc-cni-arch-title">VPC CNI 아키텍처</title>
  <desc id="vpc-cni-arch-desc">EC2 워커 노드 안의 IPAMD가 CNI Binary에 IP 할당을 지시하여 세 개의 Pod에 IP를 전달하고, Primary/Secondary ENI는 각각 Amazon VPC로부터 기본 IP와 추가 IP를 가져오는 구조를 보여준다.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- zone: EC2 Worker Node -->
  <rect x="40" y="40" width="520" height="340" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="56" y="44" width="160" height="12" rx="2" fill="#ffffff"/>
  <text x="136" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">EC2 워커 노드</text>

  <!-- ===== arrows (drawn before nodes) ===== -->

  <!-- IPAMD -> CNI Binary (vertical, same x) -->
  <line x1="280" y1="128" x2="280" y2="168" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="288" y="142" width="88" height="12" fill="#ffffff"/>
  <text x="332" y="151" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">IP 할당 관리</text>

  <!-- CNI Binary -> Pod 1 (up+right elbow) -->
  <path d="M380,182 H522 Q530,182 530,174 V124 Q530,116 538,116 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="569" y="96" width="64" height="12" fill="#ffffff"/>
  <text x="601" y="105" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">IP 할당</text>

  <!-- CNI Binary -> Pod 2 (straight, same y) -->
  <line x1="380" y1="196" x2="680" y2="196" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="498" y="176" width="64" height="12" fill="#ffffff"/>
  <text x="530" y="185" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">IP 할당</text>

  <!-- CNI Binary -> Pod 3 (down+right elbow) -->
  <path d="M380,210 H522 Q530,210 530,218 V268 Q530,276 538,276 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="569" y="256" width="64" height="12" fill="#ffffff"/>
  <text x="601" y="265" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">IP 할당</text>

  <!-- Primary ENI -> Amazon VPC (down+right elbow) -->
  <path d="M204,316 H434 Q442,316 442,324 V396 Q442,404 450,404 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="525" y="384" width="80" height="12" fill="#ffffff"/>
  <text x="565" y="393" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">기본 네트워크</text>

  <!-- Secondary ENI 1 -> Amazon VPC (down+right elbow) -->
  <path d="M364,328 H514 Q522,328 522,336 V420 Q522,428 530,428 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="565" y="408" width="80" height="12" fill="#ffffff"/>
  <text x="605" y="417" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">추가 IP</text>

  <!-- Secondary ENI 2 -> Amazon VPC (down+right elbow) -->
  <path d="M524,340 H594 Q602,340 602,348 V444 Q602,452 610,452 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="613" y="432" width="64" height="12" fill="#ffffff"/>
  <text x="645" y="441" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">추가 IP</text>

  <!-- ===== nodes ===== -->

  <!-- IPAMD -->
  <rect x="180" y="72" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="180" y="72" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="280" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">IPAMD</text>
  <text x="280" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">L-IPAM Daemon</text>

  <!-- CNI Binary (focal) -->
  <rect x="180" y="168" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="180" y="168" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="280" y="194" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CNI Binary</text>
  <text x="280" y="210" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">kubelet CNI plugin</text>

  <!-- Primary ENI -->
  <rect x="64" y="300" width="140" height="56" rx="6" fill="#ffffff"/>
  <rect x="64" y="300" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="134" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Primary ENI</text>
  <text x="134" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">eth0</text>

  <!-- Secondary ENI 1 -->
  <rect x="224" y="300" width="140" height="56" rx="6" fill="#ffffff"/>
  <rect x="224" y="300" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="294" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Secondary ENI 1</text>
  <text x="294" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">eth1</text>

  <!-- Secondary ENI 2 -->
  <rect x="384" y="300" width="140" height="56" rx="6" fill="#ffffff"/>
  <rect x="384" y="300" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="454" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Secondary ENI 2</text>
  <text x="454" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">eth2</text>

  <!-- Pod 1 -->
  <rect x="680" y="88" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="680" y="88" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="760" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 1</text>

  <!-- Pod 2 -->
  <rect x="680" y="168" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="680" y="168" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="760" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 2</text>

  <!-- Pod 3 -->
  <rect x="680" y="248" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="680" y="248" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="760" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 3</text>

  <!-- Amazon VPC -->
  <rect x="680" y="380" width="200" height="96" rx="6" fill="#ffffff"/>
  <rect x="680" y="380" width="200" height="96" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="780" y="422" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Amazon VPC</text>
  <text x="780" y="438" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">VPC 서브넷 · IP 풀</text>

  <!-- ===== legend ===== -->
  <line x1="40" y1="508" x2="920" y2="508" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="524" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

  <circle cx="140" cy="520" r="3.5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="150" y="524" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">CNI Binary (핵심 구성요소)</text>

  <circle cx="380" cy="520" r="3.5" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="390" y="524" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">노드 내부 구성요소</text>

  <circle cx="600" cy="520" r="3.5" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="610" y="524" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Pod (워크로드)</text>

  <circle cx="800" cy="520" r="3.5" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="810" y="524" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Amazon VPC (외부 네트워크)</text>
</svg>
