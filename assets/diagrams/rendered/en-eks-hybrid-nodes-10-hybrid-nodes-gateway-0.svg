<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="hng-topo-title hng-topo-desc">
    <title id="hng-topo-title">Hybrid nodes gateway network topology</title>
    <desc id="hng-topo-desc">Architecture diagram showing a leader gateway pod in the AWS VPC bridging cloud nodes and the EKS control plane to on-premises hybrid nodes over a VXLAN tunnel, with a standby gateway ready to take over and a VPC route table steering pod traffic to the leader's ENI.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="8 0, 0 3, 8 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (drawn before arrows/nodes) -->
    <rect x="40" y="56" width="600" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="404" y="60" width="200" height="12" rx="2" fill="#ffffff"/>
    <text x="504" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AWS VPC · 10.0.0.0/16</text>

    <rect x="700" y="180" width="220" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="740" y="184" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="810" y="193" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ON-PREMISES</text>

    <!-- Arrows (behind nodes) -->
    <!-- API <-> CN1 -->
    <line x1="200" y1="152" x2="200" y2="196" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <!-- CN1 <-> CN2 -->
    <line x1="284" y1="216" x2="356" y2="216" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <!-- API <-> HN1 (crosses to on-prem zone) -->
    <path d="M 240,128 H 660 Q 668,128 668,136 V 220 Q 668,228 676,228 H 700"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <!-- RT -> GW1 -->
    <line x1="200" y1="352" x2="200" y2="388" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- GW1 <-> HN1 (VXLAN) -->
    <path d="M 284,388 H 660 Q 668,388 668,380 V 268 Q 668,260 676,260 H 700"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-start)"/>
    <!-- GW1 <-> HN2 -->
    <path d="M 284,400 H 652 Q 660,400 660,408 V 292 Q 660,284 668,284 H 700"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <!-- GW1 -.-> GW2 lease election -->
    <path d="M 284,412 H 332 Q 340,412 340,420 V 452 Q 340,460 348,460 H 356"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="176" y="166" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="176" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CP ENIS</text>

    <rect x="292" y="210" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="220" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VPC NATIVE</text>

    <rect x="620" y="122" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="648" y="132" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CP ENIS</text>

    <rect x="176" y="362" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="372" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTES</text>

    <rect x="612" y="376" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="656" y="386" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VXLAN VNI 2</text>

    <rect x="612" y="322" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="652" y="332" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VXLAN VNI 2</text>

    <rect x="288" y="392" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="308" y="401" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ELECT</text>

    <!-- Node: API Server / etcd (EKS control plane) -->
    <rect x="120" y="88" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="120" y="88" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="128" y="96" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="142" y="105" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CP</text>
    <text x="200" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EKS Control Plane</text>
    <text x="200" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">API server + etcd</text>

    <!-- Node: Cloud Node 1 -->
    <rect x="120" y="196" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="120" y="196" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="128" y="204" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="142" y="213" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VPC</text>
    <text x="200" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cloud Node 1</text>
    <text x="200" y="243" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.64.0/24</text>

    <!-- Node: Cloud Node 2 -->
    <rect x="356" y="196" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="356" y="196" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="364" y="204" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="378" y="213" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VPC</text>
    <text x="436" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cloud Node 2</text>
    <text x="436" y="243" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.65.0/24</text>

    <!-- Node: VPC Route Table (store) -->
    <rect x="120" y="296" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="120" y="296" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="128" y="304" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="142" y="313" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RT</text>
    <text x="200" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC Route Table</text>
    <text x="200" y="343" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.100.0.0/24→GW1</text>

    <!-- Node: Gateway Pod (Leader) — focal -->
    <rect x="120" y="388" width="164" height="64" rx="6" fill="#ffffff"/>
    <rect x="120" y="388" width="164" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="128" y="396" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,113,17,0.50)" stroke-width="0.8"/>
    <text x="144" y="405" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LDR</text>
    <text x="202" y="420" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway Pod (Leader)</text>
    <text x="202" y="436" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hybrid_vxlan0</text>
    <text x="202" y="448" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VNI 2 · UDP 8472</text>

    <!-- Node: Gateway Pod (Standby) -->
    <rect x="356" y="428" width="164" height="56" rx="6" fill="#ffffff"/>
    <rect x="356" y="428" width="164" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="364" y="436" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="384" y="445" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STBY</text>
    <text x="438" y="460" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway Pod (Standby)</text>
    <text x="438" y="475" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hybrid_vxlan0 · warm</text>

    <!-- Node: Hybrid Node 1 -->
    <rect x="700" y="196" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="700" y="196" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="708" y="204" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="722" y="213" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DC</text>
    <text x="800" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Hybrid Node 1</text>
    <text x="800" y="243" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.100.0.0/24 · cilium</text>

    <!-- Node: Hybrid Node 2 -->
    <rect x="700" y="268" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="700" y="268" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="708" y="276" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="722" y="285" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DC</text>
    <text x="800" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Hybrid Node 2</text>
    <text x="800" y="315" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.100.1.0/24 · cilium</text>

    <!-- Legend -->
    <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="544" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Leader / focal</text>

    <rect x="200" y="544" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="220" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Standby</text>

    <rect x="336" y="544" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="356" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Route store</text>

    <line x1="500" y1="550" x2="528" y2="550" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="536" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">VXLAN tunnel</text>

    <line x1="668" y1="550" x2="696" y2="550" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="704" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Lease / control</text>
  </svg>