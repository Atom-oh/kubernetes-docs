<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vxlan-pkt-title vxlan-pkt-desc">
    <title id="vxlan-pkt-title">VXLAN packet structure</title>
    <desc id="vxlan-pkt-desc">Layer stack showing a VXLAN-encapsulated packet from the outer Ethernet header down through the outer IP header and the VXLAN header carrying the VNI, to the original inner Ethernet frame it wraps.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Direction indicator, left margin -->
    <path d="M 40,140 V 452" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="0" y="292" width="14" height="20" rx="2" fill="#ffffff"/>
    <text x="7" y="300" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">enc</text>
    <text x="7" y="310" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">↓</text>

    <!-- Layer 1: Outer Ethernet Header -->
    <rect x="80" y="140" width="800" height="72" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="112" y="182" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">L1</text>
    <text x="160" y="182" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Outer Ethernet Header</text>
    <text x="848" y="182" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">MAC framing</text>

    <!-- Layer 2: Outer IP Header -->
    <rect x="80" y="212" width="800" height="72" fill="#F2F3F3" stroke="#232F3E" stroke-width="1"/>
    <text x="112" y="254" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">L2</text>
    <text x="160" y="254" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Outer IP Header</text>
    <text x="848" y="254" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">udp/8472</text>

    <!-- Layer 3: VXLAN Header (focal) -->
    <rect x="80" y="284" width="800" height="72" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="112" y="326" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace">L3</text>
    <text x="160" y="326" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">VXLAN Header</text>
    <text x="848" y="326" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">carries VNI</text>

    <!-- Layer 4: Original Ethernet Frame -->
    <rect x="80" y="356" width="800" height="96" fill="#F2F3F3" stroke="#232F3E" stroke-width="1"/>
    <text x="112" y="408" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace">L4</text>
    <text x="160" y="408" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Original Ethernet Frame</text>
    <text x="848" y="408" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">inner header + payload</text>

    <!-- Outer silhouette -->
    <rect x="80" y="140" width="800" height="312" fill="none" stroke="#232F3E" stroke-width="1"/>

    <!-- Legend -->
    <line x1="40" y1="504" x2="920" y2="504" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="520" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="140" y="514" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="522" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Outer header</text>

    <rect x="320" y="514" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="340" y="522" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">VXLAN header (VNI)</text>

    <rect x="540" y="514" width="14" height="10" rx="2" fill="#F2F3F3" stroke="#232F3E" stroke-width="1"/>
    <text x="560" y="522" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Inner frame / payload</text>
  </svg>