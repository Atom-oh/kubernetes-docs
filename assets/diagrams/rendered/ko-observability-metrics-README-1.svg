<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="storage-title storage-desc">
    <title id="storage-title">단기 저장과 장기 저장 계층의 용도 분리</title>
    <desc id="storage-desc">15~30일 보존하는 Prometheus의 단기 저장이 실시간 알림·최근 트렌드·디버깅을 담당하고, 그 데이터를 VictoriaMetrics 등 장기 저장으로 넘겨 용량 계획·연간 트렌드·규정 준수·비용 분석에 쓰는 구조를 보여주는 아키텍처 다이어그램.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="460" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="96" width="400" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="164" y="100" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">단기 저장 · PROMETHEUS</text>

    <rect x="520" y="96" width="400" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="644" y="100" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">장기 저장 · REMOTE STORAGE</text>

    <!-- Cross-zone headline arrow: P -> L (accent) -->
    <path d="M328,168 H632" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="440" y="146" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="155" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REMOTE_WRITE</text>

    <!-- Arrows: P fans down to R1/R2/R3 -->
    <path d="M196,196 V250 Q196,258 188,258 H120 Q112,258 112,266 V336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M240,196 V336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M284,196 V250 Q284,258 292,258 H360 Q368,258 368,266 V336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: L fans down to 4 children -->
    <path d="M668,196 V230 Q668,238 660,238 H584 Q576,238 576,246 V336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M704,196 V230 Q704,238 696,238 H680 Q672,238 672,246 V336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M736,196 V230 Q736,238 744,238 H760 Q768,238 768,246 V336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M772,196 V230 Q772,238 780,238 H856 Q864,238 864,246 V336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: Prometheus (short-term hub) -->
    <rect x="152" y="140" width="176" height="56" rx="6" fill="#ffffff"/>
    <rect x="152" y="140" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
    <text x="240" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">15-30일 보존</text>

    <!-- Nodes: real-time uses -->
    <rect x="56" y="336" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="56" y="336" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="112" y="366" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">실시간</text>
    <text x="112" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">알림</text>

    <rect x="184" y="336" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="184" y="336" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="366" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">최근</text>
    <text x="240" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">트렌드</text>

    <rect x="312" y="336" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="312" y="336" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="368" y="366" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">즉각적</text>
    <text x="368" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">디버깅</text>

    <!-- Node: VictoriaMetrics (long-term hub, focal) -->
    <rect x="632" y="140" width="176" height="56" rx="6" fill="#ffffff"/>
    <rect x="632" y="140" width="176" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="640" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.40)" stroke-width="0.8"/>
    <text x="656" y="157" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TSDB</text>
    <text x="720" y="170" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VictoriaMetrics</text>
    <text x="720" y="185" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Mimir / Thanos · 1년+</text>

    <!-- Nodes: long-term uses -->
    <rect x="536" y="336" width="80" height="64" rx="6" fill="#ffffff"/>
    <rect x="536" y="336" width="80" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="576" y="364" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">용량</text>
    <text x="576" y="378" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">계획</text>

    <rect x="632" y="336" width="80" height="64" rx="6" fill="#ffffff"/>
    <rect x="632" y="336" width="80" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="672" y="364" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">연간</text>
    <text x="672" y="378" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">트렌드</text>

    <rect x="728" y="336" width="80" height="64" rx="6" fill="#ffffff"/>
    <rect x="728" y="336" width="80" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="768" y="364" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">규정</text>
    <text x="768" y="378" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">준수</text>

    <rect x="824" y="336" width="80" height="64" rx="6" fill="#ffffff"/>
    <rect x="824" y="336" width="80" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="864" y="364" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">비용</text>
    <text x="864" y="378" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">분석</text>
  </svg>