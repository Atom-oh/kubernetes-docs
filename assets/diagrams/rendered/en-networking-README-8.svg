<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-networking-README-8-title en-networking-README-8-desc">
<title id="en-networking-README-8-title">EKS Default Networking</title>
<desc id="en-networking-README-8-desc">Internet traffic reaches EKS worker nodes through an Internet Gateway and an Application Load Balancer, or directly through a Network Load Balancer, while the AWS-managed control plane sits alongside the node group inside the VPC.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- zone: VPC -->
<rect x="140" y="380" width="680" height="160" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="152" y="388" width="184" height="12" rx="2" fill="#ffffff"/>
<text x="244" y="397" fill="rgba(35,47,62,0.4)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">VPC · EKS CLUSTER (2 AZs)</text>

<!-- connectors -->
<path d="M453,98 H258 Q250,98 250,106 V160" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M507,98 H702 Q710,98 710,106 V160" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="250" y1="208" x2="250" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M227,308 V366 H459 Q467,366 467,374 V420" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M273,308 V346 H682 Q690,346 690,354 V420" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M710,208 V390 H698 a8,8 0 0,0 -16,0 H521 Q513,390 513,398 V420" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Internet -->
<rect x="400" y="50" width="160" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="480" y="78" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Internet</text>

<!-- IGW -->
<rect x="180" y="160" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="250" y="184" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Internet Gateway</text>

<!-- NAT (no edges, present for context) -->
<rect x="640" y="260" width="140" height="48" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="710" y="280" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">NAT Gateway</text>
<text x="710" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">outbound only</text>

<!-- ALB -->
<rect x="180" y="260" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="250" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ALB</text>
<text x="250" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">internet-facing</text>

<!-- NLB -->
<rect x="640" y="160" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="710" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">NLB</text>
<text x="710" y="196" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L4, direct</text>

<!-- Control Plane (focal) -->
<rect x="180" y="420" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="260" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Control Plane</text>
<text x="260" y="456" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AWS managed</text>

<!-- Node1 -->
<rect x="420" y="420" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="490" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Worker Node 1</text>
<text x="490" y="456" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">private subnet</text>

<!-- Node2 -->
<rect x="620" y="420" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="690" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Worker Node 2</text>
<text x="690" y="456" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">private subnet</text>
</svg>