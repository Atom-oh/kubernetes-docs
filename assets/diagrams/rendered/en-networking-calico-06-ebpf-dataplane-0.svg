<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ebpf0-title ebpf0-desc">
    <title id="ebpf0-title">eBPF load path from user space into kernel hooks</title>
    <desc id="ebpf0-desc">Diagram showing an eBPF program moving from user space, through the libbpf loader and kernel verifier and JIT compiler, into kernel hooks that share BPF maps with the verifying application.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="56" width="880" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="452" y="60" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="490" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">USER SPACE</text>

    <rect x="40" y="236" width="880" height="170" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="440" y="240" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="484" y="249" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KERNEL SPACE</text>

    <!-- Arrows (drawn before boxes) -->
    <line x1="560" y1="128" x2="600" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M 680,160 V 202 Q 680,210 672,210 H 230 Q 222,210 222,218 V 280"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="292" y1="312" x2="324" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="464" y1="312" x2="496" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="636" y1="312" x2="668" y2="312" stroke="#EC7211" stroke-width="1.2" marker-start="url(#arrow-accent-start)" marker-end="url(#arrow-accent)"/>

    <path d="M 280,160 V 432 Q 280,440 288,440 H 730 Q 738,440 738,432 V 344"
          fill="none" stroke="#545B64" stroke-width="1" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="204" y="198" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="224" y="207" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALID</text>

    <rect x="490" y="446" width="46" height="12" rx="2" fill="#ffffff"/>
    <text x="513" y="455" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYSCALL</text>

    <!-- Node: Application -->
    <rect x="200" y="96" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="200" y="96" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="208" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="222" y="113" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="280" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    <text x="280" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user process</text>

    <!-- Node: eBPF Program -->
    <rect x="400" y="96" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="96" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="408" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="422" y="113" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
    <text x="480" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF Program</text>
    <text x="480" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">C / Rust</text>

    <!-- Node: eBPF Loader -->
    <rect x="600" y="96" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="96" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="608" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="622" y="113" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LDR</text>
    <text x="680" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF Loader</text>
    <text x="680" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">libbpf</text>

    <!-- Node: eBPF Verifier -->
    <rect x="152" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="152" y="280" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="160" y="288" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="174" y="297" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VFY</text>
    <text x="222" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF Verifier</text>
    <text x="222" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">safety check</text>

    <!-- Node: JIT Compiler -->
    <rect x="324" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="324" y="280" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="332" y="288" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="346" y="297" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JIT</text>
    <text x="394" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">JIT Compiler</text>
    <text x="394" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">native code</text>

    <!-- Node: Kernel Hooks -->
    <rect x="496" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="496" y="280" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="504" y="288" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="518" y="297" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
    <text x="566" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kernel Hooks</text>
    <text x="566" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">XDP · TC · socket</text>

    <!-- Node: BPF Maps (focal) -->
    <rect x="668" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="668" y="280" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="676" y="288" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="690" y="297" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAP</text>
    <text x="738" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">BPF Maps</text>
    <text x="738" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared state</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="532" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="60" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Load path step</text>

    <rect x="220" y="532" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="240" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Shared BPF map (focal)</text>

    <line x1="440" y1="537" x2="468" y2="537" stroke="#545B64" stroke-width="1" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
    <text x="476" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Bidirectional map access</text>
  </svg>