<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl1 desc1">
  <title id="ttl1">Circuit Breaker 상태 전이도</title>
  <desc id="desc1">Circuit Breaker는 정상 상태인 Closed에서 연속 에러가 임계값을 넘으면 즉시 실패하는 Open 상태로 전환되고, 대기 시간이 지나면 제한된 요청만 허용하는 HalfOpen 상태를 거쳐 요청이 성공하면 Closed로 복귀하고 다시 실패하면 Open으로 돌아간다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="32" y="32" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.18em">STATE MACHINE</text>
  <text x="32" y="56" fill="#232F3E" font-size="20" font-weight="700">Circuit Breaker 개요</text>

  <!-- ===== edges (before nodes) ===== -->
  <!-- start -> Closed -->
  <circle cx="80" cy="176" r="6" fill="#232F3E"/>
  <path d="M86,176 H140" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Closed -> Open : 연속 에러 임계값 초과 (straight horizontal) -->
  <path d="M300,176 H660" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="392" y="156" width="176" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="165" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">연속 에러 임계값 초과</text>

  <!-- Open -> HalfOpen : 대기 시간 경과 -->
  <path d="M700,208 V294 Q700,302 692,302 H568 Q560,302 560,310 V416"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="600" y="296" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="648" y="305" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">대기 시간 경과</text>

  <!-- HalfOpen -> Open : 요청 실패 (offset path, my=282) -->
  <path d="M460,416 V290 Q460,282 468,282 H752 Q760,282 760,274 V208"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="712" y="260" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="744" y="269" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">요청 실패</text>

  <!-- HalfOpen -> Closed : 요청 성공 -->
  <path d="M400,416 V326 Q400,318 392,318 H268 Q260,318 260,310 V208"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="192" y="326" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="224" y="335" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">요청 성공</text>

  <!-- ===== nodes ===== -->
  <!-- Closed -->
  <rect x="140" y="144" width="160" height="64" rx="8" fill="#ffffff"/>
  <rect x="140" y="144" width="160" height="64" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="220" y="172" fill="#232F3E" font-size="13" font-weight="600" text-anchor="middle">Closed</text>
  <text x="220" y="190" fill="#545B64" font-size="9" class="mono" text-anchor="middle">정상 · 모든 요청 통과</text>

  <!-- Open (focal / error state) -->
  <rect x="660" y="144" width="160" height="64" rx="8" fill="rgba(255,153,0,0.10)"/>
  <rect x="660" y="144" width="160" height="64" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="740" y="172" fill="#232F3E" font-size="13" font-weight="600" text-anchor="middle">Open</text>
  <text x="740" y="190" fill="#EC7211" font-size="9" class="mono" text-anchor="middle">차단 · 요청 즉시 실패</text>

  <!-- HalfOpen -->
  <rect x="380" y="416" width="200" height="64" rx="8" fill="#ffffff"/>
  <rect x="380" y="416" width="200" height="64" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="444" fill="#232F3E" font-size="13" font-weight="600" text-anchor="middle">HalfOpen</text>
  <text x="480" y="462" fill="#545B64" font-size="9" class="mono" text-anchor="middle">테스트 · 제한된 요청 허용</text>

  <!-- Legend -->
  <line x1="32" y1="536" x2="928" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="32" y="552" width="12" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="52" y="562" fill="#545B64" font-size="9" class="mono">차단 상태 (Circuit Open)</text>
</svg>