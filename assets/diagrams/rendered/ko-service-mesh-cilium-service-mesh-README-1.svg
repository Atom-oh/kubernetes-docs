<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="arch-compare-title arch-compare-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="arch-compare-title">사이드카 기반과 eBPF 기반 트래픽 처리 계층 비교</title>
    <desc id="arch-compare-desc">Istio의 사이드카 방식은 각 Envoy가 L3/L4와 L7을 모두 처리하지만, Cilium eBPF 방식은 커널의 eBPF가 L3/L4를 처리하고 L7만 공유 Envoy로 넘기는 구조적 차이를 보여주는 아키텍처 다이어그램입니다.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="8 0, 0 3, 8 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zone 1: Sidecar-based (Istio) -->
    <rect x="40" y="60" width="880" height="180" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="64" width="216" height="12" rx="2" fill="#ffffff"/>
    <text x="164" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SIDECAR-BASED (ISTIO)</text>

    <!-- Zone 2: eBPF-based (Cilium) -->
    <rect x="40" y="280" width="880" height="180" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8"/>
    <rect x="56" y="284" width="200" height="12" rx="2" fill="#ffffff"/>
    <text x="156" y="293" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EBPF-BASED (CILIUM)</text>

    <!-- Row1 arrows: App -> Envoy(L3/L4+L7) -> Network -> Envoy -> App -->
    <line x1="128" y1="150" x2="200" y2="150" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="312" y1="150" x2="424" y2="150" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="536" y1="150" x2="648" y2="150" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="760" y1="150" x2="832" y2="150" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Row1 nodes -->
    <rect x="48" y="120" width="80" height="60" rx="6" fill="#ffffff"/>
    <rect x="48" y="120" width="80" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="88" y="147" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App</text>
    <text x="88" y="163" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">container</text>

    <rect x="200" y="116" width="112" height="68" rx="6" fill="#ffffff"/>
    <rect x="200" y="116" width="112" height="68" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="256" y="143" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>
    <text x="256" y="159" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L3/L4 + L7</text>

    <rect x="424" y="120" width="112" height="60" rx="6" fill="#ffffff"/>
    <rect x="424" y="120" width="112" height="60" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="154" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Network</text>

    <rect x="648" y="116" width="112" height="68" rx="6" fill="#ffffff"/>
    <rect x="648" y="116" width="112" height="68" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="704" y="143" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>
    <text x="704" y="159" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L3/L4 + L7</text>

    <rect x="832" y="120" width="80" height="60" rx="6" fill="#ffffff"/>
    <rect x="832" y="120" width="80" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="872" y="147" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App</text>
    <text x="872" y="163" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">container</text>

    <!-- Row2 arrows: App -> eBPF(L3/L4) -> SharedEnvoy(L7, bidirectional) -> eBPF(L3/L4) -> App -->
    <line x1="128" y1="370" x2="200" y2="370" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="312" y1="358" x2="424" y2="358" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <rect x="349" y="336" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="364" y="345" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">L7</text>
    <line x1="536" y1="370" x2="648" y2="370" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="760" y1="370" x2="832" y2="370" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Row2 nodes -->
    <rect x="48" y="340" width="80" height="60" rx="6" fill="#ffffff"/>
    <rect x="48" y="340" width="80" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="88" y="367" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App</text>
    <text x="88" y="383" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">container</text>

    <rect x="200" y="340" width="112" height="60" rx="6" fill="#ffffff"/>
    <rect x="200" y="340" width="112" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="256" y="367" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF</text>
    <text x="256" y="383" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L3/L4</text>

    <rect x="424" y="328" width="112" height="60" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="424" y="328" width="112" height="60" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="352" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Shared Envoy</text>
    <text x="480" y="368" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L7 only</text>

    <rect x="648" y="340" width="112" height="60" rx="6" fill="#ffffff"/>
    <rect x="648" y="340" width="112" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="704" y="367" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF</text>
    <text x="704" y="383" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L3/L4</text>

    <rect x="832" y="340" width="80" height="60" rx="6" fill="#ffffff"/>
    <rect x="832" y="340" width="80" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="872" y="367" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App</text>
    <text x="872" y="383" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">container</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="220" cy="513" r="4" fill="none" stroke="#545B64" stroke-width="1.2"/>
    <text x="232" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Envoy가 L3/L4+L7 모두 처리</text>
    <circle cx="560" cy="513" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="572" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">eBPF가 L3/L4, 공유 Envoy가 L7만 처리</text>
  </svg>