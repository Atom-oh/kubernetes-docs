<title id="en-service-mesh-istio-03-architecture-0-title">Istiod Internal Structure</title>
<desc id="en-service-mesh-istio-03-architecture-0-desc">Architecture diagram showing Istiod's single process consolidating Pilot, Citadel, and Galley functions, validating configuration from the Kubernetes API and pushing xDS configuration and X.509 certificates to Envoy sidecar proxies.</desc>
