<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t0 d0">
    <title id="t0">ArgoCD 아키텍처</title>
    <desc id="d0">Git 저장소의 변경 사항을 ArgoCD의 API 서버가 중심이 되어 Repo Server와 Application Controller로 전달하고, 그 결과를 Kubernetes 클러스터에 반영하는 구조를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: ArgoCD control plane -->
    <rect x="190" y="70" width="540" height="432" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="425" y="74" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="460" y="83" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">ARGOCD</text>

    <!-- ===== Arrows (drawn before boxes) ===== -->
    <!-- GIT -> REPO -->
    <line x1="170" y1="356" x2="230" y2="356" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- REPO -> CTRL -->
    <line x1="360" y1="356" x2="560" y2="356" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CTRL -> K8S -->
    <line x1="690" y1="356" x2="790" y2="356" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- UI -> API (top port fan-in, left point) -->
    <path d="M 295,162 V 177 Q 295,185 303,185 H 427 Q 435,185 435,193 V 208"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- DEX -> API (top port fan-in, right point) -->
    <path d="M 625,162 V 177 Q 625,185 617,185 H 493 Q 485,185 485,193 V 208"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- API -> CTRL (bottom port fan-out, right point -> CTRL top) -->
    <path d="M 485,268 V 291 Q 485,299 493,299 H 617 Q 625,299 625,307 V 330"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- API -> REDIS (bottom port fan-out, left point -> REDIS top) -->
    <path d="M 435,268 V 341 Q 435,349 443,349 H 452 Q 460,349 460,357 V 430"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Arrow labels (masked, 6-10px gap above stroke) ===== -->
    <rect x="180" y="336" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="345" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SYNC</text>

    <rect x="430" y="336" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="460" y="345" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">MANIFEST</text>

    <rect x="714" y="336" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="740" y="345" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">APPLY</text>

    <rect x="345" y="165" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="365" y="174" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

    <rect x="535" y="165" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="555" y="174" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SSO</text>

    <rect x="527" y="279" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="555" y="288" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">STATUS</text>

    <rect x="443" y="298" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="461" y="307" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CACHE</text>

    <!-- ===== Nodes ===== -->
    <!-- GIT (external) -->
    <rect x="40" y="330" width="130" height="52" rx="6" fill="#ffffff"/>
    <rect x="40" y="330" width="130" height="52" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="48" y="338" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="62" y="347" fill="#545B64" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="105" y="358" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Git Repository</text>
    <text x="105" y="373" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">git repo</text>

    <!-- UI (backend) -->
    <rect x="230" y="110" width="130" height="52" rx="6" fill="#ffffff"/>
    <rect x="230" y="110" width="130" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="238" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="252" y="127" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
    <text x="295" y="140" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Web UI</text>
    <text x="295" y="155" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">argocd ui</text>

    <!-- DEX (backend) -->
    <rect x="560" y="110" width="130" height="52" rx="6" fill="#ffffff"/>
    <rect x="560" y="110" width="130" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="568" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="582" y="127" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SSO</text>
    <text x="625" y="140" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Dex</text>
    <text x="625" y="155" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">oidc</text>

    <!-- API Server (focal) -->
    <rect x="385" y="208" width="150" height="60" rx="6" fill="#ffffff"/>
    <rect x="385" y="208" width="150" height="60" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="393" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,113,17,0.50)" stroke-width="0.8"/>
    <text x="407" y="225" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="460" y="242" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API Server</text>
    <text x="460" y="257" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">api server</text>

    <!-- Repo Server -->
    <rect x="230" y="330" width="130" height="52" rx="6" fill="#ffffff"/>
    <rect x="230" y="330" width="130" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="238" y="338" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="252" y="347" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="295" y="360" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Repo Server</text>
    <text x="295" y="375" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">repo server</text>

    <!-- Application Controller -->
    <rect x="560" y="330" width="130" height="52" rx="6" fill="#ffffff"/>
    <rect x="560" y="330" width="130" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="568" y="338" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="582" y="347" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="625" y="358" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">App Controller</text>
    <text x="625" y="373" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">application controller</text>

    <!-- Redis Cache (store) -->
    <rect x="385" y="430" width="150" height="52" rx="6" fill="#ffffff"/>
    <rect x="385" y="430" width="150" height="52" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="393" y="438" width="24" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="405" y="447" fill="#545B64" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
    <text x="460" y="460" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Redis Cache</text>
    <text x="460" y="475" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">cache</text>

    <!-- K8S (external) -->
    <rect x="790" y="330" width="130" height="52" rx="6" fill="#ffffff"/>
    <rect x="790" y="330" width="130" height="52" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="798" y="338" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="812" y="347" fill="#545B64" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="855" y="360" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Kubernetes</text>
    <text x="855" y="375" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">cluster</text>

    <!-- ===== Legend ===== -->
    <line x1="40" y1="530" x2="920" y2="530" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="546" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="562" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="60" y="570" fill="#545B64" font-size="8.5">중심 서비스</text>

    <rect x="190" y="562" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="210" y="570" fill="#545B64" font-size="8.5">컨트롤 플레인 구성요소</text>

    <rect x="400" y="562" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="420" y="570" fill="#545B64" font-size="8.5">스토어</text>

    <rect x="520" y="562" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="540" y="570" fill="#545B64" font-size="8.5">외부 시스템</text>
  </svg>
