<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc">
    <title id="d1-title">Trace 전체 요청 여정</title>
    <desc id="d1-desc">API Gateway에서 시작한 하나의 요청이 User·Order·Payment·Notification 서비스로 분기되며 각 구간(Span)의 소요 시간이 합산되어 총 500ms의 Trace를 이룬다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Primary flow (solid) -->
    <path d="M184,232 H224 Q232,232 232,224 V98 Q232,90 240,90 H280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M184,252 H224 Q232,252 232,260 V382 Q232,390 240,390 H280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M424,382 H464 Q472,382 472,374 V328 Q472,320 480,320 H520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M424,402 H464 Q472,402 472,410 V452 Q472,460 480,460 H520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Aggregation (dashed, into Total) -->
    <path d="M424,90 H584 Q592,90 592,98 V216 Q592,224 600,224 H760" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <path d="M664,320 H704 Q712,320 712,312 V248 Q712,240 720,240 H760" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <path d="M664,460 H704 Q712,460 712,452 V264 Q712,256 720,256 H760" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Node: API Gateway -->
    <rect x="40" y="208" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="208" width="144" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="112" y="238" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">API Gateway</text>
    <text x="112" y="254" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">150ms</text>

    <!-- Node: User Service -->
    <rect x="280" y="58" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="280" y="58" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="352" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">User Service</text>
    <text x="352" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">50ms</text>

    <!-- Node: Order Service -->
    <rect x="280" y="358" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="280" y="358" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="352" y="388" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Order Service</text>
    <text x="352" y="404" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">200ms</text>

    <!-- Node: Payment Service -->
    <rect x="520" y="288" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="520" y="288" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="592" y="318" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Payment Service</text>
    <text x="592" y="334" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">300ms</text>

    <!-- Node: Notification -->
    <rect x="520" y="428" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="520" y="428" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="592" y="458" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Notification</text>
    <text x="592" y="474" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">100ms</text>

    <!-- Node: Total (focal) -->
    <rect x="760" y="208" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="760" y="208" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="832" y="238" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">총 소요 시간</text>
    <text x="832" y="254" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">500ms</text>

    <!-- Legend -->
    <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <line x1="40" y1="554" x2="68" y2="554" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="76" y="558" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">요청 경로 (Span)</text>

    <line x1="260" y1="554" x2="288" y2="554" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="296" y="558" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">시간 합산</text>

    <rect x="460" y="549" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="558" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Trace 총합 (focal)</text>
  </svg>