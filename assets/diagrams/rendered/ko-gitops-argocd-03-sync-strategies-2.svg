<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="selfheal-drift-title selfheal-drift-desc">
      <title id="selfheal-drift-title">selfHeal=true일 때 수동 변경을 되돌리는 흐름</title>
      <desc id="selfheal-drift-desc">사용자가 kubectl로 레플리카 수를 직접 바꾸면 ArgoCD가 Git과의 차이를 드리프트로 감지하고, selfHeal 옵션에 따라 클러스터 상태를 Git에 선언된 값으로 되돌리는 과정을 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Lifelines: User=120, K8s=400, ArgoCD=660, Git=880 -->
      <line x1="120" y1="128" x2="120" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="400" y1="128" x2="400" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="660" y1="128" x2="660" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="880" y1="128" x2="880" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation: ArgoCD spans most of the flow -->
      <rect x="656" y="216" width="8" height="272" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

      <!-- M1: User -> K8s -->
      <line x1="120" y1="192" x2="400" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="196" y="176" width="128" height="12" rx="2" fill="#ffffff"/>
      <text x="260" y="186" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">SCALE --REPLICAS=5</text>

      <!-- Note over K8s -->
      <rect x="336" y="204" width="128" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
      <text x="400" y="220" fill="#545B64" font-size="9" font-family="'Amazon Ember', sans-serif" text-anchor="middle">레플리카 5로 변경</text>

      <!-- M2: ArgoCD -> K8s (monitor) -->
      <line x1="656" y1="252" x2="400" y2="252" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="472" y="236" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="528" y="246" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">상태 모니터링</text>

      <!-- M3: ArgoCD -> Git (check declared state) -->
      <line x1="664" y1="284" x2="880" y2="284" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="716" y="268" width="144" height="12" rx="2" fill="#ffffff"/>
      <text x="788" y="278" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">REPLICAS: 3 확인</text>

      <!-- M4: ArgoCD self: drift detected -->
      <path d="M 664 316 L 700 316 L 700 344 L 664 344" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="708" y="324" width="104" height="12" rx="2" fill="#ffffff"/>
      <text x="760" y="334" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">드리프트 감지</text>

      <!-- M5: ArgoCD self: selfHeal=true 확인 -->
      <path d="M 664 364 L 700 364 L 700 392 L 664 392" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="708" y="372" width="136" height="12" rx="2" fill="#ffffff"/>
      <text x="776" y="382" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.01em">SELFHEAL=TRUE 확인</text>

      <!-- M6: ArgoCD -> K8s (headline restore, accent) -->
      <line x1="656" y1="424" x2="400" y2="424" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="472" y="408" width="136" height="12" rx="2" fill="#ffffff"/>
      <text x="540" y="418" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.01em">REPLICAS=3으로 복구</text>

      <!-- M7: K8s --> ArgoCD (return, dashed) -->
      <line x1="400" y1="456" x2="656" y2="456" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="472" y="440" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="528" y="450" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">복구 완료</text>

      <!-- Actor boxes -->
      <rect x="48" y="72" width="144" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="120" y="102" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">사용자</text>
      <text x="120" y="118" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl</text>

      <rect x="328" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="400" y="102" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Kubernetes</text>
      <text x="400" y="118" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cluster</text>

      <rect x="588" y="72" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="660" y="102" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">ArgoCD</text>
      <text x="660" y="118" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">controller</text>

      <rect x="808" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="880" y="102" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Git Repo</text>
      <text x="880" y="118" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">source of truth</text>

      <!-- Legend -->
      <line x1="48" y1="500" x2="912" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="48" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="48" y="532" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="68" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Focal actor</text>

      <line x1="180" y1="538" x2="208" y2="538" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="216" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">반환 메시지</text>

      <line x1="340" y1="538" x2="368" y2="538" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="376" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">복구 실행</text>
    </svg>