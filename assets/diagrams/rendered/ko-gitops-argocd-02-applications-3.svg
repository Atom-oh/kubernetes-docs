<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="argoapp3-title argoapp3-desc">
  <title id="argoapp3-title">App of Apps 3단계 계층 구조</title>
  <desc id="argoapp3-desc">루트 Application이 4개의 자식 Application을 관리하고, 각 자식 Application이 Deployment·Service·ConfigMap 같은 Kubernetes 리소스를 생성하는 앱 오브 앱스 계층 구조를 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Connectors (behind nodes), drawn root-to-leaf -->
  <!-- Root stem -->
  <line x1="480" y1="108" x2="480" y2="160" stroke="#545B64" stroke-width="1"/>
  <!-- Sibling bus -->
  <line x1="210" y1="160" x2="750" y2="160" stroke="#545B64" stroke-width="1"/>
  <!-- Drops into each child -->
  <line x1="210" y1="160" x2="210" y2="220" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="390" y1="160" x2="390" y2="220" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="570" y1="160" x2="570" y2="220" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="750" y1="160" x2="750" y2="220" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- app-1 -> Deployments (R1), fanned attach -->
  <path d="M210,268 V316 Q210,324 218,324 H264 Q272,324 272,332 V380" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- app-2 -> Deployments (R1), fanned attach -->
  <path d="M390,268 V316 Q390,324 382,324 H336 Q328,324 328,332 V380" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- app-3 -> Services (R2) -->
  <path d="M570,268 V316 Q570,324 562,324 H548 Q540,324 540,332 V380" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- app-4 -> ConfigMaps (R3) -->
  <path d="M750,268 V316 Q750,324 758,324 H772 Q780,324 780,332 V380" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Root Application (focal) -->
  <rect x="400" y="60" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="480" y="80" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">apps-of-apps</text>
  <text x="480" y="95" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">root application</text>

  <!-- Child applications -->
  <rect x="140" y="220" width="140" height="48" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="210" y="242" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">app-1</text>
  <text x="210" y="257" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">child</text>

  <rect x="320" y="220" width="140" height="48" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="390" y="242" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">app-2</text>
  <text x="390" y="257" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">child</text>

  <rect x="500" y="220" width="140" height="48" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="570" y="242" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">app-3</text>
  <text x="570" y="257" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">child</text>

  <rect x="680" y="220" width="140" height="48" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="750" y="242" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">app-4</text>
  <text x="750" y="257" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">child</text>

  <!-- Kubernetes resources (store treatment, leaves) -->
  <rect x="220" y="380" width="160" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
  <text x="300" y="400" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Deployments</text>
  <text x="300" y="415" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">from app-1, app-2</text>

  <rect x="460" y="380" width="160" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
  <text x="540" y="400" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Services</text>
  <text x="540" y="415" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">from app-3</text>

  <rect x="700" y="380" width="160" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
  <text x="780" y="400" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ConfigMaps</text>
  <text x="780" y="415" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">from app-4</text>

  <!-- Legend -->
  <line x1="60" y1="480" x2="900" y2="480" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="60" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="220" y="488" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="252" y="498" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">루트 Application</text>

  <rect x="420" y="488" width="24" height="12" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="452" y="498" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">자식 Application</text>

  <rect x="620" y="488" width="24" height="12" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
  <text x="652" y="498" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Kubernetes 리소스</text>
</svg>