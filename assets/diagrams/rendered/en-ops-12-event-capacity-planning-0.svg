<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="pausepod-title pausepod-desc"><defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs>
  <title id="pausepod-title">Pause-pod capacity reservation sequence</title>
  <desc id="pausepod-desc">Sequence diagram showing how the infra team reserves node capacity ahead of a traffic event by deploying low-priority pause pods that trigger Karpenter to provision nodes early, then get evicted instantly by real workloads when the event starts.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="32" y="32" class="mono" font-size="8" fill="#7D8998" letter-spacing="0.18em">CAPACITY PLANNING</text>
  <text x="32" y="58" class="sans" font-size="20" font-weight="700" fill="#232F3E">Pause-pod capacity reservation</text>

  <!-- Actors -->
  <!-- x positions: PM=120, Ops=340, K8s=560, Karpenter=800 -->
  <!-- lifelines -->
  <line x1="120" y1="112" x2="120" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="340" y1="112" x2="340" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="560" y1="112" x2="560" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="800" y1="112" x2="800" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- actor boxes -->
  <rect x="72" y="80" width="96" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="120" y="100" class="sans" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">PM / Planner</text>

  <rect x="284" y="80" width="112" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="340" y="100" class="sans" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Infra Team</text>

  <rect x="512" y="80" width="96" height="32" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="560" y="100" class="sans" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Kubernetes</text>

  <rect x="748" y="80" width="104" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="800" y="100" class="sans" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Karpenter</text>

  <!-- Activation bars -->
  <rect x="556" y="148" width="8" height="336" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
  <rect x="796" y="184" width="8" height="48" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

  <!-- Msg 1: PM -> Ops : D-7 Share event details  y=148 -->
  <path d="M 120,148 H 340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="180" y="122" width="130" height="12" rx="2" fill="#ffffff"/>
  <text x="245" y="131" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.04em">D-7: EVENT DETAILS</text>

  <!-- Msg 2: Ops -> K8s : Deploy Pause Pods (replicas: 20)  y=184 -->
  <path d="M 340,184 H 556" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="380" y="158" width="180" height="12" rx="2" fill="#ffffff"/>
  <text x="470" y="167" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.02em">DEPLOY PAUSE PODS x20</text>

  <!-- Msg 3: K8s -> Karpenter : Detect Pending Pods  y=220 -->
  <path d="M 564,220 H 796" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="620" y="194" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="690" y="203" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.04em">DETECT PENDING</text>

  <!-- Msg 4: Karpenter -> K8s : Provision 20 Nodes (headline / accent)  y=256 -->
  <path d="M 796,256 H 564" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="620" y="230" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="690" y="239" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.02em">PROVISION 20 NODES</text>

  <!-- Note: Pause Pods occupy Nodes -->
  <rect x="480" y="276" width="168" height="28" rx="4" fill="rgba(35,47,62,0.04)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
  <text x="564" y="294" class="sans" font-size="11" font-style="italic" fill="#545B64" text-anchor="middle">Pause pods occupy nodes</text>

  <!-- Msg 5: PM -> Ops : D-Day Event starts  y=340 -->
  <path d="M 120,340 H 340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="170" y="314" width="150" height="12" rx="2" fill="#ffffff"/>
  <text x="245" y="323" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.02em">D-DAY: EVENT STARTS</text>

  <!-- Self message 6: K8s self : Real workloads scale up  y=376..404 -->
  <path d="M 564,376 H 616 Q 624,376 624,384 V 392 Q 624,400 616,400 H 564"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="628" y="378" width="150" height="12" rx="2" fill="#ffffff"/>
  <text x="703" y="387" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.02em">SCALE UP WORKLOADS</text>

  <!-- Self message 7: K8s self : Pause Pods evicted (low Priority) y=428..456 (accent - headline) -->
  <path d="M 564,428 H 616 Q 624,428 624,436 V 444 Q 624,452 616,452 H 564"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="628" y="430" width="180" height="12" rx="2" fill="#ffffff"/>
  <text x="718" y="439" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.01em">EVICT PAUSE PODS (LOW PRIORITY)</text>

  <!-- Note: Real workloads scheduled instantly -->
  <rect x="452" y="480" width="224" height="28" rx="4" fill="rgba(255,153,0,0.06)" stroke="rgba(236,114,17,0.40)" stroke-width="0.8"/>
  <text x="564" y="498" class="sans" font-size="11" font-style="italic" fill="#232F3E" text-anchor="middle">Real workloads scheduled instantly</text>

  <!-- Legend -->
  <line x1="32" y1="536" x2="928" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="554" class="mono" font-size="8" fill="#545B64" letter-spacing="0.14em">LEGEND</text>
  <line x1="120" y1="552" x2="150" y2="552" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="158" y="556" class="mono" font-size="8" fill="#545B64">CALL</text>
  <line x1="260" y1="552" x2="290" y2="552" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="298" y="556" class="mono" font-size="8" fill="#EC7211">HEADLINE STEP</text>
</svg>