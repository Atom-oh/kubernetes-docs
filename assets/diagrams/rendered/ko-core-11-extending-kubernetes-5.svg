<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d5title d5desc">
  <title id="d5title">CNI 아키텍처와 작동 방식</title>
  <desc id="d5desc">kubelet이 컨테이너 런타임을 통해 CNI 플러그인을 호출하면 IPAM 플러그인이 IP 풀에서 주소를 할당하고 네트워크 구성이 적용되어 포드 네트워크가 완성되는 과정을 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="24" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.18em">ARCHITECTURE · CNI</text>
  <text x="40" y="46" fill="#232F3E" font-size="16" font-weight="700" class="sans">CNI 아키텍처와 작동 방식</text>

  <!-- ============ Zones ============ -->
  <rect x="100" y="68" width="240" height="248" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="116" y="72" width="152" height="12" rx="2" fill="#ffffff"/>
  <text x="192" y="81" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">KUBERNETES 컴포넌트</text>

  <rect x="440" y="68" width="360" height="192" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="456" y="72" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="504" y="81" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">CNI 플러그인</text>

  <!-- ============ Arrows ============ -->
  <!-- API -> KUB (포드 생성) -->
  <path d="M200,132 V184" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="208" y="152" width="48" height="12" fill="#ffffff"/>
  <text x="232" y="161" fill="#545B64" font-size="8" class="mono" text-anchor="middle">포드 생성</text>

  <!-- KUB -> CRI (1. 컨테이너 생성) -->
  <path d="M200,216 V268" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="208" y="236" width="88" height="12" fill="#ffffff"/>
  <text x="252" y="245" fill="#545B64" font-size="8" class="mono" text-anchor="middle">1. 컨테이너 생성</text>

  <!-- CRI -> CNI (2. 네트워크 설정 요청) -->
  <path d="M280,284 H392 Q400,284 400,276 V124 Q400,116 408,116 H520" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="292" y="140" width="100" height="12" fill="#ffffff"/>
  <text x="342" y="149" fill="#545B64" font-size="8" class="mono" text-anchor="middle">2. 네트워크 설정 요청</text>

  <!-- CNI -> IPAM (3. IP 할당 요청) -->
  <path d="M565,132 V156 Q565,164 557,164 H532 Q524,164 524,172 V196" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="485" y="138" width="72" height="12" fill="#ffffff"/>
  <text x="521" y="147" fill="#545B64" font-size="8" class="mono" text-anchor="middle">3. IP 할당 요청</text>

  <!-- CNI -> NET (5. 네트워크 설정) -->
  <path d="M611,132 V156 Q611,164 619,164 H708 Q716,164 716,172 V196" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="619" y="138" width="80" height="12" fill="#ffffff"/>
  <text x="659" y="147" fill="#545B64" font-size="8" class="mono" text-anchor="middle">5. 네트워크 설정</text>

  <!-- IPAM -> IPPOOL (4. IP 할당) -->
  <path d="M524,228 V288" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="532" y="242" width="48" height="12" fill="#ffffff"/>
  <text x="556" y="251" fill="#545B64" font-size="8" class="mono" text-anchor="middle">4. IP 할당</text>

  <!-- NET -> POD (6. 네트워크 구성 적용) -->
  <path d="M716,228 V288" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="724" y="242" width="96" height="12" fill="#ffffff"/>
  <text x="772" y="251" fill="#545B64" font-size="8" class="mono" text-anchor="middle">6. 네트워크 구성 적용</text>

  <!-- ============ Nodes ============ -->
  <!-- API -->
  <rect x="120" y="100" width="160" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="200" y="120" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">API 서버</text>

  <!-- KUB -->
  <rect x="120" y="184" width="160" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="200" y="204" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">kubelet</text>

  <!-- CRI -->
  <rect x="120" y="268" width="160" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="200" y="288" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">컨테이너 런타임</text>

  <!-- CNI (focal) -->
  <rect x="520" y="100" width="136" height="32" rx="6" fill="#ffffff"/>
  <rect x="520" y="100" width="136" height="32" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="588" y="120" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">CNI 플러그인</text>

  <!-- IPAM -->
  <rect x="456" y="196" width="136" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="524" y="216" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">IPAM 플러그인</text>

  <!-- NET -->
  <rect x="648" y="196" width="136" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="716" y="216" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">네트워크 구성</text>

  <!-- IPPOOL (store) -->
  <rect x="456" y="288" width="136" height="40" rx="6" fill="#ffffff"/>
  <rect x="456" y="288" width="136" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="464" y="294" width="24" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
  <text x="476" y="303" fill="#545B64" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.06em">DB</text>
  <text x="533" y="312" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">IP 풀</text>

  <!-- POD -->
  <rect x="648" y="288" width="136" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="716" y="308" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">포드 네트워크</text>

  <!-- Legend -->
  <line x1="40" y1="420" x2="920" y2="420" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="436" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
  <circle cx="220" cy="432" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="232" y="436" fill="#545B64" font-size="9" class="sans">네트워크 설정 허브(CNI 플러그인)</text>
  <circle cx="500" cy="432" r="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="512" y="436" fill="#545B64" font-size="9" class="sans">IP 주소 저장소</text>
</svg>