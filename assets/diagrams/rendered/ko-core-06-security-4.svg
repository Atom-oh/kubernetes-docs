<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t4 d4">
  <title id="t4">NetworkPolicy 구성과 트래픽 제어</title>
  <desc id="d4">NetworkPolicy가 인바운드(ingress)와 아웃바운드(egress) 규칙으로 podSelector·namespaceSelector·ipBlock을 선택해 특정 포트만 허용하고, 이 정책이 API 포드에 적용되어 프론트엔드→API→데이터베이스로 이어지는 트래픽을 제어하는 모습을 보여주는 다이어그램.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="40" y="32" fill="#7D8998" font-size="8" letter-spacing="0.18em" class="mono">NETWORK POLICY</text>
  <text x="40" y="58" fill="#232F3E" font-size="24" font-weight="700">네트워크 정책(Network Policy)</text>
  <text x="40" y="78" fill="#545B64" font-size="12">인바운드/아웃바운드 규칙으로 포드 간 통신을 선택적으로 허용한다</text>

  <!-- Arrows: NP -> Ingress (down-left elbow) -->
  <path d="M430,136 V172 Q430,180 422,180 H258 Q250,180 250,188 V220"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- NP -> API (straight vertical, focal) -->
  <line x1="480" y1="136" x2="480" y2="460" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="494" y="290" width="60" height="14" rx="2" fill="#ffffff"/>
  <text x="524" y="300" fill="#EC7211" font-size="8" text-anchor="middle" letter-spacing="0.06em" class="mono">적용</text>
  <!-- NP -> Egress (down-right elbow) -->
  <path d="M530,136 V172 Q530,180 538,180 H702 Q710,180 710,188 V220"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Frontend -> API -->
  <line x1="240" y1="488" x2="400" y2="488" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="288" y="468" width="64" height="14" rx="2" fill="#ffffff"/>
  <text x="320" y="478" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" class="mono">통신</text>
  <!-- API -> DB -->
  <line x1="560" y1="488" x2="720" y2="488" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="608" y="468" width="64" height="14" rx="2" fill="#ffffff"/>
  <text x="640" y="478" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" class="mono">통신</text>

  <!-- NP node (focal) -->
  <rect x="380" y="80" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="380" y="80" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="480" y="104" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">NetworkPolicy</text>
  <text x="480" y="122" fill="#545B64" font-size="9" text-anchor="middle" class="mono">api-allow</text>

  <!-- Ingress box -->
  <rect x="100" y="220" width="300" height="160" rx="6" fill="#ffffff"/>
  <rect x="100" y="220" width="300" height="160" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="250" y="244" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">인바운드 규칙 (ingress)</text>
  <text x="250" y="270" fill="#545B64" font-size="9" text-anchor="middle" class="mono">from: podSelector</text>
  <text x="250" y="286" fill="#545B64" font-size="9" text-anchor="middle" class="mono">namespaceSelector · ipBlock</text>
  <text x="250" y="310" fill="#545B64" font-size="9" text-anchor="middle" class="mono">ports: 허용 포트 (예: 8080)</text>
  <text x="250" y="340" fill="#7D8998" font-size="9" text-anchor="middle" class="mono">frontend → 8080/TCP 허용</text>

  <!-- Egress box -->
  <rect x="560" y="220" width="300" height="160" rx="6" fill="#ffffff"/>
  <rect x="560" y="220" width="300" height="160" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="710" y="244" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">아웃바운드 규칙 (egress)</text>
  <text x="710" y="270" fill="#545B64" font-size="9" text-anchor="middle" class="mono">to: podSelector</text>
  <text x="710" y="286" fill="#545B64" font-size="9" text-anchor="middle" class="mono">namespaceSelector · ipBlock</text>
  <text x="710" y="310" fill="#545B64" font-size="9" text-anchor="middle" class="mono">ports: 허용 포트 (예: 5432)</text>
  <text x="710" y="340" fill="#7D8998" font-size="9" text-anchor="middle" class="mono">database → 5432/TCP 허용</text>

  <!-- Frontend -->
  <rect x="80" y="460" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="80" y="460" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="160" y="484" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">프론트엔드 포드</text>
  <text x="160" y="502" fill="#545B64" font-size="9" text-anchor="middle" class="mono">app: frontend</text>

  <!-- API -->
  <rect x="400" y="460" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="400" y="460" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="484" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API 포드</text>
  <text x="480" y="502" fill="#545B64" font-size="9" text-anchor="middle" class="mono">app: api</text>

  <!-- DB -->
  <rect x="720" y="460" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="720" y="460" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="800" y="484" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">데이터베이스 포드</text>
  <text x="800" y="502" fill="#545B64" font-size="9" text-anchor="middle" class="mono">app: database</text>
</svg>