    <title id="ko-autoscaling-03-knative-1-title">Knative Eventing: Broker/Trigger와 Channel/Subscription 패턴</title>
    <desc id="ko-autoscaling-03-knative-1-desc">이벤트 소스가 Broker로 들어와 Trigger 필터에 따라 각 서비스로 라우팅되고 실패 시 Dead Letter Sink로 보내지는 Broker/Trigger 패턴과, Channel을 통해 Subscription으로 이벤트를 전달하는 Channel/Subscription 패턴을 나란히 비교하는 아키텍처 다이어그램.</desc>
