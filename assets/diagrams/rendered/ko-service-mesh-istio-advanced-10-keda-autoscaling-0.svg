<?xml version="1.0" encoding="UTF-8"?>
<svg id="diagram" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
  <title id="d0-title">메트릭 기반 오토스케일링 시퀀스</title>
  <desc id="d0-desc">KEDA가 Prometheus에서 Istio 메트릭을 조회해 임계값과 비교한 뒤 HPA를 통해 Pod 수를 조정하는 시퀀스</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- ============ Lifelines ============ -->
  <line x1="120" y1="56" x2="120" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="300" y1="56" x2="300" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="56" x2="480" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="660" y1="56" x2="660" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="840" y1="56" x2="840" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ============ Messages (drawn before actor boxes so boxes sit on top) ============ -->

  <!-- 1. Envoy self: 메트릭 생성 -->
  <path d="M120,96 H160 Q168,96 168,104 V112 Q168,120 160,120 H124" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="176" y="98" width="112" height="24" rx="2" fill="#ffffff"/>
  <text x="180" y="107" class="mono" font-size="8" fill="#545B64" letter-spacing="0.04em">메트릭 생성</text>
  <text x="180" y="118" class="mono" font-size="8" fill="#7D8998" letter-spacing="0.02em">istio_requests_total</text>

  <!-- 2. Envoy -> Prometheus -->
  <line x1="120" y1="152" x2="296" y2="152" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="150" y="130" width="140" height="14" rx="2" fill="#ffffff"/>
  <text x="220" y="141" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.04em">:15090/stats/prometheus</text>

  <!-- 3. Prometheus self: 수집 및 저장 -->
  <path d="M300,196 H340 Q348,196 348,204 V212 Q348,220 340,220 H304" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="356" y="198" width="96" height="14" rx="2" fill="#ffffff"/>
  <text x="360" y="209" class="mono" font-size="8" fill="#545B64" letter-spacing="0.02em">수집 및 저장</text>

  <!-- KEDA polling note -->
  <rect x="392" y="238" width="176" height="20" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
  <text x="480" y="251" font-style="italic" font-size="10" fill="#545B64" text-anchor="middle">pollingInterval마다 실행</text>

  <!-- 4. KEDA -> Prometheus (query) -->
  <line x1="476" y1="288" x2="304" y2="288" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="330" y="266" width="120" height="14" rx="2" fill="#ffffff"/>
  <text x="390" y="277" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.02em">rate(istio_requests_total[1m])</text>

  <!-- 5. Prometheus --> KEDA (return, dashed) -->
  <line x1="300" y1="324" x2="472" y2="324" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="330" y="302" width="120" height="14" rx="2" fill="#ffffff"/>
  <text x="390" y="313" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.02em">RPS = 1,500</text>

  <!-- 6. KEDA self: 임계값 비교 -->
  <path d="M480,364 H520 Q528,364 528,372 V380 Q528,388 520,388 H484" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="536" y="366" width="132" height="24" rx="2" fill="#ffffff"/>
  <text x="540" y="375" class="mono" font-size="8" fill="#545B64" letter-spacing="0.02em">threshold 1,000 &lt; 1,500</text>
  <text x="540" y="386" class="mono" font-size="8" fill="#7D8998" letter-spacing="0.02em">→ 스케일 아웃 결정</text>

  <!-- 7. KEDA -> HPA (headline, accent) -->
  <line x1="480" y1="420" x2="656" y2="420" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="512" y="398" width="112" height="14" rx="2" fill="#ffffff"/>
  <text x="568" y="409" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.02em">desired: 10 → 15</text>

  <!-- 8. HPA -> Kubernetes API -->
  <line x1="660" y1="460" x2="836" y2="460" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="690" y="438" width="140" height="14" rx="2" fill="#ffffff"/>
  <text x="760" y="449" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.02em">ReplicaSet 업데이트</text>

  <!-- 9. Kubernetes API -> Envoy Sidecar (long return, transit over intervening lifelines is inherent to sequence diagrams) -->
  <line x1="840" y1="504" x2="124" y2="504" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="400" y="482" width="112" height="14" rx="2" fill="#ffffff"/>
  <text x="456" y="493" font-size="9" fill="#545B64" text-anchor="middle" font-weight="600">새 Pod 5개 생성</text>

  <!-- cooldown note -->
  <rect x="352" y="524" width="256" height="20" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
  <text x="480" y="537" font-style="italic" font-size="10" fill="#545B64" text-anchor="middle">cooldownPeriod 대기 후 다음 스케일링 평가</text>

  <!-- ============ Actor boxes (drawn last, on top) ============ -->
  <!-- Envoy Sidecar -->
  <rect x="50" y="16" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="120" y="32" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">App / Envoy</text>
  <text x="120" y="46" class="mono" font-size="9" fill="#545B64" text-anchor="middle">sidecar</text>

  <!-- Prometheus -->
  <rect x="230" y="16" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="300" y="32" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Prometheus</text>
  <text x="300" y="46" class="mono" font-size="9" fill="#545B64" text-anchor="middle">:9090</text>

  <!-- KEDA (focal) -->
  <rect x="410" y="16" width="140" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="480" y="32" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">KEDA Operator</text>
  <text x="480" y="46" class="mono" font-size="9" fill="#545B64" text-anchor="middle">ScaledObject</text>

  <!-- HPA -->
  <rect x="590" y="16" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="660" y="32" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">HPA</text>
  <text x="660" y="46" class="mono" font-size="9" fill="#545B64" text-anchor="middle">autoscaling/v2</text>

  <!-- Kubernetes API -->
  <rect x="770" y="16" width="140" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="840" y="32" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Kubernetes API</text>
  <text x="840" y="46" class="mono" font-size="9" fill="#545B64" text-anchor="middle">ReplicaSet</text>

  <!-- Legend -->
  <line x1="30" y1="566" x2="930" y2="566" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="582" class="mono" font-size="8" fill="#545B64" letter-spacing="0.14em">LEGEND</text>
  <line x1="120" y1="578" x2="150" y2="578" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="156" y="581" class="mono" font-size="8" fill="#545B64">CALL</text>
  <line x1="230" y1="578" x2="260" y2="578" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="266" y="581" class="mono" font-size="8" fill="#545B64">RETURN</text>
  <line x1="360" y1="578" x2="390" y2="578" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="396" y="581" class="mono" font-size="8" fill="#545B64">SCALE DECISION</text>
</svg>