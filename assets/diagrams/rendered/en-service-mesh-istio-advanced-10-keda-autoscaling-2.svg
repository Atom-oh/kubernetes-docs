<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="keda-guide-title keda-guide-desc">
      <title id="keda-guide-title">Decision guide for choosing a KEDA scaling metric</title>
      <desc id="keda-guide-desc">A decision tree that routes a workload to RPS-based, latency-based, predictive, or composite scaling based on whether it is stateless, has a predictable traffic pattern, and is latency sensitive, with the two single-metric strategies able to combine into a composite one.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Edges (before boxes) -->

      <!-- Start -> Stateless -->
      <line x1="480" y1="116" x2="480" y2="156" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Stateless -> Traffic (YES) -->
      <path d="M560,192 L692,192 Q700,192 700,200 L700,260" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="600" y="180" width="28" height="12" rx="2" fill="#ffffff"/>
      <text x="614" y="189" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <!-- Stateless -> LatencyScale (NO) -->
      <path d="M400,192 L208,192 Q200,192 200,200 L200,272" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="288" y="180" width="26" height="12" rx="2" fill="#ffffff"/>
      <text x="301" y="189" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <!-- Traffic -> Predictive (YES, accent headline) -->
      <path d="M780,296 L780,392 Q780,400 772,400 L620,400" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="786" y="332" width="28" height="12" rx="2" fill="#ffffff"/>
      <text x="800" y="341" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <!-- Traffic -> Latency (NO) -->
      <path d="M700,332 L700,356 Q700,364 692,364 L480,364" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="596" y="352" width="26" height="12" rx="2" fill="#ffffff"/>
      <text x="609" y="361" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <!-- Latency -> LatencyScale (YES) -->
      <path d="M400,400 L128,400 Q120,400 120,392 L120,300" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="216" y="392" width="28" height="12" rx="2" fill="#ffffff"/>
      <text x="230" y="401" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <!-- Latency -> RPSScale (NO) -->
      <line x1="480" y1="436" x2="480" y2="480" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="492" y="448" width="26" height="12" rx="2" fill="#ffffff"/>
      <text x="505" y="457" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <!-- RPSScale -> Composite (Combine, dashed) -->
      <line x1="400" y1="504" x2="288" y2="504" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="316" y="516" width="60" height="12" rx="2" fill="#ffffff"/>
      <text x="346" y="525" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMBINE</text>

      <!-- LatencyScale -> Composite (Combine, dashed) -->
      <line x1="200" y1="320" x2="200" y2="480" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="208" y="434" width="56" height="12" rx="2" fill="#ffffff"/>
      <text x="236" y="443" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMBINE</text>

      <!-- Nodes -->
      <g font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">

        <!-- Start diamond -->
        <polygon points="480,44 560,80 480,116 400,80" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="480" y="76" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Workload</text>
        <text x="480" y="90" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Characteristics</text>

        <!-- Stateless diamond -->
        <polygon points="480,156 560,192 480,228 400,192" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="480" y="188" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Stateless</text>
        <text x="480" y="202" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Service?</text>

        <!-- Traffic diamond (focal) -->
        <polygon points="700,260 780,296 700,332 620,296" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
        <text x="700" y="292" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Predictable</text>
        <text x="700" y="306" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Traffic?</text>

        <!-- Latency diamond -->
        <polygon points="480,364 560,400 480,436 400,400" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="480" y="396" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Latency</text>
        <text x="480" y="410" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Sensitive?</text>

        <!-- LatencyScale rect -->
        <rect x="120" y="272" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="120" y="272" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="200" y="292" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Latency-based</text>
        <text x="200" y="308" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Scaling</text>

        <!-- Predictive rect (focal outcome) -->
        <rect x="620" y="376" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)"/>
        <rect x="620" y="376" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
        <text x="700" y="396" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Predictive Scaling</text>
        <text x="700" y="412" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">+ Cron</text>

        <!-- RPSScale rect -->
        <rect x="400" y="480" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="400" y="480" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="480" y="500" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">RPS-based</text>
        <text x="480" y="516" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Scaling</text>

        <!-- Composite rect -->
        <rect x="120" y="480" width="160" height="48" rx="6" fill="rgba(35,47,62,0.05)"/>
        <rect x="120" y="480" width="160" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
        <text x="200" y="500" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Composite Metrics</text>
        <text x="200" y="516" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Scaling</text>
      </g>

      <!-- Legend -->
      <line x1="30" y1="556" x2="930" y2="556" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="30" y="574" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <polygon points="152,562 168,568 152,574 136,568" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="176" y="572" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">DECISION</text>
      <rect x="284" y="562" width="16" height="12" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="308" y="572" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">STRATEGY</text>
      <line x1="404" y1="568" x2="436" y2="568" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="444" y="572" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">COMBINABLE</text>
    </svg>