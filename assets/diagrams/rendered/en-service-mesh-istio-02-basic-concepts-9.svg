<title id="en-service-mesh-istio-02-basic-concepts-9-title">Automatic Mutual TLS Between Sidecars</title>
<desc id="en-service-mesh-istio-02-basic-concepts-9-desc">Diagram showing plaintext traffic from an application flowing to its Envoy sidecar, which exchanges mutually-encrypted mTLS traffic with the peer pod's Envoy sidecar, while istiod's Citadel component issues certificates to both sidecars.</desc>
