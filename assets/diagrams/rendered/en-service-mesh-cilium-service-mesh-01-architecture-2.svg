      <title id="en-service-mesh-cilium-service-mesh-01-architecture-2-title">Packet flow through eBPF hook points</title>
      <desc id="en-service-mesh-cilium-service-mesh-01-architecture-2-desc">Diagram showing a packet's ingress path from the NIC through the XDP and TC eBPF hooks up to the application, and the mirrored egress path back down through the TC hook to the NIC.</desc>
