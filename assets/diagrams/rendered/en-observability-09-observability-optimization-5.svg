<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="costflow-title costflow-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="costflow-title">Flowchart routing collected data to a storage tier based on priority classification</title>
    <desc id="costflow-desc">Collected data is classified by priority — high-priority data gets full storage and long-term retention in Glacier, medium-priority data is sampled into Standard-IA, and low-priority data is aggregated only and kept in fast local memory.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ===== Connectors ===== -->
    <path d="M 480,88 V 110" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M 390,160 H 228 Q 220,160 220,168 V 280"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="252" y="184" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="272" y="193" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HIGH</text>

    <path d="M 480,210 V 280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="452" y="238" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="247" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MEDIUM</text>

    <path d="M 570,160 H 732 Q 740,160 740,168 V 280"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="668" y="184" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="684" y="193" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOW</text>

    <path d="M 220,344 V 420" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 480,344 V 420" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 740,344 V 420" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Start: Data Collection ===== -->
    <rect x="400" y="40" width="160" height="48" rx="24" fill="#ffffff"/>
    <rect x="400" y="40" width="160" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="68" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Data Collection</text>

    <!-- ===== Decision diamond (focal) ===== -->
    <polygon points="480,110 570,160 480,210 390,160" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="152" fill="#232F3E" font-size="11" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Priority</text>
    <text x="480" y="166" fill="#232F3E" font-size="11" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Classification</text>

    <!-- ===== Row 3: retention tier ===== -->
    <rect x="120" y="280" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="120" y="280" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="308" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Full Storage</text>
    <text x="220" y="326" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">long-term retention</text>

    <rect x="380" y="280" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="280" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="308" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sampling</text>
    <text x="480" y="326" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">medium-term retention</text>

    <rect x="640" y="280" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="640" y="280" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="740" y="308" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Aggregation Only</text>
    <text x="740" y="326" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">short-term retention</text>

    <!-- ===== Row 4: destination ===== -->
    <rect x="120" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="120" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="220" y="448" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">S3 Glacier</text>
    <text x="220" y="466" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Deep Archive</text>

    <rect x="380" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="380" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="448" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">S3 Standard-IA</text>
    <text x="480" y="466" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">infrequent access</text>

    <rect x="640" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="640" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="740" y="448" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Memory / Local</text>
    <text x="740" y="466" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fast, ephemeral</text>

    <!-- Legend -->
    <line x1="24" y1="520" x2="936" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="538" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <polygon points="150,530 158,538 150,546 142,538" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="172" y="541" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Decision point — the priority classifier</text>
  </svg>