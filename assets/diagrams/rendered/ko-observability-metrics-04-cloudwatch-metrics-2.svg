<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="cwcost-title cwcost-desc">
    <title id="cwcost-title">CloudWatch 비용 최적화 전략 트리</title>
    <desc id="cwcost-desc">CloudWatch 비용 최적화가 메트릭·로그·대시보드 세 갈래로 나뉘고, 각 갈래마다 고해상도 메트릭 최소화나 로그 보존 기간 설정 같은 구체적인 실행 항목으로 이어진다는 것을 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Connectors: root -> tier1 bus -->
    <line x1="480" y1="84" x2="480" y2="112" stroke="#545B64" stroke-width="1.2"/>
    <line x1="168" y1="112" x2="784" y2="112" stroke="#545B64" stroke-width="1.2"/>
    <line x1="168" y1="112" x2="168" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="500" y1="112" x2="500" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="784" y1="112" x2="784" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Connectors: B -> B1,B2,B3 -->
    <line x1="168" y1="188" x2="168" y2="234" stroke="#545B64" stroke-width="1"/>
    <line x1="66" y1="234" x2="274" y2="234" stroke="#545B64" stroke-width="1"/>
    <line x1="66" y1="234" x2="66" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="170" y1="234" x2="170" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="274" y1="234" x2="274" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Connectors: C -> C1,C2,C3 -->
    <line x1="500" y1="188" x2="500" y2="234" stroke="#545B64" stroke-width="1"/>
    <line x1="396" y1="234" x2="604" y2="234" stroke="#545B64" stroke-width="1"/>
    <line x1="396" y1="234" x2="396" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="500" y1="234" x2="500" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="604" y1="234" x2="604" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Connectors: D -> D1,D2 -->
    <line x1="784" y1="188" x2="784" y2="234" stroke="#545B64" stroke-width="1"/>
    <line x1="728" y1="234" x2="832" y2="234" stroke="#545B64" stroke-width="1"/>
    <line x1="728" y1="234" x2="728" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="832" y1="234" x2="832" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Root (focal) -->
    <rect x="400" y="32" width="160" height="52" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="54" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch</text>
    <text x="480" y="70" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">비용 최적화</text>

    <!-- Tier 1 -->
    <rect x="92" y="140" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="168" y="169" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">메트릭 최적화</text>

    <rect x="424" y="140" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="500" y="169" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">로그 최적화</text>

    <rect x="708" y="140" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="784" y="169" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">대시보드 최적화</text>

    <!-- Tier 2 under B (메트릭) -->
    <rect x="20" y="280" width="92" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="66" y="303" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">고해상도</text>
    <text x="66" y="317" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">최소화</text>

    <rect x="124" y="280" width="92" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="170" y="303" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">불필요한</text>
    <text x="170" y="317" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">차원 제거</text>

    <rect x="228" y="280" width="92" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="274" y="303" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">수집 간격</text>
    <text x="274" y="317" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">조정</text>

    <!-- Tier 2 under C (로그) -->
    <rect x="350" y="280" width="92" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="396" y="303" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">로그 보존</text>
    <text x="396" y="317" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">기간 설정</text>

    <rect x="454" y="280" width="92" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="500" y="312" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">로그 필터링</text>

    <rect x="558" y="280" width="92" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="604" y="303" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">로그 클래스</text>
    <text x="604" y="317" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">활용</text>

    <!-- Tier 2 under D (대시보드) -->
    <rect x="682" y="280" width="92" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="728" y="303" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">대시보드</text>
    <text x="728" y="317" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">통합</text>

    <rect x="786" y="280" width="92" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="832" y="312" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">쿼리 최적화</text>

    <!-- Legend -->
    <line x1="40" y1="460" x2="920" y2="460" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="488" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="497" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">최적화 목표 (루트)</text>
    <rect x="260" y="488" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="280" y="497" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">최적화 영역</text>
    <rect x="440" y="488" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="460" y="497" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">실행 항목</text>
  </svg>
