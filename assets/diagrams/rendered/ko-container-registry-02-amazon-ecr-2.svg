<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cache-title cache-desc">
<title id="cache-title">ECR Pull Through Cache 흐름</title>
<desc id="cache-desc">kubelet의 이미지 요청이 ECR 엔드포인트를 거쳐 캐시가 있으면 즉시 제공하고, 캐시가 없으면 업스트림 레지스트리에서 가져와 ECR에 캐시로 저장한 뒤 제공하는 흐름을 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ===== Arrows (behind nodes) ===== -->
<!-- Pod -> ECR diamond (straight, same y) -->
<line x1="200" y1="208" x2="320" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ECR right vertex -> Serve left edge : CACHE HIT (accent, happy path, straight same y) -->
<line x1="520" y1="208" x2="680" y2="208" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<!-- ECR bottom vertex -> Upstream left edge : CACHE MISS (2-bend elbow, r=8) -->
<path d="M420,268 H432 Q440,268 440,276 V384 Q440,392 448,392 H460"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Upstream right edge -> Cache left edge (straight, same y) -->
<line x1="660" y1="392" x2="740" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Cache top edge -> Serve bottom edge (2-bend elbow, r=8) -->
<path d="M830,360 V308 Q830,300 822,300 H788 Q780,300 780,292 V240"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ===== Arrow labels (mask + 6-10px gap) ===== -->
<!-- CACHE HIT (horizontal, midpoint x=600,y=208) -->
<rect x="570" y="188" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="600" y="198" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE HIT</text>

<!-- CACHE MISS (vertical segment x=440, label to the side) -->
<rect x="450" y="322" width="66" height="12" rx="2" fill="#ffffff"/>
<text x="483" y="332" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE MISS</text>

<!-- ===== Nodes ===== -->
<!-- Pod / kubelet trigger (start oval) -->
<rect x="40" y="176" width="160" height="64" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="120" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">kubectl apply</text>
<text x="120" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubelet pull</text>

<!-- ECR Endpoint (diamond, focal) -->
<polygon points="420,148 520,208 420,268 320,208" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="420" y="204" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ECR</text>
<text x="420" y="218" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Endpoint</text>

<!-- Serve (end oval) -->
<rect x="680" y="176" width="200" height="64" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="780" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">캐시된 이미지</text>
<text x="780" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">즉시 제공</text>

<!-- Upstream Registry (rect step) -->
<rect x="460" y="360" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="560" y="388" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Upstream Registry</text>
<text x="560" y="404" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">에서 Pull</text>

<!-- Cache store (rect step / store) -->
<rect x="740" y="360" width="180" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="830" y="388" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ECR 캐시 저장</text>
<text x="830" y="404" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pull-through cache</text>

<!-- ===== Legend ===== -->
<line x1="40" y1="472" x2="920" y2="472" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
<text x="40" y="488" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND</text>

<polygon points="44,502 56,495 68,502 56,509" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="80" y="506" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">ECR 엔드포인트 (판단)</text>

<rect x="260" y="498" width="24" height="14" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="292" y="509" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">단계</text>

<rect x="360" y="498" width="24" height="14" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="392" y="509" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">캐시 저장소</text>

<line x1="520" y1="505" x2="548" y2="505" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="556" y="509" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">캐시 적중 (즉시 응답)</text>
</svg>