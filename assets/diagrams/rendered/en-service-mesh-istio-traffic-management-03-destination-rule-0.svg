<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dr0-title dr0-desc">
<title id="dr0-title">VirtualService and DestinationRule roles</title>
<desc id="dr0-desc">A client request is routed by VirtualService's routing decision, then split 90/10 into DestinationRule's traffic policy, which applies load balancing across two service versions.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
  <marker id="dr0-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="dr0-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ===== Zones ===== -->
<rect x="232" y="180" width="160" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="248" y="184" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="312" y="193" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VIRTUALSERVICE</text>

<rect x="444" y="180" width="160" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="460" y="184" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="524" y="193" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DESTINATIONRULE</text>

<rect x="656" y="96" width="224" height="408" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="716" y="100" width="104" height="12" rx="2" fill="#ffffff"/>
<text x="768" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICES</text>

<!-- ===== Arrows (drawn before boxes) ===== -->
<!-- Client -> Route (straight, same y) -->
<path d="M180,300 H252" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#dr0-arrow)"/>

<!-- Route -> Policy, two fanned straight lines (90% / 10%) -->
<path d="M372,288 H464" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#dr0-arrow)"/>
<path d="M372,312 H464" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#dr0-arrow)"/>
<rect x="398" y="266" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="416" y="275" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">90%</text>
<rect x="398" y="322" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="416" y="331" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">10%</text>

<!-- Policy -> V1 (up elbow) -->
<path d="M584,288 H624 Q632,288 632,280 V180 Q632,172 640,172 H680" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#dr0-arrow-accent)"/>
<!-- Policy -> V2 (down elbow) -->
<path d="M584,312 H624 Q632,312 632,320 V420 Q632,428 640,428 H680" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#dr0-arrow-accent)"/>

<!-- ===== Nodes ===== -->
<!-- Client (input) -->
<rect x="40" y="268" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="110" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
<text x="110" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Request</text>

<!-- Route (backend) -->
<rect x="252" y="268" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="312" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Routing</text>
<text x="312" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Decision</text>

<!-- Policy (focal) -->
<rect x="464" y="268" width="120" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="524" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Traffic</text>
<text x="524" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Policy</text>

<!-- V1 -->
<rect x="680" y="140" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="768" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Version 1</text>

<!-- V2 -->
<rect x="680" y="396" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="768" y="432" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Version 2</text>

</svg>
