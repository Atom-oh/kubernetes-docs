<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cost-tree-title cost-tree-desc">
    <title id="cost-tree-title">Cluster cost allocation breakdown</title>
    <desc id="cost-tree-desc">Flowchart showing total cluster cost split into direct team costs, shared platform costs, and idle costs, where the shared and idle costs are each distributed back to teams using a different weighting method.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows first -->
    <!-- Total -> Direct/Shared/Idle : elbow fan (tree-style bus) -->
    <path d="M480,88 L480,108 A8,8 0 0 1 472,116 L148,116 A8,8 0 0 0 140,124 L140,148" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="480" y1="88" x2="480" y2="148" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M480,88 L480,108 A8,8 0 0 0 488,116 L812,116 A8,8 0 0 1 820,124 L820,148" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Direct -> Team A/B/C : elbow fan -->
    <path d="M100,204 L100,224 A8,8 0 0 1 92,232 L68,232 A8,8 0 0 0 60,240 L60,264" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="140" y1="204" x2="140" y2="264" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M180,204 L180,224 A8,8 0 0 0 188,232 L212,232 A8,8 0 0 1 220,240 L220,264" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Shared -> kube-system/monitoring/ingress : elbow fan -->
    <path d="M460,204 L460,224 A8,8 0 0 1 452,232 L428,232 A8,8 0 0 0 420,240 L420,264" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="500" y1="204" x2="500" y2="264" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M540,204 L540,224 A8,8 0 0 0 548,232 L572,232 A8,8 0 0 1 580,240 L580,264" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- kube-system/monitoring/ingress -> Distributed to Teams (converge, fanned attach) -->
    <path d="M420,320 L420,440 A8,8 0 0 0 428,448 L470,448" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M500,320 L500,432 A8,8 0 0 0 508,440 L522,440 A8,8 0 0 1 530,448 L530,448" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M580,320 L580,440 A8,8 0 0 1 588,448 L590,448" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Idle -> Distributed to Teams -->
    <path d="M820,204 L820,432 A8,8 0 0 1 812,440 L730,440 A8,8 0 0 1 722,448 L720,448" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels -->
    <rect x="406" y="392" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="420" y="401" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CPU</text>

    <rect x="522" y="416" width="26" height="12" rx="2" fill="#ffffff"/>
    <text x="535" y="425" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COST</text>

    <rect x="597" y="416" width="26" height="12" rx="2" fill="#ffffff"/>
    <text x="610" y="425" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVEN</text>

    <rect x="758" y="416" width="46" height="12" rx="2" fill="#ffffff"/>
    <text x="781" y="425" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WEIGHTED</text>

    <!-- Total Cluster Cost (focal) -->
    <rect x="400" y="32" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="58" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Total Cluster</text>
    <text x="480" y="74" fill="#EC7211" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Cost</text>

    <!-- Direct Costs -->
    <rect x="60" y="148" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Direct Costs</text>

    <!-- Shared Costs -->
    <rect x="420" y="148" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="500" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Shared Costs</text>

    <!-- Idle Costs -->
    <rect x="740" y="148" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="820" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Idle Costs</text>

    <!-- Team A/B/C leaves -->
    <rect x="24" y="264" width="72" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="60" y="288" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Team A</text>
    <text x="60" y="302" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">workloads</text>

    <rect x="104" y="264" width="72" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="140" y="288" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Team B</text>
    <text x="140" y="302" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">workloads</text>

    <rect x="184" y="264" width="72" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="220" y="288" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Team C</text>
    <text x="220" y="302" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">workloads</text>

    <!-- kube-system / monitoring / ingress-nginx -->
    <rect x="384" y="264" width="72" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="420" y="288" fill="#232F3E" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">kube-</text>
    <text x="420" y="300" fill="#232F3E" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">system</text>

    <rect x="464" y="264" width="72" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="500" y="292" fill="#232F3E" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">monitoring</text>

    <rect x="544" y="264" width="72" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="580" y="288" fill="#232F3E" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">ingress-</text>
    <text x="580" y="300" fill="#232F3E" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">nginx</text>

    <!-- Distributed to Teams -->
    <rect x="470" y="448" width="260" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="600" y="472" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Distributed to</text>
    <text x="600" y="488" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Teams</text>

    <!-- Legend -->
    <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND</text>

    <rect x="140" y="542" width="24" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="172" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Cost category</text>

    <rect x="332" y="542" width="24" height="12" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="364" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Namespace / team</text>

    <line x1="564" y1="548" x2="592" y2="548" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="600" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Idle cost, weighted split</text>
  </svg>