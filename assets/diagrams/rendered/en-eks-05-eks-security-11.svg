    <title id="en-eks-05-eks-security-11-title">IAM permission boundary evaluation</title>
    <desc id="en-eks-05-eks-security-11-desc">Flowchart showing a requested action evaluated against both the identity-based policy and the permission boundary, where the effective permission is the intersection of the two: allowed only if both allow, denied if either denies.</desc>
