<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2title d2desc">
    <title id="d2title">Linkerd 크로스 클러스터 트래픽 시퀀스</title>
    <desc id="d2desc">East 클러스터의 클라이언트 파드가 자신의 프록시를 거쳐 인터넷/VPN을 통해 West 클러스터의 Gateway로 mTLS 연결을 맺고, Gateway가 West의 서버 프록시로 전달해 서버 파드에 도달하며, 응답이 같은 경로를 역순으로 돌아오는 과정을 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- lifelines: Client(120) Proxy_C(300) GW_W(480) Proxy_S(660) Server(840) -->
    <line x1="120" y1="72" x2="120" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="300" y1="72" x2="300" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="72" x2="480" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="660" y1="72" x2="660" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="840" y1="72" x2="840" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- activation bars -->
    <rect x="116" y="100" width="8" height="332" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="296" y="100" width="8" height="332" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="476" y="152" width="8" height="228" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="656" y="200" width="8" height="132" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="836" y="248" width="8" height="36" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- 1. Client -> Proxy_C : HTTP Request -->
    <line x1="120" y1="100" x2="296" y2="100" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="164" y="80" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="208" y="89" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">HTTP REQUEST</text>

    <!-- 2. Proxy_C -> GW_W : mTLS (인터넷/VPN 경유) (headline, accent) -->
    <line x1="304" y1="152" x2="476" y2="152" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="330" y="132" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="390" y="141" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">MTLS (인터넷/VPN)</text>

    <!-- 3. GW_W -> Proxy_S : Forward to local service -->
    <line x1="484" y1="200" x2="656" y2="200" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="510" y="180" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="570" y="189" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">FORWARD LOCAL</text>

    <!-- 4. Proxy_S -> Server : HTTP Request -->
    <line x1="664" y1="248" x2="836" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="704" y="228" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="748" y="237" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">HTTP REQUEST</text>

    <!-- 5. Server --> Proxy_S : HTTP Response (dashed) -->
    <line x1="836" y1="284" x2="668" y2="284" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="708" y="292" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="752" y="301" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">HTTP RESPONSE</text>

    <!-- 6. Proxy_S --> GW_W : Response (dashed) -->
    <line x1="656" y1="332" x2="488" y2="332" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="514" y="340" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="554" y="349" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">RESPONSE</text>

    <!-- 7. GW_W --> Proxy_C : mTLS Response (dashed) -->
    <line x1="476" y1="380" x2="308" y2="380" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="336" y="388" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="392" y="397" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">MTLS RESPONSE</text>

    <!-- 8. Proxy_C --> Client : HTTP Response (dashed) -->
    <line x1="296" y1="428" x2="128" y2="428" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="156" y="436" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="445" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">HTTP RESPONSE</text>

    <!-- actor boxes -->
    <rect x="40" y="40" width="160" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="120" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client Pod (East)</text>

    <rect x="220" y="40" width="160" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="300" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client Proxy</text>

    <rect x="400" y="40" width="160" height="32" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway (West)</text>

    <rect x="580" y="40" width="160" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="660" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Server Proxy</text>

    <rect x="760" y="40" width="160" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="840" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Server Pod (West)</text>

    <!-- footer note -->
    <text x="120" y="500" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace">Cluster East</text>
    <text x="480" y="500" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace">Cluster West</text>
  </svg>