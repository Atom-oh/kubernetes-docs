<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ray-arch-title ray-arch-desc">
  <title id="ray-arch-title">Ray 클러스터 아키텍처</title>
  <desc id="ray-arch-desc">Head Node가 여러 Worker Node의 Task/Actor 실행을 관리하고, 모든 노드가 클러스터 전역에 걸쳐 공유되는 분산 Object Store에 접근하는 Ray 클러스터의 구조를 보여준다.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- header -->
  <text x="40" y="28" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" font-weight="500">ARCHITECTURE · RAY</text>
  <text x="40" y="56" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Ray 클러스터 아키텍처</text>

  <!-- ===== zone: head node (drawn before arrows/nodes) ===== -->
  <rect x="260" y="80" width="440" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="268" y="84" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="312" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HEAD NODE</text>

  <!-- ===== arrows (behind nodes) ===== -->
  <!-- Head -> Worker 1/2/3 : orthogonal, solid, arrowhead (control / scheduling) -->
  <path d="M 370,200 V 232 Q 370,240 362,240 H 248 Q 240,240 240,248 V 280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 480,200 V 280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 590,200 V 232 Q 590,240 598,240 H 712 Q 720,240 720,248 V 280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Worker 1/2/3 ~~~ Object Store : orthogonal, dashed, no arrowhead (shared access) -->
  <path d="M 240,360 V 400 Q 240,408 248,408 H 392 Q 400,408 400,416 V 456" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 480,360 V 456" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 720,360 V 400 Q 720,408 712,408 H 568 Q 560,408 560,416 V 456" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Head ~~~ Object Store : routed clear on the far left, dashed, no arrowhead -->
  <path d="M 260,140 H 32 Q 24,140 24,148 V 492 Q 24,500 32,500 H 320" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== nodes: head node contents ===== -->
  <!-- GCS (focal) -->
  <rect x="276" y="112" width="120" height="72" rx="6" fill="#ffffff"/>
  <rect x="276" y="112" width="120" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <rect x="284" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.5)" stroke-width="0.8"/>
  <text x="298" y="127" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
  <text x="336" y="146" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Global Control</text>
  <text x="336" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Store</text>
  <text x="336" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">클러스터 메타데이터</text>

  <!-- Driver -->
  <rect x="420" y="112" width="120" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Driver 프로세스</text>
  <text x="480" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">head에서 실행 시</text>

  <!-- Autoscaler -->
  <rect x="564" y="112" width="120" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="624" y="152" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Autoscaler</text>

  <!-- ===== nodes: worker nodes ===== -->
  <rect x="140" y="280" width="200" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="148" y="286" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
  <text x="166" y="295" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
  <text x="240" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Worker Node 1</text>
  <text x="240" y="340" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tasks · Actors</text>

  <rect x="380" y="280" width="200" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="388" y="286" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
  <text x="406" y="295" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
  <text x="480" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Worker Node 2</text>
  <text x="480" y="340" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tasks · Actors</text>

  <rect x="620" y="280" width="200" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="628" y="286" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
  <text x="646" y="295" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
  <text x="720" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Worker Node N</text>
  <text x="720" y="340" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tasks · Actors</text>

  <!-- ===== node: distributed object store ===== -->
  <rect x="320" y="456" width="320" height="88" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="328" y="462" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
  <text x="348" y="471" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="480" y="502" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">분산 Object Store</text>
  <text x="480" y="518" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">모든 노드가 공유</text>

  <!-- ===== legend ===== -->
  <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="576" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <line x1="180" y1="582" x2="216" y2="582" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="224" y="586" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">관리 · 스케줄링</text>

  <line x1="480" y1="582" x2="516" y2="582" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="524" y="586" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">공유 Object Store 접근</text>
</svg>