<title id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-16-title">Istio 멀티 클라우드: 세 클라우드의 Istiod가 페더레이션된다</title>
<desc id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-16-desc">AWS EKS, Google Cloud GKE, Azure AKS 각각의 Istiod가 서로 서비스 디스커버리 정보를 교환하고, 세 클러스터의 워크로드가 클라우드 경계를 넘어 mTLS로 직접 통신함으로써 Istio가 클라우드 중립적인 단일 메시를 구성한다는 것을 보여준다.</desc>
