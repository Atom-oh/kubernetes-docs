<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq0-title seq0-desc">
    <title id="seq0-title">파드 종료 시 연결 에러 시퀀스</title>
    <desc id="seq0-desc">쿠버네티스가 파드 종료 시 애플리케이션과 Envoy 사이드카에 동시에 SIGTERM을 보내면 Envoy가 애플리케이션보다 먼저 종료되어, 아직 처리 중인 클라이언트 요청이 연결 거부로 실패하는 문제를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#FFFFFF"/>

    <!-- ===================== LIFELINES ===================== -->
    <line x1="120" y1="128" x2="120" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="360" y1="128" x2="360" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="600" y1="128" x2="600" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="840" y1="128" x2="840" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ===================== MESSAGE ARROWS ===================== -->
    <!-- m1: K8s -> App SIGTERM -->
    <line x1="120" y1="160" x2="360" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m2: K8s -> Envoy SIGTERM -->
    <line x1="120" y1="192" x2="600" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- self: Envoy immediate shutdown -->
    <path d="M 600 232 L 640 232 L 640 264 L 600 264" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m3: Client -> Envoy request -->
    <line x1="840" y1="300" x2="600" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m4: Envoy -> Client connection refused (dashed return) -->
    <line x1="600" y1="332" x2="840" y2="332" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- self: App still processing -->
    <path d="M 360 372 L 400 372 L 400 404 L 360 404" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m5: K8s -> App SIGKILL -->
    <line x1="120" y1="456" x2="360" y2="456" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m6: K8s -> Envoy SIGKILL -->
    <line x1="120" y1="488" x2="600" y2="488" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===================== NOTE BOXES ===================== -->
    <rect x="660" y="220" width="164" height="52" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="742" y="240" fill="#232F3E" font-size="12" font-style="italic" font-family="var(--sans),'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">❌ Envoy가 App보다</text>
    <text x="742" y="256" fill="#232F3E" font-size="12" font-style="italic" font-family="var(--sans),'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">먼저 종료를 시작</text>

    <rect x="420" y="360" width="160" height="52" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="500" y="380" fill="#232F3E" font-size="12" font-style="italic" font-family="var(--sans),'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App은 아직 요청을</text>
    <text x="500" y="396" fill="#232F3E" font-size="12" font-style="italic" font-family="var(--sans),'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">처리하는 중</text>

    <!-- ===================== LABELS ===================== -->
    <rect x="196" y="144" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="240" y="154" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SIGTERM 전송</text>

    <rect x="316" y="176" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="360" y="186" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SIGTERM 전송</text>

    <rect x="500" y="240" width="92" height="12" rx="2" fill="#FFFFFF"/>
    <text x="546" y="250" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">즉시 종료 시작</text>

    <rect x="676" y="284" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="720" y="294" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">요청 전송</text>

    <rect x="660" y="316" width="120" height="12" rx="2" fill="#FFFFFF"/>
    <text x="720" y="326" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">❌ CONNECTION REFUSED</text>

    <rect x="200" y="380" width="102" height="12" rx="2" fill="#FFFFFF"/>
    <text x="251" y="390" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">요청 처리 중...</text>

    <rect x="176" y="440" width="128" height="12" rx="2" fill="#FFFFFF"/>
    <text x="240" y="450" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SIGKILL · 30초 후</text>

    <rect x="296" y="472" width="128" height="12" rx="2" fill="#FFFFFF"/>
    <text x="360" y="482" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SIGKILL · 30초 후</text>

    <!-- ===================== ACTOR BOXES ===================== -->
    <!-- Kubernetes -->
    <rect x="48" y="64" width="144" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="48" y="64" width="144" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="56" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="70" y="81" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SYS</text>
    <text x="120" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">Kubernetes</text>
    <text x="120" y="111" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">kubelet</text>

    <!-- Application -->
    <rect x="288" y="64" width="144" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="288" y="64" width="144" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <rect x="296" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="310" y="81" fill="#545B64" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="360" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">Application</text>
    <text x="360" y="111" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">container</text>

    <!-- Envoy Proxy (focal) -->
    <rect x="528" y="64" width="144" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="528" y="64" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="536" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="554" y="81" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>
    <text x="600" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">Envoy Proxy</text>
    <text x="600" y="111" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">istio-proxy</text>

    <!-- Client -->
    <rect x="768" y="64" width="144" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="768" y="64" width="144" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="776" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="790" y="81" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="840" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">Client</text>
    <text x="840" y="111" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">외부 요청</text>

    <!-- ===================== LEGEND ===================== -->
    <line x1="48" y1="548" x2="912" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="48" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

    <line x1="140" y1="588" x2="168" y2="588" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="176" y="591" fill="#545B64" font-size="8.5" font-family="var(--sans)">신호 전송</text>

    <line x1="316" y1="588" x2="344" y2="588" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="352" y="591" fill="#545B64" font-size="8.5" font-family="var(--sans)">실패 응답</text>

    <rect x="500" y="580" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="522" y="591" fill="#545B64" font-size="8.5" font-family="var(--sans)">문제 발생 지점 (Envoy)</text>

  </svg>