<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sharedcp-title sharedcp-desc">
    <title id="sharedcp-title">공유 컨트롤 플레인 기반 Istio 멀티 클러스터</title>
    <desc id="sharedcp-desc">하나의 Primary Istiod가 두 클러스터의 서비스 검색을 총괄하고, 각 클러스터의 원격 Istiod가 자기 클러스터의 서비스 정보를 수집하며, 두 클러스터의 파드는 크로스 클러스터로 서로 통신하는 구조를 보여준다.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#FFFFFF"/>

    <!-- Zones -->
    <rect x="340" y="40" width="280" height="88" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.30)" stroke-width="0.8"/>
    <rect x="352" y="44" width="140" height="12" rx="2" fill="#FFFFFF"/>
    <text x="422" y="53" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">SHARED CONTROL PLANE</text>

    <rect x="40" y="220" width="360" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="224" width="80" height="12" rx="2" fill="#FFFFFF"/>
    <text x="92" y="233" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">클러스터 1</text>

    <rect x="560" y="220" width="360" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="572" y="224" width="80" height="12" rx="2" fill="#FFFFFF"/>
    <text x="612" y="233" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">클러스터 2</text>

    <!-- Arrows: PrimaryIstiod -> Istiod1 / Istiod2 (accent, primary flow) -->
    <path d="M380,84 H276 Q268,84 268,92 V248 Q268,256 260,256 H156" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="222" y="164" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="266" y="173" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">구성 배포</text>

    <path d="M580,84 H660 Q668,84 668,92 V248 Q668,256 676,256 H756" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="626" y="164" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="670" y="173" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">구성 배포</text>

    <!-- Arrows: Istiod -> Service (within each cluster) -->
    <path d="M128,296 V316 Q128,324 136,324 H144 Q152,324 152,332 V352" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="136" y="300" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="180" y="309" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">정보 수집</text>

    <path d="M756,296 V316 Q756,324 748,324 H740 Q732,324 732,332 V352" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="736" y="300" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="780" y="309" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">정보 수집</text>

    <!-- Pod1 <-> Pod2 cross-cluster -->
    <line x1="400" y1="392" x2="560" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <rect x="428" y="372" width="104" height="12" rx="2" fill="#FFFFFF"/>
    <text x="480" y="381" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">CROSS-CLUSTER</text>

    <!-- Node: Primary Istiod (focal) -->
    <rect x="380" y="60" width="200" height="48" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="380" y="60" width="200" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="80" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Primary Istiod</text>
    <text x="480" y="94" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">서비스 검색 총괄</text>

    <!-- Node: Istiod1 (Cluster1) -->
    <rect x="64" y="256" width="128" height="40" rx="6" fill="#ffffff"/>
    <rect x="64" y="256" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="128" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istiod</text>
    <text x="128" y="290" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">primary</text>

    <!-- Node: Service A -->
    <rect x="88" y="352" width="128" height="40" rx="6" fill="#ffffff"/>
    <rect x="88" y="352" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="152" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service A</text>

    <!-- Node: Pod A -->
    <rect x="272" y="372" width="128" height="40" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="272" y="372" width="128" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="336" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A</text>

    <!-- Node: Istiod2 (Cluster2) -->
    <rect x="692" y="256" width="128" height="40" rx="6" fill="#ffffff"/>
    <rect x="692" y="256" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="756" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istiod</text>
    <text x="756" y="290" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">remote</text>

    <!-- Node: Service B -->
    <rect x="668" y="352" width="128" height="40" rx="6" fill="#ffffff"/>
    <rect x="668" y="352" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="732" y="376" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service B</text>

    <!-- Node: Pod B -->
    <rect x="560" y="372" width="128" height="40" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="560" y="372" width="128" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="624" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B</text>

    <!-- Legend -->
    <line x1="40" y1="480" x2="920" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="500" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="140" y="490" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="162" y="501" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">PRIMARY ISTIOD (SHARED)</text>

    <rect x="400" y="490" width="14" height="14" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="422" y="501" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">ISTIOD / SERVICE</text>

    <rect x="640" y="490" width="14" height="14" rx="3" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="662" y="501" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">WORKLOAD POD</text>
  </svg>