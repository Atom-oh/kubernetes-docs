<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="ha-title ha-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="ha-title">Highly available observability pipeline fanning through a load balancer into redundant log and metric stores</title>
    <desc id="ha-desc">Multiple Fluent Bit agents fan into a load balancer that spreads work across a redundant pair of OTel Collectors, which write logs to an HA Loki-write pair backed by shared S3 and metrics to an HA vminsert pair backed by replicated vmstorage.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <text x="638" y="112" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOGS PATH</text>
    <text x="638" y="404" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">METRICS PATH</text>

    <!-- ===== Connectors ===== -->
    <path d="M 180,312 H 216" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 356,312 H 392" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <path d="M 532,300 H 542 Q 550,300 550,292 V 180 Q 550,172 558,172 H 568"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 532,324 H 542 Q 550,324 550,332 V 444 Q 550,452 558,452 H 568"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M 708,172 H 744" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 708,452 H 744" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Nodes: main line ===== -->
    <rect x="40" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="280" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="110" y="308" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Fluent Bit</text>
    <text x="110" y="326" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HA · N nodes</text>

    <!-- Load Balancer (focal) -->
    <rect x="216" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="216" y="280" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="286" y="308" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Load Balancer</text>
    <text x="286" y="326" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fan-in point</text>

    <rect x="392" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="392" y="280" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="462" y="308" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OTel Collector</text>
    <text x="462" y="326" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HA pair</text>

    <!-- ===== Nodes: branch col4 ===== -->
    <rect x="568" y="140" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="568" y="140" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="638" y="168" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Loki Write</text>
    <text x="638" y="186" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HA pair</text>

    <rect x="568" y="420" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="568" y="420" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="638" y="448" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vminsert</text>
    <text x="638" y="466" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HA pair</text>

    <!-- ===== Nodes: branch col5 (stores) ===== -->
    <rect x="744" y="140" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="744" y="140" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="814" y="168" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">S3 Bucket</text>
    <text x="814" y="186" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">shared storage</text>

    <rect x="744" y="420" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)"/>
    <rect x="744" y="420" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="814" y="448" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vmstorage</text>
    <text x="814" y="466" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">x3 replicas</text>

    <!-- Legend -->
    <line x1="24" y1="520" x2="936" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="538" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="535" x2="172" y2="535" stroke="#EC7211" stroke-width="1.2"/>
    <text x="182" y="538" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Single fan-in point across the whole stack</text>
  </svg>