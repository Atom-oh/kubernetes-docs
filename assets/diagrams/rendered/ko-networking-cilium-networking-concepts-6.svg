<title id="ko-networking-cilium-networking-concepts-6-title">SNAT(출발지 NAT) 동작 구조</title>
<desc id="ko-networking-cilium-networking-concepts-6-desc">내부 네트워크의 클라이언트가 NAT 라우터를 거치면서 출발지 주소가 사설 IP에서 공용 IP로 변환되어 인터넷의 서버와 통신하는 SNAT 동작을 보여주는 다이어그램.</desc>
