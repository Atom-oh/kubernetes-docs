<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sec-arch-title sec-arch-desc">
  <title id="sec-arch-title">Linkerd 보안 아키텍처</title>
  <desc id="sec-arch-desc">인증서 체인이 Identity Issuer를 통해 워크로드 인증서를 발급하고, Control Plane의 Identity/Policy Controller가 Data Plane의 mTLS 종단 프록시 두 대를 함께 관리하는 구조를 보여준다.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Zones (drawn before arrows/nodes) -->
  <rect x="40" y="40" width="880" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="404" y="44" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="460" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CERTIFICATE CHAIN</text>

  <rect x="40" y="248" width="300" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="128" y="252" width="124" height="12" rx="2" fill="#ffffff"/>
  <text x="190" y="261" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE</text>

  <rect x="580" y="248" width="340" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="686" y="252" width="128" height="12" rx="2" fill="#ffffff"/>
  <text x="750" y="261" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA PLANE</text>

  <!-- Arrows (behind boxes) -->
  <line x1="340" y1="108" x2="420" y2="108" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="108" x2="660" y2="108" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <path d="M 300,320 H 432 Q 440,320 440,328 V 352 Q 440,360 448,360 H 580"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 300,420 H 432 Q 440,420 440,412 V 388 Q 440,380 448,380 H 580"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="750" y1="348" x2="750" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <rect x="766" y="364" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="786" y="373" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">mTLS</text>

  <!-- Certificate Chain nodes (store treatment) -->
  <g>
    <rect x="180" y="80" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="180" y="80" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="260" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Trust Anchor</text>
    <text x="260" y="120" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Root CA</text>
  </g>
  <g>
    <rect x="420" y="80" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="420" y="80" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="500" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Identity Issuer</text>
    <text x="500" y="120" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Intermediate CA</text>
  </g>
  <g>
    <rect x="660" y="80" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="660" y="80" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="740" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Workload Certs</text>
    <text x="740" y="120" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">각 프록시</text>
  </g>

  <!-- Control Plane nodes (backend treatment) -->
  <g>
    <rect x="80" y="292" width="220" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="190" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Identity Controller</text>
    <text x="190" y="332" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">인증서 발급</text>
  </g>
  <g>
    <rect x="80" y="392" width="220" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="190" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Policy Controller</text>
    <text x="190" y="432" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">인가 정책</text>
  </g>

  <!-- Data Plane nodes (focal) -->
  <g>
    <rect x="620" y="292" width="260" height="56" rx="6" fill="#ffffff"/>
    <rect x="620" y="292" width="260" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="750" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Proxy 1</text>
    <text x="750" y="332" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">mTLS 종단</text>
  </g>
  <g>
    <rect x="620" y="392" width="260" height="56" rx="6" fill="#ffffff"/>
    <rect x="620" y="392" width="260" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="750" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Proxy 2</text>
    <text x="750" y="432" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">mTLS 종단</text>
  </g>

  <!-- Legend -->
  <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <circle cx="180" cy="548" r="4.5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="192" y="551" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif">mTLS 종단 프록시 (핵심 데이터플레인)</text>
  <circle cx="500" cy="548" r="4.5" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="512" y="551" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif">인증서 자원</text>
</svg>