<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kserve-flow-title kserve-flow-desc">
  <title id="kserve-flow-title">KServe InferenceService 추론 흐름</title>
  <desc id="kserve-flow-desc">클라이언트 요청이 KServe InferenceService로 들어와 Predictor 스펙을 구성한 뒤, Serverless(Knative 기반 scale-to-zero) 또는 Raw Deployment(HPA 기반 상시 실행) 배포 모드 중 하나로 라우팅되어 모델 서버가 아티팩트를 로드하고 추론한 후 응답을 반환하는 과정을 보여준다.</desc>

  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
  </defs>

  <!-- ============ Connectors (drawn before boxes) ============ -->

  <!-- A -> B -->
  <line x1="480" y1="64" x2="480" y2="84" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- B -> C -->
  <line x1="480" y1="132" x2="480" y2="152" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- C -> F (diamond top vertex) -->
  <line x1="480" y1="208" x2="480" y2="228" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- F.left -> G.top (Serverless) -->
  <line x1="400" y1="264" x2="400" y2="320" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="316" y="285" width="76" height="14" rx="2" fill="#ffffff"/>
  <text x="388" y="295" text-anchor="end" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.06em">SERVERLESS</text>

  <!-- F.right -> H.top (Raw Deployment) -->
  <line x1="560" y1="264" x2="560" y2="320" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="568" y="285" width="86" height="14" rx="2" fill="#ffffff"/>
  <text x="576" y="295" text-anchor="start" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.06em">RAW DEPLOY</text>

  <!-- G -> merge dot -->
  <path d="M280,376 V400 Q280,408 288,408 H476" fill="none" stroke="#545B64" stroke-width="1"/>
  <!-- H -> merge dot -->
  <path d="M680,376 V400 Q680,408 672,408 H484" fill="none" stroke="#545B64" stroke-width="1"/>
  <!-- merge dot -->
  <circle cx="480" cy="408" r="4" fill="#232F3E"/>

  <!-- dot -> I -->
  <line x1="480" y1="412" x2="480" y2="428" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- I -> J -->
  <line x1="480" y1="484" x2="480" y2="504" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============ Nodes ============ -->

  <!-- A: start oval -->
  <rect x="380" y="24" width="200" height="40" rx="20" fill="#ffffff"/>
  <rect x="380" y="24" width="200" height="40" rx="20" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="48" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" class="sans">클라이언트 요청</text>

  <!-- B: InferenceService (focal) -->
  <rect x="360" y="84" width="240" height="48" rx="6" fill="#ffffff"/>
  <rect x="360" y="84" width="240" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.4"/>
  <text x="480" y="112" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="700" class="sans">InferenceService</text>

  <!-- C: Predictor spec + optional components -->
  <rect x="320" y="152" width="320" height="56" rx="6" fill="#ffffff"/>
  <rect x="320" y="152" width="320" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="176" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" class="sans">Predictor 스펙 구성</text>
  <text x="480" y="193" text-anchor="middle" fill="#545B64" font-size="9" class="mono">선택: Transformer / Explainer 적용</text>

  <!-- F: deploy-mode decision diamond -->
  <polygon points="480,228 560,264 480,300 400,264" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="260" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" class="sans">배포 모드</text>
  <text x="480" y="273" text-anchor="middle" fill="#545B64" font-size="9" class="mono">Serverless / Raw</text>

  <!-- G: Serverless / Knative -->
  <rect x="140" y="320" width="280" height="56" rx="6" fill="#ffffff"/>
  <rect x="140" y="320" width="280" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="280" y="344" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" class="sans">Knative 관리 Pod</text>
  <text x="280" y="361" text-anchor="middle" fill="#545B64" font-size="9" class="mono">scale-to-zero 가능</text>

  <!-- H: Raw Deployment -->
  <rect x="540" y="320" width="280" height="56" rx="6" fill="#ffffff"/>
  <rect x="540" y="320" width="280" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="680" y="344" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" class="sans">Deployment/Service + HPA</text>
  <text x="680" y="361" text-anchor="middle" fill="#545B64" font-size="9" class="mono">scale-to-zero 없음</text>

  <!-- I: model server loads artifact & infers (merge target) -->
  <rect x="320" y="428" width="320" height="56" rx="6" fill="#ffffff"/>
  <rect x="320" y="428" width="320" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="452" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" class="sans">모델 서버가 아티팩트 로드</text>
  <text x="480" y="468" text-anchor="middle" fill="#545B64" font-size="9" class="mono">추론 수행</text>

  <!-- J: end oval -->
  <rect x="380" y="504" width="200" height="40" rx="20" fill="#ffffff"/>
  <rect x="380" y="504" width="200" height="40" rx="20" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="528" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" class="sans">클라이언트에 응답</text>

</svg>