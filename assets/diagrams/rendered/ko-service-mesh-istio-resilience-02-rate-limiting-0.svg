<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="rl-overview-title rl-overview-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="rl-overview-title">Rate Limiter의 요청 허용/차단 흐름</title>
    <desc id="rl-overview-desc">세 클라이언트가 서로 다른 속도로 보내는 요청이 Token Bucket 방식의 Rate Limiter를 거쳐, 처리 가능한 두 Pod로는 허용되고 초과분은 429 오류로 차단되는 과정을 보여줍니다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones (drawn first) -->
    <rect x="356" y="148" width="248" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="364" y="152" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="408" y="161" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RATE LIMITER</text>

    <rect x="276" y="348" width="408" height="108" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="440" y="352" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="470" y="361" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">서비스</text>

    <!-- Arrows (before nodes) -->
    <!-- Client1 -> RL (bend, attach x=468) -->
    <path d="M 300,104 V 134 Q 300,142 308,142 H 460 Q 468,142 468,150 V 180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="330" y="112" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="356" y="121" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">100R/S</text>

    <!-- Client2 -> RL (bend, attach x=504) -->
    <path d="M 480,104 V 134 Q 480,142 488,142 H 496 Q 504,142 504,150 V 180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="454" y="130" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="139" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">50R/S</text>

    <!-- Client3 -> RL (bend, attach x=540) -->
    <path d="M 660,104 V 134 Q 660,142 652,142 H 548 Q 540,142 540,150 V 180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="578" y="112" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="606" y="121" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200R/S</text>

    <!-- RL -> Pod1 -->
    <path d="M 430,244 V 274 Q 430,282 422,282 H 388 Q 380,282 380,290 V 380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="360" y="252" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="382" y="261" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">허용</text>

    <!-- RL -> Pod2 -->
    <path d="M 480,244 V 274 Q 480,282 488,282 H 572 Q 580,282 580,290 V 380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="558" y="252" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="580" y="261" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">허용</text>

    <!-- RL -> Reject (dashed) -->
    <path d="M 530,244 V 282 Q 530,290 538,290 H 822 Q 830,290 830,298 V 396" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="792" y="300" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="830" y="309" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">250R/S 차단</text>

    <!-- Nodes -->
    <!-- Client1 -->
    <rect x="230" y="48" width="140" height="56" rx="6" fill="#ffffff"/>
    <rect x="230" y="48" width="140" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="300" y="74" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">클라이언트 1</text>
    <text x="300" y="90" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">100 req/s</text>

    <!-- Client2 -->
    <rect x="410" y="48" width="140" height="56" rx="6" fill="#ffffff"/>
    <rect x="410" y="48" width="140" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="480" y="74" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">클라이언트 2</text>
    <text x="480" y="90" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">50 req/s</text>

    <!-- Client3 -->
    <rect x="590" y="48" width="140" height="56" rx="6" fill="#ffffff"/>
    <rect x="590" y="48" width="140" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="660" y="74" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">클라이언트 3</text>
    <text x="660" y="90" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">200 req/s</text>

    <!-- RL (focal) -->
    <rect x="380" y="180" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="180" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Token Bucket</text>
    <text x="480" y="226" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">limit: 100 req/s</text>

    <!-- Pod1 -->
    <rect x="300" y="380" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="300" y="380" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 1</text>
    <text x="380" y="426" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">처리: 50 req/s</text>

    <!-- Pod2 -->
    <rect x="500" y="380" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="500" y="380" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="580" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 2</text>
    <text x="580" y="426" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">처리: 50 req/s</text>

    <!-- Reject -->
    <rect x="740" y="396" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="740" y="396" width="180" height="64" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="830" y="424" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">429 응답</text>
    <text x="830" y="442" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Too Many Requests</text>

    <!-- Legend -->
    <line x1="30" y1="528" x2="930" y2="528" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="544" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <circle cx="180" cy="540" r="7" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="196" y="543" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">클라이언트</text>

    <circle cx="356" cy="540" r="7" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="372" y="543" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Rate Limiter (핵심)</text>

    <circle cx="592" cy="540" r="7" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="608" y="543" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Pod (백엔드)</text>

    <circle cx="756" cy="540" r="7" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="772" y="543" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">차단됨</text>
  </svg>