<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-networking-README-6-title en-networking-README-6-desc">
<title id="en-networking-README-6-title">CNI Relative Throughput</title>
<desc id="en-networking-README-6-desc">Bar chart ranking six CNI network-mode combinations by relative throughput, with Cilium's eBPF mode as the 100% baseline and Weave the slowest at 75%.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- gridlines -->
<line x1="80" y1="140" x2="920" y2="140" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="80" y1="204" x2="920" y2="204" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="80" y1="268" x2="920" y2="268" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="80" y1="332" x2="920" y2="332" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="80" y1="396" x2="920" y2="396" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="80" y1="460" x2="920" y2="460" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>
<line x1="80" y1="140" x2="80" y2="460" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>

<!-- y-axis labels -->
<text x="72" y="143" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">100%</text>
<text x="72" y="207" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">80%</text>
<text x="72" y="271" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">60%</text>
<text x="72" y="335" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">40%</text>
<text x="72" y="399" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">20%</text>
<text x="72" y="463" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0%</text>

<!-- bar 0: Cilium eBPF 100% (focal) -->
<rect x="102" y="140" width="96" height="320" fill="#ffffff"/>
<rect x="102" y="140" width="96" height="320" fill="rgba(255,153,0,0.12)" stroke="#EC7211" stroke-width="1"/>
<text x="150" y="132" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">100%</text>
<text x="150" y="480" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cilium</text>
<text x="150" y="492" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(eBPF)</text>

<!-- bar 1: AWS VPC CNI 98% -->
<rect x="242" y="148" width="96" height="312" fill="#ffffff"/>
<rect x="242" y="148" width="96" height="312" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
<text x="290" y="140" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">98%</text>
<text x="290" y="480" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS VPC</text>
<text x="290" y="492" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CNI</text>

<!-- bar 2: Calico eBPF 95% -->
<rect x="382" y="156" width="96" height="304" fill="#ffffff"/>
<rect x="382" y="156" width="96" height="304" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
<text x="430" y="148" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">95%</text>
<text x="430" y="480" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Calico</text>
<text x="430" y="492" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(eBPF)</text>

<!-- bar 3: Calico iptables 85% -->
<rect x="522" y="188" width="96" height="272" fill="#ffffff"/>
<rect x="522" y="188" width="96" height="272" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
<text x="570" y="180" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">85%</text>
<text x="570" y="480" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Calico</text>
<text x="570" y="492" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(iptables)</text>

<!-- bar 4: Flannel 80% -->
<rect x="662" y="204" width="96" height="256" fill="#ffffff"/>
<rect x="662" y="204" width="96" height="256" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
<text x="710" y="196" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">80%</text>
<text x="710" y="480" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Flannel</text>

<!-- bar 5: Weave 75% -->
<rect x="802" y="220" width="96" height="240" fill="#ffffff"/>
<rect x="802" y="220" width="96" height="240" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
<text x="850" y="212" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">75%</text>
<text x="850" y="480" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Weave</text>
