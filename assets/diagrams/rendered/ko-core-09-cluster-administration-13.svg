<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">EKS 클러스터 아키텍처 및 관리 영역</title>
<desc id="d">Amazon EKS 클러스터가 컨트롤 플레인, 데이터 플레인, 네트워킹, 보안 네 영역으로 구성되며 각 영역이 AWS 관리형 API 서버·etcd, 관리형/자체관리형 노드와 Fargate, VPC CNI 기반 네트워킹, IAM 기반 보안으로 이어지는 것을 보여주는 트리 다이어그램</desc>
