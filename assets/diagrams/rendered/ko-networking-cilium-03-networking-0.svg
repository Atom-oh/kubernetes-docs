<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cnm-title cnm-desc">
      <title id="cnm-title">Cilium 네트워킹 모드</title>
      <desc id="cnm-desc">Cilium이 지원하는 오버레이, 네이티브 라우팅, 클라우드 통합의 세 네트워킹 모드가 각각 캡슐화 오버헤드, 캡슐화 없는 최고 성능, 클라우드 네이티브 최적화라는 서로 다른 성능 결과로 이어짐을 보여주는 다이어그램.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zones (bg -> zones -> arrows -> nodes) -->
      <rect x="40" y="40" width="240" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="92" y="44" width="136" height="12" rx="2" fill="#ffffff"/>
      <text x="160" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">오버레이 모드</text>

      <rect x="304" y="40" width="240" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="352" y="44" width="144" height="12" rx="2" fill="#ffffff"/>
      <text x="424" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">네이티브 라우팅 모드</text>

      <rect x="568" y="40" width="352" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="676" y="44" width="136" height="12" rx="2" fill="#ffffff"/>
      <text x="744" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">클라우드 통합 모드</text>

      <!-- Arrows (behind nodes) -->
      <!-- VXLAN -> Encap (focal, accent) -->
      <path d="M 100,128 V 256 Q 100,264 108,264 H 132 Q 140,264 140,272 V 400"
            fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Geneve -> Encap -->
      <path d="M 220,128 V 256 Q 220,264 212,264 H 188 Q 180,264 180,272 V 400"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Direct -> NoEncap -->
      <path d="M 364,128 V 256 Q 364,264 372,264 H 396 Q 404,264 404,272 V 400"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- BGP -> NoEncap -->
      <path d="M 484,128 V 256 Q 484,264 476,264 H 452 Q 444,264 444,272 V 400"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- AWS ENI -> Cloud -->
      <path d="M 628,128 V 256 Q 628,264 636,264 H 696 Q 704,264 704,272 V 400"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Azure IPAM -> Cloud (straight, same x) -->
      <line x1="744" y1="128" x2="744" y2="400" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- GKE -> Cloud -->
      <path d="M 860,128 V 256 Q 860,264 852,264 H 792 Q 784,264 784,272 V 400"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Zone 1 nodes -->
      <!-- VXLAN (focal) -->
      <rect x="52" y="72" width="96" height="56" rx="6" fill="#ffffff"/>
      <rect x="52" y="72" width="96" height="56" rx="6" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="100" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VXLAN</text>
      <text x="100" y="114" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">UDP 8472</text>

      <!-- Geneve -->
      <rect x="172" y="72" width="96" height="56" rx="6" fill="#ffffff"/>
      <rect x="172" y="72" width="96" height="56" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
      <text x="220" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Geneve</text>
      <text x="220" y="114" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">UDP 6081</text>

      <!-- Zone 2 nodes -->
      <rect x="316" y="72" width="96" height="56" rx="6" fill="#ffffff"/>
      <rect x="316" y="72" width="96" height="56" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
      <text x="364" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">직접 라우팅</text>
      <text x="364" y="114" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO ENCAP</text>

      <rect x="436" y="72" width="96" height="56" rx="6" fill="#ffffff"/>
      <rect x="436" y="72" width="96" height="56" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
      <text x="484" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">BGP</text>
      <text x="484" y="114" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO ENCAP</text>

      <!-- Zone 3 nodes -->
      <rect x="584" y="72" width="88" height="56" rx="6" fill="#ffffff"/>
      <rect x="584" y="72" width="88" height="56" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
      <text x="628" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS ENI</text>
      <text x="628" y="114" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">VPC IP</text>

      <rect x="700" y="72" width="88" height="56" rx="6" fill="#ffffff"/>
      <rect x="700" y="72" width="88" height="56" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
      <text x="744" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Azure IPAM</text>
      <text x="744" y="114" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">VNET IP</text>

      <rect x="816" y="72" width="88" height="56" rx="6" fill="#ffffff"/>
      <rect x="816" y="72" width="88" height="56" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
      <text x="860" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">GKE</text>
      <text x="860" y="114" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GCP VPC</text>

      <!-- Terminal outcomes -->
      <!-- Encap (focal target) -->
      <rect x="70" y="400" width="180" height="64" rx="6" fill="#ffffff"/>
      <rect x="70" y="400" width="180" height="64" rx="6" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="160" y="426" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">캡슐화 오버헤드</text>
      <text x="160" y="444" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">성능 영향 약간</text>

      <rect x="334" y="400" width="180" height="64" rx="6" fill="#ffffff"/>
      <rect x="334" y="400" width="180" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="424" y="426" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">캡슐화 없음</text>
      <text x="424" y="444" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">최고 성능</text>

      <rect x="654" y="400" width="180" height="64" rx="6" fill="#ffffff"/>
      <rect x="654" y="400" width="180" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="744" y="426" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">클라우드 네이티브</text>
      <text x="744" y="444" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">성능 최적화</text>

      <!-- Legend -->
      <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="40" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="200" cy="524" r="4.5" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="212" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">이 문서의 초점: VXLAN 캡슐화 경로</text>
      <circle cx="560" cy="524" r="4.5" fill="none" stroke="#232F3E" stroke-width="1"/>
      <text x="572" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">비교 대상 모드</text>
    </svg>