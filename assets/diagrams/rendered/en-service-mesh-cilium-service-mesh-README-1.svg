<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="pathcompare-title pathcompare-desc">
    <title id="pathcompare-title">Sidecar-based vs. eBPF-based request path</title>
    <desc id="pathcompare-desc">Comparison showing a request crossing the network between two per-pod Envoy sidecars in Istio, versus the same request passing through two lightweight eBPF hops into one shared, node-level Envoy proxy that performs L7 processing only in Cilium.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone 1 -->
    <rect x="40" y="64" width="880" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="368" y="68" width="224" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SIDECAR-BASED (ISTIO)</text>

    <!-- Zone 2 -->
    <rect x="40" y="216" width="880" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="380" y="220" width="200" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="229" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">eBPF-BASED (CILIUM)</text>

    <!-- Zone 1 arrows: App -> Sidecar A -> [NETWORK] -> Sidecar B -> App -->
    <line x1="256" y1="128" x2="288" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="448" y1="128" x2="512" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="672" y1="128" x2="704" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="452" y="108" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="117" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NETWORK</text>

    <!-- Zone 2 arrows -->
    <line x1="220" y1="280" x2="248" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="384" y1="280" x2="412" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="548" y1="280" x2="576" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="712" y1="280" x2="740" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Zone 1 nodes -->
    <!-- App A -->
    <rect x="96" y="96" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="96" y="96" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="104" y="104" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="116" y="113" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="176" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App Container</text>
    <text x="176" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">client</text>

    <!-- Envoy Sidecar A -->
    <rect x="288" y="96" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="288" y="96" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="296" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
    <text x="310" y="113" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PXY</text>
    <text x="368" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>
    <text x="368" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 per pod</text>

    <!-- Envoy Sidecar B -->
    <rect x="512" y="96" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="512" y="96" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="520" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
    <text x="534" y="113" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PXY</text>
    <text x="592" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>
    <text x="592" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 per pod</text>

    <!-- App B -->
    <rect x="704" y="96" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="704" y="96" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="712" y="104" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="724" y="113" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="784" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App Container</text>
    <text x="784" y="148" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">server</text>

    <!-- Zone 2 nodes -->
    <!-- App A2 -->
    <rect x="84" y="248" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="84" y="248" width="136" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="92" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="104" y="265" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="152" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App Container</text>
    <text x="152" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">client</text>

    <!-- eBPF L3/L4 (client-side) -->
    <rect x="248" y="248" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="248" y="248" width="136" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="256" y="256" width="32" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
    <text x="272" y="265" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BPF</text>
    <text x="316" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF</text>
    <text x="316" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L3/L4</text>

    <!-- Shared Envoy L7 Only (focal) -->
    <rect x="412" y="248" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="412" y="248" width="136" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="420" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="434" y="265" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PXY</text>
    <text x="480" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Shared Envoy</text>
    <text x="480" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L7 only · 1 per node</text>

    <!-- eBPF L3/L4 (server-side) -->
    <rect x="576" y="248" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="576" y="248" width="136" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="584" y="256" width="32" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
    <text x="600" y="265" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BPF</text>
    <text x="644" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF</text>
    <text x="644" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L3/L4</text>

    <!-- App B2 -->
    <rect x="740" y="248" width="136" height="64" rx="6" fill="#ffffff"/>
    <rect x="740" y="248" width="136" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="748" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="760" y="265" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="808" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App Container</text>
    <text x="808" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">server</text>

    <!-- Legend -->
    <line x1="40" y1="380" x2="920" y2="380" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="396" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="412" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="420" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal · shared L7 proxy</text>

    <rect x="256" y="412" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="276" y="420" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">App container</text>

    <rect x="440" y="412" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="460" y="420" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Proxy / datapath hop</text>

    <line x1="656" y1="417" x2="684" y2="417" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="692" y="420" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Request path</text>
  </svg>