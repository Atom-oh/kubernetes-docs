    <title id="ko-basics-05-ebpf-fundamentals-6-title">Hubble 관측 아키텍처</title>
    <desc id="ko-basics-05-ebpf-fundamentals-6-desc">Cilium Agent의 eBPF 데이터플레인에서 Hubble Observer가 네트워크 플로우, DNS 쿼리, HTTP 요청, 정책 결정 데이터를 수집하고 Hubble Relay를 거쳐 UI와 CLI로 제공하는 과정을 보여주는 아키텍처 다이어그램.</desc>
