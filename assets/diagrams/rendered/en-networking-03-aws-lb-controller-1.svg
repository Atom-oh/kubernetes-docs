<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lbc-sequence-title lbc-sequence-desc">
    <title id="lbc-sequence-title">AWS Load Balancer Controller reconciliation sequence</title>
    <desc id="lbc-sequence-desc">Sequence diagram showing a user creating an Ingress or Service, the Kubernetes API notifying the LB Controller, the controller calling the AWS API to provision an ALB or NLB and its target group and listener rules, then writing status back to Kubernetes so the user receives the load balancer's DNS name; a note marks that the controller keeps registering and deregistering targets as Pods change.</desc>

    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ===== Lifelines ===== -->
    <line x1="88"  y1="88" x2="88"  y2="444" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="284" y1="88" x2="284" y2="444" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="88" x2="480" y2="444" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="676" y1="88" x2="676" y2="444" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="872" y1="88" x2="872" y2="444" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ===== Activation bars ===== -->
    <rect x="280" y="120" width="8" height="324" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="476" y="152" width="8" height="260" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="672" y="224" width="8" height="156" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- ===== Messages (drawn before labels/actors) ===== -->

    <!-- M1 User -> K8s API : Create Ingress/Service (link) -->
    <line x1="88" y1="120" x2="284" y2="120" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <!-- M2 K8s API -> Controller : Watch event -->
    <line x1="284" y1="152" x2="480" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M3 Controller self : Analyze resource -->
    <path d="M484,176 H520 V200 H484" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M4 Controller -> AWS API : Request LB creation (link) -->
    <line x1="480" y1="224" x2="676" y2="224" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <!-- M5 AWS API -> ALB/NLB : Provision -->
    <line x1="676" y1="256" x2="872" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M6 AWS API to Controller : Return ARN (dashed return) -->
    <line x1="676" y1="288" x2="480" y2="288" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- M7 Controller -> AWS API : Create Target Group (link) -->
    <line x1="480" y1="348" x2="676" y2="348" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <!-- M8 Controller -> AWS API : Configure Listener rules (link) -->
    <line x1="480" y1="380" x2="676" y2="380" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <!-- M9 Controller -> K8s API : Update Status -->
    <line x1="480" y1="412" x2="284" y2="412" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M10 K8s API to User : Provide LB DNS (dashed, headline success, accent) -->
    <line x1="284" y1="444" x2="88" y2="444" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

    <!-- ===== Note (Controller .. AWS API) ===== -->
    <rect x="488" y="304" width="180" height="20" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.24)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="578" y="317" fill="#545B64" font-size="9" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">auto register/deregister on Pod change</text>

    <!-- ===== Message labels (masked, 6-10px gap above each line) ===== -->

    <rect x="130" y="100" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="186" y="109" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">CREATE ING/SVC</text>

    <rect x="338" y="132" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="382" y="141" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">WATCH EVENT</text>

    <rect x="528" y="182" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="560" y="191" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">ANALYZE</text>

    <rect x="530" y="204" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="578" y="213" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">REQUEST LB</text>

    <rect x="726" y="236" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="772" y="245" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">PROVISION</text>

    <rect x="530" y="268" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="578" y="277" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">RETURN ARN</text>

    <rect x="530" y="328" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="578" y="337" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">CREATE TG</text>

    <rect x="518" y="360" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="578" y="369" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">CONFIG LISTENER</text>

    <rect x="332" y="392" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="382" y="401" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">UPDATE STATUS</text>

    <rect x="158" y="424" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="186" y="433" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">LB DNS</text>

    <!-- ===== Actor boxes (drawn after arrows/labels) ===== -->

    <!-- User (input) -->
    <rect x="16" y="32" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="16" y="32" width="144" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="24" y="40" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="38" y="49" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
    <text x="88" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">User</text>
    <text x="88" y="79" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl / CI</text>

    <!-- Kubernetes API -->
    <rect x="212" y="32" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="212" y="32" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="220" y="40" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="234" y="49" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
    <text x="284" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes API</text>
    <text x="284" y="79" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kube-apiserver</text>

    <!-- LB Controller (focal) -->
    <rect x="408" y="32" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="408" y="32" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="416" y="40" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="430" y="49" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTL</text>
    <text x="480" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">LB Controller</text>
    <text x="480" y="79" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kube-system</text>

    <!-- AWS API -->
    <rect x="604" y="32" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="604" y="32" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="612" y="40" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="626" y="49" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AWS</text>
    <text x="676" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS API</text>
    <text x="676" y="79" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">elbv2</text>

    <!-- ALB/NLB (external) -->
    <rect x="800" y="32" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="800" y="32" width="144" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="808" y="40" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="822" y="49" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ELB</text>
    <text x="872" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ALB / NLB</text>
    <text x="872" y="79" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">provisioned</text>

    <!-- ===== Legend ===== -->
    <line x1="16" y1="468" x2="944" y2="468" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="16" y="484" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <line x1="16" y1="504" x2="48" y2="504" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="56" y="508" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">AWS / Kubernetes API call</text>

    <line x1="304" y1="504" x2="336" y2="504" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="344" y="508" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Internal event / provisioning</text>

    <line x1="600" y1="504" x2="632" y2="504" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="640" y="508" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return value</text>

    <line x1="800" y1="504" x2="832" y2="504" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <text x="840" y="508" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Result to user</text>
  </svg>