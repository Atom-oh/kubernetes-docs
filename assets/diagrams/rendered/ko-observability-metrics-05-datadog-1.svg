<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dd-arch-ttl dd-arch-desc">
<title id="dd-arch-ttl">EKS-Datadog 통합 아키텍처</title>
<desc id="dd-arch-desc">EKS 클러스터의 Datadog Agent와 Cluster Agent가 메트릭, 로그, 트레이스를 Datadog 플랫폼으로 전송하고, 플랫폼은 이를 대시보드로 모으며 Watchdog AI가 이상을 감지해 모니터로 알림을 보내는 흐름을 보여주는 아키텍처 다이어그램.</desc>
<defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
  .name { font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:600; font-size:12px; fill:#232F3E; }
  .sub { font-family:'Geist Mono',monospace; font-size:9px; fill:#545B64; }
  .eyebrow { font-family:'Geist Mono',monospace; font-size:8px; letter-spacing:0.18em; fill:#7D8998; text-transform:uppercase; }
  .zonelabel { font-family:'Geist Mono',monospace; font-size:7px; letter-spacing:0.14em; fill:rgba(35,47,62,0.40); text-transform:uppercase; }
  .alabel { font-family:'Geist Mono',monospace; font-size:8px; letter-spacing:0.06em; fill:#7D8998; }
  .title { font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:700; font-size:28px; fill:#232F3E; }
</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<text x="32" y="40" class="eyebrow">EKS INTEGRATION ARCHITECTURE</text>
<text x="32" y="72" class="title">EKS · Datadog 통합 아키텍처</text>

<!-- Zone: EKS Cluster (left), y=112..504, x=32..320 -->
<rect x="32" y="112" width="288" height="392" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="52" y="120" width="140" height="14" rx="2" fill="#ffffff"/>
<text x="122" y="131" text-anchor="middle" class="zonelabel">EKS CLUSTER · WORKER NODES</text>

<!-- Zone: Datadog Platform (right), x=616..928 -->
<rect x="616" y="112" width="312" height="392" rx="8" fill="rgba(255,153,0,0.06)" stroke="rgba(236,114,17,0.30)" stroke-width="0.8"/>
<rect x="636" y="120" width="130" height="14" rx="2" fill="#ffffff"/>
<text x="701" y="131" text-anchor="middle" class="zonelabel" fill="#EC7211">DATADOG PLATFORM</text>

<!-- ===== ARROWS (drawn before nodes) ===== -->

<!-- APP -.-> DA (dashed, instrumentation) -->
<path d="M 176,436 V 316" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="150" y="368" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="176" y="377" text-anchor="middle" class="alabel">계측</text>

<!-- DA -> METRICS : straight, both ports at y=188 -->
<path d="M 268,188 H 632" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="416" y="166" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="442" y="175" text-anchor="middle" class="alabel" fill="#EC7211">메트릭</text>

<!-- DA -> LOGS : bend at x=380 (outer lane) -->
<path d="M 268,204 H 372 Q 380,204 380,212 V 302 Q 380,310 388,310 H 632"
      fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="392" y="248" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="412" y="257" text-anchor="middle" class="alabel">로그</text>

<!-- DA -> APM : bend at x=340 (inner lane, turns earlier than LOGS) -->
<path d="M 268,220 H 332 Q 340,220 340,228 V 382 Q 340,390 348,390 H 632"
      fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="352" y="352" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="378" y="361" text-anchor="middle" class="alabel">트레이스</text>

<!-- CCA -> METRICS : routed via open margin above DA (zero crossings) -->
<path d="M 52,288 H 40 V 152 H 700 V 176" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="480" y="140" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="524" y="149" text-anchor="middle" class="alabel">클러스터 메트릭·이벤트</text>

<!-- METRICS -> DASH -->
<path d="M 716,212 V 276 Q 716,284 724,284 H 820"
      fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- LOGS -> DASH -->
<path d="M 800,310 H 806 Q 814,310 814,304 H 820"
      fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- APM -> DASH -->
<path d="M 716,372 V 342 Q 716,334 724,334 H 804 Q 812,334 812,324 H 820"
      fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="726" y="244" width="24" height="12" rx="2" fill="#ffffff"/>
<text x="738" y="253" text-anchor="middle" class="alabel">집계</text>

<!-- WATCH -> ALERT -->
<path d="M 716,444 V 468" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="690" y="450" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="716" y="459" text-anchor="middle" class="alabel">감지</text>

<!-- ===== NODES ===== -->

<!-- DA: Datadog Agent DaemonSet -->
<rect x="52" y="172" width="216" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="64" y="182" width="60" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
<text x="94" y="191" text-anchor="middle" class="sub" letter-spacing="0.08em">DAEMONSET</text>
<text x="160" y="207" text-anchor="middle" class="name">Datadog Agent</text>

<!-- CCA: Cluster Agent -->
<rect x="52" y="288" width="216" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="64" y="298" width="60" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
<text x="94" y="307" text-anchor="middle" class="sub" letter-spacing="0.08em">CONTROL</text>
<text x="160" y="323" text-anchor="middle" class="name">Cluster Agent</text>

<!-- APP: Applications -->
<rect x="52" y="436" width="216" height="52" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<rect x="64" y="446" width="52" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
<text x="90" y="455" text-anchor="middle" class="sub" letter-spacing="0.08em">POD</text>
<text x="160" y="471" text-anchor="middle" class="name">Applications</text>

<!-- METRICS -->
<rect x="632" y="176" width="168" height="36" rx="6" fill="#ffffff" stroke="rgba(236,114,17,0.6)" stroke-width="1"/>
<text x="716" y="198" text-anchor="middle" class="name">Metrics</text>

<!-- LOGS -->
<rect x="632" y="292" width="168" height="36" rx="6" fill="#ffffff" stroke="rgba(236,114,17,0.6)" stroke-width="1"/>
<text x="716" y="314" text-anchor="middle" class="name">Logs</text>

<!-- APM -->
<rect x="632" y="372" width="168" height="36" rx="6" fill="#ffffff" stroke="rgba(236,114,17,0.6)" stroke-width="1"/>
<text x="716" y="394" text-anchor="middle" class="name">APM Traces</text>
<text x="716" y="404" text-anchor="middle" class="sub" font-size="8">+ Profiling</text>

<!-- DASH (focal) -->
<rect x="820" y="268" width="88" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<rect x="830" y="278" width="52" height="12" rx="2" fill="transparent" stroke="#EC7211" stroke-width="0.8"/>
<text x="856" y="287" text-anchor="middle" class="sub" fill="#EC7211" letter-spacing="0.08em">VIEW</text>
<text x="864" y="308" text-anchor="middle" class="name" font-size="11">Dashboards</text>

<!-- WATCH -->
<rect x="632" y="416" width="168" height="28" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="716" y="434" text-anchor="middle" class="name" font-size="11">Watchdog AI</text>

<!-- ALERT -->
<rect x="632" y="468" width="168" height="28" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="716" y="486" text-anchor="middle" class="name" font-size="11">Monitors</text>

<!-- Legend -->
<line x1="32" y1="536" x2="928" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<circle cx="36" cy="552" r="4" fill="none" stroke="#EC7211" stroke-width="1.2"/>
<text x="48" y="555" class="alabel">주요 수집 경로 (Agent → Metrics)</text>
<line x1="300" y1="552" x2="316" y2="552" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
<text x="324" y="555" class="alabel">비동기 / 계측 연결</text>
</svg>