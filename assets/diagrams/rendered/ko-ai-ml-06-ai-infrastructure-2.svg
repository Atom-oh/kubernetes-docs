<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
      <title id="t2">기존 디바이스 플러그인 방식과 DRA 방식 비교</title>
      <desc id="d2">기존 디바이스 플러그인 방식(파드 요청 → 전체 GPU 할당 → 공유 불가)과 DRA 방식(ResourceClaim 생성 → 드라이버 평가 → ResourceSlice 토폴로지 추적 → 세밀한 할당 → 토폴로지 인식 스케줄링)의 두 흐름을 나란히 비교하고, DRA 흐름만 GPU 메모리 파티셔닝·멀티테넌트 공유·NVLink 인식·P6e-GB200 지원이라는 이점으로 이어지는 것을 보여주는 플로우차트.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7D8998"/></marker>
      </defs>

      <rect width="960" height="600" fill="#FFFFFF"/>

      <!-- column eyebrows -->
      <text x="232" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">기존 디바이스 플러그인</text>
      <text x="728" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">DRA (KUBERNETES 1.31+)</text>

      <!-- arrows first -->
      <line x1="232" y1="128" x2="232" y2="168" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="232" y1="232" x2="232" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="728" y1="120" x2="728" y2="148" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="728" y1="204" x2="728" y2="232" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="728" y1="288" x2="728" y2="316" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="728" y1="372" x2="728" y2="400" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- T3 -> Benefits, dashed, label 제한적 -->
      <path d="M232,336 V472 Q232,480 240,480 H392 Q400,480 400,488 V504"
            fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
      <rect x="284" y="460" width="52" height="12" rx="2" fill="#FFFFFF"/>
      <text x="310" y="469" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">제한적</text>

      <!-- D5 -> Benefits, solid accent, label 활성화 -->
      <path d="M728,456 V480 Q728,488 720,488 H568 Q560,488 560,496 V504"
            fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="612" y="468" width="52" height="12" rx="2" fill="#FFFFFF"/>
      <text x="638" y="477" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">활성화</text>

      <!-- Traditional chain: T1, T2, T3 -->
      <rect x="132" y="64" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
      <text x="232" y="90" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">파드 요청</text>
      <text x="232" y="106" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">nvidia.com/gpu: 1</text>

      <rect x="132" y="168" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
      <text x="232" y="194" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">디바이스 플러그인</text>
      <text x="232" y="210" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">전체 GPU 할당</text>

      <rect x="132" y="272" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="232" y="298" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">독점적 GPU 접근</text>
      <text x="232" y="314" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">공유 불가 · 세밀한 제어 불가</text>

      <!-- DRA chain: D1..D5 -->
      <rect x="628" y="64" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
      <text x="728" y="86" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">ResourceClaim 생성</text>
      <text x="728" y="102" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">파드가 요청</text>

      <rect x="628" y="148" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
      <text x="728" y="170" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">DRA 드라이버 평가</text>
      <text x="728" y="186" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">클레임 검증</text>

      <rect x="628" y="232" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
      <text x="728" y="254" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">ResourceSlice 추적</text>
      <text x="728" y="270" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">GPU 토폴로지</text>

      <rect x="628" y="316" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
      <text x="728" y="338" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">세밀한 할당</text>
      <text x="728" y="354" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">MIG · MPS · 타임슬라이스</text>

      <rect x="628" y="400" width="200" height="56" rx="6" fill="#FFFFFF"/>
      <rect x="628" y="400" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="728" y="422" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">토폴로지 인식 스케줄링</text>
      <text x="728" y="438" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono',monospace">NVLink · IMEX</text>

      <!-- Benefits (single node, chip grid) -->
      <rect x="320" y="504" width="320" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="522" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">DRA 이점</text>
      <g font-family="'Geist Mono',monospace" font-size="8" fill="#545B64">
        <rect x="332" y="530" width="140" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="#7D8998" stroke-width="0.8"/>
        <text x="402" y="538" text-anchor="middle">GPU 메모리 파티셔닝</text>
        <text x="402" y="550" text-anchor="middle">멀티테넌트 공유</text>
        <rect x="480" y="530" width="148" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="#7D8998" stroke-width="0.8"/>
        <text x="554" y="538" text-anchor="middle">NVLink 토폴로지 인식</text>
        <text x="554" y="550" text-anchor="middle">P6e-GB200 지원</text>
      </g>
    </svg>
