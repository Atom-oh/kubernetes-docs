<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gitops-flagger-arch-title gitops-flagger-arch-desc">
<title id="gitops-flagger-arch-title">Flagger and Flux GitOps Toolkit</title>
<desc id="gitops-flagger-arch-desc">Flux's source, kustomize, helm, notification and image-automation controllers reconcile Kubernetes deployments from a Git repository, while Flagger watches those deployments, queries Prometheus, and manages the Services and routes used for progressive delivery.</desc>
