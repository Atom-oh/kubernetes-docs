<rect x="392" y="72" width="176" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="81" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE · AWS MANAGED</text>

<rect x="40" y="216" width="304" height="208" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="132" y="220" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="192" y="229" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">NODE 1 · DATA PLANE</text>

<rect x="620" y="216" width="304" height="208" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="712" y="220" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="772" y="229" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">NODE 2 · DATA PLANE</text>

