<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Blue/Green Deployment Flow</title>
<desc id="d">A blue/green deployment deploys the green version, pre-tests it on the preview service, requires approval before switching production traffic, and rolls back to blue automatically if any pre-test, approval, or post-verification step fails.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="#FFFFFF"/>
<line x1="98.0" y1="122" x2="112.0" y2="122" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="202.0" y1="122" x2="216.0" y2="122" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="306.0" y1="122" x2="362.0" y2="122" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="309.0" y="102" width="50" height="12" rx="2" fill="#FFFFFF"/>
<text x="334.0" y="111" fill="#545B64" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUCCESS</text>
<line x1="452.0" y1="122" x2="508.0" y2="122" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="455.0" y="102" width="50" height="12" rx="2" fill="#FFFFFF"/>
<text x="480.0" y="111" fill="#545B64" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APPROVE</text>
<line x1="598.0" y1="122" x2="612.0" y2="122" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="702.0" y1="122" x2="758.0" y2="122" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="705.0" y="102" width="50" height="12" rx="2" fill="#FFFFFF"/>
<text x="730.0" y="111" fill="#545B64" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUCCESS</text>
<line x1="848.0" y1="122" x2="862.0" y2="122" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 251.0,154 H 282 Q 290,154 290,162 V 300" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 397.0,154 H 392 Q 400,154 400,162 V 300" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 657.0,154 H 712 Q 720,154 720,162 V 300" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="231.0" y="210" width="40" height="12" rx="2" fill="#FFFFFF"/>
<text x="251.0" y="219" fill="#545B64" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FAIL</text>
<rect x="389.0" y="250" width="56" height="12" rx="2" fill="#FFFFFF"/>
<text x="417.0" y="259" fill="#545B64" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REJECT</text>
<rect x="637.0" y="210" width="40" height="12" rx="2" fill="#FFFFFF"/>
<text x="657.0" y="219" fill="#545B64" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FAIL</text>
<rect x="8.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF"/>
<rect x="8.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="53.0" y="118.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Start</text>
<text x="53.0" y="134.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">blue active</text>
<rect x="112.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF"/>
<rect x="112.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="157.0" y="126.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Deploy Green</text>
<rect x="216.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF"/>
<rect x="216.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="261.0" y="118.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pre-test</text>
<text x="261.0" y="134.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">preview svc</text>
<rect x="362.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF"/>
<rect x="362.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="407.0" y="118.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Approval</text>
<text x="407.0" y="134.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">or auto</text>
<rect x="508.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF"/>
<rect x="508.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="553.0" y="118.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Switch</text>
<text x="553.0" y="134.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">blue -> green</text>
<rect x="612.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF"/>
<rect x="612.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="657.0" y="118.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Verify</text>
<text x="657.0" y="134.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">post-promotion</text>
<rect x="758.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF"/>
<rect x="758.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="803.0" y="118.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Scale Down</text>
<text x="803.0" y="134.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">after 30s</text>
<rect x="862.0" y="90" width="90" height="64" rx="6" fill="#FFFFFF"/>
<rect x="862.0" y="90" width="90" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="907.0" y="118.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Complete</text>
<text x="907.0" y="134.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">green active</text>
<rect x="260" y="300" width="170" height="56" rx="6" fill="#FFFFFF"/>
<rect x="260" y="300" width="170" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="345.0" y="324.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Rollback</text>
<text x="345.0" y="340.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">delete green</text>
<rect x="610" y="300" width="220" height="56" rx="6" fill="#FFFFFF"/>
<rect x="610" y="300" width="220" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="720.0" y="324.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Immediate Rollback</text>
<text x="720.0" y="340.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">switch to blue</text>
</svg>