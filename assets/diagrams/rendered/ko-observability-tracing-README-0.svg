<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
    <title id="d0-title">복잡한 요청 흐름</title>
    <desc id="d0-desc">사용자 요청이 API Gateway를 거쳐 여러 마이크로서비스로 분기되며, 지연 지점과 오류 원인, 서비스 의존성을 기존 모니터링으로는 파악하기 어렵다는 문제를 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows (behind boxes) -->
    <line x1="480" y1="88" x2="480" y2="120" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <path d="M444,184 V192 Q444,200 436,200 H148 Q140,200 140,208 V216" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="184" x2="480" y2="216" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M516,184 V192 Q516,200 524,200 H812 Q820,200 820,208 V216" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="480" y1="280" x2="480" y2="328" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M796,280 V288 Q796,304 788,304 H688 Q680,304 680,312 V328" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M844,280 V288 Q844,304 852,304 H872 Q880,304 880,312 V328" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="680" y1="392" x2="680" y2="424" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: User -->
    <rect x="408" y="24" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="408" y="24" width="144" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="480" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">사용자</text>

    <!-- Node: API Gateway (focal) -->
    <rect x="408" y="120" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="408" y="120" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">API Gateway</text>
    <text x="480" y="166" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">단일 진입점</text>

    <!-- Row 3: Auth / Product / Order -->
    <rect x="68" y="216" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="68" y="216" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Auth Service</text>

    <rect x="408" y="216" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="408" y="216" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Product Service</text>

    <rect x="748" y="216" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="748" y="216" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="820" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Order Service</text>

    <!-- Row 4: Inventory/Pricing / Payment / Notification -->
    <rect x="408" y="328" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="408" y="328" width="144" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="356" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Inventory ·</text>
    <text x="480" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Pricing Service</text>

    <rect x="608" y="328" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="608" y="328" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="680" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Payment Service</text>

    <rect x="808" y="328" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="808" y="328" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="880" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Notification</text>

    <!-- Row 5: Fraud Detection -->
    <rect x="608" y="424" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="608" y="424" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="680" y="460" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Fraud Detection</text>

    <!-- Editorial aside: unresolved questions -->
    <rect x="740" y="24" width="200" height="88" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="756" y="44" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">미해결 질문</text>
    <text x="756" y="66" fill="#232F3E" font-size="11" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',sans-serif">지연 지점 · 오류 원인 ·</text>
    <text x="756" y="84" fill="#232F3E" font-size="11" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',sans-serif">서비스 의존성을 알 수 없다</text>

    <!-- Legend -->
    <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="552" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="560" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">단일 진입점 (focal)</text>

    <rect x="220" y="552" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="560" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">마이크로서비스</text>

    <rect x="400" y="552" width="14" height="10" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="420" y="560" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">미해결 질문 (aside)</text>
  </svg>