<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cilium-comp-title cilium-comp-desc">
    <title id="cilium-comp-title">Cilium components in a Kubernetes cluster</title>
    <desc id="cilium-comp-desc">Diagram showing the Cilium Agent as the control-plane hub coordinating with the Kubernetes API server, the Cilium Operator, the Cilium CLI, and Hubble, while a per-node agent on each worker node loads eBPF programs and manages eBPF maps that handle packet processing for pods.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="56" width="880" height="216" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="436" y="60" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE</text>

    <rect x="40" y="292" width="880" height="176" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="440" y="296" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="305" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WORKER NODE</text>

    <!-- ===== Arrows (before boxes) ===== -->

    <!-- API <-> Agent (straight, shared y) -->
    <line x1="168" y1="172" x2="392" y2="172" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <!-- API <-> Operator: detour above Agent's box -->
    <path d="M 168,172 H 184 Q 192,172 192,164 V 108 Q 192,100 200,100 H 624 Q 632,100 632,108"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <!-- Agent <-> Operator -->
    <path d="M 560,156 H 588 Q 596,156 596,148 V 144 Q 596,136 604,136 H 632"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <!-- Agent <-> Hubble: thread the 12px gap between Operator and CLI -->
    <path d="M 560,172 V 160 Q 560,154 566,154 H 800"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <!-- Cilium CLI -> Agent (straight, shared y) -->
    <line x1="632" y1="188" x2="560" y2="188" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Agent <-> Node Agent (straight, shared x) -->
    <line x1="476" y1="204" x2="476" y2="316" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <!-- Node Agent -> eBPF Programs (straight, shared y) -->
    <line x1="560" y1="348" x2="620" y2="348" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Node Agent -> eBPF Maps (right+down, enter left edge) -->
    <path d="M 560,364 H 582 Q 590,364 590,372 V 408 Q 590,416 598,416 H 620"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- eBPF Programs <-> eBPF Maps (straight, shared x) -->
    <line x1="670" y1="380" x2="670" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <!-- Pods <-> eBPF Programs (straight, shared y) -->
    <line x1="788" y1="348" x2="720" y2="348" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

    <!-- ===== Arrow labels ===== -->
    <rect x="244" y="152" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="280" y="161" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATE SYNC</text>

    <rect x="378" y="80" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="412" y="89" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD MGMT</text>

    <rect x="524" y="112" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="548" y="121" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MANAGE</text>

    <rect x="654" y="134" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="680" y="143" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">METRICS</text>

    <rect x="446" y="246" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="255" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATE SYNC</text>

    <rect x="568" y="330" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="584" y="339" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOAD</text>

    <rect x="806" y="330" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="832" y="339" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PACKETS</text>

    <!-- ===== Nodes ===== -->

    <!-- Kubernetes API Server -->
    <rect x="40" y="140" width="128" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="140" width="128" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="48" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="62" y="157" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
    <text x="104" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Server</text>
    <text x="104" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cluster control plane</text>

    <!-- Cilium Agent (focal) -->
    <rect x="392" y="140" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="392" y="140" width="168" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="400" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="416" y="157" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
    <text x="476" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cilium Agent</text>
    <text x="476" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">control-plane daemon</text>

    <!-- Cilium Operator -->
    <rect x="632" y="92" width="128" height="56" rx="6" fill="#ffffff"/>
    <rect x="632" y="92" width="128" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="640" y="100" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="654" y="109" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPS</text>
    <text x="696" y="126" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cilium Operator</text>
    <text x="696" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cluster-wide CRDs</text>

    <!-- Cilium CLI -->
    <rect x="632" y="160" width="112" height="56" rx="6" fill="#ffffff"/>
    <rect x="632" y="160" width="112" height="56" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="640" y="168" width="24" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="652" y="177" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
    <text x="688" y="192" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cilium CLI</text>
    <text x="688" y="206" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">operator input</text>

    <!-- Hubble -->
    <rect x="800" y="126" width="112" height="56" rx="6" fill="#ffffff"/>
    <rect x="800" y="126" width="112" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="808" y="134" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="825" y="143" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBS</text>
    <text x="856" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Hubble</text>
    <text x="856" y="174" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flow observability</text>

    <!-- Node Agent (representative, x N nodes) -->
    <rect x="392" y="316" width="168" height="64" rx="6" fill="#ffffff"/>
    <rect x="392" y="316" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="400" y="324" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="414" y="333" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DMN</text>
    <text x="476" y="352" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node Agent</text>
    <text x="476" y="368" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">per node · ×N nodes</text>

    <!-- eBPF Programs -->
    <rect x="620" y="316" width="100" height="64" rx="6" fill="#ffffff"/>
    <rect x="620" y="316" width="100" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="628" y="324" width="30" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="643" y="333" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRG</text>
    <text x="670" y="358" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF Programs</text>

    <!-- eBPF Maps -->
    <rect x="620" y="392" width="100" height="48" rx="6" fill="#ffffff"/>
    <rect x="620" y="392" width="100" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="628" y="400" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="642" y="409" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAP</text>
    <text x="670" y="424" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF Maps</text>

    <!-- Pods -->
    <rect x="788" y="316" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="788" y="316" width="112" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="796" y="324" width="26" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="809" y="333" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
    <text x="844" y="352" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pods</text>
    <text x="844" y="368" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workload traffic</text>

    <!-- Legend -->
    <line x1="40" y1="432" x2="920" y2="432" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="448" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="464" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="472" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal / control-plane hub</text>

    <rect x="270" y="464" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="290" y="472" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Component</text>

    <rect x="410" y="464" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="430" y="472" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Data / state store</text>

    <rect x="570" y="464" width="14" height="10" rx="2" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="590" y="472" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">External input / workload</text>

    <line x1="800" y1="470" x2="828" y2="470" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <text x="836" y="472" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Bidirectional</text>
  </svg>