<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obs-flow-title obs-flow-desc">
    <title id="obs-flow-title">Linkerd 문제 해결 워크플로우</title>
    <desc id="obs-flow-desc">성공률과 지연 시간을 차례로 점검해 top·tap·routes·edges 명령으로 원인을 좁혀가고, mTLS 문제 여부를 확인해 최종적으로 문제를 해결하는 진단 절차를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#FFFFFF"/>

    <!-- Arrows (behind boxes) -->
    <!-- STAT -> CHECK, same x, straight -->
    <line x1="480" y1="78" x2="480" y2="124" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- CHECK(예) -> TOPTAP -->
    <path d="M404,160 H360 Q352,160 352,168 V310 Q352,318 344,318 H390"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="330" y="220" width="28" height="12" rx="2" fill="#FFFFFF"/>
    <text x="344" y="229" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">예</text>

    <!-- CHECK(아니오) -> LATENCY -->
    <path d="M556,160 H620 Q628,160 628,168 V228"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="600" y="184" width="52" height="12" rx="2" fill="#FFFFFF"/>
    <text x="626" y="193" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">아니오</text>

    <!-- LATENCY(예) -> ROUTES -->
    <path d="M672,282 H700 Q708,282 708,290 V318"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="686" y="294" width="28" height="12" rx="2" fill="#FFFFFF"/>
    <text x="700" y="303" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">예</text>

    <!-- LATENCY(아니오) -> EDGES -->
    <path d="M700,264 H840 Q848,264 848,272 V318"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="800" y="238" width="52" height="12" rx="2" fill="#FFFFFF"/>
    <text x="826" y="247" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">아니오</text>

    <!-- ROUTES -> TOPTAP, same y, straight -->
    <line x1="630" y1="340" x2="390" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- TOPTAP -> LOGS, same x, straight -->
    <line x1="280" y1="364" x2="280" y2="410" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- EDGES -> CHECK_TLS, same x, straight -->
    <line x1="840" y1="364" x2="840" y2="410" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- CHECK_TLS(예 · 인증서 확인) -> END -->
    <path d="M780,436 H660 Q652,436 652,444 V486 Q652,494 644,494 H590"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="612" y="450" width="96" height="12" rx="2" fill="#FFFFFF"/>
    <text x="660" y="459" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">예·인증서 확인</text>

    <!-- CHECK_TLS(아니오) -> END -->
    <path d="M840,472 V486 Q840,494 832,494 H610"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="700" y="474" width="52" height="12" rx="2" fill="#FFFFFF"/>
    <text x="726" y="483" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">아니오</text>

    <!-- LOGS -> END -->
    <path d="M280,434 V486 Q280,494 288,494 H514"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: STAT (start, oval) -->
    <rect x="390" y="34" width="180" height="44" rx="22" fill="#FFFFFF"/>
    <rect x="390" y="34" width="180" height="44" rx="22" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="52" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">문제 감지</text>
    <text x="480" y="68" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">linkerd viz stat</text>

    <!-- Node: CHECK (diamond) -->
    <polygon points="480,124 556,160 480,196 404,160" fill="#FFFFFF"/>
    <polygon points="480,124 556,160 480,196 404,160" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">성공률</text>
    <text x="480" y="171" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">낮음?</text>

    <!-- Node: TOPTAP -->
    <rect x="200" y="308" width="180" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="200" y="308" width="180" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <rect x="208" y="316" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="222" y="325" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
    <text x="290" y="336" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">viz top → tap</text>
    <text x="290" y="352" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">상위 경로·실시간 요청</text>

    <!-- Node: LATENCY (diamond) -->
    <polygon points="700,228 776,264 700,300 624,264" fill="#FFFFFF"/>
    <polygon points="700,228 776,264 700,300 624,264" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="700" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">지연 시간</text>
    <text x="700" y="275" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">높음?</text>

    <!-- Node: ROUTES -->
    <rect x="560" y="318" width="140" height="44" rx="6" fill="#FFFFFF"/>
    <rect x="560" y="318" width="140" height="44" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <rect x="568" y="326" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="582" y="335" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
    <text x="630" y="345" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">viz routes</text>

    <!-- Node: EDGES -->
    <rect x="768" y="318" width="140" height="44" rx="6" fill="#FFFFFF"/>
    <rect x="768" y="318" width="140" height="44" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <rect x="776" y="326" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="790" y="335" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
    <text x="838" y="345" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">viz edges</text>

    <!-- Node: LOGS -->
    <rect x="200" y="410" width="160" height="44" rx="6" fill="#FFFFFF"/>
    <rect x="200" y="410" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <rect x="208" y="418" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="224" y="427" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOG</text>
    <text x="280" y="437" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">프록시 로그 확인</text>

    <!-- Node: CHECK_TLS (diamond) -->
    <polygon points="840,400 908,436 840,472 772,436" fill="#FFFFFF"/>
    <polygon points="840,400 908,436 840,472 772,436" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="840" y="432" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">mTLS</text>
    <text x="840" y="447" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">문제?</text>

    <!-- Node: END (end, oval, focal) -->
    <rect x="480" y="472" width="160" height="44" rx="22" fill="#FFFFFF"/>
    <rect x="480" y="472" width="160" height="44" rx="22" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="560" y="498" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">문제 해결</text>

    <!-- Legend -->
    <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="566" width="20" height="12" rx="6" fill="#FFFFFF" stroke="#545B64" stroke-width="1"/>
    <text x="68" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">시작 / 진단 명령</text>

    <polygon points="230,566 244,572 230,578 216,572" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="256" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">판단 분기</text>

    <rect x="380" y="566" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="408" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">진단 조치</text>

    <rect x="520" y="566" width="20" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="548" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">문제 해결(종료)</text>
  </svg>