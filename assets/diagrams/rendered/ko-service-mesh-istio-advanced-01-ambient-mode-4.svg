<title id="amb04-title">Waypoint 배포 단위: ServiceAccount별 프록시 공유</title>
<desc id="amb04-desc">하나의 Namespace 안에서 frontend와 backend ServiceAccount가 각자 별도의 Waypoint 프록시를 공유하고, ztunnel이 L7 라우팅이 필요한 트래픽을 해당 Waypoint로 전달하는 구조를 보여주는 다이어그램.</desc>
