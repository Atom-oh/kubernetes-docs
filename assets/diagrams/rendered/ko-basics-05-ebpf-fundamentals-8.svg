    <title id="ko-basics-05-ebpf-fundamentals-8-title">Tetragon 런타임 보안 아키텍처</title>
    <desc id="ko-basics-05-ebpf-fundamentals-8-desc">TracingPolicy CRD로 정의된 정책에 따라 Tetragon Agent의 eBPF 센서가 프로세스, 네트워크, 파일 활동을 추적하고 위반 시 프로세스 킬, 네트워크 차단, 파일 접근 거부로 정책을 즉시 적용하는 과정을 보여주는 아키텍처 다이어그램.</desc>
