<title id="en-service-mesh-istio-02-basic-concepts-14-title">One Feature Set Across Every Workload Type</title>
<desc id="en-service-mesh-istio-02-basic-concepts-14-desc">Diagram showing three workload types — Kubernetes pods, multi-cluster workloads, and virtual machines — all connecting into the same set of common mesh features: mTLS encryption, traffic management, security policy, and metrics and tracing.</desc>
