<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zone-failover-title zone-failover-desc">
<title id="zone-failover-title">Zone A 장애 시 Zone B로의 Failover 흐름</title>
<desc id="zone-failover-desc">Zone A의 Pod가 3회 연속 오류를 반환하면 Outlier Detection이 해당 엔드포인트를 제외하고, DestinationRule의 failover 규칙에 따라 요청이 Zone B의 Pod로 자동 전환됨을 보여줍니다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ============ LOOP FRAGMENT (retries) — painted before lifelines/messages inside it ============ -->
<rect x="120" y="196" width="360" height="88" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
<rect x="120" y="196" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
<text x="140" y="208" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">LOOP</text>
<text x="168" y="208" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">[retry ≤ 3, consecutiveErrors: 3]</text>

<!-- ============ LIFELINES ============ -->
<line x1="140" y1="164" x2="140" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="380" y1="164" x2="380" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="620" y1="164" x2="620" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="860" y1="164" x2="860" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- ============ MESSAGES ============ -->
<!-- 1. ClientA -> EnvoyA -->
<line x1="140" y1="180" x2="380" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="226" y="160" width="68" height="12" rx="2" fill="#ffffff"/>
<text x="260" y="169" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GET /api</text>

<!-- inside loop: attempt -> PodA (unhealthy), error back (dashed cross, no marker needed but reuse dashed) -->
<line x1="380" y1="222" x2="620" y2="222" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="466" y="202" width="66" height="12" rx="2" fill="#ffffff"/>
<text x="499" y="211" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Attempt N</text>

<line x1="620" y1="256" x2="380" y2="256" stroke="#DD344C" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="452" y="236" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="500" y="245" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Error (timeout/5xx)</text>

<!-- outlier detection note, just below loop frame -->
<rect x="380" y="300" width="240" height="30" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
<text x="500" y="313" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">OUTLIER DETECTION</text>
<text x="500" y="324" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3회 연속 실패 → Zone A 제외</text>

<!-- failover rule note -->
<rect x="380" y="344" width="240" height="30" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
<text x="500" y="357" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FAILOVER RULE</text>
<text x="500" y="368" fill="#545B64" font-size="8" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">from us-east-1a → to us-east-1b</text>

<!-- 8. EnvoyA -> PodB (headline / accent, cross-zone) -->
<line x1="380" y1="410" x2="860" y2="410" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="576" y="390" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="676" y="399" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Request (failover, cross-zone)</text>

<!-- 9. PodB -> EnvoyA (return) -->
<line x1="860" y1="444" x2="380" y2="444" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="596" y="424" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="628" y="433" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Response</text>

<!-- 10. EnvoyA -> ClientA (return) -->
<line x1="380" y1="478" x2="140" y2="478" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="226" y="458" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="258" y="467" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Response</text>

<!-- note over PodA: ejected -->
<rect x="580" y="494" width="220" height="16" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
<text x="690" y="506" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Zone A: baseEjectionTime 30s 동안 제외</text>

<!-- ============ ACTIVATION BARS ============ -->
<rect x="136" y="180" width="8" height="298" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="376" y="180" width="8" height="264" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="616" y="222" width="8" height="34" fill="rgba(221,52,76,0.10)" stroke="#DD344C" stroke-width="0.8"/>
<rect x="856" y="410" width="8" height="34" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- ============ ACTOR BOXES (drawn last) ============ -->
<rect x="80" y="120" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="80" y="120" width="120" height="36" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="140" y="142" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client A</text>

<rect x="320" y="120" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="320" y="120" width="120" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="380" y="142" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>

<rect x="560" y="120" width="120" height="44" rx="6" fill="#ffffff"/>
<rect x="560" y="120" width="120" height="44" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="620" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A</text>
<text x="620" y="156" fill="#DD344C" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">zone=a · unhealthy</text>

<rect x="800" y="120" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="800" y="120" width="120" height="36" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="860" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B</text>
<text x="860" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone=b</text>

<!-- ============ LEGEND ============ -->
<line x1="60" y1="536" x2="900" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="60" y="554" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

<line x1="180" y1="548" x2="212" y2="548" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="220" y="552" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Cross-zone failover 요청</text>

<line x1="440" y1="548" x2="472" y2="548" stroke="#DD344C" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="480" y="552" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">오류 응답</text>

</svg>