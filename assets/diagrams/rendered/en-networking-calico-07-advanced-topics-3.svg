<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calico-wg-arch-title calico-wg-arch-desc">
    <title id="calico-wg-arch-title">WireGuard pod-to-pod encryption path</title>
    <desc id="calico-wg-arch-desc">Traffic leaves a pod in plaintext, is encrypted by the node's WireGuard interface, crosses the underlay as an encrypted UDP tunnel between the two nodes, and is decrypted back to plaintext before reaching the destination pod.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
      <marker id="arrow-link-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#0972D3"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- zones -->
    <rect x="16" y="140" width="408" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="24" y="144" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="50" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">NODE 1</text>

    <rect x="536" y="140" width="408" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="544" y="144" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="570" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">NODE 2</text>

    <!-- connectors (drawn before boxes) -->
    <line x1="104" y1="208" x2="176" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="264" y1="208" x2="336" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="424" y1="208" x2="536" y2="208" stroke="#0972D3" stroke-width="1.4" marker-end="url(#arrow-link)" marker-start="url(#arrow-link-start)"/>
    <line x1="624" y1="208" x2="696" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="784" y1="208" x2="856" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- edge labels -->
    <rect x="126" y="188" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="140" y="197" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PLAIN</text>

    <rect x="272" y="188" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="300" y="197" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ENCRYPTED</text>

    <rect x="449" y="188" width="62" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="197" fill="#0972D3" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">UDP 51820</text>
    <rect x="447" y="174" width="66" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="183" fill="#0972D3" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">WG TUNNEL</text>

    <rect x="632" y="188" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="660" y="197" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ENCRYPTED</text>

    <rect x="806" y="188" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="820" y="197" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PLAIN</text>

    <!-- Pod A -->
    <rect x="16" y="180" width="88" height="56" rx="6" fill="#ffffff"/>
    <rect x="16" y="180" width="88" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="60" y="203" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod A</text>
    <text x="60" y="219" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">10.244.0.5</text>

    <!-- WireGuard Interface 1 (focal) -->
    <rect x="176" y="180" width="88" height="56" rx="6" fill="#ffffff"/>
    <rect x="176" y="180" width="88" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="220" y="203" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">WireGuard</text>
    <text x="220" y="219" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">wireguard.cali</text>

    <!-- eth0 Node1 -->
    <rect x="336" y="180" width="88" height="56" rx="6" fill="#ffffff"/>
    <rect x="336" y="180" width="88" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="203" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">eth0</text>
    <text x="380" y="219" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">192.168.1.10</text>

    <!-- eth0 Node2 -->
    <rect x="536" y="180" width="88" height="56" rx="6" fill="#ffffff"/>
    <rect x="536" y="180" width="88" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="580" y="203" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">eth0</text>
    <text x="580" y="219" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">192.168.1.11</text>

    <!-- WireGuard Interface 2 (focal) -->
    <rect x="696" y="180" width="88" height="56" rx="6" fill="#ffffff"/>
    <rect x="696" y="180" width="88" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="740" y="203" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">WireGuard</text>
    <text x="740" y="219" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">wireguard.cali</text>

    <!-- Pod B -->
    <rect x="856" y="180" width="88" height="56" rx="6" fill="#ffffff"/>
    <rect x="856" y="180" width="88" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="900" y="203" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod B</text>
    <text x="900" y="219" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">10.244.1.10</text>
  </svg>