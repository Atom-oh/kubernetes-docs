<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">Strimzi Operator 기반 Kafka 클러스터 조정 흐름</title>
  <desc id="ddesc">운영자가 Kafka/KafkaNodePool 커스텀 리소스를 적용하면 Kubernetes API Server를 거쳐 Strimzi Operator가 이를 조정하여 브로커 파드 2개와 컨트롤러 파드 1개를 생성하고, 각 파드는 EBS gp3 PVC에 데이터를 저장한다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .mono { font-family: 'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="18" class="mono" fill="#7D8998" font-size="8" letter-spacing="0.18em">KAFKA · STRIMZI OPERATOR</text>
  <text x="40" y="34" fill="#232F3E" font-size="16" font-weight="700">EKS Kafka 클러스터 조정 흐름</text>

  <!-- ===================== ARROWS (drawn before boxes) ===================== -->

  <!-- 운영자 -> API Server -->
  <line x1="480" y1="96" x2="480" y2="140" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="356" y="106" width="248" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="115" text-anchor="middle" class="mono" fill="#7D8998" font-size="8" letter-spacing="0.06em">KAFKA / KAFKANODEPOOL CR 적용</text>

  <!-- API Server -> Operator -->
  <line x1="480" y1="196" x2="480" y2="240" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Operator -> Broker Pod 1 (fan attach at x=410, elbow at y=320) -->
  <path d="M410,296 L410,312 Q410,320 402,320 L188,320 Q180,320 180,328 L180,360"
        fill="none" stroke="#EC7211" stroke-width="1" marker-end="url(#arrow-accent)"/>

  <!-- Operator -> Broker Pod 2 (straight, aligned) -->
  <line x1="480" y1="296" x2="480" y2="360" stroke="#EC7211" stroke-width="1" marker-end="url(#arrow-accent)"/>

  <!-- Operator -> Controller Pod (fan attach at x=550, elbow at y=320) -->
  <path d="M550,296 L550,312 Q550,320 558,320 L772,320 Q780,320 780,328 L780,360"
        fill="none" stroke="#EC7211" stroke-width="1" marker-end="url(#arrow-accent)"/>

  <!-- fan label near source, once (identical text on all three) -->
  <rect x="446" y="300" width="68" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="309" text-anchor="middle" class="mono" fill="#7D8998" font-size="8" letter-spacing="0.06em">생성/조정</text>

  <!-- Pod -> PVC, straight verticals -->
  <line x1="180" y1="424" x2="180" y2="480" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="424" x2="480" y2="480" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="780" y1="424" x2="780" y2="480" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===================== NODES ===================== -->

  <!-- 운영자 (input) -->
  <g>
    <rect x="340" y="40" width="280" height="56" rx="6" fill="#ffffff"/>
    <rect x="340" y="40" width="280" height="56" rx="6" fill="rgba(124,132,146,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="348" y="48" width="40" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.6)" stroke-width="0.8"/>
    <text x="368" y="57" text-anchor="middle" class="mono" fill="#7D8998" font-size="7" letter-spacing="0.08em">USER</text>
    <text x="480" y="72" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">운영자</text>
  </g>

  <!-- API Server (backend) -->
  <g>
    <rect x="340" y="140" width="280" height="56" rx="6" fill="#ffffff"/>
    <rect x="340" y="140" width="280" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="348" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="364" y="157" text-anchor="middle" class="mono" fill="rgba(35,47,62,0.8)" font-size="7" letter-spacing="0.08em">API</text>
    <text x="480" y="170" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">Kubernetes API Server</text>
    <text x="480" y="186" text-anchor="middle" class="mono" fill="#545B64" font-size="9">kube-apiserver</text>
  </g>

  <!-- Strimzi Operator (focal) -->
  <g>
    <rect x="340" y="240" width="280" height="56" rx="6" fill="#ffffff"/>
    <rect x="340" y="240" width="280" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="348" y="248" width="60" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.5)" stroke-width="0.8"/>
    <text x="378" y="257" text-anchor="middle" class="mono" fill="#EC7211" font-size="7" letter-spacing="0.08em">OPERATOR</text>
    <text x="480" y="272" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="700">Strimzi Operator</text>
    <text x="480" y="288" text-anchor="middle" class="mono" fill="#545B64" font-size="9">controller-runtime</text>
  </g>

  <!-- Broker Pod 1 -->
  <g>
    <rect x="100" y="360" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="100" y="360" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="108" y="368" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="123" y="377" text-anchor="middle" class="mono" fill="rgba(35,47,62,0.8)" font-size="7" letter-spacing="0.08em">POD</text>
    <text x="180" y="396" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">Broker Pod 1</text>
    <text x="180" y="412" text-anchor="middle" class="mono" fill="#545B64" font-size="9">kafka-broker</text>
  </g>

  <!-- Broker Pod 2 -->
  <g>
    <rect x="400" y="360" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="360" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="408" y="368" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="423" y="377" text-anchor="middle" class="mono" fill="rgba(35,47,62,0.8)" font-size="7" letter-spacing="0.08em">POD</text>
    <text x="480" y="396" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">Broker Pod 2</text>
    <text x="480" y="412" text-anchor="middle" class="mono" fill="#545B64" font-size="9">kafka-broker</text>
  </g>

  <!-- Controller Pod -->
  <g>
    <rect x="700" y="360" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="700" y="360" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="708" y="368" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="723" y="377" text-anchor="middle" class="mono" fill="rgba(35,47,62,0.8)" font-size="7" letter-spacing="0.08em">POD</text>
    <text x="780" y="396" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">Controller Pod</text>
    <text x="780" y="412" text-anchor="middle" class="mono" fill="#545B64" font-size="9">kraft-controller</text>
  </g>

  <!-- PVC 1 -->
  <g>
    <rect x="100" y="480" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="100" y="480" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="108" y="488" width="30" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.5)" stroke-width="0.8"/>
    <text x="123" y="497" text-anchor="middle" class="mono" fill="#545B64" font-size="7" letter-spacing="0.08em">PVC</text>
    <text x="180" y="512" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">EBS gp3 PVC</text>
    <text x="180" y="528" text-anchor="middle" class="mono" fill="#545B64" font-size="9">ebs-csi</text>
  </g>

  <!-- PVC 2 -->
  <g>
    <rect x="400" y="480" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="480" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="408" y="488" width="30" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.5)" stroke-width="0.8"/>
    <text x="423" y="497" text-anchor="middle" class="mono" fill="#545B64" font-size="7" letter-spacing="0.08em">PVC</text>
    <text x="480" y="512" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">EBS gp3 PVC</text>
    <text x="480" y="528" text-anchor="middle" class="mono" fill="#545B64" font-size="9">ebs-csi</text>
  </g>

  <!-- PVC 3 -->
  <g>
    <rect x="700" y="480" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="700" y="480" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="708" y="488" width="30" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.5)" stroke-width="0.8"/>
    <text x="723" y="497" text-anchor="middle" class="mono" fill="#545B64" font-size="7" letter-spacing="0.08em">PVC</text>
    <text x="780" y="512" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">EBS gp3 PVC</text>
    <text x="780" y="528" text-anchor="middle" class="mono" fill="#545B64" font-size="9">ebs-csi</text>
  </g>

  <!-- Legend -->
  <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="568" class="mono" fill="#545B64" font-size="8" letter-spacing="0.14em">LEGEND</text>
  <rect x="140" y="560" width="12" height="12" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="160" y="569" fill="#545B64" font-size="9">조정 허브 (Strimzi Operator)</text>
  <rect x="380" y="560" width="12" height="12" rx="3" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="400" y="569" fill="#545B64" font-size="9">영속 스토리지 (EBS PVC)</text>
</svg>