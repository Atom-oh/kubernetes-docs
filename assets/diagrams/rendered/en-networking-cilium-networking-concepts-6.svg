<title id="en-networking-cilium-networking-concepts-6-title">Source NAT (SNAT)</title>
<desc id="en-networking-cilium-networking-concepts-6-desc">Diagram showing a client on an internal network sending traffic through a NAT router that rewrites the source address, reaching a server on the internet with a public source IP.</desc>
