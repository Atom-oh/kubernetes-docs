<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-service-mesh-cilium-service-mesh-01-architecture-3-title en-service-mesh-cilium-service-mesh-01-architecture-3-desc">
      <title id="en-service-mesh-cilium-service-mesh-01-architecture-3-title">L3/L4 packet processing in the eBPF datapath</title>
      <desc id="en-service-mesh-cilium-service-mesh-01-architecture-3-desc">Sequence diagram showing a packet moving from a source pod through the TC eBPF hook and connection tracker, which either evaluates the service and policy maps for a new connection or reuses a cached decision, before the packet is delivered to the destination pod.</desc>
