<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oncall-arch-title oncall-arch-desc">
    <title id="oncall-arch-title">Grafana OnCall 구성 요소</title>
    <desc id="oncall-arch-desc">여러 알림 소스가 API Server로 들어와 Alert Engine, Routes, Escalation Chains, Schedules, Alert Groups를 거쳐 다양한 알림 채널로 전달되는 Grafana OnCall의 내부 구성을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Grafana OnCall -->
    <rect x="170" y="70" width="680" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="418" y="74" width="184" height="12" rx="2" fill="#ffffff"/>
    <text x="510" y="83" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GRAFANA ONCALL</text>

    <!-- Arrows (behind nodes) -->
    <!-- Alert Sources -> API Server -->
    <line x1="160" y1="138" x2="210" y2="138" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- API Server -> Alert Engine -->
    <line x1="330" y1="138" x2="400" y2="138" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Alert Engine -> Data Store -->
    <line x1="540" y1="138" x2="610" y2="138" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Alert Engine -> Routes (elbow) -->
    <path d="M 470,170 V 230 Q 470,238 462,238 H 278 Q 270,238 270,246 V 306" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Routes -> Escalation Chains -->
    <line x1="330" y1="338" x2="360" y2="338" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Escalation Chains -> Schedules -->
    <line x1="500" y1="338" x2="530" y2="338" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Schedules -> Alert Groups -->
    <line x1="650" y1="338" x2="680" y2="338" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Alert Groups -> Notification Channels -->
    <line x1="750" y1="370" x2="750" y2="470" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: Alert Sources (external) -->
    <rect x="20" y="106" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="20" y="106" width="140" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="90" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">알림 소스</text>
    <text x="90" y="148" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Alertmanager</text>
    <text x="90" y="160" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CloudWatch · Webhook</text>

    <!-- Node: API Server (focal) -->
    <rect x="210" y="106" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="210" y="106" width="120" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="270" y="134" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Server</text>
    <text x="270" y="150" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">요청 수신</text>

    <!-- Node: Alert Engine -->
    <rect x="400" y="106" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="106" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="470" y="134" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alert Engine</text>
    <text x="470" y="150" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">라우팅 · 그룹화</text>

    <!-- Node: Data Store -->
    <rect x="610" y="106" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="610" y="106" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="680" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">데이터 저장소</text>
    <text x="680" y="148" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PostgreSQL · Redis</text>
    <text x="680" y="160" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Celery Workers</text>

    <!-- Node: Routes -->
    <rect x="210" y="306" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="210" y="306" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="270" y="342" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Routes</text>

    <!-- Node: Escalation Chains -->
    <rect x="360" y="306" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="360" y="306" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="430" y="342" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Escalation Chains</text>

    <!-- Node: Schedules -->
    <rect x="530" y="306" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="530" y="306" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="590" y="342" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Schedules</text>

    <!-- Node: Alert Groups -->
    <rect x="680" y="306" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="680" y="306" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="750" y="342" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alert Groups</text>

    <!-- Node: Notification Channels (external) -->
    <rect x="650" y="470" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="650" y="470" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="750" y="496" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">알림 채널</text>
    <text x="750" y="512" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Slack · Teams · Phone</text>
    <text x="750" y="524" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SMS · Email · Mobile</text>

  </svg>