<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="amb10-title amb10-desc">
<title id="amb10-title">Ambient Mode 도입 여부를 결정하는 의사결정 트리</title>
<desc id="amb10-desc">리소스 제약과 필요한 L7 기능의 범위에 따라 ztunnel만 사용하는 Ambient Mode, Waypoint를 추가한 Ambient Mode, 또는 Sidecar Mode 중 무엇을 선택해야 하는지 안내하는 의사결정 트리.</desc>
