<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d6-title d6-desc">
  <title id="d6-title">Gateway API 리소스 계층 구조</title>
  <desc id="d6-desc">GatewayClass가 Gateway를 정의하고, Gateway가 L7 트래픽을 처리하는 HTTPRoute와 L4 트래픽을 처리하는 TCPRoute로 나뉘어 각각 ALB와 NLB를 통해 세 서비스로 라우팅되는 계층 구조를 보여준다.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="d6-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>
  <text x="40" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">ARCHITECTURE</text>
  <text x="40" y="60" fill="#232F3E" font-size="20" font-weight="700">Gateway API 리소스 계층</text>

  <!-- Arrows -->
  <line x1="480" y1="144" x2="480" y2="204" stroke="#545B64" stroke-width="1.2" marker-end="url(#d6-arrow)"/>

  <path d="M 460,268 V 296 Q 460,304 452,304 H 328 Q 320,304 320,312 V 328"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d6-arrow)"/>
  <path d="M 500,268 V 284 Q 500,292 508,292 H 712 Q 720,292 720,300 V 328"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d6-arrow)"/>

  <path d="M 300,392 V 408 Q 300,416 292,416 H 228 Q 220,416 220,424 V 452"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d6-arrow)"/>
  <path d="M 340,392 V 400 Q 340,408 348,408 H 392 Q 400,408 400,416 V 452"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d6-arrow)"/>

  <line x1="720" y1="392" x2="720" y2="452" stroke="#545B64" stroke-width="1.2" marker-end="url(#d6-arrow)"/>

  <!-- GatewayClass -->
  <rect x="380" y="80" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="108" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">GatewayClass</text>
  <text x="480" y="124" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">gateway.k8s.aws/alb</text>

  <!-- Gateway (focal) -->
  <rect x="380" y="204" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="480" y="232" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Gateway</text>
  <text x="480" y="248" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">listeners: http/https</text>

  <!-- HTTPRoute -->
  <rect x="220" y="328" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="320" y="356" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">HTTPRoute</text>
  <text x="320" y="372" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">L7 → ALB</text>

  <!-- TCPRoute -->
  <rect x="620" y="328" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="720" y="356" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">TCPRoute</text>
  <text x="720" y="372" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">L4 → NLB</text>

  <!-- SVC1 -->
  <rect x="140" y="452" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="220" y="480" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service A</text>
  <text x="220" y="496" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">weight: 90</text>

  <!-- SVC2 -->
  <rect x="320" y="452" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="400" y="480" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service B</text>
  <text x="400" y="496" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">weight: 10</text>

  <!-- SVC3 -->
  <rect x="620" y="452" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="720" y="480" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service C</text>
  <text x="720" y="496" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">port: 5432</text>
</svg>