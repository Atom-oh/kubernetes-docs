<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">How label design drives Loki stream cardinality and its downstream costs</title>
  <desc id="ddesc">The number of labels and the number of distinct values each label can take multiply together into the total stream count, which is the single factor that then drives index size, query performance, and memory usage.</desc>

  <rect width="960" height="600" fill="var(--paper)"/>

  <!-- Header -->
  <text x="40" y="32" class="mono" font-size="8" letter-spacing="0.18em" fill="var(--soft)">LABEL DESIGN</text>
  <text x="40" y="56" font-size="20" font-weight="700" fill="var(--ink)">Cardinality Management</text>

  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- Arrows (drawn before boxes) -->
  <!-- A -> B -->
  <path d="M220,164 V252 Q220,260 228,260 H400" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- C -> B -->
  <path d="M740,164 V252 Q740,260 732,260 H560" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- B -> D (attach on bottom-left diamond edge) -->
  <path d="M440,290 V348 Q440,356 432,356 H208 Q200,356 200,364 V420" fill="none" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- B -> E (straight, same x) -->
  <path d="M480,320 V420" fill="none" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- B -> F (attach on bottom-right diamond edge) -->
  <path d="M520,290 V348 Q520,356 528,356 H752 Q760,356 760,364 V420" fill="none" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Nodes -->
  <!-- A: Number of Labels -->
  <rect x="120" y="100" width="200" height="64" rx="6" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
  <text x="220" y="128" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Number of Labels</text>
  <text x="220" y="144" font-size="9" class="mono" fill="var(--muted)" text-anchor="middle">e.g. namespace, app</text>

  <!-- C: Label Value Types -->
  <rect x="640" y="100" width="200" height="64" rx="6" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
  <text x="740" y="128" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Label Value Types</text>
  <text x="740" y="144" font-size="9" class="mono" fill="var(--muted)" text-anchor="middle">cardinality per label</text>

  <!-- B: Total Streams (diamond, FOCAL) -->
  <polygon points="480,200 560,260 480,320 400,260" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="480" y="256" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Total</text>
  <text x="480" y="272" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Streams</text>

  <!-- D: Index Size -->
  <rect x="112" y="420" width="176" height="64" rx="6" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
  <text x="200" y="448" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Index Size</text>
  <text x="200" y="464" font-size="9" class="mono" fill="var(--muted)" text-anchor="middle">per-stream index</text>

  <!-- E: Query Performance -->
  <rect x="392" y="420" width="176" height="64" rx="6" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
  <text x="480" y="448" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Query</text>
  <text x="480" y="464" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Performance</text>

  <!-- F: Memory Usage -->
  <rect x="672" y="420" width="176" height="64" rx="6" fill="#ffffff" stroke="var(--ink)" stroke-width="1"/>
  <text x="760" y="448" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Memory Usage</text>
  <text x="760" y="464" font-size="9" class="mono" fill="var(--muted)" text-anchor="middle">ingester heap</text>

  <!-- Legend -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="552" fill="var(--muted)" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
  <polygon points="160,540 168,548 160,556 152,548" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="182" y="552" fill="var(--muted)" font-size="8" class="mono">CARDINALITY MULTIPLIER — THE FACTOR TO CONTROL</text>
</svg>