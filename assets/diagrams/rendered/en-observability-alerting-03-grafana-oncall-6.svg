<title id="en-observability-alerting-03-grafana-oncall-6-title">Grafana OnCall to IRM Handoff</title>
<desc id="en-observability-alerting-03-grafana-oncall-6-desc">Architecture diagram showing an alert escalating within Grafana OnCall and, on high severity, handing off to Grafana IRM, which carries it through incident creation, investigation, resolution, and post-mortem.</desc>
