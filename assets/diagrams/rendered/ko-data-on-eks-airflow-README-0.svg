    <title id="ko-data-on-eks-airflow-README-0-title">Airflow 컴포넌트와 공유 상태 저장소</title>
    <desc id="ko-data-on-eks-airflow-README-0-desc">dag-processor, scheduler, api-server, triggerer가 모두 PostgreSQL 메타데이터 저장소를 공유 상태로 읽고 쓰며, scheduler가 Executor 종류에 따라 Redis 브로커를 거쳐 Celery worker Pod를 큐잉하거나 KubernetesExecutor Pod를 직접 생성하는 Airflow on EKS 아키텍처.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
