<title id="en-observability-alerting-readme-4-title">EKS alerting areas across control plane, data plane, networking, and storage</title>
<desc id="en-observability-alerting-readme-4-desc">Architecture diagram grouping Amazon EKS alerting targets into four areas: control plane (API server, etcd, scheduler/controller manager), data plane (node, pod, container status), networking (VPC CNI, Service/Ingress, CoreDNS), and storage (EBS/EFS CSI, PV/PVC).</desc>
