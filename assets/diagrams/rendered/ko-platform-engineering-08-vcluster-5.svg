<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vcluster-saas-title vcluster-saas-desc">
<title id="vcluster-saas-title">SaaS 테넌트 vCluster 프로비저닝</title>
<desc id="vcluster-saas-desc">SaaS 플랫폼의 테넌트 관리 API와 vCluster Controller가 등급별로 CPU·메모리 자원이 다른 세 테넌트의 vCluster를 생성·삭제하고, 각 고객은 자신의 vCluster에만 kubectl로 접근하는 구조를 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs><defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: SaaS platform -->
<rect x="240" y="40" width="680" height="480" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="480" y="44" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="580" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">SaaS 플랫폼 (EKS)</text>

<!-- Arrows: customer -> tenant vCluster (fanned entry points on each tenant's left edge) -->
<path d="M164,110 H600" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M164,286 H532 a 8,8 0 0,1 16,0 H552 a 8,8 0 0,1 16,0 H600" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M164,426 H552 a 8,8 0 0,1 16,0 H600" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Arrow: API -> Controller -->
<path d="M352,148 V180" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Arrows: Controller -> tenant vClusters (create/delete, accent = primary control path, fanned exit + offset mid-runs) -->
<path d="M480,194 H512 Q520,194 520,186 V142 Q520,134 528,134 H600" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M480,208 H532 Q540,208 540,216 V310 Q540,318 548,318 H600" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M480,222 H552 Q560,222 560,230 V450 Q560,458 568,458 H600" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- Arrow labels -->
<rect x="364" y="158" width="68" height="12" rx="2" fill="#ffffff"/>
<text x="398" y="167" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">API→CTRL</text>

<rect x="488" y="176" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="520" y="185" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">생성/삭제</text>

<!-- Node: customer A/B/C -->
<rect x="24" y="92" width="140" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="94" y="116" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">고객 A</text>
<text x="94" y="132" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl</text>

<rect x="24" y="272" width="140" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="94" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">고객 B</text>
<text x="94" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl</text>

<rect x="24" y="412" width="140" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="94" y="436" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">고객 C</text>
<text x="94" y="452" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl</text>

<!-- Node: 테넌트 관리 API -->
<rect x="280" y="92" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="352" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">테넌트 관리 API</text>

<!-- Node: vCluster Controller (focal) -->
<rect x="280" y="180" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="380" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vCluster Controller</text>

<!-- Node: 테넌트 DB -->
<rect x="280" y="268" width="144" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="352" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">테넌트 DB</text>

<!-- Node: tenant A vCluster -->
<rect x="600" y="92" width="264" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="732" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">테넌트 A (Enterprise)</text>
<text x="732" y="128" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">K8s v1.31 · CPU 16 · Mem 64Gi</text>

<!-- Node: tenant B vCluster -->
<rect x="600" y="272" width="264" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="732" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">테넌트 B (Standard)</text>
<text x="732" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">K8s v1.31 · CPU 4 · Mem 16Gi</text>

<!-- Node: tenant C vCluster -->
<rect x="600" y="412" width="264" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="732" y="432" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">테넌트 C (Free)</text>
<text x="732" y="448" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">K8s v1.31 · CPU 1 · Mem 4Gi</text>

<!-- Legend -->
<line x1="24" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="24" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

<rect x="24" y="564" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="44" y="572" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">vCluster Controller (focal)</text>

<line x1="260" y1="569" x2="288" y2="569" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<text x="296" y="572" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">고객 접근</text>

<line x1="400" y1="569" x2="428" y2="569" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="436" y="572" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">생성/삭제 제어</text>
</svg>