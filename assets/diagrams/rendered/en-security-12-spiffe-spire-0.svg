<rect x="508" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
<text x="522" y="81" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
<text x="570" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SPIFFE CSI Driver</text>
<text x="570" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mounts SVIDs</text>

