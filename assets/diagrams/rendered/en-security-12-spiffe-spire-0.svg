<text x="390" y="274" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SPIRE Server</text>
<text x="390" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">issues SVIDs</text>

