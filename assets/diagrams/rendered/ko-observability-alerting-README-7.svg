<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 680" role="img" aria-labelledby="solution-title solution-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="solution-title">알림 솔루션 선택 결정 트리</title>
    <desc id="solution-desc">온콜 관리 필요 여부, AWS 네이티브 선호, 예산과 기존 도구에 따라 CloudWatch Alarms, Alertmanager, Grafana OnCall, PagerDuty, OpsGenie 중 하나로 좁혀가는 선택 과정을 보여준다.</desc>
