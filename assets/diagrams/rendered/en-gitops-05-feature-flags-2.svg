<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evalseq-title evalseq-desc">
<title id="evalseq-title">Flag evaluation call sequence</title>
<desc id="evalseq-desc">Sequence diagram showing an application's boolean flag check flowing through the OpenFeature client and hook pipeline to a provider and flag backend, which returns a targeting match that becomes the resolved boolean.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Lifelines -->
<line x1="100" y1="120" x2="100" y2="480" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="290" y1="120" x2="290" y2="480" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="480" y1="120" x2="480" y2="480" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="670" y1="120" x2="670" y2="480" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="860" y1="120" x2="860" y2="480" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Activation bars -->
<rect x="286" y="156" width="8" height="304" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="0.8"/>
<rect x="476" y="196" width="8" height="40" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="476" y="388" width="8" height="40" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="666" y="260" width="8" height="104" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="856" y="292" width="8" height="40" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- Messages -->
<line x1="100" y1="160" x2="286" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="294" y1="200" x2="476" y2="200" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="476" y1="232" x2="294" y2="232" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="294" y1="264" x2="666" y2="264" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="674" y1="296" x2="856" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="856" y1="328" x2="674" y2="328" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="666" y1="360" x2="294" y2="360" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="294" y1="392" x2="476" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="476" y1="424" x2="294" y2="424" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="286" y1="456" x2="100" y2="456" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<!-- Message labels -->
<rect x="140" y="144" width="106" height="12" rx="2" fill="#ffffff"/>
<text x="193" y="154" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GETBOOLEANVALUE</text>

<rect x="336" y="184" width="94" height="12" rx="2" fill="#ffffff"/>
<text x="383" y="194" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BEFORE(CTX)</text>

<rect x="336" y="240" width="94" height="12" rx="2" fill="#ffffff"/>
<text x="383" y="250" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENRICHED CTX</text>

<rect x="426" y="248" width="114" height="12" rx="2" fill="#ffffff"/>
<text x="483" y="258" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESOLVEBOOLEAN</text>

<rect x="710" y="280" width="90" height="12" rx="2" fill="#ffffff"/>
<text x="755" y="290" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESOLVE FLAG</text>

<rect x="700" y="336" width="110" height="12" rx="2" fill="#ffffff"/>
<text x="755" y="346" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TARGETING_MATCH</text>

<rect x="426" y="344" width="114" height="12" rx="2" fill="#ffffff"/>
<text x="483" y="354" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESOLUTIONDETAILS</text>

<rect x="336" y="376" width="94" height="12" rx="2" fill="#ffffff"/>
<text x="383" y="386" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AFTER(DETAILS)</text>

<rect x="336" y="432" width="94" height="12" rx="2" fill="#ffffff"/>
<text x="383" y="442" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">METRICS SENT</text>

<rect x="146" y="440" width="94" height="12" rx="2" fill="#ffffff"/>
<text x="193" y="450" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRUE (ON)</text>

<!-- Actor boxes -->
<rect x="44" y="64" width="112" height="56" rx="6" fill="#ffffff"/>
<rect x="44" y="64" width="112" height="56" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="100" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Application</text>
<text x="100" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">caller</text>

<rect x="222" y="64" width="136" height="56" rx="6" fill="#ffffff"/>
<rect x="222" y="64" width="136" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="290" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">OF Client</text>
<text x="290" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">focal</text>

<rect x="412" y="64" width="136" height="56" rx="6" fill="#ffffff"/>
<rect x="412" y="64" width="136" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Hook Pipeline</text>
<text x="480" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">metrics</text>

<rect x="602" y="64" width="136" height="56" rx="6" fill="#ffffff"/>
<rect x="602" y="64" width="136" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="670" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Provider</text>
<text x="670" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">adapter</text>

<rect x="792" y="64" width="136" height="56" rx="6" fill="#ffffff"/>
<rect x="792" y="64" width="136" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="860" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Flag Backend</text>
<text x="860" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">store</text>

<!-- Legend -->
<line x1="24" y1="500" x2="936" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="24" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<line x1="24" y1="532" x2="52" y2="532" stroke="#545B64" stroke-width="1.2"/>
<text x="60" y="536" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Call</text>
<line x1="140" y1="532" x2="168" y2="532" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="176" y="536" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Return</text>
<line x1="280" y1="532" x2="308" y2="532" stroke="#EC7211" stroke-width="1.4"/>
<text x="316" y="536" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Resolved value</text>
