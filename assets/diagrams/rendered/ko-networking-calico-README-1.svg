<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc">
    <title id="d1-title">Calico 아키텍처 개요</title>
    <desc id="d1-desc">Control Plane의 Kubernetes API·Tigera Operator·kube-controllers가 Calico Datastore에 상태를 기록하고, 각 노드의 Data Plane인 Typha·Felix·BIRD가 이를 받아 라우팅과 정책을 적용하며, BIRD가 BGP로 외부 ToR 스위치·네트워크와 연동한다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="24" y="64" width="288" height="400" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="88" y="68" width="160" height="12" rx="2" fill="#ffffff"/>
    <text x="168" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE</text>

    <rect x="336" y="64" width="288" height="400" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="400" y="68" width="160" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA PLANE · 노드</text>

    <rect x="648" y="64" width="288" height="400" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="732" y="68" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="792" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL</text>

    <!-- Arrows -->
    <!-- API -> KC -->
    <path d="M92,144 V152 Q92,160 100,160 H160 Q168,160 168,168 V176" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- OP -> DS -->
    <path d="M244,144 V196 Q244,204 236,204 H216 Q208,204 208,212 V264" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- KC -> DS (straight, on-axis) -->
    <line x1="168" y1="232" x2="168" y2="264" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- DS -> Typha (cross-zone, focal outbound) -->
    <path d="M248,296 H316 Q324,296 324,288 V124 Q324,116 332,116 H400" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Typha -> Felix (straight) -->
    <line x1="480" y1="144" x2="480" y2="184" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Felix -> BIRD (straight) -->
    <line x1="480" y1="240" x2="480" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- BIRD <-> ToR (bidirectional, BGP) -->
    <line x1="560" y1="312" x2="712" y2="312" stroke="#545B64" stroke-width="1" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
    <!-- ToR -> ExtNet (straight) -->
    <line x1="792" y1="340" x2="792" y2="380" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="606" y="290" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="628" y="299" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">BGP</text>

    <!-- Nodes: Control Plane -->
    <rect x="36" y="88" width="112" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="44" y="94" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="58" y="103" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
    <text x="92" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Server</text>
    <text x="92" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kube-apiserver</text>

    <rect x="188" y="88" width="112" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="196" y="94" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="210" y="103" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OP</text>
    <text x="244" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tigera Operator</text>
    <text x="244" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">install · upgrade</text>

    <rect x="88" y="176" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="96" y="182" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="114" y="191" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
    <text x="168" y="210" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">kube-controllers</text>
    <text x="168" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">K8s ↔ Calico 동기화</text>

    <!-- DS: focal store -->
    <rect x="88" y="264" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="96" y="272" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="110" y="281" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DS</text>
    <text x="168" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Calico Datastore</text>
    <text x="168" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">etcd / Kubernetes API</text>

    <!-- Nodes: Data Plane -->
    <rect x="400" y="88" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="408" y="94" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="424" y="103" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGG</text>
    <text x="480" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Typha</text>
    <text x="480" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">전용 Pod · 3+ 복제</text>

    <rect x="400" y="184" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="408" y="190" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="424" y="199" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POL</text>
    <text x="480" y="218" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Felix</text>
    <text x="480" y="232" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">정책 적용 에이전트</text>

    <rect x="400" y="280" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="408" y="288" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="424" y="297" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BGP</text>
    <text x="480" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">BIRD</text>
    <text x="480" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">confd 로 설정 동기화</text>

    <!-- Nodes: External -->
    <rect x="712" y="284" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="720" y="290" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
