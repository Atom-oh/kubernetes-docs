    <text x="792" y="318" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ToR Switch / Router</text>
    <text x="792" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BGP peer</text>

    <rect x="712" y="380" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="720" y="386" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="736" y="395" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="792" y="414" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">외부 네트워크</text>
    <text x="792" y="428" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">온프레미스 / 클라우드</text>

    <!-- Legend -->
    <line x1="24" y1="500" x2="936" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="24" y="532" width="24" height="12" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="56" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">컴포넌트</text>

    <rect x="164" y="532" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="196" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">데이터스토어 (focal)</text>

    <rect x="352" y="532" width="24" height="12" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="384" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">외부 시스템</text>

    <line x1="512" y1="538" x2="540" y2="538" stroke="#545B64" stroke-width="1" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
