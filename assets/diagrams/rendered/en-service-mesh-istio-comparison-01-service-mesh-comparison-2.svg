<title id="en-service-mesh-istio-comparison-01-service-mesh-comparison-2-title">Istio Control Plane and Data Plane</title>
<desc id="en-service-mesh-istio-comparison-01-service-mesh-comparison-2-desc">Diagram of Istio&#x27;s architecture: Istiod acts as the unified control plane, reading CRD configuration and pushing it via the xDS API to Envoy sidecars, which encrypt traffic between pods with mTLS.</desc>
