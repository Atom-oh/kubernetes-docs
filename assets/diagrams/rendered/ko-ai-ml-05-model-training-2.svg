    <rect x="264" y="140" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="272" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="286" y="157" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTL</text>
    <text x="354" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Slurm 컨트롤 플레인</text>
    <text x="354" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">slurmctld/dbd/restd</text>

    <!-- Node: Access (LoginPod + JupyterHub, merged) -->
    <rect x="264" y="236" width="180" height="56" rx="6" fill="#ffffff"/>
    <rect x="264" y="236" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="272" y="244" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="286" y="253" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACC</text>
    <text x="354" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">로그인 Pod /</text>
    <text x="354" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">JupyterHub</text>

    <!-- Node: Compute (focal) -->
    <rect x="484" y="140" width="180" height="56" rx="6" fill="#ffffff"/>
    <rect x="484" y="140" width="180" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="492" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="506" y="157" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
    <text x="574" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">slurmd Pods ×4</text>
    <text x="574" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">8x A100 GPU</text>

    <!-- Node: Storage (FSx) -->
    <rect x="484" y="236" width="180" height="56" rx="6" fill="#ffffff"/>
    <rect x="484" y="236" width="180" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="492" y="244" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
    <text x="506" y="253" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FSX</text>
    <text x="574" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">FSx for Lustre</text>
    <text x="574" y="284" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared storage</text>

    <!-- Node: Scaling (Karpenter + GPU NodePool, merged) -->
    <rect x="704" y="140" width="180" height="56" rx="6" fill="#ffffff"/>
    <rect x="704" y="140" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="712" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="726" y="157" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASG</text>
    <text x="794" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Karpenter →</text>
    <text x="794" y="188" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">GPU NodePool</text>

    <!-- Legend -->
    <line x1="24" y1="440" x2="936" y2="440" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="460" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="200" cy="456" r="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="212" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">EXTERNAL SERVICE</text>
    <circle cx="400" cy="456" r="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="412" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">CLUSTER COMPONENT</text>
    <circle cx="620" cy="456" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="632" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">GPU COMPUTE (FOCAL)</text>
