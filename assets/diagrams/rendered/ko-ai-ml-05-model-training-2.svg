    <text x="104" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Amazon ECR</text>
    <text x="104" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AWS DLC 이미지</text>

