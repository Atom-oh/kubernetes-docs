<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t4 d4">
<title id="t4">Kagent controller architecture feeding an AI agent runtime</title>
<desc id="d4">A Kagent Controller reconciles an Agent CRD into an Agent Runtime, which the agent's LLM backend, tool set, memory store, and state management components all feed via inference, execution, store/query, and management calls.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<text x="40" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">KAGENT</text>
<text x="40" y="60" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Controller-managed runtime for an AI agent</text>

<!-- zone 1: kagent -->
<rect x="48" y="68" width="280" height="312" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="88" y="72" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="188" y="81" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">KAGENT ARCHITECTURE</text>

<!-- zone 2: agent -->
<rect x="576" y="68" width="272" height="344" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="672" y="72" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="712" y="81" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">AI AGENT</text>

<!-- kagent chain arrows -->
<line x1="180" y1="156" x2="180" y2="204" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="180" y1="260" x2="180" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- agent components -> runtime -->
<path d="M640,128 H408 Q400,128 400,136 V311 Q400,319 392,319 H280"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="406" y="217" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="438" y="226" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">INFERENCE</text>

<path d="M640,208 H428 Q420,208 420,216 V322 Q420,330 412,330 H280"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="426" y="263" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="458" y="272" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">EXECUTION</text>

<path d="M640,288 H448 Q440,288 440,296 V334 Q440,342 432,342 H280"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="446" y="309" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="486" y="318" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">STORE / QUERY</text>

<path d="M640,368 H460 Q456,368 456,364 V357 Q456,353 452,353 H280"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="518" y="346" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="550" y="355" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">MANAGEMENT</text>

<!-- kagent nodes -->
<g>
  <rect x="80" y="100" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="180" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kagent Controller</text>
</g>
<g>
  <rect x="80" y="204" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="180" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Agent CRD</text>
</g>
<g>
  <rect x="80" y="308" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="180" y="340" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Agent Runtime</text>
</g>

<!-- agent nodes -->
<g>
  <rect x="640" y="100" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="728" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">LLM Backend</text>
</g>
<g>
  <rect x="640" y="180" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="728" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tool Set</text>
</g>
<g>
  <rect x="640" y="260" width="176" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="728" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Memory Store</text>
</g>
<g>
  <rect x="640" y="340" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="728" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">State Management</text>
</g>
</svg>