<title id="ko-eks-12-kubernetes-version-roadmap-5-title">EKS EOL 자동 업그레이드 흐름</title>
<desc id="ko-eks-12-kubernetes-version-roadmap-5-desc">Extended Support 종료 시점이 다가오면 AWS EKS가 관리자에게 단계적으로 알림을 보내고, 종료일에 컨트롤 플레인만 자동 업그레이드되며 노드 그룹은 관리자가 수동으로 업그레이드해야 함을 보여준다.</desc>
