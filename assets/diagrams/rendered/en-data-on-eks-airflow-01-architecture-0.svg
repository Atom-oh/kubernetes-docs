<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="af-title af-desc">
      <title id="af-title">Airflow control-plane components on Kubernetes</title>
      <desc id="af-desc">Diagram showing Airflow's API server, scheduler, DAG processor, and triggerer deployments all reading and writing state to a shared PostgreSQL StatefulSet, with the scheduler optionally queuing tasks to Celery workers through Redis, or creating a per-task pod directly under the KubernetesExecutor.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zone: Kubernetes Cluster -->
      <rect x="24" y="24" width="912" height="416" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="44" y="28" width="164" height="12" rx="2" fill="#ffffff"/>
      <text x="126" y="37" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KUBERNETES CLUSTER</text>

      <!-- Zone: Celery (optional) -->
      <rect x="320" y="276" width="560" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <rect x="440" y="280" width="192" height="12" rx="2" fill="#ffffff"/>
      <text x="536" y="289" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CELERYEXECUTOR ONLY</text>

      <!-- ===== Arrows (behind nodes) ===== -->

      <!-- E1 API -> PG : reads/writes state -->
      <path d="M228,120 V164 Q228,170 234,170 H408 Q414,170 414,176 V180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E2 TRG -> PG : reads/writes trigger state -->
      <path d="M732,120 V164 Q732,170 726,170 H552 Q546,170 546,176 V180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E3 SCH -> PG : reads serialized_dag -->
      <path d="M396,120 V126 Q396,132 402,132 H452 Q458,132 458,138 V180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E4 DP -> PG : writes parsed DAGs -->
      <path d="M564,120 V126 Q564,132 558,132 H508 Q502,132 502,138 V180" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E5 SCH -> REDIS : queues task via broker (hops over E3/E4 destination verticals at x=458 and x=502) -->
      <path d="M420,120 V142 Q420,148 428,148 H450 a8,8 0 0,1 16,0 H494 a8,8 0 0,1 16,0 H600 Q608,148 608,156 V248 Q608,256 600,256 H444 Q436,256 436,264 V316" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- E8 SCH -> KPOD : creates pod per task (hops over E1 source vertical at x=228) -->
      <path d="M344,120 V144 Q344,150 338,150 H236 a8,8 0 0,0 -16,0 H186 Q180,150 180,158 V316" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- E6 REDIS -> W1 -->
      <line x1="506" y1="344" x2="530" y2="344" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- E7 REDIS -> W2 -->
      <path d="M436,372 V382 Q436,390 444,390 H756 Q764,390 764,382 V372" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ===== Arrow labels ===== -->
      <rect x="293" y="150" width="56" height="12" rx="2" fill="#ffffff"/>
      <text x="321" y="159" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATE R/W</text>

      <rect x="601" y="150" width="76" height="12" rx="2" fill="#ffffff"/>
      <text x="639" y="159" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRIGGER STATE</text>

      <rect x="392" y="140" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="412" y="149" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ DAG</text>

      <rect x="516" y="140" width="58" height="12" rx="2" fill="#ffffff"/>
      <text x="545" y="149" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE DAGS</text>

      <rect x="486" y="264" width="72" height="12" rx="2" fill="#ffffff"/>
      <text x="522" y="273" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUEUE TASK</text>

      <rect x="271" y="130" width="58" height="12" rx="2" fill="#ffffff"/>
      <text x="300" y="139" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE POD</text>

      <!-- ===== Nodes ===== -->

      <!-- API Server -->
      <rect x="158" y="64" width="140" height="56" rx="6" fill="#ffffff"/>
      <rect x="158" y="64" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="166" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="180" y="81" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="228" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Server</text>
      <text x="228" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Deployment</text>

      <!-- Scheduler -->
      <rect x="326" y="64" width="140" height="56" rx="6" fill="#ffffff"/>
      <rect x="326" y="64" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="334" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="348" y="81" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCH</text>
      <text x="396" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Scheduler</text>
      <text x="396" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Deployment</text>

      <!-- DAG Processor -->
      <rect x="494" y="64" width="140" height="56" rx="6" fill="#ffffff"/>
      <rect x="494" y="64" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="502" y="72" width="26" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="515" y="81" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DP</text>
      <text x="564" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">DAG Processor</text>
      <text x="564" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Deployment</text>

      <!-- Triggerer -->
      <rect x="662" y="64" width="140" height="56" rx="6" fill="#ffffff"/>
      <rect x="662" y="64" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="670" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="684" y="81" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRG</text>
      <text x="732" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Triggerer</text>
      <text x="732" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Deployment</text>

      <!-- PostgreSQL (focal) -->
      <rect x="370" y="180" width="220" height="56" rx="6" fill="#ffffff"/>
      <rect x="370" y="180" width="220" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <rect x="378" y="188" width="26" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.55)" stroke-width="0.8"/>
      <text x="391" y="197" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="480" y="214" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="480" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">StatefulSet · shared state</text>

      <!-- Task Pod (KubernetesExecutor) -->
      <rect x="80" y="316" width="200" height="56" rx="6" fill="#ffffff"/>
      <rect x="80" y="316" width="200" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="88" y="324" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.35)" stroke-width="0.8"/>
      <text x="103" y="333" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
      <text x="180" y="349" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Task Pod</text>
      <text x="180" y="363" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KubernetesExecutor · per task</text>

      <!-- Redis Broker -->
      <rect x="366" y="316" width="140" height="56" rx="6" fill="#ffffff"/>
      <rect x="366" y="316" width="140" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="374" y="324" width="26" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.35)" stroke-width="0.8"/>
      <text x="387" y="333" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MQ</text>
      <text x="436" y="349" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Redis Broker</text>
      <text x="436" y="363" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">task queue</text>

      <!-- Celery Worker 1 -->
      <rect x="530" y="316" width="140" height="56" rx="6" fill="#ffffff"/>
      <rect x="530" y="316" width="140" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="538" y="324" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.35)" stroke-width="0.8"/>
      <text x="553" y="333" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WKR</text>
      <text x="600" y="349" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Celery Worker 1</text>
      <text x="600" y="363" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pod</text>

      <!-- Celery Worker 2 -->
      <rect x="694" y="316" width="140" height="56" rx="6" fill="#ffffff"/>
      <rect x="694" y="316" width="140" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="702" y="324" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.35)" stroke-width="0.8"/>
      <text x="717" y="333" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WKR</text>
      <text x="764" y="349" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Celery Worker 2</text>
      <text x="764" y="363" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pod</text>

      <!-- ===== Legend ===== -->
      <line x1="24" y1="464" x2="936" y2="464" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="24" y="480" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="24" y="496" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="44" y="504" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Always-on control-plane deployment</text>

      <rect x="304" y="496" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="324" y="504" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Shared metadata store</text>

      <rect x="524" y="496" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="544" y="504" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Optional / executor-specific</text>
    </svg>
