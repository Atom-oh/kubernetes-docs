<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="cm-acme-title cm-acme-desc">
    <title id="cm-acme-title">ACME HTTP-01 vs DNS-01 challenge selection</title>
    <desc id="cm-acme-desc">Flowchart showing cert-manager choosing between an HTTP-01 challenge when port 80 is reachable and a DNS-01 challenge for wildcard certificates or blocked ports, with the DNS-01 path also creating a Route 53 TXT record through an IRSA-authenticated pod before both paths verify and complete.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows first -->
    <line x1="480" y1="112" x2="480" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Decision -> HTTP-01 (YES, right) -->
    <path d="M 552,188 H 700 Q 708,188 708,196 V 256"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="588" y="174" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="644" y="183" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PORT 80 OPEN</text>

    <!-- Decision -> DNS-01 (NO, left) -->
    <path d="M 408,188 H 260 Q 252,188 252,196 V 256"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="120" y="174" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="184" y="183" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WILDCARD/BLOCKED</text>

    <!-- HTTP-01 -> HTTP Verify: straight -->
    <line x1="708" y1="304" x2="708" y2="344" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- DNS-01 -> Create TXT: straight -->
    <line x1="252" y1="304" x2="252" y2="344" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Create TXT -> DNS Verify: straight -->
    <line x1="252" y1="392" x2="252" y2="432" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Create TXT -> Route53 IRSA: branch -->
    <path d="M 252,392 V 408 Q 252,416 260,416 H 504 Q 512,416 512,424 V 432"
          fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="356" y="410" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="374" y="419" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">AWS</text>

    <!-- HTTP Verify -> Completed -->
    <path d="M 708,392 V 484 Q 708,492 700,492 H 528 Q 520,492 520,500 V 520"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- DNS Verify -> Completed -->
    <path d="M 252,480 V 500 Q 252,508 260,508 H 432 Q 440,508 440,516 V 520"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Start oval -->
    <rect x="400" y="76" width="160" height="36" rx="18" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Certificate Request</text>

    <!-- Decision diamond -->
    <polygon points="480,140 552,188 480,236 408,188" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="184" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Reachable</text>
    <text x="480" y="197" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">on port 80?</text>

    <!-- HTTP-01 step -->
    <rect x="588" y="256" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="708" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">HTTP-01 Challenge</text>
    <text x="708" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/.well-known/acme-challenge/</text>

    <!-- HTTP Verify step -->
    <rect x="588" y="344" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="708" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Let's Encrypt Verifies</text>
    <text x="708" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP GET request</text>

    <!-- DNS-01 step -->
    <rect x="132" y="256" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="252" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">DNS-01 Challenge</text>
    <text x="252" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">_acme-challenge.domain</text>

    <!-- Create TXT Record step -->
    <rect x="132" y="344" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="252" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Create TXT Record</text>
    <text x="252" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">via DNS-01 solver</text>

    <!-- DNS Verify step -->
    <rect x="152" y="432" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="252" y="452" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Let's Encrypt Verifies</text>
    <text x="252" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DNS query</text>

    <!-- Route53 IRSA node (external, illustrative detail) -->
    <rect x="372" y="432" width="280" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="380" y="440" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="395" y="449" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AWS</text>
    <text x="512" y="452" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Route 53 via IRSA</text>
    <text x="512" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EKS Pod → AssumeRoleWithWebIdentity → API</text>

    <!-- Merge dot -->
    <circle cx="480" cy="520" r="4" fill="#232F3E"/>

    <!-- Completed (focal end) -->
    <rect x="400" y="520" width="160" height="36" rx="18" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="542" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Challenge Completed</text>

    <!-- Legend -->
    <line x1="40" y1="572" x2="920" y2="572" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="588" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <polygon points="640,580 656,586 640,592 624,586" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="666" y="589" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Decision</text>

    <line x1="756" y1="586" x2="784" y2="586" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="792" y="589" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">AWS call</text>
  </svg>