<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cb-seq-title cb-seq-desc">
    <title id="cb-seq-title">Retry combined with Circuit Breaker duplicates a payment</title>
    <desc id="cb-seq-desc">Sequence diagram showing a client's payment request retried twice after timeouts, each retry re-inserting the payment into the database, until the third attempt finally returns 200 OK — leaving three duplicate payment inserts even though the circuit breaker's five-error threshold was never reached.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="100" y1="72" x2="100" y2="440" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="340" y1="72" x2="340" y2="440" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="580" y1="72" x2="580" y2="440" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="820" y1="72" x2="820" y2="440" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars (drawn before the fragment frame so its guard text stays legible) -->
    <rect x="336" y="132" width="8" height="284" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="576" y="212" width="8" height="172" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- Loop fragment frame -->
    <rect x="300" y="152" width="320" height="140" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <rect x="300" y="152" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="320" y="164" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">LOOP</text>
    <rect x="348" y="176" width="264" height="12" rx="2" fill="rgba(35,47,62,0.02)"/>
    <text x="352" y="184" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">[×2 — response lost, retry]</text>

    <!-- Arrows -->
    <!-- msg1: Client -> Proxy -->
    <line x1="100" y1="132" x2="336" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- msg2: Proxy -> Service -->
    <line x1="344" y1="212" x2="576" y2="212" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- msg3: Service -> DB -->
    <line x1="584" y1="244" x2="820" y2="244" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- msg4: Service -> Proxy (dashed return, timeout) -->
    <line x1="576" y1="276" x2="344" y2="276" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- msg5: Proxy -> Service (attempt 3) -->
    <line x1="344" y1="320" x2="576" y2="320" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- msg6: Service -> DB -->
    <line x1="584" y1="352" x2="820" y2="352" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- msg7: Service -> Proxy (headline success, dashed coral) -->
    <line x1="576" y1="384" x2="344" y2="384" stroke="#EC7211" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <!-- msg8: Proxy -> Client (headline success, dashed coral) -->
    <line x1="336" y1="416" x2="100" y2="416" stroke="#EC7211" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels -->
    <rect x="165" y="112" width="110" height="12" rx="2" fill="#ffffff"/>
    <text x="220" y="121" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">POST /PAYMENT</text>

    <rect x="415" y="192" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="460" y="201" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">ATTEMPT</text>

    <rect x="630" y="224" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="700" y="233" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">INSERT PAYMENT</text>

    <rect x="420" y="256" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="460" y="265" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">TIMEOUT</text>

    <rect x="390" y="300" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="460" y="309" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">ATTEMPT 3</text>

    <rect x="630" y="332" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="700" y="341" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">INSERT (DUP)</text>

    <rect x="430" y="364" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="460" y="373" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">200 OK</text>

    <rect x="190" y="396" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="220" y="405" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">200 OK</text>

    <!-- Actor boxes (drawn after arrows) -->
    <rect x="40" y="32" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="100" y="56" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>

    <rect x="280" y="32" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="340" y="52" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio Proxy</text>
    <text x="340" y="65" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">retries=3</text>

    <rect x="520" y="32" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="580" y="56" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Payment Svc</text>

    <rect x="760" y="32" width="120" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="820" y="56" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Database</text>

    <!-- Config note -->
    <rect x="220" y="80" width="320" height="28" rx="4" fill="rgba(35,47,62,0.04)" stroke="rgba(35,47,62,0.18)" stroke-width="1"/>
    <text x="380" y="97" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">RETRY: 3 ATTEMPTS · CIRCUIT BREAKER: 5 CONSEC. ERRORS</text>

    <!-- Editorial insight -->
    <text x="480" y="468" fill="#232F3E" font-size="12" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">3 payment inserts happen before the breaker's 5-error threshold is ever reached —</text>
    <text x="480" y="484" fill="#232F3E" font-size="12" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">isolating failures is not the same as guaranteeing exactly-once delivery.</text>

    <!-- Legend -->
    <line x1="24" y1="508" x2="932" y2="508" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="100" y1="524" x2="128" y2="524" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="136" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">CALL</text>

    <line x1="240" y1="524" x2="268" y2="524" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="276" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">RETURN / TIMEOUT</text>

    <line x1="440" y1="524" x2="468" y2="524" stroke="#EC7211" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <text x="476" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">HEADLINE SUCCESS</text>

    <rect x="660" y="518" width="16" height="12" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="684" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">REPEATED (LOOP)</text>
  </svg>