<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sec-arch-title sec-arch-desc">
  <title id="sec-arch-title">Istio security architecture: control plane, mTLS sidecars, and security layers</title>
  <desc id="sec-arch-desc">Istiod distributes certificates and policy to Envoy sidecars in two pods; the sidecars terminate mutual TLS between plaintext application traffic, and a five-step chain from identity to authorization frames how the mesh enforces zero-trust security.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- ===== Zones (bg) ===== -->
  <rect x="72" y="68" width="176" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="96" y="72" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="126" y="81" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">POD A</text>

  <rect x="712" y="164" width="176" height="184" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="720" y="168" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="750" y="177" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">POD B</text>

  <rect x="56" y="388" width="848" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="404" y="392" width="152" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="401" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">SECURITY LAYERS</text>

  <!-- ===== Arrows (drawn before boxes) ===== -->

  <!-- Control plane -> Envoy1 : certs + policy (dashed) -->
  <path d="M460,76 V142 Q460,150 452,150 H168 Q160,150 160,158 V180"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="254" y="130" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="310" y="139" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CERTS+POLICY</text>

  <!-- Control plane -> Envoy2 : certs + policy (dashed) -->
  <path d="M500,76 V142 Q500,150 508,150 H792 Q800,150 800,158 V180"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="594" y="130" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="650" y="139" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CERTS+POLICY</text>

  <!-- App1 -> Envoy1 : plaintext -->
  <line x1="160" y1="136" x2="160" y2="180" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="170" y="150" width="76" height="12" rx="2" fill="#ffffff"/>
  <text x="208" y="159" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PLAINTEXT</text>

  <!-- Envoy1 <-> Envoy2 : mTLS encrypted (focal, bidirectional) -->
  <line x1="232" y1="216" x2="728" y2="216" stroke="#EC7211" stroke-width="1.4" marker-start="url(#arrow-accent-rev)" marker-end="url(#arrow-accent)"/>
  <rect x="418" y="196" width="124" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="205" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">MTLS ENCRYPTED</text>

  <!-- Envoy2 -> App2 : plaintext -->
  <line x1="800" y1="252" x2="800" y2="284" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="714" y="262" width="76" height="12" rx="2" fill="#ffffff"/>
  <text x="752" y="271" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PLAINTEXT</text>

  <!-- Security layer chain -->
  <line x1="216" y1="448" x2="240" y2="448" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="384" y1="448" x2="408" y2="448" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="552" y1="448" x2="576" y2="448" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="720" y1="448" x2="744" y2="448" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===== Nodes ===== -->

  <!-- Control plane -->
  <rect x="380" y="20" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="380" y="20" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="44" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istiod · Control Plane</text>
  <text x="480" y="60" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CA + Config API</text>

  <!-- App1 -->
  <rect x="88" y="88" width="144" height="48" rx="6" fill="#ffffff"/>
  <rect x="88" y="88" width="144" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="160" y="116" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>

  <!-- Envoy1 (focal) -->
  <rect x="88" y="180" width="144" height="72" rx="6" fill="#ffffff"/>
  <rect x="88" y="180" width="144" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="160" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>
  <text x="160" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">mTLS + policy</text>
  <text x="160" y="236" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">enforcement</text>

  <!-- Envoy2 (focal) -->
  <rect x="728" y="180" width="144" height="72" rx="6" fill="#ffffff"/>
  <rect x="728" y="180" width="144" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="800" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>
  <text x="800" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">mTLS + policy</text>
  <text x="800" y="236" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">enforcement</text>

  <!-- App2 -->
  <rect x="728" y="284" width="144" height="48" rx="6" fill="#ffffff"/>
  <rect x="728" y="284" width="144" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="800" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>

  <!-- Security layer chain (5 boxes) -->
  <rect x="72" y="420" width="144" height="56" rx="6" fill="#ffffff"/>
  <rect x="72" y="420" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="144" y="444" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">1 · Identity</text>
  <text x="144" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">SPIFFE ID</text>

  <rect x="240" y="420" width="144" height="56" rx="6" fill="#ffffff"/>
  <rect x="240" y="420" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="312" y="444" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">2 · Certificates</text>
  <text x="312" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">auto issue/renew</text>

  <rect x="408" y="420" width="144" height="56" rx="6" fill="#ffffff"/>
  <rect x="408" y="420" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="444" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">3 · Peer Auth</text>
  <text x="480" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">service mTLS</text>

  <rect x="576" y="420" width="144" height="56" rx="6" fill="#ffffff"/>
  <rect x="576" y="420" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="648" y="444" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">4 · Request Auth</text>
  <text x="648" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">end-user JWT</text>

  <rect x="744" y="420" width="144" height="56" rx="6" fill="#ffffff"/>
  <rect x="744" y="420" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="816" y="444" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">5 · Authorization</text>
  <text x="816" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">access control</text>

  <!-- ===== Legend ===== -->
  <line x1="56" y1="512" x2="904" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <line x1="72" y1="532" x2="100" y2="532" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="108" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">PLAINTEXT / SEQUENCE</text>

  <line x1="308" y1="532" x2="336" y2="532" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="344" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">CERT / POLICY PUSH</text>

  <line x1="600" y1="532" x2="628" y2="532" stroke="#EC7211" stroke-width="1.4" marker-start="url(#arrow-accent-rev)" marker-end="url(#arrow-accent)"/>
  <text x="636" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">MTLS ENCRYPTED (FOCAL)</text>
</svg>
