<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cp-chain-title cp-chain-desc">
<title id="cp-chain-title">Platform-to-provisioning handoff chain</title>
<desc id="cp-chain-desc">The platform team defines an XRD and writes a Composition once; a developer then creates a Claim that Crossplane turns into a Composite Resource, mapped by the Composition into managed resources that a provider provisions in AWS.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- Arrows (straight, single row, before nodes) -->
<line x1="150" y1="292" x2="170" y2="292" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="300" y1="292" x2="320" y2="292" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="450" y1="292" x2="470" y2="292" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<line x1="600" y1="292" x2="620" y2="292" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="750" y1="292" x2="770" y2="292" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Nodes: 6 steps, width 130 height 64, y=260 -->
<!-- 1 Platform Team: Defines XRD -->
<rect x="20" y="260" width="130" height="64" rx="6" fill="#ffffff"/>
<rect x="20" y="260" width="130" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="85" y="240" text-anchor="middle" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.1em">PLATFORM TEAM</text>
<text x="85" y="286" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Defines</text>
<text x="85" y="302" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">XRD</text>

<!-- 2 Platform Team: Writes Composition -->
<rect x="170" y="260" width="130" height="64" rx="6" fill="#ffffff"/>
<rect x="170" y="260" width="130" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="235" y="240" text-anchor="middle" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.1em">PLATFORM TEAM</text>
<text x="235" y="286" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Writes</text>
<text x="235" y="302" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Composition</text>

<!-- 3 Developer: Creates Claim -->
<rect x="320" y="260" width="130" height="64" rx="6" fill="rgba(35,47,62,0.10)"/>
<rect x="320" y="260" width="130" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="385" y="240" text-anchor="middle" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.1em">DEVELOPER</text>
<text x="385" y="286" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Creates</text>
<text x="385" y="302" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Claim</text>

<!-- 4 Crossplane: Creates XR (focal) -->
<rect x="470" y="260" width="130" height="64" rx="6" fill="rgba(255,153,0,0.10)"/>
<rect x="470" y="260" width="130" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="535" y="240" text-anchor="middle" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.1em">CROSSPLANE</text>
<text x="535" y="286" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Creates</text>
<text x="535" y="302" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Composite (XR)</text>

<!-- 5 Composition: Maps to MRs -->
<rect x="620" y="260" width="130" height="64" rx="6" fill="#ffffff"/>
<rect x="620" y="260" width="130" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="685" y="240" text-anchor="middle" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.1em">COMPOSITION</text>
<text x="685" y="286" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Maps to</text>
<text x="685" y="302" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Managed Resources</text>

<!-- 6 Provider: Provisions AWS -->
<rect x="770" y="260" width="130" height="64" rx="6" fill="rgba(35,47,62,0.03)"/>
<rect x="770" y="260" width="130" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="835" y="240" text-anchor="middle" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.1em">PROVIDER</text>
<text x="835" y="286" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Provisions</text>
<text x="835" y="302" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">AWS</text>

<!-- Legend -->
<line x1="30" y1="440" x2="930" y2="440" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="30" y="456" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<circle cx="190" cy="453" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="202" y="456" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal — the moment self-service kicks in</text>
</svg>