<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
    <title id="d0-title">Istio mTLS identity provisioning between two pods</title>
    <desc id="d0-desc">Each pod's Envoy sidecar receives an X.509 certificate from istiod, then encrypts pod-to-pod traffic with mTLS while application traffic to and from each sidecar stays local plaintext.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#7D8998"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones (drawn before arrows/nodes) -->
    <rect x="40" y="160" width="400" height="152" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="164" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="92" y="173" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">POD A</text>

    <rect x="520" y="160" width="400" height="152" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="532" y="164" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="572" y="173" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">POD B</text>

    <!-- Arrows (behind nodes) -->
    <!-- Istiod -> Envoy1 cert (dashed) -->
    <path d="M448,104 V140 Q448,148 440,148 H352 Q344,148 344,156 V196" fill="none" stroke="rgba(35,47,62,0.30)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
    <rect x="316" y="132" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="348" y="141" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CERT</text>

    <!-- Istiod -> Envoy2 cert (dashed) -->
    <path d="M512,104 V140 Q512,148 520,148 H608 Q616,148 616,156 V196" fill="none" stroke="rgba(35,47,62,0.30)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
    <rect x="580" y="132" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="612" y="141" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CERT</text>

    <!-- App1 -> Envoy1 plaintext (horizontal, same y) -->
    <line x1="228" y1="240" x2="260" y2="240" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Envoy1 <-> Envoy2 mTLS (bidirectional, accent) -->
    <line x1="428" y1="240" x2="532" y2="240" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <rect x="440" y="220" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="229" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MTLS ENCRYPTED</text>

    <!-- Envoy2 -> App2 plaintext (horizontal, same y) -->
    <line x1="700" y1="240" x2="732" y2="240" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Nodes -->
    <!-- Istiod (focal) -->
    <rect x="380" y="40" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="40" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="388" y="48" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.40)" stroke-width="0.8"/>
    <text x="406" y="57" fill="rgba(236,114,17,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CA</text>
    <text x="480" y="78" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">istiod</text>
    <text x="480" y="94" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">certificate issuance</text>

    <!-- App1 -->
    <rect x="64" y="200" width="160" height="80" rx="6" fill="#ffffff"/>
    <rect x="64" y="200" width="160" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="144" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    <text x="144" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod a</text>

    <!-- Envoy1 -->
    <rect x="264" y="200" width="160" height="80" rx="6" fill="#ffffff"/>
    <rect x="264" y="200" width="160" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="344" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>
    <text x="344" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sidecar</text>

    <!-- Envoy2 -->
    <rect x="536" y="200" width="160" height="80" rx="6" fill="#ffffff"/>
    <rect x="536" y="200" width="160" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="616" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>
    <text x="616" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sidecar</text>

    <!-- App2 -->
    <rect x="736" y="200" width="160" height="80" rx="6" fill="#ffffff"/>
    <rect x="736" y="200" width="160" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="816" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    <text x="816" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod b</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="140" y1="512" x2="172" y2="512" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="180" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Plaintext (in-pod)</text>

    <line x1="380" y1="512" x2="412" y2="512" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <text x="420" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">mTLS (Envoy-to-Envoy)</text>

    <line x1="660" y1="512" x2="692" y2="512" stroke="rgba(35,47,62,0.30)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
    <text x="700" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Certificate delivery</text>
  </svg>