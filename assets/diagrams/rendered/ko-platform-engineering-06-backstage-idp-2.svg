<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="d2-title d2-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="d2-title">TechDocs 빌드 파이프라인</title>
    <desc id="d2-desc">개발자가 작성한 Markdown이 Git Repository에 저장되고 CI에서 MkDocs로 빌드되어 S3 Bucket에 업로드된 뒤 Backstage TechDocs UI에서 렌더링되며, 개발자는 그 UI에서 문서를 열람한다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- arrows: main pipeline (drawn before nodes) -->
    <path d="M180,312 H220" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M360,312 H400" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M540,312 H580" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M720,312 H760" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- arrow: dev reads docs (secondary, routed below) -->
    <path d="M110,344 V432 Q110,440 118,440 H822 Q830,440 830,432 V344" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- arrow labels -->
    <rect x="182" y="292" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="301" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>
    <rect x="362" y="292" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="380" y="301" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">BUILD</text>
    <rect x="542" y="292" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="560" y="301" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PUT</text>
    <rect x="722" y="292" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="740" y="301" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">RENDER</text>
    <rect x="452" y="450" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="470" y="459" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

    <!-- nodes -->
    <rect x="40" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="280" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="0.8"/>
    <text x="110" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">개발자</text>
    <text x="110" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">author</text>

    <rect x="220" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="220" y="280" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="290" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Git Repository</text>
    <text x="290" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">source</text>

    <rect x="400" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="280" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="470" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">MkDocs Build</text>
    <text x="470" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">ci job</text>

    <rect x="580" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="580" y="280" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="650" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">S3 Bucket</text>
    <text x="650" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">static assets</text>

    <rect x="760" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="760" y="280" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="830" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Backstage</text>
    <text x="830" y="318" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">TechDocs UI</text>

    <!-- legend -->
    <line x1="24" y1="500" x2="936" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <circle cx="30" cy="520" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="40" y="524" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">FOCAL: TECHDOCS UI</text>
    <line x1="260" y1="520" x2="288" y2="520" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="296" y="524" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">READ PATH</text>
  </svg>