<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t0 d0">
<title id="t0">Cilium 서비스 메시 P99 지연 시간 비교</title>
<desc id="d0">Native, Cilium Service Mesh, Istio 세 환경의 P99 지연 시간을 비교하는 막대 그래프. Native는 0.1ms, Cilium 서비스 메시는 0.3ms로 거의 근접하지만, Istio는 2.5ms로 크게 높다.</desc>
<defs>
  <style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");
    text { font-family: 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="48" y="48" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7D8998">PERFORMANCE BENCHMARK · P99 LATENCY</text>
<text x="48" y="80" font-size="24" font-weight="700" fill="#232F3E">지연 시간 비교 (P99)</text>
<text x="48" y="104" font-size="13" fill="#545B64">동일 워크로드에서 데이터 플레인별 요청 처리 지연 시간(P99) 비교</text>

<!-- Y axis unit -->
<text x="80" y="128" class="mono" font-size="8" font-weight="500" letter-spacing="0.1em" fill="#7D8998">P99 지연시간 (ms)</text>

<!-- Gridlines + y labels: 0 / 1 / 2 / 3 ms across y=460..140 -->
<line x1="80" y1="460" x2="920" y2="460" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>
<line x1="80" y1="353" x2="920" y2="353" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="80" y1="247" x2="920" y2="247" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="80" y1="140" x2="920" y2="140" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<text x="72" y="463" text-anchor="end" class="mono" font-size="8" fill="#545B64">0ms</text>
<text x="72" y="356" text-anchor="end" class="mono" font-size="8" fill="#545B64">1ms</text>
<text x="72" y="250" text-anchor="end" class="mono" font-size="8" fill="#545B64">2ms</text>
<text x="72" y="143" text-anchor="end" class="mono" font-size="8" fill="#545B64">3ms</text>
<line x1="80" y1="140" x2="80" y2="460" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>

<!-- Bar 1: Native -->
<rect x="150" y="448" width="140" height="12" fill="#ffffff"/>
<rect x="150" y="448" width="140" height="12" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
<rect x="185" y="424" width="70" height="16" fill="#ffffff"/>
<text x="220" y="436" text-anchor="middle" class="mono" font-size="8" fill="#545B64">0.1ms</text>
<text x="220" y="480" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Native</text>

<!-- Bar 2: Cilium SM (focal) -->
<rect x="430" y="428" width="140" height="32" fill="#ffffff"/>
<rect x="430" y="428" width="140" height="32" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<rect x="465" y="404" width="70" height="16" fill="#ffffff"/>
<text x="500" y="416" text-anchor="middle" class="mono" font-size="8" font-weight="600" fill="#EC7211">0.3ms</text>
<text x="500" y="480" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Cilium SM</text>

<!-- Bar 3: Istio -->
<rect x="710" y="192" width="140" height="268" fill="#ffffff"/>
<rect x="710" y="192" width="140" height="268" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
<rect x="745" y="168" width="70" height="16" fill="#ffffff"/>
<text x="780" y="180" text-anchor="middle" class="mono" font-size="8" fill="#545B64">2.5ms</text>
<text x="780" y="480" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Istio</text>

<!-- Editorial callout -->
<text x="48" y="536" font-size="14" font-style="italic" fill="#545B64">Cilium 서비스 메시는 eBPF 데이터 플레인 덕분에 Native 성능에 가장 근접한다.</text>

</svg>