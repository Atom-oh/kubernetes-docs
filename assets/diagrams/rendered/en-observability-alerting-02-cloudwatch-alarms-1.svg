<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cwa1-title cwa1-desc">
    <title id="cwa1-title">CloudWatch Alarm States</title>
    <desc id="cwa1-desc">A CloudWatch alarm starts OK, moves to ALARM when its threshold is exceeded and back to OK once the metric returns to normal, and falls into INSUFFICIENT_DATA from either state when metric data stops arriving until data resumes.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="cwa1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="cwa1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ ARROWS ============ -->
    <g fill="none" stroke-width="1.2">
      <!-- start -> OK -->
      <circle cx="88" cy="176" r="6" fill="#232F3E"/>
      <path d="M 94,176 H 172" stroke="#545B64" marker-end="url(#cwa1-arrow)"/>

      <!-- OK -> ALARM (top run, y=104) -->
      <path d="M 272,152 V 116 Q 272,104 280,104 H 616 Q 624,104 624,112 V 152" stroke="#EC7211" marker-end="url(#cwa1-arrow-accent)"/>
      <!-- ALARM -> OK (return run, y=232) -->
      <path d="M 616,200 Q 624,200 624,208 V 224 Q 624,232 616,232 H 280 Q 272,232 272,224 V 200" stroke="#545B64" marker-end="url(#cwa1-arrow)"/>

      <!-- OK -> INSUFFICIENT_DATA -->
      <path d="M 296,200 V 328 Q 296,336 304,336 H 388" stroke="#545B64" marker-end="url(#cwa1-arrow)"/>
      <!-- ALARM -> INSUFFICIENT_DATA -->
      <path d="M 600,200 V 328 Q 600,336 592,336 H 508" stroke="#545B64" marker-end="url(#cwa1-arrow)"/>
      <!-- INSUFFICIENT_DATA -> OK -->
      <path d="M 372,388 H 340 Q 332,388 332,396 V 476 Q 332,484 324,484 H 260 Q 252,484 252,476 V 200" stroke="#545B64" marker-end="url(#cwa1-arrow)"/>
      <!-- INSUFFICIENT_DATA -> ALARM -->
      <path d="M 524,388 H 556 Q 564,388 564,396 V 500 Q 564,508 572,508 H 640 Q 648,508 648,500 V 200" stroke="#545B64" marker-end="url(#cwa1-arrow)"/>
    </g>

    <!-- ============ ARROW LABELS ============ -->
    <g font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.04em" text-anchor="middle">
      <rect x="96" y="158" width="72" height="12" rx="2" fill="#ffffff"/>
      <text x="132" y="167" fill="#7D8998" font-size="7">WITHIN THRESHOLD</text>

      <rect x="404" y="84" width="88" height="12" rx="2" fill="#ffffff"/>
      <text x="448" y="93" fill="#EC7211">THRESHOLD EXCEEDED</text>

      <rect x="400" y="240" width="96" height="12" rx="2" fill="#ffffff"/>
      <text x="448" y="249" fill="#7D8998">RETURNS TO NORMAL</text>

      <rect x="270" y="252" width="56" height="12" rx="2" fill="#ffffff"/>
      <text x="298" y="261" fill="#7D8998">NO DATA</text>

      <rect x="572" y="252" width="56" height="12" rx="2" fill="#ffffff"/>
      <text x="600" y="261" fill="#7D8998">NO DATA</text>

      <rect x="176" y="440" width="88" height="12" rx="2" fill="#ffffff"/>
      <text x="220" y="449" fill="#7D8998">DATA RECEIVED</text>

      <rect x="600" y="452" width="106" height="12" rx="2" fill="#ffffff"/>
      <text x="653" y="461" fill="#7D8998" font-size="7">DATA + THRESHOLD</text>
    </g>

    <!-- ============ NODES ============ -->
    <!-- OK -->
    <g>
      <rect x="172" y="152" width="124" height="48" rx="8" fill="#ffffff"/>
      <rect x="172" y="152" width="124" height="48" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="234" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OK</text>
    </g>

    <!-- ALARM (focal) -->
    <g>
      <rect x="600" y="152" width="124" height="48" rx="8" fill="#ffffff"/>
      <rect x="600" y="152" width="124" height="48" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="662" y="180" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ALARM</text>
    </g>

    <!-- INSUFFICIENT_DATA -->
    <g>
      <rect x="372" y="340" width="152" height="48" rx="8" fill="#ffffff"/>
      <rect x="372" y="340" width="152" height="48" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="448" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">INSUFFICIENT_DATA</text>
    </g>
  </svg>