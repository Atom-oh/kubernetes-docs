<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-service-mesh-istio-resilience-readme-0-title en-service-mesh-istio-resilience-readme-0-desc"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <title id="en-service-mesh-istio-resilience-readme-0-title">Core Istio Resilience Patterns</title>
    <desc id="en-service-mesh-istio-resilience-readme-0-desc">A client request flows through Outlier Detection, Rate Limiting, and Zone Aware Routing, which route traffic to healthy pods while an unhealthy pod is excluded.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="40" y="112" width="880" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="116" width="220" height="12" rx="2" fill="#ffffff"/>
    <text x="162" y="125" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ISTIO RESILIENCE PATTERNS</text>

    <rect x="40" y="336" width="280" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="340" width="148" height="12" rx="2" fill="#ffffff"/>
    <text x="126" y="349" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">UNHEALTHY INSTANCES</text>

    <rect x="360" y="336" width="520" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="372" y="340" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="436" y="349" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HEALTHY INSTANCES</text>

    <!-- Arrows (drawn before boxes) -->
    <!-- Request -> Outlier (straight, same x) -->
    <line x1="200" y1="88" x2="200" y2="144" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Outlier -> RateLimit (straight horizontal) -->
    <line x1="320" y1="172" x2="360" y2="172" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- RateLimit -> ZoneAware (straight horizontal) -->
    <line x1="600" y1="172" x2="640" y2="172" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Outlier -> Pod3 (dashed, Excluded) attach at x=240 on Outlier bottom edge -->
    <path d="M240,200 V276 Q240,284 232,284 H188 Q180,284 180,292 V368"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="176" y="264" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="208" y="273" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXCLUDED</text>

    <!-- ZoneAware -> Pod1 (Preferred) attach x=720 -->
    <path d="M720,200 V276 Q720,284 712,284 H508 Q500,284 500,292 V368"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="574" y="264" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="610" y="273" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PREFERRED</text>

    <!-- ZoneAware -> Pod2 (Failover) attach x=800 -->
    <path d="M800,200 V276 Q800,284 792,284 H748 Q740,284 740,292 V368"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="738" y="264" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="770" y="273" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILOVER</text>

    <!-- Nodes -->
    <!-- Request (input type) -->
    <rect x="120" y="40" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="120" y="40" width="160" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="200" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client Request</text>

    <!-- Outlier Detection (FOCAL) -->
    <rect x="80" y="144" width="240" height="56" rx="6" fill="#ffffff"/>
    <rect x="80" y="144" width="240" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="200" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Outlier Detection</text>
    <text x="200" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exclude unhealthy instances</text>

    <!-- Rate Limiting -->
    <rect x="360" y="144" width="240" height="56" rx="6" fill="#ffffff"/>
    <rect x="360" y="144" width="240" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rate Limiting</text>
    <text x="480" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">request rate control</text>

    <!-- Zone Aware Routing -->
    <rect x="640" y="144" width="240" height="56" rx="6" fill="#ffffff"/>
    <rect x="640" y="144" width="240" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="760" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Zone Aware Routing</text>
    <text x="760" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">locality-preferred routing</text>

    <!-- Pod 3 (excluded / unhealthy) -->
    <rect x="80" y="368" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="80" y="368" width="200" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="180" y="392" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 3</text>
    <text x="180" y="408" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone a · error occurring</text>

    <!-- Pod 1 -->
    <rect x="400" y="368" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="368" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="500" y="392" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 1</text>
    <text x="500" y="408" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone a</text>

    <!-- Pod 2 -->
    <rect x="640" y="368" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="640" y="368" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="740" y="392" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 2</text>
    <text x="740" y="408" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zone b</text>

    <!-- Legend -->
    <line x1="40" y1="468" x2="920" y2="468" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="488" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="140" y="480" width="20" height="12" rx="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="168" y="489" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Primary defense layer</text>

    <line x1="340" y1="486" x2="372" y2="486" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="380" y="489" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Active traffic</text>

    <line x1="540" y1="486" x2="572" y2="486" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="580" y="489" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Excluded / passive</text>

    <rect x="760" y="480" width="20" height="12" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="788" y="489" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Unhealthy instance</text>
  </svg>