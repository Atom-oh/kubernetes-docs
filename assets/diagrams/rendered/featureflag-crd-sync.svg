<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="featureflag-crd-sync-title featureflag-crd-sync-desc">
<title id="featureflag-crd-sync-title">FeatureFlag CR 변경 전파 시퀀스</title>
<desc id="featureflag-crd-sync-desc">사용자나 GitOps가 생성한 FeatureFlag CR 변경이 Kubernetes API와 OpenFeature Operator를 거쳐 ConfigMap에 반영되고, flagd가 이를 감지해 무중단으로 재로드하는 과정을 보여주는 시퀀스 다이어그램.</desc>
