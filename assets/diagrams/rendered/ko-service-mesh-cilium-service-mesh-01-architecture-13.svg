<title id="ko-service-mesh-cilium-service-mesh-01-architecture-13-title">요청 왕복 지연 시간 구성 비교</title>
<desc id="ko-service-mesh-cilium-service-mesh-01-architecture-13-desc">Istio 사이드카는 프록시 처리 단계에서 대부분의 지연이 발생해 총 1.5ms에 이르지만, Cilium은 네트워크 전송 비용은 동일하면서 프록시 처리 구간이 훨씬 짧아 총 0.24ms에 그친다.</desc>
