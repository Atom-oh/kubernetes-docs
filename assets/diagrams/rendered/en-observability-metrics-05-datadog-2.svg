<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="dd-cost-title dd-cost-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="dd-cost-title">Datadog cost optimization strategy tree</title>
    <desc id="dd-cost-desc">A tree showing Datadog cost optimization branching into metric, log, and APM optimization, each listing its own set of concrete tuning strategies.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ===== Connectors (drawn before nodes) ===== -->
    <line x1="480" y1="208" x2="480" y2="224" stroke="#545B64" stroke-width="1.2"/>
    <path d="M 480,224 H 180 Q 172,224 172,232 V 236" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="224" x2="480" y2="236" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 480,224 H 780 Q 788,224 788,232 V 236" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Root (focal) ===== -->
    <rect x="380" y="160" width="200" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="188" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Datadog Cost</text>
    <text x="480" y="202" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Optimization</text>

    <!-- ===== Child: Metric Optimization ===== -->
    <rect x="40" y="240" width="264" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.16)" stroke-width="1"/>
    <text x="64" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Metric Optimization</text>
    <g font-family="'Geist Mono', monospace" font-size="9" fill="#545B64">
      <rect x="64" y="299" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="80" y="304">Limit custom metrics</text>
      <rect x="64" y="327" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="80" y="332">Manage tag cardinality</text>
      <rect x="64" y="355" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="80" y="360">Adjust collection interval</text>
    </g>

    <!-- ===== Child: Log Optimization ===== -->
    <rect x="348" y="240" width="264" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.16)" stroke-width="1"/>
    <text x="372" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Log Optimization</text>
    <g font-family="'Geist Mono', monospace" font-size="9" fill="#545B64">
      <rect x="372" y="299" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="388" y="304">Log filtering</text>
      <rect x="372" y="327" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="388" y="332">Sampling</text>
      <rect x="372" y="355" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="388" y="360">Index exclusion filters</text>
    </g>

    <!-- ===== Child: APM Optimization ===== -->
    <rect x="656" y="240" width="264" height="220" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.16)" stroke-width="1"/>
    <text x="680" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">APM Optimization</text>
    <g font-family="'Geist Mono', monospace" font-size="9" fill="#545B64">
      <rect x="680" y="299" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="696" y="304">Adjust sampling rate</text>
      <rect x="680" y="327" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="696" y="332">Select services</text>
      <rect x="680" y="355" width="6" height="6" rx="1" fill="#7D8998"/>
      <text x="696" y="360">Optimize instrumentation scope</text>
    </g>
  </svg>