<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="hybrid-title hybrid-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="hybrid-title">여러 솔루션을 조합한 하이브리드 알림 아키텍처</title>
    <desc id="hybrid-desc">Prometheus와 CloudWatch의 알림이 Alertmanager로 모여 Grafana OnCall과 PagerDuty로 나뉘고, 다시 Slack, Email, SMS 채널로 전달되는 프로덕션 알림 구성을 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="20" y="168" width="160" height="244" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="36" y="172" width="64" height="14" rx="2" fill="#ffffff"/>
    <text x="68" y="182" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">알림 소스</text>

    <rect x="200" y="234" width="240" height="112" rx="8" fill="rgba(255,153,0,0.03)" stroke="rgba(236,114,17,0.16)" stroke-width="0.8"/>
    <rect x="216" y="238" width="52" height="14" rx="2" fill="#ffffff"/>
    <text x="242" y="248" fill="rgba(236,114,17,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">라우팅</text>

    <rect x="500" y="148" width="200" height="292" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="516" y="152" width="76" height="14" rx="2" fill="#ffffff"/>
    <text x="554" y="162" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">온콜 관리</text>

    <rect x="740" y="128" width="200" height="384" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="756" y="132" width="64" height="14" rx="2" fill="#ffffff"/>
    <text x="788" y="142" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">알림 채널</text>

    <!-- Arrows: sources -> AM -->
    <path d="M 160,228 H 192 Q 200,228 200,236 V 280 Q 200,288 208,288 H 240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 160,368 H 192 Q 200,368 200,360 V 316 Q 200,308 208,308 H 240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: AM -> OnCall -->
    <path d="M 400,287 H 452 Q 460,287 460,279 V 220 Q 460,212 468,212 H 520" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 400,309 H 452 Q 460,309 460,317 V 384 Q 460,392 468,392 H 520" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Arrows: GO -> S, SMS -->
    <path d="M 680,201 H 712 Q 720,201 720,193 V 187 Q 720,179 728,179 H 760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 680,223 H 712 Q 720,223 720,231 V 451 Q 720,459 728,459 H 760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: PD -> S, E, SMS -->
    <path d="M 680,376 H 712 Q 720,376 720,368 V 205 Q 720,197 728,197 H 760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 680,392 H 712 Q 720,392 720,384 V 326 Q 720,318 728,318 H 760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 680,408 H 712 Q 720,408 720,416 V 469 Q 720,477 728,477 H 760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: Prometheus -->
    <rect x="40" y="200" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="100" y="232" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>

    <!-- Node: CloudWatch -->
    <rect x="40" y="340" width="120" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="100" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch</text>

    <!-- Node: Alertmanager (focal) -->
    <rect x="240" y="266" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="320" y="298" fill="#EC7211" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alertmanager</text>
    <text x="320" y="314" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1차 라우팅 허브</text>

    <!-- Node: Grafana OnCall -->
    <rect x="520" y="180" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="600" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana OnCall</text>

    <!-- Node: PagerDuty -->
    <rect x="520" y="360" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="600" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PagerDuty</text>

    <!-- Node: Slack -->
    <rect x="760" y="160" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="840" y="192" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Slack</text>

    <!-- Node: Email -->
    <rect x="760" y="290" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="840" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Email</text>

    <!-- Node: SMS -->
    <rect x="760" y="440" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="840" y="472" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SMS</text>

    <!-- Legend -->
    <line x1="20" y1="540" x2="940" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="20" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="220" cy="552" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="232" y="556" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">모든 소스가 모이는 1차 라우팅 허브 (초점)</text>
  </svg>