<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="mcpki-title mcpki-desc">
    <title id="mcpki-title">Shared trust anchor PKI for multi-cluster mTLS</title>
    <desc id="mcpki-desc">Architecture diagram showing a single shared root Trust Anchor issuing a per-cluster intermediate issuer certificate to each cluster, which in turn issues workload certificates to that cluster's meshed pods.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (drawn before arrows and nodes) -->
    <rect x="180" y="108" width="600" height="256" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="420" y="112" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="121" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SHARED PKI</text>

    <rect x="180" y="388" width="200" height="116" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="228" y="392" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="280" y="401" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER WEST</text>

    <rect x="580" y="388" width="200" height="116" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="628" y="392" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="680" y="401" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER EAST</text>

    <!-- Arrows (behind boxes) -->
    <!-- TA -> II_W (S-elbow, fanned attach point 1 of 2) -->
    <path d="M 452,204 V 236 Q 452,244 444,244 H 288 Q 280,244 280,252 V 280"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- TA -> II_E (S-elbow, fanned attach point 2 of 2) -->
    <path d="M 508,204 V 236 Q 508,244 516,244 H 672 Q 680,244 680,252 V 280"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- II_W -> Workload Certs West (vertical, axis-aligned) -->
    <line x1="280" y1="344" x2="280" y2="420" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- II_E -> Workload Certs East (vertical, axis-aligned) -->
    <line x1="680" y1="344" x2="680" y2="420" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: TA (Trust Anchor) — FOCAL -->
    <rect x="400" y="140" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="140" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="408" y="148" width="24" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="420" y="157" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CA</text>
    <text x="480" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Trust Anchor</text>
    <text x="480" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared root CA</text>

    <!-- Node: II_W (Issuer West) -->
    <rect x="200" y="280" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="200" y="280" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="208" y="288" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="220" y="297" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CA</text>
    <text x="280" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Issuer West</text>
    <text x="280" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">intermediate CA</text>

    <!-- Node: II_E (Issuer East) -->
    <rect x="600" y="280" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="280" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="608" y="288" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="620" y="297" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CA</text>
    <text x="680" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Issuer East</text>
    <text x="680" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">intermediate CA</text>

    <!-- Node: Workload Certs West (merged W1+W2) -->
    <rect x="200" y="420" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="200" y="420" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="208" y="428" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="222" y="437" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRT</text>
    <text x="280" y="456" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Workload Certs</text>
    <text x="280" y="472" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">West pods ×2</text>

    <!-- Node: Workload Certs East (merged E1+E2) -->
    <rect x="600" y="420" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="420" width="160" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="608" y="428" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="622" y="437" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRT</text>
    <text x="680" y="456" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Workload Certs</text>
    <text x="680" y="472" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">East pods ×2</text>

    <!-- Legend strip -->
    <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="568" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Root of trust (focal)</text>

    <rect x="256" y="571" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="276" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Intermediate issuer</text>

    <rect x="452" y="571" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="472" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Workload certificate</text>
  </svg>