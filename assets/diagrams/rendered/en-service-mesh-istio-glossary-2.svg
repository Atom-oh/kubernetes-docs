<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sigv4-title sigv4-desc">
      <title id="sigv4-title">SigV4 Request Signing Flow</title>
      <desc id="sigv4-desc">Sequence diagram showing Envoy transparently signing an outbound client request with AWS SigV4 credentials before forwarding it to an AWS service and returning the response.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Lifelines -->
      <line x1="140" y1="80" x2="140" y2="500" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="490" y1="80" x2="490" y2="500" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="780" y1="80" x2="780" y2="500" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="486" y="104" width="8" height="376" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
      <rect x="776" y="294" width="8" height="132" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

      <!-- m1: Client -> Envoy -->
      <line x1="140" y1="110" x2="486" y2="110" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="268" y="90" width="90" height="12" fill="#ffffff"/>
      <text x="313" y="99" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP REQUEST</text>

      <!-- m2: Envoy self — Load AWS credentials -->
      <path d="M494,150 C540,150 540,166 494,166" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="548" y="150" width="176" height="16" fill="#ffffff"/>
      <text x="556" y="161" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.05em">LOAD AWS CREDENTIALS</text>

      <!-- m3: Envoy self — Generate SigV4 signature -->
      <path d="M494,210 C540,210 540,226 494,226" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="548" y="206" width="156" height="24" fill="#ffffff"/>
      <text x="556" y="216" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.05em">GENERATE SIGV4</text>
      <text x="556" y="227" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.05em">HMAC-SHA256</text>

      <!-- m4: Envoy -> AWS (external call) -->
      <line x1="494" y1="300" x2="776" y2="300" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="575" y="266" width="120" height="12" fill="#ffffff"/>
      <text x="635" y="275" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">ADD AUTH HEADER</text>
      <rect x="575" y="280" width="120" height="12" fill="#ffffff"/>
      <text x="635" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">AWS4-HMAC-SHA256</text>

      <!-- m5: AWS self — Verify signature -->
      <path d="M784,350 C830,350 830,366 784,366" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="838" y="350" width="118" height="16" fill="#ffffff"/>
      <text x="846" y="361" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.05em">VERIFY SIGNATURE</text>

      <!-- m6: AWS -> Envoy (return) -->
      <line x1="776" y1="410" x2="494" y2="410" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="600" y="390" width="70" height="12" fill="#ffffff"/>
      <text x="635" y="399" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text>

      <!-- m7: Envoy -> Client (headline success) -->
      <line x1="486" y1="470" x2="140" y2="470" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="278" y="450" width="70" height="12" fill="#ffffff"/>
      <text x="313" y="459" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text>

      <!-- Actor headers (drawn last, on top of lifeline start) -->
      <rect x="60" y="40" width="160" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="140" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>

      <rect x="410" y="40" width="160" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="490" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>

      <rect x="700" y="40" width="160" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="780" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS Service</text>

      <!-- Legend -->
      <line x1="60" y1="508" x2="900" y2="508" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="60" y="524" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="60" y="540" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="92" y="550" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal actor (Envoy)</text>

      <line x1="256" y1="546" x2="284" y2="546" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="292" y="550" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Sync call / self-check</text>

      <line x1="452" y1="546" x2="480" y2="546" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="488" y="550" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">External AWS call</text>

      <line x1="640" y1="546" x2="668" y2="546" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="676" y="550" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return</text>

      <line x1="756" y1="546" x2="784" y2="546" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="792" y="550" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Headline success</text>
    </svg>