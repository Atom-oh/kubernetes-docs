<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="silence-mgmt-title silence-mgmt-desc">
      <title id="silence-mgmt-title">Silence Management Best Practices</title>
      <desc id="silence-mgmt-desc">Flowchart showing a silence's duration set by its type — maintenance, deployment, investigation, or known issue — followed by a mandatory comment, regular review, and either automatic removal on expiry or a manual review.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Edges -->
      <path d="M 480,76 V 94" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <path d="M 480,166 V 200" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="444" y="176" width="72" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BY TYPE</text>

      <path d="M 480,244 V 280" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 480,316 V 352" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 480,388 V 404" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <path d="M 560,440 H 620" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="574" y="424" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="594" y="433" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <path d="M 480,476 V 500" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="464" y="480" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="480" y="489" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- Nodes -->
      <!-- A: Silence Needed (start oval) -->
      <rect x="400" y="40" width="160" height="36" rx="18" fill="#ffffff"/>
      <rect x="400" y="40" width="160" height="36" rx="18" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Silence Needed</text>

      <!-- B: Type? (diamond) -->
      <polygon points="480,94 560,130 480,166 400,130" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="134" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Type?</text>

      <!-- M: Set duration (merged: maintenance / deployment / investigation / known issue) -->
      <rect x="380" y="200" width="200" height="44" rx="6" fill="#ffffff"/>
      <rect x="380" y="200" width="200" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Set Duration</text>
      <text x="480" y="234" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">by silence type</text>

      <!-- G: Clear comment (focal) -->
      <rect x="400" y="280" width="160" height="36" rx="6" fill="rgba(255,153,0,0.10)"/>
      <rect x="400" y="280" width="160" height="36" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="480" y="302" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Clear Comment</text>

      <!-- H: Regular review -->
      <rect x="400" y="352" width="160" height="36" rx="6" fill="#ffffff"/>
      <rect x="400" y="352" width="160" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="374" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Regular Review</text>

      <!-- I: Expired? (diamond) -->
      <polygon points="480,404 560,440 480,476 400,440" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="444" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Expired?</text>

      <!-- J: Auto-removed -->
      <rect x="620" y="422" width="140" height="36" rx="6" fill="#ffffff"/>
      <rect x="620" y="422" width="140" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="690" y="444" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Auto-removed</text>

      <!-- K: Manual review -->
      <rect x="400" y="500" width="160" height="36" rx="6" fill="#ffffff"/>
      <rect x="400" y="500" width="160" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="522" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Manual Review</text>
    </svg>