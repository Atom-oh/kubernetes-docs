<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow5-title flow5-desc">
    <title id="flow5-title">Silence 관리 모범 사례</title>
    <desc id="flow5-desc">Silence가 필요할 때 유지보수, 배포, 조사, 알려진 이슈 등 유형에 따라 명확한 코멘트를 남기고, 정기적으로 검토해 만료 여부에 따라 자동 제거되거나 수동 검토로 이어지는 흐름을 보여줍니다.</desc>
    <defs><style>@import url(https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Edges -->
    <line x1="480" y1="80" x2="480" y2="120" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="400" y1="168" x2="400" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="460" y1="168" x2="460" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="520" y1="168" x2="520" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="580" y1="168" x2="580" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="480" y1="308" x2="480" y2="360" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="408" x2="480" y2="430" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="550" y1="470" x2="620" y2="470" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="410" y1="470" x2="340" y2="470" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: A start -->
    <rect x="420" y="40" width="120" height="40" rx="20" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="480" y="65" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Silence 필요</text>

    <!-- Node: B classification -->
    <rect x="370" y="120" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="148" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">유형?</text>

    <!-- Node: G merge -->
    <rect x="370" y="260" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="288" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">명확한 코멘트</text>

    <!-- Node: H review -->
    <rect x="420" y="360" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="388" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">정기 검토</text>

    <!-- Node: I decision (focal) -->
    <polygon points="480,430 550,470 480,510 410,470" fill="#FFF8F0" stroke="#EC7211" stroke-width="1.4"/>
    <text x="480" y="474" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">만료?</text>

    <!-- Node: J auto-remove -->
    <rect x="620" y="446" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="690" y="474" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">자동 제거</text>

    <!-- Node: K manual review -->
    <rect x="200" y="446" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="270" y="474" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">수동 검토</text>

    <!-- Category labels along B->G edges -->
    <rect x="406" y="192" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="428" y="201" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">유지보수</text>
    <rect x="466" y="212" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="488" y="221" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">배포</text>
    <rect x="526" y="192" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="548" y="201" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">조사 중</text>
    <rect x="586" y="212" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="608" y="221" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">알려진 이슈</text>

    <!-- I -> J / K labels -->
    <rect x="568" y="452" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="583" y="461" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
    <rect x="358" y="452" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="373" y="461" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

    <!-- Legend -->
    <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="550" width="20" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="80" y="559" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">작업 단계</text>
    <polygon points="240,550 254,556 240,562 226,556" fill="none" stroke="#EC7211" stroke-width="1.2"/>
    <text x="264" y="559" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">정기 만료 검토 지점</text>
  </svg>