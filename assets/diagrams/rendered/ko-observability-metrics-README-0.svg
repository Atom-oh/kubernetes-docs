<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pullpush-title pullpush-desc">
    <title id="pullpush-title">Pull 모델과 Push 모델의 메트릭 수집 구조 비교</title>
    <desc id="pullpush-desc">Prometheus가 애플리케이션의 /metrics 엔드포인트를 직접 가져오는 Pull 모델과, 애플리케이션이 Datadog·CloudWatch 같은 수집기로 메트릭을 직접 전송하는 Push 모델을 나란히 비교하는 아키텍처 다이어그램.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
    </defs>

    <rect width="960" height="460" fill="#ffffff"/>

    <!-- Zones (drawn before arrows/nodes) -->
    <rect x="40" y="96" width="400" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="164" y="100" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PULL 모델 · PROMETHEUS</text>

    <rect x="520" y="96" width="400" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="620" y="100" width="200" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PUSH 모델 · DATADOG / CLOUDWATCH</text>

    <!-- Arrows: Pull zone (Prometheus Server fans down to 3 apps) -->
    <path d="M196,196 V250 Q196,258 188,258 H120 Q112,258 112,266 V336" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <path d="M240,196 V336" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <path d="M284,196 V250 Q284,258 292,258 H360 Q368,258 368,266 V336" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>

    <rect x="212" y="208" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="217" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP GET</text>

    <!-- Arrows: Push zone (3 apps fan up into Collector/Gateway) -->
    <path d="M592,204 V254 Q592,262 600,262 H668 Q676,262 676,270 V336" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <path d="M720,204 V336" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <path d="M848,204 V254 Q848,262 840,262 H772 Q764,262 764,270 V336" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>

    <rect x="690" y="242" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="251" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP POST</text>

    <!-- Node: Prometheus Server (focal) -->
    <rect x="152" y="140" width="176" height="56" rx="6" fill="#ffffff"/>
    <rect x="152" y="140" width="176" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="160" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.40)" stroke-width="0.8"/>
    <text x="176" y="157" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRV</text>
    <text x="240" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus Server</text>
    <text x="240" y="187" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scrapes targets</text>

    <!-- Nodes: App1/2/3 /metrics -->
    <rect x="56" y="336" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="56" y="336" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="112" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App 1</text>
    <text x="112" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/metrics</text>

    <rect x="184" y="336" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="184" y="336" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App 2</text>
    <text x="240" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/metrics</text>

    <rect x="312" y="336" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="312" y="336" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="368" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App 3</text>
    <text x="368" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/metrics</text>

    <!-- Nodes: App1/2/3 (push side) -->
    <rect x="536" y="140" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="536" y="140" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="592" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App 1</text>
    <text x="592" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exporter</text>

    <rect x="664" y="140" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="664" y="140" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App 2</text>
    <text x="720" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exporter</text>

    <rect x="792" y="140" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="792" y="140" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="848" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App 3</text>
    <text x="848" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exporter</text>

    <!-- Node: Collector/Gateway -->
    <rect x="632" y="336" width="176" height="56" rx="6" fill="#ffffff"/>
    <rect x="632" y="336" width="176" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="640" y="344" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="660" y="353" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
    <text x="720" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Collector / Gateway</text>
    <text x="720" y="383" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">buffers &amp; forwards</text>
  </svg>