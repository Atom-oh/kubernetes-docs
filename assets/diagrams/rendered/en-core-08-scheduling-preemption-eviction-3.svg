    <title id="en-core-08-scheduling-preemption-eviction-3-title">Pod affinity and anti-affinity</title>
    <desc id="en-core-08-scheduling-preemption-eviction-3-desc">Diagram contrasting pod affinity, which co-locates a web pod with a cache pod on the same node, against pod anti-affinity, which separates two web pod replicas across different nodes, both configurable as hard or soft requirements.</desc>
