<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Knative eventing: Broker/Trigger versus Channel/Subscription patterns</title>
<desc id="d">Event sources feed either a Broker, which routes filtered CloudEvents through Triggers to consumer services and a dead letter sink on delivery failure, or a Channel, which fans out to Subscriptions that deliver to their own consumer services.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- Zones -->
<rect x="40" y="60" width="176" height="480" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="72" y="64" width="112" height="12" rx="2" fill="#ffffff"/>
<text x="128" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EVENT SOURCES</text>

<rect x="632" y="60" width="288" height="480" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="720" y="64" width="112" height="12" rx="2" fill="#ffffff"/>
<text x="776" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONSUMERS</text>

<!-- Arrows -->
<!-- Sources -> Broker (accent headline) -->
<path d="M 200,180 H 260 Q 268,180 268,188 V 232 Q 268,240 276,240 H 384"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- Sources -> Channel -->
<path d="M 200,420 H 284 Q 292,420 292,428 V 456 Q 292,464 300,464 H 384"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="220" y="292" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="256" y="301" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">CLOUDEVENTS</text>

<!-- Broker -> Trigger1 / Trigger2 -->
<path d="M 460,232 V 220 Q 460,212 468,212 H 500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 460,248 V 260 Q 460,268 468,268 H 500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Trigger1 -> Order Service -->
<line x1="612" y1="212" x2="632" y2="212" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Trigger2 -> Payment Service -->
<line x1="612" y1="268" x2="632" y2="268" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Trigger1/2 -> Dead Letter Sink (dashed, failure) -->
<path d="M 556,232 V 324 Q 556,332 548,332 H 500"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 556,288 V 300 Q 556,308 564,308 V 348 Q 564,356 556,356 H 500"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="440" y="302" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="311" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ON FAILURE</text>

<!-- Channel -> Sub1 / Sub2, fanned off Channel's right edge -->
<path d="M 460,452 H 472 Q 480,452 480,444 Q 480,436 488,436 H 500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 460,476 H 472 Q 480,476 480,484 Q 480,492 488,492 H 500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Sub1 -> Notification Service -->
<line x1="612" y1="436" x2="632" y2="436" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Sub2 -> Analytics Service -->
<line x1="612" y1="492" x2="632" y2="492" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Nodes: Sources (summary) -->
<rect x="56" y="140" width="144" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="128" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Broker-bound sources</text>
<text x="128" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ApiServerSource</text>
<text x="128" y="202" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KafkaSource · SQSSource</text>

<rect x="56" y="380" width="144" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="128" y="412" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Channel-bound source</text>
<text x="128" y="428" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SinkBinding</text>

<!-- Broker (focal) -->
<rect x="384" y="216" width="76" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="422" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Broker</text>

<!-- Trigger 1 -->
<rect x="500" y="192" width="112" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="556" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Trigger</text>
<text x="556" y="226" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">type=order.created</text>

<!-- Trigger 2 -->
<rect x="500" y="248" width="112" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="556" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Trigger</text>
<text x="556" y="282" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">type=payment.*</text>

<!-- Dead Letter Sink -->
<rect x="384" y="324" width="116" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="442" y="352" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Dead Letter</text>

<!-- Channel -->
<rect x="384" y="440" width="76" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="422" y="468" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Channel</text>

<!-- Subscription 1 -->
<rect x="500" y="416" width="112" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="556" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Subscription 1</text>

<!-- Subscription 2 -->
<rect x="500" y="472" width="112" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="556" y="496" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Subscription 2</text>

<!-- Consumers -->
<rect x="632" y="188" width="176" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="720" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Order Service</text>

<rect x="632" y="244" width="176" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="720" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Payment Service</text>

<rect x="632" y="412" width="176" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="720" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Notification Service</text>

<rect x="632" y="468" width="176" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="720" y="496" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Analytics Service</text>

<!-- Legend -->
<line x1="40" y1="502" x2="920" y2="502" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="518" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="534" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="60" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal — Broker</text>
<line x1="200" y1="538" x2="228" y2="538" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="236" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Broker / Trigger pattern</text>
<line x1="440" y1="538" x2="468" y2="538" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="476" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Channel / Subscription pattern</text>
<line x1="700" y1="538" x2="728" y2="538" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="736" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Delivery failure</text>
</svg>