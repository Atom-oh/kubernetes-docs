    <title id="en-eks-05-eks-security-10-title">dm-verity boot integrity verification</title>
    <desc id="en-eks-05-eks-security-10-desc">Flowchart showing the Bottlerocket boot chain from bootloader to kernel to dm-verity, which builds a hash tree over the root filesystem and compares it against the trusted root hash, continuing boot only on a match and failing boot otherwise.</desc>
