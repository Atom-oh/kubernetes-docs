<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ack-kro-title ack-kro-desc">
  <title id="ack-kro-title">ACK and KRO composition for the Example Corp app</title>
  <desc id="ack-kro-desc">A WebApp custom resource in the KRO application layer creates a Deployment, Service, TargetGroupBinding, and ConfigMap; the TargetGroupBinding references an ACK-managed Target Group behind an NLB and Route 53 record, and the ConfigMap carries the endpoint of an ACK-managed Aurora PostgreSQL database, tying the Kubernetes application layer to real AWS infrastructure.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- header -->
  <text x="32" y="28" fill="#7D8998" font-size="8" font-weight="500" letter-spacing="0.18em" class="mono">ARCHITECTURE</text>
  <text x="32" y="52" fill="#232F3E" font-size="20" font-weight="700">ACK + KRO composition</text>

  <!-- ================= ZONES (painted before arrows/nodes) ================= -->
  <rect x="32" y="64" width="896" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="40" y="68" width="152" height="12" rx="2" fill="#ffffff"/>
  <text x="46" y="77" fill="rgba(35,47,62,0.40)" font-size="7" letter-spacing="0.14em" class="mono">KRO &#183; APPLICATION</text>

  <rect x="32" y="308" width="896" height="204" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="40" y="312" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="46" y="321" fill="rgba(35,47,62,0.40)" font-size="7" letter-spacing="0.06em" class="mono">ACK &#183; AWS INFRA</text>

  <!-- ================= ARROWS (behind nodes) ================= -->

  <!-- solid: WebApp CR fans out to the four resources it owns -->
  <path d="M436,152 V164 Q436,172 428,172 H244 Q236,172 236,180 V192" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M464,152 V164 Q464,172 456,172 H392 Q384,172 384,180 V192" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M492,152 V164 Q492,172 500,172 H512 Q520,172 520,180 V192" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M520,152 V164 Q520,172 528,172 H680 Q688,172 688,180 V192" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- dashed: intra-app references -->
  <line x1="288" y1="220" x2="328" y2="220" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="568" y1="220" x2="608" y2="220" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- dashed: cross-zone references into AWS infrastructure -->
  <path d="M688,248 V340" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M384,248 V272 Q384,280 376,280 H248 Q240,280 240,288 V440" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- solid: Route 53 -> NLB -> Target Group chain (same row, straight lines) -->
  <line x1="484" y1="368" x2="508" y2="368" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="604" y1="368" x2="628" y2="368" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ================= ARROW LABELS (masked, gapped from their line) ================= -->
  <rect x="292" y="200" width="32" height="12" rx="2" fill="#ffffff"/>
  <text x="308" y="209" text-anchor="middle" fill="#7D8998" font-size="8" letter-spacing="0.04em" class="mono">ENVFROM</text>

  <rect x="572" y="200" width="32" height="12" rx="2" fill="#ffffff"/>
  <text x="588" y="209" text-anchor="middle" fill="#7D8998" font-size="8" letter-spacing="0.04em" class="mono">SVCREF</text>

  <rect x="696" y="286" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="744" y="295" text-anchor="middle" fill="#7D8998" font-size="8" letter-spacing="0.02em" class="mono">TARGETGROUPARN</text>

  <rect x="250" y="358" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="286" y="367" text-anchor="middle" fill="#7D8998" font-size="8" letter-spacing="0.04em" class="mono">ENDPOINTS</text>

  <!-- ================= NODES ================= -->

  <!-- WebApp CR (focal) -->
  <rect x="408" y="96" width="140" height="56" rx="6" fill="#ffffff"/>
  <rect x="408" y="96" width="140" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="416" y="102" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.40)" stroke-width="0.8"/>
  <text x="430" y="111" text-anchor="middle" fill="rgba(236,114,17,0.85)" font-size="7" letter-spacing="0.08em" class="mono">CRD</text>
  <text x="478" y="126" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">WebApp CR</text>
  <text x="478" y="142" text-anchor="middle" fill="#545B64" font-size="9" class="mono">kind: WebApp</text>

  <!-- Deployment -->
  <rect x="184" y="192" width="104" height="56" rx="6" fill="#ffffff"/>
  <rect x="184" y="192" width="104" height="56" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
  <rect x="192" y="198" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="206" y="207" text-anchor="middle" fill="rgba(35,47,62,0.80)" font-size="7" letter-spacing="0.08em" class="mono">K8S</text>
  <text x="236" y="222" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">Deployment</text>
  <text x="236" y="238" text-anchor="middle" fill="#545B64" font-size="9" class="mono">apps/v1</text>

  <!-- ConfigMap (store) -->
  <rect x="328" y="192" width="112" height="56" rx="6" fill="#ffffff"/>
  <rect x="328" y="192" width="112" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="336" y="198" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="350" y="207" text-anchor="middle" fill="rgba(35,47,62,0.80)" font-size="7" letter-spacing="0.08em" class="mono">K8S</text>
  <text x="384" y="222" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">ConfigMap</text>
  <text x="384" y="238" text-anchor="middle" fill="#545B64" font-size="9" class="mono">env source</text>

  <!-- Service -->
  <rect x="472" y="192" width="96" height="56" rx="6" fill="#ffffff"/>
  <rect x="472" y="192" width="96" height="56" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
  <rect x="480" y="198" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="494" y="207" text-anchor="middle" fill="rgba(35,47,62,0.80)" font-size="7" letter-spacing="0.08em" class="mono">K8S</text>
  <text x="520" y="222" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">Service</text>
  <text x="520" y="238" text-anchor="middle" fill="#545B64" font-size="9" class="mono">ClusterIP</text>

  <!-- TargetGroupBinding -->
  <rect x="608" y="192" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="608" y="192" width="160" height="56" rx="6" fill="none" stroke="#232F3E" stroke-width="1"/>
  <rect x="616" y="198" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="630" y="207" text-anchor="middle" fill="rgba(35,47,62,0.80)" font-size="7" letter-spacing="0.08em" class="mono">CRD</text>
  <text x="688" y="222" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">TargetGroupBinding</text>
  <text x="688" y="238" text-anchor="middle" fill="#545B64" font-size="9" class="mono">eks.services.k8s.aws</text>

  <!-- Route 53 Record (external) -->
  <rect x="344" y="340" width="140" height="56" rx="6" fill="#ffffff"/>
  <rect x="344" y="340" width="140" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <rect x="352" y="346" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="366" y="355" text-anchor="middle" fill="rgba(35,47,62,0.80)" font-size="7" letter-spacing="0.08em" class="mono">DNS</text>
  <text x="414" y="370" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">Route 53 Record</text>
  <text x="414" y="386" text-anchor="middle" fill="#545B64" font-size="9" class="mono">A record</text>

  <!-- NLB (external) -->
  <rect x="508" y="340" width="96" height="56" rx="6" fill="#ffffff"/>
  <rect x="508" y="340" width="96" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <rect x="516" y="346" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="530" y="355" text-anchor="middle" fill="rgba(35,47,62,0.80)" font-size="7" letter-spacing="0.08em" class="mono">LB</text>
  <text x="556" y="370" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">NLB</text>
  <text x="556" y="386" text-anchor="middle" fill="#545B64" font-size="9" class="mono">layer 4</text>

  <!-- Target Group (external) -->
  <rect x="628" y="340" width="120" height="56" rx="6" fill="#ffffff"/>
  <rect x="628" y="340" width="120" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <rect x="636" y="346" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="650" y="355" text-anchor="middle" fill="rgba(35,47,62,0.80)" font-size="7" letter-spacing="0.08em" class="mono">LB</text>
  <text x="688" y="370" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">Target Group</text>
  <text x="688" y="386" text-anchor="middle" fill="#545B64" font-size="9" class="mono">arn:aws:...</text>

  <!-- Aurora PostgreSQL (store) -->
  <rect x="160" y="440" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="160" y="440" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="168" y="446" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="182" y="455" text-anchor="middle" fill="rgba(35,47,62,0.80)" font-size="7" letter-spacing="0.08em" class="mono">RDS</text>
  <text x="240" y="470" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600">Aurora PostgreSQL</text>
  <text x="240" y="486" text-anchor="middle" fill="#545B64" font-size="9" class="mono">writer endpoint</text>

  <!-- ================= LEGEND ================= -->
  <line x1="32" y1="532" x2="928" y2="532" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="548" fill="#545B64" font-size="8" letter-spacing="0.14em" class="mono">LEGEND</text>

  <line x1="32" y1="564" x2="56" y2="564" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="64" y="568" fill="#545B64" font-size="9" class="mono">solid &#8212; CR creates/owns</text>

  <line x1="284" y1="564" x2="308" y2="564" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="316" y="568" fill="#545B64" font-size="9" class="mono">dashed &#8212; references AWS resource</text>
</svg>