<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sync-window-title sync-window-desc">
      <title id="sync-window-title">Allow/Deny sync window 판정 흐름</title>
      <desc id="sync-window-desc">동기화 요청이 들어오면 Allow 윈도우가 활성인지 먼저 확인해 동기화를 실행하고, 아니면 Deny 윈도우가 활성인지 확인해 활성이면 동기화를 차단하고 그렇지 않으면 기본 허용으로 동기화를 실행하는 판정 순서를 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Arrows -->
      <!-- Start -> Check -->
      <line x1="480" y1="88" x2="480" y2="120" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Check -> Allow -->
      <line x1="480" y1="168" x2="480" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Allow -yes-> Sync (accent, happy path) -->
      <line x1="580" y1="240" x2="700" y2="240" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Allow -no-> Deny -->
      <line x1="480" y1="288" x2="480" y2="328" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Deny -yes-> Block -->
      <line x1="580" y1="376" x2="700" y2="376" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Deny -no-> Default -->
      <line x1="480" y1="424" x2="480" y2="464" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Default -> Sync (accent, rejoins happy path) -->
      <path d="M 580 488 L 920 488 L 920 240 L 860 240" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="612" y="232" width="24" height="14" rx="2" fill="#ffffff"/>
      <text x="624" y="243" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">예</text>

      <rect x="464" y="298" width="32" height="14" rx="2" fill="#ffffff"/>
      <text x="480" y="309" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">아니오</text>

      <rect x="612" y="368" width="24" height="14" rx="2" fill="#ffffff"/>
      <text x="624" y="379" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">예</text>

      <rect x="464" y="434" width="32" height="14" rx="2" fill="#ffffff"/>
      <text x="480" y="445" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">아니오</text>

      <!-- Start oval -->
      <rect x="400" y="40" width="160" height="48" rx="24" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="480" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">동기화 요청</text>

      <!-- Check step -->
      <rect x="400" y="120" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">윈도우 확인</text>

      <!-- Diamond: Allow window active? -->
      <polygon points="480,192 580,240 480,288 380,240" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="236" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Allow 윈도우</text>
      <text x="480" y="250" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">활성?</text>

      <!-- Diamond: Deny window active? -->
      <polygon points="480,328 580,376 480,424 380,376" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="372" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Deny 윈도우</text>
      <text x="480" y="386" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">활성?</text>

      <!-- Default step -->
      <rect x="400" y="464" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="492" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">기본 허용</text>

      <!-- End oval: Sync (focal accent) -->
      <rect x="700" y="216" width="160" height="48" rx="24" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="780" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">동기화 실행</text>

      <!-- End oval: Block (security / denied) -->
      <rect x="700" y="352" width="160" height="48" rx="24" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="780" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">동기화 차단</text>

      <!-- Legend -->
      <line x1="32" y1="552" x2="928" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="32" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="32" y="584" width="24" height="12" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="64" y="594" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">시작 / 종료 (원)</text>

      <polygon points="204,590 216,584 228,590 216,596" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="240" y="594" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">판단 (마름모)</text>

      <line x1="360" y1="590" x2="388" y2="590" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="396" y="594" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">허용 경로</text>

      <rect x="512" y="584" width="24" height="12" rx="12" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="544" y="594" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">차단 상태</text>
    </svg>