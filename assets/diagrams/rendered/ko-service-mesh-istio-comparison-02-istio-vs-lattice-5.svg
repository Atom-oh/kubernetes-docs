<title id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-5-title">Revision 기반 Canary 업그레이드 중 두 Control Plane 공존</title>
<desc id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-5-desc">기존 Istiod 1.23.0과 새 Istiod 1.24.0이 각각 production, staging 네임스페이스의 파드에 xDS 설정을 배포하며 동시에 실행되고, staging 검증 후 production으로 순차 전환하는 과정에서 리소스 2배 사용과 연결 끊김, 설정 호환성 문제라는 리스크가 따른다는 것을 보여준다.</desc>
