<text x="80" y="63" fill="#4CAF50" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.12em">STANDARD SUPPORT · 14개월</text>
<text x="76" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Standard Support</text>
<text x="76" y="112" fill="#545B64" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">• $0.10/cluster/hour</text>
<text x="76" y="130" fill="#545B64" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">• 정규 보안 패치</text>
<text x="76" y="148" fill="#545B64" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">• 매니지드 애드온 업데이트</text>
<text x="76" y="166" fill="#545B64" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">• AWS 기술 지원</text>
<rect x="352" y="60" width="260" height="168" rx="8" fill="rgba(255,152,0,0.06)" stroke="#FF9800" stroke-width="1"/>
<rect x="364" y="52" width="208" height="16" rx="2" fill="#ffffff"/>
<text x="372" y="63" fill="#FF9800" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.12em">EXTENDED SUPPORT · +12개월</text>
<text x="368" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Extended Support</text>
<text x="368" y="112" fill="#545B64" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">• $0.60/cluster/hour</text>
<text x="368" y="130" fill="#545B64" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">• 중요 보안 패치만</text>
<text x="368" y="148" fill="#545B64" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">• 제한된 애드온 업데이트</text>
<text x="368" y="166" fill="#545B64" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">• 업그레이드 유예 기간</text>
