<title id="ko-eks-12-kubernetes-version-roadmap-3-title">EKS 버전 지원 체계</title>
<desc id="ko-eks-12-kubernetes-version-roadmap-3-desc">EKS 버전 지원 체계가 Standard Support에서 Extended Support를 거쳐 지원 종료(End of Life)로 이어지는 3단계 흐름과 각 단계의 비용·정책 차이를 보여준다.</desc>
