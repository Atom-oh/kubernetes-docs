<text x="660" y="112" fill="#545B64" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">• 자동 업그레이드 시작</text>
<text x="660" y="130" fill="#545B64" font-size="10" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">• 60일 사전 알림</text>
