<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-networking-README-7-title en-networking-README-7-desc">
<title id="en-networking-README-7-title">CNI Selection Decision Tree</title>
<desc id="en-networking-README-7-desc">A decision tree for choosing a Kubernetes CNI: EKS users pick by network-policy depth, non-EKS users pick by environment complexity, multi-cloud need, and BGP/service-mesh requirements, landing on AWS VPC CNI, Calico, Cilium, or Flannel.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- connectors -->
<line x1="480" y1="94" x2="480" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<path d="M405,170 H268 Q260,170 260,178 V254" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="316" y="152" width="30" height="12" rx="2" fill="#ffffff"/>
<text x="331" y="161" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>

<path d="M555,170 H692 Q700,170 700,178 V258" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="608" y="152" width="24" height="12" rx="2" fill="#ffffff"/>
<text x="620" y="161" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>

<path d="M175,300 H168 Q160,300 160,308 V536" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="118" y="304" width="42" height="12" rx="2" fill="#ffffff"/>
<text x="139" y="313" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NONE</text>

<path d="M260,346 V430 H357 Q365,430 365,438 V536" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="248" y="418" width="66" height="12" rx="2" fill="#ffffff"/>
<text x="281" y="427" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">BASIC L3-L4</text>

<path d="M345,300 H372 Q380,300 380,308 V480 H392 a8,8 0 0,1 16,0 H609 a8,8 0 0,1 16,0 H782 Q790,480 790,488 V536" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="352" y="284" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="380" y="293" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ADV. L7</text>

<path d="M625,300 H608 Q600,300 600,308 V390" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="574" y="304" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="600" y="313" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SIMPLE</text>

<path d="M775,300 H812 Q820,300 820,308 V388" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="798" y="304" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="828" y="313" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">COMPLEX</text>

<path d="M530,430 H408 Q400,430 400,438 V536" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="416" y="434" width="30" height="12" rx="2" fill="#ffffff"/>
<text x="431" y="443" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>

<path d="M670,430 H609 Q617,430 617,438 V536" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="622" y="434" width="24" height="12" rx="2" fill="#ffffff"/>
<text x="634" y="443" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>

<path d="M745,430 H867 Q875,430 875,438 V536" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="758" y="434" width="30" height="12" rx="2" fill="#ffffff"/>
<text x="773" y="443" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>

<path d="M820,472 V512 H798 a8,8 0 0,0 -16,0 H625 a8,8 0 0,0 -16,0 H443 Q435,512 435,520 V536" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="674" y="516" width="24" height="12" rx="2" fill="#ffffff"/>
<text x="686" y="525" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>

<!-- Start -->
<rect x="405" y="46" width="150" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="74" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Choose a CNI</text>

<!-- Q1 (focal decision) -->
<polygon points="480,128 555,170 480,212 405,170" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="480" y="166" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Using AWS</text>
<text x="480" y="180" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EKS?</text>

<!-- Q2 -->
<polygon points="260,254 345,300 260,346 175,300" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="260" y="296" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Network policy</text>
<text x="260" y="310" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">depth needed?</text>

<!-- Q3 -->
<polygon points="700,258 775,300 700,342 625,300" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="700" y="296" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Environment</text>
<text x="700" y="310" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">complexity?</text>

<!-- Q5 -->
<polygon points="600,390 670,430 600,470 530,430" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="600" y="434" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Multi-cloud?</text>

<!-- Q6 -->
<polygon points="820,388 895,430 820,472 745,430" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="820" y="424" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Need BGP +</text>
<text x="820" y="438" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">service mesh?</text>

<!-- Terminals -->
<rect x="90" y="536" width="140" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="160" y="564" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS VPC CNI</text>

<rect x="330" y="536" width="140" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="400" y="564" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Calico</text>

<rect x="570" y="536" width="140" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="640" y="564" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Flannel</text>

<rect x="780" y="536" width="140" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="850" y="564" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cilium</text>
</svg>