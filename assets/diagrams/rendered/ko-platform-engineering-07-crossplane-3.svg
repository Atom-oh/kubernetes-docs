    <title id="ko-platform-engineering-07-crossplane-3-title">Claim 적용부터 AWS 리소스 생성까지</title>
    <desc id="ko-platform-engineering-07-crossplane-3-desc">개발자가 database-claim.yaml을 적용하면 Crossplane이 Composite Resource를 만들고 Composition을 조회해 AWS에 SecurityGroup·SubnetGroup·RDS Instance를 순서대로 생성한 뒤 Connection Secret과 Ready 상태를 돌려주는 순서도.</desc>
