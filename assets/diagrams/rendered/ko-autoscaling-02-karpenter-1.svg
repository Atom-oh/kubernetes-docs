<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="karp-seq-title karp-seq-desc">
    <title id="karp-seq-title">Karpenter 프로비저닝 시퀀스</title>
    <desc id="karp-seq-desc">스케줄링되지 못한 파드가 Karpenter 컨트롤러를 거쳐 AWS EC2 API로 인스턴스를 조회·요청하고, 새 노드가 등록되어 파드가 최종 스케줄링되기까지의 시간 순서를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Actors: P=100, K=300, KA=500, EC2=700, N=900 -->
    <!-- Lifelines -->
    <line x1="100" y1="96" x2="100" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="300" y1="96" x2="300" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="500" y1="96" x2="500" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="700" y1="96" x2="700" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="900" y1="96" x2="900" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="296" y="124" width="8" height="404" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- Messages -->
    <line x1="100" y1="124" x2="300" y2="124" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="128" y="104" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="188" y="113" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POD 생성(PENDING)</text>

    <line x1="300" y1="156" x2="500" y2="156" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="356" y="136" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="400" y="145" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POD 이벤트</text>

    <!-- self message on K -->
    <path d="M 500,180 H 560 V 200 H 500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="504" y="184" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="552" y="193" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">요구사항 분석</text>

    <path d="M 500,220 H 560 V 240 H 500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="504" y="224" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="552" y="233" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">프로비저너 평가</text>

    <line x1="500" y1="264" x2="700" y2="264" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="524" y="244" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="600" y="253" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">인스턴스/가격 조회</text>

    <line x1="700" y1="296" x2="500" y2="296" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="524" y="276" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="600" y="285" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">인스턴스 정보 반환</text>

    <line x1="500" y1="328" x2="700" y2="328" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="524" y="308" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="600" y="317" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">노드 프로비저닝 요청</text>

    <line x1="700" y1="360" x2="900" y2="360" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="736" y="340" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="800" y="349" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">인스턴스 생성</text>

    <line x1="900" y1="392" x2="300" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="536" y="372" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="580" y="381" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">노드 등록</text>

    <line x1="300" y1="424" x2="500" y2="424" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="356" y="404" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="400" y="413" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">노드 이벤트</text>

    <line x1="500" y1="456" x2="300" y2="456" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="332" y="436" width="136" height="12" rx="2" fill="#ffffff"/>
    <text x="400" y="445" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">레이블/테인트 설정</text>

    <line x1="300" y1="496" x2="100" y2="496" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="140" y="476" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="485" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POD 스케줄링</text>

    <!-- Actor boxes -->
    <rect x="20" y="48" width="160" height="48" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="100" y="76" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod</text>

    <rect x="220" y="48" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="300" y="76" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Karpenter Controller</text>

    <rect x="420" y="48" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="500" y="76" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes API</text>

    <rect x="620" y="48" width="160" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="700" y="76" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS EC2 API</text>

    <rect x="820" y="48" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="880" y="76" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">New Node</text>

    <!-- Legend -->
    <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="558" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="554" x2="164" y2="554" stroke="#545B64" stroke-width="1.2"/>
    <text x="172" y="558" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">호출</text>
    <line x1="260" y1="554" x2="284" y2="554" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="292" y="558" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">응답(반환)</text>
    <line x1="420" y1="554" x2="444" y2="554" stroke="#EC7211" stroke-width="1.4"/>
    <text x="452" y="558" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">핵심 성공 경로</text>
    <line x1="620" y1="554" x2="644" y2="554" stroke="#0972D3" stroke-width="1.2"/>
    <text x="652" y="558" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">외부 API 호출</text>
  </svg>