<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="retention-title retention-desc">
  <title id="retention-title">Prometheus short-term storage feeding long-term remote storage</title>
  <desc id="retention-desc">Diagram showing Prometheus, with 15-30 day retention, serving real-time alerts, recent trends, and immediate debugging directly, while also forwarding data via remote_write into long-term storage such as VictoriaMetrics, Mimir, or Thanos, which retains a year or more for capacity planning, annual trends, compliance, and cost analysis.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="40" y="80" width="368" height="392" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="96" y="84" width="256" height="12" rx="2" fill="#ffffff"/>
  <text x="224" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SHORT-TERM &#183; PROMETHEUS, 15-30 DAYS</text>

  <rect x="552" y="80" width="368" height="392" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="592" y="84" width="288" height="12" rx="2" fill="#ffffff"/>
  <text x="736" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">LONG-TERM &#183; REMOTE STORAGE, 1+ YEAR</text>

  <!-- Arrows: Prometheus (hub, right edge x=280) fans to its 3 in-zone targets -->
  <path d="M 280,252 H 288 Q 296,252 296,244 V 232 Q 296,224 304,224 H 340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 280,284 H 300 Q 308,284 308,292 V 348 Q 308,356 316,356 H 340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 280,300 H 312 Q 320,300 320,308 V 440 Q 320,448 328,448 H 340" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Accent arrow: Prometheus -> VictoriaMetrics (cross-zone, remote_write, primary flow) -->
  <path d="M 280,268 H 420 Q 428,268 428,276 V 292 Q 428,300 436,300 H 576" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="462" y="280" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="506" y="289" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">REMOTE_WRITE</text>

  <!-- Arrows: VictoriaMetrics (hub, right edge x=768) fans to 4 long-term targets -->
  <path d="M 768,276 H 772 Q 780,276 780,268 V 232 Q 780,224 788,224 H 828" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 768,292 H 784 Q 792,292 792,300 V 308 Q 792,316 800,316 H 828" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 768,308 H 796 Q 804,308 804,316 V 400 Q 804,408 812,408 H 828" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 768,324 H 808 Q 816,324 816,332 V 492 Q 816,500 824,500 H 828" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Node: Prometheus (short-term hub) -->
  <rect x="64" y="240" width="216" height="72" rx="6" fill="#ffffff"/>
  <rect x="64" y="240" width="216" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="72" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="88" y="257" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TSDB</text>
  <text x="172" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
  <text x="172" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">15-30 day retention</text>

  <!-- Node: Real-time alerts -->
  <rect x="340" y="196" width="68" height="56" rx="6" fill="#ffffff"/>
  <rect x="340" y="196" width="68" height="56" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
  <text x="374" y="220" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Real-time</text>
  <text x="374" y="232" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">alerts</text>

  <!-- Node: Recent trends -->
  <rect x="340" y="328" width="68" height="56" rx="6" fill="#ffffff"/>
  <rect x="340" y="328" width="68" height="56" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
  <text x="374" y="352" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Recent</text>
  <text x="374" y="364" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">trends</text>

  <!-- Node: Immediate debugging -->
  <rect x="340" y="420" width="68" height="56" rx="6" fill="#ffffff"/>
  <rect x="340" y="420" width="68" height="56" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
  <text x="374" y="444" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Immediate</text>
  <text x="374" y="456" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">debugging</text>

  <!-- Node: VictoriaMetrics / Mimir / Thanos (focal, long-term hub) -->
  <rect x="576" y="264" width="192" height="72" rx="6" fill="#ffffff"/>
  <rect x="576" y="264" width="192" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <rect x="584" y="272" width="24" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
  <text x="596" y="281" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">LTS</text>
  <text x="672" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VictoriaMetrics</text>
  <text x="672" y="314" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Mimir &#183; Thanos</text>
  <text x="672" y="326" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">1+ year retention</text>

  <!-- Node: Capacity planning -->
  <rect x="828" y="196" width="68" height="56" rx="6" fill="#ffffff"/>
  <rect x="828" y="196" width="68" height="56" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
  <text x="862" y="220" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Capacity</text>
  <text x="862" y="232" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">planning</text>

  <!-- Node: Annual trends -->
  <rect x="828" y="288" width="68" height="56" rx="6" fill="#ffffff"/>
  <rect x="828" y="288" width="68" height="56" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
  <text x="862" y="312" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Annual</text>
  <text x="862" y="324" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">trends</text>

  <!-- Node: Compliance -->
  <rect x="828" y="380" width="68" height="56" rx="6" fill="#ffffff"/>
  <rect x="828" y="380" width="68" height="56" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
  <text x="862" y="412" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Compliance</text>

  <!-- Node: Cost analysis -->
  <rect x="828" y="472" width="68" height="56" rx="6" fill="#ffffff"/>
  <rect x="828" y="472" width="68" height="56" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
  <text x="862" y="496" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cost</text>
  <text x="862" y="508" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">analysis</text>

  <!-- Legend -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="40" y="548" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="60" y="557" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Long-term store (focal)</text>

  <line x1="260" y1="553" x2="288" y2="553" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="296" y="557" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">remote_write</text>

  <line x1="440" y1="553" x2="468" y2="553" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="476" y="557" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">serves use case</text>
</svg>