<title id="en-service-mesh-istio-03-architecture-9-title">DNS Proxy: Istio Service vs. External DNS</title>
<desc id="en-service-mesh-istio-03-architecture-9-desc">Sequence diagram showing Envoy's DNS proxy intercepting a redirected DNS query and branching: for an in-mesh Istio service it asks Istiod's xDS server for the ClusterIP, otherwise it falls back to querying CoreDNS, before returning an IP to the application either way.</desc>
