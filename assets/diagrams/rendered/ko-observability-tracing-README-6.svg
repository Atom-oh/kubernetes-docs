<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d6-title d6-desc">
    <title id="d6-title">Grafana 상관분석 루프</title>
    <desc id="d6-desc">메트릭 대시보드의 응답 시간 스파이크에서 Exemplar를 클릭해 Tempo의 Trace로, 다시 Loki의 로그로 이어졌다가 메트릭으로 되돌아오는 4단계 상관분석 순환을 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows (clockwise ring) -->
    <path d="M552,92 H792 Q800,92 800,100 V248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M800,312 V484 Q800,492 792,492 H552" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M408,492 H168 Q160,492 160,484 V312" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M160,248 V100 Q160,92 168,92 H408" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Labels -->
    <rect x="728" y="168" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="760" y="177" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">EXEMPLAR</text>

    <rect x="728" y="392" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="760" y="401" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">TRACE 조회</text>

    <rect x="256" y="472" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="288" y="481" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">로그 링크</text>

    <rect x="256" y="72" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="296" y="81" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">메트릭 연결</text>

    <!-- Node: 메트릭 대시보드 (focal, top) -->
    <rect x="408" y="60" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="408" y="60" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">메트릭 대시보드</text>
    <text x="480" y="106" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">응답 시간 스파이크</text>

    <!-- Node: Exemplar (right) -->
    <rect x="728" y="248" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="728" y="248" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="800" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Exemplar</text>
    <text x="800" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TraceID: abc123</text>

    <!-- Node: Tempo (bottom) -->
    <rect x="408" y="460" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="408" y="460" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="490" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Tempo</text>
    <text x="480" y="506" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Trace 상세</text>

    <!-- Node: Loki (left) -->
    <rect x="88" y="248" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="88" y="248" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Loki</text>
    <text x="160" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">관련 로그</text>

    <!-- Legend -->
    <line x1="40" y1="550" x2="920" y2="550" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="566" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="580" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="588" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">순환의 시작·복귀점 (focal)</text>
  </svg>