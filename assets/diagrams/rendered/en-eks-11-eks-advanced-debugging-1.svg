<title id="en-eks-11-eks-advanced-debugging-1-title">NotReady Node Decision Tree</title>
<desc id="en-eks-11-eks-advanced-debugging-1-desc">Decision-tree flowchart for diagnosing a NotReady EKS node: it walks down through EC2 instance status, kubelet health, network connectivity, and disk/memory pressure, ending at containerd runtime health, routing the responder to the matching remediation action at each step.</desc>
