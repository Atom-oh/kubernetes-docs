<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ebpf2-title ebpf2-desc">
    <title id="ebpf2-title">eBPF Hook Points 파이프라인</title>
    <desc id="ebpf2-desc">네트워크 카드로 들어온 패킷이 XDP, TC Ingress, Socket Filter를 거쳐 라우팅 결정된 뒤 Socket Ops와 TC Egress를 지나 다시 카드로 나가는 순서를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="148" y="140" width="580" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="168" y="144" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="216" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INGRESS PATH</text>

    <rect x="518" y="268" width="220" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="538" y="272" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="574" y="281" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTING</text>

    <rect x="228" y="400" width="420" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="248" y="404" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="292" y="413" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EGRESS PATH</text>

    <!-- Arrows -->
    <line x1="136" y1="204" x2="168" y2="204" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="328" y1="204" x2="368" y2="204" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="508" y1="204" x2="548" y2="204" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="628" y1="236" x2="628" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 628,364 V 392 Q 628,400 620,400 H 336 Q 328,400 328,408 V 432"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="408" y1="464" x2="448" y2="464" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="628" y1="464" x2="668" y2="464" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: NIC (input) -->
    <rect x="40" y="172" width="96" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="172" width="96" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="88" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">NIC</text>
    <text x="88" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">네트워크 카드</text>

    <!-- Node: XDP Hook (focal) -->
    <rect x="168" y="172" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="168" y="172" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="248" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">XDP Hook</text>
    <text x="248" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">가장 빠른 처리</text>

    <!-- Node: TC Ingress -->
    <rect x="368" y="172" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="368" y="172" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="438" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">TC Ingress</text>
    <text x="438" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">트래픽 제어</text>

    <!-- Node: Socket Filter -->
    <rect x="548" y="172" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="548" y="172" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="628" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">Socket Filter</text>
    <text x="628" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">소켓 레벨</text>

    <!-- Node: Routing Decision -->
    <rect x="538" y="300" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="538" y="300" width="180" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="628" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">Routing Decision</text>
    <text x="628" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">라우팅 테이블 조회</text>

    <!-- Node: Socket Ops -->
    <rect x="248" y="432" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="248" y="432" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="328" y="460" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">Socket Ops</text>
    <text x="328" y="476" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">연결 시간 LB</text>

    <!-- Node: TC Egress -->
    <rect x="448" y="432" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="448" y="432" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="538" y="460" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">TC Egress</text>
    <text x="538" y="476" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">트래픽 제어</text>

    <!-- Node: NIC Out -->
    <rect x="668" y="432" width="96" height="64" rx="6" fill="#ffffff"/>
    <rect x="668" y="432" width="96" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="716" y="460" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle">NIC Out</text>

    <!-- Legend -->
    <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="568" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Apple SD Gothic Neo','Malgun Gothic',sans-serif">최고 성능 구간(드라이버 레벨)</text>
  </svg>