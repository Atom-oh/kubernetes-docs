<title id="feature-graduation-timeline-title">Major Feature Graduation Timeline</title>
<desc id="feature-graduation-timeline-desc">Gantt-style timeline showing eight major Kubernetes features' full alpha-to-beta-to-GA journeys from 2022 through 2026, including sidecar containers, in-place pod resize, CEL-based admission control, dynamic resource allocation, KYAML, user namespaces, mutating admission policies, and gang scheduling, with the current date marked.</desc>
