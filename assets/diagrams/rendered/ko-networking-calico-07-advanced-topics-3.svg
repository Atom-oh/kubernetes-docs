<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="egress-gw-title egress-gw-desc">
    <title id="egress-gw-title">Egress Gateway를 통한 고정 소스 IP</title>
    <desc id="egress-gw-desc">보안 네임스페이스의 Pod들은 지정된 Egress Gateway 노드를 거쳐 고정된 소스 IP로 외부 서비스에 나가고, 일반 Pod는 직접 외부로 나가는 경로 차이를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Kubernetes Cluster -->
    <rect x="60" y="60" width="600" height="420" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="304" y="64" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="360" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KUBERNETES CLUSTER</text>

    <!-- Zone: Worker Nodes (nested) -->
    <rect x="88" y="112" width="220" height="336" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="150" y="116" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="198" y="125" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WORKER NODES</text>

    <!-- Zone: Egress Gateway Nodes (nested) -->
    <rect x="360" y="112" width="220" height="336" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="382" y="116" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="470" y="125" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EGRESS GATEWAY NODES</text>

    <!-- Arrows first -->
    <line x1="248" y1="172" x2="400" y2="172" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="248" y1="284" x2="400" y2="284" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Pod C direct -> External : elbow, exits zone right at y=396 fanned attach -->
    <path d="M 248,396 H 700 Q 708,396 708,388 V 172 Q 708,164 716,164 H 780"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- EG1 -> External -->
    <path d="M 528,172 H 700 Q 708,172 708,164 H 716 Q 724,164 732,164 H 780"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- EG2 -> External -->
    <path d="M 528,284 H 700 Q 708,284 708,276 V 200 Q 708,192 716,192 H 780"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="296" y="156" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="165" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">VIA EG</text>

    <rect x="296" y="268" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="277" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">VIA EG</text>

    <rect x="300" y="380" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="318" y="389" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">직접</text>

    <!-- Nodes: Worker Pods -->
    <rect x="108" y="148" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="178" y="170" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A</text>
    <text x="178" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ns: secure</text>

    <rect x="108" y="260" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="178" y="282" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B</text>
    <text x="178" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ns: secure</text>

    <rect x="108" y="372" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="178" y="394" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod C</text>
    <text x="178" y="408" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ns: default</text>

    <!-- Nodes: Egress Gateways (focal) -->
    <rect x="388" y="148" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="458" y="170" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Egress GW 1</text>
    <text x="458" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">203.0.113.10</text>

    <rect x="388" y="260" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="458" y="282" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Egress GW 2</text>
    <text x="458" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">203.0.113.11</text>

    <!-- Node: External -->
    <rect x="780" y="140" width="140" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="850" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">외부 서비스</text>
    <text x="850" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FW: .10-.11</text>
    <text x="850" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">만 허용</text>

    <!-- Legend -->
    <line x1="60" y1="524" x2="900" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="60" y="556" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="80" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Egress Gateway (고정 소스 IP)</text>

    <rect x="340" y="556" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="360" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Pod</text>

    <line x1="440" y1="561" x2="468" y2="561" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="476" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">직접 경로 (임의 소스 IP)</text>
  </svg>