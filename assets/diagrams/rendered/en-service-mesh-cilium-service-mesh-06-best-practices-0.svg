<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl0 desc0">
  <title id="ttl0">P99 latency: native routing vs. Cilium Service Mesh vs. Istio sidecar mesh</title>
  <desc id="desc0">Bar chart comparing P99 latency added by each networking mode: native pod-to-pod at 0.1 milliseconds, Cilium Service Mesh at 0.3 milliseconds, and Istio sidecar mesh at 2.5 milliseconds, showing Cilium's eBPF-based mesh stays close to native performance.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
  </defs>

  <rect width="960" height="600" fill="var(--paper)"/>

  <!-- Header -->
  <text x="40" y="44" fill="var(--soft)" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">BENCHMARK · P99 LATENCY</text>
  <text x="40" y="72" fill="var(--ink)" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Service mesh overhead comparison</text>
  <text x="40" y="94" fill="var(--muted)" font-size="12" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Added round-trip latency at the 99th percentile, single-hop pod-to-pod call</text>

  <!-- Plot area: left margin 120 (long value labels), bottom 140, top 140, right 80. viewBox 960x600 -->
  <!-- y-axis: 0 to 2.5ms mapped to y=460 (0) up to y=140 (2.5ms max) -->
  <!-- gridlines at 0, 0.5, 1.0, 1.5, 2.0, 2.5 -->
  <g font-family="'Geist Mono',monospace" font-size="8" fill="var(--soft)">
    <line x1="120" y1="460" x2="880" y2="460" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>
    <line x1="120" y1="396" x2="880" y2="396" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="120" y1="332" x2="880" y2="332" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="120" y1="268" x2="880" y2="268" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="120" y1="204" x2="880" y2="204" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="120" y1="140" x2="880" y2="140" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <text x="112" y="463" text-anchor="end">0.0</text>
    <text x="112" y="399" text-anchor="end">0.5</text>
    <text x="112" y="335" text-anchor="end">1.0</text>
    <text x="112" y="271" text-anchor="end">1.5</text>
    <text x="112" y="207" text-anchor="end">2.0</text>
    <text x="112" y="143" text-anchor="end">2.5ms</text>
    <line x1="120" y1="140" x2="120" y2="460" stroke="var(--rule-solid)" stroke-width="1"/>
  </g>

  <!-- Bars: pitch 240, bar width 140, 3 bars centered at 240, 480, 720 -->
  <!-- Native: 0.1ms -> height = 0.1/2.5*320 = 12.8 ~ 12 -->
  <rect x="170" y="448" width="140" height="12" fill="#ffffff"/>
  <rect x="170" y="448" width="140" height="12" fill="rgba(84,91,100,0.15)" stroke="var(--muted)" stroke-width="1"/>
  <text x="240" y="436" fill="var(--muted)" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">0.1ms</text>
  <text x="240" y="484" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Native</text>
  <text x="240" y="500" fill="var(--soft)" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">no proxy</text>

  <!-- Cilium SM: 0.3ms -> height = 0.3/2.5*320 = 38.4 ~ 38 (FOCAL) -->
  <rect x="410" y="422" width="140" height="38" fill="#ffffff"/>
  <rect x="410" y="422" width="140" height="38" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="480" y="410" fill="var(--accent)" font-size="8" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">0.3ms</text>
  <text x="480" y="484" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cilium SM</text>
  <text x="480" y="500" fill="var(--soft)" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">eBPF + Envoy</text>

  <!-- Istio: 2.5ms -> height = 320 -->
  <rect x="650" y="140" width="140" height="320" fill="#ffffff"/>
  <rect x="650" y="140" width="140" height="320" fill="rgba(84,91,100,0.15)" stroke="var(--muted)" stroke-width="1"/>
  <text x="720" y="128" fill="var(--muted)" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">2.5ms</text>
  <text x="720" y="484" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio</text>
  <text x="720" y="500" fill="var(--soft)" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">sidecar mesh</text>

  <!-- Legend / footer note -->
  <line x1="40" y1="540" x2="920" y2="540" stroke="var(--rule)" stroke-width="0.8"/>
  <text x="40" y="560" fill="var(--soft)" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">NOTE</text>
  <text x="40" y="578" fill="var(--muted)" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Cilium Service Mesh's kernel-level eBPF datapath keeps overhead an order of magnitude below a sidecar-proxy mesh.</text>
</svg>