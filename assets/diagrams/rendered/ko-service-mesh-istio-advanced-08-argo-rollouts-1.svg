<title id="ko-service-mesh-istio-advanced-08-argo-rollouts-1-title">Argo Rollouts와 Istio 통합 아키텍처</title>
<desc id="ko-service-mesh-istio-advanced-08-argo-rollouts-1-desc">ArgoCD가 배포한 Argo Rollouts 컨트롤러가 VirtualService 가중치와 Pod를 관리하며, Istiod가 데이터 플레인 설정을 동기화하고, Prometheus 메트릭을 AnalysisRun이 검증해 Rollouts에 성공/실패를 되돌려주는 흐름을 보여주는 아키텍처.</desc>
