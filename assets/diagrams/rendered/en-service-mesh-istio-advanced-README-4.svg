<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="keda-title keda-desc">
    <title id="keda-title">Metrics-based autoscaling loop with KEDA</title>
    <desc id="keda-desc">Envoy's metrics flow through Prometheus and CloudWatch to KEDA, which reads a ScaledObject policy and manages the HPA that scales the mesh service back up, closing the autoscaling loop.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="64" width="200" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="72" y="68" width="136" height="12" rx="2" fill="#ffffff"/>
    <text x="140" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ISTIO SERVICE MESH</text>

    <rect x="340" y="64" width="200" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="368" y="68" width="144" height="12" rx="2" fill="#ffffff"/>
    <text x="440" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBSERVABILITY STACK</text>

    <rect x="640" y="64" width="240" height="288" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="700" y="68" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="760" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">AUTOSCALING</text>

    <!-- Arrows before nodes -->
    <!-- Service -> Envoy (straight vertical) -->
    <line x1="140" y1="160" x2="140" y2="184" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Envoy -> Prometheus (elbow) -->
    <path d="M 216,205 H 282 Q 290,205 290,197 V 136 Q 290,128 298,128 H 364" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Envoy -> CloudWatch (straight, shared y) -->
    <line x1="216" y1="227" x2="364" y2="227" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Prometheus -> KEDA (elbow) -->
    <path d="M 516,128 H 582 Q 590,128 590,136 V 197 Q 590,205 598,205 H 664" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CloudWatch -> KEDA (straight, shared y) -->
    <line x1="516" y1="227" x2="664" y2="227" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- ScaledObject -> KEDA (straight vertical) -->
    <line x1="760" y1="160" x2="760" y2="184" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- KEDA -> HPA (straight vertical) -->
    <line x1="760" y1="248" x2="760" y2="272" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- HPA -> Service (long return, accent — closes the loop) -->
    <path d="M 760,336 V 452 Q 760,460 752,460 H 24 Q 16,460 16,452 V 136 Q 16,128 24,128 H 64"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels -->
    <rect x="256" y="145" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="282" y="154" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">METRICS</text>

    <rect x="238" y="209" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="264" y="218" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">METRICS</text>

    <rect x="564" y="145" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="584" y="154" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

    <rect x="538" y="209" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="558" y="218" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

    <rect x="726" y="164" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="750" y="173" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEFINE</text>

    <rect x="712" y="228" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="750" y="237" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CREATE/MANAGE</text>

    <rect x="352" y="440" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="370" y="449" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCALE</text>

    <!-- Node: Service (with Envoy) -->
    <rect x="64" y="96" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="96" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service</text>
    <text x="140" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">with envoy</text>

    <!-- Node: Envoy Proxy -->
    <rect x="64" y="184" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="184" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>
    <text x="140" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sidecar</text>

    <!-- Node: Prometheus -->
    <rect x="364" y="96" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="364" y="96" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="440" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
    <text x="440" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">metrics collection</text>

    <!-- Node: CloudWatch -->
    <rect x="364" y="184" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="364" y="184" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="440" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch</text>
    <text x="440" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aws metrics</text>

    <!-- Node: ScaledObject -->
    <rect x="664" y="96" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="664" y="96" width="192" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="760" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ScaledObject</text>
    <text x="760" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scaling policy</text>

    <!-- Node: KEDA (focal) -->
    <rect x="664" y="184" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="664" y="184" width="192" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="760" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">KEDA</text>
    <text x="760" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">operator</text>

    <!-- Node: HPA -->
    <rect x="664" y="272" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="664" y="272" width="192" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="760" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">HPA</text>
    <text x="760" y="316" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">controller</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="556" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">KEDA (focal orchestrator)</text>

    <line x1="272" y1="562" x2="300" y2="562" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="308" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Metrics / query</text>

    <line x1="452" y1="562" x2="480" y2="562" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="488" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Scaling action (closes loop)</text>
  </svg>