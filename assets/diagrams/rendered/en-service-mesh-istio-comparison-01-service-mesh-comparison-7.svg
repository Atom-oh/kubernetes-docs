<title id="en-service-mesh-istio-comparison-01-service-mesh-comparison-7-title">Policy Propagation Decision Flow</title>
<desc id="en-service-mesh-istio-comparison-01-service-mesh-comparison-7-desc">Flowchart showing how a kubectl-applied policy either goes to the Global Control Plane and syncs to every zone, or is stored locally in a single Zone Control Plane, before either path updates the zone&#x27;s data-plane proxies.</desc>
