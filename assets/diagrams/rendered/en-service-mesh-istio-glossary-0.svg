<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dsflow-title dsflow-desc">
      <title id="dsflow-title">Downstream in Sidecar Mode</title>
      <desc id="dsflow-desc">From the Envoy sidecar's perspective, the application sending the request is the downstream side and the backend service receiving it is the upstream side.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Arrows (drawn before boxes) -->
      <line x1="260" y1="300" x2="380" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="300" x2="700" y2="300" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="272" y="264" width="96" height="24" fill="#ffffff"/>
      <text x="320" y="273" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEND REQUEST</text>
      <text x="320" y="285" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DOWNSTREAM &#8594; ENVOY</text>

      <rect x="588" y="264" width="104" height="24" fill="#ffffff"/>
      <text x="640" y="273" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD REQUEST</text>
      <text x="640" y="285" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ENVOY &#8594; UPSTREAM</text>

      <!-- Node 1: Application (Downstream) -->
      <rect x="60" y="264" width="200" height="72" rx="6" fill="#ffffff"/>
      <rect x="60" y="264" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="160" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
      <text x="160" y="318" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">role: downstream</text>

      <!-- Node 2: Envoy Sidecar (focal) -->
      <rect x="380" y="264" width="200" height="72" rx="6" fill="#ffffff"/>
      <rect x="380" y="264" width="200" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="480" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>
      <text x="480" y="318" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">proxy: istio-proxy</text>

      <!-- Node 3: Backend Service (Upstream) -->
      <rect x="700" y="264" width="200" height="72" rx="6" fill="#ffffff"/>
      <rect x="700" y="264" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="800" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Backend Service</text>
      <text x="800" y="318" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">role: upstream</text>

      <!-- Legend -->
      <line x1="60" y1="500" x2="900" y2="500" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="60" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="60" y="532" width="24" height="12" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="92" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Application / backend</text>

      <rect x="300" y="532" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="332" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Envoy proxy (focal)</text>

      <line x1="540" y1="538" x2="568" y2="538" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="576" y="542" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Traffic toward upstream</text>
    </svg>