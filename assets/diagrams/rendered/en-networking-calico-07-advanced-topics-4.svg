<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calico-wg-ipsec-title calico-wg-ipsec-desc">
    <title id="calico-wg-ipsec-title">WireGuard versus IPsec comparison</title>
    <desc id="calico-wg-ipsec-desc">Side-by-side comparison of WireGuard and IPsec encryption on four traits: cryptography, code complexity, key exchange, and per-packet overhead.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- zones -->
    <rect x="40" y="100" width="400" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="48" y="104" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="84" y="113" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">WIREGUARD</text>

    <rect x="520" y="100" width="400" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="528" y="104" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="552" y="113" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">IPSEC</text>

    <!-- WireGuard boxes -->
    <rect x="60" y="140" width="360" height="72" rx="6" fill="#ffffff"/>
    <rect x="60" y="140" width="360" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="170" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Modern Crypto</text>
    <text x="240" y="186" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">ChaCha20-Poly1305</text>

    <rect x="60" y="228" width="360" height="72" rx="6" fill="#ffffff"/>
    <rect x="60" y="228" width="360" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="258" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Simple Code</text>
    <text x="240" y="274" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">~4,000 lines</text>

    <rect x="60" y="316" width="360" height="72" rx="6" fill="#ffffff"/>
    <rect x="60" y="316" width="360" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="346" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Fast Key Exchange</text>
    <text x="240" y="362" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Noise Protocol</text>

    <rect x="60" y="404" width="360" height="72" rx="6" fill="#ffffff"/>
    <rect x="60" y="404" width="360" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="434" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Low Overhead</text>
    <text x="240" y="450" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">~60 bytes / packet</text>

    <!-- IPsec boxes -->
    <rect x="540" y="140" width="360" height="72" rx="6" fill="#ffffff"/>
    <rect x="540" y="140" width="360" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="170" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Traditional Crypto</text>
    <text x="720" y="186" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">AES-GCM, 3DES</text>

    <rect x="540" y="228" width="360" height="72" rx="6" fill="#ffffff"/>
    <rect x="540" y="228" width="360" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="258" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Complex Code</text>
    <text x="720" y="274" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">100,000+ lines</text>

    <rect x="540" y="316" width="360" height="72" rx="6" fill="#ffffff"/>
    <rect x="540" y="316" width="360" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="346" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">IKE Key Exchange</text>
    <text x="720" y="362" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">IKEv1 / IKEv2</text>

    <rect x="540" y="404" width="360" height="72" rx="6" fill="#ffffff"/>
    <rect x="540" y="404" width="360" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="434" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Higher Overhead</text>
    <text x="720" y="450" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">~80-100 bytes / packet</text>
  </svg>