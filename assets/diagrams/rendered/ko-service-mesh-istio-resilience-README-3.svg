<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rp3-title rp3-desc" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">
    <title id="rp3-title">복원력 아키텍처</title>
    <desc id="rp3-desc">클라이언트 요청이 Gateway의 Rate Limiting을 지나 Outlier Detection으로 비정상 Pod A3를 제외하고 정상 Pod만 Service B로 전달하며, Zone Aware Routing이 같은 가용 영역으로 우선 라우팅하는 전체 복원력 아키텍처를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- zones (drawn first) -->
    <rect x="60" y="296" width="560" height="88" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="252" y="300" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="340" y="309" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE A</text>

    <rect x="60" y="416" width="360" height="88" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="192" y="420" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="280" y="429" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE B</text>

    <!-- arrows (before nodes) -->
    <!-- Client -> GW straight -->
    <line x1="300" y1="96" x2="300" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="316" y="108" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="332" y="117" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">요청</text>

    <!-- GW -> OD straight -->
    <line x1="300" y1="180" x2="300" y2="224" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="308" y="192" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="364" y="201" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">RATE 제한 통과</text>

    <!-- OD -> A1 elbow (accent, focal); jog at y=284, label above it with 8px gap -->
    <path d="M 260,264 V 276 Q 260,284 252,284 H 138 Q 130,284 130,292 V 328" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="150" y="264" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="194" y="273" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">정상 파드만</text>

    <!-- OD -> A2 straight vertical (A2 centered under OD); label to the left of the line, clear of A1/A3 jogs -->
    <line x1="300" y1="264" x2="300" y2="328" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="196" y="292" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="301" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">정상 파드만</text>

    <!-- OD -.-> A3 dashed elbow; jog at y=312, well clear of A2's line/label -->
    <path d="M 340,264 V 304 Q 340,312 348,312 H 522 Q 530,312 530,320 V 328" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="414" y="284" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="430" y="293" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">제외</text>

    <!-- A1 -> B1 elbow -->
    <path d="M 130,368 V 396 Q 130,404 138,404 H 142 Q 150,404 150,412 V 448" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="158" y="398" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="228" y="407" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">ZONE A → A 우선</text>

    <!-- A2 -> B2 elbow -->
    <path d="M 300,368 V 396 Q 300,404 308,404 H 342 Q 350,404 350,412 V 448" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="358" y="382" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="428" y="391" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">ZONE B → B 우선</text>

    <!-- RL -.-> GW straight (same y=160) -->
    <line x1="680" y1="160" x2="420" y2="160" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="500" y="140" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="516" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">적용</text>

    <!-- ZA -.-> B1 elbow (fan attach point 1 on ZA left edge) -->
    <path d="M 680,484 H 640 Q 632,484 632,492 V 524 Q 632,532 624,532 H 420" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- ZA -.-> B2 elbow (fan attach point 2 on ZA left edge, 16px below point 1) -->
    <path d="M 680,500 H 660 Q 652,500 652,508 V 516 Q 652,524 644,524 H 420" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="440" y="506" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="456" y="515" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">영향</text>

    <!-- nodes -->
    <!-- Client -->
    <rect x="240" y="56" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="240" y="56" width="120" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="300" y="80" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">클라이언트</text>

    <!-- GW -->
    <rect x="240" y="140" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="300" y="156" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Gateway</text>
    <text x="300" y="172" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Ingress</text>

    <!-- OD (focal) -->
    <rect x="228" y="224" width="144" height="40" rx="6" fill="#ffffff"/>
    <rect x="228" y="224" width="144" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="300" y="240" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Outlier Detection</text>
    <text x="300" y="256" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">A3 제외됨</text>

    <!-- A1 -->
    <rect x="80" y="328" width="100" height="40" rx="6" fill="#ffffff"/>
    <rect x="80" y="328" width="100" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="130" y="344" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod A1</text>
    <text x="130" y="360" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Zone A · 정상</text>

    <!-- A2 -->
    <rect x="250" y="328" width="100" height="40" rx="6" fill="#ffffff"/>
    <rect x="250" y="328" width="100" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="300" y="344" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod A2</text>
    <text x="300" y="360" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Zone B · 정상</text>

    <!-- A3 unhealthy -->
    <rect x="480" y="328" width="100" height="40" rx="6" fill="#ffffff"/>
    <rect x="480" y="328" width="100" height="40" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1"/>
    <text x="530" y="344" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod A3</text>
    <text x="530" y="360" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Zone A · 비정상</text>

    <!-- B1 -->
    <rect x="100" y="448" width="100" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="150" y="464" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod B1</text>
    <text x="150" y="480" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Zone A</text>

    <!-- B2 -->
    <rect x="300" y="448" width="100" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="350" y="464" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod B2</text>
    <text x="350" y="480" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Zone B</text>

    <!-- RL policy node -->
    <rect x="680" y="140" width="140" height="40" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="750" y="156" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Rate Limiting</text>
    <text x="750" y="172" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">100 req/s</text>

    <!-- ZA policy node -->
    <rect x="680" y="448" width="140" height="52" rx="6" fill="#ffffff" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="750" y="468" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Zone Aware</text>
    <text x="750" y="484" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">A → B 같은 Zone</text>

    <!-- legend -->
    <line x1="60" y1="548" x2="900" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="180" y1="560" x2="204" y2="560" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="212" y="564" fill="#545B64" font-size="9">정상 파드 라우팅</text>
    <line x1="380" y1="560" x2="404" y2="560" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="412" y="564" fill="#545B64" font-size="9">트래픽 흐름</text>
    <line x1="560" y1="560" x2="584" y2="560" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="592" y="564" fill="#545B64" font-size="9">정책 영향 / 제외</text>
  </svg>