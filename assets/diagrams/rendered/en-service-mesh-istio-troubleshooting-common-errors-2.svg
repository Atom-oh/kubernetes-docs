<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="mtlsmismatch-title mtlsmismatch-desc">
    <title id="mtlsmismatch-title">mTLS mode mismatch causing a 503</title>
    <desc id="mtlsmismatch-desc">Flowchart showing a client service in STRICT mTLS mode attempting an encrypted connection to a server service configured in DISABLE mode; the server demands a plaintext connection instead, and the mismatch surfaces to the client as a 503 upstream connect error.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#DD344C"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ================= ARROWS (drawn before boxes) ================= -->
    <!-- Client -> Server: mTLS connection attempt (solid, top lane) -->
    <path d="M 340 160 L 620 160" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Server -> Client: requires plaintext connection (dashed return, lower lane, offset from the arrow above) -->
    <path d="M 620 208 L 340 208" fill="none" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-danger)"/>

    <!-- Server -> Error: falls through to 503 (dashed, vertical) -->
    <path d="M 700 264 L 700 336" fill="none" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-danger)"/>

    <!-- ================= ARROW LABELS ================= -->
    <rect x="410" y="140" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="150" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">MTLS CONNECTION ATTEMPT</text>

    <rect x="410" y="216" width="150" height="12" rx="2" fill="#ffffff"/>
    <text x="485" y="226" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">REQUIRES PLAINTEXT CONN.</text>

    <rect x="712" y="290" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="756" y="300" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">FALLS THROUGH</text>

    <!-- ================= NODES ================= -->
    <!-- Client Service — STRICT -->
    <rect x="140" y="128" width="200" height="80" rx="6" fill="#ffffff"/>
    <rect x="140" y="128" width="200" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="152" y="140" width="52" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="178" y="150" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">CLIENT</text>
    <text x="240" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client Service</text>
    <text x="240" y="190" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PeerAuthentication: STRICT</text>

    <!-- Server Service — DISABLE (focal, at fault) -->
    <rect x="620" y="128" width="200" height="80" rx="6" fill="#ffffff"/>
    <rect x="620" y="128" width="200" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="632" y="140" width="52" height="14" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="658" y="150" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">SERVER</text>
    <text x="720" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Server Service</text>
    <text x="720" y="190" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DestinationRule tls: DISABLE</text>

    <!-- 503 Error (security/danger terminal) -->
    <rect x="620" y="336" width="200" height="80" rx="6" fill="rgba(221,52,76,0.05)"/>
    <rect x="620" y="336" width="200" height="80" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="4,4"/>
    <rect x="632" y="348" width="40" height="14" rx="2" fill="transparent" stroke="rgba(221,52,76,0.50)" stroke-width="0.8"/>
    <text x="652" y="358" fill="#DD344C" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">503</text>
    <text x="720" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">503 Error</text>
    <text x="720" y="398" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">upstream connect error</text>

    <!-- ================= LEGEND ================= -->
    <line x1="140" y1="480" x2="820" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="140" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="140" y="516" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="160" y="524" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Misconfigured node</text>

    <line x1="336" y1="520" x2="364" y2="520" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="372" y="524" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Connection attempt</text>

    <line x1="536" y1="520" x2="564" y2="520" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-danger)"/>
    <text x="572" y="524" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Rejected / error</text>

  </svg>