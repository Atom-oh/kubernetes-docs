<rect x="400" y="386" width="160" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="395" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">STATE/BRANCH/ERRORS</text>

