    <title id="dtitle">Configuration Management in Amazon EKS</title>
    <desc id="ddesc">Diagram showing Amazon EKS using native ConfigMaps and Secrets while also integrating AWS Secrets Manager, Parameter Store, AppConfig, KMS, and IAM, bridged into the cluster by tools like External Secrets Operator, ASCP, IRSA, and ACK that create or mount Secrets and grant Pods scoped AWS access.</desc>
