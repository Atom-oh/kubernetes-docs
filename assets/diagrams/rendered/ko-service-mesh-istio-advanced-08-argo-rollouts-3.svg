<title id="ko-service-mesh-istio-advanced-08-argo-rollouts-3-title">AnalysisRun 반복 측정과 판정 로직</title>
<desc id="ko-service-mesh-istio-advanced-08-argo-rollouts-3-desc">AnalysisRun이 30초마다 성공률을 반복 측정하며, 모든 측정이 통과하면 다음 단계로 진행하고 실패가 임계치(2회)에 도달하면 자동 롤백하는 판정 흐름도.</desc>
