<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mesh-phases-title mesh-phases-desc">
    <title id="mesh-phases-title">Gradual service mesh adoption</title>
    <desc id="mesh-phases-desc">Four-phase rollout moving from observability-only metric collection, to mTLS security, to canary traffic management, and finally to the full advanced feature set — each phase gated by validation.</desc><defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows -->
    <line x1="216" y1="272" x2="264" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="440" y1="272" x2="488" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="664" y1="272" x2="712" y2="272" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels (fit inside the 48px gap between boxes) -->
    <rect x="220" y="252" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="261" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DONE</text>
    <rect x="444" y="252" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="464" y="261" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DONE</text>
    <rect x="668" y="252" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="688" y="261" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DONE</text>

    <!-- Phase 1 -->
    <rect x="40" y="240" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="52" y="248" width="52" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="78" y="257" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHASE 1</text>
    <text x="128" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Observability</text>
    <text x="128" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">metric collection only</text>

    <!-- Phase 2 -->
    <rect x="264" y="240" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="276" y="248" width="52" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="302" y="257" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHASE 2</text>
    <text x="352" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Security</text>
    <text x="352" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">apply mTLS</text>

    <!-- Phase 3 -->
    <rect x="488" y="240" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="500" y="248" width="52" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="526" y="257" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHASE 3</text>
    <text x="576" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Traffic Mgmt</text>
    <text x="576" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">canary deployment</text>

    <!-- Phase 4 (focal) -->
    <rect x="712" y="240" width="208" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="724" y="248" width="52" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="750" y="257" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHASE 4</text>
    <text x="816" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Advanced Features</text>
    <text x="816" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">full feature set</text>

    <!-- Legend -->
    <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="488" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="140" y="480" width="24" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="172" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Rollout phase</text>
    <line x1="300" y1="486" x2="328" y2="486" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="336" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Final validated step</text>
    <rect x="500" y="480" width="24" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="532" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Full mesh capability</text>
  </svg>