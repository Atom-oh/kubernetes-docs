<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="hng-failover-title hng-failover-desc">
    <title id="hng-failover-title">Gateway leader failover to a standby pod</title>
    <desc id="hng-failover-desc">Sequence diagram showing the leader gateway pod failing to renew its Kubernetes lease, the standby pod acquiring the expired lease and becoming leader, then updating CiliumVTEPConfig and replacing the VPC route in parallel to complete failover in about fifteen to twenty-five seconds.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines. Centers: 96, 320, 544, 768 -->
    <line x1="96" y1="128" x2="96" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="320" y1="128" x2="320" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="544" y1="128" x2="544" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="768" y1="128" x2="768" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- M1: GW1 -x Lease (cannot renew — failed call, dashed muted, open marker style via short broken stroke) -->
    <path d="M 96 176 L 200 176" fill="none" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4"/>
    <line x1="204" y1="170" x2="216" y2="182" stroke="#545B64" stroke-width="1.4"/>
    <line x1="216" y1="170" x2="204" y2="182" stroke="#545B64" stroke-width="1.4"/>
    <rect x="112" y="160" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="176" y="169" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CANNOT RENEW</text>

    <!-- Note: node failure -->
    <rect x="20" y="188" width="152" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
    <text x="96" y="198" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Node failure /</text>
    <text x="96" y="208" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">pod crash</text>

    <!-- Note: lease expires -->
    <rect x="240" y="228" width="160" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
    <text x="320" y="238" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Lease expires after</text>
    <text x="320" y="248" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">leaseDuration (15s)</text>

    <!-- M2: GW2 -> Lease (acquire) -->
    <line x1="544" y1="276" x2="324" y2="276" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="380" y="260" width="132" height="12" rx="2" fill="#ffffff"/>
    <text x="446" y="269" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACQUIRE (RETRY 2S)</text>

    <!-- Note: new leader -->
    <rect x="468" y="292" width="152" height="24" rx="4" fill="rgba(255,153,0,0.05)" stroke="rgba(236,113,17,0.30)" stroke-width="0.8"/>
    <text x="544" y="302" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Becomes new leader</text>
    <text x="544" y="312" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">(GW2)</text>

    <!-- Parallel section frame -->
    <rect x="500" y="336" width="424" height="140" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <rect x="500" y="336" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="520" y="348" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PAR</text>
    <text x="512" y="368" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[VTEP update + route replace, concurrent]</text>

    <!-- M3: GW2 -> VTEP (par region 1) -->
    <line x1="544" y1="392" x2="764" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="588" y="376" width="132" height="12" rx="2" fill="#ffffff"/>
    <text x="654" y="385" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPDATE VTEPIPS</text>

    <!-- Note: BPF map update -->
    <rect x="608" y="404" width="200" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
    <text x="708" y="414" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Cilium agents update BPF</text>
    <text x="708" y="424" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">maps (1–5s)</text>

    <!-- M4: GW2 -> RT (par region 2, using GW2 lifeline to a labeled point since RT is 4th lifeline) -->
    <line x1="548" y1="452" x2="764" y2="452" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="588" y="436" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="658" y="445" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EC2:REPLACEROUTE</text>

    <!-- Note: failover complete -->
    <rect x="20" y="488" width="220" height="24" rx="4" fill="rgba(255,153,0,0.05)" stroke="rgba(236,113,17,0.30)" stroke-width="0.8"/>
    <text x="130" y="498" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Failover complete</text>
    <text x="130" y="508" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Total time: ~15–25s</text>

    <!-- Actor boxes -->
    <!-- Gateway Pod 1 (Leader) -->
    <rect x="24" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="24" y="72" width="144" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="32" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="48" y="89" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DOWN</text>
    <text x="96" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway Pod 1</text>
    <text x="96" y="119" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(leader)</text>

    <!-- Kubernetes Lease -->
    <rect x="248" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="248" y="72" width="144" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="256" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="270" y="89" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
    <text x="320" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes Lease</text>
    <text x="320" y="119" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">leader election</text>

    <!-- Gateway Pod 2 (Standby) — focal -->
    <rect x="472" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="472" y="72" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="480" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,113,17,0.50)" stroke-width="0.8"/>
    <text x="496" y="89" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
    <text x="544" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway Pod 2</text>
    <text x="544" y="119" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(standby → leader)</text>

    <!-- VTEP / Route Table (shared 4th lifeline) -->
    <rect x="696" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="696" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="704" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="718" y="89" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CFG</text>
    <text x="768" y="104" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VTEPConfig / VPC RT</text>
    <text x="768" y="119" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data-plane targets</text>

    <!-- Legend -->
    <line x1="24" y1="520" x2="944" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="24" y="548" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="44" y="556" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">New leader / focal</text>

    <line x1="200" y1="554" x2="228" y2="554" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="236" y="556" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Headline: lease acquired</text>

    <line x1="424" y1="554" x2="452" y2="554" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="460" y="556" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Config update</text>

    <line x1="600" y1="554" x2="628" y2="554" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="636" y="556" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Failed call</text>
  </svg>