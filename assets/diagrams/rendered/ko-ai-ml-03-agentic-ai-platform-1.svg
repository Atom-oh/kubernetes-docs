<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="d1-title d1-desc">
    <title id="d1-title">핵심 기술 과제와 해결 방안 매핑</title>
    <desc id="d1-desc">GPU 리소스 관리, 멀티 LLM 통합, 워크플로우 오케스트레이션, 실시간 비용 최적화라는 네 가지 핵심 기술 과제가 각각 Karpenter, LiteLLM, LangGraph, Langfuse 같은 구체적인 해결 도구로 이어지는 매핑을 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="8" width="288" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="112" y="16" width="144" height="12" rx="2" fill="#ffffff"/>
    <text x="184" y="25" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">핵심 기술 과제</text>

    <rect x="632" y="8" width="288" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="716" y="16" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="776" y="25" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">해결 방안</text>

    <!-- Arrows (behind boxes) -->
    <line x1="304" y1="64" x2="660" y2="64" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="304" y1="152" x2="660" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="304" y1="240" x2="660" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="304" y1="328" x2="660" y2="328" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="404" y="36" width="156" height="12" rx="2" fill="#ffffff"/>
    <text x="482" y="45" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">파편화 · 공유 · 스케줄링</text>

    <rect x="404" y="124" width="156" height="12" rx="2" fill="#ffffff"/>
    <text x="482" y="133" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">라우팅 · 폴백 · 로드밸런싱</text>

    <rect x="404" y="212" width="156" height="12" rx="2" fill="#ffffff"/>
    <text x="482" y="221" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">상태관리 · 분기 · 에러처리</text>

    <rect x="404" y="300" width="156" height="12" rx="2" fill="#ffffff"/>
    <text x="482" y="309" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">캐싱 · 배치 · 티어링</text>

    <!-- Left column: challenges -->
    <rect x="64" y="40" width="240" height="48" rx="6" fill="#ffffff"/>
    <rect x="64" y="40" width="240" height="48" rx="6" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="1"/>
    <text x="184" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">1. GPU 리소스 관리</text>

    <rect x="64" y="128" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="184" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">2. 멀티 LLM 통합</text>

    <rect x="64" y="216" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="184" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">3. 워크플로우 오케스트레이션</text>

    <rect x="64" y="304" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="184" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">4. 실시간 비용 최적화</text>

    <!-- Right column: solutions -->
    <rect x="660" y="40" width="240" height="48" rx="6" fill="#ffffff"/>
    <rect x="660" y="40" width="240" height="48" rx="6" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="1"/>
    <text x="780" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">MIG · Time-Slicing</text>
    <text x="780" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Karpenter</text>

    <rect x="660" y="128" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="148" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">LiteLLM</text>
    <text x="780" y="164" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Inference Gateway</text>

    <rect x="660" y="216" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">LangGraph</text>
    <text x="780" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Kagent</text>

    <rect x="660" y="304" width="240" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="324" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Langfuse</text>
    <text x="780" y="340" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Prompt Cache</text>

    <!-- Legend -->
    <line x1="40" y1="404" x2="920" y2="404" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="420" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="444" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">최우선 과제</text>

    <rect x="180" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="444" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">기술 과제 / 해결 도구</text>

    <line x1="380" y1="441" x2="408" y2="441" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="416" y="444" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">해결 매핑</text>
  </svg>
