<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sidecar-lifecycle-title sidecar-lifecycle-desc">
<title id="sidecar-lifecycle-title">Sidecar Container Lifecycle</title>
<desc id="sidecar-lifecycle-desc">Sequence diagram showing the kubelet starting two sidecar containers with restartPolicy Always, then an init container that must run to completion, then the main application container; on pod shutdown the kubelet terminates the main container first and the sidecars last, in reverse start order.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1D8102"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#DD344C"/></marker>

</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="80" y1="80" x2="80" y2="570" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="280" y1="80" x2="280" y2="570" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="480" y1="80" x2="480" y2="570" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="680" y1="80" x2="680" y2="570" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="880" y1="80" x2="880" y2="570" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="276" y="120" width="8" height="420" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="476" y="160" width="8" height="300" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="676" y="200" width="8" height="40" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="876" y="280" width="8" height="100" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<line x1="84" y1="120" x2="276" y2="120" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="120" y="100" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="180" y="109" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">START (restartPolicy: Always)</text>
<line x1="84" y1="160" x2="476" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="220" y="140" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="280" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">START (restartPolicy: Always)</text>
<line x1="84" y1="200" x2="676" y2="200" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="344" y="180" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="380" y="189" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">START INIT</text>
<line x1="676" y1="240" x2="84" y2="240" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="326" y="220" width="108" height="12" rx="2" fill="#ffffff"/>
<text x="380" y="229" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">EXIT 0 (success)</text>
<line x1="84" y1="280" x2="876" y2="280" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="444" y="260" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="269" fill="#EC7211" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">START MAIN</text>
<rect x="10" y="300" width="140" height="14" rx="2" fill="#ffffff"/>
<text x="80" y="310" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">POD SHUTDOWN</text>
<line x1="84" y1="340" x2="876" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="450" y="320" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="329" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">SIGTERM</text>
<line x1="876" y1="380" x2="84" y2="380" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="450" y="360" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="369" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">EXIT</text>
<line x1="84" y1="420" x2="476" y2="420" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="220" y="400" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="280" y="409" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">SIGTERM (reverse order)</text>
<line x1="476" y1="460" x2="84" y2="460" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="250" y="440" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="280" y="449" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">EXIT</text>
<line x1="84" y1="500" x2="276" y2="500" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="120" y="480" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="180" y="489" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">SIGTERM (reverse order)</text>
<line x1="276" y1="540" x2="84" y2="540" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="150" y="520" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="180" y="529" fill="#7D8998" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">EXIT</text>
<rect x="5" y="40" width="150" height="40" rx="6" fill="#ffffff"/>
<rect x="5" y="40" width="150" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="#232F3E" stroke-width="1"/>
<text x="80" y="65" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Kubelet</text>
<rect x="205" y="40" width="150" height="40" rx="6" fill="#ffffff"/>
<rect x="205" y="40" width="150" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="#232F3E" stroke-width="1"/>
<text x="280" y="65" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Sidecar 1 (envoy)</text>
<rect x="405" y="40" width="150" height="40" rx="6" fill="#ffffff"/>
<rect x="405" y="40" width="150" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="65" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Sidecar 2 (fluent-bit)</text>
<rect x="605" y="40" width="150" height="40" rx="6" fill="#ffffff"/>
<rect x="605" y="40" width="150" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="#232F3E" stroke-width="1"/>
<text x="680" y="65" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Init (migration)</text>
<rect x="805" y="40" width="150" height="40" rx="6" fill="#ffffff"/>
<rect x="805" y="40" width="150" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="#232F3E" stroke-width="1"/>
<text x="880" y="65" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Main (app)</text>
<text x="24" y="592" fill="#7D8998" font-size="9" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Sidecars start first and exit last (reverse order); the init container must exit before the main container starts.</text>
</svg>