<title id="eks-win-arch-title">Amazon EKS의 Windows 지원 아키텍처</title>
<desc id="eks-win-arch-desc">EKS 컨트롤 플레인이 Linux 노드 그룹과 Windows 노드 그룹을 함께 관리하며 AWS IAM·VPC·CloudWatch와 연동하고, Windows 애플리케이션 포드가 Elastic Load Balancer를 통해 사용자에게 서비스를 제공하는 구조를 보여준다.</desc>
