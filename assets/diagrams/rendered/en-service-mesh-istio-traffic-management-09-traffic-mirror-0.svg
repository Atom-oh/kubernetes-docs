<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="traffic-mirror-title traffic-mirror-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="traffic-mirror-title">Traffic mirroring between a live version and a shadow version</title>
    <desc id="traffic-mirror-desc">A client sends a request that Version 1 answers on the live path, while the same request is replicated to Version 2 in a shadow copy whose response is discarded and never reaches the client.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#7D8998"/>
      </marker>
    </defs>

    <!-- background -->
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- zones (bg, before arrows/nodes) -->
    <rect x="560" y="80" width="320" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="675" y="84" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">PRODUCTION</text>

    <rect x="560" y="380" width="320" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="630" y="384" width="180" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="393" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">SHADOW (MIRROR)</text>

    <!-- arrows (drawn before boxes) -->
    <!-- 1. REQUEST: Client -> V1 (live) -->
    <path d="M240,268 H372 Q380,268 380,260 V152 Q380,144 388,144 H620"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 2. RESPONSE: V1 -> Client (live) -->
    <path d="M620,176 H468 Q460,176 460,184 V276 Q460,284 452,284 H240"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 3. REPLICATE: Client -> V2 (mirrored, dashed) -->
    <path d="M240,316 H392 Q400,316 400,324 V436 Q400,444 408,444 H620"
          fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
    <!-- 4. IGNORED: V2 -> Client (mirrored response, discarded, dashed) -->
    <path d="M620,476 H448 Q440,476 440,468 V340 Q440,332 432,332 H240"
          fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>

    <!-- arrow labels (masked, gapped off the stroke) -->
    <rect x="390" y="200" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="420" y="209" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text>

    <rect x="392" y="224" width="66" height="12" rx="2" fill="#ffffff"/>
    <text x="425" y="233" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text>

    <rect x="410" y="374" width="66" height="12" rx="2" fill="#ffffff"/>
    <text x="443" y="383" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">REPLICATE</text>

    <rect x="382" y="398" width="54" height="12" rx="2" fill="#ffffff"/>
    <text x="409" y="407" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">IGNORED</text>

    <!-- nodes (drawn last, on top) -->
    <!-- Client (input treatment) -->
    <rect x="80" y="252" width="160" height="96" rx="6" fill="#ffffff"/>
    <rect x="80" y="252" width="160" height="96" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="88" y="258" width="32" height="12" rx="2" fill="transparent" stroke="#7D8998" stroke-width="0.8"/>
    <text x="104" y="267" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
    <text x="160" y="306" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
    <text x="160" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">sends one request</text>

    <!-- Version 1 (focal, accent) -->
    <rect x="620" y="124" width="200" height="72" rx="6" fill="#ffffff"/>
    <rect x="620" y="124" width="200" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="628" y="130" width="32" height="12" rx="2" fill="transparent" stroke="#EC7211" stroke-width="0.8"/>
    <text x="644" y="139" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">PROD</text>
    <text x="720" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Version 1</text>
    <text x="720" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">actual response</text>

    <!-- Version 2 (optional/shadow treatment) -->
    <rect x="620" y="424" width="200" height="72" rx="6" fill="#ffffff"/>
    <rect x="620" y="424" width="200" height="72" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="628" y="430" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="648" y="439" fill="rgba(35,47,62,0.60)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">MIRROR</text>
    <text x="720" y="464" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Version 2</text>
    <text x="720" y="480" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">response ignored</text>

    <!-- legend: horizontal strip -->
    <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="140" y1="552" x2="176" y2="552" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="184" y="556" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Live request / response</text>

    <line x1="420" y1="552" x2="456" y2="552" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
    <text x="464" y="556" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Mirrored copy / discarded</text>

    <circle cx="740" cy="552" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="752" y="556" fill="#545B64" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Serves the real client</text>
  </svg>