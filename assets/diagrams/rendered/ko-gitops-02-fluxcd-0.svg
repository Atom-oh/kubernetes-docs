<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fluxcd-flow-title fluxcd-flow-desc"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
  <title id="fluxcd-flow-title">FluxCD 리소스 흐름</title>
  <desc id="fluxcd-flow-desc">Git 리포지토리의 4가지 소스가 Source Controller로 모이고, Source Controller가 Kustomize Controller와 Helm Controller에 각각 매니페스트를 넘겨 Kubernetes 클러스터 리소스를 반영하며, Notification Controller가 세 컨트롤러의 상태를 감시하고 Image Automation Controller가 새 이미지 태그를 GitRepository에 커밋해 순환을 완성하는 GitOps 파이프라인을 보여준다.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="24" y="28" class="mono" fill="#7D8998" font-size="8" letter-spacing="0.18em">GITOPS PIPELINE</text>
  <text x="24" y="48" fill="#232F3E" font-size="20" font-weight="700">FluxCD 리소스 흐름</text>

  <!-- ===================== ZONES (drawn first) ===================== -->
  <!-- Zone 1: Git 소스 -->
  <rect x="24" y="64" width="180" height="368" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="36" y="68" width="76" height="12" rx="2" fill="#ffffff"/>
  <text x="74" y="77" fill="rgba(35,47,62,0.40)" class="mono" font-size="7" text-anchor="middle" letter-spacing="0.10em">GIT 소스</text>

  <!-- Zone 2: FluxCD 컨트롤러 -->
  <rect x="228" y="72" width="540" height="376" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="240" y="76" width="128" height="12" rx="2" fill="#ffffff"/>
  <text x="304" y="85" fill="rgba(35,47,62,0.40)" class="mono" font-size="7" text-anchor="middle" letter-spacing="0.10em">FLUXCD 컨트롤러</text>

  <!-- Zone 3: Kubernetes 클러스터 -->
  <rect x="792" y="192" width="144" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="800" y="196" width="128" height="12" rx="2" fill="#ffffff"/>
  <text x="864" y="205" fill="rgba(35,47,62,0.40)" class="mono" font-size="7" text-anchor="middle" letter-spacing="0.10em">K8S 클러스터</text>

  <!-- ===================== ARROWS (behind nodes) ===================== -->

  <!-- Zone1 -> SC (left edge fan-in), 4 sources, straight-ish elbows to SC left edge x=258 -->
  <!-- attach points on SC left edge (x=258,y=224-288): offsets 64/5*k -->
  <!-- GitRepository (y=124) -> SC attach y=237 -->
  <path d="M 192,124 H 224 Q 232,124 232,132 V 229 Q 232,237 240,237 H 258" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- HelmRepository (y=212) -> SC attach y=250 -->
  <path d="M 192,212 H 208 Q 216,212 216,220 V 242 Q 216,250 224,250 H 258" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- OCIRepository (y=300) -> SC attach y=263 -->
  <path d="M 192,300 H 208 Q 216,300 216,292 V 271 Q 216,263 224,263 H 258" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Bucket (y=388) -> SC attach y=276 -->
  <path d="M 192,388 H 224 Q 232,388 232,380 V 284 Q 232,276 240,276 H 258" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- IAC -> GitRepository (top-left, clear of SC entirely) -->
  <path d="M 258,132 H 220 Q 212,132 212,128 V 128 Q 212,124 204,124 H 192" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="209" y="104" width="44" height="12" rx="2" fill="#ffffff"/>
  <text x="231" y="113" fill="#7D8998" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.05em">TAG PUSH</text>

  <!-- SC -> KC (straight, same row y=245) -->
  <path d="M 402,245 H 426" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- SC -> HC (dip below KC via y=328 row) -->
  <path d="M 354,288 V 312 Q 354,320 362,320 H 634 Q 642,320 642,312 V 288" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- NC -> SC / KC / HC (fan out from NC top edge) -->
  <path d="M 462,376 V 300 Q 462,292 454,292 H 314 Q 306,292 306,288" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 498,376 V 288" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 534,376 V 352 Q 534,344 542,344 H 682 Q 690,344 690,336 V 288" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- crossing hop: NC->KC vertical (x=498) crosses SC->HC horizontal (y=320) -->
  <!-- redraw the crossing segment of SC->HC with a bump over x=498 -->
  <path d="M 490,320 a 8,8 0 0 1 16,0" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M 490,320 a 8,8 0 0 1 16,0" fill="none" stroke="#545B64" stroke-width="1"/>

  <!-- KC -> Cluster Resources (detour above HC to top edge) -->
  <path d="M 498,224 V 188 Q 498,180 506,180 H 856 Q 864,180 864,188 V 224" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- HC -> Cluster Resources (straight, same row) -->
  <path d="M 738,256 H 800" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- ===================== NODES ===================== -->

  <!-- Zone1 boxes -->
  <!-- GitRepository -->
  <rect x="32" y="96" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="32" y="96" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="112" y="120" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">GitRepository</text>
  <text x="112" y="136" fill="#545B64" class="mono" font-size="9" text-anchor="middle">git</text>

  <!-- HelmRepository -->
  <rect x="32" y="184" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="32" y="184" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="112" y="208" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">HelmRepository</text>
  <text x="112" y="224" fill="#545B64" class="mono" font-size="9" text-anchor="middle">helm</text>

  <!-- OCIRepository -->
  <rect x="32" y="272" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="32" y="272" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="112" y="296" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">OCIRepository</text>
  <text x="112" y="312" fill="#545B64" class="mono" font-size="9" text-anchor="middle">oci</text>

  <!-- Bucket -->
  <rect x="32" y="360" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="32" y="360" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="112" y="384" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Bucket</text>
  <text x="112" y="400" fill="#545B64" class="mono" font-size="9" text-anchor="middle">s3 / gcs</text>

  <!-- Image Automation Controller (top row) -->
  <rect x="258" y="104" width="144" height="56" rx="6" fill="rgba(35,47,62,0.02)"/>
  <rect x="258" y="104" width="144" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="330" y="127" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Image Automation</text>
  <text x="330" y="143" fill="#545B64" class="mono" font-size="9" text-anchor="middle">controller</text>

  <!-- Source Controller (focal) -->
  <rect x="258" y="224" width="144" height="64" rx="6" fill="#ffffff"/>
  <rect x="258" y="224" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="330" y="252" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Source Controller</text>
  <text x="330" y="268" fill="#545B64" class="mono" font-size="9" text-anchor="middle">reconcile:source</text>

  <!-- Kustomize Controller -->
  <rect x="426" y="224" width="144" height="64" rx="6" fill="#ffffff"/>
  <rect x="426" y="224" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="498" y="252" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Kustomize</text>
  <text x="498" y="268" fill="#545B64" class="mono" font-size="9" text-anchor="middle">controller</text>

  <!-- Helm Controller -->
  <rect x="594" y="224" width="144" height="64" rx="6" fill="#ffffff"/>
  <rect x="594" y="224" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="666" y="252" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Helm Controller</text>
  <text x="666" y="268" fill="#545B64" class="mono" font-size="9" text-anchor="middle">controller</text>

  <!-- Notification Controller (bottom row) -->
  <rect x="426" y="376" width="144" height="56" rx="6" fill="rgba(35,47,62,0.02)"/>
  <rect x="426" y="376" width="144" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="498" y="399" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Notification</text>
  <text x="498" y="415" fill="#545B64" class="mono" font-size="9" text-anchor="middle">controller</text>

  <!-- Cluster Resources -->
  <rect x="800" y="224" width="128" height="64" rx="6" fill="#ffffff"/>
  <rect x="800" y="224" width="128" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="864" y="250" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Cluster Resources</text>
  <text x="864" y="266" fill="#545B64" class="mono" font-size="8" text-anchor="middle">ns · deploy</text>
  <text x="864" y="277" fill="#545B64" class="mono" font-size="8" text-anchor="middle">svc · cm</text>

  <!-- ===================== Legend ===================== -->
  <line x1="24" y1="520" x2="936" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="24" y="536" fill="#545B64" class="mono" font-size="8" letter-spacing="0.14em">LEGEND</text>

  <line x1="140" y1="533" x2="168" y2="533" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="176" y="537" fill="#545B64" class="mono" font-size="8">매니페스트 반영 경로</text>

  <line x1="380" y1="533" x2="408" y2="533" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="416" y="537" fill="#545B64" class="mono" font-size="8">소스 가져오기</text>

  <line x1="560" y1="533" x2="588" y2="533" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="596" y="537" fill="#545B64" class="mono" font-size="8">상태 알림 / 이미지 업데이트</text>
</svg>