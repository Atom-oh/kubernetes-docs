<title id="win-k8s-arch-title">Kubernetes의 Windows 지원 아키텍처</title>
<desc id="win-k8s-arch-desc">Linux에서만 실행되는 컨트롤 플레인의 kube-apiserver가 Linux 워커 노드의 시스템 포드와 Windows 워커 노드의 kubelet·kube-proxy를 통해 Windows 컨테이너를 함께 관리하는 혼합 클러스터 구조를 보여준다.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
