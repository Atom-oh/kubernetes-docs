<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="xds-boot-title xds-boot-desc">
    <title id="xds-boot-title">Envoy의 xDS 부트스트랩과 구성 업데이트</title>
    <desc id="xds-boot-desc">파드가 시작되면 Envoy가 Istiod에 연결해 mTLS 인증 후 LDS·CDS·EDS·RDS·SDS 리소스를 순회 요청해 구성을 완료하고, 이후 Kubernetes API의 서비스 변경을 감지한 Istiod가 새 Endpoint를 Envoy에 푸시하는 흐름을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="160" y1="112" x2="160" y2="508" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="112" x2="480" y2="508" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="800" y1="112" x2="800" y2="508" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Note 1 -->
    <rect x="90" y="140" width="140" height="20" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
    <text x="160" y="153" fill="#232F3E" font-style="italic" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">파드 시작</text>

    <!-- Messages 1-2 -->
    <line x1="160" y1="180" x2="480" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="216" x2="160" y2="216" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <!-- LOOP fragment -->
    <rect x="148" y="252" width="344" height="116" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <rect x="148" y="252" width="48" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="172" y="264" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
    <text x="160" y="284" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">[LDS·CDS·EDS·RDS·SDS 순회]</text>
    <line x1="160" y1="308" x2="480" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="344" x2="160" y2="344" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <!-- Note 2 -->
    <rect x="70" y="384" width="180" height="20" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
    <text x="160" y="397" fill="#232F3E" font-style="italic" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">구성 완료 · 트래픽 준비</text>

    <!-- Messages 5-6 -->
    <line x1="800" y1="432" x2="480" y2="432" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="468" x2="160" y2="468" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Message labels -->
    <rect x="268" y="162" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="171" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">연결 (gRPC :15012)</text>

    <rect x="272" y="198" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="207" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">mTLS 인증</text>

    <rect x="272" y="290" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="299" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">리소스 요청</text>

    <rect x="272" y="326" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="335" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">리소스 반환</text>

    <rect x="588" y="414" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="423" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">Service 변경 감지</text>

    <rect x="268" y="450" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="459" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">EDS 푸시 (신규)</text>

    <!-- Actor: Envoy Proxy -->
    <rect x="88" y="56" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="88" y="56" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="96" y="64" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="112" y="73" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
    <text x="160" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>
    <text x="160" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sidecar</text>

    <!-- Actor: Istiod (focal) -->
    <rect x="408" y="56" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="408" y="56" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="416" y="64" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="432" y="73" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
    <text x="480" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istiod</text>
    <text x="480" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">xDS Server</text>

    <!-- Actor: Kubernetes API -->
    <rect x="728" y="56" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="728" y="56" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="736" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="750" y="73" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
    <text x="800" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes API</text>
    <text x="800" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">watch events</text>

    <!-- Legend -->
    <line x1="88" y1="528" x2="872" y2="528" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="88" y="544" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <line x1="88" y1="556" x2="116" y2="556" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="124" y="559" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">증분 EDS 푸시(headline)</text>
    <line x1="352" y1="556" x2="380" y2="556" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="388" y="559" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">응답 반환(return)</text>
  </svg>