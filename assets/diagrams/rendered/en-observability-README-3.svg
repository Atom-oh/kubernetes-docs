<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-title d3-desc">
      <title id="d3-title">OpenTelemetry instrumentation and collector pipeline</title>
      <desc id="d3-desc">Applications in any of four languages instrument via auto- or manual instrumentation, send data through the OpenTelemetry collector's receive, process, and export stages, and land in one of five observability backends.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>
      <rect width="960" height="600" fill="#ffffff"/>

      <!-- Zone: SDK -->
      <rect x="220" y="140" width="200" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="272" y="144" width="96" height="12" rx="2" fill="#ffffff"/>
      <text x="320" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">OTEL SDK</text>

      <!-- Zone: Collector (focal) -->
      <rect x="472" y="140" width="200" height="320" rx="8" fill="rgba(255,153,0,0.05)" stroke="#EC7211" stroke-width="0.8"/>
      <rect x="512" y="144" width="120" height="12" rx="2" fill="#ffffff"/>
      <text x="572" y="153" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">OTEL COLLECTOR</text>

      <!-- Arrows: Apps -> SDK -->
      <line x1="176" y1="300" x2="220" y2="220" stroke="#545B64" stroke-width="0" opacity="0"/>
      <path d="M 176,270 H 196 Q 204,270 204,262 V 236 Q 204,228 212,228 H 220"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 176,330 H 196 Q 204,330 204,338 V 364 Q 204,372 212,372 H 220"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- SDK -> Collector Receivers -->
      <path d="M 420,196 H 444 Q 452,196 452,204 V 268 Q 452,276 460,276 H 472"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 420,340 H 444 Q 452,340 452,332 V 300 Q 452,292 460,292 H 472"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Collector internal chain -->
      <line x1="572" y1="228" x2="572" y2="268" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="572" y1="332" x2="572" y2="372" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Collector -> Backends -->
      <line x1="672" y1="300" x2="732" y2="300" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="686" y="280" width="34" height="12" rx="2" fill="#ffffff"/>
      <text x="703" y="289" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">SEND</text>

      <!-- Node: Applications -->
      <g>
        <rect x="56" y="268" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="116" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Applications</text>
        <text x="116" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Java·Py·Node·Go</text>
      </g>

      <!-- Node: SDK instrumentation -->
      <g>
        <rect x="240" y="196" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="320" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Auto-instrumentation</text>
      </g>
      <g>
        <rect x="240" y="340" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="320" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Manual instrumentation</text>
      </g>

      <!-- Node: Collector stages -->
      <g>
        <rect x="492" y="196" width="160" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="572" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Receivers</text>
      </g>
      <g>
        <rect x="492" y="268" width="160" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="572" y="288" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Processors</text>
      </g>
      <g>
        <rect x="492" y="372" width="160" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="572" y="392" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Exporters</text>
      </g>

      <!-- Node: Backends -->
      <g>
        <rect x="732" y="268" width="180" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
        <text x="822" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Backends</text>
        <text x="822" y="312" fill="#EC7211" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Tempo·Prom·Loki·X-Ray·DD</text>
      </g>

      <!-- Legend -->
      <line x1="32" y1="490" x2="928" y2="490" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="32" y="506" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="32" y="516" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="52" y="524" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">Vendor-neutral hop</text>

      <line x1="230" y1="521" x2="258" y2="521" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="266" y="524" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">Telemetry flow</text>
    </svg>