<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gwapi-resmodel-title gwapi-resmodel-desc">
  <title id="gwapi-resmodel-title">Gateway API layered resource model</title>
  <desc id="gwapi-resmodel-desc">A GatewayClass provisioned by an infrastructure provider backs a Gateway load-balancer instance owned by a cluster operator, which application developers attach HTTPRoute, GRPCRoute, and TCP/TLS/UDP routes to, all forwarding traffic to backend services.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Zones (bg -> zones -> arrows -> nodes) -->
  <rect x="40" y="24" width="880" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="56" y="28" width="192" height="12" rx="2" fill="#ffffff"/>
  <text x="64" y="37" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">INFRASTRUCTURE PROVIDER</text>

  <rect x="40" y="164" width="880" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="56" y="168" width="150" height="12" rx="2" fill="#ffffff"/>
  <text x="64" y="177" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CLUSTER OPERATOR</text>

  <rect x="40" y="304" width="880" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="56" y="308" width="192" height="12" rx="2" fill="#ffffff"/>
  <text x="64" y="317" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">APPLICATION DEVELOPER</text>

  <rect x="40" y="444" width="880" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="56" y="448" width="90" height="12" rx="2" fill="#ffffff"/>
  <text x="64" y="457" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BACKEND</text>

  <!-- Arrows: GatewayClass -> Gateway (straight, shared x=480) -->
  <line x1="480" y1="112" x2="480" y2="196" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrows: Gateway -> HTTPRoute (fan attach x=430, bend y=264) -->
  <path d="M 430,252 V 256 Q 430,264 422,264 H 228 Q 220,264 220,272 V 336"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Arrows: Gateway -> GRPCRoute (straight, shared x=480) -->
  <line x1="480" y1="252" x2="480" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Arrows: Gateway -> L4 Routes (fan attach x=530, bend y=264) -->
  <path d="M 530,252 V 256 Q 530,264 538,264 H 732 Q 740,264 740,272 V 336"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrows: HTTPRoute -> Backend Services (fan attach x=380, bend y=408) -->
  <path d="M 220,392 V 396 Q 220,404 228,404 H 372 Q 380,404 380,412 V 476"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Arrows: GRPCRoute -> Backend Services (straight, shared x=480) -->
  <line x1="480" y1="392" x2="480" y2="476" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Arrows: L4 Routes -> Backend Services (fan attach x=580, bend y=408) -->
  <path d="M 740,392 V 396 Q 740,404 732,404 H 588 Q 580,404 580,412 V 476"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Node: GatewayClass -->
  <rect x="380" y="56" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="380" y="56" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="388" y="62" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="404" y="71" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
  <text x="480" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">GatewayClass</text>
  <text x="480" y="102" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gatewayClassName</text>

  <!-- Node: Gateway (focal) -->
  <rect x="380" y="196" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="380" y="196" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <rect x="388" y="202" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.60)" stroke-width="0.8"/>
  <text x="402" y="211" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LB</text>
  <text x="480" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway</text>
  <text x="480" y="242" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">listeners[]</text>

  <!-- Node: HTTPRoute -->
  <rect x="110" y="336" width="220" height="56" rx="6" fill="#ffffff"/>
  <rect x="110" y="336" width="220" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="118" y="342" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="132" y="351" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">L7</text>
  <text x="220" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">HTTPRoute</text>
  <text x="220" y="382" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hostnames + rules</text>

  <!-- Node: GRPCRoute -->
  <rect x="370" y="336" width="220" height="56" rx="6" fill="#ffffff"/>
  <rect x="370" y="336" width="220" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="378" y="342" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="392" y="351" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">L7</text>
  <text x="480" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">GRPCRoute</text>
  <text x="480" y="382" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">service methods</text>

  <!-- Node: L4 Routes (merged TCPRoute / TLSRoute / UDPRoute) -->
  <rect x="630" y="336" width="220" height="56" rx="6" fill="#ffffff"/>
  <rect x="630" y="336" width="220" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="638" y="342" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="652" y="351" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">L4</text>
  <text x="740" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">L4 Routes</text>
  <text x="740" y="382" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TCP &#183; TLS &#183; UDP</text>

  <!-- Node: Backend Services -->
  <rect x="280" y="476" width="400" height="56" rx="6" fill="#ffffff"/>
  <rect x="280" y="476" width="400" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="288" y="482" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="305" y="491" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SVC</text>
  <text x="480" y="508" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Backend Services</text>
  <text x="480" y="522" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Service A &#183; B &#183; C</text>
</svg>