<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc">
<title id="d2-title">Calico Policy 계층</title>
<desc id="d2-desc">GlobalNetworkPolicy, NetworkPolicy, HostEndpoint Policy가 클러스터 전체에서 네임스페이스, 노드 단위로 점차 범위가 좁아지는 3단계 정책 계층을 보여주는 다이어그램.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="d2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="d2-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone -->
<rect x="180" y="72" width="600" height="392" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="380" y="76" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">CALICO POLICY 계층</text>

<!-- Arrows (vertical, same x, straight lines) -->
<line x1="480" y1="188" x2="480" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
<line x1="480" y1="332" x2="480" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#d2-arrow)"/>

<!-- Arrow labels -->
<rect x="452" y="200" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="209" fill="#545B64" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">좁아짐</text>
<rect x="452" y="344" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="353" fill="#545B64" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">좁아짐</text>

<!-- Node: GlobalNetworkPolicy (focal) -->
<rect x="320" y="124" width="320" height="64" rx="6" fill="#ffffff"/>
<rect x="320" y="124" width="320" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<rect x="328" y="132" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="344" y="141" fill="#EC7211" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">GNP</text>
<text x="480" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">GlobalNetworkPolicy</text>
<text x="480" y="176" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">클러스터 전체</text>

<!-- Node: NetworkPolicy -->
<rect x="320" y="268" width="320" height="64" rx="6" fill="#ffffff"/>
<rect x="320" y="268" width="320" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="328" y="276" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="340" y="285" fill="#545B64" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">NP</text>
<text x="480" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">NetworkPolicy</text>
<text x="480" y="320" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">네임스페이스 범위</text>

<!-- Node: HostEndpoint Policy -->
<rect x="320" y="392" width="320" height="64" rx="6" fill="#ffffff"/>
<rect x="320" y="392" width="320" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<rect x="328" y="400" width="24" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
<text x="340" y="409" fill="#545B64" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">HP</text>
<text x="480" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">HostEndpoint Policy</text>
<text x="480" y="444" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">노드 보안</text>

<!-- Legend -->
<line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="516" fill="#545B64" font-size="8" font-family="var(--font-mono)" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="532" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="60" y="540" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">클러스터 범위 (focal)</text>
<rect x="240" y="532" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="260" y="540" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">네임스페이스 범위</text>
<rect x="440" y="532" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="460" y="540" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">노드 범위</text>
</svg>