  <rect x="524" y="260" width="132" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="590" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Exporters</text>
  <text x="590" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fan-out × 5</text>

  <!-- backend nodes -->
  <rect x="760" y="188" width="120" height="32" rx="6" fill="#ffffff"/>
  <rect x="760" y="188" width="120" height="32" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="820" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tempo</text>

  <rect x="760" y="236" width="120" height="32" rx="6" fill="#ffffff"/>
  <rect x="760" y="236" width="120" height="32" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="820" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>

  <rect x="760" y="284" width="120" height="32" rx="6" fill="#ffffff"/>
  <rect x="760" y="284" width="120" height="32" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
