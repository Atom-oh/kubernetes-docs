  <line x1="128" y1="300" x2="148" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="252" y1="300" x2="272" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="376" y1="300" x2="396" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="500" y1="300" x2="524" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

