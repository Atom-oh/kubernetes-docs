  <rect x="272" y="272" width="104" height="56" rx="6" fill="#ffffff"/>
  <rect x="272" y="272" width="104" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="324" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Receivers</text>

  <rect x="396" y="272" width="104" height="56" rx="6" fill="#ffffff"/>
  <rect x="396" y="272" width="104" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
