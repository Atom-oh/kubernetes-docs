<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="en-observability-tracing-03-opentelemetry-1-title en-observability-tracing-03-opentelemetry-1-desc">
  <title id="en-observability-tracing-03-opentelemetry-1-title">OpenTelemetry core data pipeline</title>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>
  <desc id="en-observability-tracing-03-opentelemetry-1-desc">Application code emits telemetry through the OTel API and SDK into a receive-process-export pipeline that fans out to five observability backends: Tempo, Prometheus, Loki, X-Ray, and Datadog.</desc>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- zones -->
  <rect x="4" y="240" width="260" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="12" y="244" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="48" y="253" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APP</text>

  <rect x="264" y="228" width="416" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="272" y="232" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="332" y="241" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA PIPELINE</text>

  <rect x="740" y="156" width="160" height="272" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="748" y="160" width="80" height="12" rx="2" fill="#ffffff"/>
  <text x="788" y="169" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BACKENDS</text>

