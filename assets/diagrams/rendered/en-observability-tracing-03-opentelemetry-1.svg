  <path d="M656,272 H660 Q668,272 668,264 V212 Q668,204 676,204 H760" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <path d="M656,288 H676 Q684,288 684,280 V260 Q684,252 692,252 H760" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="656" y1="300" x2="760" y2="300" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <path d="M656,312 H708 Q716,312 716,320 V340 Q716,348 724,348 H760" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <path d="M656,328 H724 Q732,328 732,336 V388 Q732,396 740,396 H760" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

