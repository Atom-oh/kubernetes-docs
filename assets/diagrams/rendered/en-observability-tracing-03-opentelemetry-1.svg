  <circle cx="220" cy="560" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="232" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FAN-OUT POINT</text>
  <circle cx="416" cy="560" r="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="428" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EXTERNAL BACKEND</text>

