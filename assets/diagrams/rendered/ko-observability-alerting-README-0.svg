<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="obs-alert-title obs-alert-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="obs-alert-title">관측성 3대 축에서 알림의 위치</title>
    <desc id="obs-alert-desc">메트릭, 로그, 트레이스라는 관측성의 세 데이터가 모두 알림 규칙으로 모이고, 이어서 알림 전송과 에스컬레이션으로 이어지는 흐름을 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zone 1: Observability -->
    <rect x="160" y="68" width="680" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="176" y="72" width="118" height="14" rx="2" fill="#ffffff"/>
    <text x="235" y="82" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OBSERVABILITY</text>

    <!-- Zone 2: Alerting -->
    <rect x="360" y="268" width="580" height="112" rx="8" fill="rgba(236,114,17,0.03)" stroke="rgba(236,114,17,0.16)" stroke-width="0.8"/>
    <rect x="376" y="272" width="80" height="14" rx="2" fill="#ffffff"/>
    <text x="416" y="282" fill="rgba(236,114,17,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALERTING</text>

    <!-- Arrows (before boxes) -->
    <!-- M -> A (elbow) -->
    <path d="M 280,164 V 224 Q 280,232 288,232 H 432 Q 440,232 440,240 V 300"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- L -> A (straight) -->
    <line x1="480" y1="164" x2="480" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- T -> A (elbow) -->
    <path d="M 680,164 V 224 Q 680,232 672,232 H 528 Q 520,232 520,240 V 300"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- A -> N (straight, accent) -->
    <line x1="560" y1="332" x2="600" y2="332" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- N -> E (straight) -->
    <line x1="760" y1="332" x2="800" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node M -->
    <rect x="200" y="100" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="200" y="100" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="280" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">메트릭</text>
    <text x="280" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Metrics</text>

    <!-- Node L -->
    <rect x="400" y="100" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="100" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">로그</text>
    <text x="480" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Logs</text>

    <!-- Node T -->
    <rect x="600" y="100" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="100" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="680" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">트레이스</text>
    <text x="680" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Traces</text>

    <!-- Node A (focal) -->
    <rect x="400" y="300" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="400" y="300" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="328" fill="#EC7211" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">알림 규칙</text>
    <text x="480" y="344" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Alert Rules</text>

    <!-- Node N -->
    <rect x="600" y="300" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="300" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="680" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">알림 전송</text>
    <text x="680" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Notifications</text>

    <!-- Node E -->
    <rect x="800" y="300" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="800" y="300" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="860" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">에스컬레이션</text>
    <text x="860" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Escalation</text>

    <!-- Legend -->
    <line x1="30" y1="452" x2="930" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="468" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="220" cy="464" r="5" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="232" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">데이터 소스 / 처리 단계</text>
    <circle cx="460" cy="464" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="472" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">알림의 중심 단계 (초점)</text>
  </svg>