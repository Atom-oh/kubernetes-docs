<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc">
    <title id="d2-title">Sequence of a canary-split request with Argo Rollouts</title>
    <desc id="d2-desc">Argo Rollouts sets the VirtualService weight to 90/10. A user request is forwarded by the Gateway to the VirtualService, which sends it to either the stable pod or the canary pod depending on the weighted split, and returns the response. The pod reports metrics that Rollouts uses to decide the next weight: progress toward 50% on success, or roll back to 0% on failure.</desc>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="100" y1="88" x2="100" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="290" y1="88" x2="290" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="88" x2="480" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="670" y1="88" x2="670" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="860" y1="88" x2="860" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Fragment frame (alt: 90% vs 10%) -->
    <rect x="400" y="204" width="360" height="158" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <rect x="400" y="204" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="420" y="216" text-anchor="middle" font-size="8" letter-spacing="0.12em" fill="#545B64" font-family="'Geist Mono',monospace">ALT</text>
    <text x="448" y="216" font-size="8" fill="#545B64" font-family="'Geist Mono',monospace">[stable 90%]</text>
    <line x1="408" y1="286" x2="752" y2="286" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="448" y="300" font-size="8" fill="#545B64" font-family="'Geist Mono',monospace">[canary 10%]</text>

    <!-- ===== Messages (before actor boxes so lines sit under boxes) ===== -->
    <!-- Rollouts -> VS : setWeight 10 -->
    <line x1="860" y1="120" x2="480" y2="120" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="600" y="104" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="656" y="113" text-anchor="middle" font-size="8" letter-spacing="0.04em" fill="#7D8998" font-family="'Geist Mono',monospace">setWeight: 10</text>

    <!-- User -> Gateway -->
    <line x1="100" y1="150" x2="290" y2="150" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="140" y="134" width="110" height="12" rx="2" fill="#ffffff"/>
    <text x="195" y="143" text-anchor="middle" font-size="8" letter-spacing="0.04em" fill="#7D8998" font-family="'Geist Mono',monospace">HTTP request</text>

    <!-- Gateway -> VS -->
    <line x1="290" y1="180" x2="480" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="340" y="164" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="385" y="173" text-anchor="middle" font-size="8" letter-spacing="0.04em" fill="#7D8998" font-family="'Geist Mono',monospace">forward</text>

    <!-- Region 1: VS -> Pod (stable), Pod -> VS (return, dashed) -->
    <line x1="480" y1="246" x2="670" y2="246" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="510" y="230" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="570" y="239" text-anchor="middle" font-size="8" letter-spacing="0.04em" fill="#7D8998" font-family="'Geist Mono',monospace">subset: stable</text>
    <line x1="670" y1="270" x2="480" y2="270" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="530" y="254" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="565" y="263" text-anchor="middle" font-size="8" letter-spacing="0.04em" fill="#7D8998" font-family="'Geist Mono',monospace">response</text>

    <!-- Region 2: VS -> Pod (canary), Pod -> VS (return, dashed) -->
    <line x1="480" y1="322" x2="670" y2="322" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="510" y="306" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="570" y="315" text-anchor="middle" font-size="8" letter-spacing="0.04em" fill="#7D8998" font-family="'Geist Mono',monospace">subset: canary</text>
    <line x1="670" y1="346" x2="480" y2="346" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="530" y="330" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="565" y="339" text-anchor="middle" font-size="8" letter-spacing="0.04em" fill="#7D8998" font-family="'Geist Mono',monospace">response</text>

    <!-- VS -> Gateway (return, dashed) -->
    <line x1="480" y1="390" x2="290" y2="390" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="345" y="374" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="380" y="383" text-anchor="middle" font-size="8" letter-spacing="0.04em" fill="#7D8998" font-family="'Geist Mono',monospace">response</text>

    <!-- Gateway -> User (headline success, accent) -->
    <line x1="290" y1="414" x2="100" y2="414" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="155" y="398" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="190" y="407" text-anchor="middle" font-size="8" letter-spacing="0.04em" fill="#EC7211" font-family="'Geist Mono',monospace">response</text>

    <!-- Pod -> Rollouts : metrics -->
    <line x1="670" y1="444" x2="860" y2="444" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="710" y="428" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="745" y="437" text-anchor="middle" font-size="8" letter-spacing="0.04em" fill="#7D8998" font-family="'Geist Mono',monospace">metrics</text>

    <!-- Rollouts -> VS : setWeight 50 -->
    <line x1="860" y1="474" x2="480" y2="474" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="600" y="458" width="130" height="12" rx="2" fill="#ffffff"/>
    <text x="665" y="467" text-anchor="middle" font-size="8" letter-spacing="0.04em" fill="#7D8998" font-family="'Geist Mono',monospace">setWeight: 50</text>

    <!-- Editorial note -->
    <text x="100" y="502" font-size="13" font-style="italic" fill="#545B64" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">On failure instead: setWeight 0 — automatic rollback to 100% stable.</text>

    <!-- Actor boxes -->
    <rect x="30" y="40" width="140" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="100" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">User</text>

    <rect x="220" y="40" width="140" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="290" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Istio Gateway</text>

    <rect x="410" y="40" width="140" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">VirtualService</text>

    <rect x="600" y="40" width="140" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="670" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Pod (v1 / v2)</text>

    <rect x="790" y="40" width="140" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="860" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Argo Rollouts</text>

    <!-- Legend -->
    <line x1="30" y1="536" x2="930" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="552" font-size="8" letter-spacing="0.14em" fill="#545B64" font-family="'Geist Mono',monospace">LEGEND</text>
    <line x1="150" y1="549" x2="178" y2="549" stroke="#545B64" stroke-width="1.2"/>
    <text x="186" y="552" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">call</text>
    <line x1="260" y1="549" x2="288" y2="549" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="296" y="552" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">return</text>
    <line x1="390" y1="549" x2="418" y2="549" stroke="#EC7211" stroke-width="1.4"/>
    <text x="426" y="552" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">headline response</text>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
  </svg>