<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gitops-loop-title gitops-loop-desc">
      <title id="gitops-loop-title">GitOps reconciliation loop</title>
      <desc id="gitops-loop-desc">Architecture diagram showing a developer pushing changes to Git, which a GitOps agent watches and reconciles into a Kubernetes cluster, while the cluster reports status back to the agent.</desc>
      <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zones (drawn before arrows/nodes) -->
      <rect x="232" y="216" width="144" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="252" y="220" width="104" height="12" rx="2" fill="#ffffff"/>
      <text x="304" y="229" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">SOURCE OF TRUTH</text>

      <rect x="416" y="216" width="296" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="500" y="220" width="128" height="12" rx="2" fill="#ffffff"/>
      <text x="564" y="229" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">GITOPS ENGINE</text>

      <rect x="768" y="216" width="144" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="782" y="220" width="116" height="12" rx="2" fill="#ffffff"/>
      <text x="840" y="229" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">TARGET ENVIRONMENT</text>

      <!-- Arrows (before boxes) -->
      <!-- Developer -> Git -->
      <path d="M 192,280 H 248" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="204" y="262" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="220" y="271" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH</text>

      <!-- Git -> Agent -->
      <path d="M 360,280 H 432" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="380" y="262" width="44" height="12" rx="2" fill="#ffffff"/>
      <text x="402" y="271" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WATCH</text>

      <!-- Agent -> Reconcile -->
      <path d="M 544,280 H 584" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="548" y="262" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="564" y="271" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DRIFT</text>

      <!-- Reconcile -> K8s -->
      <path d="M 696,280 H 784" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="708" y="262" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="740" y="271" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPLY</text>

      <!-- K8s -> Apps -->
      <path d="M 840,312 V 376" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- K8s -> Agent (report status, dashed transit above zones) -->
      <path d="M 840,216 V 186 Q 840,178 832,178 H 496 Q 488,178 488,186 V 216" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="596" y="158" width="136" height="12" rx="2" fill="#ffffff"/>
      <text x="664" y="167" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPORT STATUS</text>

      <!-- Nodes -->
      <!-- Developer (external/input) -->
      <rect x="80" y="248" width="112" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="0.8"/>
      <text x="136" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Developer</text>

      <!-- Git (store) -->
      <rect x="248" y="248" width="112" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="304" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Git</text>
      <text x="304" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Repository</text>

      <!-- Agent (backend) -->
      <rect x="432" y="248" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="488" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">GitOps</text>
      <text x="488" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Agent</text>

      <!-- Reconcile (focal) -->
      <rect x="584" y="248" width="112" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="640" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Reconciliation</text>
      <text x="640" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Loop</text>

      <!-- K8s (backend) -->
      <rect x="784" y="248" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="840" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes</text>
      <text x="840" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cluster</text>

      <!-- Apps (backend) -->
      <rect x="784" y="376" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="840" y="412" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Applications</text>

      <!-- Legend -->
      <line x1="80" y1="504" x2="912" y2="504" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="80" y="524" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="80" y="536" width="14" height="14" rx="3" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="0.8"/>
      <text x="102" y="547" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">EXTERNAL ACTOR</text>

      <rect x="280" y="536" width="14" height="14" rx="3" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="302" y="547" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">SOURCE STORE</text>

      <rect x="480" y="536" width="14" height="14" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="502" y="547" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">RUNTIME COMPONENT</text>

      <rect x="720" y="536" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="742" y="547" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">RECONCILE (FOCAL)</text>
    </svg>