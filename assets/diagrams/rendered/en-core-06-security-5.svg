<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">EKS AWS Security Integration</title>
<desc id="d">Six AWS security services — KMS, WAF, GuardDuty, IAM, Security Groups, and Secrets Manager — each integrate into a specific EKS mechanism and protect the API server, a worker node, or Pods inside the cluster.</desc>
<rect width="960" height="600" fill="#ffffff"/>

<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<text x="40" y="34" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CORE · SECURITY · AMAZON EKS</text>
<text x="40" y="58" fill="#232F3E" font-size="20" font-weight="700">EKS AWS Security Integration</text>

<!-- ===== Zones ===== -->
<rect x="40" y="88" width="280" height="392" rx="8" fill="rgba(255,153,0,0.03)" stroke="rgba(255,153,0,0.25)" stroke-width="0.8"/>
<rect x="88" y="92" width="184" height="12" rx="2" fill="#ffffff"/>
<text x="180" y="101" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">AWS SERVICE · INTEGRATION</text>

<rect x="660" y="88" width="260" height="392" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="740" y="92" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="790" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">EKS CLUSTER</text>

<!-- ===== Arrows (distinct mid-lanes: 420,440,460,480,500,520 — no shared paths) ===== -->
<!-- KMS -> API Server -->
<path d="M 300,156 H 412 Q 420,156 420,164 Q 420,172 428,172 H 700" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- WAF -> API Server -->
<path d="M 300,212 H 432 Q 440,212 440,204 V 196 Q 440,188 448,188 H 700" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- GuardDuty -> Worker Node (monitor, dashed/passive) -->
<path d="M 300,268 H 452 Q 460,268 460,276 V 280 Q 460,288 468,288 H 700" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<!-- IAM -> Pod (focal: IRSA) -->
<path d="M 300,324 H 472 Q 480,324 480,332 V 354 Q 480,362 488,362 H 700" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- Security Groups -> Pod (same y, straight line) -->
<line x1="300" y1="380" x2="700" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Secrets Manager -> Pod -->
<path d="M 300,436 H 512 Q 520,436 520,428 V 406 Q 520,398 528,398 H 700" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Arrow labels -->
<rect x="428" y="150" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="454" y="159" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ENCRYPT</text>

<rect x="448" y="176" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="472" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PROTECT</text>

<rect x="468" y="256" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="492" y="265" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">MONITOR</text>

<rect x="488" y="312" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="508" y="321" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">GRANT</text>

<rect x="470" y="368" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="494" y="377" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">RESTRICT</text>

<rect x="528" y="424" width="44" height="12" rx="2" fill="#ffffff"/>
<text x="550" y="433" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SUPPLY</text>

<!-- ===== Nodes: AWS Service -> Integration ===== -->
<g>
<rect x="60" y="136" width="240" height="40" rx="6" fill="#ffffff"/>
<rect x="60" y="136" width="240" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="180" y="154" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">AWS KMS</text>
<text x="180" y="168" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">→ Kubernetes Secret Encryption</text>

<rect x="60" y="192" width="240" height="40" rx="6" fill="#ffffff"/>
<rect x="60" y="192" width="240" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="180" y="210" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">AWS WAF</text>
<text x="180" y="224" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">→ ALB Integration</text>

<rect x="60" y="248" width="240" height="40" rx="6" fill="#ffffff"/>
<rect x="60" y="248" width="240" height="40" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="180" y="266" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">AWS GuardDuty</text>
<text x="180" y="280" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">→ EKS Threat Detection</text>

<rect x="60" y="304" width="240" height="40" rx="6" fill="#ffffff"/>
<rect x="60" y="304" width="240" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="180" y="322" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">AWS IAM</text>
<text x="180" y="336" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">→ IAM Roles for Service Accounts</text>

<rect x="60" y="360" width="240" height="40" rx="6" fill="#ffffff"/>
<rect x="60" y="360" width="240" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="180" y="378" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">AWS Security Groups</text>
<text x="180" y="392" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">→ Pod Security Groups</text>

<rect x="60" y="416" width="240" height="40" rx="6" fill="#ffffff"/>
<rect x="60" y="416" width="240" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="180" y="434" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">AWS Secrets Manager</text>
<text x="180" y="448" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">→ External Secrets Operator</text>

<!-- ===== Nodes: EKS Cluster components ===== -->
<rect x="700" y="152" width="180" height="56" rx="6" fill="#ffffff"/>
<rect x="700" y="152" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="790" y="176" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API Server</text>
<text x="790" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">encrypted + protected</text>

<rect x="700" y="260" width="180" height="56" rx="6" fill="#ffffff"/>
<rect x="700" y="260" width="180" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="790" y="284" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Worker Node</text>
<text x="790" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">runtime monitored</text>

<rect x="700" y="344" width="180" height="72" rx="6" fill="#ffffff"/>
<rect x="700" y="344" width="180" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="790" y="368" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod</text>
<text x="790" y="384" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">permissions + network</text>
<text x="790" y="398" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">+ secrets</text>
</g>
</svg>