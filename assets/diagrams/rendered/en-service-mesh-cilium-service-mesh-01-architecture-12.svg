<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-service-mesh-cilium-service-mesh-01-architecture-12-title en-service-mesh-cilium-service-mesh-01-architecture-12-desc">
      <title id="en-service-mesh-cilium-service-mesh-01-architecture-12-title">Full L7 request/response detour through Node Envoy</title>
      <desc id="en-service-mesh-cilium-service-mesh-01-architecture-12-desc">Sequence diagram showing a client request that requires L7 policy enforcement being redirected by the client-side eBPF hook to the node Envoy proxy, forwarded to the server through the server-side eBPF hook, and the response taking the same detour back through Envoy to the client.</desc>
