<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cwa0-title cwa0-desc">
    <title id="cwa0-title">CloudWatch Alarms Operation Flow</title>
    <desc id="cwa0-desc">Metrics from EC2, EKS, RDS, Lambda, and custom sources feed CloudWatch Metrics, which alarms evaluate directly or via metric math and anomaly detection bands; triggered alarms fan out to SNS and other actions, and SNS forwards to notification channels.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="cwa0-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="cwa0-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ ARROWS (drawn before boxes) ============ -->
    <g fill="none" stroke="#545B64" stroke-width="1.2">
      <!-- E1 Sources -> Metrics -->
      <path d="M 180,300 H 204" marker-end="url(#cwa0-arrow)"/>
      <!-- E2 Metrics -> Metrics Math -->
      <path d="M 324,288 H 328 Q 336,288 336,280 V 188 Q 336,180 344,180 H 348" marker-end="url(#cwa0-arrow)"/>
      <!-- E4 Metrics -> Anomaly Detection -->
      <path d="M 324,312 H 328 Q 336,312 336,320 V 412 Q 336,420 344,420 H 348" marker-end="url(#cwa0-arrow)"/>
      <!-- E3 Metrics -> Alarms (direct) -->
      <path d="M 324,300 H 492" marker-end="url(#cwa0-arrow-accent)" stroke="#EC7211"/>
      <!-- E5 Metrics Math -> Alarms -->
      <path d="M 468,180 H 472 Q 480,180 480,188 V 280 Q 480,288 488,288 H 492" marker-end="url(#cwa0-arrow)"/>
      <!-- E6 Anomaly Detection -> Alarms -->
      <path d="M 468,420 H 472 Q 480,420 480,412 V 320 Q 480,312 488,312 H 492" marker-end="url(#cwa0-arrow)"/>
      <!-- E7 Alarms -> SNS Topic -->
      <path d="M 612,292 H 616 Q 624,292 624,284 V 188 Q 624,180 632,180 H 636" marker-end="url(#cwa0-arrow)"/>
      <!-- E8 Alarms -> Other Actions -->
      <path d="M 612,308 H 616 Q 624,308 624,316 V 412 Q 624,420 632,420 H 636" marker-end="url(#cwa0-arrow)"/>
      <!-- E9 SNS Topic -> Notification Channels -->
      <path d="M 756,180 H 760 Q 768,180 768,188 V 292 Q 768,300 776,300 H 780" marker-end="url(#cwa0-arrow)"/>
    </g>

    <!-- ============ NODES ============ -->
    <!-- Metric Sources (grouped, external) -->
    <g>
      <rect x="28" y="268" width="152" height="64" rx="6" fill="#ffffff"/>
      <rect x="28" y="268" width="152" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="104" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metric Sources</text>
      <text x="104" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">EC2 · EKS · RDS</text>
      <text x="104" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Lambda · Custom</text>
    </g>

    <!-- Metrics -->
    <g>
      <rect x="204" y="276" width="120" height="48" rx="6" fill="#ffffff"/>
      <rect x="204" y="276" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="264" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics</text>
    </g>

    <!-- Metrics Math -->
    <g>
      <rect x="348" y="156" width="120" height="48" rx="6" fill="#ffffff"/>
      <rect x="348" y="156" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="408" y="184" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics Math</text>
    </g>

    <!-- Anomaly Detection -->
    <g>
      <rect x="348" y="396" width="120" height="48" rx="6" fill="#ffffff"/>
      <rect x="348" y="396" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="408" y="424" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Anomaly Detection</text>
    </g>

    <!-- Alarms (FOCAL) -->
    <g>
      <rect x="492" y="276" width="120" height="48" rx="6" fill="#ffffff"/>
      <rect x="492" y="276" width="120" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="552" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Alarms</text>
    </g>

    <!-- SNS Topic -->
    <g>
      <rect x="636" y="156" width="120" height="48" rx="6" fill="#ffffff"/>
      <rect x="636" y="156" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="696" y="184" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SNS Topic</text>
    </g>

    <!-- Other Actions -->
    <g>
      <rect x="636" y="396" width="120" height="48" rx="6" fill="#ffffff"/>
      <rect x="636" y="396" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="696" y="420" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Other Actions</text>
      <text x="696" y="434" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Scaling · EC2 · SSM</text>
    </g>

    <!-- Notification Channels (grouped, external) -->
    <g>
      <rect x="780" y="268" width="152" height="64" rx="6" fill="#ffffff"/>
      <rect x="780" y="268" width="152" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="856" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Notification Channels</text>
      <text x="856" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Email · SMS</text>
      <text x="856" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Lambda · HTTP/HTTPS</text>
    </g>
  </svg>