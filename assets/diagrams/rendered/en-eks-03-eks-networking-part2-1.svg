<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">AWS Load Balancer Integration</title>
<desc id="d">Users reach a Classic, Network, or Application Load Balancer; the CLB and NLB attach directly to a LoadBalancer Service, while the ALB routes through an Ingress resource to a NodePort Service, and both services forward traffic into the cluster's pods.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<text x="40" y="44" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">ARCHITECTURE · TRAFFIC PATH</text>
<text x="40" y="68" fill="#232F3E" font-size="20" font-weight="700">AWS Load Balancer Integration</text>

<!-- zones: AWS Cloud outer, Load Balancers, EKS Cluster -->
<rect x="248" y="96" width="672" height="464" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="272" y="104" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="316" y="113" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">AWS CLOUD</text>

<rect x="288" y="140" width="600" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="312" y="148" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="376" y="157" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">LOAD BALANCERS</text>

<rect x="288" y="296" width="600" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="312" y="304" width="104" height="12" rx="2" fill="#ffffff"/>
<text x="364" y="313" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">EKS CLUSTER</text>

<!-- Users node outside AWS Cloud -->
<rect x="48" y="264" width="152" height="72" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="124" y="294" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Users</text>
<text x="124" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">internet</text>

<!-- LB row: CLB, NLB, ALB -->
<rect x="316" y="168" width="152" height="64" rx="6" fill="#ffffff" stroke="#EC7211" stroke-width="1"/>
<rect x="316" y="168" width="152" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="392" y="196" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">CLB</text>
<text x="392" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Classic LB</text>

<rect x="500" y="168" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="576" y="196" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">NLB</text>
<text x="576" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Network LB</text>

<rect x="684" y="168" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="760" y="196" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">ALB</text>
<text x="760" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Application LB</text>

<!-- services row -->
<rect x="316" y="332" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="392" y="356" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service 1</text>
<text x="392" y="374" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">type: LoadBalancer</text>

<rect x="500" y="332" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="576" y="356" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service 2</text>
<text x="576" y="374" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">type: NodePort</text>

<rect x="684" y="332" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="760" y="356" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Ingress</text>
<text x="760" y="374" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">resource</text>

<!-- pods row (collapsed Pod1/2/3) -->
<rect x="408" y="460" width="152" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="484" y="484" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pods</text>
<text x="484" y="502" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">pod-1 · pod-2 · pod-3</text>

<!-- arrows: Users -> CLB/NLB/ALB -->
<path d="M 200,300 H 258 Q 266,300 266,292 V 208 Q 266,200 274,200 H 316" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 200,300 H 480 V 232" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 200,296 H 264 Q 272,296 272,304 V 380 Q 272,388 280,388 H 400 Q 408,388 408,380 V 232" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- CLB -> Service1, NLB -> Service1, ALB -> Ingress -->
<path d="M 392,232 V 332" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 560,232 Q 560,240 552,240 H 420 Q 412,240 412,248 V 332" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 760,232 V 332" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Ingress -> Service2 -->
<path d="M 700,364 H 668" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Service1 -> Pods, Service2 -> Pods -->
<path d="M 392,396 V 420 Q 392,428 400,428 H 452 Q 460,428 460,436 V 460" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 576,396 V 420 Q 576,428 568,428 H 516 Q 508,428 508,436 V 460" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- legend -->
<line x1="40" y1="562" x2="920" y2="562" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="150" y1="577" x2="180" y2="577" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="188" y="580" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">CLB PATH (DEFAULT)</text>
<line x1="380" y1="577" x2="410" y2="577" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="418" y="580" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">NLB / ALB PATH</text>

</svg>