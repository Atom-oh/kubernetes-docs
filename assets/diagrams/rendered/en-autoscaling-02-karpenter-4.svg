<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="karpcmp-title karpcmp-desc">
    <title id="karpcmp-title">Cluster Autoscaler vs. Karpenter</title>
    <desc id="karpcmp-desc">Comparison tree showing Cluster Autoscaler's node-group-based approach yielding medium cost savings, against Karpenter's workload-based approach with faster scaling, consolidation, and Spot use yielding high cost savings.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Arrows (before nodes) -->
    <line x1="200" y1="176" x2="200" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="200" y1="376" x2="200" y2="408" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="760" y1="176" x2="760" y2="208" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="760" y1="416" x2="760" y2="440" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- CA hub -->
    <rect x="80" y="112" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="150" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cluster Autoscaler</text>

    <!-- CA list -->
    <rect x="80" y="208" width="240" height="168" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="100" y="228" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STRATEGY</text>
    <circle cx="104" cy="248" r="2" fill="#545B64"/>
    <text x="112" y="252" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Node group-based scaling</text>
    <circle cx="104" cy="276" r="2" fill="#545B64"/>
    <text x="112" y="280" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Same instance types</text>
    <circle cx="104" cy="304" r="2" fill="#545B64"/>
    <text x="112" y="308" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Slow scaling speed</text>
    <circle cx="104" cy="332" r="2" fill="#545B64"/>
    <text x="112" y="336" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Limited bin packing</text>

    <!-- CA cost -->
    <rect x="80" y="408" width="240" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
    <text x="200" y="432" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cost Savings</text>
    <text x="200" y="450" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MEDIUM</text>

    <!-- KA hub (focal) -->
    <rect x="640" y="112" width="240" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="760" y="150" fill="#232F3E" font-size="14" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Karpenter</text>

    <!-- KA list -->
    <rect x="640" y="208" width="240" height="208" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="660" y="228" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STRATEGY</text>
    <circle cx="664" cy="248" r="2" fill="#545B64"/>
    <text x="672" y="252" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Workload-based scaling</text>
    <circle cx="664" cy="276" r="2" fill="#545B64"/>
    <text x="672" y="280" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Diverse instance types</text>
    <circle cx="664" cy="304" r="2" fill="#545B64"/>
    <text x="672" y="308" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Fast scaling speed</text>
    <circle cx="664" cy="332" r="2" fill="#545B64"/>
    <text x="672" y="336" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Efficient bin packing</text>
    <circle cx="664" cy="360" r="2" fill="#545B64"/>
    <text x="672" y="364" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Node consolidation</text>
    <circle cx="664" cy="388" r="2" fill="#545B64"/>
    <text x="672" y="392" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Spot instance utilization</text>

    <!-- KA cost -->
    <rect x="640" y="440" width="240" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="rgba(236,114,17,0.50)" stroke-width="1"/>
    <text x="760" y="464" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cost Savings</text>
    <text x="760" y="482" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HIGH</text>

    <!-- Legend -->
    <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="140" y="530" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="162" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">RECOMMENDED APPROACH</text>
  </svg>