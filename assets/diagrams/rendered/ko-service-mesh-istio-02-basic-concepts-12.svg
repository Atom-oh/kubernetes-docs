<title id="dtitle">VM 워크로드 등록 아키텍처</title>
<desc id="ddesc">VM의 Envoy Sidecar와 Kubernetes 파드의 Envoy Sidecar가 istiod로부터 동일하게 xDS 구성과 인증서를 받아 mTLS로 통신하는 아키텍처</desc>
