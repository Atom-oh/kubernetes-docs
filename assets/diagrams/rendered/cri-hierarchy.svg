    <title id="ko-core-01-cluster-architecture-1-title">컨테이너 런타임 계층 구조</title>
    <desc id="ko-core-01-cluster-architecture-1-desc">Kubernetes가 CRI(Container Runtime Interface)를 통해 containerd와 CRI-O 같은 컨테이너 런타임을 호출하고, 이들이 각각 runc와 crun을 사용해 컨테이너를 실행하는 계층 구조를 보여준다.</desc>
