<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ko-net-cilium-l2l7-osi-title ko-net-cilium-l2l7-osi-desc">
<title id="ko-net-cilium-l2l7-osi-title">OSI 7계층 모델과 Cilium 기능 매핑</title>
<desc id="ko-net-cilium-l2l7-osi-desc">OSI 모델의 각 계층별 데이터 단위와 주소 체계를 보여주고, Cilium이 L2·L3·L4·L7 계층에서 제공하는 네트워킹 기능을 매핑한 레이어 스택 다이어그램입니다.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;}
    .mono{font-family:'Geist Mono','Amazon Ember Mono',ui-monospace,monospace;}
  </style>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Eyebrow + title -->
<text x="60" y="36" class="mono" font-size="8" font-weight="500" fill="#7D8998" letter-spacing="0.18em">OSI 7-LAYER STACK</text>
<text x="60" y="60" font-size="20" font-weight="700" fill="#232F3E">OSI 모델 계층과 Cilium 기능 매핑</text>

<!-- Direction indicators (left margin) -->
<text x="8" y="124" class="mono" font-size="8" fill="#7D8998">↑ 추상화</text>
<text x="8" y="484" class="mono" font-size="8" fill="#7D8998">↓ 패킷 흐름</text>

<!-- Column headers -->
<text x="140" y="80" class="mono" font-size="8" font-weight="500" fill="#7D8998" letter-spacing="0.14em">계층</text>
<text x="560" y="80" class="mono" font-size="8" font-weight="500" fill="#7D8998" letter-spacing="0.14em">데이터 단위 · 주소</text>
<text x="740" y="80" class="mono" font-size="8" font-weight="500" fill="#7D8998" letter-spacing="0.14em">CILIUM 기능</text>

<!-- Row 0: L7 (focal) -->
<rect x="60" y="88" width="840" height="72" rx="0" fill="#EC7211" fill-opacity="0.10" stroke="#EC7211" stroke-width="1.2"/>
<text x="140" y="128" font-size="16" font-weight="600" fill="#232F3E">7 · 응용 계층 (Application)</text>
<text x="560" y="128" class="mono" font-size="9" fill="#545B64">메시지 · URL/URI</text>
<rect x="740" y="112" width="140" height="24" rx="4" fill="#EC7211" fill-opacity="0.10" stroke="#EC7211" stroke-width="1"/>
<text x="810" y="128" class="mono" font-size="8" fill="#EC7211" text-anchor="middle">L7: HTTP/gRPC/Kafka</text>

<!-- Row 1: L5-6 -->
<rect x="60" y="160" width="840" height="72" fill="#ffffff" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
<text x="140" y="200" font-size="16" font-weight="600" fill="#232F3E">5–6 · 세션/표현 계층 (Session/Presentation)</text>
<text x="560" y="200" class="mono" font-size="9" fill="#545B64">데이터</text>

<!-- Row 2: L4 -->
<rect x="60" y="232" width="840" height="72" fill="#ffffff" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
<text x="140" y="272" font-size="16" font-weight="600" fill="#232F3E">4 · 전송 계층 (Transport)</text>
<text x="560" y="272" class="mono" font-size="9" fill="#545B64">세그먼트 · 포트</text>
<rect x="740" y="256" width="140" height="24" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
<text x="810" y="272" class="mono" font-size="8" fill="#545B64" text-anchor="middle">L4: 포트 필터링</text>

<!-- Row 3: L3 -->
<rect x="60" y="304" width="840" height="72" fill="#ffffff" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
<text x="140" y="344" font-size="16" font-weight="600" fill="#232F3E">3 · 네트워크 계층 (Network)</text>
<text x="560" y="344" class="mono" font-size="9" fill="#545B64">패킷 · IP 주소</text>
<rect x="740" y="328" width="140" height="24" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
<text x="810" y="344" class="mono" font-size="8" fill="#545B64" text-anchor="middle">L3: CIDR 정책</text>

<!-- Row 4: L2 -->
<rect x="60" y="376" width="840" height="72" fill="#ffffff" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
<text x="140" y="416" font-size="16" font-weight="600" fill="#232F3E">2 · 데이터 링크 계층 (Data Link)</text>
<text x="560" y="416" class="mono" font-size="9" fill="#545B64">프레임 · MAC 주소</text>
<rect x="740" y="400" width="140" height="24" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
<text x="810" y="416" class="mono" font-size="8" fill="#545B64" text-anchor="middle">L2: ARP/MAC 필터링</text>

<!-- Row 5: L1 -->
<rect x="60" y="448" width="840" height="72" fill="#ffffff" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
<text x="140" y="488" font-size="16" font-weight="600" fill="#232F3E">1 · 물리 계층 (Physical)</text>
<text x="560" y="488" class="mono" font-size="9" fill="#545B64">비트</text>

<!-- Outer silhouette -->
<rect x="60" y="88" width="840" height="432" fill="none" stroke="#232F3E" stroke-width="1"/>

<!-- Legend -->
<line x1="60" y1="548" x2="900" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="60" y="568" class="mono" font-size="8" fill="#545B64" letter-spacing="0.14em">LEGEND</text>
<circle cx="200" cy="565" r="4" fill="#EC7211" fill-opacity="0.10" stroke="#EC7211" stroke-width="1.2"/>
<text x="212" y="568" class="mono" font-size="8" fill="#545B64">이 문서가 다루는 L7 정책 계층</text>
<circle cx="520" cy="565" r="4" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
<text x="532" y="568" class="mono" font-size="8" fill="#545B64">Cilium이 정책을 적용하는 계층</text>
</svg>