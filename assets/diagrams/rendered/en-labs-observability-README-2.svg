<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obslab-seq-title obslab-seq-desc">
<title id="obslab-seq-title">Order creation and notification sequence</title>
<desc id="obslab-seq-desc">A client's order request flows through the API gateway to the order service, which writes to Aurora, calls the payment service to charge and record payment, then publishes an order event that a notification service consumes asynchronously while the order and gateway return success to the client.</desc>
<defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
  <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
</marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
  <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
</marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
  <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#545B64" stroke-width="1.2"/>
</marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- ============ LIFELINES ============ -->
<line x1="80"  y1="80" x2="80"  y2="488" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="280" y1="80" x2="280" y2="488" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="480" y1="80" x2="480" y2="488" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="680" y1="80" x2="680" y2="488" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="880" y1="80" x2="880" y2="488" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- ============ MESSAGES ============ -->

<!-- m1 Client -> APIGW : y=112 -->
<line x1="80" y1="112" x2="280" y2="112" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="140" y="92" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="180" y="101" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">POST /ORDERS</text>

<!-- m2 APIGW -> Order : y=144 -->
<line x1="280" y1="144" x2="480" y2="144" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="340" y="124" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="380" y="133" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CREATE ORDER</text>

<!-- m3 Order self-loop: Aurora write (loop 176-192, label to the right at y~184) -->
<path d="M480,176 H504 Q512,176 512,184 Q512,192 504,192 H480"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="520" y="178" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="558" y="187" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">AURORA WRITE</text>

<!-- m4 Order -> Payment : y=224 (48px clear of the self-loop above) -->
<line x1="480" y1="224" x2="680" y2="224" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="540" y="204" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="580" y="213" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PAY REQUEST</text>

<!-- m5 Payment self-loop: Aurora write (loop 256-272) -->
<path d="M680,256 H704 Q712,256 712,264 Q712,272 704,272 H680"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="720" y="258" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="758" y="267" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">AURORA WRITE</text>

<!-- m6 Payment --> Order (return, dashed, filled marker) : y=304 -->
<line x1="680" y1="304" x2="480" y2="304" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="540" y="284" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="580" y="293" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PAY RESULT</text>

<!-- m7 Order -> Notif (async fire-and-forget via SQS, open arrowhead) : y=336 -->
<line x1="480" y1="336" x2="880" y2="336" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
<rect x="640" y="316" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="680" y="325" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SQS PUBLISH</text>

<!-- m8 Order --> APIGW (return, dashed, filled marker) : y=368 -->
<line x1="480" y1="368" x2="280" y2="368" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="340" y="348" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="380" y="357" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ORDER RESP</text>

<!-- m9 APIGW --> Client (headline success, accent, dashed, filled marker) : y=400 -->
<line x1="280" y1="400" x2="80" y2="400" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
<rect x="140" y="380" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="180" y="389" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">201 CREATED</text>

<!-- m10 Notif self-loop: send notification (async style, loop 448-464) -->
<path d="M880,448 H904 Q912,448 912,456 Q912,464 904,464 H880"
      fill="none" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
<rect x="800" y="450" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="836" y="459" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">NOTIFY</text>

<!-- ============ ACTORS ============ -->
<!-- Client -->
<rect x="20" y="40" width="120" height="40" rx="6" fill="#ffffff"/>
<rect x="20" y="40" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="80" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>

<!-- API Gateway -->
<rect x="220" y="40" width="120" height="40" rx="6" fill="#ffffff"/>
<rect x="220" y="40" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="280" y="58" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Gateway</text>
<text x="280" y="72" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">go</text>

<!-- Order (focal) -->
<rect x="420" y="40" width="120" height="40" rx="6" fill="#ffffff"/>
<rect x="420" y="40" width="120" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="480" y="58" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Order Service</text>
<text x="480" y="72" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">python</text>

<!-- Payment -->
<rect x="620" y="40" width="120" height="40" rx="6" fill="#ffffff"/>
<rect x="620" y="40" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="680" y="58" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Payment Svc</text>
<text x="680" y="72" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">java</text>

<!-- Notification -->
<rect x="820" y="40" width="120" height="40" rx="6" fill="#ffffff"/>
<rect x="820" y="40" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="880" y="58" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Notification</text>
<text x="880" y="72" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">node.js</text>

<!-- ============ LEGEND ============ -->
<line x1="20" y1="520" x2="932" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="20" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

<line x1="140" y1="540" x2="176" y2="540" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="188" y="544" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Sync call</text>

<line x1="320" y1="540" x2="356" y2="540" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="368" y="544" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return</text>

<line x1="480" y1="540" x2="516" y2="540" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
<text x="528" y="544" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Async / fire-and-forget</text>

<line x1="740" y1="540" x2="776" y2="540" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
<text x="788" y="544" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Headline success</text>

</svg>