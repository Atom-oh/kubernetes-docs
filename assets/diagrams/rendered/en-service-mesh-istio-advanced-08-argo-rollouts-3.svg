<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-title d3-desc">
    <title id="d3-title">AnalysisRun decision loop</title>
    <desc id="d3-desc">The AnalysisRun starts, waits 30 seconds, and measures the success rate. If the rate is at least 95 percent, it checks whether five measurements have completed: if not, it loops back to measure again; if so, the step succeeds. If the rate is below 95 percent, it counts a failure; two consecutive failures trigger an automatic rollback, otherwise it loops back to measure again.</desc>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ ARROWS (before nodes) ============ -->
    <line x1="480" y1="88" x2="480" y2="128" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="196" x2="480" y2="232" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Decision1 -> Fail (No) -->
    <line x1="390" y1="277" x2="260" y2="277" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="300" y="261" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="315" y="270" text-anchor="middle" font-size="8" fill="#7D8998" font-family="'Geist Mono',monospace">no</text>

    <!-- Decision1 -> Decision2 (Yes) -->
    <line x1="570" y1="277" x2="675" y2="277" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="608" y="261" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="623" y="270" text-anchor="middle" font-size="8" fill="#7D8998" font-family="'Geist Mono',monospace">yes</text>

    <!-- Decision2 -> Success (Yes) -->
    <line x1="760" y1="319" x2="760" y2="376" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="768" y="338" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="813" y="347" text-anchor="middle" font-size="8" fill="#EC7211" font-family="'Geist Mono',monospace">yes, 5/5</text>

    <!-- Decision2 -> Measure (No, loop back) -->
    <path d="M 760,235 V 202 Q 760,194 752,194 H 578 Q 570,194 570,186 V 150" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="608" y="178" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="656" y="187" text-anchor="middle" font-size="8" fill="#7D8998" font-family="'Geist Mono',monospace">no, next check</text>

    <!-- Fail -> Decision3 -->
    <line x1="175" y1="309" x2="175" y2="358" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Decision3 -> Rollback (Yes) -->
    <line x1="175" y1="442" x2="175" y2="476" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="183" y="452" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="227" y="461" text-anchor="middle" font-size="8" fill="#7D8998" font-family="'Geist Mono',monospace">yes, 2 fails</text>

    <!-- Decision3 -> Measure (No, loop back) -->
    <path d="M 260,400 H 330 Q 338,400 338,392 V 190 Q 338,182 346,182 H 390" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="330" y="248" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="365" y="257" text-anchor="middle" font-size="8" fill="#7D8998" font-family="'Geist Mono',monospace">no, retry</text>

    <!-- ============ NODES ============ -->
    <!-- Start -->
    <rect x="390" y="40" width="180" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">AnalysisRun start</text>

    <!-- Measure (focal) -->
    <rect x="390" y="128" width="180" height="68" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Measure</text>
    <text x="480" y="172" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">wait 30s, up to 5x</text>

    <!-- Decision1 -->
    <polygon points="480,232 570,277 480,322 390,277" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="273" text-anchor="middle" font-size="10" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">success</text>
    <text x="480" y="287" text-anchor="middle" font-size="10" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">&#8805; 95%?</text>

    <!-- Decision2 -->
    <polygon points="760,235 845,277 760,319 675,277" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="760" y="273" text-anchor="middle" font-size="10" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">5 checks</text>
    <text x="760" y="287" text-anchor="middle" font-size="10" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">done?</text>

    <!-- Fail -->
    <rect x="90" y="245" width="170" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="175" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Count failure</text>
    <text x="175" y="288" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">consecutive</text>

    <!-- Decision3 -->
    <polygon points="175,358 260,400 175,442 90,400" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="175" y="396" text-anchor="middle" font-size="10" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">2 fails</text>
    <text x="175" y="410" text-anchor="middle" font-size="10" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">in a row?</text>

    <!-- Success -->
    <rect x="675" y="376" width="170" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="760" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Proceed to next step</text>

    <!-- Rollback -->
    <rect x="90" y="476" width="170" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="175" y="504" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Automatic rollback</text>

    <!-- Legend -->
    <line x1="30" y1="548" x2="930" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="564" font-size="8" letter-spacing="0.14em" fill="#545B64" font-family="'Geist Mono',monospace">LEGEND</text>
    <line x1="150" y1="561" x2="178" y2="561" stroke="#545B64" stroke-width="1.2"/>
    <text x="186" y="564" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">forward step</text>
    <line x1="320" y1="561" x2="348" y2="561" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="356" y="564" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">loop back</text>
    <line x1="480" y1="561" x2="508" y2="561" stroke="#EC7211" stroke-width="1.4"/>
    <text x="516" y="564" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">success exit</text>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
  </svg>