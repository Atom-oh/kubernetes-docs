<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="egress-flow-title egress-flow-desc">
    <title id="egress-flow-title">Egress 트래픽 흐름</title>
    <desc id="egress-flow-desc">파드에서 나가는 트래픽이 사이드카 프록시와 이그레스 게이트웨이를 거쳐 외부 서비스로 전달되는 경로를 보여준다.</desc>

    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ============ ARROWS (drawn before boxes) ============ -->
    <!-- Pod -> Sidecar -->
    <line x1="160" y1="312" x2="272" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="180" y="288" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="216" y="297" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace"
          text-anchor="middle" letter-spacing="0.06em">OUTBOUND</text>

    <!-- Sidecar -> EgressGW -->
    <line x1="420" y1="312" x2="452" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- EgressGW -> External (accent / headline) -->
    <line x1="600" y1="312" x2="752" y2="312" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="636" y="288" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="676" y="297" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace"
          text-anchor="middle" letter-spacing="0.06em">TLS ORIGINATE</text>

    <!-- ============ ZONE: Service Mesh ============ -->
    <rect x="256" y="232" width="376" height="160" rx="8"
          fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="268" y="220" width="112" height="16" fill="#ffffff"/>
    <text x="272" y="232" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace"
          font-weight="500" letter-spacing="0.14em">SERVICE MESH</text>

    <!-- ============ NODES ============ -->
    <!-- Pod (input) -->
    <rect x="40" y="280" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="280" width="120" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="48" y="286" width="30" height="12" rx="2" fill="transparent" stroke="#7D8998" stroke-width="0.8"/>
    <text x="63" y="295" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace"
          text-anchor="middle" letter-spacing="0.08em">POD</text>
    <text x="100" y="318" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">파드</text>
    <text x="100" y="334" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace"
          text-anchor="middle">workload</text>

    <!-- Sidecar (backend) -->
    <rect x="280" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="280" y="280" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="288" y="286" width="34" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-width="0.8"/>
    <text x="305" y="295" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace"
          text-anchor="middle" letter-spacing="0.08em">SIDE</text>
    <text x="350" y="316" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy 사이드카</text>
    <text x="350" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace"
          text-anchor="middle">proxy</text>

    <!-- Egress Gateway (focal) -->
    <rect x="460" y="280" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="460" y="280" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="468" y="286" width="34" height="12" rx="2" fill="transparent" stroke="#EC7211" stroke-width="0.8"/>
    <text x="485" y="295" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace"
          text-anchor="middle" letter-spacing="0.08em">EGW</text>
    <text x="530" y="316" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">이그레스 게이트웨이</text>
    <text x="530" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace"
          text-anchor="middle">policy + egress</text>

    <!-- External (external) -->
    <rect x="760" y="280" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="760" y="280" width="160" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="768" y="286" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="788" y="295" fill="rgba(35,47,62,0.6)" font-size="7" font-family="'Geist Mono',monospace"
          text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="840" y="316" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">외부 서비스</text>
    <text x="840" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace"
          text-anchor="middle">api.external.com</text>

    <!-- ============ LEGEND ============ -->
    <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="468" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace"
          letter-spacing="0.14em">LEGEND</text>

    <rect x="200" y="461" width="7" height="7" rx="1.5" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="216" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">워크로드</text>

    <rect x="340" y="461" width="7" height="7" rx="1.5" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="356" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">메시 컴포넌트</text>

    <rect x="520" y="461" width="7" height="7" rx="1.5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="536" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">egress 제어 지점</text>

    <rect x="716" y="461" width="7" height="7" rx="1.5" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="732" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">외부 서비스</text>

    <rect x="856" y="461" width="14" height="7" fill="none" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="878" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">메시 경계</text>
  </svg>
