    <title id="ko-service-mesh-istio-advanced-02-multi-cluster-9-title">VPC Lattice를 경유한 클러스터 간 호출 시퀀스</title>
    <desc id="ko-service-mesh-istio-advanced-02-multi-cluster-9-desc">Cluster 1의 Service A가 Envoy를 거쳐 VPC Lattice를 경유해 Cluster 2의 Service B에 도달하고, 각 클러스터에서 Istio가 독립적으로 메트릭을 수집하며 응답이 같은 경로로 되돌아오는 요청-응답 시퀀스.</desc>
