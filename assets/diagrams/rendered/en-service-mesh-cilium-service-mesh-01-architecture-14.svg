<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-service-mesh-cilium-service-mesh-01-architecture-14-title en-service-mesh-cilium-service-mesh-01-architecture-14-desc">
      <title id="en-service-mesh-cilium-service-mesh-01-architecture-14-title">Resource efficiency at 100-pod scale</title>
      <desc id="en-service-mesh-cilium-service-mesh-01-architecture-14-desc">Diagram comparing Istio and Cilium resource consumption on a 100-pod cluster: Istio's per-pod sidecars total roughly 5GB of memory with high aggregate CPU overhead, while Cilium's five node-level Envoy proxies total about 500MB with low CPU overhead.</desc>
      <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs><defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>

      <rect x="40" y="60" width="420" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="52" y="64" width="200" height="12" rx="2" fill="#ffffff"/>
      <text x="152.0" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">MEMORY USAGE (100 PODS)</text>

      <rect x="500" y="60" width="420" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="512" y="64" width="200" height="12" rx="2" fill="#ffffff"/>
      <text x="612.0" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CPU OVERHEAD (100 PODS)</text>

      <rect x="64" y="104" width="180" height="110" rx="6" fill="#ffffff"/>
      <rect x="64" y="104" width="180" height="110" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="72" y="110" width="28" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-width="0.8" opacity="0.6"/>
      <text x="86" y="119" fill="#232F3E" font-size="7" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">IST</text>
      <text x="154.0" y="155.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Istio</text>
      <text x="154.0" y="171.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">100 pods x 50MB = 5GB</text>

      <rect x="264" y="104" width="180" height="110" rx="6" fill="#ffffff"/>
      <rect x="264" y="104" width="180" height="110" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <rect x="272" y="110" width="28" height="12" rx="2" fill="transparent" stroke="#EC7211" stroke-width="0.8" opacity="0.6"/>
      <text x="286" y="119" fill="#EC7211" font-size="7" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CIL</text>
      <text x="354.0" y="155.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Cilium</text>
      <text x="354.0" y="171.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">5 nodes x 100MB = 500MB</text>

      <rect x="524" y="104" width="180" height="110" rx="6" fill="#ffffff"/>
      <rect x="524" y="104" width="180" height="110" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="532" y="110" width="28" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-width="0.8" opacity="0.6"/>
      <text x="546" y="119" fill="#232F3E" font-size="7" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">IST</text>
      <text x="614.0" y="155.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Istio</text>
      <text x="614.0" y="171.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">100 sidecars - high CPU</text>

      <rect x="724" y="104" width="180" height="110" rx="6" fill="#ffffff"/>
      <rect x="724" y="104" width="180" height="110" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <rect x="732" y="110" width="28" height="12" rx="2" fill="transparent" stroke="#EC7211" stroke-width="0.8" opacity="0.6"/>
      <text x="746" y="119" fill="#EC7211" font-size="7" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CIL</text>
      <text x="814.0" y="155.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Cilium</text>
      <text x="814.0" y="171.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">5 node Envoys - low CPU</text>

      <line x1="60" y1="336" x2="900" y2="336" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="60" y="352" fill="#545B64" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="260" y1="352" x2="288" y2="352" stroke="#EC7211" stroke-width="1.4"/>
      <text x="296" y="355" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Cilium eBPF footprint (focal)</text>
      <line x1="530" y1="352" x2="558" y2="352" stroke="#545B64" stroke-width="1.4"/>
      <text x="566" y="355" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Istio sidecar footprint</text>    </svg>
