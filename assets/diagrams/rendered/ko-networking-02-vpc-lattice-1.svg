<text x="110" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC 1, VPC 2</text>

<rect x="40" y="344" width="140" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="110" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VPC 3</text>

<!-- Service Network (focal) -->
<rect x="308" y="248" width="76" height="128" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="346" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">서비스</text>
