<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svcnet-title svcnet-desc">
<title id="svcnet-title">서비스 네트워크 아키텍처</title>
<desc id="svcnet-desc">두 계정에 걸친 세 VPC가 하나의 서비스 네트워크에 연결되고, 서비스 네트워크에 등록된 세 서비스가 각자의 대상 그룹을 통해 EC2 인스턴스, EKS 파드, Lambda 함수로 트래픽을 전달하는 멀티 계정·하이브리드 워크로드 구조를 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="40" y="44" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ARCHITECTURE</text>
<text x="40" y="68" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">서비스 네트워크 아키텍처</text>

<!-- ===== Zones ===== -->
<rect x="24" y="216" width="172" height="80" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="74" y="220" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="110" y="229" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">계정 A</text>

<rect x="24" y="312" width="172" height="80" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="74" y="316" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="110" y="325" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">계정 B</text>

<!-- ===== Arrows (before nodes) ===== -->
<!-- VPC(merged) -> SN, straight (same y=264) -->
<path d="M180,264 H308" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="214" y="244" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="244" y="253" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">VPC 연결</text>

<!-- VPC3 -> SN, straight (same y=360) -->
<path d="M180,360 H308" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="214" y="340" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="244" y="349" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">VPC 연결</text>

<!-- SN -> S1/S2/S3, straight (right edge fanned at 264/312/360) -->
<path d="M384,264 H512" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M384,312 H512" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M384,360 H512" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="418" y="244" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="448" y="253" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">서비스 등록</text>
<rect x="418" y="292" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="448" y="301" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">서비스 등록</text>
<rect x="418" y="340" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="448" y="349" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">서비스 등록</text>

<!-- S1/S2/S3 -> TG1/TG2/TG3, straight -->
<path d="M632,264 H760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M632,312 H760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M632,360 H760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="666" y="244" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="696" y="253" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">대상 그룹</text>
<rect x="666" y="292" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="696" y="301" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">대상 그룹</text>
<rect x="666" y="340" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="696" y="349" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">대상 그룹</text>

