<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lktm-canary-title lktm-canary-desc">
<title id="lktm-canary-title">Linkerd TrafficSplit 카나리 배포</title>
<desc id="lktm-canary-desc">TrafficSplit이 트래픽 진입점인 my-service에서 안정 버전에 90%, 카나리 버전에 10%의 트래픽을 가중치로 분배하는 구조를 보여주는 다이어그램.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<!-- Zone: Canary Deployment -->
<rect x="100" y="140" width="760" height="288" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="416" y="144" width="128" height="12" rx="2" fill="#FFFFFF"/>
<text x="480" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CANARY DEPLOYMENT</text>

<!-- Arrows: SVC -> V1 (90%, headline accent), SVC -> V2 (10%) -->
<path d="M447,252 V292 Q447,300 439,300 H308 Q300,300 300,308 V340" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<path d="M513,252 V292 Q513,300 521,300 H652 Q660,300 660,308 V340" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="345" y="280" width="40" height="12" rx="2" fill="#FFFFFF"/>
<text x="365" y="289" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">90%</text>

<rect x="558" y="280" width="40" height="12" rx="2" fill="#FFFFFF"/>
<text x="578" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">10%</text>

<!-- Node: SVC (focal, entry point) -->
<rect x="380" y="180" width="200" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<rect x="388" y="188" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="406" y="197" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SVC</text>
<text x="480" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">my-service</text>
<text x="480" y="236" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">트래픽 진입점</text>

<!-- Node: V1 stable -->
<rect x="140" y="340" width="280" height="72" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<rect x="148" y="348" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="162" y="357" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">V1</text>
<text x="280" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">my-service-v1</text>
<text x="280" y="396" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stable · weight 90</text>

<!-- Node: V2 canary -->
<rect x="540" y="340" width="280" height="72" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<rect x="548" y="348" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="562" y="357" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">V2</text>
<text x="680" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">my-service-v2</text>
<text x="680" y="396" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">canary · weight 10</text>

</svg>