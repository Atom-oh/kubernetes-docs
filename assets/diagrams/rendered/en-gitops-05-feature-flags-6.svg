<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gitopsflag-title gitopsflag-desc">
<title id="gitopsflag-title">GitOps propagation of a flag update</title>
<desc id="gitopsflag-desc">Sequence diagram showing a FeatureFlag change committed to Git flow through ArgoCD or Flux into the Kubernetes API, where the OpenFeature Operator regenerates a ConfigMap that flagd detects and reloads within seconds.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Lifelines -->
<line x1="100" y1="120" x2="100" y2="460" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="290" y1="120" x2="290" y2="460" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="480" y1="120" x2="480" y2="460" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="670" y1="120" x2="670" y2="460" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="860" y1="120" x2="860" y2="460" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Activation bars -->
<rect x="286" y="156" width="8" height="48" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="476" y="196" width="8" height="48" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="666" y="236" width="8" height="112" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="0.8"/>
<rect x="856" y="340" width="8" height="80" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="0.8"/>

<!-- Messages -->
<line x1="100" y1="160" x2="286" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="294" y1="200" x2="476" y2="200" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="484" y1="240" x2="666" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 678,280 L 714,280 L 714,312 L 678,312" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<line x1="674" y1="344" x2="856" y2="344" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 868,384 L 904,384 L 904,416 L 868,416" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- Message labels -->
<rect x="140" y="144" width="106" height="12" rx="2" fill="#ffffff"/>
<text x="193" y="154" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CR UPDATED</text>

<rect x="330" y="184" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="378" y="194" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">APPLY CR</text>

<rect x="522" y="224" width="102" height="12" rx="2" fill="#ffffff"/>
<text x="573" y="234" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WATCH EVENT</text>

<rect x="722" y="290" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="786" y="300" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">GENERATE CONFIGMAP</text>

<rect x="722" y="328" width="106" height="12" rx="2" fill="#ffffff"/>
<text x="775" y="338" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">VOLUME UPDATE</text>

<rect x="912" y="394" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="932" y="404" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">RELOAD</text>

<!-- Actor boxes -->
<rect x="28" y="64" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="28" y="64" width="144" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="100" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Git Repository</text>
<text x="100" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">source of truth</text>

<rect x="218" y="64" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="218" y="64" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="290" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">ArgoCD / Flux</text>
<text x="290" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitOps sync</text>

<rect x="408" y="64" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="408" y="64" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Kubernetes API</text>
<text x="480" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">control plane</text>

<rect x="598" y="64" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="598" y="64" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="670" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">OF Operator</text>
<text x="670" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">focal · writes CM</text>

<rect x="788" y="64" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="788" y="64" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="860" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">flagd Sidecar</text>
<text x="860" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reload target</text>

<!-- Note -->
<rect x="756" y="432" width="176" height="28" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<text x="844" y="444" fill="#545B64" font-size="9" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">New flag values active</text>
<text x="844" y="456" fill="#545B64" font-size="9" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">within seconds</text>

<!-- Legend -->
<line x1="24" y1="500" x2="936" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="24" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<line x1="24" y1="532" x2="52" y2="532" stroke="#545B64" stroke-width="1.2"/>
<text x="60" y="536" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">GitOps sync path</text>
<line x1="220" y1="532" x2="248" y2="532" stroke="#EC7211" stroke-width="1.2"/>
<text x="256" y="536" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Flag reload path (focal)</text>
</svg>