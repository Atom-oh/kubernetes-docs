<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calico-federation-title calico-federation-desc">
    <title id="calico-federation-title">Calico Federation across on-premises, AWS, and GCP clusters</title>
    <desc id="calico-federation-desc">Architecture diagram showing three Kubernetes clusters, on-premises, AWS, and GCP, each running Calico alongside its workloads, linked pairwise by Calico Federation for policy and routing, with a direct BGP/VPN path connecting the on-premises and GCP clusters.</desc>

    <rect width="960" height="600" fill="#ffffff"/>

    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <!-- Zones (drawn before arrows and nodes) -->
    <rect x="40" y="144" width="260" height="208" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="88" y="148" width="164" height="12" rx="2" fill="#ffffff"/>
    <text x="170" y="157" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">CLUSTER 1 · ON-PREM</text>

    <rect x="350" y="144" width="260" height="208" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="410" y="148" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="157" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">CLUSTER 2 · AWS</text>

    <rect x="660" y="144" width="260" height="208" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="718" y="148" width="144" height="12" rx="2" fill="#ffffff"/>
    <text x="790" y="157" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">CLUSTER 3 · GCP</text>

    <!-- Federation links (accent, bidirectional, same-y straight lines) -->
    <line x1="270" y1="208" x2="380" y2="208" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>
    <line x1="580" y1="208" x2="690" y2="208" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>

    <!-- BGP/VPN direct link (muted, dashed, routed above all zones; attach points sit in the
         top-corner margin of each node, clear of the zone eyebrow label, to avoid passing
         behind cluster 2 or overlapping any label text -->
    <path d="M 80,176 V 116 Q 80,108 88,108 H 692 Q 700,108 700,116 V 176"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"
          marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>

    <!-- Arrow labels -->
    <rect x="289" y="188" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="325" y="197" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FEDERATION</text>

    <rect x="599" y="188" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="635" y="197" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FEDERATION</text>

    <rect x="352" y="88" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="388" y="97" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BGP / VPN</text>

    <!-- Cluster 1: Calico + Workloads -->
    <rect x="70" y="176" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="70" y="176" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#232F3E" stroke-width="1"/>
    <rect x="78" y="184" width="48" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="102" y="193" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALICO</text>
    <text x="170" y="214" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Calico</text>

    <rect x="70" y="272" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="70" y="272" width="200" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="78" y="280" width="40" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
    <text x="98" y="289" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PODS</text>
    <text x="170" y="310" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Workloads</text>

    <!-- Cluster 2: Calico + Workloads -->
    <rect x="380" y="176" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="176" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#232F3E" stroke-width="1"/>
    <rect x="388" y="184" width="48" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="412" y="193" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALICO</text>
    <text x="480" y="214" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Calico</text>

    <rect x="380" y="272" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="380" y="272" width="200" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="388" y="280" width="40" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
    <text x="408" y="289" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PODS</text>
    <text x="480" y="310" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Workloads</text>

    <!-- Cluster 3: Calico + Workloads -->
    <rect x="690" y="176" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="690" y="176" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#232F3E" stroke-width="1"/>
    <rect x="698" y="184" width="48" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="722" y="193" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALICO</text>
    <text x="790" y="214" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Calico</text>

    <rect x="690" y="272" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="690" y="272" width="200" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="698" y="280" width="40" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
    <text x="718" y="289" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PODS</text>
    <text x="790" y="310" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Workloads</text>

    <!-- Legend -->
    <line x1="40" y1="480" x2="920" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <line x1="40" y1="516" x2="68" y2="516" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>
    <text x="76" y="519" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Federation (policy + routing)</text>

    <line x1="380" y1="516" x2="408" y2="516" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <text x="416" y="519" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Direct BGP / VPN peering</text>
  </svg>