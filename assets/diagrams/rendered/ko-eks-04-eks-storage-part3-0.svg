<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="ko-storage-p3-0-title ko-storage-p3-0-desc">
    <title id="ko-storage-p3-0-title">EKS 스토리지 모니터링 구성</title>
    <desc id="ko-storage-p3-0-desc">AWS CloudWatch, Kubernetes 모니터링, 사용자 정의 솔루션이 각각 지표를 수집하고, CloudWatch 경보를 거쳐 대시보드로 이어지는 EKS 스토리지 모니터링 구조를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="32" width="276" height="336" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="112" y="36" width="132" height="12" rx="2" fill="#ffffff"/>
    <text x="178" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">AWS CLOUDWATCH</text>

    <rect x="340" y="32" width="276" height="272" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="404" y="36" width="148" height="12" rx="2" fill="#ffffff"/>
    <text x="478" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">KUBERNETES 모니터링</text>

    <rect x="640" y="32" width="276" height="192" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="702" y="36" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="778" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">사용자 정의 솔루션</text>

    <!-- ===== Arrows (before nodes) ===== -->
    <!-- Zone1: metric sources -> aggregate -->
    <line x1="98" y1="112" x2="98" y2="136" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="178" y1="112" x2="178" y2="136" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="258" y1="112" x2="258" y2="136" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- aggregate -> alarms (accent, primary flow) -->
    <line x1="178" y1="200" x2="178" y2="224" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- alarms -> dashboard -->
    <line x1="178" y1="280" x2="178" y2="304" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Zone2: Prometheus fan-out (fanned exit points on bottom edge) -->
    <path d="M 438,112 H 423 Q 415,112 415,120 V 152" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 518,112 H 547 Q 555,112 555,120 V 152" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="415" y1="208" x2="415" y2="232" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Zone3 -->
    <line x1="778" y1="120" x2="778" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Nodes ===== -->
    <!-- EBS metrics -->
    <rect x="60" y="64" width="76" height="48" rx="6" fill="#ffffff"/>
    <rect x="60" y="64" width="76" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="98" y="86" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">EBS</text>
    <text x="98" y="100" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">볼륨 지표</text>

    <!-- EFS metrics -->
    <rect x="140" y="64" width="76" height="48" rx="6" fill="#ffffff"/>
    <rect x="140" y="64" width="76" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="178" y="86" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">EFS</text>
    <text x="178" y="100" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">파일시스템 지표</text>

    <!-- FSx metrics -->
    <rect x="220" y="64" width="76" height="48" rx="6" fill="#ffffff"/>
    <rect x="220" y="64" width="76" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="258" y="86" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">FSx</text>
    <text x="258" y="100" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Lustre 지표</text>

    <!-- Aggregate key metrics (store type) -->
    <rect x="58" y="136" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="58" y="136" width="240" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="178" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">주요 모니터링 지표</text>
    <text x="178" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">사용량·IOPS·처리량</text>
    <text x="178" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">지연시간·대기열·크레딧</text>

    <!-- CW Alarms (FOCAL) -->
    <rect x="78" y="224" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="78" y="224" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="178" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">CloudWatch 경보</text>
    <text x="178" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">임계치 감시</text>

    <!-- CW Dashboard -->
    <rect x="78" y="304" width="200" height="48" rx="6" fill="#ffffff"/>
    <rect x="78" y="304" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="178" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">CloudWatch 대시보드</text>
    <text x="178" y="340" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">시각화</text>

    <!-- Prometheus -->
    <rect x="408" y="64" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="408" y="64" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="478" y="86" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Prometheus</text>
    <text x="478" y="100" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">지표 수집</text>

    <!-- ServiceMonitor/PodMonitor merged -->
    <rect x="350" y="152" width="130" height="56" rx="6" fill="#ffffff"/>
    <rect x="350" y="152" width="130" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="415" y="174" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">익스포터 연동</text>
    <text x="415" y="190" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Service/PodMonitor</text>

    <!-- PrometheusRule -->
    <rect x="490" y="152" width="130" height="48" rx="6" fill="#ffffff"/>
    <rect x="490" y="152" width="130" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="555" y="174" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">알림 규칙</text>
    <text x="555" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PrometheusRule</text>

    <!-- Grafana -->
    <rect x="350" y="232" width="130" height="56" rx="6" fill="#ffffff"/>
    <rect x="350" y="232" width="130" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="415" y="254" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Grafana</text>
    <text x="415" y="270" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">대시보드</text>

    <!-- Usage Exporter -->
    <rect x="678" y="64" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="678" y="64" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="778" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">볼륨 사용량 익스포터</text>
    <text x="778" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DaemonSet</text>

    <!-- Custom metrics/alerts merged -->
    <rect x="678" y="152" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="678" y="152" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="778" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">사용자 정의 지표·알림</text>
    <text x="778" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">커스텀 규칙</text>

    <!-- Legend -->
    <line x1="40" y1="460" x2="920" y2="460" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="476" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="492" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="500" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Noto Sans KR',sans-serif">핵심 경보 허브</text>

    <rect x="200" y="492" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="500" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Noto Sans KR',sans-serif">수집·시각화 구성요소</text>

    <rect x="400" y="492" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="420" y="500" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Noto Sans KR',sans-serif">집계된 지표 그룹</text>

    <line x1="600" y1="497" x2="628" y2="497" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="636" y="500" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Noto Sans KR',sans-serif">주요 흐름</text>
  </svg>
