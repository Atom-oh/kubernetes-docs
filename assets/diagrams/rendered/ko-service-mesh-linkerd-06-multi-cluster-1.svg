<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1title d1desc">
    <title id="d1title">Linkerd 서비스 미러링 시퀀스</title>
    <desc id="d1desc">East 클러스터의 애플리케이션이 미러 서비스를 호출하면 미러 서비스가 West Gateway의 IP로 주소를 해석해 mTLS로 연결하고, Gateway가 신원을 검증한 뒤 실제 대상 서비스로 요청을 전달하며, 응답은 역순으로 되돌아오는 과정을 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- lifelines -->
    <line x1="120" y1="72" x2="120" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="360" y1="72" x2="360" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="600" y1="72" x2="600" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="840" y1="72" x2="840" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- activation bars -->
    <rect x="116" y="100" width="8" height="332" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="356" y="100" width="8" height="332" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="596" y="200" width="8" height="188" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="836" y="300" width="8" height="44" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- 1. App -> Mirror : Request to web-west -->
    <line x1="120" y1="100" x2="356" y2="100" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="176" y="80" width="124" height="12" rx="2" fill="#ffffff"/>
    <text x="238" y="89" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">REQUEST TO WEB-WEST</text>

    <!-- 2. Mirror self-loop : Resolve to Gateway IP -->
    <path d="M364,144 H420 V164 H364" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="428" y="147" width="118" height="12" rx="2" fill="#ffffff"/>
    <text x="487" y="156" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">RESOLVE GATEWAY IP</text>

    <!-- 3. Mirror -> Gateway : mTLS Connection (headline, accent) -->
    <line x1="360" y1="200" x2="596" y2="200" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="424" y="180" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="478" y="189" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">MTLS CONNECTION</text>

    <!-- 4. Gateway self-loop : Verify identity -->
    <path d="M604,244 H660 V264 H604" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="668" y="247" width="102" height="12" rx="2" fill="#ffffff"/>
    <text x="719" y="256" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">VERIFY IDENTITY</text>

    <!-- 5. Gateway -> Target : Forward request -->
    <line x1="600" y1="300" x2="836" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="662" y="280" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="718" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">FORWARD REQUEST</text>

    <!-- 6. Target --> Gateway : Response (dashed return) -->
    <line x1="836" y1="344" x2="608" y2="344" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="682" y="352" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="722" y="361" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">RESPONSE</text>

    <!-- 7. Gateway --> Mirror : mTLS Response (dashed return) -->
    <line x1="596" y1="388" x2="368" y2="388" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="424" y="396" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="478" y="405" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">MTLS RESPONSE</text>

    <!-- 8. Mirror --> App : Response (dashed return) -->
    <line x1="356" y1="432" x2="128" y2="432" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="176" y="440" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="216" y="449" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">RESPONSE</text>

    <!-- actor boxes -->
    <rect x="40" y="40" width="160" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="120" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application (East)</text>

    <rect x="280" y="40" width="160" height="32" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="360" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Mirror Service</text>

    <rect x="520" y="40" width="160" height="32" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="600" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway (West)</text>

    <rect x="760" y="40" width="160" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="840" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Target Service</text>

    <!-- footer note -->
    <text x="120" y="500" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace">Cluster East</text>
    <text x="600" y="500" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace">Cluster West</text>
  </svg>