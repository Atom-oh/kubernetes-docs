<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="bs-perm-title bs-perm-desc">
    <title id="bs-perm-title">Backstage permission policy evaluation</title>
    <desc id="bs-perm-desc">Flowchart showing a user request evaluated against a permission policy — informed by catalog ownership and group membership — that allows the action, denies it with a 403, or conditionally filters the results.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows (behind nodes) -->
    <path d="M180,280 H280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M360,160 V252" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M360,408 V308" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M440,280 H520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M670,248 H704 Q712,248 712,240 V212 Q712,204 720,204 H760" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M720,280 H760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M670,312 H704 Q712,312 712,320 V348 Q712,356 720,356 H760" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="712" y="184" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="732" y="193" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ALLOW</text>

    <rect x="724" y="260" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="740" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">DENY</text>

    <rect x="723" y="336" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="740" y="345" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">COND</text>

    <!-- Node: Catalog Ownership (input) -->
    <rect x="280" y="104" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="280" y="104" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="360" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Catalog Ownership</text>
    <text x="360" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">policy input</text>

    <!-- Node: Request (oval start) -->
    <rect x="40" y="252" width="140" height="56" rx="28" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="110" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">User Request</text>

    <!-- Node: Policy (step) -->
    <rect x="280" y="252" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="280" y="252" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="360" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Permission Policy</text>
    <text x="360" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">evaluated per request</text>

    <!-- Node: Groups Membership (input) -->
    <rect x="280" y="408" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="280" y="408" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="360" y="432" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Group Membership</text>
    <text x="360" y="448" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">policy input</text>

    <!-- Node: Decision diamond -->
    <polygon points="620,216 720,280 620,344 520,280" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="620" y="276" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Permission</text>
    <text x="620" y="290" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">decision</text>

    <!-- Node: Execute Action (accent / happy path) -->
    <rect x="760" y="176" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="760" y="176" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="840" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Execute Action</text>
    <text x="840" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">allowed</text>

    <!-- Node: 403 Forbidden (oval end) -->
    <rect x="760" y="252" width="160" height="56" rx="28" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="840" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">403 Forbidden</text>
    <text x="840" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">denied</text>

    <!-- Node: Filter Results (step) -->
    <rect x="760" y="328" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="760" y="328" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="840" y="352" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Filter Results</text>
    <text x="840" y="368" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">partial access</text>

    <!-- Legend -->
    <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

    <rect x="40" y="568" width="24" height="12" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="72" y="578" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Start / end</text>

    <rect x="200" y="568" width="24" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="232" y="578" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Step</text>

    <polygon points="332,574 344,568 356,574 344,580" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="368" y="578" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Decision</text>

    <rect x="460" y="568" width="24" height="12" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="492" y="578" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Policy input</text>

    <line x1="604" y1="574" x2="632" y2="574" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="640" y="578" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Happy path</text>

    <line x1="768" y1="574" x2="796" y2="574" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="804" y="578" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Branch</text>
  </svg>