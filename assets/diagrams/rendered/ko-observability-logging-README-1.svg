      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="567" y="276" width="56" height="14" rx="2" fill="#ffffff"/>
<text y="286" class="lbl" fill="#7D8998" text-anchor="start"><tspan x="583.0">아</tspan><tspan x="591.0">니</tspan><tspan x="599.0">오</tspan></text>

