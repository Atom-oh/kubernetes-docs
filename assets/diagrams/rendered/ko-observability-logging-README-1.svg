<text y="255" class="name" fill="#232F3E" text-anchor="start" font-size="10"><tspan x="178.5">전</tspan><tspan x="188.5">문</tspan><tspan x="201.5">검</tspan><tspan x="211.5">색</tspan></text>
<text y="269" class="name" fill="#232F3E" text-anchor="start" font-size="10"><tspan x="187.5">필</tspan><tspan x="197.5">요</tspan><tspan x="207.5">?</tspan></text>

<!-- Q3 diamond: top(700,220) right(770,260) bottom(700,300) left(630,260) -->
<polygon points="700,220 770,260 700,300 630,260" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text y="255" class="name" fill="#232F3E" text-anchor="start" font-size="10"><tspan x="667.1">A</tspan><tspan x="673.8">W</tspan><tspan x="683.2">S</tspan><tspan x="692.9">네</tspan><tspan x="702.9">이</tspan><tspan x="712.9">티</tspan><tspan x="722.9">브</tspan></text>
<text y="269" class="name" fill="#232F3E" text-anchor="start" font-size="10"><tspan x="687.5">선</tspan><tspan x="697.5">호</tspan><tspan x="707.5">?</tspan></text>

<!-- Q4 diamond: top(820,332) right(890,372) bottom(820,412) left(750,372) -->
