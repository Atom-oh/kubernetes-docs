<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dec-title dec-desc">
<title id="dec-title">로그 저장소 선택 의사결정 트리</title>
<desc id="dec-desc">기존 Grafana 스택 보유 여부, 전문 검색 필요성, AWS 네이티브 선호도, 분석 복잡성, 비용과 기능의 우선순위를 순서대로 물어 Loki, OpenSearch, CloudWatch Logs 중 하나를 추천하는 의사결정 트리.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    .name{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:600; font-size:12px; }
    .lbl{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; font-size:9px; font-weight:500; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- ================= ARROWS ================= -->
<!-- START -> Q1 -->
<path d="M 480,70 V 110" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Q1 -> Q2 (예, left) -->
<path d="M 410,150 V 177 Q 410,185 402,185 H 208 Q 200,185 200,193 V 220"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="277" y="165" width="28" height="14" rx="2" fill="#ffffff"/>
<text y="175" class="lbl" fill="#7D8998" text-anchor="start"><tspan x="287.0">예</tspan></text>

<!-- Q1 -> Q3 (아니오, right) -->
<path d="M 550,150 V 177 Q 550,185 558,185 H 692 Q 700,185 700,193 V 220"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="597" y="165" width="56" height="14" rx="2" fill="#ffffff"/>
<text y="175" class="lbl" fill="#7D8998" text-anchor="start"><tspan x="613.0">아</tspan><tspan x="621.0">니</tspan><tspan x="629.0">오</tspan></text>

<!-- Q3 -> Q4 (예, right) -->
<path d="M 770,260 V 288 Q 770,296 778,296 H 812 Q 820,296 820,304 V 332"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="781" y="276" width="28" height="14" rx="2" fill="#ffffff"/>
<text y="286" class="lbl" fill="#7D8998" text-anchor="start"><tspan x="791.0">예</tspan></text>

