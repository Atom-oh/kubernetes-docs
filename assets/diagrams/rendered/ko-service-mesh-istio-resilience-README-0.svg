<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rp0-title rp0-desc" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">
    <title id="rp0-title">핵심 복원력 패턴</title>
    <desc id="rp0-desc">클라이언트 요청이 Outlier Detection, Rate Limiting, Zone Aware Routing을 차례로 거쳐 정상 Pod로 우선 전달되고 비정상 Pod는 제외되는 흐름을 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- zones -->
    <rect x="140" y="150" width="620" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="362" y="154" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="450" y="163" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">ISTIO RESILIENCE 패턴</text>

    <rect x="150" y="300" width="220" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="200" y="304" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="260" y="313" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">비정상 인스턴스</text>

    <rect x="480" y="300" width="300" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="570" y="304" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="630" y="313" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">정상 인스턴스</text>

    <!-- Request -> Outlier straight vertical (same center x=250) -->
    <line x1="250" y1="116" x2="250" y2="180" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Outlier -> RateLimit (gap between boxes) -->
    <line x1="320" y1="200" x2="380" y2="200" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- RateLimit -> ZoneAware (gap between boxes) -->
    <line x1="500" y1="200" x2="560" y2="200" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Outlier -.-> Pod3 straight vertical (exclude, dashed, same center x=250) -->
    <path d="M 250,220 V 340" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="258" y="272" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="274" y="281" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">제외</text>

    <!-- ZoneAware -> Pod1 (priority, accent). fan point 1 on ZoneAware bottom edge -->
    <path d="M 610,220 V 256 Q 610,264 602,264 H 568 Q 560,264 560,272 V 340"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="568" y="258" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="584" y="267" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">우선</text>

    <!-- ZoneAware -> Pod2 (failover). fan point 2 on ZoneAware bottom edge, 60px from point 1 -->
    <path d="M 670,220 V 288 Q 670,296 678,296 H 692 Q 700,296 700,304 V 340"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="700" y="290" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="728" y="299" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">장애조치</text>

    <!-- Request node -->
    <rect x="180" y="76" width="140" height="40" rx="6" fill="#ffffff"/>
    <rect x="180" y="76" width="140" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="250" y="100" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">클라이언트 요청</text>

    <!-- Outlier node (focal) -->
    <rect x="180" y="180" width="140" height="40" rx="6" fill="#ffffff"/>
    <rect x="180" y="180" width="140" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="250" y="196" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Outlier Detection</text>
    <text x="250" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">비정상 인스턴스 제외</text>

    <!-- RateLimit node -->
    <rect x="380" y="180" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="440" y="196" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Rate Limiting</text>
    <text x="440" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">요청 속도 제한</text>

    <!-- ZoneAware node -->
    <rect x="560" y="180" width="160" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="640" y="196" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Zone Aware Routing</text>
    <text x="640" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">지역 우선 라우팅</text>

    <!-- Pod3 unhealthy (under Outlier) -->
    <rect x="190" y="340" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="190" y="340" width="120" height="40" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1"/>
    <text x="250" y="356" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod 3</text>
    <text x="250" y="372" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">에러 발생</text>

    <!-- Pod1 (under ZoneAware, priority target) -->
    <rect x="500" y="340" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="500" y="340" width="120" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="560" y="356" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod 1</text>
    <text x="560" y="372" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Zone A</text>

    <!-- Pod2 (under ZoneAware, failover target) -->
    <rect x="640" y="340" width="120" height="40" rx="6" fill="#ffffff"/>
    <rect x="640" y="340" width="120" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="700" y="356" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod 2</text>
    <text x="700" y="372" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Zone B</text>

    <!-- legend -->
    <line x1="60" y1="480" x2="900" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="180" y1="492" x2="204" y2="492" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="212" y="496" fill="#545B64" font-size="9">우선 라우팅</text>
    <line x1="340" y1="492" x2="364" y2="492" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="372" y="496" fill="#545B64" font-size="9">장애조치</text>
    <line x1="480" y1="492" x2="504" y2="492" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="512" y="496" fill="#545B64" font-size="9">제외 대상</text>
  </svg>