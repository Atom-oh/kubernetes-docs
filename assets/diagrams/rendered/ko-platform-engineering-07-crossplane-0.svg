    <title id="ko-platform-engineering-07-crossplane-0-title">Crossplane 멀티클라우드 컨트롤 플레인</title>
    <desc id="ko-platform-engineering-07-crossplane-0-desc">개발자 Namespace의 Claim이 Crossplane 컨트롤 플레인 안에서 Composite Resource, XRD, Composition을 거쳐 Managed Resource로 변환되고, Provider가 이를 AWS·GCP·Azure API로 각각 프로비저닝하는 흐름을 보여주는 아키텍처 다이어그램.</desc>
