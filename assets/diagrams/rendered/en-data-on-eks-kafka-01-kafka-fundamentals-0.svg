<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kafka-partitioning-ttl kafka-partitioning-desc">
  <title id="kafka-partitioning-ttl">Kafka producer, partitioned topic, and consumer group</title>
  <desc id="kafka-partitioning-desc">A producer writes to three leader partitions of the "orders" topic spread across a Kafka cluster; each partition is read by exactly one consumer in the "order-processor" consumer group, giving one-to-one partition-to-consumer assignment.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- header -->
  <text x="40" y="24" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.14em">APACHE KAFKA</text>
  <text x="40" y="44" fill="#232F3E" font-size="16" font-weight="700">Topic Partitioning &amp; Consumer Groups</text>

  <!-- zones (drawn before arrows/nodes) -->
  <rect x="280" y="64" width="280" height="528" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="300" y="68" width="98" height="12" rx="2" fill="#ffffff"/>
  <text x="349" y="77" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">KAFKA CLUSTER</text>

  <rect x="680" y="64" width="240" height="528" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="700" y="68" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="756" y="77" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">CONSUMER GROUP</text>
  <rect x="700" y="84" width="120" height="11" rx="2" fill="#ffffff"/>
  <text x="700" y="92" fill="#7D8998" font-size="8" class="mono">order-processor</text>

  <!-- arrows: producer -> partitions (drawn before nodes) -->
  <path d="M180,284 H234 Q242,284 242,276 V166 Q242,158 250,158 H304"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="196" y="204" width="52" height="12" rx="2" fill="#ffffff"/>
  <text x="222" y="213" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">PRODUCE</text>

  <path d="M180,300 H234 Q242,300 242,308 V314 Q242,322 250,322 H304"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M180,316 H234 Q242,316 242,324 V478 Q242,486 250,486 H304"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- arrows: partition -> consumer (straight, shared y) -->
  <line x1="536" y1="158" x2="704" y2="158" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="536" y1="322" x2="704" y2="322" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="536" y1="486" x2="704" y2="486" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Producer node (focal) -->
  <rect x="40" y="268" width="140" height="64" rx="6" fill="#ffffff"/>
  <rect x="40" y="268" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <rect x="48" y="274" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.40)" stroke-width="0.8"/>
  <text x="64" y="283" fill="rgba(236,114,17,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">MSG</text>
  <text x="110" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Producer</text>
  <text x="110" y="320" fill="#545B64" font-size="9" class="mono" text-anchor="middle">topic: orders</text>

  <!-- Partition boxes -->
  <rect x="304" y="128" width="232" height="60" rx="6" fill="#ffffff"/>
  <rect x="304" y="128" width="232" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="312" y="134" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="330" y="143" fill="rgba(35,47,62,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">PART</text>
  <text x="420" y="158" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Partition 0</text>
  <text x="420" y="174" fill="#545B64" font-size="9" class="mono" text-anchor="middle">broker 1 · leader</text>

  <rect x="304" y="292" width="232" height="60" rx="6" fill="#ffffff"/>
  <rect x="304" y="292" width="232" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="312" y="298" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="330" y="307" fill="rgba(35,47,62,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">PART</text>
  <text x="420" y="322" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Partition 1</text>
  <text x="420" y="338" fill="#545B64" font-size="9" class="mono" text-anchor="middle">broker 2 · leader</text>

  <rect x="304" y="456" width="232" height="60" rx="6" fill="#ffffff"/>
  <rect x="304" y="456" width="232" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="312" y="462" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="330" y="471" fill="rgba(35,47,62,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">PART</text>
  <text x="420" y="486" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Partition 2</text>
  <text x="420" y="502" fill="#545B64" font-size="9" class="mono" text-anchor="middle">broker 3 · leader</text>

  <!-- Consumer boxes -->
  <rect x="704" y="130" width="192" height="56" rx="6" fill="#ffffff"/>
  <rect x="704" y="130" width="192" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="712" y="136" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="730" y="145" fill="rgba(35,47,62,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">CONS</text>
  <text x="800" y="160" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Consumer 1</text>
  <text x="800" y="176" fill="#545B64" font-size="9" class="mono" text-anchor="middle">reads: partition 0</text>

  <rect x="704" y="294" width="192" height="56" rx="6" fill="#ffffff"/>
  <rect x="704" y="294" width="192" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="712" y="300" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="730" y="309" fill="rgba(35,47,62,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">CONS</text>
  <text x="800" y="324" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Consumer 2</text>
  <text x="800" y="340" fill="#545B64" font-size="9" class="mono" text-anchor="middle">reads: partition 1</text>

  <rect x="704" y="458" width="192" height="56" rx="6" fill="#ffffff"/>
  <rect x="704" y="458" width="192" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="712" y="464" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="730" y="473" fill="rgba(35,47,62,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">CONS</text>
  <text x="800" y="488" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Consumer 3</text>
  <text x="800" y="504" fill="#545B64" font-size="9" class="mono" text-anchor="middle">reads: partition 2</text>

</svg>