<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="lb-choice-title lb-choice-desc">
  <title id="lb-choice-title">인그레스 선택 가이드 흐름도</title>
  <desc id="lb-choice-desc">AWS 네이티브 통합, WAF/Shield, L4 고성능 필요 여부를 순서대로 물어 AWS ALB, NLB+Cilium, Cilium Gateway 중 하나로 귀결되는 의사결정 흐름을 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- ===== Arrows (drawn before nodes) ===== -->

  <!-- Start -> Q1 straight vertical -->
  <path d="M120,64 V112" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Q1 to Q2 via Yes, straight, y=160 -->
  <path d="M196,160 H304" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="232" y="140" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="247" y="149" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">YES</text>

  <!-- Q2 to Q3 via No, straight, y=160 -->
  <path d="M456,160 H564" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="493" y="140" width="26" height="12" rx="2" fill="#ffffff"/>
  <text x="506" y="149" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">NO</text>

  <!-- Q1 to Cilium via No, straight vertical, x=120, fan attach at x=98 on Cilium top -->
  <path d="M120,208 V282 Q120,290 112,290 H106 Q98,290 98,298 V314"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="128" y="240" width="26" height="12" rx="2" fill="#ffffff"/>
  <text x="141" y="249" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">NO</text>

  <!-- Q2 to ALB via Yes, straight vertical, x=380 -->
  <path d="M380,208 V314" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="388" y="212" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="403" y="221" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">YES</text>

  <!-- Q3 to NLBCilium via Yes, straight vertical, x=640 -->
  <path d="M640,208 V314" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="648" y="240" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="663" y="249" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">YES</text>

  <!-- Q3 to Cilium via No: from Q3 left vertex(564,160) left, dip below Q2, bridge-hop over ALB's vertical (x=380,y208 to 314) at y=260, continue to fan point x=146, down into Cilium top -->
  <path d="M564,160 H500 Q492,160 492,168 V252 H388 a8,8 0 0 1 16,0 H146 Q146,260 146,268 V314"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="492" y="232" width="26" height="12" rx="2" fill="#ffffff"/>
  <text x="505" y="241" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">NO</text>

  <!-- ALB -> Done (straight vertical, x=380) -->
  <path d="M380,366 V498" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Cilium -> Done (elbow: 120,366 -> 340,498) -->
  <path d="M120,366 V422 Q120,430 128,430 H332 Q340,430 340,438 V498"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- NLBCilium -> Done (elbow: 640,366 -> 420,498) -->
  <path d="M640,366 V422 Q640,430 632,430 H428 Q420,430 420,438 V498"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Nodes ===== -->

  <!-- Start (oval) -->
  <rect x="60" y="24" width="120" height="40" rx="20" fill="#ffffff"/>
  <rect x="60" y="24" width="120" height="40" rx="20" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="120" y="48" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">시작</text>

  <!-- Q1 diamond -->
  <path d="M120,112 L196,160 L120,208 L44,160 Z" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="120" y="154" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">AWS 네이티브</text>
  <text x="120" y="169" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">통합 필요?</text>

  <!-- Q2 diamond -->
  <path d="M380,112 L456,160 L380,208 L304,160 Z" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="380" y="154" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">WAF/Shield</text>
  <text x="380" y="169" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">필요?</text>

  <!-- Q3 diamond -->
  <path d="M640,112 L716,160 L640,208 L564,160 Z" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="640" y="154" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">고성능</text>
  <text x="640" y="169" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">L4 필요?</text>

  <!-- Cilium Gateway (focal action) -->
  <rect x="50" y="314" width="140" height="52" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="50" y="314" width="140" height="52" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="120" y="345" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Cilium Gateway</text>

  <!-- ALB (action) -->
  <rect x="310" y="314" width="140" height="52" rx="6" fill="#ffffff"/>
  <rect x="310" y="314" width="140" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="380" y="345" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">AWS ALB</text>

  <!-- NLBCilium (action) -->
  <rect x="570" y="314" width="140" height="52" rx="6" fill="#ffffff"/>
  <rect x="570" y="314" width="140" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="640" y="345" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">NLB + Cilium</text>

  <!-- Done (oval) -->
  <rect x="300" y="498" width="160" height="44" rx="22" fill="#ffffff"/>
  <rect x="300" y="498" width="160" height="44" rx="22" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="380" y="524" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">완료</text>
</svg>
