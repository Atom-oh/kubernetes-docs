    <title id="ko-ops-14-tekton-pipelines-4-title">Tekton Chains 서명 및 검증 파이프라인</title>
    <desc id="ko-ops-14-tekton-pipelines-4-desc">이미지 빌드 TaskRun의 완료를 Tekton Chains가 감지해 Cosign 서명과 SLSA Provenance / in-toto Attestation을 생성하고 Rekor 투명성 로그에 기록한 뒤, 배포 시점에 서명 검증과 정책 적용을 거쳐 Admission Control이 허용 여부를 결정하는 흐름을 보여주는 아키텍처 다이어그램.</desc>
