<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="certhier-title certhier-desc">
  <title id="certhier-title">인증서 계층 구조</title>
  <desc id="certhier-desc">10년 유효한 Root CA가 1년짜리 Intermediate CA를 발급하고, 그 Intermediate CA가 각 프록시의 24시간짜리 워크로드 인증서 두 개를 발급하는 3단 인증서 계층을 보여준다.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Zone -->
  <rect x="40" y="60" width="880" height="420" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="392" y="64" width="176" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CERTIFICATE HIERARCHY</text>

  <!-- Arrows -->
  <line x1="480" y1="164" x2="480" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <path d="M 480,320 V 358 Q 480,366 472,366 H 300 Q 292,366 292,374 V 396"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 480,320 V 358 Q 480,366 488,366 H 668 Q 676,366 676,374 V 396"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Root CA (store) -->
  <g>
    <rect x="360" y="108" width="240" height="56" rx="6" fill="#ffffff"/>
    <rect x="360" y="108" width="240" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Trust Anchor · Root CA</text>
    <text x="480" y="146" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">유효기간 1–10년</text>
  </g>

  <!-- Intermediate CA (focal) -->
  <g>
    <rect x="340" y="220" width="280" height="56" rx="6" fill="#ffffff"/>
    <rect x="340" y="220" width="280" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="242" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Identity Issuer · Intermediate CA</text>
    <text x="480" y="258" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">유효기간 1년</text>
  </g>

  <!-- Workload certs (leaves) -->
  <g>
    <rect x="172" y="396" width="240" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="292" y="418" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Workload Cert (Proxy 1)</text>
    <text x="292" y="434" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">유효기간 24시간</text>
  </g>
  <g>
    <rect x="556" y="396" width="240" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="676" y="418" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Workload Cert (Proxy 2)</text>
    <text x="676" y="434" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">유효기간 24시간</text>
  </g>

  <!-- Legend -->
  <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <circle cx="220" cy="548" r="4.5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="232" y="551" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif">가장 자주 회전(rotate)되는 발급자</text>
</svg>