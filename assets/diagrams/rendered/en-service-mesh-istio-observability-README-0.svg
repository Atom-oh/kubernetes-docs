<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pillars-title pillars-desc">
    <title id="pillars-title">Istio observability pillars feeding a unified view</title>
    <desc id="pillars-desc">Metrics, distributed tracing, and logging each collect their own signals, and all three feed into a single integrated observability layer with a unified dashboard, service topology, and alerting.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="p-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="p-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows first (behind boxes) -->
    <!-- Metrics -> Integration: elbow, off-axis -->
    <path d="M200,248 V264 Q200,272 208,272 H392 Q400,272 400,280 V296"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#p-arrow)"/>
    <!-- Tracing -> Integration: straight, shares x-axis -->
    <line x1="480" y1="248" x2="480" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#p-arrow)"/>
    <!-- Logging -> Integration: elbow, off-axis -->
    <path d="M760,248 V264 Q760,272 752,272 H568 Q560,272 560,280 V296"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#p-arrow)"/>

    <!-- Pillar: Metrics -->
    <rect x="80" y="88" width="240" height="160" rx="6" fill="#ffffff"/>
    <rect x="80" y="88" width="240" height="160" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="92" y="100" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="108" y="109" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MET</text>
    <text x="200" y="134" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics</text>
    <text x="200" y="150" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Golden signals</text>
    <line x1="96" y1="162" x2="304" y2="162" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="200" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Prometheus · OTel</text>
    <text x="200" y="200" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Grafana · Kiali</text>

    <!-- Pillar: Tracing -->
    <rect x="360" y="88" width="240" height="160" rx="6" fill="#ffffff"/>
    <rect x="360" y="88" width="240" height="160" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="372" y="100" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="388" y="109" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRC</text>
    <text x="480" y="134" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Distributed Tracing</text>
    <text x="480" y="150" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Request flow tracking</text>
    <line x1="376" y1="162" x2="584" y2="162" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="480" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Bottleneck analysis</text>
    <text x="480" y="200" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Jaeger · Zipkin · Tempo</text>

    <!-- Pillar: Logging -->
    <rect x="640" y="88" width="240" height="160" rx="6" fill="#ffffff"/>
    <rect x="640" y="88" width="240" height="160" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="652" y="100" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="668" y="109" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOG</text>
    <text x="760" y="134" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Logging</text>
    <text x="760" y="150" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Access logs</text>
    <line x1="656" y1="162" x2="864" y2="162" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="760" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Structured JSON</text>
    <text x="760" y="200" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Loki · Elasticsearch</text>

    <!-- Hub: Integrated Observability (focal) -->
    <rect x="320" y="296" width="320" height="120" rx="6" fill="#ffffff"/>
    <rect x="320" y="296" width="320" height="120" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="332" y="308" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="348" y="317" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HUB</text>
    <text x="480" y="342" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Integrated Observability</text>
    <text x="480" y="358" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Dashboard — Grafana</text>
    <line x1="336" y1="370" x2="624" y2="370" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="480" y="388" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Topology — Kiali</text>
    <text x="480" y="408" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Alerting — Alertmanager</text>
  </svg>