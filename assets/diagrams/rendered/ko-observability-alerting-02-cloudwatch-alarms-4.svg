<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eventbridge-title eventbridge-desc">
    <title id="eventbridge-title">EventBridge 자동 대응 구성</title>
    <desc id="eventbridge-desc">CloudWatch Alarm 상태 변경이 EventBridge 규칙을 거쳐 자동 스케일링, 인스턴스 재시작, Slack 알림, Runbook 실행, 복구 워크플로우 등 다섯 가지 자동 대응으로 분기되는 구조.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ ARROWS ============ -->
    <!-- A -> B accent (EventBridge is focal/hub) -->
    <path d="M204,300 H332" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- B -> C -->
    <path d="M492,300 H548" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- C fan-out to 5 destinations, attach points fanned on C's right edge (edge length ~96, 5 pts at k/(6)*96) -->
    <!-- destinations D..H at x=712, y = 88,192,296,400,504 (centers), each spaced 104px -->
    <path d="M632,268 H676 Q684,268 684,260 V88  H648" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M632,284 H692 Q700,284 700,276 V192 H648" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M632,300 H648" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M632,316 H700 Q708,316 708,324 V400 H648" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M632,332 H684 Q692,332 692,340 V504 H648" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ============ NODES ============ -->
    <!-- A CloudWatch Alarm -->
    <rect x="60" y="276" width="144" height="48" rx="6" fill="#ffffff"/>
    <rect x="60" y="276" width="144" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="132" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch Alarm</text>

    <!-- B EventBridge (focal) -->
    <rect x="332" y="276" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="332" y="276" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="412" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EventBridge</text>

    <!-- C Event Rule diamond -->
    <polygon points="588,268 632,284 632,316 588,332 544,316 544,284" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="588" y="304" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Event</text>
    <text x="588" y="316" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rule</text>

    <!-- D..H destination nodes -->
    <rect x="648" y="64" width="220" height="48" rx="6" fill="#ffffff"/>
    <rect x="648" y="64" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="758" y="84" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Lambda: 자동 스케일링</text>
    <text x="758" y="98" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auto-scale</text>

    <rect x="648" y="168" width="220" height="48" rx="6" fill="#ffffff"/>
    <rect x="648" y="168" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="758" y="188" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Lambda: 인스턴스 재시작</text>
    <text x="758" y="202" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reboot</text>

    <rect x="648" y="272" width="220" height="48" rx="6" fill="#ffffff"/>
    <rect x="648" y="272" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="758" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Lambda: Slack 알림</text>
    <text x="758" y="306" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">notify</text>

    <rect x="648" y="376" width="220" height="48" rx="6" fill="#ffffff"/>
    <rect x="648" y="376" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="758" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SSM: Runbook 실행</text>
    <text x="758" y="410" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">automation</text>

    <rect x="648" y="480" width="220" height="48" rx="6" fill="#ffffff"/>
    <rect x="648" y="480" width="220" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="758" y="500" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Step Functions: 복구</text>
    <text x="758" y="514" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">recovery-workflow</text>

  </svg>