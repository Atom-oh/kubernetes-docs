<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" role="img" aria-labelledby="routing-title routing-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="routing-title">알림 라우팅 결정 트리</title>
    <desc id="routing-desc">알림이 심각도에 따라 전화·Slack·이메일 등 채널로 나뉘고, 다시 인프라·애플리케이션·데이터베이스·보안 담당 팀으로 갈라지는 2단계 라우팅 구조를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="640" fill="#ffffff"/>

    <!-- A -> B -->
    <line x1="480" y1="88" x2="480" y2="120" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- B -> C,D,E,F -->
    <path d="M 460,172 V 188 Q 460,196 452,196 H 248 Q 240,196 240,204 V 220" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 473,178 V 191 Q 473,199 465,199 H 408 Q 400,199 400,207 V 220" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 487,178 V 191 Q 487,199 495,199 H 552 Q 560,199 560,207 V 220" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 500,172 V 188 Q 500,196 508,196 H 712 Q 720,196 720,204 V 220" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="248" y="200" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="292" y="209" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">CRITICAL</text>
    <rect x="410" y="207" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="445" y="216" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">HIGH</text>
    <rect x="480" y="207" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="516" y="216" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">WARNING</text>
    <rect x="630" y="200" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="660" y="209" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">INFO</text>

    <!-- C,D,E -> G (F has no further edge) -->
    <path d="M 240,276 V 310 Q 240,318 248,318 H 370 Q 378,318 378,326 V 360" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="400" y1="276" x2="400" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 560,276 V 310 Q 560,318 552,318 H 430 Q 422,318 422,326 V 360" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- G -> H,I,J,K -->
    <path d="M 382,388 V 446 Q 382,454 374,454 H 248 Q 240,454 240,462 V 520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="400" y1="404" x2="400" y2="520" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 411,394 V 449 Q 411,457 419,457 H 552 Q 560,457 560,465 V 520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 425,382 V 443 Q 425,451 433,451 H 712 Q 720,451 720,459 V 520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="248" y="484" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="274" y="493" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">인프라</text>
    <rect x="408" y="440" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="443" y="449" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">애플리케이션</text>
    <rect x="568" y="484" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="606" y="493" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">데이터베이스</text>
    <rect x="650" y="478" width="42" height="12" rx="2" fill="#ffffff"/>
    <text x="671" y="487" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">보안</text>

    <!-- Node A: start oval -->
    <rect x="410" y="40" width="140" height="48" rx="20" fill="rgba(35,47,62,0.05)" stroke="#7D8998" stroke-width="1"/>
    <text x="480" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">알림 발생</text>

    <!-- Node B: decision diamond -->
    <polygon points="480,120 516,152 480,184 444,152" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="149" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">심각도?</text>

    <!-- Node C: focal (Critical) -->
    <rect x="170" y="220" width="140" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="240" y="245" fill="#EC7211" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">즉시 전화/SMS</text>
    <text x="240" y="260" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1차 온콜</text>

    <!-- Node D -->
    <rect x="330" y="220" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="400" y="252" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Slack + PagerDuty</text>

    <!-- Node E -->
    <rect x="490" y="220" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="560" y="252" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Slack 채널</text>

    <!-- Node F -->
    <rect x="650" y="220" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="252" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Email</text>

    <!-- Node G: decision diamond -->
    <polygon points="400,340 436,372 400,404 364,372" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="400" y="369" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">팀</text>
    <text x="400" y="381" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">구분?</text>

    <!-- Node H -->
    <rect x="170" y="520" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="240" y="552" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SRE 팀</text>

    <!-- Node I -->
    <rect x="330" y="520" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="400" y="552" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">개발 팀</text>

    <!-- Node J -->
    <rect x="490" y="520" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="560" y="552" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">DBA 팀</text>

    <!-- Node K -->
    <rect x="650" y="520" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="552" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">보안 팀</text>

    <!-- Legend -->
    <line x1="24" y1="604" x2="936" y2="604" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="620" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="220" cy="616" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="232" y="620" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">최우선 대응 경로 (초점)</text>
  </svg>