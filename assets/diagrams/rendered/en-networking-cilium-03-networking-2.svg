<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overlay-arch-title overlay-arch-desc">
    <title id="overlay-arch-title">Cilium overlay network architecture</title>
    <desc id="overlay-arch-desc">Architecture diagram showing a container on Host A reaching a container on Host B through each host's eBPF datapath and VTEP, which exchange VXLAN-encapsulated traffic over the shared physical network.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="60" width="380" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="64" y="64" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="96" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HOST A</text>

    <rect x="540" y="60" width="380" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="564" y="64" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="596" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HOST B</text>

    <!-- Arrows (before nodes) -->
    <line x1="230" y1="164" x2="230" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="230" y1="284" x2="230" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="730" y1="164" x2="730" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="730" y1="284" x2="730" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M 230,404 V 436 Q 230,444 238,444 H 412 Q 420,444 420,452 V 484"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
    <path d="M 730,404 V 436 Q 730,444 722,444 H 548 Q 540,444 540,452 V 484"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>

    <!-- Arrow labels -->
    <rect x="304" y="424" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="328" y="434" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VXLAN</text>

    <rect x="608" y="424" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="632" y="434" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VXLAN</text>

    <!-- Host A nodes -->
    <rect x="90" y="100" width="280" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="98" y="108" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="112" y="117" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
    <text x="230" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Container A</text>
    <text x="230" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.0.1</text>

    <rect x="90" y="220" width="280" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="98" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="112" y="237" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BPF</text>
    <text x="230" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF Datapath</text>
    <text x="230" y="264" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">policy + encap</text>

    <rect x="90" y="340" width="280" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="98" y="348" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
    <text x="112" y="357" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEP</text>
    <text x="230" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VTEP</text>
    <text x="230" y="384" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.1</text>

    <!-- Host B nodes -->
    <rect x="590" y="100" width="280" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="598" y="108" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="612" y="117" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
    <text x="730" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Container B</text>
    <text x="730" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.0.2</text>

    <rect x="590" y="220" width="280" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="598" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="612" y="237" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BPF</text>
    <text x="730" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF Datapath</text>
    <text x="730" y="264" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">policy + decap</text>

    <rect x="590" y="340" width="280" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="598" y="348" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
    <text x="612" y="357" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEP</text>
    <text x="730" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VTEP</text>
    <text x="730" y="384" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.1.2</text>

    <!-- Physical Network (shared) -->
    <rect x="380" y="484" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="388" y="492" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="402" y="501" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NET</text>
    <text x="480" y="512" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Physical Network</text>
    <text x="480" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L3 underlay</text>

    <!-- Legend -->
    <line x1="40" y1="564" x2="920" y2="564" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="140" y="574" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="160" y="582" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">eBPF datapath</text>

    <rect x="320" y="574" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="340" y="582" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">VTEP</text>

    <rect x="440" y="574" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="460" y="582" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">External network</text>

    <line x1="620" y1="579" x2="648" y2="579" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
    <text x="656" y="582" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Bidirectional tunnel</text>
  </svg>