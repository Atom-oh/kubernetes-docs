<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="tm0-title tm0-desc">
      <title id="tm0-title">Istio 트래픽 관리 핵심 리소스 흐름</title>
      <desc id="tm0-desc">클라이언트 요청이 Gateway, VirtualService, DestinationRule을 차례로 거쳐 세 개의 서비스 버전으로 분배되며, 90%는 주 트래픽, 10%는 Canary, 나머지는 Mirror로 전달된다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zone 1: Istio Traffic Management -->
      <rect x="224" y="228" width="456" height="144" rx="8"
            fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="236" y="232" width="200" height="12" rx="2" fill="#ffffff"/>
      <text x="336" y="241" fill="rgba(35,47,62,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ISTIO TRAFFIC MANAGEMENT</text>

      <!-- Zone 2: 서비스 -->
      <rect x="712" y="140" width="152" height="324" rx="8"
            fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="756" y="144" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="788" y="153" fill="rgba(35,47,62,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">서비스</text>

      <!-- Arrows (drawn before nodes) -->
      <!-- Client -> Gateway -->
      <line x1="200" y1="300" x2="248" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="208" y="280" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="224" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">요청</text>

      <!-- Gateway -> VirtualService -->
      <line x1="352" y1="300" x2="400" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="356" y="280" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="376" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">라우팅</text>

      <!-- VirtualService -> DestinationRule -->
      <line x1="504" y1="300" x2="552" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="512" y="280" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="528" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">정책</text>

      <!-- DestinationRule -> Version 1 (primary, accent) -->
      <line x1="656" y1="300" x2="736" y2="300" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="672" y="280" width="48" height="12" rx="2" fill="#ffffff"/>
      <text x="696" y="289" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">주 트래픽</text>

      <!-- DestinationRule -> Version 2 (canary, up) -->
      <path d="M656,284 H688 Q696,284 696,276 V200 Q696,192 704,192 H736"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="704" y="232" width="72" height="12" rx="2" fill="#ffffff"/>
      <text x="740" y="241" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">CANARY 10%</text>

      <!-- DestinationRule -> Version 3 (mirror, down) -->
      <path d="M656,316 H688 Q696,316 696,324 V400 Q696,408 704,408 H736"
            fill="none" stroke="#545B64" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="704" y="356" width="44" height="12" rx="2" fill="#ffffff"/>
      <text x="726" y="365" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">미러링</text>

      <!-- Node: Client (input) -->
      <rect x="96" y="268" width="104" height="64" rx="6" fill="#ffffff"/>
      <rect x="96" y="268" width="104" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="148" y="296" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">클라이언트</text>
      <text x="148" y="312" fill="#545B64" font-size="9"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">요청 발생</text>

      <!-- Node: Gateway -->
      <rect x="248" y="268" width="104" height="64" rx="6" fill="#ffffff"/>
      <rect x="248" y="268" width="104" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="300" y="296" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">Gateway</text>
      <text x="300" y="312" fill="#545B64" font-size="9"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">외부 트래픽 진입</text>

      <!-- Node: VirtualService -->
      <rect x="400" y="268" width="104" height="64" rx="6" fill="#ffffff"/>
      <rect x="400" y="268" width="104" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="452" y="296" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">VirtualService</text>
      <text x="452" y="312" fill="#545B64" font-size="9"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">라우팅 규칙</text>

      <!-- Node: DestinationRule (focal) -->
      <rect x="552" y="268" width="104" height="64" rx="6" fill="#ffffff"/>
      <rect x="552" y="268" width="104" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="604" y="296" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">DestinationRule</text>
      <text x="604" y="312" fill="#545B64" font-size="9"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">트래픽 정책</text>

      <!-- Node: Version 2 (canary, top) -->
      <rect x="736" y="160" width="104" height="64" rx="6" fill="#ffffff"/>
      <rect x="736" y="160" width="104" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="788" y="188" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">Version 2</text>
      <text x="788" y="204" fill="#545B64" font-size="9"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">10% · Canary</text>

      <!-- Node: Version 1 (primary, middle) -->
      <rect x="736" y="268" width="104" height="64" rx="6" fill="#ffffff"/>
      <rect x="736" y="268" width="104" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="788" y="296" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">Version 1</text>
      <text x="788" y="312" fill="#545B64" font-size="9"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">90% · 주 트래픽</text>

      <!-- Node: Version 3 (mirror, bottom) -->
      <rect x="736" y="376" width="104" height="64" rx="6" fill="#ffffff"/>
      <rect x="736" y="376" width="104" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="788" y="404" fill="#232F3E" font-size="12" font-weight="600"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            text-anchor="middle">Version 3</text>
      <text x="788" y="420" fill="#545B64" font-size="9"
            font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Mirror · 테스트</text>
    </svg>
