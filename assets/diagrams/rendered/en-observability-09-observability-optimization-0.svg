<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="pillars-title pillars-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="pillars-title">The three pillars of observability and how they cross-reference each other</title>
    <desc id="pillars-desc">Logging, Metrics, and Tracing shown as three peer pillars, each with its own data shape and best-fit question, linked by a dashed cycle of correlation signals — exemplars, trace context, and correlation IDs — that let an engineer jump between them.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ===== Connectors (drawn before boxes) ===== -->
    <!-- Logging -> Metrics : Exemplars -->
    <line x1="280" y1="228" x2="360" y2="228" stroke="#EC7211" stroke-width="1.2"
          stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <rect x="284" y="208" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="217" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">EXEMPLARS</text>

    <!-- Metrics -> Tracing : Context -->
    <line x1="600" y1="228" x2="680" y2="228" stroke="#EC7211" stroke-width="1.2"
          stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <rect x="612" y="208" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="640" y="217" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">CONTEXT</text>

    <!-- Tracing -> Logging : Correlation ID (routes under the row) -->
    <path d="M 800,316 V 356 Q 800,364 792,364 H 168 Q 160,364 160,356 V 316"
          fill="none" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="5,4"
          marker-end="url(#arrow-accent)"/>
    <rect x="428" y="344" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="353" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">CORRELATION ID</text>

    <!-- ===== Nodes ===== -->
    <!-- Logging -->
    <rect x="40" y="140" width="240" height="176" rx="6" fill="#ffffff"/>
    <rect x="40" y="140" width="240" height="176" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="176" fill="#232F3E" font-size="16" font-weight="700"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Logging</text>
    <line x1="60" y1="192" x2="260" y2="192" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
    <text x="60" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">— Event-based</text>
    <text x="60" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">— Unstructured data</text>
    <text x="60" y="268" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">— Optimal for debugging</text>
    <rect x="60" y="288" width="120" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="120" y="297" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.1em">"WHAT HAPPENED?"</text>

    <!-- Metrics -->
    <rect x="360" y="140" width="240" height="176" rx="6" fill="#ffffff"/>
    <rect x="360" y="140" width="240" height="176" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="176" fill="#232F3E" font-size="16" font-weight="700"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics</text>
    <line x1="380" y1="192" x2="580" y2="192" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
    <text x="380" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">— Time-series data</text>
    <text x="380" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">— Aggregated values</text>
    <text x="380" y="268" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">— Optimal for alerting</text>
    <rect x="380" y="288" width="150" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="455" y="297" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.1em">"IS IT HEALTHY?"</text>

    <!-- Tracing -->
    <rect x="680" y="140" width="240" height="176" rx="6" fill="#ffffff"/>
    <rect x="680" y="140" width="240" height="176" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="800" y="176" fill="#232F3E" font-size="16" font-weight="700"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tracing</text>
    <line x1="700" y1="192" x2="900" y2="192" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
    <text x="700" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">— Request flow tracking</text>
    <text x="700" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">— Causality analysis</text>
    <text x="700" y="268" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">— Perf. analysis-optimal</text>
    <rect x="700" y="288" width="130" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="765" y="297" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.1em">"WHY IS IT SLOW?"</text>

    <!-- Legend -->
    <line x1="40" y1="422" x2="920" y2="422" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="440" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace"
          letter-spacing="0.14em">LEGEND</text>
    <line x1="150" y1="437" x2="182" y2="437" stroke="#EC7211" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="192" y="440" fill="#545B64" font-size="9"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Cross-pillar correlation signal (dashed, shared identifier)</text>
  </svg>