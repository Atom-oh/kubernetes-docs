<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="sglang-title sglang-desc">
    <title id="sglang-title">SGLang 아키텍처</title>
    <desc id="sglang-desc">SGLang의 프론트엔드 API가 RadixAttention 기반 런타임 엔진으로 요청을 보내고, 이 엔진이 KV 캐시 재사용과 스케줄 오버래핑 같은 최적화 기법을 구동하는 3계층 구조를 보여주는 다이어그램.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Frontend -->
    <rect x="40" y="148" width="240" height="204" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="112" y="152" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="160" y="161" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">프론트엔드</text>

    <!-- Zone: Optimization -->
    <rect x="680" y="148" width="240" height="204" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="748" y="152" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="800" y="161" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">최적화</text>

    <!-- Arrows -->
    <!-- SGLang DSL -> Runtime -->
    <path d="M 280,212 H 380" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- OpenAI-compat API -> Runtime -->
    <path d="M 280,300 H 340 Q 348,300 348,292 V 252" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- RadixAttention -> KV cache reuse -->
    <line x1="620" y1="212" x2="672" y2="212" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Compressed FSM -> Overlap schedule -->
    <path d="M 620,300 H 648 Q 656,300 656,292 V 252" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="304" y="200" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="330" y="209" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PROGRAM</text>

    <rect x="292" y="262" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="312" y="271" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">REQ</text>

    <rect x="632" y="200" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="650" y="209" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">REUSE</text>

    <rect x="666" y="264" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="684" y="273" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SCHED</text>

    <!-- Frontend nodes -->
    <rect x="64" y="180" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="180" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="164" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">SGLang DSL</text>
    <text x="164" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">프로그래밍 인터페이스</text>

    <rect x="64" y="268" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="268" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="164" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">OpenAI 호환 API</text>
    <text x="164" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">네이티브 API 포함</text>

    <!-- Runtime engine (focal) -->
    <rect x="380" y="176" width="240" height="216" rx="6" fill="#ffffff"/>
    <rect x="380" y="176" width="240" height="216" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="500" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">런타임 엔진</text>
    <text x="500" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">RadixAttention</text>
    <text x="500" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">압축 FSM 구조화 출력</text>
    <text x="500" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Chunked Prefill</text>
    <text x="500" y="276" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">FlashInfer 커널</text>

    <!-- Optimization nodes -->
    <rect x="704" y="180" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="704" y="180" width="192" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="800" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">KV 캐시 재사용</text>
    <text x="800" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">RadixAttention 기반</text>

    <rect x="704" y="268" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="704" y="268" width="192" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="800" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">스케줄 오버래핑</text>
    <text x="800" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">데이터 병렬 처리 포함</text>

    <!-- Legend -->
    <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="456" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="468" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="476" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">런타임 엔진 (focal)</text>

    <rect x="228" y="468" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="248" y="476" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">API 인터페이스</text>

    <rect x="380" y="468" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="400" y="476" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">최적화 기법</text>
  </svg>