    <title id="eksmon-title">EKS 모니터링 및 로깅 아키텍처</title>
    <desc id="eksmon-desc">EKS 클러스터의 컨트롤 플레인 로그와 워커 노드가 Prometheus 기반 모니터링 스택과 Fluent Bit 기반 로깅 스택을 거쳐 CloudWatch·OpenSearch로 전달되고, 다시 Grafana·OpenSearch Dashboards·알림 채널로 시각화·통보되는 흐름을 보여준다.</desc>
