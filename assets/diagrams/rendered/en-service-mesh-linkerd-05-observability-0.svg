<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="d0title d0desc">
  <title id="d0title">Linkerd observability architecture</title>
  <desc id="d0desc">Data-plane proxies export metrics to the Viz extension's Prometheus, which feeds Grafana and the web dashboard while forwarding to an optional external Prometheus/Grafana pair, and proxies also stream spans directly to Jaeger for distributed tracing.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="32" y="28" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">LINKERD &#183; VIZ EXTENSION</text>
  <text x="32" y="52" font-size="20" font-weight="700" fill="#232F3E">Observability Architecture</text>

  <!-- Zone 1: Data Plane -->
  <rect x="32" y="76" width="224" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="48" y="80" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="92" y="89" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)">DATA PLANE</text>

  <!-- Zone 2: Viz Extension -->
  <rect x="32" y="216" width="896" height="208" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="48" y="220" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="96" y="229" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)">VIZ EXTENSION</text>

  <!-- Zone 3: External (optional) -->
  <rect x="32" y="456" width="896" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="48" y="460" width="152" height="12" rx="2" fill="#ffffff"/>
  <text x="124" y="469" text-anchor="middle" class="mono" font-size="7" letter-spacing="0.14em" fill="rgba(35,47,62,0.40)">EXTERNAL (OPTIONAL)</text>

  <!-- ================= ARROWS (drawn before nodes) ================= -->

  <!-- Proxies -> PROM (:4191) -->
  <path d="M134,164 V196 Q134,204 134,204 V240"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="116" y="200" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="134" y="209" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.06em" fill="#7D8998">:4191</text>

  <!-- Proxies -> JAEGER (right corridor, x=848) -->
  <path d="M224,150 H840 Q848,150 848,158 V480"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- PROM -> METRICS (same row, straight) -->
  <line x1="204" y1="280" x2="244" y2="280" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- PROM -> GRAF (elbow via gap band, into col2 row2) -->
  <path d="M134,312 V328 Q134,336 142,336 H306 Q314,336 314,344 V344"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- METRICS -> WEB (elbow via gap band) -->
  <path d="M314,312 V328 Q314,336 322,336 H466 Q474,336 474,344 V344"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- TAP -> WEB (elbow via gap band, fanned attach on WEB top) -->
  <path d="M674,312 V328 Q674,336 666,336 H522 Q514,336 514,344 V344"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- PROM -> EXT_PROM (down through empty col1 row2, jog around zone label) -->
  <path d="M134,312 V330 Q134,338 126,338 H90 Q82,338 82,346 V480"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- EXT_PROM -> EXT_GRAF (same row, straight) -->
  <line x1="204" y1="520" x2="244" y2="520" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ================= NODES ================= -->

  <!-- Proxy fleet -->
  <rect x="64" y="108" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="64" y="108" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="144" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Proxy Fleet</text>
  <text x="144" y="148" text-anchor="middle" class="mono" font-size="9" fill="#545B64">&#215;N &#183; metrics collect</text>

  <!-- Jaeger -->
  <rect x="784" y="488" width="140" height="64" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="784" y="488" width="140" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="854" y="516" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Jaeger</text>
  <text x="854" y="532" text-anchor="middle" class="mono" font-size="9" fill="#545B64">distributed tracing</text>

  <!-- PROM (focal) -->
  <rect x="64" y="248" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="64" y="248" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="134" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Prometheus</text>
  <text x="134" y="292" text-anchor="middle" class="mono" font-size="9" fill="#545B64">metrics storage</text>

  <!-- METRICS -->
  <rect x="244" y="248" width="140" height="64" rx="6" fill="#ffffff"/>
  <rect x="244" y="248" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="314" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Metrics API</text>
  <text x="314" y="292" text-anchor="middle" class="mono" font-size="9" fill="#545B64">aggregation</text>

  <!-- TAP -->
  <rect x="604" y="248" width="140" height="64" rx="6" fill="#ffffff"/>
  <rect x="604" y="248" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="674" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Tap API</text>
  <text x="674" y="292" text-anchor="middle" class="mono" font-size="9" fill="#545B64">real-time stream</text>

  <!-- GRAF -->
  <rect x="244" y="344" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)"/>
  <rect x="244" y="344" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="314" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Grafana</text>
  <text x="314" y="388" text-anchor="middle" class="mono" font-size="9" fill="#545B64">visualization</text>

  <!-- WEB -->
  <rect x="424" y="344" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)"/>
  <rect x="424" y="344" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="494" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Web Dashboard</text>
  <text x="494" y="388" text-anchor="middle" class="mono" font-size="9" fill="#545B64">UI</text>

  <!-- EXT_PROM -->
  <rect x="64" y="488" width="140" height="64" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="64" y="488" width="140" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="134" y="516" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Ext. Prometheus</text>
  <text x="134" y="532" text-anchor="middle" class="mono" font-size="9" fill="#545B64">external cluster</text>

  <!-- EXT_GRAF -->
  <rect x="244" y="488" width="140" height="64" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="244" y="488" width="140" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="314" y="516" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Ext. Grafana</text>
  <text x="314" y="532" text-anchor="middle" class="mono" font-size="9" fill="#545B64">external cluster</text>

  <!-- Legend -->
  <line x1="32" y1="584" x2="928" y2="584" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <circle cx="40" cy="594" r="4" fill="none" stroke="#545B64" stroke-width="1.2"/>
  <text x="50" y="597" class="mono" font-size="8" fill="#545B64">SOLID = METRICS/DATA PATH</text>
  <line x1="280" y1="594" x2="300" y2="594" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="308" y="597" class="mono" font-size="8" fill="#545B64">DASHED = TRACING (OPT-IN)</text>
</svg>