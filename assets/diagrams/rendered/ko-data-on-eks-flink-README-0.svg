<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">Flink Kubernetes Operator 조정 흐름</title>
  <desc id="ddesc">운영자가 FlinkDeployment CR을 적용하면 Kubernetes API Server를 거쳐 Flink Kubernetes Operator가 JobManager Pod를 생성/조정하고, JobManager는 API Server의 ResourceManager를 통해 TaskManager Pod를 요청/반납하며 두 TaskManager와 서브태스크 스케줄링 및 체크포인트를 주고받는다.</desc>

  <rect width="960" height="600" fill="var(--paper)"/>

  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <!-- ============ ARROWS (drawn before boxes) ============ -->

  <!-- U -> API : straight vertical, shared x -->
  <line x1="480" y1="88" x2="480" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="410" y="102" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="111" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">CR 적용 (kubectl)</text>

  <!-- API -> OP : straight vertical, no label -->
  <line x1="480" y1="188" x2="480" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- OP -> JM : straight vertical, accent (focal action) -->
  <line x1="480" y1="296" x2="480" y2="356" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="428" y="316" width="104" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="325" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">생성 / 조정</text>

  <!-- JM -> API : routed right of OP, avoids passing behind OP box -->
  <path d="M 560,380 H 692 Q 700,380 700,372 V 172 Q 700,164 692,164 H 560"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="708" y="264" width="120" height="24" rx="2" fill="#ffffff"/>
  <text x="768" y="274" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.05em">RESOURCEMANAGER</text>
  <text x="768" y="285" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.05em">POD 요청 · 반납</text>

  <!-- JM <-> TM1 : bidirectional, fanned bottom attach at x=440 -->
  <path d="M 440,404 V 436 Q 440,444 432,444 H 328 Q 320,444 320,452 V 480"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <rect x="352" y="414" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="400" y="423" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.05em">체크포인트 트리거</text>

  <!-- JM <-> TM2 : bidirectional, fanned bottom attach at x=520 -->
  <path d="M 520,404 V 436 Q 520,444 528,444 H 632 Q 640,444 640,452 V 480"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <rect x="512" y="414" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="560" y="423" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.05em">체크포인트 트리거</text>

  <!-- ============ NODES ============ -->

  <!-- U : 운영자 (input) -->
  <rect x="400" y="40" width="160" height="48" rx="6" fill="#ffffff"/>
  <rect x="400" y="40" width="160" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <rect x="408" y="46" width="34" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.6)" stroke-width="0.8"/>
  <text x="425" y="55" fill="#545B64" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="480" y="68" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">운영자</text>
  <text x="480" y="80" fill="#545B64" font-size="9" class="mono" text-anchor="middle">FlinkDeployment CR</text>

  <!-- API : Kubernetes API Server (backend) -->
  <rect x="400" y="140" width="160" height="48" rx="6" fill="#ffffff"/>
  <rect x="400" y="140" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="408" y="146" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
  <text x="425" y="155" fill="#232F3E" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="480" y="168" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Kubernetes API Server</text>
  <text x="480" y="180" fill="#545B64" font-size="9" class="mono" text-anchor="middle">kube-apiserver</text>

  <!-- OP : Flink Kubernetes Operator (focal) -->
  <rect x="400" y="248" width="160" height="48" rx="6" fill="#ffffff"/>
  <rect x="400" y="248" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="408" y="254" width="30" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.5)" stroke-width="0.8"/>
  <text x="423" y="263" fill="#EC7211" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">OP</text>
  <text x="480" y="270" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Flink Kubernetes</text>
  <text x="480" y="284" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Operator</text>

  <!-- JM : JobManager Pod (focal) -->
  <rect x="400" y="356" width="160" height="48" rx="6" fill="#ffffff"/>
  <rect x="400" y="356" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="408" y="362" width="30" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.5)" stroke-width="0.8"/>
  <text x="423" y="371" fill="#EC7211" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">JM</text>
  <text x="480" y="378" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">JobManager Pod</text>
  <text x="480" y="392" fill="#545B64" font-size="9" class="mono" text-anchor="middle">resourcemanager</text>

  <!-- TM1 : TaskManager Pod 1 (store) -->
  <rect x="240" y="480" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="240" y="480" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="248" y="486" width="38" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
  <text x="267" y="495" fill="#545B64" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">TM-1</text>
  <text x="320" y="510" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">TaskManager Pod 1</text>
  <text x="320" y="524" fill="#545B64" font-size="9" class="mono" text-anchor="middle">taskexecutor</text>

  <!-- TM2 : TaskManager Pod 2 (store) -->
  <rect x="560" y="480" width="160" height="56" rx="6" fill="#ffffff"/>
  <rect x="560" y="480" width="160" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="568" y="486" width="38" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
  <text x="587" y="495" fill="#545B64" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">TM-2</text>
  <text x="640" y="510" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">TaskManager Pod 2</text>
  <text x="640" y="524" fill="#545B64" font-size="9" class="mono" text-anchor="middle">taskexecutor</text>

  <!-- ============ LEGEND ============ -->
  <line x1="30" y1="560" x2="930" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="576" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="567" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="140" y="576" fill="#545B64" font-size="8" class="mono">조정 컨트롤 플레인</text>
  <rect x="300" y="567" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="320" y="576" fill="#545B64" font-size="8" class="mono">런타임 워커 Pod</text>
</svg>