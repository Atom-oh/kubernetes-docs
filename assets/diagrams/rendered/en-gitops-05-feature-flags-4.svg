<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sidecar-title sidecar-desc">
<title id="sidecar-title">flagd sidecar deployment pattern</title>
<desc id="sidecar-desc">Architecture diagram showing an application container calling a flagd sidecar over localhost inside the same pod, while the sidecar watches a FeatureFlag custom resource for updates.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: Application Pod -->
<rect x="60" y="200" width="404" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="76" y="204" width="144" height="12" rx="2" fill="#ffffff"/>
<text x="148" y="213" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APPLICATION POD</text>

<!-- Arrows -->
<line x1="228" y1="264" x2="308" y2="264" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="448" y1="264" x2="680" y2="264" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" stroke-dasharray="4,3"/>

<!-- Labels -->
<rect x="232" y="248" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="268" y="258" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">:8013</text>

<rect x="520" y="248" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="564" y="258" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WATCH CRD</text>

<!-- Node: App Container -->
<rect x="88" y="232" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="88" y="232" width="140" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<rect x="96" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
<text x="110" y="249" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APP</text>
<text x="158" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">App Container</text>
<text x="158" y="284" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">calls SDK</text>

<!-- Node: flagd Sidecar (focal) -->
<rect x="308" y="232" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="308" y="232" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<rect x="316" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="330" y="249" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SDC</text>
<text x="378" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">flagd Sidecar</text>
<text x="378" y="284" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">focal</text>

<!-- Node: FeatureFlag CRD -->
<rect x="680" y="232" width="180" height="64" rx="6" fill="#ffffff"/>
<rect x="680" y="232" width="180" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<rect x="688" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
<text x="702" y="249" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
<text x="770" y="268" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">FeatureFlag CRD</text>
<text x="770" y="284" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cluster resource</text>

<!-- Legend -->
<line x1="24" y1="500" x2="936" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="24" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="24" y="532" width="14" height="10" rx="2" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="44" y="541" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Application container</text>
<rect x="240" y="532" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="260" y="541" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">flagd sidecar (focal)</text>
<rect x="460" y="532" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="480" y="541" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Cluster resource</text>
</svg>