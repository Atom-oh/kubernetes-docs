<text x="170.0" y="237.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle"></text>
<rect x="350" y="170" width="300" height="130" rx="6" fill="#ffffff"/>
<rect x="350" y="170" width="300" height="130" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="500.0" y="237.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle"></text>
<rect x="710" y="170" width="210" height="130" rx="6" fill="#ffffff"/>
<rect x="710" y="170" width="210" height="130" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="815.0" y="237.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle"></text>
<text x="170" y="198" fill="#232F3E" font-size="13" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sidecar Mode</text>
<text x="170" y="222" fill="#7D8998" font-size="9" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle">100 pods x 50MB = 5GB</text>
<text x="170" y="238" fill="#7D8998" font-size="9" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle">100 pods x 0.1vCPU = 10vCPU</text>
<text x="500" y="198" fill="#232F3E" font-size="13" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Ambient Mode</text>
<text x="500" y="222" fill="#545B64" font-size="9" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle">10 nodes x 50MB = 500MB</text>
<text x="500" y="238" fill="#545B64" font-size="9" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle">+ 1 waypoint = ~200MB</text>
<text x="500" y="254" fill="#545B64" font-size="9" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle">total: ~700MB / 1.5vCPU</text>
<text x="815" y="198" fill="#232F3E" font-size="13" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Savings</text>
<text x="815" y="222" fill="#EC7211" font-size="9" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle">memory: 86% saved</text>
<text x="815" y="238" fill="#EC7211" font-size="9" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle">CPU: 85% saved</text>
<text x="815" y="254" fill="#EC7211" font-size="9" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle">cost: ~80% saved</text>
