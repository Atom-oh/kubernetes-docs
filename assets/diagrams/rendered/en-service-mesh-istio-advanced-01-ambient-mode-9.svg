<rect x="301" y="215" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="325" y="224" fill="#7D8998" font-size="8" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.05em">COMPARE</text>
<rect x="659" y="215" width="42" height="12" rx="2" fill="#ffffff"/>
<text x="680" y="224" fill="#7D8998" font-size="8" font-family="'Geist Mono','Amazon Ember Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.05em">RESULT</text>
<rect x="40" y="170" width="260" height="130" rx="6" fill="#ffffff"/>
