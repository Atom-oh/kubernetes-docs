<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="istio-log-layers-title istio-log-layers-desc">
      <title id="istio-log-layers-title">Istio Log Layers</title>
      <desc id="istio-log-layers-desc">Architecture diagram showing how the Envoy sidecar proxy emits access logs that flow through log collectors and an OpenTelemetry collector into Loki and Elasticsearch, from which Grafana renders dashboards, while istiod configures Envoy under control from the Telemetry API.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zones (drawn before arrows and nodes) -->
      <rect x="24" y="168" width="312" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="132" y="172" width="96" height="12" rx="2" fill="#ffffff"/>
      <text x="180" y="181" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE MESH</text>

      <rect x="368" y="168" width="212" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="434" y="172" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="474" y="181" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOG PIPELINE</text>

      <rect x="612" y="168" width="212" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="656" y="172" width="124" height="12" rx="2" fill="#ffffff"/>
      <text x="718" y="181" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STORAGE &amp; QUERY</text>

      <!-- ===== Arrows (drawn before boxes) ===== -->

      <!-- App -> Envoy (straight vertical) -->
      <line x1="264" y1="264" x2="264" y2="288" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Istiod -> Envoy (Configure) -->
      <line x1="152" y1="320" x2="208" y2="320" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="158" y="300" width="44" height="12" rx="2" fill="#ffffff"/>
      <text x="180" y="309" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIGURE</text>

      <!-- Telemetry API -> istiod (Apply Config, dashed) -->
      <line x1="96" y1="264" x2="96" y2="288" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="104" y="270" width="92" height="12" rx="2" fill="#ffffff"/>
      <text x="150" y="279" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPLY CONFIG</text>

      <!-- Envoy -> Log Collectors (Access Logs) -->
      <path d="M320,300 H344 Q352,300 352,292 V240 Q352,232 360,232 H384"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="276" y="266" width="66" height="12" rx="2" fill="#ffffff"/>
      <text x="309" y="275" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACCESS LOGS</text>

      <!-- Envoy -> OTel Collector (OTLP Logs) -->
      <line x1="320" y1="340" x2="384" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="324" y="320" width="56" height="12" rx="2" fill="#ffffff"/>
      <text x="352" y="329" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OTLP LOGS</text>

      <!-- Log Collectors -> Loki -->
      <line x1="564" y1="232" x2="628" y2="232" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Log Collectors -> Elasticsearch -->
      <path d="M564,252 H588 Q596,252 596,260 V312 Q596,320 604,320 H628"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- OTel Collector -> Loki -->
      <path d="M564,300 H574 Q582,300 582,292 V284 Q582,276 590,276 H692 Q700,276 700,268 V264"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Loki -> Grafana -->
      <path d="M808,232 H824 Q832,232 832,240 V252 Q832,260 840,260 H856"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Elasticsearch -> Grafana -->
      <path d="M808,320 H824 Q832,320 832,312 V300 Q832,292 840,292 H856"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Nodes ===== -->

      <!-- Telemetry API (backend) -->
      <rect x="40" y="200" width="112" height="64" rx="6" fill="#ffffff"/>
      <rect x="40" y="200" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="48" y="208" width="26" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="61" y="217" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRD</text>
      <text x="96" y="238" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Telemetry API</text>
      <text x="96" y="253" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Telemetry CRD</text>

      <!-- istiod (backend) -->
      <rect x="40" y="288" width="112" height="64" rx="6" fill="#ffffff"/>
      <rect x="40" y="288" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="48" y="296" width="20" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="58" y="305" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CP</text>
      <text x="96" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">istiod</text>
      <text x="96" y="341" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">control plane</text>

      <!-- Application Container (input) -->
      <rect x="208" y="200" width="112" height="64" rx="6" fill="#ffffff"/>
      <rect x="208" y="200" width="112" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <rect x="216" y="208" width="26" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
      <text x="229" y="217" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="264" y="235" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
      <text x="264" y="249" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Container</text>

      <!-- Envoy Proxy (focal) -->
      <rect x="208" y="288" width="112" height="64" rx="6" fill="#ffffff"/>
      <rect x="208" y="288" width="112" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <rect x="216" y="296" width="24" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
      <text x="228" y="305" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="264" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>
      <text x="264" y="341" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sidecar</text>

      <!-- Log Collectors (backend, merged Promtail + Fluent Bit) -->
      <rect x="384" y="200" width="180" height="64" rx="6" fill="#ffffff"/>
      <rect x="384" y="200" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="392" y="208" width="26" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="405" y="217" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOG</text>
      <text x="474" y="235" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Log Collectors</text>
      <text x="474" y="249" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Promtail · Fluent Bit</text>

      <!-- OpenTelemetry Collector (backend) -->
      <rect x="384" y="288" width="180" height="64" rx="6" fill="#ffffff"/>
      <rect x="384" y="288" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="392" y="296" width="26" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="405" y="305" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OTL</text>
      <text x="474" y="323" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">OTel Collector</text>
      <text x="474" y="337" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OTLP receiver</text>

      <!-- Grafana Loki (store) -->
      <rect x="628" y="200" width="180" height="64" rx="6" fill="#ffffff"/>
      <rect x="628" y="200" width="180" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <rect x="636" y="208" width="26" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
      <text x="649" y="217" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STO</text>
      <text x="718" y="235" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana Loki</text>
      <text x="718" y="249" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">log store</text>

      <!-- Elasticsearch (store) -->
      <rect x="628" y="288" width="180" height="64" rx="6" fill="#ffffff"/>
      <rect x="628" y="288" width="180" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <rect x="636" y="296" width="26" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
      <text x="649" y="305" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STO</text>
      <text x="718" y="323" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Elasticsearch</text>
      <text x="718" y="337" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">log store</text>

      <!-- Grafana (backend / visualization) -->
      <rect x="856" y="244" width="80" height="64" rx="6" fill="#ffffff"/>
      <rect x="856" y="244" width="80" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="864" y="252" width="22" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="875" y="261" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIZ</text>
      <text x="896" y="283" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana</text>
      <text x="896" y="297" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dashboards</text>

      <!-- Legend -->
      <line x1="24" y1="424" x2="936" y2="424" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="24" y="440" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="24" y="456" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="44" y="464" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Data-plane proxy (focal)</text>

      <rect x="248" y="456" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="268" y="464" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Storage backend</text>

      <line x1="440" y1="461" x2="468" y2="461" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="476" y="464" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Log flow</text>

      <line x1="620" y1="461" x2="648" y2="461" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="656" y="464" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Config apply (async)</text>
    </svg>