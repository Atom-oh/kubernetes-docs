<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="100%" role="img" aria-labelledby="en-ops-14-tekton-pipelines-3-title en-ops-14-tekton-pipelines-3-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="en-ops-14-tekton-pipelines-3-title">How Tekton Triggers turns an inbound webhook into a running PipelineRun</title>
    <desc id="en-ops-14-tekton-pipelines-3-desc">Shows a GitHub webhook POST arriving at an EventListener, passing through an Interceptor and a CEL filter, then a TriggerBinding extracting parameters into a TriggerTemplate that creates the PipelineRun.</desc>
    <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ===== Arrows (straight, all boxes share the same center line y=284) ===== -->
    <!-- GH -> EL -->
    <path d="M 176,284 H 260" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="184" y="264" width="66" height="12" rx="2" fill="#ffffff"/>
    <text x="217" y="273" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /HOOKS</text>

    <!-- EL -> Interceptor -->
    <path d="M 420,284 H 480" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Interceptor -> CEL -->
    <path d="M 600,284 H 660" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- CEL -> TriggerBinding -->
    <path d="M 780,284 H 800 Q 808,284 808,292 V 356 Q 808,364 800,364 H 780" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- TriggerBinding -> TriggerTemplate -->
    <path d="M 660,364 H 600" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- TriggerTemplate -> PipelineRun (headline: this is the payoff of the chain) -->
    <path d="M 480,364 H 460 Q 452,364 452,372 V 456" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="388" y="404" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="414" y="413" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATES</text>

    <!-- ===== Row 1 nodes (left to right), y=256-312 ===== -->
    <g>
      <rect x="40" y="256" width="136" height="56" rx="6" fill="rgba(35,47,62,0.10)"/>
      <rect x="40" y="256" width="136" height="56" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="108" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">GitHub Webhook</text>
      <text x="108" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">push / PR event</text>
    </g>
    <g>
      <rect x="260" y="256" width="160" height="56" rx="6" fill="#ffffff"/>
      <rect x="260" y="256" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="340" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EventListener</text>
      <text x="340" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Service + Pod</text>
    </g>
    <g>
      <rect x="480" y="256" width="120" height="56" rx="6" fill="#ffffff"/>
      <rect x="480" y="256" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="540" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Interceptor</text>
      <text x="540" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitHub validation</text>
    </g>
    <g>
      <rect x="660" y="256" width="120" height="56" rx="6" fill="#ffffff"/>
      <rect x="660" y="256" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="720" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CEL Filter</text>
      <text x="720" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">branch, action</text>
    </g>

    <!-- ===== Row 2 nodes (right to left), y=336-392 ===== -->
    <g>
      <rect x="660" y="336" width="120" height="56" rx="6" fill="#ffffff"/>
      <rect x="660" y="336" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="720" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">TriggerBinding</text>
      <text x="720" y="374" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">extract params</text>
    </g>
    <g>
      <rect x="480" y="336" width="120" height="56" rx="6" fill="#ffffff"/>
      <rect x="480" y="336" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="540" y="360" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">TriggerTemplate</text>
      <text x="540" y="374" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PipelineRun template</text>
    </g>

    <!-- PipelineRun (focal outcome) -->
    <g>
      <rect x="372" y="456" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)"/>
      <rect x="372" y="456" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="452" y="480" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PipelineRun</text>
      <text x="452" y="494" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pipeline execution begins</text>
    </g>

    <!-- Legend -->
    <line x1="40" y1="550" x2="920" y2="550" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="560" width="16" height="2" fill="#0972D3"/>
    <text x="64" y="567" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">EXTERNAL ENTRY</text>
    <rect x="220" y="560" width="16" height="2" fill="#EC7211"/>
    <text x="244" y="567" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">PIPELINE STARTS</text>
  </svg>