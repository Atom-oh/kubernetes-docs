<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="argocd-arch-title argocd-arch-desc">
      <title id="argocd-arch-title">ArgoCD control plane architecture</title>
      <desc id="argocd-arch-desc">Architecture diagram showing ArgoCD's control plane fetching manifests from Git, Helm, and OCI sources through its Repo Server, with the Application Controller reconciling and syncing them into managed Kubernetes clusters, while users reach the API Server through the web UI, CLI, or gRPC API.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zone: ArgoCD control plane (drawn before arrows/nodes) -->
      <rect x="240" y="132" width="480" height="232" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="248" y="136" width="168" height="12" rx="2" fill="#ffffff"/>
      <text x="332" y="145" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ARGOCD CONTROL PLANE</text>

      <!-- Arrows (before boxes) -->
      <!-- Config Sources -> Repo Server -->
      <path d="M 180,316 H 340" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="240" y="296" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="260" y="305" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FETCH</text>

      <!-- Repo Server -> Application Controller -->
      <path d="M 452,316 H 536" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="474" y="296" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="494" y="305" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RENDER</text>

      <!-- Dex -> API Server -->
      <path d="M 372,212 H 424" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="378" y="192" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="398" y="201" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SSO</text>

      <!-- API Server -> Redis Cache -->
      <path d="M 536,212 H 584" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="540" y="192" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="560" y="201" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE</text>

      <!-- User Interfaces -> API Server (external client call, link-blue) -->
      <path d="M 480,112 V 180" fill="none" stroke="#0972D3" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="488" y="140" width="56" height="12" rx="2" fill="#ffffff"/>
      <text x="516" y="149" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text>

      <!-- Application Controller -> Redis Cache (state, elbow, bottom-of-Redis port) -->
      <path d="M 592,284 H 632 Q 640,284 640,276 V 244" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Application Controller -> Managed Clusters (headline sync) -->
      <path d="M 648,316 H 792" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="700" y="296" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="720" y="305" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC</text>

      <!-- Nodes -->
      <!-- User Interfaces (input) -->
      <rect x="424" y="48" width="112" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="0.8"/>
      <text x="480" y="76" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">User</text>
      <text x="480" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Interfaces</text>
      <text x="480" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WEB · CLI · GRPC</text>

      <!-- Dex (optional) -->
      <rect x="260" y="180" width="112" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="316" y="210" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Dex</text>
      <text x="316" y="226" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SSO (OPTIONAL)</text>

      <!-- API Server (core) -->
      <rect x="424" y="180" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="216" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Server</text>

      <!-- Redis Cache (store) -->
      <rect x="584" y="180" width="112" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="640" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Redis</text>
      <text x="640" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cache</text>

      <!-- Config Sources (external) -->
      <rect x="40" y="284" width="140" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="110" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Configuration</text>
      <text x="110" y="324" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sources</text>
      <text x="110" y="340" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GIT · HELM · OCI</text>

      <!-- Repo Server (core) -->
      <rect x="340" y="284" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="396" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Repo</text>
      <text x="396" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Server</text>

      <!-- Application Controller (focal) -->
      <rect x="536" y="284" width="112" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="592" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
      <text x="592" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Controller</text>

      <!-- Managed Clusters (external) -->
      <rect x="792" y="284" width="128" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="856" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Managed</text>
      <text x="856" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Clusters</text>
      <text x="856" y="340" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×N</text>

      <!-- Legend -->
      <line x1="40" y1="388" x2="920" y2="388" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="40" y="408" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="420" width="14" height="14" rx="3" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="62" y="431" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">EXTERNAL SYSTEM</text>

      <rect x="200" y="420" width="14" height="14" rx="3" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="0.8"/>
      <text x="222" y="431" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">USER INPUT</text>

      <rect x="340" y="420" width="14" height="14" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="362" y="431" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">CORE COMPONENT</text>

      <rect x="500" y="420" width="14" height="14" rx="3" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="522" y="431" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">STATE STORE</text>

      <rect x="640" y="420" width="14" height="14" rx="3" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="662" y="431" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">OPTIONAL</text>

      <rect x="780" y="420" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="802" y="431" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">RECONCILER (FOCAL)</text>
    </svg>