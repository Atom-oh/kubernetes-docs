<title id="en-basics-05-ebpf-fundamentals-5-title">Cilium architecture</title>
<desc id="en-basics-05-ebpf-fundamentals-5-desc">Architecture diagram showing the Kubernetes API feeding policy to the Cilium agent, which programs a shared eBPF dataplane; that dataplane runs XDP programs for DDoS protection, TC programs for network policy and load balancing, and socket programs for socket-level routing.</desc>
