<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
<title id="t3">Inference gateway routing to a vLLM pod pool</title>
<desc id="d3">A client request travels through a Gateway, an HTTPRoute, and an InferencePool node to an Endpoint Picker, which routes traffic to individual vLLM pods using least-loaded or prefix-aware selection.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<text x="40" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">GATEWAY API INFERENCE EXTENSION</text>
<text x="40" y="60" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Request routing into a vLLM pod pool</text>

<!-- zone: pool -->
<rect x="560" y="148" width="300" height="296" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="614" y="152" width="192" height="12" rx="2" fill="#ffffff"/>
<text x="710" y="161" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">INFERENCEPOOL PODS</text>

<!-- main chain arrows -->
<line x1="180" y1="136" x2="180" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="180" y1="232" x2="180" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="180" y1="328" x2="180" y2="368" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="180" y1="424" x2="180" y2="464" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- picker fan-out -->
<path d="M280,484 H422 Q430,484 430,476 V216 Q430,208 438,208 H580" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="330" y="190" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="374" y="199" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">LEAST-LOADED</text>

<path d="M280,500 H442 Q450,500 450,492 V324 Q450,316 458,316 H580" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="330" y="298" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="374" y="307" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">PREFIX-AWARE</text>

<!-- main chain nodes -->
<g>
  <rect x="80" y="80" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="180" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
</g>
<g>
  <rect x="80" y="176" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="180" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway</text>
</g>
<g>
  <rect x="80" y="272" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="180" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">HTTPRoute</text>
</g>
<g>
  <rect x="80" y="368" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="180" y="400" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">InferencePool</text>
</g>
<g>
  <rect x="80" y="464" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="180" y="496" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Endpoint Picker</text>
</g>

<!-- pods -->
<g>
  <rect x="580" y="180" width="260" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="710" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vLLM Pod 1</text>
</g>
<g>
  <rect x="580" y="288" width="260" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="710" y="320" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vLLM Pod 2</text>
</g>
<g>
  <rect x="580" y="372" width="260" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="710" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vLLM Pod 3</text>
</g>

<!-- legend -->
<line x1="40" y1="562" x2="920" y2="562" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="578" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="140" y="568" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="162" y="577" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">selection point</text>
</svg>