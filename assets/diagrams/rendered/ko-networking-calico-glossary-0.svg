<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="tier-flow-title tier-flow-desc">
    <title id="tier-flow-title">Calico 정책 Tier 평가 흐름</title>
    <desc id="tier-flow-desc">트래픽이 Security, Platform, Application Tier를 순서대로 통과하며 각 단계에서 Pass 시 다음 Tier로 넘어가고 Deny 시 Drop으로 이어지는 Calico 정책 평가 흐름을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-deny" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#DD344C"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Arrows (drawn before boxes) ===== -->

    <!-- Traffic -> T1 (unlabeled, straight) -->
    <path d="M380,72 L380,92" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- T1 -> T2 (Pass, straight, muted) -->
    <path d="M380,168 L380,188" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- T2 -> T3 (Pass, straight, muted) -->
    <path d="M380,264 L380,284" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- T3 -> Pod (Pass, straight, accent = happy path terminus) -->
    <path d="M380,360 L380,384" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- T1 -> Drop (Deny): vertical then rounded elbow then horizontal -->
    <path d="M452,132 L664,132 Q672,132 672,140 L672,199 Q672,203 676,203 L680,203"
          fill="none" stroke="#DD344C" stroke-width="1.2" marker-end="url(#arrow-deny)"/>
    <!-- T2 -> Drop (Deny): straight horizontal, same y -->
    <path d="M452,228 L680,228" fill="none" stroke="#DD344C" stroke-width="1.2" marker-end="url(#arrow-deny)"/>
    <!-- T3 -> Drop (Deny): vertical then rounded elbow then horizontal -->
    <path d="M452,324 L664,324 Q672,324 672,316 L672,257 Q672,253 676,253 L680,253"
          fill="none" stroke="#DD344C" stroke-width="1.2" marker-end="url(#arrow-deny)"/>

    <!-- ===== Arrow labels (masked, gapped) ===== -->

    <!-- PASS (T1->T2) : vertical segment, label to the side -->
    <rect x="388" y="174" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="410" y="183" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace"
          text-anchor="middle" letter-spacing="0.06em">PASS</text>

    <!-- PASS (T2->T3) : vertical segment, label to the side -->
    <rect x="388" y="270" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="410" y="279" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace"
          text-anchor="middle" letter-spacing="0.06em">PASS</text>

    <!-- DENY (T1->Drop) : horizontal segment at y=132, gap below label -->
    <rect x="536" y="112" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="558" y="121" fill="#DD344C" font-size="8" font-family="'Geist Mono',monospace"
          text-anchor="middle" letter-spacing="0.06em">DENY</text>

    <!-- DENY (T2->Drop) : horizontal segment at y=228 -->
    <rect x="536" y="208" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="558" y="217" fill="#DD344C" font-size="8" font-family="'Geist Mono',monospace"
          text-anchor="middle" letter-spacing="0.06em">DENY</text>

    <!-- DENY (T3->Drop) : horizontal segment at y=324 -->
    <rect x="536" y="304" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="558" y="313" fill="#DD344C" font-size="8" font-family="'Geist Mono',monospace"
          text-anchor="middle" letter-spacing="0.06em">DENY</text>

    <!-- ===== Nodes ===== -->

    <!-- Traffic (start, input treatment) -->
    <ellipse cx="380" cy="48" rx="64" ry="24" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="380" y="52" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">트래픽</text>

    <!-- T1: Security Tier (decision diamond) -->
    <polygon points="380,96 452,132 380,168 308,132" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="128" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Security Tier</text>
    <text x="380" y="142" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">order: 100</text>

    <!-- T2: Platform Tier (decision diamond) -->
    <polygon points="380,192 452,228 380,264 308,228" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="224" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Platform Tier</text>
    <text x="380" y="238" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">order: 200</text>

    <!-- T3: Application Tier (decision diamond) -->
    <polygon points="380,288 452,324 380,360 308,324" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="320" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application Tier</text>
    <text x="380" y="334" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">order: 300</text>

    <!-- Pod (end, focal) -->
    <ellipse cx="380" cy="408" rx="64" ry="24" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="380" y="412" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod</text>

    <!-- Drop (terminal, denial outcome) -->
    <rect x="680" y="178" width="140" height="100" rx="8" fill="rgba(221,52,76,0.05)" stroke="#DD344C"
          stroke-width="1" stroke-dasharray="4,4"/>
    <text x="750" y="232" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Drop</text>
    <text x="750" y="246" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">패킷 차단</text>

    <!-- ===== Legend ===== -->
    <line x1="30" y1="472" x2="930" y2="472" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="30" y="490" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">범례</text>

    <ellipse cx="150" cy="500" rx="12" ry="8" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="172" y="504" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">시작 / 종료</text>

    <polygon points="330,492 342,500 330,508 318,500" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="352" y="504" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Tier 평가 (Pass/Deny)</text>

    <rect x="540" y="492" width="24" height="16" rx="4" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="574" y="504" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Drop (차단)</text>

    <line x1="740" y1="500" x2="764" y2="500" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="774" y="504" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">허용 경로 종착</text>
  </svg>