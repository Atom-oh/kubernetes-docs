<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-0-title diagram-0-desc" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">
  <title id="diagram-0-title">Promote by retagging, not rebuilding</title>
  <desc id="diagram-0-desc">A single image is built once, then promoted unchanged from dev to stage to production registries by retagging the same digest, so the artifact that ships to production is bit-for-bit the one that was tested earlier.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="48" y="52" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CONTAINER REGISTRY</text>
  <text x="48" y="80" fill="#232F3E" font-size="28" font-weight="700">Promote by Retagging, Not Rebuilding</text>
  <text x="48" y="104" fill="#545B64" font-size="14" font-style="italic">One immutable build travels unchanged through every environment</text>

  <!-- Arrows (drawn before boxes; endpoints share y=300, plain lines) -->
  <path d="M 228,300 H 276" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 456,300 H 504" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 684,300 H 732" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Arrow labels: mask 12px tall, 8px gap above stroke at y=300 -> mask y=280..292 -->
  <rect x="230" y="280" width="44" height="12" rx="2" fill="#ffffff"/>
  <text x="252" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH</text>

  <rect x="458" y="280" width="44" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETAG</text>

  <rect x="686" y="280" width="44" height="12" rx="2" fill="#ffffff"/>
  <text x="708" y="289" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETAG</text>

  <!-- Node: Build (backend/step) -->
  <rect x="48" y="252" width="180" height="96" rx="6" fill="#ffffff"/>
  <rect x="48" y="252" width="180" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="56" y="260" width="28" height="12" rx="2" fill="transparent" stroke="#232F3E" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="70" y="269" fill="#232F3E" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CI</text>
  <text x="138" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Build</text>
  <text x="138" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">abc123-dev</text>

  <!-- Node: Dev (store treatment) -->
  <rect x="276" y="252" width="180" height="96" rx="6" fill="#232F3E" fill-opacity="0.05"/>
  <rect x="276" y="252" width="180" height="96" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="284" y="260" width="36" height="12" rx="2" fill="transparent" stroke="#545B64" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="302" y="269" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEV</text>
  <text x="366" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">myapp-dev</text>
  <text x="366" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">abc123-dev</text>

  <!-- Node: Stage (store treatment) -->
  <rect x="504" y="252" width="180" height="96" rx="6" fill="#232F3E" fill-opacity="0.05"/>
  <rect x="504" y="252" width="180" height="96" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="512" y="260" width="44" height="12" rx="2" fill="transparent" stroke="#545B64" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="534" y="269" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STAGE</text>
  <text x="594" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">myapp-stage</text>
  <text x="594" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">abc123-stage</text>

  <!-- Node: Prod (focal) -->
  <rect x="732" y="252" width="180" height="96" rx="6" fill="#ffffff"/>
  <rect x="732" y="252" width="180" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="740" y="260" width="40" height="12" rx="2" fill="transparent" stroke="#EC7211" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="760" y="269" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROD</text>
  <text x="822" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">myapp-prod</text>
  <text x="822" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">v1.2.3</text>

  <!-- Editorial aside -->
  <text x="48" y="420" fill="#545B64" font-size="14" font-style="italic">Same image digest at every hop — retagged, never rebuilt.</text>

  <!-- Legend -->
  <line x1="48" y1="552" x2="912" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="48" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="148" y="560" width="12" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="168" y="569" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">PRODUCTION RELEASE</text>
  <rect x="332" y="560" width="12" height="12" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="352" y="569" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">INTERMEDIATE REGISTRY</text>
</svg>