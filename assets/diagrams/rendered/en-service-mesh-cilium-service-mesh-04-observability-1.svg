<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="service-map-title service-map-desc">
    <title id="service-map-title">Service Map View</title>
    <desc id="service-map-desc">Diagram showing Hubble UI's service map: the frontend calls the backend and a CDN for static assets, while the backend reads and writes to a database and a Redis cache.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>

    <!-- Arrows -->
    <line x1="240" y1="292" x2="340" y2="292" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <path d="M500,281 H562 Q570,281 570,273 V204 Q570,196 578,196 H640" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M500,303 H562 Q570,303 570,311 V388 Q570,396 578,396 H640" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M160,324 V374 Q160,382 168,382 H412 Q420,382 420,390 V440" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: Frontend -->
    <rect x="80" y="260" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="80" y="260" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="288" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Frontend</text>
    <text x="160" y="304" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 pods</text>

    <!-- Node: Backend (focal) -->
    <rect x="340" y="260" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="340" y="260" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="420" y="288" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Backend</text>
    <text x="420" y="304" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 pods</text>

    <!-- Node: Database (cylinder / store) -->
    <rect x="640" y="160" width="160" height="72" rx="6" fill="#ffffff"/>
    <rect x="640" y="160" width="160" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="720" y="192" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Database</text>
    <text x="720" y="208" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2 pods</text>

    <!-- Node: Redis (cylinder / store) -->
    <rect x="640" y="360" width="160" height="72" rx="6" fill="#ffffff"/>
    <rect x="640" y="360" width="160" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="720" y="392" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Redis</text>
    <text x="720" y="408" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 pods</text>

    <!-- Node: Static Assets -->
    <rect x="340" y="440" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="340" y="440" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="420" y="464" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Static Assets</text>
    <text x="420" y="480" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CDN</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="556" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Focal / highest fan-in</text>

    <rect x="260" y="556" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="280" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Data store</text>

    <rect x="420" y="556" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="440" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">External / CDN</text>
  </svg>