<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="mimir-arch-title mimir-arch-desc">
    <title id="mimir-arch-title">Grafana Mimir 전체 아키텍처</title>
    <desc id="mimir-arch-desc">Prometheus가 Distributor를 거쳐 Ingester에 메트릭을 쓰고, Ingester·Compactor·Store-gateway가 객체 스토리지에 블록을 저장하며, Grafana가 Query-frontend와 Querier를 통해 데이터를 읽어오는 Mimir의 쓰기·읽기 경로를 보여주는 아키텍처 다이어그램.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Grafana Mimir -->
    <rect x="40" y="136" width="880" height="296" rx="8"
          fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="430" y="140" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="149" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.14em">GRAFANA MIMIR</text>

    <!-- Arrows first -->
    <line x1="160" y1="112" x2="160" y2="168" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="800" y1="112" x2="800" y2="168" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="160" y1="232" x2="160" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Query-frontend -> Querier (down-across-down elbow) -->
    <path d="M 800,232 V 242 Q 800,250 792,250 H 488 Q 480,250 480,258 V 256"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Querier <-> Ingester / Store-gateway (same row, horizontal) -->
    <line x1="408" y1="280" x2="232" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="552" y1="296" x2="728" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Ingester / Compactor / Store-gateway -> Object Storage (straight verticals) -->
    <line x1="160" y1="320" x2="160" y2="464" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="408" x2="480" y2="464" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="800" y1="320" x2="800" y2="464" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="128" y="132" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="160" y="141" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">REMOTE_WRITE</text>

    <rect x="132" y="384" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="160" y="393" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">UPLOAD</text>

    <rect x="452" y="432" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="441" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">COMPACT</text>

    <rect x="772" y="384" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="800" y="393" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">READ</text>

    <!-- Node: Prometheus (external) -->
    <rect x="88" y="48" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="88" y="48" width="144" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="160" y="76" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
    <text x="160" y="92" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×3</text>

    <!-- Node: Grafana (external) -->
    <rect x="728" y="48" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="728" y="48" width="144" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="800" y="76" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana</text>
    <text x="800" y="92" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">읽기 경로</text>

    <!-- Node: Distributor -->
    <rect x="88" y="168" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="88" y="168" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Distributor</text>
    <text x="160" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×2</text>

    <!-- Node: Query-frontend -->
    <rect x="728" y="168" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="728" y="168" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="800" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Query-frontend</text>
    <text x="800" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">split · cache</text>

    <!-- Node: Ingester -->
    <rect x="88" y="256" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="88" y="256" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Ingester</text>
    <text x="160" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×3</text>

    <!-- Node: Querier -->
    <rect x="408" y="256" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="408" y="256" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Querier</text>
    <text x="480" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×2</text>

    <!-- Node: Store-gateway -->
    <rect x="728" y="256" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="728" y="256" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="800" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Store-gateway</text>
    <text x="800" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×2</text>

    <!-- Node: Compactor -->
    <rect x="408" y="344" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="408" y="344" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Compactor</text>
    <text x="480" y="388" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">compact · dedup</text>

    <!-- Node: Object Storage (focal) -->
    <rect x="120" y="464" width="720" height="64" rx="6" fill="#ffffff"/>
    <rect x="120" y="464" width="720" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="492" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">객체 스토리지</text>
    <text x="480" y="508" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">S3 / GCS / Azure Blob</text>

    <!-- Legend -->
    <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="566" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="200" y="560" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="220" y="568" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">외부 클라이언트</text>

    <rect x="360" y="560" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="568" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Mimir 컴포넌트</text>

    <rect x="540" y="560" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="560" y="568" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">객체 스토리지(초점)</text>
  </svg>