<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="hng-hybrid2cloud-title hng-hybrid2cloud-desc">
    <title id="hng-hybrid2cloud-title">Packet path from a hybrid pod to a cloud pod</title>
    <desc id="hng-hybrid2cloud-desc">Sequence diagram showing a packet from a hybrid pod resolved by the Cilium agent's BPF VTEP lookup, VXLAN-encapsulated across Direct Connect or VPN to the gateway, decapsulated, and delivered natively through the VPC to the destination cloud pod.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines. Centers: 96, 296, 496, 696, 896 -->
    <line x1="96" y1="128" x2="96" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="296" y1="128" x2="296" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="496" y1="128" x2="496" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="696" y1="128" x2="696" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="896" y1="128" x2="896" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="292" y="176" width="8" height="72" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="692" y="276" width="8" height="76" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="0.8"/>

    <!-- M1: Hybrid Pod -> Cilium Agent -->
    <line x1="96" y1="176" x2="292" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="140" y="160" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="194" y="169" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DST 10.0.64.15</text>

    <!-- Note: BPF VTEP lookup -->
    <rect x="196" y="188" width="204" height="36" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
    <text x="298" y="200" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">BPF VTEP lookup:</text>
    <text x="298" y="210" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">10.0.0.0/16 → gateway IP</text>
    <text x="298" y="220" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">VXLAN encap VNI=2</text>

    <!-- M2: Cilium Agent -> Network (encapsulated) -->
    <line x1="300" y1="248" x2="492" y2="248" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="348" y="232" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="396" y="241" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENCAPSULATED</text>

    <!-- M3: Network -> Gateway (arrives) -->
    <line x1="500" y1="276" x2="692" y2="276" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="548" y="260" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="596" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ARRIVES AT GW</text>

    <!-- Note: decap -->
    <rect x="600" y="296" width="184" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
    <text x="692" y="306" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">VXLAN decap:</text>
    <text x="692" y="316" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">inner dst=10.0.64.15</text>

    <!-- M4: Gateway -> Cloud Pod (native VPC routing) -->
    <line x1="700" y1="352" x2="892" y2="352" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="748" y="336" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="796" y="345" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NATIVE ROUTING</text>

    <!-- Note: delivered -->
    <rect x="792" y="368" width="176" height="24" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
    <text x="880" y="378" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Delivered to pod</text>
    <text x="880" y="388" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">10.0.64.15 (Cloud Pod)</text>

    <!-- Actor boxes -->
    <!-- Hybrid Pod -->
    <rect x="24" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="24" y="72" width="144" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="32" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="46" y="89" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DC</text>
    <text x="96" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Hybrid Pod</text>
    <text x="96" y="119" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.100.0.42</text>

    <!-- Cilium Agent -->
    <rect x="224" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="224" y="72" width="144" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="232" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="246" y="89" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DC</text>
    <text x="296" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cilium Agent</text>
    <text x="296" y="119" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hybrid node</text>

    <!-- Network -->
    <rect x="424" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="424" y="72" width="144" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="432" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="446" y="89" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NET</text>
    <text x="496" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Direct Connect / VPN</text>
    <text x="496" y="119" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">transit link</text>

    <!-- Gateway (EC2) — focal -->
    <rect x="616" y="72" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="616" y="72" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="624" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,113,17,0.50)" stroke-width="0.8"/>
    <text x="640" y="89" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
    <text x="696" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway (EC2)</text>
    <text x="696" y="119" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hybrid_vxlan0 + ENI</text>

    <!-- Cloud Pod -->
    <rect x="824" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="824" y="72" width="144" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="832" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="846" y="89" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VPC</text>
    <text x="896" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cloud Pod</text>
    <text x="896" y="119" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.64.15</text>

    <!-- Legend -->
    <line x1="24" y1="432" x2="944" y2="432" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="448" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <line x1="24" y1="464" x2="52" y2="464" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="60" y="466" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Encapsulated hop</text>

    <line x1="220" y1="464" x2="248" y2="464" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="256" y="466" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Native forward</text>

    <rect x="392" y="458" width="4" height="18" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="0.8"/>
    <text x="404" y="466" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Gateway activation</text>
  </svg>