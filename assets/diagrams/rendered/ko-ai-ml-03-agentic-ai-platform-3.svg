<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="d3-title d3-desc">
    <title id="d3-title">Gateway API Inference Extension 요청 경로</title>
    <desc id="d3-desc">클라이언트 요청이 Gateway와 HTTPRoute를 거쳐 InferencePool에 도달하고, Endpoint Picker가 least-loaded와 prefix-aware 기준으로 InferencePool 내 vLLM Pod 중 하나를 선택해 라우팅하는 구조를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: InferencePool -->
    <rect x="380" y="256" width="380" height="148" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="516" y="264" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="570" y="273" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">INFERENCEPOOL</text>

    <!-- Arrows: main chain -->
    <line x1="560" y1="64" x2="560" y2="96" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="560" y1="144" x2="560" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="560" y1="224" x2="560" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="560" y1="404" x2="560" y2="436" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Endpoint Picker -> EP1 (least-loaded) -->
    <path d="M 520,436 H 442 Q 450,436 450,428 V 336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Endpoint Picker -> EP2 (prefix-aware) -->
    <path d="M 600,436 H 562 Q 570,436 570,428 V 336" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Vertical-segment side labels -->
    <rect x="368" y="376" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="406" y="385" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">least-loaded</text>

    <rect x="580" y="376" width="82" height="12" rx="2" fill="#ffffff"/>
    <text x="621" y="385" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">prefix-aware</text>

    <!-- Node: Client -->
    <rect x="480" y="16" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="480" y="16" width="160" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="560" y="44" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">클라이언트</text>

    <!-- Node: Gateway -->
    <rect x="480" y="96" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="560" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Gateway</text>

    <!-- Node: HTTPRoute -->
    <rect x="480" y="176" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="560" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">HTTPRoute</text>

    <!-- Pods inside pool -->
    <rect x="400" y="288" width="100" height="48" rx="6" fill="#ffffff"/>
    <rect x="400" y="288" width="100" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="450" y="308" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">vLLM Pod 1</text>
    <text x="450" y="322" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">EP1</text>

    <rect x="520" y="288" width="100" height="48" rx="6" fill="#ffffff"/>
    <rect x="520" y="288" width="100" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="570" y="308" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">vLLM Pod 2</text>
    <text x="570" y="322" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">EP2</text>

    <rect x="640" y="288" width="100" height="48" rx="6" fill="#ffffff"/>
    <rect x="640" y="288" width="100" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="690" y="308" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">vLLM Pod 3</text>
    <text x="690" y="322" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">EP3</text>

    <!-- Node: Endpoint Picker (focal) -->
    <rect x="460" y="436" width="200" height="48" rx="6" fill="#ffffff"/>
    <rect x="460" y="436" width="200" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="560" y="464" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Endpoint Picker</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="556" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">라우팅 결정 지점</text>

    <rect x="220" y="556" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="240" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">InferencePool 내 Pod</text>

    <rect x="420" y="556" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="440" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">외부 클라이언트</text>
  </svg>
