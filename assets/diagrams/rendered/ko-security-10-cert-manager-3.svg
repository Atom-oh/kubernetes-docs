<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
    <title id="t3">istio-csr를 통한 SVID 발급</title>
    <desc id="d3">Envoy 사이드카가 istio-csr로 인증서 서명 요청을 보내면 cert-manager가 CertificateRequest를 생성해 발급자(CA/Vault/PCA)에 요청하고, 발급된 SVID 인증서가 Envoy로 반환되어 애플리케이션과 mTLS를 맺는 흐름을 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: cert-manager -->
    <rect x="320" y="140" width="320" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="416" y="144" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">CERT-MANAGER</text>

    <!-- Main chain arrows -->
    <line x1="480" y1="60" x2="480" y2="84" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="124" x2="480" y2="148" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="188" x2="480" y2="212" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="252" x2="480" y2="276" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="316" x2="480" y2="340" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Return: SVID -> Envoy (dashed, right margin) -->
    <path d="M620,352 H820 V52 H620" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Final: Envoy -> App (left margin, accent) -->
    <path d="M340,40 H140 V416 H340" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Labels -->
    <rect x="452" y="66" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="75" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">1. CSR</text>

    <rect x="452" y="130" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="139" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">2. CREATE</text>

    <rect x="452" y="194" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="203" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">3. REQUEST</text>

    <rect x="452" y="258" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="267" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">4. ISSUE</text>

    <rect x="700" y="196" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="730" y="205" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">5. RETURN</text>

    <rect x="80" y="222" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="102" y="231" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">mTLS</text>

    <!-- Node: Envoy -->
    <rect x="340" y="20" width="280" height="40" rx="6" fill="#ffffff"/>
    <rect x="340" y="20" width="280" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="348" y="28" width="34" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
    <text x="365" y="37" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POD</text>
    <text x="480" y="45" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Envoy Sidecar</text>

    <!-- Node: CSRAgent -->
    <rect x="340" y="84" width="280" height="40" rx="6" fill="#ffffff"/>
    <rect x="340" y="84" width="280" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="348" y="92" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="365" y="101" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CSR</text>
    <text x="480" y="109" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">istio-csr Agent</text>

    <!-- Node: CMController -->
    <rect x="340" y="148" width="280" height="40" rx="6" fill="#ffffff"/>
    <rect x="340" y="148" width="280" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">cert-manager Controller</text>

    <!-- Node: CertReq -->
    <rect x="340" y="212" width="280" height="40" rx="6" fill="#ffffff"/>
    <rect x="340" y="212" width="280" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">CertificateRequest</text>

    <!-- Node: Issuer -->
    <rect x="340" y="276" width="280" height="40" rx="6" fill="#ffffff"/>
    <rect x="340" y="276" width="280" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="348" y="284" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="363" y="293" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXT</text>
    <text x="480" y="301" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">발급자 · CA / Vault / AWS PCA</text>

    <!-- Node: SVID (focal) -->
    <rect x="340" y="340" width="280" height="40" rx="6" fill="#ffffff"/>
    <rect x="340" y="340" width="280" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="358" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">SVID 인증서</text>
    <text x="480" y="372" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">spiffe://cluster.local/ns/.../sa/...</text>

    <!-- Node: App -->
    <rect x="340" y="396" width="280" height="40" rx="6" fill="#ffffff"/>
    <rect x="340" y="396" width="280" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="480" y="420" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">애플리케이션</text>

    <!-- Legend -->
    <line x1="48" y1="480" x2="912" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="48" y="492" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="68" y="500" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Focal / SVID 발급</text>
    <line x1="240" y1="497" x2="268" y2="497" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="276" y="500" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">반환 경로</text>
    <rect x="420" y="492" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="440" y="500" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">워크로드 Pod</text>
  </svg>