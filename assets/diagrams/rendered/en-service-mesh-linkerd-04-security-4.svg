<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="polmodel-title polmodel-desc">
    <title id="polmodel-title">Authorization policy model</title>
    <desc id="polmodel-desc">Architecture diagram showing a Server resource defining an inbound port, a ServerAuthorization granting access to it, and an AuthorizationPolicy applying that grant under either a default-deny or a default-allow policy mode.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="60" width="880" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="400" y="64" width="160" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AUTHORIZATION MODEL</text>

    <rect x="40" y="332" width="880" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="420" y="336" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="345" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">POLICY MODES</text>

    <!-- Arrows: SRV -> SA -> AP, same y=140, straight -->
    <line x1="240" y1="140" x2="400" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="560" y1="140" x2="720" y2="140" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- AP -> DENY, AP -> ALLOW: fanned from AP bottom, into zone below -->
    <path d="M 776,168 V 292 Q 776,300 768,300 H 300 Q 292,300 292,308 V 332"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 824,168 V 280 Q 824,288 816,288 H 700 Q 692,288 692,296 V 332"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels -->
    <rect x="288" y="128" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="138" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">GRANTS TO</text>
    <rect x="592" y="128" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="624" y="138" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">APPLIES AS</text>

    <!-- Nodes: Authorization Model -->
    <rect x="80" y="112" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="80" y="112" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Server</text>
    <text x="160" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">inbound port</text>

    <rect x="400" y="112" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="112" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ServerAuthorization</text>
    <text x="480" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">access rights</text>

    <rect x="720" y="112" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="720" y="112" width="160" height="56" rx="6" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="800" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AuthorizationPolicy</text>
    <text x="800" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">apply policy</text>

    <!-- Nodes: Policy Modes -->
    <rect x="180" y="364" width="220" height="56" rx="6" fill="#ffffff"/>
    <rect x="180" y="364" width="220" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="290" y="388" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">default-deny</text>
    <text x="290" y="404" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">explicit allow only</text>

    <rect x="560" y="364" width="220" height="56" rx="6" fill="#ffffff"/>
    <rect x="560" y="364" width="220" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="670" y="388" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">default-allow</text>
    <text x="670" y="404" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">explicit deny only</text>

    <!-- Legend -->
    <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="542" width="14" height="10" rx="2" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="550" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">AuthorizationPolicy (focal — enforces the mode)</text>
    <rect x="380" y="544" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="400" y="550" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Optional / less-restrictive mode</text>
  </svg>