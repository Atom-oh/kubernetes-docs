<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rp2-title rp2-desc" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">
    <title id="rp2-title">Retry 동작 방식</title>
    <desc id="rp2-desc">Envoy 프록시가 실패한 Pod 1에서 503을 받은 뒤 재시도 조건을 확인하고 다른 Pod 2로 요청을 재전송해 최종적으로 성공 응답을 클라이언트에 전달하는 흐름을 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- lifelines -->
    <line x1="100" y1="112" x2="100" y2="524" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="360" y1="112" x2="360" y2="524" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="620" y1="112" x2="620" y2="524" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="880" y1="112" x2="880" y2="524" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- actor boxes -->
    <rect x="48" y="72" width="104" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="100" y="96" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">클라이언트</text>

    <rect x="308" y="72" width="104" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="360" y="96" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Envoy Proxy</text>

    <rect x="568" y="72" width="104" height="40" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1"/>
    <text x="620" y="92" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod 1</text>
    <text x="620" y="106" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">실패</text>

    <rect x="828" y="72" width="104" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="880" y="92" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Pod 2</text>
    <text x="880" y="106" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">성공</text>

    <!-- activation bars -->
    <rect x="96" y="152" width="8" height="320" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="356" y="152" width="8" height="320" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="616" y="176" width="8" height="48" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="876" y="352" width="8" height="48" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- 1. Client -> Envoy: 요청 -->
    <line x1="104" y1="152" x2="356" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="200" y="130" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="230" y="139" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">1. 요청</text>

    <!-- 2. Envoy -> Pod1: 시도 1 -->
    <line x1="364" y1="176" x2="616" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="450" y="154" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="490" y="163" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">2. 시도 1</text>

    <!-- 3. Pod1 --> Envoy: 503 (dashed) -->
    <line x1="616" y1="200" x2="364" y2="200" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="420" y="178" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="490" y="187" fill="#DD344C" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">3. 503 SERVICE UNAVAILABLE</text>

    <!-- Note over Envoy -->
    <rect x="308" y="228" width="288" height="48" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <rect x="308" y="228" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="328" y="240" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">NOTE</text>
    <text x="452" y="252" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Retry 조건 충족</text>
    <text x="452" y="266" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">다른 Pod로 재시도</text>

    <!-- 4. Envoy -> Pod2: 시도 2 -->
    <path d="M 364,352 H 876" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="580" y="330" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="620" y="339" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">4. 시도 2</text>

    <!-- 5. Pod2 -> Envoy: 200 OK (accent headline success) -->
    <line x1="876" y1="376" x2="364" y2="376" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="580" y="354" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="620" y="363" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">5. 200 OK</text>

    <!-- 6. Envoy -> Client: 200 OK (accent headline success) -->
    <line x1="356" y1="424" x2="104" y2="424" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="200" y="402" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="230" y="411" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">6. 200 OK</text>

    <!-- legend -->
    <line x1="60" y1="484" x2="900" y2="484" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="500" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="180" y1="496" x2="204" y2="496" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="212" y="500" fill="#545B64" font-size="9">호출</text>
    <line x1="300" y1="496" x2="324" y2="496" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="332" y="500" fill="#545B64" font-size="9">실패 응답</text>
    <line x1="460" y1="496" x2="484" y2="496" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="492" y="500" fill="#545B64" font-size="9">성공 응답</text>
  </svg>