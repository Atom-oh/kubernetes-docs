    <title id="ko-security-11-kubescape-3-title">CI/CD 파이프라인의 Kubescape 보안 게이트</title>
    <desc id="ko-security-11-kubescape-3-desc">코드 변경이 커밋되어 이미지 빌드 후 Kubescape 스캔을 거치고, 점수가 임계값을 넘는지 판정해 통과하면 배포를 진행하고 실패하면 배포를 차단한 뒤 알림을 보내는 CI/CD 보안 게이트 흐름을 보여준다.</desc>
