<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ipip-sequence-title ipip-sequence-desc">
    <title id="ipip-sequence-title">IPIP 모드 패킷 캡슐화·전달 시퀀스</title>
    <desc id="ipip-sequence-desc">Pod A가 보낸 패킷을 Node 1이 캡슐화해 네트워크로 전달하고, Node 2가 이를 디캡슐화해 Pod B로 전달하기까지 시간 순서를 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="100" y1="88" x2="100" y2="460" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="290" y1="88" x2="290" y2="460" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="88" x2="480" y2="460" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="670" y1="88" x2="670" y2="460" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="860" y1="88" x2="860" y2="460" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Messages (before actor boxes) -->
    <!-- m1: PodA -> Node1 -->
    <line x1="100" y1="150" x2="290" y2="150" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="167" y="130" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="195" y="139" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PACKET</text>

    <!-- self-loop: Node1 encapsulate -->
    <path d="M290,180 H346 V212 H290" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="352" y="190" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="356" y="199" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">ENCAPSULATE</text>

    <!-- m3: Node1 -> Network -->
    <line x1="290" y1="250" x2="480" y2="250" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="357" y="230" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="385" y="239" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROTO 4</text>

    <!-- m4: Network -> Node2 -->
    <line x1="480" y1="300" x2="670" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="547" y="280" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="575" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELIVER</text>

    <!-- self-loop: Node2 decapsulate -->
    <path d="M670,330 H726 V362 H670" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="732" y="340" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="736" y="349" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">DECAPSULATE</text>

    <!-- m6: Node2 -> PodB (headline success) -->
    <line x1="670" y1="400" x2="860" y2="400" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="737" y="380" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="765" y="389" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELIVER</text>

    <!-- Actor boxes -->
    <rect x="30" y="40" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="30" y="40" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="100" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod A</text>
    <text x="100" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.1.5</text>

    <rect x="220" y="40" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="220" y="40" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="290" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Node 1</text>
    <text x="290" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Felix + tunl0</text>

    <rect x="410" y="40" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="410" y="40" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Network</text>

    <rect x="600" y="40" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="600" y="40" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="670" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Node 2</text>
    <text x="670" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Felix + tunl0</text>

    <rect x="790" y="40" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="790" y="40" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="860" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod B</text>
    <text x="860" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.2.8</text>

    <!-- Legend -->
    <line x1="30" y1="520" x2="930" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="220" y1="532" x2="244" y2="532" stroke="#545B64" stroke-width="1.2"/>
    <text x="254" y="536" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">노드 내부 처리 (캡슐화/디캡슐화)</text>
    <line x1="560" y1="532" x2="584" y2="532" stroke="#EC7211" stroke-width="1.2"/>
    <text x="594" y="536" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Pod B로 최종 전달</text>
  </svg>
