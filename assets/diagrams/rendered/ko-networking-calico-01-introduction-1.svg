<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc">
<title id="d1-title">Calico 프로젝트 거버넌스</title>
<desc id="d1-desc">Tigera, CNCF, 커뮤니티라는 세 관리 주체가 각각 Calico Enterprise, Project Calico 오픈소스, Calico Cloud를 어떻게 지원하는지 보여주는 다이어그램.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="d1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: 관리 주체 -->
<rect x="40" y="64" width="280" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="118" y="68" width="124" height="12" rx="2" fill="#ffffff"/>
<text x="180" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">관리 주체</text>

<!-- Zone: Calico 에코시스템 -->
<rect x="640" y="64" width="280" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="722" y="68" width="136" height="12" rx="2" fill="#ffffff"/>
<text x="790" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">CALICO 에코시스템</text>

<!-- Arrows -->
<!-- Tigera(y=138) -> Enterprise(y=138) same y, straight -->
<line x1="320" y1="138" x2="660" y2="138" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
<!-- Tigera(y=154 exit lower attach) -> Cloud(y=346) elbow down -->
<path d="M 320,154 H 480 Q 488,154 488,162 V 338 Q 488,346 496,346 H 640" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
<!-- CNCF(y=250) -> OSS(y=234, attach point 1) elbow up -->
<path d="M 320,250 H 520 Q 528,250 528,242 V 218 Q 528,210 536,210 H 640" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
<!-- 커뮤니티(y=346) -> OSS(y=250, attach point 2) elbow up -->
<path d="M 320,346 H 552 Q 560,346 560,338 V 258 Q 560,250 568,250 H 640" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

