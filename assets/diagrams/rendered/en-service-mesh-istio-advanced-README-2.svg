<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="multicluster-title multicluster-desc">
    <title id="multicluster-title">Multi-cluster mesh topology</title>
    <desc id="multicluster-desc">The primary cluster's control plane pushes configuration to two remote clusters while Service A communicates directly across the mesh with the service in each remote cluster.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="64" width="200" height="240" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.30)" stroke-width="0.8"/>
    <rect x="76" y="68" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="140" y="77" fill="rgba(236,114,17,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRIMARY · US-EAST-1</text>

    <rect x="640" y="64" width="240" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="684" y="68" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="760" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REMOTE 1 · US-WEST-2</text>

    <rect x="640" y="320" width="240" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="684" y="324" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="760" y="333" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REMOTE 2 · EU-WEST-1</text>

    <!-- Arrows before nodes -->
    <!-- Istiod -.-> Service B (Config Push, straight) -->
    <path d="M 216,117 H 664" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- Istiod -.-> Service C (Config Push, elbow) -->
    <path d="M 216,139 H 416 Q 424,139 424,147 V 365 Q 424,373 432,373 H 664" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- Service A <--> Service B (bidir, elbow) -->
    <path d="M 216,245 H 448 Q 456,245 456,237 V 147 Q 456,139 464,139 H 664" fill="none" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-accent-rev)" marker-end="url(#arrow)"/>
    <!-- Service A <--> Service C (bidir, elbow) -->
    <path d="M 216,267 H 480 Q 488,267 488,275 V 387 Q 488,395 496,395 H 664" fill="none" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-accent-rev)" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="412" y="97" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="448" y="106" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG PUSH</text>

    <rect x="512" y="353" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="548" y="362" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG PUSH</text>

    <rect x="528" y="119" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="564" y="128" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CROSS-CLUSTER</text>

    <rect x="544" y="375" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="580" y="384" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CROSS-CLUSTER</text>

    <!-- Node: Istiod (focal) -->
    <rect x="64" y="96" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="96" width="152" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="140" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istiod</text>
    <text x="140" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">control plane</text>

    <!-- Node: Service A -->
    <rect x="64" y="224" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="224" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service A</text>
    <text x="140" y="268" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">primary workload</text>

    <!-- Node: Service B -->
    <rect x="664" y="96" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="664" y="96" width="192" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="760" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service B</text>
    <text x="760" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">remote workload</text>

    <!-- Node: Service C -->
    <rect x="664" y="352" width="192" height="64" rx="6" fill="#ffffff"/>
    <rect x="664" y="352" width="192" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="760" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service C</text>
    <text x="760" y="396" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">remote workload</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="556" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Primary control plane</text>

    <line x1="248" y1="562" x2="276" y2="562" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="284" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Config push</text>

    <line x1="440" y1="562" x2="468" y2="562" stroke="#545B64" stroke-width="1.2" marker-start="url(#arrow-accent-rev)" marker-end="url(#arrow)"/>
    <text x="476" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Cross-cluster service call</text>
  </svg>