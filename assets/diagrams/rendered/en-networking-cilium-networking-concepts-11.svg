<title id="en-networking-cilium-networking-concepts-11-title">Kubernetes Service Discovery via CoreDNS</title>
<desc id="en-networking-cilium-networking-concepts-11-desc">Sequence diagram showing Pod A querying CoreDNS for a service name, CoreDNS resolving it against the Service's ClusterIP and selecting a backend pod, then returning the resolved IP to Pod A.</desc>
