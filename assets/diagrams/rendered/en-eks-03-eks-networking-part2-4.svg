<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Network Policy Enforcement Across Namespaces</title>
<desc id="d">Four network policies govern traffic in an EKS cluster: namespace isolation reaches into both namespaces, a pod-communication policy allows the frontend pod to reach the backend pod, an external-traffic policy scopes what reaches the frontend pod, and an egress policy scopes what the backend pod may reach, while the backend pod also talks to a database pod in a second namespace.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<text x="40" y="44" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">ARCHITECTURE · NETWORK POLICY</text>
<text x="40" y="68" fill="#232F3E" font-size="20" font-weight="700">Network Policy Enforcement Across Namespaces</text>

<!-- zones -->
<rect x="40" y="96" width="280" height="440" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.30)" stroke-width="0.8" stroke-dasharray="4,4"/>
<rect x="64" y="104" width="152" height="12" rx="2" fill="#ffffff"/>
<text x="140" y="113" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">NETWORK POLICIES</text>

<rect x="368" y="96" width="240" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="392" y="104" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="456" y="113" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">NAMESPACE 1</text>

<rect x="368" y="336" width="240" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="392" y="344" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="456" y="353" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">NAMESPACE 2</text>

<!-- policy nodes -->
<rect x="64" y="140" width="232" height="56" rx="6" fill="#ffffff" stroke="#EC7211" stroke-width="1"/>
<text x="180" y="164" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Namespace Isolation</text>
<text x="180" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">NP1</text>

<rect x="64" y="216" width="232" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="180" y="240" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Allow Frontend→Backend</text>
<text x="180" y="256" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">NP2</text>

<rect x="64" y="292" width="232" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="180" y="316" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">External Traffic Restrict</text>
<text x="180" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">NP3</text>

<rect x="64" y="368" width="232" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="180" y="392" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Egress Traffic Restrict</text>
<text x="180" y="408" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">NP4</text>

<!-- pods -->
<rect x="392" y="160" width="192" height="60" rx="6" fill="rgba(0,199,183,0.10)" stroke="#01A88D" stroke-width="1"/>
<text x="488" y="186" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Frontend Pod</text>
<text x="488" y="202" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">pod-1</text>

<rect x="392" y="252" width="192" height="60" rx="6" fill="rgba(0,199,183,0.10)" stroke="#01A88D" stroke-width="1"/>
<text x="488" y="278" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Backend Pod</text>
<text x="488" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">pod-2</text>

<rect x="392" y="376" width="192" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="488" y="402" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Database Pod</text>
<text x="488" y="418" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">pod-3</text>

<!-- external node -->
<rect x="696" y="204" width="200" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="796" y="232" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">External Services</text>
<text x="796" y="248" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">outside cluster</text>

<!-- arrows: NP1 -> NS1 zone top, NS2 zone top (dashed, policy governs zone) -->
<path d="M 296,168 H 340 Q 348,168 348,176 V 88 Q 348,80 356,80 H 500 Q 508,80 508,88 V 96" fill="none" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
<path d="M 296,168 H 332 Q 340,168 340,176 V 320 Q 340,328 348,328 H 460 Q 468,328 468,336" fill="none" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

<!-- NP2 -> Frontend, Backend -->
<path d="M 296,236 H 340 Q 348,236 348,228 V 190 Q 348,182 356,182 H 392" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 296,244 H 356 Q 364,244 364,252 V 274 Q 364,282 372,282 H 392" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- NP3 -> Frontend -->
<path d="M 296,312 H 356 Q 364,312 364,304 V 190 Q 364,182 372,182 H 392" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- NP4 -> Backend -->
<path d="M 296,392 H 356 Q 364,392 364,384 V 282 Q 364,274 372,274 H 392" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Frontend -> Backend -->
<path d="M 488,220 V 252" fill="none" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Backend -> Database -->
<path d="M 488,312 V 376" fill="none" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- External -> Frontend, Backend -> External -->
<path d="M 696,220 H 620 Q 612,220 612,212 V 190 H 584" fill="none" stroke="#7D8998" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 584,296 H 640 Q 648,296 648,304 V 252 H 696" fill="none" stroke="#7D8998" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- legend -->
<line x1="40" y1="562" x2="920" y2="562" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="580" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="150" y1="577" x2="180" y2="577" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
<text x="188" y="580" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">POLICY GOVERNS</text>
<line x1="400" y1="577" x2="430" y2="577" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="438" y="580" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">ACTUAL TRAFFIC</text>

</svg>