<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="mesh-compare-title mesh-compare-desc">
    <title id="mesh-compare-title">서비스 메시 유무에 따른 통신 구조 비교</title>
    <desc id="mesh-compare-desc">서비스 메시 없이 각 서비스가 mTLS·재시도·관찰성을 직접 구현하는 구조와, 중앙 컨트롤 플레인이 네 서비스의 통신을 자동으로 제어하는 구조를 나란히 비교한 아키텍처 다이어그램.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="d1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="80" width="420" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="88" width="180" height="14" fill="#ffffff"/>
    <text x="60" y="99" fill="rgba(35,47,62,0.55)" font-size="8" font-family="var(--font-mono)" letter-spacing="0.12em">SERVICE MESH 없이</text>

    <rect x="500" y="80" width="420" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="516" y="88" width="180" height="14" fill="#ffffff"/>
    <text x="520" y="99" fill="rgba(35,47,62,0.55)" font-size="8" font-family="var(--font-mono)" letter-spacing="0.12em">SERVICE MESH 사용</text>

    <!-- Left zone arrows (dashed = manual) -->
    <!-- A1(250,148) -> B1(140,256) : down-left elbow -->
    <path d="M 250,166 V 220 Q 250,228 242,228 H 176" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d1-arrow)"/>
    <!-- A1(250,148) -> C1(360,256) : down-right elbow -->
    <path d="M 250,166 V 220 Q 250,228 258,228 H 324" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d1-arrow)"/>
    <!-- B1(140,256) -> D1(250,364) : down-right elbow -->
    <path d="M 140,274 V 320 Q 140,328 148,328 H 214" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d1-arrow)"/>
    <!-- C1(360,256) -> D1(250,364) : down-left elbow -->
    <path d="M 360,274 V 320 Q 360,328 352,328 H 286" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d1-arrow)"/>

    <!-- Right zone arrows (solid = auto) -->
    <path d="M 710,166 V 220 Q 710,228 702,228 H 636" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
    <path d="M 710,166 V 220 Q 710,228 718,228 H 784" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
    <path d="M 600,274 V 320 Q 600,328 608,328 H 674" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
    <path d="M 820,274 V 320 Q 820,328 812,328 H 746" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

    <!-- SM hub control (dashed, straight, accent) -->
    <line x1="710" y1="234" x2="710" y2="166" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d1-arrow-accent)"/>
    <line x1="666" y1="256" x2="636" y2="256" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d1-arrow-accent)"/>
    <line x1="754" y1="256" x2="784" y2="256" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d1-arrow-accent)"/>
    <line x1="710" y1="278" x2="710" y2="346" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d1-arrow-accent)"/>

    <!-- Left zone nodes -->
    <rect x="214" y="130" width="72" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="250" y="152" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">Service A</text>
    <rect x="104" y="238" width="72" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">Service B</text>
    <rect x="324" y="238" width="72" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="360" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">Service C</text>
    <rect x="214" y="346" width="72" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="250" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">Service D</text>
    <text x="250" y="410" fill="#7D8998" font-size="9" font-family="var(--font-mono)" text-anchor="middle" font-style="italic">mTLS·재시도·로깅 중복 구현</text>

    <!-- Right zone nodes -->
    <rect x="674" y="130" width="72" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="710" y="152" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">Service A</text>
    <rect x="564" y="238" width="72" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="600" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">Service B</text>
    <rect x="784" y="238" width="72" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="820" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">Service C</text>
    <rect x="674" y="346" width="72" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="710" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">Service D</text>

    <!-- SM hub (focal) -->
    <rect x="666" y="234" width="88" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="710" y="252" fill="#232F3E" font-size="11" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">Service Mesh</text>
    <text x="710" y="266" fill="#232F3E" font-size="8" font-family="var(--font-mono)" text-anchor="middle">mTLS·정책·관찰성 자동화</text>

    <!-- Legend -->
    <line x1="40" y1="496" x2="920" y2="496" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="512" fill="#545B64" font-size="8" font-family="var(--font-mono)" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="506" x2="168" y2="506" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d1-arrow)"/>
    <text x="176" y="510" fill="#545B64" font-size="8.5" font-family="var(--font-cjk)">수동 구현</text>
    <line x1="300" y1="506" x2="328" y2="506" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
    <text x="336" y="510" fill="#545B64" font-size="8.5" font-family="var(--font-cjk)">자동 처리</text>
    <line x1="460" y1="506" x2="488" y2="506" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d1-arrow-accent)"/>
    <text x="496" y="510" fill="#545B64" font-size="8.5" font-family="var(--font-cjk)">메시 제어(control)</text>
  </svg>