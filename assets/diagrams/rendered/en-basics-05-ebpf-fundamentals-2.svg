<text x="620.0" y="348.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">JIT Compiler</text>
<text x="620.0" y="366.0" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">native machine code</text>
<line x1="520" y1="352.0" x2="488" y2="352.0" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="288" y="320" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="288" y="320" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="388.0" y="348.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Attach &amp; Execute</text>
<text x="388.0" y="366.0" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runs at hook point</text>
<line x1="388.0" y1="384" x2="388.0" y2="460" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="288" y="460" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="288" y="460" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="388.0" y="488.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Store in eBPF Map</text>
<text x="388.0" y="506.0" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kernel-side state</text>
<line x1="488" y1="492.0" x2="520" y2="492.0" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="520" y="460" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="520" y="460" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="620.0" y="488.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Read from User Space</text>
<text x="620.0" y="506.0" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bpftool / app</text>
<line x1="40" y1="544" x2="920" y2="544" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
<text x="40" y="560" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
