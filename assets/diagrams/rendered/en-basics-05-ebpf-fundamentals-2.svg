<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-basics-05-ebpf-fundamentals-2-title en-basics-05-ebpf-fundamentals-2-desc">
<title id="en-basics-05-ebpf-fundamentals-2-title">eBPF program load and execution flow</title>
<desc id="en-basics-05-ebpf-fundamentals-2-desc">Flowchart of an eBPF program's path from writing and compiling C or Rust code, through loading into the kernel and passing the verifier, to JIT compilation into native machine code, attachment and execution at an event hook, storing data in an eBPF map, and reading that data back from user space; a failed verification is rejected with an error.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>
<text x="40" y="52" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FLOWCHART · EBPF EXECUTION</text>
<text x="40" y="80" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">eBPF program load and execution flow</text>
<rect x="48" y="140" width="192" height="64" rx="6" fill="#ffffff"/>
<rect x="48" y="140" width="192" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="144.0" y="168.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Write &amp; Compile</text>
<text x="144.0" y="186.0" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">C/Rust to bytecode</text>
<line x1="240" y1="172.0" x2="288" y2="172.0" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="288" y="140" width="176" height="64" rx="6" fill="#ffffff"/>
<rect x="288" y="140" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="376.0" y="168.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Load into Kernel</text>
<text x="376.0" y="186.0" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bpf() syscall</text>
<line x1="464" y1="172.0" x2="540.0" y2="172.0" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<polygon points="620,128.0 700.0,172.0 620,216.0 540.0,172.0" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="620" y="170.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Verifier</text>
<text x="620" y="185.0" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">safety check</text>
<line x1="700.0" y1="172.0" x2="760" y2="172.0" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
