<rect x="760" y="140" width="160" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="840.0" y="168.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Rejected</text>
<text x="840.0" y="186.0" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">error message</text>
<line x1="620" y1="216.0" x2="620" y2="320" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
