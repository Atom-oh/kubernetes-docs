<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow3-title flow3-desc">
    <title id="flow3-title">Alertmanager 라우팅 결정 흐름</title>
    <desc id="flow3-desc">알림이 수신되면 severity가 critical인지, service가 foo/bar인지, owner가 team-a인지를 차례로 판별해 critical-receiver, default-receiver, team-a, service-team 중 하나로 라우팅되는 결정 흐름을 보여줍니다.</desc>
    <defs><style>@import url(https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Edges (behind boxes) -->
    <line x1="480" y1="80" x2="480" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="550" y1="180" x2="700" y2="180" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="480" y1="220" x2="480" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="550" y1="300" x2="700" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="340" x2="480" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="550" y1="420" x2="700" y2="420" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 480,460 V 500 Q 480,508 488,508 H 700" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Node: A start -->
    <rect x="420" y="40" width="120" height="40" rx="20" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="480" y="65" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">알림 수신</text>

    <!-- Node: B decision (focal) -->
    <polygon points="480,140 550,180 480,220 410,180" fill="#FFF8F0" stroke="#EC7211" stroke-width="1.4"/>
    <text x="480" y="184" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Critical?</text>

    <!-- Node: C leaf -->
    <rect x="700" y="156" width="160" height="48" rx="6" fill="#ffffff" stroke="#EC7211" stroke-width="1.2"/>
    <text x="780" y="184" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">critical-receiver</text>

    <!-- Node: D decision -->
    <polygon points="480,260 550,300 480,340 410,300" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="296" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">service=foo,</text>
    <text x="480" y="310" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">bar?</text>

    <!-- Node: F leaf -->
    <rect x="700" y="276" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">default-receiver</text>

    <!-- Node: E decision -->
    <polygon points="480,380 550,420 480,460 410,420" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="410" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">owner=</text>
    <text x="480" y="424" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">team-a?</text>

    <!-- Node: G leaf -->
    <rect x="700" y="396" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="424" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">team-a</text>

    <!-- Node: H leaf -->
    <rect x="700" y="484" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="512" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">service-team</text>

    <!-- Edge labels -->
    <rect x="600" y="170" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="620" y="179" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

    <rect x="416" y="234" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="436" y="243" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

    <rect x="600" y="290" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="620" y="299" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

    <rect x="416" y="354" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="436" y="363" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

    <rect x="600" y="410" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="620" y="419" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

    <rect x="560" y="484" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="580" y="493" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

    <!-- Legend -->
    <line x1="40" y1="556" x2="920" y2="556" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <polygon points="52,566 62,572 52,578 42,572" fill="none" stroke="#232F3E" stroke-width="1"/>
    <text x="72" y="575" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">판단 조건</text>
    <rect x="220" y="566" width="20" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="248" y="575" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">수신자</text>
  </svg>