<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq1-title seq1-desc">
    <title id="seq1-title">preStop Hook 적용 후 정상 종료 시퀀스</title>
    <desc id="seq1-desc">Envoy에 terminationDrainDuration을 설정하면 SIGTERM 이후 새 연결만 거부하고 기존 연결은 유지하는 Drain 모드로 진입해, 진행 중인 요청이 정상 응답을 받은 뒤 애플리케이션과 Envoy가 함께 정상 종료됨을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#FFFFFF"/>

    <!-- ===================== LIFELINES ===================== -->
    <line x1="120" y1="128" x2="120" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="360" y1="128" x2="360" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="600" y1="128" x2="600" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="840" y1="128" x2="840" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ===================== MESSAGE ARROWS ===================== -->
    <!-- m1: K8s -> App SIGTERM -->
    <line x1="120" y1="160" x2="360" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m2: K8s -> Envoy SIGTERM -->
    <line x1="120" y1="192" x2="600" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- self: Envoy enters drain mode -->
    <path d="M 600 232 L 640 232 L 640 280 L 600 280" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- m3: Client -> Envoy request -->
    <line x1="840" y1="320" x2="600" y2="320" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m4: Envoy -> App forward -->
    <line x1="600" y1="352" x2="360" y2="352" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- m5: App -> Envoy response (dashed return) -->
    <line x1="360" y1="384" x2="600" y2="384" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- m6: Envoy -> Client success (headline, coral) -->
    <line x1="600" y1="416" x2="840" y2="416" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- self: Envoy terminates cleanly -->
    <path d="M 600 452 L 636 452 L 636 480 L 600 480" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- self: App graceful shutdown -->
    <path d="M 360 452 L 396 452 L 396 480 L 360 480" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===================== NOTE BOX ===================== -->
    <rect x="660" y="222" width="164" height="64" rx="6" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1"/>
    <text x="742" y="242" fill="#232F3E" font-size="12" font-style="italic" font-family="var(--sans),'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">✅ 새 연결만 거부,</text>
    <text x="742" y="258" fill="#232F3E" font-size="12" font-style="italic" font-family="var(--sans),'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">기존 연결은 유지한 채</text>
    <text x="742" y="274" fill="#232F3E" font-size="12" font-style="italic" font-family="var(--sans),'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">30초 대기</text>

    <!-- ===================== LABELS ===================== -->
    <rect x="196" y="144" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="240" y="154" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SIGTERM 전송</text>

    <rect x="316" y="176" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="360" y="186" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SIGTERM 전송</text>

    <rect x="470" y="248" width="100" height="12" rx="2" fill="#FFFFFF"/>
    <text x="520" y="258" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DRAIN 모드 진입</text>

    <rect x="676" y="304" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="720" y="314" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">요청 전송</text>

    <rect x="436" y="336" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="480" y="346" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">요청 전달</text>

    <rect x="436" y="368" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="480" y="378" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">응답</text>

    <rect x="668" y="400" width="104" height="12" rx="2" fill="#FFFFFF"/>
    <text x="720" y="410" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">✅ 정상 응답</text>

    <rect x="644" y="436" width="88" height="12" rx="2" fill="#FFFFFF"/>
    <text x="688" y="446" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">정상 종료</text>

    <rect x="316" y="436" width="128" height="12" rx="2" fill="#FFFFFF"/>
    <text x="380" y="446" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">GRACEFUL SHUTDOWN</text>

    <!-- ===================== ACTOR BOXES ===================== -->
    <!-- Kubernetes -->
    <rect x="48" y="64" width="144" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="48" y="64" width="144" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="56" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="70" y="81" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SYS</text>
    <text x="120" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">Kubernetes</text>
    <text x="120" y="111" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">kubelet</text>

    <!-- Application -->
    <rect x="288" y="64" width="144" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="288" y="64" width="144" height="56" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <rect x="296" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="310" y="81" fill="#545B64" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="360" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">Application</text>
    <text x="360" y="111" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">container</text>

    <!-- Envoy Proxy (focal) -->
    <rect x="528" y="64" width="144" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="528" y="64" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="536" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="554" y="81" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>
    <text x="600" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">Envoy Proxy</text>
    <text x="600" y="111" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">istio-proxy</text>

    <!-- Client -->
    <rect x="768" y="64" width="144" height="56" rx="6" fill="#FFFFFF"/>
    <rect x="768" y="64" width="144" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="776" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="790" y="81" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="840" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">Client</text>
    <text x="840" y="111" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">외부 요청</text>

    <!-- ===================== LEGEND ===================== -->
    <line x1="48" y1="548" x2="912" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="48" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

    <line x1="140" y1="588" x2="168" y2="588" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="176" y="591" fill="#545B64" font-size="8.5" font-family="var(--sans)">일반 호출/응답</text>

    <line x1="336" y1="588" x2="364" y2="588" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="372" y="591" fill="#545B64" font-size="8.5" font-family="var(--sans)">Drain·정상 응답</text>

    <rect x="580" y="580" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="602" y="591" fill="#545B64" font-size="8.5" font-family="var(--sans)">해결 지점 (Envoy)</text>

  </svg>