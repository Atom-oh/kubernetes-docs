<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="se1-title se1-desc">
  <title id="se1-title">ServiceEntry로 외부 서비스 등록하기</title>
  <desc id="se1-desc">메시 내부 애플리케이션의 요청이 ServiceEntry를 거쳐 외부 API와 외부 DB로 나가면서, 트래픽 제어와 모니터링, 보안이 함께 적용된다.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="se1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="se1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="32" y="20" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SERVICE REGISTRATION</text>
  <text x="32" y="44" fill="#232F3E" font-size="20" font-weight="700">ServiceEntry로 외부 서비스 등록</text>

  <!-- ===================== Zones (painted first) ===================== -->
  <rect x="24" y="64" width="420" height="180" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="40" y="68" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="96" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">SERVICE MESH</text>

  <rect x="500" y="64" width="436" height="368" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="516" y="68" width="160" height="12" rx="2" fill="#ffffff"/>
  <text x="596" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">EXTERNAL SERVICES</text>

  <!-- ===================== Connectors ===================== -->
  <!-- App -> SE : straight, same y=152 -->
  <line x1="196" y1="152" x2="264" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#se1-arrow)"/>
  <rect x="198" y="132" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="230" y="141" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">1. 요청</text>

  <!-- SE -> API : elbow, down 28px, exits SE right edge at y=120 -->
  <path d="M404,120 H558 Q566,120 566,128 V140 Q566,148 574,148 H728"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#se1-arrow)"/>
  <rect x="599" y="128" width="104" height="12" rx="2" fill="#ffffff"/>
  <text x="651" y="137" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">제어·모니터링·보안</text>

  <!-- SE -> DB : elbow, down 180px, exits SE right edge at y=184 -->
  <path d="M404,184 H558 Q566,184 566,192 V356 Q566,364 574,364 H728"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#se1-arrow)"/>
  <rect x="599" y="344" width="104" height="12" rx="2" fill="#ffffff"/>
  <text x="651" y="353" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">제어·모니터링·보안</text>

  <!-- ===================== Nodes ===================== -->
  <!-- App -->
  <rect x="56" y="104" width="140" height="96" rx="6" fill="#ffffff"/>
  <rect x="56" y="104" width="140" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="126" y="156" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">애플리케이션</text>

  <!-- ServiceEntry (focal) -->
  <rect x="264" y="104" width="140" height="96" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="264" y="104" width="140" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="334" y="150" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">ServiceEntry</text>
  <text x="334" y="166" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">등록</text>

  <!-- External API -->
  <rect x="728" y="104" width="176" height="88" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="728" y="104" width="176" height="88" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="816" y="144" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">외부 API</text>
  <text x="816" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api.example.com</text>

  <!-- External DB -->
  <rect x="728" y="320" width="176" height="88" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="728" y="320" width="176" height="88" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="816" y="360" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">외부 DB</text>
  <text x="816" y="376" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">db.example.com</text>

  <!-- Legend -->
  <line x1="32" y1="456" x2="928" y2="456" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="474" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <line x1="140" y1="470" x2="164" y2="470" stroke="#545B64" stroke-width="1.2"/>
  <text x="172" y="474" fill="#232F3E" font-size="9" font-family="'Geist Mono', monospace">제어·모니터링 적용 트래픽</text>

  <rect x="440" y="464" width="16" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="464" y="474" fill="#232F3E" font-size="9" font-family="'Geist Mono', monospace">ServiceEntry (등록 지점)</text>

</svg>