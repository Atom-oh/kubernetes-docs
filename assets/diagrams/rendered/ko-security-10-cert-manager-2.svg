<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
    <title id="t2">ACME 인증서 발급 흐름</title>
    <desc id="d2">사용자가 Certificate를 생성하면 cert-manager가 ACME Order와 Authorization을 거쳐 Challenge를 발급하고, HTTP-01 또는 DNS-01 솔버로 도메인 소유권을 검증한 뒤 Let's Encrypt가 인증서를 발급해 Secret에 저장하는 단계별 흐름을 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="320" y="112" width="320" height="188" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="424" y="116" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="125" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ACME 프로토콜</text>

    <rect x="140" y="292" width="680" height="68" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="424" y="296" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="305" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">CHALLENGE 솔버</text>

    <rect x="320" y="352" width="320" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="424" y="356" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="365" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">LET'S ENCRYPT</text>

    <!-- Arrows -->
    <line x1="480" y1="52" x2="480" y2="76" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="112" x2="480" y2="136" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="172" x2="480" y2="196" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="232" x2="480" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Fork: Challenge -> HTTP-01 / DNS-01 -->
    <path d="M433,292 V300 Q433,308 425,308 H268 Q260,308 260,316" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M527,292 V300 Q527,308 535,308 H692 Q700,308 700,316" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Join: HTTP-01 / DNS-01 -> Verify -->
    <path d="M260,352 V360 Q260,368 268,368 H425 Q433,368 433,376" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M700,352 V360 Q700,368 692,368 H535 Q527,368 527,376" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Success path (accent) -->
    <line x1="480" y1="412" x2="480" y2="436" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="480" y1="472" x2="480" y2="496" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Labels -->
    <rect x="204" y="303" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="230" y="312" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">HTTP-01</text>
    <rect x="700" y="303" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="726" y="312" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DNS-01</text>
    <rect x="454" y="416" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="425" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">성공</text>

    <!-- Node: CreateCert -->
    <rect x="340" y="16" width="280" height="36" rx="20" fill="#ffffff"/>
    <rect x="340" y="16" width="280" height="36" rx="20" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="480" y="38" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">1. 사용자: Certificate 생성</text>

    <!-- Node: Controller/CertReq -->
    <rect x="340" y="76" width="280" height="36" rx="6" fill="#ffffff"/>
    <rect x="340" y="76" width="280" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">2. cert-manager: CertificateRequest 생성</text>

    <!-- Node: Order -->
    <rect x="340" y="136" width="280" height="36" rx="6" fill="#ffffff"/>
    <rect x="340" y="136" width="280" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="154" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Order 생성</text>
    <text x="480" y="168" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">도메인 목록</text>

    <!-- Node: Authorization -->
    <rect x="340" y="196" width="280" height="36" rx="6" fill="#ffffff"/>
    <rect x="340" y="196" width="280" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="214" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Authorization</text>
    <text x="480" y="228" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">도메인별 인증</text>

    <!-- Node: Challenge (focal) -->
    <rect x="340" y="256" width="280" height="36" rx="6" fill="#ffffff"/>
    <rect x="340" y="256" width="280" height="36" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="274" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Challenge</text>
    <text x="480" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">소유권 증명</text>

    <!-- Node: HTTP-01 -->
    <rect x="160" y="316" width="200" height="36" rx="6" fill="#ffffff"/>
    <rect x="160" y="316" width="200" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="260" y="334" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">HTTP-01</text>
    <text x="260" y="348" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/.well-known/acme-challenge/</text>

    <!-- Node: DNS-01 -->
    <rect x="600" y="316" width="200" height="36" rx="6" fill="#ffffff"/>
    <rect x="600" y="316" width="200" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="700" y="334" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">DNS-01</text>
    <text x="700" y="348" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">_acme-challenge TXT</text>

    <!-- Node: Verify -->
    <rect x="340" y="376" width="280" height="36" rx="6" fill="#ffffff"/>
    <rect x="340" y="376" width="280" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="398" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">도메인 소유권 검증</text>

    <!-- Node: Finalize + Issue -->
    <rect x="340" y="436" width="280" height="36" rx="6" fill="#ffffff"/>
    <rect x="340" y="436" width="280" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="454" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Finalize</text>
    <text x="480" y="468" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">인증서 발급</text>

    <!-- Node: Secret -->
    <rect x="340" y="496" width="280" height="36" rx="6" fill="#ffffff"/>
    <rect x="340" y="496" width="280" height="36" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="514" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Secret 저장</text>
    <text x="480" y="528" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tls.crt + tls.key</text>

    <!-- Legend -->
    <line x1="48" y1="556" x2="912" y2="556" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="48" y="568" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="68" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Focal / 검증 단계</text>
    <line x1="240" y1="573" x2="268" y2="573" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="276" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">발급 성공 경로</text>
  </svg>