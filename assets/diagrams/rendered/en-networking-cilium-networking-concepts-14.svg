<title id="en-networking-cilium-networking-concepts-14-title">eBPF-based Load Balancing</title>
<desc id="en-networking-cilium-networking-concepts-14-desc">Diagram showing a packet from Pod A moving through a four-step eBPF pipeline in the kernel — intercept, service map lookup, backend selection, forwarding — before reaching Pod B, replacing kube-proxy.</desc>
