<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oncall-irm-title oncall-irm-desc">
    <title id="oncall-irm-title">Grafana IRM 연동</title>
    <desc id="oncall-irm-desc">Grafana OnCall에서 발생한 알림이 알림 그룹과 에스컬레이션을 거쳐 심각도가 높으면 Grafana IRM의 인시던트로 생성되고, 조사와 해결, 포스트모템 단계로 이어지는 흐름을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="236" width="360" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="152" y="240" width="136" height="12" rx="2" fill="#ffffff"/>
    <text x="220" y="249" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">GRAFANA ONCALL</text>

    <rect x="420" y="236" width="520" height="128" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="620" y="240" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="680" y="249" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">GRAFANA IRM</text>

    <!-- Arrows -->
    <line x1="150" y1="296" x2="170" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="280" y1="296" x2="300" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="390" y1="296" x2="440" y2="296" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="550" y1="296" x2="570" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="680" y1="296" x2="700" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="800" y1="296" x2="820" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Label: 심각도 높음 -->
    <rect x="392" y="276" width="46" height="12" rx="2" fill="#ffffff"/>
    <text x="415" y="286" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">CRITICAL</text>

    <!-- Nodes: OnCall side -->
    <rect x="60" y="268" width="90" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="105" y="300" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Alert</text>

    <rect x="170" y="268" width="110" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="225" y="300" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Alert Group</text>

    <rect x="300" y="268" width="90" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="345" y="300" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Escalation</text>

    <!-- Nodes: IRM side -->
    <rect x="440" y="268" width="110" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="495" y="292" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Incident</text>
    <text x="495" y="306" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Created</text>

    <rect x="570" y="268" width="110" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="625" y="300" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Investigation</text>

    <rect x="700" y="268" width="100" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="750" y="300" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Resolution</text>

    <rect x="820" y="268" width="100" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="870" y="300" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Post-mortem</text>

  </svg>