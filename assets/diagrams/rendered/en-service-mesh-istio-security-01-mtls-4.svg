<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4-title d4-desc">
    <title id="d4-title">Six-segment mTLS and TLS path from client to backend service</title>
    <desc id="d4-desc">A client's mTLS connection to CloudFront hands off to plain TLS across ALB and the Istio Gateway, then the Istio mesh re-establishes Envoy mTLS hop by hop across three backend services.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs><defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="216" y="108" width="520" height="108" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="228" y="112" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="266" y="121" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AWS EDGE</text>

    <rect x="168" y="260" width="624" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="180" y="264" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="224" y="273" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EKS CLUSTER</text>

    <rect x="192" y="372" width="576" height="112" rx="8" fill="rgba(255,153,0,0.03)" stroke="rgba(236,114,17,0.25)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <rect x="204" y="376" width="96" height="12" rx="2" fill="#fffbf6"/>
    <text x="252" y="385" fill="rgba(236,114,17,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE MESH</text>

    <!-- Arrows -->
    <!-- 1. Client <-> CloudFront (mTLS) -->
    <line x1="348" y1="80" x2="348" y2="136" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <rect x="368" y="98" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="404" y="107" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1. MTLS</text>

    <!-- 2. CloudFront -> ALB (TLS + headers) -->
    <line x1="436" y1="168" x2="520" y2="168" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="446" y="148" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="478" y="157" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2. TLS+HDR</text>

    <!-- 3. ALB -> Istio Gateway (TLS + headers) -->
    <path d="M608,200 V236 Q608,244 600,244 H488 Q480,244 480,252 V288" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="516" y="232" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="548" y="241" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3. TLS+HDR</text>

    <!-- 4. Gateway <-> Service A (mTLS) -->
    <path d="M480,344 V368 Q480,376 472,376 H300 Q292,376 292,384 V404" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <rect x="332" y="364" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="368" y="373" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">4. MTLS</text>

    <!-- 5. Service A <-> Service B (mTLS) -->
    <line x1="368" y1="436" x2="404" y2="436" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <rect x="372" y="416" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="386" y="425" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">5.MTLS</text>

    <!-- 6. Service B <-> Service C (mTLS) -->
    <line x1="556" y1="436" x2="592" y2="436" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <rect x="560" y="416" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="574" y="425" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">6.MTLS</text>

    <!-- Nodes -->
    <!-- Client -->
    <rect x="260" y="24" width="176" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="348" y="48" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
    <text x="348" y="64" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">client cert</text>

    <!-- CloudFront -->
    <rect x="260" y="136" width="176" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="348" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudFront</text>
    <text x="348" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mtls verification</text>

    <!-- ALB -->
    <rect x="520" y="136" width="176" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="608" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ALB</text>
    <text x="608" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">header forwarding</text>

    <!-- Gateway (focal) -->
    <rect x="392" y="288" width="176" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio Gateway</text>
    <text x="480" y="328" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">header validation</text>

    <!-- Service A -->
    <rect x="216" y="404" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="292" y="432" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service A</text>
    <text x="292" y="448" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">envoy mtls</text>

    <!-- Service B -->
    <rect x="404" y="404" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="432" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service B</text>
    <text x="480" y="448" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">envoy mtls</text>

    <!-- Service C -->
    <rect x="592" y="404" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="668" y="432" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service C</text>
    <text x="668" y="448" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">envoy mtls</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="200" y1="536" x2="232" y2="536" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <text x="240" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Mutual TLS segment</text>

    <line x1="440" y1="536" x2="472" y2="536" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="480" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">One-way TLS + cert headers</text>

    <rect x="740" y="530" width="16" height="12" rx="3" fill="rgba(255,153,0,0.03)" stroke="rgba(236,114,17,0.25)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <text x="764" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Service mesh boundary</text>
  </svg>