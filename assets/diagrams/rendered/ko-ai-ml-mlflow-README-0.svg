<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">MLflow Tracking-Registry-Serving 흐름</title>
  <desc id="ddesc">MLflow의 Tracking에서 만들어진 실험/Run/Trace가 Model Registry에 등록되어 해석 대상이 되고, 그 결과가 이 문서 시리즈의 범위 밖인 서빙 단계로 이어지는 흐름을 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="80" y="76" fill="#7D8998" font-size="8" font-weight="500" font-family="'Geist Mono', monospace"
        letter-spacing="0.18em">MLFLOW · 데이터 &amp; 모델 파이프라인</text>
  <text x="80" y="108" fill="#232F3E" font-size="28" font-weight="700"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Tracking → Model Registry → 서빙</text>
  <text x="80" y="136" fill="#545B64" font-size="14" font-style="italic"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">이 문서 시리즈는 Tracking과 Model Registry를 다루며, 서빙은 범위 밖이다.</text>

  <!-- Connectors (drawn before nodes) -->
  <!-- Tracking -> Model Registry : straight, same y, no label -->
  <line x1="280" y1="308" x2="380" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Model Registry -> 서빙 : straight, same y, labeled, dashed (leads out of scope) -->
  <line x1="580" y1="308" x2="680" y2="308" stroke="#7D8998" stroke-width="1.2"
        stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="592" y="288" width="76" height="12" rx="2" fill="#ffffff"/>
  <text x="630" y="297" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.06em">해석 대상</text>

  <!-- Node: Tracking (backend/step treatment) -->
  <rect x="80" y="260" width="200" height="96" rx="6" fill="#ffffff"/>
  <rect x="80" y="260" width="200" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="92" y="272" width="64" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="124" y="282" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">TRACKING</text>
  <text x="180" y="314" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tracking</text>
  <text x="180" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">실험, Run, Trace</text>

  <!-- Node: Model Registry (focal) -->
  <rect x="380" y="260" width="200" height="96" rx="6" fill="#ffffff"/>
  <rect x="380" y="260" width="200" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="392" y="272" width="64" height="14" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
  <text x="424" y="282" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">REGISTRY</text>
  <text x="480" y="314" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Model Registry</text>
  <text x="480" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">Registered Model, Alias</text>

  <!-- Node: 서빙 (optional / out of scope treatment) -->
  <rect x="680" y="260" width="200" height="96" rx="6" fill="#ffffff"/>
  <rect x="680" y="260" width="200" height="96" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)"
        stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="692" y="272" width="64" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
  <text x="724" y="282" fill="rgba(35,47,62,0.55)" font-size="7" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">SERVING</text>
  <text x="780" y="314" fill="#232F3E" font-size="12" font-weight="600"
        font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">서빙</text>
  <text x="780" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">이 시리즈 범위 밖</text>

  <!-- Legend -->
  <line x1="80" y1="512" x2="880" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="80" y="500" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace"
        letter-spacing="0.14em">범례</text>

  <rect x="80" y="528" width="14" height="14" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="102" y="539" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">일반 단계</text>

  <rect x="240" y="528" width="14" height="14" rx="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="262" y="539" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">핵심 개념 (본문 초점)</text>

  <rect x="480" y="528" width="14" height="14" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)"
        stroke-width="1" stroke-dasharray="4,3"/>
  <text x="502" y="539" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">이 시리즈 범위 밖</text>
</svg>