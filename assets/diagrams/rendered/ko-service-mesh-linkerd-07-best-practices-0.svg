<text x="56" y="240" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">PHASE 2 · 병행 운영</text>

<rect x="40" y="364" width="880" height="132" rx="8" fill="none" stroke="#D5DBDB" stroke-width="1"/>
<text x="56" y="388" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">PHASE 3 · 완료</text>

