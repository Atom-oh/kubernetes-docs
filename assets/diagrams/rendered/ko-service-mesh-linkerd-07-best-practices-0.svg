<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ko-linkerd-migration-0-title ko-linkerd-migration-0-desc">
<title id="ko-linkerd-migration-0-title">Istio에서 Linkerd로의 마이그레이션 단계</title>
<desc id="ko-linkerd-migration-0-desc">준비, 병행 운영, 완료의 3단계로 진행되는 Istio에서 Linkerd로의 점진적 마이그레이션 절차를 보여준다.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
  <style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");
    text{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
  </style>
</defs>

<rect width="960" height="640" fill="#ffffff"/>

<!-- Header -->
<text x="40" y="28" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">PROCESS · MIGRATION PATH</text>
<text x="40" y="52" fill="#232F3E" font-size="20" font-weight="700">Istio에서 Linkerd로의 마이그레이션 단계</text>

<!-- ===== Connectors (drawn before boxes) ===== -->
<!-- C -> D (zone1 -> zone2) -->
<path d="M760,176 L760,200 Q760,208 752,208 L208,208 Q200,208 200,216 L200,260" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- F -> G (zone2 -> zone3) -->
<path d="M760,324 L760,348 Q760,356 752,356 L348,356 Q340,356 340,364 L340,408" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Zone1 internal arrows: A->B, B->C -->
<line x1="320" y1="144" x2="352" y2="144" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="600" y1="144" x2="632" y2="144" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Zone2 internal arrows: D->E, E->F -->
<line x1="320" y1="292" x2="352" y2="292" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="600" y1="292" x2="632" y2="292" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Zone3 internal arrow: G->H (accent, culmination) -->
<line x1="460" y1="440" x2="492" y2="440" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- ===== Zone containers ===== -->
<rect x="40" y="68" width="880" height="132" rx="8" fill="none" stroke="#D5DBDB" stroke-width="1"/>
<text x="56" y="92" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">PHASE 1 · 준비</text>

