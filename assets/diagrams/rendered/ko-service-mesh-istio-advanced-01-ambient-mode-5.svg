<title id="amb05-title">Waypoint의 L7 기능 처리 파이프라인</title>
<desc id="amb05-desc">ztunnel에서 L7 처리가 필요한 트래픽을 넘겨받은 Waypoint가 경로 라우팅, 재시도, 서킷 브레이커, 폴트 인젝션, 헤더 조작을 순서대로 적용한 뒤 대상 서비스로 전달하는 과정을 보여주는 다이어그램.</desc>
