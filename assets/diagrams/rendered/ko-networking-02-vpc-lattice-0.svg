<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vpclr-title vpclr-desc">
<title id="vpclr-title">VPC Lattice 트래픽 라우팅 구조</title>
<desc id="vpclr-desc">클라이언트의 요청이 VPC Lattice 서비스 네트워크를 거쳐 라우팅 규칙에 따라 세 서비스로 분산되고, 각 서비스는 자신의 대상 그룹을 통해 서로 다른 VPC의 파드로 트래픽을 전달하는 구조를 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="40" y="44" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ARCHITECTURE</text>
<text x="40" y="68" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">VPC Lattice 트래픽 라우팅 구조</text>

<!-- ===== Zones (drawn before arrows/nodes) ===== -->
<rect x="100" y="400" width="200" height="96" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="164" y="404" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="200" y="413" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VPC 1</text>

<rect x="380" y="400" width="200" height="96" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="444" y="404" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="413" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VPC 2</text>

<rect x="660" y="400" width="200" height="96" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="724" y="404" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="760" y="413" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VPC 3</text>

