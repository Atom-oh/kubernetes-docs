<path d="M760,340 V436" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="164" y="378" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="200" y="387" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">대상 그룹</text>
<rect x="444" y="378" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="387" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">대상 그룹</text>
<rect x="724" y="378" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="760" y="387" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">대상 그룹</text>

