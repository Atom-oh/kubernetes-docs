<path d="M480,248 V300" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M530,248 V266 Q530,274 538,274 H752 Q760,274 760,282 V300" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="272" y="266" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="308" y="275" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">라우팅 규칙</text>
