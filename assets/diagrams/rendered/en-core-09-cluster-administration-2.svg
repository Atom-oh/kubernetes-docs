<title id="en-core-09-cluster-administration-2-title">Kubernetes Control Plane Interactions</title>
<desc id="en-core-09-cluster-administration-2-desc">Architecture diagram showing the kube-apiserver exchanging bidirectional calls with etcd, the scheduler, the controller managers, and a worker node's kubelet, which in turn drives kube-proxy and the container runtime.</desc>

