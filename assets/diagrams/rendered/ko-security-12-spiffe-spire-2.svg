<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spire-attest-title spire-attest-desc">
    <title id="spire-attest-title">노드 어테스테이션과 워크로드 어테스테이션 절차</title>
    <desc id="spire-attest-desc">SPIRE Agent가 k8s_psat 토큰 또는 aws_iid 문서로 노드 어테스테이션을 거쳐 Node SVID를 발급받은 뒤, 이를 이용해 워크로드의 Pod 메타데이터와 UID/GID를 확인하고 등록 엔트리와 매칭해 Workload SVID를 발급하는 두 단계 절차를 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="32" y="48" width="420" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="152" y="52" width="180" height="12" rx="2" fill="#ffffff"/>
    <text x="242" y="61" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">노드 어테스테이션</text>

    <rect x="508" y="48" width="420" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="628" y="52" width="180" height="12" rx="2" fill="#ffffff"/>
    <text x="718" y="61" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">워크로드 어테스테이션</text>

    <!-- NA1 -> NA2 / NA3 (fork) -->
    <path d="M 172,132 V 148 Q 172,156 164,156 H 100"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 292,132 V 148 Q 292,156 300,156 H 356"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- NA2/NA3 -> merge dot (no arrowhead; the dot is the visual joint) -->
    <path d="M 100,196 V 212 Q 100,220 108,220 H 232"
          fill="none" stroke="#545B64" stroke-width="1"/>
    <path d="M 356,196 V 212 Q 356,220 348,220 H 232"
          fill="none" stroke="#545B64" stroke-width="1"/>
    <!-- merge dot -> NA4 -->
    <path d="M 232,220 V 224" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <circle cx="232" cy="220" r="4" fill="#232F3E"/>

    <!-- NA4 -> NA5 -->
    <path d="M 232,260 V 276" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- NA5 -> NA6 -->
    <path d="M 232,312 V 328" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- NA6 -> WA1 (cross-zone, focal path) -->
    <path d="M 356,340 H 460 Q 468,340 468,332 V 128 Q 468,120 476,120 H 628"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="404" y="100" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="452" y="109" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NODE SVID 사용</text>

    <!-- WA1 -> WA2 -->
    <path d="M 718,132 V 160" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- WA2 -> WA3 / WA4 (fork) -->
    <path d="M 668,196 V 204 Q 668,212 660,212 H 604 Q 596,212 596,220 V 224"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 768,196 V 204 Q 768,212 776,212 H 832 Q 840,212 840,220 V 224"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- WA3/WA4 -> merge dot -->
    <path d="M 596,260 V 264 Q 596,272 604,272 H 710 Q 718,272 718,280 V 284"
          fill="none" stroke="#545B64" stroke-width="1"/>
    <path d="M 840,260 V 264 Q 840,272 832,272 H 726 Q 718,272 718,280 V 284"
          fill="none" stroke="#545B64" stroke-width="1"/>
    <!-- merge dot -> WA5 -->
    <path d="M 718,284 V 288" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <circle cx="718" cy="284" r="4" fill="#232F3E"/>

    <!-- WA5 -> WA6 -->
    <path d="M 718,324 V 352" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Node: NA1 -->
    <rect x="172" y="96" width="120" height="36" rx="6" fill="#ffffff"/>
    <rect x="172" y="96" width="120" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="232" y="118" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Agent 시작</text>

    <!-- Node: NA2 -->
    <rect x="52" y="156" width="140" height="40" rx="6" fill="#ffffff"/>
    <rect x="52" y="156" width="140" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="122" y="174" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">k8s_psat</text>
    <text x="122" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SA Token 획득</text>

    <!-- Node: NA3 -->
    <rect x="300" y="156" width="140" height="40" rx="6" fill="#ffffff"/>
    <rect x="300" y="156" width="140" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="370" y="174" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">aws_iid</text>
    <text x="370" y="188" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">IID 문서 획득</text>

    <!-- Node: NA4 -->
    <rect x="172" y="224" width="120" height="36" rx="6" fill="#ffffff"/>
    <rect x="172" y="224" width="120" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="232" y="243" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Server 요청</text>

    <!-- Node: NA5 -->
    <rect x="172" y="276" width="120" height="36" rx="6" fill="#ffffff"/>
    <rect x="172" y="276" width="120" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="232" y="295" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">토큰/문서</text>
    <text x="232" y="309" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Server 검증</text>

    <!-- Node: NA6 (focal, phase result) -->
    <rect x="172" y="328" width="184" height="52" rx="6" fill="#ffffff"/>
    <rect x="172" y="328" width="184" height="52" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="264" y="349" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Node SVID</text>
    <text x="264" y="365" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">발급</text>

    <!-- Node: WA1 -->
    <rect x="628" y="96" width="180" height="36" rx="6" fill="#ffffff"/>
    <rect x="628" y="96" width="180" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="718" y="118" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Workload API 호출</text>

    <!-- Node: WA2 -->
    <rect x="648" y="160" width="140" height="36" rx="6" fill="#ffffff"/>
    <rect x="648" y="160" width="140" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="718" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">프로세스 정보 수집</text>

    <!-- Node: WA3 -->
    <rect x="536" y="224" width="120" height="36" rx="6" fill="#ffffff"/>
    <rect x="536" y="224" width="120" height="36" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="596" y="246" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Pod 메타데이터</text>

    <!-- Node: WA4 -->
    <rect x="780" y="224" width="120" height="36" rx="6" fill="#ffffff"/>
    <rect x="780" y="224" width="120" height="36" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="840" y="246" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">UID/GID 확인</text>

    <!-- Node: WA5 -->
    <rect x="648" y="288" width="140" height="36" rx="6" fill="#ffffff"/>
    <rect x="648" y="288" width="140" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="718" y="310" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">셀렉터 매칭</text>

    <!-- Node: WA6 (focal, phase result) -->
    <rect x="626" y="352" width="184" height="52" rx="6" fill="#ffffff"/>
    <rect x="626" y="352" width="184" height="52" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="718" y="373" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Workload SVID</text>
    <text x="718" y="389" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">발급</text>
  </svg>
