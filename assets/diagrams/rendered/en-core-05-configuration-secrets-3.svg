    <title id="dtitle">Environment Variable Sources</title>
    <desc id="ddesc">Diagram showing the four sources Kubernetes can populate a Container's environment variables from -- a direct static value, a ConfigMap key or full envFrom reference, a Secret key or full envFrom reference, and the Downward API's field or resource references.</desc>
