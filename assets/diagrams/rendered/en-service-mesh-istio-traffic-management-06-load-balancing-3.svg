<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-title d3-desc">
<title id="d3-title">LEAST_REQUEST routing decision</title>
<desc id="d3-desc">Before routing a new request, the load balancer checks the active request count on every pod and sends the request to the one with the fewest active requests.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: Pod status -->
<rect x="580" y="80" width="320" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="600" y="84" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="640" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">POD STATUS</text>

<!-- Client -> LB -->
<line x1="180" y1="140" x2="180" y2="228" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="188" y="176" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="226" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NEW REQUEST</text>

<!-- Check Pod 1 (dashed) -->
<path d="M 400,248 H 480 Q 488,248 488,240 V 160 Q 488,152 496,152 H 600"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="528" y="132" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="548" y="141" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CHECK</text>

<!-- Check Pod 2 (dashed) -->
<path d="M 400,272 H 584 Q 592,272 592,280 H 600"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="472" y="252" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="492" y="261" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CHECK</text>

<!-- Check Pod 3 (dashed) -->
<path d="M 400,296 H 480 Q 488,296 488,304 V 416 Q 488,424 496,424 H 600"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="528" y="404" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="548" y="413" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CHECK</text>

<!-- Route to least loaded: Pod 2 (accent) -->
<path d="M 400,320 H 468 Q 476,320 476,308 H 600"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="493" y="288" width="90" height="12" rx="2" fill="#ffffff"/>
<text x="538" y="297" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LEAST LOADED</text>

<!-- Client -->
<rect x="96" y="80" width="168" height="60" rx="6" fill="#ffffff"/>
<rect x="96" y="80" width="168" height="60" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="180" y="106" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Client</text>
<text x="180" y="122" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">new request</text>

<!-- Load balancer -->
<rect x="96" y="228" width="304" height="112" rx="6" fill="#ffffff"/>
<rect x="96" y="228" width="304" height="112" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="248" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Load Balancer</text>
<text x="248" y="288" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LEAST_REQUEST</text>

<!-- Pods -->
<rect x="600" y="112" width="280" height="64" rx="6" fill="#ffffff"/>
<rect x="600" y="112" width="280" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="740" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod 1</text>
<text x="740" y="156" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">active requests: 5</text>

<rect x="600" y="252" width="280" height="64" rx="6" fill="#ffffff"/>
<rect x="600" y="252" width="280" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="740" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod 2</text>
<text x="740" y="296" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">active requests: 2 — fewest</text>

<rect x="600" y="392" width="280" height="64" rx="6" fill="#ffffff"/>
<rect x="600" y="392" width="280" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="740" y="420" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod 3</text>
<text x="740" y="436" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">active requests: 8</text>

<text x="480" y="556" fill="#545B64" font-size="14" font-style="italic" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">It checks every pod's active load first, then routes to the least busy one.</text>
</svg>