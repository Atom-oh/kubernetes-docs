<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vs-dr-compare-title vs-dr-compare-desc">
    <title id="vs-dr-compare-title">VirtualService·DestinationRule 역할 비교</title>
    <desc id="vs-dr-compare-desc">HTTP 요청이 조건 매칭과 라우팅 결정을 거쳐 DestinationRule의 Subset 선택과 정책 적용을 통해 v1·v2 파드로 로드 밸런싱되는 과정을 보여줍니다.</desc>
