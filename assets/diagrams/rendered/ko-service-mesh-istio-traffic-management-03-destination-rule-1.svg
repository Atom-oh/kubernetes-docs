    <rect x="680" y="168" width="220" height="232" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="756" y="172" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="800" y="181" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">파드</text>

