    <rect x="708" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="722" y="217" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
    <text x="790" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">reviews-v1 파드 ×2</text>
    <text x="790" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pod1, pod2</text>

