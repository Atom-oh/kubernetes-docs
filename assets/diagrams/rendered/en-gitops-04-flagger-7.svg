<text x="480" y="137" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Flux Controllers</text>
<text x="480" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">management cluster</text>

