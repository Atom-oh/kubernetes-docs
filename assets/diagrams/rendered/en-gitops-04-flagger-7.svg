<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="multiregion-fanout-title multiregion-fanout-desc">
<title id="multiregion-fanout-title">Multi-Region Canary Fan-Out</title>
<desc id="multiregion-fanout-desc">A single management cluster's Flux controllers read one Git repository and apply the same Kustomization to three production clusters in different regions, each running its own Flagger, Istio, and web-app canary.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ===== Zones (spokes) ===== -->
<rect x="40" y="200" width="270" height="224" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="48" y="204" width="220" height="12" rx="2" fill="#ffffff"/>
<text x="158" y="213" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">PRODUCTION · US-EAST-1</text>

<rect x="345" y="200" width="270" height="224" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="353" y="204" width="220" height="12" rx="2" fill="#ffffff"/>
<text x="463" y="213" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">PRODUCTION · US-WEST-2</text>

<rect x="650" y="200" width="270" height="224" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="658" y="204" width="220" height="12" rx="2" fill="#ffffff"/>
<text x="768" y="213" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">PRODUCTION · EU-WEST-1</text>

<!-- ===== Arrows (before nodes) ===== -->
<path d="M480,84 V116" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<path d="M440,164 V176 Q440,184 432,184 H183 Q175,184 175,192 V200" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M480,164 V200" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M520,164 V176 Q520,184 528,184 H777 Q785,184 785,192 V200" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="500" y="176" width="112" height="12" rx="2" fill="#ffffff"/>
<text x="556" y="185" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">KUSTOMIZATION</text>

<!-- ===== Hub nodes ===== -->
<rect x="400" y="36" width="160" height="48" rx="6" fill="#ffffff"/>
<rect x="400" y="36" width="160" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="480" y="57" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Git Repository</text>
<text x="480" y="72" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">single source of truth</text>

<rect x="390" y="116" width="180" height="48" rx="6" fill="rgba(255,153,0,0.10)"/>
