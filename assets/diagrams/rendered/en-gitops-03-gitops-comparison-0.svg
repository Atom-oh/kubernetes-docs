<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="argocd-ttl argocd-desc">
<title id="argocd-ttl">ArgoCD's internal component architecture</title>
<desc id="argocd-desc">Architecture diagram showing ArgoCD's API Server acting as the central hub between the web UI, Dex SSO, the Redis cache, and the Application Controller, which reconciles manifests pulled by the Repo Server from a Git repository into the target Kubernetes cluster.</desc>

<rect width="960" height="600" fill="var(--paper)"/>

<defs><style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
:root{
  --paper:#ffffff; --paper-2:#F2F3F3; --ink:#232F3E; --muted:#545B64; --soft:#7D8998;
  --rule:rgba(35,47,62,0.12); --rule-solid:#D5DBDB;
  --accent:#EC7211; --accent-tint:rgba(255,153,0,0.10); --link:#0972D3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161E2D; --paper-2:#232F3E; --ink:#ffffff; --muted:#B6BEC9; --soft:#8D99A8;
    --rule:rgba(255,255,255,0.12); --rule-solid:rgba(255,255,255,0.25);
    --accent:#FF9900; --accent-tint:rgba(255,153,0,0.14); --link:#539FE5;
  }
}
:root[data-theme="dark"]{
  --paper:#161E2D; --paper-2:#232F3E; --ink:#ffffff; --muted:#B6BEC9; --soft:#8D99A8;
  --rule:rgba(255,255,255,0.12); --rule-solid:rgba(255,255,255,0.25);
  --accent:#FF9900; --accent-tint:rgba(255,153,0,0.14); --link:#539FE5;
}
text{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
.mono{ font-family:'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; }
</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/>
  </marker>
</defs>

<!-- Header -->
<text x="24" y="24" class="mono" font-size="8" letter-spacing="0.18em" fill="var(--soft)">GITOPS &#183; ARGOCD</text>
<text x="24" y="46" font-size="20" font-weight="700" fill="var(--ink)">ArgoCD component architecture</text>

<!-- ================= ZONE (bg -> zone -> arrows -> nodes) ================= -->
<rect x="188" y="100" width="524" height="220" rx="8" fill="var(--ink)" fill-opacity="0.02" stroke="var(--rule)" stroke-width="0.8"/>
<rect x="410" y="104" width="80" height="12" rx="2" fill="var(--paper)"/>
<text x="450" y="113" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="var(--soft)">ARGOCD</text>

<!-- ================= ARROWS (behind nodes) ================= -->

<!-- Git Repository -> Repo Server -->
<line x1="140" y1="268" x2="208" y2="268" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="150" y="252" width="30" height="12" rx="2" fill="var(--paper)"/>
<text x="165" y="261" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--soft)">PULL</text>

<!-- Repo Server -> Application Controller -->
<line x1="348" y1="268" x2="380" y2="268" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- API Server -> Application Controller (same x, straight) -->
<line x1="420" y1="204" x2="420" y2="236" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- API Server -> Redis Cache -->
<path d="M480,204 V212 Q480,220 488,220 H592 Q600,220 600,228 V236"
      fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="524" y="204" width="40" height="12" rx="2" fill="var(--paper)"/>
<text x="544" y="213" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--soft)">CACHE</text>

<!-- Web UI -> API Server -->
<line x1="348" y1="172" x2="380" y2="172" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Dex (SSO) -> API Server -->
<line x1="552" y1="172" x2="520" y2="172" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Application Controller -> Kubernetes Cluster (same x, straight, ACCENT: primary deploy action) -->
<line x1="450" y1="300" x2="450" y2="360" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="454" y="322" width="42" height="12" rx="2" fill="var(--paper)"/>
<text x="475" y="331" class="mono" font-size="8" letter-spacing="0.06em" text-anchor="middle" fill="var(--accent)">APPLY</text>

<!-- ================= NODES ================= -->

<!-- Git Repository (external) -->
<rect x="20" y="236" width="120" height="64" rx="6" fill="var(--paper)"/>
<rect x="20" y="236" width="120" height="64" rx="6" fill="var(--ink)" fill-opacity="0.03" stroke="var(--ink)" stroke-opacity="0.30" stroke-width="1"/>
<text x="80" y="264" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Git Repository</text>
<text x="80" y="280" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">source of truth</text>

<!-- Web UI (input) -->
<rect x="208" y="140" width="140" height="64" rx="6" fill="var(--paper)"/>
<rect x="208" y="140" width="140" height="64" rx="6" fill="var(--muted)" fill-opacity="0.10" stroke="var(--soft)" stroke-width="1"/>
<text x="278" y="168" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Web UI</text>
<text x="278" y="184" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">dashboard</text>

<!-- API Server (FOCAL) -->
<rect x="380" y="140" width="140" height="64" rx="6" fill="var(--paper)"/>
<rect x="380" y="140" width="140" height="64" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
<text x="450" y="168" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">API Server</text>
<text x="450" y="184" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">gRPC &#183; REST</text>

<!-- Dex (SSO) -->
<rect x="552" y="140" width="140" height="64" rx="6" fill="var(--paper)"/>
<rect x="552" y="140" width="140" height="64" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
<text x="622" y="168" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Dex</text>
<text x="622" y="184" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">SSO identity</text>

<!-- Repo Server -->
<rect x="208" y="236" width="140" height="64" rx="6" fill="var(--paper)"/>
<rect x="208" y="236" width="140" height="64" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
<text x="278" y="264" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Repo Server</text>
<text x="278" y="280" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">render manifests</text>

<!-- Application Controller -->
<rect x="380" y="236" width="140" height="64" rx="6" fill="var(--paper)"/>
<rect x="380" y="236" width="140" height="64" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
<text x="450" y="264" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">App Controller</text>
<text x="450" y="280" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">reconcile loop</text>

<!-- Redis Cache (store) -->
<rect x="552" y="236" width="140" height="64" rx="6" fill="var(--paper)"/>
<rect x="552" y="236" width="140" height="64" rx="6" fill="var(--ink)" fill-opacity="0.05" stroke="var(--muted)" stroke-width="1"/>
<text x="622" y="264" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Redis Cache</text>
<text x="622" y="280" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">state &#183; cache</text>

<!-- Kubernetes Cluster (external) -->
<rect x="380" y="360" width="140" height="64" rx="6" fill="var(--paper)"/>
<rect x="380" y="360" width="140" height="64" rx="6" fill="var(--ink)" fill-opacity="0.03" stroke="var(--ink)" stroke-opacity="0.30" stroke-width="1"/>
<text x="450" y="388" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Kubernetes Cluster</text>
<text x="450" y="404" class="mono" font-size="9" text-anchor="middle" fill="var(--muted)">deploy target</text>

<!-- Legend -->
<line x1="24" y1="480" x2="936" y2="480" stroke="var(--rule)" stroke-width="0.8"/>
<circle cx="30" cy="496" r="4" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
<text x="40" y="500" class="mono" font-size="8" fill="var(--muted)">RECONCILIATION HUB</text>
<circle cx="220" cy="496" r="4" fill="var(--ink)" fill-opacity="0.03" stroke="var(--ink)" stroke-opacity="0.30" stroke-width="1"/>
<text x="230" y="500" class="mono" font-size="8" fill="var(--muted)">EXTERNAL SYSTEM</text>
<circle cx="400" cy="496" r="4" fill="var(--ink)" fill-opacity="0.05" stroke="var(--muted)" stroke-width="1"/>
<text x="410" y="500" class="mono" font-size="8" fill="var(--muted)">DATA STORE</text>
<circle cx="540" cy="496" r="4" fill="var(--muted)" fill-opacity="0.10" stroke="var(--soft)" stroke-width="1"/>
<text x="550" y="500" class="mono" font-size="8" fill="var(--muted)">USER-FACING</text>

</svg>