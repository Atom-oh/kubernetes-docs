<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="pillars-title pillars-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="pillars-title">관측성을 구성하는 세 데이터 축</title>
    <desc id="pillars-desc">로그, 메트릭, 트레이스가 각각 독립된 데이터 축이면서 TraceID와 Exemplar, 레이블 매칭을 통해 서로 연결되어 있음을 보여준다.</desc>
    <defs><style>@import url(https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
      <marker id="p-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#7D8998"/>
      </marker>
      <marker id="p-arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="8 0, 0 3, 8 6" fill="#7D8998"/>
      </marker>
      <marker id="p-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="p-arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="8 0, 0 3, 8 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Outer zone -->
    <rect x="40" y="72" width="880" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="76" width="220" height="12" rx="2" fill="#ffffff"/>
    <text x="166" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">관측성의 3가지 축</text>

    <!-- Arrows: Logs <-> Metrics (top, horizontal) -->
    <line x1="320" y1="180" x2="640" y2="180" stroke="#7D8998" stroke-width="1.2" marker-start="url(#p-arrow-rev)" marker-end="url(#p-arrow)"/>
    <rect x="446" y="156" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="165" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">레이블 매칭</text>

    <!-- Logs <-> Traces -->
    <path d="M 220,236 V 320 Q 220,328 228,328 H 400"
          fill="none" stroke="#EC7211" stroke-width="1.2"
          marker-start="url(#p-arrow-accent-rev)" marker-end="url(#p-arrow-accent)"/>
    <rect x="180" y="270" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="215" y="279" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRACEID</text>

    <!-- Metrics <-> Traces -->
    <path d="M 740,236 V 320 Q 740,328 732,328 H 560"
          fill="none" stroke="#7D8998" stroke-width="1.2"
          marker-start="url(#p-arrow-rev)" marker-end="url(#p-arrow)"/>
    <rect x="710" y="270" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="745" y="279" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXEMPLAR</text>

    <!-- Logs node -->
    <rect x="160" y="140" width="120" height="96" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="160" y="140" width="120" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="220" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Logs (로그)</text>
    <text x="220" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">이벤트 기록</text>
    <text x="220" y="200" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">구조화 데이터</text>
    <text x="220" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">컨텍스트 정보</text>

    <!-- Metrics node -->
    <rect x="680" y="140" width="120" height="96" rx="6" fill="#ffffff"/>
    <rect x="680" y="140" width="120" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="740" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metrics (메트릭)</text>
    <text x="740" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">수치 측정값</text>
    <text x="740" y="200" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">시계열 데이터</text>
    <text x="740" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">집계 가능</text>

    <!-- Traces node -->
    <rect x="420" y="328" width="120" height="96" rx="6" fill="#ffffff"/>
    <rect x="420" y="328" width="120" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="352" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Traces (추적)</text>
    <text x="480" y="372" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">요청 경로</text>
    <text x="480" y="388" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">서비스 간 흐름</text>
    <text x="480" y="404" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">지연 시간 분석</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="140" y="528" width="14" height="14" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="164" y="539" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">TraceID 상관분석 경로</text>
    <rect x="360" y="528" width="14" height="14" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="384" y="539" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">일반 데이터 축</text>
  </svg>