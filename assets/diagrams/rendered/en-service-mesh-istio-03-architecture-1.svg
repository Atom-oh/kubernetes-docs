<title id="en-service-mesh-istio-03-architecture-1-title">Certificate Management (Citadel Functionality)</title>
<desc id="en-service-mesh-istio-03-architecture-1-desc">Sequence diagram showing Envoy requesting a certificate from Istiod, Istiod verifying the workload identity with SPIFFE, signing and issuing an X.509 certificate for mTLS, and later renewing it before expiry.</desc>
