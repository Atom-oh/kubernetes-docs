<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="mlflow-eks-deploy-title mlflow-eks-deploy-desc">
    <title id="mlflow-eks-deploy-title">MLflow tracking server deployment on EKS</title>
    <desc id="mlflow-eks-deploy-desc">A user reaches a load-balanced MLflow tracking server running as replicated pods inside an EKS cluster, where an IAM-mapped service account grants the pods access to an RDS/Aurora Postgres backend store and an S3 artifact store outside the cluster.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
      </marker>
      <marker id="arrow-security" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#DD344C"/>
      </marker>
    </defs>

    <!-- background -->
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- zones (bg -> zones -> arrows -> nodes) -->
    <rect x="200" y="168" width="600" height="296" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="212" y="172" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="260" y="181" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EKS CLUSTER</text>

    <rect x="808" y="108" width="148" height="324" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="820" y="112" width="124" height="12" rx="2" fill="#ffffff"/>
    <text x="882" y="121" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AWS MANAGED</text>

    <!-- arrows -->
    <!-- User -> ALB (HTTPS) -->
    <line x1="180" y1="250" x2="220" y2="250" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="182" y="230" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="239" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

    <!-- ALB -> Service -->
    <line x1="360" y1="250" x2="400" y2="250" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Service -> Pods -->
    <line x1="540" y1="250" x2="600" y2="250" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Pods -> RDS/Aurora (right+up elbow) -->
    <path d="M780,230 H792 Q800,230 800,222 V184 Q800,176 808,176 H820"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Pods -> S3 (right+down elbow) -->
    <path d="M780,270 H792 Q800,270 800,278 V368 Q800,376 808,376 H820"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ServiceAccount -> Pods (dashed, security) -->
    <line x1="690" y1="380" x2="690" y2="300" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow-security)"/>
    <rect x="698" y="334" width="84" height="12" rx="2" fill="#ffffff"/>
    <text x="740" y="343" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GRANTS ACCESS</text>

    <!-- nodes -->
    <!-- User (input) -->
    <rect x="40" y="218" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="218" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="110" y="246" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Training Script /</text>
    <text x="110" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">MLflow UI User</text>

    <!-- ALB -->
    <rect x="220" y="218" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="220" y="218" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="290" y="254" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ALB / Ingress</text>

    <!-- Kubernetes Service -->
    <rect x="400" y="218" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="218" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="470" y="254" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes Service</text>

    <!-- Tracking Server Pods (focal) -->
    <rect x="600" y="200" width="180" height="100" rx="6" fill="#ffffff"/>
    <rect x="600" y="200" width="180" height="100" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="608" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.40)" stroke-width="0.8"/>
    <text x="622" y="217" fill="rgba(236,114,17,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">&#215;2</text>
    <text x="690" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tracking Server</text>
    <text x="690" y="264" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pods</text>
    <text x="690" y="282" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replicated behind Service</text>

    <!-- ServiceAccount (security) -->
    <rect x="600" y="380" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="380" width="180" height="64" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="690" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ServiceAccount</text>
    <text x="690" y="424" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">IRSA / Pod Identity</text>

    <!-- RDS / Aurora (store) -->
    <rect x="820" y="140" width="120" height="72" rx="6" fill="#ffffff"/>
    <rect x="820" y="140" width="120" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="880" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">RDS / Aurora</text>
    <text x="880" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PostgreSQL</text>
    <text x="880" y="198" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">backend store</text>

    <!-- S3 (store) -->
    <rect x="820" y="340" width="120" height="72" rx="6" fill="#ffffff"/>
    <rect x="820" y="340" width="120" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="880" y="374" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">S3 bucket</text>
    <text x="880" y="390" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">artifact store</text>

    <!-- legend -->
    <line x1="30" y1="500" x2="930" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="30" y="536" width="10" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="48" y="545" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">compute (focal)</text>

    <rect x="230" y="536" width="10" height="10" rx="2" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="248" y="545" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">IAM / security</text>

    <rect x="430" y="536" width="10" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="448" y="545" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">data store</text>

    <line x1="630" y1="541" x2="644" y2="541" stroke="#0972D3" stroke-width="1.2"/>
    <text x="652" y="545" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">HTTPS / API call</text>
  </svg>