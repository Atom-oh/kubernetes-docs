<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="od-external-title od-external-desc">
<title id="od-external-title">ServiceEntry로 등록한 외부 API에 대한 Outlier Detection</title>
<desc id="od-external-desc">클러스터 안의 애플리케이션 파드가 Envoy Proxy를 통해 여러 외부 API 인스턴스로 트래픽을 보내는데, 에러가 발생한 인스턴스는 Outlier Detection에 의해 트래픽에서 제외되고 정상 인스턴스만 계속 트래픽을 받는 구조를 보여준다.</desc>
<defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<!-- Zones -->
<rect x="40" y="180" width="280" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="56" y="184" width="152" height="16" rx="2" fill="#FFFFFF"/>
<text x="132" y="196" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">KUBERNETES CLUSTER</text>

<rect x="560" y="80" width="340" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="576" y="84" width="152" height="16" rx="2" fill="#FFFFFF"/>
<text x="652" y="96" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">EXTERNAL SERVICES</text>

<!-- Arrows -->
<!-- App -> Envoy : straight vertical -->
<path d="M180,284 V320" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Envoy -> API1 (exit y=336, mid=420, turn up into API1 left edge y=156) -->
<path d="M280,336 H412 Q420,336 420,328 V164 Q420,156 428,156 H600"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="368" y="149" width="72" height="14" rx="2" fill="#FFFFFF"/>
<text x="404" y="159" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">TRAFFIC</text>

<!-- Envoy -> API2 (exit y=352, mid=450, dashed, turn up into API2 left edge y=296), "EJECTED" -->
<path d="M280,352 H442 Q450,352 450,344 V304 Q450,296 458,296 H600"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="392" y="289" width="76" height="14" rx="2" fill="#FFFFFF"/>
<text x="430" y="299" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">EJECTED</text>

<!-- Envoy -> API3 (exit y=368, mid=480, turn down into API3 left edge y=436), "TRAFFIC" -->
<path d="M280,368 H472 Q480,368 480,376 V428 Q480,436 488,436 H600"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="424" y="429" width="72" height="14" rx="2" fill="#FFFFFF"/>
<text x="460" y="439" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">TRAFFIC</text>

<!-- Nodes -->
<!-- App -->
<rect x="80" y="220" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="180" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application Pod</text>
<text x="180" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app namespace</text>

<!-- Envoy (focal) -->
<rect x="80" y="320" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="180" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>
<text x="180" y="364" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">outlier-detection</text>

<!-- API1 healthy -->
<rect x="600" y="120" width="260" height="72" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="730" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">External API · Instance 1</text>
<text x="730" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">healthy</text>

<!-- API2 unhealthy (ejected) -->
<rect x="600" y="260" width="260" height="72" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="730" y="290" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">External API · Instance 2</text>
<text x="730" y="306" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">error</text>

<!-- API3 healthy -->
<rect x="600" y="400" width="260" height="72" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="730" y="430" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">External API · Instance 3</text>
<text x="730" y="446" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">healthy</text>

<!-- Legend -->
<line x1="30" y1="548" x2="930" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="30" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<circle cx="180" cy="560" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="192" y="564" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Outlier Detection 실행 지점</text>
<circle cx="440" cy="560" r="4" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
<text x="452" y="564" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">정상 인스턴스 (트래픽 수신)</text>
<circle cx="700" cy="560" r="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="2,2"/>
<text x="712" y="564" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">제외된 인스턴스</text>
</svg>