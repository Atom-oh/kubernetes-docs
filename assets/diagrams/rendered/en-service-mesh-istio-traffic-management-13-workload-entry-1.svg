    <text x="452" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Manual Registration</text>

    <rect x="712" y="280" width="176" height="56" rx="6" fill="#ffffff"/>
    <rect x="712" y="280" width="176" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="720" y="286" width="28" height="12" rx="2" fill="transparent" stroke="#EC7211" stroke-width="0.8" opacity="0.6"/>
    <text x="734" y="295" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WE</text>
    <text x="800" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">WorkloadEntry</text>
    <text x="800" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VM + Envoy</text>

