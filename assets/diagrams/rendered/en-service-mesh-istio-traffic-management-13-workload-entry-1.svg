    <rect x="72" y="280" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="72" y="280" width="144" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="80" y="286" width="28" height="12" rx="2" fill="transparent" stroke="#7D8998" stroke-width="0.8" opacity="0.6"/>
    <text x="94" y="295" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="144" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Client</text>

    <rect x="356" y="280" width="192" height="56" rx="6" fill="#ffffff"/>
