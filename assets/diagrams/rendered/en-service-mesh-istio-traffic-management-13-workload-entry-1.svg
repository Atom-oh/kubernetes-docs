<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="podflow-vs-weflow-title podflow-vs-weflow-desc">
    <title id="podflow-vs-weflow-title">Pod flow vs WorkloadEntry flow</title>
    <desc id="podflow-vs-weflow-desc">Flowchart comparing how a client request reaches a Kubernetes Pod through automatic Service discovery against how it reaches a VM through a manually registered ServiceEntry and WorkloadEntry.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <rect x="40" y="64" width="880" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="68" width="122" height="12" rx="2" fill="#ffffff"/>
    <text x="117" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">KUBERNETES POD FLOW</text>
    <rect x="40" y="232" width="880" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="236" width="117" height="12" rx="2" fill="#ffffff"/>
    <text x="114" y="245" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">WORKLOADENTRY FLOW</text>

    <line x1="216" y1="140" x2="356" y2="140" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="548" y1="140" x2="712" y2="140" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="216" y1="308" x2="356" y2="308" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="548" y1="308" x2="712" y2="308" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="252" y="120" width="68" height="12" rx="2" fill="#ffffff"/>
