    <rect x="596" y="120" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="630" y="129" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2. ROUTING</text>
    <rect x="252" y="288" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="286" y="297" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1. REQUEST</text>
    <rect x="596" y="288" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="630" y="297" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2. ROUTING</text>

