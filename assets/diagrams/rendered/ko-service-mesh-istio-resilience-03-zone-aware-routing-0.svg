<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zar0-title zar0-desc">
    <title id="zar0-title">Zone Aware Routing 트래픽 분산</title>
    <desc id="zar0-desc">클라이언트 파드가 같은 가용 영역의 서비스 파드로 트래픽의 80%를 무료로 우선 전송하고, 나머지 10%씩만 장애조치 목적으로 비용이 드는 크로스 AZ 경로를 통해 다른 두 영역으로 보내는 모습을 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <style>
        text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;}
        .mono{font-family:'Geist Mono',monospace;}
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- zones -->
    <rect x="32" y="140" width="360" height="244" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="44" y="144" width="184" height="12" rx="2" fill="#ffffff"/>
    <text x="136" y="153" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.1em">AVAILABILITY ZONE A</text>

    <rect x="416" y="140" width="280" height="280" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="428" y="144" width="184" height="12" rx="2" fill="#ffffff"/>
    <text x="520" y="153" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.1em">AVAILABILITY ZONE B</text>

    <rect x="720" y="140" width="208" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="732" y="144" width="184" height="12" rx="2" fill="#ffffff"/>
    <text x="824" y="153" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.1em">AVAILABILITY ZONE C</text>

    <!-- arrows (drawn before nodes) -->
    <!-- solid: client -> service1 -->
    <path d="M164,228 V258 Q164,266 156,266 H130 Q122,266 122,274 V304" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="102" y="228" width="66" height="12" rx="2" fill="#ffffff"/>
    <text x="135" y="237" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">80% 무료</text>

    <!-- solid: client -> service2 -->
    <path d="M196,228 V258 Q196,266 204,266 H294 Q302,266 302,274 V304" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="216" y="284" width="66" height="12" rx="2" fill="#ffffff"/>
    <text x="249" y="293" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">80% 무료</text>

    <!-- dashed: client -> service3 (zone B) -->
    <path d="M228,228 V236 Q228,244 236,244 H548 Q556,244 556,252 V260" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="356" y="224" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="404" y="233" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">10% 장애조치</text>

    <!-- dashed: client -> service5 (zone C) -->
    <path d="M260,228 V244 Q260,252 268,252 H548 a8,8 0 0,1 16,0 H816 Q824,252 824,260" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="632" y="232" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="680" y="241" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">10% 장애조치</text>

    <!-- Client1 (focal) -->
    <rect x="132" y="172" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="132" y="172" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="212" y="196" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">클라이언트 Pod</text>
    <text x="212" y="212" fill="#545B64" font-size="9" class="mono" text-anchor="middle">Zone A</text>

    <!-- Service1 -->
    <rect x="52" y="304" width="140" height="56" rx="6" fill="#ffffff"/>
    <rect x="52" y="304" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="122" y="328" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service Pod 1</text>
    <text x="122" y="344" fill="#545B64" font-size="9" class="mono" text-anchor="middle">Zone A</text>

    <!-- Service2 -->
    <rect x="232" y="304" width="140" height="56" rx="6" fill="#ffffff"/>
    <rect x="232" y="304" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="302" y="328" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service Pod 2</text>
    <text x="302" y="344" fill="#545B64" font-size="9" class="mono" text-anchor="middle">Zone A</text>

    <!-- Service3 -->
    <rect x="476" y="260" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)"/>
    <rect x="476" y="260" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="556" y="284" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service Pod 3</text>
    <text x="556" y="300" fill="#545B64" font-size="9" class="mono" text-anchor="middle">Zone B</text>

    <!-- Service4 (unconnected) -->
    <rect x="476" y="344" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)"/>
    <rect x="476" y="344" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="556" y="368" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service Pod 4</text>
    <text x="556" y="384" fill="#545B64" font-size="9" class="mono" text-anchor="middle">Zone B</text>

    <!-- Service5 -->
    <rect x="744" y="260" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)"/>
    <rect x="744" y="260" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="824" y="284" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service Pod 5</text>
    <text x="824" y="300" fill="#545B64" font-size="9" class="mono" text-anchor="middle">Zone C</text>

    <!-- legend -->
    <line x1="32" y1="552" x2="928" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="572" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="568" x2="172" y2="568" stroke="#EC7211" stroke-width="1.2"/>
    <text x="180" y="572" fill="#545B64" font-size="9" class="mono">같은 AZ 우선 (~80%, 무료)</text>
    <line x1="480" y1="568" x2="512" y2="568" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="520" y="572" fill="#545B64" font-size="9" class="mono">크로스 AZ 장애조치 (~10%, 비용 발생)</text>
  </svg>