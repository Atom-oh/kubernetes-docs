<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="lb-consistenthash-title lb-consistenthash-desc">
    <title id="lb-consistenthash-title">동일한 쿠키 값이 항상 같은 파드로 라우팅되는 Consistent Hash 동작 원리</title>
    <desc id="lb-consistenthash-desc">User A의 쿠키가 두 번 요청을 보내도 동일한 해시 값을 거쳐 항상 같은 Pod 1로 라우팅되어 세션이 유지되는 반면, User B는 다른 해시로 Pod 2로 라우팅되는 것을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- zones -->
    <rect x="60" y="56" width="840" height="132" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="72" y="60" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="88" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">요청</text>

    <rect x="60" y="216" width="840" height="132" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="72" y="220" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="110" y="229" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">해시 계산</text>

    <rect x="60" y="376" width="840" height="132" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="72" y="380" width="216" height="12" rx="2" fill="#ffffff"/>
    <text x="180" y="389" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONSISTENT HASH RING</text>

    <!-- ===== Arrows ===== -->
    <line x1="190" y1="144" x2="190" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="144" x2="480" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="770" y1="144" x2="770" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="190" y1="304" x2="190" y2="420" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="304" x2="480" y2="420" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- H3 -> P1: same hash as H1, routes to the same pod (bridges the H2->P2 line at x=480) -->
    <path d="M 770,304 V 354 Q 770,362 762,362 H 488 a 8,8 0 0,0 -16,0 H 238 Q 230,362 230,370 V 420"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- ===== Nodes ===== -->
    <!-- Requests -->
    <rect x="115" y="100" width="150" height="44" rx="6" fill="#ffffff"/>
    <rect x="115" y="100" width="150" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="190" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">User A</text>
    <text x="190" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cookie: abc123</text>

    <rect x="405" y="100" width="150" height="44" rx="6" fill="#ffffff"/>
    <rect x="405" y="100" width="150" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">User B</text>
    <text x="480" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cookie: def456</text>

    <rect x="695" y="100" width="150" height="44" rx="6" fill="#ffffff"/>
    <rect x="695" y="100" width="150" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="770" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">User A</text>
    <text x="770" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cookie: abc123</text>

    <!-- Hash -->
    <rect x="115" y="260" width="150" height="44" rx="6" fill="#ffffff"/>
    <rect x="115" y="260" width="150" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="190" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Hash abc123</text>
    <text x="190" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ 0x1A2B</text>

    <rect x="405" y="260" width="150" height="44" rx="6" fill="#ffffff"/>
    <rect x="405" y="260" width="150" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Hash def456</text>
    <text x="480" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ 0x7C8D</text>

    <rect x="695" y="260" width="150" height="44" rx="6" fill="#ffffff"/>
    <rect x="695" y="260" width="150" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="770" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Hash abc123</text>
    <text x="770" y="296" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ 0x1A2B</text>

    <!-- Ring -->
    <rect x="115" y="420" width="150" height="44" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="115" y="420" width="150" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="190" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 1</text>
    <text x="190" y="456" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0x0000-0x4FFF</text>

    <rect x="405" y="420" width="150" height="44" rx="6" fill="#ffffff"/>
    <rect x="405" y="420" width="150" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 2</text>
    <text x="480" y="456" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0x5000-0x9FFF</text>

    <rect x="695" y="420" width="150" height="44" rx="6" fill="#ffffff"/>
    <rect x="695" y="420" width="150" height="44" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
    <text x="770" y="440" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 3</text>
    <text x="770" y="456" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0xA000-0xFFFF</text>
  </svg>