<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 740" role="img" aria-labelledby="escalation-title escalation-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="escalation-title">알림 에스컬레이션 결정 흐름</title>
    <desc id="escalation-desc">1차 담당자가 15분 내 응답하지 않으면 2차 담당자, 다시 없으면 팀 리드로 순차 상향되고, 끝까지 응답이 없으면 전체 팀에 알리는 시간 기반 에스컬레이션 경로를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="740" fill="#ffffff"/>

    <!-- Arrows first -->
    <!-- A -> B -->
    <line x1="120" y1="164" x2="120" y2="212" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- B -> D (No) -->
    <path d="M 176,244 H 250 Q 258,244 258,252 V 332 Q 258,340 266,340 H 340"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="182" y="222" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="227" y="231" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">NO · 15분 경과</text>

    <!-- D -> E (No) -->
    <path d="M 396,372 H 470 Q 478,372 478,380 V 460 Q 478,468 486,468 H 560"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="388" y="354" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="433" y="363" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">NO · 15분 경과</text>

    <!-- E -> F (No, accent — the failure path everyone should notice) -->
    <path d="M 560,532 V 558 Q 560,566 568,566 H 642 Q 650,566 650,574 V 600"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="560" y="548" width="90" height="12" rx="2" fill="#ffffff"/>
    <text x="605" y="557" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">NO · 15분 경과</text>

    <!-- B -> C (Yes, straight) -->
    <line x1="120" y1="276" x2="120" y2="444" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="132" y="350" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="147" y="359" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">YES</text>

    <!-- D -> C (Yes) -->
    <path d="M 284,372 H 228 Q 220,372 220,380 V 448 Q 220,456 212,456 H 156"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="232" y="405" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="247" y="414" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">YES</text>

    <!-- E -> C (Yes) -->
    <path d="M 504,500 H 338 Q 330,500 330,492 V 488 Q 330,480 322,480 H 156"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="400" y="480" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="415" y="489" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">YES</text>

    <!-- A -->
    <rect x="60" y="116" width="120" height="48" rx="20" fill="rgba(35,47,62,0.05)" stroke="#7D8998" stroke-width="1"/>
    <text x="120" y="145" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">알림 발생</text>

    <!-- B: decision diamond -->
    <polygon points="120,212 176,244 120,276 64,244" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="120" y="240" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">1차 담당자</text>
    <text x="120" y="253" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">응답?</text>

    <!-- D: decision diamond -->
    <polygon points="340,340 396,372 340,404 284,372" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="340" y="368" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">2차 담당자</text>
    <text x="340" y="381" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">응답?</text>

    <!-- E: decision diamond -->
    <polygon points="560,468 616,500 560,532 504,500" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="560" y="496" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">팀 리드</text>
    <text x="560" y="509" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">응답?</text>

    <!-- C: merge outcome -->
    <rect x="36" y="444" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="96" y="472" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">조치 진행</text>

    <!-- F: escalation outcome (focal) -->
    <rect x="580" y="600" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="650" y="628" fill="#EC7211" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">전체 팀 알림</text>

    <!-- Legend -->
    <line x1="30" y1="688" x2="930" y2="688" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="704" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="216" y="696" width="140" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="286" y="705" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">최종 미응답 시 결과 (초점)</text>
  </svg>