<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc">
  <title id="d1-title">AWS 로드 밸런서와 EKS 서비스 통합</title>
  <desc id="d1-desc">인터넷 사용자가 CLB, NLB, ALB 세 종류의 AWS 로드 밸런서를 통해 EKS 클러스터에 접근하며, CLB와 NLB는 LoadBalancer 서비스로, ALB는 Ingress를 거쳐 NodePort 서비스로 연결되고 최종적으로 포드에 도달하는 흐름을 보여준다.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="d1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>
  <text x="40" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">ARCHITECTURE</text>
  <text x="40" y="60" fill="#232F3E" font-size="20" font-weight="700">AWS 로드 밸런서 통합</text>

  <!-- Zones -->
  <rect x="200" y="140" width="560" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="428" y="144" width="104" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">AWS LOAD BALANCERS</text>

  <rect x="180" y="316" width="600" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="408" y="320" width="144" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="329" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">EKS · K8S SERVICES</text>

  <!-- Arrows: Users -> 3 LBs -->
  <path d="M 468,112 H 300 V 172" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <line x1="480" y1="112" x2="480" y2="172" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <path d="M 492,112 H 660 V 172" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

  <!-- CLB -> Service1, NLB -> Service1 -->
  <path d="M 300,236 V 292 Q 300,300 292,300 H 288 Q 280,300 280,308 V 348" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <path d="M 480,236 V 292 Q 480,300 472,300 H 328 Q 320,300 320,308 V 348" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

  <!-- ALB -> Ingress -->
  <path d="M 660,236 V 292 Q 660,300 668,300 H 672 Q 680,300 680,308 V 348" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#d1-arrow-accent)"/>

  <!-- Ingress -> Service2 -->
  <path d="M 640,380 H 600 Q 592,380 592,388 V 392 Q 592,400 584,400 H 560" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

  <!-- Service1 -> Pods, Service2 -> Pods -->
  <path d="M 296,412 V 468 Q 296,476 304,476 H 440 Q 448,476 448,484 V 500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
  <path d="M 496,412 V 468 Q 496,476 504,476 H 508 Q 516,476 516,484 V 500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

  <!-- Node: Users (circle, entry) -->
  <circle cx="480" cy="88" r="24" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="480" y="92" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">사용자</text>

  <!-- CLB -->
  <rect x="220" y="172" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="228" y="180" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="242" y="189" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">L4</text>
  <text x="300" y="208" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Classic LB</text>
  <text x="300" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">deprecated</text>

  <!-- NLB -->
  <rect x="400" y="172" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="408" y="180" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="422" y="189" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">L4</text>
  <text x="480" y="208" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Network LB</text>
  <text x="480" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">TCP/UDP · static IP</text>

  <!-- ALB (focal) -->
  <rect x="580" y="172" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <rect x="588" y="180" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
  <text x="602" y="189" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">L7</text>
  <text x="660" y="208" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Application LB</text>
  <text x="660" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">HTTP path routing</text>

  <!-- Service1 -->
  <rect x="200" y="348" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="280" y="376" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">LoadBalancer</text>
  <text x="280" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Service1</text>

  <!-- Service2 -->
  <rect x="400" y="348" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="376" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">NodePort</text>
  <text x="480" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Service2</text>

  <!-- Ingress -->
  <rect x="600" y="348" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="680" y="376" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Ingress</text>
  <text x="680" y="392" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">resource</text>

  <!-- Pods -->
  <rect x="408" y="500" width="144" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="480" y="528" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">포드</text>
  <text x="480" y="544" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">pod-1 · pod-2 · pod-3</text>
</svg>