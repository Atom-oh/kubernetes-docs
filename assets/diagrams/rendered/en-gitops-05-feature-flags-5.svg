<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="centralflagd-title centralflagd-desc">
<title id="centralflagd-title">Centralized flagd deployment</title>
<desc id="centralflagd-desc">Architecture diagram showing three application pods calling a shared flagd Service over gRPC, backed by a multi-replica flagd Deployment in its own namespace that watches a FeatureFlag custom resource.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zones -->
<rect x="60" y="140" width="260" height="212" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="76" y="144" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="176" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FLAGD-SYSTEM NAMESPACE</text>

<rect x="460" y="56" width="280" height="344" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="500" y="60" width="200" height="12" rx="2" fill="#ffffff"/>
<text x="600" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APPLICATION NAMESPACE</text>

<!-- Arrows: FLAGD -> SVC, FLAGD -> CRD -->
<line x1="188" y1="236" x2="188" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 140,236 V 340 Q 140,348 148,348 H 472 Q 480,348 480,356 V 460"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Arrows: APP1/2/3 -> SVC (fan attach on SVC right edge: y=288,304,320) -->
<path d="M 488,120 H 396 Q 388,120 388,128 V 280 Q 388,288 380,288 H 288"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 488,236 H 396 Q 388,236 388,244 V 296 Q 388,304 380,304 H 288"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 488,352 H 396 Q 388,352 388,344 V 328 Q 388,320 380,320 H 288"
      fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- Labels -->
<rect x="330" y="328" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="360" y="337" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WATCH</text>

<!-- Node: flagd Deployment -->
<rect x="88" y="172" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="88" y="172" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="96" y="180" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="110" y="189" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEP</text>
<text x="196" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">flagd Deployment</text>
<text x="196" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2+ replicas</text>

<!-- Node: flagd Service (focal) -->
<rect x="88" y="272" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="88" y="272" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<rect x="96" y="280" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="110" y="289" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SVC</text>
<text x="196" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">flagd Service</text>
<text x="196" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">focal · ClusterIP</text>

<!-- Node: App Pod 1 -->
<rect x="488" y="88" width="220" height="64" rx="6" fill="#ffffff"/>
<rect x="488" y="88" width="220" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="598" y="116" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">App Pod 1</text>
<text x="598" y="132" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gRPC client</text>

<!-- Node: App Pod 2 -->
<rect x="488" y="204" width="220" height="64" rx="6" fill="#ffffff"/>
<rect x="488" y="204" width="220" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="598" y="232" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">App Pod 2</text>
<text x="598" y="248" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gRPC client</text>

<!-- Node: App Pod 3 -->
<rect x="488" y="320" width="220" height="64" rx="6" fill="#ffffff"/>
<rect x="488" y="320" width="220" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="598" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">App Pod 3</text>
<text x="598" y="364" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gRPC client</text>

<!-- Node: FeatureFlag CRD -->
<rect x="380" y="460" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="380" y="460" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<rect x="388" y="468" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
<text x="402" y="477" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRD</text>
<text x="480" y="496" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">FeatureFlag CRD</text>
<text x="480" y="512" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">source of truth</text>

<!-- Legend -->
<line x1="24" y1="552" x2="936" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="24" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="24" y="584" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="44" y="593" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Shared service (focal)</text>
<rect x="250" y="584" width="14" height="10" rx="2" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="270" y="593" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Application pod</text>
<rect x="440" y="584" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="460" y="593" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Cluster resource</text>
</svg>