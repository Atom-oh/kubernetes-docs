    <line x1="160" y1="533" x2="188" y2="533" stroke="#545B64" stroke-width="1.2"/>
    <text x="196" y="536" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">control / data flow</text>
    <line x1="380" y1="533" x2="408" y2="533" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="416" y="536" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">config sync / metrics</text>
