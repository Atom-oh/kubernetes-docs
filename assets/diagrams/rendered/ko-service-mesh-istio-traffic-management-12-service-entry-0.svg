<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="se0-title se0-desc">
  <title id="se0-title">ServiceEntry 적용 전후 비교</title>
  <desc id="se0-desc">ServiceEntry 없이 외부 API를 호출하면 모니터링·정책·Circuit Breaker가 전혀 적용되지 않지만, ServiceEntry로 등록하면 동일한 트래픽에 모니터링과 정책, Circuit Breaker가 모두 적용된다.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="se0-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="se0-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="32" y="24" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">COMPARISON</text>
  <text x="32" y="48" fill="#232F3E" font-size="20" font-weight="700">ServiceEntry 적용 전후</text>

  <!-- ===================== Zone A: without ServiceEntry ===================== -->
  <rect x="24" y="64" width="912" height="180" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="40" y="68" width="152" height="12" rx="2" fill="#ffffff"/>
  <text x="116" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">SERVICEENTRY 없이</text>

  <!-- Zone A connectors (drawn before nodes) -->
  <!-- y = 122,142,162,182 ; x 216 -> 696 -->
  <line x1="216" y1="122" x2="696" y2="122" stroke="#545B64" stroke-width="1.2" marker-end="url(#se0-arrow)"/>
  <rect x="396" y="102" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="456" y="111" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">알 수 없는 트래픽</text>

  <line x1="216" y1="142" x2="696" y2="142" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#se0-arrow)"/>
  <rect x="396" y="150" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="452" y="159" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">모니터링 없음</text>

  <line x1="216" y1="162" x2="696" y2="162" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#se0-arrow)"/>
  <rect x="396" y="170" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="456" y="179" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">정책 적용 불가</text>

  <line x1="216" y1="182" x2="696" y2="182" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#se0-arrow)"/>
  <rect x="396" y="190" width="152" height="12" rx="2" fill="#ffffff"/>
  <text x="472" y="199" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CIRCUIT BREAKER 없음</text>

  <!-- Zone A: source node (App) -->
  <rect x="56" y="104" width="160" height="96" rx="6" fill="#ffffff"/>
  <rect x="56" y="104" width="160" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="136" y="146" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">메시 내부</text>
  <text x="136" y="162" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">서비스</text>

  <!-- Zone A: dest node (external, unmanaged) -->
  <rect x="696" y="104" width="200" height="96" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="696" y="104" width="200" height="96" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="796" y="158" fill="#545B64" font-size="12" font-weight="600" text-anchor="middle">외부 API</text>

  <!-- ===================== Zone B: with ServiceEntry ===================== -->
  <rect x="24" y="276" width="912" height="180" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="40" y="280" width="152" height="12" rx="2" fill="#ffffff"/>
  <text x="116" y="289" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">SERVICEENTRY 사용</text>

  <!-- Zone B connectors -->
  <!-- y = 334,354,374,394 ; x 216 -> 696 -->
  <line x1="216" y1="334" x2="696" y2="334" stroke="#EC7211" stroke-width="1.2" marker-end="url(#se0-arrow-accent)"/>
  <rect x="396" y="314" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="452" y="323" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">등록된 트래픽</text>

  <line x1="216" y1="354" x2="696" y2="354" stroke="#545B64" stroke-width="1.2" marker-end="url(#se0-arrow)"/>
  <rect x="396" y="362" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="452" y="371" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">모니터링 가능</text>

  <line x1="216" y1="374" x2="696" y2="374" stroke="#545B64" stroke-width="1.2" marker-end="url(#se0-arrow)"/>
  <rect x="396" y="382" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="440" y="391" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">정책 적용</text>

  <line x1="216" y1="394" x2="696" y2="394" stroke="#545B64" stroke-width="1.2" marker-end="url(#se0-arrow)"/>
  <rect x="396" y="402" width="136" height="12" rx="2" fill="#ffffff"/>
  <text x="464" y="411" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CIRCUIT BREAKER</text>

  <!-- Zone B: source node (App) -->
  <rect x="56" y="316" width="160" height="96" rx="6" fill="#ffffff"/>
  <rect x="56" y="316" width="160" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="136" y="358" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">메시 내부</text>
  <text x="136" y="374" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">서비스</text>

  <!-- Zone B: dest node (focal — registered via ServiceEntry) -->
  <rect x="696" y="316" width="200" height="96" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="696" y="316" width="200" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="796" y="358" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">외부 API</text>
  <text x="796" y="374" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">ServiceEntry</text>

  <!-- Legend -->
  <line x1="32" y1="472" x2="928" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="490" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <line x1="140" y1="486" x2="164" y2="486" stroke="#545B64" stroke-width="1.2"/>
  <text x="172" y="490" fill="#232F3E" font-size="9" font-family="'Geist Mono', monospace">제어·모니터링 가능</text>

  <line x1="360" y1="486" x2="384" y2="486" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="392" y="490" fill="#232F3E" font-size="9" font-family="'Geist Mono', monospace">제어 불가 (블랙홀)</text>

  <rect x="628" y="480" width="16" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="652" y="490" fill="#232F3E" font-size="9" font-family="'Geist Mono', monospace">ServiceEntry 등록됨</text>

</svg>