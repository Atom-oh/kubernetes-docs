<title id="dtitle">CNI 선택 의사결정 흐름</title>
<desc id="ddesc">AWS EKS 사용 여부와 필요한 Network Policy 수준, 환경 특성에 따라 VPC CNI, Calico, Cilium, Flannel 중 적합한 CNI를 선택하는 의사결정 흐름을 보여준다.</desc>

