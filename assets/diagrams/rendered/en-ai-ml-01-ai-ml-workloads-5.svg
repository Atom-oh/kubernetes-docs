<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="opt-title opt-desc">
    <title id="opt-title">AI/ML workload optimization levers and their outcomes</title>
    <desc id="opt-desc">Diagram showing GPU optimization, training optimization, and storage optimization all feeding into a performance improvement outcome, while cost optimization (spot instances, auto scaling, hybrid nodes) feeds into a cost reduction outcome.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows (behind nodes) -->
    <path d="M 144,152 H 220 Q 228,152 228,160 V 272 Q 228,280 236,280 H 313"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="368" y1="152" x2="368" y2="280" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 592,152 H 516 Q 508,152 508,160 V 272 Q 508,280 500,280 H 423"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="816" y1="152" x2="816" y2="280" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Row 1: optimization levers -->
    <rect x="44" y="88" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="144" y="112" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">GPU Optimization</text>
    <text x="144" y="127" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Mem Overcommit · Sharing</text>
    <text x="144" y="139" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NVIDIA MPS</text>

    <rect x="268" y="88" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="368" y="112" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Training Optimization</text>
    <text x="368" y="127" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Node Affinity · Topology</text>
    <text x="368" y="139" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Placement Groups</text>

    <rect x="492" y="88" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="592" y="112" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Storage Optimization</text>
    <text x="592" y="127" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FSx Lustre · Caching</text>
    <text x="592" y="139" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">S3 Integration</text>

    <rect x="716" y="88" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="816" y="112" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Cost Optimization</text>
    <text x="816" y="127" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Spot · Auto Scaling</text>
    <text x="816" y="139" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Hybrid Nodes</text>

    <!-- Row 2: outcomes (focal) -->
    <rect x="258" y="280" width="220" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="368" y="313" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Performance Improvement</text>

    <rect x="716" y="280" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="816" y="313" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Cost Reduction</text>

    <!-- Legend -->
    <line x1="40" y1="380" x2="920" y2="380" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="396" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="412" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="420" fill="#545B64" font-size="8.5">Outcome</text>

    <rect x="152" y="412" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="172" y="420" fill="#545B64" font-size="8.5">Optimization lever</text>
  </svg>