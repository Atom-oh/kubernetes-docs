<title id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-17-title">하이브리드 아키텍처: 클러스터 내부는 Istio, 클러스터 간은 VPC Lattice</title>
<desc id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-17-desc">EKS 클러스터 내부에서는 Frontend와 Backend가 Envoy 사이드카를 거쳐 Istio mTLS로 통신하고, Backend가 Egress Gateway를 통해 VPC Lattice Service Network로 나가면 다른 VPC의 ECS Payment 서비스와 Lambda Notification 서비스에 도달한다는 하이브리드 구조를 보여준다.</desc>
