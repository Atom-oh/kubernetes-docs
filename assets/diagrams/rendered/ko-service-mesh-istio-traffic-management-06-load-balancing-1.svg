<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="lb-overview-title lb-overview-desc">
    <title id="lb-overview-title">클라이언트 요청이 로드 밸런싱 알고리즘을 거쳐 파드로 라우팅되는 개요</title>
    <desc id="lb-overview-desc">클라이언트 요청이 로드 밸런서의 알고리즘을 거쳐 서로 다른 부하를 가진 세 파드 중 하나로 라우팅되는 전체 흐름을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- zone: 파드 -->
    <rect x="608" y="80" width="328" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="620" y="84" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="644" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">파드</text>

    <!-- ===== Arrows ===== -->
    <!-- Client -> LB -->
    <line x1="188" y1="280" x2="264" y2="280" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- LB fan out: attach points on right edge (x=456,y=260..300) k=1..3 of 40 -->
    <!-- LB -> Pod1 (top elbow) -->
    <path d="M 456,264 H 512 Q 520,264 520,272 V 152 Q 520,144 528,144 H 604"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="536" y="132" width="86" height="12" rx="2" fill="#ffffff"/>
    <text x="579" y="141" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUND ROBIN</text>

    <!-- LB -> Pod2 (straight) -->
    <line x1="456" y1="280" x2="604" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="484" y="260" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="514" y="269" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RANDOM</text>

    <!-- LB -> Pod3 (bottom elbow) -->
    <path d="M 456,296 H 512 Q 520,296 520,304 V 424 Q 520,432 528,432 H 604"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="530" y="412" width="98" height="12" rx="2" fill="#ffffff"/>
    <text x="579" y="421" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEAST REQUEST</text>

    <!-- ===== Nodes ===== -->
    <!-- Client -->
    <rect x="44" y="260" width="144" height="40" rx="6" fill="#ffffff"/>
    <rect x="44" y="260" width="144" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="116" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">클라이언트 요청</text>

    <!-- LB (focal, algorithm) -->
    <rect x="264" y="256" width="192" height="48" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="264" y="256" width="192" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="360" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">로드 밸런싱</text>
    <text x="360" y="291" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">알고리즘</text>

    <!-- Pod1 -->
    <rect x="644" y="120" width="180" height="48" rx="6" fill="#ffffff"/>
    <rect x="644" y="120" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="734" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 1</text>
    <text x="734" y="156" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">부하: 30%</text>

    <!-- Pod2 -->
    <rect x="644" y="256" width="180" height="48" rx="6" fill="#ffffff"/>
    <rect x="644" y="256" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="734" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 2</text>
    <text x="734" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">부하: 50%</text>

    <!-- Pod3 -->
    <rect x="644" y="400" width="180" height="48" rx="6" fill="#ffffff"/>
    <rect x="644" y="400" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="734" y="420" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 3</text>
    <text x="734" y="436" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">부하: 20%</text>
  </svg>