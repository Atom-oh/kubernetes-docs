<title id="d0-title">Calico 핵심 기능 개요</title>
<desc id="d0-desc">네트워킹, 보안, 관측성, IPAM이라는 Calico의 네 가지 핵심 기능이 모두 프로덕션 워크로드를 지원한다는 것을 보여주는 다이어그램.</desc>
