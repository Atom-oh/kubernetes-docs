<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mesh-overload-title mesh-overload-desc">
    <title id="mesh-overload-title">Sidecar 리소스 없이 전체 메시 구성 수신</title>
    <desc id="mesh-overload-desc">1000개 서비스로 이루어진 메시 전체의 구성 정보가 단일 파드의 Envoy Proxy에 모두 푸시되어, 애플리케이션이 실제 사용하는 서비스가 2개뿐인데도 Envoy가 1000개 전부를 수신하는 자원 낭비 문제를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Service Mesh -->
    <rect x="180" y="128" width="600" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="392" y="132" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="141" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE MESH · 1000개 서비스</text>

    <!-- Zone: 단일 파드 -->
    <rect x="276" y="360" width="440" height="136" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="436" y="364" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="373" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">단일 파드</text>

    <!-- Arrow: mesh -> Envoy (dashed, all config push) -->
    <path d="M 480,240 V 308 Q 480,316 488,316 H 584 Q 592,316 592,324 V 392" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="492" y="296" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="536" y="305" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">모든 정보 푸시</text>

    <!-- Node: Service 1 -->
    <rect x="204" y="160" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="204" y="160" width="120" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="264" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service 1</text>

    <!-- Node: Service 2 -->
    <rect x="348" y="160" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="348" y="160" width="120" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="408" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service 2</text>

    <!-- Node: Service 3 -->
    <rect x="492" y="160" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="492" y="160" width="120" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="552" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service 3</text>

    <!-- Node: Service 1000 -->
    <rect x="636" y="160" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="636" y="160" width="120" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="696" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service 1000</text>

    <!-- Node: 애플리케이션 -->
    <rect x="300" y="392" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="300" y="392" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="308" y="400" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="322" y="409" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="370" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">애플리케이션</text>
    <text x="370" y="444" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">사용: Service 1, 2만</text>

    <!-- Node: Envoy Proxy (focal) -->
    <rect x="492" y="392" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="492" y="392" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="500" y="400" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="516" y="409" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
    <text x="592" y="428" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>
    <text x="592" y="444" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">수신: 1000개 전부</text>

    <!-- Legend -->
    <line x1="180" y1="524" x2="780" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="180" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="180" y="552" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="200" y="560" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal · 과부하 지점</text>
    <line x1="400" y1="560" x2="428" y2="560" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="436" y="562" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">불필요한 구성 전파</text>
  </svg>