<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="notebooks-seq-title notebooks-seq-desc">
  <title id="notebooks-seq-title">Kubeflow Notebook 생성 시퀀스</title>
  <desc id="notebooks-seq-desc">사용자가 Central Dashboard에서 Notebook 사양을 선택하면 Notebook CR이 생성되고, Notebook 컨트롤러가 이를 감시해 StatefulSet/Pod로 조정한 뒤 PVC 마운트와 GPU 요청을 반영하고 Istio 사이드카를 주입해 Dashboard 프록시로 노트북 UI를 사용자에게 노출하는 과정을 보여준다.</desc>
  <rect x="0" y="0" width="960" height="600" fill="var(--paper)"/>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow-fill" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-fill-accent" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--accent)"/>
    </marker>
    <marker id="arrow-open" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polyline points="0 0, 8 4, 0 8" fill="none" stroke="var(--muted)" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ============ Actor boxes ============ -->
  <!-- x centers: User 100, Dash 280, Ctrl 480, K8s 660, Istio 860 -->

  <!-- User -->
  <rect x="60" y="46" width="80" height="34" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
  <text x="100" y="67" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="var(--ink)">사용자</text>

  <!-- Dash -->
  <rect x="220" y="46" width="120" height="34" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
  <text x="280" y="67" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="var(--ink)">Central Dashboard</text>

  <!-- Ctrl -->
  <rect x="410" y="46" width="140" height="34" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
  <text x="480" y="67" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="var(--ink)">Notebook 컨트롤러</text>

  <!-- K8s (focal) -->
  <rect x="590" y="46" width="140" height="34" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.4"/>
  <text x="660" y="67" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="var(--ink)">StatefulSet / Pod</text>

  <!-- Istio -->
  <rect x="805" y="46" width="110" height="34" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
  <text x="860" y="67" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="var(--ink)">Istio 사이드카</text>

  <!-- ============ Lifelines ============ -->
  <line x1="100" y1="80" x2="100" y2="540" stroke="var(--rule-solid)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="280" y1="80" x2="280" y2="540" stroke="var(--rule-solid)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="80" x2="480" y2="540" stroke="var(--rule-solid)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="660" y1="80" x2="660" y2="540" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3,3" opacity="0.55"/>
  <line x1="860" y1="80" x2="860" y2="540" stroke="var(--rule-solid)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ============ Notebook CR resource note (between Dash and Ctrl) ============ -->
  <!-- object icon, not a full lifeline -->
  <rect x="330" y="120" width="130" height="44" rx="4" fill="var(--paper)" stroke="var(--soft)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="395" y="136" text-anchor="middle" class="mono" font-size="8" letter-spacing="0.06em" fill="var(--soft)">RESOURCE</text>
  <text x="395" y="151" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="var(--muted)">Notebook CR</text>
  <text x="395" y="161" text-anchor="middle" class="mono" font-size="7.5" fill="var(--soft)">Profile 네임스페이스 내</text>

  <!-- ============ Activation bars ============ -->
  <!-- Ctrl active: watch through reconcile, y 214 -> 298 -->
  <rect x="476" y="214" width="8" height="84" fill="rgba(35,47,62,0.06)" stroke="var(--muted)" stroke-width="0.8"/>
  <!-- K8s active: reconcile through sidecar injection, y 298 -> 446 -->
  <rect x="656" y="298" width="8" height="148" fill="rgba(255,153,0,0.08)" stroke="var(--accent)" stroke-width="0.8"/>

  <!-- ============ Messages ============ -->

  <!-- m1: User -> Dash -->
  <line x1="104" y1="126" x2="276" y2="126" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow-fill)"/>
  <text x="190" y="118" text-anchor="middle" class="mono" font-size="8" fill="var(--muted)">이미지, CPU/메모리, GPU 개수, PVC 선택</text>

  <!-- m2: Dash -> Notebook CR note -->
  <line x1="284" y1="172" x2="328" y2="172" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow-fill)"/>
  <text x="306" y="188" text-anchor="middle" class="mono" font-size="7.5" fill="var(--muted)">Notebook 커스텀</text>
  <text x="306" y="198" text-anchor="middle" class="mono" font-size="7.5" fill="var(--muted)">리소스 생성</text>

  <!-- m3: Ctrl -> Notebook CR note (watch, async/open marker) -->
  <line x1="476" y1="214" x2="462" y2="214" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
  <text x="469" y="206" text-anchor="middle" class="mono" font-size="7.5" fill="var(--muted)">생성/변경</text>
  <text x="469" y="230" text-anchor="middle" class="mono" font-size="7.5" fill="var(--muted)">이벤트 감시</text>

  <!-- m4: Ctrl -> K8s -->
  <line x1="484" y1="298" x2="654" y2="298" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow-fill)"/>
  <text x="570" y="290" text-anchor="middle" class="mono" font-size="8" fill="var(--muted)">StatefulSet + Pod 스펙으로 조정</text>

  <!-- m5: K8s self-message (PVC mount) -->
  <path d="M 664 328 H 704 A8 8 0 0 1 712 336 V 344 A8 8 0 0 1 704 352 H 664"
        fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow-fill)"/>
  <text x="718" y="336" class="mono" font-size="8" fill="var(--muted)">홈 디렉터리에</text>
  <text x="718" y="348" class="mono" font-size="8" fill="var(--muted)">PVC 마운트</text>

  <!-- m6: K8s self-message (gpu) -->
  <path d="M 664 372 H 704 A8 8 0 0 1 712 380 V 388 A8 8 0 0 1 704 396 H 664"
        fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow-fill)"/>
  <text x="718" y="380" class="mono" font-size="8" fill="var(--muted)">(선택 시)</text>
  <text x="718" y="392" class="mono" font-size="8" fill="var(--muted)">nvidia.com/gpu 요청</text>

  <!-- m7: K8s -> Istio -->
  <line x1="664" y1="428" x2="856" y2="428" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow-fill)"/>
  <text x="760" y="420" text-anchor="middle" class="mono" font-size="8" fill="var(--muted)">네임스페이스 단위 라우팅을 위한 사이드카 주입</text>

  <!-- m8: Istio -> User (headline success, coral, dashed return) -->
  <line x1="856" y1="480" x2="104" y2="480" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-fill-accent)"/>
  <text x="480" y="472" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="var(--accent)">Dashboard 프록시를 통해 노트북 UI 노출</text>

  <!-- ============ Footer legend ============ -->
  <line x1="60" y1="562" x2="90" y2="562" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="98" y="565" class="mono" font-size="8" fill="var(--soft)">핵심 성공 응답</text>

  <line x1="230" y1="562" x2="260" y2="562" stroke="var(--soft)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="268" y="565" class="mono" font-size="8" fill="var(--soft)">리소스(CR) — 감시 대상</text>
</svg>