<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trainop-title trainop-desc">
      <title id="trainop-title">Kubeflow Training Operator reconciliation flow</title>
      <desc id="trainop-desc">A TrainJob and its ClusterTrainingRuntime are both watched by the Trainer Controller, which creates a JobSet that spawns gang-scheduled worker pods; the pods discover each other through a headless Service, report progress and metrics back to the controller, and the controller writes that into TrainJob status.</desc>
      <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
        </marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- ================= ARROWS (behind nodes) ================= -->

      <!-- TrainJob -> ClusterTrainingRuntime : references (top, straight) -->
      <path d="M220,72 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="406" y="52" width="88" height="12" rx="2" fill="#ffffff"/>
      <text x="450" y="61" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFERENCES</text>

      <!-- TrainJob -> Controller : watched by (elbow, fan attach 1) -->
      <path d="M130,104 V164 Q130,172 138,172 H440 Q448,172 448,180 V220"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="150" y="148" width="76" height="12" rx="2" fill="#ffffff"/>
      <text x="188" y="157" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WATCHED BY</text>

      <!-- ClusterTrainingRuntime -> Controller : watched by (elbow, fan attach 2) -->
      <path d="M780,104 V164 Q780,172 772,172 H520 Q512,172 512,180 V220"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="694" y="148" width="76" height="12" rx="2" fill="#ffffff"/>
      <text x="732" y="157" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WATCHED BY</text>

      <!-- Controller -> JobSet : creates (straight vertical, focal) -->
      <path d="M480,292 V360" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="492" y="316" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="518" y="325" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATES</text>

      <!-- JobSet -> Worker Pods : spawns (straight vertical) -->
      <path d="M480,424 V500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="486" y="452" width="56" height="12" rx="2" fill="#ffffff"/>
      <text x="514" y="461" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPAWNS</text>

      <!-- Worker Pods <-> Headless Service : discover peers (bidirectional, straight horizontal) -->
      <path d="M600,536 H700" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
      <rect x="606" y="514" width="88" height="12" rx="2" fill="#ffffff"/>
      <text x="650" y="523" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISCOVER PEERS</text>

      <!-- Worker Pods -> Controller : progress / metrics (routed left of JobSet column) -->
      <path d="M360,520 H316 Q308,520 308,512 V264 Q308,256 316,256 H380"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="220" y="382" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="260" y="391" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">METRICS</text>

      <!-- Controller -> TrainJob.status : reports status (straight horizontal, focal) -->
      <path d="M580,256 H700" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="592" y="234" width="96" height="12" rx="2" fill="#ffffff"/>
      <text x="640" y="243" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPORTS STATUS</text>

      <!-- ================= NODES ================= -->

      <!-- TrainJob (input) -->
      <rect x="40" y="40" width="180" height="64" rx="6" fill="#ffffff"/>
      <rect x="40" y="40" width="180" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <rect x="48" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
      <text x="62" y="57" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CR</text>
      <text x="130" y="76" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">TrainJob</text>
      <text x="130" y="92" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">script · args · workers</text>

      <!-- ClusterTrainingRuntime (input) -->
      <rect x="680" y="40" width="200" height="64" rx="6" fill="#ffffff"/>
      <rect x="680" y="40" width="200" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <rect x="688" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
      <text x="702" y="57" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CR</text>
      <text x="780" y="76" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ClusterTrainingRuntime</text>
      <text x="780" y="92" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">image · launch mechanics</text>

      <!-- Trainer Controller (focal) -->
      <rect x="380" y="220" width="200" height="72" rx="6" fill="#ffffff"/>
      <rect x="380" y="220" width="200" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <rect x="388" y="228" width="40" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
      <text x="408" y="237" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
      <text x="480" y="258" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Trainer Controller</text>
      <text x="480" y="274" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reconciles TrainJob</text>

      <!-- JobSet / PodGroup -->
      <rect x="380" y="360" width="200" height="64" rx="6" fill="#ffffff"/>
      <rect x="380" y="360" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="388" y="368" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="410" y="377" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOBSET</text>
      <text x="480" y="392" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">JobSet / PodGroup</text>
      <text x="480" y="408" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gang-scheduled workers</text>

      <!-- Worker Pods (0..N) -->
      <rect x="360" y="500" width="240" height="72" rx="6" fill="#ffffff"/>
      <rect x="360" y="500" width="240" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="368" y="508" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="384" y="517" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
      <text x="480" y="538" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Worker Pods (0..N)</text>
      <text x="480" y="554" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RANK=0..N</text>

      <!-- Headless Service -->
      <rect x="700" y="500" width="200" height="72" rx="6" fill="#ffffff"/>
      <rect x="700" y="500" width="200" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <rect x="708" y="508" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
      <text x="722" y="517" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="800" y="538" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Headless Service</text>
      <text x="800" y="554" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stable DNS per pod</text>

      <!-- TrainJob.status -->
      <rect x="700" y="220" width="180" height="72" rx="6" fill="#ffffff"/>
      <rect x="700" y="220" width="180" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <rect x="708" y="228" width="40" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
      <text x="728" y="237" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATUS</text>
      <text x="790" y="258" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">TrainJob.status</text>
      <text x="790" y="274" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">progress · metrics</text>

    </svg>