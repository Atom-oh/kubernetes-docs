    <title id="ko-service-mesh-istio-advanced-02-multi-cluster-1-title">리전 간 Istio Mesh 구성 동기화와 mTLS 통신</title>
    <desc id="ko-service-mesh-istio-advanced-02-multi-cluster-1-desc">Istio Mesh가 미국, 유럽, 아시아 리전의 EKS 클러스터에 구성을 동기화하고, 세 리전의 클러스터가 서로 Cross-region mTLS로 통신하는 지리적 분산 아키텍처.</desc>
