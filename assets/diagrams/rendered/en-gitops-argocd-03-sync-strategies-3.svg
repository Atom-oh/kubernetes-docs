<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
<title id="t3">Retry backoff sequence</title>
<desc id="d3">Sequence diagram showing a controller retrying a failed sync against Kubernetes with exponential backoff waits of 5, 10, and 20 seconds, succeeding on the fourth attempt and reporting the synced status back to the application.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Lifelines -->
<line x1="150" y1="76" x2="150" y2="570" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="480" y1="76" x2="480" y2="570" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="810" y1="76" x2="810" y2="570" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Activation bar: Controller stays active across all retries -->
<rect x="476" y="100" width="8" height="440" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- 1: Ctrl -> K8s attempt 1 -->
<line x1="484" y1="100" x2="806" y2="100" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="592" y="80" width="106" height="12" rx="2" fill="#ffffff"/>
<text x="645" y="89" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC ATTEMPT 1</text>

<!-- 2: K8s --> Ctrl failed -->
<line x1="810" y1="140" x2="488" y2="140" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="614" y="120" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="640" y="129" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILED</text>

<!-- Note: wait 5s -->
<rect x="410" y="168" width="140" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<text x="480" y="184" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" text-anchor="middle">Wait 5s</text>

<!-- 4: Ctrl -> K8s attempt 2 -->
<line x1="484" y1="220" x2="806" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="592" y="200" width="106" height="12" rx="2" fill="#ffffff"/>
<text x="645" y="209" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC ATTEMPT 2</text>

<!-- 5: K8s --> Ctrl failed -->
<line x1="810" y1="260" x2="488" y2="260" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="614" y="240" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="640" y="249" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILED</text>

<!-- Note: wait 10s -->
<rect x="384" y="288" width="192" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<text x="480" y="304" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" text-anchor="middle">Wait 10s (5s &#215; 2)</text>

<!-- 7: Ctrl -> K8s attempt 3 -->
<line x1="484" y1="340" x2="806" y2="340" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="592" y="320" width="106" height="12" rx="2" fill="#ffffff"/>
<text x="645" y="329" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC ATTEMPT 3</text>

<!-- 8: K8s --> Ctrl failed -->
<line x1="810" y1="380" x2="488" y2="380" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="614" y="360" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="640" y="369" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILED</text>

<!-- Note: wait 20s -->
<rect x="384" y="408" width="192" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<text x="480" y="424" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" text-anchor="middle">Wait 20s (10s &#215; 2)</text>

<!-- 10: Ctrl -> K8s attempt 4 -->
<line x1="484" y1="460" x2="806" y2="460" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="592" y="440" width="106" height="12" rx="2" fill="#ffffff"/>
<text x="645" y="449" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC ATTEMPT 4</text>

<!-- 11: K8s --> Ctrl success (headline, accent) -->
<line x1="810" y1="500" x2="488" y2="500" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
<rect x="608" y="480" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="640" y="489" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUCCESS</text>

<!-- 12: Ctrl -> App update status -->
<line x1="476" y1="540" x2="154" y2="540" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="222" y="520" width="164" height="12" rx="2" fill="#ffffff"/>
<text x="304" y="529" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPDATE STATUS: SYNCED</text>

<!-- Actor boxes -->
<rect x="80" y="40" width="140" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="150" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>

<rect x="410" y="40" width="140" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Controller</text>

<rect x="740" y="40" width="140" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="810" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes</text>
</svg>