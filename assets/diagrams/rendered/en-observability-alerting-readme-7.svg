<title id="en-observability-alerting-readme-7-title">Hybrid alerting pipeline from sources to notification channels</title>
<desc id="en-observability-alerting-readme-7-desc">Architecture diagram of a hybrid alerting pipeline: Prometheus and CloudWatch feed Alertmanager, which routes to Grafana OnCall and PagerDuty for on-call management, fanning out to Slack, email, and SMS notification channels.</desc>
