<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">CNI 플러그인 동작 순서</title>
<desc id="ddesc">Kubelet이 컨테이너 생성·삭제 시 CNI Plugin을 호출하고 CNI Plugin이 네트워크 인터페이스 생성, IP 할당, 라우팅 설정을 수행하는 순서를 보여준다.</desc>

