<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="ko-gitops-argocd-01-installation-0-title ko-gitops-argocd-01-installation-0-desc">
      <title id="ko-gitops-argocd-01-installation-0-title">ArgoCD 고가용성(HA) 아키텍처</title>
      <desc id="ko-gitops-argocd-01-installation-0-desc">로드밸런서가 API 서버로 요청을 분산하고, API 서버는 Redis에 캐시를 저장하며, 애플리케이션 컨트롤러는 리포지토리 서버에서 매니페스트를 가져오고, Redis는 마스터·리플리카·센티널로 구성된 HA 클러스터를 이루는 ArgoCD 고가용성 구성을 보여준다.</desc>
      <defs>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zones (bg -> zones -> arrows -> nodes) -->
      <rect x="64" y="136" width="280" height="176" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="132" y="140" width="144" height="12" rx="2" fill="#ffffff"/>
      <text x="204" y="149" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APPLICATION CONTROLLERS</text>

      <rect x="560" y="224" width="320" height="184" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="656" y="228" width="128" height="12" rx="2" fill="#ffffff"/>
      <text x="720" y="237" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">REDIS HA</text>

      <!-- Arrows (drawn before boxes) -->
      <!-- ALB -> API Servers (straight, shared x) -->
      <line x1="712" y1="88" x2="712" y2="136" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- API Servers -> Redis Master (two-bend elbow, r=8) -->
      <path d="M712,184 V212 Q712,220 704,220 H672 Q664,220 664,228 V256" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- Controller Leader -> Repo Servers (routed around Standby, r=8) -->
      <path d="M96,192 H60 Q52,192 52,200 V376 Q52,384 60,384 H96" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Redis Master -> Redis Replicas (straight, shared x) -->
      <line x1="664" y1="312" x2="664" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, gap preserved) -->
      <rect x="720" y="104" width="48" height="12" rx="2" fill="#ffffff"/>
      <text x="744" y="113" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

      <rect x="668" y="200" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="688" y="209" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE</text>

      <rect x="4" y="282" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="24" y="291" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FETCH</text>

      <!-- Node: ALB -->
      <rect x="632" y="40" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="632" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="640" y="48" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="652" y="57" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LB</text>
      <text x="712" y="66" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Load Balancer</text>
      <text x="712" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ALB</text>

      <!-- Node: API Servers -->
      <rect x="632" y="136" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="632" y="136" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="640" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="654" y="153" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="712" y="163" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Servers</text>
      <text x="712" y="177" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×3 replicas</text>

      <!-- Node: Controller Leader -->
      <rect x="96" y="168" width="216" height="48" rx="6" fill="#ffffff"/>
      <rect x="96" y="168" width="216" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="104" y="176" width="48" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="128" y="185" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LEADER</text>
      <text x="204" y="195" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Controller 1</text>
      <text x="204" y="209" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">application-controller</text>

      <!-- Node: Controller Standby -->
      <rect x="96" y="232" width="216" height="48" rx="6" fill="#ffffff"/>
      <rect x="96" y="232" width="216" height="48" rx="6" fill="rgba(35,47,62,0.02)" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="104" y="240" width="52" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
      <text x="130" y="249" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STANDBY</text>
      <text x="204" y="259" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Controller 2</text>
      <text x="204" y="273" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">application-controller</text>

      <!-- Node: Repo Servers -->
      <rect x="96" y="360" width="216" height="48" rx="6" fill="#ffffff"/>
      <rect x="96" y="360" width="216" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <rect x="104" y="368" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="118" y="377" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
      <text x="204" y="387" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Repo Servers</text>
      <text x="204" y="401" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×3 replicas</text>

      <!-- Node: Redis Master (focal) -->
      <rect x="592" y="256" width="144" height="56" rx="6" fill="#ffffff"/>
      <rect x="592" y="256" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <rect x="600" y="264" width="24" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
      <text x="612" y="273" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="664" y="286" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Redis Master</text>
      <text x="664" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">single writer</text>

      <!-- Node: Redis Replicas -->
      <rect x="592" y="336" width="144" height="48" rx="6" fill="#ffffff"/>
      <rect x="592" y="336" width="144" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <rect x="600" y="344" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
      <text x="612" y="353" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="664" y="363" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Redis Replicas</text>
      <text x="664" y="377" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×2</text>

      <!-- Node: Sentinels (monitoring only, no data-flow edges) -->
      <rect x="748" y="256" width="104" height="128" rx="6" fill="#ffffff"/>
      <rect x="748" y="256" width="104" height="128" rx="6" fill="rgba(35,47,62,0.02)" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="756" y="264" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
      <text x="770" y="273" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBS</text>
      <text x="800" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sentinels</text>
      <text x="800" y="330" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×3</text>
      <text x="800" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">failover</text>

      <!-- Legend strip -->
      <line x1="40" y1="456" x2="920" y2="456" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="40" y="472" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="488" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="60" y="496" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">단일 장애점 / 조정 지점</text>

      <rect x="320" y="488" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="340" y="496" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">액티브 컴포넌트</text>

      <rect x="560" y="488" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="580" y="496" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">스탠바이 / 모니터링 전용</text>
    </svg>