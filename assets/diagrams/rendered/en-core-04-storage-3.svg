<title id="d3-title">Volume Snapshot and Restore Flow</title>
<desc id="d3-desc">A Volume Snapshot references a Volume Snapshot Class and captures an existing PersistentVolumeClaim, and a new PVC using that snapshot as its data source binds to a new PV restored from it.</desc>
