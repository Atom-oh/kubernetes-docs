<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spire-federation-title spire-federation-desc">
    <title id="spire-federation-title">트러스트 도메인 간 페더레이션 구조</title>
    <desc id="spire-federation-desc">서로 다른 트러스트 도메인의 SPIRE Server가 각각 Bundle Endpoint를 통해 상대방의 Trust Bundle을 주기적으로 교환·저장하고, 이를 신뢰 기반으로 두 도메인의 워크로드가 직접 mTLS로 통신하는 구조를 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="32" y="48" width="360" height="336" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="76" y="52" width="272" height="12" rx="2" fill="#ffffff"/>
    <text x="212" y="61" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRUST DOMAIN A · PROD.US.EXAMPLE.COM</text>

    <rect x="568" y="48" width="360" height="336" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="612" y="52" width="272" height="12" rx="2" fill="#ffffff"/>
    <text x="748" y="61" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRUST DOMAIN B · PROD.EU.EXAMPLE.COM</text>

    <rect x="392" y="176" width="176" height="120" rx="8" fill="rgba(255,153,0,0.03)" stroke="rgba(236,114,17,0.30)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <rect x="424" y="180" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="189" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FEDERATION</text>

    <!-- SERVER_A -> BUNDLE_A -->
    <path d="M 112,140 V 156" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- WL_A -.-> SERVER_A (dashed, SVID) -->
    <path d="M 264,116 H 192" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="204" y="100" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="226" y="109" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SVID</text>

    <!-- SERVER_B -> BUNDLE_B -->
    <path d="M 856,140 V 156" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- WL_B -.-> SERVER_B -->
    <path d="M 704,116 H 776" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="720" y="100" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="742" y="109" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SVID</text>

    <!-- SERVER_A -> BE_A (routed below WL_A, clear of Bundle A's column) -->
    <path d="M 192,140 H 284 Q 292,140 292,148 V 262 Q 292,270 300,270 H 392"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- SERVER_B -> BE_B (mirrored) -->
    <path d="M 776,140 H 680 Q 672,140 672,148 V 262 Q 672,270 664,270 H 568"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- BE_A <-> BE_B (bidirectional, small arc over the tops of both boxes) -->
    <path d="M 432,256 V 248 Q 432,240 440,240 H 520 Q 528,240 528,248 V 256"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-start="url(#arrow-accent-rev)" marker-end="url(#arrow-accent)"/>
    <rect x="440" y="220" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="229" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">BUNDLE 교환</text>

    <!-- BE_A -.-> BUNDLE_A (B's bundle stored; bridged over the SERVER_A->BE_A crossing) -->
    <path d="M 392,256 H 316 Q 308,256 308,248 V 204 Q 308,196 300,196 a 8,8 0 0,0 -16,0 H 192"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="196" y="248" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="252" y="257" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">B의 BUNDLE 저장</text>

    <!-- BE_B -.-> BUNDLE_B (A's bundle stored) -->
    <path d="M 568,256 H 680 Q 688,256 688,248 V 204 Q 688,196 696,196 H 776"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="652" y="248" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="708" y="257" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">A의 BUNDLE 저장</text>

    <!-- WL_A <-> WL_B (bidirectional mTLS, focal) -->
    <path d="M 320,344 H 640" fill="none" stroke="#EC7211" stroke-width="1.4" marker-start="url(#arrow-accent-rev)" marker-end="url(#arrow-accent)"/>
    <rect x="440" y="328" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="337" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">MTLS 통신</text>

    <!-- Node: SERVER_A -->
    <rect x="72" y="96" width="120" height="44" rx="6" fill="#ffffff"/>
    <rect x="72" y="96" width="120" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="132" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">SPIRE Server A</text>

    <!-- Node: BUNDLE_A -->
    <rect x="72" y="156" width="120" height="44" rx="6" fill="#ffffff"/>
    <rect x="72" y="156" width="120" height="44" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="132" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Trust Bundle A</text>

    <!-- Node: WL_A -->
    <rect x="264" y="96" width="96" height="40" rx="6" fill="#ffffff"/>
    <rect x="264" y="96" width="96" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="312" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">워크로드 A</text>

    <!-- Node: SERVER_B -->
    <rect x="776" y="96" width="120" height="44" rx="6" fill="#ffffff"/>
    <rect x="776" y="96" width="120" height="44" rx="6" fill="rgba(255,153,0,0.05)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="836" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">SPIRE Server B</text>

    <!-- Node: BUNDLE_B -->
    <rect x="776" y="156" width="120" height="44" rx="6" fill="#ffffff"/>
    <rect x="776" y="156" width="120" height="44" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="836" y="182" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Trust Bundle B</text>

    <!-- Node: WL_B -->
    <rect x="608" y="96" width="96" height="40" rx="6" fill="#ffffff"/>
    <rect x="608" y="96" width="96" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="656" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">워크로드 B</text>

    <!-- Node: BE_A -->
    <rect x="392" y="256" width="80" height="40" rx="6" fill="#ffffff"/>
    <rect x="392" y="256" width="80" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="432" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">BE A</text>
    <text x="432" y="290" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8443</text>

    <!-- Node: BE_B -->
    <rect x="488" y="256" width="80" height="40" rx="6" fill="#ffffff"/>
    <rect x="488" y="256" width="80" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="528" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">BE B</text>
    <text x="528" y="290" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8443</text>

    <!-- Node: WL_A (bottom, mTLS endpoint) -->
    <rect x="224" y="320" width="96" height="48" rx="6" fill="#ffffff"/>
    <rect x="224" y="320" width="96" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="272" y="342" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">워크로드 A</text>
    <text x="272" y="358" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">domain A</text>

    <!-- Node: WL_B (bottom, mTLS endpoint) -->
    <rect x="640" y="320" width="96" height="48" rx="6" fill="#ffffff"/>
    <rect x="640" y="320" width="96" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="688" y="342" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">워크로드 B</text>
    <text x="688" y="358" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">domain B</text>

    <!-- Legend -->
    <line x1="32" y1="424" x2="928" y2="424" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="440" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="32" y="456" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="52" y="464" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Server / mTLS 종단 (focal)</text>

    <line x1="260" y1="462" x2="288" y2="462" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="296" y="464" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">SVID / Bundle 저장</text>

    <line x1="460" y1="462" x2="488" y2="462" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="496" y="464" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Bundle 교환 / mTLS</text>

    <rect x="660" y="456" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="680" y="464" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Trust Bundle 저장소</text>
  </svg>
