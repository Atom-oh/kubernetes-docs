<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="layers-title layers-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="layers-title">EKS 환경의 계층별 관측성 데이터 흐름</title>
    <desc id="layers-desc">인프라, 쿠버네티스, 애플리케이션 세 계층에서 각각 발생하는 데이터가 CloudWatch, Prometheus/Grafana, Tempo/X-Ray, Loki 네 가지 관측성 도구로 모이는 구조를 보여준다.</desc>
    <defs><style>@import url(https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
      <marker id="l-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="l-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zone: layers -->
    <rect x="40" y="76" width="360" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="80" width="150" height="12" rx="2" fill="#ffffff"/>
    <text x="131" y="89" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">계층 (LAYERS)</text>

    <!-- Arrows: Infra -> CloudWatch -->
    <line x1="400" y1="132" x2="596" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#l-arrow)"/>
    <!-- K8s -> Prometheus/Grafana -->
    <line x1="400" y1="256" x2="596" y2="256" stroke="#EC7211" stroke-width="1.2" marker-end="url(#l-arrow-accent)"/>
    <!-- App -> 3 tools, fanned exit points on right edge of App node (y=356,376,396 within box 340-420) -->
    <path d="M 400,356 H 596" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#l-arrow)"/>
    <path d="M 400,380 H 500 Q 508,380 508,372 V 264 Q 508,256 516,256 H 596"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#l-arrow)"/>
    <path d="M 400,404 H 596" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#l-arrow)"/>

    <rect x="432" y="344" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="467" y="353" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">메트릭</text>
    <rect x="432" y="392" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="467" y="401" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">로그</text>

    <!-- Infra layer node -->
    <rect x="72" y="108" width="296" height="48" rx="6" fill="#ffffff"/>
    <rect x="72" y="108" width="296" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">인프라 계층</text>
    <text x="220" y="146" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EC2/Fargate · VPC Flow Logs · EBS</text>

    <!-- K8s layer node -->
    <rect x="72" y="232" width="296" height="48" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="72" y="232" width="296" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="220" y="254" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes 계층</text>
    <text x="220" y="270" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kube-state-metrics · API Server</text>

    <!-- App layer node -->
    <rect x="72" y="356" width="296" height="48" rx="6" fill="#ffffff"/>
    <rect x="72" y="356" width="296" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="378" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">애플리케이션 계층</text>
    <text x="220" y="394" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">비즈니스 메트릭 · 로그 · 분산 추적</text>

    <!-- Tool nodes -->
    <rect x="596" y="108" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="596" y="108" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="672" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch</text>

    <rect x="596" y="232" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="596" y="232" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="672" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
    <text x="672" y="268" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/Grafana</text>

    <rect x="596" y="332" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="596" y="332" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="672" y="352" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tempo/X-Ray</text>
    <text x="672" y="368" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">추적</text>

    <rect x="596" y="392" width="152" height="48" rx="6" fill="#ffffff"/>
    <rect x="596" y="392" width="152" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="672" y="412" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Loki</text>
    <text x="672" y="428" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">로그 집계</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="536" x2="164" y2="536" stroke="#545B64" stroke-width="1.2" marker-end="url(#l-arrow)"/>
    <text x="172" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">데이터 전송</text>
    <line x1="320" y1="536" x2="344" y2="536" stroke="#EC7211" stroke-width="1.2" marker-end="url(#l-arrow-accent)"/>
    <text x="352" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">핵심 K8s 메트릭 경로</text>
  </svg>