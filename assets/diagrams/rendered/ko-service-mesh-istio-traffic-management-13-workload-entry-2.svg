<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc">
  <title id="d2-title">VM 워크로드의 Envoy 사이드카 아키텍처</title>
  <desc id="d2-desc">VM에 수동 설치된 Envoy와 파드에 자동 주입된 Envoy가 mTLS로 서로 통신하고, istiod가 양쪽 Envoy에 xDS 구성을 배포하며 VM 측에는 인증서까지 발급하는 구조를 보여준다.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="8 0, 0 3, 8 6" fill="#EC7211"/>
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="8 0, 0 3, 8 6" fill="#545B64"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="40" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">FLOWCHART · VM WORKLOAD ARCHITECTURE</text>
  <text x="36" y="72" font-size="24" font-weight="700" fill="#232F3E">VM 워크로드 아키텍처</text>

  <!-- Zone: VM -->
  <rect x="36" y="100" width="220" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="52" y="108" width="120" height="14" rx="2" fill="#ffffff"/>
  <text x="112" y="119" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="rgba(35,47,62,0.4)">VIRTUAL MACHINE</text>

  <!-- Zone: Kubernetes cluster (outer) -->
  <rect x="704" y="100" width="220" height="280" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="720" y="108" width="168" height="14" rx="2" fill="#ffffff"/>
  <text x="804" y="119" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="rgba(35,47,62,0.4)">KUBERNETES 클러스터</text>

  <!-- Zone: Pod (inner, inside K8s zone) -->
  <rect x="720" y="140" width="188" height="140" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>
  <rect x="732" y="148" width="52" height="14" rx="2" fill="#ffffff"/>
  <text x="758" y="159" class="mono" font-size="7" letter-spacing="0.14em" text-anchor="middle" fill="rgba(35,47,62,0.4)">파드</text>

  <!-- mTLS line: EnvoyVM <-> EnvoyPod (both at y=236) -->
  <path d="M256,236 H720" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>
  <rect x="440" y="216" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="476" y="225" class="mono" font-size="8" letter-spacing="0.04em" text-anchor="middle" fill="#EC7211">mTLS 트래픽</text>

  <!-- App <-> EnvoyVM local (vertical, same x, short) -->
  <path d="M156,196 V208" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <rect x="164" y="196" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="194" y="205" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#7D8998">로컬 통신</text>

  <!-- PodApp <-> EnvoyPod local (vertical) -->
  <path d="M804,216 V228" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <rect x="812" y="216" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="842" y="225" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#7D8998">로컬 통신</text>

  <!-- istiod -> EnvoyVM (dashed, xDS config) -->
  <path d="M400,376 H326 Q318,376 318,368 V232 Q318,224 310,224 H236"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="326" y="296" width="136" height="12" rx="2" fill="#ffffff"/>
  <text x="332" y="305" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="start" fill="#7D8998">xDS 구성 + SE/DR</text>

  <!-- istiod -> EnvoyVM (dashed, cert issuance) -->
  <path d="M400,400 H350 Q342,400 342,392 V256 Q342,248 334,248 H236"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="350" y="318" width="130" height="12" rx="2" fill="#ffffff"/>
  <text x="356" y="327" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="start" fill="#7D8998">인증서 + SA 발급</text>

  <!-- istiod -> EnvoyPod (dashed, xDS config) -->
  <path d="M560,396 H644 Q652,396 652,388 V260 Q652,252 660,252 H744"
        fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="574" y="318" width="70" height="12" rx="2" fill="#ffffff"/>
  <text x="609" y="327" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#7D8998">xDS 구성</text>

  <!-- App -->
  <g>
    <rect x="76" y="140" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="76" y="140" width="160" height="56" rx="6" fill="rgba(149,165,166,0.15)" stroke="#7D8998" stroke-width="1"/>
    <text x="156" y="162" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">레거시 애플리케이션</text>
    <text x="156" y="178" class="mono" font-size="9" text-anchor="middle" fill="#545B64">port:8080</text>
  </g>
  <!-- EnvoyVM -->
  <g>
    <rect x="76" y="208" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="76" y="208" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="156" y="230" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Envoy Sidecar</text>
    <text x="156" y="246" class="mono" font-size="9" text-anchor="middle" fill="#545B64">수동 설치</text>
  </g>

  <!-- PodApp -->
  <g>
    <rect x="744" y="168" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="744" y="168" width="140" height="48" rx="6" fill="rgba(0,199,183,0.12)" stroke="#01A88D" stroke-width="1"/>
    <text x="814" y="196" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">애플리케이션</text>
  </g>
  <!-- EnvoyPod -->
  <g>
    <rect x="744" y="228" width="140" height="48" rx="6" fill="#ffffff"/>
    <rect x="744" y="228" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="814" y="250" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Envoy</text>
    <text x="814" y="264" class="mono" font-size="9" text-anchor="middle" fill="#545B64">자동 주입</text>
  </g>

  <!-- istiod (focal, below both, hub) -->
  <g>
    <rect x="400" y="360" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="360" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="384" font-size="12" font-weight="700" text-anchor="middle" fill="#232F3E">istiod</text>
    <text x="480" y="400" class="mono" font-size="9" text-anchor="middle" fill="#545B64">Control Plane</text>
  </g>

  <!-- Legend -->
  <line x1="36" y1="500" x2="924" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="36" y="520" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <line x1="120" y1="515" x2="152" y2="515" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="164" y="518" font-size="11" fill="#545B64">양방향 mTLS 트래픽</text>
  <line x1="340" y1="515" x2="372" y2="515" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="384" y="518" font-size="11" fill="#545B64">제어 평면 배포 (구성/인증서)</text>
  <rect x="640" y="507" width="16" height="16" rx="3" fill="rgba(0,199,183,0.12)" stroke="#01A88D" stroke-width="1"/>
  <text x="664" y="518" font-size="11" fill="#545B64">Kubernetes 네이티브 앱</text>

  <text x="36" y="568" font-size="14" font-style="italic" fill="#545B64">양쪽 Envoy는 동일한 mTLS 신뢰 체계를 공유하지만, VM 측 사이드카는 istiod가 인증서까지 별도로 발급해야 한다.</text>
</svg>