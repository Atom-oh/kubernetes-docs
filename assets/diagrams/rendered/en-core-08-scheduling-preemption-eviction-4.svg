    <title id="en-core-08-scheduling-preemption-eviction-4-title">Taints and tolerations</title>
    <desc id="en-core-08-scheduling-preemption-eviction-4-desc">Diagram showing a node taint rejecting pods unless they carry a matching toleration, the three taint effects, common taint use cases, and a worked example where a GPU-tainted node rejects a regular pod but admits a pod with a matching toleration.</desc>
