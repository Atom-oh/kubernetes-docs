<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Hubble UI 서비스 맵</title>
<desc id="d">Hubble UI의 서비스 맵 화면에서 Frontend가 Backend와 정적 자산 CDN으로 요청을 보내고, Backend는 Database와 Redis 캐시를 호출하는 실시간 서비스 의존성 그래프를 보여준다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="960" height="600" fill="#FFFFFF"/>

<!-- Zone: Service Map View -->
<rect x="48" y="100" width="864" height="400" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="424" y="104" width="112" height="12" rx="2" fill="#FFFFFF"/>
<text x="480" y="113" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE MAP VIEW</text>

<!-- Arrows first -->
<!-- Frontend -> Backend (focal flow) -->
<line x1="292" y1="264" x2="388" y2="264" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- Backend -> Database (down-right, upper fan point) -->
<path d="M 532,252 H 600 Q 608,252 608,260 V 296 Q 608,304 616,304 H 660"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Backend -> Redis (down-right, lower fan point) -->
<path d="M 532,276 H 640 Q 648,276 648,284 V 376 Q 648,384 656,384 H 660"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Frontend -> Static Assets (straight down, same x) -->
<line x1="202" y1="296" x2="202" y2="404" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Nodes -->
<!-- Frontend -->
<rect x="112" y="232" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="202" y="258" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Frontend</text>
<text x="202" y="276" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">3 pods</text>

<!-- Backend (focal) -->
<rect x="388" y="232" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="460" y="258" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Backend</text>
<text x="460" y="276" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">5 pods</text>

<!-- Database (store treatment, cylinder cue) -->
<rect x="660" y="272" width="152" height="64" rx="10" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<line x1="660" y1="284" x2="812" y2="284" stroke="#545B64" stroke-width="0.8" opacity="0.5"/>
<text x="736" y="302" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Database</text>
<text x="736" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">2 pods</text>

<!-- Redis -->
<rect x="660" y="352" width="152" height="64" rx="10" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<line x1="660" y1="364" x2="812" y2="364" stroke="#545B64" stroke-width="0.8" opacity="0.5"/>
<text x="736" y="382" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Redis</text>
<text x="736" y="400" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">3 pods</text>

<!-- Static Assets -->
<rect x="112" y="404" width="180" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="202" y="430" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Static Assets</text>
<text x="202" y="448" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CDN</text>

</svg>