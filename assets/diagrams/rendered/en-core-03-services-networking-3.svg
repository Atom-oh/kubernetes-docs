<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mesh-title mesh-desc"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
    <title id="mesh-title">Service Mesh Sidecar Topology</title>
    <desc id="mesh-desc">A control plane configures three sidecar proxies over a dashed control channel; each sidecar exchanges traffic with its own service and with the other two sidecars, so all service-to-service traffic passes through the proxy mesh rather than direct connections.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="196" width="280" height="228" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="128" y="200" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="180" y="209" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE A</text>

    <rect x="332" y="196" width="280" height="228" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="420" y="200" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="472" y="209" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE B</text>

    <rect x="624" y="196" width="280" height="228" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="712" y="200" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="764" y="209" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICE C</text>

    <!-- Dashed control-plane arrows (bidir), fan-attached below the accent IC node -->
    <path d="M435,144 V172 Q435,180 427,180 H254 Q246,180 246,188 V260" fill="none" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <path d="M480,144 V196 Q480,204 488,204 H530 Q538,204 538,212 V260" fill="none" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <path d="M552,144 V220 Q552,228 560,228 H822 Q830,228 830,236 V260" fill="none" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>

    <!-- Service <-> Sidecar (solid bidir, straight, same y=292) -->
    <line x1="164" y1="292" x2="196" y2="292" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <line x1="456" y1="292" x2="488" y2="292" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <line x1="748" y1="292" x2="780" y2="292" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

    <!-- Sidecar mesh (solid bidir): SA<->SB, SB<->SC straight along the row -->
    <line x1="296" y1="292" x2="488" y2="292" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <line x1="588" y1="292" x2="780" y2="292" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

    <!-- SA<->SC (solid bidir), routed below the sidecar row -->
    <path d="M246,324 V344 Q246,352 254,352 H822 Q830,352 830,344 V324" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

    <!-- Arrow labels -->
    <rect x="165" y="270" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="179" y="279" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TLS</text>

    <rect x="386" y="336" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="412" y="345" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">mTLS</text>

    <!-- Node: Istio Control Plane (focal) -->
    <rect x="390" y="80" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="390" y="80" width="180" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="108" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Istio Control Plane</text>
    <text x="480" y="124" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">config · certs</text>

    <!-- Node: Service A -->
    <rect x="64" y="260" width="100" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="260" width="100" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="114" y="288" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service A</text>
    <text x="114" y="304" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app</text>

    <!-- Node: Sidecar Proxy A -->
    <rect x="196" y="260" width="100" height="64" rx="6" fill="#ffffff"/>
    <rect x="196" y="260" width="100" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="246" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Sidecar</text>
    <text x="246" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Proxy A</text>

    <!-- Node: Service B -->
    <rect x="356" y="260" width="100" height="64" rx="6" fill="#ffffff"/>
    <rect x="356" y="260" width="100" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="406" y="288" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service B</text>
    <text x="406" y="304" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app</text>

    <!-- Node: Sidecar Proxy B -->
    <rect x="488" y="260" width="100" height="64" rx="6" fill="#ffffff"/>
    <rect x="488" y="260" width="100" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="538" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Sidecar</text>
    <text x="538" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Proxy B</text>

    <!-- Node: Service C -->
    <rect x="648" y="260" width="100" height="64" rx="6" fill="#ffffff"/>
    <rect x="648" y="260" width="100" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="698" y="288" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service C</text>
    <text x="698" y="304" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app</text>

    <!-- Node: Sidecar Proxy C -->
    <rect x="780" y="260" width="100" height="64" rx="6" fill="#ffffff"/>
    <rect x="780" y="260" width="100" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="830" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Sidecar</text>
    <text x="830" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Proxy C</text>

    <!-- Legend -->
    <line x1="40" y1="452" x2="928" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="468" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="476" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Focal: control plane</text>
    <line x1="300" y1="473" x2="328" y2="473" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <text x="336" y="476" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Data-plane traffic</text>
    <line x1="540" y1="473" x2="568" y2="473" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <text x="576" y="476" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Control-plane config</text>
  </svg>