<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="am-flow-title am-flow-desc">
      <title id="am-flow-title">Prometheus Alert Flow</title>
      <desc id="am-flow-desc">Sequence diagram showing Prometheus evaluating and firing an alert, Alertmanager running it through deduplication, grouping, routing, inhibition and silence checks, then notifying a receiver, which confirms delivery.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Lifelines (drawn first, behind messages/actors) -->
      <line x1="160" y1="76" x2="160" y2="528" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="76" x2="480" y2="528" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="76" x2="800" y2="528" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Messages (arrows before actor boxes so boxes paint on top) -->

      <!-- msg1: P self-loop — Evaluate & wait -->
      <path d="M 160,120 H 216 Q 224,120 224,128 V 136 Q 224,144 216,144 H 160"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="230" y="122" width="132" height="12" rx="2" fill="#ffffff"/>
      <text x="234" y="131" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">EVAL RULES, WAIT 'FOR'</text>

      <!-- msg2: P -> AM solid — send alert -->
      <path d="M 160,180 H 480" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="264" y="164" width="140" height="12" rx="2" fill="#ffffff"/>
      <text x="334" y="173" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">POST /API/V2/ALERTS</text>

      <!-- msg3: AM self — Deduplication -->
      <path d="M 480,216 H 536 Q 544,216 544,224 V 232 Q 544,240 536,240 H 480"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="550" y="218" width="104" height="12" rx="2" fill="#ffffff"/>
      <text x="554" y="227" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">DEDUPLICATION</text>

      <!-- msg4: AM self — Grouping -->
      <path d="M 480,260 H 536 Q 544,260 544,268 V 276 Q 544,284 536,284 H 480"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="550" y="262" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="554" y="271" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">GROUPING</text>

      <!-- msg5: AM self — Routing decision -->
      <path d="M 480,304 H 536 Q 544,304 544,312 V 320 Q 544,328 536,328 H 480"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="550" y="306" width="128" height="12" rx="2" fill="#ffffff"/>
      <text x="554" y="315" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">ROUTING DECISION</text>

      <!-- msg6: AM self — Check inhibition -->
      <path d="M 480,348 H 536 Q 544,348 544,356 V 364 Q 544,372 536,372 H 480"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="550" y="350" width="128" height="12" rx="2" fill="#ffffff"/>
      <text x="554" y="359" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">CHECK INHIBITION</text>

      <!-- msg7: AM self — Check silence -->
      <path d="M 480,392 H 536 Q 544,392 544,400 V 408 Q 544,416 536,416 H 480"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="550" y="394" width="112" height="12" rx="2" fill="#ffffff"/>
      <text x="554" y="403" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">CHECK SILENCE</text>

      <!-- msg8: AM -> R solid accent — send notification (headline) -->
      <path d="M 480,452 H 800" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="580" y="436" width="120" height="12" rx="2" fill="#ffffff"/>
      <text x="640" y="445" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">SEND NOTIFICATION</text>

      <!-- msg9: R -> AM dashed return — send result -->
      <path d="M 800,492 H 480" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="580" y="500" width="120" height="12" rx="2" fill="#ffffff"/>
      <text x="640" y="509" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">SEND RESULT</text>

      <!-- Actor boxes (painted after messages) -->
      <!-- Prometheus -->
      <rect x="90" y="40" width="140" height="36" rx="6" fill="#ffffff"/>
      <rect x="90" y="40" width="140" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="160" y="63" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Prometheus</text>

      <!-- Alertmanager (focal) -->
      <rect x="410" y="40" width="140" height="36" rx="6" fill="rgba(255,153,0,0.10)"/>
      <rect x="410" y="40" width="140" height="36" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="480" y="63" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Alertmanager</text>

      <!-- Receiver -->
      <rect x="722" y="40" width="156" height="36" rx="6" fill="#ffffff"/>
      <rect x="722" y="40" width="156" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="800" y="59" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Receiver</text>
      <text x="800" y="71" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">slack / pagerduty</text>

      <!-- Legend -->
      <line x1="30" y1="552" x2="930" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="30" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="140" y1="564" x2="176" y2="564" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="184" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">CALL</text>
      <line x1="260" y1="564" x2="296" y2="564" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="304" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">RETURN</text>
      <line x1="392" y1="564" x2="428" y2="564" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="436" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">HEADLINE</text>
    </svg>