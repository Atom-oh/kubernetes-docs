<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="argoapp1-title argoapp1-desc">
  <title id="argoapp1-title">ArgoCD 리비전 롤백 시퀀스</title>
  <desc id="argoapp1-desc">사용자가 요청한 이전 리비전 롤백을 ArgoCD가 Git 히스토리에서 조회해 Kubernetes에 적용하되, Git 저장소 자체는 변경하지 않아 다음 동기화에서 최신 상태로 되돌아감을 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Lifelines (drawn first) -->
  <line x1="140" y1="88" x2="140" y2="500" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="88" x2="360" y2="500" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="580" y1="88" x2="580" y2="500" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="800" y1="88" x2="800" y2="500" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Activation bars -->
  <rect x="356" y="140" width="8" height="340" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
  <rect x="576" y="248" width="8" height="44" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
  <rect x="796" y="392" width="8" height="44" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

  <!-- Messages -->
  <!-- m1: User -> ArgoCD -->
  <line x1="140" y1="140" x2="360" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="196" y="120" width="108" height="14" rx="2" fill="#FFFFFF"/>
  <text x="250" y="130" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">롤백 요청 (rev 3)</text>

  <!-- m2: ArgoCD self-loop -->
  <path d="M360,180 H400 V196 H360" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="408" y="180" width="96" height="14" rx="2" fill="#FFFFFF"/>
  <text x="456" y="190" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">리비전 3 조회</text>

  <!-- m3: ArgoCD -> Git -->
  <line x1="360" y1="248" x2="580" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="416" y="228" width="108" height="14" rx="2" fill="#FFFFFF"/>
  <text x="470" y="238" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">매니페스트 조회</text>

  <!-- m4: Git --> ArgoCD (return, dashed) -->
  <line x1="580" y1="292" x2="360" y2="292" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="416" y="272" width="108" height="14" rx="2" fill="#FFFFFF"/>
  <text x="470" y="282" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">이전 매니페스트</text>

  <!-- Note over ArgoCD..Git -->
  <rect x="360" y="316" width="220" height="40" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="470" y="332" fill="#545B64" font-size="9" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">주의: 롤백은 Git을 변경하지 않음</text>
  <text x="470" y="346" fill="#545B64" font-size="9" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">다음 동기화 시 최신 상태로 복구됨</text>

  <!-- m5: ArgoCD -> K8s -->
  <line x1="360" y1="392" x2="800" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="526" y="372" width="108" height="14" rx="2" fill="#FFFFFF"/>
  <text x="580" y="382" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">이전 버전 적용</text>

  <!-- m6: K8s --> ArgoCD (return, dashed) -->
  <line x1="800" y1="436" x2="360" y2="436" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="526" y="416" width="88" height="14" rx="2" fill="#FFFFFF"/>
  <text x="570" y="426" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">적용 완료</text>

  <!-- m7: ArgoCD --> User (headline success, solid accent) -->
  <line x1="360" y1="480" x2="140" y2="480" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="196" y="460" width="88" height="14" rx="2" fill="#FFFFFF"/>
  <text x="240" y="470" fill="#EC7211" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">롤백 성공</text>

  <!-- Actor boxes (drawn after lines so labels stay crisp) -->
  <rect x="70" y="40" width="140" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="140" y="65" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">사용자</text>

  <rect x="290" y="40" width="140" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="360" y="65" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ArgoCD</text>

  <rect x="510" y="40" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="580" y="65" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Git Repo</text>

  <rect x="730" y="40" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="800" y="65" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes</text>

  <!-- Legend -->
  <line x1="60" y1="524" x2="900" y2="524" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="60" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <line x1="220" y1="536" x2="248" y2="536" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="256" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">요청 호출</text>

  <line x1="380" y1="536" x2="408" y2="536" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="416" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">응답 반환</text>

  <line x1="540" y1="536" x2="568" y2="536" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="576" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">최종 성공 응답</text>
</svg>