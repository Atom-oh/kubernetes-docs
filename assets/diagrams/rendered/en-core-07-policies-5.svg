<title id="dtitle">Kubernetes Policy Engines</title>
<desc id="ddesc">Diagram showing how the API server routes admission requests through the Admission Webhook to the OPA Gatekeeper, Kyverno, or Kubewarden policy engines, each of which supports a subset of validate, mutate, and generate policy types.</desc>
