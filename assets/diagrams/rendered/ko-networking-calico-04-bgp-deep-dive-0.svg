<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t0 d0">
<title id="t0">AS 간 BGP 관계: iBGP와 eBGP</title>
<desc id="d0">세 개의 자율 시스템(AS 64512, AS 64513, AS 64514)이 있고, 각 AS 내부 라우터들은 iBGP로, AS 경계를 넘는 라우터끼리는 eBGP로 연결되어 라우팅 정보를 교환하는 모습을 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<text x="32" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BGP BASICS</text>
<text x="32" y="60" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">자율 시스템(AS) 간 BGP 관계</text>

<!-- Outer boundary -->
<rect x="32" y="88" width="896" height="440" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="40" y="96" width="96" height="16" rx="2" fill="#ffffff"/>
<text x="88" y="108" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="0.10em">인터넷 구조</text>

<!-- Zone AS 64512 -->
<rect x="48" y="140" width="240" height="200" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
<rect x="76" y="150" width="96" height="16" rx="2" fill="#ffffff"/>
<text x="124" y="162" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AS 64512</text>

<!-- Zone AS 64513 -->
<rect x="672" y="140" width="240" height="200" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
<rect x="700" y="150" width="96" height="16" rx="2" fill="#ffffff"/>
<text x="748" y="162" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AS 64513</text>

<!-- Zone AS 64514 -->
<rect x="380" y="372" width="200" height="128" rx="8" fill="rgba(255,153,0,0.06)" stroke="rgba(236,114,17,0.45)" stroke-width="0.8"/>
<rect x="428" y="382" width="104" height="16" rx="2" fill="#ffffff"/>
<text x="480" y="394" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AS 64514</text>

<!-- Connectors -->
<!-- R1 <-> R2 iBGP -->
<line x1="168" y1="224" x2="168" y2="284" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<rect x="176" y="248" width="44" height="12" rx="2" fill="#ffffff"/>
<text x="198" y="257" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">iBGP</text>

<!-- R3 <-> R4 iBGP -->
<line x1="792" y1="224" x2="792" y2="284" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<rect x="800" y="248" width="44" height="12" rx="2" fill="#ffffff"/>
<text x="822" y="257" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">iBGP</text>

<!-- R1 <-> R3 eBGP -->
<line x1="208" y1="204" x2="752" y2="204" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<rect x="454" y="184" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="193" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">eBGP</text>

<!-- R2 -> R5 eBGP -->
<path d="M168,324 V392 Q168,400 176,400 H452 Q460,400 460,408 V420"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<rect x="288" y="380" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="314" y="389" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">eBGP</text>

<!-- R4 -> R5 eBGP -->
<path d="M792,324 V392 Q792,400 784,400 H508 Q500,400 500,408 V420"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<rect x="620" y="380" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="646" y="389" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">eBGP</text>

<!-- Nodes -->
<rect x="128" y="184" width="80" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="168" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">라우터 1</text>

<rect x="128" y="284" width="80" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="168" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">라우터 2</text>

<rect x="752" y="184" width="80" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="792" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">라우터 3</text>

<rect x="752" y="284" width="80" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="792" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">라우터 4</text>

<!-- R5: focal (bridges eBGP to both other AS) -->
<rect x="440" y="420" width="80" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="480" y="444" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">라우터 5</text>

<!-- Legend -->
<line x1="32" y1="536" x2="928" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="32" y="554" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="140" y1="550" x2="172" y2="550" stroke="#545B64" stroke-width="1.2"/>
<text x="180" y="554" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">iBGP · 동일 AS 내부</text>
<line x1="400" y1="550" x2="432" y2="550" stroke="#545B64" stroke-width="1.2"/>
<text x="440" y="554" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">eBGP · AS 간 경계</text>
</svg>