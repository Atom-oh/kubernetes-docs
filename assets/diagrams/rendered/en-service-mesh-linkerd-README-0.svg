<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-service-mesh-linkerd-README-0-title en-service-mesh-linkerd-README-0-desc">
<title id="en-service-mesh-linkerd-README-0-title">Linkerd architecture: control plane, data plane, extensions</title>
<desc id="en-service-mesh-linkerd-README-0-desc">Diagram showing how Linkerd's control plane components (Destination, Identity, Proxy Injector) configure and secure the linkerd-proxy sidecars injected into application pods, which exchange traffic over mutual TLS, while the Viz extension observes both proxies.</desc>
<defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
  <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<!-- background -->
<rect width="960" height="600" fill="#ffffff"/>

<!-- ===================== ZONES (bg -> zones -> arrows -> nodes) ===================== -->
<!-- Control Plane zone -->
<rect x="32" y="20" width="228" height="296" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="44" y="24" width="132" height="12" rx="2" fill="#ffffff"/>
<text x="110" y="33" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE</text>

<!-- Data Plane zone -->
<rect x="372" y="20" width="216" height="356" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="424" y="24" width="112" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="33" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA PLANE</text>

<!-- Extensions zone -->
<rect x="700" y="20" width="228" height="296" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="756" y="24" width="116" height="12" rx="2" fill="#ffffff"/>
<text x="814" y="33" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTENSIONS</text>

<!-- ===================== ARROWS (drawn before nodes) ===================== -->

<!-- Proxy Injector -> Pod A (inject) -->
<path d="M240,256 H308 Q316,256 316,248 V120 Q316,112 324,112 H392" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="338" y="92" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="358" y="101" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INJECT</text>

<!-- Proxy Injector -> Pod B (inject) -->
<path d="M240,272 H308 Q316,272 316,264 V258 Q316,250 324,250 H392" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="338" y="230" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="358" y="239" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INJECT</text>

<!-- Pod A -> Destination -->
<path d="M392,88 H240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Pod A -> Identity -->
<path d="M392,152 H340 Q332,152 332,160 V168 Q332,176 324,176 H240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Viz -> Pod A -->
<path d="M724,79 H646 Q638,79 638,87 V92 Q638,100 630,100 H552" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Viz -> Pod B -->
<path d="M724,97 H646 Q638,97 638,105 V272 Q638,280 630,280 H552" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Pod A <-> Pod B mTLS (bidirectional, focal) -->
<path d="M472,172 V232" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>
<rect x="484" y="196" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="504" y="205" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MTLS</text>

