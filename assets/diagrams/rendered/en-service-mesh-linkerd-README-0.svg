<!-- Destination -->
<rect x="60" y="60" width="180" height="56" rx="6" fill="#ffffff"/>
<rect x="60" y="60" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="68" y="66" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="82" y="75" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
<text x="150" y="86" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Destination</text>
<text x="150" y="102" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">service discovery</text>

<!-- Identity -->
<rect x="60" y="148" width="180" height="56" rx="6" fill="#ffffff"/>
<rect x="60" y="148" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="68" y="154" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="82" y="163" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CA</text>
<text x="150" y="174" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Identity</text>
<text x="150" y="190" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">certificate issuance</text>

<!-- Proxy Injector -->
<rect x="60" y="236" width="180" height="56" rx="6" fill="#ffffff"/>
<rect x="60" y="236" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="68" y="242" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="82" y="251" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADM</text>
<text x="150" y="262" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Proxy Injector</text>
<text x="150" y="278" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sidecar injection</text>

<!-- Pod A (focal) -->
<rect x="392" y="52" width="160" height="120" rx="6" fill="rgba(255,153,0,0.10)"/>
<rect x="392" y="52" width="160" height="120" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<rect x="400" y="58" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="416" y="67" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
<text x="472" y="104" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A</text>
<text x="472" y="120" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app + linkerd-proxy</text>
<line x1="404" y1="132" x2="540" y2="132" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="472" y="150" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~10MB · &lt;1ms p99</text>

<!-- Pod B (focal) -->
<rect x="392" y="232" width="160" height="120" rx="6" fill="rgba(255,153,0,0.10)"/>
<rect x="392" y="232" width="160" height="120" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<rect x="400" y="238" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="416" y="247" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
<text x="472" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B</text>
<text x="472" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app + linkerd-proxy</text>
<line x1="404" y1="312" x2="540" y2="312" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="472" y="330" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~10MB · &lt;1ms p99</text>

<!-- Viz -->
<rect x="724" y="60" width="180" height="56" rx="6" fill="#ffffff"/>
<rect x="724" y="60" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="732" y="66" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="746" y="75" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
