<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ko-service-mesh-istio-glossary-2-title ko-service-mesh-istio-glossary-2-desc">
    <title id="ko-service-mesh-istio-glossary-2-title">SigV4 서명 시퀀스</title>
    <desc id="ko-service-mesh-istio-glossary-2-desc">클라이언트의 HTTP 요청을 받은 Envoy Proxy가 AWS Credentials를 로드해 SigV4 서명(HMAC-SHA256)을 생성하고 Authorization 헤더를 추가해 AWS 서비스로 전달하면, AWS가 서명을 검증한 뒤 응답이 Envoy를 거쳐 클라이언트로 돌아오는 흐름을 보여줍니다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="140" y1="104" x2="140" y2="512" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="104" x2="480" y2="512" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="820" y1="104" x2="820" y2="512" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="476" y="136" width="8" height="328" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="816" y="296" width="8" height="116" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- m1: Client -> Envoy -->
    <line x1="140" y1="136" x2="476" y2="136" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="266" y="116" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="310" y="125" text-anchor="middle" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">HTTP 요청</text>

    <!-- m2: self-loop Envoy — AWS Credentials 로드 -->
    <path d="M 484,164 h 28 q 8,0 8,8 v 12 q 0,8 -8,8 h -28" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="528" y="170" width="140" height="16" rx="2" fill="#ffffff"/>
    <text x="536" y="182" text-anchor="start" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.02em">AWS CREDENTIALS 로드</text>

    <!-- m3: self-loop Envoy — SigV4 서명 생성 (focal / accent) -->
    <path d="M 484,224 h 28 q 8,0 8,8 v 12 q 0,8 -8,8 h -28" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="528" y="222" width="140" height="32" rx="2" fill="#ffffff"/>
    <text x="536" y="234" text-anchor="start" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.02em">SigV4 서명 생성</text>
    <text x="536" y="246" text-anchor="start" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.02em">HMAC-SHA256</text>

    <!-- m4: Envoy -> AWS -->
    <line x1="484" y1="296" x2="816" y2="296" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="586" y="264" width="164" height="24" rx="2" fill="#ffffff"/>
    <text x="668" y="276" text-anchor="middle" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.02em">AUTHORIZATION 헤더 추가</text>
    <text x="668" y="286" text-anchor="middle" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.02em">AWS4-HMAC-SHA256</text>

    <!-- m5: self-loop AWS — 서명 검증 -->
    <path d="M 824,332 h 28 q 8,0 8,8 v 12 q 0,8 -8,8 h -28" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="868" y="338" width="80" height="16" rx="2" fill="#ffffff"/>
    <text x="876" y="350" text-anchor="start" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.02em">서명 검증</text>

    <!-- m6: AWS -> Envoy (return, dashed) -->
    <line x1="816" y1="412" x2="484" y2="412" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="626" y="392" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="650" y="401" text-anchor="middle" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">응답</text>

    <!-- m7: Envoy -> Client (return, dashed) -->
    <line x1="476" y1="464" x2="140" y2="464" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="286" y="444" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="310" y="453" text-anchor="middle" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">응답</text>

    <!-- Actor boxes (drawn last, on top) -->
    <!-- Client -->
    <rect x="50" y="40" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="50" y="40" width="180" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="140" y="70" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">클라이언트</text>
    <text x="140" y="88" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">caller</text>

    <!-- Envoy (focal) -->
    <rect x="390" y="40" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="390" y="40" width="180" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="70" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Envoy Proxy</text>
    <text x="480" y="88" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">istio-proxy</text>

    <!-- AWS -->
    <rect x="730" y="40" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="730" y="40" width="180" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="820" y="70" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">AWS 서비스</text>
    <text x="820" y="88" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">S3 · DynamoDB · …</text>

    <!-- Legend -->
    <line x1="50" y1="532" x2="910" y2="532" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="50" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="240" y1="548" x2="264" y2="548" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="272" y="552" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">호출 (call)</text>

    <line x1="416" y1="548" x2="440" y2="548" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="448" y="552" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">응답 (return)</text>

    <circle cx="620" cy="548" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="632" y="552" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">서명 생성 단계 (focal)</text>
  </svg>