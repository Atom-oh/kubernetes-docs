<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tokenbucket-title tokenbucket-desc">
<title id="tokenbucket-title">토큰 버킷 레이트 리미팅</title>
<desc id="tokenbucket-desc">초당 일정량 토큰이 채워지는 버킷에서 요청마다 토큰을 소비하고, 토큰이 없으면 429로 거부하는 토큰 버킷 알고리즘의 동작을 보여준다.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="40" y="52" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ISTIO · RATE LIMITING</text>
<text x="40" y="80" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">토큰 버킷 레이트 리미팅</text>

<!-- ===== Nodes ===== -->
<!-- Refill rectangle top-left, x120-320 y120-168 -->
<rect x="120" y="120" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="220" y="142" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Refill</text>
<text x="220" y="157" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">10 tokens/sec</text>

<!-- Bucket FOCAL, center x600 y=176, w240 h64 -->
<rect x="480" y="144" width="240" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="600" y="170" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Token Bucket</text>
<text x="600" y="188" fill="#EC7211" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">최대: 100 tokens</text>

<!-- Request rectangle, left, x120-320 y252-300 -->
<rect x="120" y="252" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="220" y="280" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">요청 도착</text>

<!-- Check diamond center 600,384 half 80/44 -->
<polygon points="600,340 680,384 600,428 520,384" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="600" y="380" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">토큰</text>
<text x="600" y="394" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">있음?</text>

<!-- Allow rectangle x760-920 y296-352 -->
<rect x="740" y="296" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="830" y="320" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">요청 허용</text>
<text x="830" y="337" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">토큰 1개 소비</text>

<!-- Reject rectangle x740-920 y416-472 -->
<rect x="740" y="416" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="830" y="440" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">요청 거부</text>
<text x="830" y="457" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">429 반환</text>

<!-- ===== Arrows ===== -->
<!-- Refill -.-> Bucket : dashed diagonal-ish, refill right (320,144) to bucket top-left area. Use elbow: right then down -->
<line x1="320" y1="144" x2="476" y2="144" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="360" y="120" width="112" height="12" rx="2" fill="#ffffff"/>
<text x="416" y="129" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.04em" font-family="'Geist Mono', monospace">매초 10개 추가</text>

<!-- Request -> Check : elbow right then down. Request right(320,276) to Check left(520,384) -->
<path d="M 320,276 H 452 Q 460,276 460,284 V 376 Q 460,384 468,384 H 520" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Bucket -> Check : vertical down same x=600 -->
<line x1="600" y1="208" x2="600" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Check -Yes-> Allow : elbow right then up. Check right(680,384) to Allow left(740,324) -->
<path d="M 680,384 H 700 Q 708,384 708,376 V 332 Q 708,324 716,324 H 740" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="686" y="340" width="30" height="12" rx="2" fill="#ffffff"/>
<text x="701" y="349" fill="#EC7211" font-size="8" text-anchor="middle" letter-spacing="0.06em" font-family="'Geist Mono', monospace">Yes</text>

<!-- Check -No-> Reject : elbow right then down. Check right area to Reject left -->
<path d="M 680,384 H 700 Q 708,384 708,392 V 436 Q 708,444 716,444 H 740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="686" y="424" width="24" height="12" rx="2" fill="#ffffff"/>
<text x="698" y="433" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.06em" font-family="'Geist Mono', monospace">No</text>

<!-- Allow -.-> Bucket : dashed, from Allow top up and left into Bucket bottom-right region -->
<path d="M 830,296 V 198 Q 830,190 822,190 H 724" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="754" y="204" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="780" y="213" fill="#7D8998" font-size="8" text-anchor="middle" letter-spacing="0.02em" font-family="'Geist Mono', monospace">토큰 감소</text>

<!-- Legend -->
<line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<circle cx="176" cy="548" r="5" fill="#EC7211"/>
<text x="188" y="552" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Token Bucket (요청 허용 여부를 결정하는 핵심 상태)</text>
<line x1="500" y1="548" x2="524" y2="548" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
<text x="536" y="552" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">토큰 채우기 / 소비 (비동기 상태 갱신)</text>

</svg>
