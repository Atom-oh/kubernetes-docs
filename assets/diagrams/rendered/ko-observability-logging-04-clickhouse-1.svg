<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch-seq-title ch-seq-desc">
    <title id="ch-seq-title">ClickHouse 데이터 흐름</title>
    <desc id="ch-seq-desc">애플리케이션이 생성한 로그가 FluentBit, Kafka를 거쳐 ClickHouse의 MergeTree 테이블에 저장되고, TTL 정책에 따라 일정 시간이 지나면 S3 Cold 스토리지로 이동하는 순서를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines (drawn first, behind everything) -->
    <line x1="88"  y1="96" x2="88"  y2="536" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="284" y1="96" x2="284" y2="536" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="96" x2="480" y2="536" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="676" y1="96" x2="676" y2="536" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="872" y1="96" x2="872" y2="536" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="84"  y="140" width="8" height="24" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="280" y="180" width="8" height="24" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="672" y="220" width="8" height="184" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="0.8"/>
    <rect x="868" y="380" width="8" height="24" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- ============ MESSAGES ============ -->

    <!-- App -> FB : 로그 생성 -->
    <line x1="88" y1="152" x2="280" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="128" y="132" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="184" y="142" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">로그 생성</text>

    <!-- FB -> Kafka : 버퍼링 -->
    <line x1="284" y1="192" x2="480" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="324" y="172" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="380" y="182" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">버퍼링</text>

    <!-- Kafka -> CH : Kafka Engine 수집 (accent, headline) -->
    <line x1="480" y1="232" x2="672" y2="232" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="512" y="212" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="576" y="222" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">KAFKA ENGINE 수집</text>

    <!-- CH self-message: MergeTree 테이블 저장 -->
    <path d="M 680,264 H 756 Q 764,264 764,272 Q 764,280 756,280 H 680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="768" y="266" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="832" y="276" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">MERGETREE 저장</text>

    <!-- Note over CH -->
    <rect x="612" y="316" width="128" height="28" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
    <text x="676" y="334" fill="#545B64" font-size="9" font-family="'Amazon Ember', sans-serif" font-style="italic" text-anchor="middle">TTL 정책에 따라</text>

    <!-- CH -> S3 : Cold 데이터 이동 -->
    <line x1="680" y1="392" x2="868" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="712" y="372" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="782" y="382" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">COLD 데이터 이동</text>

    <!-- ============ ACTOR BOXES (drawn after lifelines/messages) ============ -->

    <!-- App -->
    <rect x="24" y="64" width="128" height="52" rx="6" fill="#ffffff"/>
    <rect x="24" y="64" width="128" height="52" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="88" y="87" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">애플리케이션</text>
    <text x="88" y="103" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">App</text>

    <!-- FluentBit -->
    <rect x="220" y="64" width="128" height="52" rx="6" fill="#ffffff"/>
    <rect x="220" y="64" width="128" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="284" y="87" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">FluentBit</text>
    <text x="284" y="103" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">collector</text>

    <!-- Kafka -->
    <rect x="416" y="64" width="128" height="52" rx="6" fill="#ffffff"/>
    <rect x="416" y="64" width="128" height="52" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <text x="480" y="87" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Kafka</text>
    <text x="480" y="103" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">선택</text>

    <!-- ClickHouse (focal) -->
    <rect x="612" y="64" width="128" height="52" rx="6" fill="#ffffff"/>
    <rect x="612" y="64" width="128" height="52" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="676" y="87" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">ClickHouse</text>
    <text x="676" y="103" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CH</text>

    <!-- S3 -->
    <rect x="808" y="64" width="128" height="52" rx="6" fill="#ffffff"/>
    <rect x="808" y="64" width="128" height="52" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="872" y="87" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">S3</text>
    <text x="872" y="103" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cold</text>

    <!-- Legend -->
    <line x1="24" y1="560" x2="936" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <circle cx="32" cy="578" r="3.5" fill="none" stroke="#545B64" stroke-width="1.2"/>
    <text x="42" y="582" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">동기 호출</text>
    <circle cx="180" cy="578" r="3.5" fill="none" stroke="#EC7211" stroke-width="1.4"/>
    <text x="190" y="582" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">핵심 수집 경로</text>
  </svg>