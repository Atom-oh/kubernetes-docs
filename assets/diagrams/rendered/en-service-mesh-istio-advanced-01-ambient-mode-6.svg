<title id="en-service-mesh-istio-advanced-01-ambient-mode-6-title">Ambient mode traffic flow, L4 and L7</title>
<desc id="en-service-mesh-istio-advanced-01-ambient-mode-6-desc">Sequence diagram tracing a request from an unsidecarred client app through client and server ztunnels for the plain L4 path, and, in an optional branch, through a waypoint proxy for L7 routing before reaching the server app.</desc>
