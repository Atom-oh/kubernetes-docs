<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Kubernetes Authentication Flow</title>
<desc id="d">A user or service sends an authentication request to the API server, which checks it against one of five supported methods, then routes the outcome to either authorization or request denial.</desc>
<rect width="960" height="600" fill="#ffffff"/>

<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<text x="40" y="34" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CORE · SECURITY</text>
<text x="40" y="58" fill="#232F3E" font-size="20" font-weight="700">Authentication Flow</text>

<!-- ===== Arrows (drawn before nodes) ===== -->
<line x1="480" y1="88" x2="480" y2="132" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="180" x2="480" y2="224" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="480" y1="336" x2="480" y2="372" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 447,420 V 444 Q 447,452 439,452 H 288 Q 280,452 280,460 V 464" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 513,420 V 444 Q 513,452 521,452 H 672 Q 680,452 680,460 V 464" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Arrow labels -->
<rect x="452" y="98" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="107" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text>

<rect x="452" y="190" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="199" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">VALIDATE</text>

<rect x="452" y="346" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="355" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">OUTCOME</text>

<rect x="322" y="426" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="350" y="435" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SUCCESS</text>

<rect x="608" y="426" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="632" y="435" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">FAILURE</text>

<!-- ===== Nodes ===== -->
<g>
<!-- User -->
<rect x="380" y="40" width="200" height="48" rx="6" fill="#ffffff"/>
<rect x="380" y="40" width="200" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="480" y="60" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">User / Service</text>
<text x="480" y="76" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">client, kubelet</text>

<!-- API (focal) -->
<rect x="380" y="132" width="200" height="48" rx="6" fill="#ffffff"/>
<rect x="380" y="132" width="200" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="480" y="152" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API Server</text>
<text x="480" y="168" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">checks each method</text>

<!-- Methods box -->
<rect x="260" y="224" width="440" height="112" rx="6" fill="#ffffff"/>
<rect x="260" y="224" width="440" height="112" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="246" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Authentication Methods</text>
<text x="330" y="266" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">X.509 CERTS</text>
<text x="330" y="284" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">SA TOKENS</text>
<text x="330" y="302" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">OIDC</text>
<text x="630" y="266" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">WEBHOOK TOKEN</text>
<text x="630" y="284" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">AUTH PROXY</text>

<!-- Result -->
<rect x="380" y="372" width="200" height="48" rx="6" fill="#ffffff"/>
<rect x="380" y="372" width="200" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="480" y="392" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Authentication Result</text>
<text x="480" y="408" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">success or failure</text>

<!-- Authorize -->
<rect x="180" y="464" width="200" height="48" rx="6" fill="#ffffff"/>
<rect x="180" y="464" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="280" y="484" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Move to Authorization</text>
<text x="280" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">next stage</text>

<!-- Reject -->
<rect x="580" y="464" width="200" height="48" rx="6" fill="#ffffff"/>
<rect x="580" y="464" width="200" height="48" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="680" y="484" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Request Denied</text>
<text x="680" y="500" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">401 unauthorized</text>
</g>
</svg>