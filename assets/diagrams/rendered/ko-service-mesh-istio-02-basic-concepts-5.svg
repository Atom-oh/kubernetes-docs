<text x="480.0" y="110.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">마이크로서비스 과제</text>
<text x="480.0" y="124.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">트래픽 관리 · 보안</text>
<text x="480.0" y="138.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">관찰성 · 복원력</text>
<rect x="140" y="340" width="260" height="128" rx="6" fill="#ffffff"/>
<rect x="140" y="340" width="260" height="128" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="270.0" y="390.0" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Istio 없이 대응</text>
<text x="270.0" y="404.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">코드에 직접 구현</text>
<text x="270.0" y="418.0" fill="#545B64" font-size="9" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">서비스마다 중복 · 비일관</text>
<rect x="560" y="340" width="260" height="128" rx="6" fill="#ffffff"/>
