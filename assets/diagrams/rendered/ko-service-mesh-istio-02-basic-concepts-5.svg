<rect x="344.5" y="244" width="41" height="12" rx="2" fill="#ffffff"/>
<text x="365" y="253" fill="#545B64" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">기존 방식</text>

<path d="M 500,188 V 256.0 Q 500,264.0 508,264.0 H 682 Q 690,264.0 690,272.0 V 340" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="574.5" y="244" width="41" height="12" rx="2" fill="#ffffff"/>
<text x="595" y="253" fill="#EC7211" font-size="8" font-family="'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ISTIO</text>

