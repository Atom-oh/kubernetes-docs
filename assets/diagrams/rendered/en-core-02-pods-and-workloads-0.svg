<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs>
  <title id="dtitle">Anatomy of a Pod</title>
  <desc id="ddesc">A Kubernetes Pod boundary sharing one network identity across an application container, a sidecar container, and an init container, plus four kinds of mountable storage volumes.</desc>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="40" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.18em">KUBERNETES / CORE CONCEPTS</text>
  <text x="40" y="68" fill="#232F3E" font-size="28" font-weight="700" class="sans">Anatomy of a Pod</text>

  <!-- Pod boundary -->
  <rect x="40" y="104" width="880" height="472" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="52" y="100" width="60" height="14" rx="2" fill="#ffffff"/>
  <text x="82" y="111" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em" text-anchor="middle">POD</text>

  <!-- Zone: Network -->
  <rect x="64" y="132" width="832" height="88" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="76" y="128" width="272" height="14" rx="2" fill="#ffffff"/>
  <text x="212" y="139" fill="rgba(35,47,62,0.45)" font-size="7" class="mono" letter-spacing="0.14em" text-anchor="middle">NETWORK — SHARED BY ALL CONTAINERS</text>

  <!-- Network node: Pod IP -->
  <rect x="268" y="176" width="200" height="40" rx="6" fill="#ffffff"/>
  <rect x="268" y="176" width="200" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="368" y="200" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">Pod IP Address</text>

  <!-- Network node: Network Namespace -->
  <rect x="492" y="176" width="200" height="40" rx="6" fill="#ffffff"/>
  <rect x="492" y="176" width="200" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="592" y="200" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">Network Namespace</text>

  <!-- Zone: Containers -->
  <rect x="64" y="236" width="520" height="336" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="76" y="232" width="88" height="14" rx="2" fill="#ffffff"/>
  <text x="120" y="243" fill="rgba(35,47,62,0.45)" font-size="7" class="mono" letter-spacing="0.14em" text-anchor="middle">CONTAINERS</text>

  <!-- Container: Application (focal) -->
  <rect x="84" y="264" width="480" height="80" rx="6" fill="#ffffff"/>
  <rect x="84" y="264" width="480" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="324" y="298" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">Application Container</text>
  <text x="324" y="316" fill="#545B64" font-size="9" class="mono" text-anchor="middle" letter-spacing="0.04em">PORT 8080</text>

  <!-- Container: Sidecar -->
  <rect x="84" y="368" width="480" height="80" rx="6" fill="#ffffff"/>
  <rect x="84" y="368" width="480" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="324" y="402" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">Sidecar Container</text>
  <text x="324" y="420" fill="#545B64" font-size="9" class="mono" text-anchor="middle" letter-spacing="0.04em">PORT 9090</text>

  <!-- Container: Init -->
  <rect x="84" y="472" width="480" height="80" rx="6" fill="#ffffff"/>
  <rect x="84" y="472" width="480" height="80" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="324" y="506" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">Init Container</text>
  <text x="324" y="524" fill="#545B64" font-size="9" class="mono" text-anchor="middle" letter-spacing="0.04em">RUNS ONCE BEFORE APP STARTS</text>

  <!-- Zone: Storage -->
  <rect x="600" y="236" width="296" height="336" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="612" y="232" width="120" height="14" rx="2" fill="#ffffff"/>
  <text x="672" y="243" fill="rgba(35,47,62,0.45)" font-size="7" class="mono" letter-spacing="0.14em" text-anchor="middle">STORAGE VOLUMES</text>

  <!-- Storage: emptyDir -->
  <rect x="620" y="274" width="256" height="52" rx="6" fill="#ffffff"/>
  <rect x="620" y="274" width="256" height="52" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="748" y="296" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">emptyDir Volume</text>
  <text x="748" y="312" fill="#7D8998" font-size="9" class="mono" text-anchor="middle">ephemeral, node-local</text>

  <!-- Storage: configMap -->
  <rect x="620" y="346" width="256" height="52" rx="6" fill="#ffffff"/>
  <rect x="620" y="346" width="256" height="52" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="748" y="368" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">configMap Volume</text>
  <text x="748" y="384" fill="#7D8998" font-size="9" class="mono" text-anchor="middle">config data</text>

  <!-- Storage: secret -->
  <rect x="620" y="418" width="256" height="52" rx="6" fill="#ffffff"/>
  <rect x="620" y="418" width="256" height="52" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="748" y="440" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">secret Volume</text>
  <text x="748" y="456" fill="#7D8998" font-size="9" class="mono" text-anchor="middle">sensitive data</text>

  <!-- Storage: PVC -->
  <rect x="620" y="490" width="256" height="52" rx="6" fill="#ffffff"/>
  <rect x="620" y="490" width="256" height="52" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="748" y="512" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">persistentVolumeClaim</text>
  <text x="748" y="528" fill="#7D8998" font-size="9" class="mono" text-anchor="middle">durable storage</text>

</svg>