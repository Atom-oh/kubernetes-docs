<title id="en-core-11-extending-kubernetes-6-title">Extension feature architecture in Amazon EKS</title>
<desc id="en-core-11-extending-kubernetes-6-desc">Architecture diagram showing the Amazon EKS cluster managing its control plane and node groups, the control plane running managed add-ons (VPC CNI, CoreDNS, kube-proxy, EBS CSI driver, and the AWS Load Balancer Controller) that integrate with AWS VPC, EBS, and Elastic Load Balancing, plus IAM roles for service accounts and AWS Controllers for Kubernetes as additional AWS integration points.</desc>
