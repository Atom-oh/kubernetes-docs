<title id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-0-title">Istio 아키텍처: 사이드카와 통합 컨트롤 플레인</title>
<desc id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-0-desc">Kubernetes 클러스터 안에서 Istiod가 모든 파드의 Envoy 사이드카에 xDS 설정을 배포하고, frontend와 backend 파드가 사이드카를 거쳐 mTLS로 통신하며, 각 사이드카가 Prometheus·Jaeger·Kiali로 메트릭과 트레이스를 보내는 구조를 보여준다.</desc>
