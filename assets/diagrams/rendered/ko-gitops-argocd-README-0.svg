<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="argocd-arch-title argocd-arch-desc">
    <title id="argocd-arch-title">ArgoCD 아키텍처</title>
    <desc id="argocd-arch-desc">외부 저장소와 인증 시스템이 ArgoCD의 API 서버·리포 서버·애플리케이션 컨트롤러를 거쳐 여러 Kubernetes 클러스터로 동기화되는 구조를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545b64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ec7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ ARROWS (behind boxes) ============ -->

    <!-- Sources -> RepoServer (straight, y=96) -->
    <line x1="184" y1="96" x2="232" y2="96" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- RepoServer -> Redis (straight vertical) -->
    <line x1="304" y1="128" x2="304" y2="224" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- RepoServer -> Controller (straight, y=84) -->
    <line x1="376" y1="84" x2="424" y2="84" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Notifications/AppSet -> Controller (straight vertical, x=504) -->
    <line x1="504" y1="224" x2="504" y2="128" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Controller -> Clusters (accent headline flow, straight, y=96) -->
    <line x1="584" y1="96" x2="816" y2="96" stroke="#ec7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- IDP -> Dex (straight vertical, x=112) -->
    <line x1="112" y1="224" x2="112" y2="384" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Dex -> API (elbow: right, down, right into API left edge y=500) -->
    <path d="M 184,416 H 312 Q 320,416 320,424 V 492 Q 320,500 328,500 H 328"
          fill="none" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- WebUI/CLI -> API (elbow: down, left into API right edge y=524) -->
    <path d="M 696,448 V 516 Q 696,524 688,524 H 488"
          fill="none" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Controller -> API (elbow: left edge out, down below RepoServer row, left corridor x=208, down, right into API top edge x=400) -->
    <path d="M 424,112 H 400 Q 392,112 392,120 V 140 H 216 Q 208,140 208,148 V 456 Q 208,464 216,464 H 392 Q 400,464 400,472 V 480"
          fill="none" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ============ ZONE: external ============ -->
    <rect x="24" y="28" width="176" height="252" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="60" y="32" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="112" y="41" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">외부 시스템</text>

    <!-- ============ ZONE: clusters ============ -->
    <rect x="792" y="28" width="168" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="822" y="32" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="876" y="41" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">배포 대상</text>

    <!-- ============ NODES ============ -->

    <!-- Sources: Git / Helm / OCI -->
    <rect x="40" y="64" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="64" width="144" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="112" y="90" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Git·Helm·OCI</text>
    <text x="112" y="106" fill="#545b64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">소스 저장소</text>

    <!-- IDP -->
    <rect x="40" y="192" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="192" width="144" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="112" y="218" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Identity</text>
    <text x="112" y="234" fill="#545b64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Provider</text>

    <!-- Dex -->
    <rect x="40" y="352" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="352" width="144" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="112" y="378" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Dex</text>
    <text x="112" y="394" fill="#545b64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SSO (optional)</text>

    <!-- WebUI/CLI -->
    <rect x="624" y="384" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="624" y="384" width="144" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7d8998" stroke-width="1"/>
    <text x="696" y="410" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Web UI · CLI</text>
    <text x="696" y="426" fill="#545b64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">interface</text>

    <!-- RepoServer -->
    <rect x="232" y="64" width="144" height="64" rx="6" fill="#ffffff" stroke="#232f3e" stroke-width="1"/>
    <text x="304" y="90" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Repo Server</text>
    <text x="304" y="106" fill="#545b64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">렌더링</text>

    <!-- Redis -->
    <rect x="232" y="224" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="232" y="224" width="144" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545b64" stroke-width="1"/>
    <text x="304" y="250" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Redis Cache</text>
    <text x="304" y="266" fill="#545b64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">store</text>

    <!-- Controller (focal) -->
    <rect x="424" y="64" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="424" y="64" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#ec7211" stroke-width="1"/>
    <text x="504" y="90" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    <text x="504" y="106" fill="#ec7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Controller</text>

    <!-- Notifications/AppSet -->
    <rect x="424" y="224" width="160" height="64" rx="6" fill="#ffffff"/>
    <rect x="424" y="224" width="160" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="504" y="250" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Notifications ·</text>
    <text x="504" y="266" fill="#545b64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ApplicationSet</text>

    <!-- API Server -->
    <rect x="328" y="480" width="160" height="64" rx="6" fill="#ffffff" stroke="#232f3e" stroke-width="1"/>
    <text x="408" y="506" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Server</text>
    <text x="408" y="522" fill="#545b64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">control plane</text>

    <!-- Clusters -->
    <rect x="816" y="64" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="816" y="64" width="144" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="888" y="90" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes</text>
    <text x="888" y="106" fill="#545b64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Clusters ×N</text>

    <!-- ============ ARROW LABELS ============ -->
    <rect x="192" y="76" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="208" y="85" fill="#545b64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FETCH</text>

    <rect x="662" y="76" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="688" y="85" fill="#ec7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">동기화</text>

    <!-- ============ LEGEND ============ -->
    <line x1="24" y1="562" x2="936" y2="562" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="24" y="574" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#ec7211" stroke-width="1"/>
    <text x="44" y="583" fill="#545b64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">핵심 컨트롤러</text>

    <rect x="176" y="574" width="14" height="10" rx="2" fill="#ffffff" stroke="#232f3e" stroke-width="1"/>
    <text x="196" y="583" fill="#545b64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Core 컴포넌트</text>

    <rect x="332" y="574" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="352" y="583" fill="#545b64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">선택적 컴포넌트</text>

    <rect x="500" y="574" width="14" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="520" y="583" fill="#545b64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">외부 / 클러스터</text>

    <line x1="668" y1="580" x2="696" y2="580" stroke="#ec7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="704" y="583" fill="#545b64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">동기화 흐름</text>
  </svg>