<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="latticearch-title latticearch-desc">
<title id="latticearch-title">VPC Lattice architecture</title>
<desc id="latticearch-desc">Architecture diagram showing compute across an EKS pod, an ECS task, a Lambda function, and an EC2 instance all associating with a single AWS-managed VPC Lattice service network, which routes through services and target groups without any sidecar proxy.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zones -->
<rect x="40" y="40" width="880" height="136" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="424" y="44" width="144" height="12" rx="2" fill="#ffffff"/>
<text x="496" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">AWS ACCOUNT · VPC 1-3</text>

<rect x="40" y="232" width="880" height="136" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="404" y="236" width="152" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="245" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">VPC LATTICE (AWS MANAGED)</text>

<!-- Arrows behind nodes -->
<!-- Frontend -> Service Network (PrivateLink) -->
<path d="M 168,152 V 256 Q 168,264 176,264 H 232 Q 240,264 240,272 V 280" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<!-- Service Network -> Services -->
<line x1="340" y1="304" x2="380" y2="304" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Services -> Target Groups -->
<line x1="560" y1="304" x2="600" y2="304" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Target Groups -> ECS / Lambda / EC2 (fanned, staggered bends) -->
<path d="M 640,280 V 224 Q 640,216 632,216 H 384 Q 376,216 376,208 V 152" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 700,280 V 208 Q 700,200 692,200 H 592 Q 584,200 584,192 V 152" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 760,280 V 192 Q 760,184 768,184 H 784 Q 792,184 792,176 V 152" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- VPC association (merged, dashed, from the account boundary) -->
<line x1="260" y1="176" x2="260" y2="280" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Arrow labels -->
<rect x="176" y="244" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="208" y="253" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PRIVATELINK</text>

<rect x="272" y="220" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="304" y="229" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">VPC ASSOC</text>

<!-- Compute nodes (single row) -->
<rect x="80" y="104" width="176" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="88" y="112" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="103" y="121" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">EKS</text>
<text x="168" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Frontend Pod</text>
<text x="168" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">no sidecar</text>

<rect x="288" y="104" width="176" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="296" y="112" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="311" y="121" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">ECS</text>
<text x="376" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ECS Task</text>
<text x="376" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">backend service</text>

<rect x="496" y="104" width="176" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="504" y="112" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="521" y="121" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">LMB</text>
<text x="584" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Lambda Function</text>
<text x="584" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">payment service</text>

<rect x="704" y="104" width="176" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="712" y="112" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="727" y="121" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">EC2</text>
<text x="792" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EC2 Instance</text>
<text x="792" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">legacy service</text>

<!-- Service Network (focal) -->
<rect x="140" y="280" width="200" height="48" rx="6" fill="#ffffff"/>
<rect x="140" y="280" width="200" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<rect x="148" y="288" width="26" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="161" y="297" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SN</text>
<text x="252" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service Network</text>

<!-- Services A/B merged -->
<rect x="380" y="280" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="388" y="288" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="403" y="297" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
<text x="470" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Services A / B</text>

<!-- Target Groups merged -->
<rect x="600" y="280" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="608" y="288" width="26" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="621" y="297" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">TG</text>
<text x="700" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Target Groups</text>

<!-- Legend -->
<line x1="40" y1="420" x2="920" y2="420" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="436" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="448" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="60" y="456" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Service network (focal)</text>
<rect x="260" y="448" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="280" y="456" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Compute / lattice resource</text>
<line x1="520" y1="454" x2="548" y2="454" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="556" y="456" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">PrivateLink data path</text>
<line x1="740" y1="454" x2="768" y2="454" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="776" y="456" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">VPC association</text>
</svg>