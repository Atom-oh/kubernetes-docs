<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="otel-arch-title otel-arch-desc">
    <title id="otel-arch-title">OpenTelemetry Collector pipeline architecture</title>
    <desc id="otel-arch-desc">The OpenTelemetry Collector ingests through receivers such as OTLP, filelog, and k8s events, transforms the data with batching, memory-limiting, and Kubernetes-attribute processors, then ships it through exporters including Loki, OTLP HTTP, and debug output.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ ZONE ============ -->
    <rect x="24" y="220" width="912" height="216" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="400" y="224" width="160" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="233" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">COLLECTOR PIPELINE</text>

    <!-- ============ ARROWS ============ -->
    <line x1="332" y1="336" x2="356" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="628" y1="336" x2="652" y2="336" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ============ NODES ============ -->

    <!-- Receivers -->
    <rect x="20" y="272" width="312" height="128" rx="6" fill="#ffffff"/>
    <rect x="20" y="272" width="312" height="128" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="176" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Receivers</text>
    <text x="176" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">otlp &#183; filelog</text>
    <text x="176" y="336" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">k8sevents &#183; syslog</text>

    <!-- Processors (focal) -->
    <rect x="356" y="272" width="272" height="128" rx="6" fill="#ffffff"/>
    <rect x="356" y="272" width="272" height="128" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="492" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Processors</text>
    <text x="492" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">batch &#183; memory_limiter</text>
    <text x="492" y="336" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">k8sattributes &#183; filter &#183; transform</text>

    <!-- Exporters -->
    <rect x="652" y="272" width="288" height="128" rx="6" fill="#ffffff"/>
    <rect x="652" y="272" width="288" height="128" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="796" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Exporters</text>
    <text x="796" y="320" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">loki &#183; otlphttp &#183; debug</text>
  </svg>