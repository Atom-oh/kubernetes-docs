<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
<title id="t1">사이드카 메시에서 Cilium으로의 3단계 마이그레이션 전략</title>
<desc id="d1">Istio/Linkerd 같은 사이드카 메시에서 Cilium 서비스 메시로 전환하는 3단계 전략. Phase 1은 Cilium CNI를 기존 CNI와 공존시켜 테스트하고, Phase 2는 네임스페이스별로 사이드카를 비활성화하며 Cilium L7 정책을 점진적으로 적용하고, Phase 3에서 모든 워크로드를 전환한 뒤 기존 메시를 제거하고 정리한다.</desc>
<defs>
  <style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");
    text { font-family: 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', 'Amazon Ember Mono', ui-monospace, monospace; }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="48" y="48" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7D8998">MIGRATION PLAYBOOK</text>
<text x="48" y="80" font-size="24" font-weight="700" fill="#232F3E">사이드카 메시 → Cilium 마이그레이션</text>

<!-- Connector: box1 -> box2 (straight, same x) -->
<line x1="480" y1="248" x2="480" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Connector: box2 -> box3 -->
<line x1="480" y1="408" x2="480" y2="440" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Phase 1 box -->
<rect x="160" y="120" width="640" height="128" rx="8" fill="#ffffff"/>
<rect x="160" y="120" width="640" height="128" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="184" y="144" class="mono" font-size="8" font-weight="600" letter-spacing="0.14em" fill="#7D8998">PHASE 1 · 준비</text>
<text x="184" y="168" font-size="14" font-weight="700" fill="#232F3E">Cilium CNI 도입과 병행 검증</text>
<text x="184" y="190" font-size="11" fill="#545B64">1. Cilium CNI 설치</text>
<text x="184" y="209" font-size="11" fill="#545B64">2. 기존 CNI와 공존</text>
<text x="184" y="228" font-size="11" fill="#545B64">3. 테스트 워크로드로 검증</text>

<!-- Phase 2 box -->
<rect x="160" y="280" width="640" height="128" rx="8" fill="#ffffff"/>
<rect x="160" y="280" width="640" height="128" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="184" y="304" class="mono" font-size="8" font-weight="600" letter-spacing="0.14em" fill="#7D8998">PHASE 2 · 점진적 전환</text>
<text x="184" y="328" font-size="14" font-weight="700" fill="#232F3E">네임스페이스 단위 단계적 이관</text>
<text x="184" y="350" font-size="11" fill="#545B64">1. 네임스페이스별 전환</text>
<text x="184" y="369" font-size="11" fill="#545B64">2. 사이드카 인젝션 비활성화</text>
<text x="184" y="388" font-size="11" fill="#545B64">3. Cilium L7 정책 적용</text>

<!-- Phase 3 box (focal) -->
<rect x="160" y="440" width="640" height="128" rx="8" fill="#ffffff"/>
<rect x="160" y="440" width="640" height="128" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="184" y="464" class="mono" font-size="8" font-weight="600" letter-spacing="0.14em" fill="#EC7211">PHASE 3 · 완전 전환</text>
<text x="184" y="488" font-size="14" font-weight="700" fill="#232F3E">사이드카 메시 완전 제거</text>
<text x="184" y="510" font-size="11" fill="#545B64">1. 모든 워크로드 전환</text>
<text x="184" y="529" font-size="11" fill="#545B64">2. Istio/Linkerd 제거</text>
<text x="184" y="548" font-size="11" fill="#545B64">3. 정리 및 최적화</text>

</svg>