<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="life-title life-desc">
    <title id="life-title">Storage lifecycle practices</title>
    <desc id="life-desc">Diagram showing five storage lifecycle phases — planning, implementation, operation, optimization, decommission — where the first four each drive a matching three-step practice (requirements through capacity planning, Terraform through GitOps, backups through Velero, performance through autoscaling review), and decommissioning stands alone with no defined workflow.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Column eyebrows -->
    <text x="40" y="60" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LIFECYCLE PHASE</text>
    <text x="440" y="60" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PRACTICE (3 STEPS, IN ORDER)</text>

    <!-- Arrows (drawn before boxes); rows centers: r1=120 r2=216 r3=312 r4=408; col1 right edge x=320 col2 left edge x=440 -->
    <line x1="320" y1="120" x2="440" y2="120" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="320" y1="216" x2="440" y2="216" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="320" y1="312" x2="440" y2="312" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="320" y1="408" x2="440" y2="408" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Nodes: col1 Phase -->
    <rect x="40" y="88" width="280" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="114" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Planning Phase</text>
    <text x="180" y="130" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 of 5</text>

    <rect x="40" y="184" width="280" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="210" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Implementation Phase</text>
    <text x="180" y="226" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2 of 5</text>

    <rect x="40" y="280" width="280" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="306" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Operation Phase</text>
    <text x="180" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 of 5</text>

    <rect x="40" y="376" width="280" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="402" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Optimization Phase</text>
    <text x="180" y="418" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 of 5</text>

    <rect x="40" y="472" width="280" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="180" y="498" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Decommission Phase</text>
    <text x="180" y="514" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 of 5 · no defined workflow</text>

    <!-- Nodes: col2 Practice -->
    <rect x="440" y="88" width="480" height="64" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="680" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Planning &amp; Design</text>
    <text x="680" y="130" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Requirements → Storage Selection → Capacity Planning</text>

    <rect x="440" y="184" width="480" height="64" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="680" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Automation &amp; IaC</text>
    <text x="680" y="226" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Terraform/CFN → Helm → GitOps</text>

    <rect x="440" y="280" width="480" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="680" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Backup &amp; Disaster Recovery</text>
    <text x="680" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Regular Backups → DR Plan → Velero</text>

    <rect x="440" y="376" width="480" height="64" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="680" y="400" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Performance &amp; Cost Review</text>
    <text x="680" y="418" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Perf Review → Cost Review → Auto Scaling</text>

    <!-- Legend -->
    <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="576" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="130" y="569" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="150" y="577" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">HIGHEST-STAKES PRACTICE</text>
    <rect x="380" y="569" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="400" y="577" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">NO MATCHING PRACTICE IN SOURCE</text>
  </svg>