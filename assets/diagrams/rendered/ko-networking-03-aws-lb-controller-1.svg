<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="albc-seq-title albc-seq-desc">
    <title id="albc-seq-title">Load Balancer 프로비저닝 시퀀스</title>
    <desc id="albc-seq-desc">사용자가 Ingress/Service를 생성하면 LB Controller가 Kubernetes API 변경을 감지해 AWS API로 ALB/NLB와 Target Group을 생성하고, 그 결과를 다시 Kubernetes API를 통해 사용자에게 DNS로 돌려주는 과정을 시간 순으로 보여준다.</desc>

    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ============ ACTORS ============ -->
    <!-- User: x=88 / K8sAPI: x=280 / CTRL: x=472 / AWS: x=664 / ALB: x=856 -->

    <rect x="24" y="24" width="128" height="48" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="88" y="52" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">User</text>

    <rect x="216" y="24" width="128" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="280" y="46" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes</text>
    <text x="280" y="60" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">API</text>

    <rect x="408" y="24" width="128" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="472" y="46" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">LB</text>
    <text x="472" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Controller</text>

    <rect x="600" y="24" width="128" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="664" y="52" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS API</text>

    <rect x="792" y="24" width="128" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="856" y="46" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ALB/NLB</text>
    <text x="856" y="60" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">target</text>

    <!-- Lifelines -->
    <line x1="88"  y1="72" x2="88"  y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="280" y1="72" x2="280" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="472" y1="72" x2="472" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="664" y1="72" x2="664" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="856" y1="72" x2="856" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ============ ACTIVATION BARS ============ -->
    <!-- CTRL is busy through most of the exchange -->
    <rect x="468" y="112" width="8" height="384" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <!-- AWS API active while servicing CTRL's requests -->
    <rect x="660" y="176" width="8" height="256" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- ============ MESSAGES (time flows top -> down) ============ -->

    <!-- 1. User -> K8sAPI : Ingress/Service 생성 -->
    <path d="M88,104 H280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="130" y="88" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="184" y="97" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">CREATE INGRESS</text>

    <!-- 2. K8sAPI -> CTRL : Watch 이벤트 -->
    <path d="M280,144 H468" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="322" y="128" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="374" y="137" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">WATCH EVENT</text>

    <!-- 3. CTRL self-message : 리소스 분석 (small U-loop) -->
    <path d="M476,176 H500 Q508,176 508,184 Q508,192 500,192 H476"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="512" y="178" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="548" y="187" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">ANALYZE</text>

    <!-- 4. CTRL -> AWS : Load Balancer 생성 요청 (headline / accent) -->
    <path d="M476,224 H660" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="512" y="208" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="568" y="217" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">CREATE LB REQ</text>

    <!-- 5. AWS -> ALB : ALB/NLB 프로비저닝 -->
    <path d="M668,256 H856" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="712" y="240" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="762" y="249" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">PROVISION</text>

    <!-- 6. AWS --> CTRL : ARN 반환 (return: dashed + filled marker) -->
    <path d="M660,296 H476" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="512" y="280" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="560" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">ARN RETURN</text>

    <!-- 7. CTRL -> AWS : Target Group 생성 -->
    <path d="M476,336 H660" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="512" y="320" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="568" y="329" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">CREATE TG</text>

    <!-- 8. CTRL -> AWS : Listener 규칙 설정 -->
    <path d="M476,368 H660" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="512" y="352" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="568" y="361" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">SET LISTENER</text>

    <!-- 9. CTRL -> K8sAPI : Status 업데이트 -->
    <path d="M468,408 H280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="322" y="392" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="374" y="401" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">STATUS UPDATE</text>

    <!-- 10. K8sAPI --> User : Load Balancer DNS 제공 (return: dashed + filled marker) -->
    <path d="M280,456 H88" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="130" y="440" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="184" y="449" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">DNS RETURN</text>

    <!-- Note over CTRL,AWS : Pod 변경 시 Target 자동 등록/해제 -->
    <rect x="468" y="496" width="200" height="36" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="568" y="511" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.01em">POD 변경 시 TARGET</text>
    <text x="568" y="523" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.01em">자동 등록 / 해제</text>

    <!-- ============ LEGEND ============ -->
    <line x1="30" y1="560" x2="930" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="578" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="200" y1="575" x2="228" y2="575" stroke="#545B64" stroke-width="1.2"/>
    <text x="236" y="578" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">호출 (Call)</text>

    <line x1="380" y1="575" x2="408" y2="575" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="416" y="578" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">응답 (Return)</text>

    <line x1="560" y1="575" x2="588" y2="575" stroke="#EC7211" stroke-width="1.2"/>
    <text x="596" y="578" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">핵심 요청</text>

  </svg>