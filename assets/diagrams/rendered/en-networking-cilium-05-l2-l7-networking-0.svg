<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">OSI model layers mapped to Cilium policy enforcement</title>
  <desc id="ddesc">A six-row layer stack from Application down to Physical, showing each layer's data unit and addressing scheme, with the three layers Cilium can enforce network policy at — L7 (HTTP, gRPC, Kafka), L4 (port, protocol), and L3 (IP, CIDR) — tagged; L7 is highlighted as this guide's focus.</desc>

  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs><defs>
    <clipPath id="stackClip">
      <rect x="64" y="112" width="832" height="384" rx="8"/>
    </clipPath>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="64" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">OSI MODEL &#183; CILIUM ENFORCEMENT</text>
  <text x="64" y="64" fill="#232F3E" font-size="28" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Where Cilium Enforces Policy</text>
  <text x="64" y="86" fill="#545B64" font-size="14" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Each layer's data unit and addressing, with the layers Cilium can police</text>

  <!-- Direction indicator, left margin -->
  <text x="32" y="128" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.1em" text-anchor="middle">APP</text>
  <line x1="32" y1="140" x2="32" y2="468" stroke="#D5DBDB" stroke-width="1"/>
  <text x="32" y="484" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.1em" text-anchor="middle">WIRE</text>

  <!-- Stack container -->
  <rect x="64" y="112" width="832" height="384" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>

  <!-- Focal tint: L7 row -->
  <g clip-path="url(#stackClip)">
    <rect x="64" y="112" width="832" height="64" fill="rgba(255,153,0,0.10)"/>
  </g>

  <!-- Row dividers (5 lines between 6 rows of height 64, starting y=112) -->
  <line x1="64" y1="176" x2="896" y2="176" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
  <line x1="64" y1="240" x2="896" y2="240" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
  <line x1="64" y1="304" x2="896" y2="304" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
  <line x1="64" y1="368" x2="896" y2="368" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
  <line x1="64" y1="432" x2="896" y2="432" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>

  <!-- L7 outline on focal row (accent stroke top) -->
  <rect x="64" y="112" width="832" height="64" fill="none" stroke="#EC7211" stroke-width="1.2"/>

  <!-- Row 1: L7 Application -->
  <g>
    <rect x="76" y="128" width="32" height="24" rx="4" fill="#EC7211" stroke="#EC7211" stroke-width="1"/>
    <text x="92" y="144" fill="#ffffff" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">L7</text>
    <text x="124" y="146" fill="#232F3E" font-size="16" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Application Layer</text>
    <text x="592" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">DATA &#183; URL, URI</text>
    <rect x="756" y="128" width="108" height="24" rx="4" fill="rgba(255,153,0,0.14)" stroke="#EC7211" stroke-width="1"/>
    <text x="810" y="144" fill="#EC7211" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">L7 POLICY</text>
    <text x="864" y="164" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">HTTP &#183; GRPC &#183; KAFKA</text>
  </g>

  <!-- Row 2: L6-L5 Presentation / Session -->
  <g>
    <rect x="76" y="192" width="32" height="24" rx="4" fill="#ffffff" stroke="#7D8998" stroke-width="0.8"/>
    <text x="92" y="208" fill="#545B64" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">L6-5</text>
    <text x="124" y="210" fill="#232F3E" font-size="16" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Presentation / Session</text>
    <text x="864" y="204" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">DATA &#183; &#8212;</text>
  </g>

  <!-- Row 3: L4 Transport -->
  <g>
    <rect x="76" y="256" width="32" height="24" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
    <text x="92" y="272" fill="#232F3E" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">L4</text>
    <text x="124" y="274" fill="#232F3E" font-size="16" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Transport Layer</text>
    <text x="592" y="268" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">SEGMENT &#183; PORT</text>
    <rect x="756" y="256" width="108" height="24" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
    <text x="810" y="272" fill="#232F3E" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">L4 POLICY</text>
    <text x="864" y="292" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">PORT &#183; PROTOCOL</text>
  </g>

  <!-- Row 4: L3 Network -->
  <g>
    <rect x="76" y="320" width="32" height="24" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
    <text x="92" y="336" fill="#232F3E" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">L3</text>
    <text x="124" y="338" fill="#232F3E" font-size="16" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Network Layer</text>
    <text x="592" y="332" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">PACKET &#183; IP ADDRESS</text>
    <rect x="756" y="320" width="108" height="24" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
    <text x="810" y="336" fill="#232F3E" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">L3 POLICY</text>
    <text x="864" y="356" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">IP &#183; CIDR</text>
  </g>

  <!-- Row 5: L2 Data Link -->
  <g>
    <rect x="76" y="384" width="32" height="24" rx="4" fill="#ffffff" stroke="#7D8998" stroke-width="0.8"/>
    <text x="92" y="400" fill="#545B64" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">L2</text>
    <text x="124" y="402" fill="#232F3E" font-size="16" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Data Link Layer</text>
    <text x="864" y="396" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">FRAME &#183; MAC ADDRESS</text>
  </g>

  <!-- Row 6: L1 Physical -->
  <g>
    <rect x="76" y="448" width="32" height="24" rx="4" fill="#ffffff" stroke="#7D8998" stroke-width="0.8"/>
    <text x="92" y="464" fill="#545B64" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">L1</text>
    <text x="124" y="466" fill="#232F3E" font-size="16" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Physical Layer</text>
    <text x="864" y="460" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">BIT &#183; &#8212;</text>
  </g>

  <!-- Legend -->
  <line x1="64" y1="524" x2="896" y2="524" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
  <text x="64" y="544" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="176" y="534" width="16" height="16" rx="4" fill="rgba(255,153,0,0.14)" stroke="#EC7211" stroke-width="1"/>
  <text x="200" y="546" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">L7 policy &#8212; this guide's focus</text>

  <rect x="436" y="534" width="16" height="16" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
  <text x="460" y="546" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">L4 / L3 policy &#8212; also supported</text>

  <rect x="700" y="534" width="16" height="16" rx="4" fill="#ffffff" stroke="#7D8998" stroke-width="0.8"/>
  <text x="724" y="546" fill="#232F3E" font-size="11" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Not policed by Cilium</text>
</svg>