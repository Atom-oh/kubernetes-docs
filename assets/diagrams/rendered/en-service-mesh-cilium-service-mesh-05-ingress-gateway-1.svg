<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ig1-title ig1-desc">
  <title id="ig1-title">Hybrid AWS + Cilium load-balancing architecture</title>
  <desc id="ig1-desc">An external client reaches an Application Load Balancer for HTTP traffic and a Network Load Balancer for low-level traffic; the ALB hands off to the Cilium Gateway for L7 routing to the web app and API server, while the NLB hands off to Cilium's eBPF-based L4 load balancer for the gRPC service.</desc>

  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="32" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ARCHITECTURE</text>
  <text x="32" y="60" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Hybrid AWS + Cilium load balancing</text>

  <!-- Internet zone -->
  <rect x="32" y="96" width="160" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="48" y="100" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="56" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">INTERNET</text>

  <!-- AWS zone -->
  <rect x="224" y="96" width="192" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="240" y="100" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="248" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AWS</text>

  <!-- EKS Cluster zone -->
  <rect x="448" y="96" width="480" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="464" y="100" width="94" height="12" rx="2" fill="#ffffff"/>
  <text x="472" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">EKS CLUSTER</text>

  <!-- Cilium Layer sub-zone -->
  <rect x="480" y="140" width="192" height="300" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>
  <rect x="496" y="144" width="94" height="12" rx="2" fill="#ffffff"/>
  <text x="504" y="153" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CILIUM LAYER</text>

  <!-- Applications sub-zone -->
  <rect x="712" y="140" width="192" height="300" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>
  <rect x="728" y="144" width="102" height="12" rx="2" fill="#ffffff"/>
  <text x="736" y="153" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">APPLICATIONS</text>

  <!-- ===== Arrows ===== -->
  <!-- Client -> ALB (up-right) and Client -> NLB (down-right): fan attach on Client right edge -->
  <path d="M 176,236 H 200 Q 208,236 208,228 V 200 Q 208,192 216,192 H 240"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 176,260 H 200 Q 208,260 208,268 V 384 Q 208,392 216,392 H 240"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ALB -> CiliumGW: horizontal-ish elbow, ALB right edge y=210 to CiliumGW left edge y=228 -->
  <path d="M 416,210 H 456 Q 464,210 464,218 V 220 Q 464,228 472,228 H 480"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- NLB -> CiliumLB -->
  <path d="M 416,404 H 456 Q 464,404 464,396 V 380 Q 464,372 472,372 H 480"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- CiliumGW -> WebApp / API : fan on CiliumGW right edge -->
  <path d="M 672,212 H 692 Q 700,212 700,204 V 200 Q 700,192 708,192 H 712"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 672,236 H 712" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- CiliumLB -> gRPC -->
  <path d="M 672,388 H 712" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Nodes ===== -->
  <!-- Client -->
  <rect x="64" y="228" width="112" height="44" rx="6" fill="#ffffff"/>
  <rect x="64" y="228" width="112" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="120" y="254" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">External Client</text>

  <!-- ALB -->
  <rect x="240" y="192" width="176" height="36" rx="6" fill="#ffffff"/>
  <rect x="240" y="192" width="176" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="328" y="210" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application LB</text>
  <text x="328" y="223" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">http/https</text>

  <!-- NLB -->
  <rect x="240" y="386" width="176" height="36" rx="6" fill="#ffffff"/>
  <rect x="240" y="386" width="176" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="328" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Network LB</text>
  <text x="328" y="417" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tcp</text>

  <!-- CiliumGW (focal) -->
  <rect x="496" y="192" width="176" height="52" rx="6" fill="#ffffff"/>
  <rect x="496" y="192" width="176" height="52" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="584" y="214" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cilium Gateway</text>
  <text x="584" y="230" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L7 routing</text>

  <!-- CiliumLB -->
  <rect x="496" y="364" width="176" height="52" rx="6" fill="#ffffff"/>
  <rect x="496" y="364" width="176" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="584" y="386" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cilium LB</text>
  <text x="584" y="402" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eBPF L4</text>

  <!-- WebApp / API / gRPC -->
  <rect x="712" y="178" width="192" height="36" rx="6" fill="#ffffff"/>
  <rect x="712" y="178" width="192" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="808" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Web App</text>

  <rect x="712" y="218" width="192" height="36" rx="6" fill="#ffffff"/>
  <rect x="712" y="218" width="192" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="808" y="240" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Server</text>

  <rect x="712" y="370" width="192" height="36" rx="6" fill="#ffffff"/>
  <rect x="712" y="370" width="192" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="808" y="392" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">gRPC Service</text>

  <!-- Legend -->
  <line x1="32" y1="524" x2="928" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <circle cx="180" cy="537" r="4" fill="none" stroke="#545B64" stroke-width="1.2"/>
  <text x="192" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">TRAFFIC HOP</text>
  <circle cx="340" cy="537" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="352" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">L7 GATEWAY (FOCAL)</text>
</svg>