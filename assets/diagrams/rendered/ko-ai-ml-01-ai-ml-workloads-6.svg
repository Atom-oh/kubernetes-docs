<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
    <title id="t">모니터링 및 로깅 아키텍처</title>
    <desc id="d">DCGM·Node·Kube State 익스포터가 수집한 메트릭이 Prometheus에 모여 Grafana 대시보드와 Alert Manager 알림으로 나뉘고, Fluentd가 수집한 로그가 CloudWatch·ElasticSearch로 전달되는 관측 구조를 보여주는 다이어그램.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#FFFFFF"/>

    <!-- Arrows -->
    <!-- Metrics collection -> Prometheus (focal) -->
    <path d="M 264,140 H 320" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Prometheus -> Alert Manager -->
    <path d="M 512,120 H 568" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Prometheus -> Grafana -->
    <path d="M 512,160 H 568" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Log collector -> Log backends -->
    <path d="M 264,320 H 320" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Grafana -> Dashboards -->
    <path d="M 760,148 V 232" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Alert Manager -> Alerts -->
    <path d="M 760,320 V 380 Q 760,388 752,388 H 744" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="272" y="122" width="40" height="12" rx="2" fill="#FFFFFF"/>
    <text x="292" y="131" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCRAPE</text>

    <!-- Node: Metrics collection (focal) -->
    <rect x="72" y="104" width="192" height="72" rx="6" fill="#FFFFFF"/>
    <rect x="72" y="104" width="192" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="168" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">메트릭 수집</text>
    <text x="168" y="154" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DCGM · Node · KSM</text>
    <text x="168" y="168" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exporters</text>

    <!-- Node: Prometheus -->
    <rect x="320" y="88" width="192" height="104" rx="6" fill="#FFFFFF"/>
    <rect x="320" y="88" width="192" height="104" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="416" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Prometheus</text>

    <!-- Node: Alert Manager -->
    <rect x="568" y="88" width="192" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="568" y="88" width="192" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="664" y="116" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Alert Manager</text>
    <text x="664" y="134" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rule evaluation</text>

    <!-- Node: Grafana -->
    <rect x="568" y="168" width="192" height="64" rx="6" fill="#FFFFFF"/>
    <rect x="568" y="168" width="192" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="664" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Grafana</text>
    <text x="664" y="214" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">시각화</text>

    <!-- Node: Log collector (Fluentd) -->
    <rect x="72" y="284" width="192" height="72" rx="6" fill="#FFFFFF"/>
    <rect x="72" y="284" width="192" height="72" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
    <text x="168" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Fluentd</text>
    <text x="168" y="334" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">로그 수집</text>

    <!-- Node: Log backends -->
    <rect x="320" y="284" width="192" height="72" rx="6" fill="#FFFFFF"/>
    <rect x="320" y="284" width="192" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="416" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">로그 백엔드</text>
    <text x="416" y="330" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CloudWatch · ES · Kibana</text>

    <!-- Node: Dashboards -->
    <rect x="664" y="232" width="192" height="72" rx="6" fill="#FFFFFF"/>
    <rect x="664" y="232" width="192" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="760" y="264" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">대시보드</text>
    <text x="760" y="282" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPU · 훈련 · 추론 · 비용</text>

    <!-- Node: Alerts -->
    <rect x="568" y="380" width="176" height="72" rx="6" fill="#FFFFFF"/>
    <rect x="568" y="380" width="176" height="72" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="656" y="412" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">알림</text>
    <text x="656" y="430" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPU · 성능 · 비용</text>

    <!-- Legend -->
    <line x1="72" y1="496" x2="936" y2="496" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="72" y="512" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="72" y="520" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="92" y="528" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">수집 진입점 (focal)</text>
    <rect x="260" y="520" width="14" height="10" rx="2" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="280" y="528" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">알림 / 경보</text>
  </svg>