<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="en-observability-tracing-03-opentelemetry-2-title en-observability-tracing-03-opentelemetry-2-desc">
  <title id="en-observability-tracing-03-opentelemetry-2-title">OTel Collector processing pipeline</title>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>
  <desc id="en-observability-tracing-03-opentelemetry-2-desc">Five receiver protocols feed a six-stage Collector processor chain — batch, memory limiter, attributes, filter, tail sampling, and resource — before the data fans out to six exporter backends.</desc>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- arrows (straight, single row) -->
  <line x1="152" y1="308" x2="168" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="264" y1="308" x2="272" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="368" y1="308" x2="376" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="472" y1="308" x2="480" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="576" y1="308" x2="584" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="680" y1="308" x2="688" y2="308" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="784" y1="308" x2="800" y2="308" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Receivers (collapsed group, input treatment) -->
  <rect x="8" y="264" width="144" height="88" rx="6" fill="#ffffff"/>
  <rect x="8" y="264" width="144" height="88" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <rect x="16" y="272" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
  <text x="30" y="281" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">×5</text>
  <text x="80" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Receivers</text>
  <text x="80" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OTLP</text>
  <text x="80" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Jaeger · Zipkin</text>
  <text x="80" y="336" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Prometheus · Kafka</text>

  <!-- Processor chain -->
  <rect x="168" y="276" width="96" height="64" rx="6" fill="#ffffff"/>
  <rect x="168" y="276" width="96" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="216" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Batch</text>

  <rect x="272" y="276" width="96" height="64" rx="6" fill="#ffffff"/>
  <rect x="272" y="276" width="96" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="320" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Memory</text>
  <text x="320" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Limiter</text>

  <rect x="376" y="276" width="96" height="64" rx="6" fill="#ffffff"/>
  <rect x="376" y="276" width="96" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="424" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Attributes</text>

  <rect x="480" y="276" width="96" height="64" rx="6" fill="#ffffff"/>
  <rect x="480" y="276" width="96" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="528" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Filter</text>

  <rect x="584" y="276" width="96" height="64" rx="6" fill="#ffffff"/>
  <rect x="584" y="276" width="96" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="632" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tail</text>
  <text x="632" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Sampling</text>

  <rect x="688" y="276" width="96" height="64" rx="6" fill="#ffffff"/>
  <rect x="688" y="276" width="96" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="736" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Resource</text>

  <!-- Exporters (collapsed group, external treatment) -->
  <rect x="800" y="264" width="144" height="88" rx="6" fill="#ffffff"/>
  <rect x="800" y="264" width="144" height="88" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <rect x="808" y="272" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="822" y="281" fill="rgba(35,47,62,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">×6</text>
  <text x="872" y="300" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Exporters</text>
  <text x="872" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OTLP · Tempo</text>
  <text x="872" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">X-Ray · Prometheus</text>
  <text x="872" y="336" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Loki · Datadog</text>

  <!-- legend -->
  <line x1="24" y1="540" x2="936" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <circle cx="32" cy="560" r="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="44" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PROCESSOR STEP</text>
  <circle cx="220" cy="560" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="232" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TAIL SAMPLING (FOCAL)</text>
  <circle cx="452" cy="560" r="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="464" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">COLLAPSED GROUP (RECEIVERS / EXPORTERS)</text>

</svg>