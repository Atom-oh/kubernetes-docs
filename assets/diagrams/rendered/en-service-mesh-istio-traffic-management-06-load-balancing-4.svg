<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4-title d4-desc">
<title id="d4-title">Consistent hash ring operation</title>
<desc id="d4-desc">Each request's key is hashed to a fixed value that always maps to the same pod on the ring, so the same cookie from User A lands on Pod 1 both times while a different cookie from User B lands on Pod 2.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zones -->
<rect x="20" y="70" width="260" height="430" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="40" y="74" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="76" y="83" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">REQUESTS</text>

<rect x="320" y="70" width="260" height="430" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="340" y="74" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="390" y="83" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HASH CALCULATION</text>

<rect x="660" y="70" width="260" height="430" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="680" y="74" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="750" y="83" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONSISTENT HASH RING</text>

<!-- Arrows first -->
<!-- Row 1: User A -> Hash abc123 -->
<line x1="220" y1="144" x2="340" y2="144" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="266" y="124" width="28" height="12" rx="2" fill="#ffffff"/>
<text x="280" y="133" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

<!-- Repeat User A -> Hash abc123 (second attach point) -->
<path d="M 220,224 H 320 Q 328,224 328,216 V 168 Q 328,160 336,160 H 340"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="256" y="204" width="28" height="12" rx="2" fill="#ffffff"/>
<text x="270" y="213" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

<!-- Hash abc123 -> Pod 1 (accent, focal) -->
<line x1="540" y1="144" x2="680" y2="144" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="596" y="124" width="28" height="12" rx="2" fill="#ffffff"/>
<text x="610" y="133" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>

<!-- Row 2: User B -> Hash def456 -->
<line x1="220" y1="312" x2="340" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="266" y="292" width="28" height="12" rx="2" fill="#ffffff"/>
<text x="280" y="301" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

<!-- Hash def456 -> Pod 2 -->
<line x1="540" y1="312" x2="680" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="596" y="292" width="28" height="12" rx="2" fill="#ffffff"/>
<text x="610" y="301" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>

<!-- Row 1 nodes -->
<rect x="40" y="112" width="180" height="64" rx="6" fill="#ffffff"/>
<rect x="40" y="112" width="180" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="130" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">User A</text>
<text x="130" y="156" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cookie: abc123</text>

<rect x="340" y="112" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="340" y="112" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="440" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Hash(abc123)</text>
<text x="440" y="156" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ 0x1A2B</text>

<rect x="680" y="112" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="680" y="112" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="780" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod 1</text>
<text x="780" y="156" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0x0000–0x4FFF</text>

<!-- Repeat User A chip -->
<rect x="40" y="204" width="180" height="40" rx="6" fill="#ffffff"/>
<rect x="40" y="204" width="180" height="40" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="130" y="228" fill="#545B64" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">User A (repeat) — abc123</text>

<!-- Row 2 nodes -->
<rect x="40" y="280" width="180" height="64" rx="6" fill="#ffffff"/>
<rect x="40" y="280" width="180" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="130" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">User B</text>
<text x="130" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cookie: def456</text>

<rect x="340" y="280" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="340" y="280" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="440" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Hash(def456)</text>
<text x="440" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ 0x7C8D</text>

<rect x="680" y="280" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="680" y="280" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="780" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod 2</text>
<text x="780" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0x5000–0x9FFF</text>

<!-- Idle Pod 3 in ring zone -->
<rect x="680" y="420" width="200" height="64" rx="6" fill="#ffffff"/>
<rect x="680" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="780" y="448" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Pod 3</text>
<text x="780" y="464" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0xA000–0xFFFF · idle</text>

<text x="480" y="548" fill="#545B64" font-size="14" font-style="italic" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">The same key always hashes to the same pod — that's what keeps sessions sticky.</text>
</svg>