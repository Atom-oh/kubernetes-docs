    <title id="ko-autoscaling-03-knative-0-title">Knative Serving 컨트롤 플레인과 요청 경로</title>
    <desc id="ko-autoscaling-03-knative-0-desc">클라이언트 요청이 Gateway를 거쳐 파드로 직접 전달되거나 Scale-to-Zero 상태에서는 Activator를 거쳐 전달되고, Queue Proxy가 보고한 동시성 메트릭을 바탕으로 Autoscaler가 스케일을 결정해 Controller/Webhook을 통해 Knative 리소스를 관리하는 구조를 보여주는 아키텍처 다이어그램.</desc>
