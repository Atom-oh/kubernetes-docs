<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cb-verify-title cb-verify-desc">
    <title id="cb-verify-title">Verifying Circuit Breaker Activation</title>
    <desc id="cb-verify-desc">Flowchart showing a service sending a request into a fault-injected dependency, receiving delay or failure back, and reporting to monitoring to confirm the circuit breaker activated.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Arrow 1: Service A -> Dependent Service B (request), right edge y=152 -->
    <line x1="300" y1="152" x2="660" y2="152" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- Arrow 2: Dependent Service B -> Service A (delay or failure), right edge y=184 -->
    <line x1="660" y1="184" x2="300" y2="184" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Arrow 3: Service A -> Monitoring, vertical x=200 from bottom edge 184 to top of Monitoring 320 -->
    <path d="M 200 184 L 200 312 L 200 312" stroke="#545B64" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- Labels -->
    <rect x="420" y="132" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="141" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1. REQUEST</text>

    <rect x="420" y="164" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="173" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2. DELAY OR FAILURE</text>

    <rect x="208" y="228" width="140" height="24" rx="2" fill="#ffffff"/>
    <text x="278" y="238" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3. VERIFY CIRCUIT</text>
    <text x="278" y="248" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BREAKER ACTIVATION</text>

    <!-- Nodes -->
    <rect x="100" y="120" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Service A</text>

    <rect x="660" y="120" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="760" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Dependent Service B</text>
    <text x="760" y="166" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Fault Injection</text>

    <rect x="100" y="320" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="356" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Monitoring</text>

    <!-- Legend -->
    <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="536" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="552" width="24" height="14" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="72" y="563" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Service</text>

    <rect x="180" y="552" width="24" height="14" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="212" y="563" fill="#545B64" font-size="8.5" font-family="var(--font-sans)">Fault injection point</text>
  </svg>