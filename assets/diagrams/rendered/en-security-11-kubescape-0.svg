<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="kubescape-pipeline-title kubescape-pipeline-desc">
    <title id="kubescape-pipeline-title">Kubescape scan pipeline</title>
    <desc id="kubescape-pipeline-desc">Input sources and security frameworks feed control evaluation and vulnerability scanning, which converge on risk scoring before producing reports and metrics.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Arrows (drawn before nodes) ===== -->
    <!-- E1: Input Sources -> Control Evaluation -->
    <path d="M148,128 V164 Q148,172 156,172 H340 Q348,172 348,180 V216"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- E2: Input Sources -> Vulnerability Scanner -->
    <path d="M212,128 V164 Q212,172 220,172 H652 Q660,172 660,180 V216"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- E3: Frameworks -> Control Evaluation -->
    <path d="M780,128 V164 Q780,172 772,172 H420 Q412,172 412,180 V216"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- E4: Control Evaluation -> Risk Calculator (focal path) -->
    <path d="M380,272 V308 Q380,316 388,316 H440 Q448,316 448,324 V360"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- E5: Vulnerability Scanner -> Risk Calculator (focal path) -->
    <path d="M660,272 V308 Q660,316 652,316 H520 Q512,316 512,324 V360"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- E6: Risk Calculator -> Output & Reports (focal path, axis-aligned) -->
    <line x1="480" y1="416" x2="480" y2="488" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- ===== Nodes ===== -->
    <!-- Input Sources -->
    <rect x="80" y="72" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="80" y="72" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Input Sources</text>
    <text x="180" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CLI &#183; Operator &#183; CI/CD</text>

    <!-- Frameworks -->
    <rect x="680" y="72" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="680" y="72" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Security Frameworks</text>
    <text x="780" y="114" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">NSA-CISA &#183; CIS &#183; MITRE &#183; Custom</text>

    <!-- Control Evaluation -->
    <rect x="280" y="216" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="280" y="216" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="242" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Control Evaluation</text>
    <text x="380" y="258" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">resource compliance checks</text>

    <!-- Vulnerability Scanner -->
    <rect x="560" y="216" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="560" y="216" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="660" y="242" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Vulnerability Scanner</text>
    <text x="660" y="258" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">image &#38; host scan</text>

    <!-- Risk Calculator (focal) -->
    <rect x="380" y="360" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="380" y="360" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="386" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Risk Calculator</text>
    <text x="480" y="402" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">scoring &#38; prioritization</text>

    <!-- Output & Reports -->
    <rect x="380" y="488" width="200" height="56" rx="6" fill="#ffffff"/>
    <rect x="380" y="488" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="480" y="514" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Output &#38; Reports</text>
    <text x="480" y="530" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">JSON &#183; SARIF &#183; HTML &#183; Prometheus</text>
  </svg>