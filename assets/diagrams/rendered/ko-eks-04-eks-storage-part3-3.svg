<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="ko-storage-p3-3-title ko-storage-p3-3-desc">
    <title id="ko-storage-p3-3-title">EKS 스토리지 보안 아키텍처</title>
    <desc id="ko-storage-p3-3-desc">EBS·EFS·S3 등 스토리지 서비스의 보안 설정이 저장·전송 암호화를 거쳐 AWS KMS로 모이고, 액세스 제어와 파드 보안이 각각 Kubernetes RBAC 및 Pod Security Standards로 이어지는 구조를 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: storage services -->
    <rect x="40" y="32" width="244" height="336" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="86" y="36" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="162" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">스토리지 서비스</text>

    <!-- ============ Arrows: col1 -> col2 (encryption) ============ -->
    <!-- A exits: 76 (->D), 88 (->F, accent) -->
    <line x1="244" y1="76" x2="304" y2="76" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 244,88 H 254 Q 262,88 262,96 V 242 Q 262,250 270,250 H 304" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- B exits: 187 (->D), 197 (->E), 208 (->F), 219 (->H), 229 (->G) -->
    <path d="M 244,187 H 252 Q 260,187 260,179 V 96 Q 260,88 268,88 H 304" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 244,197 H 272 Q 280,197 280,189 V 156 Q 280,148 288,148 H 304" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 244,208 H 288 Q 296,208 296,216 V 270 Q 296,278 304,278" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- C exits: 316 (->D), 328 (->E), 340 (->G) -->
    <path d="M 244,316 H 264 Q 272,316 272,308 V 108 Q 272,100 280,100 H 304" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 244,328 H 282 Q 290,328 290,320 V 180 Q 290,172 298,172 H 304" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- D,E -> F (top ports, straight verticals) -->
    <line x1="374" y1="112" x2="374" y2="224" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="414" y1="184" x2="414" y2="224" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- col1 -> col3 (access control), routed below the encryption column (y>=340, clear of D/E/F) -->
    <!-- A@100 -> H@352 -->
    <path d="M 244,100 H 254 Q 262,100 262,108 V 344 Q 262,352 270,352 H 544" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- B@219 -> H@376 -->
    <path d="M 244,219 H 296 Q 304,219 304,227 V 368 Q 304,376 312,376 H 544" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- B@229 -> G@408 -->
    <path d="M 244,229 H 312 Q 320,229 320,237 V 400 Q 320,408 328,408 H 544" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- C@340 -> G@432 -->
    <path d="M 244,340 H 328 Q 336,340 336,348 V 424 Q 336,432 344,432 H 544" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- col3 internal: G -> I (straight) -->
    <line x1="634" y1="444" x2="634" y2="452" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- col3 -> col4: I -> K (straight) -->
    <line x1="724" y1="476" x2="784" y2="476" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- col4 internal: J -> L (straight) -->
    <line x1="852" y1="120" x2="852" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Nodes: col1 storage services ===== -->
    <rect x="64" y="64" width="180" height="48" rx="6" fill="#ffffff"/>
    <rect x="64" y="64" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="154" y="86" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">EBS·FSx 보안</text>
    <text x="154" y="100" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">동일한 보안 요건</text>

    <rect x="64" y="176" width="180" height="64" rx="6" fill="#ffffff"/>
    <rect x="64" y="176" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="154" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">EFS 보안</text>
    <text x="154" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">암호화·SG·IAM 모두 해당</text>

    <rect x="64" y="304" width="180" height="48" rx="6" fill="#ffffff"/>
    <rect x="64" y="304" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="154" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">S3 보안</text>
    <text x="154" y="340" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">암호화·IAM</text>

    <!-- ===== Nodes: col2 encryption ===== -->
    <rect x="304" y="64" width="180" height="48" rx="6" fill="#ffffff"/>
    <rect x="304" y="64" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="394" y="86" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">저장 데이터 암호화</text>
    <text x="394" y="100" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">At-Rest</text>

    <rect x="304" y="136" width="180" height="48" rx="6" fill="#ffffff"/>
    <rect x="304" y="136" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="394" y="158" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">전송 중 데이터 암호화</text>
    <text x="394" y="172" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">In-Transit</text>

    <!-- F = KMS (FOCAL) -->
    <rect x="304" y="224" width="180" height="108" rx="6" fill="#ffffff"/>
    <rect x="304" y="224" width="180" height="108" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="394" y="254" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">AWS KMS 키 관리</text>
    <text x="394" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">모든 저장소의</text>
    <text x="394" y="286" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">암호화 키를 통합 관리</text>
    <text x="394" y="308" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">customer-managed CMK</text>

    <!-- ===== Nodes: col3 access control ===== -->
    <rect x="544" y="360" width="180" height="48" rx="6" fill="#ffffff"/>
    <rect x="544" y="360" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="634" y="382" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">보안 그룹</text>
    <text x="634" y="396" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">필요 포트만 허용</text>

    <rect x="544" y="396" width="180" height="48" rx="6" fill="#ffffff"/>
    <rect x="544" y="396" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="634" y="418" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">IAM 역할 및 정책</text>
    <text x="634" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">최소 권한 원칙</text>

    <rect x="544" y="452" width="180" height="48" rx="6" fill="#ffffff"/>
    <rect x="544" y="452" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="634" y="474" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Kubernetes RBAC</text>
    <text x="634" y="488" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PV/PVC 접근 제한</text>

    <!-- ===== Nodes: col4 pod security + policy enforcement ===== -->
    <rect x="784" y="64" width="136" height="56" rx="6" fill="#ffffff"/>
    <rect x="784" y="64" width="136" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="852" y="86" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">파드 보안 설정</text>
    <text x="852" y="102" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">읽기전용FS·권한제한</text>

    <rect x="784" y="176" width="136" height="48" rx="6" fill="#ffffff"/>
    <rect x="784" y="176" width="136" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="852" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Pod Security</text>
    <text x="852" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Standards</text>

    <rect x="784" y="452" width="136" height="48" rx="6" fill="#ffffff"/>
    <rect x="784" y="452" width="136" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="852" y="472" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">OPA / Kyverno</text>
    <text x="852" y="488" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">정책 적용</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="556" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Noto Sans KR',sans-serif">암호화 키 관리 허브</text>

    <rect x="230" y="556" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="250" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Noto Sans KR',sans-serif">보안 구성요소 / 정책</text>

    <line x1="450" y1="561" x2="478" y2="561" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="486" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Noto Sans KR',sans-serif">보안 요구사항 흐름</text>
  </svg>
