<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="mcseq2-title mcseq2-desc">
    <title id="mcseq2-title">Cross-cluster mTLS request and response path</title>
    <desc id="mcseq2-desc">Sequence diagram showing a client pod's request pass through its local proxy, cross an mTLS connection over the internet or VPN into the remote cluster's gateway, reach the server proxy and server pod, then return the response along the same hops.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="128" y1="96" x2="128" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="304" y1="96" x2="304" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="96" x2="480" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="656" y1="96" x2="656" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="832" y1="96" x2="832" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Messages -->
    <!-- 1: Client -> Client Proxy -->
    <line x1="128" y1="140" x2="304" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 2: Client Proxy -> Gateway West (headline: cross-cluster mTLS) -->
    <line x1="304" y1="188" x2="656" y2="188" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- 3: Gateway -> Server Proxy -->
    <line x1="656" y1="236" x2="480" y2="236" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 4: Server Proxy -> Server Pod -->
    <line x1="480" y1="280" x2="832" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 5: Server Pod to Server Proxy (return) -->
    <line x1="832" y1="324" x2="480" y2="324" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- 6: Server Proxy to Gateway (return) -->
    <line x1="480" y1="368" x2="656" y2="368" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- 7: Gateway to Client Proxy (return) -->
    <line x1="656" y1="412" x2="304" y2="412" stroke="#7D8998" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- 8: Client Proxy to Client (return) -->
    <line x1="304" y1="456" x2="128" y2="456" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <!-- Message labels -->
    <rect x="180" y="120" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="216" y="129" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">HTTP REQ</text>

    <rect x="424" y="168" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="177" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">MTLS (INTERNET/VPN)</text>

    <rect x="530" y="216" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="568" y="225" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">FORWARD</text>

    <rect x="620" y="260" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="656" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">HTTP REQ</text>

    <rect x="620" y="304" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="656" y="313" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">HTTP RESP</text>

    <rect x="530" y="348" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="568" y="357" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">RESPONSE</text>

    <rect x="440" y="392" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="401" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">MTLS RESP</text>

    <rect x="180" y="436" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="216" y="445" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">HTTP RESP</text>

    <!-- Actor boxes -->
    <rect x="48" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="128" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client Pod</text>
    <text x="128" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">east</text>

    <rect x="224" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="304" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client Proxy</text>
    <text x="304" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">east</text>

    <rect x="400" y="40" width="160" height="56" rx="6" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Gateway</text>
    <text x="480" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">west</text>

    <rect x="576" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="656" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Server Proxy</text>
    <text x="656" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">west</text>

    <rect x="752" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="832" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Server Pod</text>
    <text x="832" y="80" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">west</text>

    <!-- Legend strip -->
    <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <line x1="40" y1="573" x2="68" y2="573" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="76" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Cross-cluster mTLS (headline)</text>

    <line x1="330" y1="573" x2="358" y2="573" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="366" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Call</text>

    <line x1="440" y1="573" x2="468" y2="573" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="476" y="576" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return</text>
  </svg>