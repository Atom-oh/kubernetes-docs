<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
<title id="t2">BGP 최적 경로 선택 알고리즘</title>
<desc id="d2">BGP 라우터가 경로 수신 후 Weight부터 Neighbor IP까지 11개의 속성을 순서대로 비교하다가 값이 다른 첫 속성에서 최적 경로를 확정하고, 모두 동일하면 다음 속성으로 계속 넘어가는 흐름을 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<text x="32" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BGP BASICS</text>
<text x="32" y="60" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">BGP 최적 경로 선택 알고리즘</text>

<!-- Start oval -->
<rect x="60" y="140" width="140" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="130" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">경로 수신</text>

<!-- Arrow Start -> Ranked list -->
<path d="M200,164 H236 Q244,164 244,172 V196"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Ranked criteria list box (focal) -->
<rect x="60" y="200" width="360" height="316" rx="8" fill="rgba(255,153,0,0.06)" stroke="#EC7211" stroke-width="1"/>
<rect x="76" y="210" width="220" height="16" rx="2" fill="#ffffff"/>
<text x="186" y="222" fill="#EC7211" font-size="8" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="0.08em">우선순위 비교 (1→11)</text>

<!-- 11 ranked rows -->
<text x="76" y="252" fill="#232F3E" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600">1. Weight</text>
<text x="404" y="252" fill="#7D8998" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">높을수록 선호</text>

<text x="76" y="276" fill="#232F3E" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600">2. Local Preference</text>
<text x="404" y="276" fill="#7D8998" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">높을수록 선호</text>

<text x="76" y="300" fill="#232F3E" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600">3. Locally Originated</text>
<text x="404" y="300" fill="#7D8998" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">로컬 경로 선호</text>

<text x="76" y="324" fill="#232F3E" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600">4. AS Path Length</text>
<text x="404" y="324" fill="#7D8998" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">짧을수록 선호</text>

<text x="76" y="348" fill="#232F3E" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600">5. Origin Code</text>
<text x="404" y="348" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">IGP &gt; EGP &gt; Incomplete</text>

<text x="76" y="372" fill="#232F3E" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600">6. MED</text>
<text x="404" y="372" fill="#7D8998" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">낮을수록 선호</text>

<text x="76" y="396" fill="#232F3E" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600">7. eBGP over iBGP</text>
<text x="404" y="396" fill="#7D8998" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">eBGP 선호</text>

<text x="76" y="420" fill="#232F3E" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600">8. IGP Metric</text>
<text x="404" y="420" fill="#7D8998" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">메트릭 낮을수록 선호</text>

<text x="76" y="444" fill="#232F3E" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600">9. Oldest Path</text>
<text x="404" y="444" fill="#7D8998" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">먼저 학습된 경로</text>

<text x="76" y="468" fill="#232F3E" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600">10. Router ID</text>
<text x="404" y="468" fill="#7D8998" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">낮은 ID 선호</text>

<text x="76" y="492" fill="#232F3E" font-size="10" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600">11. Neighbor IP</text>
<text x="404" y="492" fill="#7D8998" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="end">낮은 IP 선호</text>

<!-- row separators -->
<line x1="76" y1="260" x2="404" y2="260" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="76" y1="284" x2="404" y2="284" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="76" y1="308" x2="404" y2="308" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="76" y1="332" x2="404" y2="332" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="76" y1="356" x2="404" y2="356" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="76" y1="380" x2="404" y2="380" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="76" y1="404" x2="404" y2="404" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="76" y1="428" x2="404" y2="428" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="76" y1="452" x2="404" y2="452" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
<line x1="76" y1="476" x2="404" y2="476" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>

<!-- Arrow: list -> decision diamond -->
<line x1="420" y1="358" x2="484" y2="358" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="424" y="338" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="450" y="347" fill="#7D8998" font-size="8" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="0.02em">비교</text>

<!-- Decision diamond -->
<polygon points="568,318 648,358 568,398 488,358" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="568" y="354" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">값이</text>
<text x="568" y="368" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">다른가?</text>

<!-- 다름 -> Best (right) -->
<path d="M648,358 H720" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="656" y="338" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="674" y="347" fill="#EC7211" font-size="8" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">다름</text>

<!-- 동일 -> loop back up to list (top) -->
<path d="M568,318 V236 Q568,228 560,228 H420" fill="none" stroke="#545B64" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="560" y="216" width="36" height="12" rx="2" fill="#ffffff"/>
<text x="578" y="225" fill="#7D8998" font-size="8" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">동일</text>

<!-- Best oval -->
<rect x="720" y="326" width="168" height="64" rx="32" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="804" y="354" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">최적 경로</text>
<text x="804" y="370" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">선택</text>

<!-- Legend -->
<line x1="32" y1="540" x2="928" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="32" y="558" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<text x="140" y="558" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">위 11개 속성을 순서대로 비교 · 값이 다른 첫 속성에서 즉시 경로가 확정된다</text>
</svg>