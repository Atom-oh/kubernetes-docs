<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-title seq-desc">
  <title id="seq-title">Order placement request flow</title>
  <desc id="seq-desc">Sequence diagram of a microservice order placement: the client's request passes synchronously through the API Gateway, Order Service, and Payment Service (each writing to Aurora PostgreSQL), then the Order Service publishes an event that a Notification service consumes asynchronously via SQS to send email or SMS.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="seq0-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="seq0-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
    <marker id="seq0-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#545B64" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#FFFFFF"/>

  <!-- ============ ACTOR BOXES ============ -->
  <!-- x centers: 100, 300, 490, 680, 870 -->

  <!-- Client (external) -->
  <rect x="52" y="40" width="96" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="100" y="65" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#232F3E">Client</text>

  <!-- API Gateway -->
  <rect x="228" y="40" width="144" height="40" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="300" y="58" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#232F3E">API Gateway</text>
  <text x="300" y="71" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#7D8998">(Go)</text>

  <!-- Order Service -->
  <rect x="418" y="40" width="144" height="40" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="490" y="58" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#232F3E">Order Service</text>
  <text x="490" y="71" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#7D8998">(Python)</text>

  <!-- Payment Service -->
  <rect x="608" y="40" width="144" height="40" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="680" y="58" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#232F3E">Payment Service</text>
  <text x="680" y="71" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#7D8998">(Java)</text>

  <!-- Notification (via SQS) -->
  <rect x="798" y="40" width="144" height="40" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="870" y="58" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#232F3E">Notification</text>
  <text x="870" y="71" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#7D8998">(Node.js, via SQS)</text>

  <!-- ============ LIFELINES ============ -->
  <line x1="100" y1="90" x2="100" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="300" y1="90" x2="300" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="490" y1="90" x2="490" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="680" y1="90" x2="680" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="870" y1="90" x2="870" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ============ ACTIVATION BARS ============ -->
  <!-- API Gateway: 108 -> 424 -->
  <rect x="296" y="108" width="8" height="316" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
  <!-- Order Service: 184 -> 396 -->
  <rect x="486" y="184" width="8" height="212" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
  <!-- Payment Service: 256 -> 332 -->
  <rect x="676" y="256" width="8" height="76" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

  <!-- ============ MESSAGES ============ -->

  <!-- M1: Client -> API Gateway : POST /orders -->
  <line x1="100" y1="108" x2="296" y2="108" stroke="#545B64" stroke-width="1.2" marker-end="url(#seq0-arrow)"/>
  <rect x="150" y="94" width="98" height="12" rx="2" fill="#FFFFFF"/>
  <text x="199" y="103" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.04em" fill="#545B64">POST /ORDERS</text>

  <!-- M2: API Gateway self-loop : Validate JWT -->
  <path d="M 304 134 L 334 134 Q 342 134 342 142 L 342 150 Q 342 158 334 158 L 304 158" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#seq0-arrow)"/>
  <rect x="348" y="140" width="80" height="12" rx="2" fill="#FFFFFF"/>
  <text x="388" y="149" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.04em" fill="#545B64">VALIDATE JWT</text>

  <!-- M3: API Gateway -> Order Service : CreateOrder() -->
  <line x1="304" y1="188" x2="486" y2="188" stroke="#545B64" stroke-width="1.2" marker-end="url(#seq0-arrow)"/>
  <rect x="345" y="174" width="96" height="12" rx="2" fill="#FFFFFF"/>
  <text x="393" y="183" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.04em" fill="#545B64">CREATEORDER()</text>

  <!-- M4: Order Service self-loop : INSERT order (Aurora) -->
  <path d="M 494 212 L 524 212 Q 532 212 532 220 L 532 228 Q 532 236 524 236 L 494 236" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#seq0-arrow)"/>
  <rect x="538" y="212" width="146" height="20" rx="2" fill="#FFFFFF"/>
  <text x="611" y="221" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.03em" fill="#545B64">INSERT ORDER</text>
  <text x="611" y="230" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.03em" fill="#7D8998">(AURORA POSTGRESQL)</text>

  <!-- M5: Order Service -> Payment Service : ProcessPayment() -->
  <line x1="494" y1="260" x2="676" y2="260" stroke="#545B64" stroke-width="1.2" marker-end="url(#seq0-arrow)"/>
  <rect x="524" y="246" width="122" height="12" rx="2" fill="#FFFFFF"/>
  <text x="585" y="255" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.03em" fill="#545B64">PROCESSPAYMENT()</text>

  <!-- M6: Payment Service self-loop : INSERT payment (Aurora) -->
  <path d="M 684 284 L 714 284 Q 722 284 722 292 L 722 300 Q 722 308 714 308 L 684 308" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#seq0-arrow)"/>
  <rect x="728" y="284" width="150" height="20" rx="2" fill="#FFFFFF"/>
  <text x="803" y="293" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.03em" fill="#545B64">INSERT PAYMENT</text>
  <text x="803" y="302" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.03em" fill="#7D8998">(AURORA POSTGRESQL)</text>

  <!-- M7: Payment Service --> Order Service : PaymentResult (return, dashed) -->
  <line x1="676" y1="332" x2="498" y2="332" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq0-arrow)"/>
  <rect x="533" y="318" width="108" height="12" rx="2" fill="#FFFFFF"/>
  <text x="587" y="327" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.03em" fill="#545B64">PAYMENTRESULT</text>

  <!-- M8: Order Service -> Notification : PublishOrderEvent (async, via SQS) -->
  <line x1="494" y1="360" x2="866" y2="360" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq0-arrow-open)"/>
  <rect x="600" y="346" width="160" height="12" rx="2" fill="#FFFFFF"/>
  <text x="680" y="355" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.03em" fill="#545B64">PUBLISHORDEREVENT (SQS)</text>

  <!-- M9: Order Service --> API Gateway : OrderResponse (return, dashed) -->
  <line x1="486" y1="388" x2="308" y2="388" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq0-arrow)"/>
  <rect x="340" y="374" width="114" height="12" rx="2" fill="#FFFFFF"/>
  <text x="397" y="383" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.03em" fill="#545B64">ORDERRESPONSE</text>

  <!-- M10: API Gateway --> Client : 201 Created (headline success, coral) -->
  <line x1="296" y1="416" x2="104" y2="416" stroke="#EC7211" stroke-width="1.4" marker-end="url(#seq0-arrow-accent)"/>
  <rect x="150" y="402" width="98" height="12" rx="2" fill="#FFFFFF"/>
  <text x="199" y="411" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.04em" fill="#EC7211">201 CREATED</text>

  <!-- Async processing frame note over SQS/Notification span -->
  <rect x="600" y="446" width="270" height="18" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
  <text x="735" y="458" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.08em" fill="#545B64">ASYNC PROCESSING</text>

  <!-- M11: Notification self-loop : ConsumeEvent -> SendEmail/SMS -->
  <path d="M 878 490 L 908 490 Q 916 490 916 498 L 916 514 Q 916 522 908 522 L 878 522" fill="none" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq0-arrow)"/>
  <rect x="784" y="490" width="90" height="20" rx="2" fill="#FFFFFF"/>
  <text x="829" y="499" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.03em" fill="#545B64">CONSUMEEVENT</text>
  <text x="829" y="508" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.03em" fill="#7D8998">SEND EMAIL / SMS</text>

</svg>