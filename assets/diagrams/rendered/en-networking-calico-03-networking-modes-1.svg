<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="crosssubnet-title crosssubnet-desc">
    <title id="crosssubnet-title">IPIP CrossSubnet mode routing between two subnets</title>
    <desc id="crosssubnet-desc">Two nodes on the same subnet reach each other with direct, unencapsulated routing, while traffic crossing into the other subnet is IPIP-encapsulated only for that boundary hop.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="80" y="80" width="360" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="92" y="84" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="180" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SUBNET 10.0.1.0/24</text>

    <rect x="520" y="80" width="360" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="532" y="84" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="620" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SUBNET 10.0.2.0/24</text>

    <!-- Intra-subnet direct arrows (vertical, same x) -->
    <line x1="180" y1="164" x2="180" y2="216" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <rect x="184" y="182" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="222" y="191" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">DIRECT ROUTE</text>

    <line x1="620" y1="164" x2="620" y2="216" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
    <rect x="624" y="182" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="662" y="191" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">DIRECT ROUTE</text>

    <!-- Cross-subnet IPIP arrows (dashed, straight since same y) -->
    <!-- Node1 right edge (240,132) -> Node3 left edge (560,132) -->
    <line x1="240" y1="132" x2="560" y2="132" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <rect x="352" y="104" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="400" y="113" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">IPIP ENCAP</text>

    <!-- Node2 right edge (240,248) -> Node4 left edge (560,248) -->
    <line x1="240" y1="248" x2="560" y2="248" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
    <rect x="352" y="256" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="400" y="265" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">IPIP ENCAP</text>

    <!-- Nodes -->
    <rect x="120" y="104" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="120" y="104" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 1</text>
    <text x="180" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.1.10</text>

    <rect x="120" y="220" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="120" y="220" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 2</text>
    <text x="180" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.1.11</text>

    <rect x="560" y="104" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="560" y="104" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="620" y="128" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 3</text>
    <text x="620" y="144" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.2.10</text>

    <rect x="560" y="220" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="560" y="220" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="620" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 4</text>
    <text x="620" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.2.11</text>

    <!-- Legend -->
    <line x1="40" y1="360" x2="920" y2="360" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="376" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="200" y1="371" x2="240" y2="371" stroke="#545B64" stroke-width="1.2"/>
    <text x="248" y="376" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">same-subnet, no encapsulation</text>
    <line x1="560" y1="371" x2="600" y2="371" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="608" y="376" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">cross-subnet, IPIP-encapsulated</text>
  </svg>