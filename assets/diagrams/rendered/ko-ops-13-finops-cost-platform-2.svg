<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="rightsizing-seq-title rightsizing-seq-desc">
    <title id="rightsizing-seq-title">라이트사이징 자동화 파이프라인</title>
    <desc id="rightsizing-seq-desc">CronJob이 매주 VPA 추천값을 조회해 스크립트가 PR을 생성하고, Git/CI가 검증 후 팀 리더의 승인·머지를 거쳐 ArgoCD로 안전하게 배포하는 순서도이다.</desc>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <!-- ===== lifelines (drawn before actor boxes so boxes paint on top) ===== -->
    <line x1="80"  y1="88" x2="80"  y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="280" y1="88" x2="280" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="88" x2="480" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="680" y1="88" x2="680" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="880" y1="88" x2="880" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ===== activation bars ===== -->
    <rect x="476" y="184" width="8" height="104" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="676" y="288" width="8" height="208" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- ===== m1: CronJob -> VPA ===== -->
    <line x1="80" y1="132" x2="280" y2="132" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="120" y="116" width="120" height="16" rx="2" fill="#ffffff"/>
    <text x="180" y="128" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.04em">추천값 조회</text>

    <!-- ===== m2: VPA -> Script ===== -->
    <line x1="280" y1="184" x2="480" y2="184" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="320" y="168" width="120" height="16" rx="2" fill="#ffffff"/>
    <text x="380" y="180" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.04em">추천 데이터 반환</text>

    <!-- ===== m3: Script self-message ===== -->
    <path d="M 484 232 L 524 232 L 524 260 L 484 260" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="532" y="238" width="128" height="16" rx="2" fill="#ffffff"/>
    <text x="596" y="250" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.04em">추천 비교·변경 생성</text>

    <!-- ===== m4: Script -> Git/CI ===== -->
    <line x1="480" y1="288" x2="680" y2="288" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="500" y="272" width="160" height="16" rx="2" fill="#ffffff"/>
    <text x="580" y="284" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.04em">변경 매니페스트 PR 생성</text>

    <!-- ===== m5: Git/CI self-message ===== -->
    <path d="M 684 336 L 724 336 L 724 364 L 684 364" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="732" y="342" width="128" height="16" rx="2" fill="#ffffff"/>
    <text x="796" y="354" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.04em">트리거·린트 검증</text>

    <!-- ===== m6: Git/CI -> Reviewer ===== -->
    <line x1="680" y1="392" x2="880" y2="392" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="720" y="376" width="120" height="16" rx="2" fill="#ffffff"/>
    <text x="780" y="388" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.04em">PR 리뷰 요청</text>

    <!-- ===== m7: Reviewer -> Git/CI (headline success, solid accent) ===== -->
    <line x1="880" y1="444" x2="680" y2="444" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="720" y="428" width="120" height="16" rx="2" fill="#ffffff"/>
    <text x="780" y="440" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.04em">승인 + 머지</text>

    <!-- ===== m8: Git/CI self-message (ArgoCD sync) ===== -->
    <path d="M 684 480 L 724 480 L 724 496 L 684 496" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="732" y="486" width="120" height="16" rx="2" fill="#ffffff"/>
    <text x="792" y="498" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.04em">ArgoCD 동기화</text>

    <!-- ===== actor boxes (top, painted after lifelines) ===== -->
    <rect x="0" y="40" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="0" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="80" y="60" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">CronJob</text>
    <text x="80" y="76" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">weekly</text>

    <rect x="200" y="40" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="200" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="280" y="60" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">VPA</text>
    <text x="280" y="76" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">추천 엔진</text>

    <rect x="400" y="40" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="400" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="60" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">라이트사이징 스크립트</text>
    <text x="480" y="76" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">batch job</text>

    <rect x="600" y="40" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="600" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="680" y="60" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Git / CI</text>
    <text x="680" y="76" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">PR·배포</text>

    <rect x="800" y="40" width="160" height="48" rx="6" fill="#ffffff"/>
    <rect x="800" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="880" y="60" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">팀 리더</text>
    <text x="880" y="76" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">리뷰어</text>

    <!-- ===== closing editorial note ===== -->
    <rect x="80" y="536" width="600" height="48" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="380" y="565" fill="#545B64" font-size="12" font-style="italic" text-anchor="middle"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">주간 자동 실행 → PR 기반 리뷰 → 안전한 적용</text>
  </svg>