<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-basics-05-ebpf-fundamentals-3-title en-basics-05-ebpf-fundamentals-3-desc">
<title id="en-basics-05-ebpf-fundamentals-3-title">eBPF program lifecycle state machine</title>
<desc id="en-basics-05-ebpf-fundamentals-3-desc">State machine diagram of an eBPF program's lifecycle: written code is compiled and loaded via the bpf() syscall, then the verifier either rejects it or passes it to JIT compilation; the JIT-compiled program attaches to a hook point where it either executes repeatedly on each event trigger or is explicitly detached, unloading the program.</desc>
