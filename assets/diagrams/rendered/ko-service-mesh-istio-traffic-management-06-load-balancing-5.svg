<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="lb-hashskew-title lb-hashskew-desc">
    <title id="lb-hashskew-title">특정 해시 값에 트래픽이 집중되어 한 파드에 부하가 몰리는 불균형 상황</title>
    <desc id="lb-hashskew-desc">1000명의 사용자 중 80%가 같은 해시 값으로 몰려 Pod 1이 과부하 상태가 되고, Pod 2와 Pod 3는 상대적으로 적은 부하를 받는 불균형 상황을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- zone -->
    <rect x="40" y="72" width="880" height="336" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="76" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="88" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">문제 상황</text>

    <!-- ===== Arrows ===== -->
    <!-- Users -> Pod1 (down+left, accent — the overloaded path) -->
    <path d="M 440,162 V 231 Q 440,239 432,239 H 208 Q 200,239 200,247 V 316"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="300" y="219" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="228" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">80%</text>

    <!-- Users -> Pod2 (straight) -->
    <line x1="480" y1="162" x2="480" y2="316" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="488" y="233" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="505" y="242" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">15%</text>

    <!-- Users -> Pod3 (down+right) -->
    <path d="M 520,162 V 231 Q 520,239 528,239 H 752 Q 760,239 760,247 V 316"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="620" y="219" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="637" y="228" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">5%</text>

    <!-- ===== Nodes ===== -->
    <rect x="400" y="118" width="160" height="44" rx="6" fill="#ffffff"/>
    <rect x="400" y="118" width="160" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">1000명 사용자</text>

    <rect x="110" y="316" width="180" height="48" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="110" y="316" width="180" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="200" y="336" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 1</text>
    <text x="200" y="352" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">800명 ⚠️</text>

    <rect x="390" y="316" width="180" height="48" rx="6" fill="#ffffff"/>
    <rect x="390" y="316" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="336" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 2</text>
    <text x="480" y="352" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">150명</text>

    <rect x="670" y="316" width="180" height="48" rx="6" fill="#ffffff"/>
    <rect x="670" y="316" width="180" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="760" y="336" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 3</text>
    <text x="760" y="352" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">50명</text>
  </svg>