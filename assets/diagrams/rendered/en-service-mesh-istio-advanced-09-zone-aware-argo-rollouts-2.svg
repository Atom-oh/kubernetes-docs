<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="normal-seq-title normal-seq-desc">
<title id="normal-seq-title">Normal-state zone-local request routing</title>
<desc id="normal-seq-desc">In the default state, a client's request is handled entirely within its own zone by the local Envoy sidecar and pod, while the pod in a neighboring zone sits idle and is not called.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>

<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<!-- Zone A box wrapping first 3 lifelines -->
<rect x="24" y="40" width="600" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
<text x="324" y="56" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">ZONE A · us-east-1a</text>
<rect x="648" y="40" width="288" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
<text x="792" y="56" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">ZONE B · us-east-1b</text>

<!-- Lifelines -->
<line x1="112" y1="100" x2="112" y2="360" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="384" y1="100" x2="384" y2="360" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="576" y1="100" x2="576" y2="360" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="792" y1="100" x2="792" y2="360" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

<!-- Messages -->
<!-- 1. Client A -> Envoy: GET /api -->
<path d="M 112,116 H 384" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="212" y="96" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="248" y="105" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">GET /api</text>

<!-- note: locality-aware routing -->
<rect x="316" y="128" width="136" height="28" rx="4" fill="rgba(35,47,62,0.04)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
<text x="384" y="140" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">locality-aware routing</text>
<text x="384" y="151" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">distribute: 100% local</text>

<!-- 2. Envoy -> Pod A: Request (zone-local), headline (accent) -->
<path d="M 384,180 H 576" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="440" y="160" width="80" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="169" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">zone-local req</text>

<rect x="420" y="192" width="120" height="16" rx="4" fill="rgba(35,47,62,0.04)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
<text x="480" y="203" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">same-zone traffic</text>

<!-- 3. Pod A -> Envoy: Response (dashed return) -->
<path d="M 576,236 H 384" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="444" y="216" width="68" height="12" rx="2" fill="#ffffff"/>
<text x="478" y="225" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">response</text>

<!-- 4. Envoy -> Client A: Response (dashed return) -->
<path d="M 384,264 H 112" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="212" y="244" width="68" height="12" rx="2" fill="#ffffff"/>
<text x="246" y="253" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">response</text>

<!-- note: Pod B not used -->
<rect x="732" y="284" width="120" height="28" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="792" y="296" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">zone B pod is</text>
<text x="792" y="307" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">not used</text>

<!-- Activation bars -->
<rect x="108" y="116" width="8" height="148" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="380" y="116" width="8" height="148" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="572" y="180" width="8" height="56" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- Actor labels -->
<rect x="52" y="76" width="120" height="24" rx="4" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
<text x="112" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client A</text>

<rect x="324" y="76" width="120" height="24" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="384" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>

<rect x="516" y="76" width="120" height="24" rx="4" fill="#ffffff" stroke="#EC7211" stroke-width="1.2"/>
<text x="576" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A (zone=a)</text>

<rect x="732" y="76" width="120" height="24" rx="4" fill="#ffffff" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
<text x="792" y="92" fill="#7D8998" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B (zone=b)</text>

<!-- legend -->
<line x1="24" y1="376" x2="936" y2="376" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<line x1="30" y1="388" x2="50" y2="388" stroke="#EC7211" stroke-width="1.4"/>
<text x="58" y="391" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">ZONE-LOCAL CALL</text>
<line x1="220" y1="388" x2="240" y2="388" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
<text x="248" y="391" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">RETURN</text>
</svg>