    <title id="ko-security-11-kubescape-1-title">Kubescape 스캔 실행 파이프라인</title>
    <desc id="ko-security-11-kubescape-1-desc">CLI 입력이 선택된 프레임워크 기준으로 리소스 파싱·컨트롤 실행·규칙 검사를 거치고, 리스크 계산·심각도 분류·우선순위 지정을 통해 점수가 산정된 뒤 Pretty Print·JSON·SARIF·HTML/PDF 등 다양한 형식으로 출력되는 단일 스캔 실행 흐름.</desc>
