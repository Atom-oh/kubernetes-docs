  </defs>
  <desc id="en-observability-tracing-03-opentelemetry-0-desc">OpenTracing and OpenCensus merged in 2019 to form OpenTelemetry, which now defines the specification, SDKs, Collector, and wire protocol used across the observability ecosystem.</desc>

