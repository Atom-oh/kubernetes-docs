<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 340" role="img" aria-labelledby="xffs2-title xffs2-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="xffs2-title">XFF chain through CloudFront and ALB</title>
    <desc id="xffs2-desc">Flowchart showing a client request passing through CloudFront and an AWS ALB before reaching the Istio Gateway and application, with the X-Forwarded-For header gaining one hop at each proxy.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="340" fill="#ffffff"/>

    <!-- boxes: width128 height64 y132, gap48; centers x=128,304,480,656,832 -->
    <path d="M192,164 H240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="196" y="140" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="216" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+0</text>

    <path d="M368,164 H416" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="372" y="140" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="392" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+1</text>

    <path d="M544,164 H592" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="548" y="140" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="568" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+2</text>

    <path d="M720,164 H768" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="724" y="140" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="744" y="149" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+3</text>

    <!-- nodes -->
    <g><rect x="64" y="132" width="128" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="#7D8998" stroke-width="1"/>
      <text x="128" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
      <text x="128" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">203.0.113.5</text></g>
    <g><rect x="240" y="132" width="128" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="304" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudFront</text>
      <text x="304" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">172.64.0.1</text></g>
    <g><rect x="416" y="132" width="128" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS ALB</text>
      <text x="480" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.1.100</text></g>
    <g><rect x="592" y="132" width="128" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="656" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio Gateway</text>
      <text x="656" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.2.50</text></g>
    <g><rect x="768" y="132" width="128" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="832" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text></g>

    <line x1="30" y1="240" x2="930" y2="240" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="258" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="130" y1="254" x2="160" y2="254" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="168" y="258" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">+N = X-Forwarded-For hops added so far</text>
    <line x1="500" y1="254" x2="530" y2="254" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="538" y="258" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Final hop: app extracts real IP via xff_num_trusted_hops: 2</text>
  </svg>