<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jwtauth-title jwtauth-desc">
  <title id="jwtauth-title">Istio Request Authentication (JWT) Flow</title>
  <desc id="jwtauth-desc">Sequence of the Istio request-authentication flow: a user logs in with an OAuth/OIDC provider to obtain a JWT, presents it to Istio's Request Authentication filter at the gateway, which verifies the token and either forwards the request to the application or rejects it back to the user.</desc>

  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- header -->
  <text x="32" y="28" class="mono" fill="#7D8998" font-size="8" letter-spacing="0.18em">ISTIO SECURITY</text>
  <text x="32" y="48" fill="#232F3E" font-size="18" font-weight="700">Request Authentication (JWT) Flow</text>

  <!-- ================= ZONES (bg -> zones -> arrows -> nodes) ================= -->

  <!-- Auth Provider zone -->
  <rect x="340" y="60" width="240" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="400" y="64" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="460" y="73" fill="rgba(35,47,62,0.40)" class="mono" font-size="7" text-anchor="middle" letter-spacing="0.14em">AUTH PROVIDER</text>

  <!-- Istio Gateway zone -->
  <rect x="340" y="296" width="280" height="124" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="420" y="300" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="309" fill="rgba(35,47,62,0.40)" class="mono" font-size="7" text-anchor="middle" letter-spacing="0.14em">ISTIO GATEWAY</text>

  <!-- Services zone -->
  <rect x="760" y="312" width="152" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="800" y="316" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="836" y="325" fill="rgba(35,47,62,0.40)" class="mono" font-size="7" text-anchor="middle" letter-spacing="0.14em">SERVICES</text>

  <!-- ================= ARROWS (drawn before nodes) ================= -->

  <!-- 1. User -> OAuth : LOGIN (solid, muted) -->
  <path d="M104,268 V128 Q104,120 112,120 H360" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="146" y="182" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="182" y="191" fill="#7D8998" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.06em">1. LOGIN</text>

  <!-- 2. OAuth -> User : JWT TOKEN (solid, muted) -->
  <path d="M360,140 H132 Q124,140 124,148 V268" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="86" y="196" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="130" y="205" fill="#7D8998" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.06em">2. JWT TOKEN</text>

  <!-- 3. User -> Request Authentication : REQUEST + JWT (solid, accent - primary flow) -->
  <path d="M176,300 H260 Q268,300 268,308 V344 Q268,352 276,352 H360" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="182" y="316" width="104" height="12" rx="2" fill="#ffffff"/>
  <text x="234" y="325" fill="#EC7211" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.06em">3. REQUEST+JWT</text>

  <!-- 4. Request Authentication -> Application : VERIFIED (solid, accent - primary flow) -->
  <line x1="600" y1="364" x2="776" y2="364" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="642" y="348" width="92" height="12" rx="2" fill="#ffffff"/>
  <text x="688" y="357" fill="#EC7211" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.06em">4. VERIFIED</text>

  <!-- 5. Request Authentication -> User : VERIFICATION FAILED (dashed, muted - return/reject path) -->
  <path d="M360,376 H292 Q284,376 284,368 V324 Q284,316 276,316 H176" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="178" y="332" width="108" height="12" rx="2" fill="#ffffff"/>
  <text x="232" y="341" fill="#7D8998" class="mono" font-size="8" text-anchor="middle" letter-spacing="0.06em">VERIFICATION FAILED</text>

  <!-- ================= NODES ================= -->

  <!-- User (input type) -->
  <rect x="48" y="268" width="128" height="64" rx="6" fill="#ffffff"/>
  <rect x="48" y="268" width="128" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <rect x="56" y="274" width="36" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.6)" stroke-width="0.8"/>
  <text x="74" y="283" fill="#7D8998" class="mono" font-size="7" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="112" y="308" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">User</text>

  <!-- OAuth/OIDC Provider (external type) -->
  <rect x="360" y="100" width="200" height="56" rx="6" fill="#ffffff"/>
  <rect x="360" y="100" width="200" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <rect x="368" y="106" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="382" y="115" fill="rgba(35,47,62,0.60)" class="mono" font-size="7" text-anchor="middle" letter-spacing="0.08em">IDP</text>
  <text x="460" y="132" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">OAuth / OIDC Provider</text>

  <!-- Request Authentication (focal) -->
  <rect x="360" y="328" width="240" height="72" rx="6" fill="#ffffff"/>
  <rect x="360" y="328" width="240" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="368" y="334" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.6)" stroke-width="0.8"/>
  <text x="386" y="343" fill="#EC7211" class="mono" font-size="7" text-anchor="middle" letter-spacing="0.08em">JWT</text>
  <text x="480" y="358" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Request Authentication</text>
  <text x="480" y="374" fill="#545B64" class="mono" font-size="9" text-anchor="middle">JWT verification @ gateway</text>

  <!-- Application (backend) -->
  <rect x="776" y="332" width="120" height="64" rx="6" fill="#ffffff"/>
  <rect x="776" y="332" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="784" y="338" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="802" y="347" fill="#545B64" class="mono" font-size="7" text-anchor="middle" letter-spacing="0.08em">APP</text>
  <text x="836" y="372" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Application</text>

  <!-- ================= LEGEND ================= -->
  <line x1="32" y1="536" x2="928" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <line x1="32" y1="556" x2="72" y2="556" stroke="#EC7211" stroke-width="1.2"/>
  <text x="80" y="559" fill="#545B64" class="mono" font-size="8" letter-spacing="0.06em">VERIFIED REQUEST PATH</text>
  <line x1="292" y1="556" x2="332" y2="556" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="340" y="559" fill="#545B64" class="mono" font-size="8" letter-spacing="0.06em">REJECTED / FAILED VERIFICATION</text>
</svg>