<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="100%" role="img" aria-labelledby="en-ops-14-tekton-pipelines-5-title en-ops-14-tekton-pipelines-5-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="en-ops-14-tekton-pipelines-5-title">End-to-end pipeline from Tekton CI through GitOps handoff to ArgoCD CD</title>
    <desc id="en-ops-14-tekton-pipelines-5-desc">Shows a developer push driving a Tekton pipeline through build, test, scan, and sign stages that publish a signed image to ECR, a GitOps repo update handing that image tag to ArgoCD, and ArgoCD verifying the Cosign signature with Kyverno before deploying to the cluster.</desc>
    <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="24" y="96" width="904" height="144" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="100" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="70" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CI &#8212; TEKTON</text>

    <rect x="740" y="340" width="180" height="144" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="756" y="344" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="792" y="353" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HANDOFF</text>

    <rect x="24" y="340" width="700" height="144" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="344" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="80" y="353" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CD &#8212; ARGOCD</text>

    <!-- ===== Arrows (all axis-aligned — snake layout needs no elbows) ===== -->
    <path d="M 184,172 H 220" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 364,172 H 400" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 544,172 H 580" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 724,172 H 760" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- ECR -> UpdateManifest (handoff), straight vertical -->
    <path d="M 832,204 V 380" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="800" y="284" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="832" y="293" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IMAGE TAG</text>
    <!-- Row 2, right to left -->
    <path d="M 760,412 H 724" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 580,412 H 544" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 400,412 H 364" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 220,412 H 184" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- ===== Row 1: CI (left to right) ===== -->
    <g>
      <rect x="40" y="140" width="144" height="64" rx="6" fill="rgba(35,47,62,0.10)"/>
      <rect x="40" y="140" width="144" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="112" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Developer Push</text>
      <text x="112" y="182" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git push</text>
    </g>
    <g>
      <rect x="220" y="140" width="144" height="64" rx="6" fill="#ffffff"/>
      <rect x="220" y="140" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="292" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Trigger Pipeline</text>
      <text x="292" y="178" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Triggers &#8594; Pipeline</text>
    </g>
    <g>
      <rect x="400" y="140" width="144" height="64" rx="6" fill="#ffffff"/>
      <rect x="400" y="140" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="472" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Build &amp; Test</text>
      <text x="472" y="178" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clone, unit-test, kaniko</text>
    </g>
    <g>
      <rect x="580" y="140" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)"/>
      <rect x="580" y="140" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="652" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Scan &amp; Sign</text>
      <text x="652" y="178" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trivy + Tekton Chains</text>
    </g>
    <g>
      <rect x="760" y="140" width="144" height="64" rx="6" fill="rgba(35,47,62,0.03)"/>
      <rect x="760" y="140" width="144" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="832" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ECR</text>
      <text x="832" y="178" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">image + signature</text>
    </g>

    <!-- ===== Row 2: Handoff + CD (right to left) ===== -->
    <g>
      <rect x="760" y="380" width="144" height="64" rx="6" fill="#ffffff"/>
      <rect x="760" y="380" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="832" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Update Manifest</text>
      <text x="832" y="418" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitOps repo, new tag</text>
    </g>
    <g>
      <rect x="580" y="380" width="144" height="64" rx="6" fill="#ffffff"/>
      <rect x="580" y="380" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="652" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">GitOps Repo</text>
      <text x="652" y="418" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">desired state</text>
    </g>
    <g>
      <rect x="400" y="380" width="144" height="64" rx="6" fill="#ffffff"/>
      <rect x="400" y="380" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="472" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ArgoCD</text>
      <text x="472" y="418" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">syncs cluster state</text>
    </g>
    <g>
      <rect x="220" y="380" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)"/>
      <rect x="220" y="380" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="292" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kyverno Verify</text>
      <text x="292" y="418" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">signature check</text>
    </g>
    <g>
      <rect x="40" y="380" width="144" height="64" rx="6" fill="rgba(35,47,62,0.10)"/>
      <rect x="40" y="380" width="144" height="64" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="112" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Deploy</text>
      <text x="112" y="418" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">to cluster</text>
    </g>

    <!-- Legend -->
    <line x1="24" y1="530" x2="936" y2="530" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="24" y="542" width="16" height="2" fill="#545B64"/>
    <text x="48" y="549" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">PIPELINE STEP</text>
    <rect x="200" y="542" width="16" height="2" fill="#EC7211"/>
    <text x="224" y="549" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">SIGNATURE CHECKPOINT</text>
  </svg>