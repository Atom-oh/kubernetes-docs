<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="hybrid-arch-title hybrid-arch-desc">
  <title id="hybrid-arch-title">EKS 하이브리드 인그레스 아키텍처</title>
  <desc id="hybrid-arch-desc">외부 클라이언트의 트래픽이 AWS ALB와 NLB 두 경로로 나뉘어 각각 Cilium Gateway의 L7 라우팅과 Cilium LB의 L4 로드밸런싱을 거쳐 애플리케이션에 도달하는 하이브리드 구성을 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="32" y="242" width="176" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="44" y="246" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="80" y="255" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">INTERNET</text>

  <rect x="272" y="104" width="236" height="404" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="284" y="108" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="304" y="117" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">AWS</text>

  <rect x="532" y="40" width="428" height="456" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="544" y="44" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="592" y="53" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">EKS CLUSTER</text>

  <!-- sub-group captions -->
  <text x="650" y="128" fill="#7D8998" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.12em">CILIUM LAYER</text>
  <text x="870" y="68" fill="#7D8998" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.12em">APPLICATIONS</text>

  <!-- Arrows -->
  <!-- Client -> ALB (fan attach on Client right edge y=291) -->
  <path d="M200,291 H280 Q288,291 288,283 V174 Q288,166 296,166 H300"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Client -> NLB (fan attach on Client right edge y=309) -->
  <path d="M200,309 H280 Q288,309 288,317 V438 Q288,446 296,446 H300"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ALB -> CiliumGW (straight, same y=166) -->
  <path d="M480,166 H560" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- NLB -> CiliumLB (straight, same y=446) -->
  <path d="M480,446 H560" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- CiliumGW fan-out to WebApp / API (attach y=157, y=175 on right edge x=740) -->
  <path d="M740,157 H768 Q776,157 776,149 V108 Q776,100 784,100 H800"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M740,175 H768 Q776,175 776,183 V216 Q776,224 784,224 H800"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- CiliumLB -> gRPC (straight, same y=446) -->
  <path d="M740,446 H800" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Nodes -->
  <!-- Client (external) -->
  <rect x="60" y="274" width="140" height="52" rx="6" fill="#ffffff"/>
  <rect x="60" y="274" width="140" height="52" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="130" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">External Client</text>

  <!-- ALB (external) -->
  <rect x="300" y="140" width="180" height="52" rx="6" fill="#ffffff"/>
  <rect x="300" y="140" width="180" height="52" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="390" y="164" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Application</text>
  <text x="390" y="180" fill="#545B64" font-size="9" class="mono" text-anchor="middle">Load Balancer</text>

  <!-- NLB (external) -->
  <rect x="300" y="420" width="180" height="52" rx="6" fill="#ffffff"/>
  <rect x="300" y="420" width="180" height="52" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="390" y="444" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Network</text>
  <text x="390" y="460" fill="#545B64" font-size="9" class="mono" text-anchor="middle">Load Balancer</text>

  <!-- CiliumGW (focal) -->
  <rect x="560" y="140" width="180" height="52" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="560" y="140" width="180" height="52" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="650" y="164" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Cilium Gateway</text>
  <text x="650" y="180" fill="#545B64" font-size="9" class="mono" text-anchor="middle">L7 Routing</text>

  <!-- CiliumLB (backend) -->
  <rect x="560" y="420" width="180" height="52" rx="6" fill="#ffffff"/>
  <rect x="560" y="420" width="180" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="650" y="444" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Cilium LB</text>
  <text x="650" y="460" fill="#545B64" font-size="9" class="mono" text-anchor="middle">L4 Load Balancing</text>

  <!-- WebApp / API / gRPC (backend) -->
  <rect x="800" y="76" width="140" height="48" rx="6" fill="#ffffff"/>
  <rect x="800" y="76" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="870" y="105" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Web App</text>

  <rect x="800" y="200" width="140" height="48" rx="6" fill="#ffffff"/>
  <rect x="800" y="200" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="870" y="229" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API Server</text>

  <rect x="800" y="422" width="140" height="48" rx="6" fill="#ffffff"/>
  <rect x="800" y="422" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="870" y="451" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">gRPC Service</text>
</svg>
