<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
    <title id="t2">네트워크 정책 허용과 차단</title>
    <desc id="d2">네임스페이스 A의 Frontend·API·Database 포드와 네임스페이스 B의 Monitoring 포드 사이에서 네트워크 정책이 어떤 경로는 허용하고 어떤 경로는 차단하는지 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-deny" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#DD344C"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Zones (bg -> zones -> arrows -> nodes) ===== -->
    <rect x="40" y="88" width="440" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="204" y="92" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="260" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">네임스페이스 A</text>

    <rect x="560" y="88" width="360" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="684" y="92" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="740" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">네임스페이스 B</text>

    <!-- ===== Arrows ===== -->
    <!-- FE -> API (allow) -->
    <line x1="256" y1="176" x2="256" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- API -> DB (allow) -->
    <line x1="256" y1="304" x2="256" y2="348" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- FE -> DB (deny, dashed, bridges across the API column) -->
    <path d="M 168,148 H 100 Q 92,148 92,156 V 368 Q 92,376 100,376 H 178"
          fill="none" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-deny)"/>
    <!-- MON -> API (allow) -->
    <path d="M 700,232 H 320 Q 312,232 312,240 V 244 Q 312,252 304,252 H 340"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- MON -> DB (deny, dashed) -->
    <path d="M 700,268 H 460 Q 452,268 452,276 V 364 Q 452,372 444,372 H 340"
          fill="none" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-deny)"/>

    <!-- Arrow labels -->
    <rect x="234" y="188" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="256" y="197" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>
    <rect x="234" y="316" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="256" y="325" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>
    <rect x="68" y="252" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="88" y="261" fill="#DD344C" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DENY</text>
    <rect x="480" y="226" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="502" y="235" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>
    <rect x="480" y="336" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="500" y="345" fill="#DD344C" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DENY</text>

    <!-- ===== Nodes ===== -->
    <!-- FE -->
    <rect x="176" y="120" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="176" y="120" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="256" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Frontend Pod</text>
    <text x="256" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">app: frontend</text>

    <!-- API -->
    <rect x="176" y="248" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="176" y="248" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="256" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">API Pod</text>
    <text x="256" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">app: api</text>

    <!-- DB (focal) -->
    <rect x="176" y="376" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="176" y="376" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="256" y="400" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Database Pod</text>
    <text x="256" y="416" fill="#EC7211" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">app: db</text>

    <!-- Policy chips (unconnected, decorative) -->
    <rect x="380" y="130" width="88" height="24" rx="4" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <text x="424" y="146" fill="#DD344C" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">NETPOL 1</text>
    <rect x="380" y="164" width="88" height="24" rx="4" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <text x="424" y="180" fill="#DD344C" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">NETPOL 2</text>

    <!-- MON -->
    <rect x="620" y="120" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="620" y="120" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="700" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Monitoring Pod</text>
    <text x="700" y="160" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">app: monitoring</text>

    <rect x="620" y="204" width="88" height="24" rx="4" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <text x="664" y="220" fill="#DD344C" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">NETPOL 3</text>

    <!-- Legend -->
    <line x1="40" y1="480" x2="920" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="180" y1="491" x2="204" y2="491" stroke="#545B64" stroke-width="1.2"/>
    <text x="212" y="496" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">허용된 트래픽</text>
    <line x1="380" y1="491" x2="404" y2="491" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="412" y="496" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">정책으로 차단된 트래픽</text>
    <rect x="640" y="486" width="12" height="12" rx="2" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.60)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <text x="658" y="496" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">NetworkPolicy 리소스</text>
  </svg>