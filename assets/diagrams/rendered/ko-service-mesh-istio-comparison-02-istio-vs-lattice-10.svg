<title id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-10-title">Istio 트러블슈팅: 5개 레이어를 순차 점검하는 디버깅 절차</title>
<desc id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-10-desc">503 오류가 발생하면 Application, Sidecar, Control Plane, Network, CRD 설정 순으로 다섯 개 레이어를 하나씩 점검하고, 각 단계에서 원인이 발견되면 해당 도구로 확인하며, 모든 레이어를 통과해도 원인이 없으면 Support 티켓으로 넘어가는 Istio 트러블슈팅 절차를 보여준다.</desc>
