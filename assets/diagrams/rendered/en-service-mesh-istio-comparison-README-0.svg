<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-service-mesh-istio-comparison-README-0-title en-service-mesh-istio-comparison-README-0-desc">
<title id="en-service-mesh-istio-comparison-README-0-title">Service Mesh Selection Criteria</title>
<desc id="en-service-mesh-istio-comparison-README-0-desc">Flowchart of two decision paths for choosing a service mesh: a Kubernetes-platform-first path that ends in Istio, Linkerd, or Consul/Kong Mesh, and an AWS-centric path that ends in VPC Lattice, Istio on EKS, Istio Multi-cluster, or a regional solution.</desc>

<defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#FFFFFF"/>

<!-- Zone eyebrows -->
<text x="16" y="16" class="eyebrow">PLATFORM-FIRST PATH</text>
<text x="512" y="16" class="eyebrow">AWS-CENTRIC PATH</text>

<!-- Zone divider -->
<line x1="456" y1="8" x2="456" y2="388" stroke="var(--rule)" stroke-width="0.8"/>

<!-- ============ EDGES (drawn before boxes) ============ -->
<g fill="none" stroke="#545B64" stroke-width="1">
  <!-- Column A -->
  <path d="M100,96 L100,124" marker-end="url(#arrow)"/>
  <path d="M156,64 L276,64" marker-end="url(#arrow)"/>
  <path d="M156,156 L276,156" marker-end="url(#arrow)"/>
  <path d="M100,188 L100,216" marker-end="url(#arrow)"/>
  <path d="M156,248 L276,248" marker-end="url(#arrow)"/>
  <!-- Column B -->
  <path d="M668,64 L620,64 Q612,64 612,72 L612,172" marker-end="url(#arrow)"/>
  <path d="M780,64 L828,64 Q836,64 836,72 L836,172" marker-end="url(#arrow)"/>
  <path d="M668,204 L668,320" marker-end="url(#arrow)"/>
  <path d="M836,236 L836,312 Q836,320 828,320 L780,320" marker-end="url(#arrow)"/>
  <path d="M892,204 L892,320" marker-end="url(#arrow)"/>
</g>
<g fill="none" stroke="#EC7211" stroke-width="1.2">
  <path d="M100,280 L100,320" marker-end="url(#arrow-accent)"/>
  <path d="M612,236 L612,312 Q612,320 604,320 L556,320" marker-end="url(#arrow-accent)"/>
</g>

<!-- ============ EDGE LABELS ============ -->
<g>
  <rect x="108" y="104" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="123" y="113" class="arrow-label">YES</text>

  <rect x="206" y="44" width="20" height="12" rx="2" fill="#ffffff"/>
  <text x="216" y="53" class="arrow-label">NO</text>

  <rect x="166" y="136" width="100" height="12" rx="2" fill="#ffffff"/>
  <text x="216" y="145" class="arrow-label">MULTI-PLATFORM</text>

  <rect x="106" y="196" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="136" y="205" class="arrow-label">K8S ONLY</text>

  <rect x="206" y="228" width="20" height="12" rx="2" fill="#ffffff"/>
  <text x="216" y="237" class="arrow-label">NO</text>

  <rect x="108" y="294" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="123" y="303" class="arrow-label">YES</text>

  <rect x="634" y="44" width="20" height="12" rx="2" fill="#ffffff"/>
  <text x="644" y="53" class="arrow-label">YES</text>

  <rect x="794" y="44" width="20" height="12" rx="2" fill="#ffffff"/>
  <text x="804" y="53" class="arrow-label">NO</text>

  <rect x="620" y="268" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="635" y="277" class="arrow-label">YES</text>

  <rect x="676" y="254" width="20" height="12" rx="2" fill="#ffffff"/>
  <text x="686" y="263" class="arrow-label">NO</text>

  <rect x="844" y="268" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="859" y="277" class="arrow-label">YES</text>

  <rect x="900" y="254" width="20" height="12" rx="2" fill="#ffffff"/>
  <text x="910" y="263" class="arrow-label">NO</text>
</g>

<!-- ============ NODES ============ -->
<g>
  <!-- Start: diamond -->
  <polygon points="100,32 156,64 100,96 44,64" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="100" y="60" class="node-name">Need Service</text>
  <text x="100" y="74" class="node-name">Mesh?</text>

  <!-- Q1: diamond -->
  <polygon points="100,124 156,156 100,188 44,156" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="100" y="160" class="node-name">Platform?</text>

  <!-- NoMesh: rect -->
  <rect x="276" y="44" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="340" y="60" class="node-name">Use basic K8s</text>
  <text x="340" y="74" class="node-name">Service</text>

  <!-- ConsulKong: rect -->
  <rect x="276" y="136" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="340" y="152" class="node-name">Consider Consul</text>
  <text x="340" y="166" class="node-name">/Kong Mesh</text>

  <!-- Q2: diamond -->
  <polygon points="100,216 156,248 100,280 44,248" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="100" y="244" class="node-name">Can accept</text>
  <text x="100" y="258" class="node-name">complexity?</text>

  <!-- Linkerd: rect -->
  <rect x="276" y="228" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="340" y="252" class="node-name">Select Linkerd</text>

  <!-- Istio: rect, FOCAL -->
  <rect x="36" y="320" width="128" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="100" y="344" class="node-name">Select Istio</text>

  <!-- Q3: diamond -->
  <polygon points="724,32 780,64 724,96 668,64" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="724" y="68" class="node-name">AWS-centric?</text>

  <!-- Q4: diamond -->
  <polygon points="612,172 668,204 612,236 556,204" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="612" y="200" class="node-name">Serverless/</text>
  <text x="612" y="214" class="node-name">Simplicity?</text>

  <!-- Q5: diamond -->
  <polygon points="836,172 892,204 836,236 780,204" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="836" y="208" class="node-name">Multi-cloud?</text>

  <!-- Lattice: rect, FOCAL-adjacent (VPC Lattice recommendation) -->
  <rect x="508" y="320" width="96" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="556" y="344" class="node-name">VPC Lattice</text>

  <!-- IstioEKS: rect, FOCAL -->
  <rect x="620" y="320" width="96" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="668" y="336" class="node-name">Istio on</text>
  <text x="668" y="350" class="node-name">EKS</text>

  <!-- IstioMulti: rect -->
  <rect x="732" y="320" width="96" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="780" y="336" class="node-name">Istio Multi-</text>
  <text x="780" y="350" class="node-name">cluster</text>

  <!-- Regional: rect -->
  <rect x="844" y="320" width="96" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="892" y="336" class="node-name">Regional</text>
  <text x="892" y="350" class="node-name">Solution</text>
</g>

<!-- ============ LEGEND ============ -->
<line x1="16" y1="392" x2="944" y2="392" stroke="var(--rule)" stroke-width="0.8"/>
<text x="16" y="408" class="eyebrow">LEGEND</text>
<polygon points="100,412 108,420 100,428 92,420" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="116" y="424" class="legend-text">Decision</text>
<rect x="196" y="412" width="16" height="16" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="220" y="424" class="legend-text">Outcome</text>
<rect x="312" y="412" width="16" height="16" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="336" y="424" class="legend-text">Istio recommendation</text>

</svg>