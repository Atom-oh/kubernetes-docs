<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="envoy-dns-title envoy-dns-desc">
    <title id="envoy-dns-title">Envoy가 직접 처리하는 DNS 해석</title>
    <desc id="envoy-dns-desc">애플리케이션의 TCP 연결이 Envoy의 Listener, DNS Filter, Route Match, Cluster를 거쳐 Endpoint Discovery에서 Istiod의 xDS Server와 EDS API로 통신하며 CoreDNS 호출 없이 엔드포인트를 해석하는 과정을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Envoy Proxy -->
    <rect x="136" y="216" width="576" height="144" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="384" y="220" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="444" y="229" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ENVOY PROXY</text>

    <!-- Arrows -->
    <line x1="128" y1="280" x2="152" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="264" y1="280" x2="288" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="400" y1="280" x2="424" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="536" y1="280" x2="560" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="672" y1="280" x2="696" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="808" y1="280" x2="832" y2="280" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>

    <!-- Label for the informative bidir exchange -->
    <rect x="811" y="256" width="18" height="12" rx="2" fill="#ffffff"/>
    <text x="820" y="265" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">EDS</text>

    <!-- Node: 애플리케이션 -->
    <rect x="16" y="248" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="16" y="248" width="112" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="24" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="38" y="265" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="72" y="284" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">애플리케이션</text>
    <text x="72" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">curl:9080</text>

    <!-- Node: Listener -->
    <rect x="152" y="248" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="152" y="248" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="160" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="172" y="265" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L1</text>
    <text x="208" y="284" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Listener</text>
    <text x="208" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">:15001</text>

    <!-- Node: DNS Filter -->
    <rect x="288" y="248" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="288" y="248" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="296" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="308" y="265" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L2</text>
    <text x="344" y="284" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">DNS Filter</text>
    <text x="344" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">host header</text>

    <!-- Node: Route Match -->
    <rect x="424" y="248" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="424" y="248" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="432" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="444" y="265" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L3</text>
    <text x="480" y="284" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Route Match</text>
    <text x="480" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">name resolve</text>

    <!-- Node: Cluster -->
    <rect x="560" y="248" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="560" y="248" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="568" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="580" y="265" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L4</text>
    <text x="616" y="284" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cluster</text>
    <text x="616" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">outbound:9080</text>

    <!-- Node: Endpoint Discovery (focal) -->
    <rect x="696" y="248" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="696" y="248" width="112" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="704" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="716" y="265" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L5</text>
    <text x="752" y="284" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Endpoint</text>
    <text x="752" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">discovery</text>

    <!-- Node: xDS Server (Istiod) -->
    <rect x="832" y="248" width="112" height="64" rx="6" fill="#ffffff"/>
    <rect x="832" y="248" width="112" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="840" y="256" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="856" y="265" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
    <text x="888" y="284" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">xDS Server</text>
    <text x="888" y="300" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Istiod</text>

    <!-- Legend -->
    <line x1="16" y1="404" x2="944" y2="404" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="16" y="420" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="16" y="432" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="36" y="440" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal · EDS 조회</text>
    <line x1="240" y1="440" x2="268" y2="440" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-start)"/>
    <text x="276" y="442" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">양방향 gRPC 스트림</text>
  </svg>