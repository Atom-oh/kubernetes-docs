<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ml-stack-title ml-stack-desc">
    <title id="ml-stack-title">The EKS AI/ML platform stack</title>
    <desc id="ml-stack-desc">Four dependent layers stacked on EKS: ML workloads such as training and inference run on platform services like Ray and KServe, which schedule onto GPU, Neuron, and CPU compute pools, all provisioned on the EKS base layer's control plane, storage, and networking.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- direction indicator -->
    <text x="40" y="44" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RUNTIME DEPENDENCY &#8595;</text>

    <!-- connecting arrows between bands -->
    <line x1="480" y1="164" x2="480" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="276" x2="480" y2="288" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="388" x2="480" y2="400" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Band 1: ML Workloads ===== -->
    <rect x="40" y="64" width="880" height="100" rx="8" fill="#ffffff" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
    <text x="56" y="88" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">01</text>
    <text x="84" y="90" fill="#232F3E" font-size="15" font-weight="600" font-family="'Amazon Ember', sans-serif">ML Workloads</text>
    <text x="904" y="88" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">what teams run</text>
    <g font-family="'Geist Mono', monospace" font-size="9" fill="#545B64">
      <rect x="56" y="112" width="152" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="132" y="130" text-anchor="middle">Training</text>
      <rect x="216" y="112" width="152" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="292" y="130" text-anchor="middle">Inference</text>
      <rect x="376" y="112" width="152" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="452" y="130" text-anchor="middle">Notebooks</text>
      <rect x="536" y="112" width="152" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="612" y="130" text-anchor="middle">ML Pipelines</text>
      <rect x="696" y="112" width="152" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="772" y="130" text-anchor="middle">AI Agents</text>
    </g>

    <!-- ===== Band 2: Platform Services ===== -->
    <rect x="40" y="176" width="880" height="100" rx="8" fill="#ffffff" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
    <text x="56" y="200" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">02</text>
    <text x="84" y="202" fill="#232F3E" font-size="15" font-weight="600" font-family="'Amazon Ember', sans-serif">Platform Services</text>
    <text x="904" y="200" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">serving &amp; tracking</text>
    <g font-family="'Geist Mono', monospace" font-size="9" fill="#545B64">
      <rect x="56" y="224" width="152" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="132" y="242" text-anchor="middle">Ray Cluster</text>
      <rect x="216" y="224" width="152" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="292" y="242" text-anchor="middle">KServe</text>
      <rect x="376" y="224" width="152" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="452" y="242" text-anchor="middle">Kubeflow</text>
      <rect x="536" y="224" width="152" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="612" y="242" text-anchor="middle">MLflow</text>
      <rect x="696" y="224" width="152" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="772" y="242" text-anchor="middle">Vector DB</text>
    </g>

    <!-- ===== Band 3: Compute (focal) ===== -->
    <rect x="40" y="288" width="880" height="100" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="56" y="312" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">03</text>
    <text x="84" y="314" fill="#232F3E" font-size="15" font-weight="600" font-family="'Amazon Ember', sans-serif">Compute</text>
    <text x="904" y="312" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">GPU · Neuron · CPU</text>
    <g font-family="'Geist Mono', monospace" font-size="9" fill="#232F3E">
      <rect x="56" y="336" width="192" height="28" rx="4" fill="#ffffff" stroke="#EC7211" stroke-width="1"/>
      <text x="152" y="354" text-anchor="middle">GPU NodePools</text>
      <rect x="264" y="336" width="192" height="28" rx="4" fill="#ffffff" stroke="#EC7211" stroke-width="1"/>
      <text x="360" y="354" text-anchor="middle">Neuron NodePools</text>
      <rect x="472" y="336" width="192" height="28" rx="4" fill="#ffffff" stroke="#EC7211" stroke-width="1"/>
      <text x="568" y="354" text-anchor="middle">CPU NodePools</text>
      <rect x="680" y="336" width="192" height="28" rx="4" fill="#ffffff" stroke="#EC7211" stroke-width="1"/>
      <text x="776" y="354" text-anchor="middle">Spot Instances</text>
    </g>

    <!-- ===== Band 4: EKS Base ===== -->
    <rect x="40" y="400" width="880" height="100" rx="8" fill="#ffffff" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
    <text x="56" y="424" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">04</text>
    <text x="84" y="426" fill="#232F3E" font-size="15" font-weight="600" font-family="'Amazon Ember', sans-serif">EKS Base</text>
    <text x="904" y="424" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">control plane &amp; infra</text>
    <g font-family="'Geist Mono', monospace" font-size="9" fill="#545B64">
      <rect x="56" y="448" width="192" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="152" y="466" text-anchor="middle">EKS Control Plane</text>
      <rect x="264" y="448" width="192" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="360" y="466" text-anchor="middle">Karpenter</text>
      <rect x="472" y="448" width="192" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="568" y="466" text-anchor="middle">Storage (EFS/FSx/S3)</text>
      <rect x="680" y="448" width="192" height="28" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
      <text x="776" y="466" text-anchor="middle">Networking (VPC/EFA)</text>
    </g>

    <!-- legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="160" y="531" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="180" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Layer component</text>
    <rect x="380" y="531" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="400" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Focal layer: compute allocation</text>
  </svg>
