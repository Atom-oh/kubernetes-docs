<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t4-title t4-desc">
<title id="t4-title">블루/그린 트래픽 전환 단계</title>
<desc id="t4-desc">전환 전에는 로드밸런서가 Blue v1로만 트래픽을 보내고 Green v2는 준비 상태이며, 테스트 단계에서는 실제 트래픽은 Blue로 가면서 미러 트래픽만 Green으로 보내 검증하고, 전환 후에는 로드밸런서가 Green v2로 전환되고 Blue v1은 대기 상태가 되는 과정을 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zones -->
<rect x="32" y="32" width="272" height="536" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="48" y="36" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="92" y="45" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">전환 전</text>

<rect x="344" y="32" width="272" height="536" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="360" y="36" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="404" y="45" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">테스트 단계</text>

<rect x="656" y="32" width="272" height="536" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="672" y="36" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="716" y="45" fill="rgba(35,47,62,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">전환 후</text>

<!-- Before -->
<rect x="60" y="100" width="216" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="168" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Load Balancer</text>

<rect x="60" y="220" width="216" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="168" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Blue · v1 (활성)</text>

<rect x="60" y="340" width="216" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="168" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Green · v2 (준비 중)</text>

<line x1="168" y1="156" x2="168" y2="220" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<!-- Testing -->
<rect x="372" y="100" width="216" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Load Balancer</text>

<rect x="372" y="220" width="216" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="480" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Blue · v1 (활성)</text>

<rect x="372" y="340" width="216" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="480" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Green · v2 (테스트)</text>

<line x1="456" y1="156" x2="456" y2="220" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<path d="M 504,156 V 196 Q 504,204 496,204 H 300 Q 292,204 292,212 V 300 Q 292,308 300,308 H 372"
      fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="308" y="212" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="344" y="221" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">미러 트래픽</text>

<!-- After -->
<rect x="684" y="100" width="216" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="792" y="132" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Load Balancer</text>

<rect x="684" y="220" width="216" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
<text x="792" y="252" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Blue · v1 (대기)</text>

<rect x="684" y="340" width="216" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="792" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Green · v2 (활성)</text>

<path d="M 792,156 V 180 Q 792,188 800,188 H 912 Q 920,188 920,196 V 312 Q 920,320 912,320 H 800 Q 792,320 792,328 V 340"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<!-- Legend -->
<line x1="32" y1="580" x2="928" y2="580" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="32" y="586" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="52" y="594" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">활성 트래픽 (focal)</text>
<line x1="240" y1="592" x2="268" y2="592" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="276" y="594" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">미러/검증 트래픽</text>
</svg>