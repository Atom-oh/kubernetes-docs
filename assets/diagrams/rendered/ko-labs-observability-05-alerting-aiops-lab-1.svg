<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inv-life-ttl inv-life-desc">
  <title id="inv-life-ttl">CloudWatch Investigations 상태 흐름</title>
  <desc id="inv-life-desc">CloudWatch 경보 발생부터 리소스 스캔, AI 기반 근본 원인 가설 생성, 제안 조치, 인시던트 보고서 생성까지 CloudWatch Investigations가 거치는 7단계 순차 상태 흐름을 보여준다.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="30" y="34" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.18em">STATE MACHINE</text>
  <text x="30" y="58" fill="#232F3E" font-size="20" font-weight="700">Investigation 진행 상태</text>

  <!-- Start dot -->
  <circle cx="60" cy="300" r="6" fill="#232F3E"/>

  <!-- Transition: start -> AlertDetected -->
  <path d="M 66,300 H 96" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- States row 1: AlertDetected, InvestigationStart, ResourceScan, KeyFindings -->
  <!-- AlertDetected -->
  <rect x="100" y="272" width="128" height="56" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="164" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">경보 발생</text>

  <path d="M 228,300 H 268" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="234" y="284" width="32" height="12" rx="2" fill="#ffffff"/>
  <text x="250" y="293" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">시작</text>

  <!-- InvestigationStart -->
  <rect x="272" y="272" width="140" height="56" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="342" y="296" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Investigation</text>
  <text x="342" y="312" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">시작</text>

  <path d="M 412,300 H 452" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="418" y="284" width="32" height="12" rx="2" fill="#ffffff"/>
  <text x="434" y="293" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">스캔</text>

  <!-- ResourceScan -->
  <rect x="456" y="272" width="128" height="56" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="520" y="296" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">리소스 스캔</text>
  <text x="520" y="312" fill="#545B64" font-size="9" class="mono" text-anchor="middle">및 분석</text>

  <path d="M 584,300 H 624" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="590" y="284" width="32" height="12" rx="2" fill="#ffffff"/>
  <text x="606" y="293" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">수집</text>

  <!-- KeyFindings -->
  <rect x="628" y="272" width="128" height="56" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="692" y="296" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">주요 발견</text>
  <text x="692" y="312" fill="#545B64" font-size="9" class="mono" text-anchor="middle">사항 수집</text>

  <!-- Row1 -> Row2 vertical transition: KeyFindings(bottom) -> Hypothesis(top), via right-side elbow -->
  <path d="M 756,300 H 800 Q 808,300 808,308 V 384 Q 808,392 800,392 H 786"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="812" y="330" width="76" height="12" rx="2" fill="#ffffff"/>
  <text x="850" y="339" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">AI 근본 원인</text>

  <!-- Row 2: Hypothesis (focal), Suggestions, IncidentReport -->
  <rect x="630" y="364" width="156" height="56" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="708" y="388" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">근본 원인 가설</text>
  <text x="708" y="404" fill="#EC7211" font-size="9" class="mono" text-anchor="middle">AI 생성</text>

  <path d="M 630,392 H 590" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="596" y="376" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="624" y="385" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">제안</text>

  <!-- Suggestions -->
  <rect x="446" y="364" width="128" height="56" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="510" y="396" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">제안 조치</text>

  <path d="M 446,392 H 306" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="336" y="376" width="80" height="12" rx="2" fill="#ffffff"/>
  <text x="376" y="385" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.02em">보고서 생성</text>

  <!-- IncidentReport -->
  <rect x="146" y="364" width="160" height="56" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="226" y="388" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">인시던트</text>
  <text x="226" y="404" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">보고서 생성</text>

  <!-- IncidentReport -> end -->
  <path d="M 146,392 H 106" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <circle cx="90" cy="392" r="8" fill="none" stroke="#232F3E" stroke-width="1.2"/>
  <circle cx="90" cy="392" r="5" fill="#232F3E"/>

  <!-- Legend -->
  <line x1="30" y1="470" x2="930" y2="470" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="486" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
  <circle cx="150" cy="482" r="5" fill="#232F3E"/>
  <text x="164" y="486" fill="#545B64" font-size="9" class="mono">시작</text>
  <circle cx="260" cy="482" r="7" fill="none" stroke="#232F3E" stroke-width="1.2"/>
  <circle cx="260" cy="482" r="4" fill="#232F3E"/>
  <text x="276" y="486" fill="#545B64" font-size="9" class="mono">종료</text>
  <rect x="380" y="474" width="20" height="16" rx="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="410" y="486" fill="#545B64" font-size="9" class="mono">AI 판단 지점</text>
</svg>