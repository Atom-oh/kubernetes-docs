<text x="645" y="273" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUDIT</text>
<text x="692" y="302" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Audit Results</text>
<text x="692" y="318" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">periodic scan</text>

