<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="multiprimary-title multiprimary-desc">
  <title id="multiprimary-title">Multi-primary Istio multi-cluster control plane</title>
  <desc id="multiprimary-desc">Diagram showing a shared primary Istiod distributing configuration to each cluster's local Istiod, which discovers its own services, while pods in the two clusters communicate directly across the cluster boundary.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="40" y="176" width="240" height="228" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="112" y="180" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="160" y="189" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER 1</text>

  <rect x="680" y="176" width="240" height="228" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="752" y="180" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="800" y="189" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER 2</text>

  <!-- Arrows -->
  <!-- Primary Istiod -> Istiod1 / Istiod2 (config distribution) -->
  <path d="M 440,104 H 98 Q 90,104 90,112 V 208" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <path d="M 520,104 H 872 Q 880,104 880,112 V 208" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="140" y="140" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="184" y="149" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG SYNC</text>
  <rect x="732" y="140" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="776" y="149" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG SYNC</text>

  <!-- Istiod1 -> Service A ; Istiod2 -> Service B (discovery) -->
  <line x1="144" y1="272" x2="144" y2="304" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="816" y1="272" x2="816" y2="304" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="102" y="280" width="84" height="12" rx="2" fill="#ffffff"/>
  <text x="144" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISCOVER</text>
  <rect x="774" y="280" width="84" height="12" rx="2" fill="#ffffff"/>
  <text x="816" y="289" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISCOVER</text>

  <!-- Service A -> Pod A ; Service B -> Pod B -->
  <line x1="144" y1="352" x2="144" y2="368" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="816" y1="352" x2="816" y2="368" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Pod A <-> Pod B cross-cluster -->
  <path d="M 224,384 H 736" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <rect x="432" y="364" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="480" y="373" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CROSS-CLUSTER</text>

  <!-- Node: Primary Istiod (focal, shared) -->
  <rect x="360" y="40" width="240" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="480" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Primary Istiod</text>
  <text x="480" y="84" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared discovery manager</text>

  <!-- Node: Istiod1 -->
  <rect x="56" y="208" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="144" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istiod</text>
  <text x="144" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">primary (local)</text>

  <!-- Node: Service A -->
  <rect x="56" y="304" width="176" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="144" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service A</text>

  <!-- Node: Pod A -->
  <rect x="56" y="368" width="176" height="16" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
  <text x="144" y="379" fill="#232F3E" font-size="9" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A</text>

  <!-- Node: Istiod2 -->
  <rect x="728" y="208" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="816" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istiod</text>
  <text x="816" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">remote (local)</text>

  <!-- Node: Service B -->
  <rect x="728" y="304" width="176" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="816" y="332" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service B</text>

  <!-- Node: Pod B -->
  <rect x="728" y="368" width="176" height="16" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
  <text x="816" y="379" fill="#232F3E" font-size="9" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B</text>

  <!-- Legend -->
  <line x1="30" y1="552" x2="930" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <circle cx="200" cy="564" r="5" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
  <text x="212" y="568" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">SHARED PRIMARY CONTROL PLANE</text>
  <circle cx="500" cy="564" r="5" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="512" y="568" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">PER-CLUSTER ISTIOD</text>
</svg>