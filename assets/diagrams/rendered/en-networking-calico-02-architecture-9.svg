      <title id="en-networking-calico-02-architecture-9-title">Kubernetes API datastore</title>
      <desc id="en-networking-calico-02-architecture-9-desc">Diagram showing Felix, Typha, and kube-controllers all reading and writing Calico state through the Kubernetes API server, which itself persists to etcd - no separate Calico etcd cluster required.</desc>
