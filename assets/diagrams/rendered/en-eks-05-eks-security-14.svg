    <title id="en-eks-05-eks-security-14-title">EKS security monitoring and detection workflow</title>
    <desc id="en-eks-05-eks-security-14-desc">Architecture diagram showing AWS security services and Kubernetes security tools feeding signal collection, which is analyzed and correlated to drive response and remediation, while findings also report into AWS Security Hub, which in turn configures what signal categories are collected.</desc>
