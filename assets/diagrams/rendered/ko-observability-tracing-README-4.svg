<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4-title d4-desc">
    <title id="d4-title">Head-based Sampling</title>
    <desc id="d4-desc">요청이 도착하는 시점에 샘플링 여부를 즉시 결정해, 10%는 추적을 수집하고 90%는 건너뛰는 헤드 기반 샘플링 흐름을 보여준다.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows -->
    <line x1="184" y1="300" x2="280" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M360,244 H472 Q480,244 480,236 V180 Q480,172 488,172 H600" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M360,356 H472 Q480,356 480,364 V420 Q480,428 488,428 H600" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Labels -->
    <rect x="492" y="204" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="522" y="213" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">10% 샘플</text>

    <rect x="492" y="386" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="526" y="395" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">90% 건너뜀</text>

    <!-- Node: 요청 수신 (input) -->
    <rect x="40" y="268" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="268" width="144" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="112" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">요청 수신</text>

    <!-- Diamond: 샘플링 결정 (focal) -->
    <polygon points="360,244 440,300 360,356 280,300" fill="#ffffff"/>
    <polygon points="360,244 440,300 360,356 280,300" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="360" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">샘플링</text>
    <text x="360" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">결정</text>

    <!-- Node: 추적 수집 -->
    <rect x="600" y="140" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="140" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="672" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">추적 수집</text>

    <!-- Node: 추적 건너뜀 (skipped path) -->
    <rect x="600" y="396" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="396" width="144" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="672" y="432" fill="#545B64" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">추적 건너뜀</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <polygon points="47,536 61,542 47,548 33,542" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="70" y="546" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">결정 지점 (focal)</text>

    <rect x="240" y="537" width="14" height="10" rx="2" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="260" y="546" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">건너뛴 경로</text>
  </svg>