<text x="480" y="424" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">RDS Instance</text>

<rect x="580" y="392" width="140" height="56" rx="6" fill="rgba(35,47,62,0.03)"/>
<rect x="580" y="392" width="140" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
