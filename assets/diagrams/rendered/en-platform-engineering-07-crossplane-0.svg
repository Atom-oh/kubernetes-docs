<line x1="310" y1="336" x2="310" y2="392" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="480" y1="336" x2="480" y2="392" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="650" y1="336" x2="650" y2="392" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="284" y="352" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="322" y="361" text-anchor="middle" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">RECONCILES</text>

<!-- Nodes -->
<!-- XC -->
<rect x="380" y="48" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="380" y="48" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="70" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Claim (XC)</text>
<text x="480" y="86" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">namespace-scoped</text>

<!-- XRD -->
<rect x="235" y="160" width="150" height="64" rx="6" fill="#ffffff"/>
<rect x="235" y="160" width="150" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="310" y="186" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">XRD</text>
<text x="310" y="202" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">defines XR/XC schema</text>

<!-- XR (focal) -->
<rect x="405" y="160" width="150" height="64" rx="6" fill="rgba(255,153,0,0.10)"/>
<rect x="405" y="160" width="150" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="480" y="186" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Composite (XR)</text>
<text x="480" y="202" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">cluster-scoped</text>

<!-- COMP -->
<rect x="575" y="160" width="150" height="64" rx="6" fill="#ffffff"/>
<rect x="575" y="160" width="150" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="650" y="186" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Composition</text>
<text x="650" y="202" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">XR &#8594; managed resources</text>

<!-- MR1 MR2 MR3 -->
<rect x="240" y="280" width="140" height="56" rx="6" fill="rgba(35,47,62,0.05)"/>
<rect x="240" y="280" width="140" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="310" y="304" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Managed Resource</text>
<text x="310" y="320" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">S3 Bucket</text>

<rect x="410" y="280" width="140" height="56" rx="6" fill="rgba(35,47,62,0.05)"/>
<rect x="410" y="280" width="140" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="480" y="304" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Managed Resource</text>
<text x="480" y="320" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">RDS Instance</text>

<rect x="580" y="280" width="140" height="56" rx="6" fill="rgba(35,47,62,0.05)"/>
<rect x="580" y="280" width="140" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="650" y="304" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Managed Resource</text>
<text x="650" y="320" text-anchor="middle" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Security Group</text>

<!-- S3 RDS SG (AWS account, external treatment) -->
<rect x="240" y="392" width="140" height="56" rx="6" fill="rgba(35,47,62,0.03)"/>
<rect x="240" y="392" width="140" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
