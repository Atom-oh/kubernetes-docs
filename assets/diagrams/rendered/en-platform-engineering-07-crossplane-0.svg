<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cp-model-title cp-model-desc">
<title id="cp-model-title">Crossplane claim-to-resource pipeline</title>
<desc id="cp-model-desc">A developer Claim triggers a Composite Resource, which a Composition maps to Managed Resources that Crossplane reconciles into real S3, RDS, and Security Group resources in the AWS account.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- Zones (bg -> zones -> arrows -> nodes) -->
<rect x="20" y="16" width="920" height="96" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="32" y="20" width="168" height="12" rx="2" fill="#ffffff"/>
<text x="116" y="29" text-anchor="middle" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.14em">DEVELOPER INTERFACE</text>

<rect x="20" y="128" width="920" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="32" y="132" width="228" height="12" rx="2" fill="#ffffff"/>
<text x="146" y="141" text-anchor="middle" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.14em">PLATFORM ABSTRACTION LAYER</text>

<rect x="20" y="248" width="920" height="96" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="32" y="252" width="180" height="12" rx="2" fill="#ffffff"/>
<text x="122" y="261" text-anchor="middle" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CLOUD PROVIDER LAYER</text>

<rect x="20" y="360" width="920" height="96" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="32" y="364" width="128" height="12" rx="2" fill="#ffffff"/>
<text x="96" y="373" text-anchor="middle" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.14em">AWS ACCOUNT</text>

<!-- Arrows (before nodes) -->
<!-- XC(480,104) -> XR(480,160) straight -->
<line x1="480" y1="104" x2="480" y2="160" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="454" y="122" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="131" text-anchor="middle" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">CREATES</text>

<!-- XRD(310,192 right)->XR(405,192 left) straight -->
<line x1="385" y1="192" x2="405" y2="192" stroke="#545B64" stroke-width="1"/>
<!-- arrowhead via marker on short line -->
<line x1="384" y1="192" x2="405" y2="192" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- XRD -> XC elbow (defines schema) -->
<path d="M310,160 V140 Q310,132 318,132 H412 Q420,132 420,124 V104" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="337" y="112" width="90" height="12" rx="2" fill="#ffffff"/>
<text x="382" y="121" text-anchor="middle" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">DEFINES SCHEMA</text>

<!-- XR(555,192)->COMP(575,192) straight (selects) -->
<line x1="555" y1="192" x2="575" y2="192" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- COMP fan -> MR1,MR2,MR3 -->
<path d="M600,224 V228 Q600,236 592,236 H318 Q310,236 310,244 V280" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M650,224 V244 Q650,252 642,252 H488 Q480,252 480,260 V280" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M700,224 V260 Q700,268 692,268 H658 Q650,268 650,276 V280" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="520" y="230" width="90" height="12" rx="2" fill="#ffffff"/>
<text x="565" y="239" text-anchor="middle" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">MAPS TO</text>

