<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0title d0desc">
  <title id="d0title">Kubernetes 확장 지점 개요</title>
  <desc id="d0desc">사용자 요청을 받는 API 서버가 API 확장, 컨트롤러 확장, 스케줄링 확장 지점으로 이어지고, 별도로 노드가 CSI·CNI·디바이스 플러그인으로 확장되는 Kubernetes의 주요 확장 지점 구조를 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="28" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.18em">ARCHITECTURE · EXTENSION POINTS</text>
  <text x="40" y="50" fill="#232F3E" font-size="16" font-weight="700" class="sans">Kubernetes 확장 지점 개요</text>
  <text x="40" y="66" fill="#545B64" font-size="10" class="sans">API 서버를 중심으로 API·컨트롤러·스케줄링·노드 네 방향으로 확장된다</text>

  <!-- ============ Zones ============ -->
  <rect x="40" y="128" width="400" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="56" y="132" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="92" y="141" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">API 확장</text>

  <rect x="456" y="128" width="248" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="472" y="132" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="520" y="141" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">컨트롤러 확장</text>

  <rect x="720" y="128" width="176" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="736" y="132" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="784" y="141" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">스케줄링 확장</text>

  <rect x="200" y="360" width="560" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="216" y="364" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="252" y="373" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">노드 확장</text>

  <!-- ============ Arrows ============ -->
  <!-- User -> API (headline, accent) -->
  <path d="M192,92 H392" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- API -> CR -->
  <path d="M412,108 V148 Q412,156 404,156 H116 Q108,156 108,164" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- API -> AC -->
  <path d="M432,108 V148 Q432,156 424,156 H248 Q240,156 240,164" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- API -> AE -->
  <path d="M452,108 V148 Q452,156 444,156 H380 Q372,156 372,164" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- API -> Node -->
  <path d="M464,108 V280" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- API -> CCM -->
  <path d="M488,108 V140 Q488,148 496,148 H630 Q638,148 638,156 V160" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- API -> SCH -->
  <path d="M508,108 V148 Q508,156 516,156 H800 Q808,156 808,164" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- CR -> OP -->
  <path d="M140,164 V158 Q140,150 148,150 H514 Q522,150 522,158 V164" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Node -> CSI -->
  <path d="M454,312 V346 Q454,354 446,354 H300 Q292,354 292,362 V396" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Node -> CNI -->
  <path d="M480,312 V396" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Node -> DP -->
  <path d="M506,312 V346 Q506,354 514,354 H660 Q668,354 668,362 V396" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============ Nodes ============ -->
  <!-- User (input) -->
  <rect x="56" y="76" width="136" height="32" rx="6" fill="#ffffff"/>
  <rect x="56" y="76" width="136" height="32" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="124" y="96" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">사용자/클라이언트</text>

  <!-- API 서버 (focal) -->
  <rect x="392" y="76" width="136" height="32" rx="6" fill="#ffffff"/>
  <rect x="392" y="76" width="136" height="32" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="460" y="96" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">API 서버</text>

  <!-- API 확장 zone nodes -->
  <rect x="56" y="164" width="104" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="108" y="184" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">커스텀 리소스</text>

  <rect x="188" y="164" width="104" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="240" y="184" fill="#232F3E" font-size="10" font-weight="600" class="sans" text-anchor="middle">어드미션 컨트롤러</text>

  <rect x="320" y="164" width="104" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="372" y="184" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">API 서버 확장</text>

  <!-- 컨트롤러 확장 zone nodes -->
  <rect x="472" y="164" width="100" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="522" y="184" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">오퍼레이터</text>

  <rect x="588" y="160" width="100" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="638" y="178" fill="#232F3E" font-size="10" font-weight="600" class="sans" text-anchor="middle">클라우드 컨트롤러</text>
  <text x="638" y="190" fill="#232F3E" font-size="10" font-weight="600" class="sans" text-anchor="middle">매니저</text>

  <!-- 스케줄링 확장 zone node -->
  <rect x="736" y="164" width="144" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="808" y="184" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">스케줄러 확장</text>

  <!-- Node -->
  <rect x="428" y="280" width="104" height="32" rx="6" fill="#ffffff"/>
  <rect x="428" y="280" width="104" height="32" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="480" y="300" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">노드</text>

  <!-- CSI / CNI / DP -->
  <rect x="216" y="396" width="152" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="292" y="416" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">CSI 드라이버</text>

  <rect x="404" y="396" width="152" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="416" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">CNI 플러그인</text>

  <rect x="592" y="396" width="152" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="668" y="416" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">디바이스 플러그인</text>

  <!-- Legend -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="552" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
  <circle cx="200" cy="548" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="212" y="552" fill="#545B64" font-size="9" class="sans">진입점(API 서버)</text>
  <circle cx="360" cy="548" r="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="372" y="552" fill="#545B64" font-size="9" class="sans">노드 계층</text>
  <circle cx="480" cy="548" r="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="492" y="552" fill="#545B64" font-size="9" class="sans">확장 지점</text>
</svg>