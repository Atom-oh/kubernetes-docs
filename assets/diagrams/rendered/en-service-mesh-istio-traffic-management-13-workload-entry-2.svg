<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vm-workload-arch-title vm-workload-arch-desc">
    <title id="vm-workload-arch-title">VM workload architecture</title>
    <desc id="vm-workload-arch-desc">Architecture diagram showing a manually installed Envoy sidecar on a VM exchanging mTLS traffic with a Pod's auto-injected Envoy, while istiod pushes xDS config and certificates to both proxies.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <rect x="40" y="64" width="260" height="216" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="56" y="68" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="106" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">VIRTUAL MACHINE</text>
    <rect x="660" y="64" width="260" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="676" y="68" width="117" height="12" rx="2" fill="#ffffff"/>
    <text x="734" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">KUBERNETES CLUSTER</text>

    <line x1="170" y1="160" x2="170" y2="200" stroke="#545B64" stroke-width="1" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
    <line x1="790" y1="160" x2="790" y2="200" stroke="#545B64" stroke-width="1" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
