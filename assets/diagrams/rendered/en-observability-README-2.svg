<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc">
      <title id="d2-title">Request flow correlated by a single trace ID</title>
      <desc id="d2-desc">An HTTP request fans out from an API gateway through user, order, and payment services; each service emits logs, metrics, and traces tagged with one shared trace ID, which in turn links to a metric exemplar and a correlated log entry in a closed loop.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
        <marker id="arrow-accent-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>
      <rect width="960" height="600" fill="#ffffff"/>

      <!-- Zones -->
      <rect x="32" y="220" width="140" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="60" y="224" width="84" height="12" rx="2" fill="#ffffff"/>
      <text x="102" y="233" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">REQUEST</text>

      <rect x="228" y="64" width="360" height="416" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="342" y="68" width="132" height="12" rx="2" fill="#ffffff"/>
      <text x="408" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">MICROSERVICES</text>

      <rect x="644" y="220" width="284" height="240" rx="8" fill="rgba(255,153,0,0.05)" stroke="#EC7211" stroke-width="0.8"/>
      <rect x="740" y="224" width="96" height="12" rx="2" fill="#ffffff"/>
      <text x="788" y="233" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">CORRELATION</text>

      <!-- Arrows: Request -> Gateway -->
      <line x1="172" y1="280" x2="248" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Gateway -> User Service, Order Service -->
      <path d="M 428,264 H 480 Q 488,264 488,256 V 148 Q 488,140 496,140 H 508"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 428,296 H 480 Q 488,296 488,304 V 412 Q 488,420 496,420 H 508"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Order Service -> Payment Service -->
      <line x1="508" y1="420" x2="428" y2="420" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Dashed telemetry: Gateway, User, Order, Payment -> TraceID (fanned attach points on TraceID left edge) -->
      <path d="M 428,280 H 544 Q 552,280 552,272 V 264 Q 552,256 560,256 H 676"
            fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 578,172 V 260 Q 578,268 586,268 H 676"
            fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 578,388 V 288 Q 578,280 586,280 H 676"
            fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 428,420 H 544 Q 552,420 552,412 V 300 Q 552,292 560,292 H 676"
            fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="490" y="228" width="70" height="12" rx="2" fill="#ffffff"/>
      <text x="525" y="237" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.03em">L/M/TRACE</text>

      <!-- Correlation triangle (accent, focal) -->
      <line x1="720" y1="304" x2="720" y2="376" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
      <line x1="852" y1="304" x2="852" y2="376" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
      <line x1="780" y1="402" x2="792" y2="402" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>

      <!-- Nodes: Request -->
      <g>
        <rect x="52" y="248" width="100" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
        <text x="102" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">HTTP Request</text>
      </g>

      <!-- Nodes: Microservices -->
      <g>
        <rect x="248" y="248" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="338" y="276" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">API Gateway</text>
        <text x="338" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">entry point</text>
      </g>
      <g>
        <rect x="508" y="108" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="578" y="144" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">User Service</text>
      </g>
      <g>
        <rect x="508" y="388" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="578" y="424" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Order Service</text>
      </g>
      <g>
        <rect x="248" y="388" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="338" y="424" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Payment Service</text>
      </g>

      <!-- Nodes: Correlation (focal TraceID + two supporting) -->
      <g>
        <rect x="676" y="248" width="220" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
        <text x="786" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">TraceID: abc123</text>
        <text x="786" y="288" fill="#EC7211" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">shared correlation key</text>
      </g>
      <g>
        <rect x="660" y="376" width="120" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="720" y="406" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Metric Exemplar</text>
      </g>
      <g>
        <rect x="792" y="376" width="120" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="852" y="406" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Log Correlation</text>
      </g>

      <!-- Legend -->
      <line x1="32" y1="500" x2="928" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="32" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="32" y1="530" x2="60" y2="530" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent-rev)"/>
      <text x="68" y="533" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">Trace ID correlation (focal)</text>

      <line x1="290" y1="530" x2="318" y2="530" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="326" y="533" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">Telemetry emitted</text>

      <line x1="500" y1="530" x2="528" y2="530" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="536" y="533" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">Request path</text>
    </svg>