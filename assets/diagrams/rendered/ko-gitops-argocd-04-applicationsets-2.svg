<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">템플릿 Deep Merge 흐름</title>
  <desc id="d2">기본 템플릿과 생성기별 오버라이드가 Deep Merge 단계로 들어가 하나의 최종 템플릿으로 합쳐지며, 오버라이드 값이 기본 템플릿 값보다 우선 적용된다는 규칙을 함께 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;}
      .mono{font-family:'Geist Mono','Amazon Ember Mono',ui-monospace,monospace;}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <text x="32" y="28" class="mono" font-size="8" font-weight="500" letter-spacing="0.18em" fill="#7D8998">ARGO CD · APPLICATIONSET</text>
  <text x="32" y="52" font-size="20" font-weight="700" fill="#232F3E">템플릿 Deep Merge</text>

  <!-- Zones -->
  <rect x="32" y="88" width="260" height="424" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="1"/>
  <text x="48" y="108" class="mono" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#7D8998">입력</text>

  <rect x="340" y="88" width="220" height="424" rx="8" fill="rgba(255,153,0,0.04)" stroke="rgba(236,114,17,0.35)" stroke-width="1"/>
  <text x="356" y="108" class="mono" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#EC7211">병합</text>

  <rect x="608" y="88" width="320" height="424" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="1"/>
  <text x="624" y="108" class="mono" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#7D8998">결과</text>

  <!-- Arrows -->
  <path d="M 268 212 L 292 212 Q 300 212 300 220 L 300 276 Q 300 284 308 284 L 360 284"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 268 388 L 292 388 Q 300 388 300 380 L 300 324 Q 300 316 308 316 L 360 316"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 540 300 L 648 300" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Nodes -->
  <g>
    <rect x="48" y="180" width="220" height="64" rx="6" fill="#ffffff"/>
    <rect x="48" y="180" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="158" y="208" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">기본 템플릿</text>
    <text x="158" y="224" class="mono" font-size="9" fill="#545B64" text-anchor="middle">spec.template</text>
  </g>
  <g>
    <rect x="48" y="356" width="220" height="64" rx="6" fill="#ffffff"/>
    <rect x="48" y="356" width="220" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="158" y="384" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">생성기별 오버라이드</text>
    <text x="158" y="400" class="mono" font-size="9" fill="#545B64" text-anchor="middle">generators[].template</text>
  </g>

  <g>
    <rect x="360" y="256" width="180" height="88" rx="6" fill="#ffffff"/>
    <rect x="360" y="256" width="180" height="88" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="450" y="294" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Deep Merge</text>
    <text x="450" y="312" class="mono" font-size="9" fill="#545B64" text-anchor="middle">key-by-key override</text>
  </g>

  <g>
    <rect x="648" y="256" width="240" height="88" rx="6" fill="#ffffff"/>
    <rect x="648" y="256" width="240" height="88" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="768" y="294" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">최종 템플릿</text>
    <text x="768" y="312" class="mono" font-size="9" fill="#545B64" text-anchor="middle">Application spec</text>
  </g>

  <!-- Annotation callout -->
  <text x="912" y="150" fill="#232F3E" font-size="14" font-style="italic" font-weight="400" text-anchor="end">오버라이드가 기본 템플릿보다</text>
  <text x="912" y="170" fill="#232F3E" font-size="14" font-style="italic" font-weight="400" text-anchor="end">항상 우선 적용된다</text>
  <path d="M 828 178 Q 700 220 460 250" fill="none" stroke="rgba(35,47,62,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="460" cy="250" r="2" fill="#232F3E"/>

  <!-- Legend -->
  <line x1="32" y1="580" x2="928" y2="580" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="32" y="592" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <circle cx="140" cy="589" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="150" y="592" class="mono" font-size="8" fill="#545B64">DEEP MERGE (FOCAL)</text>
</svg>