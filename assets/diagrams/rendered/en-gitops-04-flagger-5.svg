<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gitops-rollout-seq-title gitops-rollout-seq-desc">
<title id="gitops-rollout-seq-title">GitOps Canary Rollout Sequence</title>
<desc id="gitops-rollout-seq-desc">A developer's image push flows through Flux's controllers into a HelmRelease change that Flagger picks up, runs a canary analysis against, and then either promotes to primary or rolls back, notifying the developer either way.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ===== Lifelines ===== -->
<line x1="100" y1="76" x2="100" y2="545" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="300" y1="76" x2="300" y2="545" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="500" y1="76" x2="500" y2="545" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="700" y1="76" x2="700" y2="545" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="900" y1="76" x2="900" y2="545" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- ===== Messages ===== -->
<path d="M100,112 H300" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="130" y="92" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="200" y="101" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">PUSH NEW IMAGE TAG</text>

<path d="M300,150 H500" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="310" y="130" width="180" height="12" rx="2" fill="#ffffff"/>
<text x="400" y="139" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">SOURCE CONTROLLER DETECTS CHANGE</text>

<path d="M500,188 H900" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="580" y="168" width="180" height="12" rx="2" fill="#ffffff"/>
<text x="670" y="177" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">HELM CONTROLLER UPDATES RELEASE</text>

<path d="M900,226 H700" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="720" y="206" width="170" height="12" rx="2" fill="#ffffff"/>
<text x="805" y="215" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">DEPLOYMENT SPEC CHANGED</text>

<!-- FL self: initialize canary -->
<path d="M700,250 H748 Q756,250 756,258 V258 Q756,266 748,266 H700" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="580" y="254" width="112" height="12" rx="2" fill="#ffffff"/>
<text x="636" y="263" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">INITIALIZE CANARY</text>

<path d="M700,296 H900" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="720" y="276" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="795" y="285" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">CREATE CANARY PODS</text>

<!-- FL self: run analysis -->
<path d="M700,320 H748 Q756,320 756,328 V328 Q756,336 748,336 H700" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="580" y="324" width="112" height="12" rx="2" fill="#ffffff"/>
<text x="636" y="333" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">RUN ANALYSIS</text>

<!-- ===== Alt fragment ===== -->
<rect x="60" y="352" width="880" height="162" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
<rect x="60" y="352" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
<text x="80" y="364" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
<text x="112" y="376" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.02em">[metrics pass]</text>

<path d="M700,392 H900" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="720" y="378" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="795" y="387" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">PROMOTE TO PRIMARY</text>

<path d="M700,416 H100" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="330" y="402" width="180" height="12" rx="2" fill="#ffffff"/>
<text x="420" y="411" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">NOTIFY: DEPLOYMENT SUCCEEDED</text>

<line x1="68" y1="434" x2="932" y2="434" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="112" y="450" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.02em">[else: metrics fail]</text>

<path d="M700,472 H900" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="720" y="458" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="795" y="467" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">ROLLBACK TO PRIMARY</text>

<path d="M700,496 H100" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="330" y="482" width="170" height="12" rx="2" fill="#ffffff"/>
<text x="415" y="491" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">NOTIFY: DEPLOYMENT FAILED</text>

<!-- ===== Actor boxes ===== -->
<rect x="40" y="40" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="40" y="40" width="120" height="36" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="100" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Developer</text>

<rect x="240" y="40" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="240" y="40" width="120" height="36" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="300" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Git Repository</text>

<rect x="440" y="40" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="440" y="40" width="120" height="36" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="500" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Flux Controllers</text>

<rect x="640" y="40" width="120" height="36" rx="6" fill="rgba(255,153,0,0.10)"/>
<rect x="640" y="40" width="120" height="36" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="700" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Flagger</text>

<rect x="840" y="40" width="120" height="36" rx="6" fill="#ffffff"/>
<rect x="840" y="40" width="120" height="36" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="900" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes</text>
</svg>