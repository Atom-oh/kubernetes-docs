<text x="40" y="540" fill="#7D8998" font-size="12" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic">A user-space program is compiled to bytecode, verified for safety, then JIT-compiled into native code the kernel runs at an event hook.</text>
