<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-basics-05-ebpf-fundamentals-0-title en-basics-05-ebpf-fundamentals-0-desc">
<title id="en-basics-05-ebpf-fundamentals-0-title">eBPF program lifecycle</title>
<desc id="en-basics-05-ebpf-fundamentals-0-desc">Architecture diagram showing an eBPF program moving from user-space authoring and compilation through kernel-space loading, verification, JIT compilation, and execution, ending at an event hook point that fires on network packets, system calls, function calls, and tracepoints.</desc>
