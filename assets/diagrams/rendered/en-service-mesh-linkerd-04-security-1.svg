<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mtlsseq-title mtlsseq-desc">
    <title id="mtlsseq-title">How automatic mTLS works</title>
    <desc id="mtlsseq-desc">Sequence diagram showing plain HTTP from application A being upgraded by its sidecar proxy into a mutually authenticated, encrypted TLS connection to proxy B, which terminates TLS and forwards plain HTTP to application B before the encrypted response returns the same way.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines: x = 128, 388, 648, 872 -->
    <line x1="128" y1="128" x2="128" y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="388" y1="128" x2="388" y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="648" y1="128" x2="648" y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="872" y1="128" x2="872" y2="516" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="384" y="172" width="8" height="312" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="644" y="252" width="8" height="152" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- M1: App A -> Proxy A, plain HTTP -->
    <line x1="128" y1="172" x2="384" y2="172" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M2: Proxy A self-message, init TLS -->
    <path d="M 396 200 L 432 200 L 432 232 L 396 232" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M3: Proxy A -> Proxy B, mTLS handshake -->
    <line x1="392" y1="264" x2="644" y2="264" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- M4: Proxy A -> Proxy B, encrypted request -->
    <line x1="392" y1="308" x2="644" y2="308" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- M5: Proxy B self-message, TLS termination -->
    <path d="M 656 336 L 692 336 L 692 368 L 656 368" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M6: Proxy B -> App B, plain HTTP -->
    <line x1="652" y1="396" x2="872" y2="396" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M7: App B -> Proxy B, plain HTTP response (dashed return) -->
    <line x1="872" y1="424" x2="652" y2="424" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- M8: Proxy B -> Proxy A, encrypted response (dashed return) -->
    <line x1="644" y1="452" x2="392" y2="452" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- M9: Proxy A -> App A, plain HTTP response (dashed return) -->
    <line x1="384" y1="480" x2="128" y2="480" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <!-- Note: mutual SPIFFE ID verification, spans handshake segment -->
    <rect x="428" y="240" width="188" height="16" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.18)" stroke-width="0.8"/>
    <text x="522" y="251" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">MUTUAL SPIFFE ID CHECK</text>

    <!-- Message labels -->
    <rect x="200" y="160" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="236" y="170" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLAIN HTTP</text>

    <rect x="440" y="210" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="484" y="220" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INIT TLS + CERT</text>

    <rect x="480" y="252" width="84" height="12" rx="2" fill="#ffffff"/>
    <text x="522" y="262" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MTLS HANDSHAKE</text>

    <rect x="484" y="296" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="522" y="306" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENCRYPTED REQ</text>

    <rect x="700" y="346" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="748" y="356" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TLS TERMINATION</text>

    <rect x="720" y="384" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="756" y="394" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLAIN HTTP</text>

    <rect x="716" y="412" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="756" y="422" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP RESPONSE</text>

    <rect x="476" y="440" width="84" height="12" rx="2" fill="#ffffff"/>
    <text x="518" y="450" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENCRYPTED RESP</text>

    <rect x="216" y="468" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="252" y="478" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP RESPONSE</text>

    <!-- Actors -->
    <rect x="56" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="56" y="72" width="144" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="128" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application A</text>
    <text x="128" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workload</text>

    <rect x="316" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="316" y="72" width="144" height="56" rx="6" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="388" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Proxy A</text>
    <text x="388" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sidecar</text>

    <rect x="576" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="576" y="72" width="144" height="56" rx="6" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="648" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Proxy B</text>
    <text x="648" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sidecar</text>

    <rect x="800" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="800" y="72" width="144" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="872" y="96" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application B</text>
    <text x="872" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workload</text>

    <!-- Legend -->
    <line x1="56" y1="500" x2="912" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="56" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="56" y="530" width="14" height="10" rx="2" fill="var(--accent-tint)" stroke="#EC7211" stroke-width="1"/>
    <text x="76" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal proxy (mTLS)</text>
    <line x1="240" y1="535" x2="268" y2="535" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="276" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Encrypted proxy-to-proxy</text>
    <line x1="500" y1="535" x2="528" y2="535" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="536" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return message</text>
    <line x1="716" y1="535" x2="744" y2="535" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="752" y="538" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Plain HTTP</text>
  </svg>