<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ipam-arch-title ipam-arch-desc">
  <title id="ipam-arch-title">Cilium IPAM modes mapped to their allocation models</title>
  <desc id="ipam-arch-desc">A flow diagram showing five Cilium IP Address Management modes on the left — Cluster Pool / Multi-Pool, Kubernetes Host Scope, AWS ENI, Azure / GKE IPAM, and CRD-based IPAM — each connecting to one of four allocation models on the right: Centralized, Distributed, Cloud Native, and Custom Allocation. The AWS ENI mode and its path to Cloud Native Allocation are highlighted as the mode most relevant to AWS EKS environments.</desc>

  <rect width="960" height="600" fill="var(--paper)"/>

  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="24" class="mono" font-size="8" font-weight="500" fill="#7D8998" letter-spacing="0.18em">CILIUM NETWORKING</text>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#232F3E">IPAM Modes &#8594; Allocation Models</text>

  <!-- Column eyebrows -->
  <text x="40" y="64" class="mono" font-size="8" font-weight="500" fill="#7D8998" letter-spacing="0.14em">IPAM MODE</text>
  <text x="680" y="64" class="mono" font-size="8" font-weight="500" fill="#7D8998" letter-spacing="0.14em">ALLOCATION MODEL</text>

  <!-- ===== Arrows (drawn before boxes) ===== -->

  <!-- Edge 1: Cluster Pool / Multi-Pool -> Centralized Allocation -->
  <path d="M240,108 H452 Q460,108 460,116 V116 Q460,124 468,124 H680"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="326" y="88" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="344" y="97" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">SHARED</text>

  <!-- Edge 2: Kubernetes Host Scope -> Distributed Allocation -->
  <path d="M240,204 H452 Q460,204 460,212 V236 Q460,244 468,244 H680"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="326" y="184" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="344" y="193" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">PER-NODE</text>

  <!-- Edge 3: AWS ENI -> Cloud Native Allocation (focal, accent) -->
  <path d="M240,300 H452 Q460,300 460,308 V344 Q460,352 468,352 H680"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="326" y="280" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="344" y="289" class="mono" font-size="8" fill="#EC7211" text-anchor="middle" letter-spacing="0.06em">VPC-IP</text>

  <!-- Edge 4: Azure / GKE IPAM -> Cloud Native Allocation -->
  <path d="M240,396 H452 Q460,396 460,388 V384 Q460,376 468,376 H680"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="326" y="376" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="344" y="385" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">VNET/VPC</text>

  <!-- Edge 5: CRD-based IPAM -> Custom Allocation -->
  <path d="M240,484 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="326" y="464" width="36" height="12" rx="2" fill="#ffffff"/>
  <text x="344" y="473" class="mono" font-size="8" fill="#7D8998" text-anchor="middle" letter-spacing="0.06em">CRD-BASED</text>

  <!-- ===== Left column: IPAM modes ===== -->

  <!-- 1. Cluster Pool / Multi-Pool -->
  <rect x="40" y="76" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="40" y="76" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="140" y="104" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Cluster Pool / Multi-Pool</text>
  <text x="140" y="122" class="mono" font-size="9" fill="#545B64" text-anchor="middle">cluster-wide</text>

  <!-- 2. Kubernetes Host Scope -->
  <rect x="40" y="172" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="40" y="172" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="140" y="200" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Kubernetes Host Scope</text>
  <text x="140" y="218" class="mono" font-size="9" fill="#545B64" text-anchor="middle">per-node</text>

  <!-- 3. AWS ENI (focal) -->
  <rect x="40" y="268" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="40" y="268" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="140" y="296" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">AWS ENI</text>
  <text x="140" y="314" class="mono" font-size="9" fill="#EC7211" text-anchor="middle">eni</text>

  <!-- 4. Azure / GKE IPAM -->
  <rect x="40" y="364" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="40" y="364" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="140" y="392" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Azure / GKE IPAM</text>
  <text x="140" y="410" class="mono" font-size="9" fill="#545B64" text-anchor="middle">vnet / vpc</text>

  <!-- 5. CRD-based IPAM -->
  <rect x="40" y="452" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="40" y="452" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="140" y="480" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">CRD-based IPAM</text>
  <text x="140" y="498" class="mono" font-size="9" fill="#545B64" text-anchor="middle">crd</text>

  <!-- ===== Right column: allocation models ===== -->

  <!-- A. Centralized Allocation -->
  <rect x="680" y="92" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="92" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="780" y="120" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Centralized Allocation</text>
  <text x="780" y="138" class="mono" font-size="9" fill="#545B64" text-anchor="middle">shared pool</text>

  <!-- B. Distributed Allocation -->
  <rect x="680" y="212" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="212" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="780" y="240" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Distributed Allocation</text>
  <text x="780" y="258" class="mono" font-size="9" fill="#545B64" text-anchor="middle">node-local</text>

  <!-- C. Cloud Native Allocation -->
  <rect x="680" y="332" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="332" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="780" y="360" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Cloud Native Allocation</text>
  <text x="780" y="378" class="mono" font-size="9" fill="#545B64" text-anchor="middle">cloud-native</text>

  <!-- D. Custom Allocation -->
  <rect x="680" y="452" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="452" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="780" y="480" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Custom Allocation</text>
  <text x="780" y="498" class="mono" font-size="9" fill="#545B64" text-anchor="middle">policy-driven</text>

  <!-- ===== Legend (bottom strip) ===== -->
  <line x1="40" y1="556" x2="920" y2="556" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <line x1="60" y1="576" x2="88" y2="576" stroke="#545B64" stroke-width="1.2"/>
  <text x="96" y="579" class="mono" font-size="8" fill="#545B64" letter-spacing="0.06em">IPAM MODE &#8594; ALLOCATION MODEL</text>
  <line x1="380" y1="576" x2="408" y2="576" stroke="#EC7211" stroke-width="1.2"/>
  <text x="416" y="579" class="mono" font-size="8" fill="#EC7211" letter-spacing="0.06em">AWS / EKS-RELEVANT PATH</text>

</svg>