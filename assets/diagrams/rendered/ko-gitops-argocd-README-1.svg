<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="argocd-seq-title argocd-seq-desc">
    <title id="argocd-seq-title">ArgoCD 동기화 시퀀스</title>
    <desc id="argocd-seq-desc">사용자의 Application 변경 요청이 API 서버, 애플리케이션 컨트롤러, 리포 서버를 거쳐 Git 소스를 렌더링하고 Kubernetes 클러스터 상태와 비교한 뒤 동기화를 적용하는 과정을 시간 순으로 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545b64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ec7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="120" y1="104" x2="120" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="300" y1="104" x2="300" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="104" x2="480" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="660" y1="104" x2="660" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="840" y1="104" x2="840" y2="520" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="116" y="132" width="8" height="368" fill="rgba(35,47,62,0.06)" stroke="#545b64" stroke-width="0.8"/>
    <rect x="296" y="132" width="8" height="336" fill="rgba(35,47,62,0.06)" stroke="#545b64" stroke-width="0.8"/>
    <rect x="476" y="164" width="8" height="304" fill="rgba(35,47,62,0.06)" stroke="#545b64" stroke-width="0.8"/>
    <rect x="656" y="196" width="8" height="72"  fill="rgba(35,47,62,0.06)" stroke="#545b64" stroke-width="0.8"/>
    <rect x="836" y="292" width="8" height="40"  fill="rgba(35,47,62,0.06)" stroke="#545b64" stroke-width="0.8"/>
    <rect x="836" y="388" width="8" height="40"  fill="rgba(35,47,62,0.06)" stroke="#545b64" stroke-width="0.8"/>

    <!-- Messages -->
    <!-- 1. User -> API -->
    <line x1="124" y1="140" x2="296" y2="140" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 2. API -> Controller -->
    <line x1="304" y1="172" x2="476" y2="172" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 3. Controller -> RepoServer -->
    <line x1="484" y1="204" x2="656" y2="204" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 4. RepoServer self-loop: fetch + render -->
    <path d="M 664,232 H 704 Q 712,232 712,240 V 240 Q 712,248 704,248 H 664"
          fill="none" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 5. RepoServer --> Controller (return, dashed) -->
    <line x1="656" y1="268" x2="484" y2="268" stroke="#545b64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- 6. Controller -> K8s: 현재 상태 조회 -->
    <line x1="484" y1="300" x2="836" y2="300" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 7. K8s --> Controller (return, dashed) -->
    <line x1="836" y1="332" x2="484" y2="332" stroke="#545b64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- 8. Controller self-loop: 차이 비교 -->
    <path d="M 484,352 H 524 Q 532,352 532,360 V 360 Q 532,368 524,368 H 484"
          fill="none" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 9. Controller -> K8s: 동기화 적용 (headline, accent) -->
    <line x1="484" y1="396" x2="836" y2="396" stroke="#ec7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- 10. K8s --> Controller (return, dashed) -->
    <line x1="836" y1="428" x2="484" y2="428" stroke="#545b64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- 11. Controller -> API: 상태 업데이트 -->
    <line x1="476" y1="460" x2="304" y2="460" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 12. API --> User (return, dashed) -->
    <line x1="296" y1="492" x2="124" y2="492" stroke="#545b64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <!-- ============ Actor headers ============ -->
    <rect x="56"  y="64" width="128" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7d8998" stroke-width="1"/>
    <text x="120" y="88" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">사용자</text>

    <rect x="236" y="64" width="128" height="40" rx="6" fill="#ffffff" stroke="#232f3e" stroke-width="1"/>
    <text x="300" y="88" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Server</text>

    <rect x="416" y="64" width="128" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#ec7211" stroke-width="1"/>
    <text x="480" y="88" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App Controller</text>

    <rect x="596" y="64" width="128" height="40" rx="6" fill="#ffffff" stroke="#232f3e" stroke-width="1"/>
    <text x="660" y="88" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Repo Server</text>

    <rect x="776" y="64" width="128" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="840" y="88" fill="#232f3e" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes</text>

    <!-- ============ Message labels ============ -->
    <rect x="168" y="120" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="130" fill="#545b64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">생성/수정</text>

    <rect x="348" y="152" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="374" y="162" fill="#545b64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">이벤트</text>

    <rect x="528" y="184" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="566" y="194" fill="#545b64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">매니페스트 요청</text>

    <text x="720" y="244" fill="#545b64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">FETCH + 렌더링</text>

    <rect x="528" y="248" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="566" y="258" fill="#545b64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">렌더링 결과</text>

    <rect x="608" y="280" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="660" y="290" fill="#545b64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">현재 상태 조회</text>

    <rect x="608" y="312" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="646" y="322" fill="#545b64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">라이브 상태</text>

    <text x="540" y="360" fill="#545b64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">차이점 비교</text>

    <rect x="608" y="376" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="646" y="386" fill="#ec7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">동기화 적용</text>

    <rect x="608" y="408" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="634" y="418" fill="#545b64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">결과</text>

    <rect x="348" y="440" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="386" y="450" fill="#545b64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">상태 업데이트</text>

    <rect x="168" y="472" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="212" y="482" fill="#545b64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">동기화 완료</text>

    <!-- ============ Legend ============ -->
    <line x1="24" y1="536" x2="936" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <line x1="24" y1="556" x2="52" y2="556" stroke="#545b64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="60" y="559" fill="#545b64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">호출</text>

    <line x1="152" y1="556" x2="180" y2="556" stroke="#545b64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="188" y="559" fill="#545b64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">응답</text>

    <line x1="280" y1="556" x2="308" y2="556" stroke="#ec7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="316" y="559" fill="#545b64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">핵심 동기화 호출</text>
  </svg>