<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dra-compare-title dra-compare-desc">
    <title id="dra-compare-title">Device plugin vs. DRA GPU allocation</title>
    <desc id="dra-compare-desc">Two GPU-allocation traces compared step by step: the traditional device plugin grants a whole GPU with no sharing, while Kubernetes 1.31's Dynamic Resource Allocation evaluates a ResourceClaim against topology-aware ResourceSlices, and only the DRA path reaches fine-grained, multi-tenant GPU benefits.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== column eyebrows ===== -->
    <text x="220" y="44" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">TRADITIONAL DEVICE PLUGIN</text>
    <text x="740" y="44" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DRA · KUBERNETES 1.31+</text>

    <!-- ===== arrows within Traditional chain ===== -->
    <line x1="220" y1="120" x2="220" y2="144" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="220" y1="200" x2="220" y2="224" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="220" y1="280" x2="220" y2="304" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== arrows within DRA chain ===== -->
    <line x1="740" y1="120" x2="740" y2="144" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="740" y1="200" x2="740" y2="224" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="740" y1="280" x2="740" y2="304" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== convergence arrows into Benefits ===== -->
    <path d="M220,360 V400 Q220,408 228,408 H424 Q432,408 432,416 V460" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <path d="M740,360 V400 Q740,408 732,408 H536 Q528,408 528,416 V460" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <rect x="302" y="392" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="326" y="401" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIMITED</text>
    <rect x="610" y="392" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="634" y="401" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENABLES</text>

    <!-- ===== Traditional chain nodes ===== -->
    <rect x="80" y="64" width="280" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Pod Requests GPU</text>
    <text x="220" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nvidia.com/gpu: 1</text>

    <rect x="80" y="144" width="280" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Device Plugin</text>
    <text x="220" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">allocates whole GPU</text>

    <rect x="80" y="224" width="280" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Container Access</text>
    <text x="220" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exclusive GPU, no sharing</text>

    <rect x="80" y="304" width="280" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">No Fine-Grained Control</text>
    <text x="220" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fixed allocation only</text>

    <!-- ===== DRA chain nodes ===== -->
    <rect x="600" y="64" width="280" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="740" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Pod Creates Claim</text>
    <text x="740" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ResourceClaim</text>

    <rect x="600" y="144" width="280" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="740" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">DRA Driver</text>
    <text x="740" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">evaluates claim</text>

    <rect x="600" y="224" width="280" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="740" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">ResourceSlice</text>
    <text x="740" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tracks GPU topology</text>

    <rect x="600" y="304" width="280" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="740" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Fine-Grained Allocation</text>
    <text x="740" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MIG / MPS / NVLink-aware</text>

    <!-- ===== Benefits (focal) ===== -->
    <rect x="340" y="460" width="280" height="80" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="486" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">DRA Benefits</text>
    <text x="480" y="504" fill="#232F3E" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">memory partitioning · multi-tenant sharing</text>
    <text x="480" y="518" fill="#232F3E" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NVLink topology · P6e-GB200 UltraServer</text>

    <!-- legend -->
    <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="576" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="160" y="567" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="576" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Allocation step</text>
    <rect x="360" y="567" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="380" y="576" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Focal: DRA outcome</text>
    <line x1="600" y1="572" x2="624" y2="572" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="632" y="576" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">Constrains</text>
  </svg>
