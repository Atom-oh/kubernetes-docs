<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title0 desc0" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">
  <title id="title0">ArgoCD 알림 전송 흐름</title>
  <desc id="desc0">ArgoCD Application에서 발생한 이벤트를 Notifications Controller가 받아, Slack·Microsoft Teams·Email·Webhook·GitHub 다섯 개의 외부 알림 서비스로 동시에 전달하는 구조를 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="32" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">GITOPS / ARGOCD</text>
  <text x="40" y="56" fill="#232F3E" font-size="20" font-weight="700">ArgoCD 알림 전송 흐름</text>

  <!-- Zone: ArgoCD -->
  <rect x="40" y="76" width="260" height="480" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="52" y="80" width="60" height="12" rx="2" fill="#ffffff"/>
  <text x="82" y="89" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ARGOCD</text>

  <!-- Zone: Services -->
  <rect x="640" y="76" width="280" height="480" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="652" y="80" width="76" height="12" rx="2" fill="#ffffff"/>
  <text x="690" y="89" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">알림 서비스</text>

  <!-- ============ Arrows (drawn before boxes) ============ -->

  <!-- App -> Controller (straight vertical, same x) -->
  <line x1="170" y1="200" x2="170" y2="316" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="182" y="250" width="52" height="16" rx="2" fill="#ffffff"/>
  <text x="208" y="261" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT</text>

  <!-- Controller -> Slack (up) -->
  <path d="M260,328 H432 Q440,328 440,320 V148 Q440,140 448,140 H680" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- Controller -> Teams (up) -->
  <path d="M260,340 H452 Q460,340 460,332 V236 Q460,228 468,228 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Controller -> Email (up, short) -->
  <path d="M260,352 H472 Q480,352 480,344 V324 Q480,316 488,316 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Controller -> Webhook (down) -->
  <path d="M260,364 H492 Q500,364 500,372 V396 Q500,404 508,404 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Controller -> GitHub (down) -->
  <path d="M260,376 H512 Q520,376 520,384 V484 Q520,492 528,492 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============ Nodes ============ -->

  <!-- App -->
  <rect x="80" y="136" width="180" height="64" rx="6" fill="#ffffff"/>
  <rect x="80" y="136" width="180" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="88" y="144" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="104" y="153" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
  <text x="170" y="174" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Application</text>
  <text x="170" y="190" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">argocd.Application</text>

  <!-- Controller (focal) -->
  <rect x="80" y="316" width="180" height="72" rx="6" fill="#ffffff"/>
  <rect x="80" y="316" width="180" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="88" y="324" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
  <text x="104" y="333" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
  <text x="170" y="356" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Notifications</text>
  <text x="170" y="370" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Controller</text>

  <!-- Slack -->
  <rect x="680" y="108" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="108" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <rect x="688" y="116" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="708" y="125" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="780" y="146" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Slack</text>

  <!-- Teams -->
  <rect x="680" y="196" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="196" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <rect x="688" y="204" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="708" y="213" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="780" y="234" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Microsoft Teams</text>

  <!-- Email -->
  <rect x="680" y="284" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="284" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <rect x="688" y="292" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="708" y="301" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="780" y="322" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Email</text>

  <!-- Webhook -->
  <rect x="680" y="372" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="372" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <rect x="688" y="380" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="708" y="389" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="780" y="410" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Webhook</text>

  <!-- GitHub -->
  <rect x="680" y="460" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="460" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <rect x="688" y="468" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="708" y="477" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="780" y="498" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">GitHub</text>

</svg>