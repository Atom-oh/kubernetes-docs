<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch1-title arch1-desc">
    <title id="arch1-title">Alertmanager 내부 구조</title>
    <desc id="arch1-desc">Prometheus에서 들어온 알림이 Alertmanager 내부에서 API, 라우팅·억제·무음 필터, 그룹화, 알림 전송 단계를 거쳐 수신자에게 전달되고, 전송 기록과 무음 규칙은 저장소에 남으며 클러스터 노드 간 Gossip으로 동기화되는 구조를 보여줍니다.</desc>
    <defs><style>@import url(https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Alertmanager (drawn before arrows/nodes) -->
    <rect x="248" y="60" width="620" height="480" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="512" y="64" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="558" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">ALERTMANAGER</text>

    <!-- Arrows (behind boxes) -->
    <line x1="140" y1="140" x2="292" y2="140" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="404" y1="140" x2="472" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="584" y1="140" x2="652" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="764" y1="140" x2="820" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="876" y1="140" x2="876" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Notification Pipeline -> nflog (dashed transit) -->
    <path d="M 848,180 V 220 Q 848,228 840,228 H 748" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- Filter -> Silences (dashed) -->
    <path d="M 348,180 V 400 Q 348,408 356,408 H 512" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- Gossip -> nflog -->
    <path d="M 700,464 H 636 Q 628,464 628,456 V 260" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- Gossip -> Silences -->
    <path d="M 764,464 V 420 Q 764,412 756,412 H 748" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Node: Prometheus (external, outside zone) -->
    <rect x="40" y="112" width="100" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="90" y="144" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Prometheus</text>

    <!-- Node: API (focal - entry point) -->
    <rect x="292" y="112" width="112" height="56" rx="6" fill="#FFF8F0" stroke="#EC7211" stroke-width="1.2"/>
    <text x="348" y="138" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API</text>
    <text x="348" y="154" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">/api/v2/alerts</text>

    <!-- Node: Filter (Dispatcher+Inhibitor+Silencer merged) -->
    <rect x="472" y="112" width="112" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="528" y="136" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">라우팅 · 억제</text>
    <text x="528" y="150" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">무음 필터</text>

    <!-- Node: Aggregation Group -->
    <rect x="652" y="112" width="112" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="708" y="138" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Aggregation</text>
    <text x="708" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">그룹화</text>

    <!-- Node: Notification Pipeline -->
    <rect x="820" y="112" width="112" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="876" y="136" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Notification</text>
    <text x="876" y="150" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">알림 전송</text>

    <!-- Node: Receivers (external, outside zone) -->
    <rect x="820" y="248" width="112" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="876" y="280" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Receivers</text>

    <!-- Node: nflog -->
    <rect x="628" y="240" width="120" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="688" y="264" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">nflog</text>
    <text x="688" y="278" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">알림 로그</text>

    <!-- Node: Silences -->
    <rect x="512" y="380" width="120" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="572" y="404" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Silences</text>
    <text x="572" y="418" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">무음 규칙</text>

    <!-- Node: Gossip Protocol -->
    <rect x="700" y="464" width="128" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="764" y="488" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Gossip Protocol</text>
    <text x="764" y="502" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">클러스터 동기화</text>

    <!-- Arrow labels -->
    <rect x="166" y="128" width="24" height="12" rx="2" fill="#ffffff"/>
    <text x="178" y="137" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">알림</text>

    <rect x="854" y="196" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="874" y="205" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">기록</text>

    <rect x="356" y="300" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="376" y="309" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">조회</text>

    <rect x="600" y="352" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="626" y="361" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">동기화</text>

    <rect x="738" y="432" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="764" y="441" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">동기화</text>

    <!-- Legend -->
    <line x1="40" y1="560" x2="920" y2="560" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <line x1="52" y1="576" x2="80" y2="576" stroke="#545B64" stroke-width="1.2"/>
    <text x="88" y="579" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">파이프라인 처리</text>
    <line x1="260" y1="576" x2="288" y2="576" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="296" y="579" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">기록 / 조회 / 동기화</text>
  </svg>