<title id="upstream-eks-lag-title">Upstream vs EKS Release Lag</title>
<desc id="upstream-eks-lag-desc">Paired Gantt bars comparing upstream Kubernetes release months against Amazon EKS availability for versions 1.33 through 1.36, showing a consistent roughly two-month lag as AWS validates each release before making it available on EKS.</desc>
