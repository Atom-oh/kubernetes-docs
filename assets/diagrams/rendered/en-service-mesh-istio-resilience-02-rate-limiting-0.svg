<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rl-overview-title rl-overview-desc">
      <title id="rl-overview-title">Rate limiting overview</title>
      <desc id="rl-overview-desc">Three clients send traffic through a token-bucket rate limiter that forwards allowed requests to two service pods and rejects excess traffic with a 429 response.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
        <marker id="arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#DD344C"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Arrows first (behind boxes) -->
      <!-- Client 1 -> RL (down elbow) -->
      <path d="M 176,104 H 252 Q 260,104 260,112 V 208 Q 260,216 268,216 H 344"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Client 2 -> RL (straight, same y) -->
      <line x1="176" y1="236" x2="344" y2="236" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Client 3 -> RL (up elbow) -->
      <path d="M 176,368 H 252 Q 260,368 260,360 V 264 Q 260,256 268,256 H 344"
            fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- RL -> Pod 1 (up elbow, accent) -->
      <path d="M 504,216 H 624 Q 632,216 632,208 V 152 Q 632,144 640,144 H 760"
            fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- RL -> Pod 2 (down elbow, accent) -->
      <path d="M 504,256 H 624 Q 632,256 632,264 V 304 Q 632,312 640,312 H 760"
            fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- RL -> Reject (straight vertical, dashed) -->
      <line x1="424" y1="280" x2="424" y2="420" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-danger)"/>

      <!-- Arrow label: BLOCKED (beside vertical segment, 8px gap) -->
      <rect x="432" y="342" width="60" height="12" rx="2" fill="#ffffff"/>
      <text x="462" y="351" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BLOCKED</text>

      <!-- Node: Client 1 -->
      <rect x="40" y="72" width="136" height="64" rx="6" fill="#ffffff"/>
      <rect x="40" y="72" width="136" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="108" y="100" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Client 1</text>
      <text x="108" y="116" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">100 req/s</text>

      <!-- Node: Client 2 -->
      <rect x="40" y="204" width="136" height="64" rx="6" fill="#ffffff"/>
      <rect x="40" y="204" width="136" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="108" y="232" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Client 2</text>
      <text x="108" y="248" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">50 req/s</text>

      <!-- Node: Client 3 -->
      <rect x="40" y="336" width="136" height="64" rx="6" fill="#ffffff"/>
      <rect x="40" y="336" width="136" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="108" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Client 3</text>
      <text x="108" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">200 req/s</text>

      <!-- Node: Rate Limiter (focal) -->
      <rect x="344" y="192" width="160" height="88" rx="6" fill="#ffffff"/>
      <rect x="344" y="192" width="160" height="88" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <rect x="352" y="200" width="40" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
      <text x="372" y="209" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIMIT</text>
      <text x="424" y="240" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Token Bucket</text>
      <text x="424" y="256" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">100 req/s limit</text>

      <!-- Node: Pod 1 -->
      <rect x="760" y="112" width="160" height="64" rx="6" fill="#ffffff"/>
      <rect x="760" y="112" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="840" y="140" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Pod 1</text>
      <text x="840" y="156" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">50 req/s cap</text>

      <!-- Node: Pod 2 -->
      <rect x="760" y="280" width="160" height="64" rx="6" fill="#ffffff"/>
      <rect x="760" y="280" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="840" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Pod 2</text>
      <text x="840" y="324" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">50 req/s cap</text>

      <!-- Node: Reject (429) -->
      <rect x="344" y="420" width="160" height="64" rx="6" fill="#ffffff"/>
      <rect x="344" y="420" width="160" height="64" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="424" y="448" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">429 Rejected</text>
      <text x="424" y="464" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">too many requests</text>

      <!-- Legend strip -->
      <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
      <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="556" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="60" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Client</text>

      <rect x="150" y="556" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="170" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Rate limiter (focal)</text>

      <rect x="336" y="556" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="356" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Service pod</text>

      <rect x="472" y="556" width="14" height="10" rx="2" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="492" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Rejected (429)</text>

      <line x1="620" y1="561" x2="648" y2="561" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="656" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Allowed</text>

      <line x1="748" y1="561" x2="776" y2="561" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-danger)"/>
      <text x="784" y="564" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Blocked</text>
    </svg>