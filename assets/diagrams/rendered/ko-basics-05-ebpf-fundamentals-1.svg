    <title id="ko-basics-05-ebpf-fundamentals-1-title">커널 모듈 방식과 eBPF 방식 비교</title>
    <desc id="ko-basics-05-ebpf-fundamentals-1-desc">기존 커널 모듈 개발 방식은 재부팅과 시스템 불안정 위험을 동반하지만, eBPF 방식은 런타임 로드와 검증을 거쳐 안전한 실행을 보장한다는 것을 비교하는 다이어그램.</desc>
