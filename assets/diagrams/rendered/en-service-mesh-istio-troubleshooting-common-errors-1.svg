<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="draindrain-title draindrain-desc">
    <title id="draindrain-title">Graceful Envoy drain during pod termination</title>
    <desc id="draindrain-desc">Sequence diagram showing that once Envoy enters drain mode on SIGTERM it keeps serving existing connections for the full grace period, so a client request during shutdown still gets forwarded to the application and returned normally, and both Envoy and the application terminate cleanly afterward.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ================= HIGHLIGHT ZONES ================= -->
    <!-- Drain mode zone (Envoy) -->
    <rect x="548" y="184" width="152" height="76" rx="4" fill="rgba(255,153,0,0.06)" stroke="rgba(236,114,17,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="624" y="176" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENTERS DRAIN MODE</text>

    <!-- Clean termination zone -->
    <rect x="548" y="380" width="152" height="36" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.18)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="308" y="424" width="144" height="36" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.18)" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- ================= LIFELINES ================= -->
    <!-- Centers: K8s=140, App=380, Envoy=620, Client=860 -->
    <line x1="140" y1="96" x2="140" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="380" y1="96" x2="380" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="620" y1="96" x2="620" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="860" y1="96" x2="860" y2="480" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ================= MESSAGE ARROWS ================= -->
    <!-- M1: K8s -> App SIGTERM -->
    <line x1="140" y1="140" x2="376" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M2: K8s -> Envoy SIGTERM -->
    <line x1="140" y1="160" x2="616" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- M3: Envoy self — reject new / keep existing / wait 30s -->
    <path d="M 628 200 L 664 200 L 664 232 L 628 232" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- M4: Client -> Envoy send request -->
    <line x1="860" y1="272" x2="624" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M5: Envoy -> App forward request -->
    <line x1="620" y1="296" x2="384" y2="296" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M6: App -> Envoy response (dashed return) -->
    <line x1="380" y1="320" x2="616" y2="320" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- M7: Envoy -> Client normal response (headline success, accent) -->
    <line x1="620" y1="344" x2="856" y2="344" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

    <!-- M8: Envoy self — normal termination -->
    <path d="M 628 396 L 664 396 L 664 408 L 628 408" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- M9: App self — graceful shutdown -->
    <path d="M 388 440 L 424 440 L 424 452 L 388 452" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ================= MESSAGE LABELS ================= -->
    <rect x="196" y="122" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="246" y="132" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">SEND SIGTERM</text>

    <rect x="330" y="142" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="380" y="152" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">SEND SIGTERM</text>

    <rect x="670" y="200" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="734" y="210" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">DRAIN 30S</text>

    <rect x="700" y="254" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="744" y="264" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">SEND REQUEST</text>

    <rect x="432" y="278" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="484" y="288" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">FORWARD REQUEST</text>

    <rect x="440" y="302" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="484" y="312" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">RESPONSE</text>

    <rect x="692" y="326" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="748" y="336" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">NORMAL RESPONSE</text>

    <rect x="672" y="382" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="732" y="392" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">NORMAL TERMINATION</text>

    <rect x="432" y="426" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="492" y="436" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">GRACEFUL SHUTDOWN</text>

    <!-- ================= ACTOR BOXES ================= -->
    <!-- Kubernetes -->
    <rect x="68" y="40" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="68" y="40" width="144" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="76" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="90" y="57" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">K8S</text>
    <text x="140" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes</text>
    <text x="140" y="87" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubelet</text>

    <!-- Application -->
    <rect x="308" y="40" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="308" y="40" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="316" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="330" y="57" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APP</text>
    <text x="380" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    <text x="380" y="87" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">myapp container</text>

    <!-- Envoy Proxy (focal) -->
    <rect x="548" y="40" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="548" y="40" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="556" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="572" y="57" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIDE</text>
    <text x="620" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>
    <text x="620" y="87" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">istio-proxy</text>

    <!-- Client -->
    <rect x="788" y="40" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="788" y="40" width="144" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="796" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="810" y="57" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXT</text>
    <text x="860" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
    <text x="860" y="87" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">caller</text>

    <!-- ================= LEGEND ================= -->
    <line x1="68" y1="512" x2="932" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="68" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="68" y="548" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="88" y="556" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal actor / headline success</text>

    <line x1="284" y1="552" x2="312" y2="552" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="320" y="556" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Call / signal</text>

    <line x1="440" y1="552" x2="468" y2="552" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="476" y="556" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return</text>

    <rect x="588" y="546" width="14" height="10" rx="2" fill="rgba(255,153,0,0.06)" stroke="rgba(236,114,17,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="608" y="556" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Drain window (30s)</text>

  </svg>