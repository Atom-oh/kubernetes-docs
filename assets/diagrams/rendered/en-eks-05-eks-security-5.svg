    <title id="en-eks-05-eks-security-5-title">Pod Identity association across two namespaces</title>
    <desc id="en-eks-05-eks-security-5-desc">Architecture diagram showing two namespaces each associating a service account with its own IAM role, while pods in both namespaces request credentials from a shared Pod Identity Agent and Pod Identity Service before accessing AWS services.</desc>
