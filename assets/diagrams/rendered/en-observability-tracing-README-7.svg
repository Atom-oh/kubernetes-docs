<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pick-title pick-desc">
    <title id="pick-title">Choosing a tracing backend</title>
    <desc id="pick-desc">Decision tree for selecting a distributed tracing solution: it checks for AWS-native integration first, then cost priority, then whether AI-assisted analysis or an existing Grafana stack matters, ending at AWS X-Ray, Grafana Tempo, Jaeger, Datadog APM, or Dynatrace.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- connectors -->
    <!-- Q1 -> XRAY (yes, accent) -->
    <line x1="270" y1="80" x2="496" y2="80" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Q1 -> Q2 (no) -->
    <line x1="200" y1="128" x2="200" y2="172" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Q2 -> Q4 (yes) -->
    <line x1="270" y1="220" x2="490" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Q2 -> Q3 (no) -->
    <line x1="200" y1="268" x2="200" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Q4 -> TEMPO (yes) -->
    <line x1="630" y1="220" x2="796" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Q4 -> JAEGER (no) -->
    <line x1="560" y1="268" x2="560" y2="316" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Q3 -> DYNATRACE (yes, elbow) -->
    <line x1="270" y1="380" x2="560" y2="380" stroke="#545B64" stroke-width="1.2"/>
    <line x1="560" y1="380" x2="560" y2="456" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Q3 -> DATADOG (no) -->
    <line x1="200" y1="428" x2="200" y2="456" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- branch labels -->
    <rect x="365" y="60" width="36" height="14" rx="2" fill="#ffffff"/>
    <text x="383" y="71" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">YES</text>
    <rect x="212" y="142" width="32" height="14" rx="2" fill="#ffffff"/>
    <text x="228" y="153" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">NO</text>
    <rect x="362" y="200" width="36" height="14" rx="2" fill="#ffffff"/>
    <text x="380" y="211" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">YES</text>
    <rect x="212" y="292" width="32" height="14" rx="2" fill="#ffffff"/>
    <text x="228" y="303" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">NO</text>
    <rect x="695" y="200" width="36" height="14" rx="2" fill="#ffffff"/>
    <text x="713" y="211" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">YES</text>
    <rect x="572" y="284" width="32" height="14" rx="2" fill="#ffffff"/>
    <text x="588" y="295" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">NO</text>
    <rect x="397" y="360" width="36" height="14" rx="2" fill="#ffffff"/>
    <text x="415" y="371" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">YES</text>
    <rect x="212" y="434" width="32" height="14" rx="2" fill="#ffffff"/>
    <text x="228" y="445" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">NO</text>

    <!-- Q1 -->
    <polygon points="200,32 270,80 200,128 130,80" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="72" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Need AWS Native</text>
    <text x="200" y="86" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Integration?</text>

    <!-- Q2 -->
    <polygon points="200,172 270,220 200,268 130,220" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="224" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cost Priority?</text>

    <!-- Q4 -->
    <polygon points="560,172 630,220 560,268 490,220" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="560" y="216" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Using Grafana</text>
    <text x="560" y="230" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Stack?</text>

    <!-- Q3 -->
    <polygon points="200,332 270,380 200,428 130,380" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="376" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Need AI</text>
    <text x="200" y="390" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Analysis?</text>

    <!-- XRAY (focal) -->
    <rect x="496" y="56" width="128" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="560" y="84" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS X-Ray</text>

    <!-- TEMPO -->
    <rect x="796" y="196" width="128" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="860" y="224" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana Tempo</text>

    <!-- JAEGER -->
    <rect x="496" y="316" width="128" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="560" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Jaeger</text>

    <!-- DYNATRACE -->
    <rect x="496" y="456" width="128" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="560" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Dynatrace</text>

    <!-- DATADOG -->
    <rect x="136" y="456" width="128" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Datadog APM</text>

    <!-- legend -->
    <line x1="30" y1="536" x2="930" y2="536" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="30" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.16em">LEGEND</text>
    <rect x="180" y="544" width="20" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="208" y="554" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">AWS-native pick</text>
  </svg>