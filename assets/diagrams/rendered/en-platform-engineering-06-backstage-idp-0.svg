    <title id="bs-arch-title">Backstage IDP architecture</title>
    <desc id="bs-arch-desc">Architecture diagram showing browser traffic reaching the Backstage backend, which fans out to core and integration plugins, a Postgres store, TechDocs storage in S3, and external systems including GitHub, EKS, ArgoCD, and an OIDC identity provider.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (bg -> zones -> arrows -> nodes) -->
    <rect x="240" y="112" width="480" height="264" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="256" y="116" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="264" y="125" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BACKSTAGE APPLICATION</text>

    <rect x="40" y="420" width="320" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
