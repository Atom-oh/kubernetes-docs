    <text x="64" y="433" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DATA LAYER</text>

    <rect x="392" y="420" width="528" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="408" y="424" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="416" y="433" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">EXTERNAL SYSTEMS</text>

    <!-- Arrows (behind nodes) -->
    <path d="M480,88 V148" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M480,204 V228" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

