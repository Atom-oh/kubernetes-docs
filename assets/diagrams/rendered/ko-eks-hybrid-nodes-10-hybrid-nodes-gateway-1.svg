<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc">
<title id="d1-title">Lease 기반 게이트웨이 리더 승격 시퀀스</title>
<desc id="d1-desc">리더 Pod가 15초마다 Lease를 갱신하다 장애가 발생하면, 40초 뒤 Lease 만료를 감지한 팔로워 Pod가 Lease를 획득하고 VPC 라우트 테이블을 갱신해 새로운 리더로 승격하는 과정을 보여준다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="d1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  <marker id="d1-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#545B64" stroke-width="1.2"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Lifelines -->
<line x1="140" y1="96" x2="140" y2="508" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="380" y1="96" x2="380" y2="508" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="620" y1="96" x2="620" y2="508" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="840" y1="96" x2="840" y2="508" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Activation bars -->
<rect x="136" y="144" width="8" height="124" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="616" y="296" width="8" height="180" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

<!-- M1: Leader -> Lease (renew, solid call) -->
<line x1="140" y1="148" x2="380" y2="148" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>
<!-- Note over Leader -->
<rect x="148" y="176" width="112" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="204" y="192" fill="#545B64" font-size="9" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">정상 운영 중</text>

<!-- M2: Leader self-message (failure) -->
<path d="M144,232 L184,232 L184,264 L144,264" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

<!-- M3: Lease to Follower (async notify, dashed open) -->
<line x1="380" y1="300" x2="620" y2="300" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d1-arrow-open)"/>

<!-- M4: Follower -> Lease (acquire, solid call) -->
<line x1="620" y1="356" x2="380" y2="356" stroke="#545B64" stroke-width="1.2" marker-end="url(#d1-arrow)"/>

<!-- M5: Follower -> VPC RT (headline success, coral) -->
<line x1="620" y1="412" x2="840" y2="412" stroke="#EC7211" stroke-width="1.4" marker-end="url(#d1-arrow-accent)"/>
<!-- Note over Follower -->
<rect x="628" y="440" width="128" height="24" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="692" y="456" fill="#545B64" font-size="9" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">새로운 리더로 승격</text>

<!-- Message labels -->
<rect x="210" y="128" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="260" y="137" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">RENEW · 15S</text>

<rect x="192" y="242" width="76" height="12" rx="2" fill="#ffffff"/>
<text x="230" y="251" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">장애 발생</text>

<rect x="430" y="280" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="500" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">EXPIRE 감지 · 40S</text>

<rect x="450" y="336" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="500" y="345" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">LEASE 획득</text>

<rect x="650" y="392" width="160" height="12" rx="2" fill="#ffffff"/>
<text x="730" y="401" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">라우트 테이블 갱신</text>

<!-- Actor boxes (drawn last so lifelines/messages tuck under them cleanly at the top) -->
<rect x="70" y="40" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="140" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">리더 Pod</text>

<rect x="310" y="40" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="380" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Kubernetes Lease</text>

<rect x="550" y="40" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="620" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">팔로워 Pod</text>

<rect x="770" y="40" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="840" y="68" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">VPC 라우트 테이블</text>

<!-- Legend -->
<line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<line x1="48" y1="556" x2="72" y2="556" stroke="#545B64" stroke-width="1.2"/>
<text x="80" y="559" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">동기 호출</text>
<line x1="220" y1="556" x2="244" y2="556" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="252" y="559" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">비동기 알림</text>
<line x1="420" y1="556" x2="444" y2="556" stroke="#EC7211" stroke-width="1.4"/>
<text x="452" y="559" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">성공 · 승격</text>
</svg>