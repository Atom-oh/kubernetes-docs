<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">External API Protection Architecture</title>
  <desc id="d2">An application pod's Envoy sidecar applies outlier detection to three external API instances registered as a ServiceEntry, continuing to send traffic to the two healthy instances while ejecting the one returning errors.</desc>
  <rect width="960" height="600" fill="var(--paper)"/>

  <text x="40" y="36" class="mono" fill="var(--soft)" font-size="8" letter-spacing="0.14em">ISTIO · RESILIENCE</text>
  <text x="40" y="60" font-size="20" font-weight="700" fill="var(--ink)">External API Protection Architecture</text>

  <!-- Zones -->
  <rect x="40" y="108" width="224" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="60" y="112" width="184" height="12" rx="2" fill="var(--paper)"/>
  <text x="152" y="121" fill="rgba(35,47,62,0.40)" class="mono" font-size="7" text-anchor="middle" letter-spacing="0.10em">KUBERNETES CLUSTER</text>

  <rect x="592" y="80" width="264" height="344" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="656" y="84" width="136" height="12" rx="2" fill="var(--paper)"/>
  <text x="724" y="93" fill="rgba(35,47,62,0.40)" class="mono" font-size="7" text-anchor="middle" letter-spacing="0.10em">EXTERNAL SERVICES</text>

  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DD344C"/>
    </marker>
  </defs>

  <!-- Arrows -->
  <!-- App -> Envoy : straight vertical, aligned x=152 -->
  <line x1="152" y1="196" x2="152" y2="268" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Envoy -> API 1 (healthy), attach y=284, spine x=340 -->
  <path d="M240,284 H332 Q340,284 340,276 V148 Q340,140 348,140 H616" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Envoy -> API 2 (errors, ejected), dashed, attach y=300, spine x=428 -->
  <path d="M240,300 H420 Q428,300 428,292 V268 Q428,260 436,260 H616" fill="none" stroke="var(--danger)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-danger)"/>

  <!-- Envoy -> API 3 (healthy), attach y=316, spine x=520 -->
  <path d="M240,316 H512 Q520,316 520,324 V372 Q520,380 528,380 H616" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrow labels -->
  <rect x="263" y="264" width="46" height="12" rx="2" fill="var(--paper)"/>
  <text x="286" y="273" class="mono" fill="var(--soft)" font-size="8" text-anchor="middle" letter-spacing="0.06em">TRAFFIC</text>

  <rect x="307" y="280" width="46" height="12" rx="2" fill="var(--paper)"/>
  <text x="330" y="289" class="mono" fill="var(--danger)" font-size="8" text-anchor="middle" letter-spacing="0.06em">EJECTED</text>

  <rect x="357" y="296" width="46" height="12" rx="2" fill="var(--paper)"/>
  <text x="380" y="305" class="mono" fill="var(--soft)" font-size="8" text-anchor="middle" letter-spacing="0.06em">TRAFFIC</text>

  <!-- Nodes -->
  <!-- App -->
  <rect x="64" y="140" width="176" height="56" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
  <text x="152" y="164" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Application Pod</text>
  <text x="152" y="181" class="mono" font-size="9" fill="var(--muted)" text-anchor="middle">workload</text>

  <!-- Envoy (focal) -->
  <rect x="64" y="268" width="176" height="64" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="152" y="296" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle">Envoy Proxy</text>
  <text x="152" y="314" class="mono" font-size="9" fill="var(--accent)" text-anchor="middle">outlier detection</text>

  <!-- API 1 healthy -->
  <rect x="616" y="112" width="208" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="720" y="136" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">External API — Instance 1</text>
  <text x="720" y="153" class="mono" font-size="9" fill="var(--muted)" text-anchor="middle">healthy</text>

  <!-- API 2 errors -->
  <rect x="616" y="232" width="208" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="var(--danger)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="720" y="256" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">External API — Instance 2</text>
  <text x="720" y="273" class="mono" font-size="9" fill="var(--danger)" text-anchor="middle">errors</text>

  <!-- API 3 healthy -->
  <rect x="616" y="352" width="208" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="720" y="376" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">External API — Instance 3</text>
  <text x="720" y="393" class="mono" font-size="9" fill="var(--muted)" text-anchor="middle">healthy</text>

  <!-- Legend -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="556" class="mono" fill="var(--soft)" font-size="8" letter-spacing="0.14em">LEGEND</text>
  <line x1="140" y1="552" x2="168" y2="552" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="176" y="556" class="mono" fill="var(--muted)" font-size="8">Active traffic</text>
  <line x1="360" y1="552" x2="388" y2="552" stroke="var(--danger)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-danger)"/>
  <text x="396" y="556" class="mono" fill="var(--muted)" font-size="8">Ejected by outlier detection</text>
</svg>