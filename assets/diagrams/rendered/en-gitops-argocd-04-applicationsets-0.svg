<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="appset-matrix-title appset-matrix-desc">
    <title id="appset-matrix-title">ApplicationSet matrix generator</title>
    <desc id="appset-matrix-desc">Diagram showing an ArgoCD ApplicationSet's matrix generator combining a cluster list and an app list so every cluster-app pair produces one generated Application, three clusters by three apps yielding nine Applications.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (painted before arrows and nodes) -->
    <rect x="248" y="32" width="664" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="452" y="36" width="256" height="12" rx="2" fill="#ffffff"/>
    <text x="580" y="45" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">GENERATOR 2 · APPS</text>

    <rect x="28" y="136" width="204" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="42" y="140" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="130" y="149" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">GENERATOR 1 · CLUSTERS</text>

    <rect x="248" y="136" width="664" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="480" y="140" width="200" height="12" rx="2" fill="#ffffff"/>
    <text x="580" y="149" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">GENERATED (3 × 3 = 9)</text>

    <!-- Connectors: generator inputs feeding the matrix (straight, axis-aligned) -->
    <line x1="580" y1="120" x2="580" y2="168" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="220" y1="312" x2="260" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Column headers (Generator 2: Apps) -->
    <g>
      <rect x="260" y="64" width="200" height="56" rx="6" fill="#ffffff"/>
      <rect x="260" y="64" width="200" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <rect x="268" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.50)" stroke-width="0.8"/>
      <text x="284" y="81" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="360" y="97" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">frontend</text>
      <text x="360" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">generator: list</text>
