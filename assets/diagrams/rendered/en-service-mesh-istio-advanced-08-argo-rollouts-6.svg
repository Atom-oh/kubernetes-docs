<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d6-title d6-desc">
    <title id="d6-title">Blue/green deployment flow with pre- and post-analysis gates</title>
    <desc id="d6-desc">A new version deploys to the Preview environment and runs a smoke-test pre-analysis. On failure the deployment aborts. On success it waits for manual approval, then switches the Active Service from blue to green. A comprehensive post-analysis follows: on failure it rolls back from green to blue; on success it deletes the previous version after ten minutes and completes.</desc>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Arrows -->
    <line x1="140" y1="104" x2="140" y2="144" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="140" y1="216" x2="140" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- PreAnalysis -> Abort (No, left) -->
    <path d="M 92,300 H 40 Q 32,300 32,308 V 368" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="12" y="322" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="32" y="331" text-anchor="middle" font-size="8" fill="#7D8998" font-family="'Geist Mono',monospace">fail</text>

    <!-- PreAnalysis -> Wait (Yes, right/down) -->
    <line x1="140" y1="332" x2="140" y2="368" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="148" y="342" width="42" height="12" rx="2" fill="#ffffff"/>
    <text x="169" y="351" text-anchor="middle" font-size="8" fill="#EC7211" font-family="'Geist Mono',monospace">pass</text>

    <!-- Wait -> Switch -->
    <line x1="140" y1="440" x2="140" y2="476" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="148" y="450" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="188" y="459" text-anchor="middle" font-size="8" fill="#7D8998" font-family="'Geist Mono',monospace">promote cmd</text>

    <!-- Switch -> PostAnalysis (right) -->
    <line x1="228" y1="512" x2="316" y2="512" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- PostAnalysis -> Rollback (No, down) -->
    <path d="M 384,532 V 560 Q 384,568 392,568 H 460" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="392" y="552" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="412" y="561" text-anchor="middle" font-size="8" fill="#7D8998" font-family="'Geist Mono',monospace">fail</text>

    <!-- PostAnalysis -> Scale/End (Yes, up-right) -->
    <path d="M 400,480 V 424 Q 400,416 408,416 H 700" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="440" y="404" width="42" height="12" rx="2" fill="#ffffff"/>
    <text x="461" y="413" text-anchor="middle" font-size="8" fill="#EC7211" font-family="'Geist Mono',monospace">pass</text>

    <!-- Nodes -->
    <rect x="40" y="56" width="200" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Deploy new version</text>

    <rect x="40" y="144" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Preview environment</text>
    <text x="140" y="192" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">green candidate</text>

    <polygon points="140,256 200,300 140,344 80,300" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="140" y="296" text-anchor="middle" font-size="10" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">pre-analysis</text>
    <text x="140" y="310" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">smoke-test</text>

    <rect x="16" y="368" width="120" height="44" rx="22" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="76" y="394" text-anchor="middle" font-size="11" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Abort</text>

    <rect x="40" y="368" width="200" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="140" y="398" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Manual approval</text>
    <text x="140" y="414" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">autoPromotion=false</text>

    <rect x="40" y="476" width="188" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="134" y="506" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Switch active svc</text>
    <text x="134" y="522" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">blue &#8594; green</text>

    <polygon points="384,480 444,512 384,544 324,512" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="384" y="508" text-anchor="middle" font-size="10" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">post-analysis</text>
    <text x="384" y="522" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">comprehensive</text>

    <rect x="460" y="536" width="188" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="554" y="564" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Rollback: green &#8594; blue</text>

    <rect x="700" y="392" width="220" height="48" rx="24" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="810" y="415" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Complete</text>
    <text x="810" y="430" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">delete old version after 10m</text>

    <!-- Legend -->
    <line x1="30" y1="20" x2="30" y2="20" stroke="none"/>
    <line x1="24" y1="24" x2="24" y2="24" stroke="none"/>
    <line x1="24" y1="24" x2="24" y2="24" stroke="none"/>
    <line x1="24" y1="580" x2="924" y2="580" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="596" font-size="8" letter-spacing="0.14em" fill="#545B64" font-family="'Geist Mono',monospace">LEGEND</text>
    <line x1="140" y1="593" x2="168" y2="593" stroke="#EC7211" stroke-width="1.4"/>
    <text x="176" y="596" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">gate passed</text>
    <line x1="320" y1="593" x2="348" y2="593" stroke="#545B64" stroke-width="1.2"/>
    <text x="356" y="596" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">gate failed / step</text>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
  </svg>