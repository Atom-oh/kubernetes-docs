<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vcluster-pr-lifecycle-title vcluster-pr-lifecycle-desc">
<title id="vcluster-pr-lifecycle-title">PR 프리뷰 환경 라이프사이클</title>
<desc id="vcluster-pr-lifecycle-desc">GitHub Actions가 PR이 열리면 vCluster를 생성해 앱을 배포하고 프리뷰 URL을 PR에 댓글로 남기며, PR이 머지되거나 닫히면 같은 워크플로가 vCluster를 삭제하는 두 갈래 라이프사이클을 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs><defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Row labels -->
<text x="24" y="148" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CREATE</text>
<text x="24" y="348" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">DELETE</text>

<!-- Arrows: create chain -->
<path d="M164,168 H220" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M400,168 H456" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M636,168 H692" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Arrows: delete chain -->
<path d="M164,368 H220" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M400,368 H456" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Node: PR #42 -->
<rect x="24" y="140" width="140" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="94" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PR #42</text>
<text x="94" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">feature/new-api</text>

<!-- Node: GitHub Actions (create) -->
<rect x="220" y="140" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="310" y="172" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">GitHub Actions</text>

<!-- Node: Create vCluster (focal) -->
<rect x="456" y="140" width="180" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="546" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vCluster 생성</text>
<text x="546" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pr-42</text>

<!-- Node: Deploy + comment -->
<rect x="692" y="140" width="204" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="794" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">앱 배포 → PR 댓글</text>
<text x="794" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">프리뷰 URL 공유</text>

<!-- Node: PR Merge/Close -->
<rect x="24" y="340" width="140" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="94" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PR Merge/Close</text>

<!-- Node: GitHub Actions (delete) -->
<rect x="220" y="340" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="310" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">GitHub Actions</text>

<!-- Node: Delete vCluster -->
<rect x="456" y="340" width="180" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="546" y="364" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vCluster 삭제</text>
<text x="546" y="380" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pr-42</text>

<!-- Legend -->
<line x1="24" y1="452" x2="920" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="24" y="468" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

<rect x="24" y="480" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="44" y="488" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">vCluster 생성 (focal)</text>

<line x1="220" y1="485" x2="248" y2="485" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<text x="256" y="488" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">워크플로 트리거</text>
</svg>