      <title id="arch5-title">Amazon EKS GitOps 아키텍처</title>
      <desc id="arch5-desc">외부 Git 저장소가 Amazon EKS 안의 GitOps Controller에 변경을 전달하고, IAM 역할(IRSA), Amazon ECR, Secrets Manager, Application Load Balancer가 각각 인증, 컨테이너 이미지, 시크릿, 트래픽 유입을 애플리케이션에 공급하는 구조를 보여준다.</desc>
