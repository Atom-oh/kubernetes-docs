<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="finops-loop-title finops-loop-desc">
    <title id="finops-loop-title">FinOps Inform-Optimize-Operate cycle</title>
    <desc id="finops-loop-desc">Cyclic diagram showing the FinOps operating loop: Inform builds cost visibility and allocation, which feeds Optimize's rightsizing and savings work, which feeds Operate's budget governance and automation, which in turn feeds back into Inform.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows first -->
    <!-- Inform -> Optimize (same y, straight) -->
    <line x1="400" y1="160" x2="560" y2="160" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Optimize -> Operate (accent, happy path: savings drive operations) -->
    <path d="M640,252 L640,316 A8,8 0 0 1 632,324 L488,324 A8,8 0 0 0 480,332 L480,384"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Operate -> Inform (closes the loop) -->
    <path d="M400,456 L308,456 A8,8 0 0 1 300,448 L300,260 A8,8 0 0 1 308,252 L320,252"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="464" y="150" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="500" y="159" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VISIBILITY</text>

    <rect x="546" y="336" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="576" y="345" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAVINGS</text>

    <rect x="196" y="326" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="236" y="335" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GOVERNANCE</text>

    <!-- Inform -->
    <rect x="240" y="132" width="160" height="120" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="320" y="156" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Inform</text>
    <line x1="256" y1="166" x2="384" y2="166" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="320" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cost allocation</text>
    <text x="320" y="202" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">showback dashboards</text>
    <text x="320" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tagging &amp; labels</text>

    <!-- Optimize (focal) -->
    <rect x="560" y="132" width="160" height="120" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="640" y="156" fill="#EC7211" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Optimize</text>
    <line x1="576" y1="166" x2="704" y2="166" stroke="rgba(255,153,0,0.30)" stroke-width="0.8"/>
    <text x="640" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rightsizing</text>
    <text x="640" y="202" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">spot / savings plans</text>
    <text x="640" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">idle resource cleanup</text>

    <!-- Operate -->
    <rect x="400" y="384" width="160" height="120" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Operate</text>
    <line x1="416" y1="418" x2="544" y2="418" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="480" y="436" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">budget alerts</text>
    <text x="480" y="454" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">policy enforcement</text>
    <text x="480" y="472" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">regular reviews</text>

    <!-- Legend -->
    <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND</text>

    <rect x="140" y="542" width="24" height="12" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="172" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">FinOps phase</text>

    <rect x="332" y="542" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="364" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Editorial focus</text>

    <line x1="500" y1="548" x2="528" y2="548" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="536" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">Feeds next phase</text>
  </svg>