    <title id="ko-platform-engineering-07-crossplane-1-title">컨트롤 플레인과 프로바이더 런타임</title>
    <desc id="ko-platform-engineering-07-crossplane-1-desc">쿠버네티스 클러스터 안에서 API 서버·etcd로 이뤄진 컨트롤 플레인이 Claim부터 Managed Resource까지의 리소스 체인을 관리하고, Provider Runtime의 Provider-AWS 컨트롤러가 실제 AWS API를 호출하는 구조를 보여주는 아키텍처 다이어그램.</desc>
