<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="retry-title retry-desc">
    <title id="retry-title">Linkerd Retry Behavior</title>
    <desc id="retry-desc">Sequence diagram showing linkerd-proxy transparently retrying a request that failed with a 503 after checking the ServiceProfile retry budget, so the client only ever sees the successful response.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines -->
    <line x1="120" y1="112" x2="120" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="112" x2="480" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="840" y1="112" x2="840" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="116" y="144" width="8" height="384" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="476" y="144" width="8" height="384" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="836" y="176" width="8" height="72" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
    <rect x="836" y="376" width="8" height="72" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

    <!-- 1. Client -> Proxy: HTTP Request -->
    <line x1="120" y1="144" x2="472" y2="144" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="248" y="124" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="296" y="134" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">HTTP REQUEST</text>

    <!-- 2. Proxy -> Service: Request #1 -->
    <line x1="484" y1="176" x2="832" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="612" y="156" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="658" y="166" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REQUEST #1</text>

    <!-- 3. Service --> Proxy: 503 (dashed return) -->
    <path d="M 836,248 L 488,248" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="600" y="228" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="664" y="238" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">503 UNAVAILABLE</text>

    <!-- Note over Proxy -->
    <rect x="380" y="272" width="204" height="56" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.20)" stroke-width="1"/>
    <text x="482" y="288" fill="#232F3E" font-size="9" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Check retry conditions</text>
    <text x="482" y="302" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">isRetryable: true</text>
    <text x="482" y="315" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">budget available</text>

    <!-- 4. Proxy -> Service: Request #2 (retry, accent headline) -->
    <line x1="484" y1="376" x2="832" y2="376" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="596" y="356" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="656" y="366" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REQUEST #2 (RETRY)</text>

    <!-- 5. Service --> Proxy: 200 OK (dashed return) -->
    <path d="M 836,448 L 488,448" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="628" y="428" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="660" y="438" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">200 OK</text>

    <!-- 6. Proxy --> Client: 200 OK (dashed return, headline success) -->
    <path d="M 476,500 L 128,500" fill="none" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
    <rect x="268" y="480" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="300" y="490" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">200 OK</text>

    <!-- Actor boxes (drawn after lifelines/messages so labels don't clip) -->
    <rect x="56" y="60" width="128" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="120" y="90" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>

    <rect x="416" y="60" width="128" height="52" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="84" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">linkerd-proxy</text>
    <text x="480" y="100" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sidecar</text>

    <rect x="776" y="60" width="128" height="52" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="840" y="84" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Backend Service</text>
    <text x="840" y="100" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">upstream</text>

    <!-- Legend -->
    <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="556" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <line x1="40" y1="574" x2="68" y2="574" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="76" y="577" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Request</text>

    <line x1="180" y1="574" x2="208" y2="574" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="216" y="577" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Return</text>

    <line x1="320" y1="574" x2="348" y2="574" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="356" y="577" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Retry / headline success</text>
  </svg>