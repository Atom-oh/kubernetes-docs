<title id="en-service-mesh-istio-03-architecture-5-title">istio-init: Setting Up iptables Redirection</title>
<desc id="en-service-mesh-istio-03-architecture-5-desc">Sequence diagram showing the istio-init container configuring iptables to redirect a pod's traffic to Envoy before the application and Envoy proxy start, so that a later outbound request is transparently intercepted and redirected to Envoy's listener.</desc>
