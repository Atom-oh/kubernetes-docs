<title id="ko-service-mesh-istio-advanced-08-argo-rollouts-2-title">Canary 트래픽과 Analysis 자동 판정 시퀀스</title>
<desc id="ko-service-mesh-istio-advanced-08-argo-rollouts-2-desc">Argo Rollouts가 VirtualService 가중치를 조정해 요청을 Stable/Canary Pod로 나눠 보내고, Pod가 보낸 메트릭을 Prometheus가 집계해 Rollouts에 돌려주면 성공률에 따라 자동으로 진행하거나 롤백하는 시퀀스.</desc>
