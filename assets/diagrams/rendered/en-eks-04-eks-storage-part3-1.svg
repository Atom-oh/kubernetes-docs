<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tsh-title tsh-desc">
    <title id="tsh-title">Storage troubleshooting flow</title>
    <desc id="tsh-desc">Diagram showing four common EKS storage issues — PVC pending, provisioning failure, mount issues, performance issues — routing into four diagnostic-check categories, two of which are shared across multiple issues, each resolving to a matching fix action.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="8" y="64" width="240" height="408" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="28" y="68" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="88" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">COMMON ISSUES</text>

    <rect x="360" y="64" width="280" height="408" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="380" y="68" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="450" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DIAGNOSTIC CHECKS</text>

    <rect x="712" y="64" width="224" height="408" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="732" y="68" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="802" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RESOLUTION ACTIONS</text>

    <!-- Arrows: issue -> diagnostic (drawn before boxes) -->
    <!-- Row y-centers: r1=128 r2=224 r3=320 r4=416; issue box right edge x=232; diag box left edge x=376 -->

    <!-- PVC_Pending(r1) -> D1(r1) straight -->
    <line x1="232" y1="128" x2="376" y2="128" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Volume_Provisioning(r2) -> D1(r1) elbow up, enters D1 at y=140 (offset +12 from center128) -->
    <path d="M232,224 H304 Q312,224 312,216 V148 Q312,140 320,140 H376" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Volume_Provisioning(r2) -> D2(r2) straight -->
    <line x1="232" y1="224" x2="376" y2="224" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- PVC_Pending(r1) -> D2(r2) elbow down, enters D2 at y=212 (offset -12 from center224) -->
    <path d="M232,128 H304 Q312,128 312,136 V204 Q312,212 320,212 H376" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Mount_Issues(r3) -> D3(r3) straight -->
    <line x1="232" y1="320" x2="376" y2="320" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Performance_Issues(r4) -> D3(r3) elbow up, enters D3 at y=332 (offset +12 from center320) -->
    <path d="M232,416 H304 Q312,416 312,408 V340 Q312,332 320,332 H376" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Performance_Issues(r4) -> D4(r4) straight -->
    <line x1="232" y1="416" x2="376" y2="416" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Arrows: diagnostic -> resolution, straight, same row. diag right edge x=624, res left edge x=728 -->
    <line x1="624" y1="128" x2="728" y2="128" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="624" y1="224" x2="728" y2="224" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="624" y1="320" x2="728" y2="320" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="624" y1="416" x2="728" y2="416" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Nodes: Common Issues (col1, x=24 w=208) -->
    <rect x="24" y="96" width="208" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="128" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">PVC in Pending State</text>
    <text x="128" y="138" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl get pvc</text>

    <rect x="24" y="192" width="208" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="128" y="218" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Volume Provisioning</text>
    <text x="128" y="234" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">failure</text>

    <rect x="24" y="288" width="208" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="128" y="314" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Volume Mount Issues</text>
    <text x="128" y="330" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ContainerCreating</text>

    <rect x="24" y="384" width="208" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="128" y="410" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Performance Issues</text>
    <text x="128" y="426" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">slow I/O</text>

    <!-- Nodes: Diagnostic Checks (col2, x=376 w=248) -->
    <rect x="376" y="96" width="248" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="500" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Storage Class Checks</text>
    <text x="500" y="138" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl describe sc</text>

    <rect x="376" y="192" width="248" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="500" y="218" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CSI Driver &amp; IAM Checks</text>
    <text x="500" y="234" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared by 2 issues</text>

    <rect x="376" y="288" width="248" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="500" y="314" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod, Node &amp; Network</text>
    <text x="500" y="330" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared by 2 issues</text>

    <rect x="376" y="384" width="248" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="500" y="410" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Performance &amp; FS Checks</text>
    <text x="500" y="426" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dd / CloudWatch</text>

    <!-- Nodes: Resolution Actions (col3, x=728 w=192) -->
    <rect x="728" y="96" width="192" height="64" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="824" y="122" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Fix Storage Class</text>
    <text x="824" y="138" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">create/update SC</text>

    <rect x="728" y="192" width="192" height="64" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="824" y="212" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Reinstall CSI /</text>
    <text x="824" y="226" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Add IAM Permissions</text>
    <text x="824" y="242" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eksctl iamserviceaccount</text>

    <rect x="728" y="288" width="192" height="64" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="824" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Restart Pod /</text>
    <text x="824" y="322" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Add SG Rules</text>
    <text x="824" y="338" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">port 2049 / 988</text>

    <rect x="728" y="384" width="192" height="64" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="824" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Change Volume/</text>
    <text x="824" y="418" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Instance Type</text>
    <text x="824" y="434" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gp3 / io2 / EBS-optimized</text>

    <!-- Legend -->
    <line x1="32" y1="512" x2="928" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="120" y="521" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="140" y="529" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">CHECK SHARED BY TWO ISSUES — START HERE</text>
  </svg>