<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cb-compare-title cb-compare-desc">
    <title id="cb-compare-title">Without vs. with Circuit Breaker</title>
    <desc id="cb-compare-desc">Flowchart contrasting a microservice chain without a circuit breaker, where one slow service cascades into failures downstream, against the same chain with a circuit breaker, where the failing service is fast-failed and isolated so downstream services stay normal.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="24" y="64" width="424" height="416" rx="8" fill="none" stroke="var(--rule)" stroke-width="1"/>
    <rect x="508" y="64" width="424" height="416" rx="8" fill="none" stroke="var(--rule)" stroke-width="1"/>
    <rect x="24" y="64" width="220" height="20" rx="2" fill="#ffffff"/>
    <text x="40" y="78" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WITHOUT CIRCUIT BREAKER</text>
    <rect x="508" y="64" width="200" height="20" rx="2" fill="#ffffff"/>
    <text x="524" y="78" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WITH CIRCUIT BREAKER</text>

    <!-- Arrows (behind nodes) -->
    <!-- Left: A1->B1 -->
    <path d="M236,160 V196 Q236,204 228,204 H148 Q140,204 140,212 V248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Left: A1->C1 -->
    <path d="M236,160 V196 Q236,204 244,204 H324 Q332,204 332,212 V248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Left: C1->D1 -->
    <line x1="332" y1="304" x2="332" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Right: A2->B2 -->
    <path d="M720,160 V196 Q720,204 712,204 H632 Q624,204 624,212 V248" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Right: A2->C2 -->
    <path d="M720,160 V196 Q720,204 728,204 H808 Q816,204 816,212 V248" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Right: C2->D2 -->
    <line x1="816" y1="304" x2="816" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels (masked, 6-10px gap above stroke) -->
    <rect x="150" y="176" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="188" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SLOW RESP.</text>

    <rect x="298" y="176" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="328" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIMEOUTS</text>

    <rect x="340" y="336" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="370" y="345" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CASCADES</text>

    <rect x="640" y="176" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="670" y="185" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAST FAIL</text>

    <rect x="782" y="176" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="808" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NORMAL</text>

    <rect x="824" y="336" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="850" y="345" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NORMAL</text>

    <!-- Nodes: left (failure chain) -->
    <!-- A1 -->
    <rect x="156" y="104" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="156" y="104" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="236" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service A</text>

    <!-- B1 -->
    <rect x="68" y="248" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="68" y="248" width="144" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="140" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service B</text>
    <text x="140" y="288" fill="#DD344C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILURE</text>

    <!-- C1 -->
    <rect x="260" y="248" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="260" y="248" width="144" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="332" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service C</text>
    <text x="332" y="288" fill="#DD344C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILURE</text>

    <!-- D1 -->
    <rect x="260" y="392" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="260" y="392" width="144" height="56" rx="6" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="332" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service D</text>
    <text x="332" y="432" fill="#DD344C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILURE</text>

    <!-- Nodes: right (isolated chain) -->
    <!-- A2 -->
    <rect x="640" y="104" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="640" y="104" width="160" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="720" y="136" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service A</text>

    <!-- B2 focal -->
    <rect x="552" y="248" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="552" y="248" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="624" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service B</text>
    <text x="624" y="288" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CIRCUIT OPEN</text>

    <!-- C2 -->
    <rect x="744" y="248" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="744" y="248" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="816" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service C</text>
    <text x="816" y="288" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NORMAL</text>

    <!-- D2 -->
    <rect x="744" y="392" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="744" y="392" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="816" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service D</text>
    <text x="816" y="432" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NORMAL</text>

    <!-- Legend -->
    <line x1="24" y1="512" x2="932" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="532" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="104" y="524" width="12" height="12" rx="2" fill="rgba(221,52,76,0.05)" stroke="#DD344C" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="122" y="533" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">FAILING SERVICE</text>

    <rect x="284" y="524" width="12" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="302" y="533" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">NORMAL SERVICE</text>

    <rect x="464" y="524" width="12" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="482" y="533" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">CIRCUIT OPEN (ISOLATED)</text>
  </svg>