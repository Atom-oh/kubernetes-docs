<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repostrategy-title repostrategy-desc">
    <title id="repostrategy-title">모노레포와 폴리레포 구조 비교</title>
    <desc id="repostrategy-desc">모노레포는 하나의 저장소 안에 app-a, app-b, infra 디렉터리가 함께 들어있고, 폴리레포는 같은 구성 요소가 서로 독립된 세 개의 저장소로 분리되어 있음을 보여준다.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="64" width="400" height="472" rx="8" fill="rgba(35,47,62,0.03)" stroke="#D5DBDB" stroke-width="1"/>
    <rect x="520" y="64" width="400" height="472" rx="8" fill="rgba(35,47,62,0.03)" stroke="#D5DBDB" stroke-width="1"/>
    <text x="56" y="92" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GROUP</text>
    <text x="56" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">모노레포</text>
    <text x="536" y="92" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GROUP</text>
    <text x="536" y="112" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">폴리레포</text>

    <!-- ===== Connectors (drawn before boxes) ===== -->
    <!-- root -> MA (bend left) -->
    <path d="M200,176 L200,212 A8,8 0 0 1 192,220 L112,220 A8,8 0 0 0 104,228 L104,280"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- root -> MB (straight, colinear) -->
    <path d="M240,176 L240,280" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- root -> MC (bend right) -->
    <path d="M280,176 L280,212 A8,8 0 0 0 288,220 L368,220 A8,8 0 0 1 376,228 L376,280"
          fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ===== Left zone: monorepo tree ===== -->
    <!-- root node (focal) -->
    <rect x="160" y="120" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="160" y="120" width="160" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="240" y="146" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">단일 저장소</text>
    <text x="240" y="162" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">repo/</text>

    <!-- children -->
    <g>
      <rect x="48" y="280" width="112" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="104" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">app-a/</text>
      <text x="104" y="320" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">dir</text>
    </g>
    <g>
      <rect x="184" y="280" width="112" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="240" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">app-b/</text>
      <text x="240" y="320" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">dir</text>
    </g>
    <g>
      <rect x="320" y="280" width="112" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="376" y="304" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">infra/</text>
      <text x="376" y="320" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">dir</text>
    </g>

    <!-- ===== Right zone: polyrepo, independent repos ===== -->
    <g>
      <rect x="620" y="140" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="720" y="164" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">app-a-repo</text>
      <text x="720" y="180" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">독립 저장소</text>
    </g>
    <g>
      <rect x="620" y="232" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="720" y="256" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">app-b-repo</text>
      <text x="720" y="272" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">독립 저장소</text>
    </g>
    <g>
      <rect x="620" y="324" width="200" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="720" y="348" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">infra-repo</text>
      <text x="720" y="364" fill="#545B64" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">독립 저장소</text>
    </g>
  </svg>