<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="failaccrual-title failaccrual-desc">
    <title id="failaccrual-title">Linkerd Failure Accrual State Machine</title>
    <desc id="failaccrual-desc">State machine showing an endpoint moving from Closed to Open after consecutive failures exceed a threshold, to Half-Open once the backoff elapses, then back to Closed on a successful probe or back to Open if the probe fails.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Start dot -->
    <circle cx="96" cy="300" r="6" fill="#232F3E"/>

    <!-- start -> Closed -->
    <line x1="102" y1="300" x2="152" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Closed -> Open (straight, same axis) -->
    <line x1="372" y1="300" x2="420" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="316" y="236" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="380" y="245" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">FAILURES &gt; LIMIT</text>

    <!-- Open -> HalfOpen (straight, same axis) -->
    <line x1="580" y1="300" x2="628" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="540" y="236" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="604" y="245" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">BACKOFF ELAPSED</text>

    <!-- HalfOpen -> Closed (probe succeeds, accent headline, arcs above) -->
    <path d="M 792,268 V 196 Q 792,188 784,188 H 270 Q 262,188 262,196 V 268"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="464" y="164" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="528" y="174" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PROBE SUCCEEDS</text>

    <!-- HalfOpen -> Open (probe fails, arcs below) -->
    <path d="M 792,332 V 372 Q 792,380 784,380 H 548 Q 540,380 540,372 V 332"
          fill="none" stroke="#545B64" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="608" y="392" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="656" y="402" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PROBE FAILS</text>

    <!-- State: Closed (focal — normal operation) -->
    <rect x="152" y="268" width="220" height="64" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="262" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Closed</text>
    <text x="262" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">all requests forwarded</text>

    <!-- State: Open -->
    <rect x="420" y="268" width="160" height="64" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="500" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Open</text>
    <text x="500" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">endpoint excluded</text>

    <!-- State: HalfOpen -->
    <rect x="628" y="268" width="200" height="64" rx="8" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="728" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Half-Open</text>
    <text x="728" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sends probe requests</text>

    <!-- Legend -->
    <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="468" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="480" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="488" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Normal / recovered state</text>

    <line x1="296" y1="485" x2="324" y2="485" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="332" y="488" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Recovery transition</text>

    <line x1="500" y1="485" x2="528" y2="485" stroke="#545B64" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="536" y="488" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Failure transition</text>
  </svg>