<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vcluster-syncer-title vcluster-syncer-desc">
<title id="vcluster-syncer-title">Syncer 이름 변환</title>
<desc id="vcluster-syncer-desc">가상 클러스터의 Pod, Service, ConfigMap, Ingress가 Syncer를 거쳐 이름과 네임스페이스가 변환된 형태로 호스트 클러스터에 생성되는 과정을 보여준다.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style></defs><defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zones -->
<rect x="40" y="40" width="240" height="460" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="90" y="44" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="160" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">가상 클러스터</text>

<rect x="680" y="40" width="240" height="460" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="740" y="44" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="800" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">호스트 클러스터</text>

<!-- Arrows: virtual -> syncer -->
<path d="M280,108 H360 Q368,108 368,116 V184 Q368,192 376,192 H400" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M280,196 H400" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M280,284 H360 Q368,284 368,276 V208 Q368,200 376,200 H400" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M280,372 H360 Q368,372 368,364 V212 Q368,204 376,204 H400" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

