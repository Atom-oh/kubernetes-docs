<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ipflow-title ipflow-desc">
  <title id="ipflow-title">선택적 앱별 IP 제한 동작 흐름</title>
  <desc id="ipflow-desc">동일한 클라이언트 IP가 Gateway를 거쳐 제한 없는 App A에는 200 OK로 허용되지만, AuthorizationPolicy가 걸린 App F에는 403 Forbidden으로 거부되는 시퀀스를 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Lifelines -->
  <line x1="88"  y1="112" x2="88"  y2="528" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="264" y1="112" x2="264" y2="528" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="440" y1="112" x2="440" y2="528" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="616" y1="112" x2="616" y2="528" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="792" y1="112" x2="792" y2="528" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Setup note over Gateway -->
  <rect x="500" y="128" width="232" height="34" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.15)" stroke-width="0.8"/>
  <text x="510" y="142" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.01em">EnvoyFilter로 XFF 처리</text>
  <text x="510" y="154" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.01em">설정 (사전 적용)</text>

  <!-- Messages -->
  <line x1="88" y1="196" x2="256" y2="196" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="130" y="176" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="162" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">HTTP 요청</text>

  <line x1="264" y1="252" x2="432" y2="252" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="284" y="232" width="128" height="12" rx="2" fill="#ffffff"/>
  <text x="348" y="241" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">XFF: 1.2.3.4, ALB_IP</text>

  <line x1="440" y1="308" x2="608" y2="308" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="464" y="288" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="524" y="297" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">원본 IP: 1.2.3.4</text>

  <!-- Return AppA -> Gateway (dashed, filled marker) -->
  <line x1="608" y1="356" x2="448" y2="356" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="492" y="336" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="528" y="345" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">200 OK</text>

  <line x1="440" y1="412" x2="784" y2="412" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="580" y="392" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="640" y="401" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">원본 IP: 1.2.3.4</text>

  <!-- Return AppF -> Gateway (dashed) -->
  <line x1="784" y1="460" x2="448" y2="460" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="580" y="440" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="636" y="449" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.01em">403 Forbidden</text>

  <!-- Actor boxes (top) -->
  <rect x="20" y="68" width="136" height="44" rx="6" fill="#ffffff"/>
  <rect x="20" y="68" width="136" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="88" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">클라이언트</text>
  <text x="88" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">1.2.3.4</text>

  <rect x="196" y="68" width="136" height="44" rx="6" fill="rgba(35,47,62,0.03)"/>
  <rect x="196" y="68" width="136" height="44" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="264" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ALB</text>

  <!-- Focal: Istio Gateway -->
  <rect x="372" y="68" width="136" height="44" rx="6" fill="#ffffff"/>
  <rect x="372" y="68" width="136" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="440" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio Gateway</text>
  <text x="440" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">XFF 추출</text>

  <rect x="548" y="68" width="136" height="44" rx="6" fill="#ffffff"/>
  <rect x="548" y="68" width="136" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="616" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App A</text>
  <text x="616" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">제한 없음</text>

  <rect x="724" y="68" width="136" height="44" rx="6" fill="rgba(221,52,76,0.05)"/>
  <rect x="724" y="68" width="136" height="44" rx="6" fill="rgba(221,52,76,0.05)" stroke="rgba(221,52,76,0.55)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="792" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">App F</text>
  <text x="792" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">IP 제한</text>

  <!-- Legend -->
  <line x1="30" y1="548" x2="930" y2="548" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="160" y1="564" x2="192" y2="564" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="200" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">요청 · 전달</text>
  <line x1="340" y1="564" x2="372" y2="564" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="380" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">XFF 원본 IP 추출 지점</text>
  <line x1="600" y1="564" x2="632" y2="564" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="640" y="568" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">응답</text>
</svg>