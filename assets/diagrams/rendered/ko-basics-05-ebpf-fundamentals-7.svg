    <title id="ko-basics-05-ebpf-fundamentals-7-title">기존 모니터링 방식과 eBPF 방식 비교</title>
    <desc id="ko-basics-05-ebpf-fundamentals-7-desc">기존 방식은 애플리케이션에 SDK나 에이전트를 심어 메트릭을 수집하지만, eBPF 방식은 애플리케이션 코드 변경 없이 커널에서 eBPF 프로그램으로 직접 관측 데이터를 모니터링 백엔드로 전달한다는 것을 비교하는 다이어그램.</desc>
