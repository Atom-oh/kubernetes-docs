<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calico-modes-title calico-modes-desc">
    <title id="calico-modes-title">Calico networking modes mapped to performance</title>
    <desc id="calico-modes-desc">Architecture diagram mapping Calico's four networking modes to their performance characteristics, from encapsulated IPIP and VXLAN overlays through native-speed direct routing to the eBPF data plane, which reaches kernel-bypass performance.</desc>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones (drawn before arrows and nodes) -->
    <rect x="64" y="80" width="280" height="472" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="128" y="84" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="204" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NETWORKING OPTIONS</text>

    <rect x="600" y="80" width="296" height="472" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="692" y="84" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="748" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PERFORMANCE</text>

    <!-- Arrows (behind boxes) (straight, same y, shared axis) -->
    <line x1="300" y1="144" x2="636" y2="144" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="300" y1="264" x2="636" y2="264" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="300" y1="384" x2="636" y2="384" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="300" y1="504" x2="636" y2="504" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <!-- Row 1: IPIP Mode -> Good - Encapsulated -->
    <rect x="100" y="112" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="100" y="112" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="108" y="120" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="126" y="129" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
    <text x="200" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">IPIP Mode</text>

    <rect x="636" y="112" width="228" height="64" rx="6" fill="#ffffff"/>
    <rect x="636" y="112" width="228" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="750" y="150" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Good</text>
    <text x="750" y="166" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">encapsulated</text>

    <!-- Row 2: VXLAN Mode -> Good - Standard Overlay -->
    <rect x="100" y="232" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="100" y="232" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="108" y="240" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="126" y="249" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
    <text x="200" y="270" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">VXLAN Mode</text>

    <rect x="636" y="232" width="228" height="64" rx="6" fill="#ffffff"/>
    <rect x="636" y="232" width="228" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="750" y="270" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Good</text>
    <text x="750" y="286" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">standard overlay</text>

    <!-- Row 3: Direct Routing -> Best - Native Speed -->
    <rect x="100" y="352" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="100" y="352" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="108" y="360" width="36" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="126" y="369" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
    <text x="200" y="390" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Direct Routing</text>

    <rect x="636" y="352" width="228" height="64" rx="6" fill="#ffffff"/>
    <rect x="636" y="352" width="228" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="750" y="390" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Best</text>
    <text x="750" y="406" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">native speed</text>

    <!-- Row 4: eBPF Data Plane -> Best - Kernel Bypass (focal) -->
    <rect x="100" y="472" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="100" y="472" width="200" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="108" y="480" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="126" y="489" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
    <text x="200" y="510" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBPF Data Plane</text>

    <rect x="636" y="472" width="228" height="64" rx="6" fill="#ffffff"/>
    <rect x="636" y="472" width="228" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="750" y="510" fill="#232F3E" font-size="12" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Best</text>
    <text x="750" y="526" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kernel bypass</text>

    <!-- Legend -->
    <line x1="40" y1="568" x2="920" y2="568" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="580" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="588" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Fastest option (eBPF, kernel bypass)</text>
    <rect x="380" y="580" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="400" y="588" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Overlay / native-speed outcome</text>
  </svg>