<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4-title d4-desc">
  <title id="d4-title">점진적 마이그레이션 전략 5단계</title>
  <desc id="d4-desc">VM 메시 등록부터 VM 제거까지, WorkloadEntry를 이용한 5단계 점진적 마이그레이션 흐름을 보여준다. 4단계 트래픽 전환이 핵심 분기점으로 강조되어 있다.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="48" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">FLOWCHART · MIGRATION STRATEGY</text>
  <text x="36" y="84" font-size="28" font-weight="700" fill="#232F3E">점진적 마이그레이션 전략</text>
  <text x="36" y="108" font-size="14" fill="#545B64">WorkloadEntry로 등록한 VM을 5단계에 걸쳐 Kubernetes로 이전한다</text>

  <!-- Arrows (drawn before boxes) -->
  <!-- 1->2 -->
  <path d="M188,312 H212" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 2->3 -->
  <path d="M372,312 H396" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 3->4 -->
  <path d="M556,312 H580" fill="none" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 4->5 -->
  <path d="M740,312 H764" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Phase 1 -->
  <g>
    <rect x="36" y="280" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="36" y="280" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="44" y="288" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="66" y="297" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="rgba(35,47,62,0.8)">1단계</text>
    <text x="112" y="320" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">VM 메시 등록</text>
    <text x="112" y="336" class="mono" font-size="9" text-anchor="middle" fill="#545B64">WorkloadEntry</text>
  </g>

  <!-- Phase 2 -->
  <g>
    <rect x="220" y="280" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="220" y="280" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="228" y="288" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="250" y="297" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="rgba(35,47,62,0.8)">2단계</text>
    <text x="296" y="320" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">트래픽 분할</text>
    <text x="296" y="336" class="mono" font-size="9" text-anchor="middle" fill="#545B64">100% VM</text>
  </g>

  <!-- Phase 3 -->
  <g>
    <rect x="404" y="280" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="404" y="280" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="412" y="288" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="434" y="297" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="rgba(35,47,62,0.8)">3단계</text>
    <text x="480" y="320" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">K8s 배포</text>
    <text x="480" y="336" class="mono" font-size="9" text-anchor="middle" fill="#545B64">kubectl apply</text>
  </g>

  <!-- Phase 4 (focal) -->
  <g>
    <rect x="588" y="276" width="152" height="72" rx="6" fill="#ffffff"/>
    <rect x="588" y="276" width="152" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="596" y="284" width="44" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.5)" stroke-width="0.8"/>
    <text x="618" y="293" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="#EC7211">4단계</text>
    <text x="664" y="320" font-size="12" font-weight="700" text-anchor="middle" fill="#232F3E">트래픽 전환</text>
    <text x="664" y="336" class="mono" font-size="9" text-anchor="middle" fill="#545B64">90% → 10%</text>
  </g>

  <!-- Phase 5 -->
  <g>
    <rect x="772" y="280" width="152" height="64" rx="6" fill="#ffffff"/>
    <rect x="772" y="280" width="152" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="780" y="288" width="44" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.4)" stroke-width="0.8"/>
    <text x="802" y="297" class="mono" font-size="7" letter-spacing="0.08em" text-anchor="middle" fill="rgba(35,47,62,0.8)">5단계</text>
    <text x="848" y="320" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">VM 제거</text>
    <text x="848" y="336" class="mono" font-size="9" text-anchor="middle" fill="#545B64">kubectl delete</text>
  </g>

  <!-- Legend -->
  <line x1="36" y1="500" x2="924" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="36" y="520" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <rect x="120" y="510" width="16" height="16" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="144" y="522" font-size="11" fill="#545B64">일반 마이그레이션 단계</text>
  <rect x="320" y="510" width="16" height="16" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="344" y="522" font-size="11" fill="#545B64">핵심 전환 지점 (실제 트래픽 이전)</text>

  <text x="36" y="568" font-size="14" font-style="italic" fill="#545B64">각 단계는 이전 단계가 안정화된 뒤에만 진행하며, 되돌릴 수 있는 지점을 항상 남겨둔다.</text>
</svg>