<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mimir-architecture-title mimir-architecture-desc">
<title id="mimir-architecture-title">Grafana Mimir overall architecture</title>
<desc id="mimir-architecture-desc">Prometheus writes through the Distributor into Ingesters, which upload blocks to object storage; the Compactor merges those blocks, while Grafana's queries flow through the Query-frontend and Querier to read recent data from the Ingester and historical data from the Store-gateway, both backed by the same object storage.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- zone: Grafana Mimir components -->
<rect x="240" y="80" width="400" height="400" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="260" y="84" width="120" height="12" rx="2" fill="#ffffff"/>
<text x="320" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">GRAFANA MIMIR</text>

<!-- ============ ARROWS (drawn before nodes) ============ -->

<!-- E1 Prometheus -> Distributor -->
<line x1="180" y1="121" x2="260" y2="121" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="200" y="100" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="220" y="109" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

<!-- E2 Distributor -> Ingester -->
<line x1="400" y1="121" x2="480" y2="121" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- E3 Ingester -> S3 (block upload) -->
<path d="M620,121 H672 Q680,121 680,129 V168 Q680,176 688,176 H740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="690" y="142" width="44" height="12" rx="2" fill="#ffffff"/>
<text x="712" y="151" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">UPLOAD</text>

<!-- E4 Compactor -> S3 (compaction), routed below Store-gateway -->
<path d="M330,312 V336 Q330,344 338,344 H716 Q724,344 724,336 V328 Q724,320 732,320 H740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="440" y="324" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="472" y="333" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">COMPACT</text>

<!-- E5 Store-gateway -> S3 (block read) -->
<path d="M620,280 H672 Q680,280 680,272 V256 Q680,248 688,248 H740" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="690" y="258" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="710" y="267" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

<!-- E6 Querier -> Ingester, routed through the inter-column gap -->
<path d="M480,428 H448 Q440,428 440,420 V151 Q440,143 448,143 H480" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- E7 Querier -> Store-gateway (adjacent column, straight) -->
<line x1="550" y1="396" x2="550" y2="312" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- E8 Query-frontend -> Querier -->
<line x1="400" y1="428" x2="480" y2="428" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- E9 Grafana -> Query-frontend -->
<line x1="180" y1="428" x2="260" y2="428" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ============ NODES ============ -->

<!-- Prometheus (input) -->
<rect x="40" y="100" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="40" y="100" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="110" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
<text x="110" y="146" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">×3, write path</text>

<!-- Distributor -->
<rect x="260" y="100" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="260" y="100" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="330" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Distributor</text>
<text x="330" y="146" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">×2, tenant validation</text>

<!-- Ingester -->
<rect x="480" y="100" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="480" y="100" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="550" y="130" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Ingester</text>
<text x="550" y="146" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">×3, in-memory + WAL</text>

<!-- Compactor -->
<rect x="260" y="248" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="260" y="248" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="330" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Compactor</text>
<text x="330" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">block merge</text>

<!-- Store-gateway -->
<rect x="480" y="248" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="480" y="248" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="550" y="278" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Store-gateway</text>
<text x="550" y="294" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">×2, block cache</text>

<!-- Query-frontend -->
<rect x="260" y="396" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="260" y="396" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="330" y="426" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Query-frontend</text>
<text x="330" y="442" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">split + cache</text>

<!-- Querier -->
<rect x="480" y="396" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="480" y="396" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="550" y="426" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Querier</text>
<text x="550" y="442" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">×2, merges results</text>

<!-- Grafana (input) -->
<rect x="40" y="396" width="140" height="64" rx="6" fill="#ffffff"/>
<rect x="40" y="396" width="140" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="110" y="426" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana</text>
<text x="110" y="442" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">read path</text>

<!-- S3 / GCS / Azure (focal) -->
<rect x="740" y="132" width="140" height="236" rx="6" fill="#ffffff"/>
<rect x="740" y="132" width="140" height="236" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="810" y="240" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Object Storage</text>
<text x="810" y="256" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">S3 / GCS / Azure</text>

<!-- legend -->
<line x1="40" y1="536" x2="900" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="40" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="160" y="542" width="14" height="12" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="182" y="552" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">client</text>
<rect x="260" y="542" width="14" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="282" y="552" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Mimir component</text>
<rect x="460" y="542" width="14" height="12" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="482" y="552" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">object storage (focal)</text>
<line x1="700" y1="548" x2="732" y2="548" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="740" y="552" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">data flow</text>

</svg>