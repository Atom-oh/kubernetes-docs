<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dyna-arch-title dyna-arch-desc">
<title id="dyna-arch-title">Dynatrace on Amazon EKS</title>
<desc id="dyna-arch-desc">OneAgent runs as a DaemonSet on EKS worker nodes and auto-instruments applications; telemetry flows through the in-cluster ActiveGate to Dynatrace SaaS, which feeds the Davis AI engine and Grail data lakehouse. A Dynatrace Operator manages the in-cluster components via a mutating webhook.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
  <style>text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;}</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- ===== Zones (painted first) ===== -->
<rect x="32" y="40" width="560" height="260" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="48" y="44" width="168" height="12" rx="2" fill="#ffffff"/>
<text x="132" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">AMAZON EKS CLUSTER</text>

<rect x="632" y="40" width="304" height="260" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="648" y="44" width="168" height="12" rx="2" fill="#ffffff"/>
<text x="732" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">DYNATRACE PLATFORM</text>

<rect x="248" y="88" width="168" height="168" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.14)" stroke-width="0.8"/>
<rect x="264" y="92" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="300" y="101" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">OPERATOR</text>

<!-- ===== Arrows (drawn before boxes) ===== -->

<!-- E1: Applications -.-> OneAgent (dashed, injection) -->
<line x1="134" y1="144" x2="134" y2="220" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="144" y="176" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="176" y="185" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">INJECT</text>

<!-- E2: OneAgent -> ActiveGate -->
<path d="M204,248 H322 Q330,248 330,240 V220 Q330,212 338,212 H456" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="231" y="256" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="263" y="265" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TELEMETRY</text>

<!-- E3: ActiveGate -> Dynatrace SaaS (focal) -->
<path d="M576,212 H616 Q624,212 624,204 V108 Q624,100 632,100 H672" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="634" y="150" width="70" height="12" rx="2" fill="#ffffff"/>
<text x="669" y="159" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ENCRYPTED</text>

<!-- E4: SaaS -> Davis AI (straight, shared x) -->
<line x1="716" y1="128" x2="716" y2="176" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- E5: SaaS -> Grail -->
<path d="M800,128 V152 Q800,160 808,160 H844 Q852,160 852,168 V176" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

