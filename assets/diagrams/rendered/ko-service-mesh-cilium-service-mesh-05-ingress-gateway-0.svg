<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="ingress-arch-title ingress-arch-desc">
  <title id="ingress-arch-title">Cilium 인그레스/게이트웨이 아키텍처</title>
  <desc id="ingress-arch-desc">외부 클라이언트가 클라우드 로드밸런서와 Gateway/Ingress를 거쳐 Cilium Envoy L7 프록시에서 세 개의 백엔드 서비스로 라우팅되는 흐름을 보여준다.</desc>
  <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="40" y="32" width="880" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="52" y="36" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="88" y="45" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">EXTERNAL</text>

  <rect x="40" y="180" width="880" height="372" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="52" y="184" width="152" height="12" rx="2" fill="#ffffff"/>
  <text x="128" y="193" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">KUBERNETES CLUSTER</text>

  <!-- sub-group captions (text only, no boxes) -->
  <text x="480" y="212" fill="#7D8998" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.12em">CILIUM INGRESS/GATEWAY</text>
  <text x="480" y="440" fill="#7D8998" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.12em">BACKEND SERVICES</text>

  <!-- Arrows (drawn before nodes) -->
  <!-- Client -> LB (straight, same y) -->
  <path d="M240,90 H380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- LB -> GW (straight vertical, same x=480) -->
  <path d="M480,116 V216" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- GW -> Envoy (straight vertical, same x=480) -->
  <path d="M480,268 V320" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Envoy fan-out to SvcA / SvcB / SvcC : fan attach points on Envoy bottom edge (x 380-580) at 430, 480, 530 -->
  <!-- Envoy(430,376) -> SvcA(200,460 top) -->
  <path d="M430,376 V440 Q430,448 422,448 H208 Q200,448 200,456 V460" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Envoy(480,376) -> SvcB(480,460 top) straight -->
  <path d="M480,376 V460" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Envoy(530,376) -> SvcC(760,460 top) -->
  <path d="M530,376 V440 Q530,448 538,448 H752 Q760,448 760,456 V460" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Nodes -->
  <!-- Client (external treatment) -->
  <rect x="80" y="64" width="160" height="52" rx="6" fill="#ffffff"/>
  <rect x="80" y="64" width="160" height="52" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="160" y="94" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">External Client</text>

  <!-- LB (external treatment) -->
  <rect x="380" y="64" width="200" height="52" rx="6" fill="#ffffff"/>
  <rect x="380" y="64" width="200" height="52" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="480" y="88" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Cloud Load Balancer</text>
  <text x="480" y="104" fill="#545B64" font-size="9" class="mono" text-anchor="middle">NLB / ALB</text>

  <!-- GW (backend treatment) -->
  <rect x="380" y="216" width="200" height="52" rx="6" fill="#ffffff"/>
  <rect x="380" y="216" width="200" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="240" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Gateway</text>
  <text x="480" y="256" fill="#545B64" font-size="9" class="mono" text-anchor="middle">or Ingress</text>

  <!-- Envoy (focal) -->
  <rect x="380" y="320" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)"/>
  <rect x="380" y="320" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="480" y="346" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Cilium Envoy</text>
  <text x="480" y="362" fill="#545B64" font-size="9" class="mono" text-anchor="middle">L7 Proxy</text>

  <!-- SvcA / SvcB / SvcC (backend treatment) -->
  <rect x="120" y="460" width="160" height="52" rx="6" fill="#ffffff"/>
  <rect x="120" y="460" width="160" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="200" y="490" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service A</text>

  <rect x="400" y="460" width="160" height="52" rx="6" fill="#ffffff"/>
  <rect x="400" y="460" width="160" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="490" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service B</text>

  <rect x="680" y="460" width="160" height="52" rx="6" fill="#ffffff"/>
  <rect x="680" y="460" width="160" height="52" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="760" y="490" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service C</text>
</svg>
