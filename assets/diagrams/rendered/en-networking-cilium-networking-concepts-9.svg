<title id="en-networking-cilium-networking-concepts-9-title">Native Routing (Direct Routing)</title>
<desc id="en-networking-cilium-networking-concepts-9-desc">Diagram showing two Kubernetes nodes, each routing pod traffic through a local routing table directly onto the physical network with no overlay encapsulation.</desc>
