<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="corr-title corr-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="corr-title">요청 흐름과 상관분석의 연결 구조</title>
    <desc id="corr-desc">사용자 요청이 여러 마이크로서비스를 거치는 동안 각 서비스가 남긴 로그·메트릭·트레이스가 공통 TraceID로 상관분석되어 하나로 묶이는 과정을 보여준다.</desc>
    <defs><style>@import url(https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
      <marker id="c-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="c-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="c-arrow-accent-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="8 0, 0 3, 8 6" fill="#EC7211"/>
      </marker>
      <marker id="c-arrow-soft" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
        <polygon points="0 0, 7 2.5, 0 5" fill="#7D8998"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="424" y="60" width="112" height="64" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="440" y="64" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">사용자 요청</text>

    <rect x="120" y="188" width="720" height="112" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="136" y="192" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="196" y="201" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">마이크로서비스</text>

    <rect x="336" y="376" width="288" height="128" rx="8" fill="rgba(255,153,0,0.04)" stroke="rgba(236,114,17,0.35)" stroke-width="0.8"/>
    <rect x="352" y="380" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="392" y="389" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">상관분석</text>

    <!-- Request -> S1 -->
    <line x1="480" y1="124" x2="480" y2="220" stroke="#545B64" stroke-width="1.2" marker-end="url(#c-arrow)"/>

    <!-- S1 -> S2, S1 -> S3 -->
    <path d="M 440,244 H 300 Q 292,244 292,252 V 220"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#c-arrow)"/>
    <path d="M 440,252 H 660 Q 668,252 668,244 V 220"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#c-arrow)"/>
    <!-- S3 -> S4 -->
    <line x1="716" y1="244" x2="756" y2="244" stroke="#545B64" stroke-width="1.2" marker-end="url(#c-arrow)"/>

    <!-- S1..S4 -> C1 (dashed, fanned attach points into C1 top edge at 372,384,396,408) -->
    <path d="M 220,268 V 380 Q 220,388 228,388 H 372" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#c-arrow-soft)"/>
    <path d="M 480,268 V 384" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#c-arrow-soft)"/>
    <path d="M 680,268 V 380 Q 680,388 672,388 H 408" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#c-arrow-soft)"/>
    <path d="M 800,268 V 348 Q 800,356 792,356 H 448 Q 440,356 440,364 V 392" fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#c-arrow-soft)"/>
    <rect x="620" y="332" width="150" height="12" rx="2" fill="#ffffff"/>
    <text x="695" y="341" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">로그/메트릭/트레이스</text>

    <!-- C1 <-> C2 <-> C3 <-> C1 triangle -->
    <line x1="480" y1="420" x2="556" y2="420" stroke="#EC7211" stroke-width="1.2" marker-start="url(#c-arrow-accent-rev)" marker-end="url(#c-arrow-accent)"/>
    <path d="M 592,436 V 460 Q 592,468 584,468 H 424 Q 416,468 416,460 V 436"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-start="url(#c-arrow-accent-rev)" marker-end="url(#c-arrow-accent)"/>

    <!-- Request node -->
    <rect x="424" y="88" width="112" height="36" rx="6" fill="#ffffff"/>
    <rect x="424" y="88" width="112" height="36" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="110" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">HTTP Request</text>

    <!-- Service nodes -->
    <rect x="424" y="220" width="112" height="48" rx="6" fill="#ffffff"/>
    <rect x="424" y="220" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Gateway</text>
    <text x="480" y="258" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">S1</text>

    <rect x="164" y="220" width="112" height="48" rx="6" fill="#ffffff"/>
    <rect x="164" y="220" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">User Service</text>
    <text x="220" y="258" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">S2</text>

    <rect x="624" y="220" width="112" height="48" rx="6" fill="#ffffff"/>
    <rect x="624" y="220" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="680" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Order Service</text>
    <text x="680" y="258" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">S3</text>

    <rect x="744" y="220" width="112" height="48" rx="6" fill="#ffffff"/>
    <rect x="744" y="220" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="800" y="244" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Payment Service</text>
    <text x="800" y="258" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">S4</text>

    <!-- Correlation nodes -->
    <rect x="424" y="392" width="112" height="44" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="424" y="392" width="112" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="480" y="412" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">TraceID</text>
    <text x="480" y="428" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">abc123</text>

    <rect x="556" y="392" width="112" height="44" rx="6" fill="#ffffff"/>
    <rect x="556" y="392" width="112" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="612" y="416" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Metric Exemplar</text>

    <rect x="336" y="460" width="112" height="44" rx="6" fill="#ffffff"/>
    <rect x="336" y="460" width="112" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="392" y="484" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Log Correlation</text>

    <!-- Legend -->
    <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="536" x2="164" y2="536" stroke="#545B64" stroke-width="1.2" marker-end="url(#c-arrow)"/>
    <text x="172" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">요청 흐름</text>
    <line x1="300" y1="536" x2="324" y2="536" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#c-arrow-soft)"/>
    <text x="332" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">관측 데이터 수집</text>
    <line x1="500" y1="536" x2="524" y2="536" stroke="#EC7211" stroke-width="1.2" marker-start="url(#c-arrow-accent-rev)" marker-end="url(#c-arrow-accent)"/>
    <text x="532" y="540" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">상관분석 상호 연결</text>
  </svg>