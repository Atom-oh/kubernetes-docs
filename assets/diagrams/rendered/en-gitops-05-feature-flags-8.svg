<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flagreview-title flagreview-desc">
<title id="flagreview-title">Reviewed flag change workflow</title>
<desc id="flagreview-desc">Sequence diagram showing a developer editing a flag file on a branch, CI validating and a peer approving the pull request, then GitOps applying the merged FeatureFlag resource so Kubernetes syncs it without a pod restart.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Lifelines -->
<line x1="100" y1="120" x2="100" y2="576" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="290" y1="120" x2="290" y2="576" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="480" y1="120" x2="480" y2="576" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="670" y1="120" x2="670" y2="576" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="860" y1="120" x2="860" y2="576" stroke="rgba(35,47,62,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Activation bars -->
<rect x="286" y="156" width="8" height="272" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="476" y="196" width="8" height="104" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
<rect x="666" y="452" width="8" height="40" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="0.8"/>
<rect x="856" y="484" width="8" height="72" fill="rgba(255,153,0,0.08)" stroke="#EC7211" stroke-width="0.8"/>

<!-- Messages -->
<line x1="100" y1="160" x2="286" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="294" y1="200" x2="476" y2="200" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 484,232 L 520,232 L 520,264 L 484,264" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="476" y1="296" x2="294" y2="296" stroke="#545B64" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="100" y1="328" x2="286" y2="328" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 294,360 L 330,360 L 330,392 L 294,392" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="100" y1="424" x2="286" y2="424" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="294" y1="456" x2="666" y2="456" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="674" y1="488" x2="856" y2="488" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 864,520 L 900,520 L 900,552 L 864,552" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- Labels -->
<rect x="140" y="144" width="106" height="12" rx="2" fill="#ffffff"/>
<text x="193" y="154" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">EDIT FLAGS.YAML</text>

<rect x="330" y="184" width="110" height="12" rx="2" fill="#ffffff"/>
<text x="385" y="194" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">TRIGGER CI</text>

<rect x="528" y="240" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="578" y="250" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">VALIDATE CONFIG</text>

<rect x="330" y="280" width="110" height="12" rx="2" fill="#ffffff"/>
<text x="385" y="290" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">STATUS: PASSED</text>

<rect x="140" y="312" width="106" height="12" rx="2" fill="#ffffff"/>
<text x="193" y="322" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">OPEN PULL REQUEST</text>

<rect x="338" y="372" width="112" height="12" rx="2" fill="#ffffff"/>
<text x="394" y="382" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REVIEW APPROVED</text>

<rect x="140" y="408" width="106" height="12" rx="2" fill="#ffffff"/>
<text x="193" y="418" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">MERGE TO MAIN</text>

<rect x="428" y="440" width="104" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="450" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WEBHOOK/POLL</text>

<rect x="716" y="472" width="88" height="12" rx="2" fill="#ffffff"/>
<text x="760" y="482" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">APPLY CR</text>

<rect x="908" y="530" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="928" y="540" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SYNC CM</text>

<!-- Actor boxes -->
<rect x="28" y="64" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="28" y="64" width="144" height="56" rx="6" fill="rgba(35,47,62,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="100" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Developer</text>
<text x="100" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">author</text>

<rect x="218" y="64" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="218" y="64" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="290" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Git / GitHub</text>
<text x="290" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PR + review</text>

<rect x="408" y="64" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="408" y="64" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">CI Pipeline</text>
<text x="480" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lint + dry-run</text>

<rect x="598" y="64" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="598" y="64" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="670" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">ArgoCD / Flux</text>
<text x="670" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">focal · GitOps</text>

<rect x="788" y="64" width="144" height="56" rx="6" fill="#ffffff"/>
<rect x="788" y="64" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="860" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Kubernetes</text>
<text x="860" y="109" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">focal · applies CR</text>

<!-- Note -->
<rect x="746" y="560" width="186" height="28" rx="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="0.8"/>
<text x="839" y="572" fill="#545B64" font-size="9" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Flags active in seconds</text>
<text x="839" y="584" fill="#545B64" font-size="9" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">no pod restart required</text>
</svg>