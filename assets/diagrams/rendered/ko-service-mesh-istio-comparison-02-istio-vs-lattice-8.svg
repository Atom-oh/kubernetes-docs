<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ko-service-mesh-istio-comparison-02-istio-vs-lattice-8-title ko-service-mesh-istio-comparison-02-istio-vs-lattice-8-desc">
<title id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-8-title">Sidecar Mode vs Ambient Mode: 파드당 프록시에서 노드당 프록시로</title>
<desc id="ko-service-mesh-istio-comparison-02-istio-vs-lattice-8-desc">Sidecar Mode에서는 각 파드마다 Envoy 프록시가 붙어 파드 수만큼 리소스가 늘어나지만, Ambient Mode에서는 노드당 하나의 ztunnel이 eBPF로 트래픽을 가로채 mTLS를 처리하고 L7 기능이 필요할 때만 선택적 Waypoint Proxy를 거치면서, 100파드 환경 기준 메모리 사용량이 12.8GB에서 300MB로 약 97% 줄어든다는 것을 보여준다.</desc>
