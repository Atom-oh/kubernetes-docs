<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Spark 동적 Executor 할당과 Karpenter 자동 스케일링 루프</title>
<desc id="ddesc">대기 중인 Spark 태스크가 Executor 파드 요청을 유발하고, Karpenter가 새 노드를 프로비저닝해 파드를 스케줄한 뒤, 태스크가 끝나면 DRA가 유휴 Executor를 해제하고 Karpenter가 빈 노드를 회수하여 다시 대기 상태로 돌아오는 8단계 순환 과정을 보여준다.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
  <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#7D8998"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<!-- Header -->
<text x="68" y="32" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">AUTOSCALING LOOP</text>
<text x="68" y="58" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Spark DRA &amp; Karpenter 노드 자동 스케일링 루프</text>
<text x="68" y="78" fill="#545B64" font-size="12" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">태스크 대기부터 유휴 노드 회수까지, 8단계로 반복되는 스케일 아웃·인 순환</text>

