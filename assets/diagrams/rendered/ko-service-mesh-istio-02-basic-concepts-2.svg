<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">기존 프록시의 한계를 해결한 Envoy</title>
<desc id="ddesc">정적 설정, 제한적 메트릭 등 기존 프록시의 네 가지 문제를 Envoy가 각각 어떤 기능으로 해결했는지 대응시킨 다이어그램</desc>
