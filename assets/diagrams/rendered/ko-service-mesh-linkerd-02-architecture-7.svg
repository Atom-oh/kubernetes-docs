<title id="ko-service-mesh-linkerd-02-architecture-7-title">워크로드 인증서 발급과 자동 갱신</title>
<desc id="ko-service-mesh-linkerd-02-architecture-7-desc">linkerd-proxy가 ServiceAccount 토큰과 CSR을 Identity Controller에 보내 SPIFFE ID가 검증된 24시간짜리 인증서를 발급받고, 만료 2시간 전 자동으로 갱신하는 흐름을 보여준다.</desc>
