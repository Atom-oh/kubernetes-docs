<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-title d3-desc">
    <title id="d3-title">Calico vs Cilium 선택 가이드</title>
    <desc id="d3-desc">Windows 워크로드, L7 정책 필요 여부, BGP 필수 여부, 관측성 우선순위를 차례로 물어 CNI를 선택하는 트리로, 대부분의 경로가 Calico로 모이고 오픈소스 L7 정책이나 Hubble 관측성이 꼭 필요할 때만 Cilium으로 향한다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows (before nodes) -->
    <!-- START -> Q1 -->
    <line x1="380" y1="68" x2="380" y2="92" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Q1 No -> Q2 -->
    <line x1="380" y1="164" x2="380" y2="188" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Q2 No -> Q3 -->
    <line x1="380" y1="260" x2="380" y2="284" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Q3 기본BGP -> Q4 -->
    <line x1="380" y1="356" x2="380" y2="380" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Q1 Yes -> CALICO (accent, dominant outcome) -->
    <line x1="456" y1="128" x2="680" y2="128" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Q2 Enterprise OK -> CALICO -->
    <line x1="456" y1="224" x2="680" y2="224" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Q3 고급BGP -> CALICO -->
    <line x1="456" y1="320" x2="680" y2="320" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Q4 기본충분 -> CALICO -->
    <line x1="456" y1="416" x2="680" y2="416" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Q2 오픈소스 -> CILIUM (left, elbow around) -->
    <path d="M304,224 H260 Q252,224 252,232 V308 Q252,316 244,316 H200" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- Q4 Hubble 필수 -> CILIUM (left, elbow around) -->
    <path d="M304,416 H260 Q252,416 252,408 V356 Q252,348 244,348 H200" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="482" y="116" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="497" y="125" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">YES</text>

    <rect x="360" y="176" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="376" y="185" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NO</text>

    <rect x="192" y="212" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="230" y="221" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">OSS 필요</text>

    <rect x="482" y="212" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="517" y="221" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ENT OK</text>

    <rect x="360" y="272" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="376" y="281" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NO</text>

    <rect x="486" y="308" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="516" y="317" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">고급 BGP</text>

    <rect x="356" y="368" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="386" y="377" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">기본 BGP</text>

    <rect x="260" y="376" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="298" y="385" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">Hubble 필수</text>

    <rect x="486" y="404" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="524" y="413" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">기본 충분</text>

    <!-- START oval -->
    <rect x="300" y="28" width="160" height="40" rx="20" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="380" y="52" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CNI 선택</text>

    <!-- Q1 -->
    <polygon points="380,92 456,128 380,164 304,128" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="124" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Windows</text>
    <text x="380" y="137" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">워크로드?</text>

    <!-- Q2 -->
    <polygon points="380,188 456,224 380,260 304,224" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="220" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">L7 정책</text>
    <text x="380" y="233" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">필요?</text>

    <!-- Q3 -->
    <polygon points="380,284 456,320 380,356 304,320" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="316" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">BGP</text>
    <text x="380" y="329" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">필수?</text>

    <!-- Q4 -->
    <polygon points="380,380 456,416 380,452 304,416" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="380" y="412" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">관측성</text>
    <text x="380" y="425" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">우선?</text>

    <!-- CALICO pillar (focal, receives 4 inputs) -->
    <rect x="680" y="104" width="160" height="352" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="688" y="112" width="40" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="708" y="121" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CNI</text>
    <text x="760" y="272" fill="#232F3E" font-size="13" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Calico 선택</text>
    <text x="760" y="288" fill="#EC7211" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">검증된 성숙성 · BGP</text>

    <!-- CILIUM box -->
    <rect x="40" y="284" width="160" height="96" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="48" y="292" width="40" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="68" y="301" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CNI</text>
    <text x="120" y="328" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cilium 선택</text>
    <text x="120" y="344" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">오픈소스 L7 · Hubble</text>

    <!-- Legend -->
    <line x1="24" y1="480" x2="936" y2="480" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="496" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="24" y="512" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="56" y="522" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Calico (기본 권장)</text>

    <rect x="220" y="512" width="24" height="12" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="252" y="522" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Cilium (특수 요건)</text>

    <line x1="420" y1="518" x2="448" y2="518" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="456" y="522" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">권장 경로</text>

    <line x1="560" y1="518" x2="588" y2="518" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="596" y="522" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">분기</text>
  </svg>