    <rect x="588" y="320" width="128" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="652" y="346" fill="#232F3E" font-size="11" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Router / Gating</text>

