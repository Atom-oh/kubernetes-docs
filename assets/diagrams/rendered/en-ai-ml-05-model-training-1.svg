    <text x="548" y="430" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">GPU1</text>

    <rect x="600" y="400" width="72" height="40" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
    <text x="636" y="418" fill="#232F3E" font-size="9" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Expert 2</text>
    <text x="636" y="430" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">GPU2</text>

    <rect x="688" y="400" width="72" height="40" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
    <text x="724" y="418" fill="#232F3E" font-size="9" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Expert 3</text>
    <text x="724" y="430" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">GPU3</text>

    <rect x="776" y="400" width="72" height="40" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="0.8"/>
    <text x="812" y="418" fill="#232F3E" font-size="9" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Expert 4</text>
    <text x="812" y="430" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">GPU4</text>

    <path d="M 548,440 V 456 Q 548,464 556,464 H 604 Q 612,464 612,472 V 480" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 636,440 V 480" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 724,440 V 480" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 812,440 V 456 Q 812,464 804,464 H 668 Q 660,464 660,472 V 480" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="592" y="480" width="120" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="652" y="500" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Combined Output</text>

