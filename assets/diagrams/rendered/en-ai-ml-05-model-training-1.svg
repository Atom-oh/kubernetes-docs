    <rect x="620" y="220" width="72" height="24" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="656" y="235" fill="#232F3E" font-size="9" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Combine</text>

    <!-- ===== PIPELINE PARALLELISM (bottom-left) ===== -->
    <rect x="40" y="320" width="96" height="32" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="88" y="340" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Micro-batches</text>

    <line x1="88" y1="352" x2="88" y2="372" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="40" y="372" width="96" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="88" y="392" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Stage 1</text>
    <text x="88" y="408" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">layers 1-4 · GPU1</text>

    <line x1="136" y1="396" x2="184" y2="396" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="184" y="372" width="96" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="232" y="392" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Stage 2</text>
    <text x="232" y="408" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">layers 5-8 · GPU2</text>

    <line x1="280" y1="396" x2="328" y2="396" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="328" y="372" width="96" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="376" y="392" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Stage 3</text>
    <text x="376" y="408" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">layers 9-12 · GPU3</text>

