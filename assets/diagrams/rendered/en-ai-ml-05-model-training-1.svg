<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="parallelism-strategies-title parallelism-strategies-desc">
    <title id="parallelism-strategies-title">Model parallelism strategies</title>
    <desc id="parallelism-strategies-desc">Four quadrants compare data, tensor, pipeline, and expert parallelism: splitting data across model replicas, splitting a layer's weights across GPUs, splitting layers into pipeline stages, and routing tokens to a subset of experts, each converging on a combine or sync step.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- quadrant zones -->
    <rect x="20" y="60" width="452" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="36" y="64" width="164" height="12" rx="2" fill="#ffffff"/>
    <text x="118" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA PARALLELISM</text>

    <rect x="488" y="60" width="452" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="504" y="64" width="176" height="12" rx="2" fill="#ffffff"/>
    <text x="592" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TENSOR PARALLELISM</text>

    <rect x="20" y="280" width="452" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="36" y="284" width="180" height="12" rx="2" fill="#ffffff"/>
    <text x="126" y="293" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PIPELINE PARALLELISM</text>

    <rect x="488" y="280" width="452" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="504" y="284" width="220" height="12" rx="2" fill="#ffffff"/>
    <text x="614" y="293" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXPERT PARALLELISM (MOE)</text>

    <!-- ===== DATA PARALLELISM (top-left) ===== -->
    <!-- each shard feeds the (collapsed) model-replica pool in parallel, then syncs -->
    <path d="M 112,116 H 128 Q 136,116 136,124 V 168 Q 136,176 144,176 H 160" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 112,168 H 144 Q 152,168 152,176 V 196 Q 152,204 144,204 H 160" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 112,220 H 152 Q 160,220 160,228 V 232" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="40" y="100" width="72" height="32" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="76" y="120" fill="#232F3E" font-size="9" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Shard 1</text>
    <rect x="40" y="152" width="72" height="32" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="76" y="172" fill="#232F3E" font-size="9" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Shard 2</text>
    <rect x="40" y="204" width="72" height="32" rx="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="0.8"/>
    <text x="76" y="224" fill="#232F3E" font-size="9" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Shard 3</text>

    <rect x="160" y="148" width="40" height="112" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="188" fill="#232F3E" font-size="9" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Model</text>
    <text x="180" y="200" fill="#232F3E" font-size="9" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Rep. 1-3</text>
    <text x="180" y="214" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">x3</text>

    <line x1="200" y1="204" x2="300" y2="204" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="308" y="176" width="128" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="372" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Gradient Sync</text>
    <text x="372" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AllReduce</text>

    <!-- ===== TENSOR PARALLELISM (top-right) ===== -->
    <rect x="592" y="92" width="112" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="648" y="116" fill="#232F3E" font-size="11" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">Single Layer</text>

    <path d="M 620,132 V 148 Q 620,156 612,156 H 592 V 160" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 676,132 V 148 Q 676,156 684,156 H 704 V 160" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="524" y="160" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="580" y="180" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">GPU 1</text>
    <text x="580" y="196" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cols 0-N/2</text>

    <rect x="660" y="160" width="112" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="716" y="180" fill="#232F3E" font-size="10" font-weight="600" font-family="Amazon Ember, sans-serif" text-anchor="middle">GPU 2</text>
    <text x="716" y="196" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cols N/2-N</text>

    <path d="M 580,208 V 224 Q 580,232 588,232 H 620" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
