<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ciarch-title ciarch-desc">
    <title id="ciarch-title">Container Insights data path</title>
    <desc id="ciarch-desc">Architecture diagram showing applications on EKS worker nodes exposing metrics and stdout to a CloudWatch Agent and Fluent Bit DaemonSet, which feed Container Insights metrics and CloudWatch Logs, both converging on performance monitoring.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones (drawn before arrows and nodes) -->
    <rect x="40" y="140" width="380" height="340" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="164" y="144" width="132" height="12" rx="2" fill="#ffffff"/>
    <text x="230" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EKS CLUSTER</text>

    <rect x="64" y="180" width="332" height="260" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <rect x="160" y="184" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="230" y="193" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WORKER NODES</text>

    <rect x="480" y="140" width="360" height="300" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="600" y="144" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="660" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLOUDWATCH</text>

    <!-- Arrows (behind boxes) -->
    <!-- Applications -> CloudWatch Agent (dashed, expose) -->
    <path d="M 204,268 V 286 Q 204,294 196,294 H 156 Q 148,294 148,302 V 320"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- Applications -> Fluent Bit (dashed, stdout/stderr) -->
    <path d="M 260,268 V 286 Q 260,294 268,294 H 320 Q 328,294 328,302 V 320"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- CloudWatch Agent -> Container Insights (metrics) -->
    <path d="M 220,352 H 362 Q 370,352 370,344 V 220 Q 370,212 378,212 H 520"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Fluent Bit -> CloudWatch Logs (logs) -->
    <path d="M 400,352 H 532 Q 540,352 540,344 V 220 Q 540,212 548,212 H 680"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Container Insights -> Performance Monitoring -->
    <path d="M 590,244 V 284 Q 590,292 598,292 H 644 Q 652,292 652,300 V 340"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- CloudWatch Logs -> Performance Monitoring -->
    <path d="M 750,244 V 284 Q 750,292 742,292 H 716 Q 708,292 708,300 V 340"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- Arrow labels -->
    <rect x="380" y="276" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="410" y="285" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">METRICS</text>

    <rect x="550" y="276" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="570" y="285" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOGS</text>

    <rect x="176" y="288" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="198" y="297" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXPOSE</text>

    <rect x="256" y="288" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="286" y="297" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STDOUT</text>

    <!-- Node: Applications (input) -->
    <rect x="152" y="212" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="152" y="212" width="160" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="232" y="238" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Applications</text>
    <text x="232" y="254" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pods on worker nodes</text>

    <!-- Node: CloudWatch Agent -->
    <rect x="76" y="320" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="148" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch Agent</text>
    <text x="148" y="364" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DaemonSet</text>

    <!-- Node: Fluent Bit -->
    <rect x="256" y="320" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="328" y="348" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Fluent Bit</text>
    <text x="328" y="364" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DaemonSet</text>

    <!-- Node: Container Insights -->
    <rect x="520" y="180" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="590" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Container Insights</text>
    <text x="590" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">metrics</text>

    <!-- Node: CloudWatch Logs -->
    <rect x="680" y="180" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="750" y="208" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CloudWatch Logs</text>
    <text x="750" y="224" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">log groups</text>

    <!-- Node: Performance Monitoring (focal) -->
    <rect x="600" y="340" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="680" y="368" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Performance Monitoring</text>
    <text x="680" y="384" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dashboards &amp; alarms</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="532" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Aggregation point</text>

    <line x1="260" y1="537" x2="288" y2="537" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="296" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Collection pipeline</text>

    <line x1="480" y1="537" x2="508" y2="537" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="516" y="540" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Instrumentation source</text>
  </svg>