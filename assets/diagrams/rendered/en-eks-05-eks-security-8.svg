    <title id="en-eks-05-eks-security-8-title">EKS VPC network security architecture</title>
    <desc id="en-eks-05-eks-security-8-desc">Architecture diagram showing internet traffic reaching worker nodes through a public-subnet load balancer and bastion host, while the private-subnet EKS control plane manages worker nodes governed by network policies, and security groups plus VPC endpoints restrict and privatize traffic at the network layer.</desc>
