<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="amb06-title amb06-desc">
<title id="amb06-title">Ambient Mode의 전체 트래픽 흐름: L4 전용 경로와 L7 경로</title>
<desc id="amb06-desc">Sidecar 없이 동작하는 클라이언트와 서버 애플리케이션 사이에서, ztunnel만 거치는 L4 전용 경로와 Waypoint 프록시를 추가로 거치는 L7 경로 두 시나리오의 요청·응답 흐름을 비교하는 시퀀스 다이어그램.</desc>
