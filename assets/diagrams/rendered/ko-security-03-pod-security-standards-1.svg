<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="psaseq-title psaseq-desc">
  <title id="psaseq-title">Pod Security Admission 검증 흐름</title>
  <desc id="psaseq-desc">Pod 생성 요청이 API Server를 거쳐 PSA Controller의 네임스페이스 레이블 검증을 통과하면 etcd에 저장되어 201로 응답하고, 정책을 위반하면 403으로 거부되는 두 갈래의 처리 과정을 보여준다.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .mono{ font-family:'Geist Mono','Amazon Ember Mono',ui-monospace,monospace; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- alt fragment frame (drawn early so lines/labels sit above the wash) -->
  <rect x="68" y="280" width="824" height="236" rx="4"
        fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
  <rect x="68" y="280" width="40" height="16" rx="2" fill="#ffffff" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
  <text x="88" y="292" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.12em">ALT</text>

  <!-- lifelines -->
  <line x1="80"  y1="80" x2="80"  y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="280" y1="80" x2="280" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="80" x2="480" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="680" y1="80" x2="680" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="880" y1="80" x2="880" y2="540" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ===== pre-fragment messages ===== -->
  <!-- m1 User -> API -->
  <line x1="80" y1="132" x2="280" y2="132" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="126" y="112" width="108" height="14" fill="#ffffff"/>
  <text x="180" y="123" class="mono" font-size="8" letter-spacing="0.04em" fill="#7D8998" text-anchor="middle">POD 생성 요청</text>

  <!-- m2 API -> PSA -->
  <line x1="280" y1="172" x2="480" y2="172" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="322" y="152" width="116" height="14" fill="#ffffff"/>
  <text x="380" y="163" class="mono" font-size="8" letter-spacing="0.04em" fill="#7D8998" text-anchor="middle">ADMISSION 요청</text>

  <!-- m3 PSA -> NS -->
  <line x1="480" y1="212" x2="680" y2="212" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="530" y="192" width="100" height="14" fill="#ffffff"/>
  <text x="580" y="203" class="mono" font-size="8" letter-spacing="0.04em" fill="#7D8998" text-anchor="middle">레이블 확인</text>

  <!-- m4 NS --> PSA (return) -->
  <line x1="680" y1="252" x2="480" y2="252" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="502" y="232" width="156" height="14" fill="#ffffff"/>
  <text x="580" y="243" class="mono" font-size="8" letter-spacing="0.02em" fill="#7D8998" text-anchor="middle">ENFORCE=RESTRICTED</text>

  <!-- ===== fragment guard 1 ===== -->
  <text x="80" y="308" class="mono" font-size="8" fill="#545B64" letter-spacing="0.02em">[Pod가 정책 준수]</text>

  <!-- m5 PSA --> API (return, 승인) -->
  <line x1="480" y1="332" x2="280" y2="332" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="352" y="312" width="56" height="14" fill="#ffffff"/>
  <text x="380" y="323" class="mono" font-size="8" letter-spacing="0.04em" fill="#7D8998" text-anchor="middle">승인</text>

  <!-- m6 API -> etcd -->
  <line x1="280" y1="364" x2="880" y2="364" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="552" y="344" width="76" height="14" fill="#ffffff"/>
  <text x="590" y="355" class="mono" font-size="8" letter-spacing="0.04em" fill="#7D8998" text-anchor="middle">POD 저장</text>

  <!-- m7 API --> User (return, headline success, accent) -->
  <line x1="280" y1="396" x2="80" y2="396" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="130" y="376" width="100" height="14" fill="#ffffff"/>
  <text x="180" y="387" class="mono" font-size="8" letter-spacing="0.04em" fill="#EC7211" text-anchor="middle">201 CREATED</text>

  <!-- divider -->
  <line x1="76" y1="420" x2="884" y2="420" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== fragment guard 2 ===== -->
  <text x="80" y="440" class="mono" font-size="8" fill="#545B64" letter-spacing="0.02em">[Pod가 정책 위반]</text>

  <!-- m8 PSA --> API (return, 거부) -->
  <line x1="480" y1="464" x2="280" y2="464" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="322" y="444" width="116" height="14" fill="#ffffff"/>
  <text x="380" y="455" class="mono" font-size="8" letter-spacing="0.02em" fill="#7D8998" text-anchor="middle">거부(ENFORCE)</text>

  <!-- m9 API --> User (return, 403) -->
  <line x1="280" y1="496" x2="80" y2="496" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="122" y="476" width="116" height="14" fill="#ffffff"/>
  <text x="180" y="487" class="mono" font-size="8" letter-spacing="0.02em" fill="#7D8998" text-anchor="middle">403 FORBIDDEN</text>

  <!-- ===== actor boxes (drawn last, on top of lifelines) ===== -->
  <!-- User -->
  <rect x="20" y="40" width="120" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="80" y="64" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">사용자/컨트롤러</text>

  <!-- API Server -->
  <rect x="220" y="40" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="280" y="64" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">API Server</text>

  <!-- PSA Controller -->
  <rect x="420" y="40" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="64" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">PSA Controller</text>

  <!-- Namespace Labels -->
  <rect x="620" y="40" width="120" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="680" y="64" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Namespace</text>

  <!-- etcd -->
  <rect x="820" y="40" width="120" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="880" y="64" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">etcd</text>

  <!-- legend -->
  <line x1="30" y1="556" x2="930" y2="556" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="30" y="576" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">범례</text>
  <line x1="140" y1="573" x2="176" y2="573" stroke="#545B64" stroke-width="1"/>
  <text x="184" y="576" class="mono" font-size="9" fill="#545B64">요청 / 조회</text>
  <line x1="300" y1="573" x2="336" y2="573" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="344" y="576" class="mono" font-size="9" fill="#545B64">응답 (return)</text>
  <line x1="460" y1="573" x2="496" y2="573" stroke="#EC7211" stroke-width="1.2"/>
  <text x="504" y="576" class="mono" font-size="9" fill="#EC7211">승인 성공 응답</text>
</svg>
