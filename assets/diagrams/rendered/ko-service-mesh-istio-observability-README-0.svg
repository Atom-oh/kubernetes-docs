<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="pillars-title pillars-desc">
    <title id="pillars-title">관찰성의 3요소</title>
    <desc id="pillars-desc">메트릭, 분산 추적, 로깅이라는 세 가지 관찰성 축이 각자의 도구로 데이터를 수집한 뒤 통합 관찰성 계층(Grafana, Kiali, Alertmanager)으로 모이는 구조를 보여준다.</desc>

    <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <style>
        text{ font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
      </style>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows first, behind boxes -->
    <path d="M176,236 V308 Q176,316 184,316 H392 Q400,316 400,324 V400"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M480,236 V400" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M784,236 V308 Q784,316 776,316 H568 Q560,316 560,324 V400"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Box: Metrics (40,96,272,140) -->
    <rect x="40" y="96" width="272" height="140" rx="8" fill="#ffffff"/>
    <rect x="40" y="96" width="272" height="140" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="52" y="108" width="32" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="68" y="118" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">MET</text>
    <text x="176" y="150" fill="#232F3E" font-size="16" font-weight="600" text-anchor="middle">메트릭 (Metrics)</text>
    <text x="64" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Golden Signals · Latency/Traffic</text>
    <text x="64" y="194" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Prometheus · OpenTelemetry</text>
    <text x="64" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Grafana · Kiali 시각화</text>

    <!-- Box: Tracing (344,96,272,140) -->
    <rect x="344" y="96" width="272" height="140" rx="8" fill="#ffffff"/>
    <rect x="344" y="96" width="272" height="140" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="356" y="108" width="32" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="372" y="118" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TRC</text>
    <text x="480" y="150" fill="#232F3E" font-size="16" font-weight="600" text-anchor="middle">분산 추적 (Tracing)</text>
    <text x="368" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">요청 흐름 · 호출 경로 추적</text>
    <text x="368" y="194" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Jaeger · Zipkin · Tempo</text>
    <text x="368" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">레이턴시 병목 식별</text>

    <!-- Box: Logging (648,96,272,140) -->
    <rect x="648" y="96" width="272" height="140" rx="8" fill="#ffffff"/>
    <rect x="648" y="96" width="272" height="140" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="660" y="108" width="32" height="14" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="676" y="118" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">LOG</text>
    <text x="784" y="150" fill="#232F3E" font-size="16" font-weight="600" text-anchor="middle">로깅 (Logging)</text>
    <text x="672" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Access Log 전체 기록</text>
    <text x="672" y="194" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">JSON 구조화 로그</text>
    <text x="672" y="212" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace">Loki · Elasticsearch</text>

    <!-- Hub: Integration (320,400,320,112) — focal -->
    <rect x="320" y="400" width="320" height="112" rx="8" fill="#ffffff"/>
    <rect x="320" y="400" width="320" height="112" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="332" y="412" width="32" height="14" rx="2" fill="transparent" stroke="rgba(236,114,17,0.60)" stroke-width="0.8"/>
    <text x="348" y="422" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">INT</text>
    <text x="480" y="450" fill="#232F3E" font-size="16" font-weight="600" text-anchor="middle">통합 관찰성 (Integration)</text>
    <text x="480" y="472" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Grafana 대시보드 · Kiali 토폴로지</text>
    <text x="480" y="490" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Prometheus Alertmanager</text>

    <!-- Legend -->
    <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="40" y="566" width="10" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="58" y="575" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">관찰성 축 (수집 계층)</text>
    <rect x="280" y="566" width="10" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="298" y="575" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">통합 지점 (Focal)</text>
  </svg>