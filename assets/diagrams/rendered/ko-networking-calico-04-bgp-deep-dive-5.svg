<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t5 d5">
<title id="t5">Spine-Leaf 아키텍처와 Kubernetes 클러스터 eBGP 통합</title>
<desc id="d5">2대의 Spine 스위치가 3개 랙의 Leaf 스위치 각각과 eBGP로 연결되고, 각 Leaf는 자기 랙에 속한 Kubernetes 노드들과 다시 eBGP로 연결되어 물리 네트워크와 클러스터가 계층적으로 통합되는 구조를 보여준다.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
</defs>

<rect width="960" height="600" fill="#ffffff"/>

<text x="32" y="36" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PHYSICAL INTEGRATION</text>
<text x="32" y="60" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Spine-Leaf 아키텍처 통합</text>

<!-- Zone: Spine layer -->
<rect x="336" y="88" width="288" height="100" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
<rect x="380" y="98" width="200" height="16" rx="2" fill="#ffffff"/>
<text x="480" y="110" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SPINE LAYER (AS 64510)</text>

<!-- Zone: Leaf layer -->
<rect x="80" y="240" width="800" height="100" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
<rect x="104" y="250" width="128" height="16" rx="2" fill="#ffffff"/>
<text x="168" y="262" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">LEAF LAYER</text>

<!-- Zone: k8s cluster -->
<rect x="80" y="392" width="800" height="96" rx="8" fill="rgba(255,153,0,0.06)" stroke="rgba(236,114,17,0.45)" stroke-width="0.8"/>
<rect x="104" y="402" width="240" height="16" rx="2" fill="#ffffff"/>
<text x="224" y="414" fill="#EC7211" font-size="8" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="0.04em">KUBERNETES 클러스터 (AS 64512)</text>

<!-- Spine <-> Leaf: 6 eBGP sessions -->
<!-- S1 -> L1,L2,L3 (fan from S1 bottom) -->
<path d="M416,168 V196 Q416,204 408,204 H180 Q172,204 172,212 V240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<path d="M436,168 V196 Q436,204 428,204 H420 Q412,204 412,212 V240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<path d="M456,168 V196 Q456,204 464,204 H772 Q780,204 780,212 V240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<!-- S2 -> L1,L2,L3 -->
<path d="M504,168 V184 Q504,192 496,192 H196 Q188,192 188,200 V240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<path d="M524,168 V184 Q524,192 516,192 H452 Q444,192 444,200 V240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<path d="M544,168 V184 Q544,192 552,192 H756 Q764,192 764,200 V240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<rect x="474" y="176" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="500" y="185" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">eBGP</text>

<!-- Leaf <-> k8s nodes -->
<line x1="168" y1="340" x2="168" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<line x1="464" y1="340" x2="464" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<line x1="768" y1="340" x2="768" y2="392" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
<rect x="676" y="358" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="702" y="367" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">eBGP</text>

<!-- Spine nodes -->
<rect x="396" y="120" width="80" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="436" y="142" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Spine 1</text>
<text x="436" y="158" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.0.1</text>

<rect x="484" y="120" width="80" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="524" y="142" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Spine 2</text>
<text x="524" y="158" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.0.2</text>

<!-- Leaf nodes -->
<rect x="98" y="272" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="168" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Leaf 1</text>
<text x="168" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rack 1 · AS 64520</text>

<rect x="394" y="272" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="464" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Leaf 2</text>
<text x="464" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rack 2 · AS 64521</text>

<rect x="698" y="272" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="768" y="294" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Leaf 3</text>
<text x="768" y="310" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rack 3 · AS 64522</text>

<!-- k8s node groups (2 nodes merged per rack) -->
<rect x="112" y="416" width="112" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="168" y="437" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 1, 2</text>
<text x="168" y="453" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.10.10-11</text>

<rect x="408" y="416" width="112" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="464" y="437" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 3, 4</text>
<text x="464" y="453" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.20.10-11</text>

<rect x="712" y="416" width="112" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="768" y="437" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Node 5, 6</text>
<text x="768" y="453" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.0.30.10-11</text>

<!-- Legend -->
<line x1="32" y1="522" x2="928" y2="522" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="32" y="540" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<text x="140" y="540" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">모든 계층 간 연결은 eBGP · Spine↔Leaf 6세션, Leaf↔Node 각 랙별 세션</text>
</svg>