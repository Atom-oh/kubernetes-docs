<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obs-arch-title obs-arch-desc">
<title id="obs-arch-title">관찰 가능성 파이프라인 아키텍처</title>
<desc id="obs-arch-desc">애플리케이션에서 발생한 트레이스·로그·메트릭이 OpenTelemetry Collector를 거쳐 Prometheus/AMP, Loki, Tempo에 저장되고, Grafana가 세 저장소를 조회하며 Tempo가 exemplar와 trace_id로 메트릭·로그를 연결하는 상관관계 허브 역할을 하는 구조를 보여준다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0972D3"/></marker>
</defs>

<rect width="960" height="600" fill="#FFFFFF"/>

<!-- eyebrow -->
<text x="40" y="28" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">ARCHITECTURE</text>

<!-- Zone: OpenTelemetry Collector -->
<rect x="40" y="168" width="880" height="148" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="404" y="172" width="152" height="12" rx="2" fill="#FFFFFF"/>
<text x="480" y="181" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">OPENTELEMETRY COLLECTOR</text>

<!-- ===== Arrows (drawn before nodes) ===== -->

<!-- App -> Receivers -->
<path d="M480,132 V152 Q480,160 472,160 H176 Q168,160 168,168 V208" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Receivers -> Processors -->
<line x1="248" y1="240" x2="400" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Processors -> Exporters -->
<line x1="560" y1="240" x2="712" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Exporters -> Prometheus/AMP (fan, band y=300) -->
<path d="M732,272 V292 Q732,300 724,300 H176 Q168,300 168,308 V356" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Exporters -> Loki (fan, band y=316) -->
<path d="M792,272 V308 Q792,316 784,316 H488 Q480,316 480,324 V356" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Exporters -> Tempo (fan, band y=332) -->
<path d="M852,272 V324 Q852,332 844,332 H800 Q792,332 792,340 V356" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<!-- Correlation: Prometheus -.-> Tempo (exemplars), detour above storage row, hop over Loki's fan vertical at x=480 -->
<path d="M232,356 V348 Q232,340 240,340 H472 a8,8 0 0 1 16,0 H716 Q724,340 724,348 V356"
      fill="none" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Correlation: Loki -.-> Tempo (trace_id), clean open lane -->
<line x1="560" y1="388" x2="712" y2="388" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Query: Grafana -> Prometheus (elbow, band y=448) -->
<path d="M440,464 V456 Q440,448 432,448 H176 Q168,448 168,440 V420" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<!-- Query: Grafana -> Loki (straight) -->
<line x1="480" y1="464" x2="480" y2="420" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<!-- Query: Grafana -> Tempo (elbow, band y=432) -->
<path d="M520,464 V440 Q520,432 528,432 H784 Q792,432 792,424 V420" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>

