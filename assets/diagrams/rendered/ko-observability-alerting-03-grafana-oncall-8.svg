<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oncall-migrate-title oncall-migrate-desc">
    <title id="oncall-migrate-title">OnCall 마이그레이션 판단</title>
    <desc id="oncall-migrate-desc">PagerDuty나 OpsGenie 사용자가 비용 절감, Grafana 스택 사용, 자체 호스팅 선호, 기본 기능 충분성을 차례로 검토해 Grafana OnCall로 마이그레이션할지 현재 도구를 유지할지 결정하는 흐름을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows -->
    <line x1="200" y1="68" x2="200" y2="88" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="200" y1="152" x2="200" y2="188" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M255,120 H459 Q467,120 467,128 V202 Q467,210 475,210 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="200" y1="252" x2="200" y2="288" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M255,220 H459 Q467,220 467,228 V272 Q467,280 475,280 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M200,352 H180 Q172,352 172,360 V412 Q172,420 164,420 H145" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M255,320 H235 Q227,320 227,328 V380 Q227,388 219,388 H200" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="200" y1="452" x2="200" y2="500" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M255,420 H459 Q467,420 467,412 V358 Q467,350 475,350 H680" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Labels -->
    <rect x="184" y="158" width="26" height="12" rx="2" fill="#ffffff"/>
    <text x="197" y="168" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
    <rect x="320" y="106" width="24" height="12" rx="2" fill="#ffffff"/>
    <text x="332" y="116" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <rect x="184" y="258" width="26" height="12" rx="2" fill="#ffffff"/>
    <text x="197" y="268" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
    <rect x="320" y="206" width="24" height="12" rx="2" fill="#ffffff"/>
    <text x="332" y="216" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <rect x="140" y="366" width="26" height="12" rx="2" fill="#ffffff"/>
    <text x="153" y="376" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
    <rect x="196" y="334" width="24" height="12" rx="2" fill="#ffffff"/>
    <text x="208" y="344" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <rect x="184" y="458" width="26" height="12" rx="2" fill="#ffffff"/>
    <text x="197" y="468" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
    <rect x="320" y="406" width="24" height="12" rx="2" fill="#ffffff"/>
    <text x="332" y="416" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <!-- Node P: PagerDuty/OpsGenie -->
    <rect x="130" y="20" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="44" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">PagerDuty /</text>
    <text x="200" y="58" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">OpsGenie</text>

    <!-- Node A: 비용 절감 필요? -->
    <polygon points="200,88 255,120 200,152 145,120" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="117" fill="#232F3E" font-size="8.5" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">비용 절감</text>
    <text x="200" y="128" fill="#232F3E" font-size="8.5" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">필요?</text>

    <!-- Node B: Grafana 스택 사용? -->
    <polygon points="200,188 255,220 200,252 145,220" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="217" fill="#232F3E" font-size="8.5" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Grafana 스택</text>
    <text x="200" y="228" fill="#232F3E" font-size="8.5" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">사용?</text>

    <!-- Node C: 자체 호스팅 선호? -->
    <polygon points="200,288 255,320 200,352 145,320" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="317" fill="#232F3E" font-size="8.5" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">자체 호스팅</text>
    <text x="200" y="328" fill="#232F3E" font-size="8.5" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">선호?</text>

    <!-- Node D: 기본 기능으로 충분? -->
    <polygon points="200,388 255,420 200,452 145,420" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="414" fill="#232F3E" font-size="8" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">기본 기능</text>
    <text x="200" y="425" fill="#232F3E" font-size="8" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">충분?</text>

    <!-- Node Y: OnCall로 마이그레이션 (focal) -->
    <rect x="130" y="500" width="140" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="200" y="521" fill="#232F3E" font-size="10.5" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">OnCall로</text>
    <text x="200" y="534" fill="#232F3E" font-size="10.5" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">마이그레이션</text>

    <!-- Node N: 현재 유지 (merge) -->
    <rect x="680" y="140" width="160" height="280" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="760" y="284" fill="#232F3E" font-size="13" font-weight="600" text-anchor="middle" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">현재 유지</text>

  </svg>