<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="mem-compare-title mem-compare-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="mem-compare-title">서비스 메시별 100 Pod 클러스터 메모리 사용량 비교</title>
    <desc id="mem-compare-desc">노드당 공유 Envoy를 쓰는 Cilium Service Mesh는 총 약 500MB만 사용하는 반면, Pod마다 사이드카를 두는 Istio는 약 5GB, Linkerd는 약 2GB를 사용해 사이드카리스 구조의 메모리 효율성을 보여주는 막대 그래프입니다.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      </style>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Plot area: viewBox-local, y-axis at x=100, baseline y=420, top y=60 -->
    <!-- gridlines -->
    <line x1="100" y1="420" x2="900" y2="420" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>
    <line x1="100" y1="330" x2="900" y2="330" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="100" y1="240" x2="900" y2="240" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="100" y1="150" x2="900" y2="150" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="100" y1="60"  x2="900" y2="60"  stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
    <line x1="100" y1="60" x2="100" y2="420" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>

    <text x="92" y="423" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0GB</text>
    <text x="92" y="333" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">1.25GB</text>
    <text x="92" y="243" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">2.5GB</text>
    <text x="92" y="153" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">3.75GB</text>
    <text x="92" y="63"  fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">5GB</text>

    <!-- Bars: pitch 240, width 140, scale: 5GB = 360px -> 72px/GB -->
    <!-- Cilium: 0.5GB -> 36px, focal -->
    <rect x="140" y="384" width="140" height="36" fill="#ffffff"/>
    <rect x="140" y="384" width="140" height="36" fill="rgba(255,153,0,0.12)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="210" y="374" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">~500MB</text>
    <text x="210" y="440" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cilium SM</text>
    <text x="210" y="456" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">노드당 ~100MB</text>

    <!-- Istio: 5GB -> 360px -->
    <rect x="420" y="60" width="140" height="360" fill="#ffffff"/>
    <rect x="420" y="60" width="140" height="360" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
    <text x="490" y="50" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">~5GB</text>
    <text x="490" y="440" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istio</text>
    <text x="490" y="456" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Pod당 ~50MB</text>

    <!-- Linkerd: 2GB -> 144px -->
    <rect x="700" y="276" width="140" height="144" fill="#ffffff"/>
    <rect x="700" y="276" width="140" height="144" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1"/>
    <text x="770" y="266" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">~2GB</text>
    <text x="770" y="440" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Linkerd</text>
    <text x="770" y="456" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Pod당 ~20MB</text>

    <!-- Legend -->
    <line x1="100" y1="500" x2="900" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="100" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="280" cy="513" r="4" fill="rgba(255,153,0,0.12)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="292" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">사이드카리스 (노드당 공유 Envoy)</text>
    <circle cx="600" cy="513" r="4" fill="rgba(84,91,100,0.15)" stroke="#545B64" stroke-width="1.2"/>
    <text x="612" y="516" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">사이드카 방식 (Pod당 프록시)</text>
  </svg>