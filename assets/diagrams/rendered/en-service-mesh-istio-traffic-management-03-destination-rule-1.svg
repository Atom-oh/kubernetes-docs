<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dr1-title dr1-desc">
<title id="dr1-title">Request routing through VirtualService and DestinationRule to pods</title>
<desc id="dr1-desc">An HTTP request to the reviews host is condition-matched and routed by VirtualService to a named subset, then DestinationRule selects that subset and load-balances across its matching pods.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
  <marker id="dr1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="dr1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ===== Zones ===== -->
<rect x="132" y="140" width="280" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="204" y="144" width="136" height="12" rx="2" fill="#ffffff"/>
<text x="272" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VIRTUALSERVICE ROLE</text>

<rect x="452" y="140" width="320" height="200" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="544" y="144" width="136" height="12" rx="2" fill="#ffffff"/>
<text x="612" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DESTINATIONRULE ROLE</text>

<rect x="792" y="60" width="160" height="484" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="824" y="64" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="872" y="73" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PODS</text>

<!-- ===== Arrows ===== -->
<!-- Request -> Match -->
<path d="M120,300 H152" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#dr1-arrow)"/>
<!-- Match -> Route -->
<path d="M272,300 H312" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#dr1-arrow)"/>
<rect x="252" y="266" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="280" y="275" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HEADERS</text>

<!-- Route -> Subset, two fanned lines (v1 90% / v2 10%) -->
<path d="M392,288 H472" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#dr1-arrow)"/>
<path d="M392,312 H472" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#dr1-arrow)"/>
<rect x="404" y="266" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="432" y="275" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">V1 · 90%</text>
<rect x="404" y="322" width="56" height="12" rx="2" fill="#ffffff"/>
<text x="432" y="331" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">V2 · 10%</text>

<!-- Subset -> Policy -->
<path d="M592,300 H632" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#dr1-arrow)"/>

<!-- Policy -> 3 pods, fanned elbows (up / straight / down) -->
<path d="M752,280 H794 Q802,280 802,272 V132 Q802,124 810,124 H852" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#dr1-arrow-accent)"/>
<path d="M752,300 H852" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#dr1-arrow-accent)"/>
<path d="M752,320 H794 Q802,320 802,328 V468 Q802,476 810,476 H852" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#dr1-arrow-accent)"/>

<!-- ===== Nodes ===== -->
<!-- Request (input) -->
<rect x="20" y="268" width="100" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="70" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">HTTP</text>
<text x="70" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Request</text>

<!-- Match (rhombus, backend) -->
<polygon points="212,268 272,300 212,332 152,300" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="212" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Condition</text>
<text x="212" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Matching</text>

<!-- Route (backend) -->
<rect x="312" y="268" width="80" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="352" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Routing</text>
<text x="352" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Decision</text>

<!-- Subset (backend) -->
<rect x="472" y="268" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="532" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Subset</text>
<text x="532" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Selection</text>

<!-- Policy (focal) -->
<rect x="632" y="268" width="120" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="692" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Policy</text>
<text x="692" y="312" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>

<!-- Pod 1 -->
<rect x="852" y="92" width="80" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="892" y="120" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">v1-pod1</text>
<text x="892" y="136" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reviews</text>

<!-- Pod 2 -->
<rect x="852" y="268" width="80" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="892" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">v1-pod2</text>
<text x="892" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reviews</text>

<!-- Pod 3 -->
<rect x="852" y="444" width="80" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="892" y="472" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">v2-pod1</text>
<text x="892" y="488" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reviews</text>

</svg>
