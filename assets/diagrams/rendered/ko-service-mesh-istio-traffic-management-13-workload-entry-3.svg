<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">ServiceEntry와 WorkloadEntry 연동 시퀀스</title>
  <desc id="d3-desc">Kubernetes 파드가 DNS로 가상 IP를 조회한 뒤 Envoy가 ServiceEntry의 workloadSelector로 WorkloadEntry를 찾아 VM으로 mTLS 연결을 맺고 응답을 돌려주는 순서를 보여준다.</desc>
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="40" class="mono" font-size="8" letter-spacing="0.18em" fill="#7D8998">SEQUENCE · SERVICEENTRY INTEGRATION</text>
  <text x="36" y="72" font-size="24" font-weight="700" fill="#232F3E">ServiceEntry 통합 동작 흐름</text>

  <!-- Lifelines -->
  <line x1="110" y1="120" x2="110" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="352" y1="120" x2="352" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="594" y1="120" x2="594" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="836" y1="120" x2="836" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Activation bars -->
  <rect x="106" y="150" width="8" height="300" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>
  <rect x="590" y="212" width="8" height="228" fill="rgba(35,47,62,0.06)" stroke="#545B64" stroke-width="0.8"/>

  <!-- Actor boxes -->
  <g>
    <rect x="46" y="84" width="128" height="36" rx="6" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="110" y="107" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Kubernetes 파드</text>
  </g>
  <g>
    <rect x="288" y="84" width="128" height="36" rx="6" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="352" y="107" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">Istio DNS</text>
  </g>
  <g>
    <rect x="530" y="80" width="128" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="594" y="104" font-size="12" font-weight="700" text-anchor="middle" fill="#232F3E">Envoy Proxy</text>
  </g>
  <g>
    <rect x="772" y="84" width="128" height="36" rx="6" fill="rgba(149,165,166,0.15)" stroke="#7D8998" stroke-width="1"/>
    <text x="836" y="107" font-size="12" font-weight="600" text-anchor="middle" fill="#232F3E">VM (WorkloadEntry)</text>
  </g>

  <!-- 1. Client -> DNS: lookup -->
  <path d="M114,150 H348" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="150" y="132" width="180" height="12" rx="2" fill="#ffffff"/>
  <text x="240" y="141" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#7D8998">1. api.legacy.internal 조회</text>

  <!-- 2. DNS -> Client: return VIP (dashed return) -->
  <path d="M348,176 H114" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="150" y="182" width="164" height="12" rx="2" fill="#ffffff"/>
  <text x="232" y="191" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#7D8998">2. 240.240.1.1 (가상 IP)</text>

  <!-- 3. Client -> Envoy: HTTP request -->
  <path d="M114,224 H590" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="322" y="206" width="180" height="12" rx="2" fill="#ffffff"/>
  <text x="412" y="215" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#7D8998">3. HTTP 요청 :8080</text>

  <!-- 4. Envoy self: ServiceEntry lookup -->
  <path d="M598,254 H654 Q662,254 662,262 V262 Q662,270 654,270 H598" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="668" y="256" width="156" height="12" rx="2" fill="#ffffff"/>
  <text x="746" y="265" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="start" fill="#7D8998">4. workloadSelector 매칭</text>

  <!-- 5. Envoy self: WorkloadEntry found -->
  <path d="M598,298 H654 Q662,298 662,306 V306 Q662,314 654,314 H598" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="668" y="300" width="180" height="12" rx="2" fill="#ffffff"/>
  <text x="746" y="309" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="start" fill="#7D8998">5. WorkloadEntry 발견</text>

  <!-- 6. Envoy -> VM: mTLS connection (headline, accent) -->
  <path d="M598,352 H832" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="654" y="334" width="160" height="12" rx="2" fill="#ffffff"/>
  <text x="734" y="343" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#EC7211">6. mTLS 연결 :8080</text>

  <!-- 7. VM -> Envoy: response (dashed return) -->
  <path d="M832,392 H598" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="674" y="398" width="80" height="12" rx="2" fill="#ffffff"/>
  <text x="714" y="407" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#7D8998">7. 응답</text>

  <!-- 8. Envoy -> Client: response (dashed return) -->
  <path d="M590,432 H114" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="220" y="438" width="80" height="12" rx="2" fill="#ffffff"/>
  <text x="260" y="447" class="mono" font-size="8" letter-spacing="0.02em" text-anchor="middle" fill="#7D8998">8. 응답</text>

  <!-- Legend -->
  <line x1="36" y1="504" x2="924" y2="504" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="36" y="524" class="mono" font-size="8" letter-spacing="0.14em" fill="#545B64">LEGEND</text>
  <line x1="120" y1="519" x2="152" y2="519" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="164" y="522" font-size="11" fill="#545B64">요청 / 조회</text>
  <line x1="300" y1="519" x2="332" y2="519" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="344" y="522" font-size="11" fill="#545B64">응답 (반환)</text>
  <line x1="480" y1="519" x2="512" y2="519" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="524" y="522" font-size="11" fill="#545B64">mTLS 연결 (핵심 단계)</text>

  <text x="36" y="568" font-size="14" font-style="italic" fill="#545B64">Envoy는 ServiceEntry의 workloadSelector로 WorkloadEntry를 찾아낸 뒤에만 VM으로 연결한다.</text>
</svg>