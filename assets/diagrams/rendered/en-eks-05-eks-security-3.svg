    <title id="en-eks-05-eks-security-3-title">STS AssumeRoleWithWebIdentity flow</title>
    <desc id="en-eks-05-eks-security-3-desc">Sequence diagram showing a pod exchanging its projected Kubernetes JWT with AWS STS, which validates the token against the EKS OIDC provider's public keys before returning temporary credentials the pod uses to call an AWS service.</desc>
