<title id="ko-eks-05-eks-security-12-title">IAM 권한 경계의 유효 권한 계산</title>
<desc id="ko-eks-05-eks-security-12-desc">IAM 정책과 권한 경계의 교집합이 유효 권한이 되는 원리를, S3·DynamoDB·EC2 권한을 부여한 정책이 S3·DynamoDB만 허용하는 경계와 만나 최종적으로 S3·DynamoDB만 사용 가능해지는 예시로 보여준다.</desc>
