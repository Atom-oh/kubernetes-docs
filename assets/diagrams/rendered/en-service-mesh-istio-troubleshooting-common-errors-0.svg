<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="podterm-title podterm-desc">
    <title id="podterm-title">Pod termination race condition</title>
    <desc id="podterm-desc">Sequence diagram showing Kubernetes sending SIGTERM to both the application and Envoy proxy at the same time; because Envoy terminates first while the application keeps running, a client request during that window gets connection refused before Kubernetes finally sends SIGKILL to both after the grace period.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#DD344C"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ================= HIGHLIGHT ZONES (drawn first, behind lifelines) ================= -->
    <!-- Problem zone: Envoy terminates first -->
    <rect x="552" y="184" width="152" height="60" rx="4" fill="rgba(221,52,76,0.06)" stroke="rgba(221,52,76,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="628" y="176" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROBLEM: ENVOY EXITS FIRST</text>

    <!-- Info zone: app still running -->
    <rect x="304" y="316" width="152" height="60" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.18)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="380" y="308" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APP IS STILL RUNNING</text>

    <!-- ================= LIFELINES ================= -->
    <!-- Centers: K8s=140, App=380, Envoy=620, Client=860 -->
    <line x1="140" y1="96" x2="140" y2="460" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="380" y1="96" x2="380" y2="460" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="620" y1="96" x2="620" y2="460" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="860" y1="96" x2="860" y2="460" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ================= MESSAGE ARROWS ================= -->
    <!-- M1: K8s -> App SIGTERM -->
    <line x1="140" y1="140" x2="376" y2="140" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M2: K8s -> Envoy SIGTERM -->
    <line x1="140" y1="164" x2="616" y2="164" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- M3: Envoy self — starts terminating immediately -->
    <path d="M 628 200 L 664 200 L 664 232 L 628 232" fill="none" stroke="#DD344C" stroke-width="1.2" marker-end="url(#arrow-danger)"/>

    <!-- M4: Client -> Envoy send request -->
    <line x1="860" y1="272" x2="624" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M5: Envoy -> Client connection refused (dashed, failed) -->
    <line x1="620" y1="296" x2="856" y2="296" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-danger)"/>

    <!-- M6: App self — processing requests -->
    <path d="M 388 332 L 424 332 L 424 364 L 388 364" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- M7: K8s -> App SIGKILL -->
    <line x1="140" y1="404" x2="376" y2="404" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- M8: K8s -> Envoy SIGKILL -->
    <line x1="140" y1="428" x2="616" y2="428" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ================= MESSAGE LABELS ================= -->
    <rect x="196" y="122" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="246" y="132" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">SEND SIGTERM</text>

    <rect x="330" y="146" width="100" height="12" rx="2" fill="#ffffff"/>
    <text x="380" y="156" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">SEND SIGTERM</text>

    <rect x="670" y="210" width="128" height="12" rx="2" fill="#ffffff"/>
    <text x="734" y="220" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">STARTS TERMINATING</text>

    <rect x="700" y="254" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="744" y="264" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">SEND REQUEST</text>

    <rect x="688" y="278" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="744" y="288" fill="#DD344C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CONNECTION REFUSED</text>

    <rect x="432" y="342" width="140" height="12" rx="2" fill="#ffffff"/>
    <text x="502" y="352" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PROCESSING REQUESTS...</text>

    <rect x="196" y="386" width="150" height="12" rx="2" fill="#ffffff"/>
    <text x="271" y="396" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">SIGKILL (FORCE TERMINATE)</text>

    <rect x="330" y="410" width="150" height="12" rx="2" fill="#ffffff"/>
    <text x="405" y="420" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.03em">SIGKILL (FORCE TERMINATE)</text>

    <!-- Editorial note: grace period -->
    <text x="480" y="450" fill="#7D8998" font-size="10.5" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">After 30s — terminationGracePeriodSeconds elapses</text>

    <!-- ================= ACTOR BOXES ================= -->
    <!-- Kubernetes -->
    <rect x="68" y="40" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="68" y="40" width="144" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="76" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.30)" stroke-width="0.8"/>
    <text x="90" y="57" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">K8S</text>
    <text x="140" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes</text>
    <text x="140" y="87" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubelet</text>

    <!-- Application -->
    <rect x="308" y="40" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="308" y="40" width="144" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="316" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="330" y="57" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APP</text>
    <text x="380" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    <text x="380" y="87" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">myapp container</text>

    <!-- Envoy Proxy (focal) -->
    <rect x="548" y="40" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="548" y="40" width="144" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="556" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="572" y="57" fill="#EC7211" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIDE</text>
    <text x="620" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Proxy</text>
    <text x="620" y="87" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">istio-proxy</text>

    <!-- Client -->
    <rect x="788" y="40" width="144" height="56" rx="6" fill="#ffffff"/>
    <rect x="788" y="40" width="144" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="796" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="810" y="57" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXT</text>
    <text x="860" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
    <text x="860" y="87" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">caller</text>

    <!-- ================= LEGEND ================= -->
    <line x1="68" y1="500" x2="932" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="68" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="68" y="536" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="88" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Focal actor</text>

    <line x1="216" y1="540" x2="244" y2="540" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="252" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Lifecycle signal</text>

    <line x1="404" y1="540" x2="432" y2="540" stroke="#DD344C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-danger)"/>
    <text x="440" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Failure / connection refused</text>

    <rect x="636" y="534" width="14" height="10" rx="2" fill="rgba(221,52,76,0.06)" stroke="rgba(221,52,76,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="656" y="544" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Race-condition window</text>

  </svg>