    <title id="en-eks-05-eks-security-6-title">Private cluster access via Client VPN</title>
    <desc id="en-eks-05-eks-security-6-desc">Architecture diagram showing an admin workstation reaching the EKS API server through an AWS Client VPN tunnel into the cluster's VPC, without exposing the API server directly to the internet.</desc>
