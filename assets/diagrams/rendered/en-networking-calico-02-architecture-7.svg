      <title id="en-networking-calico-02-architecture-7-title">Typha fan-out topology</title>
      <desc id="en-networking-calico-02-architecture-7-desc">Architecture diagram showing two API server watch streams feeding two Typha pods, each caching updates locally and fanning them out to roughly one hundred Felix agents in its node group.</desc>
