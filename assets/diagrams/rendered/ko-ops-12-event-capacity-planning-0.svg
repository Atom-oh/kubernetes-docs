    <title id="ko-ops-12-event-capacity-planning-0-title">Pause Pod를 이용한 사전 노드 확보</title>
    <desc id="ko-ops-12-event-capacity-planning-0-desc">PM이 D-7에 이벤트 정보를 전달하면 인프라팀이 Pause Pod로 노드를 미리 확보해두고, D-Day에 실제 워크로드가 스케일업하며 낮은 우선순위의 Pause Pod를 축출해 즉시 스케줄링되는 Karpenter 기반 사전 노드 확보 절차를 보여주는 시퀀스 다이어그램.</desc>
