<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch-seq-title ch-seq-desc" style="width:100%;height:auto;display:block;">
    <title id="ch-seq-title">ClickHouse log ingestion sequence</title>
    <desc id="ch-seq-desc">Sequence showing an application generating logs that flow through FluentBit and an optional Kafka buffer into ClickHouse, which stores them and, on a TTL policy, moves cold data to S3.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#545B64" stroke-width="1.2"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Lifelines (dashed) -->
    <line x1="110" y1="80" x2="110" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="290" y1="80" x2="290" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="470" y1="80" x2="470" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="650" y1="80" x2="650" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="830" y1="80" x2="830" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Messages -->

    <!-- 1. App -> FB : Generate logs -->
    <path d="M 110,150 H 290" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="152" y="128" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="137" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">GENERATE LOGS</text>

    <!-- 2. FB -> Kafka : Buffering -->
    <path d="M 290,220 H 470" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="345" y="198" width="70" height="12" rx="2" fill="#ffffff"/>
    <text x="380" y="207" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">BUFFERING</text>

    <!-- 3. Kafka -> CH : Kafka Engine ingestion -->
    <path d="M 470,290 H 650" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="485" y="268" width="150" height="12" rx="2" fill="#ffffff"/>
    <text x="560" y="277" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">KAFKA ENGINE INGEST</text>

    <!-- 4. CH -> CH self message : Store in MergeTree table -->
    <path d="M 650,346 H 710 Q 718,346 718,354 V 358 Q 718,366 710,366 H 650"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="726" y="343" width="118" height="26" rx="2" fill="#ffffff"/>
    <text x="730" y="352" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">STORE IN</text>
    <text x="730" y="364" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.02em">MERGETREE</text>

    <!-- Note over CH : Based on TTL policy -->
    <rect x="575" y="412" width="150" height="28" rx="4" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="650" y="430" fill="#232F3E" font-size="12" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Based on TTL policy</text>

    <!-- 5. CH -> S3 : Move cold data (async, dashed, open marker) -->
    <path d="M 650,480 H 830" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
    <rect x="682" y="458" width="116" height="12" rx="2" fill="#ffffff"/>
    <text x="740" y="467" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">MOVE COLD DATA</text>

    <!-- Actors (painted after lines/messages so they sit above) -->
    <!-- Application (input) -->
    <rect x="35" y="40" width="150" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="110" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>

    <!-- FluentBit (backend) -->
    <rect x="215" y="40" width="150" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="290" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">FluentBit</text>

    <!-- Kafka (optional, dashed) -->
    <rect x="395" y="40" width="150" height="40" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="470" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kafka (Optional)</text>

    <!-- ClickHouse (focal) -->
    <rect x="575" y="40" width="150" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="650" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ClickHouse</text>

    <!-- S3 (external) -->
    <rect x="755" y="40" width="150" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="830" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">S3 (Cold)</text>

    <!-- ================= LEGEND ================= -->
    <line x1="35" y1="586" x2="905" y2="586" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="35" y="602" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="195" cy="598" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="205" y="602" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">focal store</text>
    <line x1="315" y1="598" x2="335" y2="598" stroke="#545B64" stroke-width="1.2"/>
    <text x="341" y="602" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">sync call</text>
    <line x1="435" y1="598" x2="455" y2="598" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="461" y="602" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">async / background</text>
    <rect x="635" y="592" width="10" height="10" rx="2" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
    <text x="651" y="602" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">note</text>
  </svg>