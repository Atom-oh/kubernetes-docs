<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reqflow-title reqflow-desc">
    <title id="reqflow-title">Complex request flow, one blind spot</title>
    <desc id="reqflow-desc">Tree diagram showing a user request fanning out through an API gateway into auth, product, and order services and their downstream dependencies, illustrating why traditional logging and metrics cannot answer where latency or errors occur across the call tree.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- connectors (behind nodes) -->
    <!-- U -> A -->
    <line x1="480" y1="80" x2="480" y2="112" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- A -> bus -> B,C,F -->
    <line x1="480" y1="156" x2="480" y2="176" stroke="#545B64" stroke-width="1.2"/>
    <line x1="160" y1="176" x2="780" y2="176" stroke="#545B64" stroke-width="1.2"/>
    <line x1="160" y1="176" x2="160" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="176" x2="480" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="780" y1="176" x2="780" y2="192" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- C -> bus2 -> D,E -->
    <line x1="480" y1="236" x2="480" y2="256" stroke="#545B64" stroke-width="1.2"/>
    <line x1="392" y1="256" x2="568" y2="256" stroke="#545B64" stroke-width="1.2"/>
    <line x1="392" y1="256" x2="392" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="568" y1="256" x2="568" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- F -> bus3 -> G,H -->
    <line x1="780" y1="236" x2="780" y2="256" stroke="#545B64" stroke-width="1.2"/>
    <line x1="708" y1="256" x2="852" y2="256" stroke="#545B64" stroke-width="1.2"/>
    <line x1="708" y1="256" x2="708" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="852" y1="256" x2="852" y2="272" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- G -> I -->
    <line x1="708" y1="312" x2="708" y2="352" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- U: User (input treatment) -->
    <rect x="420" y="40" width="120" height="40" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="480" y="64" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">User</text>

    <!-- A: API Gateway (focal) -->
    <rect x="400" y="112" width="160" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="139" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API Gateway</text>

    <!-- B: Auth Service -->
    <rect x="90" y="192" width="140" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="160" y="219" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Auth Service</text>

    <!-- C: Product Service -->
    <rect x="410" y="192" width="140" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="219" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Product Service</text>

    <!-- F: Order Service -->
    <rect x="710" y="192" width="140" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="780" y="219" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Order Service</text>

    <!-- D: Inventory Service -->
    <rect x="332" y="272" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="392" y="297" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Inventory Service</text>

    <!-- E: Pricing Service -->
    <rect x="508" y="272" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="568" y="297" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pricing Service</text>

    <!-- G: Payment Service -->
    <rect x="648" y="272" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="708" y="297" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Payment Service</text>

    <!-- H: Notification Service -->
    <rect x="792" y="272" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="852" y="291" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Notification</text>
    <text x="852" y="303" fill="#232F3E" font-size="10.5" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service</text>

    <!-- I: Fraud Detection -->
    <rect x="648" y="352" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="708" y="377" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Fraud Detection</text>

    <!-- Editorial aside: the questions logs/metrics can't answer -->
    <text x="90" y="440" fill="#232F3E" font-size="14" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Logs and metrics alone can't answer:</text>
    <text x="90" y="466" fill="#545B64" font-size="14" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Where did the latency occur? What's the root cause of an error?</text>
    <text x="90" y="490" fill="#545B64" font-size="14" font-style="italic" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">What are the real dependencies between these services?</text>

    <!-- legend -->
    <line x1="30" y1="536" x2="930" y2="536" stroke="rgba(35,47,62,0.12)" stroke-width="0.8"/>
    <text x="30" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.16em">LEGEND</text>
    <rect x="180" y="544" width="20" height="12" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="208" y="554" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Request origin</text>
    <rect x="360" y="544" width="20" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="388" y="554" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Single entry point (shared hotspot)</text>
  </svg>