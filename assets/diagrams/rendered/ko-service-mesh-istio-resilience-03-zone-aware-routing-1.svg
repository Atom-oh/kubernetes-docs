<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zar1-title zar1-desc">
    <title id="zar1-title">Locality 기반 라우팅 우선순위 결정 흐름</title>
    <desc id="zar1-desc">요청이 도착하면 같은 Zone에 정상 파드가 있는지 먼저 확인해 있으면 그 Zone으로, 없으면 인접 Zone을 확인해 있으면 그곳으로, 둘 다 없으면 다른 Region으로 라우팅하는 단계적 판단 과정을 보여준다.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <style>
        text{font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif;}
        .mono{font-family:'Geist Mono',monospace;}
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- arrows first -->
    <!-- Request -> CheckLocal (no label) -->
    <path d="M180,144 V156" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- CheckLocal -> LocalRoute (Yes, accent / happy path) -->
    <path d="M252,204 H420" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="318" y="190" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="336" y="199" fill="#EC7211" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">YES</text>

    <!-- CheckLocal -> CheckNearby (No) -->
    <path d="M180,252 V296" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="188" y="264" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="204" y="273" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <!-- CheckNearby -> NearbyRoute (Yes) -->
    <path d="M252,344 H420" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="318" y="330" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="336" y="339" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">YES</text>

    <!-- CheckNearby -> RemoteRoute (No) -->
    <path d="M180,392 V456" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="188" y="416" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="204" y="425" fill="#545B64" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">NO</text>

    <!-- Request (start, oval) -->
    <rect x="100" y="88" width="160" height="56" rx="28" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="120" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">요청 도착</text>

    <!-- CheckLocal (diamond, focal) -->
    <polygon points="180,156 252,204 180,252 108,204" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="180" y="198" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">같은 Zone에</text>
    <text x="180" y="212" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">정상 파드 존재?</text>

    <!-- LocalRoute (rect, focal) -->
    <rect x="420" y="172" width="160" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="500" y="198" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">같은 Zone으로 라우팅</text>
    <text x="500" y="214" fill="#545B64" font-size="9" class="mono" text-anchor="middle">80–100%</text>

    <!-- CheckNearby (diamond) -->
    <polygon points="180,296 252,344 180,392 108,344" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="338" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">인접 Zone에</text>
    <text x="180" y="352" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">정상 파드 존재?</text>

    <!-- NearbyRoute (rect) -->
    <rect x="420" y="312" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="500" y="338" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">인접 Zone으로 라우팅</text>
    <text x="500" y="354" fill="#545B64" font-size="9" class="mono" text-anchor="middle">10–20%</text>

    <!-- RemoteRoute (rect, terminal) -->
    <rect x="100" y="456" width="160" height="56" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="180" y="488" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">다른 Region으로 라우팅</text>

    <!-- legend -->
    <line x1="32" y1="552" x2="928" y2="552" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="572" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
    <polygon points="150,562 158,568 150,574 142,568" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="168" y="572" fill="#545B64" font-size="9" class="mono">판단(diamond)</text>
    <rect x="330" y="562" width="20" height="12" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="360" y="572" fill="#545B64" font-size="9" class="mono">우선 경로 (같은 Zone)</text>
    <rect x="580" y="562" width="20" height="12" rx="3" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="610" y="572" fill="#545B64" font-size="9" class="mono">최종 대안 (다른 Region)</text>
  </svg>