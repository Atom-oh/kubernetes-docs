<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4-title d4-desc">
    <title id="d4-title">Six-step canary traffic weight progression</title>
    <desc id="d4-desc">Traffic to the canary version increases step by step: 0%, then 10% held for five minutes, 30% held for five minutes, 50% held for ten minutes, 80% held for ten minutes, and finally 100% complete.</desc>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Arrows -->
    <line x1="176" y1="300" x2="196" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="316" y1="300" x2="336" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="456" y1="300" x2="476" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="596" y1="300" x2="616" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="736" y1="300" x2="756" y2="300" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- Nodes -->
    <rect x="40" y="264" width="136" height="72" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="108" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">0%</text>
    <text x="108" y="312" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">canary deployed</text>

    <rect x="196" y="264" width="120" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="256" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">10%</text>
    <text x="256" y="312" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">wait 5m</text>

    <rect x="336" y="264" width="120" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="396" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">30%</text>
    <text x="396" y="312" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">wait 5m</text>

    <rect x="476" y="264" width="120" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="536" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">50%</text>
    <text x="536" y="312" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">wait 10m</text>

    <rect x="616" y="264" width="120" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="676" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">80%</text>
    <text x="676" y="312" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">wait 10m</text>

    <rect x="756" y="264" width="164" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="838" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">100%</text>
    <text x="838" y="312" text-anchor="middle" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">complete</text>

    <!-- Legend -->
    <line x1="40" y1="392" x2="920" y2="392" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="408" font-size="8" letter-spacing="0.14em" fill="#545B64" font-family="'Geist Mono',monospace">LEGEND</text>
    <circle cx="160" cy="404" r="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="172" y="408" font-size="9" fill="#545B64" font-family="'Geist Mono',monospace">last hold before full rollout</text>

    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
  </svg>