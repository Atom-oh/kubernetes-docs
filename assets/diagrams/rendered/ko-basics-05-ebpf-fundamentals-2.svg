    <title id="ko-basics-05-ebpf-fundamentals-2-title">eBPF 프로그램 로드와 실행 절차</title>
    <desc id="ko-basics-05-ebpf-fundamentals-2-desc">C/Rust로 작성한 eBPF 프로그램이 컴파일과 커널 로드, 검증기 통과를 거쳐 JIT 컴파일되고 이벤트 훅에 연결되어 실행된 뒤 맵에 데이터를 저장하고 사용자 공간에서 읽히는 절차를 보여주는 순서도이며, 검증 실패 시 로드가 거부되는 분기도 함께 보여준다.</desc>
