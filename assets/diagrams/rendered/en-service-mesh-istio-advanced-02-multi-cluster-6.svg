<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mc-p3-title mc-p3-desc">
<title id="mc-p3-title">Hybrid Istio and Lattice pattern</title>
<desc id="mc-p3-desc">Inside each cluster, an Istio mesh gives Service A and Service B full mTLS and retry between themselves, while Service B in each cluster reaches the other cluster only through a shared VPC Lattice service network.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
<marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- outer cluster zones -->
<rect x="56" y="110" width="366" height="260" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="68" y="114" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="138" y="123" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">CLUSTER 1 · US-EAST-1</text>

<rect x="560" y="110" width="366" height="260" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="572" y="114" width="140" height="12" rx="2" fill="#ffffff"/>
<text x="642" y="123" fill="rgba(35,47,62,0.45)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">CLUSTER 2 · US-WEST-2</text>

<!-- inner istio mesh zones -->
<rect x="76" y="150" width="326" height="190" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
<rect x="88" y="154" width="90" height="12" rx="2" fill="#ffffff"/>
<text x="133" y="163" fill="rgba(35,47,62,0.50)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">ISTIO MESH</text>

<rect x="580" y="150" width="326" height="190" rx="8" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.16)" stroke-width="0.8"/>
<rect x="592" y="154" width="90" height="12" rx="2" fill="#ffffff"/>
<text x="637" y="163" fill="rgba(35,47,62,0.50)" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">ISTIO MESH</text>

<!-- lattice zone -->
<rect x="380" y="420" width="200" height="100" rx="8" fill="rgba(255,153,0,0.05)" stroke="rgba(236,114,17,0.40)" stroke-width="0.8" stroke-dasharray="4,4"/>
<rect x="392" y="424" width="150" height="12" rx="2" fill="#ffffff"/>
<text x="467" y="433" fill="#EC7211" font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">AWS VPC LATTICE</text>

<!-- arrows -->
<line x1="216" y1="214" x2="266" y2="214" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="221" y="196" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="241" y="205" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.03em">MTLS</text>

<line x1="720" y1="214" x2="770" y2="214" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="725" y="196" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="745" y="205" fill="#7D8998" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.03em">MTLS</text>

<path d="M 326,238 V 420 Q 326,428 334,428 H 412 Q 420,428 420,436 V 448"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<path d="M 830,238 V 420 Q 830,428 822,428 H 548 Q 540,428 540,436 V 448"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<rect x="150" y="392" width="86" height="12" rx="2" fill="#ffffff"/>
<text x="193" y="401" fill="#EC7211" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.02em">VPC LATTICE</text>
<rect x="674" y="392" width="86" height="12" rx="2" fill="#ffffff"/>
<text x="717" y="401" fill="#EC7211" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.02em">VPC LATTICE</text>

<!-- nodes -->
<rect x="96" y="190" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="156" y="218" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Service A</text>

<rect x="266" y="190" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="326" y="218" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Service B</text>

<rect x="600" y="190" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="660" y="218" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Service A</text>

<rect x="770" y="190" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="830" y="218" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Service B</text>

<rect x="400" y="448" width="160" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="480" y="466" fill="#232F3E" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Service network</text>
<text x="480" y="480" fill="#545B64" font-family="'Geist Mono',monospace" font-size="9" text-anchor="middle">cross-cluster</text>

<!-- legend -->
<line x1="30" y1="546" x2="930" y2="546" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<text x="30" y="562" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="130" y1="559" x2="154" y2="559" stroke="#232F3E" stroke-width="1.2"/>
<text x="162" y="562" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">INTRA-CLUSTER (ISTIO)</text>
<line x1="420" y1="559" x2="444" y2="559" stroke="#EC7211" stroke-width="1.4"/>
<text x="452" y="562" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">CROSS-CLUSTER (LATTICE)</text>
</svg>
