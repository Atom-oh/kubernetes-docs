    <title id="ko-core-05-configuration-secrets-5-title">Amazon EKS의 구성 관리와 AWS 서비스 통합</title>
    <desc id="ko-core-05-configuration-secrets-5-desc">Amazon EKS가 기본 Kubernetes 구성(ConfigMap·Secret)을 사용하는 동시에 Secrets Manager·Parameter Store·AppConfig·KMS·IAM 같은 AWS 서비스와 통합하고, External Secrets Operator·ASCP·IRSA·ACK 같은 통합 도구가 그 값을 Kubernetes Secret으로 생성·마운트하며 파드에 권한을 부여함을 보여준다.</desc>
