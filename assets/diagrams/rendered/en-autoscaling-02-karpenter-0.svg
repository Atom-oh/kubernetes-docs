<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="karpcore-title karpcore-desc">
    <title id="karpcore-title">Karpenter core control loop</title>
    <desc id="karpcore-desc">Architecture diagram showing the Karpenter controller in a Kubernetes cluster watching unschedulable pods and provisioner and node template resources, then calling the Kubernetes and cloud provider instance APIs to create compute instances.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="72" width="560" height="392" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="292" y="76" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="348" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KUBERNETES CLUSTER</text>

    <rect x="668" y="72" width="252" height="392" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="736" y="76" width="116" height="12" rx="2" fill="#ffffff"/>
    <text x="794" y="85" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLOUD PROVIDER</text>

    <!-- Node coords -->
    <!-- A Controller (focal) center ~ (200,164) -->
    <!-- B Webhook (200,272) -->
    <!-- C Provisioner CRD (416,124) -->
    <!-- D NodeTemplate CRD (416,204) -->
    <!-- E Unschedulable Pods (200,392) -->
    <!-- F Kubernetes API (416,392) -->
    <!-- G Instance API (776,164) -->
    <!-- H Compute Instances (776,392) -->

    <!-- Arrows (behind nodes) -->
    <!-- A -> E Watches (vertical, x shared 200) -->
    <line x1="200" y1="196" x2="200" y2="360" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- A -> C Uses -->
    <path d="M 264,152 H 348 Q 356,152 356,144 V 136 Q 356,128 364,128 H 372"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- A -> D Uses -->
    <path d="M 264,176 H 372" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- A -> F Calls (accent, headline; routes right of the Webhook column, then down, then into F's left edge) -->
    <path d="M 264,188 H 300 Q 308,188 308,196 V 380 Q 308,388 316,388 H 372"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- F -> H Creates (crosses zone boundary, dashed since secondary path) -->
    <path d="M 464,392 H 700 Q 708,392 708,392 H 712"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- A -> G Calls (accent headline, primary provisioning call) -->
    <path d="M 232,158 H 620 Q 628,158 628,166 V 172 Q 628,180 636,180 H 716"
          fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- G -> H Provisions -->
    <line x1="776" y1="196" x2="776" y2="360" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- B -> C Validates -->
    <path d="M 264,264 H 320 Q 328,264 328,256 V 152 Q 328,144 336,144 H 372"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <!-- B -> D Validates (hop bridges the crossing accent connector at x=308) -->
    <path d="M 264,280 H 300 a 8,8 0 0,1 16,0 H 372" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="180" y="264" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="273" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WATCH</text>

    <rect x="378" y="122" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="395" y="131" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USES</text>

    <rect x="301" y="158" width="34" height="12" rx="2" fill="#ffffff"/>
    <text x="318" y="167" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USES</text>

    <rect x="316" y="326" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="336" y="335" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALLS</text>

    <rect x="580" y="382" width="42" height="12" rx="2" fill="#ffffff"/>
    <text x="601" y="391" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATES</text>

    <rect x="590" y="150" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="610" y="159" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALLS</text>

    <rect x="756" y="264" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="782" y="273" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROVISION</text>

    <rect x="336" y="238" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="364" y="247" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALIDATES</text>

    <rect x="266" y="274" width="56" height="12" rx="2" fill="#ffffff"/>
    <text x="294" y="283" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALIDATES</text>

    <!-- Nodes -->
    <!-- A Karpenter Controller (focal) -->
    <rect x="136" y="132" width="128" height="64" rx="6" fill="#ffffff"/>
    <rect x="136" y="132" width="128" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="200" y="162" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Karpenter</text>
    <text x="200" y="178" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Controller</text>

    <!-- B Karpenter Webhook -->
    <rect x="136" y="248" width="128" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="200" y="272" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Karpenter</text>
    <text x="200" y="288" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Webhook</text>

    <!-- C Provisioner CRD -->
    <rect x="372" y="100" width="120" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="432" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Provisioner</text>
    <text x="432" y="140" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CRD</text>

    <!-- D NodeTemplate CRD -->
    <rect x="372" y="176" width="120" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="432" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">NodeTemplate</text>
    <text x="432" y="216" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CRD</text>

    <!-- E Unschedulable Pods -->
    <rect x="136" y="360" width="128" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="200" y="384" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Unschedulable</text>
    <text x="200" y="400" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pods</text>

    <!-- F Kubernetes API -->
    <rect x="372" y="360" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="432" y="384" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes</text>
    <text x="432" y="400" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API</text>

    <!-- G Instance API -->
    <rect x="712" y="132" width="128" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="776" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Instance</text>
    <text x="776" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">API</text>

    <!-- H Compute Instances -->
    <rect x="712" y="360" width="128" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="776" y="384" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Compute</text>
    <text x="776" y="400" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Instances</text>

    <!-- Legend -->
    <line x1="40" y1="504" x2="920" y2="504" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="524" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="520" x2="168" y2="520" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="176" y="524" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">PROVISIONING PATH</text>
    <line x1="380" y1="520" x2="408" y2="520" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="416" y="524" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">VALIDATE / CREATE</text>
  </svg>