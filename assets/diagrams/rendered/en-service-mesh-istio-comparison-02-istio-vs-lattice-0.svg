<rect x="204" y="232" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="212" y="240" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="227" y="249" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">ENV</text>
<text x="264" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>
<text x="264" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">50-150MB</text>

<!-- BackendProxy -->
<rect x="636" y="232" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="644" y="240" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="659" y="249" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">ENV</text>
<text x="696" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Envoy Sidecar</text>
<text x="696" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">50-150MB</text>

<!-- BackendApp -->
<rect x="776" y="232" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="784" y="240" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="799" y="249" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
<text x="836" y="262" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Backend</text>

<!-- Prometheus -->
<rect x="140" y="432" width="140" height="48" rx="6" fill="#ffffff"/>
<rect x="140" y="432" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<rect x="148" y="440" width="30" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
<text x="163" y="449" fill="#545B64" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">MET</text>
<text x="210" y="461" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>

<!-- Jaeger -->
<rect x="420" y="432" width="140" height="48" rx="6" fill="#ffffff"/>
<rect x="420" y="432" width="140" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
