<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="istioarch-title istioarch-desc">
<title id="istioarch-title">Istio sidecar architecture</title>
<desc id="istioarch-desc">Architecture diagram showing Istiod pushing xDS configuration to Envoy sidecars attached to each application pod, with sidecars exchanging mTLS traffic and exporting metrics and traces to Prometheus, Jaeger, and Kiali.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zones -->
<rect x="40" y="40" width="880" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="440" y="44" width="112" height="12" rx="2" fill="#ffffff"/>
<text x="496" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE</text>

<rect x="40" y="192" width="880" height="176" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="404" y="196" width="152" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="205" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">NAMESPACE: PRODUCTION</text>

<rect x="40" y="400" width="880" height="132" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="428" y="404" width="104" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="413" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">OBSERVABILITY</text>

<!-- Arrows (behind nodes) -->
<!-- App -> Proxy, Proxy -> App -->
<line x1="184" y1="256" x2="204" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="756" y1="256" x2="776" y2="256" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- mTLS accent -->
<line x1="324" y1="256" x2="636" y2="256" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<!-- xDS config from Istiod -->
<path d="M 440,120 V 168 Q 440,176 432,176 H 272 Q 264,176 264,184 V 232" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 520,120 V 168 Q 520,176 528,176 H 688 Q 696,176 696,184 V 232" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Metrics / Traces dashed -->
<path d="M 264,280 V 348 Q 264,356 256,356 H 216 Q 208,356 208,364 V 432" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 696,280 V 348 Q 696,356 688,356 H 496 Q 488,356 488,364 V 432" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Kiali -> Prometheus query, routed under the row -->
<path d="M 768,480 V 492 Q 768,500 760,500 H 216 Q 208,500 208,492 V 480" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<!-- Arrow labels -->
<rect x="424" y="156" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="456" y="165" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">XDS CONFIG</text>

<rect x="576" y="156" width="64" height="12" rx="2" fill="#ffffff"/>
<text x="608" y="165" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">XDS CONFIG</text>

<rect x="448" y="236" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="472" y="245" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">MTLS</text>

<rect x="224" y="336" width="52" height="12" rx="2" fill="#ffffff"/>
<text x="250" y="345" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">METRICS</text>

<rect x="656" y="336" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="680" y="345" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TRACES</text>

<rect x="448" y="480" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="468" y="489" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

<!-- Nodes -->
<!-- Istiod (focal) -->
<rect x="400" y="72" width="160" height="48" rx="6" fill="#ffffff"/>
<rect x="400" y="72" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<rect x="408" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
<text x="420" y="89" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CP</text>
<text x="480" y="98" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Istiod</text>
<text x="480" y="112" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">unified control plane</text>

<!-- FrontendApp -->
<rect x="64" y="232" width="120" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<rect x="72" y="240" width="30" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
<text x="87" y="249" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
<text x="124" y="262" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Frontend</text>

