<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="simple-arch-title simple-arch-desc">
    <title id="simple-arch-title">단순 아키텍처의 서비스 메시 불필요 사례</title>
    <desc id="simple-arch-desc">사용자가 로드 밸런서를 거쳐 단일 모놀리식 애플리케이션과 데이터베이스에 접근하는 단순한 구조에서는 Ingress만으로 충분해 서비스 메시가 불필요함을 보여주는 다이어그램.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="d2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows -->
    <line x1="164" y1="300" x2="256" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
    <line x1="404" y1="300" x2="480" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#d2-arrow)"/>
    <line x1="628" y1="300" x2="700" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#d2-arrow)"/>

    <!-- User -->
    <rect x="72" y="272" width="92" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="118" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">사용자</text>

    <!-- Load balancer -->
    <rect x="256" y="264" width="148" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="330" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">로드 밸런서</text>
    <text x="330" y="320" fill="#545B64" font-size="9" font-family="var(--font-mono)" text-anchor="middle">Ingress Controller</text>

    <!-- Monolith app -->
    <rect x="480" y="264" width="148" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="554" y="298" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">모놀리식</text>
    <text x="554" y="316" fill="#232F3E" font-size="12" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">애플리케이션</text>

    <!-- DB (cylinder) -->
    <path d="M 700,280 a 40,10 0 0 1 80,0 v 40 a 40,10 0 0 1 -80,0 z" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <path d="M 700,280 a 40,10 0 0 0 80,0" fill="none" stroke="#545B64" stroke-width="1"/>
    <text x="740" y="322" fill="#232F3E" font-size="11" font-weight="600" font-family="var(--font-cjk)" text-anchor="middle">DB</text>

    <!-- Annotation callout -->
    <text x="480" y="420" fill="#7D8998" font-size="14" font-family="var(--font-cjk)" font-style="italic" text-anchor="middle">단일 애플리케이션 · 간단한 통신 패턴 · Ingress만으로 충분</text>

    <!-- Legend -->
    <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="516" fill="#545B64" font-size="8" font-family="var(--font-mono)" letter-spacing="0.14em">LEGEND</text>
    <rect x="140" y="506" width="24" height="12" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="172" y="516" fill="#545B64" font-size="8.5" font-family="var(--font-cjk)">컴포넌트</text>
    <path d="M 280,506 a 12,3 0 0 1 24,0 v 12 a 12,3 0 0 1 -24,0 z" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="316" y="516" fill="#545B64" font-size="8.5" font-family="var(--font-cjk)">데이터 저장소</text>
  </svg>