<title id="ko-core-08-scheduling-preemption-eviction-4-title">테인트와 톨러레이션 메커니즘</title>
<desc id="ko-core-08-scheduling-preemption-eviction-4-desc">노드에 적용된 테인트는 일치하는 톨러레이션이 없는 포드를 거부하며, GPU 노드 예시로 일반 포드는 거부되고 톨러레이션을 가진 포드만 배치되는 과정을 보여준다.</desc>
