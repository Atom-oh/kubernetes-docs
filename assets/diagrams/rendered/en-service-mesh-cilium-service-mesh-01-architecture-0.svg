      <title id="en-service-mesh-cilium-service-mesh-01-architecture-0-title">Cilium Service Mesh node architecture</title>
      <desc id="en-service-mesh-cilium-service-mesh-01-architecture-0-desc">Architecture diagram showing how the Kubernetes control plane drives the per-node Cilium Agent and Operator, which program eBPF kernel datapath maps that intercept pod traffic and redirect L7 flows to a shared node-local Envoy proxy.</desc>
