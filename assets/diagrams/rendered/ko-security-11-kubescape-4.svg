    <title id="ko-security-11-kubescape-4-title">Kubescape 발견 사항 수정(Remediation) 워크플로</title>
    <desc id="ko-security-11-kubescape-4-desc">정기 스캔이나 알림으로 발견된 문제를 심각도별로 분류해 영향도를 분석한 뒤, 수정이 필요하면 코드를 고쳐 배포하고 재스캔으로 통과 여부를 검증하며 실패하면 다시 수정하고, 위험이 허용 가능하면 예외로 등록해 이슈를 종료하는 반복적 수정 워크플로를 보여준다.</desc>
