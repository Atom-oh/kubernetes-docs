<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mtls-seq-title mtls-seq-desc">
  <title id="mtls-seq-title">mTLS 핸드셰이크 시퀀스</title>
  <desc id="mtls-seq-desc">애플리케이션이 평문 HTTP를 보내면 양쪽 프록시가 SPIFFE ID로 상호 인증하는 mTLS 핸드셰이크를 수행해 트래픽을 암호화하고, 수신 측 프록시가 이를 복호화해 평문으로 애플리케이션에 전달하는 흐름을 보여준다.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Lifelines -->
  <line x1="100" y1="96" x2="100" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="96" x2="360" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="620" y1="96" x2="620" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="880" y1="96" x2="880" y2="560" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Actor boxes -->
  <rect x="24" y="48" width="152" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="100" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Application A</text>

  <rect x="284" y="48" width="152" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="360" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Proxy A</text>

  <rect x="544" y="48" width="152" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="620" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Proxy B</text>

  <rect x="804" y="48" width="152" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="880" y="72" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Noto Sans KR',sans-serif" text-anchor="middle">Application B</text>

  <!-- Messages -->
  <!-- 1. App1 -> P1 : Plain HTTP -->
  <line x1="100" y1="120" x2="360" y2="120" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="200" y="100" width="80" height="12" rx="2" fill="#ffffff"/>
  <text x="240" y="110" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PLAIN HTTP</text>

  <!-- 2. P1 self: 인증서로 TLS 초기화 -->
  <path d="M 360,148 H 412 V 168 H 360" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="416" y="150" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="476" y="160" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">TLS 초기화</text>

  <!-- 3. P1 -> P2 : mTLS Handshake (headline, accent) -->
  <line x1="360" y1="196" x2="620" y2="196" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="440" y="176" width="100" height="12" rx="2" fill="#ffffff"/>
  <text x="490" y="186" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">MTLS HANDSHAKE</text>
  <rect x="420" y="204" width="140" height="12" rx="2" fill="#ffffff"/>
  <text x="490" y="214" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">SPIFFE ID 상호 검증</text>

  <!-- 4. P1 -> P2 : Encrypted Request -->
  <line x1="360" y1="248" x2="620" y2="248" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="430" y="228" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="490" y="238" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">ENCRYPTED REQ</text>

  <!-- 5. P2 self: TLS 종료 -->
  <path d="M 620,276 H 672 V 296 H 620" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="676" y="278" width="72" height="12" rx="2" fill="#ffffff"/>
  <text x="712" y="288" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">TLS 종료</text>

  <!-- 6. P2 -> App2 : Plain HTTP -->
  <line x1="620" y1="324" x2="880" y2="324" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="710" y="304" width="80" height="12" rx="2" fill="#ffffff"/>
  <text x="750" y="314" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PLAIN HTTP</text>

  <!-- 7. App2 -> P2 : Plain HTTP Response (dashed return) -->
  <line x1="880" y1="372" x2="620" y2="372" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="700" y="352" width="100" height="12" rx="2" fill="#ffffff"/>
  <text x="750" y="362" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">RESPONSE</text>

  <!-- 8. P2 -> P1 : Encrypted Response (dashed return) -->
  <line x1="620" y1="420" x2="360" y2="420" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="430" y="400" width="120" height="12" rx="2" fill="#ffffff"/>
  <text x="490" y="410" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">ENCRYPTED RESP</text>

  <!-- 9. P1 -> App1 : Plain HTTP Response (dashed return) -->
  <line x1="360" y1="468" x2="100" y2="468" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="180" y="448" width="100" height="12" rx="2" fill="#ffffff"/>
  <text x="230" y="458" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">RESPONSE</text>

  <!-- Legend -->
  <line x1="24" y1="532" x2="936" y2="532" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="24" y="552" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="220" y1="549" x2="252" y2="549" stroke="#EC7211" stroke-width="1.4"/>
  <text x="260" y="552" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif">mTLS 핸드셰이크 (헤드라인)</text>
  <line x1="500" y1="549" x2="532" y2="549" stroke="#545B64" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="540" y="552" fill="#545B64" font-size="10" font-family="'Amazon Ember','Noto Sans KR',sans-serif">응답 (return)</text>
</svg>