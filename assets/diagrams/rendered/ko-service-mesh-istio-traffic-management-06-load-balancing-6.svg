<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="lb-decisiontree-title lb-decisiontree-desc">
    <title id="lb-decisiontree-title">세션 유지, 트래픽 규모, 지리적 분산 여부로 로드 밸런싱 알고리즘을 고르는 결정 트리</title>
    <desc id="lb-decisiontree-desc">세션 유지가 필요한지, 트래픽이 매우 높은지, 지리적으로 분산되어 있는지를 차례로 물어 CONSISTENT_HASH, RANDOM, LEAST_REQUEST+Locality, 또는 PASSTHROUGH/ROUND_ROBIN 중 알맞은 로드 밸런싱 알고리즘으로 안내하는 결정 트리를 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== Arrows ===== -->
    <line x1="180" y1="76" x2="180" y2="120" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="250" y1="160" x2="350" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="280" y="140" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="300" y="149" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

    <line x1="180" y1="200" x2="180" y2="240" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="188" y="214" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="203" y="223" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

    <line x1="250" y1="280" x2="380" y2="280" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="295" y="260" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="315" y="269" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

    <line x1="180" y1="320" x2="180" y2="360" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="188" y="334" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="203" y="343" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

    <line x1="250" y1="400" x2="350" y2="400" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="280" y="380" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="300" y="389" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

    <line x1="180" y1="440" x2="180" y2="488" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="188" y="458" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="203" y="467" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

    <!-- ===== Nodes ===== -->
    <!-- Start (oval) -->
    <rect x="100" y="36" width="160" height="40" rx="20" fill="#ffffff"/>
    <rect x="100" y="36" width="160" height="40" rx="20" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="60" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">로드 밸런싱 필요</text>

    <!-- Q1 decision (focal) -->
    <path d="M 180,120 L 250,160 L 180,200 L 110,160 Z" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="180" y="154" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">세션 유지</text>
    <text x="180" y="168" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">필요?</text>

    <!-- R1 -->
    <rect x="350" y="132" width="220" height="56" rx="6" fill="#ffffff"/>
    <rect x="350" y="132" width="220" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="460" y="154" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CONSISTENT_HASH</text>
    <text x="460" y="170" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">httpCookie 또는 httpHeaderName</text>

    <!-- Q2 decision -->
    <path d="M 180,240 L 250,280 L 180,320 L 110,280 Z" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="274" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">트래픽</text>
    <text x="180" y="288" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">매우 높음?</text>

    <!-- R2 -->
    <rect x="380" y="258" width="160" height="44" rx="6" fill="#ffffff"/>
    <rect x="380" y="258" width="160" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="460" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">RANDOM</text>

    <!-- Q4 decision -->
    <path d="M 180,360 L 250,400 L 180,440 L 110,400 Z" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="394" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">지리적</text>
    <text x="180" y="408" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">분산?</text>

    <!-- R4 -->
    <rect x="350" y="372" width="220" height="56" rx="6" fill="#ffffff"/>
    <rect x="350" y="372" width="220" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="460" y="394" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">LEAST_REQUEST</text>
    <text x="460" y="410" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ Locality Setting</text>

    <!-- R56 (merged: TCP 프록시 여부 -> PASSTHROUGH / ROUND_ROBIN) -->
    <rect x="40" y="488" width="280" height="64" rx="6" fill="#ffffff"/>
    <rect x="40" y="488" width="280" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="180" y="504" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TCP 프록시 여부</text>
    <text x="180" y="522" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Yes → PASSTHROUGH</text>
    <text x="180" y="538" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">No → ROUND_ROBIN (기본값)</text>

    <!-- legend -->
    <line x1="40" y1="566" x2="920" y2="566" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="52" y="576" width="20" height="12" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="80" y="586" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">START</text>
    <path d="M 320,582 L 332,588 L 320,594 L 308,588 Z" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="342" y="591" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">DECISION</text>
    <rect x="620" y="582" width="20" height="12" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="650" y="591" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">RESULT</text>
  </svg>