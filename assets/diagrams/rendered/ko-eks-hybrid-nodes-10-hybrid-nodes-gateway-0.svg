<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
<title id="d0-title">EKS 하이브리드 노드 게이트웨이 토폴로지</title>
<desc id="d0-desc">VPC 안의 리더/스탠바이 게이트웨이가 VXLAN 터널로 온프레미스 하이브리드 노드와 연결되고, VPC 라우트 테이블과 VPC Pod로도 라우팅되는 구조를 보여준다.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="d0-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="d0-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Zone: VPC -->
<rect x="40" y="140" width="600" height="260" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="56" y="144" width="160" height="12" rx="2" fill="#ffffff"/>
<text x="136" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VPC 10.0.0.0/16</text>

<!-- Zone: OnPrem -->
<rect x="680" y="200" width="224" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="696" y="204" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="744" y="213" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">온프레미스</text>

<!-- Arrows (behind nodes) -->
<!-- A: Gateway -> Hybrid Node 1 (VXLAN, bidirectional) -->
<path d="M392,192 H536 Q544,192 544,200 V256 Q544,264 552,264 H696" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d0-arrow)" marker-start="url(#d0-arrow-start)"/>
<!-- B: Gateway -> VPC Pod (VPC routing, bidirectional) -->
<path d="M392,208 H514 Q522,208 522,216 V312" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d0-arrow)" marker-start="url(#d0-arrow-start)"/>
<!-- C: Gateway -> Hybrid Node 2 (VXLAN, bidirectional) -->
<path d="M392,224 H632 Q640,224 640,232 V376 Q640,384 648,384 H696" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d0-arrow)" marker-start="url(#d0-arrow-start)"/>
<!-- D: Gateway -> Route Table (route update, one-way) -->
<path d="M312,240 V312" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#d0-arrow)"/>

<!-- Arrow labels -->
<rect x="434" y="172" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="464" y="181" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VXLAN</text>

