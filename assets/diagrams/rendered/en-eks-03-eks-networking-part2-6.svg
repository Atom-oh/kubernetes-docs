<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Gateway API Routing Hierarchy</title>
<desc id="d">A GatewayClass configures a Gateway, which fans out to an HTTPRoute for L7 traffic through an ALB and a TCPRoute for L4 traffic through an NLB; the HTTPRoute distributes to Service A and Service B, and the TCPRoute forwards to Service C.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<text x="40" y="44" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">TREE · GATEWAY API</text>
<text x="40" y="68" fill="#232F3E" font-size="20" font-weight="700">Gateway API Routing Hierarchy</text>

<!-- Tier 1: GatewayClass -->
<rect x="400" y="100" width="160" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="126" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">GatewayClass</text>
<text x="480" y="142" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">controller config</text>

<!-- Tier 2: Gateway (focal) -->
<path d="M 480,160 V 192" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="400" y="192" width="160" height="60" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
<text x="480" y="218" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Gateway</text>
<text x="480" y="234" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">LB instance</text>

<!-- Tier 3: HTTPRoute, TCPRoute -->
<path d="M 480,252 V 284" fill="none" stroke="#545B64" stroke-width="1.2"/>
<line x1="296" y1="284" x2="664" y2="284" stroke="#545B64" stroke-width="1.2"/>
<path d="M 296,284 V 316" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 664,284 V 316" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="216" y="316" width="160" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="296" y="342" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">HTTPRoute</text>
<text x="296" y="358" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">L7 → ALB</text>

<rect x="584" y="316" width="160" height="60" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="664" y="342" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">TCPRoute</text>
<text x="664" y="358" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">L4 → NLB</text>

<!-- Tier 4: services -->
<path d="M 296,376 V 408" fill="none" stroke="#545B64" stroke-width="1.2"/>
<line x1="200" y1="408" x2="392" y2="408" stroke="#545B64" stroke-width="1.2"/>
<path d="M 200,408 V 440" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 392,408 V 440" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 664,376 V 440" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="120" y="440" width="160" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="200" y="466" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service A</text>
<text x="200" y="482" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">weight: 90</text>

<rect x="312" y="440" width="160" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="392" y="466" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service B</text>
<text x="392" y="482" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">weight: 10</text>

<rect x="584" y="440" width="160" height="60" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="664" y="466" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Service C</text>
<text x="664" y="482" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">postgres:5432</text>

</svg>