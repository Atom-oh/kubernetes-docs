<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Resource Requests, Limits, and QoS</title>
<desc id="ddesc">Diagram showing how resource requests and limits set on a pod determine its QoS class, and how QoS class governs eviction order when a node runs short on resources.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
  </style>
