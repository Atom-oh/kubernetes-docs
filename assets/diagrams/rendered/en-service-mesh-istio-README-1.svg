<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mesh-compare-title mesh-compare-desc">
    <title id="mesh-compare-title">Complex microservices, with and without a mesh</title>
    <desc id="mesh-compare-desc">Comparison showing four services wiring mTLS, retries, and logging by hand without a mesh, versus a single service mesh applying those controls automatically to the same four services.</desc><defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style></defs>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Without mesh -->
    <rect x="40" y="60" width="400" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="164" y="68" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="240" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WITHOUT SERVICE MESH</text>

    <!-- Zone: With mesh -->
    <rect x="520" y="60" width="400" height="380" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="644" y="68" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="77" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WITH SERVICE MESH</text>

    <!-- ===== LEFT ZONE: without mesh ===== -->
    <!-- Arrows (dashed manual) -->
    <path d="M 152,160 H 220 Q 228,160 228,168 V 176" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <path d="M 152,180 H 300 Q 308,180 308,188 V 196" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="232" y1="228" x2="232" y2="256" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="308" y1="228" x2="308" y2="256" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <rect x="164" y="164" width="52" height="12" rx="2" fill="#ffffff"/>
    <text x="190" y="173" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MANUAL</text>

    <!-- Nodes A1..D1 -->
    <rect x="88" y="136" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="152" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service A</text>

    <rect x="168" y="196" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="232" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service B</text>

    <rect x="244" y="196" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="308" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service C</text>

    <rect x="206" y="256" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="270" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service D</text>

    <!-- Caption / merged "Note1" annotation -->
    <text x="240" y="336" fill="#232F3E" font-size="14" font-style="italic" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Each service hand-wires</text>
    <text x="240" y="356" fill="#232F3E" font-size="14" font-style="italic" font-family="'Amazon Ember', sans-serif" text-anchor="middle">mTLS, retries &amp; logging —</text>
    <text x="240" y="376" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">duplicate code across teams</text>

    <!-- ===== RIGHT ZONE: with mesh ===== -->
    <!-- Arrows (solid automatic) -->
    <path d="M 632,160 H 700 Q 708,160 708,168 V 176" fill="none" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 632,180 H 780 Q 788,180 788,188 V 196" fill="none" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="712" y1="228" x2="712" y2="256" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="788" y1="228" x2="788" y2="256" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="676" y="182" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="708" y="191" fill="#232F3E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTOMATIC</text>

    <!-- SM control node (focal, top) + dashed control fan to A2..D2 -->
    <path d="M 686,336 Q 678,336 678,328 V 236" fill="none" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
    <path d="M 706,336 Q 706,300 712,296 V 236" fill="none" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
    <path d="M 754,336 Q 762,300 788,296 V 236" fill="none" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
    <path d="M 774,336 Q 800,300 780,180 Q 780,172 772,172 H 632" fill="none" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

    <rect x="700" y="316" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="720" y="325" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONTROL</text>

    <!-- Nodes A2..D2 -->
    <rect x="568" y="136" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="632" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service A</text>

    <rect x="648" y="196" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="712" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service B</text>

    <rect x="724" y="196" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="788" y="220" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service C</text>

    <rect x="686" y="256" width="128" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="750" y="280" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service D</text>

    <!-- SM focal node -->
    <rect x="670" y="336" width="160" height="44" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="750" y="356" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', sans-serif" text-anchor="middle">Service Mesh</text>
    <text x="750" y="370" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mTLS · policy · observability</text>

    <text x="750" y="416" fill="#232F3E" font-size="14" font-style="italic" font-family="'Amazon Ember', sans-serif" text-anchor="middle">One control point applies mTLS,</text>
    <text x="750" y="436" fill="#232F3E" font-size="14" font-style="italic" font-family="'Amazon Ember', sans-serif" text-anchor="middle">retries &amp; logging to every service</text>

    <!-- Legend -->
    <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="488" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <line x1="140" y1="486" x2="168" y2="486" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="176" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Manual wiring per pair</text>
    <line x1="380" y1="486" x2="408" y2="486" stroke="#232F3E" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="416" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Mesh-handled traffic</text>
    <line x1="616" y1="486" x2="644" y2="486" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
    <text x="652" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Sidecar control &amp; policy</text>
    <rect x="828" y="480" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="860" y="490" fill="#545B64" font-size="8.5" font-family="'Amazon Ember', sans-serif">Focal</text>
  </svg>