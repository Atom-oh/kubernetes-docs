      <title id="en-networking-calico-02-architecture-0-title">Calico full architecture</title>
      <desc id="en-networking-calico-02-architecture-0-desc">Architecture diagram showing Kubernetes control plane, Calico control plane (API server, kube-controllers, Typha), and a representative worker node where Felix programs the local data plane and confd/BIRD distribute routes over a BGP mesh between nodes.</desc>
