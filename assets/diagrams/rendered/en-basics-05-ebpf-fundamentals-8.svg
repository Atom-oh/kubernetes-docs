<title id="en-basics-05-ebpf-fundamentals-8-title">Tetragon architecture</title>
<desc id="en-basics-05-ebpf-fundamentals-8-desc">Architecture diagram showing a TracingPolicy custom resource configuring the Tetragon agent, which programs eBPF sensors; those sensors trace process execution, network activity, and file access, enforcing policy by killing processes, blocking network connections, or denying file access.</desc>
