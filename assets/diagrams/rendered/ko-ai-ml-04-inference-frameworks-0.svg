<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="eco-title eco-desc">
    <title id="eco-title">LLM 추론 프레임워크 생태계</title>
    <desc id="eco-desc">NVIDIA Dynamo가 vLLM, SGLang, TensorRT-LLM 서빙 프레임워크를 오케스트레이션하고, LiteLLM 게이트웨이가 여러 백엔드로 요청을 라우팅하며, Karpenter가 GPU 노드를 프로비저닝하는 관계를 보여주는 다이어그램.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zones -->
    <rect x="40" y="96" width="560" height="204" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="196" y="100" width="248" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">서빙 프레임워크 (NVIDIA · 오픈소스)</text>

    <rect x="640" y="96" width="280" height="212" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="720" y="100" width="120" height="12" rx="2" fill="#ffffff"/>
    <text x="780" y="109" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">AWS 네이티브</text>

    <rect x="40" y="360" width="880" height="124" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="404" y="364" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="480" y="373" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">운영 · 게이트웨이</text>

    <!-- Arrows (behind nodes) -->
    <!-- NIM -> TensorRT-LLM (same row, straight) -->
    <line x1="220" y1="164" x2="244" y2="164" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Dynamo -> TensorRT-LLM (accent, focal) same row straight -->
    <line x1="384" y1="164" x2="408" y2="164" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Dynamo -> vLLM (down-left elbow) -->
    <path d="M 314,196 V 236 Q 314,244 306,244 H 260" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Dynamo -> SGLang (down-right elbow) -->
    <path d="M 330,196 V 220 Q 330,228 338,228 H 400" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- LiteLLM -> vLLM (up elbow, dashed link) -->
    <path d="M 200,376 V 320 Q 200,312 208,312 H 208" fill="none" stroke="#0972D3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
    <path d="M 200,376 V 312 Q 200,304 192,304 H 208 V 284" fill="none" stroke="#0972D3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
    <!-- LiteLLM -> SGLang -->
    <path d="M 240,376 V 340 Q 240,332 248,332 H 372 Q 380,332 380,324 V 284" fill="none" stroke="#0972D3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
    <!-- LiteLLM -> NIM -->
    <path d="M 280,376 V 328 Q 280,320 288,320 H 156 Q 148,320 148,312 V 196" fill="none" stroke="#0972D3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>

    <!-- Karpenter -> Dynamo (dashed, provisioning) -->
    <path d="M 700,360 V 320 Q 700,312 692,312 H 330 Q 322,312 322,304 V 196" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Neuron/Inferentia2 -> SageMaker -->
    <line x1="780" y1="204" x2="780" y2="228" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="128" y="298" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="150" y="307" fill="#0972D3" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

    <rect x="614" y="298" width="44" height="12" rx="2" fill="#ffffff"/>
    <text x="636" y="307" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PROVISION</text>

    <rect x="756" y="210" width="48" height="12" rx="2" fill="#ffffff"/>
    <text x="780" y="219" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DEPLOY</text>

    <!-- Nodes: Zone A row1 -->
    <rect x="80" y="132" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="80" y="132" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="150" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">NVIDIA NIM</text>
    <text x="150" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">추론 마이크로서비스</text>

    <rect x="244" y="132" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="244" y="132" width="140" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="314" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">NVIDIA Dynamo</text>
    <text x="314" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">추론 오케스트레이터</text>

    <rect x="408" y="132" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="408" y="132" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="478" y="160" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">TensorRT-LLM</text>
    <text x="478" y="176" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">추론 엔진</text>

    <!-- Zone A row2 -->
    <rect x="160" y="220" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="160" y="220" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="230" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">vLLM</text>
    <text x="230" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">오픈소스 서빙</text>

    <rect x="324" y="220" width="140" height="64" rx="6" fill="#ffffff"/>
    <rect x="324" y="220" width="140" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="394" y="248" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">SGLang</text>
    <text x="394" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">오픈소스 서빙</text>

    <!-- Zone B nodes -->
    <rect x="664" y="140" width="232" height="64" rx="6" fill="#ffffff"/>
    <rect x="664" y="140" width="232" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="780" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Neuron SDK · Inferentia2</text>
    <text x="780" y="184" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">AWS 전용 가속기</text>

    <rect x="664" y="228" width="232" height="64" rx="6" fill="#ffffff"/>
    <rect x="664" y="228" width="232" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="780" y="256" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">SageMaker</text>
    <text x="780" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">완전관리형 배포</text>

    <!-- Zone C nodes -->
    <rect x="120" y="376" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="120" y="376" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="220" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">LiteLLM</text>
    <text x="220" y="420" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">멀티 백엔드 게이트웨이</text>

    <rect x="600" y="376" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="376" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="700" y="404" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',sans-serif" text-anchor="middle">Karpenter</text>
    <text x="700" y="420" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">GPU 노드 오토스케일링</text>

    <!-- Legend -->
    <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="528" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="544" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">오케스트레이터 (focal)</text>

    <rect x="256" y="544" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="276" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">프레임워크 / 도구</text>

    <rect x="420" y="544" width="14" height="10" rx="2" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <text x="440" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">오픈소스 백엔드</text>

    <line x1="600" y1="550" x2="628" y2="550" stroke="#0972D3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
    <text x="636" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">라우팅</text>

    <line x1="732" y1="550" x2="760" y2="550" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="768" y="552" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',sans-serif">프로비저닝</text>
  </svg>