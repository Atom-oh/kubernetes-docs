<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bgp-path-select-title bgp-path-select-desc">
    <title id="bgp-path-select-title">BGP Best-Path Selection Cascade</title>
    <desc id="bgp-path-select-desc">A BGP speaker with multiple routes to the same destination evaluates seven tie-breaking criteria in order, moving to the next criterion on a tie, until one route is selected as best.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ===== connectors (drawn before nodes) ===== -->
    <!-- Row 1: A-B-C-D-E, left to right, y=160 -->
    <line x1="204" y1="160" x2="228" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="380" y1="160" x2="404" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="556" y1="160" x2="580" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="732" y1="160" x2="756" y2="160" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- vertical drop E -> F, x=832 -->
    <line x1="832" y1="196" x2="832" y2="344" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Row 2: F-G-H-I, right to left, y=380 -->
    <line x1="756" y1="380" x2="732" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="580" y1="380" x2="556" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="404" y1="380" x2="380" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- ===== TIE labels (mask + 6-10px gap above/beside stroke) ===== -->
    <!-- B-C -->
    <rect x="374" y="140" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="392" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TIE</text>
    <!-- C-D -->
    <rect x="550" y="140" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="568" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TIE</text>
    <!-- D-E -->
    <rect x="726" y="140" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="744" y="149" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TIE</text>
    <!-- E-F vertical: label beside line, gap to the right -->
    <rect x="844" y="264" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="862" y="273" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TIE</text>
    <!-- F-G -->
    <rect x="726" y="360" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="744" y="369" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TIE</text>
    <!-- G-H -->
    <rect x="550" y="360" width="36" height="12" rx="2" fill="#ffffff"/>
    <text x="568" y="369" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TIE</text>

    <!-- ===== nodes ===== -->
    <!-- idx0: Start oval -->
    <ellipse cx="128" cy="160" rx="76" ry="36" fill="#ffffff"/>
    <ellipse cx="128" cy="160" rx="76" ry="36" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="128" y="157" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Multiple Routes</text>
    <text x="128" y="171" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Received</text>

    <!-- idx1 row1: Highest Weight? diamond -->
    <polygon points="304,124 380,160 304,196 228,160" fill="#ffffff"/>
    <polygon points="304,124 380,160 304,196 228,160" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="304" y="157" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Highest</text>
    <text x="304" y="171" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Weight?</text>

    <!-- idx2 row1: LOCAL_PREF -->
    <polygon points="480,124 556,160 480,196 404,160" fill="#ffffff"/>
    <polygon points="480,124 556,160 480,196 404,160" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="157" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Highest</text>
    <text x="480" y="171" fill="#232F3E" font-size="10" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">LOCAL_PREF?</text>

    <!-- idx3 row1: Local origin + AS_PATH length -->
    <polygon points="656,124 732,160 656,196 580,160" fill="#ffffff"/>
    <polygon points="656,124 732,160 656,196 580,160" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="656" y="154" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Local origin &amp;</text>
    <text x="656" y="168" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">shorter AS_PATH?</text>

    <!-- idx4 row1: Origin type + MED -->
    <polygon points="832,124 908,160 832,196 756,160" fill="#ffffff"/>
    <polygon points="832,124 908,160 832,196 756,160" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="832" y="154" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Origin type &amp;</text>
    <text x="832" y="168" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">lower MED?</text>

    <!-- row2 idx4: eBGP over iBGP -->
    <polygon points="832,344 908,380 832,416 756,380" fill="#ffffff"/>
    <polygon points="832,344 908,380 832,416 756,380" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="832" y="374" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">eBGP over</text>
    <text x="832" y="388" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">iBGP?</text>

    <!-- row2 idx3: IGP metric + route age -->
    <polygon points="656,344 732,380 656,416 580,380" fill="#ffffff"/>
    <polygon points="656,344 732,380 656,416 580,380" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="656" y="374" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Lower IGP metric &amp;</text>
    <text x="656" y="388" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">older route?</text>

    <!-- row2 idx2: Lowest Router ID -->
    <polygon points="480,344 556,380 480,416 404,380" fill="#ffffff"/>
    <polygon points="480,344 556,380 480,416 404,380" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="374" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Lowest</text>
    <text x="480" y="388" fill="#232F3E" font-size="10" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">Router ID?</text>

    <!-- row2 idx1: End oval, focal -->
    <ellipse cx="304" cy="380" rx="76" ry="36" fill="#ffffff"/>
    <ellipse cx="304" cy="380" rx="76" ry="36" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="304" y="377" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Select Best</text>
    <text x="304" y="391" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Route</text>

    <!-- ===== legend ===== -->
    <line x1="30" y1="472" x2="930" y2="472" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="492" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <ellipse cx="220" cy="490" rx="9" ry="6" fill="#ffffff" stroke="#7D8998" stroke-width="1"/>
    <text x="238" y="493" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Start / end of evaluation</text>
    <polygon points="450,484 462,490 450,496 438,490" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="474" y="493" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Tie-break criterion</text>
    <rect x="690" y="484" width="30" height="12" rx="2" fill="#ffffff"/>
    <text x="705" y="493" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TIE</text>
    <text x="730" y="493" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Advances to next criterion</text>

  </svg>