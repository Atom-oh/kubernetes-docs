<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="otel-title otel-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="otel-title">OpenTelemetry Collector pipeline from application SDKs to trace, log, and metric backends</title>
    <desc id="otel-desc">Application services send OTLP data through the OTel Collector's receive, batch, and attribute stages into tail sampling, which decides what survives and routes surviving spans to Tempo/Jaeger, AWS X-Ray, or a Prometheus exporter.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>
    <rect width="960" height="600" fill="#ffffff"/>

    <text x="480" y="56" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OTEL COLLECTOR PIPELINE</text>

    <!-- ===== Row 1 connectors (pipeline) ===== -->
    <path d="M 200,112 H 232" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 376,112 H 408" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 552,112 H 584" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 728,112 H 760" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- ===== Fan-out: Tail Sampling -> 3 backends ===== -->
    <path d="M 796,144 V 276 Q 796,284 788,284 H 196 Q 188,284 188,292 V 420"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 832,144 V 288 Q 832,296 824,296 H 488 Q 480,296 480,304 V 420"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 868,144 V 304 Q 868,312 860,312 H 788 Q 780,312 780,320 V 420"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- ===== Row 1 nodes ===== -->
    <rect x="56" y="80" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="56" y="80" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="128" y="106" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>
    <text x="128" y="122" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Services</text>
    <text x="128" y="136" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">A · B · C (OTel SDK)</text>

    <rect x="232" y="80" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="232" y="80" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="304" y="108" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Receivers</text>
    <text x="304" y="126" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">OTLP · Jaeger · Zipkin</text>

    <rect x="408" y="80" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="408" y="80" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="480" y="108" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Batch Processor</text>
    <text x="480" y="126" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">perf. optimization</text>

    <rect x="584" y="80" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="584" y="80" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="656" y="108" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Attributes</text>
    <text x="656" y="126" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">add / remove fields</text>

    <!-- Tail Sampling (focal) -->
    <rect x="760" y="80" width="144" height="64" rx="6" fill="#ffffff"/>
    <rect x="760" y="80" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="832" y="108" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tail Sampling</text>
    <text x="832" y="126" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">keep errors / slow / crit.</text>

    <!-- ===== Row 2 backend nodes ===== -->
    <rect x="80" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)"/>
    <rect x="80" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="180" y="448" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Tempo / Jaeger</text>
    <text x="180" y="466" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">OTLP exporter</text>

    <rect x="380" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)"/>
    <rect x="380" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="480" y="448" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">AWS X-Ray</text>
    <text x="480" y="466" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">X-Ray exporter</text>

    <rect x="680" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)"/>
    <rect x="680" y="420" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="780" y="448" fill="#232F3E" font-size="12" font-weight="600"
          font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
    <text x="780" y="466" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">metrics exporter</text>

    <!-- Legend -->
    <line x1="24" y1="520" x2="936" y2="520" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="24" y="538" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="535" x2="172" y2="535" stroke="#EC7211" stroke-width="1.2"/>
    <text x="182" y="538" fill="#545B64" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Tail-sampling decision &amp; its routed output</text>
  </svg>