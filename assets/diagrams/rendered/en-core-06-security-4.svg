<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">NetworkPolicy Traffic Control</title>
<desc id="d">A NetworkPolicy selects a target Pod and defines separate ingress and egress rules, and here it is applied to an API Pod to allow only inbound traffic from a Frontend Pod and only outbound traffic to a Database Pod.</desc>
<rect width="960" height="600" fill="#ffffff"/>

<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

<text x="40" y="34" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CORE · SECURITY</text>
<text x="40" y="58" fill="#232F3E" font-size="20" font-weight="700">NetworkPolicy Traffic Control</text>

<!-- ===== Zone: Pod-to-pod traffic ===== -->
<rect x="60" y="380" width="840" height="140" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="404" y="384" width="152" height="12" rx="2" fill="#ffffff"/>
<text x="480" y="393" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">POD-TO-POD TRAFFIC</text>

<!-- ===== Arrows ===== -->
<!-- NP -> Ingress / Egress -->
<path d="M 400,164 H 330 Q 322,164 322,172 V 200" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 560,164 H 630 Q 638,164 638,172 V 200" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- NP -> API pod (applies to, routed right and down into zone) -->
<path d="M 560,140 H 860 Q 868,140 868,148 V 406 Q 868,414 860,414 H 488 Q 480,414 480,422" fill="none" stroke="#EC7211" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

<!-- Frontend -> API -> DB (traffic chain, straight horizontal within zone) -->
<line x1="240" y1="450" x2="380" y2="450" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="580" y1="450" x2="720" y2="450" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Arrow labels -->
<rect x="298" y="174" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="318" y="183" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SELECTS</text>

<rect x="614" y="174" width="40" height="12" rx="2" fill="#ffffff"/>
<text x="634" y="183" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DEFINES</text>

<rect x="836" y="270" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="860" y="279" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">APPLIES TO</text>

<rect x="286" y="440" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="310" y="449" fill="#0972D3" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">:8080</text>

<rect x="626" y="440" width="48" height="12" rx="2" fill="#ffffff"/>
<text x="650" y="449" fill="#0972D3" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">:5432</text>

<!-- ===== Nodes ===== -->
<g>
<!-- NetworkPolicy (focal) -->
<rect x="400" y="116" width="160" height="48" rx="6" fill="#ffffff"/>
<rect x="400" y="116" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="480" y="136" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">NetworkPolicy</text>
<text x="480" y="152" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">api-allow</text>

<!-- Ingress rules -->
<rect x="222" y="200" width="200" height="72" rx="6" fill="#ffffff"/>
<rect x="222" y="200" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="322" y="222" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Ingress Rules</text>
<text x="322" y="240" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">from: podSelector</text>
<text x="322" y="252" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">namespaceSelector · ipBlock</text>
<text x="322" y="264" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">ports: [8080]</text>

<!-- Egress rules -->
<rect x="558" y="200" width="200" height="72" rx="6" fill="#ffffff"/>
<rect x="558" y="200" width="200" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="658" y="222" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Egress Rules</text>
<text x="658" y="240" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">to: podSelector</text>
<text x="658" y="252" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">namespaceSelector · ipBlock</text>
<text x="658" y="264" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">ports: [5432]</text>

<!-- Frontend Pod -->
<rect x="100" y="422" width="140" height="56" rx="6" fill="#ffffff"/>
<rect x="100" y="422" width="140" height="56" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
<text x="170" y="446" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Frontend Pod</text>
<text x="170" y="462" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">app: frontend</text>

<!-- API Pod -->
<rect x="410" y="422" width="140" height="56" rx="6" fill="#ffffff"/>
<rect x="410" y="422" width="140" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="480" y="446" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">API Pod</text>
<text x="480" y="462" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">app: api</text>

<!-- DB Pod -->
<rect x="720" y="422" width="140" height="56" rx="6" fill="#ffffff"/>
<rect x="720" y="422" width="140" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
<text x="790" y="446" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Database Pod</text>
<text x="790" y="462" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">app: database</text>
</g>
</svg>