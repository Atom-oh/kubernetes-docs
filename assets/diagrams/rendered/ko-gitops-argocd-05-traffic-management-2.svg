<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="canary-traffic-title canary-traffic-desc">
      <title id="canary-traffic-title">카나리 배포 트래픽 분배</title>
      <desc id="canary-traffic-desc">로드 밸런서가 안정 버전 v1.0.0 파드 4개에 80%, 카나리 버전 v2.0.0 파드 1개에 20%의 트래픽을 분배하는 구조를 보여주는 다이어그램입니다.</desc>
      <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zones -->
      <rect x="240" y="88" width="680" height="160" rx="8" fill="#f2f3f3" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
      <text x="252" y="104" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">STABLE · V1.0.0</text>

      <rect x="240" y="280" width="680" height="120" rx="8" fill="#f2f3f3" stroke="rgba(35,47,62,0.12)" stroke-width="1"/>
      <text x="252" y="296" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">CANARY · V2.0.0</text>

      <!-- Arrows -->
      <path d="M180,248 H202 Q210,248 210,240 V172 Q210,164 218,164 H240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M180,272 H202 Q210,272 210,280 V344 Q210,352 218,352 H240" fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="196" y="200" width="28" height="12" rx="2" fill="#ffffff"/>
      <text x="210" y="209" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">80%</text>

      <rect x="196" y="306" width="28" height="12" rx="2" fill="#ffffff"/>
      <text x="210" y="315" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">20%</text>

      <!-- Load balancer -->
      <rect x="40" y="236" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="110" y="260" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Load</text>
      <text x="110" y="274" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Balancer</text>

      <!-- Stable pods -->
      <rect x="280" y="140" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="340" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 1</text>

      <rect x="440" y="140" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="500" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 2</text>

      <rect x="600" y="140" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="660" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 3</text>

      <rect x="760" y="140" width="120" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="820" y="168" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 4</text>

      <!-- Canary pod (focal) -->
      <rect x="520" y="328" width="120" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.4"/>
      <text x="580" y="356" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod 1</text>

      <!-- Legend -->
      <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND</text>

      <rect x="40" y="472" width="24" height="12" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="72" y="482" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Stable 파드 (v1.0.0)</text>

      <rect x="260" y="472" width="24" height="12" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.4"/>
      <text x="292" y="482" fill="#545B64" font-size="8.5" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Canary 파드 (v2.0.0)</text>
    </svg>