<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="en-networking-README-1-title en-networking-README-1-desc">
<title id="en-networking-README-1-title">Pod-to-Pod Networking</title>
<desc id="en-networking-README-1-desc">Four pods spread across two worker nodes each hold a unique cluster IP and can reach every other pod directly, whether it lives on the same node or a different one.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
<marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- zones -->
<rect x="80" y="140" width="360" height="248" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="92" y="148" width="70" height="12" rx="2" fill="#ffffff"/>
<text x="127" y="157" fill="rgba(35,47,62,0.4)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">NODE 1</text>

<rect x="520" y="140" width="360" height="248" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="532" y="148" width="70" height="12" rx="2" fill="#ffffff"/>
<text x="567" y="157" fill="rgba(35,47,62,0.4)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">NODE 2</text>

<!-- connectors: all straight, same axis -->
<line x1="320" y1="212" x2="640" y2="212" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<line x1="320" y1="332" x2="640" y2="332" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<line x1="240" y1="244" x2="240" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
<line x1="720" y1="244" x2="720" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>

<!-- Pod A -->
<rect x="160" y="180" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="160" y="180" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="240" y="206" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod A</text>
<text x="240" y="222" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.1.10</text>

<!-- Pod B -->
<rect x="160" y="300" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="160" y="300" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="240" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod B</text>
<text x="240" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.1.11</text>

<!-- Pod C -->
<rect x="640" y="180" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="640" y="180" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="720" y="206" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod C</text>
<text x="720" y="222" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.2.10</text>

<!-- Pod D -->
<rect x="640" y="300" width="160" height="64" rx="6" fill="#ffffff"/>
<rect x="640" y="300" width="160" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="720" y="326" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Pod D</text>
<text x="720" y="342" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.244.2.11</text>

<text x="480" y="452" fill="#7D8998" font-size="9" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" font-style="italic">Every pod reaches every other pod directly, without NAT, regardless of node.</text>
</svg>