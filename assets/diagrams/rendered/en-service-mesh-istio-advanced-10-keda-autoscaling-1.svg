<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="keda-rps-title keda-rps-desc">
      <title id="keda-rps-title">RPS-based scaling decision loop</title>
      <desc id="keda-rps-desc">A polling loop collects RPS metrics, checks the RPS against a scale-out threshold and a scale-in threshold, adjusts replica count when a threshold is crossed, then waits and repeats.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Edges (drawn before boxes) -->

      <!-- Start -> Query -->
      <line x1="380" y1="112" x2="380" y2="152" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Query -> Check -->
      <line x1="380" y1="200" x2="380" y2="228" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Check -> ScaleOut (YES, accent happy path) -->
      <line x1="460" y1="268" x2="616" y2="268" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="516" y="252" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="532" y="261" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <!-- Check -> Check2 (NO) -->
      <line x1="380" y1="308" x2="380" y2="328" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="392" y="306" width="28" height="12" rx="2" fill="#ffffff"/>
      <text x="406" y="315" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <!-- Check2 -> ScaleIn (YES) -->
      <line x1="460" y1="368" x2="796" y2="368" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="612" y="352" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="628" y="361" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <!-- Check2 -> Wait (NO) -->
      <line x1="380" y1="408" x2="380" y2="456" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="392" y="424" width="28" height="12" rx="2" fill="#ffffff"/>
      <text x="406" y="433" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <!-- ScaleOut -> Wait (elbow, accent) -->
      <path d="M700,292 L700,460 Q700,468 692,468 L460,468" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- ScaleIn -> Wait (elbow) -->
      <path d="M870,392 L870,484 Q870,492 862,492 L460,492" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Wait -> Start (loop back, elbow) -->
      <path d="M300,480 L128,480 Q120,480 120,472 L120,96 Q120,88 128,88 L300,88" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Nodes -->
      <g font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">
        <!-- Start: Collect Metrics -->
        <rect x="300" y="64" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="300" y="64" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="380" y="92" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Collect Metrics</text>

        <!-- Query -->
        <rect x="300" y="152" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="300" y="152" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="380" y="172" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Execute PromQL</text>
        <text x="380" y="188" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Query</text>

        <!-- Check diamond (focal) -->
        <polygon points="380,228 460,268 380,308 300,268" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
        <text x="380" y="272" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">RPS &gt; 100?</text>

        <!-- ScaleOut (focal outcome) -->
        <rect x="620" y="244" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)"/>
        <rect x="620" y="244" width="160" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
        <text x="700" y="264" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Increase</text>
        <text x="700" y="280" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Replicas</text>

        <!-- Check2 diamond -->
        <polygon points="380,328 460,368 380,408 300,368" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="380" y="372" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">RPS &lt; 50?</text>

        <!-- ScaleIn -->
        <rect x="800" y="344" width="140" height="48" rx="6" fill="#ffffff"/>
        <rect x="800" y="344" width="140" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="870" y="364" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Decrease</text>
        <text x="870" y="380" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Replicas</text>

        <!-- Wait -->
        <rect x="300" y="456" width="160" height="48" rx="6" fill="rgba(35,47,62,0.05)"/>
        <rect x="300" y="456" width="160" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
        <text x="380" y="476" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Wait</text>
        <text x="380" y="492" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pollingInterval</text>
      </g>

      <!-- Legend -->
      <line x1="30" y1="536" x2="930" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="30" y="554" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="544" width="16" height="12" rx="3" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="164" y="554" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">ACTION</text>
      <polygon points="272,544 288,550 272,556 256,550" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="296" y="554" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">DECISION</text>
      <rect x="404" y="544" width="16" height="12" rx="3" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="428" y="554" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">SCALE-OUT PATH</text>
    </svg>