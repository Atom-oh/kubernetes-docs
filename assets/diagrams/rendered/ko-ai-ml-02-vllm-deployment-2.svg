<title id="ko-ai-ml-02-vllm-deployment-2-title">EKS 위의 vLLM 인프라</title>
<desc id="ko-ai-ml-02-vllm-deployment-2-desc">EKS 컨트롤 플레인이 GPU/CPU 노드 그룹에 워크로드를 스케줄링하고, GPU 노드가 FSx for Lustre에서 모델을 불러오며 ECR과 CloudWatch 같은 AWS 관리형 서비스가 이를 지원하는 구조를 보여주는 다이어그램</desc>
