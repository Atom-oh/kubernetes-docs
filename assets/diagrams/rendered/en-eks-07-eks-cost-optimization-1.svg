<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="en-eks-07-eks-cost-optimization-1-title en-eks-07-eks-cost-optimization-1-desc">
<title id="en-eks-07-eks-cost-optimization-1-title">FinOps Principles Mapping</title>
<desc id="en-eks-07-eks-cost-optimization-1-desc">Diagram mapping six FinOps core principles on the left to five EKS implementation methods on the right, showing which implementation method operationalizes each principle.</desc>
<defs>
<style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
</marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- zone labels -->
<text x="140" y="40" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">FINOPS CORE PRINCIPLES</text>
<text x="820" y="40" fill="#7D8998" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">EKS IMPLEMENTATION METHODS</text>

<!-- connectors (drawn before boxes) -->
<!-- Visibility(88) -> Tagging(88) straight -->
<line x1="240" y1="88" x2="720" y2="88" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- Accountability(184) -> Allocation(184) straight -->
<line x1="240" y1="184" x2="720" y2="184" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- Optimization(280) -> Automation(280) straight -->
<line x1="240" y1="280" x2="720" y2="280" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- Forecasting(376) -> Monitoring(412 attach) elbow down -->
<path d="M 240 376 H 620 Q 628 376 628 384 V 404 Q 628 412 636 412 H 720" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- RealTime(472) -> Monitoring(436 attach) elbow up -->
<path d="M 240 472 H 620 Q 628 472 628 464 V 444 Q 628 436 636 436 H 720" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
<!-- Culture(568) -> Governance(568) straight -->
<line x1="240" y1="568" x2="720" y2="568" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

<!-- left column: FinOps Core Principles -->
<!-- Visibility -->
<rect x="40" y="60" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="40" y="60" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="140" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Visibility &amp; Transparency</text>

<!-- Accountability -->
<rect x="40" y="156" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="40" y="156" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="140" y="188" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Shared Accountability</text>

<!-- Optimization (focal / accent) -->
<rect x="40" y="252" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="40" y="252" width="200" height="56" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="140" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Continuous Optimization</text>

<!-- Forecasting -->
<rect x="40" y="348" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="40" y="348" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="140" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Forecasting &amp; Planning</text>

<!-- RealTime -->
<rect x="40" y="444" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="40" y="444" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="140" y="476" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Real-time Decisions</text>

<!-- Culture -->
<rect x="40" y="540" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="40" y="540" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="140" y="572" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cost-aware Culture</text>

<!-- right column: Implementation Methods -->
<!-- Tagging -->
<rect x="720" y="60" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="720" y="60" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="820" y="92" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Resource Tagging</text>

<!-- Allocation -->
<rect x="720" y="156" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="720" y="156" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="820" y="188" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cost Allocation</text>

<!-- Automation -->
<rect x="720" y="252" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="720" y="252" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="820" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Automated Optimization</text>

<!-- Monitoring (spans between Forecasting/RealTime, receives 2 arrows) -->
<rect x="720" y="368" width="200" height="80" rx="6" fill="#ffffff"/>
<rect x="720" y="368" width="200" height="80" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="820" y="412" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Cost Monitoring Tools</text>

<!-- Governance -->
<rect x="720" y="540" width="200" height="56" rx="6" fill="#ffffff"/>
<rect x="720" y="540" width="200" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="820" y="572" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Governance Policies</text>

</svg>