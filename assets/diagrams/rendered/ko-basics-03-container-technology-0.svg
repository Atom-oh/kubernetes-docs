<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-title layers-desc">
  <title id="layers-title">컨테이너 이미지 레이어 구조</title>
  <desc id="layers-desc">컨테이너 이미지가 응용 프로그램, 의존성, 런타임, OS 순서로 쌓인 4개 레이어로 구성되며, 런타임 레이어가 애플리케이션 코드와 OS 사이를 잇는 핵심 계층임을 보여준다.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

  <rect width="960" height="600" fill="var(--paper)"/>

  <!-- Eyebrow + Title -->
  <text x="40" y="52" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" letter-spacing="0.18em">LAYER STACK · CONTAINER IMAGE</text>
  <text x="40" y="86" fill="var(--ink)" font-size="20" font-weight="700" font-family="var(--font-sans)">컨테이너 이미지의 레이어 구조</text>

  <!-- Direction column (left margin) -->
  <text x="40" y="150" fill="var(--soft)" font-size="8" font-family="var(--font-mono)" letter-spacing="0.16em">자주 변경</text>
  <line x1="64" y1="164" x2="64" y2="496" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <polygon points="60,164 68,164 64,156" fill="var(--soft)"/>
  <text x="40" y="514" fill="var(--soft)" font-size="8" font-family="var(--font-mono)" letter-spacing="0.16em">공유 자원</text>

  <!-- Stack container hairlines (top + bottom edges) -->
  <line x1="104" y1="152" x2="920" y2="152" stroke="var(--rule-solid)" stroke-width="1"/>
  <line x1="104" y1="496" x2="920" y2="496" stroke="var(--rule-solid)" stroke-width="1"/>

  <!-- L1 — 응용 프로그램 레이어 -->
  <rect x="104" y="152" width="816" height="86" fill="var(--paper)"/>
  <line x1="104" y1="238" x2="920" y2="238" stroke="var(--rule)" stroke-width="1"/>
  <text x="128" y="188" fill="var(--muted)" font-size="9" font-family="var(--font-mono)" letter-spacing="0.14em">L1</text>
  <text x="128" y="212" fill="var(--ink)" font-size="15" font-weight="600" font-family="var(--font-sans)">응용 프로그램 레이어</text>
  <text x="892" y="212" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="end" letter-spacing="0.04em">애플리케이션 코드</text>

  <!-- L2 — 의존성 레이어 -->
  <rect x="104" y="238" width="816" height="86" fill="var(--paper-2)"/>
  <line x1="104" y1="324" x2="920" y2="324" stroke="var(--rule)" stroke-width="1"/>
  <text x="128" y="274" fill="var(--muted)" font-size="9" font-family="var(--font-mono)" letter-spacing="0.14em">L2</text>
  <text x="128" y="298" fill="var(--ink)" font-size="15" font-weight="600" font-family="var(--font-sans)">의존성 레이어</text>
  <text x="892" y="298" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="end" letter-spacing="0.04em">npm 패키지, pip 패키지 등</text>

  <!-- L3 — 런타임 레이어 (FOCAL) -->
  <rect x="104" y="324" width="816" height="86" fill="var(--accent-tint)"/>
  <rect x="104" y="324" width="816" height="86" fill="none" stroke="var(--accent)" stroke-width="1"/>
  <text x="128" y="360" fill="var(--accent)" font-size="9" font-weight="600" font-family="var(--font-mono)" letter-spacing="0.14em">L3</text>
  <text x="128" y="384" fill="var(--ink)" font-size="15" font-weight="600" font-family="var(--font-sans)">런타임 레이어</text>
  <text x="892" y="384" fill="var(--accent)" font-size="10" font-family="var(--font-mono)" text-anchor="end" letter-spacing="0.04em">Node.js, Python 등</text>

  <!-- L4 — OS 레이어 -->
  <rect x="104" y="410" width="816" height="86" fill="var(--paper-2)"/>
  <text x="128" y="446" fill="var(--muted)" font-size="9" font-family="var(--font-mono)" letter-spacing="0.14em">L4</text>
  <text x="128" y="470" fill="var(--ink)" font-size="15" font-weight="600" font-family="var(--font-sans)">OS 레이어</text>
  <text x="892" y="470" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="end" letter-spacing="0.04em">Ubuntu, Alpine 등</text>

  <!-- Caption / annotation -->
  <text x="104" y="548" fill="var(--accent)" font-size="8" font-family="var(--font-mono)" letter-spacing="0.18em">FOCAL LAYER</text>
  <text x="212" y="548" fill="var(--muted)" font-size="11" font-family="var(--font-sans)" font-style="italic">런타임 레이어는 애플리케이션 코드와 OS 사이를 이어, 언어별 실행 환경을 이미지에 고정시키는 계층입니다.</text>
</svg>