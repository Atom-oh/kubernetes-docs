<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch-arch-title ch-arch-desc" style="width:100%;height:auto;display:block;">
    <title id="ch-arch-title">ClickHouse cluster architecture</title>
    <desc id="ch-arch-desc">Log collectors buffer through an optional Kafka queue into a ZooKeeper-coordinated ClickHouse cluster, which writes to EBS, tiers cold data to S3, and answers queries from Grafana and Superset.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0972D3"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- ================= ARROWS (drawn before boxes) ================= -->

    <!-- Collectors -> Kafka Topic (vertical, same x) -->
    <path d="M 160,124 V 220" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="122" y="160" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="160" y="169" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INGEST</text>

    <!-- ZK Keeper -> Cluster (vertical, same x) -->
    <path d="M 500,124 V 220" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="424" y="160" width="104" height="12" rx="2" fill="#ffffff"/>
    <text x="476" y="169" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COORDINATE</text>

    <!-- Kafka Topic -> Cluster (horizontal, same y=252) -->
    <path d="M 260,252 H 380" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="284" y="228" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="237" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONSUME</text>

    <!-- Visualization -> Cluster (horizontal, same y=252, link-blue query) -->
    <path d="M 700,252 H 620" fill="none" stroke="#0972D3" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="628" y="228" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="660" y="237" fill="#0972D3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

    <!-- Cluster -> EBS (vertical, same x) -->
    <path d="M 500,320 V 400" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="466" y="348" width="68" height="12" rx="2" fill="#ffffff"/>
    <text x="500" y="357" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

    <!-- EBS -> S3 (vertical, same x) -->
    <path d="M 500,464 V 540" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="470" y="490" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="500" y="499" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIER</text>

    <!-- ================= NODES ================= -->

    <!-- Collectors (input) -->
    <rect x="60" y="60" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="60" width="200" height="64" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="68" y="66" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="82" y="75" fill="rgba(125,137,152,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
    <text x="160" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Collectors</text>
    <text x="160" y="110" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FluentBit / Vector / OTel</text>

    <!-- ZooKeeper / Keeper (store) -->
    <rect x="400" y="60" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="60" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="408" y="66" width="28" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
    <text x="422" y="75" fill="rgba(84,91,100,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CO</text>
    <text x="500" y="94" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ZooKeeper / Keeper</text>
    <text x="500" y="110" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shard coordination</text>

    <!-- Kafka Topic (optional) -->
    <rect x="60" y="220" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="60" y="220" width="200" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="68" y="226" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="82" y="235" fill="rgba(35,47,62,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MQ</text>
    <text x="160" y="254" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kafka Topic</text>
    <text x="160" y="270" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">buffer (optional)</text>

    <!-- ClickHouse Cluster (focal) -->
    <rect x="380" y="220" width="240" height="100" rx="6" fill="#ffffff"/>
    <rect x="380" y="220" width="240" height="100" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <rect x="392" y="230" width="36" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.40)" stroke-width="0.8"/>
    <text x="410" y="239" fill="rgba(236,114,17,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
    <text x="500" y="266" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ClickHouse Cluster</text>
    <text x="500" y="282" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 shards × 2 replicas</text>
    <text x="500" y="298" fill="#7D8998" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MergeTree engine</text>

    <!-- Visualization (backend) -->
    <rect x="700" y="220" width="200" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="708" y="226" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="724" y="235" fill="rgba(35,47,62,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIZ</text>
    <text x="800" y="254" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Visualization</text>
    <text x="800" y="270" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Grafana / Superset</text>

    <!-- EBS Hot (store) -->
    <rect x="400" y="400" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="400" width="200" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="408" y="406" width="32" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
    <text x="424" y="415" fill="rgba(84,91,100,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EBS</text>
    <text x="500" y="434" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">EBS — Hot Data</text>
    <text x="500" y="450" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">recent parts</text>

    <!-- S3 Cold (external) -->
    <rect x="400" y="540" width="200" height="64" rx="6" fill="#ffffff"/>
    <rect x="400" y="540" width="200" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="408" y="546" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="420" y="555" fill="rgba(35,47,62,0.7)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S3</text>
    <text x="500" y="574" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">S3 — Cold Data</text>
    <text x="500" y="590" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TTL-tiered storage</text>

    <!-- ================= LEGEND ================= -->
    <line x1="60" y1="626" x2="900" y2="626" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="60" y="642" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="220" cy="638" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="230" y="642" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">focal store</text>
    <circle cx="340" cy="638" r="4" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.30)" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="350" y="642" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">optional</text>
    <line x1="460" y1="638" x2="480" y2="638" stroke="#0972D3" stroke-width="1.2"/>
    <text x="486" y="642" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">query / API call</text>
    <line x1="640" y1="638" x2="660" y2="638" stroke="#545B64" stroke-width="1"  stroke-dasharray="4,3"/>
    <text x="666" y="642" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">coordination</text>
  </svg>