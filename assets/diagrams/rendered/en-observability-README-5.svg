<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d5-title d5-desc">
      <title id="d5-title">Observability maturity model, four levels</title>
      <desc id="d5-desc">Organizations progress from basic monitoring, to centralized log and metric collection, to trace-ID-linked correlation across the three pillars, and finally to AIOps with ML-based anomaly analysis.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>
      <rect width="960" height="600" fill="#ffffff"/>

      <!-- Arrows (behind nodes) -->
      <line x1="220" y1="300" x2="332" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="228" y="280" width="96" height="12" rx="2" fill="#ffffff"/>
      <text x="276" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.03em">LOG/METRIC</text>

      <line x1="452" y1="300" x2="564" y2="300" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="460" y="280" width="96" height="12" rx="2" fill="#ffffff"/>
      <text x="508" y="289" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.03em">TRACE ID</text>

      <line x1="684" y1="300" x2="796" y2="300" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="692" y="280" width="96" height="12" rx="2" fill="#ffffff"/>
      <text x="740" y="289" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.03em">ML-BASED</text>

      <!-- Nodes -->
      <g>
        <rect x="32" y="264" width="188" height="72" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
        <text x="126" y="292" fill="#232F3E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">LEVEL 1</text>
        <text x="126" y="310" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Basic Monitoring</text>
      </g>
      <g>
        <rect x="332" y="264" width="120" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="392" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">LEVEL 2</text>
        <text x="392" y="310" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Centralization</text>
      </g>
      <g>
        <rect x="564" y="264" width="120" height="72" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
        <text x="624" y="292" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">LEVEL 3</text>
        <text x="624" y="310" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">Correlation</text>
      </g>
      <g>
        <rect x="796" y="264" width="132" height="72" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
        <text x="862" y="292" fill="#EC7211" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">LEVEL 4</text>
        <text x="862" y="310" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember',sans-serif" text-anchor="middle">AIOps</text>
      </g>

      <!-- Legend -->
      <line x1="32" y1="420" x2="928" y2="420" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="32" y="436" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="32" y="446" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
      <text x="52" y="454" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">Target maturity (focal)</text>

      <rect x="240" y="446" width="14" height="10" rx="2" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
      <text x="260" y="454" fill="#545B64" font-size="8.5" font-family="'Amazon Ember',sans-serif">Starting point</text>
    </svg>