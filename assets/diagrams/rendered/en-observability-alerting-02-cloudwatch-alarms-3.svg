<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cwa3-title cwa3-desc">
    <title id="cwa3-title">Anomaly Detection Flow</title>
    <desc id="cwa3-desc">A learning phase trains an ML model on historical data to produce an expected band, and a detection phase checks current metrics against that band, raising an anomaly alert when they fall outside it or marking the metric normal when they fall within it.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="cwa3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ============ ZONES ============ -->
    <rect x="40" y="40" width="660" height="160" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="48" y="44" width="108" height="12" rx="2" fill="#ffffff"/>
    <text x="102" y="53" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">LEARNING PHASE</text>

    <rect x="240" y="220" width="680" height="348" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="248" y="224" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="304" y="233" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">DETECTION PHASE</text>

    <!-- ============ ARROWS ============ -->
    <g fill="none" stroke="#545B64" stroke-width="1.2">
      <path d="M 240,120 H 280" marker-end="url(#cwa3-arrow)"/>
      <path d="M 440,120 H 480" marker-end="url(#cwa3-arrow)"/>
      <path d="M 560,144 V 340" marker-end="url(#cwa3-arrow)"/>
      <path d="M 440,380 H 490" marker-end="url(#cwa3-arrow)"/>
      <path d="M 630,380 H 720" marker-end="url(#cwa3-arrow)"/>
      <path d="M 560,420 V 500" marker-end="url(#cwa3-arrow)"/>
    </g>

    <!-- ============ ARROW LABELS ============ -->
    <g font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle">
      <rect x="656" y="358" width="30" height="12" rx="2" fill="#ffffff"/>
      <text x="671" y="367" fill="#7D8998">YES</text>

      <rect x="536" y="452" width="30" height="12" rx="2" fill="#ffffff"/>
      <text x="551" y="461" fill="#7D8998">NO</text>
    </g>

    <!-- ============ NODES ============ -->
    <!-- Historical Data -->
    <g>
      <rect x="80" y="96" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="80" y="96" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="160" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Historical Data</text>
    </g>

    <!-- ML Model -->
    <g>
      <rect x="280" y="96" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="280" y="96" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="360" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ML Model</text>
    </g>

    <!-- Expected Band -->
    <g>
      <rect x="480" y="96" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="480" y="96" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="560" y="124" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Expected Band</text>
    </g>

    <!-- Current Metrics -->
    <g>
      <rect x="280" y="356" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="280" y="356" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="360" y="384" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Current Metrics</text>
    </g>

    <!-- Within Band? (FOCAL decision) -->
    <g>
      <polygon points="560,340 630,380 560,420 490,380" fill="#ffffff"/>
      <polygon points="560,340 630,380 560,420 490,380" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="560" y="384" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Within Band?</text>
    </g>

    <!-- Normal -->
    <g>
      <rect x="720" y="356" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="720" y="356" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="800" y="384" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Normal</text>
    </g>

    <!-- Anomaly Alert -->
    <g>
      <rect x="480" y="500" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="480" y="500" width="160" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="560" y="528" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Anomaly Alert</text>
    </g>
  </svg>