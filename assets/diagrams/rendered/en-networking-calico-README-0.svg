<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Calico Component Architecture</title>
<desc id="arch-desc">Diagram of Calico's architecture: control plane components (kube-controllers, Calico API Server, Typha) reconcile with the Kubernetes API datastore, while Typha fans out state to the per-node Felix agent, which configures confd, iptables/eBPF, and the BIRD BGP daemon that peers with BIRD on other nodes.</desc>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Eyebrow + title -->
<text x="48" y="32" fill="var(--soft)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ARCHITECTURE</text>
<text x="48" y="56" fill="#232F3E" font-size="20" font-weight="700" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif">Calico Component Architecture</text>

<!-- ===== Zones (bg, before arrows/nodes) ===== -->
<!-- Control Plane -->
<rect x="48" y="80" width="864" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="392" y="84" width="96" height="12" rx="2" fill="#ffffff"/>
<text x="440" y="93" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE</text>

<!-- Datastore -->
<rect x="48" y="208" width="864" height="104" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="404" y="212" width="72" height="12" rx="2" fill="#ffffff"/>
<text x="440" y="221" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATASTORE</text>

<!-- Data Plane - Per Node -->
<rect x="48" y="336" width="864" height="120" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="368" y="340" width="144" height="12" rx="2" fill="#ffffff"/>
<text x="440" y="349" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA PLANE · PER NODE</text>

<!-- ===== Arrows (before nodes) ===== -->

<!-- kube-controllers -> Kubernetes API : Watches -->
<path d="M256,168 H312 Q320,168 320,176 V240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Calico API Server -> Kubernetes API : Aggregates -->
<path d="M480,168 H384 Q376,168 376,176 V240" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Kubernetes API -> Typha : Config (bridged hop over crossing) -->
<path d="M432,240 V214 Q432,206 440,206 H669 A8,8 0 0 1 685,206 H723 Q731,206 731,198 V168"
      fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Typha -> Felix : Fan-out (accent, primary data path) -->
<path d="M677,168 V308 Q677,316 669,316 H152 Q144,316 144,324 V368"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- Felix -> confd : Configures -->
<line x1="224" y1="396" x2="288" y2="396" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- confd -> BIRD : Templates -->
<line x1="448" y1="396" x2="512" y2="396" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Felix -> iptables/eBPF : Programs -->
<path d="M144,424 V432 Q144,436 152,436 H808 Q816,436 816,428 V424"
      fill="none" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- BIRD self-loop : BGP Routes (peers with other nodes' BIRD) -->
<path d="M536,368 C536,336 648,336 648,368" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

<defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
</defs>

