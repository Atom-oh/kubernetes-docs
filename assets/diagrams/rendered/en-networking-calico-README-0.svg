<text x="480" y="387" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TEMPLATES</text>

<rect x="446" y="444" width="60" height="12" rx="2" fill="#ffffff"/>
<text x="476" y="453" fill="#EC7211" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROGRAMS</text>

