<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="obs-title obs-desc">
    <title id="obs-title">AI/ML monitoring and logging architecture</title>
    <desc id="obs-desc">Diagram showing GPU, node, and kube-state exporters feeding Prometheus, which drives Alert Manager into alerts and Grafana into dashboards; separately, Fluentd ships logs to CloudWatch Logs and to Elasticsearch, which feeds Kibana.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Metrics & Monitoring -->
    <rect x="40" y="56" width="864" height="184" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="48" y="60" width="152" height="12" rx="2" fill="#ffffff"/>
    <text x="60" y="69" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">METRICS &amp; MONITORING</text>

    <!-- Zone: Log Aggregation -->
    <rect x="40" y="280" width="648" height="184" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="48" y="284" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="60" y="293" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LOG AGGREGATION</text>

    <!-- Arrows: metrics zone -->
    <line x1="232" y1="156" x2="280" y2="156" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 448,140 H 464 Q 472,140 472,132 V 124 Q 472,116 480,116 H 496"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 448,172 H 464 Q 472,172 472,180 V 188 Q 472,196 480,196 H 496"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="664" y1="116" x2="712" y2="116" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="664" y1="196" x2="712" y2="196" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrows: logging zone -->
    <path d="M 232,364 H 248 Q 256,364 256,356 V 348 Q 256,340 264,340 H 280"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 232,396 H 248 Q 256,396 256,404 V 412 Q 256,420 264,420 H 280"
          fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="448" y1="420" x2="496" y2="420" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Nodes: metrics zone -->
    <rect x="64" y="124" width="168" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="148" y="150" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Exporters</text>
    <text x="148" y="165" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DCGM · Node · kube-state</text>

    <rect x="280" y="124" width="168" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="364" y="160" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Prometheus</text>

    <rect x="496" y="88" width="168" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="580" y="120" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Alert Manager</text>

    <rect x="496" y="168" width="168" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="580" y="200" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Grafana</text>

    <rect x="712" y="88" width="168" height="56" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="796" y="112" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Alerts</text>
    <text x="796" y="126" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPU · Perf · Cost</text>

    <rect x="712" y="168" width="168" height="56" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="796" y="192" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Dashboards</text>
    <text x="796" y="206" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPU · Training · Inference</text>

    <!-- Nodes: logging zone -->
    <rect x="64" y="348" width="168" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="148" y="384" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Fluentd</text>

    <rect x="280" y="312" width="168" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="364" y="344" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">CloudWatch Logs</text>

    <rect x="280" y="392" width="168" height="56" rx="6" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="364" y="424" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Elasticsearch</text>

    <rect x="496" y="392" width="168" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="580" y="424" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Kibana</text>

    <!-- Legend -->
    <line x1="40" y1="488" x2="920" y2="488" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="40" y="504" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="520" width="14" height="10" rx="2" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <text x="60" y="528" fill="#545B64" font-size="8.5">Focal collector</text>

    <rect x="184" y="520" width="14" height="10" rx="2" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="204" y="528" fill="#545B64" font-size="8.5">Pipeline stage</text>

    <rect x="340" y="520" width="14" height="10" rx="2" fill="#ffffff" stroke="#545B64" stroke-width="1"/>
    <text x="360" y="528" fill="#545B64" font-size="8.5">Output / store</text>
  </svg>