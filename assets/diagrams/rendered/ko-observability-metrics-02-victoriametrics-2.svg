<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vmarch-title vmarch-desc">
    <title id="vmarch-title">VictoriaMetrics 클러스터 아키텍처</title>
    <desc id="vmarch-desc">vmagent와 Prometheus가 vminsert로 메트릭을 쓰고, Grafana와 vmalert가 vmselect로 질의하며, 두 경로 모두 수평 확장되는 vmstorage에서 만나는 클러스터 구성.</desc>
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- ===== Zones ===== -->
    <rect x="44" y="120" width="160" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="64" y="124" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="112" y="133" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">쓰기 경로</text>

    <rect x="756" y="120" width="160" height="240" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="776" y="124" width="96" height="12" rx="2" fill="#ffffff"/>
    <text x="824" y="133" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">읽기 경로</text>

    <!-- ===== Arrows (before nodes) ===== -->

    <!-- VA (184,180) -> vminsert left fan pt (244,228) : right+down -->
    <path d="M184,180 H206 Q214,180 214,188 V220 Q214,228 222,228 H244"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- P (184,300) -> vminsert left fan pt (244,252) : right+up -->
    <path d="M184,300 H206 Q214,300 214,292 V260 Q214,252 222,252 H244"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- vminsert -> vmstorage : straight (same y) -->
    <path d="M364,240 H404" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="368" y="220" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="384" y="229" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">WRITE</text>

    <!-- vmselect -> vmstorage : straight (same y) -->
    <path d="M596,240 H556" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="560" y="220" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="576" y="229" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">QUERY</text>

    <!-- G (776,180) -> vmselect right fan pt (716,228) : left+down -->
    <path d="M776,180 H754 Q746,180 746,188 V220 Q746,228 738,228 H716"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- AL (776,300) -> vmselect right fan pt (716,252) : left+up -->
    <path d="M776,300 H754 Q746,300 746,292 V260 Q746,252 738,252 H716"
          fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== Nodes ===== -->

    <!-- VA -->
    <rect x="64" y="152" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="64" y="152" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="124" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vmagent</text>
    <text x="124" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">metrics scrape</text>

    <!-- P -->
    <rect x="64" y="272" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="64" y="272" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="124" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Prometheus</text>
    <text x="124" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">remote_write</text>

    <!-- vminsert -->
    <rect x="244" y="208" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="244" y="208" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="304" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vminsert</text>
    <text x="304" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×3 · Deployment</text>
    <text x="304" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">쓰기 라우팅</text>

    <!-- vmstorage (focal) -->
    <rect x="404" y="192" width="152" height="96" rx="6" fill="rgba(255,153,0,0.10)"/>
    <rect x="404" y="192" width="152" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="480" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vmstorage</text>
    <text x="480" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×3 · StatefulSet</text>
    <text x="480" y="260" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">데이터 저장</text>
    <text x="480" y="272" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(핵심 상태)</text>

    <!-- vmselect -->
    <rect x="596" y="208" width="120" height="64" rx="6" fill="#ffffff"/>
    <rect x="596" y="208" width="120" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="656" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vmselect</text>
    <text x="656" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">×3 · Deployment</text>
    <text x="656" y="264" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">쿼리 처리</text>

    <!-- G -->
    <rect x="776" y="152" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="776" y="152" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="836" y="176" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Grafana</text>
    <text x="836" y="192" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dashboards</text>

    <!-- AL -->
    <rect x="776" y="272" width="120" height="56" rx="6" fill="#ffffff"/>
    <rect x="776" y="272" width="120" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="836" y="296" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">vmalert</text>
    <text x="836" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rule eval</text>

    <!-- Legend -->
    <line x1="32" y1="500" x2="928" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="32" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="132" y="500" width="16" height="16" rx="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="156" y="512" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">핵심 데이터 저장소</text>
    <rect x="336" y="500" width="16" height="16" rx="4" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="360" y="512" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">수평 확장 컴포넌트</text>
  </svg>