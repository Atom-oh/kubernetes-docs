<title id="ko-eks-05-eks-security-8-title">VPC 네트워크 및 보안 그룹 구성</title>
<desc id="ko-eks-05-eks-security-8-desc">퍼블릭 서브넷의 ALB와 Bastion, 프라이빗 서브넷의 EKS 워커 노드가 보안 그룹과 네트워크 정책으로 보호되며 VPC 엔드포인트를 통해 AWS 서비스에 프라이빗하게 접근하는 구조를 보여준다.</desc>
