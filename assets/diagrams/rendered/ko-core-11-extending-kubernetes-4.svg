<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4title d4desc">
  <title id="d4title">CSI 아키텍처와 작동 방식</title>
  <desc id="d4desc">사용자가 만든 PersistentVolumeClaim이 StorageClass와 프로비저너를 거쳐 CSI 드라이버에 전달되고, CSI 드라이버가 컨트롤러 서비스와 노드 서비스를 통해 볼륨을 생성·마운트하며 스토리지 시스템과 연동되는 과정을 보여준다.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="24" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.18em">ARCHITECTURE · CSI</text>
  <text x="40" y="46" fill="#232F3E" font-size="16" font-weight="700" class="sans">CSI 아키텍처와 작동 방식</text>
  <text x="40" y="60" fill="#545B64" font-size="10" class="sans">프로비저닝과 마운트 경로가 CSI 드라이버를 거쳐 스토리지 시스템에 도달한다</text>

  <!-- ============ Zones ============ -->
  <rect x="40" y="124" width="536" height="204" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="220" y="128" width="152" height="12" rx="2" fill="#ffffff"/>
  <text x="296" y="137" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">KUBERNETES 컴포넌트</text>

  <rect x="598" y="300" width="350" height="100" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="614" y="304" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="662" y="313" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">CSI 드라이버</text>

  <!-- ============ Arrows ============ -->
  <!-- User -> PVC (1. 생성) -->
  <path d="M124,108 V156" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="132" y="126" width="32" height="12" fill="#ffffff"/>
  <text x="148" y="135" fill="#545B64" font-size="8" class="mono" text-anchor="middle">1. 생성</text>

  <!-- PVC -> SC (참조) -->
  <path d="M192,172 H240" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="198" y="152" width="36" height="12" fill="#ffffff"/>
  <text x="216" y="161" fill="#545B64" font-size="8" class="mono" text-anchor="middle">참조</text>

  <!-- SC -> PROV (지정) -->
  <path d="M376,172 H424" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="382" y="152" width="36" height="12" fill="#ffffff"/>
  <text x="400" y="161" fill="#545B64" font-size="8" class="mono" text-anchor="middle">지정</text>

  <!-- PROV -> CSI (2. 볼륨 생성 요청) -->
  <path d="M560,172 H592 Q600,172 600,180 V212 Q600,220 608,220 H640" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="608" y="186" width="88" height="12" fill="#ffffff"/>
  <text x="652" y="195" fill="#545B64" font-size="8" class="mono" text-anchor="middle">2. 볼륨 생성 요청</text>

  <!-- CSI -> PV (3. 볼륨 생성) -->
  <path d="M667,236 V250 Q667,258 659,258 H124 Q116,258 116,266 V280" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="572" y="238" width="56" height="12" fill="#ffffff"/>
  <text x="600" y="247" fill="#545B64" font-size="8" class="mono" text-anchor="middle">3. 볼륨 생성</text>

  <!-- PV -> PVC (바인딩) -->
  <path d="M132,280 V188" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="140" y="228" width="32" height="12" fill="#ffffff"/>
  <text x="156" y="237" fill="#545B64" font-size="8" class="mono" text-anchor="middle">바인딩</text>

  <!-- CSI -> POD (4. 볼륨 마운트) -->
  <path d="M694,236 V250 Q694,258 686,258 H500 Q492,258 492,266 V280" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="464" y="238" width="64" height="12" fill="#ffffff"/>
  <text x="496" y="247" fill="#545B64" font-size="8" class="mono" text-anchor="middle">4. 볼륨 마운트</text>

  <!-- POD -> PVC (마운트 요청) -->
  <path d="M460,280 V258 Q460,250 452,250 H168 Q160,250 160,242 V188" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="268" y="230" width="64" height="12" fill="#ffffff"/>
  <text x="300" y="239" fill="#545B64" font-size="8" class="mono" text-anchor="middle">마운트 요청</text>

  <!-- CSI -> CTRL -->
  <path d="M722,236 V278 Q722,286 714,286 H690 Q682,286 682,294 V336" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- CSI -> NODE -->
  <path d="M749,236 V278 Q749,286 757,286 H850 Q858,286 858,294 V336" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- CTRL -> STOR (5. 볼륨 관리) -->
  <path d="M682,368 V406 Q682,414 690,414 H748 Q756,414 756,422 V460" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="687" y="394" width="64" height="12" fill="#ffffff"/>
  <text x="719" y="403" fill="#545B64" font-size="8" class="mono" text-anchor="middle">5. 볼륨 관리</text>

  <!-- NODE -> STOR (6. 볼륨 마운트) -->
  <path d="M858,368 V406 Q858,414 850,414 H812 Q804,414 804,422 V460" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="795" y="394" width="72" height="12" fill="#ffffff"/>
  <text x="831" y="403" fill="#545B64" font-size="8" class="mono" text-anchor="middle">6. 볼륨 마운트</text>

  <!-- ============ Nodes ============ -->
  <!-- User -->
  <rect x="56" y="76" width="136" height="32" rx="6" fill="#ffffff"/>
  <rect x="56" y="76" width="136" height="32" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
  <text x="124" y="96" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">사용자</text>

  <!-- PVC -->
  <rect x="56" y="156" width="136" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="124" y="176" fill="#232F3E" font-size="10" font-weight="600" class="sans" text-anchor="middle">PersistentVolumeClaim</text>

  <!-- SC -->
  <rect x="240" y="156" width="136" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="308" y="176" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">StorageClass</text>

  <!-- PROV -->
  <rect x="424" y="156" width="136" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="492" y="172" fill="#232F3E" font-size="10" font-weight="600" class="sans" text-anchor="middle">CSI 외부</text>
  <text x="492" y="184" fill="#232F3E" font-size="10" font-weight="600" class="sans" text-anchor="middle">프로비저너</text>

  <!-- PV -->
  <rect x="56" y="280" width="136" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="124" y="300" fill="#232F3E" font-size="10" font-weight="600" class="sans" text-anchor="middle">PersistentVolume</text>

  <!-- POD -->
  <rect x="424" y="280" width="136" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="492" y="300" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">Pod</text>

  <!-- CSI (focal) -->
  <rect x="640" y="204" width="136" height="32" rx="6" fill="#ffffff"/>
  <rect x="640" y="204" width="136" height="32" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="708" y="224" fill="#232F3E" font-size="12" font-weight="600" class="sans" text-anchor="middle">CSI 드라이버</text>

  <!-- CTRL -->
  <rect x="614" y="336" width="136" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="682" y="356" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">컨트롤러 서비스</text>

  <!-- NODE -->
  <rect x="790" y="336" width="136" height="32" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="858" y="356" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">노드 서비스</text>

  <!-- STOR (store) -->
  <rect x="700" y="460" width="160" height="40" rx="6" fill="#ffffff"/>
  <rect x="700" y="460" width="160" height="40" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <rect x="708" y="466" width="24" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.40)" stroke-width="0.8"/>
  <text x="720" y="475" fill="#545B64" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.06em">DB</text>
  <text x="800" y="484" fill="#232F3E" font-size="11" font-weight="600" class="sans" text-anchor="middle">스토리지 시스템</text>

  <!-- Legend -->
  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="552" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>
  <circle cx="220" cy="548" r="4" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="232" y="552" fill="#545B64" font-size="9" class="sans">프로비저닝·마운트 허브(CSI 드라이버)</text>
  <circle cx="540" cy="548" r="4" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="552" y="552" fill="#545B64" font-size="9" class="sans">외부 스토리지 시스템</text>
</svg>