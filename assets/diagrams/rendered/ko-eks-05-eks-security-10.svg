<title id="ko-eks-05-eks-security-10-title">Bottlerocket OS의 세 가지 보안 특성</title>
<desc id="ko-eks-05-eks-security-10-desc">Bottlerocket 운영체제가 API 기반 구성·SELinux·dm-verity·읽기 전용 루트로 구성된 보안 특성, 자동 업데이트/롤백/A-B 파티션 방식의 업데이트 전략, SSH·패키지 관리자·불필요 서비스를 제거한 최소화 전략으로 불변 인프라를 구현함을 보여준다.</desc>
