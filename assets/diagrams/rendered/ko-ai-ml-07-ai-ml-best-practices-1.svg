<text x="148" y="500" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">처리량</text>
<text x="148" y="518" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">초당 요청 수</text>

