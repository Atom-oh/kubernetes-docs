<rect x="592" y="172" width="264" height="56" rx="6" fill="#ffffff"/>
<rect x="592" y="172" width="264" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="724" y="196" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">인지된 응답성</text>
<text x="724" y="214" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">first &amp; total latency</text>

