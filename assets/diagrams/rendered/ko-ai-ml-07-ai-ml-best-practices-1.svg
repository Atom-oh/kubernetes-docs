<text x="724" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">token cadence</text>

<rect x="592" y="388" width="264" height="56" rx="6" fill="#ffffff"/>
<rect x="592" y="388" width="264" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="724" y="412" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">시스템 용량</text>
<text x="724" y="430" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">concurrent requests</text>

