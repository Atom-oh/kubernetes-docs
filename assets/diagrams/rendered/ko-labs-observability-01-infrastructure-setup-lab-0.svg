  <!-- Node Group -->
  <rect x="56" y="128" width="348" height="48" rx="6" fill="#FFFFFF"/>
  <rect x="56" y="128" width="348" height="48" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="230" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Node Group</text>
  <text x="230" y="164" text-anchor="middle" class="mono" font-size="9" fill="#545B64">3x m5.large</text>

  <!-- ArgoCD (focal) -->
  <rect x="56" y="192" width="348" height="48" rx="6" fill="#FFFFFF"/>
  <rect x="56" y="192" width="348" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <text x="230" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">ArgoCD</text>
  <text x="230" y="228" text-anchor="middle" class="mono" font-size="9" fill="#545B64">GitOps CD</text>

  <!-- Observability Stack -->
  <rect x="56" y="256" width="348" height="48" rx="6" fill="#FFFFFF"/>
  <rect x="56" y="256" width="348" height="48" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="230" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Observability Stack</text>
  <text x="230" y="292" text-anchor="middle" class="mono" font-size="9" fill="#545B64">on-cluster stack</text>

  <!-- === Service Cluster nodes === -->
  <!-- Node Group -->
  <rect x="556" y="128" width="348" height="48" rx="6" fill="#FFFFFF"/>
  <rect x="556" y="128" width="348" height="48" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="730" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Node Group</text>
  <text x="730" y="164" text-anchor="middle" class="mono" font-size="9" fill="#545B64">3x m5.large</text>

  <!-- Karpenter -->
  <rect x="556" y="192" width="348" height="48" rx="6" fill="#FFFFFF"/>
  <rect x="556" y="192" width="348" height="48" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="730" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Karpenter</text>
  <text x="730" y="228" text-anchor="middle" class="mono" font-size="9" fill="#545B64">autoscaler</text>

  <!-- MSA Apps -->
  <rect x="556" y="256" width="348" height="48" rx="6" fill="#FFFFFF"/>
  <rect x="556" y="256" width="348" height="48" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="730" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">MSA Apps</text>
  <text x="730" y="292" text-anchor="middle" class="mono" font-size="9" fill="#545B64">microservices</text>

  <!-- === AWS Managed Services (collapsed summary nodes) === -->
  <rect x="56" y="392" width="412" height="64" rx="6" fill="#FFFFFF"/>
  <rect x="56" y="392" width="412" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="262" y="416" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Observability</text>
  <text x="262" y="432" text-anchor="middle" class="mono" font-size="9" fill="#545B64">AMP · AMG · OpenSearch</text>

  <rect x="492" y="392" width="412" height="64" rx="6" fill="#FFFFFF"/>
  <rect x="492" y="392" width="412" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
  <text x="698" y="416" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Data &amp; Messaging</text>
  <text x="698" y="432" text-anchor="middle" class="mono" font-size="9" fill="#545B64">Aurora · SQS · SNS · MWAA</text>
