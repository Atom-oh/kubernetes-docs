<title id="dtitle">Pod Security Standards and Admission</title>
<desc id="ddesc">Diagram showing how a namespace label configures Pod Security Admission, which enforces, audits, or warns against one of the three Pod Security Standards levels when a pod creation request is validated, allowing or denying it.</desc>
