<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dnscombo-title dnscombo-desc">
    <title id="dnscombo-title">DNS Proxy and DNS Cache Working Together</title>
    <desc id="dnscombo-desc">Diagram showing Envoy routing ServiceEntry-registered lookups through its DNS proxy for an instant virtual IP, while other external lookups fall through to a cached CoreDNS resolution path.</desc>
    <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
      <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Zone: Envoy Proxy -->
    <rect x="280" y="120" width="360" height="360" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="404" y="124" width="112" height="12" rx="2" fill="#ffffff"/>
    <text x="460" y="133" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">ENVOY PROXY</text>

    <!-- ============ ARROWS ============ -->

    <!-- App -> DNS Proxy (top lane, accent / headline path) -->
    <line x1="200" y1="220" x2="300" y2="220" stroke="#EC7211" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="220" y="200" width="60" height="12" rx="2" fill="#ffffff"/>
    <text x="250" y="210" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SE HOST</text>

    <!-- DNS Proxy -> App (virtual IP, dashed return, accent) -->
    <line x1="300" y1="272" x2="200" y2="272" stroke="#EC7211" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
    <rect x="204" y="248" width="80" height="12" rx="2" fill="#ffffff"/>
    <text x="244" y="258" fill="#EC7211" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">VIRTUAL IP</text>

    <!-- App -> DNS Cache (bottom lane) -->
    <line x1="200" y1="380" x2="300" y2="380" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="212" y="360" width="76" height="12" rx="2" fill="#ffffff"/>
    <text x="250" y="370" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">google.com</text>

    <!-- DNS Cache -> CoreDNS (cache miss) -->
    <line x1="440" y1="368" x2="660" y2="368" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="508" y="348" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="544" y="358" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CACHE MISS</text>

    <!-- CoreDNS -> DNS Cache (actual IP, dashed return) -->
    <line x1="660" y1="392" x2="440" y2="392" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="508" y="396" width="72" height="12" rx="2" fill="#ffffff"/>
    <text x="544" y="406" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ACTUAL IP</text>

    <!-- ServiceEntry -.-> DNS Proxy (registration, dashed, top) -->
    <path d="M 480,140 V 172 Q 480,180 472,180 H 360 Q 352,180 352,188 V 200"
          fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="392" y="160" width="64" height="12" rx="2" fill="#ffffff"/>
    <text x="424" y="170" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">REGISTER</text>

    <!-- ============ NODES ============ -->

    <!-- App (input) -->
    <rect x="40" y="164" width="160" height="292" rx="6" fill="#ffffff"/>
    <rect x="40" y="164" width="160" height="292" rx="6" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <rect x="48" y="172" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,137,152,0.40)" stroke-width="0.8"/>
    <text x="62" y="181" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
    <text x="120" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Application</text>

    <!-- ServiceEntry (top, external-ish config) -->
    <rect x="400" y="80" width="160" height="56" rx="6" fill="#ffffff"/>
    <rect x="400" y="80" width="160" height="56" rx="6" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="408" y="88" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="420" y="97" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CFG</text>
    <text x="480" y="110" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ServiceEntry</text>
    <text x="480" y="124" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">api.example.com</text>

    <!-- DNS Proxy (focal, accent) -->
    <rect x="300" y="200" width="160" height="96" rx="6" fill="#ffffff"/>
    <rect x="300" y="200" width="160" height="96" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1"/>
    <rect x="308" y="208" width="48" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.50)" stroke-width="0.8"/>
    <text x="332" y="217" fill="#EC7211" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>
    <text x="380" y="240" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">DNS Proxy</text>
    <text x="380" y="254" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">ServiceEntry hosts</text>
    <text x="380" y="278" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">no lookup latency</text>

    <!-- DNS Cache (backend) -->
    <rect x="300" y="340" width="160" height="80" rx="6" fill="#ffffff"/>
    <rect x="300" y="340" width="160" height="80" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="308" y="348" width="48" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="332" y="357" fill="#232F3E" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
    <text x="380" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">DNS Cache</text>
    <text x="380" y="394" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">other external hosts</text>
    <text x="380" y="408" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">dns_refresh_rate</text>

    <!-- CoreDNS (external) -->
    <rect x="660" y="340" width="160" height="80" rx="6" fill="#ffffff"/>
    <rect x="660" y="340" width="160" height="80" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="668" y="348" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="682" y="357" fill="#7D8998" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="740" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">CoreDNS</text>
    <text x="740" y="394" fill="#545B64" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">cluster resolver</text>
    <text x="740" y="408" fill="#7D8998" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">google.com</text>

    <!-- Legend -->
    <line x1="30" y1="488" x2="930" y2="488" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <text x="30" y="508" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="504" x2="172" y2="504" stroke="#EC7211" stroke-width="1.4"/>
    <text x="180" y="508" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">DNS PROXY PATH (VIRTUAL IP)</text>
    <line x1="440" y1="504" x2="472" y2="504" stroke="#545B64" stroke-width="1.2"/>
    <text x="480" y="508" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">CACHE PATH (ACTUAL IP)</text>
    <line x1="700" y1="504" x2="732" y2="504" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="740" y="508" fill="#545B64" font-size="8" font-family="'Geist Mono',monospace">RETURN / CONFIG</text>
  </svg>