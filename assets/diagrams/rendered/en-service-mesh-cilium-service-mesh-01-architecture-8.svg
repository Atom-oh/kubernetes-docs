      <title id="en-service-mesh-cilium-service-mesh-01-architecture-8-title">Cilium identity assignment</title>
      <desc id="en-service-mesh-cilium-service-mesh-01-architecture-8-desc">Diagram showing a pod's labels combining with its namespace and service account to derive a numeric Cilium Identity, which in turn sets the workload's security context.</desc>
