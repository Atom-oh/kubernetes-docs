<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="ko-container-registry-03-harbor-2-title ko-container-registry-03-harbor-2-desc">
    <title id="ko-container-registry-03-harbor-2-title">Harbor 프록시 캐시 조회 흐름</title>
    <desc id="ko-container-registry-03-harbor-2-desc">Docker/containerd 요청이 Harbor 프록시 캐시를 거쳐 캐시 적중 시 즉시 반환되고, 캐시 미스 시 업스트림 레지스트리에서 가져와 캐시에 저장한 뒤 반환되는 흐름을 보여준다.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Arrows (before nodes) -->
    <path d="M280,124 V176" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M390,232 H600" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M280,288 V360" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M280,424 V456" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M410,488 H712 Q720,488 720,480 V264" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="448" y="216" width="88" height="12" rx="2" fill="#ffffff"/>
    <text x="492" y="225" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE HIT</text>

    <rect x="234" y="316" width="92" height="12" rx="2" fill="#ffffff"/>
    <text x="280" y="325" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE MISS</text>

    <!-- Node: Client (start, oval) -->
    <rect x="180" y="60" width="200" height="64" rx="32" fill="#ffffff"/>
    <rect x="180" y="60" width="200" height="64" rx="32" fill="rgba(84,91,100,0.10)" stroke="#7D8998" stroke-width="1"/>
    <text x="280" y="88" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Client</text>
    <text x="280" y="104" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Docker / containerd</text>

    <!-- Node: Harbor (decision, focal) -->
    <path d="M280,176 L390,232 L280,288 L170,232 Z" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="280" y="228" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Harbor</text>
    <text x="280" y="244" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Proxy Cache</text>

    <!-- Node: Return -->
    <rect x="600" y="200" width="240" height="64" rx="6" fill="#ffffff"/>
    <rect x="600" y="200" width="240" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <rect x="608" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
    <text x="622" y="217" fill="#232F3E" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RSP</text>
    <text x="720" y="236" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">캐시된 이미지 반환</text>
    <text x="720" y="252" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">response</text>

    <!-- Node: Upstream Registry -->
    <rect x="150" y="360" width="260" height="64" rx="6" fill="#ffffff"/>
    <rect x="150" y="360" width="260" height="64" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <rect x="158" y="368" width="28" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.22)" stroke-width="0.8"/>
    <text x="172" y="377" fill="#7D8998" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <text x="280" y="396" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Upstream Registry</text>
    <text x="280" y="412" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Docker Hub 등</text>

    <!-- Node: Store -->
    <rect x="150" y="456" width="260" height="64" rx="6" fill="#ffffff"/>
    <rect x="150" y="456" width="260" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
    <rect x="158" y="464" width="24" height="12" rx="2" fill="transparent" stroke="rgba(84,91,100,0.50)" stroke-width="0.8"/>
    <text x="170" y="473" fill="#545B64" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
    <text x="280" y="492" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Harbor에 캐시 저장</text>
    <text x="280" y="508" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">store</text>
  </svg>
