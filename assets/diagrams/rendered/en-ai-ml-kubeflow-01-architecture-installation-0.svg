<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">Kubeflow control plane architecture</title>
  <desc id="ddesc">The Istio ingress gateway passes requests through Dex or Cognito OIDC authentication to the Kubeflow Central Dashboard, which is the hub that talks to the Profile Controller (creating per-team namespace profiles for team-a and team-b) and to the component controllers for Pipelines, Notebooks, Katib, Kubeflow Trainer, and KServe; every controller reconciles its custom resources against the Kubernetes API server, and namespace profiles scope which controllers can act on their resources.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>

  <!-- ===== Header ===== -->
  <text x="40" y="26" fill="#7D8998" font-size="8" class="mono" letter-spacing="0.14em">ARCHITECTURE</text>
  <text x="40" y="48" fill="#232F3E" font-size="20" font-weight="700">Kubeflow Control Plane</text>

  <!-- ===== Zones (bg -> zones -> arrows -> nodes) ===== -->
  <!-- Zone A: Ingress / Auth -->
  <rect x="200" y="64" width="560" height="92" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="212" y="68" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="268" y="77" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">INGRESS / AUTH</text>

  <!-- Zone B: Multi-Tenancy -->
  <rect x="64" y="288" width="300" height="168" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="76" y="292" width="128" height="12" rx="2" fill="#ffffff"/>
  <text x="140" y="301" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">MULTI-TENANCY</text>

  <!-- Zone C: Component Controllers / CRDs -->
  <rect x="400" y="288" width="496" height="168" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <rect x="412" y="292" width="248" height="12" rx="2" fill="#ffffff"/>
  <text x="536" y="301" fill="rgba(35,47,62,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">COMPONENT CONTROLLERS / CRDS</text>

  <!-- ===== Arrows ===== -->
  <!-- 1. IG -> AUTH (same y, straight line) -->
  <line x1="408" y1="122" x2="548" y2="122" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="458" y="102" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="478" y="111" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">OIDC</text>

  <!-- 2. AUTH -> DASH -->
  <path d="M 638,144 V 164 Q 638,172 630,172 H 488 Q 480,172 480,180 V 200"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 3. DASH -> PC -->
  <path d="M 420,248 V 278 Q 420,286 412,286 H 222 Q 214,286 214,294 V 324"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- 4. DASH -> Zone C (registers controller CRDs) -->
  <path d="M 540,248 V 260 Q 540,268 548,268 H 642 Q 650,268 650,276 V 288"
        fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="592" y="248" width="76" height="12" rx="2" fill="#ffffff"/>
  <text x="630" y="257" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">REGISTERS</text>

  <!-- 5. PC -> NS1 -->
  <path d="M 194,364 V 368 Q 194,376 186,376 H 159 Q 151,376 151,384 V 388"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 6. PC -> NS2 -->
  <path d="M 234,364 V 368 Q 234,376 242,376 H 269 Q 277,376 277,384 V 388"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 7. Zone C -> K8S -->
  <path d="M 650,456 V 464 Q 650,472 642,472 H 488 Q 480,472 480,480 V 488"
        fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 8. Multi-Tenancy -.-> Component Controllers (scoped resources, dashed) -->
  <line x1="320" y1="456" x2="440" y2="456" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="354" y="436" width="90" height="12" rx="2" fill="#ffffff"/>
  <text x="399" y="445" fill="#7D8998" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.06em">SCOPED RES</text>

  <!-- ===== Nodes ===== -->

  <!-- IG -->
  <rect x="228" y="100" width="180" height="44" rx="6" fill="#ffffff"/>
  <rect x="228" y="100" width="180" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="236" y="106" width="26" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="249" y="115" fill="rgba(35,47,62,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">GW</text>
  <text x="318" y="119" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Istio Ingress GW</text>
  <text x="318" y="134" fill="#545B64" font-size="9" class="mono" text-anchor="middle">ingress</text>

  <!-- AUTH -->
  <rect x="548" y="100" width="180" height="44" rx="6" fill="#ffffff"/>
  <rect x="548" y="100" width="180" height="44" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <rect x="556" y="106" width="34" height="12" rx="2" fill="transparent" stroke="rgba(35,47,62,0.40)" stroke-width="0.8"/>
  <text x="573" y="115" fill="rgba(35,47,62,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">AUTHN</text>
  <text x="638" y="119" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">AuthN / AuthZ</text>
  <text x="638" y="134" fill="#545B64" font-size="9" class="mono" text-anchor="middle">Dex or Cognito OIDC</text>

  <!-- DASH (focal) -->
  <rect x="380" y="200" width="200" height="48" rx="6" fill="#ffffff"/>
  <rect x="380" y="200" width="200" height="48" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
  <rect x="388" y="207" width="28" height="12" rx="2" fill="transparent" stroke="rgba(236,114,17,0.60)" stroke-width="0.8"/>
  <text x="402" y="216" fill="#EC7211" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">HUB</text>
  <text x="480" y="222" fill="#232F3E" font-size="12" font-weight="700" text-anchor="middle">Central Dashboard</text>
  <text x="480" y="237" fill="#545B64" font-size="9" class="mono" text-anchor="middle">kubeflow UI</text>

  <!-- PC -->
  <rect x="164" y="324" width="100" height="40" rx="6" fill="#ffffff"/>
  <rect x="164" y="324" width="100" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
  <text x="214" y="345" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Profile</text>
  <text x="214" y="358" fill="#545B64" font-size="8" class="mono" text-anchor="middle">controller</text>

  <!-- NS1 -->
  <rect x="96" y="388" width="110" height="56" rx="6" fill="rgba(35,47,62,0.05)"/>
  <rect x="96" y="388" width="110" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="151" y="411" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Profile: team-a</text>
  <text x="151" y="426" fill="#545B64" font-size="8" class="mono" text-anchor="middle">namespace</text>

  <!-- NS2 -->
  <rect x="222" y="388" width="110" height="56" rx="6" fill="rgba(35,47,62,0.05)"/>
  <rect x="222" y="388" width="110" height="56" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="277" y="411" fill="#232F3E" font-size="11" font-weight="600" text-anchor="middle">Profile: team-b</text>
  <text x="277" y="426" fill="#545B64" font-size="8" class="mono" text-anchor="middle">namespace</text>

  <!-- Controller chips -->
  <g>
    <rect x="420" y="332" width="80" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="460" y="356" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle">Pipelines</text>
    <text x="460" y="370" fill="#545B64" font-size="8" class="mono" text-anchor="middle">controller</text>
  </g>
  <g>
    <rect x="514" y="332" width="80" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="554" y="356" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle">Notebooks</text>
    <text x="554" y="370" fill="#545B64" font-size="8" class="mono" text-anchor="middle">controller</text>
  </g>
  <g>
    <rect x="608" y="332" width="80" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="648" y="356" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle">Katib</text>
    <text x="648" y="370" fill="#545B64" font-size="8" class="mono" text-anchor="middle">controller</text>
  </g>
  <g>
    <rect x="702" y="332" width="80" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="742" y="356" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle">Trainer</text>
    <text x="742" y="370" fill="#545B64" font-size="8" class="mono" text-anchor="middle">training op</text>
  </g>
  <g>
    <rect x="796" y="332" width="80" height="56" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="836" y="356" fill="#232F3E" font-size="10" font-weight="600" text-anchor="middle">KServe</text>
    <text x="836" y="370" fill="#545B64" font-size="8" class="mono" text-anchor="middle">controller</text>
  </g>

  <!-- K8S -->
  <rect x="330" y="488" width="300" height="48" rx="6" fill="rgba(35,47,62,0.05)"/>
  <rect x="330" y="488" width="300" height="48" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
  <text x="480" y="510" fill="#232F3E" font-size="12" font-weight="600" text-anchor="middle">Kubernetes API Server</text>
  <text x="480" y="525" fill="#545B64" font-size="9" class="mono" text-anchor="middle">cluster control plane</text>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="564" x2="920" y2="564" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
  <text x="40" y="580" fill="#545B64" font-size="8" class="mono" letter-spacing="0.14em">LEGEND</text>

  <line x1="140" y1="576" x2="172" y2="576" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="180" y="580" fill="#545B64" font-size="9">dashboard hub</text>

  <line x1="300" y1="576" x2="332" y2="576" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="340" y="580" fill="#545B64" font-size="9">reconciles / creates</text>

  <line x1="480" y1="576" x2="512" y2="576" stroke="#7D8998" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="520" y="580" fill="#545B64" font-size="9">namespace-scoped access</text>
</svg>