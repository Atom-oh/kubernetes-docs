<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tool-pick-title tool-pick-desc">
      <title id="tool-pick-title">Choosing a GitOps tool</title>
      <desc id="tool-pick-desc">Decision tree guiding the choice between ArgoCD, FluxCD, or either tool based on web UI needs, multi-cluster scope, RBAC requirements, image automation priority, and lightweight footprint priority.</desc>
      <defs><style>@import url(&quot;https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap&quot;);</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Arrows (before boxes) -->
      <!-- START -> Q1 -->
      <path d="M 480,104 V 128" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Q1 -> Q2 (yes) -->
      <path d="M 408,168 H 268 Q 260,168 260,176 V 228" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="326" y="150" width="26" height="12" rx="2" fill="#ffffff"/>
      <text x="339" y="159" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- Q1 -> Q3 (no) -->
      <path d="M 552,168 H 692 Q 700,168 700,176 V 228" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="608" y="150" width="24" height="12" rx="2" fill="#ffffff"/>
      <text x="620" y="159" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- Q2 -> ARGO (yes) -->
      <path d="M 188,268 H 84 Q 76,268 76,276 V 336" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="124" y="250" width="26" height="12" rx="2" fill="#ffffff"/>
      <text x="137" y="259" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- Q2 -> Q4 (no) -->
      <path d="M 260,308 V 328" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="272" y="312" width="26" height="12" rx="2" fill="#ffffff"/>
      <text x="285" y="321" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- Q3 -> FLUX (yes) -->
      <path d="M 772,268 H 876 Q 884,268 884,276 V 336" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="812" y="250" width="26" height="12" rx="2" fill="#ffffff"/>
      <text x="825" y="259" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- Q3 -> Q5 (no) -->
      <path d="M 700,308 V 328" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="712" y="312" width="26" height="12" rx="2" fill="#ffffff"/>
      <text x="725" y="321" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- Q4 -> ARGO (yes) -->
      <path d="M 188,368 H 132" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="147" y="350" width="26" height="12" rx="2" fill="#ffffff"/>
      <text x="160" y="359" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- Q4 -> BOTH (no) -->
      <path d="M 260,408 V 416 Q 260,424 268,424 H 442 Q 450,424 450,432 V 440" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="342" y="406" width="24" height="12" rx="2" fill="#ffffff"/>
      <text x="354" y="415" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- Q5 -> FLUX (yes) -->
      <path d="M 772,368 H 828" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="787" y="350" width="26" height="12" rx="2" fill="#ffffff"/>
      <text x="800" y="359" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- Q5 -> BOTH (no) -->
      <path d="M 700,408 V 416 Q 700,424 692,424 H 518 Q 510,424 510,432 V 440" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="592" y="406" width="24" height="12" rx="2" fill="#ffffff"/>
      <text x="604" y="415" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- Nodes -->
      <!-- START (oval) -->
      <rect x="408" y="48" width="144" height="56" rx="28" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="80" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Need GitOps Tool</text>

      <!-- Q1 diamond -->
      <polygon points="480,128 552,168 480,208 408,168" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="480" y="164" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Need web</text>
      <text x="480" y="178" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">UI?</text>

      <!-- Q2 diamond -->
      <polygon points="260,228 332,268 260,308 188,268" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="260" y="264" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Multi-</text>
      <text x="260" y="278" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">cluster?</text>

      <!-- Q3 diamond -->
      <polygon points="700,228 772,268 700,308 628,268" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="700" y="260" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Image</text>
      <text x="700" y="272" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">automation</text>
      <text x="700" y="284" fill="#232F3E" font-size="11" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">priority?</text>

      <!-- Q4 diamond -->
      <polygon points="260,328 332,368 260,408 188,368" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="260" y="360" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Enterprise</text>
      <text x="260" y="373" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">RBAC?</text>

      <!-- Q5 diamond -->
      <polygon points="700,328 772,368 700,408 628,368" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="700" y="360" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Lightweight</text>
      <text x="700" y="373" fill="#232F3E" font-size="10" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">priority?</text>

      <!-- ARGO outcome -->
      <rect x="20" y="336" width="112" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="76" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">ArgoCD</text>

      <!-- FLUX outcome -->
      <rect x="828" y="336" width="112" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="884" y="372" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">FluxCD</text>

      <!-- BOTH outcome -->
      <rect x="420" y="440" width="120" height="64" rx="6" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="480" y="476" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Either works</text>

      <!-- Legend -->
      <line x1="20" y1="524" x2="940" y2="524" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="20" y="544" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="20" y="556" width="20" height="14" rx="7" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="48" y="567" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">START</text>

      <polygon points="130,556 142,563 130,570 118,563" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="150" y="567" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">DECISION</text>

      <rect x="260" y="556" width="20" height="14" rx="3" fill="rgba(35,47,62,0.05)" stroke="#545B64" stroke-width="1"/>
      <text x="288" y="567" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace">OUTCOME</text>
    </svg>