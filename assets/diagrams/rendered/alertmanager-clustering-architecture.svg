<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="am-cluster-title am-cluster-desc">
      <title id="am-cluster-title">Clustering Architecture</title>
      <desc id="am-cluster-desc">Architecture diagram showing Prometheus sending the same alerts to a three-replica Alertmanager cluster, the replicas gossiping state amongst themselves in a ring, replicas 2 and 3 forwarding their view to replica 1 for deduplication, and replica 1 forwarding to the receivers.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545B64"/></marker>
        <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse"><polygon points="8 0, 0 3, 8 6" fill="#545B64"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#EC7211"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Cluster zone -->
      <rect x="264" y="152" width="472" height="84" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <rect x="280" y="156" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="312" y="165" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER</text>

      <!-- Prometheus fan-out -->
      <path d="M 460,76 V 116 Q 460,124 452,124 H 348 Q 340,124 340,132 V 180"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 500,76 V 180" fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="474" y="118" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="500" y="127" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALERTS</text>
      <path d="M 540,76 V 116 Q 540,124 548,124 H 652 Q 660,124 660,132 V 180"
            fill="none" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Gossip: AM1 <-> AM2 -->
      <path d="M 400,200 H 440" fill="none" stroke="#545B64" stroke-width="1" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
      <rect x="400" y="180" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="420" y="189" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GOSSIP</text>

      <!-- Gossip: AM2 <-> AM3 -->
      <path d="M 560,200 H 600" fill="none" stroke="#545B64" stroke-width="1" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
      <rect x="560" y="180" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="580" y="189" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GOSSIP</text>

      <!-- Gossip: AM1 <-> AM3 (wrap) -->
      <path d="M 310,220 V 248 Q 310,256 318,256 H 672 Q 680,256 680,248 V 220"
            fill="none" stroke="#545B64" stroke-width="1" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
      <rect x="470" y="236" width="50" height="12" rx="2" fill="#ffffff"/>
      <text x="495" y="245" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GOSSIP</text>

      <!-- Dedup: AM2 -> AM1 -->
      <path d="M 440,212 H 400" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="400" y="224" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="420" y="233" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEDUP</text>

      <!-- Dedup: AM3 -> AM1 (wrap) -->
      <path d="M 640,220 V 272 Q 640,280 632,280 H 378 Q 370,280 370,272 V 220"
            fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="480" y="260" width="50" height="12" rx="2" fill="#ffffff"/>
      <text x="505" y="269" fill="#7D8998" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEDUP</text>

      <!-- AM1 -> Receivers (headline) -->
      <path d="M 340,220 V 240 Q 340,248 332,248 H 240 Q 232,248 232,256 V 320"
            fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- Nodes -->
      <!-- Prometheus (external) -->
      <rect x="420" y="40" width="160" height="36" rx="6" fill="rgba(35,47,62,0.03)"/>
      <rect x="420" y="40" width="160" height="36" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="500" y="62" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Prometheus</text>

      <!-- AM1 (focal) -->
      <rect x="280" y="180" width="120" height="40" rx="6" fill="rgba(255,153,0,0.10)"/>
      <rect x="280" y="180" width="120" height="40" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
      <text x="340" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Alertmanager 1</text>

      <!-- AM2 -->
      <rect x="440" y="180" width="120" height="40" rx="6" fill="#ffffff"/>
      <rect x="440" y="180" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="500" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Alertmanager 2</text>

      <!-- AM3 -->
      <rect x="600" y="180" width="120" height="40" rx="6" fill="#ffffff"/>
      <rect x="600" y="180" width="120" height="40" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
      <text x="660" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Alertmanager 3</text>

      <!-- Receivers (external) -->
      <rect x="152" y="320" width="160" height="40" rx="6" fill="rgba(35,47,62,0.03)"/>
      <rect x="152" y="320" width="160" height="40" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
      <text x="232" y="344" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Receivers</text>

      <!-- Legend -->
      <line x1="30" y1="500" x2="930" y2="500" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="30" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="140" y1="512" x2="176" y2="512" stroke="#545B64" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="184" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">ALERT / GOSSIP</text>
      <line x1="340" y1="512" x2="376" y2="512" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="384" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">DEDUP FORWARD</text>
      <line x1="560" y1="512" x2="596" y2="512" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="604" y="516" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace">TO RECEIVERS</text>
    </svg>