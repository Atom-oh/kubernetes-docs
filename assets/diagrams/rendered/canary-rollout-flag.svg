<title id="canary-rollout-flag-title">카나리 릴리스 + Feature Flag 5단계 롤아웃</title>
<desc id="canary-rollout-flag-desc">새 버전을 Feature Flag OFF로 배포한 뒤 소규모 카나리 트래픽에서 메트릭을 분석해 통과 시 점진적으로 트래픽을 확대하고 실패 시 자동 롤백하는 5단계 배포 절차.</desc>
