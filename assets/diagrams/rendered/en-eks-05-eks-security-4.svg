    <title id="en-eks-05-eks-security-4-title">Pod Identity Agent mechanics</title>
    <desc id="en-eks-05-eks-security-4-desc">Architecture diagram showing the seven-step credential exchange where a pod requests credentials from the node's Pod Identity Agent, which validates identity through the EKS Pod Identity Service and STS before an IAM role's temporary credentials are relayed back and injected into the pod.</desc>
