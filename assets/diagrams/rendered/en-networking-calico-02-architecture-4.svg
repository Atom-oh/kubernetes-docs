      <title id="en-networking-calico-02-architecture-4-title">Route propagation via BGP</title>
      <desc id="en-networking-calico-02-architecture-4-desc">Sequence diagram showing a new pod's route being allocated by Felix, added to BIRD's local routing table, and propagated to peer nodes over a BGP UPDATE so they install it and route Felix accordingly.</desc>
