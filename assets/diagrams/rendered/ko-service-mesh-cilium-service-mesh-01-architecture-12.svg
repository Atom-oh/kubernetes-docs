<title id="ko-service-mesh-cilium-service-mesh-01-architecture-12-title">L7 처리가 필요한 요청/응답 흐름</title>
<desc id="ko-service-mesh-cilium-service-mesh-01-architecture-12-desc">L7 정책이 감지된 요청과 응답만 클라이언트·서버 측 eBPF가 노드 Envoy로 왕복 리다이렉트해 HTTP 파싱, 정책 적용, 메트릭·트레이싱을 수행하는 전체 흐름을 보여준다.</desc>
