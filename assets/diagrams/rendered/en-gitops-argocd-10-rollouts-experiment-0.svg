<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
  <title id="d0-title">Argo Rollouts Experiment resource model</title>
  <desc id="d0-desc">A Rollout creates an Experiment, which is the central resource that spins up baseline and canary ReplicaSets from its templates and starts an AnalysisRun from its analyses; an AnalysisTemplate supplies the AnalysisRun's definition by reference.</desc>

  <defs><style>
@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");
:root{
  --paper:#FFFFFF; --paper-2:#F2F3F3; --ink:#232F3E; --muted:#545B64; --soft:#7D8998;
  --rule:rgba(35,47,62,0.12); --rule-solid:#D5DBDB;
  --accent:#EC7211; --accent-tint:rgba(255,153,0,0.10); --link:#0972D3;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#161E2D; --paper-2:#232F3E; --ink:#FFFFFF; --muted:#B6BEC9; --soft:#8D99A8;
    --rule:rgba(255,255,255,0.12); --rule-solid:rgba(255,255,255,0.25);
    --accent:#FF9900; --accent-tint:rgba(255,153,0,0.14); --link:#539FE5;
  }
}
text{ fill:var(--ink); font-family:'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif; }
</style>
    <pattern id="d0-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="var(--ink)" opacity="0.10"/>
    </pattern>
    <marker id="d0-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/>
    </marker>
    <marker id="d0-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="var(--paper)"/>
  <rect x="0" y="0" width="960" height="600" fill="url(#d0-dots)" opacity="0.55"/>

  <!-- Title -->
  <text x="40" y="46" font-size="20" font-weight="700" fill="var(--ink)">Rollout → Experiment resource model</text>
  <text x="40" y="66" font-size="9" font-family="'Geist Mono',monospace" fill="var(--muted)" letter-spacing="0.02em">CANARY STEP · EXPERIMENT SPEC FAN-OUT</text>

  <!-- ===== Connectors (drawn before nodes) ===== -->

  <!-- R -> E : creates -->
  <path d="M260,132 V152 Q260,160 268,160 H472 Q480,160 480,168 V188"
        fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#d0-arrow)"/>
  <rect x="330" y="167" width="58" height="14" rx="2" fill="var(--paper)"/>
  <text x="359" y="177" font-size="8" font-family="'Geist Mono',monospace" fill="var(--muted)" text-anchor="middle" letter-spacing="0.04em">creates</text>

  <!-- E -> B : spec.templates -->
  <path d="M440,272 V322 Q440,330 432,330 H208 Q200,330 200,338 V382"
        fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#d0-arrow)"/>
  <rect x="234" y="323" width="82" height="14" rx="2" fill="var(--paper)"/>
  <text x="275" y="333" font-size="8" font-family="'Geist Mono',monospace" fill="var(--muted)" text-anchor="middle" letter-spacing="0.02em">spec.templates</text>

  <!-- E -> C : spec.templates (straight, accent — happy-path continuation of focal node) -->
  <path d="M480,272 V382" fill="none" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#d0-arrow-accent)"/>
  <rect x="439" y="318" width="82" height="14" rx="2" fill="var(--paper)"/>
  <text x="480" y="328" font-size="8" font-family="'Geist Mono',monospace" fill="var(--accent)" text-anchor="middle" letter-spacing="0.02em">spec.templates</text>

  <!-- E -> AR : spec.analyses -->
  <path d="M520,272 V322 Q520,330 528,330 H732 Q740,330 740,338 V382"
        fill="none" stroke="var(--muted)" stroke-width="1" marker-end="url(#d0-arrow)"/>
  <rect x="608" y="323" width="80" height="14" rx="2" fill="var(--paper)"/>
  <text x="648" y="333" font-size="8" font-family="'Geist Mono',monospace" fill="var(--muted)" text-anchor="middle" letter-spacing="0.02em">spec.analyses</text>

  <!-- AT -> AR : templateName reference (dashed) -->
  <path d="M780,272 V382" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d0-arrow)"/>
  <rect x="716" y="316" width="128" height="14" rx="2" fill="var(--paper)"/>
  <text x="780" y="326" font-size="8" font-family="'Geist Mono',monospace" fill="var(--muted)" text-anchor="middle" letter-spacing="0.01em">templateName reference</text>

  <!-- ===== Nodes ===== -->

  <!-- R: Rollout -->
  <g>
    <rect x="160" y="98" width="200" height="64" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
    <text x="260" y="125" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">Rollout</text>
    <text x="260" y="142" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" fill="var(--soft)">experiment step in</text>
    <text x="260" y="153" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" fill="var(--soft)">canary steps</text>
  </g>

  <!-- AT: AnalysisTemplate -->
  <g>
    <rect x="680" y="198" width="200" height="64" rx="6" fill="rgba(35,47,62,0.02)" stroke="var(--ink)" stroke-width="0.8" stroke-dasharray="4,3" opacity="1"/>
    <text x="780" y="234" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">AnalysisTemplate</text>
    <text x="780" y="250" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" fill="var(--soft)">reusable analysis spec</text>
  </g>

  <!-- E: Experiment (focal) -->
  <g>
    <rect x="380" y="198" width="200" height="64" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
    <text x="480" y="226" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">Experiment</text>
    <text x="480" y="244" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" fill="var(--muted)">short-lived analysis resource</text>
  </g>

  <!-- B: ReplicaSet baseline -->
  <g>
    <rect x="110" y="382" width="180" height="56" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
    <text x="200" y="406" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">ReplicaSet</text>
    <text x="200" y="422" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" fill="var(--muted)">baseline</text>
  </g>

  <!-- C: ReplicaSet canary -->
  <g>
    <rect x="390" y="382" width="180" height="56" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
    <text x="480" y="406" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">ReplicaSet</text>
    <text x="480" y="422" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" fill="var(--muted)">canary</text>
  </g>

  <!-- AR: AnalysisRun -->
  <g>
    <rect x="650" y="382" width="180" height="56" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
    <text x="740" y="406" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">AnalysisRun</text>
    <text x="740" y="422" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" fill="var(--muted)">runs the metric checks</text>
  </g>

  <!-- Legend -->
  <line x1="40" y1="562" x2="64" y2="562" stroke="var(--muted)" stroke-width="1"/>
  <text x="70" y="565" font-size="8" font-family="'Geist Mono',monospace" fill="var(--muted)">creates / spec fan-out</text>
  <line x1="230" y1="562" x2="254" y2="562" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="260" y="565" font-size="8" font-family="'Geist Mono',monospace" fill="var(--muted)">template reference</text>
  <rect x="460" y="556" width="12" height="12" rx="2" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="478" y="565" font-size="8" font-family="'Geist Mono',monospace" fill="var(--muted)">focal resource</text>
</svg>