<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="composite-title composite-desc">
    <title id="composite-title">Composite Alarm 구성</title>
    <desc id="composite-desc">세 개의 개별 Metric Alarm이 논리 규칙으로 결합되어 하나의 Composite Alarm을 발생시키고, 이것이 SNS/Lambda 액션으로 이어지는 구조.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
      </marker>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Zone: Metric Alarms -->
    <rect x="60" y="140" width="252" height="320" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
    <rect x="76" y="144" width="132" height="12" rx="2" fill="#ffffff"/>
    <text x="142" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">METRIC ALARMS</text>

    <!-- ============ ARROWS ============ -->
    <!-- A1 -> CA -->
    <path d="M312,196 H620" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- A2 -> CA -->
    <path d="M312,300 H620" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- A3 -> CA -->
    <path d="M312,404 H620" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- CA -> Action -->
    <path d="M760,332 V468" fill="none" stroke="#EC7211" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- ============ NODES ============ -->
    <!-- A1 High CPU -->
    <rect x="76" y="172" width="236" height="48" rx="6" fill="#ffffff"/>
    <rect x="76" y="172" width="236" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="194" y="200" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">High CPU Alarm</text>

    <!-- A2 High Memory -->
    <rect x="76" y="276" width="236" height="48" rx="6" fill="#ffffff"/>
    <rect x="76" y="276" width="236" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="194" y="304" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">High Memory Alarm</text>

    <!-- A3 High Disk -->
    <rect x="76" y="380" width="236" height="48" rx="6" fill="#ffffff"/>
    <rect x="76" y="380" width="236" height="48" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
    <text x="194" y="408" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">High Disk Alarm</text>

    <!-- CA Composite Alarm (focal, with rule as sublabel) -->
    <rect x="620" y="256" width="280" height="76" rx="8" fill="rgba(255,153,0,0.10)"/>
    <rect x="620" y="256" width="280" height="76" rx="8" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
    <text x="760" y="284" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Server Resource Critical</text>
    <text x="760" y="300" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(CPU AND Memory)</text>
    <text x="760" y="312" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OR Disk</text>

    <!-- Action -->
    <rect x="656" y="468" width="208" height="48" rx="6" fill="rgba(35,47,62,0.03)"/>
    <rect x="656" y="468" width="208" height="48" rx="6" fill="rgba(35,47,62,0.03)" stroke="rgba(35,47,62,0.30)" stroke-width="1"/>
    <text x="760" y="496" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">SNS / Lambda</text>

  </svg>