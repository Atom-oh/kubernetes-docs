<title id="en-networking-cilium-networking-concepts-5-title">VXLAN Packet Structure</title>
<desc id="en-networking-cilium-networking-concepts-5-desc">Diagram of a VXLAN-encapsulated packet, showing the outer Ethernet, IP, and UDP headers wrapping a VXLAN header, which itself wraps the original Ethernet frame, IP header, TCP/UDP header, and payload.</desc>
