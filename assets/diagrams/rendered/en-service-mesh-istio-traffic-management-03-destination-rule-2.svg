<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dr2-title dr2-desc">
<title id="dr2-title">Subset definitions resolving to pods by label matching</title>
<desc id="dr2-desc">A Kubernetes Service points to two DestinationRule subsets, v1 and v2, each of which resolves by label matching to the actual pods carrying that version label.</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
  <marker id="dr2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
  </marker>
  <marker id="dr2-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#EC7211"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ===== Zones ===== -->
<rect x="232" y="140" width="240" height="300" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="264" y="144" width="176" height="12" rx="2" fill="#ffffff"/>
<text x="352" y="153" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DESTINATIONRULE SUBSETS</text>

<rect x="592" y="100" width="260" height="384" rx="8" fill="rgba(35,47,62,0.02)" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<rect x="676" y="104" width="92" height="12" rx="2" fill="#ffffff"/>
<text x="722" y="113" fill="rgba(35,47,62,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ACTUAL PODS</text>

<!-- ===== Arrows ===== -->
<!-- Service -> S1 (up elbow) -->
<path d="M180,300 H222 Q230,300 230,292 V220 Q230,212 238,212 H280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#dr2-arrow)"/>
<!-- Service -> S2 (down elbow) -->
<path d="M180,300 H222 Q230,300 230,308 V380 Q230,388 238,388 H280" fill="none" stroke="#545B64" stroke-width="1.2" marker-end="url(#dr2-arrow)"/>

<!-- S1 -> P1 (dashed, up elbow) -->
<path d="M424,200 H524 Q532,200 532,192 V180 Q532,172 540,172 H640" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#dr2-arrow)"/>
<!-- S1 -> P2 (dashed, down elbow) -->
<path d="M424,224 H524 Q532,224 532,232 V292 Q532,300 540,300 H640" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#dr2-arrow)"/>
<!-- S2 -> P3 (dashed, down elbow) -->
<path d="M424,388 H524 Q532,388 532,396 V420 Q532,428 540,428 H640" fill="none" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#dr2-arrow)"/>

<!-- ===== Nodes ===== -->
<!-- Service (backend) -->
<rect x="40" y="268" width="140" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="110" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Kubernetes</text>
<text x="110" y="308" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Service</text>
<text x="110" y="322" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reviews</text>

<!-- S1 (focal) -->
<rect x="280" y="180" width="144" height="64" rx="6" fill="rgba(255,153,0,0.10)" stroke="#EC7211" stroke-width="1.2"/>
<text x="352" y="204" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Subset: v1</text>
<text x="352" y="220" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">version=v1</text>

<!-- S2 (backend) -->
<rect x="280" y="356" width="144" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="352" y="380" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">Subset: v2</text>
<text x="352" y="396" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">version=v2</text>

<!-- P1 -->
<rect x="640" y="140" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="728" y="164" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">reviews-v1-abc</text>
<text x="728" y="180" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">version=v1</text>

<!-- P2 -->
<rect x="640" y="268" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="728" y="292" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">reviews-v1-def</text>
<text x="728" y="308" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">version=v1</text>

<!-- P3 -->
<rect x="640" y="396" width="176" height="64" rx="6" fill="#ffffff" stroke="#232F3E" stroke-width="1"/>
<text x="728" y="420" fill="#232F3E" font-size="12" font-weight="600" font-family="'Amazon Ember','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">reviews-v2-xyz</text>
<text x="728" y="436" fill="#545B64" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">version=v2</text>

<!-- ===== Legend ===== -->
<line x1="40" y1="540" x2="920" y2="540" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
<line x1="40" y1="560" x2="72" y2="560" stroke="#545B64" stroke-width="1.2"/>
<text x="80" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DEFINES SUBSET</text>
<line x1="272" y1="560" x2="304" y2="560" stroke="#545B64" stroke-width="1" stroke-dasharray="4,3"/>
<text x="312" y="564" fill="#545B64" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RESOLVES BY LABEL MATCH</text>

</svg>
