<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="14" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Proposed design: LLM gateway request pipeline with two-phase governance</title>
<desc id="diagram-description">Every metered helper, main-model call, output check and retry is separately authorized, reserved and logged before dispatch, then settled. Main denial retains earlier auxiliary charges. This is a proposed design, not a deployment verification.</desc><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151" /></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c" /></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d" /></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8" /></marker>
</defs>
<rect width="1240" height="700" fill="#ffffff" />
<text x="620" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Request pipeline — what happens between a client and a model</text>
<rect x="30" y="90" width="158" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6" />
<text x="109.0" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Auth</text>
<text x="109.0" y="132" text-anchor="middle" font-size="12.5" fill="#374151">x-api-key / Bearer</text>
<text x="109.0" y="149" text-anchor="middle" font-size="12.5" fill="#374151">SHA-256 lookup</text>
<text x="109.0" y="166" text-anchor="middle" font-size="12.5" fill="#374151">→ Principal</text>
<circle cx="46" cy="106" r="11" fill="#1d4ed8" />
<text x="46" y="110.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
<line x1="189" y1="140" x2="201" y2="140" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)" />
<rect x="202" y="90" width="158" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6" />
<text x="281.0" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Parse</text>
<text x="281.0" y="132" text-anchor="middle" font-size="12.5" fill="#374151">protocol-specific</text>
<text x="281.0" y="149" text-anchor="middle" font-size="12.5" fill="#374151">keep RawBody</text>
<text x="281.0" y="166" text-anchor="middle" font-size="12.5" fill="#374151">request start record</text>
<circle cx="218" cy="106" r="11" fill="#1d4ed8" />
<text x="218" y="110.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
<line x1="361" y1="140" x2="373" y2="140" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)" />
<rect x="374" y="90" width="158" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6" />
<text x="453.0" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Route</text>
<text x="453.0" y="132" text-anchor="middle" font-size="12.5" fill="#374151">alias → canonical</text>
<text x="453.0" y="149" text-anchor="middle" font-size="12.5" fill="#374151">fallback / tier</text>
<text x="453.0" y="166" text-anchor="middle" font-size="12.5" fill="#374151">fund paid router first</text>
<circle cx="390" cy="106" r="11" fill="#1d4ed8" />
<text x="390" y="110.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
<line x1="533" y1="140" x2="545" y2="140" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)" />
<rect x="546" y="90" width="158" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6" />
<text x="631" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">RBAC re-check</text>
<text x="625.0" y="132" text-anchor="middle" font-size="12.5" fill="#374151">allow-list AFTER</text>
<text x="625.0" y="149" text-anchor="middle" font-size="12.5" fill="#374151">routing (fallback</text>
<text x="625.0" y="166" text-anchor="middle" font-size="12.5" fill="#374151">targets too)</text>
<circle cx="562" cy="106" r="11" fill="#1d4ed8" />
<text x="562" y="110.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
<line x1="705" y1="140" x2="717" y2="140" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)" />
<rect x="718" y="90" width="158" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6" />
<text x="797.0" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Filters</text>
<text x="797.0" y="132" text-anchor="middle" font-size="12.5" fill="#374151">required privacy</text>
<text x="797.0" y="149" text-anchor="middle" font-size="12.5" fill="#374151">inspect final egress</text>
<text x="797.0" y="166" text-anchor="middle" font-size="12.5" fill="#374151">fund paid checks first</text>
<circle cx="734" cy="106" r="11" fill="#1d4ed8" />
<text x="734" y="110.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
<line x1="877" y1="140" x2="889" y2="140" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)" />
<rect x="890" y="90" width="158" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6" />
<text x="969.0" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Main reserve</text>
<text x="969.0" y="132" text-anchor="middle" font-size="12.5" fill="#374151">final input ceiling</text>
<text x="969.0" y="149" text-anchor="middle" font-size="12.5" fill="#374151">fund output checks</text>
<text x="969.0" y="166" text-anchor="middle" font-size="12.5" fill="#374151">quota + main money</text>
<circle cx="906" cy="106" r="11" fill="#1d4ed8" />
<text x="906" y="110.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
<line x1="1049" y1="140" x2="1061" y2="140" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)" />
<rect x="1062" y="90" width="158" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6" />
<text x="1141.0" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Provider</text>
<text x="1141.0" y="132" text-anchor="middle" font-size="12.5" fill="#374151">inspected final body</text>
<text x="1141.0" y="149" text-anchor="middle" font-size="12.5" fill="#374151">supported adapters;</text>
<text x="1141.0" y="166" text-anchor="middle" font-size="12.5" fill="#374151">subcall start BEFORE</text>
<circle cx="1078" cy="106" r="11" fill="#1d4ed8" />
<text x="1078" y="110.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">7</text>
<text x="560" y="214" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#b91c1c" font-style="italic">Paid helpers have their OWN reservation before execution; main denial retains their charges.</text>
<text x="30" y="276" text-anchor="start" font-size="15" font-weight="700" fill="#111827">Response path</text>
<rect x="202" y="290" width="158" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6" />
<text x="281.0" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Output guard</text>
<text x="281.0" y="332" text-anchor="middle" font-size="12.5" fill="#374151">inspect before release</text>
<text x="281.0" y="349" text-anchor="middle" font-size="12.5" fill="#374151">bounded buffering</text>
<text x="281.0" y="366" text-anchor="middle" font-size="12.5" fill="#374151">paid checks funded</text>
<circle cx="218" cy="306" r="11" fill="#15803d" />
<text x="218" y="310.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">8</text>
<line x1="361" y1="340" x2="373" y2="340" stroke="#15803d" stroke-width="1.8" marker-end="url(#arr-green)" />
<rect x="374" y="290" width="158" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6" />
<text x="459" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Response relay</text>
<text x="453.0" y="332" text-anchor="middle" font-size="12.5" fill="#374151">approved body/events</text>
<text x="453.0" y="349" text-anchor="middle" font-size="12.5" fill="#374151">separate timings</text>
<text x="453.0" y="366" text-anchor="middle" font-size="12.5" fill="#374151">no committed retry</text>
<circle cx="390" cy="306" r="11" fill="#15803d" />
<text x="390" y="310.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">9</text>
<line x1="533" y1="340" x2="545" y2="340" stroke="#15803d" stroke-width="1.8" marker-end="url(#arr-green)" />
<rect x="546" y="290" width="158" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6" />
<text x="625.0" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Cost</text>
<text x="625.0" y="332" text-anchor="middle" font-size="12.5" fill="#374151">versioned prices</text>
<text x="625.0" y="349" text-anchor="middle" font-size="12.5" fill="#374151">all admitted calls</text>
<text x="625.0" y="366" text-anchor="middle" font-size="12.5" fill="#374151">refuse unpriced route</text>
<circle cx="562" cy="306" r="11" fill="#15803d" />
<text x="562" y="310.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">10</text>
<line x1="705" y1="340" x2="717" y2="340" stroke="#15803d" stroke-width="1.8" marker-end="url(#arr-green)" />
<rect x="718" y="290" width="158" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6" />
<text x="797.0" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Settle</text>
<text x="797.0" y="332" text-anchor="middle" font-size="12.5" fill="#374151">idempotent true-up</text>
<text x="797.0" y="349" text-anchor="middle" font-size="12.5" fill="#374151">retain unknown usage</text>
<text x="797.0" y="366" text-anchor="middle" font-size="12.5" fill="#374151">reconcile charges</text>
<circle cx="734" cy="306" r="11" fill="#15803d" />
<text x="734" y="310.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">11</text>
<line x1="877" y1="340" x2="889" y2="340" stroke="#15803d" stroke-width="1.8" marker-end="url(#arr-green)" />
<rect x="890" y="290" width="158" height="100" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6" />
<text x="981" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Audit completion</text>
<text x="969.0" y="332" text-anchor="middle" font-size="12.5" fill="#374151">hash-chained record</text>
<text x="969.0" y="349" text-anchor="middle" font-size="12.5" fill="#374151">start recorded before</text>
<text x="969.0" y="366" text-anchor="middle" font-size="12.5" fill="#374151">provider dispatch</text>
<circle cx="906" cy="306" r="11" fill="#15803d" />
<text x="906" y="310.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">12</text>
<line x1="1049" y1="340" x2="1061" y2="340" stroke="#15803d" stroke-width="1.8" marker-end="url(#arr-green)" />
<rect x="1062" y="290" width="158" height="100" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6" />
<text x="1141.0" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Metrics</text>
<text x="1141.0" y="332" text-anchor="middle" font-size="12.5" fill="#374151">gen_ai.* semconv</text>
<text x="1141.0" y="349" text-anchor="middle" font-size="12.5" fill="#374151">bounded labels</text>
<text x="1141.0" y="366" text-anchor="middle" font-size="12.5" fill="#374151">no key_id, no secret</text>
<circle cx="1078" cy="306" r="11" fill="#15803d" />
<text x="1078" y="310.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">13</text>
<path d="M 1141.0 191 L 1141.0 240 L 281.0 240 L 281.0 288" fill="none" stroke="#15803d" stroke-width="1.8" marker-end="url(#arr-green)" />
<text x="711.0" y="256" text-anchor="middle" font-size="12" font-weight="normal" fill="#15803d">upstream response</text>
<rect x="30" y="430" width="580" height="240" rx="14" fill="#fef3c7" fill-opacity="0.45" stroke="#b45309" stroke-width="1.4" stroke-dasharray="8 5" />
<text x="44" y="452" font-size="15" font-weight="700" fill="#b45309">Per-call reserve and settle</text>
<rect x="50" y="465" width="250" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6" />
<text x="175.0" y="487" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Phase 1 — PreCheck</text>
<text x="175.0" y="507" text-anchor="middle" font-size="12.5" fill="#374151">this call’s conservative bound</text>
<text x="175.0" y="524" text-anchor="middle" font-size="12.5" fill="#374151">atomically reserve quota AND money</text>
<rect x="340" y="465" width="250" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6" />
<text x="465.0" y="487" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Phase 2 — Settle</text>
<text x="465.0" y="507" text-anchor="middle" font-size="12.5" fill="#374151">known usage; reconcile unknowns</text>
<text x="465.0" y="524" text-anchor="middle" font-size="12.5" fill="#374151">release the unused reservation</text>
<line x1="302" y1="500" x2="338" y2="500" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)" />
<text x="320" y="558" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#374151">Price a bound before EACH paid call, including helpers and output checks.</text>
<text x="320" y="575" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#374151">Main denial does not erase charges from earlier admitted calls.</text>
<text x="320" y="592" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#374151">Settle known usage once; keep conservative reservations for uncertain charges.</text>
<text x="320" y="620" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#6d28d9">Ledger invariant: spent + outstanding reserved grants ≤ limit.</text>
<text x="320" y="637" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#6d28d9">Expiry stops admissions; reconcile pending usage before regranting.</text>
<text x="320" y="654" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#6d28d9">Durable IDs, conservative pricing and crash recovery are required.</text>
<rect x="640" y="430" width="570" height="240" rx="14" fill="#dcfce7" fill-opacity="0.45" stroke="#15803d" stroke-width="1.4" stroke-dasharray="8 5" />
<text x="654" y="452" font-size="15" font-weight="700" fill="#15803d">Cache preservation goal</text>
<text x="660" y="470" text-anchor="start" font-size="13" font-weight="600" fill="#111827">Preserve prompt/token prefixes and supported cache controls.</text>
<text x="660" y="492" text-anchor="start" font-size="12.5" font-weight="normal" fill="#374151">Anthropic matches prompt segments; vLLM hashes token blocks/context.</text>
<text x="660" y="510" text-anchor="start" font-size="12.5" font-weight="normal" fill="#374151">HTTP JSON formatting alone is not a universal cache invalidator.</text>
<text x="660" y="528" text-anchor="start" font-size="12.5" font-weight="normal" fill="#374151">Content/model changes, scope, length and TTL determine reuse.</text>
<text x="660" y="546" text-anchor="start" font-size="12.5" font-weight="normal" fill="#374151">Measure cache usage; do not assume hit rates or fixed savings.</text>
<text x="660" y="580" text-anchor="start" font-size="13" font-weight="600" fill="#111827">Consequences for gateway design:</text>
<text x="660" y="600" text-anchor="start" font-size="12.5" font-weight="normal" fill="#374151">• required privacy/security controls take precedence over raw forwarding</text>
<text x="660" y="618" text-anchor="start" font-size="12.5" font-weight="normal" fill="#374151">• keep policy prefixes stable inside the intended cache boundary</text>
<text x="660" y="636" text-anchor="start" font-size="12.5" font-weight="normal" fill="#374151">• stable conversion can warm target caches; provider caches do not transfer</text>
<text x="620" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Every paid call: authorize → reserve → record start → dispatch → settle</text></svg>
