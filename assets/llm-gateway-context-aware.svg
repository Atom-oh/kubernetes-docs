<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="14">
<title>Context-aware gateway: signals in, decisions out</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
</defs>
<rect width="1240" height="770" fill="#ffffff"/>
<text x="620" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Context-aware gateway — four kinds of context feed every decision</text>
<rect x="30" y="80" width="260" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
<text x="160.0" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Request context</text>
<text x="160.0" y="122" text-anchor="middle" font-size="12.5" fill="#374151">token count (estimate / count_tokens)</text>
<text x="160.0" y="139" text-anchor="middle" font-size="12.5" fill="#374151">model, tools, cache_control breakpoints</text>
<text x="160.0" y="156" text-anchor="middle" font-size="12.5" fill="#374151">streaming? max_tokens? thinking?</text>
<rect x="30" y="230" width="260" height="130" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="160.0" y="252" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Principal context</text>
<text x="160.0" y="272" text-anchor="middle" font-size="12.5" fill="#374151">team · user · key · region</text>
<text x="160.0" y="289" text-anchor="middle" font-size="12.5" fill="#374151">budget utilization &amp; active tier</text>
<text x="160.0" y="306" text-anchor="middle" font-size="12.5" fill="#374151">policy version in effect</text>
<rect x="30" y="380" width="260" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="160.0" y="402" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Session / conversation context</text>
<text x="160.0" y="422" text-anchor="middle" font-size="12.5" fill="#374151">prefix hash of the conversation</text>
<text x="160.0" y="439" text-anchor="middle" font-size="12.5" fill="#374151">PII vault, already-scanned blocks</text>
<text x="160.0" y="456" text-anchor="middle" font-size="12.5" fill="#374151">provider the session is pinned to</text>
<rect x="30" y="530" width="260" height="130" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="160.0" y="552" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Infrastructure context</text>
<text x="160.0" y="572" text-anchor="middle" font-size="12.5" fill="#374151">per-pod KV-cache utilization</text>
<text x="160.0" y="589" text-anchor="middle" font-size="12.5" fill="#374151">queue depth · circuit breaker state</text>
<text x="160.0" y="606" text-anchor="middle" font-size="12.5" fill="#374151">provider latency / error rate · region</text>
<rect x="400" y="250" width="300" height="240" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="550.0" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Decision engine</text>
<text x="550.0" y="292" text-anchor="middle" font-size="12.5" fill="#374151"></text>
<text x="550" y="300" text-anchor="middle" font-size="13" font-weight="normal" fill="#111827">consistent-hash(prefix) → replica</text>
<text x="550" y="322" text-anchor="middle" font-size="13" font-weight="normal" fill="#111827">tokens vs window → fast-fail / long-ctx</text>
<text x="550" y="344" text-anchor="middle" font-size="13" font-weight="normal" fill="#111827">utilization → cheaper tier</text>
<text x="550" y="366" text-anchor="middle" font-size="13" font-weight="normal" fill="#111827">delta-only PII / injection scan</text>
<text x="550" y="388" text-anchor="middle" font-size="13" font-weight="normal" fill="#111827">breaker open → next in chain</text>
<text x="550" y="410" text-anchor="middle" font-size="13" font-weight="normal" fill="#111827">region ∈ allowed → provider</text>
<text x="550" y="445" text-anchor="middle" font-size="12" font-weight="normal" fill="#6b7280" font-style="italic">stateless per request; state lives in</text>
<text x="550" y="462" text-anchor="middle" font-size="12" font-weight="normal" fill="#6b7280" font-style="italic">policy sync + bounded in-memory tables</text>
<line x1="292" y1="145" x2="398" y2="320" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="292" y1="295" x2="398" y2="370" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="292" y1="445" x2="398" y2="370" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="292" y1="595" x2="398" y2="420" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="810" y="90" width="400" height="78" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
<text x="1010.0" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Model + provider + region</text>
<text x="1010.0" y="132" text-anchor="middle" font-size="12.5" fill="#374151">which target, from which chain</text>
<line x1="702" y1="370" x2="808" y2="129" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="810" y="200" width="400" height="78" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="1010.0" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Replica (endpoint)</text>
<text x="1010.0" y="242" text-anchor="middle" font-size="12.5" fill="#374151">the pod that already holds the KV prefix</text>
<line x1="702" y1="370" x2="808" y2="239" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="810" y="310" width="400" height="78" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="1010.0" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Verdict</text>
<text x="1010.0" y="352" text-anchor="middle" font-size="12.5" fill="#374151">allow · 400 too-large · 402 budget · 429 rate</text>
<line x1="702" y1="370" x2="808" y2="349" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="810" y="420" width="400" height="78" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="1010.0" y="442" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Body transform</text>
<text x="1010.0" y="462" text-anchor="middle" font-size="12.5" fill="#374151">mask delta blocks, prepend stable policy prompt</text>
<line x1="702" y1="370" x2="808" y2="459" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="810" y="530" width="400" height="78" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="1010.0" y="552" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Headers + audit fields</text>
<text x="1010.0" y="572" text-anchor="middle" font-size="12.5" fill="#374151">x-…-model-fallback, substituted_from, tier</text>
<line x1="702" y1="370" x2="808" y2="569" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="30" y="680" width="1180" height="70" rx="14" fill="#ffffff" fill-opacity="0.45" stroke="#9ca3af" stroke-width="1.4"/>
<text x="44" y="702" font-size="15" font-weight="700" fill="#9ca3af"></text>
<text x="50" y="706" text-anchor="start" font-size="12.5" font-weight="normal" fill="#111827">Prefix-cache affinity: same conversation ⇒ same replica (self-hosted) or same provider (hosted). Breaking affinity is a cold cache: pay full input price again.</text>
<text x="50" y="728" text-anchor="start" font-size="12.5" font-weight="normal" fill="#374151">Agent loops resend the full history every turn ⇒ O(n²) scanning if you re-scan everything; scan only new blocks and remember what was scanned per session.</text>
</svg>