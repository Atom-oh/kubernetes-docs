<h2 id="%EC%A0%84%ED%86%B5%EC%A0%81-%EB%B0%A9%EC%8B%9D-vs-istio-level-300-%EB%B9%84%EA%B5%90">전통적 방식 vs Istio (Level 300 비교)</h2>
<div class="tiny">
<table>
<thead>
<tr>
<th>항목</th>
<th>전통 방식</th>
<th>문제점</th>
<th>Istio</th>
<th>기술 세부사항</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>mTLS</strong></td>
<td>앱 코드 통합</td>
<td>언어별 구현, 인증서 관리</td>
<td>Envoy sidecar</td>
<td>SPIFFE/SPIRE, SDS API</td>
</tr>
<tr>
<td><strong>Canary</strong></td>
<td>kubectl scale</td>
<td>Pod 수 ≠ 트래픽 비율</td>
<td>VirtualService weight</td>
<td>xDS EDS 업데이트</td>
</tr>
<tr>
<td><strong>Locality</strong></td>
<td>kube-proxy</td>
<td>모든 트래픽 균등 분산</td>
<td>DestinationRule locality</td>
<td>Priority/Weight 기반 EDS</td>
</tr>
<tr>
<td><strong>Rate Limit</strong></td>
<td>App 레벨</td>
<td>분산 환경 정확도 낮음</td>
<td>EnvoyFilter</td>
<td>Token Bucket, Local/Global</td>
</tr>
<tr>
<td><strong>Observability</strong></td>
<td>APM 통합</td>
<td>서비스별 계측 필요</td>
<td>자동 메트릭</td>
<td>Envoy stats, Access Log</td>
</tr>
<tr>
<td><strong>Circuit Breaking</strong></td>
<td>수동 구현</td>
<td>Timeout/Retry 불일치</td>
<td>DestinationRule</td>
<td>Outlier Detection</td>
</tr>
</tbody>
</table>
</div>

<h2 id="service-mesh%EC%9D%98-%ED%83%84%EC%83%9D-%EB%B0%B0%EA%B2%BD">Service Mesh의 탄생 배경</h2>
<div class="columns">
<div>
<p><strong>2010년대 마이크로서비스 시대</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>모놀리스 → 마이크로서비스 전환
- Netflix: 수백 개 서비스
- Uber: 2,000+ 서비스
- Amazon: SOA → 마이크로서비스
</code></pre>
</div>
<div>
<p><strong>새로운 문제들</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 서비스 간 통신 복잡도 폭발
   - N개 서비스 = N×(N-1) 연결
   - 100 서비스 = 9,900 연결 관리

<img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 보안 (mTLS)을 각 언어로 구현
   - Go, Java, Python, Node.js, Ruby, C++...
   - 중복 코드, 버그, 인증서 관리

<img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 관찰성 (Observability) 부재
   - 어느 서비스가 느린지?
   - 에러는 어디서?

<img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 트래픽 제어 어려움
   - Canary 배포 = kubectl scale (부정확)
   - Circuit Breaking = 각자 구현
</code></pre>
</div>
</div>

<h2 id="envoy-proxy%EC%9D%98-%EB%93%B1%EC%9E%A5-2016">Envoy Proxy의 등장 (2016)</h2>
<div class="columns">
<div>
<p><strong>Lyft의 문제</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>- 수백 개 마이크로서비스
  (Python, Go, Java 혼재)
- 기존 프록시 한계
  (HAProxy, NGINX)
  → 정적 설정
  → L7 기능 부족
  → 각 서비스에 로드 밸런서
    코드 중복
</code></pre>
</div>
<div>
<p><strong>Matt Klein의 해결책: Envoy</strong></p>
<ul>
<li><strong>L7 Proxy</strong>: HTTP/2, gRPC 네이티브</li>
<li><strong>동적 설정</strong>: xDS API</li>
<li><strong>풍부한 관찰성</strong>: 50+ 메트릭,<br />
Access Log, Tracing</li>
<li><strong>고성능</strong>: C++, 비동기 I/O</li>
<li><strong>확장 가능</strong>: Filter Chain<br />
(Lua, WASM)</li>
</ul>
<p><strong>2016년 오픈소스 공개</strong> → CNCF</p>
</div>
</div>

<h2 id="istio%EC%9D%98-%ED%83%84%EC%83%9D-2017">Istio의 탄생 (2017)</h2>
<div class="columns">
<div>
<p><strong>Google + IBM + Lyft 협력</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>문제: Envoy는 훌륭하지만 설정이 복잡
     → 각 마이크로서비스마다 Envoy 설정?
     → 수백 개 서비스 = 수백 개 설정 파일

해결: Kubernetes 네이티브 컨트롤 플레인
     → VirtualService, DestinationRule (CRD)
     → istiod가 자동으로 Envoy 설정 생성
     → xDS API로 동적 푸시
</code></pre>
</div>
<div>
<p><strong>Istio 주요 마일스톤</strong>:</p>
<ul>
<li><strong>2017.05</strong>: Istio 0.1 공개 (Pilot, Mixer, Citadel 분리)</li>
<li><strong>2019</strong>: Istio 1.1 (성능 개선, 프로덕션 준비)</li>
<li><strong>2020</strong>: Istio 1.5 → <strong>Istiod 통합</strong> (단일 바이너리)</li>
<li><strong>2022</strong>: Istio 1.14 → <strong>Ambient Mode</strong> (Sidecar 없음)</li>
<li><strong>2025</strong>: Istio 1.24 (현재 버전)</li>
</ul>
</div>
</div>

<h2 id="%EC%99%9C-istio%EC%9D%B8%EA%B0%80-%ED%95%B5%EC%8B%AC-%EA%B0%80%EC%B9%98">왜 Istio인가? (핵심 가치)</h2>
<div class="columns-4">
<div>
<p><strong>1. 트래픽 관리 <br />(Traffic Management)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Canary 배포: 1% 단위로 정밀 제어
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> A/B 테스팅: Header 기반 라우팅
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Circuit Breaking: 자동 장애 격리
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Retry &amp; Timeout: 세밀한 설정
</code></pre>
</div>
<div>
<p><strong>2. 보안 <br />(Security)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> 자동 mTLS: 코드 수정 없이 암호화
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> SPIFFE Identity: 표준 기반 인증
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> AuthorizationPolicy: L7 수준 접근 제어
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> 인증서 자동 갱신: 15분마다
</code></pre>
</div>
<div>
<p><strong>3. 관찰성 <br />(Observability)</strong></p>

<h2 id="xds-%ED%94%84%EB%A1%9C%ED%86%A0%EC%BD%9C-envoy-%EB%8F%99%EC%A0%81-%EC%84%A4%EC%A0%95">xDS 프로토콜: Envoy 동적 설정</h2>
<p><strong>xDS API 구성</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>LDS (Listener Discovery Service)    → 15001: Inbound, 15006: Outbound
RDS (Route Discovery Service)        → VirtualService 규칙
CDS (Cluster Discovery Service)      → DestinationRule 정책
EDS (Endpoint Discovery Service)     → Pod IP, Health, Locality
SDS (Secret Discovery Service)       → mTLS 인증서, Private Key
</code></pre>
<p><strong>업데이트 흐름</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">VirtualService 생성
  → istiod가 RDS 업데이트 감지
  → Envoy에 새 라우팅 규칙 푸시 (xDS)
  → Envoy가 즉시 적용 (&lt; 100ms)
</code></pre>

<h2 id="envoy-routing-%EB%82%B4%EB%B6%80-%EB%8F%99%EC%9E%91-%EC%9B%90%EB%A6%AC">Envoy Routing: 내부 동작 원리</h2>
<p><strong>Listener Filter Chain</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. TLS Inspector → SNI 추출
2. HTTP Connection Manager → HTTP/1.1, HTTP/2, HTTP/3
3. Router Filter → VirtualService 매칭
4. Upstream Cluster → DestinationRule 적용
5. Load Balancer → Pod 선택
</code></pre>
<p><strong>Routing 우선순위</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># VirtualService match 우선순위</span>
<span class="hljs-attr">1. Exact match (exact:</span> <span class="hljs-string">&quot;/api/v1/users&quot;</span><span class="hljs-string">)</span>
<span class="hljs-attr">2. Prefix match (prefix:</span> <span class="hljs-string">&quot;/api/&quot;</span><span class="hljs-string">)</span>
<span class="hljs-attr">3. Regex match (regex:</span> <span class="hljs-string">&quot;^/api/v[0-9]+/&quot;</span><span class="hljs-string">)</span>
<span class="hljs-number">4</span><span class="hljs-string">.</span> <span class="hljs-string">기본</span> <span class="hljs-string">route</span> <span class="hljs-string">(match</span> <span class="hljs-string">없음)</span>
</code></pre>

<h2 id="uri-rewrite--redirect">URI Rewrite &amp; Redirect</h2>
<div class="columns">
<div>
<p><strong>URI Rewrite</strong>:</p>
<div class="small">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">spec:</span>
  <span class="hljs-attr">http:</span>
  <span class="hljs-comment"># /old-api → /api/v2 로 재작성</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">match:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">uri:</span>
        <span class="hljs-attr">prefix:</span> <span class="hljs-string">&quot;/old-api&quot;</span>
    <span class="hljs-attr">rewrite:</span>
      <span class="hljs-attr">uri:</span> <span class="hljs-string">&quot;/api/v2&quot;</span>
    <span class="hljs-attr">route:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">destination:</span>
        <span class="hljs-attr">host:</span> <span class="hljs-string">api-service</span>
</code></pre>
</div>
</div>
<div>
<p><strong>Redirect</strong>:</p>
<div class="small">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml">  <span class="hljs-comment"># 301 Redirect</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">match:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">uri:</span>
        <span class="hljs-attr">prefix:</span> <span class="hljs-string">&quot;/old-page&quot;</span>
    <span class="hljs-attr">redirect:</span>
      <span class="hljs-attr">uri:</span> <span class="hljs-string">&quot;/new-page&quot;</span>
      <span class="hljs-attr">authority:</span> <span class="hljs-string">&quot;newapp.example.com&quot;</span>
</code></pre>
</div>
</div>
</div>

<p><strong>VirtualService 자동 조정</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># Rollout이 자동으로 업데이트하는 부분</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">networking.istio.io/v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">VirtualService</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">myapp-vsvc</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">http:</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">name:</span> <span class="hljs-string">primary</span>
    <span class="hljs-attr">route:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">destination:</span>
        <span class="hljs-attr">host:</span> <span class="hljs-string">myapp</span>
        <span class="hljs-attr">subset:</span> <span class="hljs-string">stable</span>
      <span class="hljs-attr">weight:</span> <span class="hljs-number">90</span>  <span class="hljs-comment"># Rollout Controller가 조정</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">destination:</span>
        <span class="hljs-attr">host:</span> <span class="hljs-string">myapp</span>
        <span class="hljs-attr">subset:</span> <span class="hljs-string">canary</span>
      <span class="hljs-attr">weight:</span> <span class="hljs-number">10</span>  <span class="hljs-comment"># Rollout Controller가 조정</span>

      
</code></pre>

<h2 id="argo-rollouts-reconcile-loop-%EB%B6%84%EC%84%9D">Argo Rollouts: Reconcile Loop 분석</h2>
<div class="tiny">
<p><strong>내부 동작</strong>:</p>
<ol>
<li>
<p><strong>Rollout Controller</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>- Image 변경 감지
- Canary ReplicaSet 생성
- VirtualService weight 업데이트 (10%)
- AnalysisRun 시작
</code></pre>
</li>
<li>
<p><strong>Analysis Controller</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>- Prometheus 쿼리 실행 (30초 간격)
- successCondition 평가
- failureLimit 카운팅
- Rollout에 결과 전달 (Success/Failed)
</code></pre>
</li>
<li>
<p><strong>자동 진행/롤백</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Success → weight 증가 (10% → 25%)  |   Failed  → weight 복원 (10% → 0%), Stable로 복구
</code></pre>
</li>
</ol>
</div>

<h2 id="canary-%EB%B0%B0%ED%8F%AC-%EC%8B%A4%EC%A0%84-%EB%AC%B8%EC%A0%9C-split-brain">Canary 배포 실전 문제: Split Brain</h2>
<p><strong>문제 시나리오</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>VirtualService: 10% Canary
실제 트래픽:   50% Canary (<img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 불일치!)
</code></pre>
<p><strong>원인</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># DestinationRule의 서브셋 레이블이 잘못됨</span>
kubectl get pods -l app=myapp --show-labels

<span class="hljs-comment"># Canary Pod에 stable 레이블이 남아있음</span>
myapp-canary-abc123   app=myapp,version=canary,rollouts-pod-template-hash=stable
</code></pre>
<p><strong>해결</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Rollout이 자동으로 관리하는 레이블 확인</span>

</code></pre>

<h2 id="locality-routing-envoy-priority--weight">Locality Routing: Envoy Priority &amp; Weight</h2>
<div class="columns">
<div>
<p><strong>Locality Priority 구조</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Priority 0 (Local AZ):
  - us-east-1a/pod-1: healthy, weight=1
  - us-east-1a/pod-2: healthy, weight=1
Priority 1 (Other AZ):
  - us-east-1b/pod-3: healthy, weight=1
  - us-east-1c/pod-4: degraded (excluded)
Priority 2 (Remote Region):
  - us-west-1a/pod-5: healthy, weight=1
</code></pre>
<p><strong>로드 밸런싱 알고리즘</strong>:</p>
<ul>
<li>Priority 0이 Healthy → 100% Priority 0으로 전송</li>
<li>Priority 0이 Degraded → Priority 1로 Failover</li>
</ul>
</div>
<div>
<p><strong>Overprovisioning Factor: 140% (기본값)</strong></p>
<p>건강한 엔드포인트 비율 계산:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Healthy × 1.4 ≥ Total
</code></pre>
<p><strong>예제</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>시나리오 1: 10개 엔드포인트, 8개 healthy
→ 8 × 1.4 = 11.2 ≥ 10 <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/>
→ Priority 0에 100% 전송

시나리오 2: 10개 엔드포인트, 7개 healthy
→ 7 × 1.4 = 9.8 &lt; 10 <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/>
→ Priority 1로 spillover
</code></pre>
<p><strong>목적</strong>: 안정성 확보 + 비용 절감</p>
</div>
</div>

</code></pre>

<h2 id="locality-routing-%EB%94%94%EB%B2%84%EA%B9%85">Locality Routing 디버깅</h2>
<div class="small">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 1. Pod의 Locality 레이블 확인</span>
kubectl get pods -o json | jq -r <span class="hljs-string">&#x27;.items[] |
  &quot;\(.metadata.name)\t\(.metadata.labels[&quot;topology.kubernetes.io/region&quot;])\t
   \(.metadata.labels[&quot;topology.kubernetes.io/zone&quot;])&quot;&#x27;</span>

<span class="hljs-comment"># 2. Envoy Endpoint Priority 확인</span>
istioctl proxy-config endpoints &lt;pod-name&gt; --cluster <span class="hljs-string">&quot;outbound|9080||api-service.default.svc.cluster.local&quot;</span> -o json | \
  jq <span class="hljs-string">&#x27;.[] | .localityLbEndpoints[] | {locality: .locality, priority: .priority, lb_endpoints: .lbEndpoints[]}&#x27;</span>

<span class="hljs-comment"># 3. 실제 트래픽 분포 확인 (Prometheus)</span>
<span class="hljs-built_in">sum</span> by (destination_workload_locality) (rate(istio_requests_total{
  source_workload=<span class="hljs-string">&quot;frontend&quot;</span>,
  destination_service=<span class="hljs-string">&quot;api-service&quot;</span>}[5m]))
</code></pre>
</div>

<h2 id="spot-instance-graceful-termination-%EB%A9%94%EC%BB%A4%EB%8B%88%EC%A6%98">Spot Instance: Graceful Termination 메커니즘</h2>
<p><strong>타임라인</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>T-120s: EC2 Spot Termination Notice
T-90s:  Node Termination Handler → Cordon Node
T-60s:  kubelet → SIGTERM to Pods
T-30s:  Envoy PreStop Hook 시작
T-20s:  Envoy Health Check → /healthz/ready 실패 반환
T-15s:  istiod → EDS에서 Endpoint 제거
T-10s:  모든 Envoy Sidecar가 EDS 업데이트 수신
T-5s:   기존 연결 Drain (최대 30초)
T-0s:   Pod 종료
</code></pre>
<p><strong>핵심</strong>: Envoy가 새 연결을 거부하고 기존 연결을 정리</p>

<h2 id="keda-custom-metrics--scaling">KEDA: Custom Metrics &amp; Scaling</h2>
<div class="small">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">apiVersion:</span> <span class="hljs-string">keda.sh/v1alpha1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">ScaledObject</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">advanced-scaling</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">scaleTargetRef:</span>
    <span class="hljs-attr">name:</span> <span class="hljs-string">api-service</span>
  <span class="hljs-attr">minReplicaCount:</span> <span class="hljs-number">3</span>
  <span class="hljs-attr">maxReplicaCount:</span> <span class="hljs-number">100</span>

  <span class="hljs-comment"># 다중 Trigger (OR 조건)</span>
  <span class="hljs-attr">triggers:</span>
  <span class="hljs-comment"># 1. RPS 기반 Scaling</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">type:</span> <span class="hljs-string">prometheus</span>
    <span class="hljs-attr">metadata:</span>
      <span class="hljs-attr">serverAddress:</span> <span class="hljs-string">http://prometheus:9090</span>
      <span class="hljs-attr">query:</span> <span class="hljs-string">|
        sum(rate(istio_requests_total{
          destination_service=&quot;api-service&quot;}[1m]))
</span>      <span class="hljs-attr">threshold:</span> <span class="hljs-string">&quot;1000&quot;</span>  <span class="hljs-comment"># 1000 RPS per replica</span>

  <span class="hljs-comment"># 2. Queue Depth 기반 Scaling</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">type:</span> <span class="hljs-string">prometheus</span>
    <span class="hljs-attr">metadata:</span>
      <span class="hljs-attr">query:</span> <span class="hljs-string">|
        sum(envoy_cluster_upstream_rq_pending{
          cluster_name=~&quot;outbound.*api-service.*&quot;})
</span>      <span class="hljs-attr">threshold:</span> <span class="hljs-string">&quot;50&quot;</span>  <span class="hljs-comment"># 50개 대기 요청</span>
</code></pre>
</div>

<h2 id="keda-%EA%B3%A0%EA%B8%89-scaling-%EC%A0%84%EB%9E%B5">KEDA: 고급 Scaling 전략</h2>
<div class="tiny">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml">  <span class="hljs-comment"># 3. CPU + Memory 복합 메트릭</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">type:</span> <span class="hljs-string">prometheus</span>
    <span class="hljs-attr">metadata:</span>
      <span class="hljs-attr">query:</span> <span class="hljs-string">|
        (avg(rate(container_cpu_usage_seconds_total{
          pod=~&quot;api-service-.*&quot;}[1m])) * 100) +
        (avg(container_memory_working_set_bytes{
          pod=~&quot;api-service-.*&quot;}) /
         avg(container_spec_memory_limit_bytes{
          pod=~&quot;api-service-.*&quot;}) * 100)
</span>      <span class="hljs-attr">threshold:</span> <span class="hljs-string">&quot;150&quot;</span>  <span class="hljs-comment"># CPU + Memory &gt; 150%</span>

  <span class="hljs-comment"># Cool-down 설정</span>
  <span class="hljs-attr">advanced:</span>
    <span class="hljs-attr">horizontalPodAutoscalerConfig:</span>
      <span class="hljs-attr">behavior:</span>
        <span class="hljs-attr">scaleDown:</span>
          <span class="hljs-attr">stabilizationWindowSeconds:</span> <span class="hljs-number">300</span>  <span class="hljs-comment"># 5분 안정화</span>
          <span class="hljs-attr">policies:</span>
          <span class="hljs-bullet">-</span> <span class="hljs-attr">type:</span> <span class="hljs-string">Percent</span>

          <span class="hljs-attr">policies:</span>
          <span class="hljs-bullet">-</span> <span class="hljs-attr">type:</span> <span class="hljs-string">Percent</span>
            <span class="hljs-attr">value:</span> <span class="hljs-number">100</span>  <span class="hljs-comment"># 최대 2배 확장</span>

</code></pre>

<h2 id="keda--spot-%ED%94%84%EB%A1%9C%EB%8D%95%EC%85%98-%EC%8B%9C%EB%82%98%EB%A6%AC%EC%98%A4">KEDA + Spot: 프로덕션 시나리오</h2>
<p><strong>문제</strong>: Spot Termination 중 Scale-out 발생</p>
<p><strong>시나리오</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. Spot Termination 시작 (3개 Pod 종료)
2. KEDA가 부하 증가 감지 → Scale-out 트리거
3. 새 Pod이 Spot Node에 스케줄링 (<img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/>)
4. 또 다시 Termination (무한 반복)
</code></pre>
<p><strong>해결</strong>: Priority Class + Topology Spread</p>
<div class="small">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">apiVersion:</span> <span class="hljs-string">v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">PriorityClass</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">on-demand-preferred</span>
<span class="hljs-attr">value:</span> <span class="hljs-number">1000</span>
<span class="hljs-attr">globalDefault:</span> <span class="hljs-literal">false</span>
<span class="hljs-attr">preemptionPolicy:</span> <span class="hljs-string">PreemptLowerPriority</span>
</code></pre>
</div>

<h2 id="topology-spread-constraints">Topology Spread Constraints</h2>
<div class="small">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">apiVersion:</span> <span class="hljs-string">apps/v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">Deployment</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">template:</span>
    <span class="hljs-attr">spec:</span>
      <span class="hljs-attr">priorityClassName:</span> <span class="hljs-string">on-demand-preferred</span>

      <span class="hljs-comment"># Spot/On-Demand 균등 분산</span>
      <span class="hljs-attr">topologySpreadConstraints:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">maxSkew:</span> <span class="hljs-number">1</span>
        <span class="hljs-attr">topologyKey:</span> <span class="hljs-string">node.kubernetes.io/instance-type</span>
        <span class="hljs-attr">whenUnsatisfiable:</span> <span class="hljs-string">DoNotSchedule</span>
        <span class="hljs-attr">labelSelector:</span>
          <span class="hljs-attr">matchLabels:</span>
            <span class="hljs-attr">app:</span> <span class="hljs-string">api-service</span>

      <span class="hljs-comment"># AZ 간 균등 분산</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">maxSkew:</span> <span class="hljs-number">2</span>
        <span class="hljs-attr">topologyKey:</span> <span class="hljs-string">topology.kubernetes.io/zone</span>
        <span class="hljs-attr">whenUnsatisfiable:</span> <span class="hljs-string">ScheduleAnyway</span>
        <span class="hljs-attr">labelSelector:</span>
          <span class="hljs-attr">matchLabels:</span>
            <span class="hljs-attr">app:</span> <span class="hljs-string">api-service</span>
</code></pre>
</div>

</code></pre>

<h2 id="mtls-sds-api%EB%A5%BC-%ED%86%B5%ED%95%9C-%EC%9D%B8%EC%A6%9D%EC%84%9C-%EA%B0%B1%EC%8B%A0">mTLS: SDS API를 통한 인증서 갱신</h2>
<div class="columns-3">
<div>
<p><strong>자동 갱신 흐름</strong>:</p>
<img src="diagrams/diagram-02.png" />
</div>
<div>
<p><strong>특징</strong>:</p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> 자동 인증서 발급 및 갱신</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> 워크로드 단위 인증서</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> 15분마다 자동 갱신</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> SPIFFE 표준 준수</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> 별도 설정 불필요</li>
</ul>
<p><strong>SPIFFE ID 예시</strong>:</p>
<div class="nano">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>spiffe://cluster.local/
  ns/production/
  sa/api-service
</code></pre>
</div>
</div>
<div>
<p><strong>인증서 유형</strong>:</p>
<div>
<p><strong>1. 워크로드 mTLS</strong></p>
<ul>
<li>istiod CA 발급</li>
<li>SDS로 자동 배포</li>
<li>별도 설정 불필요</li>
</ul>
<p><strong>2. Gateway TLS</strong></p>
<ul>
<li>외부 트래픽 종료용</li>
<li>Secret에 수동 저장</li>
<li>cert-manager 권장</li>
</ul>
</div>
</div>
</div>

<h2 id="mtls-strict-%EB%AA%A8%EB%93%9C-%EC%A0%84%ED%99%98-%EC%A0%84%EB%9E%B5">mTLS: STRICT 모드 전환 전략</h2>
<p><strong>단계적 전환</strong>:</p>
<div class="small">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># Phase 1: PERMISSIVE (기본값)</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">security.istio.io/v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">PeerAuthentication</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">default</span>
  <span class="hljs-attr">namespace:</span> <span class="hljs-string">istio-system</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">mtls:</span>
    <span class="hljs-attr">mode:</span> <span class="hljs-string">PERMISSIVE</span>  <span class="hljs-comment"># mTLS + Plain 모두 허용</span>
<span class="hljs-comment"># Phase 2: 모니터링 (2주)</span>
<span class="hljs-comment"># Prometheus Query:</span>
<span class="hljs-string">sum(rate(istio_requests_total{</span>
  <span class="hljs-string">connection_security_policy=&quot;mutual_tls&quot;}[5m]))</span> <span class="hljs-string">/</span>
<span class="hljs-string">sum(rate(istio_requests_total[5m]))</span>
<span class="hljs-comment"># 목표: &gt; 99%</span>
<span class="hljs-comment"># Phase 3: STRICT 전환</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">mtls:</span>
    <span class="hljs-attr">mode:</span> <span class="hljs-string">STRICT</span>  <span class="hljs-comment"># Plain 차단</span>


</code></pre>
</div>

<h2 id="mtls-%ED%8A%B8%EB%9F%AC%EB%B8%94%EC%8A%88%ED%8C%85-%EC%97%B0%EA%B2%B0-%EC%8B%A4%ED%8C%A8">mTLS 트러블슈팅: 연결 실패</h2>
<div class="small">
<p><strong>증상</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>upstream connect error or disconnect/reset before headers. reset reason: connection failure
</code></pre>
<p><strong>디버깅</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 1. mTLS 상태 확인</span>
istioctl authn tls-check &lt;source-pod&gt; &lt;dest-service&gt;

<span class="hljs-comment"># 출력:</span>
HOST:PORT             STATUS     CLIENT     SERVER
api-service.prod.svc  CONFLICT   mTLS       HTTP   ← 문제!

<span class="hljs-comment"># 2. PeerAuthentication 확인</span>
kubectl get peerauthentication -A

<span class="hljs-comment"># 3. DestinationRule TLS 설정 확인</span>
kubectl get destinationrule api-service -o yaml | grep tls

<span class="hljs-comment"># 4. Envoy Secret 확인 (인증서 갱신 실패?)</span>
istioctl proxy-config secret &lt;pod&gt; -o json | \
  jq <span class="hljs-string">&#x27;.dynamicActiveSecrets[] | select(.name | contains(&quot;default&quot;))&#x27;</span>
</code></pre>
</div>

<h2 id="client-ip-%EC%A0%91%EA%B7%BC-%EC%A0%9C%EC%96%B4-xff-%EC%8B%AC%ED%99%94">Client IP 접근 제어: XFF 심화</h2>
<p><strong>X-Forwarded-For 구조</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Client IP: 203.0.113.5
CloudFront: 198.51.100.10
ALB: 10.0.1.20
Istio Gateway: 10.0.2.30

X-Forwarded-For: 203.0.113.5, 198.51.100.10, 10.0.1.20
                 ^^^^^^^^^^^^  (실제 Client IP)
</code></pre>
<p><strong>xff_num_trusted_hops 계산</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>CloudFront (1) + ALB (1) = 2 hops

XFF 헤더에서 뒤에서 2번째 = 실제 Client IP
</code></pre>

<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">workloadSelector:</span>
    <span class="hljs-attr">labels:</span>
      <span class="hljs-attr">istio:</span> <span class="hljs-string">ingressgateway</span>
  <span class="hljs-attr">configPatches:</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">applyTo:</span> <span class="hljs-string">NETWORK_FILTER</span>
    <span class="hljs-attr">match:</span>
      <span class="hljs-attr">context:</span> <span class="hljs-string">GATEWAY</span>
      <span class="hljs-attr">listener:</span>
        <span class="hljs-attr">filterChain:</span>
          <span class="hljs-attr">filter:</span>
            <span class="hljs-attr">name:</span> <span class="hljs-string">&quot;envoy.filters.network.http_connection_manager&quot;</span>
    <span class="hljs-attr">patch:</span>
      <span class="hljs-attr">operation:</span> <span class="hljs-string">MERGE</span>
      <span class="hljs-attr">value:</span>
        <span class="hljs-attr">typed_config:</span>
          <span class="hljs-attr">&quot;@type&quot;:</span> <span class="hljs-string">type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager</span>
          <span class="hljs-attr">use_remote_address:</span> <span class="hljs-literal">true</span>

<h2 id="envoyfilter-http-filter-chain-%EC%9D%B4%ED%95%B4">EnvoyFilter: HTTP Filter Chain 이해</h2>
<div class="columns">
<div>
<p><strong>Envoy HTTP Filter 순서</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. envoy.filters.http.jwt_authn
   → JWT 토큰 검증

2. envoy.filters.http.ext_authz
   → 외부 인증 서버

3. envoy.filters.http.cors
   → CORS 처리

4. envoy.filters.http.local_ratelimit
   → Rate Limiting (여기에 삽입 예제)

5. envoy.filters.http.router
   → 최종 라우팅 (항상 마지막)
</code></pre>
</div>
<div>
<p><strong>INSERT_BEFORE vs INSERT_AFTER</strong>:</p>
<div class="small">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># JWT 검증 전에 Filter 삽입</span>
<span class="hljs-attr">operation:</span> <span class="hljs-string">INSERT_BEFORE</span>
<span class="hljs-attr">match:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">&quot;envoy.filters.http.jwt_authn&quot;</span>

<span class="hljs-comment"># JWT 검증 후에 Filter 삽입</span>
<span class="hljs-attr">operation:</span> <span class="hljs-string">INSERT_AFTER</span>
<span class="hljs-attr">match:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">&quot;envoy.filters.http.jwt_authn&quot;</span>
</code></pre>
</div>
<p><strong>순서가 중요한 이유</strong>:</p>
<ul>
<li>JWT 검증 전 → Rate Limit 먼저 (DoS 방어)</li>
<li>JWT 검증 후 → 인증된 사용자만 제한</li>
</ul>

<h2 id="rate-limiting-token-bucket-%EC%95%8C%EA%B3%A0%EB%A6%AC%EC%A6%98">Rate Limiting: Token Bucket 알고리즘</h2>
<p><strong>동작 원리</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Token Bucket:
- Capacity: 100 tokens (max_tokens)
- Refill Rate: 10 tokens/sec (tokens_per_fill)
- Fill Interval: 1s (fill_interval)
요청 처리:
1. Token 1개 소비
2. Token 부족 → 429 Too Many Requests
3. 1초마다 10개 Token 추가 (최대 100개)
</code></pre>
<p><strong>Burst 트래픽 허용</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>평소: 10 RPS
순간: 100 RPS (Burst) → Token을 모두 소진
이후: 10 RPS로 제한 (Token 재충전 중)
</code></pre>
<footer><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4da.svg" data-marp-twemoji=""/> <a href="https://atomoh.gitbook.io/kubernetes-docs/tools-and-integrations/istio/resilience/02-rate-limiting">https://atomoh.gitbook.io/kubernetes-docs/tools-and-integrations/istio/resilience/02-rate-limiting</a></footer>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">apiVersion:</span> <span class="hljs-string">networking.istio.io/v1alpha3</span>

<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">user-tiered-ratelimit</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">workloadSelector:</span>
    <span class="hljs-attr">labels:</span>
      <span class="hljs-attr">app:</span> <span class="hljs-string">api-service</span>
  <span class="hljs-attr">configPatches:</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">applyTo:</span> <span class="hljs-string">HTTP_FILTER</span>
    <span class="hljs-attr">match:</span>
      <span class="hljs-attr">context:</span> <span class="hljs-string">SIDECAR_INBOUND</span>
      <span class="hljs-attr">listener:</span>
        <span class="hljs-attr">filterChain:</span>
          <span class="hljs-attr">filter:</span>
            <span class="hljs-attr">name:</span> <span class="hljs-string">&quot;envoy.filters.network.http_connection_manager&quot;</span>
            <span class="hljs-attr">subFilter:</span>
              <span class="hljs-attr">name:</span> <span class="hljs-string">&quot;envoy.filters.http.router&quot;</span>
    <span class="hljs-attr">patch:</span>
      <span class="hljs-attr">operation:</span> <span class="hljs-string">INSERT_BEFORE</span>
      <span class="hljs-attr">value:</span>
        <span class="hljs-attr">name:</span> <span class="hljs-string">envoy.filters.http.local_ratelimit</span>
        <span class="hljs-attr">typed_config:</span>
          <span class="hljs-attr">&quot;@type&quot;:</span> <span class="hljs-string">type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit</span>
          <span class="hljs-attr">stat_prefix:</span> <span class="hljs-string">http_local_rate_limiter</span>
          <span class="hljs-comment"># 사용자 tier에 따른 Rate Limit</span>
          <span class="hljs-attr">token_bucket:</span>
            <span class="hljs-attr">max_tokens:</span> <span class="hljs-number">10</span>
            <span class="hljs-attr">tokens_per_fill:</span> <span class="hljs-number">10</span>

<h2 id="%EA%B8%80%EB%A1%9C%EB%B2%8C-rate-limiting-envoyfilter-%EA%B8%B0%EB%B0%98">글로벌 Rate Limiting: EnvoyFilter 기반</h2>
<div class="columns">
<div>
<p><strong>아키텍처</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Envoy Sidecar (각 Pod)
  → local_ratelimit Filter
     (EnvoyFilter로 구성)
  → Token Bucket 알고리즘
  → 설정 기반 제한
     (별도 서비스 불필요)
</code></pre>
<p><strong>특징</strong>:</p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Redis 불필요</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> 간단한 구성</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> 대부분의 사용 사례에 충분</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Pod별 독립적 제한</li>
</ul>
</div>
<div>
<div class="tiny">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># EnvoyFilter로 구성</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">networking.istio.io/v1alpha3</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">EnvoyFilter</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">filter-ratelimit</span>
  <span class="hljs-attr">namespace:</span> <span class="hljs-string">istio-system</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">workloadSelector:</span>
    <span class="hljs-attr">labels:</span>
      <span class="hljs-attr">app:</span> <span class="hljs-string">productpage</span>
  <span class="hljs-attr">configPatches:</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">applyTo:</span> <span class="hljs-string">HTTP_FILTER</span>
    <span class="hljs-attr">match:</span>
      <span class="hljs-attr">context:</span> <span class="hljs-string">SIDECAR_INBOUND</span>
      <span class="hljs-attr">listener:</span>
        <span class="hljs-attr">filterChain:</span>
          <span class="hljs-attr">filter:</span>
            <span class="hljs-attr">name:</span> <span class="hljs-string">&quot;envoy.filters.network.http_connection_manager&quot;</span>
            <span class="hljs-attr">subFilter:</span>
              <span class="hljs-attr">name:</span> <span class="hljs-string">&quot;envoy.filters.http.router&quot;</span>
    <span class="hljs-attr">patch:</span>
      <span class="hljs-attr">operation:</span> <span class="hljs-string">INSERT_BEFORE</span>
      <span class="hljs-attr">value:</span>
        <span class="hljs-attr">name:</span> <span class="hljs-string">envoy.filters.http.local_ratelimit</span>
        <span class="hljs-attr">typed_config:</span>
          <span class="hljs-attr">&quot;@type&quot;:</span> <span class="hljs-string">type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit</span>
          <span class="hljs-attr">stat_prefix:</span> <span class="hljs-string">http_local_rate_limiter</span>
          <span class="hljs-attr">token_bucket:</span>
            <span class="hljs-attr">max_tokens:</span> <span class="hljs-number">10000</span>
            <span class="hljs-attr">tokens_per_fill:</span> <span class="hljs-number">10000</span>
            <span class="hljs-attr">fill_interval:</span> <span class="hljs-string">1s</span>
</code></pre>
</div>
</div>
</div>

<h2 id="%EA%B3%A0%EA%B8%89-%EC%99%B8%EB%B6%80-rate-limit-service-%EC%84%A0%ED%83%9D%EC%A0%81">고급: 외부 Rate Limit Service (선택적)</h2>
<p><strong>Redis 기반 분산 Rate Limiting (선택적)</strong>:</p>
<div class="tiny">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># 고급 사용 사례: 정확한 분산 카운팅이 필요한 경우</span>
<span class="hljs-comment"># 외부 Rate Limit Service (Lyft/ratelimit) + Redis 사용 가능</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">networking.istio.io/v1alpha3</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">EnvoyFilter</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">filter-ratelimit-svc</span>
  <span class="hljs-attr">namespace:</span> <span class="hljs-string">istio-system</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">workloadSelector:</span>
    <span class="hljs-attr">labels:</span>
      <span class="hljs-attr">app:</span> <span class="hljs-string">productpage</span>
  <span class="hljs-attr">configPatches:</span>
  <span class="hljs-bullet">-</span> <span class="hljs-attr">applyTo:</span> <span class="hljs-string">HTTP_FILTER</span>
    <span class="hljs-attr">match:</span>
      <span class="hljs-attr">context:</span> <span class="hljs-string">SIDECAR_INBOUND</span>
      <span class="hljs-attr">listener:</span>
        <span class="hljs-attr">filterChain:</span>
          <span class="hljs-attr">filter:</span>
            <span class="hljs-attr">name:</span> <span class="hljs-string">&quot;envoy.filters.network.http_connection_manager&quot;</span>
            <span class="hljs-attr">subFilter:</span>
              <span class="hljs-attr">name:</span> <span class="hljs-string">&quot;envoy.filters.http.router&quot;</span>
    <span class="hljs-attr">patch:</span>
      <span class="hljs-attr">operation:</span> <span class="hljs-string">INSERT_BEFORE</span>
      <span class="hljs-attr">value:</span>
        <span class="hljs-attr">name:</span> <span class="hljs-string">envoy.filters.http.ratelimit</span>
        <span class="hljs-attr">typed_config:</span>
          <span class="hljs-attr">&quot;@type&quot;:</span> <span class="hljs-string">type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit</span>
          <span class="hljs-attr">domain:</span> <span class="hljs-string">productpage-ratelimit</span>
          <span class="hljs-attr">failure_mode_deny:</span> <span class="hljs-literal">true</span>
          <span class="hljs-attr">rate_limit_service:</span>
            <span class="hljs-attr">grpc_service:</span>
              <span class="hljs-attr">envoy_grpc:</span>
                <span class="hljs-attr">cluster_name:</span> <span class="hljs-string">rate_limit_cluster</span>
            <span class="hljs-attr">transport_api_version:</span> <span class="hljs-string">V3</span>

<span class="hljs-comment"># 참고: 대부분의 경우 Local Rate Limiting으로 충분</span>
<span class="hljs-comment"># 외부 서비스는 정밀한 분산 제어가 필요한 경우에만 사용</span>

                <span class="hljs-keyword">local</span> client_ip = xff:<span class="hljs-built_in">match</span>(<span class="hljs-string">&quot;^([^,]+)&quot;</span>)

                <span class="hljs-keyword">end</span>
              <span class="hljs-keyword">end</span>

              <span class="hljs-comment">-- Request Body 크기 제한</span>
              <span class="hljs-keyword">local</span> content_length = request_handle:headers():get(<span class="hljs-string">&quot;content-length&quot;</span>)
              <span class="hljs-keyword">if</span> content_length ~= <span class="hljs-literal">nil</span> <span class="hljs-keyword">and</span> <span class="hljs-built_in">tonumber</span>(content_length) &gt; <span class="hljs-number">1048576</span> <span class="hljs-keyword">then</span>

<h2 id="%EA%B3%84%EC%B8%B5%EB%B3%84-%EC%B1%85%EC%9E%84">계층별 책임</h2>
<div class="tiny">
<table>
<thead>
<tr>
<th>계층</th>
<th>구성 요소</th>
<th>역할</th>
<th>기술 세부사항</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Edge</strong></td>
<td>CloudFront</td>
<td>DDoS 방어, 캐싱</td>
<td>AWS Shield, WAF Rules, Origin Shield</td>
</tr>
<tr>
<td><strong>TLS Termination</strong></td>
<td>ALB</td>
<td>TLS 1.3, HTTP/2</td>
<td>SNI, ALPN, Connection Pooling (128 connections)</td>
</tr>
<tr>
<td><strong>Gateway</strong></td>
<td>Istio Gateway</td>
<td>XFF 처리, Rate Limit</td>
<td>Envoy Listener 15443, HTTP Filter Chain</td>
</tr>
<tr>
<td><strong>Service Mesh</strong></td>
<td>Envoy Sidecar</td>
<td>mTLS, Locality, Retry</td>
<td>xDS API, SDS, EDS Priority/Weight</td>
</tr>
<tr>
<td><strong>Control Plane</strong></td>
<td>istiod</td>
<td>Config Push, CA</td>
<td>5000 Pods = ~50MB memory, 0.5 CPU cores</td>
</tr>
<tr>
<td><strong>Observability</strong></td>
<td>Prometheus</td>
<td>Metrics 수집</td>
<td>15s scrape interval, 15d retention</td>
</tr>
<tr>
<td><strong>Deployment</strong></td>
<td>Argo Rollouts</td>
<td>Canary 자동화</td>
<td>Reconcile Loop 10s, Analysis 30s interval</td>
</tr>
<tr>
<td><strong>Scaling</strong></td>
<td>KEDA</td>
<td>Metric 기반 HPA</td>
<td>Polling 30s, Cool-down 300s</td>
</tr>
<tr>
<td><strong>Storage</strong></td>
<td>Redis</td>
<td>Global Rate Limit</td>
<td>Cluster mode, Persistence AOF</td>
</tr>
</tbody>
</table>
</div>

<div class="small">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">apiVersion:</span> <span class="hljs-string">networking.istio.io/v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">DestinationRule</span>

  <span class="hljs-attr">name:</span> <span class="hljs-string">high-performance</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">host:</span> <span class="hljs-string">api-service</span>
  <span class="hljs-attr">trafficPolicy:</span>
    <span class="hljs-attr">connectionPool:</span>
      <span class="hljs-attr">tcp:</span>
        <span class="hljs-attr">maxConnections:</span> <span class="hljs-number">1000</span>
        <span class="hljs-attr">connectTimeout:</span> <span class="hljs-string">3s</span>
        <span class="hljs-attr">tcpKeepalive:</span>
          <span class="hljs-attr">time:</span> <span class="hljs-string">7200s</span>
          <span class="hljs-attr">interval:</span> <span class="hljs-string">75s</span>
      <span class="hljs-attr">http:</span>

        <span class="hljs-attr">http2MaxRequests:</span> <span class="hljs-number">10000</span>
        <span class="hljs-attr">maxRequestsPerConnection:</span> <span class="hljs-number">100</span>
        <span class="hljs-attr">maxRetries:</span> <span class="hljs-number">3</span>
        <span class="hljs-attr">idleTimeout:</span> <span class="hljs-string">300s</span>

<h2 id="%EC%84%B1%EB%8A%A5-%ED%8A%9C%EB%8B%9D-outlier-detection">성능 튜닝: Outlier Detection</h2>
<div class="small">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">apiVersion:</span> <span class="hljs-string">networking.istio.io/v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">DestinationRule</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">circuit-breaker</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">host:</span> <span class="hljs-string">api-service</span>
  <span class="hljs-attr">trafficPolicy:</span>
    <span class="hljs-attr">outlierDetection:</span>
      <span class="hljs-attr">consecutive5xxErrors:</span> <span class="hljs-number">5</span>       <span class="hljs-comment"># 5번 연속 5xx → Eject</span>
      <span class="hljs-attr">interval:</span> <span class="hljs-string">30s</span>                 <span class="hljs-comment"># 30초마다 검사</span>
      <span class="hljs-attr">baseEjectionTime:</span> <span class="hljs-string">30s</span>         <span class="hljs-comment"># 30초간 Ejection</span>
      <span class="hljs-attr">maxEjectionPercent:</span> <span class="hljs-number">50</span>        <span class="hljs-comment"># 최대 50% Pod만 Eject</span>
      <span class="hljs-attr">minHealthPercent:</span> <span class="hljs-number">40</span>          <span class="hljs-comment"># 최소 40% Healthy 유지</span>

      <span class="hljs-comment"># Failure Percentage 기반 (추가)</span>
      <span class="hljs-attr">splitExternalLocalOriginErrors:</span> <span class="hljs-literal">true</span>
      <span class="hljs-attr">consecutiveLocalOriginFailure:</span> <span class="hljs-number">5</span>
      <span class="hljs-attr">consecutiveGatewayErrors:</span> <span class="hljs-number">3</span>
</code></pre>
</div>

<h2 id="roi-istio-%EB%8F%84%EC%9E%85-%ED%9A%A8%EA%B3%BC-%EC%83%81%EC%84%B8">ROI: Istio 도입 효과 (상세)</h2>
<div class="small">
<p><strong>비용 절감</strong> (연간 기준):</p>
<ul>
<li>Locality Routing: $288,000 (크로스 AZ 비용 80% 감소)</li>
<li>Spot Instance: $600,000 (인프라 비용 60% 감소)</li>
<li>KEDA Scaling: $120,000 (유휴 리소스 35% 감소)</li>
<li><strong>총 절감</strong>: $1,008,000/년</li>
</ul>
<p><strong>운영 효율</strong> (150 Services 기준):</p>
<ul>
<li>Canary 자동화: 배포 시간 4시간 → 1시간 (75% 단축)</li>
<li>자동 롤백: MTTR 30분 → 5분 (83% 단축)</li>
<li>mTLS 자동화: 개발 시간 0 (12개 언어 × 2주 = 24주 절감)</li>
<li>Rate Limit 중앙화: 설정 관리 복잡도 60% 감소</li>
</ul>
</div>

<div class="nano">
<p><strong>환경</strong>:</p>

<li>Services: 150개, Pods: 2000+, Nodes: 50+</li>

<p><strong>Phase 1-3 결과</strong> (6개월):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Phase 1 (관찰성):
  - Istio 설치 (mTLS PERMISSIVE)

Phase 2 (보안):
  - mTLS STRICT 전환 (99.8% 적용률)
  - AuthorizationPolicy 50개 적용
  - Zero Trust 달성
Phase 3 (트래픽 관리):
  - Locality Routing: 크로스 AZ 비용 $50K → $10K
  - Argo Rollouts: 배포 실패율 15% → 2%

</tr>
<tr>

<td><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/></td>
<td><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/></td>

<h2 id="%EB%B9%84%EC%9A%A9--%EC%9A%B4%EC%98%81-%EB%B3%B5%EC%9E%A1%EB%8F%84-%EB%B9%84%EA%B5%90-%ED%98%84%EC%8B%A4">비용 &amp; 운영 복잡도 비교 (현실)</h2>
<div class="small">
<p><strong>100 파드 환경 기준 (연간 비용)</strong>:</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>Istio</th>
<th>VPC Lattice</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>인프라 비용</strong></td>
<td>$10,500/년</td>
<td>$2,508/년</td>
</tr>
<tr>
<td>- Sidecar 오버헤드</td>
<td>+60% 노드</td>
<td>0</td>
</tr>
<tr>
<td>- 관찰성 스택</td>
<td>Prometheus, Jaeger</td>
<td>CloudWatch (포함)</td>
</tr>
<tr>
<td><strong>운영 비용</strong></td>
<td>$39,000/년</td>
<td>$5,100/년</td>
</tr>
<tr>
<td>- 초기 설정</td>
<td>40시간</td>
<td>10시간</td>
</tr>
<tr>
<td>- 월간 운영</td>
<td>20시간</td>
<td>3시간</td>
</tr>
<tr>
<td>- 업그레이드</td>
<td>6-10시간 (분기)</td>
<td>자동 (0시간)</td>
</tr>
<tr>
<td>- 전문 인력</td>
<td>Service Mesh 전문가</td>
<td>일반 AWS 엔지니어</td>
</tr>
<tr>
<td><strong>총 비용</strong></td>
<td><strong>$49,500/년</strong></td>
<td><strong>$7,608/년</strong></td>
</tr>
<tr>
<td><strong>절감률</strong></td>
<td>-</td>
<td><strong>85% 저렴</strong></td>
</tr>
</tbody>
</table>
</div>
<p><strong>Istio의 숨겨진 비용</strong>: 전담 팀, 학습 곡선 (3-6개월), 장애 대응</p>

<h2 id="%ED%95%B5%EC%8B%AC-%EC%A0%95%EB%A6%AC">핵심 정리</h2>
<p><strong>Istio 핵심 가치</strong>:</p>
<ol>
<li><strong>xDS 프로토콜</strong>: 동적 설정 배포 (&lt; 100ms)</li>
<li><strong>Envoy Proxy</strong>: L7 고급 기능 (Retry, Circuit Breaker, Rate Limit)</li>
<li><strong>SPIFFE/SPIRE</strong>: 자동 mTLS (코드 수정 0)</li>
<li><strong>Argo Rollouts</strong>: Metric 기반 자동 Canary</li>
<li><strong>Locality LB</strong>: Priority/Weight 기반 비용 최적화</li>
</ol>
<p><strong>프로덕션 필수 설정</strong>:</p>
<ul>
<li>Connection Pool, Outlier Detection</li>
<li>mTLS STRICT, AuthorizationPolicy</li>
<li>Locality Routing, Failover</li>
<li>KEDA Scaling, Spot Instance Affinity</li>
<li></li>
</ul>
