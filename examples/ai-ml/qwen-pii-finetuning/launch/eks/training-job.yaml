apiVersion: batch/v1
kind: Job
metadata:
  name: qwen-pii-${MODE}
  namespace: qwen-pii
  labels:
    app: qwen-pii-training
    experiment-id: ${EXPERIMENT_ID}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  template:
    metadata:
      labels:
        app: qwen-pii-training
        experiment-id: ${EXPERIMENT_ID}
    spec:
      restartPolicy: Never
      serviceAccountName: qwen-input-reader
      nodeSelector:
        workload: qwen-pii-training
      containers:
        - name: trainer
          image: 763104351884.dkr.ecr.ap-northeast-2.amazonaws.com/pytorch-training:2.8.0-gpu-py312-cu129-ubuntu22.04-sagemaker
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              mkdir -p /workspace/data /workspace/output /workspace/hf-cache
              python3 /opt/qwen/bootstrap/download_inputs.py \
                --bucket "$QWEN_INPUT_BUCKET" \
                --prefix "$QWEN_INPUT_PREFIX" \
                --account-id "$QWEN_EXPECTED_ACCOUNT_ID" \
                --manifest /opt/qwen/bootstrap/input-manifest.json \
                --output-dir /workspace
              tar -xzf /workspace/source.tar.gz -C /workspace
              python3 -m pip install --no-cache-dir -r /workspace/requirements.lock
              cd /workspace
              python3 -m src.train \
                --config /workspace/config/experiment.yaml \
                --train-jsonl /workspace/data/train.jsonl \
                --validation-jsonl /workspace/data/validation.jsonl \
                --test-jsonl /workspace/data/test.jsonl \
                --dataset-manifest /workspace/data/dataset-manifest.json \
                --output-dir /workspace/output \
                --steps "${STEPS}" \
                --environment eks \
                --mode "${MODE}" \
                --evaluation-batch-size 4
          env:
            - name: QWEN_INPUT_BUCKET
              value: "${BUCKET_NAME}"
            - name: QWEN_INPUT_PREFIX
              value: "qwen-pii/${BASE_EXPERIMENT_ID}"
            - name: QWEN_EXPECTED_ACCOUNT_ID
              value: "${ACCOUNT_ID}"
            - name: QWEN_EXPERIMENT_ID
              value: "${BASE_EXPERIMENT_ID}"
            - name: QWEN_CLUSTER_NAME
              value: "${EXPERIMENT_ID}"
            - name: QWEN_EXECUTION_ID
              value: "${EXECUTION_ID}"
            - name: AWS_DEFAULT_REGION
              value: ap-northeast-2
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.qwen-pii.svc.cluster.local:5000
            - name: MLFLOW_EXPERIMENT_NAME
              value: qwen-pii-finetuning
            - name: RUN_ENVIRONMENT
              value: eks
            - name: HF_HOME
              value: /workspace/hf-cache
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "14"
              memory: 58Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: input-bootstrap
              mountPath: /opt/qwen/bootstrap
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: input-bootstrap
          configMap:
            name: qwen-pii-input-loader
            defaultMode: 0444
        - name: workspace
          emptyDir:
            sizeLimit: 280Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
