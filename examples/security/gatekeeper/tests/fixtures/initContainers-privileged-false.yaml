apiVersion: v1
kind: Pod
metadata:
  name: case
  namespace: policy-lab
  labels:
    app.kubernetes.io/name: demo
spec:
  containers:
  - name: app
    image: registry.example.com/team/app:v1
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
  initContainers:
  - name: subject
    image: registry.example.com/team/app:v1
    securityContext:
      privileged: false
