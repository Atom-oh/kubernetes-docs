apiVersion: v1
kind: Pod
metadata:
  name: case
  namespace: policy-lab
  labels:
    app.kubernetes.io/name: demo
    skip-privileged-check: 'true'
spec:
  containers:
  - name: app
    image: registry.example.com/team/app:v1
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
    securityContext:
      privileged: true
