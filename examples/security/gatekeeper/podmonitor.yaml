apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gatekeeper
  namespace: gatekeeper-system
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
    - gatekeeper-system
  selector:
    matchLabels:
      app.kubernetes.io/name: gatekeeper
      app.kubernetes.io/instance: gatekeeper
    matchExpressions:
    - key: control-plane
      operator: In
      values:
      - controller-manager
      - audit-controller
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 30s
