global:
  spire:
    trustDomain: example.org
    clusterName: documentation
    caSubject:
      organization: Documentation Lab
      country: KR
    namespaces:
      server:
        name: spire-system
      system:
        name: spire-system
  installAndUpgradeHooks:
    enabled: false
  deleteHooks:
    enabled: false
spire-server:
  replicaCount: 3
  controllerManager:
    enabled: true
    identities:
      clusterSPIFFEIDs:
        default:
          enabled: false
        oidc-discovery-provider:
          enabled: false
        test-keys:
          enabled: false
  externalControllerManagers:
    enabled: false
  persistence:
    enabled: true
    size: 1Gi
  dataStore:
    sql:
      databaseType: postgres
      host: postgres.pki.example.org
      databaseName: spire
      username: spire
      options:
      - sslmode: verify-full
      rootCAPath: /run/spire/db-ca/ca.crt
      # Omit password from the rendered DSN: SPIRE -expandEnv is not JSON escaping.
      password: ""
      externalSecret:
        enabled: false
  extraEnv:
  - name: PGPASSWORD
    valueFrom:
      secretKeyRef:
        name: spire-database
        key: password
  extraVolumes:
  - name: database-ca
    configMap:
      name: spire-database-ca
  extraVolumeMounts:
  - name: database-ca
    mountPath: /run/spire/db-ca
    readOnly: true
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: spire
        topologyKey: kubernetes.io/hostname
spire-agent:
  workloadAttestors:
    k8s:
      verification:
        type: apiServerCA
    unix:
      enabled: true
spiffe-oidc-discovery-provider:
  enabled: false
spiffe-csi-driver:
  enabled: true
