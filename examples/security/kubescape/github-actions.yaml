name: Kubernetes manifest security
on:
  pull_request:
    paths:
      - 'k8s/**'
      - 'examples/security/kubescape/**'
      - '.github/workflows/kubescape.yaml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Kubescape
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kubescape-bin"
          archive="$RUNNER_TEMP/kubescape.tgz"
          curl --fail --location --retry 3 \
            https://github.com/kubescape/kubescape/releases/download/v4.0.14/kubescape_4.0.14_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '1d253b70f88e80b74f68af73ccd422f897381468300be7cc486fdd656d907a40' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/kubescape-bin" kubescape
          echo "KUBESCAPE_BIN=$RUNNER_TEMP/kubescape-bin/kubescape" >> "$GITHUB_ENV"
      - name: Validate and scan local manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          # The project supplies this rendered file; a missing file fails the job.
          bash examples/security/kubescape/scan-manifests.sh k8s/rendered.yaml reports/kubescape.json
      - name: Preserve report when available
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubescape-report
          path: reports/kubescape.json
          if-no-files-found: warn
          retention-days: 7
