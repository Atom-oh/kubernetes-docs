apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: public-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: pki-admin@example.com
    privateKeySecretRef:
      name: public-staging-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: public-http
                namespace: gateway-system
                kind: Gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-http
  namespace: gateway-system
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              cert-manager-http01: enabled
