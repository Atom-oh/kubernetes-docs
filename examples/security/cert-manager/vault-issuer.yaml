apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-issuer
  namespace: demo-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-vault-token
  namespace: demo-app
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [vault-issuer]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-vault-token
  namespace: demo-app
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
roleRef:
  kind: Role
  name: cert-manager-vault-token
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-pki
  namespace: demo-app
spec:
  vault:
    server: https://vault.example.com
    path: pki/sign/example-role
    caBundleSecretRef:
      name: vault-server-ca
      key: ca.crt
    auth:
      kubernetes:
        role: cert-manager-demo-app
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: vault-issuer
