groups:
- name: node-alerts
  rules:
  - alert: HighCPUUsage
    expr: 100 * (1 - avg by (cluster, instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))
      > 80
    for: 5m
    labels:
      severity: warning
      team: sre
    annotations:
      summary: High CPU usage detected
      description: CPU usage is above 80% for 5 minutes on {{ $labels.instance }}
- name: disk-alerts
  rules:
  - alert: DiskSpaceCritical
    expr: "(100 * node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\"}\n\
      \  / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\"} < 5)\nand\
      \ node_filesystem_readonly == 0\nand node_filesystem_size_bytes > 0\n"
    for: 5m
    labels:
      severity: critical
      team: sre
    annotations:
      summary: Disk space critical
  - alert: DiskSpaceWarning
    expr: "(100 * node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\"}\n\
      \  / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\"} < 20)\n\
      and node_filesystem_readonly == 0\nand node_filesystem_size_bytes > 0\n"
    for: 10m
    labels:
      severity: warning
      team: sre
    annotations:
      summary: Disk space low
- name: eks-cluster
  rules:
  - alert: EKSAPIServerScrapeFailed
    expr: up{job="kubernetes-apiservers"} == 0
    for: 1m
    labels:
      severity: critical
      team: sre
    annotations:
      summary: Prometheus cannot scrape the configured API server target
  - alert: EKSAPIServerTargetMissing
    expr: absent(up{job="kubernetes-apiservers"})
    for: 5m
    labels:
      severity: warning
      team: sre
    annotations:
      summary: No API server target series in this Prometheus
  - alert: EKSNodeNotReady
    expr: kube_node_status_condition{condition="Ready",status="true"} == 0
    for: 5m
    labels:
      severity: critical
      team: sre
    annotations:
      summary: Node {{ $labels.node }} is not ready
  - alert: EKSClusterAutoscalerRecentErrors
    expr: increase(cluster_autoscaler_errors_total[10m]) > 0
    for: 5m
    labels:
      severity: warning
      team: sre
    annotations:
      summary: Cluster Autoscaler recorded failed loops in the last 10 minutes
- name: eks-workloads
  rules:
  - alert: PodCrashLooping
    expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
    for: 5m
    labels:
      severity: warning
      team: app
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is waiting in CrashLoopBackOff
  - alert: PodFrequentRestarts
    expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
    for: 5m
    labels:
      severity: warning
      team: app
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} has frequent restarts
  - alert: PodNotReady
    expr: '(kube_pod_status_ready{condition="true"} == 0)

      and on (namespace, pod, uid)

      (kube_pod_status_phase{phase=~"Pending|Running|Unknown"} == 1)

      '
    for: 15m
    labels:
      severity: warning
      team: app
    annotations:
      summary: Active pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready
  - alert: DeploymentReplicasMismatch
    expr: "kube_deployment_spec_replicas\n  > on (namespace, deployment) kube_deployment_status_replicas_available\n"
    for: 10m
    labels:
      severity: warning
      team: app
    annotations:
      summary: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has fewer
        available replicas than desired
- name: eks-resources
  rules:
  - alert: ContainerCPUThrottling
    expr: "(\n  sum by (namespace, pod, container) (\n    rate(container_cpu_cfs_throttled_periods_total{container!=\"\
      \",container!=\"POD\"}[5m]))\n  / sum by (namespace, pod, container) (\n   \
      \ rate(container_cpu_cfs_periods_total{container!=\"\",container!=\"POD\"}[5m]))\n\
      ) > 0.25\nand sum by (namespace, pod, container) (\n  rate(container_cpu_cfs_periods_total{container!=\"\
      \",container!=\"POD\"}[5m])) > 0\n"
    for: 5m
    labels:
      severity: warning
      team: app
    annotations:
      summary: More than 25% of CFS periods throttled for {{ $labels.pod }}/{{ $labels.container
        }}
  - alert: ContainerMemoryNearLimit
    expr: "(\n  container_memory_working_set_bytes{container!=\"\",container!=\"POD\"\
      }\n  / container_spec_memory_limit_bytes{container!=\"\",container!=\"POD\"\
      }\n) > 0.9\nand container_spec_memory_limit_bytes{container!=\"\",container!=\"\
      POD\"} > 0\n"
    for: 5m
    labels:
      severity: warning
      team: app
    annotations:
      summary: Container {{ $labels.pod }}/{{ $labels.container }} memory is near
        its reported limit
  - alert: PVCAlmostFull
    expr: '(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes
      > 0.85)

      and kubelet_volume_stats_capacity_bytes > 0

      '
    for: 5m
    labels:
      severity: warning
      team: sre
    annotations:
      summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is
        almost full
