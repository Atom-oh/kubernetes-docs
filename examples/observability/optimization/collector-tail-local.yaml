receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:14318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  attributes/redact:
    actions:
    - key: sensitive_data
      action: delete
  tail_sampling:
    decision_wait: 2s
    num_traces: 1000
    maximum_trace_size_bytes: 1048576
    policies:
    - name: errors
      type: status_code
      status_code:
        status_codes:
        - ERROR
    - name: slow
      type: latency
      latency:
        threshold_ms: 1000
    - name: baseline
      type: probabilistic
      probabilistic:
        sampling_percentage: 10
  batch:
    timeout: 1s
    send_batch_size: 256
exporters:
  otlp_http/sink:
    endpoint: ${env:OTLP_TEST_SINK}
    compression: none
service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - attributes/redact
      - tail_sampling
      - batch
      exporters:
      - otlp_http/sink
