# Prerequisites: AWS ASCP + Secrets Store CSI driver, IRSA, existing secret and namespace.
# Apply separately before the Grafana release; do not enable Kubernetes Secret syncing.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: metrics-grafana-admin
  namespace: monitoring
spec:
  provider: aws
  parameters:
    region: ap-northeast-2
    usePodIdentity: "false"
    objects: |
      - objectName: "observability/grafana-admin"
        objectType: "secretsmanager"
        jmesPath:
          - path: '"admin-password"'
            objectAlias: "admin-password"
            filePermission: "0440"
