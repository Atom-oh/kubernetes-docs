<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', 'Segoe UI', sans-serif">
<title id="t">Edge to origin: a VPC origin and an internal ALB</title><desc id="d">A viewer sends GET /menu.json over HTTPS. It is a cacheable GET, but it misses at both the edge POP and the regional edge cache, so CloudFront requests it from the origin. The origin connection goes through a VPC origin: a service-managed ENI that CloudFront created in a private subnet (for example 10.0.11.25) connects to an internal ALB (10.0.12.40). The ALB security group admits only traffic from CloudFront-VPCOrigins-Service-SG (or the CloudFront origin-facing managed prefix list), and the ALB listener forwards to the target group. Then an internet client tries to reach the ALB directly. The nodes of an internal ALB have private addresses only, so nothing on the internet routes to them and the attempt fails at the VPC boundary. There is no internet-facing load balancer and no inbound rule that admits a public CIDR.</desc>
