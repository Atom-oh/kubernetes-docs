<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', 'Segoe UI', sans-serif">
<title id="t">Edge security: Shield absorbs, WAF filters, the origin stays private</title><desc id="d">A botnet sends an L3/L4 flood (UDP reflection, SYN flood) at the CloudFront edge. Shield mitigations at the edge pass only traffic that is valid for web applications, so the flood is absorbed there and does not reach the origin. Next, a bot floods /login with well-formed HTTPS requests. They pass the L3/L4 layer, but a rate-based rule in the WAF web ACL (example name rate-login) matches, and the request is blocked with 403. Finally, a legitimate GET passes Shield; no WAF rule terminates its evaluation, so the web ACL default action (Allow) applies. CloudFront reaches the origin through a VPC origin: a service-managed ENI in a private subnet (for example 10.0.11.25) connects to an internal ALB (10.0.12.40) whose security group admits only CloudFront-VPCOrigins-Service-SG. The ALB, created from an Ingress with scheme internal, forwards to a Pod IP target (10.0.13.31); the Pod's NetworkPolicy admits only the ALB subnet, and the response is 200. There is no internet-facing load balancer and no inbound rule that admits a public CIDR.</desc>
