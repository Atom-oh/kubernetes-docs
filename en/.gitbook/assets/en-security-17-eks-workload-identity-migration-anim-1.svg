<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', 'Segoe UI', sans-serif">
<title id="t">IRSA: trading the projected token for IRSA role credentials at STS</title><desc id="d">A Pod is created with a ServiceAccount annotated eks.amazonaws.com/role-arn. The EKS Pod Identity webhook (mutating admission) injects the env vars AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE and a projected ServiceAccount token volume at /var/run/secrets/eks.amazonaws.com/serviceaccount/token. kubelet issues and refreshes the token; its audience is sts.amazonaws.com, its issuer is the cluster OIDC issuer, and its sub is system:serviceaccount:&lt;namespace&gt;:&lt;serviceaccount&gt;. The SDK sends the token, carrying aud and sub, to regional AWS STS AssumeRoleWithWebIdentity. STS validates the token signature against the cluster OIDC issuer keys through the IAM OIDC provider registered in the account, then checks the aud and sub conditions in the role trust policy. Temporary credentials for the IRSA role return to the SDK.</desc>
