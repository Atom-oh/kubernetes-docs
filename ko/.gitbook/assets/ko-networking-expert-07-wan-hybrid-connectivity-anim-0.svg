<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', 'Segoe UI', sans-serif">
<title id="t">하이브리드 장애 조치: DX가 끊기면 패킷이 VPN으로 우회한다</title><desc id="d">온프레미스 라우터(AS 65010, 10.10.0.0/16)는 VPC 10.20.0.0/16으로 가는 BGP 경로를 두 개 배운다. LOCAL_PREF 200인 Direct Connect 경로를 골라 첫 패킷을 DX 연결의 802.1Q VLAN 101(transit VIF)로 보낸다. 패킷은 DX 로케이션을 지나 목적지가 그대로인 채 Transit Gateway에 도착하고, TGW 라우트 테이블에 따라 VPC attachment로 전달된다. DX 게이트웨이는 BGP 경로만 반사하며 데이터 경로에 있지 않다. 이어서 DX 링크가 끊긴다. BFD가 300 ms 간격으로 3번 응답을 받지 못하면 BGP 세션이 내려가고 DX 경로가 양쪽에서 철회된다. 다음 패킷은 LOCAL_PREF 100인 VPN 경로를 탄다. IPsec이 ESP와 바깥 IP 헤더 203.0.113.10 → 198.51.100.10을 붙여 인터넷을 지나고, TGW의 VPN attachment에서 복호화되어 VPC에 도착한다. 돌아오는 트래픽도 DX 경로가 사라졌으므로 VPN 전파 경로를 쓴다.</desc>
