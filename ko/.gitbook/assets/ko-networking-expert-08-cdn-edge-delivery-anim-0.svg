<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', 'Segoe UI', sans-serif">
<title id="t">CDN 캐시: 같은 객체를 두 번 요청하면 MISS 다음 HIT</title><desc id="d">클라이언트 A가 배포 이름을 조회하면 DNS가 지연이 가장 낮은 엣지 POP을 답한다. A가 GET /img/logo.png를 보내면 POP은 그 캐시 키의 객체가 없어 MISS이고 리전 엣지 캐시에 묻는다. 리전 엣지 캐시도 MISS이므로 VPC 오리진을 거쳐 internal ALB인 오리진에 요청한다. 오리진은 200과 Cache-Control: max-age=3600을 돌려주고, 응답이 돌아오는 길에 리전 엣지 캐시와 POP이 각각 사본을 저장한다. A는 x-cache: Miss from cloudfront를 받는다. 이어서 클라이언트 B가 같은 POP에 같은 객체를 요청하면 HIT이며, POP이 Age: 42와 x-cache: Hit from cloudfront로 바로 응답하고 오리진에는 요청이 가지 않는다.</desc>
