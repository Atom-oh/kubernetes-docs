<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', 'Segoe UI', sans-serif">
<title id="t">PAT: 두 내부 호스트가 공인 IP 하나를 나눠 쓰는 법</title><desc id="d">사설망 10.0.1.0/24의 Host-A(10.0.1.10)와 Host-B(10.0.1.20)가 둘 다 출발지 포트 50000으로 서버 198.51.100.20:443에 연결한다. NAT 장비는 Host-A의 첫 패킷을 보고 변환 테이블에 10.0.1.10:50000 → 203.0.113.10:30001 행을 만들고 출발지를 공인 주소로 바꾼다. Host-B의 패킷에는 같은 공인 IP의 다른 포트 30002를 배정해 10.0.1.20:50000 → 203.0.113.10:30002 행을 만든다. 서버의 응답은 목적지 203.0.113.10:30002로 돌아오고, NAT는 공인 포트로 테이블을 찾아 2행과 일치시킨 뒤 목적지를 10.0.1.20:50000으로 되돌려 Host-B에 전달한다.</desc>
