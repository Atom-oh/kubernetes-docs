<g opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.3286;0.3429;0.5429;0.5643;0.9143;0.9429;1" values="0;0;1;1;0.42;0.42;0;0"/><text class="cap" x="40" y="428">③ 라우터: 경로를 찾아 .20 인터페이스 선택 · TTL 64→63 · L2 헤더를 새로 쓴다 (IP 주소는 그대로)</text></g>
