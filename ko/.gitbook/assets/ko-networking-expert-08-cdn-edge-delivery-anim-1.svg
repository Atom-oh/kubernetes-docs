<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', 'Segoe UI', sans-serif">
<title id="t">엣지에서 오리진까지: VPC 오리진과 internal ALB</title><desc id="d">뷰어가 HTTPS로 GET /menu.json을 보낸다. 캐시할 수 있는 GET이지만 엣지 POP과 리전 엣지 캐시에서 모두 MISS이므로 CloudFront가 오리진에 요청한다. 오리진 연결은 VPC 오리진을 거친다. CloudFront가 프라이빗 서브넷에 만든 서비스 관리형 ENI(예: 10.0.11.25)가 internal ALB(10.0.12.40)에 연결한다. ALB 보안 그룹은 CloudFront-VPCOrigins-Service-SG(또는 CloudFront origin-facing 관리형 prefix list)에서 오는 트래픽만 허용하고, ALB 리스너가 대상 그룹으로 전달한다. 이어서 인터넷 클라이언트가 ALB에 직접 접속하려 한다. internal ALB의 노드는 프라이빗 주소만 가지므로 인터넷에서 그 주소로 가는 경로가 없고 시도는 VPC에 닿지 못한다. 이 그림에는 인터넷용 로드 밸런서도, 공개 CIDR을 허용하는 인바운드 규칙도 없다.</desc>
