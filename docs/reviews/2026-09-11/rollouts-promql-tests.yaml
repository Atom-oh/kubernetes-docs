rule_files: []
evaluation_interval: 1m
tests:
- name: en/success-rate/success-rate/healthy
  interval: 1m
  input_series:
  - &id001
    series: http_requests_total{service="test",namespace="test",rollouts_pod_template_hash="canary",status="200"}
    values: 0+60x10
  - &id002
    series: http_requests_total{service="baseline",namespace="test",rollouts_pod_template_hash="baseline",status="200"}
    values: 0+60x10
  - &id003
    series: http_request_duration_seconds_bucket{service="test",namespace="test",le="0.05"}
    values: 0+0x10
  - &id004
    series: http_request_duration_seconds_bucket{service="test",namespace="test",le="0.1"}
    values: 0+60x10
  - &id005
    series: http_request_duration_seconds_bucket{service="test",namespace="test",le="+Inf"}
    values: 0+60x10
  promql_expr_test:
  - expr: "(sum(rate(\n  http_requests_total{\n    service=\"test\",\n    status=~\"2..\"\n  }[5m]\n)) or vector(0)) /\nsum(rate(\n\
      \  http_requests_total{\n    service=\"test\"\n  }[5m]\n))\n"
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 1
- name: en/success-rate/success-rate/missing
  interval: 1m
  input_series: []
  promql_expr_test:
  - expr: "(sum(rate(\n  http_requests_total{\n    service=\"test\",\n    status=~\"2..\"\n  }[5m]\n)) or vector(0)) /\nsum(rate(\n\
      \  http_requests_total{\n    service=\"test\"\n  }[5m]\n))\n"
    eval_time: 5m
    exp_samples: []
- name: en/success-rate/success-rate/all-canary-5xx
  interval: 1m
  input_series: &id006
  - series: http_requests_total{service="test",namespace="test",rollouts_pod_template_hash="canary",status="500"}
    values: 0+60x10
  - series: http_requests_total{service="baseline",namespace="test",rollouts_pod_template_hash="baseline",status="200"}
    values: 0+60x10
  promql_expr_test:
  - expr: "(sum(rate(\n  http_requests_total{\n    service=\"test\",\n    status=~\"2..\"\n  }[5m]\n)) or vector(0)) /\nsum(rate(\n\
      \  http_requests_total{\n    service=\"test\"\n  }[5m]\n))\n"
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 0
- name: en/success-rate/success-rate/zero-traffic-is-nan
  interval: 1m
  input_series: &id007
  - series: http_requests_total{service="test",namespace="test",rollouts_pod_template_hash="canary",status="200"}
    values: 0+0x10
  - series: http_requests_total{service="baseline",namespace="test",rollouts_pod_template_hash="baseline",status="200"}
    values: 0+0x10
  promql_expr_test:
  - expr: "((sum(rate(\n  http_requests_total{\n    service=\"test\",\n    status=~\"2..\"\n  }[5m]\n)) or vector(0)) /\n\
      sum(rate(\n  http_requests_total{\n    service=\"test\"\n  }[5m]\n))\n) == bool ((sum(rate(\n  http_requests_total{\n\
      \    service=\"test\",\n    status=~\"2..\"\n  }[5m]\n)) or vector(0)) /\nsum(rate(\n  http_requests_total{\n    service=\"\
      test\"\n  }[5m]\n))\n)"
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 0
